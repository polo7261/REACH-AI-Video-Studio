{% extends "base.html" %}
{% set active = "docs" %}
{% block title %}技術文件{% endblock %}
{% block content %}
    <h1 data-i18n="docs.title">技術文件</h1>
    <div class="sub">檔案位於 <span class="mono">docs/</span>；此頁直接讀取。</div>
    <div class="grid two">
      <section class="card">
        <h3>文件目錄</h3>
        <div id="doclist" class="plist">
          {% for slug in slugs %}<div class="pitem" data-slug="{{ slug }}"><b>{{ slug }}</b></div>{% endfor %}
        </div>
      </section>
      <section class="card">
        <h3 id="doc-title">選擇左側文件</h3>
        <div class="md" id="doc-body"><div class="muted">尚未載入。</div></div>
      </section>
    </div>
{% endblock %}
{% block scripts %}<script src="{{ asset('docs.js') }}"></script>{% endblock %}
