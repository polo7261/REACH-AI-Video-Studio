{% extends "base.html" %}
{% set active = "api" %}
{% block title %}API 與網址{% endblock %}
{% block content %}
    <h1 data-i18n="api.title">API 與網址</h1>
    <div class="sub">
      各 Provider 的端點、模型與實測狀態（2026-11-21 探測）。金鑰一律遮蔽顯示，不會出現在此頁或日誌。
    </div>

    <section class="card">
      <h3>製作流程 × 模型對應 <span class="muted" style="font-weight:400;font-size:12px">（全域預設；專案內可另行覆寫）</span></h3>
      <div id="flow" class="flow">載入中…</div>
    </section>

    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="cloud">雲端</button>
      <button class="tab" data-tab="local">地端</button>
    </div>
    <div id="providers" class="grid three"></div>

    <details style="margin-top:22px">
      <summary class="muted" style="cursor:pointer">原始設定（遮蔽後）</summary>
      <pre class="doc mono" id="raw" style="margin-top:10px">載入中…</pre>
    </details>
{% endblock %}
{% block scripts %}<script src="/static/api.js"></script>{% endblock %}
