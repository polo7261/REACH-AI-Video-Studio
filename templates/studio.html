<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REACH AI · Vidio Studio</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="layout">
  <aside>
    <div class="brand">REACH AI<small>VIDIO STUDIO</small></div>
    <nav>
      <a href="/" class="active">▣ 影片工作室</a>
      <a href="/skills/">◆ Skill 庫</a>
      <a href="/api-page">⚙ API 與網址</a>
      <a href="/docs/">▤ 技術文件</a>
    </nav>
    <div style="margin-top:auto" class="muted mono">v0.3 · 127.0.0.1:35350</div>
  </aside>

  <main>
    <h1>影片工作室</h1>
    <div class="sub">一句話 → 分鏡 → 出圖 → 影片 → 配音；模型走阿里雲 / MiniMax / 火山方舟（另行配置）。</div>

    <div class="grid two">
      <section class="card">
        <h3>建立影片專案</h3>
        <label>專案名稱</label>
        <input type="text" id="f-title" placeholder="例：雨夜霓虹追蹤">
        <label>一句話故事（必要）</label>
        <textarea id="f-idea" placeholder="例：一名少女在雨夜的霓虹街道上追逐一枚飄走的紙鶴"></textarea>
        <div class="row">
          <div>
            <label>風格</label>
            <input type="text" id="f-style" value="電影感寫實">
          </div>
          <div>
            <label>片長（秒）</label>
            <input type="number" id="f-duration" value="24" min="6" max="180">
          </div>
        </div>
        <div class="row">
          <div>
            <label>比例</label>
            <select id="f-ratio">
              <option>16:9</option><option>9:16</option><option>1:1</option><option>4:3</option>
            </select>
          </div>
          <div>
            <label>角色鎖定（可留空）</label>
            <input type="text" id="f-character" placeholder="例：短髮少女、米色風衣">
          </div>
        </div>
        <label>場景鎖定（可留空）</label>
        <input type="text" id="f-location" placeholder="例：雨夜霓虹街道、積水反光">
        <div class="actions">
          <button id="btn-create">建立並產生分鏡</button>
          <span class="muted" style="align-self:center;font-size:12px">四鏡模板：建立／衝突／轉折／收束</span>
        </div>
      </section>

      <section class="card">
        <h3>專案</h3>
        <div id="projects" class="plist"><div class="muted">尚無專案</div></div>
      </section>
    </div>

    <section id="detail" style="display:none; margin-top:18px">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <h1 id="d-title" style="margin:0"></h1>
        <span class="chip" id="d-meta"></span>
        <span class="chip" id="d-status"></span>
        <span style="flex:1"></span>
        <button class="ghost small" id="btn-ai-script">AI 重寫分鏡</button>
      </div>
      <div id="timeline" class="timeline"></div>
      <section class="card" style="margin-top:12px">
        <h3>製作流程：① 角色 → ② 劇本／分鏡 → ③ 出圖 → ④ 影片</h3>
        <div class="grid two" style="gap:12px">
          <div>
            <label>新增角色：名稱</label>
            <input type="text" id="char-name" placeholder="例：夜市廚師">
            <label>角色描述（外觀／服裝／氣質）</label>
            <textarea id="char-desc" rows="3" placeholder="例：二十多歲韓系男子，短黑髮，深藍圍裙，白色短袖，神情專注"></textarea>
            <div class="actions"><button id="btn-char">生成角色設定圖</button>
              <button class="ghost" id="btn-script">② 生成劇本與分鏡</button></div>
            <div class="muted" style="font-size:12px;margin-top:6px">角色需按「確認」才能產生劇本（避免長相漂移）</div>
          </div>
          <div>
            <div id="cast" class="muted">尚無角色</div>
          </div>
        </div>
      </section>
      <div id="shots" class="shots" style="margin-top:12px"></div>

      <div class="grid two" style="margin-top:18px">
        <section class="card">
          <h3>旁白配音（MiniMax TTS）</h3>
          <textarea id="narration-text" placeholder="輸入旁白或留空（預設用故事描述）"></textarea>
          <div class="actions">
            <select id="tts-voice" style="max-width:200px">
              <option value="male-qn-qingse">male-qn-qingse</option>
              <option value="female-shaonv">female-shaonv</option>
              <option value="female-yujie">female-yujie</option>
              <option value="male-qn-jingying">male-qn-jingying</option>
            </select>
            <button id="btn-tts">生成配音</button>
          </div>
          <div id="tts-out" style="margin-top:10px"></div>
        </section>
        <section class="card">
          <h3>工作任務</h3>
          <div id="jobs" class="muted">—</div>
        </section>
        <section class="card">
          <h3>上傳素材（影片／圖片／音訊）</h3>
          <input type="file" id="upload-input" multiple accept=".mp4,.mov,.webm,.png,.jpg,.jpeg,.webp,.mp3,.wav,.m4a">
          <div class="actions"><button id="btn-upload">上傳到專案</button></div>
          <div id="uploads" class="muted" style="margin-top:10px">—</div>
        </section>
      </div>
    </section>
  </main>
</div>
<script src="/static/studio.js"></script>
</body>
</html>
