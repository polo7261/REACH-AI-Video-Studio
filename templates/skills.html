<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>LibTV Skills — REACH AI Vidio Studio</title>
<style>
:root{--bg:#111;--fg:#eee;--mut:#999;--acc:#4cc2dd;--card:#1b1b1b;--bd:#333}
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 -apple-system,'PingFang TC',sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;height:100vh}
nav{display:flex;gap:16px;padding:10px 16px;border-bottom:1px solid var(--bd);align-items:center}
nav a{color:var(--mut);text-decoration:none}
nav a.active{color:var(--fg);font-weight:600}
#wrap{flex:1;display:flex;min-height:0}
#side{width:340px;overflow-y:auto;border-right:1px solid var(--bd);padding:12px;flex-shrink:0}
#main{flex:1;overflow-y:auto;padding:24px 40px;max-width:900px}
input{width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);margin-bottom:8px;font-size:14px}
#langs{display:flex;gap:6px;margin-bottom:8px}
#langs button{flex:1;padding:6px 0;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--mut);cursor:pointer;font-size:13px}
#langs button.on{background:var(--acc);color:#111;border-color:var(--acc);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.it{display:flex;gap:10px;padding:8px;border-radius:10px;cursor:pointer;align-items:center}
.it:hover{background:var(--card)}
.it.on{background:var(--card);border-left:3px solid var(--acc)}
.it img{width:72px;height:44px;object-fit:cover;border-radius:6px;background:#333;flex-shrink:0}
.it .t{min-width:0}
.it b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it span{color:var(--mut);font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{color:var(--mut);font-size:12px;margin:4px 0 8px}
h1{font-size:20px;border-bottom:1px solid var(--bd);padding-bottom:8px}
h2{font-size:17px;margin-top:28px;color:var(--acc)}
h3{font-size:15px}
.desc{color:var(--mut);margin:8px 0 16px}
pre{background:var(--card);padding:12px;border-radius:8px;overflow-x:auto;font-size:12px}
.extra h2{color:#f7b83d}
.fmt{margin:12px 0;padding:8px 12px;background:var(--card);border-radius:8px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--mut);white-space:pre-wrap;display:none}
.fmt.open{display:block}
</style>
</head>
<body>
<nav>
  <a href="/">▣ 影片工作室</a>
  <a href="/skills/" class="active">◆ Skill 庫</a>
  <a href="/api-page">⚙ API 與網址</a>
  <a href="/docs/">▤ 技術文件</a>
</nav>
<div id="wrap">
  <div id="side">
    <input id="q" placeholder="搜尋 skill（名稱/描述/內文）…">
    <div id="langs">
      <button data-l="tc" class="on">繁體</button>
      <button data-l="sc">簡體</button>
      <button data-l="en">English</button>
    </div>
    <div class="cnt" id="cnt"></div>
    <div class="grid" id="list"></div>
  </div>
  <div id="main"><div class="desc">載入中…</div></div>
</div>
<script>
let DATA=[],cur=-1,LANG='tc';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function md(t){
  t=esc(t);
  t=t.replace(/```([\s\S]*?)```/g,(m,c)=>'<pre>'+c+'</pre>');
  t=t.replace(/^####\s?(.*)$/gm,'<h4>$1</h4>').replace(/^###\s?(.*)$/gm,'<h3>$1</h3>').replace(/^##\s?(.*)$/gm,'<h2>$1</h2>').replace(/^#\s?(.*)$/gm,'<h1>$1</h1>');
  t=t.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  t=t.replace(/^\s*[-*]\s(.*)$/gm,'• $1');
  t=t.replace(/\n/g,'<br>');
  return t;
}
function title(s){return LANG==='en'?s.slug:(LANG==='sc'?(s.cn_sc||s.cn):s.cn)}
function desc(s){return s.description[LANG]||s.description.tc}
async function show(i){
  cur=i;const s=DATA[i];
  const main=document.getElementById('main');
  main.innerHTML='<div class="desc">載入中…</div>';
  const r=await fetch('/api/skills/'+s.slug+'?lang='+LANG);
  const d=await r.json();
  let h='<h1>'+esc(title(s))+' <small style="color:var(--mut);font-size:12px">'+esc(s.slug)+' · v'+esc(s.version||'?')+' · '+s.bytes.toLocaleString()+' B</small></h1>';
  h+='<div class="desc">'+esc(desc(s))+'</div>';
  h+='<img src="/api/skills/'+s.slug+'/cover" style="width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-bottom:16px" onerror="this.style.display=\'none\'">';
  h+='<div class="fmt" id="fm">'+esc(d.frontmatter)+'</div><div style="margin:8px 0"><a href="javascript:void(0)" onclick="document.getElementById(\'fm\').classList.toggle(\'open\')" style="color:var(--mut);font-size:12px">顯示/隱藏 frontmatter</a></div>';
  h+='<div id="body">'+md(d.markdown)+'</div>';
  for(const e of (s.extras||[])){
    const er=await fetch('/api/skills/'+s.slug+'/'+e+'?lang='+LANG);
    const ed=await er.json();
    h+='<div class="extra"><h2>附屬檔：'+esc(e)+'</h2>'+md(ed.markdown)+'</div>';
  }
  main.innerHTML=h; main.scrollTop=0;
  document.querySelectorAll('.it').forEach((el,j)=>el.classList.toggle('on',j===i));
}
function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const list=document.getElementById('list');list.innerHTML='';
  let n=0;
  DATA.forEach((s,i)=>{
    const hay=(s.cn+' '+(s.cn_sc||'')+' '+s.slug+' '+s.description.tc+' '+s.description.en+' '+s.description.sc).toLowerCase();
    if(q&&!hay.includes(q))return;
    n++;
    const div=document.createElement('div');div.className='it'+(i===cur?' on':'');
    div.innerHTML='<img loading="lazy" src="/api/skills/'+s.slug+'/cover" onerror="this.style.visibility=\'hidden\'">'+
      '<div class="t"><b>'+esc(title(s))+'</b><span>'+esc(desc(s).slice(0,60))+'</span></div>';
    div.onclick=()=>show(i);
    list.appendChild(div);
  });
  document.getElementById('cnt').textContent=n+' / '+DATA.length+' skills';
}
document.getElementById('q').oninput=render;
document.querySelectorAll('#langs button').forEach(b=>b.onclick=()=>{
  LANG=b.dataset.l;
  document.querySelectorAll('#langs button').forEach(x=>x.classList.toggle('on',x===b));
  render(); if(cur>=0) show(cur);
});
fetch('/api/skills').then(r=>r.json()).then(d=>{DATA=d.skills;render();if(DATA.length)show(0);});
</script>
</body>
</html>
