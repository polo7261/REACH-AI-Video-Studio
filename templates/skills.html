{% extends "base.html" %}
{% set active = "skills" %}
{% set main_class = "full" %}
{% block title %}Skill 庫{% endblock %}
{% block content %}
<style>
.skp { height: calc(100vh - 64px); overflow-y: auto; }
.skp-in { max-width: 1320px; margin: 0 auto; padding: 36px 40px 64px; }
/* Hero */
.skp-hero { text-align: center; margin-bottom: 44px; }
.skp-hero h1 { font-family: "Noto Serif TC", "Songti TC", Georgia, serif; font-weight: 400; font-size: 30px; letter-spacing: .04em; margin: 0 0 22px; }
.skp-box { max-width: 880px; margin: 0 auto; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px 10px; transition: border-color .15s, box-shadow .15s; }
.skp-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--tint-accent); }
.skp-box textarea { width: 100%; min-height: 74px; resize: none; border: 0; outline: 0; background: transparent; color: var(--fg); font: inherit; font-size: 14.5px; line-height: 1.6; }
.skp-box-foot { display: flex; align-items: center; gap: 8px; }
.skp-pick { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 4px; border-radius: 999px; background: var(--tint-accent); border: 1px solid var(--tint-accent-line); font-size: 12.5px; color: var(--fg-soft); }
.skp-pick img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; background: var(--thumb); }
.skp-pick button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 14px; line-height: 1; padding: 0 2px; }
.skp-hint { color: var(--muted); font-size: 12px; }
.skp-send { margin-left: auto; width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent); cursor: pointer; padding: 0; line-height: 0; display: grid; place-items: center; flex-shrink: 0; }
.skp-send svg { display: block; }
.skp-send:disabled { background: var(--panel-2); color: var(--faint); cursor: default; }
/* Tabs + 分類 + 搜尋 */
.skp-tabs { display: flex; align-items: center; gap: 22px; margin-bottom: 14px; }
.skp-tabs .skp-search { margin-left: auto; }
.skp-tabs button { border: 0; background: none; padding: 0; font-size: 18px; font-weight: 600; color: var(--faint); cursor: pointer; }
.skp-tabs button.on { color: var(--fg); }
.skp-tabs em { font-style: normal; font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 4px; }
.skp-bar { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
.skp-cats { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; min-width: 0; }
.skp-cats::-webkit-scrollbar { display: none; }
.skp-cats button { flex-shrink: 0; white-space: nowrap; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; transition: .12s; }
.skp-cats button:hover { color: var(--fg); border-color: var(--line-hover); }
.skp-cats button.on { background: var(--panel-2); color: var(--fg); border-color: var(--line-hover); font-weight: 600; }
.skp-search { position: relative; width: 300px; flex-shrink: 0; }
.skp-search input { width: 100%; padding: 8px 34px 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font-size: 13px; outline: 0; }
.skp-search input:focus { border-color: var(--accent); }
.skp-search svg { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.skp-cnt { color: var(--muted); font-size: 12px; margin: -6px 0 12px; }
/* 卡片牆 */
.skp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; }
.skc { position: relative; display: flex; gap: 14px; padding: 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; transition: border-color .15s, transform .15s, background .15s; min-width: 0; }
.skc:hover { border-color: var(--line-hover); background: var(--panel-2); transform: translateY(-2px); }
.skc-th { position: relative; width: 168px; height: 112px; flex-shrink: 0; border-radius: 10px; overflow: hidden; background: var(--thumb); }
.skc-th img { width: 100%; height: 100%; object-fit: cover; transition: transform .35s; }
.skc:hover .skc-th img { transform: scale(1.05); }
.skc-tag { position: absolute; top: 7px; right: 7px; padding: 2px 7px; border-radius: 6px; font-size: 11px; color: #fff; background: rgba(0,0,0,.55); backdrop-filter: blur(4px); }
.skc-bd { min-width: 0; display: flex; flex-direction: column; flex: 1; }
.skc-bd b { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 22px; }
.skc-bd p { margin: 6px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.skc-meta { margin-top: auto; display: flex; gap: 10px; color: var(--faint); font-size: 11.5px; }
.skc-fav { position: absolute; top: 10px; right: 10px; border: 0; background: none; cursor: pointer; font-size: 15px; color: var(--faint); padding: 2px; }
.skc-fav.on { color: var(--warn); }
.skp-empty { grid-column: 1/-1; text-align: center; color: var(--muted); padding: 60px 0; }
/* 詳情抽屜 */
.skd-mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; opacity: 0; pointer-events: none; transition: opacity .2s; }
.skd-mask.open { opacity: 1; pointer-events: auto; }
.skd { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 92vw); background: var(--bg); border-left: 1px solid var(--line); z-index: 51; transform: translateX(100%); transition: transform .25s ease; display: flex; flex-direction: column; }
.skd.open { transform: none; }
.skd-head { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.skd-head b { flex: 1; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.skd-use { padding: 7px 16px; border-radius: 8px; border: 0; background: var(--accent); color: var(--on-accent); font-weight: 600; cursor: pointer; font-size: 13px; }
.skd-x { border: 0; background: none; color: var(--muted); font-size: 22px; cursor: pointer; line-height: 1; }
.skd-body { overflow-y: auto; padding: 20px 28px 48px; }
.skd-body h1 { font-size: 20px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.skd-body h2 { font-size: 17px; margin-top: 28px; color: var(--accent); }
.skd-body h3 { font-size: 15px; }
.skd-body pre { background: var(--panel-2); padding: 12px; border-radius: var(--radius); overflow-x: auto; font-size: 12px; }
.skd-desc { color: var(--muted); margin: 8px 0 16px; }
.skd-extra h2 { color: var(--warn); }
.skd-fmt { margin: 12px 0; padding: 8px 12px; background: var(--panel-2); border-radius: var(--radius); font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); white-space: pre-wrap; display: none; }
.skd-fmt.open { display: block; }
.skp-box { position: relative; }
.skp-tools { display: flex; align-items: center; gap: 2px; }
.skp-tb { position: relative; width: 34px; height: 34px; border-radius: 50%; border: 0; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; transition: .12s; }
.skp-tb:hover, .skp-tb.on { background: var(--panel-2); color: var(--fg); }
.skp-tb .dot { position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.skp-tb[data-tip]:hover::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 5px 9px; border-radius: 7px; background: #000; color: #fff; font-size: 12px; pointer-events: none; z-index: 5; }
.skp-tb.on[data-tip]:hover::after { display: none; }
.skp-chips { display: flex; gap: 6px; flex-wrap: wrap; min-width: 0; }
.skp-mchip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); font-size: 11.5px; color: var(--fg-soft); }
.skp-mchip i { font-style: normal; color: var(--muted); }
.skp-pop { position: absolute; left: 0; top: calc(100% + 10px); width: min(560px, 100%); max-height: 460px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 18px 48px rgba(0,0,0,.35); z-index: 40; padding: 16px; }
.skp-pop[hidden] { display: none; }
.skp-pop.sm { width: 320px; padding: 8px; }
.skp-pop h4 { margin: 2px 4px 12px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.skp-pop h4 .sp { flex: 1; }
.skp-pop h4 a { font-size: 12.5px; font-weight: 500; padding: 5px 12px; border-radius: 8px; border: 1px solid var(--line); color: var(--fg-soft); cursor: pointer; text-decoration: none; }
.skp-seg { display: flex; padding: 3px; border-radius: 10px; background: var(--panel-2); margin-bottom: 10px; }
.skp-seg button { flex: 1; padding: 7px 0; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; font-size: 13.5px; font-weight: 600; }
.skp-seg button.on { background: var(--line-hover); color: var(--fg); }
.skp-poprow { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.skp-ptabs { display: flex; gap: 14px; }
.skp-ptabs button { border: 0; background: none; padding: 0; color: var(--muted); cursor: pointer; font-size: 13.5px; }
.skp-ptabs button.on { color: var(--fg); font-weight: 600; }
.skp-poprow input { flex: 1; padding: 7px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); font-size: 13px; outline: 0; }
.skp-plist { overflow-y: auto; margin: 0 -6px; }
.skp-grp { color: var(--muted); font-size: 12px; margin: 10px 8px 4px; }
.skp-opt { display: flex; align-items: center; gap: 12px; padding: 9px 8px; border-radius: 10px; cursor: pointer; }
.skp-opt:hover { background: var(--panel-2); }
.skp-opt.dis { opacity: .45; cursor: not-allowed; }
.skp-ic { width: 38px; height: 38px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); display: grid; place-items: center; flex-shrink: 0; color: var(--fg-soft); overflow: hidden; }
.skp-ic img { width: 100%; height: 100%; object-fit: cover; }
.skp-ot { flex: 1; min-width: 0; }
.skp-ot b { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; }
.skp-ot code { font-size: 11.5px; font-weight: 400; padding: 2px 7px; border-radius: 6px; background: var(--panel-2); color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.skp-ot span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.skp-st { font-size: 10.5px; padding: 1px 6px; border-radius: 5px; font-weight: 500; }
.skp-st.ok { color: var(--ok); border: 1px solid var(--ok-line); }
.skp-st.untested { color: var(--muted); border: 1px solid var(--line); }
.skp-st.quota, .skp-st.license { color: var(--warn); border: 1px solid var(--warn-line); }
.skp-add { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--muted); color: var(--muted); display: grid; place-items: center; flex-shrink: 0; font-size: 16px; line-height: 1; }
.skp-add.on { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.skp-pe { text-align: center; color: var(--muted); padding: 28px 0; font-size: 13px; }
.skp-mode { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; cursor: pointer; }
.skp-mode:hover { background: var(--panel-2); }
.skp-mode .skp-ot b { font-size: 14px; }
.skp-mode .ck { color: var(--fg); visibility: hidden; }
.skp-mode.on .ck { visibility: visible; }
@media (max-width: 900px) { .skp-in { padding: 24px 16px 48px; } .skp-tabs { flex-wrap: wrap; } .skp-tabs .skp-search { width: 100%; margin-left: 0; } .skp-grid { grid-template-columns: 1fr; } .skc-th { width: 128px; height: 88px; } }
</style>
<div class="skp" id="skp">
  <div class="skp-in">
    <section class="skp-hero">
      <h1 id="t-hero">一個 Skill，一部作品</h1>
      <div class="skp-box">
        <textarea id="pin" placeholder="輸入你的創作靈感，或從下方挑選一個 Skill 開始"></textarea>
        <div class="skp-box-foot">
          <div class="skp-tools">
            <button class="skp-tb" id="tb-model" type="button" data-tip="選擇模型"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 2.8 20.5 7.5v9L12 21.2 3.5 16.5v-9z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9.2"/></svg></button>
            <button class="skp-tb" id="tb-skill" type="button" data-tip="Skill"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M8 16h8"/><path d="M18 2.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"/></svg></button>
            <button class="skp-tb" id="tb-mode" type="button" data-tip="生成模式"></button>
          </div>
          <div class="skp-chips"><span id="pick"></span><span id="mchips" style="display:contents"></span></div>
          <span class="skp-hint" id="t-hint" style="margin-left:auto">⌘ + Enter 送到 AI 導演</span>
          <button class="skp-send" id="send" title="送出" disabled style="margin-left:8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg></button>
        </div>
        <div class="skp-pop" id="pop-model" hidden></div>
        <div class="skp-pop" id="pop-skill" hidden></div>
        <div class="skp-pop sm" id="pop-mode" hidden></div>
      </div>
    </section>
    <div class="skp-tabs"><span id="tabs" style="display:contents"></span>
      <label class="skp-search">
        <input id="q" placeholder="搜尋 Skill">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </label>
    </div>
    <div class="skp-bar">
      <div class="skp-cats" id="cats"></div>
    </div>
    <div class="skp-cnt" id="cnt"></div>
    <div class="skp-grid" id="grid"></div>
  </div>
</div>
<div class="skd-mask" id="mask"></div>
<aside class="skd" id="drawer" aria-hidden="true">
  <div class="skd-head"><b id="d-title"></b><button class="skd-use" id="d-use">使用此 Skill</button><button class="skd-x" id="d-x" title="關閉">×</button></div>
  <div class="skd-body" id="d-body"></div>
</aside>
{% endblock %}
{% block scripts %}
<script>
(()=>{
const LMAP={'zh-Hant':'tc','zh-Hans':'sc','en':'en'};
const I18N={
  tc:{hero:'一個 Skill，一部作品',ph:'輸入你的創作靈感，或從下方挑選一個 Skill 開始',hint:'⌘ + Enter 送到 AI 導演',all:'全部',fav:'收藏',search:'搜尋 Skill',use:'使用此 Skill',empty:'沒有符合的 Skill',fm:'顯示／隱藏 frontmatter',extra:'附屬檔',loading:'載入中…',skill:'Skill',mdl:'選擇模型',img:'圖片',vid:'影片',st:{ok:'可用',untested:'未實測',quota:'需開通',license:'授權'},mode:'生成模式',man:'手動生成',manD:'AI 導演每次生成前詢問',aut:'自動生成',autD:'AI 導演直接呼叫模型生成',gen:'通用',mine:'我的',mineE:'尚未建立自己的 Skill',allBtn:'全部',none:'沒有可用的模型'},
  sc:{hero:'一个 Skill，一部作品',ph:'输入你的创作灵感，或从下方挑选一个 Skill 开始',hint:'⌘ + Enter 发送到 AI 导演',all:'全部',fav:'收藏',search:'搜索 Skill',use:'使用此 Skill',empty:'没有符合的 Skill',fm:'显示／隐藏 frontmatter',extra:'附属文件',loading:'加载中…',skill:'Skill',mdl:'选择模型',img:'图片',vid:'视频',st:{ok:'可用',untested:'未实测',quota:'需开通',license:'授权'},mode:'生成模式',man:'手动生成',manD:'AI 导演每次生成前询问',aut:'自动生成',autD:'AI 导演直接调用模型生成',gen:'通用',mine:'我的',mineE:'尚未创建自己的 Skill',allBtn:'全部',none:'没有可用的模型'},
  en:{hero:'One Skill, One Film',ph:'Describe your idea, or pick a Skill below to start',hint:'⌘ + Enter to send to AI Director',all:'All',fav:'Saved',search:'Search Skills',use:'Use this Skill',empty:'No matching Skills',fm:'Show / hide frontmatter',extra:'Attachment',loading:'Loading…',skill:'Skill',mdl:'Select model',img:'Image',vid:'Video',st:{ok:'Ready',untested:'Untested',quota:'Not enabled',license:'License'},mode:'Generation',man:'Manual',manD:'AI Director asks before each generation',aut:'Auto',autD:'AI Director generates directly',gen:'General',mine:'Mine',mineE:'No custom Skills yet',allBtn:'All',none:'No models available'}
};
const CAT={'MV音樂':['MV音乐','Music Video'],'分鏡前期':['分镜前期','Storyboard'],'劇本喜劇':['剧本喜剧','Script & Comedy'],'動畫動漫':['动画动漫','Animation'],'廣告TVC':['广告TVC','Commercial'],'旅拍生活':['旅拍生活','Travel & Life'],'短劇漫劇':['短剧漫剧','Short Drama'],'自媒體口播':['自媒体口播','Creator Talk'],'視覺風格':['视觉风格','Visual Style'],'遊戲運動':['游戏运动','Game & Sport'],'電商帶貨':['电商带货','E-commerce'],'電影美學':['电影美学','Film Aesthetics']};
const $=id=>document.getElementById(id);
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let DATA=[],CUR=-1,PICK=-1,CAT_SEL='',TAB='all',LANG=LMAP[window.REACH&&REACH.lang]||'tc',FAV=new Set(store.get('reach.skill.fav',[]));
const T=k=>I18N[LANG][k];
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const catName=c=>LANG==='tc'?c:(CAT[c]?CAT[c][LANG==='sc'?0:1]:c);
const title=s=>LANG==='en'?s.slug.replace(/-\d+$/,'').replace(/-/g,' ').replace(/\b\w/g,m=>m.toUpperCase()):(LANG==='sc'?(s.cn_sc||s.cn):s.cn);
const desc=s=>s.description[LANG]||s.description.tc;
const cover=s=>s.cover?'/api/skills/'+s.slug+'/cover':'';
function md(t){
  t=esc(t);
  t=t.replace(/```([\s\S]*?)```/g,(m,c)=>'<pre>'+c+'</pre>');
  t=t.replace(/^####\s?(.*)$/gm,'<h4>$1</h4>').replace(/^###\s?(.*)$/gm,'<h3>$1</h3>').replace(/^##\s?(.*)$/gm,'<h2>$1</h2>').replace(/^#\s?(.*)$/gm,'<h1>$1</h1>');
  t=t.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/^\s*[-*]\s(.*)$/gm,'• $1').replace(/\n/g,'<br>');
  return t;
}
function texts(){
  $('t-hero').textContent=T('hero');$('pin').placeholder=T('ph');$('t-hint').textContent=T('hint');
  $('q').placeholder=T('search');$('d-use').textContent=T('use');
  $('tb-model').dataset.tip=T('mdl');$('tb-mode').dataset.tip=T('mode');
}
function tabs(){
  const w=$('tabs');w.innerHTML='';
  [['all',T('skill'),DATA.length],['fav',T('fav'),FAV.size]].forEach(([v,l,n])=>{
    const b=document.createElement('button');b.className=TAB===v?'on':'';b.innerHTML=esc(l)+'<em>'+n+'</em>';
    b.onclick=()=>{TAB=v;tabs();render();};w.appendChild(b);
  });
}
function cats(){
  const w=$('cats');w.innerHTML='';
  ['',...new Set(DATA.map(s=>s.category))].forEach(c=>{
    const b=document.createElement('button');b.textContent=c?catName(c):T('all');
    if(CAT_SEL===c)b.className='on';
    b.onclick=()=>{CAT_SEL=c;cats();render();};w.appendChild(b);
  });
}
function render(){
  const q=$('q').value.trim().toLowerCase(),g=$('grid');g.innerHTML='';let n=0;
  DATA.forEach((s,i)=>{
    if(TAB==='fav'&&!FAV.has(s.slug))return;
    if(CAT_SEL&&s.category!==CAT_SEL)return;
    const hay=(s.cn+' '+(s.cn_sc||'')+' '+s.slug+' '+s.category+' '+s.description.tc+' '+s.description.sc+' '+s.description.en).toLowerCase();
    if(q&&!hay.includes(q))return;
    n++;
    const c=document.createElement('div');c.className='skc';
    c.innerHTML='<div class="skc-th">'+(s.cover?'<img loading="lazy" src="'+cover(s)+'" onerror="this.style.visibility=\'hidden\'">':'')+
      '<span class="skc-tag">'+esc(catName(s.category))+'</span></div>'+
      '<div class="skc-bd"><b>'+esc(title(s))+'</b><p>'+esc(desc(s))+'</p>'+
      '<div class="skc-meta"><span>v'+esc(s.version||'?')+'</span><span>'+(s.bytes/1024).toFixed(1)+' KB</span>'+(s.extras&&s.extras.length?'<span>+'+s.extras.length+' 附件</span>':'')+'</div></div>'+
      '<button class="skc-fav'+(FAV.has(s.slug)?' on':'')+'" title="'+esc(T('fav'))+'">★</button>';
    c.onclick=()=>open(i);
    c.querySelector('.skc-fav').onclick=e=>{e.stopPropagation();FAV.has(s.slug)?FAV.delete(s.slug):FAV.add(s.slug);store.set('reach.skill.fav',[...FAV]);tabs();render();};
    g.appendChild(c);
  });
  if(!n)g.innerHTML='<div class="skp-empty">'+esc(T('empty'))+'</div>';
  $('cnt').textContent=n+' / '+DATA.length;
}
async function open(i){
  CUR=i;const s=DATA[i],b=$('d-body');
  $('d-title').textContent=title(s);
  $('drawer').classList.add('open');$('mask').classList.add('open');$('drawer').setAttribute('aria-hidden','false');
  b.innerHTML='<div class="skd-desc">'+esc(T('loading'))+'</div>';b.scrollTop=0;
  const d=await (await fetch('/api/skills/'+s.slug+'?lang='+LANG)).json();
  let h='<h1>'+esc(title(s))+' <small style="color:var(--muted);font-size:12px">'+esc(catName(s.category))+' · '+esc(s.slug)+' · v'+esc(s.version||'?')+'</small></h1>';
  h+='<div class="skd-desc">'+esc(desc(s))+'</div>';
  if(s.cover)h+='<img src="'+cover(s)+'" style="width:100%;max-height:300px;object-fit:cover;border-radius:12px;margin-bottom:16px" onerror="this.style.display=\'none\'">';
  h+='<div class="skd-fmt" id="fm">'+esc(d.frontmatter)+'</div><div style="margin:8px 0"><a href="javascript:void(0)" onclick="document.getElementById(\'fm\').classList.toggle(\'open\')" style="color:var(--muted);font-size:12px">'+esc(T('fm'))+'</a></div>';
  h+=md(d.markdown);
  for(const e of (s.extras||[])){
    const ed=await (await fetch('/api/skills/'+s.slug+'/'+e+'?lang='+LANG)).json();
    h+='<div class="skd-extra"><h2>'+esc(T('extra'))+'：'+esc(e)+'</h2>'+md(ed.markdown||'')+'</div>';
  }
  if(CUR===i)b.innerHTML=h;
}
function close(){$('drawer').classList.remove('open');$('mask').classList.remove('open');$('drawer').setAttribute('aria-hidden','true');CUR=-1;}
function pick(i){
  PICK=i;const w=$('pick');
  if(i<0){w.innerHTML='';}else{const s=DATA[i];
    w.innerHTML='<span class="skp-pick">'+(s.cover?'<img src="'+cover(s)+'">':'')+esc(title(s))+'<button title="移除">×</button></span>';
    w.querySelector('button').onclick=()=>pick(-1);}
  sendState();
}
function sendState(){$('send').disabled=!($('pin').value.trim()||PICK>=0);}
function send(){
  if($('send').disabled)return;
  const s=PICK>=0?DATA[PICK]:null,txt=$('pin').value.trim();
  const pre=txt;
  try{sessionStorage.setItem('reach.director.settings',JSON.stringify({skill:s?s.slug:'',skill_name:s?s.cn:'',models:MODELS||{},gen_mode:GMODE}))}catch{}
  try{sessionStorage.setItem('reach.director.prefill',pre)}catch{}
  location.href='/director';
}
$('d-use').onclick=()=>{if(CUR<0)return;pick(CUR);close();$('skp').scrollTo({top:0,behavior:'smooth'});$('pin').focus();};
/* ===== 編輯區工具：模型 / Skill / 生成模式 ===== */
let CFG=null,MTAB='image',PTAB='all',GMODE=store.get('reach.gen.mode','manual'),MODELS=store.get('reach.gen.models',null);
const ICON={hand:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.4l-3.6-3.6a2 2 0 0 1 2.8-2.8L6 14"/></svg>',
  auto:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>',
  wrench:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0 5 5L22 14l-8 8-2.3-2.3a4 4 0 0 0-5-5L4.4 12.4l8-8z" transform="scale(.9) translate(1 1)"/></svg>',
  img:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>',
  vid:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3" y="5" width="13" height="14" rx="3"/><path d="m16 10 5-3v10l-5-3z"/></svg>',
  ck:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 5 5 9-10"/></svg>'};
const POPS={model:'pop-model',skill:'pop-skill',mode:'pop-mode'};
function popOpen(k){
  const was=!$(POPS[k]).hidden;
  Object.entries(POPS).forEach(([n,id])=>{$(id).hidden=true;$('tb-'+n).classList.remove('on');});
  if(was)return;
  $(POPS[k]).hidden=false;$('tb-'+k).classList.add('on');
  ({model:drawModel,skill:drawSkill,mode:drawMode})[k]();
  if(k==='skill')setTimeout(()=>$('ps-q')?.focus(),0);
}
function popClose(){Object.entries(POPS).forEach(([n,id])=>{$(id).hidden=true;$('tb-'+n).classList.remove('on');});}
document.addEventListener('mousedown',e=>{if(!e.target.closest('.skp-pop,.skp-tb'))popClose();});
$('tb-model').onclick=()=>popOpen('model');$('tb-skill').onclick=()=>popOpen('skill');$('tb-mode').onclick=()=>popOpen('mode');
const allModels=kind=>!CFG?[]:CFG.providers.flatMap(p=>p.models.filter(m=>m.kind===kind&&m.status!=='quota'&&m.status!=='license').map(m=>({v:p.id+'|'+m.id,id:m.id,p,m})));
function drawModel(){
  const w=$('pop-model'),list=allModels(MTAB);
  let h='<h4>'+esc(T('mdl'))+'</h4><div class="skp-seg">'+[['image',T('img')],['video',T('vid')]].map(([k,l])=>'<button data-k="'+k+'" class="'+(MTAB===k?'on':'')+'">'+esc(l)+'</button>').join('')+'</div><div class="skp-plist">';
  if(!CFG)h+='<div class="skp-pe">'+esc(T('loading'))+'</div>';
  else if(!list.length)h+='<div class="skp-pe">'+esc(T('none'))+'</div>';
  const groups={};list.forEach(x=>(groups[x.p.name]=groups[x.p.name]||[]).push(x));
  Object.entries(groups).forEach(([g,arr])=>{
    h+='<div class="skp-grp">'+esc(g)+'</div>';
    arr.forEach(x=>{const dis=x.m.status==='quota'||x.m.status==='license',on=MODELS&&MODELS[MTAB]===x.v;
      h+='<div class="skp-opt'+(dis?' dis':'')+'" data-v="'+esc(x.v)+'"><div class="skp-ic">'+(MTAB==='image'?ICON.img:ICON.vid)+'</div>'+
        '<div class="skp-ot"><b>'+esc(x.id)+' <span class="skp-st '+esc(x.m.status)+'">'+esc((T('st')[x.m.status])||x.m.status)+'</span></b><span>'+esc(x.m.note||x.p.name)+'</span></div>'+
        '<div class="skp-add'+(on?' on':'')+'">'+(on?'✓':'+')+'</div></div>';});
  });
  w.innerHTML=h+'</div>';
  w.querySelectorAll('.skp-seg button').forEach(b=>b.onclick=()=>{MTAB=b.dataset.k;drawModel();});
  w.querySelectorAll('.skp-opt:not(.dis)').forEach(o=>o.onclick=()=>{MODELS=MODELS||{};MODELS[MTAB]=MODELS[MTAB]===o.dataset.v?'':o.dataset.v;store.set('reach.gen.models',MODELS);drawModel();drawChips();});
}
function drawSkill(){
  const w=$('pop-skill'),q=($('ps-q')?.value||'').toLowerCase();
  if(!w.dataset.built){
    w.innerHTML='<h4>Skill<span class="sp"></span><a id="ps-all"></a></h4><div class="skp-poprow"><div class="skp-ptabs" id="ps-tabs"></div><input id="ps-q"></div><div class="skp-plist" id="ps-list"></div>';
    w.dataset.built=1;$('ps-q').oninput=drawSkill;
    $('ps-q').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();w.querySelector('.skp-opt')?.click();}};
    $('ps-all').onclick=()=>{popClose();document.querySelector('.skp-tabs').scrollIntoView({behavior:'smooth'});};
  }
  $('ps-all').textContent=T('allBtn');$('ps-q').placeholder=T('search');
  $('ps-tabs').innerHTML=[['all',T('gen')],['fav',T('fav')],['mine',T('mine')]].map(([k,l])=>'<button data-k="'+k+'" class="'+(PTAB===k?'on':'')+'">'+esc(l)+'</button>').join('');
  $('ps-tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{PTAB=b.dataset.k;drawSkill();});
  let items=DATA.map((s,i)=>[s,i]);
  if(PTAB==='fav')items=items.filter(([s])=>FAV.has(s.slug));
  if(PTAB==='mine')items=[];
  if(q)items=items.filter(([s])=>(s.cn+' '+(s.cn_sc||'')+' '+s.slug+' '+desc(s)).toLowerCase().includes(q));
  $('ps-list').innerHTML=items.length?items.slice(0,80).map(([s,i])=>'<div class="skp-opt" data-i="'+i+'"><div class="skp-ic">'+(s.cover?'<img loading="lazy" src="'+cover(s)+'">':ICON.wrench)+'</div><div class="skp-ot"><b>'+esc(title(s))+'<code>/'+esc(s.slug)+'</code></b><span>'+esc(desc(s))+'</span></div>'+(PICK===i?'<div class="skp-add on">✓</div>':'')+'</div>').join('')
    :'<div class="skp-pe">'+esc(PTAB==='mine'?T('mineE'):T('empty'))+'</div>';
  $('ps-list').querySelectorAll('.skp-opt').forEach(o=>o.onclick=()=>{const i=+o.dataset.i;pick(PICK===i?-1:i);popClose();
    const ta=$('pin'),m=ta.value.match(/(^|\s)\/[^\s]*$/);if(m){ta.value=ta.value.slice(0,m.index+m[1].length);sendState();}ta.focus();});
}
function drawMode(){
  const w=$('pop-mode');
  w.innerHTML=[['manual',ICON.hand,T('man'),T('manD')],['auto',ICON.auto,T('aut'),T('autD')]].map(([k,ic,t,d])=>'<div class="skp-mode'+(GMODE===k?' on':'')+'" data-k="'+k+'">'+ic+'<div class="skp-ot"><b>'+esc(t)+'</b><span>'+esc(d)+'</span></div><span class="ck">'+ICON.ck+'</span></div>').join('');
  w.querySelectorAll('.skp-mode').forEach(o=>o.onclick=()=>{GMODE=o.dataset.k;store.set('reach.gen.mode',GMODE);drawModeBtn();popClose();});
}
function drawModeBtn(){$('tb-mode').innerHTML=GMODE==='auto'?ICON.auto:ICON.hand;}
function drawChips(){
  const c=[];if(MODELS)[['image',T('img')],['video',T('vid')]].forEach(([k,l])=>{if(MODELS[k])c.push('<span class="skp-mchip"><i>'+esc(l)+'</i>'+esc(MODELS[k].split('|')[1])+'</span>');});
  $('mchips').innerHTML='';
  $('tb-model').querySelector('.dot')?.remove();
  if(c.length)$('tb-model').insertAdjacentHTML('beforeend','<span class="dot"></span>');
}
/* 輸入 / 快速叫出 Skill 選單 */
$('pin').addEventListener('input',()=>{
  const ta=$('pin'),m=ta.value.slice(0,ta.selectionStart).match(/(^|\s)\/([^\s]*)$/);
  if(m){if($('pop-skill').hidden)popOpen('skill');PTAB='all';$('ps-q').value=m[2];drawSkill();setTimeout(()=>ta.focus(),0);}
  else if(!$('pop-skill').hidden&&document.activeElement===ta)popClose();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')popClose();});
fetch('/api/config').then(r=>r.json()).then(c=>{CFG=c;
  if(!MODELS){const r=c.routing||{};MODELS={image:r.keyframe?r.keyframe.provider+'|'+r.keyframe.model:'',video:r.video?r.video.provider+'|'+r.video.model:''};}
  drawChips();if(!$('pop-model').hidden)drawModel();}).catch(()=>{});
drawModeBtn();
$('d-x').onclick=close;$('mask').onclick=close;
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
$('q').oninput=render;
$('pin').oninput=sendState;
$('pin').onkeydown=e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();send();}};
$('send').onclick=send;
window.REACH&&REACH.onLang(l=>{LANG=LMAP[l]||'tc';texts();tabs();cats();render();drawChips();if(!$('pop-model').hidden)drawModel();if(!$('pop-skill').hidden)drawSkill();if(!$('pop-mode').hidden)drawMode();if(PICK>=0)pick(PICK);if(CUR>=0)open(CUR);});
texts();
fetch('/api/skills').then(r=>r.json()).then(d=>{DATA=d.skills||[];FAV=new Set([...FAV].filter(x=>DATA.some(s=>s.slug===x)));tabs();cats();render();});
})();
</script>
{% endblock %}
