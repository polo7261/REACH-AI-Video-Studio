const DATA=[{"slug": "a24-cinematic-aesthetic", "desc": "A24 cinematic aesthetics — auteur-driven expression rendered with elevated strangeness, wrapping an absurdist core in raw, textured realism.", "body": "# A24电影美学\n\n> 🔴 严格按本 SKILL 分步执行。版本 2.5.1 lean（Seedance 2.5 适配）\n\n## 底层 DNA（每条画面无条件带）\n\n1. 🔴 **真实胶片质感为绝对底**：真人实拍级、16mm/35mm 颗粒、皮肤有毛孔与自然油光。禁 CGI/动漫/3D/塑料皮肤/过度磨皮/数码硬锐。🔴 分辨率越高越不等于干净——720p/1080p 下同样须保留可见颗粒、halation、低对比曲线。\n2. 🔴 **情绪优先于情节**，画面服务内在情感、不做信息交代。整体节奏快而紧绷、有压迫感，不给喘息；但紧张来自情绪压迫，非剪辑花活。\n3. **亲密 + 不安并存**：美丽与不适同框，浅景深贴近、面部凝视、日常中的诡异。\n4. **构图克制，留白即绷紧**：负空间与静默是蓄能（暴风雨前的静），非松弛；对称几何但不炫技。\n5. **光源动机化**：自然光/实用光源（窗/灯/烛/霓虹/荧光），只见光效不见灯具。\n6. **介质必须动**：雾/尘/雨/雪/光尘写明方向+速度，衣物头发同步受风。\n7. 🔴 **气质底 + 参考库**：参考只取方向锚（光色/质感/辨识点），产出始终原创、绝不逐镜复刻。\n8. **配色随情绪定**，允许大胆饱和或冷静自然；唯一负面锁：避开默认黄褪色廉价感。\n9. 只做 A24 作者性胶片一脉，不做商业快切炫技、纯类型片视觉。\n\n## 质感尾词（每条图像 prompt 默认带）\n\n`16mm 或 35mm 胶片拍摄，天然胶片颗粒，低对比胶片曲线，真实皮肤呈现（真实毛孔与纹理），柔和光晕（halation），真实粗粝质感，情绪化电影级色彩，亲密浅景深，动机化自然光/实用光源，无过度锐化，无 CG 渲染感；非动漫、非 CGI、非 3D 渲染、非塑料皮肤、非过度磨皮、非数码高清硬锐，无默认黄褪色调，无高分辨率数码干净感（保留颗粒与噪点结构），画面内无影棚灯具，无黑边遮幅（画面铺满整帧出血）`\n\n## 语言规则（🔴 全局，优先于本文档其余语言表述）\n\n- **会话语种锁**：入口第一动作，按用户首次文字输入的语种判定一次（无文字取 skill 名语种），写入 memory 全程锁定；中途不重判（点选卡片、短词、他语种素材均不改变），仅用户明确要求时更换。\n- 🔴 **唯一来源 = 会话语种，覆盖全部可见输出**：以下一律按会话语种书写——① agent 的每一句对话回复、进度说明、确认与报错 ② 选择卡的问题/选项/说明 ③ 故事梗概、scene list、剧本正文、分镜说明、资产与场景说明 ④ 全部 prompt（图像/视频/音乐，含每条重试）。本文档文案仅是内容规范，一律译写、**禁照抄原文语种**。\n- 🔴 **唯一例外（保留原文的白名单）**：① 引号内台词/旁白引文（用⑧语种）② 技术标识符（model 串、duration、asset_id、MAXDUR、@图1/@音频1 等参数与引用名）③ 摄影与制作术语（halation、dolly、push-in、compose、moodboard、underscore 等）④ 参考片原名。负面词沿用本文档给定串（默认即会话语种，禁改为第三语种）。白名单之外一律会话语种。\n- 🔴 **与对白语种双向隔离**：⑧只决定**片内口语**。用户选英文对白 ≠ 全局转英文——**只有引号内台词/旁白是英文**，对话回复、卡片、prompt 全部描述文字、故事与剧本正文一律仍是会话语种。例：首输中文 + 对白英文 → 全程中文、仅台词引文英文；首输韩文 + 对白日文同理。图像 prompt 无台词、全文会话语种。\n- **禁例外禁继承**：\"模型更懂英文\"不采纳；下游只继承上游的风格与内容、绝不继承书写语种；发现语种不符先译写再使用，禁下传。\n- 🔴 **复用与自查**：每条 prompt 绑 asset_id 存 memory；失败重试与重生成一律读回原 prompt 在其基础上微调，禁重写禁改语种。**每次输出前（含对话回复）两问**：书写语种 == 会话语种？台词引文 == ⑧语种？不符则改写后再输出。\n\n## 时长档 MAXDUR（🔴 优先于本文档所有时长数字）\n\n1. **来源 = 入口⓪的用户选择**：Seedance 2.5 → MAXDUR=30；Seedance 2.0 → MAXDUR=15。写入 memory 全程沿用，不自行改动。🔴 **发第一条任务时核对**：所选模型是否真在工具列表中、duration 是否真接受该值（被回落则走\"模型闸门\"停下问用户，不静默降级）。\n2. 🔴 **时间轴末段结束时间 == 本条提交的 duration**：既不许留\"…\"，也不许超出 MAXDUR（超出会被压缩或截断，是\"时长上不去\"的主因）。\n3. **按档取值**（本文档其余处的 30s / 5–8 镜 / t30s 均为 MAXDUR=30 的示例）：\n\nMAXDUR 单条分镜数 写到 成片换算 跨段接法 30s 5–8（下限 ≥3） t30s 30–60s≈2 条 / 1–2 分≈2–4 条 拆条 + compose 15s 3–4（下限 ≥2） t15s 条数加倍 拆条 + compose ≤10s 2–3 该时长 按比例上推 拆条+compose\n\nMAXDUR 变化时回第 2 步重切段落，不把 30s 的段硬塞进 15s 任务。其余规则（四轨、切分动因、参考纪律、语言、声音）不变。\n\n## 流程\n\n 1. **入口**：🔴 先锁会话语种。🔴 **一轮合并问完以下 9 项**（每项独立呈现、带可选项，问题与选项均译写为会话语种），答案入 memory。 ⓪ 🔴 **视频模型（必问，排在最前，决定下游全部时长编排）**：**Seedance 2.5**（默认，单条 30s）/ **Seedance 2.0**（单条 15s）。答案即 `MAXDUR`（2.5→30、2.0→15）写入 memory，第 2 步分段、第 5 步时间轴、分镜数与跨段接法全部按此档走，中途不得混用。 ① **时长**（只呈现成片时长、不露分镜数）：30–60 秒 / 1–2 分 / 2–3 分 / 其他。内部按 MAXDUR 表换算条数。 ② **执行模式**：全自动 / 手动确认。 ③ **画幅**：21:9（默认）/ 16:9 / 9:16 / 3:4 / 其他。 ④ **分辨率**（与画幅分开问）：480p / **720p（默认）** / 1080p；图像 2K。仅此三档，不提供 4K。 ⑤ **故事梗概**：用户自带 / 自动生成。 ⑥ **风格方向**：🔴 从参考库**两两随机融合**出 3–4 个方案作选项（每次纯随机、附一句融合气质说明），🔴 只写\"片名 × 片名\"、不露 REF 编号，**禁把单一片名直接列为选项**；末位留\"我有自己的想法或指定参考\"。仅当用户明确只要一种时走单一风格。 ⑦ **人声模式**（必问）：①纯氛围 ②纯对话（默认）③纯旁白 ④对话+旁白穿插。 ⑧ **对白语言**：英文（默认）/ 韩文 / 日文 / 其他 / 无语言。（2.5 支持十余种语言口型对齐。）\n 2. **故事**（先于 moodboard、必须定稿）：情绪优先、张力递进、开放结尾。输出 scene list + emotional arc + 🔴 **动作线**（每场肢体动作起→中→止，动作必挂动机）+ 🎭 **角色表演基调**（标志性小动作/身体习惯/情绪临界反应，全片跨镜一致），遵循⑦人声模式。🔴 故事来自用户方向、**不照搬参考片剧情**。🔴 **定稿闸门**：弹卡①确认通过 ②需要修改（附输入项，改后再弹，循环至通过），未通过不得下行。🔴 **按 MAXDUR 分段**：切成每段 ≤MAXDUR 的连续段，逐段标注**同场景延续**（compose 时无缝相接）或**跨场景硬切**（转场处硬切）。风格：清晰有目的、场与场压茬推进，紧张挂在情绪与动机上。\n 3. **moodboard**：风格已在⑥定，不再询问。故事通过后生成（融合方案以一种为主色调锚、另一种作气质叠加；单一画面铺满出血，禁白边/拼贴/分格）→ 🔴 **不确认、直接存为风格锚**入 memory。\n 4. **资产（图像）**：🔴 全部图像 prompt 用会话语种。🔴 **时序**：moodboard 与人物图可并行；**场景图必须等 moodboard 完成后才开始**（要挂它作风格锚）。\n    - **角色**：有戏角色必产锚定图（锁脸/服装/发型），后续 @角色名 引用。\n    - **场景**：🔴 **一个空间只出一张图**、该空间所有戏共用（换地点才新增），不按场次数生成。🔴 **动作依赖要素必须画进去——尤其是门**：剧本用到门/窗/楼梯/镜子/走廊口时该图必须明确出现且位置可用；生成前先提取\"动作依赖要素清单\"写进 prompt，生成后逐项核对，缺失重生成。🔴 **一律纯空镜、绝无任何生物**：严禁任何人物、人形、机器人、AI、类人形象、动物（背景远景、群演、橱窗模型也不行），一切生命/类生命体只走人物图、靠 @角色名 合成。🎨 **强制挂 moodboard 风格锚——只参考风格（色调/光感/质感/气质），不参考构图/内容/布局，也不继承其书写语种**；可按 REF 偏移主色。🔴 禁黑边遮幅，直接用目标比例出图铺满整帧。\n    - **道具**按需生成、asset_id 绑定。🔊 **声线锚（可选）**：用户提供角色声线音频则登记绑角色，第 5 步作 @音频N 锁跨条声音；未提供则靠性别锁+角色描述定声。\n 5. **生成视频（按入口⓪选定的模型）**：🔴 时间轴严格按 ⓪ 对应的 MAXDUR 写——2.5 走 30s / 5–8 分镜，2.0 走 15s / 3–4 分镜，不混用。🔴 **单条内嵌多个连续分镜**（MAXDUR=30 时 5–8 个），严禁一镜一条；末段结束 == 提交的 duration。🔴 **跨 MAXDUR 一律另起独立条**、交第 8 步 compose 拼接；🔴 **禁用延长续写**——绝不把前一段视频垫作续写源，本 skill 不调用该功能。跨条一致性只靠场景图/角色图/声线锚维持：逐条核对脸/服装/光位/色调/声线/介质方向，漂移则用同组参考重生成。🔴 **参考素材只能是场景图 + 角色图（+ 道具图、可选声线音频），严禁把 moodboard 挂进视频任务**——它是图像层给场景图用的风格锚，视频阶段一律不挂；挂了会让模型复现它画面里的元素、污染构图与内容。风格已由场景图承载。🔴 **绝不含 BGM**：只出环境音+人声，配乐留第 9 步；@音频 参考禁传音乐类。\n 6. **不达标处理（只有整条重生成）**：🔴 **本 skill 不调用 2.5 的任何编辑与续写功能**——无 timestamp 修镜、无运镜编辑、无局部重塑、无延长续写。某条不合格 → 读回原 prompt **在其基础上微调后整条重跑**（禁从头重写、禁改语种）；超出 MAXDUR 的内容一律另起独立条。🔴 **运镜、速度变化、慢动作全部只能靠改 prompt 重跑**（后期也没有变速/超分）。🔴 **重跑闸门**：同一条重跑 ≥3 次仍不达标 → 回上游查病根（场景图缺要素？动作线不可拍？参考冲突？角色图不清？），修上游再重发，禁无脑刷条。\n 7. **音乐**（Mureka V8）：🔴 prompt 用会话语种。🔴 **方向不问用户**，按剧本节奏与风格自动匹配（紧张→低音心跳/合成器脉冲/渐强织体持续 underscore；慢暗涌→极简氛围织体）；静默只作骤停对比。禁流行编曲/管弦爆炸/廉价惊悚音效。BGM 可先生成、默认不合成。🔴 绝不作为 @音频 参考回灌视频。\n 8. **成片合成**（media-platform）：compose 串接全部独立条——同场景延续段无缝相接、跨场景处硬切；接入环境音，**不含 BGM**，产出纯净成片（含人声）。\n 9. **后期增补**：🔴 弹选择卡（可多选，非文本提问）：①加字幕 ②加 BGM ③都要 ④都不要。选了含字幕的项后**追加字幕语种卡**：Ⓐ跟随对白语种（单语，默认）Ⓑ指定其他语种 Ⓒ双语（上轨指定、下轨对白）。🔴 **混音**：原声（环境音+对白）+8dB、BGM −2dB。🔴 **顺序不可颠倒：先字幕、最后合 BGM**（含 BGM 成片上生成字幕会出错）。🔴 旁白已在视频阶段烧录，此处不再询问或追加。\n10. **后期链限制**：可用字幕/转场（默认硬切）/抽帧/裁剪/文字贴片/混音；**无变速、无降噪、无超分**——所有镜头运动须在 prompt 内完成，要改走第 6 步。人声随视频烧录、非后期配。剪辑气质：快而紧、压茬推进、不泄压。\n\n## 视频铁律\n\n- 🔴 **分镜切分 = 内容事件驱动**：出现 ①动作节拍变化 ②情绪转折点 ③需变景别或视角 ④注意力焦点转移 之一即切新分镜。跟着内容走，不为凑数硬切、不为省事不切；数量与时长是**结果**（MAXDUR=30 时 5–8 镜、每镜 2–5 秒），紧张偏多镜、慢暗涌偏长镜。🔴 下限见 MAXDUR 表；真正一镜到底须在 prompt 明写\"单镜不切\"并说明理由。时间轴用全片连续绝对时间、每段标注切分动因。\n- 🔴 **四轨强制**，时间轴每段必写：\n  1. **主体动作**：从故事 Action 继承（不临时编）=动作+动机+过程分解（\"停下转身\"→脚步渐停/肩膀先转头跟上/目光定住）。\n  2. 🔴 **情绪外化**：面部(眉眼/嘴角/呼吸)+微表情停顿(迟疑/目光飘移后归位)+肢体(肩颈松紧/手指小动作/重心偏移)。🎭 用角色表演基调的标志性小动作。⚠️ 具体到可演（非\"表情紧张\"而是\"喉结滚动、指节抵桌沿泛白\"），要有层次转折（递进/克制/决堤），停顿是绷紧非松弛。💡 2.5 表演收敛、微表情可读——写细微层次，不用瞪眼皱眉张嘴去\"保证看得出来\"。\n  3. **镜头运动**：运镜库选 1 个，写类型+速度+方向。\n  4. **介质/环境动态**：风/光尘/雨持续运动。\n- **人物实体性**：全程实体清晰，不溶解/半透明/消失/被光或环境吞没。\n- 🔴 **风格来源 = 场景图（及道具、角色图），禁挂 moodboard**：场景图已在图像层吃过 moodboard，视频忠实参考场景图即继承其风格；跨镜共用同组参考、气质不漂移。发任务前逐条核对参考清单里没有 moodboard。\n- 🔴 **参考纪律**：硬上限 30 图/10 音频（🔴 视频参考不用），**实用 3–8 条**（场景图 1 + 出场角色分屏图 + 关键道具 +（可选）声线音频）。每条必须写明用途，不写用途的不挂。🔴 **一律不挂 @视频 参考**（既不作续写源、也不作运镜参考），视频阶段只吃图与可选声线音频。\n- 🔴 **绝无 BGM**：只出环境音+对白（+旁白），禁配乐/音效垫乐、禁音乐类 @音频 参考；负面词须含\"背景音乐、配乐\"。\n- 🎙️ **双人声轨（③/④）**：对白=带口型轨，旁白=画外不带口型轨；④在时间轴给两轨各自分配时间段（旁白填对白空隙、不同时出声），同一条 prompt 一次写清；跨条声线须保持一致。\n- 🔴 **语言锁**：每条 prompt 常驻\"对白/旁白一律用选定语言，模型补话也只用此语言，禁其他语种台词/字幕/口型\"。⚠️ 只锁片内口语，不改 prompt 本身的书写语种。\n- 🔴 **别摊平**：时长翻倍是分镜数上抬、非每镜变长；检查有无\"为填满时长而拉长的空转段\"。同一动作跨镜须状态离散变化、节拍间不留空转。\n\n## 剧本\n\n- 🔴 **默认节奏 = 紧张压迫递进**：首场即带悬而未决的张力，逐场升级不泄压；场与场压茬推进、信息克制；结尾开放不给解答。张力来自\"处境不对劲/关系在崩/某事将至\"的暗涌，非情节反转或悬疑解谜。\n- 🎬 **可选慢暗涌**（伊尼舍林/Aftersun/伯德小姐一路）：长呼吸、留白、日常细节堆叠，张力在平静下渗出；\"快而紧\"让位，仍守情绪优先+开放结尾+拒绝说教。🎥 此范式优先用 MAXDUR 长镜做\"一镜到底凝视\"（缓推/缓移/微环绕不切）。\n- ⚠️ **一片一节奏**：开头即定\"紧张压迫\"或\"慢暗涌\"，全片统一（可有局部骤停/爆发对比，主基调唯一）。\n- 节奏与 emotional arc 对齐并传导到切分与运镜；只影响事件密度，不改\"按内容事件切\"。\n- 💬 **对白（②/④）**：🔴 两人以上同场或有交流动机处必写实际台词，别把人物写成哑巴；对白量按场景定，每句标说话人。🎭 生活化、口语、简短；🔴 **留潜台词**（答非所问、说半句、用琐事包裹心事）；**反金句**：不写总结主题或解释情绪的台词（\"我很难过\"禁用），改用具体的话或沉默带出。\n- 🎙️ **旁白（③/④）**：克制私密如写给自己，非全知解说、不复述画面。🔴 文本在剧本阶段写定、随视频烧录，不留后期。\n- 🔴 **段落写作**：一条任务承载\"一个完整情绪小起落\"（铺垫→推进→转折→未解的收束），非把短镜硬拉长；台词密度按实际时长配，停顿与静默同样占时长。\n\n## 画幅 · 模型\n\n- 默认：moodboard 16:9、人物分屏 16:9、场景图与视频 21:9；可选 21:9/16:9/9:16/3:4，用户指定优先。🔴 直接以目标比例出图铺满，禁黑边凑比例。\n- 分辨率：视频 480p / **720p（默认）** / 1080p（仅此三档）；图像 2K。用户指定优先，未指定走 720p。🔴 选 1080p 须执行高分辨率反噬条款。\n- 模型：图像 lib image（备选 Seedream 5.0 Pro / Nano Banana Pro / Nano Banana 2）；视频 **Seedance 2.5**。\n- 🔴 **模型闸门（禁静默降级）**：每条视频任务显式传 **入口⓪用户选定的模型**，并核对返回结果中实际使用的模型。若该模型不在工具列表或调用被回落 → **停下来告知用户\"未找到 \\[⓪所选\\]，实际可用为 X，是否改用\"**，列出可用模型请其选择，**绝不自行改用其他模型继续生成**；改用后按下表重设 MAXDUR 并回第 2 步重切段落。全自动模式（②）不豁免此确认。\n- 🔴 **换模型即换能力档，全流程按新档重算**（MAXDUR 变则回第 2 步重切段落）：\n\n模型 MAXDUR 参考素材 跨段接法 Seedance 2.5（⓪默认） 30s 30 图/10 音频（🔴 不用视频参考） 拆条 + compose Seedance 2.0（⓪可选） 15s ≤7 图 拆条 + compose Kling O3（不在⓪选项内，仅当用户在闸门处同意时） 15s（常见封顶 10s） 按平台，通常远少于 30 拆条 + compose\n\n⚠️ **Kling O3 特别注意**：单次上限 3–15s，把 30s 时间轴发给它必然被压缩或截断；它还倾向自动生成 BGM，负面词里的\"背景音乐、配乐\"必须写足并逐条自查。\n\n## 人物铁律\n\n- **锁质感、放身份**：胶片质感是硬约束；发色/发型/服装/亚文化造型尊重用户设定。\n- **人种默认**欧美或亚裔欧美，用户指定优先。\n- 🔴 **性别必分配（含机器人/AI/类人）**：每个有戏角色定明确性别（男/女），同时锁视觉倾向与配音声线，全片一致不变声，写入角色资产。\n- **皮肤真实**：毛孔/纹理/自然油光，禁塑料脸与数码硬锐（高分辨率下加倍强调）。\n- **角色资产 = 左右分屏单图**：左半幅全身三视图（正/侧/背），右半幅面部细节；纯白背景、棚拍布光、中性姿态、无道具。\n- 🔴 **人物图不带道具**（贴身服装不算）；🔴 **儿童安全**：低龄/学龄角色禁组合使用具体年龄数字、身体围度描述与成人化着装，一律用学龄气质词。\n- 🔴 **分屏模板（照填，只换 \\[\\] 占位，禁改结构与质感尾词）**：\n\n```\n角色参考图，纯白无缝背景，左右并排分为两半幅。左半幅：同一角色全身三视图，并排呈现正面、侧面、背面三个视角的全身站姿，正面朝向清晰、露出穿着鞋履的双脚（默认穿鞋、鞋型与服装搭配）、中性放松姿态，用于锁定体态、服装与发型。右半幅：角色面部细节特写，清晰呈现脸型、五官、眼神、年龄与皮肤纹理，表情中性自然、平静放松（可有角色气质但不夸张），用于锁脸。时尚摄影棚布光，纯白背景上干净均匀的柔光。真人实拍级真实感，角色为[角色身份与气质]，真实人类皮肤带可见毛孔、自然纹理与微弱自然油光（非磨皮、非塑料、非精修），[体态]，[发型与发色]，[服装（含鞋履）]，[神态与眼神]，不带任何道具、背包或手持/佩戴饰品，天然胶片颗粒，16mm/35mm 胶片拍摄，自然胶片皮肤呈现，各视图为同一角色保持一致，非动漫、非 CGI、非 3D 渲染、非塑料皮肤、非过度磨皮\n```\n\n负面：`磨皮塑料脸、油亮偶像滤镜、锐利数码渲染、过度磨皮、数码高清硬锐、4K 数码干净感、无颗粒的塑料清晰度、CGI、动漫、3D 渲染、插画、卡通、背包书包手持物饰品道具、赤足、未着鞋履（除非场景明确要求）、面部不一致、换成另一个人、多个不同角色、左半幅出现面部特写、右半幅出现全身、缺少三视图中任一视角、三视图并非同一角色、过度夸张的表情、大笑狰狞惊恐等极端表情、扭曲面部、复杂背景、影棚灯架穿帮、水印`\n\n## 参考库（方向锚点，可点名或融合，共享底层 DNA）\n\n> 🔴 **风格与故事弱解耦**：卡片只给**视觉气质**（色调/光感/质感/构图/情绪基调），只继承这些。卡里的题材/人物关系/年代/地点属原片故事内容，**可参考不照搬**——故事人物场景由⑤决定。例：选 Aftersun 风格但没说要父女故事，就只取暖黄褪色回忆感，绝不默认写成父亲与小女孩。\n\n- 🏢 **REF 1｜后室（暖黄液限·电影级胶片恐怖，招牌，必出高水准）**：🔴 配色锁死奶油黄主导、褪色低饱和暖调、不引入冷调；电影级、非伪纪录片/VHS 梗。用户一提后室无条件套此卡。 `无尽的液限办公后室，奶油黄的墙面与地毯，均匀漫射的柔和顶灯（非刺耳嗡鸣日光灯），强烈单点透视对称纵深收束至灭点，暖调褪色低饱和的黄色调，35mm 胶片颗粒带柔光晕（halation），轻微的洋红-绿胶片扫描偏色，固定或缓慢的沉稳机位，安静的不安，电影级，非伪纪录片、非 VHS`\n- **REF 2｜机械姬（冷调极简科技）** `荒野中的极简现代主义玻璃别墅，冷峻干净的科技美学，透过玻璃的自然光加冷调人工光，冷蓝灰配暖木色点缀，几何对称，安静而不安的静止感，克制`\n- **REF 3｜龙虾（冷调荒诞·阴郁对称）** `阴郁的爱尔兰自然光，冷灰绿低饱和色调，荒诞设定下的克制与疏离，精密对称构图，阴天柔散光，静止或缓慢的对称机位，面无表情的冷峻黑色幽默，荒诞与日常并置，细颗粒胶片感`\n- **REF 4｜Aftersun（暑期回忆 + DV 双质感）** `阳光浸染的 也禁挂任何 @视频 参考（不做续写、不做运镜参考）。\n\n[全局] A24-DNA：真人实拍级、真实胶片颗粒(16mm/35mm)、情绪优先、节奏快而紧绷、亲密与不安并存、光源动机化。\n+ 选定 REF 的核心光色与辨识点 + 总时长与分镜数（如\"本条 30s，分 6 个分镜\"，须 == 提交的 duration）+ 分辨率对应的颗粒强调。\n\n[绝对时间轴 · 多分镜] 按内容事件切分（动作节拍/情绪转折/变景别视角/焦点转移）：\nt0–t5s【分镜1｜切分动因：…】\n  · 人物动作（继承 Action，过程分解）\n  · 人物情绪（面部/微表情/肢体，写层次变化）\n  · 构图 + 视角（景别/机位高度/角度）\n  · 镜头运动（运镜库选1个，类型/速度/方向）\n  · 介质动态（风/光尘/雨）\n  · 声音（环境音；有台词标说话人 + 引号内台词，用⑧语种）\nt5–t9s【分镜2】／t9–t14s【分镜3】／t14–t19s【分镜4】／t19–t25s【分镜5】／t25–t30s【分镜6】 同上六项，末镜落张力顶点或骤停凝视、收在未解处。\n（🔴 末段 == 提交的 duration：MAXDUR=30 写到 t30s，=15 则改 3–4 镜写到 t15s，绝不把 30s 时间轴发给只吃 15s 的工具。段长不必均等——按内容切的正常结果。）\n\n[画面风格] 可见真实胶片颗粒结构(16mm/35mm) / 真实皮肤毛孔非塑料 / 情绪化用色(按 REF，≤3 主色) / halation / 低对比胶片曲线 / 浅焦亲密 / 光源动机化 / 轻微暗部噪点与色彩偏移。\n\n[负面提示词] 动漫、CGI、卡通、插画、3D 渲染、塑料皮肤、过度磨皮、数码高清硬锐、4K 数码干净感、无颗粒的塑料清晰度、过度清晰锐利、HDR 观感、10bit 过度平滑、商业广告级光洁、默认黄褪色调、均匀橙色滤镜、黑边遮幅、letterbox 黑条、pillarbox、上下黑边、画面内影棚灯具、灯架穿帮、静止的雾/尘、人物呆站不动、静止凝固的场景、人物溶解、人物半透明、人物消失、人物融进背景或光里、僵硬锁死的机位(除非骤停凝视有意为之)、无意义炫技快切、为填满时长的空转段、过度锐化、假 HDR、多余人物、文字水印、自动生成字幕、背景音乐、配乐、音效垫乐、其他语种台词、混合语言口型。\n[语言锁] 对白/旁白一律用选定语言，模型补话也只用此语言，禁其他语种台词/字幕/口型。（仅约束片内口语；prompt 描述文字用会话语种。）\n```\n\n## 生成后自查（不达标则重做）\n\n**质感**：真实胶片而非 CGI/塑料磨皮？1080p 下颗粒、halation、低对比仍在？皮肤有毛孔纹理？ **气质**：情绪在场且优先于信息？节奏紧、张力递进不泄压？亲密与不安并存？光源动机化、无灯架穿帮？配色避开默认黄褪色？原创非复刻？后室够液限、透视收束灭点、非 VHS 梗？ **画面**：人物实体清晰、动作挂动机、情绪外化到身体？介质在动？铺满整帧无黑边？场景图纯空镜绝无任何生物（含背景群演）？剧本用到的门/窗/楼梯都在场景图里？ **结构**：参考清单里没有 moodboard？已按⓪确认模型、时间轴末段 == 提交的 duration？分镜数达该档下限、按内容事件切而非拉长空转？参考里没有任何 @视频（没走续写）？跨条的脸/服装/光位/色调/声线不漂移？忠实参考场景图？ **声音**：只含环境音+人声、绝无 BGM？@音频 参考没混入音乐？", "extras": [], "cn": "A24电影美学"}, {"slug": "absurdist-comedy-maker", "desc": "将任意主题转成无厘头创意短片，支持剧本改写和照片玩梗。", "body": "# Japan Camedy Film\n\n把创意变成 **一条 Seedance 2.0 直接可粘贴的编号分镜式 prompt**。先用下面的「分析框架」对齐风格，再按工作流产出。\n\n---\n\n## 分析框架（这类视频的三块底座）\n\n### 1. 风格本质\n\n- **核心机制**：以精致考究的复古影像，营造一个看似正经的情境；前后转折的强烈落差即为笑点，铺垫越像正剧，反转越有冲击力。\n- **视觉来源**：整体借用二〇〇〇年前后日本流行文化，融合该时期的电影、音乐录影带、广告与时尚杂志；兼收 Y2K、洛丽塔、视觉系等街头风格。不绑定单一作品。\n- **表演基调**：始终克制而认真，人物一本正经、毫不出戏，以此为结尾的荒诞铺垫。\n\n### 2. 画面元素\n\n- **色彩与质感**：轻微胶片质感与颗粒，色彩中间调，饱和度低，整体色调偏一点点蓝。\n- **光线和氛围**：外景白天多为自然光，夜晚/室内多为环境光；**人物面光自然柔和、无阴影**（这是固定原则）。\n- **场景布置**：繁复且充满复古细节。室外——街道、公园、校园；室内——日式和室、老派咖啡馆、悬挂红灯笼的居酒屋、乡间庭院等。\n- **人物造型**：符号鲜明、辨识度高，一眼看出性格。常见：洛丽塔少女、校园学生、视觉系青年、上班族、和服造型等。**服装按\"角色身份 + 所处场景\"重新设定，不沿用参考图/角色原本的服装**。\n- **镜头语言 + 特效**：多为固定镜头，少量推拉摇移跟镜，无炫酷运镜。**反转主要靠硬切 + 表演完成**；若用到特效，须融进真实画面、共用同一套光线材质颗粒、无合成边（不跳脱），不抢戏。\n\n### 3. 剧情内容\n\n- **三段式叙事**：先认真铺陈一件日常小事 → 将表情/动作层层放大（常借超慢动作）→ 通过一次**硬切或表演的急转**完成反转 → 反转后以一个面无表情的停顿收尾。\n- **故事结构**：极简，一条短片只承载一个笑点；大体不外乎\"人物在做一件平常的事，随后发生意外\"。\n- **常见反转方式（七类，均为真人情景、不靠魔幻变形）**：① 情绪急转（**须有前因后果、不能莫名其妙**）② 身份反转 / 反差萌（凶大佬其实怕猫、柔弱少女实为拳击冠军）③ 反高潮（郑重铺垫一件大事，落点却极小）④ 对话反转（一句台词翻转全场）⑤ 尴尬反转（脚趾抠地的社死 / 冷场）⑥ 攻守逆转 / 反客为主（气势强的一方突然崩、弱的反压）⑦ 小题大做 / 尺度反转（用史诗级慢镜配乐去做一件极小的事）。「层层嵌套」是结构、不是类型：任一类都能再叠一轮。笑点可由对白、表演或特效任一承载；**反转主要靠硬切 + 表演完成**。\n- **人物关系**：多为一对性格相反、形象差距大的搭档（一强一弱、一动一静）；冲突在结尾以荒诞反转化解或逆转。\n\n---\n\n## 工作流\n\n**Step 1 · 输入**：用户给一句话点子；做广告可上传产品图 + 卖点。入口三选一：从零（走引导：场景 / 角色 / 反转三问）/ 已有点子（只补缺项）/ 反推参考视频（先抽帧看节拍再仿写，不凭空描述没看过的画面）。\n\n**Step 2 · 产品处理（上传了产品图才做）**：立刻生成产品**三视图 + 细节特写**，锁定 `{Product1}` 保全片一致、清晰露出；并问清**核心卖点 1–3 个**（第 1 步已写则不问）。**红线**：段子须正向凸显卖点，**不得虚构 / 夸大 / 贬低 / 污蔑产品**，笑点不落在产品缺点上、须符合真实卖点。\n\n**Step 3 · 一次性问完可提前选项**（用 `ask_human`，能不追问就不追问）：时长 **15 / 30 / 60s** · 目的（涨粉 / 带货 / 品牌）· 创意手法（七类反转选一，或\"你帮我定\"）· 投放场景（抖音 / 小红书 / YouTube…）· 语言（日语 / 中文；选中文再选**中国场景 / 继续日本场景**）· 字幕（中文 / 中日 / 中英，**生成时不烧、成片后合成时加**）· slogan（可选）。\n\n**Step 4 · 形象与画面**：模特形象——先问 **① 我生成三视图 / ② 你上传**（生成则每人一张、左→右 **面容特写 ｜ 全身正面 ｜ 全身背面**、换装后）；出场景图 `{Scene1}`（16:9、白平衡中性不偏黄）；风格种子（复古日影 / 中式复古，色彩中性不偏黄、面光柔和无阴影）；服装按\"身份 + 场景\"重设、不沿用原服装。三视图 / 场景图作参考图喂回，绑 `{roleN}` / `{Product1}` / `{Scene1}` 保一致不穿帮。\n\n**Step 5 · 设计段子 + 套画面**：三段式（认真铺垫 → 层层升级 → **硬切 / 表演急转**反转 → deadpan 余韵）落到编号镜头，用所选反转、配性格相反的搭档；写清\"怎么演\"；对白按所选语言**只说、不烧字幕**；节奏紧凑无废镜。画面按定调补全（面光柔和无阴影 / 复古场景 / 重设服装 / 固定机位为主 / 特效不跳脱）。\n\n**Step 6 · 出分镜 prompt → 满意即生成 → 合成视频**：出 prompt（整条**中文**、**16:9**、首句固定 `画面内容请参考场景氛围图 {Scene1}`、含 `{roleN}` 与产品露出）；**整段直出、每 15s 为一个片段生成**（片段内部分镜交模型自动切、不锁死机位）：15s = 1 段，30s = 2 段，60s = 4 段；**逐段续接**（后段以前段末帧 / 同一 `{roleN}` 参考接上），先出一段、确认后再续下一段，全程 `{roleN}` / 服装 / 光线 / 场景一致不穿帮。出完问\"满意 / 要改\"——**满意 → 直接调用已连接的视频生成连接器以 16:9 发起生成**，不用手动；再**合成视频**：叠字幕（Step 3 所选）+ 旁白 + slogan / 产品结尾露出（剪辑或 `ffmpeg`）；无工具则交付 prompt + 字幕文本 / SRT。\n\n## 锁定风格块（生成时原样使用）\n\n> 经验有效的**驱动模型**的措辞。**成片 prompt 整条用中文，故用下面的 ZH 版作风格层**（EN 版仅备查）。**色彩定调：浓郁但白平衡中性、不偏黄/不过暖（中间调、略偏一点冷），避免整体发黄。** **若选中国场景**：把风格锁定句里的\"Y2K 日本电影\"替换为\"千禧年前后中式复古影像（国产老剧 / 港片质感）\"，色彩、面光、胶片质感原则不变。\n\n**EN：**\n\n```\nFully reference the colour grading and scene set of the Y2K Japanese film. A\ncinematic masterpiece, retro Y2K Japanese movie aesthetic, raw 35mm film stock\ntexture with strong contrast, rich colours with a neutral white balance (no overall\nyellow/warm cast, slightly cool mid-tones), nostalgic film grain, soft lens flare,\n2000s cinematic lighting, soft and even light on\nfaces with no harsh shadows.\n```\n\n**ZH：**\n\n```\n完全参考 Y2K 日本电影的色彩分级与场景设置。电影杰作，复古 Y2K 日本电影美学，\n原始 35mm 胶卷质感，强对比，色彩浓郁但白平衡中性、不偏黄不过暖（中间调、略偏一点冷），怀旧胶片颗粒，柔和镜头光晕，\n2000 年代电影灯光，人物面光柔和均匀、无生硬阴影。\n```\n\n---\n\n## 完整范例（反高潮 + 攻守逆转 · 中文 prompt，对白只说、不烧字幕，16:9）\n\n```\n画面内容请参考场景氛围图 {Scene1}。\n完全参考 Y2K 日本电影的色彩分级与场景设置。电影级复古日影质感，原始 35mm 胶卷质感，强对比，色彩浓郁但白平衡中性、不偏黄不过暖（中间调、略偏一点冷），怀旧胶片颗粒，柔和镜头光晕，人物面光柔和均匀、无生硬阴影。16:9 横屏，老派居酒屋、红灯笼暖光、复古细节繁复，肤白无瑕；服装按场景重设。本片为严格的多镜头序列：\n1. 中景（缓推、超慢动作）：气场强大的大佬 {role1} 神情肃杀，缓缓卷起袖子、拿起一把菜刀，眼神凶狠，气氛剑拔弩张。\n2. 特写：{role1} 屏息凝神，刀锋映着红灯笼的光，郑重得像要大干一场。\n3. 【硬切】到俯拍特写：砧板上——他一丝不苟地把刀切向……一根黄瓜，切成整齐薄片摆进小碟（反高潮）。\n4. 过肩中景：对面瘦小的店员 {role2} 怯怯开口，用日语说\"…不用切得这么认真啦\"。\n5. 反应特写：{role1} 猛地抬眼、气势回笼，狠狠瞪向 {role2}。\n6. 中景：{role2} 却面无表情、慢悠悠回一句日语\"…刀工不行\"（攻守逆转）。\n7. 反应特写：{role1} 表情一僵、气势瞬间垮掉，讪讪低头继续切菜；{role2} 淡定端走那碟黄瓜。\n人物动作自然连贯、彼此同步；节奏紧凑，每一镜都在推进笑点。\n```\n\n---\n\n## 通用约束\n\n- 整条 prompt 用中文撰写；对白按 Step 1 所选语言、**只说不烧字幕**；字幕在 Step 6 成片后合成时按用户所选（中文 / 中日双语 / 中英双语）加；包在可复制代码块。\n- 角色用 {roleN}，首现写全、后续复用、互动主宾清晰；**服装按角色身份+场景重设，不沿用原服装**。\n- 表演写清楚（怎么演）；**笑点可由对白、表演或特效任一承载**；对白只说不烧字幕、简短自然；剧情推进紧凑无废镜。\n- 固定机位为主；反转主要靠**硬切 + 表演**；若用到特效务必不跳脱（共用光线材质颗粒、无合成边）。\n- 一条短片承载一个反转（层层嵌套算其延伸）；常配性格相反的搭档。\n- 15s 一条直出；30s 先出前 15s、确认后再续后 15s；60s 分四段续接；全程不穿帮。\n- 产品广告：先问清卖点；段子须正向凸显卖点、产品清晰露出；**不得虚构/夸大/贬低/污蔑产品**，笑点不落在产品缺点上、须符合产品真实卖点。\n- **内容道德红线（务必遵守）**：不得包含色情、性暗示、裸露；不得包含暴力、血腥、打斗伤人、武器伤害、犯罪教程；**不得出现纹身**；不得涉及死亡、自杀、自残、尸体、灵异惊悚等；不美化烟酒毒品；不涉及仇恨、歧视、政治敏感。笑点只落在情境、表演与反差上，保持轻松、适龄、无害。\n- 不做涉及真实公众人物的内容；保持适当无害。", "extras": [], "cn": "无厘头喜剧"}, {"slug": "acong-style-extractor-0", "desc": "参考图提取可迁移风格", "body": "# 主体可替换风格提取\n\n## Skill 定位\n\n本 Skill 用于从参考图片中拆分出两类信息：\n\n1. **主体/内容提示词**：描述画面中可被替换的核心内容。\n2. **风格提示词**：描述可迁移、可复用的视觉风格。\n\n它不是普通的图片反推提示词。默认目标不是 1:1 复刻原图，而是在保留视觉风格的前提下，支持用户替换主体、重组场景或生成新的画面。\n\n## 适用场景\n\n当用户出现以下需求时使用本 Skill：\n\n- 上传参考图，希望提取这种风格；\n- 上传参考图，并要求“换成 XXX”；\n- 上传参考图，并要求“用这种风格生成新的画面”；\n- 需要把参考图拆成“可替换主体”和“可复用风格”两部分。\n\n## 输入\n\n用户可以提供：\n\n- 一张参考图片；\n- 可选的新主体、新画面需求或替换说明；\n- 可选的保留要求，例如“背景不变”“只换人物”“构图不变”。\n\n## 核心原则\n\n- 默认用于二次创作，不用于复刻原图。\n- 主体/内容提示词只描述可替换内容。\n- 风格提示词描述可迁移视觉语言，也可以保留具有风格价值的视觉母题和空间语法；不要绑定原图中的具体人物、商品、车辆、动物、站台、轨道、交通设施等具体主体或物件。\n- 当用户同时提供参考图和新画面需求时，以用户的新画面需求作为主体/内容提示词，参考图只作为风格来源。\n- 如果用户只说“换成 XXX”，默认理解为全量替换原主体/内容；保留参考图的视觉风格、视觉母题和空间语法，但不默认保留原图具体场景、具体设施或具体物件组合。\n- 只有用户明确要求保留场景、背景、空间结构或世界观时，才迁移参考图的场景骨架。\n- 不默认输出负面提示词，除非用户明确要求。\n- 不默认输出可迁移性分析，避免流程变长。\n- 输出语言使用中文。\n\n## 迁移模式判断\n\n本 Skill 有两个迁移模式。先判断迁移模式，再提取主体/内容提示词和风格提示词。\n\n### 默认模式：风格与视觉母题迁移\n\n当用户说：\n\n- “保留这种风格”\n- “参考这张图的风格”\n- “用这种风格生成……”\n- “我想要这种感觉，但是画面改成……”\n- “把主体换成 XXX”\n\n默认只迁移参考图中的视觉风格、视觉母题和空间语法，不迁移原图具体主体、具体物件、具体场景身份或具体设施组合。\n\n默认可迁移内容包括：\n\n- 风格类型；\n- 色彩特征；\n- 光影特征；\n- 材质/质感；\n- 氛围情绪；\n- 构图/镜头语言；\n- 具有风格价值的视觉母题和空间语法；\n- 画质/渲染方式。\n\n视觉母题 / 空间语法指参考图中具有风格辨识度、且在替换主体后仍然成立的视觉组织方式，例如：\n\n- 反复出现的形状语言；\n- 标志性的线条走势；\n- 空间层次组织方式；\n- 材质组合方式；\n- 建筑、自然、人物或物体之间的视觉关系；\n- 画面中的节奏感、对称性、纵深感或装饰语言；\n- 具有风格辨识度但不等同于具体主体的场景语法。\n\n例如，当参考图是未来主义玻璃科幻风时，可以提取“流线型弧形结构、通透玻璃空间、香槟金属框架、镜面反射空间、乌托邦式未来感”等视觉母题。\n\n默认不迁移内容包括：\n\n- 原图具体人物、车辆、动物、商品；\n- 原图具体主体或物件，例如“胶囊列车”；\n- 原图具体设施，例如“站台”“轨道”“具体交通设施”；\n- 原图具体场景身份，例如“交通站台”“某个未来城市街区”；\n- 原图具体物体组合，例如“列车停靠在玻璃轨道旁”；\n- 原图世界观元素，除非用户明确要求保留。\n\n### 场景骨架迁移模式\n\n只有当用户明确说：\n\n- “保留这个场景”\n- “背景不变”\n- “保留这个世界观”\n- “保留这种空间结构”\n- “保留这个未来城市场景”\n- “保留这个城市背景”\n- “保留这种建筑空间结构”\n- “只换人物/主体，其他不变”\n- “按这个场景生成……”\n\n才允许把参考图中的场景骨架、空间结构、建筑语言、世界观元素写入主体/内容提示词或相关描述中。\n\n## 工作流程\n\n### 1. 判断用户意图\n\n根据用户输入选择处理方式：\n\n- **只提取**：用户只提供参考图，未指定新主体或新画面。\n- **替换主体**：用户要求保留风格，把主体换成新的对象。\n- **风格迁移生成**：用户要求使用参考图风格生成一个新的画面或情境。\n\n同时判断当前任务是默认风格与视觉母题迁移，还是场景骨架迁移。若用户没有明确要求保留场景骨架，按风格与视觉母题迁移处理。\n\n### 2. 提取主体/内容提示词\n\n主体/内容提示词应包含：\n\n- 具体对象；\n- 关键动作；\n- 关键空间关系；\n- 必要的场景关系。\n\n主体/内容提示词不应包含：\n\n- 风格词；\n- 色彩、光影、材质、渲染方式等风格信息；\n- 不影响二创成立的琐碎细节；\n- 过细的位置关系。\n\n在默认风格与视觉母题迁移模式下，主体/内容提示词应以用户的新需求为准，不要自动继承参考图原有具体场景。\n\n例如用户说“我想要这种风格，但是生成两个人对峙”，主体/内容提示词应类似：", "extras": [], "cn": "主体风格提取"}, {"slug": "action-previs", "desc": "火柴人打草稿，一键出连续动作大片", "body": "# action-previs\n\n做动作导演预演(PREVIS)时用本 skill。专攻**动作编排 previs**——火柴人动作分镜+角色三视图→逐板连续动作视频,重点处理动作节拍、板间镜头衔接、角色一致性、多板连续性。\n\n> 本环境适配:GPT Image 2 → `generate_image_v3`(火柴人分镜/场景图 2K);Seedance 2.0 → `generate_video_v3`(全能参考、逐板≤15s);`resource_prepare_and_analyze` → `analyze`;`text_editor` → `write_file_v2`;`video_assembler` → `composite_video`;`<<<image_x>>>` → `reference_nodes`+`{{NodeKey}}`;角色一致 → 三视图注册持久锚点。生成失败**不自动换模型**语义:分镜图 GPT Image 2 失败可切 Nano Banana Pro 兜底(同类图像能力);视频 Seedance 失败则停任务、向用户说明、问是否换工具。cards/reply_to_user 交互 → 对话式暂停+选项枚举。\n\n## 工作模式(优先询问,必须用户确认、不得自动降级)\n\n- **模式 A 构思→分镜→视频**:用户给动作构思 → 先生成火柴人 PREVIS 分镜图,确认后再生成视频。\n- **模式 B 分镜→视频**:用户已有 PREVIS 分镜图 → `analyze` 逐张逐帧解析后对齐 Storyboard,跳过分镜生成直接进视频。判据:会话开始直接上传分镜图或明确\"我已有分镜\";**不得因未上传而自动降级为 A,模式必须由用户确认**。\n- 任一模式:用户给了角色三视图立即 `analyze` 并注册为角色 key_element;未给则在视频生成前提示上传。场景图入口同步确认(已提供/需生成/暂无——暂无则视频仅依赖分镜图+三视图)。\n\n## 流程与依赖\n\n1. **锁规格**(`write_file_v2`):项目名/总板数/比例(默认 16:9)/分辨率(默认 720p)/视觉风格锁定(极简火柴人 PREVIS 手绘风)/每板时长上限 15s。\n2. **分析输入并立即注册资产**(`analyze`+`generate_image_v3`):模式 A 分析三视图/场景图(分镜尚未生成);模式 B 对所有分镜图逐张逐帧结构化解析输出每板\"Storyboard 映射\",再分析三视图/场景图(顺序:分镜→三视图→场景,全部完成后统一汇总)。**关键规则——分析后必须立即注册**(不推迟):三视图→注册 asset_id→绑 element character、场景图→绑 element scene、模式 B 分镜图→绑 shot(Storyboard 未建先注册记录映射待建后补绑);输出资产注册清单(素材名→asset_id→绑定目标)供核对,无法匹配的标 `[待绑定]` 并提示确认归属。\n3. **建 Storyboard**(`storyboard_designer`):模式 A 预建 shot 占位(留空待生成后绑定)+建 element character/scene;模式 B 逐板填入映射输出,按识别角色数建 element character、按连续性预判推断场景切换建 element scene。\n4. **生成火柴人分镜图**(模式 A,`generate_image_v3`,GPT Image 2,2K):每板≤8 连续画格、2×4 网格、统一画幅;每板生成后暂停确认。\n5. **场景图**:已提供则注册绑定;未提供按 element scene 描述生成(2K),生成后暂停确认。同一场景多板复用只生成一张、统一绑定。\n6. **绑定资产**:确认的分镜图/三视图/场景图 asset_id 分别绑到对应 shot/character/scene。\n7. **逐板生成动作视频**(`generate_video_v3` 全能参考):每板生成后暂停审阅确认再下一板。\n8. **合成**(`composite_video`):按 Storyboard 顺序拼接,处理板间衔接、音频对齐。\n\n**依赖关系**:3→1;4→3;5→3;6→3,4,5;7→6;8→7。\n\n## 多板批量顺序控制(5 板及以上)\n\n- **严格顺序生成**:Board 1→N 逐板,禁并行/乱序;每板确认后才将其 final_shot 纳入下一板参考候选池。\n- **奇偶分段策略(≥10 板启用)**:拆 5 板一组(1–5、6–10…),每批逐板确认后做一次批次间一致性预检(角色位置/外观/场景),出预检摘要、修复问题再推进下一批,避免问题累积到装配爆发。\n- **中途问题处理**:①质量不达标(外观飘移/节拍错序)→立即暂停不续,展示问题+修复方向(参考权重/提示词/换参考),确认后重生当前板;②衔接断层(位置/朝向与上板末帧不一致)→提示词加强制起始位置约束重生,两次仍断层则让用户选(接受跳切标记装配处理/上传过渡帧作 start_frame/改衔接备注重试);③连续 3 板同类问题→判系统性,暂停批次说明根因(三视图权重不足/描述模糊),补高质量三视图或改 element character 后从首板重生;④单板失败→跳过继续、保留待处理列表,全部完成后统一重试,禁空板进装配。\n\n## 暂停点结构化摘要(每点须展示内容+决策选项,不得只出\"是否继续?\")\n\n- **暂停点 1(规格锁定后)**:展示 项目名/总板数/比例/分辨率/视觉风格/每板时长上限/场景图来源(用户提供/需生成/暂无)。选项:①确认进 Storyboard;②修改某项参数。\n- **暂停点 2(每张分镜图生成后,模式 A)**:展示 板编号(Board 1/N)/生成图预览/该板帧编号(F1–F8)+简要动作节拍。选项:①确认续下一板;②调描述重生;③跳过(标\"待补充\"先续)。若已上传场景图未确认绑定,此处同步确认。\n- **暂停点 3(所有分镜图+场景图就绪、Storyboard 建毕后)**:展示 完整 Storyboard 摘要——所有 element character(含来源:三视图/待上传)、element scene(含来源:用户提供/生成/暂无)、shot 列表(板编号+核心动作一句话)、已绑定资产清单。选项:①确认进逐板视频;②改某 element/shot 描述;③**若有标\"待补充\"的 element character 缺三视图,此步强制暂停必须等上传后才继续**。\n- **暂停点 4(每板视频生成后)**:展示 板编号/时长/参考输入列表(分镜图/各三视图/场景图 asset_id、是否用了上板 reference_video)/板间衔接备注执行情况。选项:①确认续;②重生(说明调整方向:镜头运动/动作节拍/角色外观/其他);③接受但标记装配阶段人工处理点。\n- **暂停点 5(所有板生成完毕、装配前)**:展示 全部 final_shot 列表(板编号+时长+是否有标记问题点)、总时长合计、一致性预检摘要(角色位置跳切/场景飘移/外观飘移数量及位置)。选项:①确认进装配;②定向重生某板;③接受现有问题直接装配(蒙太奇跳切意图明确时)。\n\n## 分镜图逐帧解析(模式 B 核心,`analyze`)\n\n逐张分镜图执行结构化解析,输出须可直接映射为 Storyboard shot 字段:\n\n**① 画格清点与布局**:统计画格数(≤16),确认排列(4×4 或其他);无编号则按从左到右、从上到下自动标 F1–FN 并注明;分辨率过低/画格模糊逐一标受影响帧编号+可信度(\"可解读/部分可解读/无法解读\"),**无法解读的帧不得臆造,保留空位标 `[待用户补充]`**。\n\n**② 逐帧结构化提取(每帧必含全部字段)**:\n- **帧编号** F1–FN(自动或引用图内标注)。\n- **景别**:从 EXTREME WIDE / WIDE / MEDIUM / MEDIUM CLOSE-UP / CLOSE-UP / EXTREME CLOSE-UP 选最接近一项;图内有标注则引用并括注映射词(如 \"WS → WIDE\")。\n- **镜头运动**:推/拉/摇(方向)/跟/俯拍/仰拍/静止;依画内箭头、标注文字或透视线推断;无法判断标\"静止(推断)\"。\n- **主动作节拍**:主动方(火柴人)核心动作,\"部位+运动方向+幅度\"格式(如\"右臂向右上方大幅挥出\");有速度感线/拖尾线则加 `[速度感:爆发/流畅/沉重]`。\n- **受击/反应动作**:有第二角色则描述其反应姿态与运动方向;无则标\"单角色帧\"。\n- **画面内标注摘录**:逐字抄录图内所有文字标注(不论中英);无则标\"无文字标注\"。\n- **运动轨迹箭头**:描述箭头起点/指向/含义推断(如\"角色从画框左下向右上位移\")。\n\n**③ 整板镜头调度归纳**:汇总镜头运动总体节奏(起幅景别→中间变化→落幅景别一句话概括,如\"从 WIDE 推进至 ECU,全板以跟随运动为主\");识别板内明确切换节点(切割线/\"CUT\"标注)并标位置;归纳整板动势走向(主要运动方向+节奏强度:起伏/持续爆发/渐进蓄力)。\n\n**④ 多板连续性预判**:多张分镜图时,分析完单板后额外输出跨板连续性摘要——相邻两板落幅帧(前板 FN)与起幅帧(后板 F1)角色位置/朝向是否一致(不一致标 `[需板间衔接备注]`);跨板相同角色身份一致性(依体型比例/角色标注识别);跨板场景切换(背景几何明显变化)标新场景并建议建独立 element scene。\n\n**⑤ Storyboard 映射输出格式**(字段名对齐 shot 定义):\n```\n[Board N 映射]\n- 关联分镜板: [用户提供板编号或自动编号 Board_N]\n- 帧范围: F1–FN(共 N 帧)\n- 动作节拍序列: F1: … ; F2: … ; … ; FN: …\n- 镜头调度: 起幅[景别] → [运动方式] → 落幅[景别];板内切点: [无 / F_N→F_N+1]\n- 板间衔接备注: [与上板末帧的角色位置/朝向连续性说明,首板填\"首板,无前板参照\"]\n- 时长上限: 15s\n- 待补充项: [列出所有 [待用户补充] 或 [需板间衔接备注] 标记]\n```\n\n## 三视图分析(`analyze`,提取跨板稳定复用视觉锚点)\n\n每项须给具体描述而非\"正常/无特殊\":\n- **① 面部身份锚点**:脸型轮廓(方形下颌/瓜子脸/宽颧骨);五官关键特征(眉形粗细颜色、眼型眼距、鼻梁高宽、唇形唇色);肤色肤质(色号范围,如 warm medium-tan / pale cool-toned);发型结构(发际线位置、分区、长度、质感 直/卷/蓬松/贴头皮);发色(主色+次色/挑染,避免仅写\"黑\",补光泽倾向 哑光黑/蓝黑光泽)。\n- **② 体型比例**:整体身高体型分类(高挑/中等/矮壮/纤细);肩宽与腰臀比视觉印象;手部/颈部等局部可识别特征。\n- **③ 服装造型**:上装(款式+主色+次色/图案+领型袖型);下装(款式+主色+长度+版型 修身/宽松);鞋履(类型+颜色+鞋底厚度);材质质感关键词 2–3 个(matte cotton/shiny leather/worn denim);标志性配件(类型+颜色+佩戴位置,如 right wrist silver chain bracelet)。\n- **④ 三视图一致性校验**:对比正/侧/背三图,指出各视角颜色差异或细节不一致(如侧面服装偏暗、背面有背包正面未体现),注明\"以正面图为准\"或\"以用户说明为准\";任一视角缺失则标缺失方向并说明对后续生成的影响。\n- **输出格式**:结构化文本按①–④分段、短句/关键词组列举供直接复制引用,不输出叙事段落。\n\n**场景参考图分析**:识别空间结构与关键视觉锚点(环境类型 室内/室外/特定地点、主构成元素 建筑轮廓/地面材质/光源方向色调/背景层次、可跨板稳定复用的视觉特征),输出结构化 element scene description 基础。\n\n## Storyboard 设计(含节拍密度分档)\n\n- **Key Elements**:每出现角色建 element character(description 基于三视图分析;未提供三视图标\"待补充\"提示上传);每主要场景/地点建 element scene(空间结构/光线方向/背景锚点/色调氛围,有参考图则须与图一致不矛盾、无则给足细致描述供生成)。\n- **Shot 设计(每板=一 shot,≤8 动作节拍)**:含 关联分镜板(分镜图 asset_id 或板编号)、动作节拍序列(按帧序简述核心动作/方向/动势)、镜头调度(起幅/落幅、运动类型、景别变化)、板间衔接备注(与上板末帧连续性要求,首板留空)。\n- **节拍密度标注(核心,非全统一 ≤15s)**:每板标 高密度(爆发板)/低密度(过渡板):\n  - **爆发板**:连续打击/冲撞/多人混战,节拍因果紧密无停顿蓄力段;目标 **6–8s**。\n  - **过渡板**:拉开距离/蓄力/喘息/镜头大幅推拉等慢节奏;目标 **10–15s**。\n  - 混合板以主导内容判定,或备注说明分段节奏意图。**时长目标据节拍密度填,不强制统一 15s 上限**。\n- **模式 B 专项**:shot 字段直接从\"Storyboard 映射输出\"提取一一对应填入,**保持原始推断不自行扩写**;标 `[待用户补充]`/`[无法解读]` 的字段保留相同标记待暂停点 3 补充或放弃、**不得用推测填充**;跨板 element scene 按分析工具场景切换识别新增(来源标\"[分析工具推断,待用户确认]\",未识别则默认共用同一 scene);角色 element 按识别的多角色分别建条目,description 空或仅填极简特征(如\"高体型,右侧主动方\")待三视图补全。\n- **音频轨**:需要则规划 audio_layer,**动作 PREVIS 默认无旁白轨**。\n\n## PREVIS 分镜图提示词(generate_image_v3 — GPT Image 2)\n\n**核心设计原则:自解释**——图应有足够视觉信息密度使 Seedance 能直接从图读取动作编排/空间关系/镜头意图,尽量减少对文字依赖;每格须做到即便不读提示词也能从标注/箭头/线条理解该帧发生了什么。\n\n**核心约束(每条提示必含,放最前)**:\n- **风格锁定**:极简粗粝手绘分镜风格,全部角色仅用火柴人(stick figures),禁真实人体结构/肌肉/服装/裤子/鞋子/任何角色细节。\n- **线条风格**:粗细不均手绘铅笔/炭笔感线条、允许轻微抖动与不规则(速写张力),禁光滑矢量线条/数字清稿感;关键动势用粗重线、辅助参考线(透视线/轨迹线)用细虚线。\n- **背景处理**:极简,仅用几何轮廓线(方块=建筑/掩体、水平线=地面/台阶、斜线=斜面)示意空间关系,禁写实纹理/填充色块/细节贴图;整体纯白或极浅冷灰纸面色,只有线条、无渐变阴影填充。\n- **标注语言**:所有镜头标注/动作说明/技术指令一律**英文**(PUSH IN、WIDE SHOT、POV、IMPACT、×2 SPEED),禁画格内出现中文。\n- **单图多格布局**:明确格数(≤16),排 4×4 网格,每格独立构图、格间细实线分隔,每格左上角可有小号灰色帧编号(F1–F16)。\n\n**逐格视觉信息密度 7 层(核心,缺任一层导致 Seedance 参考信息不足)**:\n- **① 运动矢量箭头**:为每个运动的肢体/部位绘独立带箭头轨迹线,箭头长度反映幅度(大幅=长箭头)、粗细反映力度(爆发=粗箭头);角色整体位移另绘全身移动轨迹弧线,与肢体箭头用线型区分(肢体=实线、位移弧=虚线)。\n- **② 动势拖尾线**:运动肢体末端(拳/脚尖/膝)绘 2–4 条平行拖尾线,方向为运动反方向表速度感;爆发动作(直拳/扫腿)拖尾延伸至画格边缘或极近处表穿越力度。\n- **③ 冲击/接触标注**:任何接触/即将接触的帧在接触点绘爆炸形放射线(星形/菊花形)+英文标注(IMPACT/HIT/BLOCK/GRAB);近距发力(贴身短打)额外绘同心圆或压缩波纹线表力道传导。\n- **④ 空间深度标记**:所有帧有明确地平线(水平粗虚线);多角色场景每角色脚下有落地阴影圆点/小横线(表站位);前景角色粗线条、背景角色细线条形成纵深层次。\n- **⑤ 角色区分标签**:≥2 角色时每角色头部旁大写字母标签(A/B/C),主动方圈选(①)、被攻击方方框(`[B]`);标签贯穿全板所有画格一致、不随帧变动。\n- **⑥ 镜头信息栏**:每格底/顶留一条细横向标注栏——景别缩写(WS/MS/MCU/CU/ECU)+镜头运动(STATIC/PUSH/PULL/PAN-L/PAN-R/TRACK)+可选速度修饰词(SLOW/NORMAL/SNAP);格式示例 `MCU | PUSH | SNAP`。\n- **⑦ 帧间过渡指示**:相邻格分隔线处——动作连续用小箭头(→)指示流向;剪切标 CUT;镜头切换(场景改变)标 NEW SHOT 并用双竖线替代单线分隔。\n\n**提示词结构(顺序)**:1. 风格约束+7 层密度要求(压缩为简洁指令);2. 格数与布局声明(如 8-panel grid, 2 rows × 4 columns);3. 按格编号逐一描述(镜头信息+角色标签分配+主要动作矢量方向+冲击点位置+帧间过渡类型);4. 整板动作编排总体节奏(动作因果链一句话,如 A 突破防线→近身发力连打→B/C 相继倒地);5. ImageToImage 模式则指明参考来源与参考维度(构图/动势/镜头语言),**排除角色外观参考**。\n\n## 角色参考图 & 场景概念图提示词\n\n见 `references/prompt-library.md`(角色参考图 5 步:双格布局/面部锁定/服装三要素/写实风格与 PREVIS 隔离/固定排除项;场景概念图 4 步:空间构成 3 锚点/光源/风格基调/排除项)。\n\n## 视频提示词(generate_video_v3 — Seedance 2.0)\n\n**核心原则:分镜图主导,提示词补漏**。PREVIS 分镜图(`<<<image_1>>>`)已通过运动矢量箭头/拖尾线/冲击标注/镜头信息栏编码大量动作与镜头信息——是 Seedance 的**首要参考源**;提示词唯一职责是补分镜图无法编码的:速度质感词、角色因果关系、音效指令。\n\n**【强制减法原则】** 凡分镜图已清晰表达的内容,提示词**一律省略或只留 1–2 关键词**,不展开:\n- 已有运动矢量箭头 → 肢体动作描述**省略**,仅留速度质感词(如 explosive)。\n- 已有镜头信息栏(MCU|PUSH|SNAP)→ 镜头运动**简写为一句**(medium close-up, push in),不展开。\n- 已有冲击标注(IMPACT)→ 接触点描述**省略**,仅留音效标注(`<sharp impact crack>`)。\n- 已有角色标签和位置信息 → 空间调度描述**省略**。\n- ✅ 正确(分镜已有箭头):`F1: explosive; F2: recoils from impact, weight shifts back; F3: snapping`\n- ❌ 错误(重复分镜已有):`F1: right arm swings upward in a 120° arc at explosive speed, fist clenched, elbow leads`\n\n违反(提示词与分镜图高度重复)会导致文字权重压制视觉参考、生成偏离分镜意图。\n\n**参考输入绑定**:`<<<image_1>>>`=PREVIS 分镜图(首要);`<<<image_2>>>, <<<image_3>>>…`=各角色三视图(每角色一张,按出场顺序);`<<<video_1>>>`=上一板 final_shot(仅连续性极强时,默认省略)。\n\n**提示词结构(运动栈顺序,严格按层级)**:\n- **① 镜头运动**:分镜信息栏已标的只写一句概括不展开;补充价值在速度质感词。格式 `[起幅景别] → [运动方式] → [落幅景别]`;景别锁定 EXTREME WIDE/WIDE/MEDIUM/MEDIUM CLOSE-UP/CLOSE-UP/EXTREME CLOSE-UP;多镜头切换按节拍顺序用\"→ cut →\"分隔、不用时间码。示例:`WIDE SHOT, swift push in → cut → EXTREME CLOSE-UP on fist impact, lock-off`。\n- **② 角色动作**:减法优先,分镜箭头已明确的只写速度质感词,只有因果关系(被击后重心后移/对冲互锁)才展开;多节拍按 F1→F8 顺序、每节拍只写【速度质感词+因果关系(如有)】、分号分隔;多角色先主动作后受击/反应,主从用 in response/simultaneously/recoils 明确。**速度质感标准词**:explosive / snapping / fluid / heavy / weightless / sluggish;**禁 fast/slow 等模糊词**。\n- **③ 多角色场景专项(≥2 角色强制)**:\n  - **主从顺序**:按\"主动方→受击/反应方→次要旁观\"逐角色独立成句、角色间用\"—\"或换行分隔,**禁两角色动作混写一句**。主动方=当前节拍发起力量/位移的一方;双方同步对冲以画面视觉重心(通常画框中央偏近景)为主动方。\n  - **因果链接词**:受击/反应方必须用明确因果词引出——in response / simultaneously / recoils from / absorbs the impact / driven back by;**禁用 \"and\" 简单并列**避免主从模糊。\n  - **画框空间分配**:每角色用独立画框位置词锁定,禁用相对词(\"他们站一起\")。两角色默认 主动方 frame left/center-left、受击方 frame right/center-right(分镜图相反则以分镜图为准并注明);三角色+按前景/中景/背景纵深分层(前景=主动方、中景=受击/反应、背景=次要),各层有纵深距离感描述(如 pushed into the background, noticeably smaller in frame)。多角色同时运动每角色运动方向矢量须区分(A drives forward toward frame right; B retreats toward frame left),禁模糊为\"两人激烈冲突\"。\n  - **参考图一一绑定**:严格按角色一一绑定,顺序固定 分镜图(`<<<image_1>>>`)→主动方三视图(`<<<image_2>>>`)→受击/反应方三视图(`<<<image_3>>>`)→次要角色(`<<<image_4>>>` 递增)→场景图(最后 image 占位);每张绑定后在对应角色描述句首用括号注来源占位符,格式 `[ref:image_2] Character A: ...`;**禁将多角色三视图合并为单个 image 占位符,每角色独立占一槽位**保外观提取权重独立。\n- **④ 空间调度**:角色画框内位置变化(frame left/right/center/foreground/background/off-screen);与场景元素空间关系须与 PREVIS 背景几何一致;有出入画则明确方向(enters from frame left/exits top frame)。\n- **⑤ 音效与对白(仅无独立旁白轨冲突时)**:Seedance 官方语法放末尾——SFX `<sound of heavy footsteps on concrete>`/`<sharp impact crack>`/`<whooshing air burst>`;对白 `{EN: \"Get down!\"}`(语言代码前置);环境音 `<ambient urban noise, distant siren>`。**优先级:动作冲击音效 > 环境氛围音 > 对白**,三类同时按此序末尾依次列出。\n- **⑥ 节拍密度对应速度质感词(据 Storyboard 标注,附在②末尾)**:爆发板追加 `snapping cuts, explosive action rhythm, no slow motion, rapid kinetic energy`;过渡板追加 `deliberate pacing, building tension, smooth camera movement`;两类均禁用 fast/slow 代替标准词。\n- **⑦ 固定否定项(每条末尾必附)**:`no subtitles, no text overlay, no wardrobe change, no style shift between cuts`(no wardrobe change 保服装与三视图一致;no style shift between cuts 抑制 Seedance 多节拍板内自动改风格/色调)。\n\n## 视频生成参考输入 & 多板递进策略\n\n- **每板参考输入**:①**PREVIS 分镜图**(该板 asset_id,**首要视觉参考、权重高于文字**;提示词严格执行减法原则);②角色三视图(所有出场角色 asset_id);③场景图(该板 element scene asset_id,无则省略);④上一板 final_shot(可选,仅场景/角色状态连续性极强时作 reference_video,否则省略避免多余动作延续)。时长据节拍密度取整秒(爆发板靠近 6s、过渡板 10–15s),不超 15s。\n- **多板递进**:reference_video 门槛随板数收紧——板数 ≤4 常规判断,**≥5 仅衔接备注明确\"强连续\"的板才引 reference_video**,余板省略避免误差逐板放大;**element 参考图权重保持一致**——无论第几板,三视图+场景图绑定方式与输入顺序须与第 1 板完全一致,不因\"前几板已稳定\"降低后续完整性;**待修复板不阻塞后续**——某板标\"需重生\"时后续可续(跳该板 reference_video 链、直接用最近一张已确认 final_shot 作连续性参考),修复完成后若直接后续板已生成则提示用户评估是否因参考缺失需重生后续。\n\n## 跨板一致性(视频生成阶段)\n\n- **场景图复用**:同一 element scene 多板出现强制复用同一 asset_id,禁重复生成/替换新图,仅用户明确要求场景状态变化(时段切换/破坏后场景)才生成新图注册独立 asset_id;每板生成即使主动作与背景无关也须纳入对应场景图稳定色调空间结构。\n- **角色位置连续性**:每板生成前读\"板间衔接备注\"——标明上板末帧位置(如\"角色A 画框右侧面朝左\")则该板提示词空间调度层将起始状态对齐避免跳切;两板明显动作因果(击打→倒地)则后板首个动作节拍(F1)**必须从被击打角色受力姿态起写**、而非重置中立站姿;无衔接备注(首板/明确场景切换)不强制对齐、按该板分镜图独立调度。\n- **三视图兜底**:所有板生成均须附带全部出场角色三视图 asset_id,即使某板某角色戏份极少也不省略引用,防 Seedance 低权重下自行重绘外观。\n\n## 装配一致性检查(`composite_video`,装配前必做)\n\n- **板间拼接**:按 shot 顺序拼接,**默认硬切**(无淡入淡出)保动作冲击感;备注标\"连续性极强\"可用**极短叠化(≤4 帧)**辅助衔接避跳切感。\n- **一致性检查优先级:角色位置跳切 > 场景视觉锚点漂移 > 角色外观漂移**:\n  - **角色位置连续性**:逐一核查相邻两板衔接帧(前板末帧 vs 后板首帧)每角色画框位置与朝向,明显跳切(左侧瞬移右侧/朝向无因果反转)在切点加标记、暂停装配提示用户选(重生后板强制指定起始位置 / 接受跳切 蒙太奇意图明确时)。\n  - **场景视觉锚点**:核查同一 element scene 多板背景主要锚点(地平线高度/主光源方向/关键背景物体)是否稳定,明显风格漂移/构图突变则标记提示。\n  - **角色外观漂移**:相邻板同角色服装色系/发型/标志配件视觉差异则备注注明,提示用户评估是否以更强三视图权重重生对应板。\n  - 三者分别处理不混同(前者影响叙事连贯、后两者影响视觉稳定)。\n- **音频**:各板含 Seedance 动作音效默认保留;BGM 轨(如有)跨板连续铺设不随切点中断;无旁白轨时动作音效轨音量适度提升增强冲击。\n- **导出**:分辨率跟随 Final_Video_Spec(默认 720p),比例默认 16:9。\n\n## 配合(query 可同时加载)\n\n无源生依赖(源内各 actor 均为内部阶段,本 skill 完全自足)。\n\n边界(勿用本 skill,改道):通用 previs 优先工作流(先分镜板→预览→hero) → storyboard-cheatcode(该 skill 侧已有反向引用,互为边界即可);多格分镜板单图出图 → storyboard-generation;写实运动/表演 → cinematic-motion-realism;运镜语汇 → cinematic-motion-language。", "extras": [], "cn": "动作指导—火柴人分镜预演"}, {"slug": "aesthetic-tone-consistency", "desc": "sref 一码锁定全片影调,美学不跑偏,逐镜成片调性如一", "body": "---\n\n## name: aesthetic-film\\\\\n\nnamespace: industry\\\ntitle: \"美学定调短片\"\\\ndescription: \"以 Midjourney 美学风格（sref 定调）为核心的艺术短片：先用 MJ 锁定全片视觉调性，再由 Seedance 逐镜成片。适用于「用一套统一的电影级美学基调把一个短故事/氛围片做成成片」。两种模式——A：每镜 MJ 直出关键帧 → Seedance；B：MJ 出元素基准画板 → Nano Banana 轻改合成 key_frame → Seedance。纯图片美学（不成片）→ image-generation；通用多镜叙事（非 MJ 美学定调）→ cinematic-flow。\"\\\nversion: 3\n\n# aesthetic-film\n\n做**以 Midjourney 美学风格（sref 定调）为核心的艺术短片**时用本 skill：先用 MJ 把全片视觉调性锁死成一个统一基准，再由 Seedance 逐镜生成成片。核心不是叙事复杂度，而是**美学一致性**——整片靠一套 sref / 风格描述维持同一影调。本 skill 自足：sref 定调机制、镜头设计、电影化提示词、Seedance 序列、音频与合成规则全部内联，不外包给别的 skill。\n\n## 两种模式\n\n- **模式 A（MJ 直出关键帧，源 #16）**：每镜用 MJ 直接生成关键帧图 → Seedance 成片。适合以 MJ 出图质感直接驱动画面的场景。\n- **模式 B（MJ 基准画板 → Nano 精修，源 #17）**：MJ 出**元素基准画板**（外观由 sref 锚定），再用 Nano Banana 在 MJ 参考图上做**轻量合成/微调**得到每镜 key_frame → Seedance 成片。适合叙事化、需要按分镜精确排布主体位置/姿态、但要严守 MJ 风格锁的场景。\n\n模式选择在规范定稿阶段与用户确认；两模式共用下面的 sref 定调、镜头设计、提示词与合成规则。\n\n## 阶段（按 SP 全流程）\n\n不要一次跑完全部阶段。在每个关键阶段（规范定稿 / 风格路径确认 / 故事板确认 / 元素图完成 / 关键帧完成 / 逐镜视频后 / 音频后）暂停，用 `ask_human` 或卡片邀请用户确认后再进下一步。继续前用卡片或回复邀请用户审阅。\n\n1. **规范定稿**：写 `Final_Video_Spec.md`（标题、类型、比例、时长、视觉风格、语言、模型偏好）→ `write_file_v2`。同时**确认美学风格路径**（见「风格路径与 sref 定调」）与模式 A/B。\n2. **故事板**：生成 shot_list + audio_layers（模式 B 另含关键元素设计）→ 见「故事板设计」。\n3. **元素/关键帧图**：模式 A 每镜出一张关键帧图；模式 B 先出 MJ 元素基准画板，再 Nano 精修出各镜 key_frame → `generate_image_v3`（见「元素与关键帧生成」）。已有用户素材先 `get_node_info` 绑定到对应故事板位置，不重复生成。\n4. **逐镜视频**：`generate_video_v3` 逐镜，`reference_nodes` 引关键帧 / 元素图、`{{NodeKey}}` 绑定；单镜 ≤15s（引擎单次上限）。提示词按「逐镜视频提示词」内联规则写。\n5. **音频层**：`generate_audio` 生成所有独立音频层（≥1 全局 BGM；长片可多段 BGM 各带 `audio_id` 与范围；有解说 / 旁白设 narration 层）。\n6. **合成**：`composite_video` 按故事板与时间轴顺序拼成成片，引导用户导出。\n\n**阶段依赖**（源 Flova #16/#17）：2→1；3→2；4→3；5→2；6→2,3,4,5。\n\n**用户已有素材**（主要影响步骤 3–5）：在填充生成内容前，先用 `get_node_info` 把用户提供 / 现有素材绑定并分配到对应故事板位置；避免重复生成用户已给的素材。\n\n## 风格路径与 sref 定调（核心工艺）\n\n规范定稿与素材生成前，**先与用户确认用 MJ 生成美学风格图的路径**（两选一）：\n\n- **路径一（风格描述词）**：用提示词描述确定风格。用户明确了风格专有名词或偏好时，把风格描述记入 `Final_Video_Spec`，并在**后续所有元素生成中始终复用**这套风格描述词。\n- **路径二（sref code 定调）**：用 `--sref` 代码作为风格标杆来构建故事板内容，而**不是**把 `Final_Video_Spec` 的风格重写进每一条 MJ 提示词。\n\n`--sref` **选择规则（路径二）**：\n\n- 先问用户是否有 Midjourney `--sref` 风格代码。没有则由代理自选一个代码（通常取 **0–4294967295** 的整数，随机 / 贴合内容均可）；**记录所用代码，并在项目内后续所有 MJ 调用中复用**，除非用户更改。\n- 语法 `--sref <code1> <code2> …`，token 之间**空格分隔**（如 `--sref 5877700996 4815442863`）。每个值必须是 0–4294967295 的整数。**多个代码可堆叠**；用户给了多个就记录完整列表并全程复用。无用户偏好而自行发明代码时，除非用户明确要求堆叠，**优先单个自动整数以保简洁**。\n\n**工具适配**：MJ 图由 `generate_image_v3`（`ai_model` 指定 `Midjourney V8.1`）生成。**若当前引擎不支持** `--sref` **参数**：降级到路径一（风格描述词复用）+ 把风格基准图作 `reference_nodes` 的风格参考传入——机制（全片一套风格锁、跨镜复用）保留，落点适配。\n\n## 故事板设计\n\n### 关键元素设计（模式 B / 有复现元素时）\n\n- 覆盖**关键主体**（角色、物体）、**关键地点 / 场景**、**关键道具**（如有）。\n- **角色多状态显式分列**：角色在项目中有多个造型 / 外观（不同服装、年龄）时，在描述里明确写出（造型 1：…；造型 2：…）。\n- **场景内物体位置朝向**：描述重要物体（尤其道具、发生主要动作 / 表演的区域）的位置和朝向。\n- **用户素材必须匹配**：用户提供并指定为关键元素的素材，描述**必须与之匹配**，不得与所见 / 所听矛盾。\n\n### 镜头设计（每镜三要素）\n\n每个镜头描述必须含：\n\n- **场景**：引用地点 / 布景，用场景元素 ID（如 `[Element_Office_Noir]`）。\n- **叙事内容**：角色与关键物体的动作 / 动态、台词与表演，写出**确切台词**（口述对白或内心独白 / OS），用元素 ID 引用角色。\n- **镜头语言（摄影）**：景别（全景 / 中景 / 特写）、机位角度（仰拍 / 俯拍）、运镜（固定 / 摇摄 / 推轨）。\n\n### 独立音频设计\n\n- **背景音乐**：至少设计一段全局 BGM。视频较长（如 ≥3 分钟）且有明显幕间 / 转折点时，可规划多段音乐（每段带自己的 `audio_id` 与作用范围）。\n- **旁白**：用画外音 / 旁白推进故事时在此设计（类型 `narration`）：定义声音特征、语气、确切脚本；用 `layout_instruction` 把它限定在相关镜头范围内。\n\n## 元素与关键帧生成\n\n### 关键元素图（MJ 基准，两模式共用）\n\n加载用户选定的风格路径（路径一：用 `Final_Video_Spec` 记录的风格描述；路径二：用 `--sref` 定调）。\n\n- 用 `generate_image_v3`（`Midjourney` 系引擎）出**风格 / 场景、角色 / 道具基底、大场景**。\n- **提示词规则**：描述内容（人物 / 事物 / 地点、可辨识轮廓、环境），按上文规则附加 `--sref`。**不要**把规范里\"预想视频 / 图像风格\"的长篇文案塞进 MJ，也不要把 MJ 步骤当成必须执行该文档的环节——**sref + 主体 / 场景描述就足够**。\n\n### MJ 基准画板定位（模式 B）\n\n- MJ 画板是**外观的事实来源**（source of truth）：外观由 `--sref` 锚定。\n- MJ 在模式 B 里是后续 Nano 工作的**基准工厂（reference board）**，**不是最终装配时的调色步骤**——不要指望 MJ 一步出成品帧。\n\n### Nano Banana key_frame 精修（模式 B 核心·反模式）\n\n- 用 `generate_image_v3` 图生图（`Nano Banana Pro` 系引擎），出**每镜第一帧**，与故事板中的镜头描述对齐；分辨率按项目规范设 **2K–4K**。\n- **输入**：按镜路由的场景 / 风格 / 角色 / 道具元素参考（`reference_nodes`）。\n- **提示词必须简洁**：指定**哪张参考图提供环境 / 纹理**、**哪张提供风格 / 光照词汇**，**只**关联故事板脚本所要求的内容（姿势、布局、谁拿着什么）。**禁止**粘贴重新描述调色 / 光照 / 电影参考 / 情绪的段落——**那会强制模型完全重绘、削弱对 MJ 参考图的依从**。Nano 只做在 MJ 参考图之上的**轻量合成 / 微调**，不是从长提示词重建整张图。\n\n## 逐镜视频提示词（全量内联，不外包）\n\n### 语言规则（最高优先）\n\n用户用中文输入或加载中文语言环境时，提示词用**中文书写**；但提示词里的旁白 / 对话内容严格遵循 `Final_Video_Spec` 的 Output Language。\n\n### 图像提示词 6 大核心规则（写 MJ `key_element` 元素图时全局套用）\n\n提示词不只是描述\"图里有什么\"，而是像专业电影导演 + 调色师给团队下指令。把这 6 条写成**流畅自然的英文段落**、**编织在一起**，不要输出为带标签分节：\n\n1. **专业风格锚点**：结合专业艺术 / 电影术语与风格词；引入\"作者\"与具体电影视觉锚点（如 `Neo-Noir style, David Fincher Style, inspired by Se7en`），不要泛泛只说 `Neo-Noir`。\n2. **构图与镜头**：明确电影化构图（`Over-the-shoulder shot` / `Dutch angle`）与景别（`Close-up` / `Medium shot`）。\n3. **光影（含负光）**：详述主光并重点强调\"负光\"以产生对比与戏剧性（`Strong chiaroscuro contrast` / `dramatic interplay of light and shadow` / `deep facial shadows emphasizing facial structure`）。\n4. **调色（90% 单主色·禁红蓝霓虹）**：高端好莱坞克制调色（`deep teal-cyan shadows dominating 90%, zero warm fill` / `muted watercolor wash`）；除非用户明确要求，**永不用红蓝霓虹冲突**（禁 `crimson bleed`、霓虹洋红 vs 青）；画面约 90% 区域只用**一种主导色调**，极度克制。\n5. **视觉渲染**：描述整体视觉质量与纹理（精细渲染、丰富错综的细节、带细微高斯模糊的柔焦）。\n6. **氛围与潜台词**：描述角色\"潜台词\"与微表情，把动作定格在戏剧性瞬间（`oppressive suffocation` / `no mercy` / `predatory stillness`）；无生命物体描述其状态（宿命感 / 穿透力的注视 / 寒冷疏离）。拒绝僵硬摆拍。\n\n- **条件元素·画面内文字**（仅相关时）：场景出现文字（如屏幕文字）时自然整合，用**引号**包裹要渲染的确切文本，如 `A neon sign in the background reads \"DANGER\".`。\n\n### key_frame 专节（模式 B · 不套 6 原则）\n\n- `key_frame`**（Nano Banana）是例外**：**不**套用冗长的 6 大核心原则——沉重的电影化文字会让 Banana 忽略 / 对抗 MJ 参考图、导致重绘。优先只用\"**插槽标签 + 故事板对齐**\"。\n- **核心规则**：故事板里的镜头描述就是这张静态图\"必须发生什么\"（谁 / 哪里 / 动作 / 镜头节奏）的脚本。提示词只需加**最少的路由文本**，让模型以 MJ 元素图为参考、针对该节奏微调——而不是用文字对内容和风格做第二次全面处理。你越详尽地描述期望外观与内容，Banana 越倾向重新生成、丢掉 MJ 风格锁。\n- **理想短提示词模式（示例）**：`Reference environment texture Element_Dark_Void_img, and style Element_Glowing_Cube_img.`（然后仅追加故事板要求的内容，如主体位置或 `cube centered, static, push in before`——保持简短。）\n\n### key_element 提示词结构（写元素定义时）\n\n围绕：**主体与身份**（角色 / 道具 / 场景 / 生物是什么；角色含年龄、体型、种族（如指定）、显著特征、声音）→ **特征细节**（优先跨镜必须一致的特征：角色写面部特征 / 妆造 / 服装配饰的材质剪裁颜色状况；道具写形状 / 材质 / 颜色 / 尺寸 / 状况新旧 / 独特标记）→ **氛围情感基调**（紧张 / 忧郁 / 希望 / 宁静 / 不安 / 温暖 / 压抑 / 恐惧 / 怀旧 / 孤立 / 亲密…）。路径二时在主提示词后附 `--sref`（验证每 token 在 0–4294967295、标准化为空格分隔；未设则选一个代码记录并全程复用）。\n\n### 视频提示词 · 参考图命名\n\n先**为每张参考图标记角色**，让 Seedance 正确读取面部与造型：用 `reference_nodes` 传参考图、`{{NodeKey}}` 引用节点。模板：Subject 1 — 面部特征参考 `{{Face_1}}`（头部特写）；发型 / 妆容 / 服装参考 `{{Body_1}}`（全身照）。Subject 2 继续编号。\n\n### 视频提示词 · Seedance 四层顺序（镜头 → 主体 → 空间 → 音频）\n\n按此顺序追加动作 / 动态提示：\n\n1. **镜头**：运动或摄像机 / 剪辑变化（`static → push in`、`cut to new angle`、`orbit`、`pan`）。\n2. **主体**：动作与表情（谁做什么、面部神态）。\n3. **空间**：位置 / 环境变化（主体或相机相对空间的位置、背景运动、深度 / 布局转换）。\n4. **音频**：对话（如有）、音效，及模型缺音乐时的备注（见负面约束）。\n\n- **动作细节**：基于**具体身体部位**（手 / 腿 / 头 / 肩），加**程度**（幅度 / 速度 / 力度，如 `slowly raises one hand`、`snaps head left`、`pushes hard off the ground`）；一个提示词多节拍时，按故事时序列**主要动作 → 次要动作**。\n- **多节拍**：工具接受长提示词时，可在单次生成里标 **Shot 1 / Shot 2 / Shot 3** 表示镜头或故事节拍序列。\n- **禁逐秒时钟计时**：精确时钟（\"0–3 s\"、\"在 2 s 时…\"）**无法可靠执行**——不要按确切秒数硬拆、不写逐秒计划；描述**按顺序发生的事**，而非按时间划分的镜头清单。\n- **可选润色**（真人实拍简报时）：可加轻微手持微震 / 细微胶片颗粒，保持从属于上述四层顺序。\n\n### 包装符约定（Seedance 引擎语法）\n\n引擎接受自然语言，这些包装符帮模型区分音乐 / 音效 / 对话 / 屏幕文字：\n\n- **音乐**（描述播放内容）：`(...)`，如 `(fast-paced rock playing in the background)`。\n- **音效**：`<...>`，如 `<distant dog barking>`。\n- **口述对话**：`{...}`，如 `{Hello, world}` —— 台词不是项目主要语言时，在花括号前标语言，如 `Says in Japanese: {こんにちは}`。\n- **屏幕标题 / 章节 / 字幕文字**：`【...】`，如 `【Chapter One: Departure】`。\n\n### cut to 多阶段动作\n\n单镜内高度复杂 / 多阶段动作时，**按顺序**描述序列，用 `cut to` 标签表示过渡（shot A…, cut to shot B…, cut to shot C…）。示例：\\\n`Shot1: {{image_1}} his hands carefully open a dusty wooden box, with the sound of a soft creak. {{image_1}} His expression is focused and curious. The camera is a fixed shot, and the background attic is static. Shot2: cut to a bright blue light emanates from the artifact inside, casting an ethereal glow on his face and creating long, shifting shadows in the room. {{image_1}} His expression changes from focused to shocked awe as the camera begins a slow zoom in on his face. Shot3: cut to {{image_1}} he looks up with determination, the blue light reflecting in his eyes, as he slightly turns his head to the left to look past the camera. (no dialogue, no music, no subtitles)`\n\n### 三条负面约束（始终写进视频提示词）\n\n- 分镜表明该镜有**单独旁白音轨**时，视频提示词里**不写旁白文本**，避免音频冲突。\n- 为防模型加不想要的 BGM，**几乎总是**包含 `no music`。\n- 字幕后期加，**始终**包含 `no subtitles`。\n\n## 合成（静音嵌入音频规则）\n\n`composite_video` 按故事板与时间轴顺序组装所有镜头、旁白音轨与 BGM，剪辑就绪后引导用户导出。**若最终镜头没有镜头内对话或旁白，把该镜头 / 视频层的嵌入音频静音**，只依赖设计好的**音频层**（BGM / SFX），这样镜头自带的音效不会与混音冲突。\n\n## 变体与边界（勿用本 skill，改道）\n\n- **纯图片美学（不成片，只出美学静图）** → image-generation。\n- **通用多镜叙事短片（非 MJ 美学定调、故事 / 人物 / 对白驱动）** → cinematic-flow。\n\n（本 skill 自足，无源生跨 skill 依赖，故无「配合」声明表。生成基元 = `generate_image_v3` / `generate_video_v3` / `generate_audio` / `composite_video` / `write_file_v2` 等工具调用，非跨 skill 依赖。）", "extras": [], "cn": "美学统一调性短片"}, {"slug": "ai-model-talkshow-producer", "desc": "Use when 用户要把已有段子、真实经历或明确吐槽主题制作成可口播、可表演、可生成的中文单人 AI 模特脱口秀竖屏短片。\\\" version: 3", "body": "# Wander AI 模特单人脱口秀短片\n\n## Skill 定位\n\n只做中文单人 AI 模特脱口秀竖屏短片，不做访谈、播客、多人对话、新闻口播或泛 AI 主播。\n\n画面固定为观众席手机拍摄的 UGC 视角：小剧场或品牌活动舞台上只有一位 AI 模特拿麦表演，画面下沿保留少量观众背影、肩膀、头发或举手机前景，背景可自然植入品牌 logo 灯牌。\n\n核心目标是完成“用户素材与创作权确认 + 喜剧人格 + 中文脱口秀裸稿 + 用户文案确认 + 模特场景资产 + 表演节奏 + 视频提示词”的闭环。内容先于视觉资产；文稿不过关时必须停下来改稿，不得用精美画面掩盖不可用的文本。\n\n## 多层级 Reference 调用策略\n\n这个 Skill 使用多层级 reference。执行时按任务阶段加载对应文件：\n\n- 写或改中文脱口秀文稿时，必须使用 `references/chinese-standup-script-engine.md`。\n- 生成文案后、进入视频前，必须使用 `references/script-approval-gate.md`。\n- 生成最终视频节点提示词和资产引用策略时，必须使用 `references/video-reference-policy.md`。\n\n不要把 reference 当成可选建议；它们是当前 Skill 的核心方法论。主 `SKILL.md` 只负责总流程，细节以 reference 为准。\n\n## 输入\n\n### 第 0 轮先确认内容来源和创作权\n\n开场先说明： “这个 Skill 会制作一条中文单人 AI 模特脱口秀短片。文案决定能不能拍，所以先确认内容；你提供自己的文本或段子最容易保留个人表达，文案通过后再锁定模特和舞台，最后生成视频。”\n\n第一轮先让用户选择一种内容来源：\n\n1. 上传或粘贴已有的中文脱口秀文本、段子或半成品（推荐）。\n2. 提供一段真实经历、真实对话或具体吐槽，由 Skill 协助改成段子。\n3. 只提供抽象主题，由 Skill 先提出 3 个具体场景供用户选择，不直接生成最终稿。\n\n如果用户提供已有稿，先问“哪些原话、观察或包袱必须保留？”默认采用最小必要修改，不擅自改掉用户的核心观察、表达口吻和主包袱。用户拥有最终取舍权。\n\n同时采集最少项目边界：\n\n- 内容类型：生活吐槽、职场吐槽、恋爱观察、产品软植入、品牌活动开场、热点轻吐槽。\n- 演员声音：她想维持的体面、真实缺点、防御方式、句子习惯、主要攻击对象和禁用表达。若用户没想好，给 2 个简短声音卡供选择。\n- 时长：15 秒视频（推荐）、30 秒视频、60 秒视频。\n- 语气边界：温和调侃、犀利吐槽、夸张表演、品牌安全。\n\n默认：15 秒、9:16、720P、观众席 UGC 视角、温和吐槽。字幕和视觉资产在文案通过后再确认。\n\n### 文案通过后再采集画面资产\n\n只在用户明确选定或通过文案后询问：\n\n- 是否已有模特图。没有则自动生成一位符合人物声音和舞台气质的成年 AI 模特。\n- 是否有品牌 logo 图。没有则不植入；有则做成舞台背景灯牌、招牌、霓虹牌或 logo 形状装饰。\n- 是否有明确舞台参考。没有则自动生成小剧场、开放麦或品牌活动舞台。\n- 字幕风格：短视频大字幕、综艺弹幕感、极简白字、舞台字幕条、无字幕。\n\n## 输入使用\n\n- 用户给的文本、段子和真实原话是内容资产锚点；除非用户授权重写，否则只做最小必要修改。\n- 用户给的模特图是角色资产锚点，优先用于生成或锁定 `model_reference`。\n- 用户给的舞台图是场景参考，只用于生成或锁定 `stage_composite_reference`，最终视频不再直接引用空场景图。\n- 用户给的 logo 只能自然融入背景灯牌、招牌或舞台装饰，不做水印。\n- 用户只给抽象主题时，不得直接写稿；必须根据 `references/chinese-standup-script-engine.md` 的素材门槛先补真实细节。\n- 用户给完整文稿时，先保留其核心观察、原话、口吻和主包袱，再做朗读自检；问题必须明确指出并让用户决定是否修改，不能以“优化”为名夺走创作权。\n\n## 内部流程和 Knowhow\n\n### 1. 内容与声音锚点\n\n先锁定：\n\n- `source_material`：用户原稿、真实原话、经历或已选场景。\n- `must_keep`：用户指定必须保留的句子、观察和包袱。\n- `voice_card`：体面、缺点、防御方式、句子习惯、攻击对象、禁用表达。\n- `comedy_action`：本段唯一主要喜剧动作，例如自我暴露、体面崩塌、规则执行过度、身份降级、情绪与行为错位、具体细节升级或回扣。\n\n15 秒默认只允许一个核心场景、一个主包袱和一个可选补刀。不要为了满足数量强塞 2-3 个笑点。\n\n生成 3 个明显不同的裸稿供盲选；差异必须来自角度或喜剧动作，不是同义改写。用户选择或确认前不进入视觉资产。\n\n### 2. 中文文稿创作\n\n加载并执行 `references/chinese-standup-script-engine.md`。内部可以淘汰候选，但面向用户只输出必要判断和裸稿，不输出大段模拟评审表。\n\n### 3. 文案确认闸门\n\n生成候选裸稿和必要风险说明后，加载并执行 `references/script-approval-gate.md`。用户没有明确确认之前，不得创建画面资产或生成视频节点。\n\n### 4. 资产锚点\n\n先生成或锁定：\n\n- `model_reference`：横版 16:9 白底模特设定图，锁定脸、发型、妆容、服装、鞋、腿部造型、体态和表演气质。\n- `stage_reference`：竖屏 UGC 小剧场舞台空镜，只用于构建合成图，不作为最终视频引用资产。\n- `logo_stage_reference`：仅当用户提供 logo 时生成，用于把 logo 融入舞台背景。\n- `stage_composite_reference`：模特进入舞台后的竖屏合成图，锁定同一位模特、舞台、坐姿或站姿、观众前景、灯光和整体现场感。\n\n生成或锁定上述资产后必须停下来问： “你是否满意这个模特、舞台和演讲预览图？是否需要重新生成？如果要调整，请说明模特造型、舞台风格、坐姿/表演状态或 logo 呈现方式。”\n\n用户确认资产前，不得进入视频生成。\n\n### 5. 视频提示词和资产引用\n\n用户确认文案并确认画面资产后，加载并执行： `references/video-reference-policy.md`\n\n最终视频只引用：\n\n- `stage_composite_reference`：模特场景合成图，作为主要视频参考。\n- `model_reference`：模特角色资产，作为身份、妆造、服装和体态参考。\n- 如果用户需要字幕，且已生成字幕样式图或字幕版脚本图，可额外引用 `subtitle_style_reference`。\n\n最终视频不引用空的 `stage_reference`。空场景图只服务于合成图生成，不进入最终视频引用。\n\n## 资产图片提示词框架\n\n### `model_reference`\n\n```text\n生成一张横版 16:9 白底 AI 女演员设定图，纯白背景，棚拍质感，画面左右分布。\n左侧：同一位成年女性 AI 模特的全身正面站姿，完整露出头发、脸、上衣、裙装/套装、腿部造型、鞋子，姿态自信自然。\n右侧：同一位模特的脸部特写，清楚呈现五官、发型、眼妆、唇妆和上镜妆容。\n\n人物方向：身形修长、比例利落、舞台表现力强，适合小剧场中文单人脱口秀表演。\n造型方向：高跟鞋、短裙或修身套装、薄透黑色长袜/裤袜、贴身剪裁上衣、短款外套、金属耳饰；可根据人设调整为都市夜场感、冷脸毒舌感、元气甜妹感或精致打工人感。\n妆容方向：清晰眼线、卷翘睫毛、红棕或玫瑰色唇妆、干净底妆、轻微修容，舞台灯光下仍然清楚。\n拍摄要求：真实摄影、干净棚拍、服装细节清晰、无文字、无 logo、无多余人物、无复杂背景。\n避免：不要生成童态、夸张网红滤镜、塑料皮肤、过度暴露、低俗姿态、杂乱背景。\n```\n\n### `stage_reference`\n\n```text\n生成一张竖屏 9:16 小剧场中文脱口秀舞台空镜图，观众席手机拍摄视角，强 UGC 现场感。\n画面下沿和左右下角必须有少量观众背影、肩膀、头发或举手机的模糊前景，像坐在观众席中后排用手机随手拍到。\n舞台中心有高脚凳、手持麦或立麦、小边桌/水杯；背景为砖墙、深色幕布、开放麦灯牌或品牌活动背板。\n灯光为真实小剧场暖色聚光，允许轻微噪点、暗部压黑、手机拍摄动态范围不足、轻微手持构图偏移。\n如果用户提供 logo，把 logo 做成背景灯牌、墙面招牌、霓虹牌或舞台装饰，不要做成水印。\n避免：不要生成广告棚拍、电影级过度干净构图、空旷大厅、夸张霓虹夜店、游戏 CG 质感、没有观众前景的舞台。\n```\n\n### `stage_composite_reference`\n\n```text\n基于 model_reference 的同一位 AI 女演员和 stage_reference 的同一小剧场舞台，生成一张竖屏 9:16 演讲预览合成图。\n同一位模特必须保持脸、发型、妆容、服装、鞋和腿部造型一致。\n她在舞台中央坐在高脚凳上或半倚高脚凳，单手拿麦靠近嘴边，另一只手自然搭在膝盖、凳沿或做轻微手势；可自然翘腿，身体微微前倾，表情松弛、自信、带一点冷幽默。\n画面必须像观众席手机拍摄：下半部分边缘保留观众背影/肩膀/手机前景，人物被舞台暖光照亮，背景略暗，构图略微手持但不影响观看。\n如果有 logo，必须已经自然融入背景灯牌或舞台装饰。\n避免：不要像专业广告棚拍，不要过度磨皮，不要让模特悬浮或比例不对，不要去掉观众前景，不要多人同台，不要把 logo 做成水印。\n```\n\n## 输出\n\n### 第 0 轮输出\n\n只输出：\n\n1. 三种内容来源选择，其中“上传或粘贴已有的中文脱口秀文本、段子或半成品（推荐）”。\n2. 最少项目边界问题。\n3. 用户有稿时询问必须保留的内容；用户只有抽象主题时给 3 个具体场景。\n\n### 文案阶段输出\n\n必须输出：\n\n1. 一句话素材与人物声音确认。\n2. 3 个明显不同的 15 秒裸稿；用户已有成熟稿时，优先给“最小修改版”，另两个版本只在用户允许探索时提供。\n3. 每稿一句风险说明和推荐版本，不展示内部自评表。\n4. 用户选定后才输出精简的表演停顿与动作。\n5. 文案确认问题。\n\n### 用户确认文案后的资产阶段输出\n\n必须输出：\n\n1. 模特图、logo 图、舞台参考的需求确认。\n2. 对用户未提供或未锁定的资产，输出 `model_reference`、`stage_reference`、可选 `logo_stage_reference`、`stage_composite_reference` 的完整生成提示词。\n3. 资产确认问题。\n\n### 用户确认画面资产后的输出\n\n必须输出：\n\n1. 15 秒视频提示词，或多个 15 秒段落提示词。\n2. 最终视频资产引用清单。\n3. 字幕引用策略。\n4. 资产闭环检查。\n\n## 自检\n\n输出前检查：\n\n- 是否只做中文单人脱口秀。\n- 是否先确认用户文本/段子（推荐）、真实经历或主题场景。\n- 是否明确保留用户指定的原话、观察和包袱。\n- 是否在文案通过后才锁定模特资产和模特场景合成图。\n- 是否在写稿时加载并执行中文文本创作 reference。\n- 用户只给抽象主题时，是否先追问真实细节，而不是直接写稿。\n- 文稿是否同时通过事实层、态度层和技术层检查。\n- 是否只有一个主要喜剧动作、一个主包袱和可选补刀。\n- 三个候选是否角度不同，而不是同义改写。\n- 是否把内部淘汰留在内部，没有用表格和解释淹没裸稿。\n- 文稿是否符合声音卡，且不能轻易换成任何人说。\n- 是否删除翻译腔、营销腔、网络烂梗、解释笑点和强行价值升华。\n- 是否在文案生成后停下来请求用户确认。\n- 用户未确认文案前，是否没有生成视频节点。\n- 最终视频是否只引用 `stage_composite_reference` 和 `model_reference`，需要字幕时才额外引用 `subtitle_style_reference`。\n- 最终视频是否没有引用空的 `stage_reference`。\n\n## Ask User\n\n必须问用户的情况：\n\n- 开始时先问是否上传或粘贴已有中文脱口秀文本、段子或半成品（推荐）。\n- 用户有稿时，问哪些内容必须保留。\n- 用户只给抽象主题时，问真实细节；不得直接写稿。\n- 文案生成后，问“这版文案是否通过，是否需要修改？”。\n- 文案通过后，缺少模特、logo、舞台参考时，问是否提供或自动生成。\n- 资产生成后，问是否满意模特、舞台和演讲预览图。\n- 用户需要字幕但未指定风格时，问字幕风格。", "extras": [], "cn": "AI模特脱口秀skill"}, {"slug": "ai-short-drama-flow", "desc": "剧本到成片，一键产出高反转短剧", "body": "# ai-short-drama-flow — 制片人（一站式短剧）\n\n你是**制片人**——编排型 agent：管全流水线、与用户沟通、处理资产与修复。短剧一站式生成 = 从**已有剧本**到成片的端到端制作：导演/分镜/视觉/提示词/混音的全部工艺内联在下面，不外包给别的 skill。**编剧本身（从题材原创角色/弧线/张力曲线）不在本 skill 内**——源里这一步是 Higgsfield 后端专属服务（`cinematic-dramaturg` enhancer），其方法论从未以文本形式出现在任何可迁移的源文件里（仅点名领域，正文指向一个从未被抓取过的外部 CDN 文件），如实记录、不臆造替代内容。用户只有题材/点子、没有剧本时：先转 **auto-novel-writer**（短剧专属，从一个想法自动产出角色/三幕结构/分镜约束）或 **script-writer**（更轻量，只要故事结构骨架）产出剧本，再回来本 skill 做 Storyboard 与生成执行。\n\n> **本环境适配**：源里编剧/导演/视觉/分镜/文案原是服务端 enhancer——本环境没有，这些创作由你自己按下面的工艺做。源模型点名（GPT Image 2 出图、Seedance 2.0 出视频、Suno 5 出 BGM、ElevenLabs v3 出旁白）收敛到本环境工具：出图=`generate_image_v3`、出视频=`generate_video_v3`、音频=`generate_audio`、拼接=`composite_video`、QA=`analyze_video`、落盘=`write_file_v2`、停等=`ask_human`、锁脸换装=`prompt_template`。源里 Soul ID 训练改为**持久锚点节点**；prompt 语言随用户（源\"一律简体中文\"是用户私有偏好，去掉）；源积分/balance 门本环境不暴露，去掉，仅保留其\"生成前收齐参数再提交\"的意图（用 `ask_human` 收集，不设强制阻塞）。\n\n## 启动协议（先确认再推进）\n\n用户触发时按顺序确认，缺失一律主动问、不静默假设：\n\n1. **当前阶段**：已有剧本/分镜/设定图，还是只有一个题材/点子（无剧本）？\n2. **已有素材**：有剧本/分镜/设定图则请用户上传或粘贴；**只有题材、无剧本** → 本 skill 不做编剧，先转 auto-novel-writer（短剧专属自动编剧）或 script-writer（轻量故事结构）产出剧本，再回本 skill 继续。\n3. **形态**：A 竖屏付费 / B 横屏叙事 / C 多集连续剧（见形态分流）。\n4. **输出语言**：分镜脚本通常中文；提示词英文或中文皆可，随用户。\n5. 时长、集数（C）、角色复用方式、风格/题材。\n\n**关键暂停点**（绝不一口气跑完全流程，纠错成本会爆炸）：剧本分析 + Storyboard 草稿确认后（进生成前）→ 所有设定图确认后（进视频生成前）→ 所有分镜视频完成后（进组装前）。每阶段完成后 `ask_human` 停等确认再继续。\n\n## 形态分流（编剧之前先定）\n\n| 形态 | 宽高比 | 单集时长 | 分镜密度 | 集数 | 要点 |\n|---|---|---|---|---|---|\n| **A 竖屏付费短剧** | 9:16 | 60–90s | 高（每 2–4s 一个信息点） | 单集/短系列 | 强钩子开场 + 高频反转，见钩子库 |\n| **B 横屏叙事短片** | 16:9 | 60–180s | 中 | 单集 | 偏故事、电影质感 |\n| **C 多集连续剧** | 9:16 或 16:9 | 每集 60–120s | 中–高 | 多集 | 跨集一致性是核心 |\n\n分流后把宽高比锁定，贯穿全程所有图片/视频生成。形态未明 → `ask_human` 让用户三选一（顺带问时长/集数/风格）。\n\n## 全流程阶段与依赖关系\n\n1. **读取并分析剧本**：提取角色、场景、关键道具，识别剧本类型（A/B/C，见素材分析）。\n2. **写全局制作参数**到一份 Final_Video_Spec 文件（`write_file_v2`）：画幅比例、目标时长、影像风格基调、输出语言。\n3. **设计 Storyboard**：登记所有 key_element（角色/场景/关键道具），把剧本拆成有序 shot 列表，规划 audio_layer（BGM/旁白）。\n4. **生成所有 key_element 设定图**：角色三视图、场景四视图（`generate_image_v3`）。\n5. **生成每 shot 分镜表格图**（运镜轨迹示意图），供视频生成阶段作视觉锚点。\n6. **逐 shot 生成视频**，每镜引用对应 key_element 图像；仅在与上一镜连续性极强时额外引用上一镜视频作 reference。\n7. **生成所有 audio_layer 音频资产**（台词内嵌于视频；BGM/旁白独立生成）。\n8. **按 Storyboard 顺序组装时间线**，完成音画同步与剪辑输出（`composite_video`）。\n\n依赖顺序：3依赖1,2；4依赖3；5依赖3；6依赖4,5；7依赖3；8依赖4,5,6,7。\n\n## 素材分析（剧本接收与分类）\n\n接受 `.txt` / `.docx` 上传或直接粘贴的文本。通读后**先判类型并输出分类结论**，Planner 据此定后续路径：\n\n- **A 类 · 成熟分镜剧本**：已按场景/镜头划分，含景别、运镜、台词 → 直接进 Storyboard。\n- **B 类 · 散文体小说 / 纯对话**：无镜头结构 → **告知用户，建议先短剧化改编**（叙事转分镜脚本）再继续；**不得自行补全**剧本未描述的角色外貌/场景细节，须向用户确认。\n- **C 类 · 半结构化剧本**：有基本场景描述但缺完整分镜语法（景别/机位/运镜不全）→ 可进 Storyboard，在拆解 shot 时**补全缺失的分镜要素**。\n\n**结构化信息提取**（无论哪类都要，供后续阶段用）：\n- **角色清单**：姓名、出场场景、外貌/服装（仅提取已明确描述的，缺失项标\"待用户补充\"）。\n- **场景清单**：场景名称、空间特征、出现的镜头范围。\n- **关键道具**：对剧情或视觉有重要作用的道具。\n- **剧情结构**：幕次划分（开篇/发展/转折/高潮/结尾）及各幕大致镜头数估算。\n\n## 角色身份方案（短剧的命脉）\n\n短剧角色会在几十个镜头、可能跨多集反复出现，**脸崩=口碑崩**。身份方案必须前置，`ask_human` 让用户选：\n\n| 选项 | 何时用 | 本环境路径 |\n|---|---|---|\n| **持久锚点（最强一致性）** | 多集 / 该角色 ≥10 镜头 / 用户给了照片 | 先出一张稳定设定图，登记为持久锚点节点；之后所有镜头引用同一 `{{NodeKey}}`。见 character-consistency |\n| **一次性设定图** | 单集横屏、角色只在本片出现 | `generate_image_v3` 出 3 变体 → 选一张作本片锚点 |\n| **用户上传照片** | 用户给了真人照片 | 照片节点即锚点；若戏服/世界观≠照片 → 用 `prompt_template` 锁脸换装 |\n| **文本起步** | 全新虚构角色、无照片 | 并行生成 5+ 张该角色不同场景图，选最稳的一张作锚点 |\n\n**默认**：C 多集 → 强烈建议持久锚点（跨集一致唯一可靠路径）；A 竖屏主角密集 → 持久锚点；B 单集横屏 → 一次性设定图足够。**多角色阵容**（霸总/女主/反派/闺蜜…）逐个建锚点，全部记入角色注册表。角色的**声音特征**（音色/语气/情绪基调）单独登记为 key_element_audio，与角色绑定，用于视频生成时的音频条件。\n\n## Storyboard 设计\n\n### 登记 key_element\n- 登记所有主要**角色**（element character）、关键**场景**（element scene）、关键**道具**（prop element）作为 key_element。\n- **角色描述**须含：年龄/性别/外貌/发型/服装/标志性细节；若角色有多套造型或不同时间线形象，分别列出（\"造型A：…；造型B：…\"）。\n- **场景描述**须含：空间结构、固定参照物（不可移动的视觉地标）、材质/光源/色温/氛围词——这些是后续每个 shot 空间连续性的锚点。\n\n### 剧本规模评估（Scope 门，编剧之后、导演之前）\n剧本/题材经初步分析后，先做一次规模评估，而非直接铺开全量生产：\n- **fits（规模合适）**：按当前剧本规模直接进入导演/分镜阶段。\n- **扩展**：素材/冲突不足以撑满目标时长，向用户提议加桥段、加副线，经确认后再继续。\n- **收窄**：素材过多、超出目标时长承载力，向用户提议砍支线/合并场景，经确认后再继续。\n- **接受**：用户明确要求按原样（不扩不收）推进，即使评估认为不合适，尊重用户决定但需先告知风险。\n四选一必须向用户过一遍并取得确认，不得默认走 fits。\n\n### 拆解 shot 列表（批次拆分规则）\n每个 shot = 一次视频生成任务，**时长 ≤ 15s（硬性上限，超出必须拆分为独立 shot）**。每个 shot 视为一个批次单元：\n\n- 单 shot 时长 ≤ 15s。\n- 单 shot 内切镜数量建议 **2–6 个**。\n- 单 shot 出场人物 **≤ 3 人**，超出须拆分。\n- 单 shot 保持空间一致性，**跨物理空间必须切新 shot**。\n- **优先设计较长镜头（建议 8–15s）**，充分利用单次生成支持内切镜与丰富运镜的能力，避免把一个连续场景拆成过多短镜头。\n\n每个 shot 描述必须包含：\n- **场景**：引用对应 element scene ID。\n- **人物动作与对白**：以时间顺序描述行为、面部表情、台词（写出具体台词文本）。\n- **分镜语法三件套**：景别（大特写/特写/近景胸像/中景/中全景/全景/大全景）+ 机位（平视/俯拍/仰拍/过肩/正侧面等）+ 运镜（固定/推进/拉远/横摇/跟随/环绕/升降等），**三者缺一不可**。\n\n同一物理空间的连续场景尽量归入同一或相邻 shot；跨场景须明确标注空间切换。人物在相邻 shot 之间的位置/朝向/手持物必须连贯，Storyboard 中显式维护该状态。\n\n### 批次完整性校验（提交生成前必查）\nshot 列表拆完、正式转成生成请求前，逐条自查，缺一不可：\n- **prompt 逐字复制**：从 Storyboard/shot 描述转成生成请求的 prompt 文本必须逐字复制，不得在转录途中意译、精简或改写用词——任何措辞差异都会破坏与设定图/前序 shot 的一致性锚点。\n- **锚点引用规则**：每个 shot 对 `{{NodeKey}}` 锚点节点的引用只作为参考输入（对应源的 `<<<element_id>>>` token），不得把锚点的原始描述文字混进 prompt 正文重复一遍——引用一次，不重复注入。\n- **参考图片清单核对**：提交前核对本 shot 附带的参考图（角色/场景/道具锚点图）与该 shot 实际涉及的 key_element 是否一一对应，不多带、不漏带。\n- **并发波次上限**：批量提交视频生成任务时，**单批并发 ≤ 8 个**，超出拆成多个波次串行提交，避免同批过多导致失败重试成本不可控、也便于逐波次核对结果。\n\n### 全局空间锚点卡（每 shot 开头声明）\n每个 shot 描述开头附一张空间锚点卡，**不得省略**——它是跨镜保持空间一致性的关键锚点，确保相邻 shot 间人物位置、光影连贯：\n\n```\n【空间锚点 / 场景名】\n固定参照物：（不可移动的视觉地标，如\"破旧防盗门位于画面中心\"）\n人物当前状态：\n · 角色A：[位置 + 朝向]\n · 角色B：[位置 + 朝向]\n光影基调：（光源类型 + 色温 + 氛围词）\n```\n\n### 跨镜连续性三件套（场景内/集内通用方法论）\n空间锚点卡是**状态快照**，下面三件套是维持它跨镜不漂移的机制，Storyboard 设计与逐 shot 生成阶段都要遵守：\n\n1. **scene-relative anchoring（场景相对锚定）**：人物/道具的位置描述一律相对该场景的固定参照物给出（\"角色A站在防盗门左侧半步\"），不用绝对画面坐标或上一帧像素位置描述——因为生成模型每次出画面构图会有偏差，只有相对固定地标的描述能跨镜复现同一空间关系。\n2. **state ledger（状态账本）**：在 Storyboard 文档里为每个场景维护一份随 shot 推进滚动更新的状态记录——人物位置/朝向/手持物/服装状态/光影基调，每写完一个 shot 就更新账本，下一个 shot 开工前先读账本取上一状态作为本 shot 空间锚点卡的起点，禁止凭空重新假设。账本连续性同「全局空间锚点卡」共用同一份数据，不重复维护两份。\n3. **anchor object（锚点物）**：每个场景至少指定一个不随剧情变化的实体道具或建筑特征作为锚点物（同\"固定参照物\"），所有人物调度描述都以它为参照系原点；跨 shot 若该锚点物意外消失或位置变化，视为连续性错误，须回退检查。\n\n### Storyboard 完稿前自检清单（交付前逐项核查并向用户报告）\n- [ ] **遗漏检查**：原剧本所有关键动作、台词、转折是否都有对应 shot？\n- [ ] **逻辑一致性**：人物在前后 shot 的位置/朝向/手持物是否连贯？\n- [ ] **接镜顺畅度**：前一 shot 出画方向与后一 shot 入画方向是否符合轴线规则（不跳轴）？\n- [ ] **时长合规**：每个 shot 合计 ≤ 15s？每个内切镜是否在景别建议时长内？\n- [ ] **空间一致性**：同一 shot 内是否未跨场景？光影基调是否与前 shot 衔接（除非剧情硬切）？\n- [ ] **角色一致性**：角色代号是否全程统一，无同人异名？\n- [ ] **音效/台词位置**：是否紧贴对应动作，无错位？\n\n有问题先与用户确认是否修改再继续，**不得静默修改原稿**。\n\n### 规划 audio_layer\n- **BGM**：全剧至少一条背景音乐轨。剧情有明显情绪转折（如 3 分钟以上长片）可分段设计多条 BGM（各有独立 audio_layer ID 和覆盖镜头范围）。\n- **旁白**：如有画外音/旁白，以 narration 类型登记，注明音色特征、语气、具体台词文本及覆盖镜头范围。\n- 视频生成时**视频本身不内嵌 BGM**（BGM 在 audio_layer 独立生成、组装阶段混音）；**台词/音效可在视频生成时内嵌**。\n\n## 媒体生成\n\n### key_element 设定图\n- 用 `generate_image_v3` 生成所有角色和场景设定图，高分辨率（≥2K）。\n- **角色三视图**：单张图中并排三个全身视角（正面/侧面90°/背面），服装/配饰/发型/体型三视角完全一致，中性灰背景，柔和均匀影棚光。\n- **场景四视图**：单张图中 2×2 宫格四个角度（建立全景/主入口中景/关键道具特写/反向视角），光源/色调/陈设四格一致，**画面中无人物**。\n- **道具设定图（Prop Sheet）**：对剧情/视觉有重要作用的关键道具（信物、凶器、标志性配饰等），单独生成一张多角度设定图（正面/侧面/细节特写并排），材质/尺寸比例/磨损细节全角度一致，中性背景。凡进入多个 shot 反复出现的道具都应建 Prop Sheet 并登记为独立 key_element，不与角色/场景设定图混绘，避免道具在特写镜头里走样。\n- 设定图生成后**必须暂停**，由用户确认视觉风格与剧本一致，再绑定到对应 key_element 并进入视频生成。\n\n### 双通道媒体追踪（生成产物的两条记录线）\n每个生成产物（设定图/分镜表格图/分镜视频/音频）落盘时同时维护两条独立记录，不得只记一条：\n1. **素材通道**：产物本身的文件路径/句柄 + 所属 key_element 绑定关系（`write_file_v2` 落盘路径），供后续 shot 生成时按 `reference_nodes` 引用。\n2. **过程通道**：生成该产物时用的完整 prompt、所用锚点引用、生成参数（分辨率/时长/模型），供事后追溯\"这张图/这段视频当初是怎么生成的\"、复现或修复时可比对差异。\n两条通道分开记录的意义：素材通道保证生成链路能正常引用复用；过程通道保证出问题时能定位是 prompt 问题还是锚点问题，不至于只有结果没有过程可查。\n\n### 分镜表格图（运镜轨迹示意图）\n- 视频生成前，为每个 shot 生成一张运镜轨迹示意图作为视觉施工图纸（`generate_image_v3` 图生图模式，上传该 shot 涉及的角色三视图 + 场景四视图作参考，确保画风/角色/场景一致）。\n- 需含四大要素：**运镜轨迹箭头**（推进/拉远/环绕/升降/跟随/固定各用不同颜色区分）、**每切镜的中文动作说明**、**景别与时长标注**、**机位示意**（相机图标 + 虚线轨迹）。\n- 提示词写法见\"提示词写法 · 分镜表格图\"。\n\n### 分镜视频\n- 用 `generate_video_v3`，多参考输入。每 shot 参考默认含：该镜涉及的所有角色 key_element 图像 + 对应场景 key_element 图像（`reference_nodes` 依次引用各锚点 `{{NodeKey}}`）。\n- **仅当本镜与上一镜连续性极强**（同一动作延续、无剪切场景推进）时，额外加上一镜末帧视频作 reference；通常不加视频参考，避免模型过度继承上一镜构图而削弱本镜运镜设计。\n- 每 shot 生成时把对应角色的 key_element_audio 作音频条件，保持角色音色跨镜一致。\n\n### 音频\n- **BGM**：`generate_audio` 生成器乐（提示词中不得出现知名音乐人名字）。\n- **旁白**：`generate_audio` 生成旁白语音。\n\n## 提示词写法\n\n### 内切镜时长估算（写视频提示词前）\nStoryboard shot 未标各内切镜时长时，按经验值估算，确保单 shot 合计 ≤ 15s：\n\n| 镜头类型 | 建议时长 |\n|---|---|\n| 大特写 / 手部脚部特写 | 1.5–2.5s |\n| 面部特写（含台词） | 2–4s |\n| 近景胸像（含台词） | 2.5–4s |\n| 中景 / 中全景 | 3–5s |\n| 全景 / 大全景建立镜 | 3–5s |\n| 运镜推进 / 拉远 / 环绕 | 基础景别时长 +1s |\n\n超过 15s 必须拆分为独立 shot。\n\n### 角色三视图提示词（文生图）\n```\nA character turnaround sheet of [角色描述，含年龄/性别/外貌/服装/标志性细节]. Show three full-body views in one image, evenly spaced left-to-right: Front view (facing camera) | Side view (90° profile, facing right) | Back view (facing away). Identical clothing, accessories, hairstyle, and body proportions across all three views. Plain neutral gray background (#888888), soft even studio lighting, no shadows on background. Photorealistic, cinematic film still aesthetic, PANAVISION lens look, 8K detail. No text, no labels, no watermark.\n```\n\n### 场景四视图提示词（文生图）\n```\nA location reference sheet of [场景描述，含空间结构/材质/光源/色温/标志物]. Show four angles of the same location in one composite image (2×2 grid): Top-left: Wide establishing shot | Top-right: Medium shot from main entry point | Bottom-left: Detail shot of key prop or feature | Bottom-right: Reverse angle from opposite side. Identical lighting, color palette, and props across all four panels. No people in frame. Photorealistic, [光影基调描述], PANAVISION cinematic, IMAX 70mm film grain. No text, no labels, no watermark.\n```\n\n### 分镜表格图提示词（图生图）\n```\nA professional storyboard sheet titled \"[Shot ID] 运镜轨迹示意图\" in Chinese, clean white background, top-to-bottom vertical layout.\n[Header]: bold Chinese title \"镜头运动轨迹示意图\"; subtitle: \"[本 shot 剧情一句话概括]\"; legend box — colored dashed arrows: 推进=red, 拉远=blue, 环绕=green, 升降=purple, 跟随=orange, 固定=cyan.\n[Main content — one row per internal cut]: Left (10%): numbered circle + Chinese shot description (景别 + 动作摘要, 2–3 lines) Center (70%): wide cinematic frame showing the scene; camera icon 📷 marks start position, dashed arrow shows movement path Right (20%): Chinese shot type label + one-sentence purpose note\n[Footer]: pacing summary in rounded box: \"整体节奏：[情绪词1]→[情绪词2]→[情绪词3]\"\nStyle: all text Simplified Chinese, clean sans-serif; frame thumbnails photorealistic, matching attached reference images exactly; vertical 3:4 layout.\nReference images attached — Image 1: Character sheet for @[角色代号] — replicate exactly; Image 2: Location sheet for @[场景代号] — replicate exactly.\n```\n\n### 单 shot 视频提示词模板\n每个 shot 输出一段提示词，结构如下：\n```\n[影像风格]: PANAVISION cinematic, anamorphic widescreen, IMAX 70mm film grain, 24fps, natural depth of field, three-point dramatic lighting, cinematic color grading.\n[场景]: <<<image_场景>>> — [当前光影基调描述]\n[角色]: <<<image_角色>>> — [当前服装/状态，与设定图一致]\n[镜头]: [景别] + [机位角度] + [运镜方式]（示例：Medium waist shot, fixed camera, eye-level）\n[动作]: [人物动作分解，按叙事顺序推进，主要动作→次要动作；避免写绝对秒数，用 slow / quick / lingering 描述节奏]\n[音效]: <[音效描述，紧贴对应动作]>\n[台词]: {[角色]说: \"[台词原文]\"} (with [情绪词] tone)\n[禁止]: No subtitles, no background music, no text overlay, no watermark.\n[时长]: Approximately [X]s\n```\n\n**固定尾部规则**：\n- 所有视频提示词末尾必须含 `No subtitles, no background music, no text overlay`——BGM 在 audio_layer 独立生成后期混音；台词/音效可内嵌。\n- 内嵌格式：音乐 `(...)`、音效 `<...>`、台词 `{...}`（非项目语言需在括号前标明语言）、片内字幕 `【...】`；台词括号内只写原文，不加情绪标注。\n- **不依赖绝对时间戳**（如 \"0–3s\"）描述动作节奏，改用速度形容词（slow/quick/lingering）。\n\n## 竖屏付费短剧（形态 A）—— 钩子与反转节奏库\n\n竖屏付费短剧成败在**前 3 秒钩子**与**反转密度**。\n\n**黄金 3 秒钩子（clip 1 必命中其一）**：\n- **悬念前置**：先抛未解强冲突（如\"她在婚礼上当众撕掉喜帖\"）。\n- **身份落差**：主角被极致羞辱/误解（如\"总裁助理被当众泼咖啡\"）。\n- **反差人设**：表面弱势者亮出隐藏身份的第一丝线索。\n- **致命悬念**：倒计时/威胁（如\"还有 10 秒，门就炸开\"）。\n\n**反转节奏（按时长分布反转点）**：\n- 60s（≈6–8 clip）：钩子(clip1) → 小反转(clip3) → 主反转(clip5) → 留扣收尾。\n- 90s（≈9–11 clip）：钩子 → 铺垫 → 反转1 → 加码 → 反转2 → 爽点释放 → 留扣下集。\n- **每集结尾留扣（cliffhanger）**：多集必备，末镜抛新悬念逼追更。\n\n**竖屏构图铁律**：\n- 9:16 主体居中偏上，**关键信息放画面上 2/3**（下方常被 UI/字幕遮挡）。\n- 近景/特写为主——竖屏看脸看情绪，远景信息密度低不适配。\n- 台词是短剧核心载体：写进视频 prompt 的对白 beat，关键反转台词要掷地有声。\n\n## 多角色同框 —— 先合成后动画\n\n某镜头 2+ 独立角色需互动（对峙/对话/打斗）时，**不要**把多张松散角色图直接喂视频引擎（会丢参考、构图崩）。走三步：\n1. **主合成帧**：`generate_image_v3` 把所有角色放进同一场景与光照，`reference_nodes` 依次引用各角色锚点，生成一张静态合成图。\n2. **用户审合成图**：确认角色位置/世界观对了再动画化。\n3. **动画化**：把合成图作为**唯一起始参考帧**喂 `generate_video_v3`（prompt 只描述动作与运镜，别复述静态帧）。\n\n> 单角色镜头不需合成图——直接引用该角色锚点走标准逐镜生成。合成图只为多角色同框而设。\n\n## 多集连续剧（形态 C）—— 跨集一致性\n\n第 5 集的霸总必须和第 1 集同一张脸、同一个世界。三支柱：\n1. **角色身份持久化**：每个主角一个持久锚点节点，跨集复用，一次建立无限集用。\n2. **世界观 bible 持久化**：把场景元素、Film Lock、角色注册表写入 bible 文件（`write_file_v2`），下一集开工先读回，不重新发明。\n3. **剧集连续性**：每集片头可承接上集留扣，每集片尾留新扣。\n\n**开工流程**：第 1 集跑完整流水线并落盘 bible；第 N 集（N>1）先读回 bible + 角色注册表 → 复用已有锚点、跳过资产重建 → 仅为本集**新增**角色/场景生成新锚点 → 编剧承接上集留扣 → 视觉沿用第 1 集摄影包（不重选风格）。每集独立产出 `ep<N>_final`，可选合集拼接。\n\n## 视频剪辑 / 组装\n\n### 首尾帧衔接策略\n- **第一个 shot**：以对应场景四视图中的建立全景角度作 start_frame。\n- **后续每个 shot**：以上一个 shot 视频的最后一帧作本 shot 的 start_frame，确保人物位置/朝向/手持物与该 shot 空间锚点卡的初始状态完全吻合。**如有偏差须重新生成上一 shot 或调整本 shot 空间锚点描述，不得跳过检查直接拼接**。\n\n### 剪辑节奏与过渡\n- 按 Storyboard shot 顺序组装；对话密集段落保持紧凑剪辑，情绪特写给足呼吸时间。\n- 同一物理空间内相邻 shot 优先无缝硬切；跨空间切换可用淡入淡出（0.3s 以内），避免过度使用转场特效。\n- **180° 轴线规则**：两个相邻 shot 间若跳轴，在中间插入一个正面或过肩过渡 shot，而非强行拼接。\n\n### 音频混音层级\n- **BGM** 音量低于人声 8–12 dB，作底层垫乐；情绪高潮段可提升 3–5 dB。\n- **台词/音效**已内嵌在视频轨中，组装时不额外叠加同类音频，避免重复。\n- **旁白** 音量与台词层平齐，需在时间线上与对应 shot 对齐。\n- BGM 与旁白/台词交叉淡化（crossfade 0.5s），防止硬切产生音量跳变。\n\n### 常见生成失败与组装修复\n\n| 现象 | 原因 | 修复方向 |\n|---|---|---|\n| 角色外貌跨 shot 漂移 | 提示词角色描述不够具体 | 强化设定图特征词，重新生成该 shot（复用同一锚点） |\n| 跳轴 | 相邻 shot 机位跨过 180° 轴线 | 插入正面或过肩过渡 shot |\n| 镜头时长偏差 | 模型对绝对秒数不敏感 | 改用 slow/quick/lingering 节奏词，组装时用时间线裁剪微调 |\n| 字幕乱入 | 视频提示词未明确禁止 | 强化 no subtitles, no text overlay，重新生成 |\n| 首尾帧不衔接 | 上一 shot 末帧人物已偏离空间锚点 | 将本 shot 第一个内切镜设计为过渡镜，引导画面回到锚点 |\n\n### 导出基准\n- 视频轨分辨率对齐生成时的最高规格（默认 720p）；如需提升，先做超分上采样再导出。\n- 帧率 24fps；如需流畅慢动作片段，对目标 shot 单独做帧插值（提升至 60fps）后再并入时间线。\n\n## 模式路由（按复杂度缩短路径）\n\n- 形态 B 单集 + 单镜 + 无叙事 → LITE（最简编剧 → 单镜 prompt，跳过导演）。\n- 形态 A/B 单集 2–3 镜 → 轻量（导演从简，无 treatment 门）。\n- 形态 A/B 单集 4+ 镜 或 形态 C → 完整流水线（+ 多集持久化）。C 永远走完整，N>1 时走\"读 bible → 增量\"缩短路径。\n\n## 门（GATES · 通过前必须满足）\n\n| 门 | 在…之后 | 通过前必须满足 |\n|---|---|---|\n| **S0 形态门** | 启动协议 | 形态 A/B/C 已定、宽高比已锁、时长/集数已收集 |\n| **S1 身份门** | 角色身份方案 | 每个主角的身份路径已定（持久锚点/一次性设定图/上传照片/文本起步）；多集已决定用持久锚点 |\n| **S2 分镜门** | Storyboard 设计 | 自检清单七项全过并向用户报告；用户已确认 Storyboard 草稿 |\n| **S3 设定图门** | 媒体生成设定图 | 所有 key_element 设定图经用户确认视觉风格与剧本一致 |\n| **S 合成门** | 多角色同框 | 每个 2+ 角色同框镜头已先出静态合成图并经用户审 |\n| **S4 组装门** | 分镜视频完成 | 所有分镜视频生成完毕、首尾帧衔接已核 |\n| **S 多集门** | 多集收尾 | 每集收尾已把角色注册表 + 摄影包 + bible 写入文件 |\n\n任一门未过 → 不前进，先补齐。（源另有 S 参数门/S 积分门/S 中文门——本环境无积分系统、prompt 语言随用户，已适配去除。）\n\n**关于 G1–G5（Higgsfield 社区另一版本命名的审批门）**：该版本称\"外加 cinematic-flow 的 G1–G5 全部适用\"，但其中只有两个门在源文本里给出了具体判据，已吸收进本 skill：**G2 Scope 门**（fits/扩展/收窄/接受四选一，见「剧本规模评估」）、**G4 Film Lock+Shot Plan 审批门**（设定图与 Storyboard 均需用户确认，对应本表 S3/S2）。G1/G3/G5 在该源文件里也只是点名、未给出判据，且指向的 `cinematic-flow` 完整定义在本仓库任何版本（含已迁移的 `industry/cinematic-flow`）中都未找到对应内容——不属于\"我漏抄\"，是源链路本身的断链引用，此处如实记录、不臆造判据。\n\n## 修复（用户/QA 驱动，四档，由轻到重）\n\n- **Clip Patch（补丁）**：单镜局部问题，微调 prompt 或换锚点重生成该镜。\n- **Clip Regen（重生）**：单镜整体不行，同规格重出。\n- **Restructure（重构）**：分镜结构/节奏有问题，回到 Shot Plan 调整镜序或时长再局部重生成。\n- **Full Regen（全重生）**：风格锁或身份方案错，回上游重定摄影包/锚点后整体重来。\n\n可选 QA：`analyze_video` 查跨镜一致/时序/物理/形变，按失败修复表处置（见 video-generation-qa）。\n\n**QA 执行细节（避免假通过）**：\n- **category 字符串精确匹配**：`analyze_video` 返回的问题分类标签（如跨镜一致性/时序错乱/物理穿模/肢体形变）必须按其原始字符串精确匹配后再分流到对应修复档位，不得按大意归类——模糊归类会导致同类问题走错修复路径（例如把\"物理穿模\"误归\"跨镜一致性\"就修不对地方）。\n- **必须用本地文件，不用 CDN URL**：送入 `analyze_video` 的视频/帧必须是本地落盘文件（或本环境工具直接返回的产物句柄），不得用远端 CDN 链接代替——CDN 链接可能已过期、被裁剪或转码，会导致 QA 结果与实际产物不一致。\n- **失败如实报告，不伪造**：QA 检测不到、超时或返回不确定结果时，如实告知用户\"未能完成检测/结果不确定\"，不得为了流程顺畅而编造\"通过\"结论。\n\n## 默认值\n\n| 参数 | 竖屏 A | 横屏 B | 多集 C |\n|---|---|---|---|\n| 宽高比 | 9:16 | 16:9 | 用户选向 |\n| 分辨率 | 1080p（生成 720p 后可超分） | 同 | 同 |\n| 单片段时长 | 5–8s（≤15s 硬上限） | 8–12s | 5–10s |\n| 音频 | 内嵌台词/音效，BGM 单独合成 | 同 | 同 |\n| 节奏 | 高密度+留扣 | 叙事 | 高密度+集末留扣 |\n| prompt 语言 | 随用户 | 同 | 同 |\n\n## 错误处理\n\n- 多角色同框直接喂多图导致构图崩 → 回退合成图路径。\n- 多集第 N 集角色脸不一致 → 检查是否复用了同一锚点；未复用则用持久锚点重生成该镜头。\n- 找不到上集 bible → 确认第 1 集是否落盘、路径是否对。\n- 超 15s 片段 → 拆成独立镜，首尾帧衔接。\n- 其余按上方失败修复表处置。\n\n## 题材专项\n\n**古装甜宠短剧**（爆款三核心：人设反差/身份悬念/糖点密度 + 男女主设计 + 自动生成剧本）有专属创作公式 → 改道 **ancient-romance-drama**。其他题材（霸总/逆袭/重生/追妻等）按本 skill 通用流程 + 钩子反转节奏库处理。\n\n## 配合（query 可同时加载 / 也是本 skill 的评估组合）\n\n本 skill 自足，全流程工艺已内联，无源生依赖。以下为**边界劝退**（勿用本 skill，改道）：\n\n    边界(勿用本 skill,改道)：古装甜宠专属公式→ancient-romance-drama；单条 UGC 真人口播带货→ugc-flow；产品广告 TVC→tv-ad；纯角色设定图（无叙事）→image-generation。\n\n**可选前置（非依赖，仅用户从零开始无剧本时的建议路径）**：只有题材/点子、没有剧本 → 先用 auto-novel-writer（短剧专属自动编剧）或 script-writer（轻量故事结构）产出剧本，再回本 skill 做 Storyboard 与生成执行——编剧本身不在本 skill 工艺内（见头部说明，源为 Higgsfield 后端专属服务、无可迁移文本）。\n\n（可选增强：需要角色跨集锁脸细则可 query 同载 character-consistency；多段拼接机制细则可同载 montage；逐镜 QA 细则可同载 video-generation-qa——均为可选参考，非依赖，本 skill 已内联足够工艺自足运行。）", "extras": [], "cn": "AI短剧制片人"}, {"slug": "ai-song-composer", "desc": "写词谱曲，产出AI歌曲配方", "body": "# songwriting-and-ai-music\n\n用户要写歌词、作曲、生成歌曲/主题曲/有人声的音乐时读本 skill。最终音乐由 `generate_audio`（音乐）生成；本 skill 覆盖两件事：词曲创作工艺本身，以及怎么把音乐意图写成能被生成引擎正确执行的音乐 prompt。\n\n以下都是指南，不是铁律。艺术本就会刻意打破规则——服务于歌，而非服务于清单本身；哪条不服务这首歌，就丢开它。\n\n## 1. 歌曲结构（任选一种或自造）\n\n常见骨架，可混用/改造/整个丢开：\n\n```\nABABCB  主歌/副歌/主歌/副歌/桥段/副歌     （多数流行/摇滚）\nAABA    主歌/主歌/桥段/主歌（副歌型叠句）   （爵士标准曲、抒情曲）\nABAB    主歌/副歌交替                      （简单直接）\nAAA     主歌/主歌/主歌（无副歌、叙事体）    （民谣、说故事）\n```\n\n六个积木：\n- **Intro** —— 定调、把听者拉进来\n- **Verse（主歌）** —— 故事、细节、世界观铺陈\n- **Pre-Chorus（导歌）** —— 可选，副歌前的张力斜坡\n- **Chorus（副歌）** —— 情绪核心，被记住的部分\n- **Bridge（桥段）** —— 一次绕道，视角或调性的转折\n- **Outro** —— 告别，可呼应或颠覆前文\n\n不必六件都用。有些好歌只有一段反复演化的素材。**结构服务情绪，不是反过来。**\n\n## 2. 押韵、格律与声音\n\n**韵型（从紧到松）：**\n- 完美韵 Perfect：lean/mean\n- 家族韵 Family：crate/braid\n- 元音谐音 Assonance：had/glass（元音相同、结尾不同）\n- 辅音谐音 Consonance：scene/when（元音不同、结尾相近）\n- 近似/斜韵 Near/slant：足以暗示关联但不锁死\n\n混用为佳：全用完美韵容易像儿歌；全用斜韵容易显得敷衍。混合处才是活的。\n\n**内韵**：不只押行尾，行内也押。\"We pruned the lies from bleeding trees / Distilled the storm from entropy\" —— \"lies/flies\"、\"trees/entropy\" 制造行内回声。\n\n**格律（Meter）**：重音与非重音音节的节奏。\n- 平行句之间音节数匹配有助于可唱性\n- **重音位置比总音节数更重要**\n- 念出声——卡壳的地方就是格律要修的地方\n- 刻意打破格律可制造强调或意外感\n\n## 3. 情绪动态弧\n\n把一首歌当成一段旅程，而非一条平路。\n\n**能量映射（粗略参考，非硬性规定）：**\n```\nIntro: 2-3  |  Verse: 5-6  |  Pre-Chorus: 7\nChorus: 8-9  |  Bridge: 视情况  |  Final Chorus: 9-10\n```\n\n最强的动态手法是**对比**：\n- 尖叫前先耳语，比一路尖叫更有冲击力\n- 密集前先稀疏；快前先慢；高前先低\n- \"落地\"之所以有效，是因为前面有铺垫\n- **静默本身也是一件乐器**\n\n\"耳语→咆哮→耳语\"：从亲密开始，推到全力，再退回脆弱。适用于抒情曲、史诗曲、赞歌。\n\n## 4. 写词的手艺\n\n**Show, don't tell（多数情况下）：**\n- \"我很难过\" = 扁平\n- \"门口挂钩上还留着你的卫衣\" = 有生命力\n- 但有时候直白地说\"我付出我的生命\"本身就是力量所在——不是铁律\n\n**Hook（记忆点）：**\n- 被记住、被哼唱、被反复念叨的那一句\n- 通常是标题或核心短语\n- 旋律 + 歌词 + 情绪三者对齐时效果最好\n- 放在最该落地的位置（常是副歌的第一句或最后一句）\n\n**Prosody（歌词与音乐互相配合）：**\n- 稳定情绪（解决感、平静）配解决式旋律、完美韵、已解决和弦\n- 不稳定情绪（渴望、疑虑）配游移旋律、近似韵、未解决和弦\n- 主歌旋律通常偏低，副歌走高——但如果服务于歌，可以反过来\n\n**要避免的（除非你是故意为之）：**\n- 自动驾驶式的陈词滥调（\"heart of gold\" 没有铺垫地直接用）\n- 为凑韵硬拗语序（\"Yoda 式\"倒装）\n- 每段能量都一样（动态扁平）\n- 把初稿当圣旨——修改本身就是创作的一部分\n\n## 5. 改编与仿写（Parody and Adaptation）\n\n用新词改写一首已有歌曲时：\n\n**先画骨架**：映射原曲结构——\n- 数每行音节数\n- 标出韵式（ABAB、AABB 等）\n- 识别哪些音节是**重音**\n- 记下长音/延音落在哪里\n\n**填新词对齐骨架：**\n- 让重音音节对齐原曲同样的拍点\n- 总音节数可有 1-2 个非重音音节的浮动空间\n- 长音处尽量匹配原曲的**元音音**（原曲长音是 \"LOOOVE\" 的 \"oo\" 音，\"FOOOD\" 比 \"LIFE\" 更贴合）\n- 单音节位置的换词是保节奏最干净的手法（Crime → Code、Snake → Noose）\n- 把新词唱到原曲旋律上——卡壳就改\n\n**概念（Concept）：**\n- 选一个足以撑起整首歌的概念\n- 从标题/Hook 出发向外搭建\n- 先大量发想原料（双关、短语、意象），再挑最好的填进结构\n- 若某处必须落一句特定台词，可反向从韵式倒推搭建前文\n\n**保留少量原句**：留几句原曲的台词或结构完整不改，能增加辨识度，让听者感受到与原曲的连接。\n\n## 6. 写音乐 Prompt（交给 `generate_audio` · 音乐生成）\n\n### 风格/流派描述字段\n\n**公式（按需调整）：** 流派 + 情绪 + 年代 + 乐器 + 人声特征 + 制作质感 + 动态\n\n```\n差：  \"悲伤摇滚歌曲\"\n好：  \"电影感管弦乐间谍惊悚风，1960 年代冷战时期，烟熏性感女声，\n       大乐队爵士，铜管声部（小号+法国号），恢弘弦乐，小调，\n       复古模拟温暖质感\"\n```\n\n**描述\"旅程\"，而非只列流派：**\n```\n\"以幽灵般的耳语声、稀疏钢琴开场。逐渐叠入弱音铜管。\n 副歌处推向全编制管弦乐。第二段主歌以原始咆哮式强唱爆发。\n 尾奏收回到孤单钢琴与脆弱耳语，渐弱至寂静。\"\n```\n\n**要点：**\n- 风格字段可以写得较长——把预算都用在描述\"旅程\"上，不要只堆流派词\n- **不得出现知名音乐人姓名或商标**——描述声音本身，而非引用作品/艺人\n  - 用 \"1960 年代冷战谍战铜管\" 而非某具体电影配乐师风格名\n  - 用 \"90 年代油渍摇滚（grunge）\" 而非某具体乐队名\n- 有偏好时明确写出 BPM 与调性\n- 用\"排除风格\"类描述说明你**不**要什么\n- 反直觉的流派组合常能出彩：\"bossa nova + trap\"、\"阿巴拉契亚哥特\"、\"chiptune 爵士\"\n- 建一个**人声人设（persona）**，而不只是给性别：\"一位饱经风霜的驻唱歌手，烟嗓带沙哑，从脆弱起唱、逐渐推向毁灭性的爆发力\"\n\n### Metatags（放在歌词字段的方括号内 `[标签]`）\n\n**结构类：**\n`[Intro] [Verse] [Verse 1] [Pre-Chorus] [Chorus] [Post-Chorus] [Hook] [Bridge] [Interlude] [Instrumental] [Instrumental Break] [Guitar Solo] [Breakdown] [Build-up] [Outro] [Silence] [End]`\n\n**演唱表现类：**\n`[Whispered] [Spoken Word] [Belted] [Falsetto] [Powerful] [Soulful] [Raspy] [Breathy] [Smooth] [Gritty] [Staccato] [Legato] [Vibrato] [Melismatic] [Harmonies] [Choir] [Harmonized Chorus]`\n\n**动态类：**\n`[High Energy] [Low Energy] [Building Energy] [Explosive] [Emotional Climax] [Gradual swell] [Orchestral swell] [Quiet arrangement] [Falling tension] [Slow Down]`\n\n**性别类：**\n`[Female Vocals] [Male Vocals]`\n\n**氛围类：**\n`[Melancholic] [Euphoric] [Nostalgic] [Aggressive] [Dreamy] [Intimate] [Dark Atmosphere]`\n\n**音效类：**\n`[Vinyl Crackle] [Rain] [Applause] [Static] [Thunder]`\n\n**使用规则：**\n- 标签同时放风格字段和歌词字段两处，互相强化\n- 每段最多 5-8 个标签——太多会让引擎困惑\n- 不要自相矛盾（同一段落里不要同时 `[Calm]` 又 `[Aggressive]`）\n\n### 分离风格/歌词的创作模式\n\n- 正式创作请始终使用\"分离 Style + Lyrics\"的模式（而非单栏简易模式）\n- 歌词字段容量上限大致在 ~3,000 字符（约 40-60 行）以内规划\n- 务必加结构标签——没有结构标签时引擎会默认退化成平铺的主歌/副歌/主歌、没有情绪弧\n\n## 7. AI 歌手的咬字技巧（Phonetic Tricks）\n\nAI 人声模型不是\"读\"字，是\"发音\"字——要主动引导它：\n\n**按读音拼写：**\n- 按实际发音重新拼写词语（如 \"through\" → \"thru\"）\n- 专有名词失败率最高——务必提前小段测试\n- 用近音词强制正确发音（如把易错的词换成同音但更易读对的拼法）\n- 用连字符引导音节切分（如 \"Re-search\"、\"bio-engineering\"）\n\n**演唱控制：**\n- 全大写 = 更响、更强烈\n- 元音拉长（\"lo-o-o-ove\"）= 延音/花腔（melisma）\n- 省略号（\"I... need... you\"）= 戏剧性停顿\n- 连字符拉伸（\"ne-e-ed\"）= 情感延展\n\n**始终注意：**\n- 数字拼写成文字（\"24/7\" → \"twenty four seven\"）\n- 缩写词加空格分开字母（\"AI\" → \"A I\" 或 \"A-I\"）\n- 专有名词/生僻词先用一段 30 秒左右的短片单独测试\n- **一旦生成，发音已经定型**——要改先改歌词文本再重新生成，而非事后修正\n\n## 8. 创作工作流\n\n1. 先写概念/Hook——这首歌的情绪核心是什么？\n2. 若是改编，先映射原曲结构（音节、韵式、重音）\n3. 自由发想原料——先不设结构地头脑风暴\n4. 把词填进结构草稿\n5. 念/唱出声——抓卡壳的地方，修格律\n6. 写 Suno 风格描述——把动态旅程画出来\n7. 给歌词加 metatags 做演唱指导\n8. 至少生成 3-5 个版本——当成\"录音 take\"来对待\n9. 挑最好的一版，用续写/延展功能在有潜力的段落上继续build\n10. 若无意中出现了神来之笔，留下它\n\n**预期心理准备**：大约每 3-5 次生成才出一个满意结果。反复修改是常态。风格在续写/延展中会漂移——续写时要重新申明流派/情绪。\n\n## 9. 经验教训（Lessons Learned）\n\n- 在风格字段里描述**动态弧**（\"耳语→咆哮→耳语\"）比单纯堆流派词重要得多——它相当于给引擎一张\"演唱地图\"。\n- 仿写时保留几句原词能增加辨识度和情感重量——听众能感受到原曲的\"幽灵\"还在。\n- 桥段（Bridge）是转换意象的最佳位置：把原曲具体指代换成你主题的隐喻，同时保留其情感功能（反思/转折/顿悟）。\n- Hook/标签处的单音节替换是既保持节奏又改变含义的最干净手法。\n- 一段强有力的人声人设描述，比任何单个 metatag 都更能左右效果。\n- 不要拘泥于规则本身。如果某一句打破了格律但打动人心，就留着它——**感觉才是本体，工艺服务于艺术，而非反过来**。\n\n## 工具适配说明\n\n最终音乐生成统一走本环境的 `generate_audio`（音乐）；本 skill 交付的是写给它的音乐 prompt（风格描述 + 结构化歌词/metatags），不涉及具体平台 UI 操作（如某平台的字数上限、\"排除风格\"输入框等属该平台运维细节，非创作工艺，不在本 skill 范围内——工艺本身与平台无关，照常适用）。歌名/艺人名/商标类规则维持源意图：不得在音乐 prompt 中出现知名音乐人姓名或商标，一律描述声音本身。\n\n按 SP：视频片段不内嵌 BGM，音乐由 `generate_audio` 单独生成，合成阶段混音。\n\n## 边界（差异说明，非依赖）\n\n阿拉伯语歌词咬字/注音的专门深化 → `arabic-tashkeel-suno`；卡点配乐/与已有画面时间线对齐 → `soundtrack-composer`。本 skill 是通用词曲创作 + 音乐 prompt 工艺的单一真源，以上均为场景差异导航，非依赖，本 skill 自足。", "extras": [], "cn": "AI词曲创作人"}, {"slug": "anthropomorphic-animal-vlogger", "desc": "拟人动物博主出镜口播搞笑短视频,真实竖屏风格", "body": "---\n\n## name: animal-vlogger\\\\\n\nnamespace: industry\\\ntitle: \"拟人动物 Vlog\"\\\ndescription: \"做超写实、搞笑的拟人化动物像人类 Vlogger 一样出镜的短视频——指定动物类型/所在地/穿着/对白（内嵌台词对口型），真实世界竖屏场景。图生视频流程，用 generate_image_v3 出形象图 + generate_video_v3 成片。\"\\\nversion: 2\n\n# animal-vlogger\n\n做\"拟人动物博主\"这类病毒式搞笑内容时用本 skill：一只穿着衣服、直立行走、带人类表情的动物，像人类 Vlogger 一样举着自拍杆在真实场景里对镜说话。核心卖点是**超写实 + 拟人反差 + 生活化吐槽**的喜剧感。\n\n> 本环境适配：图像/图生视频引擎 → `generate_image_v3`（出拟人动物形象图）+ `generate_video_v3`（图生视频、对镜说话、台词内嵌对口型）。源为 muapi 配方（MIT），表达已重写、工具词汇已适配；自足，无外部依赖。\n\n## 输入\n\n名称必填默认说明动物类型否猴子狗 / 猫 / 熊 等；越有表情张力越好所在地否热闹市井街头真实生活场景（闹市、集市、地铁口…），提供环境细节与烟火气穿着否亮红 T 恤单件亮色好记的服装，强化拟人反差对白否—供对口型的台词，可任意语言/方言；生活化吐槽腔调最出效果\n\n缺输入就用默认或向用户补一句，不空等。\n\n## 流程（两阶段，图生视频）\n\n### 阶段 A — 出拟人动物形象图（`generate_image_v3`）\n\n一次调用生成基底形象图，构图要点全部内联进 prompt：\n\n- **主体**：超写实、电影感的 {动物类型} 特写；**拟人化**——直立、穿着 {穿着}、手持自拍杆，神态像个可信的博主。\n- **喜剧微表情**：按场景给\"入戏\"的细节（如天热就\"微微冒汗、略显烦躁\"），这是搞笑感的来源，别只给中性表情。\n- **场景与背景**：置于 {所在地}，背景填满生活细节（路边摊、吃东西的人群、鲜艳的城市街景），制造真实烟火气。\n- **画质**：photorealistic、高细节、电影级质感。\n- **画幅**：`aspect_ratio` = 9:16（竖屏 vlog）。技术规格走字段，不写进 prompt 正文。\n\n出图后 ⏸ 呈现给用户确认，再进阶段 B。\n\n### 阶段 B — 图生视频成片（`generate_video_v3`）\n\n以阶段 A 确认的图为参考图（`role: image` 首帧/参考），一次调用动起来：\n\n- **动作与镜头**：开场自拍模式、镜头略广角；{动物类型} 表情丰富、可带\"略显不满/嫌弃\"的喜剧情绪，自然说话；穿插对不满脸的快速推近特写；平滑的云台式运镜。\n- **对白对口型**：把 {对白} 台词内嵌进 prompt 的 `Audio:` 段驱动口型与配音（引擎原生渲染音频）；同段补环境声（街市嘈杂声）。**没有独立 lipsync 工具——口型靠内嵌台词生成。** BGM 不内嵌，如需另用音频生成后合成阶段混音。\n- **基调**：超写实 + 搞笑，环境声在场。\n- **时长/画幅**：`duration_sec` 整数 ≤15（单镜；要更长的段落拆成独立镜、用上段末帧作下段首帧锚点衔接）；`aspect_ratio` = 9:16。\n\n出片后呈现最终成片。\n\n## 触发词\n\n拟人动物视频、搞笑猴子视频、动物博主、动物 vlog、动物对口型说话视频。\n\n## 配合\n\n无跨 skill 依赖，本 skill 自足（源为独立 muapi 配方，无引用其它 skill）。\\\n边界（勿用本 skill，改道）：会说话的宝宝 → talking-baby-video；口播/讲解真人 → talking-head-director；非拟人对口型的萌宠日常打工 vlog → pet-worker-vlog。", "extras": [], "cn": "动物博主自媒体视频"}, {"slug": "apple-style", "desc": "打造科技感广告", "body": "## 一、产品类型分类（识别产品 → 拿默认镜头组合）\n\n产品类型细节看点人物互动动作（示例·需现推）默认镜头组合耳机 / 音频陶瓷/金属轮廓·网面·腔体戴上耳机、闭眼随节奏点头/律动/跳舞模特戴耳机律动 → 半圈环绕 → 微距材质细节 → 微距飞掠网面 → 落版手机 / 平板 / 笔电边框倒角·屏幕·摄像头·接口解锁滑动、举起拍摄、看到内容的反应模特使用(有反应) → 单向推/拉+半圈环绕 → 微距细节 → 材质特写 → 落版智能穿戴 / 手表表盘·表冠·传感器·表带抬腕看表、运动查看数据、转动表冠模特抬腕查看 → 半圈环绕 → 微距 → 材质特写 → 落版相机 / 影像镜组·卡口·转盘·握把举起取景、按快门、看回放微笑模特取景拍照 → 微距飞掠镜组 → 半圈环绕 → 材质特写美妆 / 个护瓶身·质地·涂抹·光泽对镜涂抹、抿唇、端详效果；吹风机吹发模特使用(涂抹/吹发) → 微距质地 → 半圈环绕 → 材质特写汽车 / 出行车身线条·内饰·轮毂·灯组拉门坐进、点火、握方向盘起步/飙车模特上车启动 → 内饰微距 → 半圈环绕 → 疾驰镜头运动 / 户外材质·结构·功能系鞋带、起跑腾空、发力使用模特起跑/发力 → 微距材质 → 半圈环绕 → 落版数码配件 / 其他消费品设计·材质·结构按真实用途现推一个使用动作模特使用 → 半圈环绕+单向推/拉 → 微距材质 → 落版\n\n> 不在表内就挑细节看点最接近的一行，或在第二节手选。**「人物互动动作」一列只是示例，任何产品都要按第二节 A「互动判断」现推最自然的用法**——绝不呆站举着。一条片通常 = 模特互动镜头 + 2–3 个细节镜头顺接（无人模式则去掉模特镜头，用产品 hero / 暗场揭晓替代）。\n\n---\n\n## 二、镜头手法（模特镜头打底 + 细节穿插）\n\n### A. 模特镜头（有人模式 · 打底）\n\n> **★ 焦点原则（硬约束）**：模特与产品互动时，**焦点与视觉中心始终在产品上**——产品清晰、居于视觉重心、被光与景别强调；**模特的面部与形象只是辅助/衬托**（负责氛围、气质、比例与真实感），不喧宾夺主。构图与对焦优先给产品：浅景深虚化模特、实焦压在产品上；人物可只入镜局部（手、肩、侧脸、佩戴部位）。\n\n> **★★ 互动判断（硬约束 · 先想清楚\"人怎么用它\"再写镜头）**：**禁止让人物呆站着只是\"举着/拿着\"产品、没动作没表情。** 出模特镜头前，必须先判断产品的**真实用途、常见场景、正确握持/佩戴/接触位置、需要哪只手/身体部位、人物视线与身体重心如何自然跟随**，再推出一个**具体、有动机的动作与情境**，让人物真正\"用起来\"，并带**明确表情/情绪**。例如：\n>\n> - 耳机 → 戴上耳机、随节奏点头/闭眼沉浸/跟着律动跳舞\n> - 汽车/钥匙 → 拉开车门坐进去、点火、握方向盘起步加速/飙车\n> - 吹风机 → 拿起吹风机吹头发，头发被气流吹动\n> - 相机 → 举起相机取景、按下快门拍照，回看照片露出满意神情\n> - 口红/美妆 → 对镜涂抹、抿唇、端详效果\n> - 运动鞋 → 系鞋带、起跑/腾空\n> - 手机 → 解锁、滑动、举起拍摄、看到内容的反应\n> ****动作合理性检查（必须先做）**：`谁在什么场景为什么用 → 正确握持/佩戴/接触点 → 起势→接触/操作→反馈/结果 → 视线、肩肘手腕、身体重心与微表情自然跟随 → 产品始终是焦点`。动作要有预备、操作、停顿反馈和自然表情，禁站桩举物、手指悬空、身体僵直、用法错误。若全身使用不合常理，自动改成手部/半身/局部佩戴或无人 hero+细节，不硬塞模特。\n> ****必须完整展示使用过程（硬约束）**：有人模式下，视频里一定要拍出人物**使用产品的完整过程**（起始 → 使用中 → 结果/反应），不能只给一个\"持有/静态展示\"画面、也不能跳过使用动作直接切细节。使用过程本身就是内容主线。\n\n- **动作要具体连贯**：写清起始→过程→结果的小动作链（如\"拿起相机→举到眼前取景→按下快门→放下相机看回放微笑\"），同时写握持/接触部位、视线、肩肘手腕或重心随动，不是静态 pose。\n- **表情要到位**：沉浸、专注、惊喜、满意、享受……与动作匹配、自然可信，**禁止面瘫呆滞，也禁止夸张怪异**。\n- **产品仍是焦点**：动作服务于\"把产品用起来、被看见\"；对焦压产品、浅景深虚化人物，人物可只入镜局部。\n- 用 `{{Mixed N}}` 绑定选定模特，全程一致。\n\n### B. 产品细节镜头（穿插 · 以材质为主）\n\n1. **微距材质特写（主力）**：极致微距一镜一细节，掠射光扫过表面**呈现真实材质**——拉丝、阳极氧化、玻璃菲涅尔反射、陶瓷釉面、编织纹理。产品片高级感的主要来源。\n2. **微距飞掠（Macro Fly-through）**：镜头快速飞掠网面 / 材质表面。\n3. **暗场揭晓（Reveal from Black）**：产品从纯黑中被光逐渐点亮、缓缓浮现的 hero 登场（不用星空/深空）。\n4. **半圈慢环绕（Half Orbit）**：缓慢匀速环绕产品**最多半圈**（≤180°），欣赏外形与轮廓。\n\n> **不做 3D 拆解**：不做 3D 爆炸视图、内部剖切/透视、镜头穿梭进入产品内部等\"拆解/看内部\"镜头。产品靠**外部材质、光影、使用动作**来展示。\n>\n> 典型顺接：**模特使用（焦点在产品）→ 半圈环绕 → 微距材质细节 → 微距飞掠 → 落版**。\n>\n> 细节段落写法：**单向推近产品（只推不回拉）→ 逐一展示各部分细节（一镜一个，材质微距，可配最多半圈微环绕）→ 微距飞掠**，镜头连贯不跳帧；推与拉分属不同镜头；**不进入内部、不拆解**。\n\n### C. 运镜精华（从优质 prompt 提炼）\n\n- **暗场微距擦光**：极高精细度微距，纯黑/暗色渐变背景；一道锐利银色轮廓光或掠射光缓慢扫过产品边缘、孔洞、纹理，让结构内部产生深邃几何阴影，捕捉泡沫/织物/金属/陶瓷的触感纹理；高反差、慢动作、拒绝大面积照亮。\n- **线性高光扫材质**：近景锁定金属/玻璃/陶瓷局部，让一条线性高光沿表面缓慢滑过，显出拉丝、镀铬、菲涅尔反射和真实高光衰减。\n- **产品全貌亮相**：产品从底部或暗处缓慢升起，四分之三侧转到正面并居中定格；保持同一套暗调擦光，只勾边、不泛白，悬浮优雅，无直冲镜头、无机械抖动。\n- **多点联动特写**：全貌开场 → 半圈环绕联动 → 3 个焦点特写（保持约 15–20cm 距离，不贴脸怼）→ 拉回全貌。转场利用产品旋转、镜头转角、平移和拉升自然“滑入”下一焦点；锁定焦点后产品短暂停稳。\n- **运动分工**：镜头移动时产品可短暂停稳；产品旋转时镜头顺势滑行；最后快速但平滑 pull-back 回到广角全貌，产品定格在最佳展示姿态，亮度微调做品牌感收尾。\n\n---\n\n## 三、背景 与 光（暗色纯色/渐变预设）\n\n**背景（全片统一；渐变不以白色为基调）**\n\n- **纯黑**：100% 纯黑无缝背景，产品与模特被光从黑暗中雕刻出来。\n- **黑橙渐变**：黑色 → 深焦橙/燃烧橙，像暗场里的余烬，只作背景色温，不抢产品。\n- **黑红渐变**：黑色 → 深红/酒红，戏剧张力强，适合耳机、香水、汽车、潮流数码。\n- **黑金渐变**：黑色 → 暗金/琥珀金，偏奢华，适合美妆、香水、腕表。\n- **黑灰烟熏**：黑色 → 炭灰，最低风险，保留极简高级感。\n\n> 不用星空/深空、广袤空间、摄影棚场景、几何装饰；不要白色基调渐变。纯白只在用户明确指定时使用，不作为默认推荐。\n\n**光**\n\n- **边缘光 Rim**：干净中性白的边缘光勾勒产品光滑轮廓（纯黑背景首选，**不偏蓝**）。\n- **柔和均匀光**：通透无生硬阴影（仅用户明确要纯白时使用）。\n- **顶光 + 侧逆光**：戏剧性雕刻轮廓与侧影（纯黑背景）。\n- **掠射光**：显材质纹理（极致微距）。\n\n> **所有光用中性白，不偏蓝**；影调保持中性（可微暖），避免整体发蓝/冷蓝调。\n\n---\n\n## 四、DNA 硬规则（不可妥协 · 每条 prompt 必守）\n\n 1. **有人 / 无人由用户选**：开工先问是否需要模特（见 Step 2）。**有人模式**——用 `{{Mixed N}}` 绑定、用户挑 1–3 人，模特是气质/氛围的**辅助衬托**，产品始终是焦点与视觉中心（同框时对焦与构图重心压产品、浅景深虚化人物、面部/形象不喧宾夺主）。**无人模式**——不出现任何人（有些产品让人互动反而奇怪），全片由产品 hero 镜头 / 暗场揭晓 / 微距材质 / 半圈环绕撑起。\n 2. **开场即抓人 + 每镜都是有效镜头（硬约束）**：**开场节奏就要很快，第一帧就出现产品**（不要空镜/环境铺垫再慢慢引出）；**每一个镜头都必须是有效镜头**——服务于展示产品或推进节奏，**禁止废镜、无意义过场、纯氛围空镜、拖沓停留**；镜头一多就快切，不浪费任何一秒。\n 3. **★ 材质是高级感的命根（最高优先级 · 硬约束）**：**\"丑/廉价\"绝大多数是材质塑料感、假高光、CGI 塑料质感。** 每条 prompt 都**必须写清产品的具体材质与真实光学表现**，而不是笼统一句\"高级质感\"：\n    - 金属＝拉丝铝 / 阳极氧化 / 磨砂或抛光金属 + **真实高光衰减与各向异性反射**；\n    - 玻璃＝抛光玻璃 + **菲涅尔反射、清晰环境反射（如 HDRI 反射）、真实折射**；\n    - 陶瓷/塑胶＝哑光陶瓷釉面 / 软触感涂层，**避免廉价亮塑料感**；\n    - 硅胶/织物＝真实次表面散射 / 编织纹理。\\\n      固定词：`photorealistic PBR materials, physically-based rendering, true-to-life reflections, realistic fresnel and specular falloff, fine micro-surface texture, no plastic-looking material, no fake highlights, no CGI plastic look`。**材质对了，片子就不廉价——这条优先级高于运镜、光效、构图。**\n 4. **戏剧化布光服务材质**：干净中性白的边缘光 / 顶光+侧逆光 / 柔和均匀光；**布光的首要目的是让材质的反射、纹理、轮廓被看见**（真实反光 &gt; 花哨光效）；浅景深、film-grade、4K 超高清。**光用中性白，不偏蓝。**\n 5. **运镜平滑电影感（硬约束）**：平滑慢动作运镜为主，运动连续顺滑、有电影呼吸感、**绝不跳帧**。**① 环绕最多半圈（≤180°），禁止绕产品一整圈；② 推镜头与拉镜头不放在同一镜内——一个镜头只做推近或只做拉远，不要又推又拉（要变向就切下一镜）；③ 面部特写抓神态（仅有人模式）。** 不生硬卡顿 / 抖动 / 甩镜。\n 6. **不做 3D 拆解（硬约束）**：不做 3D 爆炸视图、内部剖切/透视、穿梭进入产品内部等拆解镜头。产品靠外部材质、光影、使用动作展示。\n 7. **色彩（硬约束）**：自然真实、电影调——**绝不过暖滤镜、也绝不整体发蓝/冷蓝调**；影调保持中性（可微暖），避免蓝色偏色；光用中性白（true-to-life color, neutral grade, no blue cast, no over-warm filter）。\n 8. **概念光效默认不用（易致丑 · 硬约束）**：发光光轨 / 粒子圆环 / 流动光带这类特效**极容易被 AI 生成成廉价土味、拉低质感——默认一律不加**。高级科技感应来自**干净的光比 + 真实材质反射**，不是满屏发光粒子。**仅**当产品本身概念强需要（如音频类可视化空间音频/降噪）**且用户明确要**时，才**极克制地用一次**（一个干净、优雅、克制的光效点，绝不铺满、绝不多处），否则宁可不用。\n 9. **极简留白 + 极简字幕**：构图干净、负空间讲究、一镜一信息；产品细节镜头要丰富（微距/材质/飞掠）展示方方面面，**但不要不停怼 logo**；字幕仅 SF Pro / Helvetica 极简 callout，少字、留白。\n10. **视频 prompt 音频规则（强制）**：每条 Seedance/视频生成 prompt 必须静音，末尾必须原样加入：`不生成背景音乐，不要任何声音。` 正文不要写 whoosh、click、环境音、拟音、提示音、chime、对白、旁白或任何声音设计。\n11. **收尾定版**：银色 / 深空灰**品牌 logo**（金属质感居中，换成产品自有 logo）于纯净背景 + 产品名 SF 字淡入 + 大量留白。\n12. **禁止**：废镜/无效空镜、单镜头逐个生成、3D 拆解/爆炸/剖切、叠化/叠画转场、过暖或发蓝滤镜、杂乱构图、塑料感材质、夸张怪异表情、廉价土味特效、塞满画面。\n\n---\n\n## 五、节奏规则（按时长 · 一律 15s 为一个生成片段）\n\n视频**一律以 15s 为一个生成片段**（不做单镜头逐个生成）；每个 15s 片段内部可含多镜头，交给模型自动切分。\n\n- **15s（快节奏）**：1 段。节奏一定要快——**人物动作与产品细节快速交替**，多镜头快切，剪辑点清晰。开场 3 秒即抓人（产品 hero / 暗场揭晓 / 使用动作）。\n- **30s（内容灵活编排）**：分 2 段 15s，**内容顺序自由**——不强制\"先人物、后细节\"，可按创意穿插（人物使用、hero 镜头、细节任意编排）；**有人模式下必须完整展示人物使用产品的过程**。**logo 落版只放最后一段结尾。**\n- **60s（内容灵活编排）**：分 4 段 15s，**内容顺序自由编排**（不强制固定顺序），逐段确认再续；有人模式确保含完整使用过程；**只在最后一段结尾做 logo 定版。**\n\n---\n\n## 六、锁定风格块（原样粘贴进 prompt 开头）\n\n**先放基底块**，再按需叠背景块 + 光块 + 模特/细节句，片尾接收尾块。\n\n**基底块 · ZH**\n\n```\n一部电影级高端产品广告片，film-grade 杰作，4K 超高清画质，照片级写实的物理材质（PBR）：\n真实反射、菲涅尔反射与真实高光衰减、细微表面纹理，杜绝塑料感、假高光、CGI 塑料质感；\n戏剧化高级布光凸显材质，自然真实色彩、无过暖也无冷蓝偏色、影调中性，浅景深，一尘不染的\n极简构图与大量留白，平滑的电影级运镜。\n```\n\n**基底块 · EN**\n\n```\nA cinematic high-end product commercial, film-grade masterpiece, 4K ultra-high-definition,\nphotorealistic PBR materials with true-to-life reflections, realistic fresnel and specular\nfalloff, fine micro-surface texture, no plastic-looking material, no fake highlights, no CGI\nplastic look, dramatic premium lighting that reveals the material, true-to-life color with a\nneutral grade — no blue cast and no over-warm filter, shallow depth of field, immaculate\nminimal composition with generous negative space, smooth cinematic camera motion.\n```\n\n**背景块 / 光块 / 模特·细节句 · ZH（按需各取一句叠在基底后）**\n\n```\n[背景·纯黑] 纯黑色无缝无限背景，产品与模特被光从黑暗中雕刻出来。\n[背景·黑橙渐变] 黑色到深焦橙/燃烧橙的暗色纯色渐变背景，像暗场余烬，不以白色为基调。\n[背景·黑红渐变] 黑色到深红/酒红的暗色纯色渐变背景，高反差、戏剧张力强，不以白色为基调。\n[背景·黑金渐变] 黑色到暗金/琥珀金的暗色纯色渐变背景，克制奢华，不以白色为基调。\n[背景·黑灰烟熏] 黑色到炭灰的暗色纯色渐变背景，低风险、极简高级。\n[光·Rim] 干净中性白的边缘光勾勒产品光滑轮廓（不偏蓝）。\n[光·顶+侧逆] 戏剧性顶光与侧逆光雕刻轮廓与侧影。\n[光·掠射] 掠射光扫过表面，在极致微距下呈现真实材质纹理。\n[模特] {{Mixed 1}}，一位上镜模特作气质衬托，以真实动作使用产品（写清具体动作+表情）；焦点与对焦压在产品上、浅景深柔化人物，产品清晰居于画面重心。\n[微距材质] 极致微距一镜一细节，掠射光显真实材质（拉丝/阳极氧化/菲涅尔反射/釉面/编织纹理）。\n[微距飞掠] 极端微距镜头快速飞掠网面 / 材质表面。\n[暗场揭晓] 产品在纯黑中被光逐渐点亮、缓缓浮现登场，中性白边缘光勾勒轮廓（不用星空/深空）。\n[半圈环绕] 平滑慢动作环绕产品最多半圈（≤180°），不绕整圈。\n```\n\n**背景块 / 句块 · EN（镜像）**\n\n```\n[BG·Black] a pure seamless infinite black background, product and model carved out by light.\n[BG·BlackOrange] a dark solid gradient from black to deep burnt orange, ember-like, no white base.\n[BG·BlackRed] a dark solid gradient from black to deep red / burgundy, dramatic, no white base.\n[BG·BlackGold] a dark solid gradient from black to dark amber gold, restrained luxury, no white base.\n[BG·BlackGray] a dark solid gradient from black to charcoal gray, minimal and premium.\n[Light·Rim] a clean neutral-white rim light outlining the product's smooth contour (no blue).\n[Model] {{Mixed 1}}, a photogenic model as an accent, using the product with a real, motivated action and matching expression; focus locked on the product, shallow DoF softening the person, product as the visual center.\n[Macro Material] extreme macro, one detail per shot, raking light revealing real material (brushed/anodized metal, fresnel glass reflection, ceramic glaze, woven mesh).\n[Macro Fly-through] an extreme macro shot flying fast across the mesh / material surface.\n[Reveal from Black] the product gradually lit and emerging from pure black, neutral-white rim light on its contour.\n[Half Orbit] a smooth slow-motion orbit up to 180 degrees, never a full circle.\n```\n\n**收尾落点块（片尾接上）· ZH**\n\n```\n以干净构图收尾：银色／深空灰品牌 logo 居中于纯净背景，下方以极简 SF 字体淡入产品名，\n大量留白。视频生成阶段不写任何声音；品牌感收束交给 Step 6 后期配乐完成。\n```\n\n---\n\n## 七、词汇库\n\n- **景别**：面部特写 face close-up / 极致微距 extreme macro / 特写 close-up / 中近 medium / 全景 wide clean shot。\n- **运镜（硬约束）**：单向推近 push-in（不回拉）/ 单向拉远 pull-out（与推分属不同镜）/ 半圈慢动作环绕 half orbit ≤180° / 微距飞掠 macro fly-through / 稳定跟拍 steady
