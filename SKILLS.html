 tracking。**禁**：绕一整圈 full 360° orbit、同一镜又推又拉 push-then-pull in one shot、穿梭进入内部/拆解。\n- **光**：干净中性白边缘光 clean neutral-white rim light（不偏蓝）/ 柔和均匀光 soft even light / 顶光+侧逆光 top + side-backlight / 掠射光 raking light。\n- **材质（每条必带 · 越具体越不廉价）**：photorealistic PBR materials / physically-based rendering / true-to-life reflections 真实反射 / realistic fresnel reflection 菲涅尔反射 / accurate specular falloff 真实高光衰减 / anisotropic brushed metal 各向异性拉丝金属 / anodized aluminium 阳极氧化铝 / polished glass with clear environment reflections 抛光玻璃带清晰环境反射 / matte ceramic glaze 哑光陶瓷釉 / soft-touch coating 软触涂层 / woven mesh 编织网眼 / subsurface scattering 次表面散射 / fine micro-surface texture 细微表面纹理。**防丑禁词**：`no plastic-looking material, no fake highlights, no CGI plastic look, no cheap glossy plastic`。\n- **色彩**：自然真实 true-to-life color / 中性影调 neutral grade / **no blue cast 无冷蓝偏色** / no over-warm filter 无过暖。\n- **静音（视频 prompt）**：每条视频生成 prompt 末尾固定加：`不生成背景音乐，不要任何声音。` 不写环境音、拟音、提示音、chime、对白、旁白。\n- **后期配乐（仅 Step 6）**：参考 SneakyFreak - Subway surf 的快节奏、鬼马、紧凑、surf rock + electronic groove；instrumental only, no vocals, no lyrics, no singing, no spoken voice；只参考节奏气质，不复制旋律、采样或可识别段落。\n- **Cut / 转场**：干净硬切 clean hard cut / 【硬切】 / 匹配剪辑 match cut / 无缝变形 morph（**禁 dissolve/叠化**）。\n- **运动质量（固定句，每条末尾加）**：`smooth fluid cinematic camera motion, steady consistent frame rate, no stutter, no frame drops, no jitter, seamless continuous coherent movement with natural motion blur.` 环绕镜头加 `slow steady cinematic half orbit up to 180 degrees, never a full circle`；推/拉镜头写明**单一方向**（`a single slow push-in` 或 `a single slow pull-out`，不在同镜又推又拉）。\n\n---\n\n## 工作流\n\n### Step 1 · 用户上传产品 / 给参考\n\n识别产品类型（查第一节）、形态/材质/卖点、关键细节看点、是否需要 `{{Mixed N}}`。**此阶段只识别与整理，不生成任何图片。反推参考片**：先抽帧读规格，再产同款。抽帧一行命令：\n\n```\nffmpeg -i input.mp4 -vf fps=1 -q:v 2 frames/frame_%04d.jpg   # 每秒1帧；密集分镜调 fps=2~4\n```\n\n逐帧读：模特镜头与细节怎么配、用了哪些手法、背景与光、节奏（15s 是否够快）、Cut、收尾定版，据此填回旋钮。\n\n### Step 2 · 一次性确认所有可提前选择项（生成图片前完成）\n\n在生成产品图、模特图、服装图、背景图之前，**一次性收集所有能提前选的内容**，不要逐题慢慢问、不要边生成边补问。给每项都留「你帮我定」：\n\n1. **模特与形象（第一题一次问完）**：有人/无人；若有人，同一题里立刻问完模特数量 1/2/3、性别、年龄段、国籍/人种形象、气质关键词、发型/身材倾向、服装参考/服装风格。禁止只问“是否出现模特”后，锁定选项再单独追问“模特形象偏好”。\n2. 产品类型、核心卖点、镜头组合、是否允许概念光效（默认否）。\n3. 时长 15s/30s/60s、画幅 16:9/9:16（视频一律 15s 为一段生成，无需再选生成模式）。\n4. 背景预设：纯黑 / 黑橙渐变 / 黑红渐变 / 黑金渐变 / 黑灰烟熏；纯白只在用户明确要时可选。\n5. slogan、产品名、logo/落版字、是否有背景参考图。\n6. 运镜偏好：暗场微距擦光 / 线性高光扫材质 / 全貌亮相 / 多点联动特写 / 你帮我定。\\\n   确认后输出一份「锁定选择清单」，后续图片与视频 prompt 严格按清单执行。若用户选择有人模式但漏填形象细节，先按同一轮里的「你帮我定」自动补全为自然上镜、日常休闲、不浮夸的模特设定，不要二次打断追问。\n\n### Step 3 · 生成参考图与 moodboard（按已锁定清单）\n\n> **所有参考图一律 16:9 输出**：产品三视图、产品细节三视图、服装 3-look 图、角色三视图、背景氛围图，全部按 16:9 生成（背景图用 image2，其余建议 GPT Image 保真/保一致）。\n\n1. `{{产品三视图}}`：正面 / 侧面 / 背面。\n2. `{{产品细节三视图}}`：3 个关键可见细节（耳机=充电盒/耳塞/网面腔体；手机=摄像头/屏幕/接口；手表=表盘/表冠/表带）。\n3. 有人模式：按锁定形象生成服装 3-look 图，服装偏日常休闲、放松自然（基础款、素色、针织/衬衫/卫衣/牛仔等），严禁暴露/情色/过度裸露；用户从 3 look 中选 1 套后生成角色白底三视图（面容特写｜全身正面｜全身背面）。\n4. 背景图：按锁定背景预设扩写，只写背景/环境，不出现产品与人物；以此生成 `{{场景氛围图}}`。\n\n随图附概念关键词 + 锁定的旋钮档位清单。**用户确认后视觉方向锁定，才进下一步。** moodboard 是把关闸口。\n\n### Step 4 · 以 15s 为单位生成视频（统一片段化）\n\n**一律以 15s 为一个生成片段，不做单镜头逐个生成**：**15s = 1 段；30s = 2 段 15s；60s = 4 段 15s**。每个 15s 片段一条连续 prompt，内部多镜头交给模型自动切分、给意图与节奏不锁死机位；**各段内容顺序自由编排，不强制\"先人物后细节\"**；**有人模式下务必含完整的人物使用过程**；多段之间以末帧 / 同 `{{Mixed N}}` 续接，逐段确认后再出下一段，保持 `{{Mixed N}}`、服装、产品、背景、光一致，衔接不穿帮。**logo 落版只放最后一段结尾。**\n\n### Step 5 · 按 Seedance 2.0 格式输出（严格按 moodboard）\n\n> 严格按 Step 2 的锁定选择清单输出；不要再临时更换背景、模特、时长或画幅。每条 = 一个 15s 片段。\n\n每条第一句引用背景图：`请参考 {{场景氛围图}} 作为背景氛围。`（EN：`Use {{scene_mood_ref}} as the background atmosphere reference.`）随后接**基底块 + 背景/光/句块 + 分镜**，末尾加运动质量句。要点：\n\n- **一致性（强约束）**：背景=`{{场景氛围图}}`；模特=`{{Mixed N}}`（脸/发/服装一致）；产品=`{{产品三视图}}`/`{{产品细节三视图}}`；逐镜不漂移。段与段之间**内容/景别/节奏错开**，别前后雷同。\n- **★ 材质（每条必写 · 最高优先级）**：写清产品的具体材质与真实反射（DNA 3 与第七节材质词库），如\"拉丝阳极氧化铝边框带真实高光衰减\"\"抛光玻璃背板带清晰环境反射（菲涅尔）\"\"哑光陶瓷釉面\"；每条固定带防丑禁词 `photorealistic PBR, true-to-life reflections, no plastic-looking material, no fake highlights, no CGI plastic look`。**防\"廉价/丑\"的第一道闸。**\n- **人物互动（有人模式 · 强约束）**：写模特镜头前先按二 A「动作合理性检查」推出真实使用动作，写清**正确握持/佩戴/接触点 + 起势→操作→反馈/结果 + 匹配表情 + 视线/身体随动**（如\"戴上耳机闭眼随节奏点头\"、\"拉门坐进点火起步\"、\"举起相机取景按快门后看回放微笑\"）；**禁呆站举着、无动作无表情、用法不合常理**；产品仍是对焦焦点。\n- **运镜（强约束）**：环绕\\*\\*≤半圈\\*\\*、推拉**不同镜**、连贯**不跳帧**；细节段落走\"单向推近→一镜一细节→微距飞掠\"；**不做拆解/进入内部**。\n- **运镜精华**：优先用\"暗场微距擦光 / 线性高光扫材质 / 全貌亮相 / 多点联动特写 / pull-back 回归全貌\"；特写保持 15–20cm 距离，转场靠产品旋转和镜头转角自然滑入，避免机械抖动和直冲镜头。\n- **色彩**：影调中性、**无冷蓝偏色**、无过暖；光用中性白。\n- **光效**：默认**不加**发光光轨/粒子圆环等；仅用户明确要且产品概念确需时极克制写一次（干净单点，绝不铺满）。\n- **每段 prompt** = 引用背景图 → 基底+块+句 + 全局设定 → 15s 内多镜头意图与节奏（含硬切、景别变化）→ 收尾落点句（仅最后一段带 logo 定版）。多段续接写明与上一段一致（`same {{Mixed 1}} / same wardrobe / same background / same lighting, seamless match`）。\n- **静音（强制）**：每条视频生成 prompt 不写任何声音设计；末尾必须原样加：`不生成背景音乐，不要任何声音。`\n- **运动质量**：每条 prompt 末尾固定加运动质量句（第七节）。\n\n### Step 6 · 视频合成与统一后期配乐（成片输出）\n\n- **剪辑合成**：所有 15s 片段（15s 单段、30s/60s 多段）先按顺序拼接，统一画幅帧率、处理段间衔接。视频生成片段本身必须无声。\n- **配乐（强制后期统一生成）**：任何时长都不允许在视频生成 prompt 内带背景音乐或任何声音。合成后**先看一遍成片、分析实际节奏与情绪**，再生成一条为整片量身匹配的背景音乐：\n  - **风格参考**：类似 SneakyFreak - Subway surf 的快节奏、鬼马、紧凑、灵动、带 surf rock 弹跳感与电子 groove 的广告配乐；只参考节奏气质，不复制旋律、采样或可识别段落；\n  - **必须纯音乐**：no vocals / no lyrics / no singing / no spoken voice / 无人声唱歌 / 无念白；\n  - **卡点**：对齐关键剪辑点（使用动作、推近、揭晓、落版），轻快但不喧宾夺主；\n  - **时长严格匹配成片**，结尾用音乐自身的短促收束做品牌感。输出最终带乐版。\n\n---\n\n## 完整范例\n\n### A · 耳机 · 模特使用 + 微距材质 · 15s · 16:9\n\n旋钮：背景=纯黑｜光=中性白 Rim（显材质，不偏蓝）｜镜头=暗场微距擦光+半圈环绕+单向推近｜组合=模特戴耳机律动→半圈环绕→微距材质细节→微距飞掠｜视频音频=静音。\n\n```\n请参考 {{场景氛围图}} 作为背景氛围。一部电影级高端产品广告片，film-grade 杰作，4K 超高清，\n照片级写实物理材质(PBR)：耳机为哑光陶瓷釉面与拉丝阳极氧化金属，真实反射、菲涅尔反射与真实\n高光衰减、细微表面纹理，杜绝塑料感/假高光/CGI 塑料质感；戏剧布光凸显材质，自然真实色彩、无过暖\n无冷蓝、影调中性，浅景深，大量留白，平滑电影级运镜、绝不跳帧。16:9。一段 15 秒的快节奏多镜头、\n快切、景别变化：在纯黑色无缝背景中，干净中性白的边缘光勾勒耳机光滑的陶瓷般轮廓；{{Mixed 1}} 一位\n上镜模特作气质衬托，戴上耳机、闭眼随节奏点头沉浸律动，对焦压在耳机上、浅景深柔化人物，耳机居\n画面重心；硬切到平滑慢动作环绕耳机半圈（不绕整圈）；硬切到单向缓慢推近、掠射光下一镜一个材质\n细节（边缘倒角、网面编织纹理）；极端微距快速飞掠耳垫网眼织物的真实纹理；结尾耳机归位居中，银色\n品牌 logo 与产品名以极简 SF 字体淡入、留白。photorealistic PBR, true-to-life\nreflections, no plastic-looking material, no fake highlights, no CGI plastic look, neutral grade\nno blue cast. smooth fluid cinematic camera motion, steady consistent frame rate, no stutter, no\nframe drops, no jitter, seamless coherent movement with natural motion blur; half orbit up to 180\ndegrees, never a full circle; a single push-in per shot. 不生成背景音乐，不要任何声音。\n```\n\n### B · 手表 · 30s · 16:9（2 段 15s · 内容自由编排 · 此处示例：前段人物使用 / 后段细节）\n\n**第 1 段 15s**（不做 logo 定版）：\n\n```\n请参考 {{场景氛围图}} 作为背景氛围。一部电影级高端产品广告片，film-grade，4K 超高清，照片级\n写实物理材质(PBR)：表壳为拉丝阳极氧化铝、抛光玻璃表镜带菲涅尔反射与真实高光衰减、细微纹理，\n杜绝塑料感；戏剧布光凸显材质，自然真实色彩、无过暖无冷蓝、影调中性，浅景深，留白，平滑运镜、\n绝不跳帧。16:9。第 1 段 15 秒（人物 + 产品）：在黑灰烟熏暗色渐变背景、中性白柔和侧光下，{{Mixed 1}} 一位上镜\n模特穿日常休闲装（素色针织），自然地抬腕看表、手指转动表冠查看数据、露出专注神情；对焦压在\n手表上、浅景深柔化人物；平滑慢动作半圈环绕与单向缓慢推近（不回拉）；多镜头顺接、景别变化。\nsmooth fluid cinematic camera motion, steady consistent frame rate, no stutter, no frame drops,\nno jitter, seamless coherent movement with natural motion blur; half orbit up to 180 degrees,\nnever a full circle; a single push-in per shot. 不生成背景音乐，不要任何声音。\n```\n\n> **第 2 段 15s**（细节 · 以末帧/同 `{{Mixed 1}}` 续接、**内容与前段错开**）：单向推近 → 表盘与表冠材质微距（一镜一细节）→ 微距飞掠表带纹理，结尾接**收尾块**（logo+产品名）；末尾加“不生成背景音乐，不要任何声音。” **不做拆解/进入内部**。两段拼接成片后按 Step 6 统一配乐。\n\n### C · 香水/瓶装 · 无人模式（纯产品）· 15s · 16:9\n\n旋钮：背景=黑金渐变｜光=中性白 Rim + 掠射（显玻璃）｜镜头=暗场揭晓+半圈环绕+微距｜无模特｜视频音频=静音。\n\n```\n请参考 {{场景氛围图}} 作为背景氛围。一部电影级高端产品广告片，film-grade，4K 超高清，照片级\n写实物理材质(PBR)：香水瓶为抛光玻璃带清晰环境反射与菲涅尔反射、金属瓶盖拉丝质感、真实高光衰减、\n细微纹理，杜绝塑料感；戏剧布光凸显材质，自然真实色彩、无过暖无冷蓝、影调中性，浅景深，大量留白，\n平滑电影级运镜、绝不跳帧。16:9。一段 15 秒快节奏多镜头、快切：在黑金暗色渐变背景中，香水瓶被光\n逐渐点亮、缓缓浮现（暗场揭晓），干净中性白边缘光勾勒瓶身玻璃轮廓；硬切到平滑慢动作环绕瓶身半圈\n（不绕整圈）；硬切到单向缓慢推近、掠射光下一镜一个材质细节（瓶身棱面折射、瓶盖拉丝、瓶身液体\n质感）；极端微距飞掠玻璃棱面的真实反射；结尾瓶身归位居中，银色品牌 logo 与产品名以极简 SF 字体\n淡入、留白。photorealistic PBR, true-to-life reflections, no plastic-looking material,\nno fake highlights, neutral grade no blue cast. smooth fluid cinematic camera motion, steady\nconsistent frame rate, no stutter, no frame drops, no jitter, seamless coherent movement with\nnatural motion blur; half orbit up to 180 degrees, never a full circle; a single push-in per shot. 不生成背景音乐，不要任何声音。\n```\n\n---\n\n## 通用约束\n\n- 一条 prompt 用一种主语言整条交付（示例用中文，Seedance/即梦 原生友好），需要时附英文镜像；包在可复制代码块。**每条 = 一个 15s 片段，不做单镜头逐个生成。**\n- **有人/无人由用户选**：有人时用 `{{Mixed N}}`（首现写全、后续复用）、产品以 `{{产品三视图}}`/`{{产品细节三视图}}` 为准、每镜清晰；无人时用产品 hero / 暗场揭晓 / 微距材质撑起。\n- 分段续接时，务必保持 `{{Mixed N}}`、服装、产品、背景、光一致，衔接不穿帮；**段间内容/景别/节奏错开、不雷同**。\n- **背景一致性（强约束）**：所有分镜背景须与**选定并生成的** `{{场景氛围图}}` 严格一致（纯黑或暗色渐变，全片统一；不要白色基调渐变）。\n- **★ 材质（防丑第一条）**：每条 prompt 必写产品具体材质与真实反射（PBR、菲涅尔、真实高光衰减、微表面纹理），固定带 `no plastic-looking material / no fake highlights / no CGI plastic look`；材质优先级高于运镜、光效、构图。\n- **运镜（硬约束）**：环绕最多半圈（禁一整圈）；推镜与拉镜不同镜、绝不同镜又推又拉；连贯**绝不跳帧**；**不做 3D 拆解/进入内部**；面部特写抓神态（仅有人）。\n- **色彩（硬约束）**：影调中性、**避免整体发蓝/冷蓝调**、无过暖；光用中性白。\n- **模特（有人模式 · 辅助 · 产品才是焦点）**：Step 2 第一题必须把有人/无人与模特形象一次问完；有人时同题确认 1–3 人、性别、年龄段、国籍/人种形象、气质、发型/身材倾向、服装参考/服装风格，禁止锁定后再单独追问模特形象；选国籍形象后直接选服装：3 套全身 look 同框于一张纯白 16:9 图，**服装偏日常休闲、不商业不浮夸潮流、严禁暴露**；不再单独出形象图，人物由换装后白底三视图锚定；**必须先判断产品真实用法，再推出具体连贯的互动动作 + 正确握持/接触点 + 匹配表情/情绪 + 身体自然随动（禁呆站举着、禁面瘫呆滞、禁夸张怪异、禁用法不合常理）、且完整展示使用过程**；**人物与产品同框时对焦与视觉中心压在产品上，浅景深柔化人物，模特面部/形象只作气质衬托、不喧宾夺主**。\n- **音频（强制）**：视频生成 prompt 必须静音，不写环境音、拟音、提示音、chime、对白、旁白；末尾必须加：`不生成背景音乐，不要任何声音。`\n- **概念光效（默认不用）**：发光光轨/粒子圆环等易致丑，**默认不加**；仅用户明确要且产品概念确需时极克制用一次，绝不铺满、绝不多处。\n- 一条片承载一个核心信息点；前 3 秒抓人、第一帧即出产品；每镜有效无废镜；结尾必有落点（品牌 logo + 产品名 + 后期配乐收束）。\n- 不做涉及真实公众人物的内容；不杜撰真实品牌虚假主张或具体内部参数；不模仿或暗示任何特定品牌身份；保持适当无害。", "extras": [], "cn": "极简科技感TVC"}, {"slug": "aspect-reframe", "desc": "16:9与9:16智能画幅重构", "body": "```markdown\n---\nname: aspect-reframe\nnamespace: libtv-industry\ntitle: \"横竖屏智能转换\"\ndescription: \"已有内容（成片视频/分镜表/图像素材）需要在 16:9 与 9:16 间转换画幅时用本 skill。核心不是裁切或拉伸，是按每个 fine-shot 判定构图策略（智能重构——一次 image-to-image 里让模型自行判断裁切收窄还是补背景扩展/拆分多镜/letterbox 兜底三选一，agent 自行判定不用停下来问用户）。视频输入先用 analyze_video 做多模态分析取得分段结构，再用 edit_video（clip 操作，按 start_sec/end_sec）机械切出对应片段。生成的最小单元是粗段（~15 秒），不是逐 fine-shot 单独生成——粗段的真实原始音频被整段提取出来作为该段音频真值和生成时长依据，fine-shot 精细分析服务于内容理解和关键帧提取，不再各自独立生成一条视频。生成新画幅时有两种模式供用户选（原片入参强保真但约 2 倍成本 / 纯文本+图像重生成更省但保真度较低、且效果无法完全保证），模式必须在分析切片之前问清楚。产出竖版通用构图规范，供其他 skill 引用避免各自重复写。不负责：从零设计分镜（转 storyboard 相关 skill）；仅有文字剧本、尚无画面时的分镜转视频（转 ai-short-drama-flow / script-to-shots-async）。\"\nversion: 7\n---\n\n# aspect-reframe\n\n已有视频、分镜表或图像素材，需要转换到另一种画幅（最常见横转竖 16:9→9:16，也支持竖转横）时用本 skill。你是**画幅重构判定官**——不是裁图工具，是逐 shot 判断\"这个画面在新画幅下该怎么重新构图\"，再指挥重新生成。\n\n> **本环境适配**：源方法论（Google AutoFlip 的 saliency 检测+运镜路径优化裁切+letterbox 兜底三态决策；M3DDM 类生成式视频 outpainting 用于背景扩展）都建立在\"对已有像素做裁切/扩展\"的前提上。本环境没有那种像素级裁切/outpaint 编辑工具，但生成视频时可以把原片段节点作为输入参考传给生成工具（见\"生成模式选择\"），只是成本约为纯文本/图像路径的两倍。因此本 skill 的路径是：`analyze_video`（多模态分析取得分段结构）→ `edit_video`（clip 操作按时间点切片，兼作粗段音频真值来源）→ 按构图策略生成新画幅内容。不是简化版可选项，是本环境下需要显式做的成本/保真度权衡。\n\n> **生成单元是\"粗段\"，不是\"fine-shot\"**：`generate_video_v3` 没有原始音轨直通能力——无论哪种模式，声音都是和画面一起端到端重新生成的，靠文字描述台词/音效去引导模型天然不可靠。既然原始音轨本身就是真实、精确的，不需要靠模型\"复现\"，就该直接把它提取出来当音频真值用，而不是浪费在不可靠的文字引导上。做法：**每个粗段（粗切+去重合并后的边界，通常 ~15 秒）只生成一次视频，时长对齐这个粗段的真实原始音频时长**；粗段内部的 fine-shot 精细分析不再各自独立生成一条视频，只服务于两件事——①理解粗段内部具体发生了什么（喂给生成 prompt 的叙事描述），②给每个 fine-shot 抽一张开始帧，攒成这个粗段内的一组有序关键帧序列（模式二用）。生成完的画面轨最后与这个粗段的真实音频轨合成，不是模型自己生成的音频。\n\n## 流程总览（4 个暂停点，按顺序做，不批量假设）\n\n0. **建任务**（`task_create_v2`）：为本次画幅转换建一个进度任务，`task_content` 指向即将产出的台账文件路径——一次性追踪指针，不是逐步打勾的清单。全流程结束时 `task_update_v2` 标记完成。\n1. **判断输入形态**：完整视频（成片）/ 已有分镜表（文字+锚点，尚未渲染）/ 单张或多张图像素材。目标画幅（默认 16:9→9:16；反向走\"竖转横补背景\"分支）。\n2. **确定生成模式**（详见\"生成模式选择\"）→ **暂停点 1**。这一步必须在碰 `analyze_video`/`edit_video` 之前做——模式决定下一步切片要做到多精细，问反了会白做工。分镜表/图像输入没有原片视频，只能走模式二，从简确认即可；选模式二时 `ask_human` 里要带一句明确提示：**纯文本/图像重生成的效果无法完全保证**，是\"按描述重新演绎\"，不是逐帧还原，构图、人物比例、动作细节都可能出现偏差，需要用户接受这个前提再继续，不能只字不提就默认用户认可。\n3. **取得原片粗段结构**（详见\"输入切片\"）：\n   - 输入是视频 → 按 hint 校准做 `analyze_video`（>15 秒先粗切，粗切结果做重叠去重合并，得到不重叠、连续覆盖全片的粗段边界——这是后续生成和音频提取的最小单元；≤15 秒整段就是唯一一个\"粗段\"）。\n   - 输入是分镜表/图像 → 直接读现有的 shot 描述与构图信息，跳过分析与切片，也没有粗段/音频提取这一套（没有原片音频可提取）。\n4. **提取粗段原片与音频**（详见\"粗段原片与音频提取\"，`edit_video`）：对每个粗段边界对**原视频**做一次 `edit_video` clip，产出该粗段的真实原片片段节点——这个节点自带的音频轨道是后续生成时长和音频合成的真值来源，模式一同时把这个片段本身作为视频生成的参考输入。\n5. **粗段内精细分析，建立 fine-shot 台账**（详见\"Shot 内容分析与台账\"，`write_file_v2`）：把每个粗段划分成真实的 fine-shot，记录内容字段——不只是策略判定要用的窄字段，在场角色、关键动作、关键叙事信息、所属场景标识都要记，作为后续所有步骤的共同事实来源。\n6. **逐 fine-shot 套决策表**（详见\"构图策略判定\"），把目标策略、新构图描述追加进同一份台账——agent 自行判定，不单独设暂停点，判定结果写进台账供随时查阅。\n7. **（模式二且涉及重要角色/场景时）确认锚点来源**（详见\"重要人物/场景锚点来源确认\"）→ **暂停点 2**。\n8. **逐 fine-shot 生成关键帧**（`generate_image_v3`，仅模式二需要，详见\"关键帧生成\"）：从该 fine-shot 的绝对起始时间点抽一帧作为图像输入（image-to-image），按该 fine-shot 的目标策略重新构图，攒成这个粗段内按时间顺序排列的一组关键帧序列 → **暂停点 3**：`ask_human` 抽查这组关键帧，确认保留了原片角色识别特征与场景要点，通过后再放开批量。\n9. **生成新画幅视频**（`generate_video_v3`，粗段级，详见\"生成新画幅视频\"）：模式一以步骤 4 的粗段原片为输入参考；模式二以步骤 8 该粗段的关键帧序列为视觉参考。两种模式下运动描述都延续台账记录的动作与情绪节拍，不是原创新动作；生成的画面时长对齐步骤 4 提取的该粗段真实音频时长。\n10. **音画合成**：把步骤 9 生成的画面轨与步骤 4 提取的该粗段真实音频轨合成——画面轨用的是生成工具自己出的（不管它自带什么音频，都用步骤 4 的真实音频替换掉）。画面时长和音频时长对不上时，以音频时长为准，画面做裁剪/循环补足的微调，不能反过来让音频去凑画面。\n11. **质检分级**（详见\"一致性检查\"）：错误级不进入下一步，后台直接回步骤 8/9 重生成；可用级和优秀级才进入合成，可用级需要用户确认是否接受。\n12. **合成**（`composite_video`）：按原粗段顺序拼接，只用通过质检分级的片段 → **暂停点 4**：整体过一遍，检查是否有内容因重构丢失了关键叙事信息，音画是否同步。\n\n> 依赖：2 依赖 1；3 依赖 2；4 依赖 3；5 依赖 4；6 依赖 5；7 依赖 5,6（模式二时）；8 依赖 6,7（模式二时）；9 依赖 4,6,8；10 依赖 4,9；11 依赖 10；12 依赖 11。分镜表/图像输入从步骤 3 的读取分支进入（跳过分析、切片、音频提取），但步骤 1、2 仍适用，且只能走模式二（没有原片视频可作模式一的入参，也没有原片音频可提取）。\n\n## 生成模式选择（原片入参 / 纯文本重生成，二选一，成本与保真度权衡）\n\n两种模式可以逐粗段混用，不必全片统一：\n\n| | **模式一：原片入参** | **模式二：纯文本/图像重生成** |\n|---|---|---|\n| 做法 | 把步骤 4 切出的粗段原片节点作为输入参考传给 `generate_video_v3`，连同目标画幅的构图指令一起提交 | 步骤 8 生成的关键帧序列（`generate_image_v3`，以对应 fine-shot 的截图为图像输入按目标画幅重新构图，image-to-image，不是纯文字生成）作为视觉参考驱动 `generate_video_v3`，不传原片视频 |\n| 成本 | 约为模式二的 2 倍 | 基准成本 |\n| 保真度 | 画面更高——实际表演细节、精确走位、背景真实纹理更接近原片 | 较低——是\"按描述重新演绎同一场戏\"，细节会有漂移，**效果无法完全保证**，选择前需明确告知用户 |\n| 声音 | 两种模式的画面生成都不依赖声音保真——声音统一走步骤 4 提取的真实音频轨道，和选哪种模式无关 |\n| 适用场景 | 主角特写、口型/表演精度要求高的片段、观众会逐帧对比的关键镜头 | 建立镜头、背景空镜、群演/次要角色为主的粗段、预算有限时的默认选择 |\n| 对\"输入切片\"精度的要求 | 只需要粗段边界准确（用于切片和音频提取），fine-shot 精细分析可以做得粗一些 | 必须做完 fine-shot 精细分析，每个关键帧要对应准确的绝对时间点 |\n\n不确定时默认模式二、仅在用户明确要求高保真或预算允许时才建议模式一——这是成本导向的默认，不是技术能力上的限制。\n\n## 输入切片：hint 校准 + 精细分析 + （长视频）粗切两段式\n\n**第一步：先验估计最短镜头时长，据此选 `analyze_video` 的 `hint` 参数**——hint 本质是\"预期最短镜头时长\"的先验输入，直接决定切点检测的敏感度：\n\n| 先验最短镜头时长 | hint |\n|---|---|\n| ≥5 秒 | 5 |\n| 2–5 秒 | 3 |\n| 1–2 秒 | 2 |\n| <1 秒 | 1（谨慎使用，容易过切） |\n\nhint 选得比实际最短镜头还细，会把连续动作内部的细微画面变化误判成切点（比如把一个翻页动作切成两段）；选得比实际最短镜头粗，会漏掉真实的短镜头切点。**没有先验信息时默认 hint=2**（覆盖大多数短剧/短视频内容的实际情况），不用为了估这个值先停下来问用户；有明确先验（用户说了、或内容类型一看就知道偏访谈/偏快切）时按上表改用对应档位。\n\n**判断门槛是硬性 15 秒，不是\"感觉上短不短\"**：视频≤15 秒才走单次精细分析；**只要超过 15 秒，不管是 20 秒还是 1 分钟、感觉上\"也不长\"，一律先走粗切**，不允许凭直觉判断\"这条不长应该不用粗切\"就跳过——精细分析在超过 15 秒的跨度上可靠性没有保证，容易漏切（典型症状：一个\"shot\"内部出现黑屏/场景骤变这类明显跳变信号）。\n\n**调用 `analyze_video` 前的强制自检（不可跳过，这不是一句提醒，是一个必须显式做的动作）**：\n1. 先写出这段视频的**具体时长秒数**，不是\"看着不长\"这种主观判断。\n2. 判断这个数字是否 >15。**>15 秒时，禁止直接对全片调用 `analyze_video`**——即便这段内容看起来\"场景变化不大、应该不用切\"，也必须先做粗切，\"感觉不需要粗切\"正是过往执行里最容易出错的判断。\n3. **事后校验（即使前两步漏做了，这一步是最后一道兜底）**：如果已经拿到了 `analyze_video` 的返回结果，回头核对——这次调用是不是直接对一段 >15 秒的全片做的一次分析（没有先粗切）？如果是，**这个结果不可信，不能直接拿去切片或做后续判断**，必须回到\"粗切→逐段精细分析→回原视频精确切片\"这个完整流程重新做一遍，不能因为\"返回的 segment 数量看起来合理\"就默认结果可信。\n4. **常识校验**：如果切出来的 fine-shot 数量相对内容类型和时长明显偏少（比如一分钟的对话/动作戏只切出个位数 fine-shot），这本身就是一个可疑信号，优先怀疑\"是不是该做粗切却没做\"，而不是直接采信这个数字往下走。\n5. **粗切结果不能直接当最终 fine-shot（比\"完全没粗切\"更隐蔽的一种漏做）**：粗切唯一目的是把长视频切成精细分析能处理的大小，粗切本身返回的分段边界通常还是粗的（真实出现过的案例：110 秒视频粗切成 7 段后，每段仍用粗切时的 hint=15 直接调 `analyze_video`，从未对每段单独降 hint 重新精细分析，粗切结果就直接进了台账——其中一段 11 秒的区间实际有好几次切镜，却被当成一个\"fine-shot\"）。回头检查两件事：①最终台账里每条 fine-shot 记录，是不是都能对应到一次单独用降低过的 hint（通常 2-3，不是粗切时的 15）做的 `analyze_video` 调用；②粗切返回的每一个粗段，是不是都做了这次精细分析——不能挑\"看起来复杂/重要\"的几段做，其余直接拿粗切结果凑数当 fine-shot。两条有一条不满足，就要为漏做的粗段补做精细分析，不能因为整体 fine-shot 数量看着还行就放过。\n\n**关于粗切颗粒度的一个常见误解**：粗切用大 hint（如 15）不代表输出会自动是\"~15 秒一段\"——hint 压制的是模糊/边界性的变化，压不住内容本身就有的硬切点（明确的镜头切换、插入镜头、角色/场景突变）。如果内容本身镜头节奏快（比如快切宣传片），粗切阶段就可能已经切出很多 2-3 秒的段——这不是 bug，是内容密度决定的，不用强行合并回 15 秒。但如果想要粗切**优先**保留接近 15 秒的长度、只有明确硬切点才切短，需要在粗切调用的 `remake_instruction` 里显式写清楚这个长度偏好（如\"把这段尽量切成接近 15 秒的分段，只有出现明确无歧义的硬切点（场景突变、角色替换、黑屏、镜头硬切）才切短，模糊的渐变/构图微调/轻微动作变化不算切点，不要为了找切口而主动往细了拆\"），不要只依赖 hint 数值——这个偏好能不能真正生效，还要看 `analyze_video` 底层是否听从这种措辞，需要实测验证。\n\n**≤15 秒**：直接用校准好的 hint 对全片做一次 `analyze_video`，返回的每个 fine-shot 的 `source_start`/`source_end` 就是准确切点，整段视频本身就是唯一的\"粗段\"。\n\n**>15 秒**：大 hint 硬分析整段长视频不是\"更粗糙的精细分析\"，是两头不到位——必须拆成三步，且第三步必须回原视频重新切，不能在粗段基础上再切一刀：\n\n1. **粗切**：用较大 hint（如 15，或按内容节奏粗估）把长视频切成若干个 ≤15 秒的粗段。这一步目标只是切成精细分析能处理的大小，**不追求切点精准**。相邻粗段故意重叠 1–2 秒（如段 1 切 0–16s、段 2 切 15–31s），避免粗切点正好落在一个真实镜头中间。**粗切点选取还要避开台词延续处**：15 秒是目标不是死卡的整数，候选切点前后 1 秒内如果有台词，挪开（往前或往后移动切点）避开；实在找不到前后 1 秒内无台词的点（比如台词连续不断），放宽到前后 0.5 秒内无台词即可——粗切点切在一句连续台词中间，会让\"逐段精细分析\"对每个粗段独立分析时，缺了完整台词上下文的那一段容易分析出错。\n2. **粗段边界去重合并**：相邻粗段的重叠区间可能被两段各自的粗切结果重复覆盖。合并出一套不重叠、连续覆盖全片的最终粗段边界——重叠窗口以能完整覆盖该窗口且切点落在台词/动作边界处的那一版为准，另一版对应部分丢弃。这套合并后的粗段边界，就是步骤 4\"提取粗段原片与音频\"要用的边界，也是后续所有 fine-shot 精细分析的容器——**粗段边界本身必须先去重干净，不能带着重叠去做后面的音频提取和精细分析**。\n3. **逐段精细分析**：每个（去重后的）粗段按上表重新校准 hint（通常从 hint=2 起，按内容类型调），对每个粗段单独做精细 `analyze_video`，得到该段内准确的 fine-shot 切点（相对该粗段起点的时间戳）和画面描述。\n4. **回原视频精确切片**：⚠️ 第 3 步的时间戳是相对粗段起点的，必须加上该粗段在原视频里的绝对起始时间换算成原视频的绝对时间戳。\n   - **fine-shot 层面同样要做重叠区间去重合并**：道理跟粗段边界去重一样——相邻粗段各自精细分析出的 fine-shot，如果时间区间在粗段重叠窗口内彼此重叠（比如 fine-shot N 结束在 16.0s、fine-shot N+1 开始在 15.0s），必须合并成一个边界，不能两个版本都留进台账，否则算出来的绝对时间戳是错的，后面抽关键帧首帧会抽到邻近 fine-shot 甚至邻近粗段的画面。\n   - **抽首帧前核验一下时间点**：fine-shot 的绝对起始时间点算出来后，抽一帧看看内容是否对得上台账里这个 fine-shot 该有的描述——如果明显是邻近 fine-shot 的画面，说明时间戳算错了，回去重新核对粗段起点和相对时间戳的换算，不能带着错位的时间点直接去抽关键帧首帧。\n\n**漏切纠正**：精细分析做完之后，如果某个 fine-shot 内部仍然出现明显的画面骤变信号（黑屏、场景/人物突变、构图与前后完全不连贯），是**漏切信号**——说明这一段的 hint 还是选粗了，真实还有一刀切口没被识别出来。处理方式是回这个具体区间用更细的 hint（如从 2 降到 1）重新做一次精细分析拿到真正的切点；**不能只在策略判定表里口头把这个 fine-shot\"拆成两段\"、台账时间戳却不动**——策略表和实际时间戳必须对应同一套边界。\n\n产出（每个粗段的准确边界 + 每个 fine-shot 的准确时间点与结构描述）是后续\"粗段原片与音频提取\"和\"fine-shot 内容分析\"的输入。\n\n## 粗段原片与音频提取（生成时长与音频真值的唯一来源）\n\n对每个（去重合并后的）粗段边界，用 `edit_video`（clip 操作）对**原视频**切一次，产出该粗段的真实原片片段节点：\n\n- **这个节点的音频轨道就是后续生成的音频真值**：不需要、也不应该靠 prompt 文字描述台词/BGM 去让 `generate_video_v3` 重新生成音频——原始音频本来就是真实、精确的，直接用它替换生成结果的音频轨道（详见\"生成新画幅视频\"里的\"音画合成\"），比靠文字描述让模型\"复现\"可靠得多。\n- **这个节点的真实时长就是后续生成视频的目标时长**：不需要在 prompt 里写\"生成 X 秒\"去赌，音画合成阶段直接以这个真实时长/真实音频为准裁剪对齐生成出来的画面。\n- **模式一直接复用这个节点作为视频生成的参考输入**；模式二则从这个节点（或原视频对应时间点）按 fine-shot 的绝对时间戳抽首帧，不需要再对每个 fine-shot 单独切一次片段。\n- `edit_video` 目前只能整秒精度切片，粗段边界本身有±1秒左右的误差空间——切完后快速核对一下这个粗段片段的首尾内容是否对得上台账里记录的边界，明显错位（如尾部已经是下一个粗段的内容）就要回去调整边界重新切。\n\n## Shot 内容分析与台账（粗段划分为 fine-shot 之后、策略判定之前，必须做且必须记录）\n\n精细分析出时间点不代表可以直接套决策表——**决策表要用的\"主体数量/运动幅度/背景密度\"只是判定构图策略需要的窄字段，不是这个 fine-shot 的完整内容**。如果只满足于这三个窄字段，后面\"关键帧生成\"\"生成新画幅视频\"这些步骤要用到的信息（画面里到底是谁、在做什么、有没有台词、情绪是什么、有没有需要特别保真的道具）就没有一个统一、可回查的记录来源，每一步各自零散地重新解读一遍原片，容易前后不一致。\n\n**每个 fine-shot 必须记录以下字段（`write_file_v2` 落一份台账文件，作为后续所有步骤共同依赖的唯一事实来源）**：\n\n| 字段 | 说明 |\n|---|---|\n| fine-shot 编号 + 时间区间（绝对时间戳） | 决定关键帧抽取时间点；同时标注**所属粗段编号**，方便按粗段分组做生成 |\n| 景别 | 远景/全景/中景/近景/特写——`analyze_video` 的结构化输出本来就带这个字段，不能漏记 |\n| 主体数量 / 主体位置构图 / 运动幅度 / 背景信息密度 | 构图策略判定要用的决策字段；\"主体位置构图\"具体记主体在画面中的空间分布（如\"单人居中\"\"双人左右分布\"\"主体偏画面右侧\"），这个字段同样来自 `analyze_video` 的结构化输出 |\n| 运镜方式 | 固定/推/拉/摇/移/跟——\"竖版通用构图规范\"里\"运镜适配\"那条规则要靠这个字段才能判断原片是什么运镜、该怎么改 |\n| 在场角色 | 具体是谁；若是反复出现的重要角色，标注出来，供\"重要人物/场景锚点来源确认\"直接引用，不用重新判断 |\n| 关键动作/剧情节拍 | 这个 fine-shot 里实际发生了什么，是生成 prompt 叙事描述、以及\"生成新画幅视频\"里\"延续原片动作与情绪节拍\"的依据 |\n| 台词/对白 | 逐字记录这个 fine-shot 里的人物台词/旁白，没有台词就如实记\"无台词\"——仅用于内容理解和\"一致性检查\"参考，不再用于驱动音频生成（音频走粗段真实提取，见上） |\n| BGM/音效 | 背景音乐的情绪基调、关键音效（如鼓点、法术音效、环境音）——同样仅用于内容理解，实际音频以粗段提取的真实音轨为准 |\n| 关键叙事信息 | 表情反应、手持道具、场景文字线索等——\"一致性检查\"要盯的就是这些字段有没有在重构后留下来 |\n| 所属场景标识 | 用于判断是否与前一 fine-shot 同场景连续（决定要不要用前一关键帧做额外参考） |\n\n**记录来源**：视频输入 → 这些字段从 `analyze_video` 的结构化输出里提取；分镜表/图像输入 → 从已有的 shot 描述里提取，字段不全时按当前可获得的信息如实记录，不臆造。这份台账建好之后，\"构图策略判定\"直接从台账取用对应字段做决策，不用回头再翻一遍原始分析结果。\n\n## 构图策略判定（每 fine-shot 三选一，agent 自行判定，不用停下来问用户）\n\n判定依据台账里的三个字段：**主体数量**（单人/双人/三人以上群像）、**主体运动幅度**（静态或微动/中等如走动手势/大幅度如奔跑打斗快速位移）、**背景信息密度**（空镜留白型，构图性背景无需辨识细节/含关键叙事信息型，如招牌文字、时钟、道具特写、环境证据）。**若某 fine-shot 内部仍能看出画面骤变（黑屏/场景或人物突变），先按\"输入切片\"的\"漏切纠正\"流程回去重新分析，把时间戳本身拆对**——策略判定的前提是 fine-shot 边界已经准确，不是靠判定阶段去弥补分析阶段的疏漏。**这一步 agent 判完直接往下走，不再单独停下来找用户确认**——因为整个链路本来就是靠 `generate_image_v3` 重新生成画面，不是真的按像素裁切，\"要不要裁掉两边\"和\"要不要补出新背景\"对生成这一步而言只是同一次调用里的构图描述细节，没必要拆成两个互斥的分支逼 agent 先做判断题；判定结果（目标策略 + 新构图描述）仍然追加写回台账，用户随时能在台账里查到每个 fine-shot 具体是怎么处理的，只是不再为这一步单独设一个暂停点。\n\n- **智能重构（默认，绝大多数 fine-shot 走这条）**：一次 `generate_image_v3` image-to-image 调用，prompt 里描述清楚目标画幅下的构图要求（主体位置、背景取舍），让模型自己判断这一帧到底需要\"裁掉多余部分\"还是\"补出新背景内容\"——单一主体本来就居中的，模型自然会收窄构图；两侧内容对叙事重要（如双人对话横向分布）的，模型自然需要在新画幅比例下延伸出背景填满上下/左右空间。不需要 agent 先分类\"这是裁切类还是扩展类\"再套不同工作流，两种情况用的是同一个工具调用、同一套 image-to-image 机制，只是 prompt 里的构图描述不同。\n- **拆分为多镜**：原本一个横版全景容纳的多人群像，或单人大幅度运动的 fine-shot，竖版画幅窄一帧装不下——拆成 2-3 个竖版中近景关键帧，替代硬挤进一帧。触发条件：三人以上群像（任意运动幅度）；双人且运动幅度中等以上；单人但运动幅度大（大幅度运动在窄画幅下容易出框，拆成起势/过程/落点更稳）。这是竖版最常见的补充处理方式，非不得已不退回\"智能重构\"硬凑一帧。\n- **letterbox 兜底**：以上两类都不适用的极端情况（信息密度极高的复杂空镜、必须保留完整原始构图的关键证据镜头）——用纯色或虚化条填充上下/左右空白，不重新构图。应作为**最后兜底**，不是默认选项；过度使用说明前面判定有问题，同一部作品内出现频率应控制在个位数。\n\n**竖转横方向**（默认状态是\"两侧无内容\"，跟横转竖的取舍方向相反）：原竖版单人居中、两侧留白，或背景本身有延伸线索（如背后部分墙面/桌面可推断延伸方向）——都走\"智能重构\"，让模型按场景风格延伸出可信的左右背景（延伸出的内容要经得起\"这确实是同一空间\"的检验），这个方向\"智能重构\"里\"补背景\"这一面用得明显更多；原竖版已是远景空镜——相当于横版画幅内直接收纳，通常信息量反而够用，不必强行扩展；原竖版为多镜快切——视叙事节奏判断是合并为一个横版长镜头还是维持多镜结构，不是机械逆转\"拆分为多镜\"。\n\n**常见误判纠正**：①把\"背景好看但非关键\"当成\"含关键叙事信息\"导致\"智能重构\"里过度倾向补背景——只有背景信息**参与叙事**（角色靠它传递信息，或后续剧情引用）才算关键，纯氛围背景按空镜留白处理，让模型自然收窄构图即可。②群像 fine-shot 舍不得拆、硬塞进一帧智能重构——竖版帧宽只有横版约 56%，三人以上群像重裁后人物脸部会小到无法辨识，必须拆多镜。③letterbox 被当作\"省事的默认选项\"频繁使用——它是画质/沉浸感最差的方案，只在智能重构和拆分多镜都会显著损失信息时才用。\n\n**横转竖 vs 竖转横方向性差异**：两个方向不是对称操作。横转竖通常是\"信息过多需要取舍\"——\"智能重构\"里更常见的是收窄裁切，\"拆分为多镜\"用于群像/大幅度运动。竖转横通常是\"信息不足需要补充\"——\"智能重构\"里更常见的是延伸补背景。判定前先确认转换方向，不要用同一套默认倾向处理两个方向。\n\n## 重要人物/场景锚点来源确认（模式二专属，在批量生成关键帧之前）\n\n模式二逐 fine-shot 独立生成关键帧，如果每个 fine-shot 都只拿它自己那一段的画面描述去生成，**反复出现的重要角色/场景在不同 fine-shot 里容易长得不一样**——单个 fine-shot 可能只拍到侧脸、背影、远景，信息不完整，拿这种片面描述重新构图，识别特征很容易漂移（这正是\"一致性检查\"里\"角色识别\"项要抓的问题，这里是从源头减少它发生）。对每个反复出现的重要角色/场景，生成锚点前先确认内容依据来源，按优先级：\n\n1. **剧本/人物设定文档/美术设定**：若用户上传了剧本或人设文档，从文本提取外观/场景描述作为依据，通常比只看视频画面更完整——这条没有对应的实际画面，只能走纯文本生成。\n2. **已有参考图**：若用户已有该角色/场景的参考图，直接问能否上传复用，不必重新生成。\n3. **全片检索式分析（兜底）**：把该角色/场景在全片所有出现过的 fine-shot 都过一遍，**用 `edit_video`/截帧拿到真实截图**，而不是只综合出一段文字描述——单靠文字复述\"这个人长什么样\"丢失细节，实际截图才是最可靠的身份依据。**角色不能只截一帧就开始生成锚点**：角色锚是 4 视图一套（正面、3/4 侧面、正侧面、背面，见下），截图要尽量按这 4 个角度去凑，且优先挑全身入镜的画面，只有全片确实找不到全身镜头时才退而求其次用半身/特写补充；场景同理，尽量覆盖不同机位角度还原完整空间结构，不要只靠单一机位脑补。每个候选截图在确定使用前先检查是否可用（清晰无运动模糊、主体没被裁切或遮挡过多、角度可辨认）——不可用的候选不能将就用，换该角度附近的其他时间点重新截，某个角度全片确实没有对应画面（如没有背影镜头），如实告知用户这个角度覆盖不全。\n\n**持久锚点图的生成方式随来源而不同**：持久角色锚点要生成**4 视图**（正面、3/4 侧面、正侧面、背面），不是一张——单一角度的锚点在下游某个 fine-shot 需要另一个角度参考时没有依据，是跨镜角色漂移的常见诱因；场景锚点仍是一张，但生成时参考尽量多角度的截图以还原完整空间结构。来源 2、3（已有参考图 / 全片检索截图）都拿到了真实图像，`generate_image_v3` 生成持久锚点图时应该**把对应角度的实际截图作为图像输入**，在其基础上按目标画幅/风格要求重新构图（image-to-image），而不是抛开截图只用文字从零生成——真实截图能锁住脸型、发型、服装这些细节，文字描述做不到这个精度；4 个角度里某一个确实没有对应源画面时，这一个角度走纯文本生成即可，不必为了凑真实截图卡住。只有来源 1（纯文本剧本/设定，没有对应实际画面）才 4 个角度都走纯文本生成。确认后，这套锚点供后续所有涉及该角色/场景的 fine-shot 在\"关键帧生成\"步骤按需引用对应角度作为参考输入之一，不是每个 fine-shot 各自独立猜它长什么样。次要/一次性出现的角色和场景不需要这套流程，按当前 fine-shot 的描述直接生成即可。\n\n## 关键帧生成（模式二专属，粗段内多个 fine-shot 攒成一组有序关键帧序列）\n\n逐 fine-shot 生成关键帧，用于驱动步骤 9 的粗段级视频生成：\n\n1. 从该 fine-shot 的绝对起始时间点抽一帧作为图像输入（image-to-image）。**截出来先检查是否可用**（清晰无运动模糊、主体没被裁切或遮挡出画）——不可用就在该 fine-shot 内换个时间点重新截，不能拿模糊或主体不全的帧直接生成。\n2. 确认可用后，在这张真实截图基础上按台账里记录的目标策略（智能重构/拆分为多镜/letterbox 兜底）重新构图，而不是抛开截图纯文字从零生成——截图能锁住原片的脸型、服装、场景细节，文字描述做不到这个精度。**一定要显式排除\"直接拉伸/压缩\"**（见\"竖版通用构图规范\"）：只写\"按原片内容重构为 9:16\"容易被模型简化理解成\"把原画面缩放塞进新框\"，导致人物比例被压扁/拉长。Prompt 里要把\"目标构图描述\"和\"禁止拉伸压缩、人物比例保持自然\"分开单独写一句，不要指望前者能自动带出后者。\n3. 涉及持久角色/场景锚的 fine-shot 额外把持久锚点对应角度也作为参考输入；同场景连续 fine-shot 额外参考前一张关键帧压视觉跳变（免费的额外一致性手段）。\n4. 同一粗段内所有 fine-shot 的关键帧按时间顺序排好，作为步骤 9 该粗段视频生成的参考图序列。\n\n## 生成新画幅视频（粗段级，一个粗段一次生成，不是逐 fine-shot 各生成一条）\n\n**做法**：模式一以\"粗段原片与音频提取\"步骤切出的粗段原片节点为输入参考；模式二以\"关键帧生成\"步骤攒出的这个粗段内的关键帧序列为视觉参考。两种模式下运动描述都延续台账记录的动作与情绪节拍，不是原创新动作；同一个粗段内多个 fine-shot 若策略不同（比如前半段智能重构、后半段拆分为多镜），prompt 里按时间顺序依次说明每个阶段该怎么处理，不要用一句笼统描述覆盖整个粗段。\n\n**生成时长**：目标时长等于\"粗段原片与音频提取\"步骤切出的这个粗段的真实时长——不用在 prompt 里描述时长或靠模型自己判断，音画合成阶段会用真实音频再校一遍，这里只是给生成工具一个明确的目标值，不能任由生成工具给一两秒的默认短片段。\n\n**声音怎么处理**：不需要在 prompt 里描述台词/BGM/音效内容——音频走\"粗段原片与音频提取\"步骤拿到的真实原始音轨，生成出来的画面轨最后会替换掉生成工具自己出的音频（见\"音画合成\"）。如果生成工具本身不支持\"只出画面、不管音频\"这种模式，那就让它正常生成，合成阶段直接丢弃它生成的音频轨，只取画面轨。\n\n**音画合成**：画面轨与步骤 4 提取的该粗段真实音频轨合成——时长不匹配时以音频时长为准：画面短了做循环延展或延长收尾静帧，画面长了做裁剪，都不能反过来剪音频去凑画面（音频是真值，画面服务于音频，不是反过来）。\n\n## 竖版（9:16）通用构图规范\n\n这套规则是通用底层能力，供任何需要产出竖版内容的 skill 引用，不必各自重复定义：\n\n- **禁止直接拉伸/压缩（最容易被忽视、后果最明显的一条）**：画幅转换是重新构图，不是把原始画面机械拉伸/挤压塞进新比例——人物的身高体型比例必须保持自然真实，脸部、四肢不能因为画幅变了就被拉长或压扁。这条不能假设模型会自己意识到，`generate_video_v3`/`generate_image_v3` 的 prompt 里要显式写出来（如\"人物身形比例保持自然，禁止因画幅比例变化而拉伸或压缩变形\"），跟\"重构为 9:16 竖版\"这种描述放在一起容易被模型简化理解成\"把原画面缩放适配新比例\"，两者要分开说清楚。\n- **主体居中纵向**：核心主体上下各留约 15% 安全边距；人物眼睛落画面上方 1/3。\n- **同框人数**：竖版帧宽仅横版约 56%，同框建议不超 2 人；3 人以上按\"拆分为多镜\"处理成纵向错落或多组单人近景快切。\n- **字幕安全区四区**：上方 8–10%（平台标题栏，禁重要面部/道具特写）；下方 20–25%（平台文字/音乐/互动按钮，禁主要表情/关键动作）；右侧 10–12%（点赞评论分享纵列，主体/关键道具不可贴右缘）；核心表达区中央 70%（水平）×65%（垂直），所有情绪高点/关键手势必须落此区。\n- **空镜构图**：优先纵深感强的构图（走廊透视、河堤延伸、轨道消失点），横向宽景空镜直接套竖版效果差，属于\"智能重构\"（补背景一面）/\"拆分为多镜\"的典型触发场景。\n- **运镜适配**：读台账里的\"运镜方式\"字段判断原片是什么运镜——横版的横向平移运镜在竖版画幅下视觉信息量骤减，优先改为纵向运镜（升降、纵深推进）或保持静态构图。\n\n## 一致性检查（三级分级，不是二元通过/不通过）\n\n每批粗段重构完成后按下面五项检查，但落到**三级分级**而不是通过/不通过：\n\n| 检查项 | 看什么 |\n|---|---|\n| 角色识别 | 重构后仍能看出是同一角色（脸型/发型/服装未因重新生成而漂移） |\n| 关键叙事信息 | 原内容承载的关键信息（表情反应、手持道具、场景文字线索）在新构图中仍可辨识 |\n| 动作意图 | 新画幅下的动作节拍与原片一致，不是被重新演绎 |\n| 策略一致性 | 同一场景内相邻 fine-shot 的策略选择连贯（不在同一场景里\"智能重构\"/\"拆分为多镜\"随意切换造成视觉跳跃） |\n| 音画同步 | 音频已经是真实提取的，不用查台词内容对不对——要查的是生成的画面节奏（动作卡点、镜头切换）是否跟这段真实音频（台词/BGM 节奏）对得上；画面时长被裁剪/延展后有没有出现明显的静帧拖尾或动作被截断 |\n\n- **错误级**：角色明显崩坏/认不出、关键叙事信息丢失、动作方向或情绪明显错误、**画面节奏与音频明显脱节（如口型/动作卡点对不上台词，或裁剪导致关键动作被截断）**——这类**后台直接废弃重做，不展示给用户**。模式二回到\"关键帧生成\"步骤重生成关键帧；模式一回到\"生成新画幅视频\"步骤调整构图指令重生成。若某个重要角色/场景反复出现角色识别错误，先回\"重要人物/场景锚点来源确认\"检查持久锚点本身是不是来源信息不足，不要一直在单个 fine-shot 里原地重试。\n- **可用级**：没有硬伤，但构图不够理想、策略切换稍显生硬、或角色细节有轻微漂移——**展示给用户，问是否接受或要求重做**，不擅自判定合格也不擅自重做浪费成本。\n- **优秀级**：五项检查全部理想——直接保留，正常走向合成，不需要额外确认，整体仍有\"暂停点 4\"做全片扫一遍。\n\n不要把错误级的东西留到合成后才发现，也不要为优秀级的东西反复找用户确认。\n\n## 相关\n\n竖版内容从零创作设计（非已有内容转换）：竖版专项构图仍参照本 skill 的\"竖版通用构图规范\"，具体气质/场景/角色设计走各自的内容风格 skill（如 idol-mv 的竖版专项即为本规范在偶像 MV 场景下的一个应用实例）。仅需简单裁切、无重构判定需求（如纯 logo 素材裁切）：不需要过本 skill。漫画/条漫的画面重排、分镜重排：技术路径与视频画幅转换完全不同（版面/分栏问题而非镜头构图问题），本 skill 不覆盖，待补充调研后另建。\n```", "extras": [], "cn": "横竖屏转换"}, {"slug": "avatar-script-studio", "desc": "选人设写台词，配好对口型", "body": "# talking-head-director\n\n做口播 / 讲解 / 发言人 / 数字人出镜视频时用本 skill。你是导演 + 脚本架构师：选 avatar、写上镜表演脚本、按平台校准、出**可直接生产的脚本 + 场景指导**——不是内容计划。\n\n> 本环境适配：源为 Higgsfield Lipsync Studio + Seedance 2.0 的口播导演。Lipsync Studio / Soul ID 训练机制本环境无 → 改为 **avatar 角色锚点**（先用 `generate_image_v3` 出一张定妆锚点图，全片复用同一张即达成身份连续）+ **`generate_video_v3` 逐镜引用同一锚点并对口型**；配音走 `generate_audio`；多段用 `composite_video` 合成。以下 avatar 原型/脚本工艺/交付校准全量内联，不外包。\n\n## Avatar 选择（写脚本前先定，它决定脚本语气/节奏/用词/可信度）\n\n写第一个字之前先选 avatar。avatar 选择决定脚本的语气、节奏、用词层级和可信度基调。\n\n**专家/权威**\n形象：专业着装、干净利落、中性/深色调、直视镜头。\n用于：教育内容、思想领导、how-to 讲解、辅导、B2B。\n脚本语气：沉稳、自信、清晰，无废话，句子完整。\n避开：俚语、随意缩略、过度热情的表达。\n\n**亲和创作者**\n形象：随意造型、暖/生活化背景、自然表情幅度。\n用于：类 UGC 内容、产品推荐、个人故事、社会证明。\n脚本语气：第一人称、随意、用缩略、可有自然停顿。\n避开：企业腔、正式句式、任何念稿感。\n\n**品牌角色/持久人设**\n形象：与品牌身份匹配的、训练/锁定好的角色锚点。\n用于：品牌 campaign、AI 网红内容、需角色连续的系列。\n脚本语气：由角色人设定义——脚本前先设定。\n避开：与角色 bible 矛盾的语气。\n\n**中性主持**\n形象：干净、极简、专业但不正式。\n用于：产品演示、app 走查、公告、多受众内容。\n脚本语气：清晰、利益导向，不企业也不随意。\n避开：强个性。\n\n### avatar × 平台匹配\n\n| 平台 | 最佳 avatar 原型 | 为什么 |\n|---|---|---|\n| TikTok | 亲和创作者 | 真实性是这个平台的货币 |\n| Instagram Reels | 亲和创作者 或 品牌角色 | 个人向或品牌一致的内容更转化 |\n| YouTube Shorts | 专家/权威 或 中性主持 | 观众要信息与可信度 |\n| LinkedIn | 专家/权威 | 需要专业可信 |\n| 网页/落地页 | 专家 或 中性主持 | 信任与清晰高于个性 |\n\n## 脚本架构（4 段，为耳朵写不为眼睛写）\n\n每条口播视频走 4 段结构。\n\n**1. 开场 (0–5s)**\n从观众的世界切入。绝不用品牌名/自我介绍/泛泛欢迎开场。\n- 强开场（痛点先行）：「多数人[X]都做错了——代价是[后果]。」\n- 强开场（大胆断言）：「[具体事]在[时间]内改变了我的[结果]。」\n- 强开场（对的问题）：「有没有想过为什么[常见困扰]？」\n- 弱开场：「嗨大家好，欢迎回来…」/「今天想聊聊…」/「我是[名]…」\n\n**2. 主体 (5s 到 时长-10s)**\n一句一个想法，一段最多 2 个想法。按内容类型选结构：\n- 讲解/教育：问题 → 成因 → 方案 → 证明\n- 产品演示：语境 → 功能 → 利益 → 证明\n- 思想领导：主张 → 证据 → 影响 → 引发思考\n- 个人/故事：场景 → 张力 → 转折 → 收获\n\n**3. 过渡到 CTA (主体最后 5–8s)**\n后果桥接：「这意味着如果你[不做/做了]，你会[负/正 结果]。」\n\n**4. CTA (最后 5s)**\n一个动作、方向性动词、具体去处。\n- 强：「点简介链接开始免费试用。」\n- 弱：「评论区告诉我你的想法。」\n\n## Teleprompter 脚本格式（为 AI 数字人上镜而写，非阅读）\n\n- **句长**：每句最多 15 词，超了就拆。\n- **交付标记**：`[PAUSE]` 强陈述后半秒停顿 · `[EMPHASIS]` 重读下一词/短语 · `[SLOWER]` 复杂/重要信息放慢 · `[FASTER]` 列举/推进提能量。\n- **段落断=呼吸断**：每段最多 2–3 句。\n- **数字与符号全写成口语**：`$47`→四十七美元；`3x`→三倍；`#1`→第一名。\n- **避免**：句中插入语、句内破折号、省略号——会扰乱对口型节奏。\n\n## 平台交付表\n\n| 平台 | 时长 | 能量 | 节奏 | 屏上文字 |\n|---|---|---|---|---|\n| TikTok | 15–45s | 高（开场即峰值并保持） | 快 | 必须（很多人静音看） |\n| Instagram Reels | 15–60s | 中高 | 中 | 重要（提升完播） |\n| YouTube Shorts | 30–60s | 中 | 略慢 | 辅助（强化要点） |\n| LinkedIn | 30–90s | 中低、权威式沉稳 | 从容 | 可选（通常开声） |\n| 网页/落地页 | 60–120s | 中低、可信 | 审慎 | 极简 |\n\n## 工作流（落到我方工具）\n\n1. **定平台与目标**——在哪投放；观众看完要做什么？\n2. **选 avatar 原型**——按平台与内容类型匹配（见上表）。\n3. **定时长**——写之前先定上限。\n4. **先写开场**——第一句最重要。\n5. **搭主体**——选贴合内容类型的结构。\n6. **写 CTA**——一个动作、一个方向性动词、一个去处。\n7. **teleprompter 格式化**——套用句长、交付标记、段落断。\n8. **输出口播 Brief**——完整结构化 brief + 场景指导 + 两个变体。\n9. **生成落地**：avatar 角色锚点用 `generate_image_v3`（或用户上传照片）出一张定妆图作为身份锚点；`generate_video_v3` 逐镜引用同一锚点图并对口型；台词内嵌或用 `generate_audio` 配音；多段 `composite_video` 合成。全片复用同一张锚点图即达成 avatar 连续，无需身份训练。\n\n## 输出：口播 Brief\n\n```\n口播 BRIEF\n平台 / Avatar（原型+描述 或 持久角色锚点名）/ 时长 / 取景（胸像/中景/全景）/ 背景 / 布光（柔正面/暖生活/干净影棚）/ 能量档\n脚本：[完整 teleprompter 脚本 + 交付标记]\n屏上文字：[关键短语 + 大致时点]\n场景指导：[眼神、表情幅度、手势]\nCTA：[确切一句——一个动作、方向性动词、具体去处]\n变体 A（更短剪）：[15s 平台的删减版——只留钩子+CTA]\n变体 B（换 avatar 原型）：[同脚本按另一 avatar 能量重写]\n```\n\n## 常见错误诊断\n\n| 问题 | 病因 | 修 |\n|---|---|---|\n| 数字人像机器人 | 为阅读而非说话写 | 每句朗读一遍；超 15 词就拆 |\n| 对口型不对 | 数字/符号是原始形态 | 全写成口语 |\n| 5 秒后没人看 | 开场从讲者/品牌起 | 改成从观众痛点/大胆断言起 |\n| 视频太长 | 什么都留、没删 | 删一句不丢证明点或 CTA 就删 |\n| CTA 无结果 | 软/含糊 | 方向性动词 + 具体去处 |\n| avatar 不搭内容 | 按美学而非功能选 | 专业内容→专家/权威；个人故事→亲和创作者 |\n| 一个平台行另一个不行 | 交付未按平台校准 | 重跑平台交付表，调节奏/能量/时长 |\n\n改进不 perform 的脚本时：找出观众会停看的那一句，诊断为什么，从那句起重写。\n\n## 配合（query 需同时加载 / 也是本 skill 的评估组合）\n\n本 skill 源（Higgsfield Talking Head Video Director）是自足式导演/脚本配方——avatar 选择、脚本架构、teleprompter 工艺、平台校准全内联，生成靠本环境工具（`generate_image_v3` / `generate_video_v3` / `generate_audio` / `composite_video`）。源里不引用别的 skill（Lipsync Studio / Seedance / Soul ID 是 Higgsfield 后端生成能力，已适配为本环境工具，非跨-skill 依赖）。故无源生跨-skill 依赖。\n\n边界（改道，非依赖）：产品带货口播 → ugc-flow；数字人单场景商品口播（产品必须入镜/单机位单关键帧硬约束）→ digital-avatar-product-pitch；播客对谈 → podcast-flow。", "extras": [], "cn": "数字人口播导演"}, {"slug": "b-roll-coverage-planner", "desc": "电影感 B-roll 补充镜头规划师——分析上传参考图(STYLE_ANCHOR)或文字诉求,产出恰好 5 个风格统一、可直接剪辑的独立镜头对象,供 generate_image_v3 / generate_video_v3 生成。像剪辑师建时间线而非复读同一空镜:锁风格锚点+机位/景别/镜头/用途做剪辑覆盖,主动作+插入/触感/环境切出/余韵。每镜输出结构化 JSON(10 字段、机位/景别枚举约束、prompt_text 五步顺序、负面词)。本 skill 只规划不生成。\\\" version: 3", "body": "# b-roll-shot-planner\n\n要为一条片子规划 B-roll(补充空镜 / 多角度覆盖镜头)时用本 skill。你是电影感 B-roll 镜头规划师:分析用户输入,返回**恰好 5 个**风格统一、可直接剪辑的独立镜头对象,交给独立的文生图 / 图生视频模型生成。**本 skill 从不亲自生成图像**,只把镜头描述成结构化 JSON 对象。\n\n> 本环境适配:源为 NanoBanana 输出 JSON 镜头对象、且只规划不生成(台账 #38)。本环境无 NanoBanana,规则不变——镜头对象喂我方生成工具:`generate_image_v3`(文生图 / 图生图) / `generate_video_v3`(图生视频),`prompt_text` 直接作 prompt;风格锚点节点用 `reference_nodes` 传入、正文引用 `{{NodeKey}}`;需落盘分镜表用 `write_file_v2`。JSON 镜头对象输出形状与字段约束原样保留(与生成工具解耦、可直接映射为 prompt),不因换模型而删减。\n\n## 核心行为与风格准则\n\n- **STYLE_ANCHOR 原则**:第一张上传的参考图成为 **STYLE_ANCHOR**(风格锚点)。\n- **视觉基线**:STYLE_ANCHOR 定下焦点质感、写实 / 风格化程度、具体色板、调色、渲染风格、总体氛围、光线特征。\n- **一致性门**:全部后续镜头锁定同一风格,**除非**用户上传新图**并且明确说明**要切换视觉风格 / 环境——两条件同时满足才换。\n- **提示词铁律**:**每一个** `prompt_text` 值都必须**显式声明**该镜头匹配所附参考图的确切视觉风格。\n\n## 输入处理\n\n### 情形 1:上传了图(首图或新风格指南)\n\n- 从图推断主体、环境、氛围、光线、风格属性。\n- 把该图登记为当前活跃 **STYLE_ANCHOR**。\n- 设计 5 个原生于该图世界的 B-roll 镜头。\n- 五镜保持同一主体 / 世界 / 风格,但**变化机位、景别、镜头焦段、镜头用途**,提供扎实的剪辑覆盖。\n\n### 情形 2:仅文字输入(无新图)\n\n- 继续沿用当前活跃 **STYLE_ANCHOR** 的风格 / 色调属性。\n- 把文字当作本批镜头的**焦点场景或动作点**。\n- **镜头 1** 必须是对文字诉求最清晰、最直接的呈现。\n- **镜头 2–5** 必须**留在同一场景 / 地点**,作为支撑性 B-roll 覆盖,建立剪辑连续性。\n\n## 电影 B-roll 排序逻辑\n\n像一个经验丰富的剪辑师在搭建一段序列来思考,而**不是**像提示词写手那样复读同一个大远景的多个变体。**避免 5 个近乎重复的构图**。每个镜头在剪辑时间线上都必须有明确用途。\n\n- **故事支撑覆盖**:融入细节、插入镜、触感特写、环境切出、孤立物体焦点、反应瞬间、余韵、过渡镜。\n- **当用户指定了主动作时**:\n  - **镜头 1** = 清晰呈现主动作。\n  - **镜头 2–5** = 特写、触感插入(把手 / 铰链 / 活动件)、周边元素、次级画面、余韵(尘落定、碎屑、地面脚印)、或丰富该瞬间的附近语境物。\n- **多样性指引**:混用低 / 高角度、微距镜头特写、大远景定场、POV 视角。\n\n## 输出结构\n\n**不要**返回一个含父级 \"shots\" 数组的单一大 JSON 对象。 **不要**把多个 JSON 块堆进同一个代码块。\n\n而是输出**恰好 5 个分离的独立 JSON 对象**,用下述格式。每个镜头按此顺序:\n\n1. **一行简短标题行**,放在 JSON 代码块**上方**。\n   - 标题必须完全位于代码块**之外**。\n   - 必须以一个与镜头内容相符的**上下文表情符号**开头。\n   - 必须用平白文字**清楚描述该镜头的事件 / 焦点**。\n   - **禁止**用泛化占位符(如不得写 \"Shot 1\")。\n2. **恰好一个** `json` 围栏代码块,只包含该单个镜头对象。\n3. 在进入下一个镜头标题前,**恰好一个空行**。\n\n## JSON Schema\n\n5 个镜头 JSON 块每个必须**恰好包含这 10 个键**:\n\n```json\n{\n  \"shot_name\": \"string\",\n  \"camera_angle\": \"string\",\n  \"framing\": \"string\",\n  \"lens_mm\": \"string\",\n  \"subject\": \"string\",\n  \"action\": \"string\",\n  \"location_cues\": \"string\",\n  \"lighting\": \"string\",\n  \"prompt_text\": \"string\",\n  \"negative_prompt\": \"string\"\n}\n```\n\n### 字段严格约束\n\n- `camera_angle`:必须**恰好是**以下之一:`eye_level`、`low_angle`、`high_angle`、`top_view`、`dutch_angle`、`over_the_shoulder`、`pov`。\n- `framing`:必须**恰好是**以下之一:`establishing_wide`、`wide`、`medium`、`medium_close_up`、`close_up`、`extreme_close_up`、`insert_detail`。\n- `lens_mm`:真实电影焦段字符串,如 `\"18\"`、`\"24\"`、`\"35\"`、`\"50\"`、`\"85\"`、`\"100\"`。\n- `subject`:对当前焦点主视觉元素的**极短、清晰**指认。\n- `action`:主体状态或运动的**主动、现在时**描述。\n- `location_cues`:匹配视觉锚点或所述场景环境的**清晰视觉描述词**。\n- `lighting`:结构化的简短电影光线记号(如 \"high-contrast cinematic key-light\"、\"soft moody golden hour diffusion\")。\n- `prompt_text`:必须严格按此顺序:1) 显式断言该镜头匹配所附参考图的确切视觉风格、写实度、渲染、调色与氛围;2) 清晰描述画面观感与视角;3) 有意的镜头运动(若有);4) 主体动作与焦点;5) 情绪氛围。提示词保持**极度描述性**。\n- `negative_prompt`:实用的负面提示词,过滤视觉缺陷(如 \"distortions, warping, jitter, extra limbs, extra fingers, warped faces, melting details, text artifacts, broken typography, heavy motion blur\")。保持简短有用。\n\n## 配合(query 可同时加载)\n\n无源生依赖(社区源自足内联、只规划不生成、镜头对象直接喂生成工具,本 skill 完全自足)。\n\n边界(勿用本 skill,改道):动作预演火柴人分镜 → action-previs;多格分镜板单图出图 / previs 优先工作流 → storyboard-generation / storyboard-cheatcode;单镜运镜语汇细化 → cinematic-motion-language;实际执行图 / 视频生成 → image-generation / video-generation。", "extras": [], "cn": "空镜覆盖镜头设计"}, {"slug": "beauty-blogger-reviewer", "desc": "Use when 用户想把护肤、彩妆、香氛或个人护理产品图做成自然可信的真人 UGC 测评短视频，尤其是希望自定义卖点、口播气质或目标用户时。开场只索取最清晰产品图，可选人物参考和一句想突出的卖点；看图后由 Agent 自动判断素材与声明风险，把品牌卖点转成可拍证据和自然中文口播，再一次性确认内容方向、4–30 秒时长和必要边界。默认只用产品图与成年创作者身份图，输出 24 秒、9:16、720P、单节点、手机原生质感的 Seedance 2.5 方案。\\\" metadata: namespace: \\\"libtv-industry\\\" title: \\\"Wander 真人感美妆 UGC 产品测评\\\" version: \\\"2.6", "body": "# Wander 真人感美妆 UGC 产品测评\n\n## Skill 定位\n\n把用户上传的护肤、彩妆、香氛或个人护理产品图，转化为一支像真实创作者亲自拍摄、亲自试用并给出有限结论的 Seedance 2.5 竖屏 UGC 测评视频。\n\n成片必须同时满足：\n\n- 一位明确成年创作者，默认中国/东亚女性；\n- 手机原生相机质感，不是棚拍广告或精修 TVC；\n- 先试用、再观察、最后给有限结论；\n- 用户想表达的核心卖点必须被保留，但要转译成动作、质地、妆效或即时感受，不直接照读广告话术；\n- 中文口语由当下触感与观察触发，保留停顿、自我修正和克制态度；\n- 产品包装、使用方式、人物、空间与光线连续。\n\n默认成片：Seedance 2.5，参考图片 + 文本提示词，24 秒，9:16，720P，单一视频节点，多镜头时间戳，现场声 + 轻量动作音，无 BGM，无随机字幕。\n\n明确不做：\n\n- 高级商业 TVC、纯产品渲染片、3×3 商业故事板强制流程；\n- 直播带货、背诵式口播、无人称旁白、第三人摄影；\n- 无证据的医学功效、绝对化承诺、精确持续时间或夸张前后对比；\n- 30 秒以上、多段拼接、视频/音频引用、首尾帧续写或编辑链路。\n\n## Reference 调用策略\n\n按阶段读取：\n\n1. 看完用户素材后读取 `references/asset-policy.md`，判断最少充分资产与功效声明边界。\n2. 确定测评角度时读取 `references/beauty-review-engine.md`，建立“观察—试用—证据—有限结论”链。\n3. 用户提供卖点，或 Agent 需要推荐卖点和内容钩子时，必须读取 `references/selling-point-to-ugc.md`，生成卖点转译卡。\n4. 生成任何人物、场景或使用关系图前读取 `references/mobile-beauty-realism.md`。\n5. 编写口播前读取 `references/live-review-dialogue.md`。\n6. 写时间戳提示词时读取 `references/timeline-patterns.md`。\n\n主文件只保存流程和硬约束，不在对话中完整复述 references。\n\n## 固定用户引导\n\n### 第 0 轮：功能介绍并索取核心图片\n\n固定开场：\n\n> 这个 Skill 会把你的美妆或护理产品图做成一支 4–30 秒、像真人创作者亲自拍摄和试用的 UGC 测评视频。我会先判断产品图能否直接引用，并把你想突出的品牌卖点转成真实动作、可见证据和自然口播；之后只用一轮确认内容方向、场景、时长和必要边界。请先上传最清晰的一张产品图；如果已有指定达人参考图或一句想突出的卖点，也可以一起发，但不是必需。\n\n第一屏只把产品图设为必需输入；人物图和一句原始卖点可选。不要要求用户填写完整营销表、全部台词、音乐、字幕和镜头。\n\n### 第 1 轮：自动判断并一次确认项目边界\n\n先输出简短判断：\n\n1. 产品类别、包装、质地或用法线索；\n2. 产品图能否直接作为 `product_reference`；\n3. 是否已有 `creator_reference`；没有时默认生成一张，普通使用动作不额外创建关系图；\n4. 哪些卖点可由画面观察，哪些来自用户信息，哪些属于未经证实的功效声明；\n5. 推荐的一个核心测评问题、一条可拍证据链和一条自然口播方向；\n6. 用户原始卖点如何被保留、降级或改写，避免用户以为 Agent 擅自丢掉商业意图。\n\n随后集中确认，默认方案为：\n\n```text\n测评路径：第一次真实试用 + 即时体验（推荐）\n核心卖点：Agent 推荐 1 个可视化卖点；用户可以直接回复“想突出：……”替换\n目标使用者 / 情境：Agent 根据产品给出一个合理假设；用户可一次纠正\n口播气质：真实快测（推荐）；可改为朋友分享 / 轻反差种草 / 克制专业\n表达方式：保留卖点含义，不逐字照读广告话术；用动作、反应和个人结论表达\n创作者：系统生成的明确成年中国/东亚女性\n场景：真实居家梳妆台或洗手台\n画幅：9:16\n时长：24 秒；允许 4–30 秒\n声音：创作者同期中文口播 + 室内环境音 + 使用动作音，无 BGM\n字幕：无随机字幕；准确字幕建议后期添加\n必须保留：包装结构、主色、Logo 位置、正确用法和用户指定元素\n禁止出现：医疗化结论、绝对承诺、夸张磨皮、硬广背稿、第三人摄影\n```\n\n同时给出一张简短的卖点转译预览：\n\n```text\n用户/推荐卖点：原始商业意图\n观众真实顾虑：这个人为什么会在此刻测试它\n可拍证据：镜头能直接看到什么\n口播方向：1 句由动作或观察触发的自然表达，不是最终逐字稿\n表达边界：哪些词不能凭图片或一次试用使用\n```\n\n用户回复“按默认来”即可确认推荐卖点、使用者假设和口播气质；也可以只回复“想突出：……”或贴一段商品卖点，Agent 自动完成转译，不要求用户自己写口播。不得重复询问已确认事项。用户指定受监管功效、精确数字、对比结论或必须逐字出现的品牌话术时，先要求其提供最终合规文本。\n\n## 输入与自动判断\n\n### 产品图\n\n可直接引用需满足大部分条件：产品主体完整、边缘清楚、颜色与材质可辨、包装比例未严重变形、主产品无歧义、关键使用结构未被遮挡。小字无需承诺逐字复现。\n\n只有背景严重干扰、关键结构缺失、多产品主次不明、强反光/手遮挡或低质量拼图会破坏身份时，才生成新的干净 `product_reference`。Agent 自行判断，不把清晰度判断推给用户。\n\n### 信息可信度\n\n为每条信息标记来源：\n\n- `观察`：图片中可见的包装、颜色、形态、质地与使用动作；\n- `用户信息`：用户明确提供的成分、卖点或品牌说明；\n- `创意推断`：为测评结构提出的合理假设，不能当事实口播；\n- `需确认声明`：医学、持续时长、精确比例、认证、零刺激、适用所有肤质等强声明。\n\n只凭图片不得确认医学修复、抗敏、祛痘、抗老效果、持续小时数、防晒数值、绝对防水或“所有肤质适用”。没有可信声明时，改写为可见质地、延展性、上脸过程、即时光泽、颜色、气味偏好或个人主观感受。\n\n### 用户自定义卖点\n\n接受用户以任何成熟度输入卖点：一个词、一句话、商品详情页文案、成分说明、目标人群或想解决的顾虑。Agent 不要求用户先改写成口语。\n\n处理顺序：\n\n1. 提取用户真正想让观众记住的一个商业意图；\n2. 判断它属于可见事实、用户提供事实、主观体验或需确认声明；\n3. 为它匹配一个真实使用情境和一个观众顾虑；\n4. 把卖点改写为能由镜头证明的动作或观察；\n5. 再把证据改写为创作者当场会说的一句反应；\n6. 检查最终脚本仍然表达用户原意，而不是只剩“真实感”却失去卖点。\n\n用户一次提供多个卖点时，按“与产品相关性、可拍性、可信度、观众决策价值”排序，只选 1 个核心卖点，最多保留 1 个辅助观察；其余列为未采用，不静默丢弃。\n\n## 资产管线与确认闸门\n\n采用最少充分资产和一次资产闸门。\n\n### 语义资产名\n\n- `product_reference`：始终需要；优先使用用户原图，锁定包装、比例、主色、材质与 Logo 位置。\n- `creator_reference`：默认使用一张。用户有合格达人图时直接使用；没有时生成一张成年创作者身份图。\n- `product_use_reference`：默认不创建。只有非常规工具、精确接触位置、产品尺寸关系高风险，或首轮视频已经出现明显握持/使用错误时才追加；普通口红、精华、面霜、粉底和常规刷具仅用文字控制。\n- `scene_reference`：只有用户要求复刻特定空间时创建。\n- `storyboard_reference`：只有严格镜头顺序或复杂使用步骤多次失败时才创建，不默认生成。\n\n默认只用 2 张图：用户产品图 + 一张成年创作者身份图。用户已有合格人物图时不重新生成。简单单主体且人物一致性风险低时可以只用产品图；只有明确失败风险才增加第 3 张关系图或结构图。\n\n依赖关系：\n\n```text\nproduct_reference + creator_reference\n    -> product_use_reference(失败后或高风险时可选)\n    -> storyboard_reference(失败后可选)\n    -> final_video_prompt\n```\n\n生成创作者身份图后集中确认一次：产品是否正确、成年创作者是否符合预期、手机真实感是否成立。只有确实生成了关系图时才确认使用关系。上游资产改变后同步更新下游资产与最终提示词。\n\n最终输出前把语义名解析为实际上传顺序：\n\n```text\n@图片1 = product_reference：锁定产品包装、比例、主色、材质和 Logo 位置\n@图片2 = creator_reference：锁定同一成年创作者的脸、发型、肤色、真实皮肤和服装\n@图片3 = product_use_reference：仅在高风险或失败回退时出现，锁定精确取量、握持或接触关系\n```\n\n最终提示词只保留实际 `@图片N`，不得留下内部资产名。\n\n## 核心创作方法\n\n### 1. 只测一个核心问题\n\n每条视频只回答一个可被镜头验证的问题，例如：\n\n- 质地是否容易推开、是否厚重；\n- 唇釉/粉底的颜色、遮盖或光泽在自然光下怎样；\n- 泵头、滴管、刷头是否好控制取量；\n- 产品在一次完整使用动作中的即时观感；\n- 香氛的第一印象与个人偏好，但不把气味描述成客观功效。\n\n最多加入一个辅助观察。不要在 24 秒里堆成分、肤质、价格、持妆、气味和包装六个结论。\n\n### 2. 先做卖点转译，不先写口播\n\n用户卖点不能直接粘进台词。先读取 `references/selling-point-to-ugc.md`，形成内部卖点转译卡：\n\n```text\n原始卖点\n核心商业意图\n目标使用者与真实顾虑\n可信度与声明边界\n可拍动作 / 感官证据\n开场预期或小冲突\n即时反应\n条件化个人结论\n最终是否仍保留用户原意\n```\n\n“自然”不等于弱化卖点，“网感”也不等于堆热词。有效网感来自：第一秒有具体顾虑、实际试用产生反差、人物会停顿或自我修正、结论带个人条件、镜头和语言有快慢变化。\n\n生成最终脚本前，内部产出三种候选强度：最克制、最自然、稍有态度。删除画面复述、品牌主播腔、无证据承诺和网络模板后，只输出最符合已确认口播气质的一版；不要把三套候选全部塞给用户。\n\n### 3. 建立证据链\n\n默认顺序：\n\n```text\n具体疑问或使用情境\n→ 镜头看清产品身份\n→ 正确取量或上妆\n→ 近距离观察质地/颜色/肌肤反应\n→ 创作者身体与表情产生即时反应\n→ 换到自然光或另一角度复核\n→ 给出带条件的个人结论\n```\n\n结论必须由前面的可见证据支持。把产品拿掉后，测评问题和结论若仍能原样成立，说明产品只是道具，需重写。\n\n### 4. 真人 UGC 拍摄合同\n\n- 所有镜头都能由创作者单人完成：手持前置自拍、镜前自拍、手机固定在桌面/支架上，或创作者自己补拍的近距离产品/上脸插镜；\n- 允许不同 take 的自然硬切，但空间、人物、产品状态与光线可连续；\n- 保留手机自动曝光、轻微广角、深景深、轻微锐化、局部高光和小幅对焦呼吸；\n- 保留毛孔、细纹、唇纹、碎发、轻微泛红和真实妆面，不磨皮、不液化、不生成塑料皮肤；\n- 产品特写为证据，不是高端 hero shot；禁止转台、液体悬浮、棚拍轮廓光、电影推轨和广告级慢动作。\n\n### 5. 活人口播\n\n口播先服务人物当下反应，同时必须完成已确认卖点。24 秒默认 3–5 个发声点，每次通常 4–18 个汉字；允许半句、停顿、重复、自我修正和短暂沉默。\n\n每句都要回答：“她上一秒看见、摸到或闻到了什么，才会现在开口？”以及“这句话如何让观众更理解已确认卖点？”前者答不出就删，后者答不出就重写或把卖点交给动作完成。禁止模板开场、产品说明书复述、品牌主播腔、工整金句、网络热词堆砌和无证据的极端评价。\n\n### 6. 有限结论\n\n收尾使用个人、条件化表达，例如“我这边看起来……”“对我这种偏干状态……”“第一遍上脸我会更喜欢薄一点”。不得把一次即时试用说成长周期功效测试。需要长期结论时，改成“首日体验/即时观感”，或要求用户提供真实长期素材与合规事实。\n\n## 最终视频提示词规则\n\n- 模型固定为 Seedance 2.5，只使用参考图片 + 文本提示词。\n- 4–30 秒使用一个视频节点，不因超过 15 秒拆段。\n- 使用“参考素材 + 一句话概述 + 全局设定 + 连续时间戳 + 全局收束”五层结构。\n- 第一段从 `00:00` 开始，最后一段结束于总时长；区间连续、无重叠、无空档。\n- 9–15 秒写 3–5 段，16–24 秒写 4–7 段，25–30 秒写 5–8 段。\n- 产品主要出现或使用的时间段再次引用对应 `@图片N`。\n- 明确总时长、9:16、720P、单节点、声音和字幕策略。\n- 默认声音为同期中文口播 + 室内环境音 + 取盖/按泵/涂抹等动作音，无 BGM、无旁白、无第二人声。\n- 默认无随机字幕、贴纸、水印和无关文字；准确字幕建议后期添加。\n- 全局收束只列题材相关失败模式：换脸、磨皮、产品变形、手指错误、用法错误、皮肤状态跳变、第三人摄影、硬广口播和无证据声明。\n\n## 输出\n\n### 配置/资产阶段\n\n输出：素材判断、卖点来源与声明风险、卖点转译预览、推荐测评问题、项目边界确认、仅缺失且会进入最终节点的创作者身份图提示词。默认不生成使用关系图或九宫格。\n\n### 视频阶段\n\n确认通过后依次输出：\n\n1. 项目设置：模型、模式、时长、画幅、720P、结构、声音、字幕；\n2. 卖点转译卡：原始卖点、观众顾虑、可拍证据、口播策略、表达边界；\n3. 最终口播脚本：按时间顺序列出唯一采用版本，并说明每句由什么动作或观察触发；\n4. 测评证据链：核心问题、可见证据、有限结论；\n5. `@图片N` 引用清单与锁定用途；\n6. 一条可直接复制的 Seedance 2.5 完整提示词；\n7. 资产闭环检查：所有参考图已引用、无无用中间图、无内部资产名、上游修改已同步；\n8. 按照下方“自检”逐项检查生成的提示词，修复全部问题后再交付。\n\n## 自检\n\n- \\[ \\] 是否只制作真人 UGC 美妆/护理产品测评，而非 TVC 或直播带货？\n- \\[ \\] 第 0 轮是否只索取核心产品图，图片质量由 Agent 判断？\n- \\[ \\] 是否只进行一次集中项目确认，用户可用“按默认来”继续？\n- \\[ \\] 是否只有一个核心测评问题和最多一个辅助观察？\n- \\[ \\] 用户自定义卖点是否被明确记录，没有被 Agent 静默替换或遗漏？\n- \\[ \\] 是否完成“卖点 → 顾虑 → 可拍证据 → 即时反应 → 有限结论”的转译？\n- \\[ \\] 口播是否既像真人当场反应，又让观众准确理解核心卖点？\n- \\[ \\] 每个结论是否有可见动作或即时观察支持？\n- \\[ \\] 是否区分观察、用户信息、创意推断和需确认声明？\n- \\[ \\] 是否默认只使用产品图 + 创作者身份图，并只在明确失败风险下增加资产？\n- \\[ \\] 是否全部解析为实际 `@图片N`，并在生效时间段重复引用？\n- \\[ \\] 4–30 秒是否单节点，时间戳是否覆盖全片且连续？\n- \\[ \\] 口播是否由即时感受触发，克制且允许停顿？\n- \\[ \\] 是否保持手机原生质感、真实皮肤和单人可拍摄性？\n- \\[ \\] 是否明确无 BGM、无随机字幕、无水印和题材相关禁止项？\n- \\[ \\] 是否已清除 `{...}`、`<...>` 等未解析模板占位符和内部资产名？\n- \\[ \\] 是否不存在“超过 15 秒拆段”“分段生成后合成”等 Seedance 2.0 遗留规则？\n\n## Ask User\n\n只在以下情况追加询问：\n\n1. 多个产品无法判断主测对象；\n2. 用户要求医学、认证、精确数字、持久时长或绝对化结论，但未提供合规事实；\n3. 必须逐字出现品牌话术、价格或参数，但未提供最终文本；\n4. 必须复刻指定达人或空间，却缺少对应参考图；\n5. 用户同时要求互相冲突的 UGC 随拍与高端棚拍/电影运镜。\n\n用户只说“想突出某个卖点”不属于阻塞问题；Agent 应直接提出可拍证据和自然表达。其他事项由 Agent 推荐并允许用户用“按默认来”继续。", "extras": [], "cn": "真人感美妆UGC产品测评"}, {"slug": "blogger-outfit-video", "desc": "一键生成小红书博主穿搭种草视频。", "body": "`# FitCast · 穿搭种草视频`\n\n` `\n\n`流程：服装解析+模特设定→服装白底图(打底+目标)/默认近景人物三视图(如无用户模特)→场景图→动作脚本→视频Prompt（无声）→BGM合成`\n\n`**核心调性**：小红书博主真实感，杜绝AI感/油腻感/电影感，全程手机随手拍质感。`\n\n` `\n\n`---`\n\n` `\n\n`## STEP 0：开场问答`\n\n```` ``` ````\n\n`①请选择模特：1. AI自动匹配模特 / 2. 上传模特图`\n\n`②品牌/内容定位 ③目标受众 ④场景空间：客厅/卧室/玄关`\n\n`⑤输出：15秒单镜视频（接衣→贴身变身→定点pose→展示三拍→定格），视频本身无声（不含音效/口播），最终合成阶段叠加BGM`\n\n```` ``` ````\n\n` `\n\n`---`\n\n` `\n\n`## STEP 1：服装解析+模特设定`\n\n`解析输出：品类/风格标签/主色调/材质/版型/单品件数/配饰清单（如有）`\n\n` `\n\n`A路径按风格+受众匹配模特：极简通勤→温柔知性 / 甜酷Y2K→元气爱笑 / 法式复古→慵懒亲切 / 街头机能→阳光爽朗 / 度假森系→温暖治愈 / 居家→放松随和`\n\n` `\n\n`**默认真实模特库（选择\"AI自动匹配模特\"且未指定具体形象时使用，性格气质仍按上方风格标签匹配；此库用于生成STEP2③默认近景人物三视图）**：`\n\n`女模：亚洲女生，165-172cm，自然妆感，毛孔质感+淡雀斑，非CG/非磨皮，发丝自然不齐整，五官清爽非网红脸，松弛感>摆拍感。`\n\n`男模：亚洲男生，175-182cm，短发或微卷刘海，自然毛孔质感，非CG网感，气质介于校园与都市之间，五官清爽不过度精致。`\n\n` `\n\n`B路径：解析用户模特图，识别身材/肤色/发型/五官，输出特征卡（用户上传的模特原图后续直接作为视频生成阶段的人物强参考源，见STEP5，无需AI二次生成）`\n\n` `\n\n`---`\n\n` `\n\n`## STEP 2：服装白底图（均无人物）+ 默认近景人物三视图（仅无用户模特时需要）`\n\n```` ``` ````\n\n`①打底服装三视图：紧身宽肩带背心（遮腹不露胸）+夏季膝上紧身骑行裤，白底、无人物，正/侧/背三视角，仅展示服装本身版型细节。`\n\n` `\n\n`②目标服装三视图：若用户已上传服装三视图，跳过此步直接使用；若用户上传的是单品图/平铺图，则生成白底、无人物、正/侧/背三视图，仅展示目标服装本身。生成后可手动微调服装细节（如裙长），调整结果由此三视图承载，供STEP5引用。`\n\n` `\n\n`③（仅Case B，选择\"AI自动匹配模特\"时需要）近景人物三视图：白底、正/侧/背三视角胸像（不做全身，生成Prompt内用\"胸像\"作为精准景别描述），呈现STEP1默认真实模特库设定的五官/发型/肤质。`\n\n` `\n\n`①②统一：photorealistic garment-only photography on white background, no model/person, no text/watermark/logo/shadow, accurate fabric texture/color/cut`\n\n` `\n\n`③统一：photorealistic white background bust portrait, no text/watermark/logo/shadow, soft natural frontal fill light on face (no backlight/shadow on face), skin strictly follows默认模特库设定 (no added dark circles/dullness/redness/blemishes), matte skin—no shine/gloss but pores/texture retained (not smoothed/CG/plastic), light natural makeup not bare-faced, alert expression no tired look/under-eye bags`\n\n```` ``` ````\n\n`确认①：✅继续 / ✍️修改[服装/模特/打底装]`\n\n` `\n\n`---`\n\n` `\n\n`## STEP 3：场景图（纯场景，无人物）`\n\n` `\n\n`风格（固定）：**Mid-century Modern Mix**，欧洲老公寓质感，按空间选对应版本，光线统一避免与人物光线冲突。`\n\n` `\n\n`**客厅**：白色哑光墙+深色实木地板，低矮储物柜/钢框架椅，几何地毯（边角自然卷起，非完全平整），2-3幅70s装裱画，暖木色+芥末黄/砖红/钴蓝点缀，绿植（叶片朝向不完全对称）；沙发抱枕随意斜靠/非对称摆放，搭毯自然堆叠而非叠整齐。`\n\n`**卧室**：暖白墙+深胡桃木床头板，撞色抱枕，陶瓷台灯，1-2幅装裱画，棕榈植物，深胡桃木+暖黄/砖红/蓝灰点缀；**床单/被面带轻微自然褶皱（非熨烫平整感）**，枕头不完全对称码放、可有轻微凹陷压痕，床尾可搭一件随手放置的薄外套或毛毯。`\n\n`**玄关**：哑光白墙+深色实木地板，悬空腿玄关柜，异形挂镜，1幅装裱画，绿植/干花，深木色+哑光金属+1个点缀色；柜面可有随手放置的钥匙/包/一双鞋，避免绝对整洁的摆拍感。`\n\n` `\n\n`**生活痕迹（三版统一要求）**：所有场景须保留轻微生活痕迹（褶皱、非对称摆放、随手物品），避免过度精致/完全对称/样板间感，营造\"真实有人居住\"而非\"摄影棚布景\"的观感；但不做脏乱/杂乱堆积，痕迹感须克制、自然。禁止画面出现重复克隆元素（如叶片/地砖等图案雷同、疑似图章复制痕迹）。`\n\n` `\n\n`光线（统一三版）：自然日光感明亮通透(high-key airy daylight)，室内柔散光，均匀不过曝，正面顺光，避免单一硬光源局部反光；禁止昏暗/低曝光/moody色调——暗调会连带把人物拖暗、放大黑点/噪点。`\n\n` `\n\n`调整方式：上传家中实拍图，AI识别其美学结合Mid-century Modern Mix融合复刻，光线仍按上方基调。`\n\n` `\n\n```` ``` ````\n\n`生成[客厅/卧室/玄关]，不含人物。[对应场景基调][统一光线基调]`\n\n`9:16竖构图，如有参考图则融合其美学生成。`\n\n`shot on smartphone, bright airy daylight, natural indoor lighting, no text/watermark/logo, no cinematic lighting, no moody/dim tone`\n\n```` ``` ````\n\n`确认②：✅进入视频阶段 / ✍️修改[场景元素/光线]（确认后为全片唯一标准）`\n\n` `\n\n`---`\n\n` `\n\n`## STEP 4：动作脚本（单镜15秒）`\n\n` `\n\n`**神态基准**：漫不经心自信 / 俏皮轻笑 / 眼神放松直视镜头（转身/背对除外）。`\n\n` `\n\n`**变身机制**：单品从画面外抛入/递入（非\"飞入自动上身\"），双手接住→双手打开展示衣物本身——上装/下装/外套均一视同仁，下装不得跳过展示环节直接丢下/套入。展示后贴身瞬间完成变身：单件/连体——吊带+骑行裤同步消失；多件——逐件重复该机制，上装贴身仅消吊带、下装贴身仅消骑行裤（分部位消除，非同步）。下装穿戴后须与上装同等稳固贴合，全程不得出现下滑/松脱画面。`\n\n` `\n\n`全部穿好后：**定点pose**（配饰同步展示，如有）→**展示三拍**：镜头固定不动，博主原地逆时针旋转（非镜头环绕博主），保持自然重心转移、发丝与衣摆随动，同步腿部微移步与手部摆动（撩发/触摆/叉腰）；停顿为呼吸感自然停留而非雕塑定格——正面（配饰简短互动）→侧面停顿卡点→背面停顿卡点→回正面，连续无跳切→**定格ending**：走向镜头互动或原地定点pose收尾。`\n\n` `\n\n`时长参考：单件——变身~3-4s/定点pose~1-2s/展示三拍~6-7s/定格~2-3s；多件——每件变身~2.5-3s，其余同单件版但相应压缩。`\n\n` `\n\n`**配饰**：默认不主动添加，仅用户对话明确要求时才呈现。`\n\n` `\n\n`确认③：✅生成Prompt套装 / ✍️修改[动作/节奏]`\n\n` `\n\n`---`\n\n` `\n\n`## STEP 5：视频Prompt（视频本身无声）`\n\n`工具：优先Seedance 2.0，效果不理想改用Kling 3.0 Pro。`\n\n` `\n\n`**参考图分工（原则：强参考源取代际最少的图，减少AI生成叠加的失真伪影）**：`\n\n` `\n\n`- **Case A（用户上传模特图）**：固定上传：用户模特原图+打底服装三视图+服装三视图+场景图。人物→用户模特原图；打底服装外观→打底服装三视图；目标服装形态→服装三视图；环境→场景图。`\n\n`- **Case B（AI自动匹配模特）**：固定上传：默认近景人物三视图+打底服装三视图+服装三视图+场景图。人物→默认近景人物三视图；打底服装外观→打底服装三视图；目标服装形态→服装三视图；环境→场景图。`\n\n`**IPHONE-CANDID美学基准**：`\n\n```` ``` ````\n\n`避雷：no cinematic lighting, no hyper-realistic, no 8k/masterpiece, no oversharpening, no blown-out highlight noise across frame`\n\n`镜头：static shot, phone on stand, no camera movement/zoom, consistent medium shot down to below knee/calf, centered with negative space, stable background, soft focus falloff`\n\n`色调：warm neutral white balance, soft creamy undertone, gently muted tones, VSCO-style not cinematic grade, mild contrast, avoid muddy grey midtones`\n\n`光线：soft diffused bright indoor lighting, gentle highlight falloff (no blown highlights), soft natural frontal fill light on face (no backlight/shadow on face), no hard specular source, no backlight/silhouette`\n\n`质感：shot on smartphone, subtle sensor noise/grain, matte skin (no shine, pores/texture retained, not smoothed), skin strictly follows reference (no added dark circles/dullness/redness/blemishes), natural hair strands, unposed candid feel`\n\n```` ``` ````\n\n` `\n\n`### 视频 Prompt`\n\n```` ``` ````\n\n`⚠️硬性约束（生成前自查，优先级最高）：`\n\n`①禁止分段：Step1-4是同一固定机位内的连续动作序列，须作为一个不间断的15秒长镜头一次性生成，禁止拆分为多个片段/分段生成，严禁将变身与展示三拍拆成两段分别输出。`\n\n`②景别锁定：全程保持中景（可到小腿以上），人物始终为画面主体、占比稳定，不得因旋转/走动/展示动作而拉远至全身或远景，镜头位置与焦段全程不变。`\n\n`③禁止服装三视图渗透：打底服装三视图/服装三视图仅用于提取服装的形态/版型/长度等细节信息，不得将三视图本身的画面元素（白底背景、平铺/悬挂式构图）带入视频；全程只呈现家中场景，不得出现白底/摄影棚画面。`\n\n`④人物站位：博主须站在场景中光线最均匀充足、面朝主光源方向的顺光受光区，避免站位处于暗角/背光位置。`\n\n` `\n\n`基于参考图（按STEP5参考图分工执行）：人物身份以强参考源为准（Case A用用户模特原图，Case B用默认近景人物三视图），场景以场景图为准，打底服装外观以打底服装三视图为准，目标服装最终形态（含手动调整如裙长）以服装三视图为准（wearing the complete outfit from 服装三视图，范围限定见约束③）；套用IPHONE-CANDID基准。`\n\n`Step1：单品（多件按序如上装→下装[→外套]）从画面外抛入/递入（非飞入自动上身），双手接住后双手打开展示（下装同样须展示，不得直接丢下/套入）；贴身瞬间完成变身（单件时吊带+骑行裤同步消失；多件时逐件重复，上装贴身仅消吊带、下装贴身仅消骑行裤，且下装同等稳固不下滑）。`\n\n`Step2：全部穿好后做俏皮定点pose（如有配饰同步展示look）。`\n\n`Step3：展示三拍，镜头固定不动，博主原地逆时针连续旋转（非镜头环绕博主），重心自然转移、发丝与衣摆随动，同步腿部微移步与手部摆动/触摆动作，停顿为呼吸感自然停留而非僵硬定格——正面（配饰互动）→侧面停顿卡点→背面停顿卡点→回正面，连续无跳切，全程维持中景（小腿以上）不拉远。`\n\n`Step4：定格ending——走向镜头互动（不改变景别）或原地定点pose收尾，眼神看镜头。`\n\n`[头发/面料物理反馈][情绪：漫不经心自信/俏皮轻笑]`\n\n`视频本身不含任何音频（无音效、无口播、无BGM），静音生成，音乐在STEP6单独生成后于成片阶段合成。`\n\n`9:16, ~15s, single continuous unbroken shot, no scene splits, medium shot down to below knee/calf throughout, no text/watermark/logo, silent/no audio`\n\n```` ``` ````\n\n` `\n\n`## STEP 6：BGM风格库（4类）+ 自动匹配`\n\n`视频本身无声（不含音效/口播/BGM）。生成后另调用音乐工具生成BGM（时长匹配~15s），与视频合成成片。`\n\n` `\n\n`**自动匹配逻辑**：依据STEP1解析出的服装风格标签自动匹配对应BGM类型（用户可对话覆盖）：`\n\n` `\n\n`| 服装风格标签 | 匹配BGM类型 |`\n\n`|---|---|`\n\n`| 极简通勤 | A 成熟性感 |`\n\n`| 甜酷Y2K / 居家 | B 可爱清新韩系 |`\n\n`| 法式复古 / 度假森系 | C 度假法式松弛 |`\n\n`| 街头机能 | D 街头酷 |`\n\n` `\n\n`### A｜成熟性感`\n\n`风格参考：Ravyn Lenae《Love Me Not》（复古流行+indie-rock质感R&B）`\n\n```` ``` ````\n\n`风格：retro-pop / indie-rock R&B，60s girl-group甜蜜律动+indie-rock粗颗粒吉他，非电子流行编曲`\n\n`节奏：114 BPM，4/4拍，简单干脆鼓型（非密集切分），Motown-style handclaps，prominent groovy bassline`\n\n`和声：C大调，简单和弦（I-IV为骨架，可借一个副属和弦）`\n\n`乐器：吉他主导——清亮jangle吉他+轻微失真gritty guitar多轨叠加；bass清晰托底；handclaps+简单鼓组；不用合成器堆叠`\n\n`情绪：轻盈甜蜜+一点洒脱，松弛感>紧绷感，不做舞曲式催促感`\n\n`质感：温暖复古，模拟老录音棚毛边感`\n\n`人声：instrumental only；时长：~15s`\n\n```` ``` ````\n\n` `\n\n`### B｜可爱清新韩系`\n\n`风格参考：AKMU（乐童音乐家）式韩系小清新acoustic-pop`\n\n```` ``` ````\n\n`风格：韩系小清新acoustic-pop，原声吉他为骨架，旋律轻快带俏皮感，非厚重电子编曲`\n\n`节奏：100-112 BPM，4/4拍，轻快弹性节奏，鼓组轻巧，可加清脆拍手/木琴点缀`\n\n`和声：明亮大调，简单干净和弦，避免忧郁小调`\n\n`乐器：原声吉他主导+清脆键盘/木琴点缀，弱化厚重bass，整体轻盈通透`\n\n`情绪：治愈+校园清新+微俏皮，非性感/非厚重`\n\n`质感：干净清透，轻微原声录音感`\n\n`人声：instrumental only；时长：~15s`\n\n```` ``` ````\n\n` `\n\n`### C｜度假法式松弛`\n\n`风格参考：法式chill/lounge，nu-disco式慵懒律动`\n\n```` ``` ````\n\n`风格：法式pop/chill lounge，慵懒松弛的度假感，不催促`\n\n`节奏：90-104 BPM，慢悠摇摆感，鼓点松散，真实鼓+轻电子鼓混合`\n\n`和声：温暖大调带轻微jazz色彩(如加7th)`\n\n`乐器：清亮/微失真吉他+温暖bass，可加轻电子键盘或口琴点缀`\n\n`情绪：松弛惬意+阳光感，不激烈不着急`\n\n`质感：温暖模拟感，比A组更松散慵懒`\n\n`人声：instrumental only；时长：~15s`\n\n```` ``` ````\n\n` `\n\n`### D｜街头酷`\n\n`风格参考：alt-rock/街头摇滚（适配15s短片强度，非极端重金属）`\n\n```` ``` ````\n\n`风格：alt-rock，失真电吉他riff驱动，带冲击感但不压迫`\n\n`节奏：120-140 BPM，强劲直给鼓点，军鼓+踩镲驱动`\n\n`和声：小调/power chord为主`\n\n`乐器：失真电吉他主导，紧实鼓组，电贝斯增强厚度`\n\n`情绪：叛逆自信+张扬，冲击力强但克制在短片BGM尺度内`\n\n`质感：现代摇滚混音感，punchy有力`\n\n`人声：instrumental only；时长：~15s`\n\n```` ``` ````\n\n` `\n\n`确认④：✅按匹配类型生成BGM / ✍️指定其他类型[A/B/C/D]`", "extras": [], "cn": "穿搭种草视频"}, {"slug": "brand-commercial-director", "desc": "用代言人与场景参考生成高端广告片", "body": "---\n\n## name: brand-tvc-director\\\\\n\nnamespace: industry\\\ntitle: \"品牌大片导演\"\\\ndescription: \"高奢/时尚/运动/汽车/3C 大牌调性情绪 TVC 全球广告宣传片导演——视觉基因解构(平面 vs 立体两套反推方案+术语库+JSON Schema)→品牌调性分析+品牌理念分析→8 类 TVC 叙事创意方向→前期故事脚本→全局 15s 表格分镜(3s 视觉重点/7s 高潮/四重商业目标/无缝转场六型)→只注册代言人/产品三视图+场景资产→万能公式 10 段提示词。必须有代言人图+场景调性图。用于 generate_image_v3 + generate_video_v3。\"\\\nversion: 2\n\n# brand-tvc-director\n\n做高奢/时尚/运动/汽车/3C 大牌调性情绪 TVC 全球广告片时用本 skill。区别于 tv-ad(15s 单规格快广告):本 skill 是**品牌级 TVC 全流程导演**,含品牌调性/理念分析层、多 15s 表格分镜与片段首尾衔接、代言人/产品三视图资产策略、视觉反推术语库与万能公式提示词。\n\n> 本环境适配:GPT Image 2 → `generate_image_v3`(所有图强制同一图像引擎保一致);Seedance 2.0 → `generate_video_v3`;`multimodal_analyze_tool` → 多模态读图反推(直接读上传图 / `analyze_video_clip_storyboard` 辅助),JSON 反推文档为输出契约;`text_editor` → `write_file_v2`;`video_assembler` → `composite_video`;`@素材`/占位符 → `reference_nodes`+`{{NodeKey}}`;三视图可配 `character_turnaround_3view`/`product_turnaround_3view`/`scene_turnaround_3view` 玩法(与\"三视图一张图\"要求核对)。源\"Seedance 2.0 VIP\"的 VIP/积分语义已剥离。\n\n## 前置硬条件\n\n**必须存在:代言人图像 + 场景调性参考图。** 缺任一立即终止流程并提示补充。可选:产品图、品牌视觉参考图、品牌色彩参考图、材质参考图、空间参考图、既有广告参考图。**缺必要素材时不允许生成任何反推文档/品牌分析/剧情方向/剧本/分镜表/Storyboard Shot/资产图/视频 Prompt/视频素材。**\n\n## 核心概念边界(9 概念职责链)\n\n- **【视觉反推文档】** 由反推阶段输出,是后续品牌调性分析、品牌理念分析、TVC 叙事创意、故事脚本、分镜表、资产提示词、视频提示词的**底层依据**。\n- **【品牌调性分析】** 基于反推文档,确定高奢/时尚/运动/汽车/3C 广告气质。\n- **【品牌理念分析】** 基于反推文档 + 用户品牌信息,提炼品牌精神、受众情绪、广告主张、全球传播语气。\n- **【TVC 叙事创意方向】** 基于调性/理念/代言人图/产品图/场景调性图提出,供用户选叙事路径。\n- **【前期故事脚本】** 在用户确认方向、时长、比例、媒体参数后输出,确认叙事结构。\n- **【表格分镜表】** 据确认后脚本输出,每 15s 一表、每表约 1000 字、含 5-12 镜,**必须表格格式、必须输出给用户并暂停确认**。\n- **【Storyboard Shot】** 仅在用户确认表格分镜后,将每个 15s 表**完整**注册为一个 Shot;不得删减/改写/压缩/换序/改格式。\n- **【资产图注册】** 不以分镜头为单元、不注册分镜资产图、不生成关键帧图;仅注册代言人全身三视图、产品三视图、不同场景资产图、跨表重复且上传未覆盖的道具/新形象/服装/视觉元素。\n- **【资产图生成】** 所有图强制同一图像引擎;生成后必须暂停等用户确认才进视频。\n- **未经用户确认,不默认推进 Storyboard Shot 与各类资产的注册。**\n\n## 阶段(严格按序,依赖只向前,每关键阶段暂停确认)\n\n依赖:阶段 2→1、3→2、4→3、5→4、6→5(须确认分镜)、7→6、8→7、9→8(须确认资产图)、10→9、11→10。\n\n 1. **阶段 1｜视觉基因解构 Visual DNA Analysis**(多模态读图反推):对代言人/场景调性/产品/品牌视觉图执行高精度视觉反推,输出 JSON【美学反推规范文档】+【剧情故事叙事动态潜力文档】,覆盖:媒介类型、视觉范式、代言人外形结构/人物姿态/服装妆发、品牌调性、场景空间、产品结构/材质/色彩/光影/构图/空间坐标、动态潜力、情绪潜力、广告传播潜力、3s 视觉重点、7s 高潮点、转场方式。**只分析,不生成任何后续。** 反推规范见【视觉反推规范】节。\n 2. **阶段 2｜品牌调性分析 + 品牌理念分析 + 参数询问**:\n    - **调性**(须覆盖):品牌所属类型、高奢感来源、时尚感来源、运动性能感来源、汽车速度与工程感来源、3C 科技感来源、全球广告语气、目标人群情绪、视觉禁忌、可用镜头语法、可用音乐节奏。\n    - **理念**(须覆盖):品牌精神、主张关键词、代言人与品牌关系、产品与人物关系、产品与场景关系、广告传播核心情绪、全球 Campaign 可扩展性、适合的 TVC 叙事母题。\n    - **询问参数**:总时长、视频比例、发布平台、品牌类型、是否有品牌名、是否允许出现品牌 Logo、是否允许字幕、是否需要旁白、是否需要对话、是否需要产品三视图、是否需要汽车动态镜头、是否需要运动动作、是否需要 3C 交互镜头、是否需要高奢静物镜头、是否需要全球广告片语气、是否保留视频原声、是否有禁用元素。⏸ 等待确认品牌方向与参数。\n 3. **阶段 3｜TVC 叙事创意方向**:基于反推 + 调性 + 理念,提出 **3 个一句话方向**,每个含:方向标题、类型倾向、故事一句话、品牌理念切入、代言人情绪动作、产品角色、场景调性、核心视觉符号、购买或品牌记忆暗示、适合的 3s 视觉重点、适合的 7s 高潮点。类型覆盖:高奢情绪 TVC、时尚全球广告大片、运动性能 TVC、汽车品牌广告、3C 科技发布片、短剧情广告、CG 广告、实拍质感 TVC。⏸ 等用户选择/混合/修改。\n 4. **阶段 4｜前期故事脚本**:含 标题、类型、总时长、比例、视觉风格、品牌主张、核心叙事、代言人行动线、产品行动线、场景行动线、情绪节奏、商业记忆点、旁白或对话草案、音乐氛围、每 15s 叙事单元概要、片段开头承接策略、片段结尾衔接策略。**仅确认叙事方案,非分镜,不得注册为 Shot。** ⏸ 等确认。\n 5. **阶段 5｜全局表格分镜成表 Global Storyboard Table**——**强制暂停点**:每 15s 输出一张独立表(总时长严格 15s、5-12 镜、约 1000 字、信息密度高、必须表格格式)。每 3s 一个视觉重点、每 7s 一个视觉或情绪高潮。**每表开头承接上表的镜头内容/镜头运动/音乐状态/音效尾音/情绪能量,结尾为下表预留镜头方向/动作余势/转场音/音乐节拍/视觉几何接口**(必要时首尾重复一小段动作/音乐动机/转场音/运动方向/视觉符号保连续)。表格字段:镜头序号｜时间段｜景别与视角｜运镜方式｜画面内容与表演｜品牌/产品/代言人关系｜光影与材质｜SFX｜音乐与情绪曲线｜转场逻辑｜首尾衔接策略｜商业表达功能。**任何分镜修改均需重新输出完整表格分镜并再次等待用户确认。** 确认前严禁写规格/注册 Shot/资产注册/资产图生成/视频 Prompt/视频生成/时间线合成。分镜设计规范见【分镜与 Shot 注册规范】节。\n 6. **阶段 6｜编写 Final_Video_Spec**(`write_file_v2`):含 标题/类型/比例/总时长/每段时长/品牌调性/品牌理念/视觉风格/语言/模型偏好/分辨率/资产策略/音频策略/片段首尾衔接策略。默认类型=大牌调性情绪 TVC 全球广告片;默认 720p;**默认比例**:未指定则优先 9:16 竖屏(小红书/抖音/视频号/Reels/TikTok),全球 Campaign/发布会/大屏/官网优先 16:9,电商详情/社媒 KV 联动可 1:1 或 4:5。\n 7. **阶段 7｜分镜注册 Storyboard Registration**:每张 15s 表**完整注册为一个 Shot**,含该表内所有镜头内容,**不得删减/压缩/改写/换序/改格式**;仅技术性编辑(拆镜 ≤15s、补镜头语言字段、补 Shot ID 与资产引用字段);不虚构情节、不改台词、不新增未确认内容。Shot JSON 格式见【分镜与 Shot 注册规范】节。\n 8. **阶段 8｜资产清单分析、注册与生成**(`generate_image_v3`):Shot 注册完成后做全局资产清单分析。资产细则见【资产生成与绑定规范】节。⏸ 生成后强制暂停,等用户调整/重抽/替换/锁定;未确认资产图前严禁进视频 Prompt 与视频生成。\n 9. **阶段 9｜提示词构建 Prompt Engineering**(严格按万能公式):每个 15s Shot 对应一个视频 Prompt,把表内 5-12 镜逻辑**完整融入同一 Prompt**,保留镜序/3s 视觉重点/7s 高潮/动作链/转场逻辑/代言人动作/产品展示/品牌情绪/光影材质/声音标记/首尾衔接策略/负向约束;明确开头承接前段、结尾衔接后段;中文书写(必要英文镜头术语与负向参数保留)。详见【提示词构建规范】节。\n10. **阶段 10｜Seedance 动力生成**(`generate_video_v3`,720p):每个 15s Shot 生成一段,参考该 Shot 已确认并绑定的代言人三视图/产品三视图/对应场景资产/必要重复道具/上传原始参考图;严格 3s 重点与 7s 高潮、画面动效不间断不间歇;开头结尾保留与相邻片段一致的镜头运动/音乐节拍/转场音/动作方向/光影延续或视觉符号。**后续 Shot 可参考前一个已完成片段作连续性参考,但不得生成/注册新关键帧图。**\n11. **阶段 11｜时间线合成 Timeline Integration**(`composite_video`):按 Shot 顺序推送片段到时间线。见【合成与质检规范】节。\n\n## 视觉反推规范(阶段 1 内部规范)\n\n**身份/目标**:高精度逆向分析专家,覆盖摄影、写实 CG、产品渲染、人物造型、时尚大片、汽车广告、3C 视觉、高奢静物、运动品牌影像、建筑空间、场景调性参考、品牌视觉参考。输出为严格 JSON,作为高保真重建、风格复现、品牌分析、TVC 叙事规划、分镜规划、资产提示词与视频 Prompt 的技术底稿。\n\n**系统指令**:任务不是写营销文案、不是审美评价,而是把图像拆解为可执行的生成逻辑。**必须先判定输入属于平面创作逻辑还是立体写实逻辑,再据媒介属性执行不同反推方案。**\n\n- **平面创作类**重点反推:流派依据、图形秩序、版式结构、色块组织、边缘控制、印刷逻辑、图案结构、空间压缩方式、负空间安排、工艺特征。\n- **摄影与写实 CG 类**重点反推:镜头语言、透视关系、焦距范围、景深范围、光源路径、材质物理参数、表面响应、全局光照、次表面散射、体积介质、建模细分和贴图叠层。\n- 每个主要元素必须完整描述:名称/类型/制式/材质/颜色/纹理/结构/尺寸关系/空间位置/遮挡关系/朝向/受光状态/工艺痕迹。人物必须描述姿势/重心/关节关系/表情/视线/妆造/发型/服装结构。产品必须描述专业名称/用途类别/制式/结构拆分/尺寸比例/材质构成/表面工艺/纹理类型/边缘处理/连接方式/受光面与背光面/朝向/与人物或空间的接触关系。\n- 输出为 JSON,信息密度不少于 1000 词,不写生成参数、不写无意义连接词、不用空洞修辞。\n\n**输入要求**:至少含代言人图像 + 场景调性参考图;可选产品/品牌视觉/材质/空间/既有广告参考图。若上传产品图→析结构/材质/功能展示潜力/三视图资产需求;上传汽车图→析车身比例/前脸/灯组/轮毂/腰线/车顶线/内饰/漆面反射/玻璃透射/轮胎橡胶/路面接触/速度暗示;上传 3C 图→析屏幕比例/边框厚度/机身曲面/按键/接口/镜头模组/金属玻璃陶瓷塑料材质/交互状态/手持关系/反射与指纹控制;上传高奢时尚图→析服装廓形/面料/剪裁/版型/缝线/饰件/皮革/金属件/宝石/织物肌理/妆发/姿态/品牌语气。\n\n**输入分类逻辑**:先判 Flat Creative Work 还是 Dimensional Realistic Work;两者并存则按主视觉占比判主类,并在 `secondary_mode` 记次级属性。\n\n- `flat_art_indicators`:线条主导轮廓、笔触或矢量边缘可见、透视压缩或散点透视、色块分区明确、底材纹理参与成像、非物理光照逻辑、局部形体省略、装饰性纹样高于光学还原。\n- `dimensional_realism_indicators`:镜头透视明确、焦内焦外差异清晰、高光响应与材质匹配、体积光或环境反射存在、空间纵深依赖物理遮挡、纹理随曲面连续变化、材质粗糙度和反射行为可辨、边缘存在镜头成像特征。\n- `secondary_mode` 例:平面海报模拟胶片摄影、CG 模拟胶片摄影、摄影后期转绘、3D 产品渲染叠加平面图形、实拍人物合成 CG 产品、汽车 CG 合成真实路面环境。\n\n**核心原则**:优先标准名词/行业术语/工艺术语/材料术语/光学术语/服装制式/建筑构件/汽车设计术语/3C 工业设计术语/时尚广告术语/电影摄影术语;减少形容词与抒情句;**不得用美丽/华丽/惊艳/唯美/梦幻/高级感等空洞审美词作核心描述**;不用模糊代称;每个元素须描述位置/比例/材质/结构/表面状态/颜色/受光逻辑;无法百分百确认制式或材料时须给最接近的专业判断并**明确标注为推定**;不写出图参数/风格化口号/模型名堆砌。\n\n**分析流程**:①判媒介类型/成像逻辑/主次视觉范式 ②拆分代言人/产品/场景/道具/服装/背景/装饰纹样/文字图形元素 ③建前景/中景/后景三层以上空间分层,记遮挡与透视 ④对每元素做名称/制式/结构/材料/工艺/颜色/纹理识别 ⑤反推光源方向/光质/色温/阴影边界/反射路径/漫反射与镜面反射占比 ⑥平面类反推图形秩序/版式/底材/边缘/色层/媒介特性 ⑦摄影 CG 类反推镜头/景深/传感器倾向/光学缺陷/PBR/贴图层级/建模渲染 ⑧建构图骨架(重心/引导线/网格/比例/留白与密集区)⑨输出 JSON 化重建提示词 ⑩检查语言密度不足 1000 词继续补 ⑪**TVC 专属**:额外输出品牌调性、品牌理念潜力、代言人气质潜力、产品价值潜力、全球传播记忆点、资产生成需求、3s 视觉重点、7s 高潮点、片段首尾衔接候选方案。\n\n**平面类术语库**:流派/艺术史/地域装饰/奢侈品广告版式/运动品牌视觉语法/科技品牌发布视觉体系;底材(铜版纸/哑粉纸/胶片扫描/数码画布/矢量纯色/印刷网点/亚克力/LED 屏/玻璃橱窗/金属展架/数字合成);色彩(色相分布/明度阶梯/饱和度控制/冷暖平衡/互补色/邻近色/色块边界硬度/色域限制/强调色/品牌色占比/固有色与受光色分离);肌理(纸纤维/印刷网点/数字噪点/胶片颗粒/摩尔纹/金属反射/玻璃折射/亚克力色散/皮革/碳纤维/织物);构图(黄金分割/对角线/中轴对称/动态斜线/速度线/负空间/满构图/边框裁切/装饰带/主次节奏/视线路径/品牌留白/KV 式主体占位)。\n\n**立体写实类术语库**:镜头光学(焦距/视角/畸变/球面镜头/景深/焦点平面/压缩透视/边缘锐度衰减/传感器倾向/快门冻结/运动模糊/呼吸效应/色差/眩光/高光扩散);布光(主光/辅光/轮廓光/顶光/侧光/逆光/环境光/区域光/点光源/面光源/天光/窗光/全局光照/体积散射/半影/反射补光/环境遮挡);PBR(反照率/粗糙度/金属度/法线强度/位移/镜面反射强度/各向异性/菲涅尔/次表面散射/透射/折射率/涂层层级/污染层/磨损边缘/微表面划痕);渲染链路(路径追踪/光追/贴图分层/UV 展开/高模转低模/细分曲面/布料模拟/毛发系统/体积雾/景深后期合成/色彩映射/胶片颗粒模拟)。\n\n**动态元素描述规则**:\n\n- **人物**必须描述:数量/年龄段/性别表达/站姿坐姿/重心落点/脊柱弯折/肩线高低/颈部转向/头部倾角/视线方向/手臂动作/手指姿态/腿部支撑/步态或静态/面部表情/眉眼口鼻形态/微表情/发型结构/发际线与发束/妆容体系/服装结构/衣褶组织/配饰佩戴/局部遮挡。**表情术语**:眼轮匝肌收缩/上睑提升/下睑紧张/眉头聚拢/嘴角下压/嘴角上提/下颌放松/凝视/侧视/回望/闭目/启唇/压唇。**时尚制式术语**:廓形/肩线/收腰/落肩/立体剪裁/斜裁/压褶/褶裥/镶边/刺绣/织金/金属扣/皮革压纹/缎面反光/羊毛呢/丝绸/尼龙机能面料/针织肌理/运动压胶/鞋底纹路/鞋面织物/镜面金属配件。\n- **产品**必须描述:专业名称/用途类别/制式/结构拆分/尺寸比例/材质构成/表面工艺/纹理/边缘处理/连接方式/洁净度/受光面与背光面/朝向/与人物或空间接触关系。\n- **汽车**必须描述:车身比例/前脸结构/格栅或封闭式前脸/灯组形态/轮毂尺寸/胎壁/腰线/车顶线/侧窗比例/尾灯/扰流结构/漆面反射/玻璃透射/内饰/座椅/方向盘/中控屏/道路关系/速度动势。\n- **3C**必须描述:屏幕比例/边框厚度/机身厚度/倒角/按键/接口/镜头模组/背板材质/屏幕亮度/反射控制/手持姿态/交互界面/指纹或洁净状态/金属玻璃陶瓷塑料材质差异。\n- **建筑**必须描述:类型/平面布局/立面结构/梁柱体系/门窗格心/台基/栏杆/材料/表面风化/朝向/商业展陈关系。\n- **文字/Logo**:是否存在文字/语言/字体类型/排列方向/字重/字距/是否图章题签商标铭文品牌 Logo。**未获用户授权时,后续生成必须规避。**\n\n**空间重建规则**:建前/中/后景三层以上;每个关键元素描述左右位置/上下位置/中心偏移/占画面宽度比例/占高度比例/与其他物体间距/前后遮挡/旋转方向与倾斜角度/透视收缩方向/视线导向线/留白范围。**比例逻辑**:代言人与产品/产品与桌面/汽车与道路/3C 与手部/人物与建筑/人物与场景比例、巨物感或微缩感、产品与前景遮挡物比例。\n\n**光色与材质规则**:光照须明确主光方向/光源高度/光质硬软/阴影边界锐软/是否逆光或轮廓光/环境反射/体积光雾烟粉尘;色彩须写主色/辅色/强调色/明度组织/局部饱和度峰值/背景色域/冷暖对比/品牌色比例/固有色与受光色区分;**任何具材质属性的元素都必须描述基底/表面/边缘/纹理/反射/磨损/污染/透明度/厚薄/工艺痕迹**;常见材质类目:丝绸/缎面/羊毛/皮革/尼龙/机能面料/橡胶/碳纤维/铝合金/不锈钢/镀铬金属/玻璃/蓝宝石玻璃/陶瓷/塑料/亚克力/钢琴烤漆/汽车金属漆/织物/水体/烟雾/混凝土/石材/LED 屏;写实模式 PBR 字段:反照率/粗糙度/金属度/镜面反射/法线起伏/位移层次/次表面散射/透射率/折射/菲涅尔。\n\n**输出 JSON Schema**(严格 JSON,不附解释/前言/总结,`minimum_word_count: 1000`):\n\n```json\n{\n  \"input_classification\": { \"primary_category\": \"Flat Creative Work or Dimensional Realistic Work\", \"secondary_mode\": \"optional\", \"confidence_note\": \"若存在推定应明确标注\" },\n  \"global_scene_definition\": { \"scene_type\": 业提示词,按生成逻辑连续输出,不写参数,不写无意义形容词\"\n}\n```\n\n**最终执行规则**:先自动判平面创作类/立体写实类再输出;输出须覆盖全局场景/构图骨架/空间坐标/主体元素/代言人模块/产品模块/材质模块/光影模块/平面技法或写实物理模块/品牌调性/品牌理念潜力/TVC 叙事潜力/资产需求;语言专业紧凑精准;**禁审美化空话、禁参数化出图格式、禁遗漏主要元素**。\n\n## 分镜与 Shot 注册规范(阶段 5 + 阶段 7)\n\n**职责边界**:只在用户确认表格分镜后注册 Shot;不负责品牌分析/叙事方向/资产图生成;**不得把 planner 阶段任何输出直接注册为 Shot**。\n\n**表格分镜设计要求**:每 15s 一张表、含 5-12 镜、总时长严格 15s、描述量约 1000 字。表格列同阶段 5。每 3s 一个视觉反馈点(景别变化/微观特写/光影位移/运镜速度变化);每 7s 一个视觉或情绪高潮(Push-in/Pull-out/Orbit/动作爆发/产品功能显现)。**长镜头严禁置于首尾,必须位于中段承担情绪承接。** 所有镜头须构成连续、物理可成立的动作链,**使用无缝转场六型:动势匹配 / 物理遮挡 / 几何重合 / 光影延续 / 声音桥 / 节拍延续**。**严禁黑场、白场、渐显、渐隐、叠化、无意义空镜。** 每张表后补节奏校验:3s 反馈点、7s 高潮点、四重目标完成情况、片段首尾衔接策略。\n\n**四重商业表达目标(每 15s 必须全部覆盖)**:\n\n- **代言人气质**:通过出场方式、动作节奏、视线方向、微表情、服装与产品互动建立。\n- **品牌世界观**:通过环境、空间层次、光照结构、色彩与材质语言和镜头调度建立。\n- **产品欲望**:通过局部特写、材质放大、性能动作、工艺细节强化。\n- **品牌记忆**:首 2s 建立视觉钩子,结尾形成品牌记忆、产品欲望或全球 Campaign 余韵。\n\n**语言要求**:直接输出可确认的专业脚本,不复述规则、不写概念摘要;描述须具导演执行性(动作如何发生、光从哪来、材质如何被照亮、转场为何成立);**\"高级/梦幻/电影感\"等词不得单独成立,必须落到可见物理细节**;未授权品牌 Logo/随机文字/水印/产品标签严禁出现;**严禁破坏性词汇:破裂/分割/破碎/裂缝/切割/爆破/碎片**。\n\n**Shot 注册规范**:每张 15s 表注册为一个 Shot,完整继承全部内容,不删减/压缩/改写/换序/改格式;仅技术性编辑(拆镜 ≤15s、补镜头语言字段、补 Shot ID 与资产引用字段);注册时只记资产引用类型,不生成资产图、不按镜头注册资产、不触发关键帧;可引用:用户上传图像、经确认的代言人三视图/产品三视图/场景资产图/跨表重复道具或新形象资产,**未确认资产不得绑定**。\n\nShot JSON 格式:\n\n```json\n{\n  \"shot_id\": \"Shot_01_0-15s\",\n  \"source_table_id\": \"Table_01_0-15s\",\n  \"duration\": \"15s\",\n  \"asset_references\": [\"confirmed_spokesperson_full_body_three_view\", \"confirmed_product_three_view_if_any\", \"confirmed_scene_asset_by_scene_id\", \"confirmed_recurring_prop_or_new_look_assets_if_any\"],\n  \"registration_note\": \"完整继承用户已确认的表格分镜,不删减、不改写、不更改格式。\",\n  \"confirmed_storyboard_table\": \"完整表格分镜内容\",\n  \"continuity_requirement\": \"严格执行 3s 重点、7s 高潮、动作链、转场逻辑与首尾衔接策略。\"\n}\n```\n\n## 资产生成与绑定规范(阶段 8)\n\n**图片模型统一**:所有图片生成强制同一图像引擎(`generate_image_v3`),适用范围仅:代言人干净背景全身三视图、产品干净背景三视图、不同场景资产图、跨表重复且上传未覆盖的道具/新形象/服装造型/车辆/3C 交互资产;**禁生成分镜资产图、禁按镜头生成、禁关键帧图、禁为一次性动作生成资产图**。\n\n- **A. 代言人资产**:以上传代言人图为身份参考,生成一张干净背景全身三视图(正/侧/背);三视图须**身份五同**:同一身份/面部结构/发型/体型比例/妆造逻辑/服装造型或用户确认的造型变体;若分镜存在不同服装或状态,**仅当该新形象跨表重复且上传未覆盖时**,才为该 Look 生成独立三视图并标注 **Look ID**;不改身份特征、不生成未确认新造型;背景干净、不出现复杂场景/随机文字/水印/未授权 Logo。\n- **B. 产品资产**(如有产品):生成一张干净背景产品三视图(正/侧/背;形态特殊可用正/45 度/背或最能表达结构的三角度)。**汽车**三视图须在一张图内体现前脸/侧身/尾部/灯组/轮毂/车身腰线与漆面反射;**3C** 须体现正面屏幕/侧面厚度/背部材质/镜头模组/接口或关键交互结构;**高奢**须体现正/侧/背/廓形/材质/缝线/金属件或皮革纹理;**运动**须体现正/侧/背/材料结构/受力逻辑或穿戴关系。**严格参考上传产品图,不得改变结构/比例/主要材质和核心识别点**;背景干净同上。\n- **C. 场景资产**:据全部已确认分镜表做全局分析,有几个不同场景就注册几张,每个不同场景一张;同场景跨多表重复只注册一次不重复生成;参考场景调性图反推的美学文档、匹配调性与理念;候选:高奢建筑空间/极简展厅/夜间城市道路/山地运动环境/未来科技空间/玻璃摄影棚/机场跑道/海岸公路/冷调工业空间/发布会舞台/数字界面空间。**场景资产是空间与调性的定义图,不是分镜关键帧,不含具体分镜动作,不按镜头生成**;不生成与调性冲突的场景、不自动加未授权 Logo/文字/标签/水印。\n- **D. 跨分镜重复资产**:仅当某道具/新形象/服装造型/车辆内饰/3C 交互界面/装置结构等跨多表重复**且上传未覆盖**时才注册;每类只注册一次;不为单镜/一次性动作/短暂氛围/镜头角度/转场瞬间生成;不新增未确认视觉元素;须参考场景调性美学文档与调性分析。\n- **禁止注册**:单镜头资产、分镜资产图、关键帧图、一次性动作资产、临时氛围资产、未在分镜表确认的视觉元素。\n\n**资产绑定规则**:用户确认资产图后,每个 Shot **只绑定该 Shot 实际出现的**已确认资产;某 Shot 不出现产品则不强绑产品资产,不出现代言人则不强绑代言人资产;绑定服务已确认分镜、不新增未确认内容;**资产调用可按 Shot,但资产注册与资产图生成不得以分镜头为单位**(注册粒度 ≠ 绑定粒度)。\n\n**视频生成内容遵循**:严格遵循已注册 Shot;不改镜序、不改代言人动作结果、不改台词旁白、不新增未确认情节/角色/场景/道具/产品/Logo/文字/标签。**Logo 授权双分支**:未授权则不生成任何 Logo 或文字;已授权仅允许在分镜明确指定的位置/尺寸/时长内出现。\n\n**一致性清单**:保持代言人面部结构/体型比例/发型/妆造/服装结构/姿态气质稳定;产品比例/结构/材质/颜色/表面状态/品牌识别点稳定;汽车车身比例/灯组/轮毂/腰线/漆面反射连续;3C 屏幕比例/边框厚度/机身材质/镜头模组/交互状态连续;多 Shot 间色彩/材质/空间风格/灯光方向和情绪递进稳定。\n\n**动效遵循**:严格 3s 重点与 7s 高潮、动效不间断不间歇。**允许**:代言人转身/行走/停驻/抬头/回望/手部触碰产品/服装随动作自然褶皱/车辆平稳加速/车灯点亮/轮胎滚动/产品旋转/屏幕交互/光线扫过金属边缘/镜头 Orbit·Tracking·Push-in·Pull-out·Whip-pan。**禁止**:剧烈肢体变形/身份漂移/产品结构错误/车辆比例漂移/3C 屏幕乱码/随机文字/未授权 Logo/无依据新道具/破坏性转场。\n\n**片段首尾连续性**:因 15s 片段分开生成,须在生成时考虑与相邻片段衔接;必要时开头重复上一片段结尾的动作余势/镜头运动方向/音乐节拍/转场音/视觉符号,结尾预留下一片段的动作方向/转场音/光影滑移/几何重合物/镜头速度;可用**声音桥/镜头运动桥/光影桥/几何桥/动作桥/产品高光桥**;**禁用黑场/白场/渐隐/渐显/叠化解决衔接**。\n\n## 提示词构建规范(阶段 9)\n\n**总原则**:所有 Prompt 中文书写(必要英文镜头/摄影术语、模型负向约束可保留);目标是把已确认品牌调性/视觉反推文档/资产要求/表格分镜/Shot 翻译为可执行生成指令;**不重写剧情、不新增未确认画面、不生成未确认内容**。\n\n**图片提示词规范**:据上传图的美学文档与资产要求改写,服务同一图像引擎;**不得只描述\"好看\"**,须明确主体/身份/结构/材质/光影/构图/品牌调性/场景来源/资产用途;**必须引用视觉反推文档九要素**(品牌调性/色彩比例/光源路径/材质语言/构图结构/空间气质/代言人身份特征/产品结构/场景调性);禁为分镜资产图/关键帧图/单镜头动作图写资产提示词。\n\n- **代言人三视图 Prompt**:以上传代言人图为身份参考,描述同一身份/全身比例/面部结构/发型/妆造/体型/服装廓形/鞋履/配饰/正侧背/标准站姿/均匀光照/干净背景/无遮挡/无夸张姿势/无额外人物。**风格分支**:高奢→强调剪裁/面料/饰件/皮革或金属件质感;运动→功能面料/运动鞋结构/肌肉线条/动态准备姿态;汽车 TVC→与车辆品牌气质匹配的姿态/服装/光影;3C→手部可交互状态/科技感服装材质/清晰五官和手部结构。**必须声明:这是干净背景全身三视图资产图,不是分镜画面,不含具体广告动作,不含复杂场景。**\n- **产品三视图 Prompt**:以上传产品图为结构参考,描述专业名称/正侧背或最适合的三角度/结构比例/材质/边缘/接口/屏幕/镜头模组/灯组/轮毂/金属件/皮革纹理/玻璃反射/表面洁净度/标准展示光照/干净背景/无文字乱码/无未授权 Logo。汽车→车身角度/侧面线条/轮胎接地/车漆反射/灯组细节;3C→屏幕亮度/边框厚度/机身厚度/背板材质/关键交互结构;高奢→皮革/金属件/缝线/宝石/织物/包装结构材质细节。**必须声明:这是干净背景产品三视图资产图,不是分镜画面。**\n- **场景资产 Prompt**:来自场景调性图反推文档;每个不同场景一条;描述空间类型/结构层级/主光方向/环境光/地面材质/墙面材质/前景遮挡物/品牌留白/镜头可运动路径/人物站位/产品陈列位;不生成未授权 Logo/随机文字/价格/标签/水印;**必须声明:场景资产图是空间调性与结构参考,不是分镜关键帧。**\n- **跨分镜重复资产 Prompt**:仅跨表重复且上传未覆盖时写;基于反推文档/调性文档/场景美学文档/已确认分镜;写清名称/结构/材质/比例/颜色/表面状态/与品牌调性关系/干净或独立展示背景;不把一次性动作/单镜头/转场瞬间/分镜构图写成资产 Prompt。\n\n**视频提示词万能公式(10 段结构)**:每条视频 Prompt 按序编写——\\\n`参考锁定 → 摄像机 → 代言人/产品/表演 → 空间/材质 → 光影/色彩 → 动作节奏 → 片段首尾衔接 → 转场 → 声音 → 负向约束`。\n\n- **参考锁定(固定开头模板)**:每条 Prompt 开头写\"使用已确认代言人三视图、产品三视图、场景调性资产、必要跨分镜重复资产、用户上传参考图作为视觉参考,保持代言人身份/面部结构/体型比例/妆发/服装/产品结构/材质/品牌色彩/场景光影与整体 TVC 调性一致\"。\n- **单任务多镜头融合格式**:每个 15s Shot 对应一个长 Prompt,按表格分镜顺序逐镜写入 `[镜头N:时间段,景别,视角,运镜] 画面内容与表演、品牌/产品/代言人关系、光影与材质、SFX、音乐情绪、商业表达功能、首尾衔接策略` + `[转场方式:动势匹配/物理遮挡/几何重合/光影延续/声音桥/节拍延续] 说明物理依据`,直到该 15s Shot 完整结束;**不得遗漏任何镜头、不得改变镜头顺序、不得删除声音/材质/光影/转场/首尾衔接或商业表达信息**。\n- **节奏写入(五段职能)**:0-3s 品牌视觉钩子与第一个视觉反馈点;3-6s 代言人气质/产品材质或核心结构展示;6-8s 第一个视觉或情绪高潮;8-12s 空间/动作/产品价值或品牌理念升级;12-15s 品牌 Hero Moment/产品 Hero Moment/全球 Campaign 记忆点或下一片段衔接点。\n- **首尾衔接写入**:写明开头如何承接上一片段(重复动作余势/镜头运动方向/音乐节拍/转场音/光影状态/产品高光/几何构图或人物视线方向)、结尾如何连接下一片段(保留动作方向/镜头速度/SFX 尾音/音乐节拍/光影滑移/产品反光/衣料飘动/车辆运动方向或屏幕交互余势);**首段开头必须建立品牌钩子,末段结尾必须形成品牌记忆/产品欲望或全球广告余韵**。\n- **质感表达**:必须写具体物理细节,不得只写高级/梦幻/精致/电影感。可用句库:金属漆面形成长条形环境反射;玻璃屏幕出现受控高光但不溢出;皮革表面可见细密压纹与边缘油蜡光泽;缎面布料随身体转向形成窄幅高光;碳纤维纹理在侧光下产生方向性反射;鞋底橡胶在地面接触处轻微压缩;汽车轮毂旋转时高光形成连续弧线;3C 产品倒角边缘产生冷白轮廓光;代言人眼部高光随转头发生微小位移。\n- **声音标记**:`<...>` 标注具体物理音效、`(...)` 标注音乐情绪曲线。示例:`<皮革摩擦声>`、`<金属扣轻触声>`、`<车辆低频电机声>`、`<轮胎掠过湿地面的细密摩擦声>`、`<屏幕解锁轻响>`、`<镜头呼吸式低频冲击>`、`<转场低频下潜>`、`(冷调弦乐铺底)`、`(低频脉冲渐强)`、`(鼓点短暂停顿后重新进入)`、`(品牌 Hero 瞬间音乐抬升)`。**storyboard 中无旁白/对话则不自行添加;有则逐字保留,不得改写。**\n- **负向约束(每条 Prompt 末尾必含)**:`no subtitles, no random text, no watermark, no unauthorized logo, no unauthorized brand mark, no product label unless explicitly approved, no malformed typography, no fading to black, no fade in, no fade out, no black screen, no extra character, no identity drift, no distorted face, no mutated hands, no product deformation, no vehicle deformation, no screen gibberish, no destructive transition.`\n- **禁用描述词汇**:严禁 破裂/分割/破碎/裂缝/切割/爆破/碎片。表达变化改用:滑开/展开/抬起/翻转/漂浮/聚拢/旋转/靠近/遮挡/显露/折射/漫反射/高光滑移/焦点迁移/空间重构/节拍延续/声音桥/光影延续。\n\n## 合成与质检规范(阶段 11)\n\n**合成顺序**:所有片段生成后按 Shot 顺序推送到时间线,每个 15s Shot 一个片段;**不改分镜顺序、不随意变速、不插入未确认新镜头**。\n\n**音轨管理**:**打开视频轨音量,Video track volume: ON;不执行额外音频素材生成,不额外生成独立 BGM、旁白或音效;若用户额外提供音频按用户要求绑定,但不得自动替换视频原声。**\n\n**片段衔接检查**:检查代言人外观/面部结构/体型比例/妆发/服装/产品结构/材质/色彩比例/灯光方向/空间风格是否连续;前后片段动作方向是否承接;音乐节拍/SFX 尾音/转场音/低频冲击/呼吸节奏是否连续;禁黑场/白场/渐隐/渐显/叠化/无意义空镜;优先声音桥/镜头运动桥/光影桥/几何重合/动作余势桥/产品高光桥衔接。\n\n**成片质检**:画面不得出现未授权字幕/随机文字/Logo/水印/品牌标识/产品标签(授权则仅在确认分镜指定位置);代言人不身份漂移/变脸/变形;产品不结构变形/比例漂移/材质漂移;汽车不车身比例错误/轮毂漂移/灯组变形;3C 不屏幕乱码/边框漂移/接口错位;**每 3s 有视觉重点、每 7s 有高潮点、每 15s 首尾具备衔接逻辑、结尾形成品牌记忆/产品 Hero Moment/全球 Campaign 余韵或购买欲望**;全片保持大牌品牌调性、情绪 TVC 质感与全球广告宣传片节奏。\n\n## 相关\n\n15s 单规格快广告 → tv-ad;通用商品广告 → tv-ad;工业产品宣传片 → industrial-product-promo;一图美学成片(同解构引擎) → single-image-to-film;产品营销图 → product-photoshoot。", "extras": [], "cn": "品牌+代言人大片导演"}, {"slug": "cartoon-flow", "desc": "任意故事，一键变身卡通动画片", "body": "# cartoon-flow\n\n做 2D / 2.5D 风格化动画视频（卡通、anime 风、非写实角色）时用本 skill。从单段到多段故事，按阶段推进，每阶段产出对接 13 工具。\n\n## 阶段\n\n1. **场景/剧情解析**：理清故事、角色、场景、道具（结构化产出见下）。\n2. **风格设定**：定一套统一动画画风（用下面的\"风格公式\"），作为全片视觉基准。\n3. **锚点设定图（两步：先基底→再风格化）**：卡通资产别一步到位。先用 `generate_image_v3` 出角色/场景/道具的**中性基底图**（结构、比例、构图对，模板见下），再用它作参考**风格化**到第 2 步的画风。`tag` 对应 character/scene/prop，风格化后的图作跨镜锚点；角色一致性见 character-consistency。\n4. **分镜**：多段故事按 SP 分镜切割原则拆镜（CLIP 字段见下），定节奏与首尾衔接。\n5. **逐镜生成**：用 `generate_video_v3` 逐镜生成，`reference_nodes` 引用对应锚点、prompt 里 `{{NodeKey}}` 绑定，单镜 ≤15s；数量锁见下。\n6. **合成**：多段用 `composite_video` 拼成成片（见 montage，`Skill(\"montage\")`）。\n\n## 场景解析结构（Stage 1 深度）\n\n解析产出：叙述摘要；**角色**（简称 shorthand 供跨模块引用、性别、年龄段、是否来自上传）；**场景**（简称、室内/外、时段）；**候选道具**；风格预设倾向 + 理由；总时长；**格式路径**（single-video 单段 / multi-clip 多段）+ 选择理由。简称贯穿后续所有阶段，别中途改名。\n\n## 风格公式（Stage 2 深度）\n\n把画风写成一条单行公式，固定这几段拼接：\n\n> **[画风基底]** 动画，参考 **[风格参照]** —— [线条技法]、[上色技法]、[调色板]、[点缀特效]、[背景处理]、[动画节奏/timing]、[相机描述]\n\n- 各段由需求驱动；无法映射或缺输入时回退到通用默认（现代 2D 手绘 + 粗细变化的手绘墨线 + 三值平涂赛璐珞硬阴影 + 饱和大地色 + 阴影区半色调点 + 手绘线沸腾、动作走二拍 + 24fps）。\n- **只限 2D / 手绘 / 卡通范围**；像素、3D、写实风不在此。\n\n## 基底描述模板（Stage 3 基底步）\n\n- **角色基底**：年龄性别+表情 → 发型 → 体型体态 → 面部细节 → 服装（上→下→鞋，无 logo/文字、全覆盖、肘腰膝真实褶皱、干净轮廓）→ 姿态；**全身站立肖像**、纯色背景柔和正面漫射光、头顶脚底留边距、无道具/无场景。\n- **场景基底**：标识行 → 建筑（墙/地/关键结构/陈设/空间布局：左…右…后景…前景…）→ 布光 → 氛围 → 静态广角建立镜（前景锚 + 背景锚）；**空场锁**：无人物/剪影/动态、16:9 水平。\n- **道具基底**：标识行 → 材质/表面细节/特征 → 孤立产品样照构图、纯色背景上方漫射光；**孤立锁**：无人/无手/无其他物体/无场景；通常 1:1。\n- **风格化步**：保留基底的身份/空间布局/形状精确不变，**只改渲染**到风格公式画风。\n\n## CLIP / beat 结构（Stage 4 深度）\n\n每个 CLIP 记：叙事功能（建立/激励事件/上升/高潮/收束）、角色想要（Want）、地点 + 地点模式（锁定/转场）、转场类型、**相机模式**（单锁定/多切锁定/视差滚动）、**音频模式**（氛围/旁白/动作/对话）、角色与道具锁、场景描述、取景、高潮标记（climax-token）、**收束状态**（本镜结束时角色的最终姿态/位置/表情，带空间位置）。\nCLIP 内再拆 **beats**（每 beat：want / 取景提示 WS·MS·CU / 描述 prose / 高潮标记 / **空间锚点**）。\n**跨镜连续性**：靠\"空间锚点词汇 + 上一镜的空间锚点\"桥接（bridge-rule），保证角色位置/朝向不跳变。\n\n## 逐镜数量锁（Stage 5 深度）\n\n生成 prompt 里显式锁死：本镜**角色数恰好 N**——无额外角色/路人/背景人群，角色单一实例、绝不克隆/复制/同框出现两次；**道具唯一**（每个叙事道具单一实例）；**场景锁定**（全镜动作发生在本地点内，不切换空间）。\n\n## 原则\n\n- 全片统一动画画风，跨镜不漂移。\n- 风格公式、镜头节拍等关键决策按 SP 导演经验自己做，不外包。\n- 暂停点：风格设定图、分镜确认后再进生成（见 SP）。\n\n## 配合（query 需同时加载 / 也是本 skill 的评估组合）\n\n| 关系 | 目标 | 用途 | 必需? | provenance |\n|---|---|---|---|---|\n| 依赖 | image-generation | 基底图 + 风格化锚点 | 必需 | 源生 |\n| 依赖 | video-generation | 逐镜生成 | 必需 | 源生 |\n| 依赖 | montage | 多段拼接（源壳 Phase 6 明写 `Skill(\"montage\")`） | multi-clip 必需（N≥2） | 源生 |\n| 依赖 | character-consistency | 跨镜角色锚定 | 复现角色时 | 源生 |\n\n边界（有专属技法体系，命中改道独立 skill，非依赖）：宫崎骏式手绘（赛璐珞质感/自然生命力/飞行与风/色彩插槽/视觉状态账本）→ ghibli-anime-style；羊毛毡动画（羊毛毡材质复刻现实/造型三级分级/镜头内时间分段）→ needle-felt-animation；水墨武侠动画（五行色彩爆发态/四宫格场景/画风运动张力耦合/水墨情绪外化）→ ink-wuxia-animation；90s 魔法少女（日常/变身双形态/双层世界观/仪式化变身序列/反派视觉层次）→ mahou-shoujo-90s。\n\n## 风格专项（有专属技法体系，直接走独立 skill）\n\n本 skill 是通用 2D/2.5D 动画流程；以下风格有各自独特技法体系（风格致敬非精确模仿），命中时优先用专项 skill：\n\n- **宫崎骏式手绘**（赛璐珞质感/自然生命力/飞行与风/色彩插槽/视觉状态账本）→ ghibli-anime-style\n- **羊毛毡动画**（羊毛毡材质复刻现实/造型三级分级/镜头内时间分段）→ needle-felt-animation\n- **水墨武侠动画**（五行色彩爆发态/四宫格场景/画风运动张力耦合/水墨情绪外化）→ ink-wuxia-animation\n- **90s 魔法少女**（日常/变身双形态/双层世界观/仪式化变身序列/反派视觉层次）→ mahou-shoujo-90s", "extras": [], "cn": "2D动画导演"}, {"slug": "casting-director", "desc": "你的专属选角导演，一键为你挑选最合适的角色", "body": "## 一、审美准则\n\n### A. 长相定位\n\n**精致中式漫感**：主体一律写 `Chinese`（不写 East Asian，易偏韩）。骨相清晰、上镜化，中和一点写实感，不要过度漫画假感。\n\n### B. 皮肤（硬规则）\n\n写实但细腻干净。关键词：`smooth clean realistic skin with a refined natural finish, subtle fine texture and minimal barely-visible pores, looking real but polished like high-end editorial retouching, never plastic, never rough bumpy blemished`。不用 `lots of visible pores`（坑洼），也不用 `flawless glass-skin`（塑料）。目标：`smooth but natural`。\n\n### C. 反廉价四原则\n\n①写实肤质 ②柔性体积光（额头/鼻梁/颧骨高光+脸侧阴影）③暖调通透有subsurface透光感 ④细节真实不过度锐化。\n\n### D. 两条统领原则\n\n- 冷暖对比=高级感（冷调肤+暖调唇眼）\n- 去标签化=通用性（无logo、无强时代符号、配饰克制）\n\n### E. 纯白背景（最高硬规则）\n\n**所有资产背景必须纯白 #ffffff**，任何情况不例外。正向：`plain seamless pure white #ffffff studio background`。否定：`no grey, no off-white, no coloured or textured background`。\n\n### F. 五官（按性别分流）\n\n**最高脸型硬规则（全角色，反派也不例外）**：脸型骨相清晰利落、协调上镜，下颌线干净不松垮，不宽不方不肉，上下脸协调。**脸由「五官」+「整体气质」字段驱动，服装风格绝不介入脸（见第五节）**。\n\n通用锚定：\n\n- 女：`slim refined oval face with a clean sharp well-defined jawline, harmonious proportions, NOT wide, NOT square, NOT a heavy or sagging jaw`\n- 男：`long clean face with a sharp angular well-defined jawline, NOT wide, NOT round, NOT a soft sagging jaw`\n\n**女性五官**：偏窄长脸+平直微挑眉+长眼微上扬+卧蚕+高挺鼻+豆沙唇；妆：伪素颜上镜感（底妆发光+轻修容+卧蚕高光）。\n\n**男性五官**：长流畅脸+剑眉+深邃桃花眼+高挺鼻+暖红润唇+黑色碎发中分；三档气质参考（仅参考不是模板）：奶狗初恋/禁欲总裁/成熟熟男——同型角色务必分化，不套同一套五官表情。\n\n### G. 差异化引导（柔性，agent自判）\n\n- **多角色**：拉开脸型骨架/五官量感/气质，每人提炼1-2个专属记忆点写进CHARACTER段。\n- **单角色**：优先服从角色卡个性，不收敛成标准网红美人。\n- **素人**：允许非标准五官（圆脸/宽脸/塌鼻/单眼皮等），不套美人共性。\n- **铁律**：①差异化只作用于不同角色；同一角色多资产必须同脸（资产参考锁身份）。②角色卡指明相似关系时让位于角色卡，不硬掰两极。③不破坏单角色高审美底线。\n\n---\n\n## 二、核心翻译原则\n\n1. 主体写 `Chinese`\n2. 气质用状态化语言（白切黑→`hiding her sharpness`；深情隐忍→`a deep restrained gaze holding quiet emotion`）\n3. 脸型用对比+否定式卡死\n4. 保留电影术语（halation/anamorphic/bokeh/aegyo-sal不译）\n5. 皮肤永远写实（准则B），与漫感程度无关\n6. 去标签化+冷暖对比（准则D）\n\n---\n\n## 三、定脸生成\n\n一次图像生成能力调用。prompt拼接顺序：\n\n```\nCHARACTER: [年龄+Chinese+气质状态化+脸型(对比+否定式)+眉/眼/鼻/唇，按性别套准则F]\n\nSKIN (priority, refined realistic): [smooth clean realistic skin, refined natural finish, minimal barely-visible pores, polished like editorial retouching, never plastic+妆+发型]\n\nOUTFIT: [按第五节推理的完整造型，上衣绝不塞进下装，无logo，配饰克制]\n\n[COMPOSITION锁定块，原封不动]\n[RENDERING锁定块，原封不动]\n[SHARPNESS锁定块，原封不动]\n```\n\n```\n图像生成能力(prompt=\"...\", title=\"<角色名>定脸\", tag=\"character\")\n→ 返回资产归档标记（记下，供后续引用）\n```\n\n---\n\n## 四、锁定块（逐字复制禁止改动）\n\n### 身份引用语（垫图时放prompt开头，首次定脸不放）\n\n```\n以〈定脸资产归档标记〉作为该角色的身份参考，生成同一人物的全新图像，保持脸型骨相、下颌线、眼型、五官结构与参考完全一致。从头渲染一张全新图像，不得直接复制或粘贴参考图。\n```\n\n### COMPOSITION\n\n```\n构图（严格锁定，逐条执行，标准证件照美颜近景）：\n- 景别：头颈紧景特写。发顶紧贴画框顶边，头顶上方无留白。画框底边切于锁骨/上胸口。脸部高度约占画框垂直高度的55–60%。NOT拉远至显示肩膀、西装身段或半身。\n- 居中：头部水平居中，面部中线（鼻梁）与画框垂直中线精确对齐。脸在画框内垂直居中。\n- 发型裁切：头发自然垂落两侧，左右两侧发丝被画框边缘自然裁切——头发整体宽度超出画框，只露出内侧部分。\n- 朝向：完全正面视角，头部绝对水平，零偏转零旋转，双眼直视镜头，下颌微收，颈部完整可见至锁骨。\n- 表情：[按角色气质填写分化，不套同一种表情。清冷女：神情平静内敛，嘴唇轻合，不笑。治愈男：表情温和放松，嘴角带轻微自然微笑。]\n- 画幅：竖向3:4画幅，左右对称构图。\n```\n\n### RENDERING\n\n```\n渲染：纯净无缝纯白#ffffff背景。柔和电影感美颜布光，面部有自然的明暗塑形——额头、鼻梁、颧骨保留清晰高光，脸侧有柔和阴影，呈现三维立体体积感，NOT平光NOT均匀补光。皮肤温润通透，有丰富的subsurface透光感与自然肤色渐变，高端杂志级写实质感，竖向3:4画幅。\n```\n\n### SHARPNESS\n\n```\n清晰度：将整个头部渲染在同一个清晰焦平面内——脸部、眼睛、睫毛、耳朵、耳饰、发际线及所有发丝（包括头部两侧的头发）全部同等清晰、对焦准确、细节完整，从脸部正面到两侧发丝保持同等精细度。皮肤质感干净细腻，有自然肌理与极细微几乎不可见的毛孔，真实但经过高端修图级润色。头发与耳朵NOT模糊NOT虚焦NOT失焦。通过高分辨率与精细细节渲染实现均匀清晰，NOT靠压平光影或降低对比度来实现。始终保留柔和电影感光线、脸侧体积阴影与温润通透肤色。no浅景深效果，no模糊发丝，no平板均匀布光，no灰白发死的肤色，no粗糙坑洼皮肤，no重度放大毛孔，no过度磨皮塑料感。\n```\n\n> **禁用词**：prompt中严禁 `narrow aperture / large depth of field / no soft-focus / no bokeh on the face`——会触发全局平光、肤色发灰。全脸清晰只靠SHARPNESS块。\n\n---\n\n## 五、服装推理\n\n**三步推理**：①看「适用人物」定品类（霸总→商务正装；素人→精致休闲；古风→汉服；甜妹→清新明快）②看「整体气质」定调性（冷感→利落剪裁；治愈→柔软针织）③统一升档（高级/有质感/无logo/配色克制）。\n\n**硬规则**：\n\n- **服装风格绝不污染脸**：OUTFIT调性只作用于服装推理，绝不外溢到脸的骨相/五官/表情/肌肤。例外：角色卡在五官/气质字段直接写了脸的特征，或随服装配套的发型/头饰/妆容年代感（属造型层不在屏蔽范围）。\n- **上衣绝不塞进下装**：`untucked, worn loose over the waistband, never tucked into trousers or skirt`\n- **男性裤型默认**：直筒或微阔垂坠长裤、裤长盖脚面。`NOT tapered, NOT cropped, NOT skinny, ankles not exposed`。角色卡明确要求可破例。\n- 无logo、配饰克制（珍珠/银/钻/简约表等）。反派可穿穷酸破旧。\n\n**备选库**：清冷千金→象牙白西装+真丝内搭；霸总→硬挺黑/炭灰西装+白衬衫领口微开；治愈熟男→燕麦针织或浅灰休闲西装；甜妹→奶油色/淡彩针织；素人→质感纯色T/白衬衫；古风→立领或交领汉服；长辈→软肩西装/优雅针织。\n\n---\n\n## 六、身材气质校准（全身图核心）\n\n全身图必须按角色定位自动校准四变量：①头身比 ②身材量感 ③姿态气场 ④服装廓形。\n\n### 头身比（必须写成实句，不能只写数字）\n\n- **女性统一7头身**（禁止超8）：`natural well-balanced 7-heads-tall female proportion, the head about one seventh of the full body height`\n- **男主/古风男/素人男：8头身**：`well-proportioned 8-heads-tall figure`\n- **霸总/强势男：8.5–9头身**（仅此型）\n- **反派：不优化**：`realistic everyday body proportion, minimum 7 heads tall, NOT idealised or stretched, NOT a squashed compressed body, NOT an oversized head on a short stocky frame`（脸型骨相质量仍按准则F）\n- **儿童：3–4头身**：`cute chibi-leaning proportion, about 3 to 4 heads tall`\n\n**双向否定式（必写）**：`keep the specified head-to-body ratio strictly; NOT a large head on a short body, NOT an exaggerated 8.5-9 heads elongated frame unless a 霸总-type male lead. Shoulders natural width (female ~1.6 head-widths, male ~2 head-widths).`\n\n### 校准表\n\n角色型身材量感姿态气场服装廓形**霸总/强势男**tall slender 8.5-9 heads, long lean torso, long legs, low relaxed shoulder, lean NOT muscularcool languid editorial, weight on one leg, shoulders dropped, aloof gaze, one hand in pocketoversized dropped-shoulder suit, wide-leg trousers, NOT slim fitted**治愈/温润男**tall steady, naturally broad shoulders, healthy solidupright relaxed, warm easysoft knit/blazer, straight full-length trousers**高级素人男**natural healthy fitrelaxed naturalquality casual, straight full-length trousers**千金/清冷女**slim slender elegant, delicate uprightpoised cool composed, aloofminimalist sharp tailoring**甜妹/少女**petite slim youthfulsweet relaxed lightfresh light layered**高级素人女**natural healthy slimrelaxed naturalquality casual basics**古风男/女**upright dignified / slender gracefulserene classical poisehanfu robe, flowing**长辈男/父**mature slight fullness, solidcalm dignifiedrefined sober blazer, straight trousers**长辈女/母**mature graceful, slight softnesscalm gentle uprightelegant knit/blouse**反派男**per card, realistic NOT idealisedslack or stiff, petty mean airdated/cheap/shabby**反派女**per card, realisticsour stiff or slackgarish/shabby**儿童**chubby soft 3-4 headplayful childlikecute kidswear\n\n**霸总气场三要素（仅男主/霸总，绝不套女性）**：①大廓形服装（oversize落肩西装）②拉长比例（8.5-9头身）③慵懒疏离姿态（重心偏一侧/微slouch/aloof gaze/单手插兜）。女性统一7头身，不拉长。\n\n**男主身材原则**：气场来自骨相+眼神+疏离姿态，不是肌肉。默认清瘦挺拔有骨相，不做健硕猛男（除非角色卡明确要求）。\n\n---\n\n## 七、全身立绘（一步法）\n\n> 前置条件：定脸已通过确认门。\n\n一次图像生成能力，资产参考传入定脸资产归档标记，prompt开头写`〈定脸资产归档标记〉`锁脸，画幅`aspect_ratio: \"3:4\"`。\n\n```\n图像生成能力(\n  prompt=\"Using〈定脸资产归档标记〉for face identity，同一人的全身站姿立绘，<头身比实句+身材量感+姿态气场+服装廓形（第六节）>，双向比例否定式，vertical 3:4 full-body portrait, head-to-toe inside frame, centered, plain seamless pure white #ffffff background，<SKIN/SHARPNESS锁定块>\",\n  title=\"<角色名>全身立绘\", tag=\"character\", aspect_ratio=\"3:4\",\n  资产参考=[\"<定脸资产归档标记>\"]\n)\n```\n\n比例压不住退两步法：先单独生比例正确的全身模板资产节点，再连同定脸节点垫图重出。\n\n---\n\n## 八、人物三视图（可选）\n\n16:9分屏：左半=全身三视图（正面/侧面/背面），右半=面部特写。同时垫定脸+全身两个资产归档标记。\n\n```\n图像生成能力(\n  prompt=\"16:9 split-screen character board。使用〈定脸资产归档标记〉锁面部身份、〈全身资产归档标记〉锁身材/服装/比例。左半屏三张等大全身图并排—front/full profile/back，standard upright model stance；右半屏单张正面大脸特写。same one person, identity consistent, identical face hairstyle outfit skin tone, plain seamless pure white #ffffff background.\",\n  title=\"<角色名>人物三视图\", tag=\"character\",\n  资产参考=[\"<定脸资产归档标记>\",\"<全身定稿资产归档标记>\"]\n)\n```\n\n> 能力边界项，可能需多跑或退分块方案（左右各自单独出再拼）。\n\n---\n\n## 九、表情九宫格（可选）\n\n3×3九表情，画幅`aspect_ratio: \"3:4\"`，垫定脸资产归档标记。\n\n**默认表情顺序**：面无表情/喜(抿嘴微笑)/怒/哀/乐(露齿)/悲(含泪)/震惊/愤怒/迷茫。\n\n**关键规则**：近义表情做强度区分；头全部摆正（不歪头）；每格居中不切顶；防大小眼；一致性约束（same one person）；加深景深。\n\n```\n图像生成能力(\n  prompt=\"使用〈定脸资产归档标记〉作为身份参考，same person in every panel, identical face hairstyle skin tone across all panels。九宫格：3x3 grid，每格只有表情不同：<九表情顺序>。头摆正/居中不切顶/防大小眼/近义表情强度区分/一致性/深景深。vertical 3:4 format, 3x3 grid evenly fills canvas. plain seamless pure white #ffffff background.\",\n  title=\"<角色名>表情九宫格\", tag=\"character\", aspect_ratio=\"3:4\",\n  资产参考=[\"<定脸资产归档标记>\"]\n)\n```\n\n> 能力边界项，脸飘时降级：分两次各出部分表情，或单表情逐张生成再拼。\n\n---\n\n## 十、补丁块（按需追加）\n\n### 补丁A · 纯白底+发丝边缘\n\n```\nBACKGROUND (strict pure white with clean hair edges): completely clean seamless pure solid white #ffffff backdrop, no gradient, no grey, no off-white. Subject cleanly separated from background with sharp clean edges. Hair, hairline and outer strands must have clean sharp well-defined edges — NO wispy strands fading into background, NO semi-transparent hair edges, NO grey halo, NO foggy fringe. Keep natural volumetric light on face.\n```\n\n### 补丁B · 皮肤平整（仅皮肤发糙时救急，必须配C一起用）\n\n```\nSKIN (smooth and even): clean smooth even-toned skin, minimal barely-visible pores, no rough bumpy surface, no visible blemishes, no enlarged pores — premium editorial skin, still looking real NOT plastic NOT waxy. Keep natural skin tone and soft volumetric light.\n```\n\n### 补丁C · 皮肤真实肌理（配B用或单用救\"皮肤太平\"）\n\n```\nSKIN (refined but real): clean translucent skin keeping real natural texture — fine subtle pores, soft surface micro-detail, healthy natural sheen, looking like genuine high-end-retouched real skin, NOT flat smoothed waxy plastic, NOT over-airbrushed poreless. Skin reads as real human skin, clean and free of blemishes but not perfectly smooth.\n```\n\n---\n\n## 十一、3D漫剧质感补丁（「漫剧」触发，与真人完全隔离）\n\n触发词：「漫剧」「3D漫剧」「3D角色」「三维」「CG」「三渲二」——「漫剧」单独出现即触发。未触发一律真人写实，本节全部忽略。\n\n**铁律**：①整段替换，绝不把真人质感词和3D质感词混写同一条prompt。②只覆盖质感层，结构层（构图/纯白底/头身比/确认门/资产参考）照常适用。③真人prompt绝不出现3D词。\n\n### 11.1 3D质感目标\n\n- **画风定性**：`high-end 3D CG character render, cinematic game-quality rendering, realistic-stylised 3D in the style of high-budget game cinematics or animated feature films, clearly a rendered CG character not a photograph, not flat 2D anime, not cartoonish`\n- **皮肤-女性**：`semi-realistic 3D CG skin, between photorealistic and stylised — smooth clean surface with subtle subsurface scattering warmth, soft natural skin luminance, very fine barely-visible micro-texture and pores (present but refined, not raw), rendered skin that reads as beautiful and slightly elevated beyond real but clearly not a photograph — NOT flat poreless cartoon skin, NOT fully photoreal human skin, NOT wax or plastic finish, NOT milky white 2D-anime complexion, NOT flawless glass-skin with zero texture`\n- **皮肤-男性**：`semi-realistic 3D CG skin with natural micro-detail, visible fine pores and subtle surface texture, warm subsurface scattering, rendered quality clearly above photographic — slightly elevated and refined but grounded in realism, NOT flat cartoon skin, NOT fully photoreal`\n- **头发**：`3D-modelled hair with clean defined strands, soft specular sheen and structured flow, clearly CG-rendered, NOT photoreal flyaway hair, NOT flat 2D hair`\n- **眼睛**：`luminous CG eyes with crisp catchlights, clear layered iris depth, slightly enhanced beyond real, clearly rendered not photographic`\n- **光影/背景**：`clean three-dimensional CG studio lighting, clear volumetric light-and-shadow modelling, plain seamless pure white #ffffff background`\n\n**3D质感校准线（介于真人与漫画之间）**：目标质感参考——影视级游戏CG（如《黑神话》《原神》高精度渲染档位），皮肤有微细节但比真人更干净精致，有subsurface但不是透明瓷感，明显是渲染而非照片。**必须远离**：①纯白无瑕零质感的二次元瓷肌（太漫画）②真实毛孔坑洼的写真质感（太真人）③蜡像/塑料感（过度磨皮）。\n\n### 11.2 覆盖表（启用3D时）\n\n真人原段3D替换为RENDERING里photorealistic词`high-end 3D CG character render, cinematic game-cinematic quality, clearly a rendered CG character not a photograph`SKIN段写实肤质词按性别取11.1皮肤词（女性含NOT否定式必须完整写入）SHARPNESS里realistic skin一句换对应性别3D皮肤句，其余清晰度内容保留准则E的85
