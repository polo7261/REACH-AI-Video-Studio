⏸ **故事板确认暂停**:展示整体情节流程、变身步骤与分镜,确认后方可大规模生成。\n4. **关键元素资产生成**(`generate_image_v3`,ImageToImage 保双层形态与跨镜一致)。**觉醒形态资产检查点(季终适用)**:故事板含 Season Finale Climax 节拍则**必须**在此完成\"觉醒形态\"key_element 设定图生成与 asset_id 注册绑定,进第 5 阶段前验证就绪、未就绪暂停确认视觉方案。⏸ **元素设计确认暂停**:日常与变身状态参考图生成后暂停获反馈、确保 90s 美学还原度。\n5. **视频镜头与音频层批量生成**(`generate_video_v3`,MultiModalToVideo 默认绑角色/场景 key_element,有台词/音色一致需求绑 key_element_audio;`generate_audio` 出 BGM/变身 SFX/长旁白 VO)。\n6. **时间轴剪辑与渲染导出**(`composite_video`):经典星光转场+高对比度节奏对齐,导出。\n\n## media 生成策略(要点)\n\n- **图像/元素资产**:`generate_image_v3`(Nano Banana Pro / GPT Image 2,2K,对文字/多子图排版/手绘细节还原出色);角色设定图**横向排版**:左边精致面部肖像(大眼睛/星光瞳孔/发型),右边全身形态(服装+标志配饰),背景统一简洁单色梦幻渐变粉。\n- **视频镜头**:`generate_video_v3`(Seedance 2.0 / Fast,720p 默认,会员可 1080p);单角色镜头精确引对应 key_element 设定图、有台词/情绪呐喊绑 key_element_audio、可加前一镜 reference_video;**群像镜头**:宽景同时传所有在场角色 key_element 作多图引用并用 `<<<image_1>>>…` 逐一对应,F-1~F-4 每 shot 只引该 shot 聚焦角色 key_element(F-3/F-4 汇聚镜可同引所有角色保色彩一致),**多角色台词分散不同 shot 生成、禁同镜同时触发多角色语音**避免音色混叠。\n- **声音音乐**:BGM `generate_audio`(text_to_instrumental,Suno 5,`\"90s magical girl anime theme, nostalgic synthpop, orchestral sparkles, fast tempo, upbeat melody\"`);台词配音 `generate_audio`(text to narration,MiniMax Speech 2.8 HD / ElevenLabs v3,高昂/纯真/热血/情感丰富少女音色)。\n- **觉醒形态设定图**(SF-3c 前完成):**强制 ImageToImage**(Nano Banana Pro,2K),**不得 TextToImage**(须在标准变身形态图基础上升华衍生保视觉一脉相承)。参考图组合(按优先级):①主参考(必须)该角色标准变身形态设定图作战衣基底;②升华特征参考(必须,若有)光之翼/觉醒发色/升华头冠外部参考图;③伙伴色彩参考(可选)其他角色设定图仅引导棱镜散射色彩范围。提示词重点:明确\"在标准战衣上叠加光之翼/纹样/升华头冠\"而非替换(用 overlay/emerge over/add luminous layer upon),按觉醒 key_element 字段逐一写入升华配饰细节/专属色彩方案,横向双版排版(左觉醒面部肖像 重点升华瞳色发色/右完整全身 光之翼展开+纹样+武器升华);常驻负向 `no dark Color Identity elements, no villain motifs, no standard form only (must show awakened layers), no realistic textures, no modern VFX`。生成后立即注册独立 asset_id(不与标准变身共用)绑至\"觉醒形态 key_element\"槽位(未建则先 `storyboard_designer` 补条目),Final_Video_Spec 记录 asset_id 与首次引用镜头 ID(SF-3c);**生成时序**须在 SF-3c 视频生成前完成、Planner 批量生成前验证就绪、未就绪暂停确认。\n- **OP/ED 生成**:人声版 `generate_audio`(lyrics_to_song,Suno 5,**提示词禁出现知名艺术家姓名**规避生成失败),OP 方向 `\"90s Japanese magical girl anime opening theme, upbeat idol-pop, soaring chorus, orchestral intro fanfare, synthesizer lead, dreamy female vocal, energetic and emotional\"`、ED 方向 `\"90s Japanese magical girl anime ending theme, soft ballad, warm acoustic guitar and piano, gentle female vocal, bittersweet and hopeful, friendship theme, city-pop influenced\"`;纯器乐版 `text_to_instrumental`(Suno 5/Mureka 8,补 `\"no vocals, instrumental only\"`);时长对齐 OP 约 90s、ED 约 60–90s,指明段落结构(前奏→主歌→副歌→间奏→副歌→结尾);生成后注册 asset_id 绑到对应 OP/ED audio_layer。\n\n## 提示词与装配\n\n- **图像/视频提示词规范 + 九大序列英文模板(变身 A–E / ET-1~6 / 群像 F / 情感 E-1~4 / 对峙 C-1~6 / 反派 V-1~3 / 净化 P-1~4 / 觉醒 SF-3a~3d / 战斗 B-1~4 / 日常 DL-1~5)** 见 `references/prompt-library.md`。\n- **装配规范 + 帧级卡点表 4.1~4.8 + Seedance 内嵌音频保留规则 + 日常集剪辑节奏 + SF-2d 牺牲消散叠加层 + OP/ED 装配** 见 `references/editing-and-audio.md`。\n\n## 配合(query 可同时加载)\n\n无源生依赖(源内各 actor 均为内部阶段,本 skill 完全自足;OP/ED 属本 skill 自带块 storyboard 音轨规划+media 生成策略,**不外包给 anime-op-ed**——两处不同源不同粒度各自保留)。\n\n边界(勿用本 skill,改道):独立日漫 OP/ED 单品 → anime-op-ed;通用 2D 动画 → cartoon-flow;其他动画风格 → ghibli-anime-style / needle-felt-animation / ink-wuxia-animation;偶像 MV → idol-mv。", "extras": [], "cn": "星光变身魔法少女动画"}, {"slug": "micro-expression-analyst", "desc": "告别瘫脸尬演，精准拿捏微表情", "body": "```markdown\n---\nname: micro-expression-control\nnamespace: libtv-industry\ntitle: \"微表情与情绪表演精控\"\ndescription: \"对演员/角色的面部表情、微表情、情绪转换做精细控制时用——中文情绪→微表情动作库(悲伤/震惊/隐忍哭泣/愤怒克制/悔恨/愧疚/羞耻/羞怯/爱意克制/嫉妒/失望/释然等)、长镜头单表情演化时间线模板、微表情时间锚定分档、情绪混合/潜台词泄露写法、FACS/AU 编码进阶精控层、真笑假笑判定、眼神/镜头表演语汇、跨镜情绪连续性、与对口型/lip-sync 的分工协同、克制表演自检。区别于 cinematic-motion-realism（全身运动写实）与 talking-head-director（脚本/口播节奏）——本 skill 专攻脸。用于 generate_video_v3 的视觉内容字段。\"\nversion: 4\n---\n\n# micro-expression-control\n\n要精细控制角色**表情、微表情、情绪转换**时用本 skill 写 `generate_video_v3` 的视觉内容描述。**核心原则与 cinematic-motion-realism 一致但更专：情绪不能靠抽象词表达，只能靠可执行的面部/身体动作表达。** 模型不懂\"感人\"\"心碎\"\"喜悦\"，只懂\"眼角下垂\"\"嘴角单侧抽动\"\"睫毛颤抖\"。\n\n## 边界（何时用本 skill vs 相关 skill）\n\n- 全身姿态/环境力/整体写实 → cinematic-motion-realism（其\"情绪克制\"支柱是本 skill 的精简版，本 skill 是展开专项）。\n- Seedance 分镜叙事整体方案 → seedance-cinematic-drama（其\"生理细节硬门槛\"引用本 skill 的映射表）。\n- 口播脚本节奏/台词/teleprompter → talking-head-director；**本 skill 只管台词说出口时脸上发生什么，不管写什么台词**。\n- 多镜同一张脸不漂移 → character-consistency；**本 skill 管表情本身，不管脸型/五官一致性**；但本 skill 的\"表情锚点集\"（见下）是对该 skill 姿态变化集的扩展。\n\n## 两层写法：中文动作库（默认主用） vs FACS/AU 编码（进阶精控）\n\n| 层 | 怎么写 | 何时用 |\n|---|---|---|\n| **中文情绪→动作库**（默认，直接可用） | 用本 skill 下方按情绪归类的中文微表情短句，直接拼进叙事 prompt | 绝大多数场景的默认选择——地道、可直接理解、不依赖引擎认不认编码 |\n| **FACS/AU 编码**（进阶，社区实测有效但非官方承诺） | 把动作单元编号写进 prompt，如 `AU12+AU6`，用于需要精确排多个节拍或中文描述总被忽略某细节时 | 独白多节拍排程、跨模型/跨引擎迁移需要一套通用编号体系时 |\n\n两层不互斥，可以同一账号内 A/B 测试哪种在 `generate_video_v3` 上命中率更高。**日常写 prompt 优先用中文动作库，FACS/AU 是备用武器，不是必须。**\n\n## 情绪→微表情动作库（核心，按情绪归类）\n\n每条是可直接拼进 prompt 的中文短句范式，不是要全部塞进一镜——**一镜按下面\"克制自检\"控制在 1–2 个关键动作**，下面每个情绪列出的多条是同义/递进选项，按场景挑，不是全写。\n\n| 情绪 | 关键动作（挑 1–2 个） | 范例短句 |\n|---|---|---|\n| 悲伤/隐忍哭泣 | 眼神先失焦、下眼睑轻颤、嘴唇抿住、呼吸变浅、泪水悬在下睫毛不落 | 「眼神先失焦，随后下眼睑细微颤动；嘴唇慢慢抿住，呼吸变浅，泪水悬在下睫毛处却迟迟不落」 |\n| 强忍哭泣（不出声） | 迅速低头、嘴唇死死抿住、喉结艰难滚动、鼻息破碎颤抖、不出哭声 | 「他迅速低下头，嘴唇死死抿住，喉结艰难滚动一次，鼻息破碎地颤了一下，却没有发出哭声」 |\n| 震惊/情绪冻结 | 呼吸骤停、眼睛微睁后僵住、瞳孔轻微扩散、手停在半空 | 「她的呼吸骤然停住，手停在半空，眼睛微微睁大后彻底僵住，瞳孔轻微扩散」 |\n| 愤怒/压抑 | 目光静下来变锐利、眨眼变少、下颌线绷紧、鼻翼轻扩、手指无声扣紧物体 | 「他的目光突然静下来，眨眼变少，下颌线绷紧，鼻翼轻轻扩张，手指无声扣紧杯沿」 |\n| 悔恨 | 视线避开对方又移开、眉心向内收紧、话到嘴边说不出、伸出的手停在半空 | 「他看向对方又迅速移开视线，眉心向内收紧，嘴唇张开却说不出话，伸出的手停在半空」 |\n| 愧疚 | 视线向下躲、眨眼变慢、嘴角不对称绷住、肩膀轻缩 | 「她的视线向下躲开，眨眼变慢，嘴角不对称地绷住，肩膀轻轻缩回」 |\n| 羞耻 | 头低下比视线更多、耳根脖颈泛红、嘴唇收成小线、身体微微转开 | 「她低下头，眼睛不敢停在对方脸上，耳根和脖颈慢慢泛红，嘴唇收紧成很小的线」 |\n| 羞怯/心动 | 视线抬起又躲开、睫毛轻颤、笑意压不住漏出、手指无意识捏东西 | 「她怯怯抬眼看了一瞬又移开，睫毛轻颤，嘴角压不住地漏出一点笑意，手指无意识捏住袖口」 |\n| 爱意克制 | 眼神先软下来、目光多停半秒、笑意快抬起又压住、伸手停在将触碰前 | 「他的眼神先软下来，目光在她脸上多停了半秒，嘴角几乎要抬起又被压住，伸出的手停在距离她很近的位置」 |\n| 嫉妒 | 先看向\"第三者\"、嘴角收紧、笑意薄而迟、视线转回时带锋利 | 「她先看向那只搭在对方手臂上的手，嘴角轻轻收紧，随后才抬眼看他，笑意很薄，眼神却变得锋利」 |\n| 失望 | 目光慢垂（不是骤垂）、鼻息轻泄、嘴角疲惫落下、不再追问 | 「她的目光慢慢垂下，鼻息很轻地泄出一口气，嘴角疲惫地落下，眼神不再追问」 |\n| 释然 | 长长呼气、下颌与眉头松开、眼眶湿润但平静、肩膀微沉、笑容在张力散去后才出现 | 「她长长地舒了一口气，紧绷的肩膀完全放松下来，脸上浮起淡淡的微笑，抬头望向远方」 |\n| 疲惫 | 揉太阳穴、靠墙、眼皮下沉、长呼气、动作迟缓 | 「他靠在墙上，长长呼出一口气，眼皮沉沉地垂下」 |\n| 专注 | 眉头微皱、眼神锁定一点、嘴唇抿紧、身体前倾 | 「她眉头微皱，眼神锁定屏幕一点，嘴唇抿紧，身体不自觉前倾」 |\n| 犹豫 | 张嘴又闭、视线游移、手悬在半空、脚下踱步 | 「他张嘴又闭上，视线游移不定，手悬在半空迟迟没有落下」 |\n| 惊喜 | 眼睛瞬间睁大、嘴张成O形、双手捂嘴、笑容缓慢绽放（不是瞬间） | 「她的眼睛瞬间睁大，嘴巴微张成O形，双手下意识捂住嘴，笑容缓慢地在脸上绽放开」 |\n\n> 每条范例都符合\"具体动作而非情绪形容词\"的硬要求——出现\"她很难过\"\"他非常生气\"这类词，直接对照上表换成动作短句。\n\n## 长镜头单表情演化时间线（表演是内容本身时用）\n\n当整镜的内容就是\"一张脸的表演\"（独白、静默特写、情绪转折的高潮镜），别写成一句静态描述，改用**分时间段的演化模板**，让表情自然过渡而不是突然跳变：\n```\n\n0–2s：\\[起始状态，通常是平静或未察觉\\] 2–4s：\\[情绪开始的最初信号，极轻微\\] 4–6s：\\[情绪明显但仍克制，加 1–2 个细节\\] 6–8s：\\[情绪稳定在某个状态，可加一个身体反应如泪痕/呼吸\\]\n\n```\n\n范例（隐忍难过）：「0-2s：人物保持平静的表情，眼神轻轻低垂，嘴唇自然放松。2-4s：情绪开始轻微变化，嘴唇慢慢轻轻抿住，嘴角开始一点点下压，眼神变得失落。4-6s：难过逐渐明显但仍然克制，眉头轻轻皱起，眼神带着委屈和隐忍，眼眶微微湿润。6-8s：人物稳定在隐忍难过的表情中，脸颊出现一两滴细小自然的泪痕，没有大哭，没有抽泣，情绪安静克制。」全程要求**自然过渡、没有突然变化、没有夸张哭泣**——这是本模板的核心约束，比具体用哪几个动作更重要。\n\n同一结构可换情绪骨架复用：震惊定格（放松脸→笑容停住→眼神失焦→呼吸停→下颌锁住）；愧疚（视线躲→眨眼变慢→嘴角收紧→眉心内折→低头）；压抑的愤怒（目光静→鼻翼扇动→下颌绷紧→手指收紧→眼睛湿润但不眨）。**用这个镜头时保持运镜极简**：固定或极慢推，浅景深，别在表情特写里加复杂运镜或多余肢体动作分散焦点。\n\n## 微表情的时间尺度（不同颗粒度对应不同写法，别混用）\n\n- **一闪而过的泄露（0.25–0.5秒）**：鼻息、下颌绷紧、眼神一瞥、笑容抽动——用于\"话没说但脸先说了\"的瞬间信号，写\"极快闪过随即恢复/被盖住\"。\n- **可读的过渡动作（0.5–1秒）**：视线改变、眨眼停顿、泪水成形、嘴角收紧——正常一次情绪转折的过渡颗粒度。\n- **完整情绪转换（1–1.5秒）**：一个表情彻底换成另一个，如笑容彻底褪去、强装镇定崩塌。\n- **复合式表情叠变（1.5–2秒）**：两层情绪的转换，如温情变算计、微笑变阴冷——需要给够时间让\"面具切换\"这件事本身被看清。\n\n**始终保持自然过渡，不要突然的表情跳跃，除非剧情就是要\"猛然变脸\"这个冲击点本身。**\n\n## 情绪混合与潜台词泄露（比单一情绪更高级的写法）\n\n真正有戏剧张力的表演往往不是单一情绪，而是**两种情绪在同一张脸上同时存在、互相打架**——嘴在演一种情绪，眼睛在泄露另一种，或身体姿态在反驳台词的字面意思。写法：把两种情绪各自的动作都列出来，让\"矛盾\"本身成为要传达的内容，不要试图把它们调和成一个\"中间情绪\"：\n\n- **强撑的温暖**：嘴角上扬带笑意 + 眼周绷紧、瞳孔不放松（恐惧/紧张的动作）同时出现——观众读出\"这个笑是撑出来的\"。\n- **口是心非的软拒绝**：台词是拒绝的话，但视线躲开又偷偷看回、身体没有真的后退、笑意压在嘴角泄出——整体传达\"嘴上拒绝、心里已经软了\"，不是真正的反感。**这类反差表演强度建议控制在克制区间（十分打三分左右），避免读成真的抗拒/恐惧。**\n- **审视变冷冷了然**：笑意从眼底一点点抽走，眼神变阴，嘴角原本上扬的弧度慢慢拉平甚至反向——本性从和善表演里\"剥离\"出来的效果，别一步到位，要给\"抽走\"这个过程时间。\n\n这是\"真笑假笑判定\"（下一节）的进阶版：不是先一种情绪后另一种，而是**两种情绪同时叠在一张脸上，或一层表情下慢慢露出另一层**。适合表现\"言不由衷\"\"死撑\"\"图谋不轨的伪装\"类潜台词场景。\n\n## 真笑 vs 假笑：判定示范（可套用到其他情绪）\n\n真笑必然带眼周参与（脸颊被笑意托起、眼角浮现细纹）；只有嘴角上扬、眼周不动 = 礼貌笑/敷衍笑/假笑。眼周肌肉几乎无法被意识控制，这是判定\"演得真不真\"最硬的一条线，也是所有其他情绪判定的示范模板——**任何情绪都要问：眼睛有没有参与，不只是嘴或眉毛在动。** 只写嘴部动作的表情，是 AI 生成里最常见的\"假脸感\"来源。\n\n## FACS/AU 编码（进阶精控层，独白多节拍/需要编号体系时用）\n\n想更精确地按\"肌肉单元\"排多节拍表情，或中文描述总被引擎忽略某个细节时，换成 FACS（面部动作编码系统）的 AU 编号。AU 对应哪块肌肉是稳定科学事实；但\"把编号直接写进 prompt 文本能生效\"是社区实测结论，非引擎官方承诺，不要向用户保证\"写了编号就精确\"。\n\n| 情绪 | 核心 AU 组合 |\n|---|---|\n| 真心笑（Duchenne） | AU6（脸颊提升）+ AU12（嘴角上提） |\n| 礼貌假笑 | 仅 AU12，无 AU6 |\n| 悲伤 | AU1（内眉上扬）+ AU4（眉头压低）+ AU15（嘴角下压） |\n| 愤怒 | AU4+AU5+AU7+AU23（眉压低+眼睑收紧+嘴唇收紧） |\n| 惊讶 | AU1+AU2+AU5+AU26（双眉上扬+眼睑全开+下颌松落） |\n| 恐惧 | AU1+AU2+AU4+AU5+AU7+AU20 | \n| 厌恶 | AU9+AU15+AU16（鼻梁皱+嘴角下压+下唇后压） |\n| 轻蔑（唯一单侧通用表情） | AU12+AU14，仅单侧——双侧对称就不是轻蔑 |\n\n独白多节拍排程结构（一镜最多 3–4 拍，拍数越多单拍精度越差）：\n```\n\n拍1（0–Xs）：\\[AU组合或中文动作\\] ——（可选）配合台词\"...\" 拍2（X–Ys）：\\[AU组合或中文动作\\] 拍3（Y–Zs）：\\[AU组合或中文动作\\]\n\n```\n节拍时间加总须等于本镜总时长；这是**同一镜内的表情变化，不是分镜切镜**，运镜保持单一动作，否则引擎会把节拍表当成多镜头理解。\n\n## 眼神语汇（表演信号强度最高，单独抓）\n\n- **注视方向即叙事**：直视镜头=坦白/挑战；视线略低于镜头=脆弱/回避；视线越过镜头看向画外=分心/回忆。写清楚看向哪，不写\"深情地看\"。\n- **眨眼频率**：正常对话节奏 3–4 秒一次；紧张/说谎/情绪波动时频率加快或骤降（如愤怒克制时反而\"眨眼变少\"）；极度平静或专注时可长时间不眨。\n- **躲开又看回是最常用的信号组合**：写\"视线躲开半秒又偷偷看回去\"比\"眼神游移\"具体得多，适用于羞怯、嫉妒、口是心非等大量场景。\n- **对镜头说话的专项技巧**（数字人/口播场景，衔接 talking-head-director）：真人演员对镜头常用\"视线锁定耳垂到镜头的连线\"防止游移，同时用余光扫过镜头制造\"虚拟对视感\"；写 prompt 可直接借这个具体动作，比\"看着镜头\"更可控。\n\n## 跨镜情绪连续性 + 表情锚点集（扩展 character-consistency）\n\n同一角色连续几镜的情绪必须有前因后果，不能镜与镜之间情绪突变：**上一镜的表情\"余量\"要在下一镜开头被承接**（如上一镜结尾是\"眼眶微红未落泪\"，下一镜开头就该是\"仍带着未散的红眼眶\"而非重置为平静脸）。\n\n**表情锚点集**：character-consistency 的\"姿态变化集\"默认只变角度/姿态，同一角色若要在多镜里**精确复现某几个特定表情**（不是自然情绪流），可额外生成一组\"表情锚点图\"——用同一角色锚点，只变表情（如\"中性放松\"\"自然微笑\"\"专注严肃\"，或从本 skill 动作库挑 3–6 个场景要用到的表情），后续镜头引用对应那张锚点图。只在需要反复精确复现同几个特定表情（虚拟主播固定表情包、反复出现的\"标志性苦笑\"）时才值得做，一次性/自然流动的情绪不需要。\n\n跨镜同一张脸的技术实现（不漂移）走 character-consistency 的锚点机制；本 skill 只管情绪衔接/复现是否到位。\n\n## 与对口型/lip-sync 的分工协同\n\n台词情绪基调必须和脸上的微表情匹配，否则会出现\"嘴在笑、眼睛在演别的情绪\"的割裂感（除非这正是\"情绪混合\"想要的效果）。**分工原则**：台词配音/lip-sync 驱动嘴唇/下颌随音素开合，本 skill 的表情描述应**优先落在眉毛/眼周/脸颊**这些不直接参与发音的肌肉上，不要抢同一块肌肉——确实要控制嘴部的表情性动作（如说话时嘴角始终带压抑的笑意），当成\"叠加在发音之上的表情层\"来写，不是替代口型。\n\n镜头场景下的对话演员真实做法是：把注意力集中在台词的**潜台词**上而不是字面表情——先确定角色真正想要什么/在隐藏什么，微表情从潜台词反推，而不是从台词字面情绪直接映射（这正是\"情绪混合\"一节的应用场景）。\n\n## Prompt 落地公式\n```\n\n\\[起始/基础状态\\] + \\[触发或原因，一句\\] + \\[1–2个关键微表情动作，从动作库挑\\] + \\[眼神方向与动作\\] + \\[身体呼吸类反应，如有\\] + \\[克制程度提示：如\"不落泪\"\"不咬牙\"\"动作幅度极小\"\\]\n\n```\n整句写进 `generate_video_v3` 视觉内容字段里角色动作/表情的部分；与身体动作、环境力的描述（cinematic-motion-realism）拼在同一句叙事流里，不单独割裂成\"表情：xxx\"标签式写法。表演是内容本身的长镜头改用上面的分时间段演化模板；独白多节拍改用 FACS/AU 排程结构。\n\n## 克制自检（表演过度 vs 到位）\n\n- 一镜只放 1–2 个关键动作，超过就是堆砌，会显得\"用力过猛\"。\n- 多节拍独白最多 3–4 拍，拍数越多单拍精度越差。\n- 双侧脸完全对称的表情（除了纯惊讶一瞬）大多不真实——允许写\"单侧\"\"略偏\"；轻蔑本身就该是单侧的。\n- 动作和触发之间要有延迟（0.3–1秒），零延迟的\"听到就立刻切换表情\"最像 AI 感；情绪要**自然过渡**，禁止突然跳变（除非剧情就是要\"猛然变脸\"的冲击）。\n- 眼睛必须参与情绪，只有嘴部在动的表情是最常见的失败模式。\n- 舞台式的夸张（大开大合、拉满全脸）是给剧场观众远距离看的，镜头前的表演要往回收——**镜头能看到剧场观众看不到的细节，所以镜头前用更小的动作就够**。\n\n## 故障排查\n\n| 症状 | 病因 | 修 |\n|---|---|---|\n| 数字人像蜡像/瘫脸 | 只写了台词没写表情 | 补至少 1 个基础状态动作，哪怕是\"平静专注\" |\n| 表情夸张失真/像默剧 | 用了\"狂笑\"\"痛哭\"\"怒目而视\"类夸张动词 | 换成动作库里的克制动作 |\n| 假笑感/塑料感 | 只写了嘴部动作 | 补一句眼周动作，参照真笑假笑判定 |\n| 长镜头表情演化很糊/看不出变化 | 整段只写了一句静态描述 | 改用分时间段演化模板，4 个时间段递进 |\n| 独白里表情该变但没变 | 没分节拍，整段一句糊过去 | 改用 FACS/AU 或中文动作库的分节拍排程，≤4拍 |\n| 中文描述总被引擎忽略某个细节 | 该细节在自然语言里权重太低 | 换成 FACS/AU 编码重试，同一账号 A/B 对比 |\n| 情绪转折太突兀 | 两个表情间无过渡段 | 补过渡动作，参照\"微表情的时间尺度\"选对应颗粒度 |\n| 眼神空洞/无神 | 只描述了嘴部/眉毛 | 单独补一句眼神语汇 |\n| 对镜头说话时眼神游移 | 没给视线锁定的具体动作 | 用\"锁在耳垂-镜头连线\"式具体描述替代\"看着镜头\" |\n| 说话时表情和口型互相打架 | 表情描述抢了嘴部/下颌肌肉，和lip-sync冲突 | 把表情描述移到眉眼脸颊，嘴部交给对口型驱动 |\n| 表情与台词情绪不匹配（非故意） | 直接从台词字面映射表情 | 先想潜台词再定表情 |\n| 多镜情绪像被重置 | 每镜独立写情绪没接上一镜余量 | 承接上一镜结尾状态作本镜开头 |\n| \"泄露情绪\"效果看不出来 | 把一闪而过的信号写成了完整表情 | 改成 0.25–0.5秒量级的极快闪过 |\n| 需要反复精确复现同一表情但总是漂 | 只有角色身份锚点，没有表情锚点 | 补建\"表情锚点集\" |\n\n## 相关\n\n全身运动写实 → cinematic-motion-realism；Seedance 分镜整体方案 → seedance-cinematic-drama；口播脚本/台词节奏 → talking-head-director；跨镜同一张脸不漂移/表情锚点集 → character-consistency；运镜语汇/时间锚定手法 → cinematic-motion-language。\n\n> 中文情绪动作库与长镜头演化模板改写自直接 GitHub 检索命中的社区方案（CyberJ0605/cinematic-video-prompt-engineer-skill，54★，MIT，含实测 demo 视频）；FACS/AU 编码层改写自另一社区方案（OSideMedia/higgsfield-ai-prompt-skill 的 higgsfield-facs 子技能，191★，MIT）。两者均按本环境 generate_video_v3 的实际字段结构改写；星数仅反映我搜索当时的快照，不代表两方案孰优孰劣——前者中文动作更地道、后者编号体系更适合精确排程，是互补不是替代。\n```", "extras": [], "cn": "微表情情绪精控"}, {"slug": "narrative-tvc-creator", "desc": "&gt;\\\\ 创作剧情化产品、品牌、服务类 TVC 广告片。适用于用户提供产品图片、品牌、卖点、人群、调性或广告目标后，基于 libtv 与 Seedance 2.0 的生产链路完成：产品图像读片、剧情化卖点筛选、情绪冲突建立、创意母题、15S 段落结构、电影级视觉系统、剧情化剧本、控制原画、成片关键帧、段落级分镜、图片/视频生成提示词、声音锚点、剪辑方案和成片前自检。默认用户只给产品图片时，也视为要创作一条剧情化产品 TVC。不要用于长剧本、多集短剧、复杂互动剧情、纯口播带货、直播切片或纯图文海报。", "body": "# 剧情化产品 TVC 广告片\n\n## 核心定位\n\n基于产品图片或产品信息，创作一条有场景、有冲突、有情绪连接、有产品记忆点的剧情化 TVC。核心链路是：产品卖点 → 用户处境 → 情绪冲突 → 产品介入 → 状态转变 → 品牌记忆。\n\n本 Skill 默认服务 平台 Seedance 2.0 生产链路。Seedance 2.0 单次最多生成 15S 视频，因此所有广告必须按 15S 段落单元设计：15S=1 条视频，30S=2 条视频，45S=3 条视频，60S=4 条视频。除非用户明确要求密集剪辑，不要把每个小镜头都拆成独立视频生成任务。\n\n## 全局硬规则\n\n- 用户只给产品图片时，默认任务成立：基于该产品创作剧情化 TVC。\n- 不停下来索要完整 brief；仅当产品无法识别、主产品不明确或关键约束缺失时，提出少量问题。\n- 每条广告只选择 1 个主卖点，辅助卖点最多 1-2 个。\n- 剧情化 TVC 使用日常微冲突，不写复杂短剧、大反转、长对白或硬广功能说明。\n- 产品必须突出，但突出方式是成为剧情转折关键物，而不是强行抢戏。\n- 剧本正文不超过 1000 字；前 3 秒必须有强钩子；结尾必须回扣开头。\n- 默认必须有角色参与：角色承载情绪变化，产品推动状态转变。\n- 先生成控制原画，再生成成片关键帧，再写 15S 视频提示词。\n- 控制原画必须干净：角色原画无复杂背景，场景原画无人，产品控制不改造产品。\n- 分镜视频阶段可以生成角色台词声音，并允许受控底部字幕；但禁止生成 BGM、背景配乐或音乐铺底。\n- BGM 必须等所有 15S 视频段落合成最终成片后，再基于完整成片统一生成。\n- 默认 BGM 使用积极、阳光、温暖、明亮的大调商业广告音乐。\n- 自检发现问题时，必须定位到对应步骤并给出回炉修改方案。\n\n## 执行方式\n\n如果用户要求完整方案，按 12 步一次性输出；如果用户只要剧本、分镜、提示词或声音，则只输出相关步骤，但仍要继承前置判断。信息不足时，优先基于产品图和品类常识做“创作假设”，不要让流程卡住。\n\n输出要像广告导演和 AI 视频生产负责人，不像营销口号生成器。每一步都要服务最终可生成、可剪辑、可自检的成片。不要写大段抽象审美词；要写可被画面、动作、声音、剪辑执行的具体指令。\n\n## 产品突出与硬广边界\n\n产品必须被观众看懂，但不要用硬性功能说明抢走剧情。判断产品是否突出，优先看四件事：是否建立露出、是否有使用动作、是否推动角色状态转变、片尾是否形成记忆回收。产品不突出时，优先强化产品在剧情转折中的作用，而不是简单增加大特写。\n\n避免硬广的方法：不要堆参数，不要让旁白替产品解释一切，不要让角色突然看镜头夸产品，不要把每个镜头都变成电商主图。高级的产品露出应该是：产品自然出现，作用明确，视觉可识别，情绪转变离不开它。\n\n## 提示词书写粒度\n\n提示词要像导演给模型的生产指令，不像文学描写。每条提示词必须写清楚主体、场景、动作、情绪、产品位置、镜头运动、光线、色彩、时间轴、字幕和禁止项。不要堆“高级、电影感、超清、唯美”这类空泛词。\n\n图片提示词用于锁定资产或关键帧，视频提示词用于 15S 连续动作。视频提示词必须描述动作推进和结尾停留画面；如果有字幕，必须写明字幕内容、位置在底部、不可生成其他随机文字。\n\n## 默认缺省判断\n\n用户没给时长时，默认先提供 15S/30S/45S/60S 方案并推荐 30S；用户没给人群时，基于产品气质提出 2-3 个候选人群并选择最适合剧情化表达的一类；用户没给调性时，默认走真实、克制、积极、电影级商业广告质感。所有默认判断都必须标注为创作假设，方便用户后续修改。\n\n输出时如果用户要求简版，可以压缩分析，但不能省略主卖点、情绪冲突、15S 段落、产品露出和提示词约束。\n\n## 工作流程\n\n### 1. 产品图像读片与剧情化广告任务定向\n\n当用户只提供产品图片时，先完成产品读片，不要直接写剧本。识别产品品类、外观、颜色、材质、包装、Logo、可见文案、设计语言和产品气质。\n\n必须区分三类信息：可见事实、合理推断、创作假设。不要把推测当成产品事实；如果看不清产品或图片中有多个主产品，先问清楚。否则直接给出创作假设并进入下一步。\n\n产出：产品图像读片；默认广告类型；推荐剧情路径；可能目标人群；可能生活场景；产品适合承载的情绪；初步广告目标；进入下一步的创作假设。\n\n推荐剧情路径包括：功能解决型、情绪陪伴型、身份表达型、反差记忆型、质感氛围型、微冲突转变型。剧情化不等于复杂故事，15S 可以只是一个强冲突瞬间，60S 才适合更完整的起承转合。\n\n### 2. 剧情化卖点筛选\n\n选择“最容易被剧情感知的价值”，不是选择最强参数。候选卖点可来自产品图片、包装文案、用户补充信息、品类常识和创作推断；如果基于品类常识推断，必须标注为“创作假设”。\n\n用以下标准判断候选卖点：画面感，能不能被镜头看见；情绪感，能不能带来状态变化；冲突感，能不能形成前后对比；记忆点，看完能不能被复述；可信度，是否来自图片、用户信息或合理品类常识。\n\n最终只保留 1 个主卖点；辅助卖点最多 1-2 个，且只能服务主卖点，不能抢戏。把功能语言改写成观众感受语言，并落到一个可拍的生活瞬间。例如：降噪能力强 → 在人群里听见自己的节奏；续航久 → 从清晨到深夜都没有掉队；轻便 → 一整天带着它也不被生活拖住。\n\n产出：候选卖点及来源；剧情化潜力判断；主卖点、辅助卖点、舍弃卖点；功能语言 → 观众感受语言 → 可拍生活瞬间。\n\n### 3. 卖点情绪化与剧情冲突建立\n\n把卖点翻译成具体生活处境和可被镜头看见的情绪变化。不要只输出“治愈、温暖、高级”等抽象词。\n\n必须完成转换：产品功能 → 用户处境 → 情绪冲突 → 产品介入 → 情绪转变。冲突优先选择小而准的日常微冲突，例如吵 vs 安静、赶 vs 从容、乱 vs 掌控、累 vs 恢复、孤单 vs 陪伴、狼狈 vs 体面。\n\n产品介入必须自然，可以来自角色习惯动作、环境触发、主动使用、他人连接或情绪转折。产品出现后，角色状态必须发生可见变化，如呼吸变慢、步伐变稳、表情松弛、动作更从容、空间变安静。\n\n产出：生活场景；角色处境；表层问题；深层感受；用户真正想要的状态；外部冲突；内在冲突；适合表现的微冲突；不建议使用的过度冲突；产品介入方式；使用前、使用瞬间、使用后的状态变化；情绪命题：“这不是一支关于\\_____\\_的广告，而是一支关于\\_____\\_的广告。”\n\n### 4. 剧情创意母题生成\n\n创意概念必须是“剧情机制”，不能只是调性词或风格词。至少生成 3 个创意母题，并推荐 1 个最优方向。\n\n每个创意母题必须包含：创意标题、一句话概念、剧情机制、情绪变化、产品角色、主卖点如何被看懂、记忆点画面、适合时长、风险。创意不能只美，必须让主卖点更容易被理解。\n\n每个概念都要有一个观众能复述的记忆点画面，例如城市突然静音、一束光穿过混乱空间、产品颜色成为情绪转变的视觉线索。风险要判断是否过度抽象、是否硬广、是否太像短剧、是否生成难度过高、是否产品关系不清。\n\n推荐标准：剧情化程度、卖点清晰度、电影画面潜力、短片完成度、生成可行性、不硬广程度。Agent 必须给出导演判断，不要只把选择丢给用户。\n\n### 5. 广告时长策略与 15S 视频段落结构设计\n\n如果用户未指定时长，提供 15S / 30S / 45S / 60S 四个方案，并默认推荐 30S，除非产品更适合品牌情绪片。如果用户指定超过 60S，必须提示：超过 60 秒后，作品可能从短 TVC 变成品牌短片，传播效率和完播率可能下降，需要用户确认是否继续。\n\n时长结构：15S=1 个强钩子+一个产品动作+一个情绪转变；30S=一个完整微剧情，2 条 15S 视频；45S=更完整情绪递进，3 条 15S 视频；60S=品牌感更强，4 条 15S 视频。\n\n参考段落功能：15S：强钩子→冲突/动作推进→产品介入/状态变化→记忆点；30S：段落 1 建立冲突并引入产品，段落 2 完成情绪转变和品牌记忆；45S：处境冲突、产品介入变化、情绪释放收束；60S：世界处境、冲突加深、产品改变状态、品牌余味。\n\n无论选择哪个时长，整支广告的前 3 秒必须有强钩子，不能用平铺直叙的产品展示开场。\n\n### 6. 电影级视觉系统与生成一致性规范\n\n不要只写“电影感、高级感、大片质感”。视觉系统必须具体到产品视觉锚点、色彩、光线、镜头、场景、角色和生成一致性。高级感来自克制、准确、留白和真实细节，不来自豪华场景堆砌。\n\n产出：产品外形、颜色、材质、Logo/标识、关键细节、推荐出镜方式、不可改变处；画面气质、色彩方案、光线设计、影调质感；常用景别、镜头运动、焦段感、景深、节奏变化；主场景、辅助场景、时间/天气、空间质感、道具锚点；角色身份、外形气质、穿搭、初始状态、情绪变化方向；品牌记忆符号；人物、产品、场景、色调一致性和避免事项。\n\n剧情化 TVC 默认必须有角色参与。角色不是模特，而是承载情绪变化的人。角色要有具体生活状态和轻微不完美，避免 AI 模特脸、夸张微笑、塑料皮肤和空洞凝视。场景要有真实摄影逻辑和生活痕迹，但不要乱堆道具。\n\n### 7. 剧情化 TVC 剧本创作\n\n剧本是核心作品，不是分析总结。剧本按 15S 段落组织，正文不超过 1000 字。字数建议：15S 150-250 字，30S 300-500 字，45S 500-750 字，60S 700-1000 字。\n\n剧本结构：开场钩子 → 微冲突建立 → 产品自然介入 → 状态转变 → 结尾回收。剧本不是讲产品有多好，而是讲一个人因为产品，从一种状态走到另一种状态。少台词，少解释，多画面；旁白说感受，不说说明书。\n\n产品必须是剧情转折关键物，完成三类露出：建立露出（观众知道产品是什么）、使用露出（看到角色如何接触/使用产品）、记忆露出（记住产品关键视觉细节）。产品首次出现建议：15S 在 5S 内，30S 在 8-12S，45S 在 12-18S，60S 在 15-22S，除非创意机制明确需要延迟揭示。\n\n产出：选定时长、15S 段落数量、字数目标、核心微冲突、前 3S 钩子、产品转折作用、结尾回收方式；剧本标题；一句话故事；按 15S 段落写剧本；字幕/旁白；产品建立露出、使用露出、记忆露出、片尾回收和剧情转折作用。\n\n剧本自检：前 3S 是否抓人；产品是否自然但清楚；角色是否有状态变化；结尾是否回收开头；是否像 TVC 而不是短剧；是否避免硬广功能说明。\n\n### 8. 控制原画与成片关键帧生成\n\n必须区分“控制原画”和“成片关键帧”。控制原画用于一致性，要求干净、清晰、低干扰；成片关键帧用于广告画面表达，可以组合角色、场景、产品、情绪、光影和剧情瞬间。\n\n角色原画规则：单人，无背景或纯色背景，不出现产品，不出现复杂道具，光线干净，表情克制自然，服装、发型、面部气质清楚。场景原画规则：空场景，无角色，无无关人群，不出现产品，只锁定空间、时间、光线、色彩和氛围。产品控制规则：用户产品图是最高参考，不改变产品外观、颜色、Logo、结构和材质，不增加图片中不存在的功能或细节。\n\n产出：角色定妆原画提示词；场景定场原画提示词；产品控制/参考整理；产品情境露出关键帧；剧情转折关键帧；片尾记忆点关键帧。不要用带复杂背景的角色图或带人物的场景图作为一致性控制参考。\n\n提示词要求：角色控制图强调人物一致性；场景控制图强调空间和光线；产品控制图强调用户产品图不可被改造；成片关键帧强调剧情功能、产品位置、情绪状态和构图目标。\n\n### 9. 15S 段落级分镜脚本\n\n分镜不是越碎越专业，而是越能稳定生成、越能剪成片越专业。每个 15S 段落默认对应 1 条视频生成任务；段落内部可以描述 0-3S、3-7S、7-11S、11-15S 的镜头节奏，但不要拆成多条视频。\n\n每段必须标注：广告功能、剧情内容、内部节奏、角色动作、产品露出、镜头语言、场景/光线、情绪变化、可剪辑点、与下一段衔接。产品是否出现、如何出现、在画面中的位置、是否推动剧情、是否有特写，都必须写清楚。\n\n如果分镜中有人物台词，必须标注台词内容、说话时间点、角色语气、情绪、语速、停顿，以及对应底部字幕内容。台词声音可以在该 15S 分镜视频中生成，但不得生成 BGM。\n\n段落衔接方式可用动作接剪、视线接剪、光线接剪、颜色接剪、产品特写接剪、空间方向接剪。30S 以上必须为每个段落结尾设计剪辑接口。\n\n### 10. 原画与 15S 视频生成提示词编写\n\n提示词必须先服务稳定生成，再服务审美表达。固定顺序：产品视觉锚点 → 角色控制原画 → 场景控制原画 → 产品情境露出关键帧 → 剧情转折关键帧 → 片尾记忆点关键帧 → 每个 15S 视频段落。\n\n每条视频提示词必须显式引用参考产品图、角色定妆图、场景定场图和对应成片关键帧；必须按 0-3S、3-7S、7-11S、11-15S 写内部节奏；必须包含用途、参考资产、画面主体、场景时间、角色动作、产品露出、镜头运动、光线色彩、情绪变化、结尾停留画面、台词声音设置、字幕设置、生成限制、避免事项。\n\n产品强约束：不变形，不改颜色，不乱写 Logo/标识，不增加不存在的按钮、屏幕、纹理或接口；产品在关键动作中清晰可见，是推动角色状态变化的关键物。如果模型无法准确生成 Logo，不要生成错误文字，保持标识区域干净或依赖用户产品图参考。\n\n视频声音规则：分镜视频可以生成角色台词声音，但台词必须来自剧本或字幕设计，并与底部字幕一致；必须控制语气、情绪、语速和停顿；不允许模型自由生成额外台词。禁止生成 BGM、背景配乐或音乐铺底。环境声和音效如非必要应保持克制，避免干扰后期统一配乐。\n\n字幕规则：允许受控底部字幕。字幕内容必须来自剧本或字幕设计，位置在画面底部，风格干净克制，不允许随机文字、错误品牌字样、多余文字或漂浮文字。\n\n全局反 AI 味避免事项：塑料皮肤、AI 模特脸、夸张表情、过度磨皮、样板间、无意义霓虹、过度体积光、产品变形、手指畸形、漂浮道具、错误文字、廉价电商感、过度锐化。\n\n### 11. 基于剧本的声音锚点与剪辑方案\n\n声音要区分“台词声音”和“BGM”。角色台词声音可以在分镜视频阶段生成，用于匹配人物口型、表演节奏和底部字幕；BGM 不在分镜视频阶段生成，必须等所有 15S 视频段落合成最终成片后，再基于完整成片统一生成。\n\nBGM 默认按整条广告生成完整方案：15S 生成 1 条 15S BGM，30S 生成 1 条 30S BGM，45S 生成 1 条 45S BGM，60S 生成 1 条 60S BGM。不要为每个 15S 视频段落分别生成独立 BGM，避免后期拼接断裂。\n\n默认 BGM：积极阳光、大调、温暖明亮、有希望感、节奏轻盈向前、商业广告质感。避免过度悲伤、压抑阴暗、恐怖悬疑、过度史诗、过度煽情、廉价欢快、口水歌感、电子噪音过重。积极不等于廉价欢快，阳光不等于吵闹，温暖不等于甜腻。\n\n产出：台词声音设计；最终 BGM 方向；按最终时长写 BGM 情绪曲线；旁白/台词精确文案、出现时间、声音气质、语速、情绪、是否与底部字幕一致；产品使用音、环境声、情绪转折音、片尾品牌记忆音；最终成片 BGM 提示词、旁白提示词、音效提示词；视频段落拼接顺序、主要剪辑点、转场方式、字幕位置、品牌收束方式。\n\n### 12. 成片前自检与提示词回炉优化\n\n自检不是评价，而是回炉机制。发现问题必须定位到步骤并修正。\n\n检查：剧情化是否成立；产品是否突出且自然；主卖点是否被看懂；前 3S 是否有钩子；结尾是否回扣开头；是否有硬广感；是否有高级感；是否像真实广告而不是 AI 生成片；是否按 15S 段落组织；是否避免碎片化生成；角色/场景/产品是否一致；分镜台词声音是否与字幕一致；分镜视频是否禁止 BGM；最终 BGM 是否按整条广告生成；参考资产、产品约束、角色约束、场景约束、时间轴和避免事项是否明确。\n\n回炉规则：前 3S 没钩子，回第 7/9 步；产品不突出，回第 7/10 步；画面太 AI，回第 8/10 步；段落太碎，回第 9 步；台词声音与字幕不一致，回第 9/10 步；BGM 被错误放进分镜视频，回第 10 步；最终 BGM 不统一，回第 11 步；卖点不清，回第 2/3 步；创意无记忆点，回第 4 步。\n\n最终输出必须说明：是否可以进入生成；仍需用户确认的事项；推荐下一步。如果发现核心问题，不要假装通过，必须给出修正后的版本或明确回到哪一步重写。\n\n## 默认输出顺序\n\n 1. 产品图像读片与剧情化广告任务定向\n 2. 剧情化卖点筛选\n 3. 卖点情绪化与剧情冲突建立\n 4. 剧情创意母题生成\n 5. 广告时长策略与 15S 视频段落结构设计\n 6. 电影级视觉系统与生成一致性规范\n 7. 剧情化 TVC 剧本创作\n 8. 控制原画与成片关键帧生成\n 9. 15S 段落级分镜脚本\n10. 原画与 15S 视频生成提示词编写\n11. 基于剧本的声音锚点与剪辑方案\n12. 成片前自检与提示词回炉优化", "extras": [], "cn": "剧情TVC广告片"}, {"slug": "neo-chinese-aesthetic-tvc", "desc": "新中式美学全案：从妆造、布景到广告成片，一站式惊艳视觉", "body": "## 一、国潮子类型（从上传的产品识别子类型，拿默认；美学基调统一为新中式国潮）\n\n本 skill 只做**新中式国潮**这一种视觉语言，不做欧美时尚片 / 赛博科技感等其他风格。以下按产品所属子类型给默认特点，但**色彩、纹样、器物、造型语言一律收拢到新中式国潮**（水墨留白、飞檐斗拱、榫卯窗棂、云纹/回纹/缠枝纹、宣纸绢帛、中国红与国潮金、瓷器漆器、书法印章、丝绸刺绣）。**置景偏好「潮」的一面**：优先让这些东方元素与未来主义/极简/银白/镜面/金属质感（不锈钢、雾面金属、亚克力透光、悬浮结构、极简大留白、冷光）碰撞出新意，而非纯古典复刻——传统符号打底，现代材质点睛。\n\n- **茶饮 / 白酒 / 传统食品** — 特点：茶烟氤氲、酒液挂杯、器皿特写（茶盏/杯盏/瓷罐）、木质/竹编场景、慢镜头意境；默认创意手法：情感 + 演示；参考：茅台、观夫山、茶里\n- **美妆 / 国货护肤** — 特点：微距质地流动、东方肤感、妆造融入国风元素（发簪/绒花/戏曲妆容意象）、奢华留白；默认创意手法：演示 + 情感；参考：花西子、毛戈平、观夏\n- **服饰 / 新中式穿搭** — 特点：改良汉服/新中式褂衫、面料垂坠特写、庭院/园林走位、写意运镜；默认创意手法：故事 / 情感（视听奇观风格）；参考：盖娅传说、密扇、朋克大爷\n- **家居 / 香氛 / 文创** — 特点：榫卯结构特写、香炉烟雾、宣纸/木质/铜器质感、静谧留白；默认创意手法：情感（视听奇观风格）；参考：观夏、失物招领\n- **珠宝 / 配饰** — 特点：金银錾刻、玉石光泽、慢速环绕特写、暗调打亮细节；默认创意手法：演示 + 情感；参考：老凤祥、梦金园\n- **地产 / 文旅 / 空间体验** — 特点：飞檐轮廓航拍、园林借景、光影漏窗、生活方式想象；默认创意手法：情感 / 故事；参考：中式合院项目、古镇文旅\n- **国货 3C / 潮玩** — 特点：产品本体嫁接国风纹样、悬浮展示 + 水墨转场、传统与现代对撞；默认创意手法：演示 + 情感\n\n> 定了子类型即拿到：默认特点 + 建议创意手法 + 一组旋钮默认档位（见第三节括注）；**东方美学基调与固定风格种子对所有子类型统一生效**，客户有特殊要求可覆盖具体细节，但不脱离新中式国潮的大方向。\n\n---\n\n## 二、五个维度（与用户对话逐项确认）\n\nTVC 商业广告片的 5 个维度（制作方式不再询问，固定实拍）。定品类后多数已有默认值，对话只需补齐/修正，不重复问已知项；**视频比例与分辨率无默认值，必须问用户**。\n\n**1. 广告目的**：产品 · 品牌 · 形象 · 促销 · 公益\\\n→ 决定信息密度与收尾落点：促销=强 CTA；品牌/形象=主张/slogan 收尾；产品=卖点+CTA。（默认不加 logo，收尾以 slogan 字幕或画面/产品自然收束为主。）\n\n**2. 创意手法**（＝ prompt 生成骨架）：故事 · 情感 · 演示\n\n- **故事**：完整剧情，建立 → 冲突 → 解决，产品融入情节。\n- **情感**：情绪弧打动人，建立人物/处境 → 情绪高点 → 产品作为解法 → 落主张。用 `{{Mixed N}}` 锁角色。\n- **演示**：卖点直给，痛点/场景 → 产品登场 → 一镜一卖点 → 效果呈现 → slogan/CTA 收尾（默认不加 logo）。产品每镜清晰。\n\n> 「视听奇观 / 时尚片」不是单独手法，而是**高制作美学风格**（运镜密集、美学优先、慢动作、大量留白），常叠加在 故事/情感/演示 上（服饰、美妆、珠宝、家居香氛），靠第三节拆解要素堆出来。\n\n**3. 视频时长**：15s · 30s · 60s\\\n→ 决定分镜数（15s≈3–5 镜 / 30s≈6–9 / 60s 更多），并触发**按 15s 分段生成**（见工作流 Step 4）。\n\n**4. 视频比例**：16:9 · 4:3 · 9:16 · 3:4\\\n→ 决定成片画幅（同时用于场景氛围图与 Seedance 生成的 `--ar`）：16:9 横屏（TV/OTT/横版）、9:16 竖屏（社媒竖版，前 3 秒更狠）、4:3 复古方屏、3:4 竖版。此项**必须让用户选**。需要多版时可一稿出双版（如 16:9 + 9:16）。\n\n> **制作方式不再作为维度询问**——本 skill 一律走**实拍风格**（电影感商业片基底 + 新中式国潮实拍质感），不做动画/CG，风格锁定句固定为实拍基底。\n\n**5. 生成分辨率**：480p · 720p · 1080p\\\n→ 决定 SD2 调用时的输出分辨率参数，直接影响成片清晰度与生成耗时/成本；此项**必须让用户选择**，不套默认。\n\n---\n\n## 三、拆解要素（7 个旋钮 · 选项菜单）\n\n每个维度选一档；斜体括注是「按品类默认」。\n\n**1. 灯光设计**\n\n- 光源：自然光 / 棚拍人工光 / 混合光\n- 方向：顺光 / 侧光 / 侧逆光 / 逆光 / 顶光 / 底光\n- 布光：主光 Key、辅光 Fill、轮廓光 Rim/Edge、背光 Backlight、发丝光、体积光/丁达尔 Volumetric、美妆光 Beauty dish、入画实用光源 Practical（灯笼/烛火/漏窗光）\n- 色温：冷调(蓝白) / 暖调(金橙) / 中性 / 冷暖对撞\n- 特殊光效：漏窗光斑、烛火烟雾体积光、绢纱柔光、水墨式明暗晕染、耀斑 lens flare\n- *默认：茶饮/白酒/食品=暖调烛光感+体积光；美妆/国货=柔光通透暖调+发丝光；服饰=自然窗光+绢纱柔光；家居/香氛=暖木质光+烟雾体积光；珠宝=暗调侧逆光打亮细节；地产/文旅=暖柔自然光+漏窗光斑*\n\n**2. 画面色调**\n\n- 色温：暖调 / 冷调 / 中性 / 冷暖分离 split-tone\n- 色调：水墨黑白灰、中国红与国潮金对撞、莫兰迪低饱和国风灰、青绿山水冷调、宣纸米白低饱和、复古做旧绢帛色\n- 饱和度：高饱和(节庆/红金) / 标准 / 低饱和(水墨/文人) / 去色单色(水墨)\n- 质感叠加：宣纸纹理、绢丝柔光晕、烟雾氤氲、胶片颗粒\n- *默认：茶饮/白酒/食品=暖调+中国红与金对撞；美妆/国货=低饱和暖调+宣纸质感；服饰=水墨低饱和+绢丝柔光；家居/香氛=莫兰迪国风灰；珠宝=暗调高对比+金属光泽；地产/文旅=青绿山水冷调*\n\n**3. 镜头语言**\n\n- 运镜：固定、推/拉、摇 pan、移 dolly、升降 crane、环绕 orbit、跟拍 tracking、手持、稳定器、FPV 穿越\n- 景别：微距/大特写、特写、近景、中景、全景、大远景、航拍\n- 角度：平视、仰拍、俯拍、顶视平铺、荷兰角(倾斜)\n- 构图：居中对称、三分法、框架式、大量留白、满构图、前景遮挡\n- 镜头特性：广角畸变、长焦压缩、移轴微缩、鱼眼\n- *默认：美妆/国货=微距+缓慢 orbit；服饰=庭院移动+跟拍+留白构图；珠宝=微距+缓慢环绕；茶饮/白酒=顶视+升格微距；地产/文旅=航拍+框架式构图（漏窗/门洞）*\n\n**4. 音效音乐**\n\n- **BGM 固定为\"融合乐\"，不开放选择**：「中国古典乐器演奏的电子音乐」——古筝/琵琶/笛箫/二胡/编钟等**传统乐器真实音色**为旋律主体，**深度融合现代电子**（节拍/合成器/低频律动/采样），是国风 × 电子的 fusion，非纯民乐、非纯电子，两者交织。关键词：`traditional Chinese instruments (guzheng/pipa/dizi/erhu) fused with modern electronic music, neo-Chinese electronic fusion`。\n- **BPM 跟片走**：由成片实际节奏/调性定——明快/卡点片偏快强律动，舒缓/情感片偏慢有空间感，片内可变速，不设固定 BPM。\n- **生成时机**：**SD2 生视频阶段完全静音**——不生成 BGM、不生成音效/环境音、不生成旁白，只出纯画面；BGM 与旁白全部放到 Step 6 后期合成时加入。\n- 音乐功能：驱动卡点 beat-synced、氛围铺底、情绪烘托——按子类型和创意手法选功能档位，但\"古典乐器 × 电子融合\"的音色基底不变。\n- **不做音效层**：成片不含任何音效/环境音（SD2 静音、后期也不加音效）；成片声音只有 **BGM + 旁白（如有）** 两层。\n- 人声：男/女声旁白 VO、无人声\n- 混音：BGM + 旁白分层混音，旁白清晰度优先（BGM 不可盖过人声）。\n- *默认：茶饮/白酒=国风电子融合（偏舒缓律动）；美妆/国货=国风电子融合（电子感更强、节拍清晰）；服饰/家居=国风电子融合（丝竹音色+柔和电子铺底）；珠宝=稀疏国风电子融合；地产/文旅=国风电子融合（大气、低频律动）+旁白*\n\n**5. 剪辑节奏**\n\n- 切换速度：快切、中速、慢长镜、一镜到底\n- 节拍：卡点踩鼓点、自由叙事节奏\n- 转场：硬切、淡入淡出、匹配剪辑 match cut、无缝变形 morph、遮挡甩切 whip、跳切 jump cut、液体/光效转场（**禁止叠画/叠化**）\n- 时间处理：正叙、倒叙、平行剪辑、蒙太奇、定格强调\n- 特殊手法：定格 freeze frame、变速 speed ramp、故障 datamosh\n- *默认：茶饮/促销=中速卡点；服饰/家居/珠宝=慢长镜写意；地产/文旅=慢起渐快*\n\n**6. 演员模特**\n\n- **有无人物：强制有人像介入**——不管什么子类型、什么创意手法，每条广告都必须有人的存在（可以是正面出镜的模特，也可以只露手部/局部肢体，比如倒茶的手、佩戴首饰的动作、拂过面料的指尖），**不允许纯产品无人化呈现**。\n- 人群定位：年轻、都市白领、家庭多代、儿童、运动人群\n- 气质风格：高级冷感、亲和温暖、力量运动、潮酷街头、清纯邻家\n- 多元：本土、国际化混搭、多元族裔\n- 表演基调：克制写实、生活流、戏剧夸张（**表情务必自然可信，禁止夸张怪异表情**）\n- 情绪焦点：面部微表情、眼神、肢体动作、互动关系\n- 服装（按子类型）：贴合新中式国潮调性——**统一以改良汉服/新中式褂衫/立领盘扣等为基底，颜色取中国红、国潮金、青绿、水墨灰**；美妆 = 有一定露肤度但不暴露、妆造融入国风元素（发簪/绒花）；服饰 = 高级新中式成衣、面料垂坠感强；珠宝/家居/地产 = 得体新中式生活装\n- *默认：美妆/国货=东方高级脸+面部微表情+**皮肤光泽是重点**；服饰=新中式造型+肢体仪态；地产/文旅=多代家庭；茶饮/白酒/珠宝=以**手部/局部人物动作**为主介入（如执壶倒茶的手、佩戴首饰的动作），器物/产品仍是视觉主角，但每镜保证有人的存在*\n\n**7. 故事类型**\n\n- 叙事类型：强叙事(完整剧情) / 弱叙事(氛围奇观串联) / 无叙事(纯展示)\n- 结构：三段式、线性、非线性蒙太奇、单点演示、问题—解决\n- 视角：第一人称、旁观者、产品视角、多线并行\n- 题材原型：生活片段、英雄旅程、before/after 对比、证言代言、演示 demo、品牌宣言 manifesto\n- 落点收尾：产品 hero、主张/slogan 字幕（有 slogan 时用视频模型直出）、CTA（**默认不加 logo 定版**，除非用户明确要求）\n- *默认：地产/文旅=温情三段式；服饰=意境线性叙事；美妆/珠宝/茶饮=弱叙事(氛围奇观串联)；家居/香氛=弱叙事或纯展示*\n\n---\n\n## 工作流\n\n### Step 1 · 用户上传产品\n\n用户上传产品图（或产品描述 / 参考片）。从产品识别：所属子类型（查第一节表）、产品形态/材质/卖点、是否需要 `{{Mixed N}}` 角色。拿到子类型即带出默认特点 + 建议创意手法 + 旋钮默认档位。\\\n**【强制步骤 · 不可跳过】上传后随即生成两张产品锚点图**（后续所有分镜产品一致性的基础）：**必须以【用户上传的产品图】作参考图（image reference / 图生图），绝不凭空文生图**——把原图喂给生成模型（建议 GPT Image 保真），据真实外形/颜色/材质/比例/品牌标生成；多张则全部喂入。**白底、16:9**，作为锚点 `{{产品三视图}}`（正/侧/背）+ `{{产品细节图}}`（按功能取关键细节，如护肤品=瓶身/泵头/质地）。两张缺一不可，生成后与原图比对，外形/配色/logo 对不上就重出；进 Step 2 前须已产出这两张。后续分镜产品画面一律以此为准。\n\n> 若**只给文字描述、无产品图**：先告知\"只能按描述文生图、可能与真实产品有出入\"，追问关键外观后再生成；用户补传图后须重做。\\\n****地产/酒店等\"空间即产品\"品类**：无实体产品，改让用户**上传 5–8 张实景图**（或 skill 虚拟生成 5–8 张，按 16:9），作为 `{{空间实景}}`——**替代产品三视图，并同时充当场景锚点**。后续分镜空间/布景/光线一律以此为准；空间本身无人，但仍须选定人物形象，让人以生活方式场景（漫步/品茶/伏案）出现，不通篇空镜。\\\n****反推参考片**：先 `scripts/extract_frames.sh` 抽帧读规格（前 3 秒钩子 / 节奏 / 运镜 / 落点 / 属于哪个子类型），再产同款，并统一改写为新中式国潮美学（不改变原片叙事结构与节奏，只替换色彩/纹样/器物/造型为国潮语言）；绝不凭空描述没看过的画面。**反推同样按 15s 一段整段生成（编号分镜，一段连续 prompt 出一整段），30s / 60s 拆成多个 15s 段顺接——不要拆成很多单镜分别生成。**\n\n### Step 2 · 一张问询卡一次性确认所有维度（连续问询，统一记录）\n\n**用一个** `ask_user_input` **问询卡把下列各项一次性抛给用户**（连续触发、一张卡收齐），**不要问一步停一步**；用户在同一张卡里填完，统一记录后再往下走。需要确认的项：\n\n1. **目的**（品牌/形象、产品卖点、促销带货…）\n2. **创意手法**（故事 / 情感 / 演示；制作方式不问，固定实拍）\n3. **时长**（15s / 30s / 60s）\n4. **视频比例**（16:9 / 4:3 / 9:16 / 3:4，单选，无默认，必选）\n5. **生成分辨率**（480p / 720p / 1080p，单选，无默认，必选）\n6. **品牌 slogan**（有则填、用于结尾落点字幕；无则留空。**默认不加 logo，不询问 logo**，除非用户主动要求）\n7. **旁白**：是否需要旁白 → 若需要：人声（男/女/中性、风格、语言）+ **是否需要字幕（中文 / 英文 / 中英双语 / 不要）**。（旁白一律后期用 TTS/配音加入，无\"写进 prompt\"选项；字幕也在最后合成前加入；旁白文案不在此卡填，留到分镜表格阶段由 skill 先拟、给用户过目确认。**未选旁白则不问字幕。**）\n\n品类已给默认的项只需确认有无修改、不重复追问；除视频比例/分辨率外各项可选\"你帮我定\"，用户说\"全你定\"就按默认填其余项，但视频比例、分辨率仍需明确选。**收齐这一张卡后，维度与旁白偏好一次性锁定，进入 Step 3。**\n\n### Step 3 · 出 moodboard（先问参考图 → 逐项选文字 → 按分流生成图 · 需用户确认）\n\n**0. 先问角色参考图（在选文字方向之前，问完必须停下等用户上传**）若有模特，先用 `ask_user_input` 问一句：**\"你有人脸参考图或造型参考图吗？（人脸照片、想参考的服装/造型图都可以传，也可以两者都传）\"** 问完必须停顿，让用户把参考图上传到对话框（有的话）再往下走。\n\n**铁律：人脸/人像参考图一律不喂 MJ**（MJ 只接受**造型参考图**作 image reference）；人脸图只在最后 SD2 生视频时与三视图一起喂，锁真脸真发。**三视图人脸是否遮挡只看有无真人脸图：有→用白色圆形贴纸遮脸+右下角中文标注（详见下方角色三视图），无→不遮**（MJ 脸即身份，也作 SD2 人脸参考）。\n\n按用户上传情况分四种（都先\"理解参考图/文字意图 + 补写成完整国潮造型 spec\"，不丢图照搬；流程统一为 **MJ 出正面图 → LibImage 出三视图**）：\n\n- **① 只有人脸参考图**：人脸不喂 MJ，MJ 按文字 spec 出图；三视图**贴纸遮脸+标注**，人脸图仅 SD2 阶段与三视图一起喂（锁真脸真发）。\n- **② 只有造型参考图**：造型图**作 image reference 喂 MJ**；三视图**不遮脸**（MJ 脸即身份，也作 SD2 人脸参考）。\n- **③ 人脸+造型都有**：**只喂造型图、人脸不喂**；三视图**贴纸遮脸+标注**，人脸图仅 SD2 阶段喂。\n- **④ 都没有**：走「选模特形象文字」正常问；三视图**不遮脸**（MJ 脸即身份）。\n\n**先一步步用文字选定方向，全部选完再生成图。** 文字选择逐项 `ask_user_input`，一次一项，每项 3 个选项 + \"换一批\"口子：\n\n1. **选模特形象文字（④都没有时必问；①③有人脸参考图时只问年龄段/气质/发型方向，长相以参考图为准，不必再选族裔）**：给 3 个形象选项，每个 =「族裔/地域（东亚 / 亚裔混血 / 国际化…）+ 年龄 + 性别 + 发型」，**此处先不写穿着**（服装/造型留到 MJ 正面图环节，且统一为新中式国潮造型），例如：\n\n   - 东亚青年女性，盘发簪花\n   - 东亚中年男性，利落短发\n   - 亚裔混血青年女性，长直发\n\n   形象要贴产品/品牌调性，不随机。**本 skill 强制每条广告都要有人像介入，此项不可跳过**（即便以器物/产品为视觉主角，也要选定负责手部/局部出镜的人物形象）。\n\n2. **选场景氛围**：给 3 个文字选项，每个把「场景/置景 + 色调 + 灯光 + 质感」综合成一句。**方向不走纯古典复刻，而是「中式美学元素 × 未来主义/极简/金属质感」的碰撞**——把东方符号（窗棂/月洞门/水墨/云纹/园林轮廓/器物）与现代材质语言（银白/镜面/不锈钢/亚克力/雾面金属/极简大留白/冷光/悬浮结构）结合，出新意。\\\n   **尺度硬要求：必须是能容纳全身模特走位的大场景（全景 / 大远景尺度）**——是\"可走进去的空间/建筑/环境\"，不是桌面装置或局部台面；要有纵深、地面、可站立活动的余量，让后面含模特的分镜能把人完整放进画面。例如：\n\n   - 极简银白挑高展厅，悬浮巨型月洞门镜面装置贯穿全景，冷调柔光 + 一线暖金描边，大留白纵深\n   - 未来感金属长廊/水景大厅，水墨烟雾漫过不锈钢地面，冷白顶光 + 低饱和青灰，可容人行走\n   - 雾面亚克力屏风矩阵围合的开阔空间，隐约云纹透光，中国红点缀于银灰冷调间，硬朗定向光 + 地面延展\n\n   （若品类/客户更偏传统，也可给偏古典的一版，但同样须是大场景；默认优先给这种\"新中式 × 未来极简\"的创新置景。）用户挑 1。\n\n**文字方向锁定后，按顺序生成参考图：**\n\n- **场景氛围图**：**调用 Midjourney 生成**。把选定的场景氛围**扩写成具体描绘**（场景细节/光线/色调/质感/构图）。**东方符号 × 现代材质碰撞**：东方元素（窗棂/月洞门/水墨留白/云纹回纹/园林轮廓/宣纸绢帛/中国红与国潮金等）**结合**未来主义/极简/金属语言（银白/镜面/不锈钢/雾面金属/亚克力透光/悬浮结构/极简大留白/冷光），避免纯古典堆砌。**尺度必须是大场景**：MJ prompt 里显式写全景 / 大远景 / 广角、挑高开阔、有地面与纵深（如 `wide establishing shot, expansive interior, high ceiling, spacious, deep perspective, room to fit a full-body figure`），确保这张空镜背景后续能完整塞下全身模特走位——不要出成桌面装置或局部特写。**必须纯空镜**：只有环境，禁产品/人物/人影/手部/动物/文字/logo，prompt 显式加否定词（`empty scene, no people, no product, no text, uninhabited`），供后续所有镜头复用为背景。**风格种子固定** `--sref 4608797467 --profile nn1ntrp` **+** `--v 8.1`（不询问、不展示代码），`--ar` 取 Step 2 所选比例。**最终 MJ prompt = 大场景描绘 + 空镜否定词 + 固定种子（含** `--v 8.1` **与** `--ar`**）**。（默认出 4 张可挑；带出主体、或场景太小塞不下人，判不合格重出。用户自带参考图可叠 `--cref`/`--iw`，但不可去掉固定种子、不可放宽空镜与大场景约束。）\n- **MJ 造型图（若有模特）**：**MJ V8.1 + 固定风格种子** `--sref 4608797467 --profile nn1ntrp`**，**`--ar 3:4`。**只出一组正面图，构图尽量全身/大半身**（看清整套造型搭配/下装/鞋履/廓形，至少大腿以上，能全身则全身），脸部清晰；同一段 prompt 跑一次（默认 4 张），不拆分放大，直接 4 选 1。取景显式写\"全身或大半身正面站姿，完整展示整套造型与鞋履\"。**分流按①-④：仅②③把造型图作 image reference 喂 MJ，人脸图任何情况不喂**；spec 结合场景氛围+模特形象+国潮造型语言（改良汉服/立领盘扣/中国红国潮金/云纹回纹）。**生成后停下，用 4 选 1 选项让用户挑**——选项须标明每张对应 MJ 四宫格的位置：**1（左上）、2（右上）、3（左下）、4（右下）**（对应 MJ 默认 2×2 出图顺序），选定后再往下。\n- **角色三视图（每人一张，16:9）**：**用 LibImage 生成**（不用 MJ），**据用户选定正面图扩写**——白底、**全身左/中/右（正/侧/背）三视，非头部特写**，比例/造型（含服装）与所选正面图一致。**人脸处理按 Step 3.0 分流**：①③有人脸参考图 → **用白色圆形贴纸完整遮住每个人脸（三个视图的脸都遮），并在图片右下角加中文小字标注\"人脸单独提供 · 此图仅用于服装造型参考\"**（真脸留给 SD2 阶段的人脸参考图去锁）；②④无人脸参考图 → 保留 MJ 正面图的脸、不遮。三视图即 `{{Mixed N}}` 一致性锚点，表情自然。**造型参考图与 MJ 结果有出入时，以用户选定的 MJ 正面图为准。**\n\n随图附一句概念关键词 + 锁定的旋钮档位清单（7 维各一档）。\\\n**用户确认后视觉方向锁定，才进入下一步**——后面分镜严格按选定的模特、场景氛围来写。moodboard 是出 video prompt 前的把关闸口。\n\n### Step 4 · 按时长分段（不问模式，统一 15s 整段生成）\n\n**只有一种生成方式：以 15s 为单位，每段一条连续 prompt 一次性整段生成**（内部按 镜头1 / 镜头2 / 镜头3… 编号分镜，每镜写明景别 + 运镜 + 内容，格式见 Step 5）。**不做逐镜分帧生成、不让用户选模式。**\n\n- **15s**：整片一张分镜表格（Step 5.0）→ 确认 → 展开 prompt 生成整段。\n- **30s**：分镜表格**整片一次出完**（第1段 0–15s、第2段 15–30s 全列在一张表）→ 用户一次确认 → **两段 prompt 并发同时生成**（各段以统一 `{{Mixed N}}`/服装/场景/光线为锚点保持一致，按顺序可拼接）。**两段必须不同内容、推进叙事，不重复镜头或动作；前 15 秒结尾不做落点定版，落点（有 slogan 则 slogan 字幕，默认不加 logo）只放在后 15 秒结尾。**\n- **60s**：分镜表格**整片一次出完**（四段全列在一张表）→ 用户一次确认 → **四段 prompt 并发同时生成**（统一锚点、可顺序拼接）。**只在最后一段结尾做落点定版（有 slogan 则 slogan 字幕，默认不加 logo），中间各段不收落点。**\n\n> **两条必含镜头（见 Step 5，多段时按整片计）**：① 全片**至少一镜是产品使用特写**（可放在任意一段）；② **尾版（最后一段的最后一镜）必须是模特与产品同框的中近景**（能穿戴则佩戴、只能用/吃喝则手持）。\n\n### Step 5 · 按 Seedance 2.0 格式输出（先出分镜表格 → 再展开 prompt）\n\n**5.0 分镜表格确认（整片一次出完；确认关口在此）分镜表格一口气出完整片**——该多少秒就列多少：15s 一段、30s 两段、60s 四段，**全部镜头列在同一张表里**（按 15s 分段标注段落，如「第1段 0–15s」「第2段 15–30s」），让用户一次看到全片全貌、一次确认或修改。**分镜表格是本环节唯一需要用户确认镜头内容的关口**；表格确认后，展开 prompt 与调 SD2 生成属于内部执行，**不再把 prompt 抛给用户二次确认**。表格列：**镜号 ｜ 段落 ｜ 景别 ｜ 运镜 ｜ 画面内容（**`{{Mixed N}}`**/产品动作）｜ 旁白/VO ｜ 时长(s) ｜ 备注**。\n\n- **旁白/VO 列**：把该镜对应的旁白文案写在这一行（按镜分行、画面与词对齐）；连贯长句跨数镜时可合并写在相应几行。旁白须贴合已确认的目的与落点、卡住时长（约 15s 30–40 字 / 30s 60–80 字 / 60s 120–160 字，按语速调整）。**不需要旁白**（Step 2 未选旁白）则此列留空/标\"无\"。\n- 表格须体现两条必含镜头（产品使用特写、尾版模特与产品同框）与收尾落点。**每一镜（含产品特写）的画面/备注都要标明发生在选定场景内**，产品特写注明\"场景内承托物 + 浅景深虚化\"，不允许出现白棚/纯色底。\n\n> 旁白的**是否需要 / 人声**已在 Step 2 问询卡确认；此处只是把文案随分镜一起过目。旁白**一律后期加入**（SD2 静音，不写进 prompt），留到 Step 6 配音。（BGM 也不在此处理：固定国风电子融合乐、BPM 随片，留到 Step 6 合成前生成；**SD2 生视频完全静音、无任何声音**。）\n\n**5.1 展开 prompt 并多条并发生成（表格已确认；不逐段停顿**）整片表格既已在 5.0 一次确认，**把整片按 15s 分成的所有段一次性全部展开成各自的连续 prompt，多条并发同时提交 SD2 生成**——**不再一段一段等用户确认**。各段仍以统一的 `{{Mixed N}}` / 服装 / 场景 / 光线为锚点保持一致、按顺序可拼接、衔接不穿帮；生成完成后一并交付、进入 Step 6 合成。15s 单段则单条生成。\n\n**★ 产品一致性强约束（防飘核心，最高优先级）**★产品\"越到后段越飘、结构/比例走样\"的根因是后续段落丢了产品参考。因此：\n\n- **每一段 15s 生成都必须把同一组产品参考作为 image reference 喂给 SD2——不是只在开头喂一次**：每段输入都带上 `{{产品三视图}}` + `{{产品细节图}}`，**全片各段喂的是完全相同的这两张，不得替换、不得省略、不得只喂给第一段**。并发的每一条 prompt 都要独立带齐这组产品参考。\n- **prompt 正文对产品显式锁定**：凡出现产品的镜头，都要写明\"产品外形/比例/结构/配色/logo 严格以 `{{产品三视图}}`+`{{产品细节图}}` 为准，保持与参考图完全一致，不得变形、不得改色、不得挪动或杜撰 logo/文字\"。\n- **保证产品可对齐**：产品出现时**完整入画、清晰、不被过度遮挡**（使用镜可露手，但产品主体与 logo 要看得清），避免因残缺/糊/大面积遮挡让模型自行脑补而走样。\n- 生成后**逐段比对**产品与锚点图，形状/比例/logo 一飘就**重生该段**（并检查该段是否漏喂了产品参考）。\n\n严格按已确认的 moodboard + 分镜表格来写。**每条输出 prompt 的第一句固定为引用场景图**：\n\n> 请参考 `{{场景氛围图}}` 作为场景氛围。\\\n****地产 / 酒店等需实拍图的品类**：第一句改为引用 `{{空间实景}}`，且**每个镜头必须发生在该实拍场景内**，不得使用虚构 / 想象的空间。\n\n随后正文**只写品质锁定（电影感/广告级）+ 主体 / 动作 / 镜头 / 产品**，**不再文字描述场景氛围 / 环境 / 色调**（场景一律由选定的 `{{场景氛围图}}` 承载，写进正文会与图引用互斥；场景对错以选定图为准）。\n\n- **所有镜头都在选定场景内，产品特写也不例外（禁跳白棚）**：**包括产品特写 / 微距 / 使用镜头在内的每一个镜头，背景都必须是选定的** `{{场景氛围图}}` **那个环境**，绝不能突然切到白棚 / 纯色底 / 与全片割裂的空间。产品特写可让产品\"静置于场景中的合理承托物上\"（如竹林里的展示台/石台、茶室的案几、展厅的悬浮台座）并对背景做**浅景深虚化**，既突出产品又保留可辨认的场景氛围。prompt 里对产品特写镜显式写\"背景为 `{{场景氛围图}}` 的环境、浅景深虚化，非纯色棚拍\"。\n- **角色人脸锁定**：①③\"有人脸参考图\"时，`{{Mixed N}}` 首现写明\"脸取自人脸参考图（真脸真发），造型/身形取自三视图\"，并把人脸图+三视图一并作输入；②④\"无人脸参考图\"则直接以三视图（含 MJ 脸）为准。\n- **输出语言 = 中文。**\n- **编号分镜格式**：一段 prompt 内按 **镜头1 / 镜头2 / 镜头3 / 镜头4…** 顺序排列，每个镜头写明：**景别**（微距/特写/近景/中景/全景/航拍…）+ **运镜**（固定/推拉/环绕/跟拍/升降…）+ **内容**（`{{Mixed N}}` 或产品的动作与画面）。\n- **必含镜头 1 · 产品使用特写（不可缺）**：分镜里**至少要有一镜是\"正在使用产品\"的特写/微距画面**——刷子扫过眼影盒的粉、手指轻触乳霜抹过肌肤的质地、执壶将茶汤注入杯盏、指尖划过面料等，按品类对应产品的真实使用动作，突出质地/触感/功能细节。**此镜背景同样在选定场景内、浅景深虚化，不许跳白棚。**\n- **必含镜头 2 · 尾版模特与产品同框（不可缺）**：**最后一镜（尾版）必须是模特与产品一起露出的中近景**——**能穿戴的就佩戴**（项链/首饰=模特佩戴后的中近景、服饰=上身效果），**只能用/吃喝的就手持**（美妆护肤=手持产品、茶饮酒水=举杯/持瓶），让产品与人同框收尾。此镜可与结尾落点句（slogan 字幕）叠合。\n- **整段连续 prompt（唯一格式）**：每段 15s = 一条连续 prompt = 第一句引用 `{{场景氛围图}}` → 品质锁定句（电影感/广告级，不含场景氛围与色调描述）→ **镜头1 / 镜头2 / 镜头3…（每镜景别+运镜+内容）** → 收尾落点句（**有 slogan 则用视频模型直出该 slogan 字幕；默认不加 logo，除非用户明确要求**）。中文整条交付，一次性整段生成，不逐镜分帧。\n- **两级节奏：表格一次确认、视频多条并发**：镜头内容的确认关口只有 5.0 的整片表格（一次过全片，prompt 不再二次确认）；**视频生成为多条 15s prompt 并发同时跑，不逐段停顿确认**，各段保持锚点一致、可顺序拼接。\n- **声音处理：SD2 阶段完全静音（无任何声音）**：所有时长的 SD2 prompt 都**不写任何声音**——不要 BGM/背景音乐、不要音效/环境音、不要旁白、不要单音/音阶/乐器音/节拍等一切声音；**SD2 只生成纯画面（静音视频）**。旁白与 BGM 全部留到 Step 6 后期合成时加入。prompt 正文只写画面（主体/动作/镜头/产品），不出现任何声音描述。\n- **旁白**：SD2 静音，旁白**一律不写进 prompt**，全部留到 Step 6 后期用 TTS/配音加入（文案已在 5.0 表格确认，人声按 Step 2 问询卡的选择）。\n- **生成分辨率**：按 Step 2 确认的 480p / 720p / 1080p，调用 SD2 时设置对应输出分辨率参数（不写进 prompt 正文，作为生成调用的独立参数）。\n- **视频比例**：按 Step 2 确认的 16:9 / 4:3 / 9:16 / 3:4，调用 SD2 时设置对应画幅（Step 3 的场景氛围图 `--ar` 也应与此一致，保证背景图与成片同画幅）；正文可在开头点明画幅（如\"横屏 16:9\"/\"竖屏 9:16\"）。\n- **影调强化句（品质句后固定追加）**：如\"广告级商业调色，画面通透明亮、层次分明，色彩饱和自然不发灰，高光与材质光泽锐利，避免发暗/发灰/对比不足的下沉感\"，核心诉求（通透/明亮/锐利/不发灰）必留。\n- **运动质量句（末尾固定加）**：运镜丝滑、帧率稳定、不掉帧/卡顿/抖动、自然动态模糊；环绕/旋转镜头额外写\"缓慢匀速环绕、平滑连续旋转\"并放慢（最易卡顿，宁慢勿快）。\n- 详见 `references/seedance-output.md`（景别/运镜/Cut 词汇、续接写法、各手法范例）。\n\n### Step 6 · 视频合成、旁白配音、字幕与配乐（成片输出）\n\n用户用上面 prompt 在 Seedance 生成片段后，回到本步收尾成片：\n\n- **剪辑合成**：**30s / 60s 的多段按分镜顺序拼接成完整成片**（用 ffmpeg / 剪辑管线），统一画幅与帧率、处理段间衔接；15s 单段可直接成片。\n- **旁白后期配音（Step 2 选了需要旁白时）**：SD2 视频静音，按选定人声用 TTS / 配音生成旁白（文案已在分镜表格确认），对齐画面后混入。\n- **加字幕（Step 2 选了需要字幕时）**：按选择加旁白字幕——**中文 / 英文 / 中英双语**，与旁白文案一致、随旁白节奏对齐上屏；样式简洁不抢画面（贴合新中式国潮气质）。字幕在本步合成前加入；未选字幕则不加。\n- **生成配乐（所有时长都在此步统一生成，不随 SD2 出）**：镜头完成、拼接成片后，生成一段国风电子融合乐（古典乐器 × 现代电子，见第三节），**BPM 依成片实际节奏/调性定**（快片强律动、慢片有空间感，片内可变速），时长严格匹配成片；SD2 视频为静音画面，将 BGM 与后期旁白（如有）一并混入，旁白优先、BGM 不盖人声，输出最终带乐+旁白版本。\n\n---\n\n## 锁定风格块（固定实拍基底 · 原样使用）\n\n本 skill 一律走实拍风格，以下电影感商业片基底为唯一基底，按需叠加下方叠加句。\n\n**电影感商业片基底（实拍）· EN：**\n\n```\nA high-end commercial film, cinematic masterpiece, commercial-grade lighting and\ncolor grading, crisp clean image, shallow depth of field, premium product-film\naesthetic, natural film-scan color fidelity (no over-warm filter).\n```\n\n**电影感商业片基底 · ZH：**\n\n```\n高端商业广告片，电影级杰作，广告级布光与调色，画面干净锐利，浅景深，\n高级产品片美学，自然 film-scan 色彩还原（避免过暖滤镜感）。\n```\n\n**叠加句**：演示 `+ clean seamless studio backdrop, macro detail, even soft key light, product hero shot, slow-motion reveal`｜视听奇观风格 `+ new-Chinese-style fashion-film energy, dynamic slider/crane motion, music-driven rhythm, rich material texture`｜新中式国潮 `+ new Chinese aesthetic, ink-wash negative space, traditional Chinese architectural silhouettes, cloud/lattice patterns, silk and rice-paper texture, Chinese red and antique gold palette`。\n\n---\n\n## 参考文件\n\n- `references/seedance-output.md` — 编号分镜/连续 prompt 格式、景别/运镜/Cut 词汇、各创意手法范例。\n- `scripts/extract_frames.sh` — 反推参考广告片抽帧 + 读规格。\n\n## 通用约束（速查 · 详见对应 Step）\n\n- **产品锚点两图必做**：上传产品后、确认维度前，\\*\\*必须以上传产品图为参考（图生图，非文生图）\\*\\*生成 `{{产品三视图}}`+`{{产品细节图}}`（白底 16:9），外形/配色/品牌标对不上就重出，不可跳过；空间即产品（地产/酒店）以 `{{空间实景}}` 替代。\n- **产品防飘（每段必喂参考）**：SD2 生视频时，**每一段 15s 都要把同一组** `{{产品三视图}}`**+**`{{产品细节图}}` **作 image reference 喂进去**——不是只喂开头一段；产品出现镜要完整清晰不被过度遮挡，prompt 显式写\"产品严格以锚点图为准、不变形/不改色/不动 logo\"；逐段比对，一飘就查是否漏喂并重生该段。\n- **只做新中式国潮**：场景/道具/纹样/色彩/造型都不脱离国潮语言，不混欧美时尚/赛博等。\n- **风格种子固定**：MJ 统一 `--sref 4608797467 --profile nn1ntrp` + `--v 8.1`，不展示代码、不给选项、不许更换。\n- **造型分流**：先问人脸/造型参考图，按①只人脸②只造型③都有④都没有决定 MJ 是否带 image reference 及三视图人脸是否遮挡（**人脸图永不喂 MJ，只在 SD2 阶段喂**；有人脸图→三视图用白色圆形贴纸遮脸+右下角中文小字\"人脸单独提供 · 此图仅用于服装造型参考\"，无→留 MJ 脸）。MJ 只出一组正面图（尽量全身/大半身、`--ar 3:4`）跑一次 4 选 1（选项标 1 左上/2 右上/3 左下/4 右下），选定后 LibImage 扩写全身三视图锁 `{{Mixed N}}`。\n- **场景氛围图必为纯空镜 + 大场景**：只有环境、禁产品/人物/人影/手部/动物/文字/logo，prompt 显式写否定词（no people/no product/no text/empty scene）；且必须是**能容纳全身模特走位的全景/大远景空间**（挑高开阔、有地面纵深，非桌面装置或局部台面），带主体或太小塞不下人即不合格重出。\n- **场景由图承载**：分镜场景一律由选定的 `{{场景氛围图}}`（或 `{{空间实景}}`）承载，**正文不再文字描述场景/环境/色调**；实拍图品类每镜必须发生在 `{{空间实景}}` 内，不得另造虚构空间。**产品特写/微距/使用镜头也必须在选定场景内**（产品可静置于场景中的承托物上 + 浅景深虚化），**严禁跳白棚/纯色底**。\n- **两级节奏：表格一次确认、视频多条并发**：镜头内容的唯一确认关口是 5.0 的**整片分镜表格**（该多少秒列多少、全片一次出、一次确认；prompt 不再二次确认）；**视频为多条 15s prompt 并发同时生成、不逐段停顿确认**，各段以统一锚点保持一致、可顺序拼接。prompt 中文交付、作模型内部执行层，不需用户手动粘贴。\n- **两条必含镜头**：全片**至少一镜产品使用特写**（刷子扫粉/指尖抹乳霜/执壶注茶等真实使用动作，突出质地/功能）；**尾版必须模特与产品同框中近景**（能穿戴则佩戴、只能用/吃喝则手持），多段时按整片计（尾版在最后一段末镜）。\n- **强制人物介入**：每条片必有人像（完整出镜或手部/局部肢体），绝不通篇无人；运镜仍丰富展示产品/空间。\n- **默认不加 logo**：结尾不放 logo、不询问，除非用户明确要求；有 slogan 则视频模型随片直出字幕，无则产品 hero/画面自然收尾。\n- **SD2 生视频完全静音、声音全后期**：SD2 阶段**只出纯画面，不生成任何声音**（无 BGM、无音效/环境音、无旁白、无单音/乐器音/节拍）；成片声音只有 **BGM + 旁白（如有）** 两层，全部在 Step 6 后期加：BGM 固定为「中国古典乐器×现代电子的国风电子融合乐」（非纯民乐非纯电子）、BPM 随片、不询问用户、合成前按成片节奏/调性生成；旁白按 Step 2 选择后期 TTS/配音；**不做任何音效层**；混音旁白优先、BGM 不盖人声。\n- **字幕（选了旁白才有）**：仅当 Step 2 选了旁白时才可选字幕（中文/英文/中英双语/不要）；字幕与旁白文案一致，在 Step 6 合成前加入，样式简洁贴合国潮气质；未选旁白则不涉及字幕。\n- **视频比例 + 分辨率必须用户选**：比例（16:9/4:3/9:16/3:4）与分辨率（480p/720p/1080p）无默认，Step 2 必问，SD2 按此设置画幅与输出。\n- **影调强化**：每条 prompt 品质句后固定追加——通透明亮、层次清晰、色彩不发灰、光泽锐利，避免发闷/下沉，维持国潮高级通透感。\n- **运镜丝滑**：末尾固定加运动质量句（不掉帧/不卡顿/丝滑+自然动态模糊）；环绕/旋转类尤易掉帧，写\"缓慢匀速环绕、平滑连续旋转\"并放慢。\n- **镜头衔接**：不跳帧、不越轴（守 180°），机位与运动逻辑连贯；15s 段间续接保持 `{{Mixed N}}`/服装/场景/光线一致不穿帮。\n- 角色用 `{{Mixed N}}`，首现写全、后续复用、主宾清晰；演示型确保产品每镜清晰。\n- 一条片只承载一个核心信息点，前 3 秒抓人，结尾必有落点。\n- **表情自然可信，禁夸张怪异**；**禁叠画/叠化转场**；**禁粒子特效**（太土，改用干净光效/无缝变形/材质质感）。\n- 不做真实公众人物内容；不杜撰真实品牌虚假主张；保持适当无害。", "extras": [], "cn": "新中式美学TVC"}, {"slug": "old-town-documentary-narrator", "desc": "小城人文短片，非戏剧性情感叙事，轻松打造纪录片质感", "body": "---\n\n## name: city-memory-film\\\\\n\nnamespace: industry\\\ntitle: \"城市记忆叙事短片\"\\\ndescription: \"小城/旧街区人文叙事短片——低戏剧性日常事件链推进，靠观察积累情感而非戏剧对抗。核心工艺:剧本故事性构建六法(悬念埋线/人物有历史/关键物件复现两次且状态变化/场间留痕迹/预期落空/结尾双重含义)、人物动机小尊严大+台词绕路句式、空间必携带社会信息、镜头三分层时长表(短/中/长)+五段节奏结构、80%平叙首帧驱动+20%高强度多模态双路生成策略。日/夜/室内三套色调光线、首帧与视频双prompt公式+词汇库。10–16镜/1–3分钟，16:9(或4:3/2.35:1强调压迫感)。属纪实人文家族(与东亚文艺片/贾樟柯风格并列，工艺体系互不兼容，不可混用)。\"\\\nversion: 1\n\n# city-memory-film\n\n做小城/旧街区人文叙事短片时用本 skill。**核心不是记录苦难或怀旧，而是通过具体人物在城市空间中的真实行为、细节物件的复现、以及场与场之间的因果痕迹，让观众自己感受到变化**——靠观察积累情感，而非戏剧对抗。结尾不宣判，给观众一个变化后的空间或动作，不给完整答案。\n\n> 本环境适配：GPT Image / Image 2 → `generate_image_v3`；Happy Horse(FirstFrameToVideo) / Seedance 2.0(MultiModalToVideo) → `generate_video_v3`(以「首帧驱动 vs 多参考+高动态」表达两条路线)；resource_prepare_and_analyze → agent 自做解析；text_editor → `write_file_v2`；video_assembler → `composite_video`；旁白/BGM → `generate_audio`；`@资产` → `reference_nodes`+`{{NodeKey}}`。**旁白方式二(用 Seedance 生成旁白视频后多模态拆音频、作后续音色参考链)本环境无对应能力，正当删除**——本环境保留\"长旁白超过 15s 需分段生成\"的方法本身，分段统一走 `generate_audio` 同参数生成，不做音色链提取。运镜/写实/写提示词工艺全部内联本 skill，不依赖外部工艺 skill。\n\n## 一、全片流程与阶段依赖\n\n1. **故事命题获取（二选一）**：\n   - **用户已上传剧本/文字素材**：agent 自行解析，提取人物关系、核心冲突、场景列表、关键事件节点、关键物件。输出一句简洁的故事命题摘要，请用户确认后再进入步骤 2。**确认前不得进入步骤 2。**\n   - **用户未上传素材**：以卡片引导方式收集：故事发生的地点与时段、主角面临的核心困境或决定、另一个关键人物及其与主角的关系。信息不足时默认：时长 1–3 分钟、类型\"短剧情片\"。收集后输出一句简洁的故事命题供用户确认。\n2. 和用户确认并建立 Final_Video\\_[Spec.md](http://Spec.md)（片名、类型基调、场景设定、画幅比例、目标时长、视觉风格、输出语言）→ `write_file_v2`\n3. 生成故事板（关键元素、镜头列表、音频层）。故事板就绪后，扫描上下文中用户提供或已生成的资产，绑定至对应故事板槽位，再进行生成步骤。\n4. 设置元素：\n   - 用户已上传元素资产（人物参考图、场景参考图）：注册为锚点并绑定至对应关键元素。\n   - 否则：为所有关键人物和场景元素生成图像 → `generate_image_v3`。\n5. 为每个镜头生成首帧图（start_frame）→ `generate_image_v3`\n6. 按镜头类型分路生成视频：\n   - **叙事镜头〔平叙〕（约 80%）**：首帧驱动路线（Happy Horse 意图）→ `generate_video_v3`，以对应镜头 start_frame 作为首帧输入。\n   - **高强度镜头〔动态〕（约 20%，不超过总镜头量 20%）**：多参考驱动路线（Seedance 2.0 意图）→ `generate_video_v3`，引用对应元素图作为 reference。\n7. 生成 BGM / 旁白音效层 → `generate_audio`\n   - 旁白：统一用 `generate_audio` 生成；若旁白超过 15s，拆成多个段落分别生成，保持同一角色参数一致（音色链提取本环境无对应能力，见上文适配说明）。\n8. 完成全片时间线组装，旁白按分段顺序对齐至对应位置 → `composite_video`\n\n**依赖顺序**：2→1；3→2；4→3；5→3,4；6→3,5；7→3；8→6,7\\\n**暂停节点**：不得一次性跑完全部流程。在命题确认、故事板完成、元素图/首帧图完成、视频批次完成、音频生成后各暂停，等待用户确认再继续。\\\n**用户提供媒体时**：优先将其绑定至故事板对应槽位；不重复生成用户已提供的内容。\n\n### 建立 Final_Video\\_[Spec.md](http://Spec.md) 的指南\n\n- 片名调性：贴合故事类型与情绪，不做过度文艺化或商业化倾向。\n- 画幅比例：推荐 16:9；强调压迫感或亲密感时可选 4:3 或 2.35:1。\n- 视觉风格：与故事类型匹配，可以是写实、轻风格化或类型片视觉；**不强制低饱和**。\n\n## 二、剧本解析规则\n\n在用户上传了剧本文件或文字素材时，解析上传的文件（图片/PDF/文本，本环境按 agent 读文件能力处理），提取：人物关系（主角 + 亲密但疏离的人 + 带来变化的人）、空间列表、生活流事件链（5–8 个日常事件）、关键物件、关键动作与台词节点。输出一句简洁的故事命题摘要，以及结构化关键信息，供 Final_Video_Spec 和分镜设计使用。**不做年代判断或价值定性。** 文件无法解析或内容不完整时，向用户说明并请求补充。\n\n## 三、分镜设计（storyboard 核心工艺）\n\n### 3.1 核心气质\n\n- 强调人和人、人和环境的关系。场景并不是单纯的背景板，而是角色之一：场景也是叙事表达的一部分。\n- 戏剧冲突要低声：少用爆发式争吵，多用沉默、等待、绕路、没说出口的话、突然中断的日常。\n- 情节像偶然发生的，要落在具体生活动作里。\n- 结尾不宣判：给观众一个变化后的空间或动作，不给完整答案。\n\n### 3.2 剧本故事性构建（六法，核心叙事工艺，一条不可少）\n\n城市人文叙事片不依赖戏剧对抗，而是靠**观察积累情感**——通过人物在城市空间中的真实行为、细节物件的复现、以及场与场之间的因果痕迹，让观众自己感受到变化。\n\n- **开场埋一条悬而未决的线**：不解释，不总结——一个动作、一个物件、一个眼神，让观众带着问题往下看。\n- **人物之间有历史**：即便是陌生人的相遇，也要有一个隐含的\"为什么是这两个人\"的理由——地点、时间、一件旧物。\n- **关键物件至少出现两次**：第一次建立存在感，第二次状态已经变了——位置变了、损坏了、被人拿走了。\n- **场与场之间留痕迹**：前一场发生的事，后一场的空间或人物身上有迹可循，不做无因果的跳切。\n- **至少安排一次\"预期落空\"**：人物去做一件事，结果和预想的不一样——不是戏剧翻转，而是生活本来就这样。\n- **结尾动作有双重含义**：最后的动作或画面，可以是离开，可以是停留，可以是什么都没做——但要让这个选择有重量。\n\n### 3.3 人物设计原则\n\n- 人物动机要小，人物尊严要大：小目标背后是面子、旧情、身份、亲情或\"我还算不算一个有用的人\"等。\n- 台词要像绕路：人物很少直接说真实需求，常说\"没事\"\"路过\"\"你忙你的\"\"改天吧\"。\n- 情绪靠动作表达：抽烟、整理衣领、摸旧手机、反复开关打火机、抹桌子、等水烧开、看别人付款。\n\n### 3.4 场景选择\n\n- 空间选择服务于当前剧情关系与人物状态，不做硬性规定。\n- 任何空间都必须携带社会信息：标语、价目表、收款码、旧海报、施工噪音、电视新闻、广场舞音乐、方言广播——这些细节是叙事的一部分，不是装饰。\n\n### 3.5 关键元素设计\n\n- 优先设计**人物元素**（年龄、外貌、着装、正在做的事）和**场景元素**（地理环境、时段、光线条件、社会信息载体）。\n- 道具元素只在对多个镜头一致性有实质影响时才单独建立（如反复出现的旧手机、车票、收款码牌）。\n- 用户提供参考素材时，元素描述必须与参考内容一致，不得矛盾。\n\n### 3.6 镜头时长与节奏分层\n\n每段叙事由三种时长镜头混合搭建，节奏变化本身即是叙事信号——慢下来代表时间在这里凝结，快起来代表人物或空间正在运动：\n\n镜头类型时长功能与使用时机短镜头2–3s关键物件插入、情绪反应切、城市细节捕捉；制造节奏跳动或强调感中镜头6–10s人物行为展开、日常互动、空间内的移动与停留；叙事主干，占全片约 60%长镜头11–15s开场空间建立、情绪沉淀时刻、结尾余韵收束；每段叙事最多 1–2 个\n\n### 3.7 每段叙事的节奏结构（五段）\n\n- **开场建立段**：1 个中镜头或长镜头落地城市空间与人物处境——可以从一个行为开始，不必解释背景。\n- **观察展开段**：中镜头为主，展示人物在空间中的具体行为；每隔 2–3 个中镜头插入 1 个短镜头（物件特写或环境细节），打破视线节奏，积累信息密度。\n- **情感转折段**：用 1 个长镜头或慢节奏中镜头拉住时间，让人物的某个细微反应或选择有足够空间被看见。\n- **动态节奏段〔动态〕**：人物穿越城市空间、赶路、寻找时，用连续中短镜头推进节奏；标记为〔动态〕，走多参考驱动路线生成。\n- **结尾收束段**：最后 1–2 个镜头用中镜头或长镜头——给结果或情绪足够时间停留，不以短切收尾。\n\n### 3.8 全片节奏控制\n\n- 镜头总数建议 10–16 个（1–3 分钟片长）。\n- 避免全片时长均匀——节奏的疏密本身在说话。开场可以慢，中段跟随人物节奏起伏，结尾留白。\n\n### 3.9 景别\n\n- 开场建立城市空间与人物处境：中远景或全景，让空间先说话。\n- 人物互动或独处时：双人中景或单人中景，眼神与肢体可读。\n- 情绪积累或转折时：近景或特写，捕捉细微表情与手部动作。\n- 关键物件：插入镜头（cut-in），短促、明确（2–3s）。\n\n### 3.10 机位与运动\n\n- 常规观察性叙事：固定机位为主，或轻微手持跟随人物，优先让人物行为和空间自然呈现。\n- 〔动态〕场景（人物穿越街道、赶路、寻找）：跟拍或运动镜头，注明方向感和运动幅度。\n- **禁止**：炫技运镜、旋转镜头、纯装饰性航拍、无叙事功能的慢动作、多切镜等。\n\n### 3.11 构图\n\n- 人物可偏在画面边缘，留出大量墙面、街道、门框、窗户或空椅子。\n- 用门框、玻璃、栏杆、车窗、柜台把人物分隔开。\n- 新旧物件并置时不刻意强调对比，让它们自然共存在同一画面里。\n- **允许画面\"脏\"**：杂物、灰尘、旧瓷砖、塑料凳、电线、广告纸不要被清理掉。\n\n### 3.12 色调与光线\n\n- 日景：灰白天空、低饱和水泥色、旧红色标语、褪色蓝绿店招、尘土黄。\n- 夜景：钠灯橙、KTV 霓虹粉紫、手机屏冷光、路边摊荧光灯。\n- 室内：日光灯偏绿、电视冷光、窗外灰光；不要高级影棚质感。\n- 调色：低饱和、轻微颗粒、真实动态范围，保留暗部杂色。\n\n### 3.13 shot 描述规则\n\n- **每个镜头描述必须包含 4 维**：Scene（引用场景元素 + 时段光线）、主体动作（肢体/神态为主）、摄影语言（景别 + 运镜 + 焦点策略）、声音感（环境声/画内声）。\n- **镜头标签**：在镜头描述末尾注明生成路线标签——平叙镜头标〔平叙〕，强动态/切镜镜头标〔动态〕；〔动态〕镜头不超过总镜头量的 20%。\n\n### 3.14 台词规则\n\n- 每场最多 3–6 句台词；每句尽量短，允许方言词但不要堆砌。\n- 重要信息不要说全，让观众从动作和空间补齐。不写旁白解释主题。\n- 可用句式：\"你回来也不说一声。\" / \"路过。\" / \"现在都扫这个。\" / \"我没有那个。\" / \"那算了。\" / \"你先忙。\"\n\n### 3.15 音频层设计\n\n- BGM（可选）：若使用，选择极简器乐或无调性环境音景；禁止流行音乐节奏。\n- 不以对白驱动叙事。\n\n### 3.16 质检清单（输出前自检）\n\n- 是否至少 60% 镜头是中远景、固定机位或缓慢运动？\n- 是否有 2 个以上公共空间？\n- 是否有画内声音而不是外加煽情配乐？\n- 是否删除了\"他终于明白了\"\"这是命运的安排\"等直白总结句？\n- 是否避免直接复用任何现成电影的角色、台词、场面和剧情？\n\n### 3.17 禁止事项\n\n- 不要把故事写成苦难堆砌或价值宣判；人物要有幽默、虚荣、笨拙、体面和生活惯性。\n- 不要用旁白解释主题或时代意义。\n- 不要让每场戏都承担剧情功能；允许无用的等待和偶然的路人，但它们必须增加空间真实感。\n- 不要过度诗化世界。美感来自观察，不来自金句和滤镜。\n\n## 四、素材生成策略（80/20 双路，media 适配 13 工具）\n\n### 4.1 元素图生成\n\n- `generate_image_v3`，2K。\n- 若用户已上传参考图（人物 / 场景），将其注册为锚点并绑定至对应故事板元素槽位，优先用于替代生成。\n\n### 4.2 首帧图生成（每个镜头的 start_frame）\n\n- `generate_image_v3`，2K。\n- 首帧图须与故事板镜头描述的景别、光线、主体姿态严格一致，作为视频生成的视觉锚点。\n\n### 4.3 镜头视频生成（按路线分流）\n\n- **平叙镜头〔平叙〕（约 80%）**：首帧驱动路线，以对应镜头 start_frame 作为首帧输入，`generate_video_v3`。\n- **动态镜头〔动态〕（不超过总镜头量 20%）**：多参考驱动路线，`generate_video_v3`；引用该镜头涉及的角色/场景元素图作为参考，同时以 start_frame 作为首帧参考；仅限强烈冲突、快速切镜或高速人物动态场景使用。\n\n### 4.4 音频层生成\n\n- 旁白（如有）：`generate_audio`；若旁白超过 15s，拆成多个段落分别生成，保持角色音色描述参数一致（原方式二的\"生成后拆音色作后续参考\"链本环境无对应能力，见开头适配说明，正当删除）。\n- BGM：`generate_audio`，风格描述为极简器乐 / 环境音景；不生成歌词类音乐。\n\n### 4.5 失败处理\n\n- 任一模型生成失败时，优先在同工具内重试；不自动切换至其他视频生成工具，停止并告知用户，由用户决定是否更换路线。\n\n## 五、提示词写作规范\n\n### 5.1 首帧图 / 元素图 Prompt\n\n核心逻辑：捕捉\"决定性瞬间\"，强调胶片色彩质感、真实光影与空气感；摒弃运镜和节奏词汇。\n\n**Prompt 公式**：\\[画面主体与微小动作\\] + \\[空间环境与社会信息载体\\] + \\[空气感\\] + \\[光线状态\\] + \\[摄影语言与景别\\] + \\[色彩体系与胶片质感\\] + \\[风格参考\\]\n\n**核心词汇库**：\n\n- 主体与微动作：人物背影 / 抽烟的双手 / 凝视窗外 / 停顿的发呆瞬间 / 整理衣领 / 摸旧手机\n- 空间社会信息：褪色标语、收款码贴纸、旧海报、价目表、施工围挡、旧挂历\n- 环境与空气感：弥漫的灰尘 (dusty air)、清晨的水汽 (morning mist)、潮湿感 (dampness)、热浪 (heat haze)\n- 光线状态：自然光 (natural light)、窗边柔和侧光 (soft window light)、日光灯偏绿 (fluorescent greenish)、钠灯橙光 (sodium orange)、阴天漫反射 (overcast diffused light)\n- 摄影语言：Medium shot / Full shot / Close-up（克制使用）/ 极简构图 / 留白 (negative space) / 门框遮挡 / 玻璃反射\n- 色彩体系：Kodak Vision3, Fuji Eterna, ARRI Alexa Natural, low saturation, soft highlights, detailed shadows, real skin tone, slight grain\n- 风格参考：贾樟柯 (Jia Zhangke), 是枝裕和 (Hirokazu Kore-eda), Magnum Photos, Leica Documentary\n\n**示例 Prompt（首帧图）**：\n\n> 真实中国小城生活流电影画面，2001 年冬天傍晚，长途汽车站旁的小卖部；一个穿旧黑夹克的青年站在门口，手里攥着皱掉的车票，迟迟没有进去；构图：固定中远景，人物在画面右侧边缘，前景是贴满褪色广告的玻璃门，中景是小卖部柜台，背景有候车室冷白灯和来回走动的乘客；光线色调：灰蓝天光混合日光灯偏绿，低饱和，水泥地反光，轻微颗粒；Kodak Vision3 film stock, real skin tone, soft highlights；贾樟柯美学，观察性，安静，真实；避免：精致广告感、强烈逆光、过度美颜。\n\n### 5.2 视频 Prompt\n\n核心逻辑：聚焦\"时间的流动\"与\"长镜头观察感\"；动作完成后仍多看一眼；环境声优先于配乐描述。\n\n**Prompt 公式**：\\[真实中国小城生活流电影画面，年代/季节/时间，地点\\]；\\[人物外貌与服装\\] 正在 \\[具体动作\\]；构图：\\[景别，人物位置，前/中/背景层次，遮挡关系\\]；光线色调：\\[光线类型\\]，低饱和，轻微颗粒，生活质感；镜头：\\[运动类型\\]，\\[时长\\]，动作自然发生，保留停顿；声音感：\\[环境声/画内音乐/广播/车声\\]；避免：精致广告感、过度美颜、戏剧化表演、夸张泪水、强烈电影灯、炫技运镜\n\n**运镜词汇（严格克制）**：Fixed camera（固定镜头）/ Slight handheld breathing（微弱手持呼吸感）/ Extremely slow push-in（极慢推进）/ Extremely slow pan（极慢横移）；**禁止**：旋转、快速推拉、无人机、MV 式快切\n\n**声音感描述参考**：远处客车倒车提示音、售票窗口广播、麻将声、电视新闻声、KTV 漏音、施工声、广场舞音响、手机短视频外放\n\n**示例 Prompt（平叙镜头）**：\n\n> 真实中国小城生活流电影画面，2001 年冬天傍晚，长途汽车站旁的小卖部；一个穿旧黑夹克的青年站在门口，手里攥着皱掉的车票，迟迟没有进去；构图：固定中远景，人物在画面右侧边缘，前景是贴满褪色广告的玻璃门，中景是小卖部柜台，背景有候车室冷白灯和来回走动的乘客；光线色调：灰蓝天光混合日光灯偏绿，低饱和，水泥地反光，轻微颗粒；镜头：固定机位 12 秒，青年抬头看一眼站牌又低头，动作自然发生，保留停顿；声音感：远处客车倒车提示音、售票窗口广播、塑料袋摩擦声；避免：精致广告感、强烈逆光、夸张表情、快速剪辑、现代豪华街景。\n\n## 六、剪辑与输出（`composite_video`）\n\n### 6.1 节奏原则\n\n- 长镜头优先，保留完整的时间流动感；不为追求\"有趣\"而剪短镜头。\n- 镜头间可用 0.5–1s 的黑场或声音延续过渡，制造呼吸感。\n- **禁止**快剪、音乐卡点、特效转场、TikTok 节奏。\n\n### 6.2 音画关系\n\n- 完成全片时间线组装，旁白按分段顺序对齐至对应位置。\n- BGM（如有）音量 0.1x；淡入淡出，不抢画面。\n- 不做强制音画同步；画面与声音各自自然流动。\n\n## 相关\n\n- **边界(勿用本 skill，改道)**：强戏剧冲突叙事 → cinematic-flow；名导风格整片(贾樟柯乡土纪实美学) → jia-zhangke-style；情绪氛围驱动、无事件链的东亚文艺片 → east-asian-mood-film（工艺体系与本 skill 互不兼容，不可混用）。\n- 本 skill 自足内联，**无源生跨 skill 依赖，不设配合表**。", "extras": [], "cn": "老城叙事人文片"}, {"slug": "oriental-aesthetic-film", "desc": "仙侠氛围美学短片", "body": "## 一套仙侠氛围底质 + 一句可选主色（阶段 1 提炼，全片统一）\n\n全片一套渲染底质（唯美光影、浅景深柔焦、电影级质感），**场景图套用固定风格种子（**`--sref 4482956243 --profile baq4x24`**）以强化跨地点的统一质感，同时仍靠共享风格描述文本反复套用来加强一致性**；**全片影调最终以用户确认的那组场景图调性为准，视频成片需无限靠近场景图的柔焦柔光质感——同样的柔焦滤镜、柔光、雾气笼罩，不得比场景图更锐利清晰**，人物图/道具图生成时也需向已选场景图的色彩基调看齐。从氛围基调再提炼一句主色附到场景图 prompt。\n\n- **共享风格描述（场景与 Seedance 通用基底，任何地点都适用，精简版，中文）**：`东方仙侠氛围电影画面。柔和自然光线，晨雾、霞光、烛影或月色等意境光效，柔焦朦胧氛围，光影通透。电影级写实质感，HDR，8K细节，肌理真实，色调统一唯美通透。`\n- **建筑/环境子句（可选，仅该场景确含建筑/庭院元素或用户明确需要宫阙庭院氛围时才追加，不强调尺度）**：`可含仙宫楼阁、庭院回廊、雕花窗棂等古风建筑元素作为背景，细节精致而非强调体量与尺度对比，光影氛围优先于建筑规模。`\n- **场景图额外追加**：`大全景/广角空境构图，展现开阔空间与纵深层次，前景到远景清晰可见、无浅景深虚化，纯地貌空镜绝无人物`，接共享描述（+ 建筑/环境子句，如适用）后，再接该地点自身的地貌/环境细节（如竹林、雾林、庭院 相加需明显低于1024，超了先精简角色卡描述里的次要形容词。**每角色出齐后一次性四选一确认**（标明 1 左上/2 右上/3 左下/4 右下），选法与场景图四选一一致。维护 **cast sheet**。\n- **人物三视图**：以用户从 Midjourney 四选一中**选定的那张图作参考图输入**，只补生侧/背，出**16:9 单张纯白底三视图，排版按有无原脸分两种**：**无原脸（Case1 无脸/Case3）**→ 左侧为正面大头特写（近景头肩，清晰呈现妆容发饰）+ 右侧全身三视图（正面/侧面/背面并排），整张连续无拼接缝，脸保留可见（脸即身份）；**有原脸参考（Case2）**→ **只出全身三视图（正面/侧面/背面并排），不含左侧大头特写面板**，头部区域用**圆形贴纸完全遮住**，**右下角小字标注**（按用户语种）\"人脸单独提供·仅供服装参考\"，身份以原脸图/视频在 Seedance 端锁定。提示词写明\"脸型骨相/妆容发饰/服装道具细节与参考图完全一致，仅调整视角\"；排版正向词补充 `single seamless white background canvas, no panel dividers, no borders between poses, continuous studio photograph, not a collage`。一致性靠选定的 Midjourney 参考图+角色卡描述。\n- **道具锚点图**：仅需跨镜锁定的核心道具才出，直接依据道具卡文字描述生成，16:9 纯白底单张连续画布，内含道具正面全图+三视图细节（正面/侧/背，可加 1–2 处纹样/工艺特写贴角），无分隔线拼接感。维护 **道具单（props sheet）**：道具名/归属角色/【锁定/不锁定】/三视图链接。\n- **视频**：单次最长 **30s**，内部镜头切换只用硬切、不生成任何转场特效或字幕。输入 = 该段涉及地点的场景图（跨地点多张、单地点一张）+ 每角色**同一张三视图**（锁脸锁妆造）+ 每件锁定道具**同一张三视图**（不锁定道具不出图，靠文字带出）+（有原脸时）原脸图作身份锚点；**多段续接时只传文字连戏描述，不传上一段的视频或尾帧图像**（见阶段4b）。\n\n---\n\n## 流程（逐阶段暂停确认）\n\n### 阶段 0 · 开拍前问询卡（按顺序问，可一次性列出，第5问按第4问结果决定是否出现）\n\n**不问剧本/文本**，本 skill 从\"氛围+身份\"出发直接展开，不依赖完整剧本：\n\n1. **整体氛围/情绪**：先问用户想要的氛围基调（如仙气飘逸、清冷孤傲、温婉唯美、邪魅妖异、热血侠气等，可多选或另写）。**这一步是全片总纲**——同时决定视觉基调（场景光影/主色）与阶段6配乐的情绪走向，必须最先确定。\n2. **主角身份设定**：问用户想要的主角身份（如侠客、剑修、散修、仙人、门主、魔道中人等东方仙侠原型，可多选或另写，也可自定义描述）。**默认单主角人像片，若用户后续需要配角/多人物同样支持**，按阶段1的多角色分批机制处理，不做人数限制。\n3. **有无角色人像参考图**：问用户是否有想指定的人像参考图。**有则等待用户上传，收到后直接由图像判断性别，不再另外询问**；**没有参考图则追加一问角色性别**（男/女/或用户自定义，如中性等），作为阶段1原创设计人物卡的基础信息之一。\n4. **是否需要旁白/对话**：三选一——(a) 用户自己写文案，等待用户输入或上传文本；(b) 由我根据主角身份+氛围拟 1–2 句精简 slogan（风格不固定，文言短句或现代诗意短句均可，视身份气质灵活选择，阶段1连同人物卡一起产出供确认）；(c) 完全不需要，纯氛围无人声。**选 (c) 时直接跳过第5问，进入第6问**。\n5. **字幕**（仅当第4问选 (a) 或 (b) 时才问）：要/不要，要则选简体/繁体/英文/双语（阶段6直接按此加，不再问）。\n6. **画幅**：16:9/4:3/1:1/9:16 平等列出、不作推荐，必须用户自选。**这是最终视频成片的画幅，与阶段2人物造型图固定的 3:4 默认画幅是两回事，互不影响**。\n7. **时长**：30s/60s/90s/自定义（填空，如 150s→按 30s 向上取整分 5 段）。\n\n> **分辨率不问，默认 720p**。以上问题按顺序问完（第3问是否追加性别取决于有无参考图，第5问是否出现取决于第4问）→用户答完→进阶段 1。\n\n**角色造型三 Case（阶段 1 深化人物卡时才细问参考图具体用途，不在阶段0细问）**：**无论哪个 Case，用户提供的参考图都不作为图像输入喂给 Midjourney 或 Seedream 生成**——Case1 参考图仅作**造型/服装参考**（不锁脸）→ 由 Claude 目测参考图后把服装/造型细节转译进角色卡文字描述，Midjourney 纯文字生成，无原脸，三视为左大头特写+右全身三视图；Case2 参考图**含清晰人脸、需要锁脸**→ 原脸图**直接留到 Seedance 端作身份锚点使用**，不进入 Midjourney/Seedream 的任何生成调用，**三视只出全身三视图（不含大头特写面板），头部圆形贴纸遮挡+右下角小字标注**；Case3 **无参考图**→按身份设定/性别补 spec 原创设计，无原脸，三视为左大头特写+右全身三视图，脸即身份。三 Case 均要求电影级选角与妆造，避免短剧网红脸。若阶段0第3问回答\"有参考图\"，阶段1收到图后需追问一句\"这张图主要用来锁脸还是锁全身造型，还是两者都要参考\"，据此判定走 Case1 还是 Case2。\n\n**仙侠古风妆造语言（补 spec 时用，不锁朝代，按性别）**：女 `flowing wide-sleeve hanfu or Taoist robe, silk ribbon sash drifting, layered cloud-shoulder cape, jade or gold hairpin, flowing high bun, delicate traditional makeup with floral forehead ornament and soft lip colour`；男 `Taoist/cultivator robe with wide sleeves, waist sash with jade pendant, topknot with jade or wooden hair crown, refined understated makeup with clean brow line`；共通 `real silk/brocade/gauze textures with natural drape, exquisite embroidery and hair-ornament craftsmanship visible in close-up, no contemporary fabric/cut/accessories`。身份门派或性格可微调配色纹样与妆容浓淡（清冷偏素雅、妖异偏浓艳），不改造型基线。\n\n### 阶段 1 · 身份与氛围展开 + Final_Video_Spec\n\n**不解析剧本**，基于阶段0确认的**主角身份 + 氛围基调 +（如有）人像参考图 +（如选(b)）待拟 slogan**，主动展开人物/道具/场景设定，**输出表格停一次，不生成任何图片**。\n\n- **人物卡起草**：按身份设定 + 仙侠妆造语言库草拟主角人物卡（外观/妆造要点/气质基调）；若阶段0第2问涉及多人物，为每个角色分别起草，同一角色反复提及则去重合并。\n- **场景自动推荐（核心机制）**：**根据主角身份 + 氛围基调自动草拟 2–4 个场景推荐**（例如\"侠客+热血侠气\"→夜色客栈、竹林山道、溪畔石桥；\"仙人+仙气飘逸\"→云端仙山、瑶池、丹房），列出后请用户**确认或增减**，不要求用户从零描述场景；用户也可以直接推翻改用自己想要的场景。\n- **道具自动推荐**：同理按身份原型给出典型道具建议（侠客→佩剑/酒葫芦，仙人→拂尘/玉佩，剑修→本命剑等），列出后用户确认增减，并据此判断锁定/不锁定。\n- **slogan 起草**（仅阶段0第4问选 (b) 时触发）：根据主角身份+氛围拟 1–2 句精简文案，风格不固定（文言短句或现代诗意短句，按身份气质灵活选择），随人物卡一起给用户确认；确认后的文案即为阶段5人声与阶段6字幕的文本来源。\n- **信息不足必须停下问，不能瞎补**：人物/场景/道具中描述仍不清楚的条目标记 **⚠️信息不足**，列出需补充的具体问题，等用户补充后才进入该条设计；\"完整\"条目不受影响。\n- **输出格式**：先报\"识别到 X 人物/Y 场景/Z 道具\"，附氛围基调一句话；人物表（编号/姓名/身份标签/外观妆造要点/状态）、道具表（编号/名称/归属/外观/锁定判断/状态）、场景表（编号/名称/室内或室外/是否含建筑或庭院元素/光影氛围描述/是否专用空镜/状态）。**\"是否含建筑或庭院元素\"仅作为场景图是否追加环境子句的参考，不涉及尺度强制**。\n- **道具锁定判断**：核心信物/反复出现的饰品或法器默认【锁定】；一次性摆设默认【不锁定】；拿不准默认不锁定。\n- **口语语言**：默认用户输入语言；混用/不明确才追加一句询问。\n- **参考图用途确认**（若阶段0第3问回答有参考图）：追问\"这张图主要用来锁脸还是锁全身造型，还是两者都要参考\"，据此判定走 Case1 还是 Case2；**无论哪种，参考图本身都不作为图像输入提交给 Midjourney 或 Seedream**——造型信息转译为文字写入角色卡，人脸信息留到 Seedance 端直接使用。\n- **分批处理**：人物/道具/场景任一类超 8 个自动分批，每批≤8，按首次出现顺序，表格下方注明分批计划；每批做完停一次问是否继续，除非用户说明不用逐批确认。\n- **Final_Video_Spec**：画幅（阶段0第6问）/分辨率（默认720p）/时长（阶段0第7问，每30s一段）。\n\n> 暂停确认（三张表+状态标注+参考图用途确认+slogan草案（如有）+spec 一次性一起停）。\n\n### 阶段 2 / 2.5 / 3 · 角色·道具·场景资产生成（三线并行发起，确认顺序不变）\n\n> **三条生产线（人物/道具/场景）中，人物线的\"四选一造型图\"这一步可以和道具线、场景线同时发起生成调用以节省时间**；但**人物线内部本身是两步序进**（Midjourney 四选一确认后才能交给 Seedream 出三视图，不可并行跳过确认），互不依赖的是三条线之间、而非人物线内部的两步。**给用户看结果与逐一确认的顺序仍按 2→2.5→3 进行**，不因为并行发起就打乱确认节奏。各类超 8 个均按阶段 1 分批计划走，每批做完停一次问是否继续。\n\n**阶段 2 · 角色设计（Midjourney 出四选一 → Seedream 出三视图，具体 prompt 构造见\"固定种子与出图规格\"表）**：每角色写角色卡（含妆造细节：眉眼/唇色/花钿/发饰工艺；若用户有造型参考图，由 Claude 目测转译进角色卡文字描述，不作图像输入）→ Midjourney 生成四选一确认（标明 1左上/2右上/3左下/4右下）→ 切换 Seedream 以选定图作参考生成三视图 → 逐项核对脸/妆造/服装是否与选定图一致，漂移则重补 → 一次性确认全部三视。维护 cast sheet；换装则回 Midjourney 重出四选一。\n\n> 四套须整体搭配+发型+妆容都拉开区别，禁止只换袍色其余不变；人物长相与妆造须走电影质感，避免网红脸/短剧感；**三视图必须是单张连续白底，不能出现分栏/边框/拼接的多宫格感**（四选一阶段沿用与场景图一致的标准 Midjourney 四宫格选图方式，不强求单张连续画布）。\n\n**阶段 2.5 · 道具设计（Lib Image，仅锁定道具需要，与人物图/场景图完全独立）**：【不锁定】道具跳过，留到分镜/场景阶段文字带出；【锁定】道具逐样出图——写道具卡（材质/纹样/尺寸/工艺细节）→ **直接依据道具卡文字描述生成，不引用任何人物三视图或场景图作参考**→ 一次性出全部锁定道具单张纯白底连续画布（正面图+三视图细节，无拼接缝）→ 一次性确认（核对材质纹样比例）→ 偏差则以正面图重生侧/背。维护道具单。中途新增道具随时补出。\n\n**阶段 3 · 场景影调图（Midjourney V8.2，不可用则 V8.1，固定套用场景风格种子** `--sref 4482956243 --profile baq4x24`**）**：按场景清单一起出（不要一场出完再出下一场）：每地点**各出 1 组 4 张**，**纯地貌空镜、绝不出现人物**（负面词额外加 `person, human figure, people, model, character`），Prompt = 共享风格描述 +（含建筑/庭院元素时可选追加环境子句）+ 该地点自身细节 + 主色 + 画幅文字描述 + 无人负面词 + 尾串固定为 `--sref 4482956243 --profile baq4x24`（版本由工具调用参数指定为 V8.2，不可用则 V8.1，不写入prompt文本）的尾串，**prompt 保持精简（≤1024 字符）**。**场景图按「地点」出全景，一个地点一组、跨镜跨段复用**；不为特写/局部单独出图，这些交 Seedance 在同一全景上取景；组数=去重后的地点数。**全部出齐 → 一次性暂停让用户逐地点四选一**（标明 1 左上/2 右上/3 左下/4 右下）→ 收齐才进阶段 4，严禁未经四选一就往下走；**任何一张若出现人物需重新生成**。**该场景图确定后的调性即为全片影调基准**，后续人物/道具/视频生成都需向其色彩质感看齐。\n\n### 阶段 4 · 氛围分镜表格（生视频前必出、需确认）\n\n**一次性出全部分镜表**（按段数，不要一段一停），每段一表，列：镜号/时长/景别（氛围空镜/妆造服装特写/人物中近景/可选对白或战斗/其他）/画面（调度与妆造呈现重点）/**道具锚点**/**场景锚点**/声音层（环境音效为主，若有独白/对白则标注原文与语气）/运动。**转场统一为硬切，不设转场列**。\"景别\"列默认以**氛围空镜**与**妆造服装特写**为核心，每段至少各出现 1 次；其余镜头按人物中近景为主分布，若有对白/战斗镜头按需插入、不强制比例。空镜行画面列只写景观调度、声音层可留白仅环境音效、道具锚点留空。\\\n表格下方附**连戏 bible**（不进表）：角色身份/造型/持有道具/站位/场景主色光效时辰/多段时上一段结尾→下一段开头的文字衔接描述。\\\n每段每 30s ≥6 镜（正常6–8镜，据氛围决定）、至少 1 氛围空镜、至少 1 妆造/服装细节特写；若有台词则记录口语原文供阶段 6 做字幕。\n\n> **暂停确认（一次性）**：全部分镜表+造型图+三视图+道具图+场景图一起停。**分镜表一次性全出只停一次；视频（阶段5）相反——逐段生成逐段确认**。\n\n### 阶段 4b · 多段连戏续写（60s+ 关键机制，逐条生，纯提示词续写、不喂视频帧）\n\n每生完一条 seg_n → 停下等确认 → **仅用文字记录**该段结尾的站位/表情/光线/景别/道具状态（连戏 bible 已含基础信息，此处按需补充细节）→ 把这些文字信息写入 seg_n+1 的前置 prompt 中，**不将 seg_n 的视频或截取的尾帧图像作为图像输入喂给 Seedance**，seg_n+1 完全基于三视图/场景图/道具图 + 文字连戏描述重新生成。接缝模式：**(A)连续动作**——文字描述延续同一动作节奏；**(B)换场**——文字描述保持角色/妆造/道具/色板/光线一致、构图换新；两种模式在装配阶段都以**硬切**相接（不用任何风格化转场特效）。\n\n### 阶段 5 · Seedance 2.5 视频（强制该版本，每段一条 30s，逐条生）\n\nprompt 结构：①前置风格句；②**组装**——喂该段涉及地点的场景图（按分镜\"场景锚点\"取用）+ 每角色三视图（锁脸锁妆造，不再用四选一图）+ 每件锁定道具三视图（按分镜\"道具锚点\"取用，不锁定道具靠文字带出）+ 有原脸时原脸图另作身份锚点，写明\"脸与妆造取自三视图、道具形制取自道具三视图\"；③**分镜**：`Shot1…hard cut to Shot2…`，一条连续 30s、镜数达标、至少 1 氛围空镜 + 至少 1 妆造/服装细节特写，**镜头切换只用硬切，绝对不允许出现叠化/交叉溶解/淡入淡出等任何转场动画或特效画面，没有例外**；④**声音层**：默认只写环境音效；若阶段0第4问选了(a)或(b)，按该镜声音层分工填入独白/对白（标说话人，口型同步），提示词按用户语种、台词填确认后的文案原文（自写文案或阶段1确认的 slogan）；⑤**运动**：按每镜景别从「镜头词汇表」挑选对应词条组合成运动描述，其中\\*\\*\"柔焦柔光/背光侧光/雾气\"与\"妆造/服装细节特写\"为每镜强制叠加项\\*\\*（贴近场景图质感），**人像镜头占比需高于空镜、多用大特写**；如该镜为可选动作点缀，追加词汇表中\"御剑/战斗点缀\"词条；⑥**音频+文字规则**：正面写环境音效（+可选人声）；负面追加标准负面词库（已覆盖 BGM/字幕/转场特效/人潮/现代元素等）。\\\n**表演**：逐镜≥1 表情+1 微动作，按情绪基调赋予，电影级表演质感。**通用治僵硬（每镜加）**：`natural subtle atmospheric sway, breathing on wide/close shots, micro head movement, natural blink, expression matching scene mood, robes/sleeves/ribbons/hair/mist drifting subtly`。\n\n> **分段生成+强制确认门**：一段一段生，每段生完必须停下等确认才生下一段，严禁不经确认连续生。\\\n> \\*\\***人声兜底**：若模型对无对嘴 VO 支持不稳，退回装配阶段做 TTS/录音叠加，其余规则不变。\n\n### 阶段 6 · 装配\n\n1. **顺接**：各段以**硬切**拼接，**绝对不允许出现叠化/交叉溶解/淡入淡出等任何转场特效，没有例外**；片段已含环境音效（+可选人声）、无 BGM、无转场画面。\n2. **合成前一步**：①**加字幕** `add_subtitle`（**仅当阶段0第4问选了(a)自写文案或(b)AI代拟slogan时才有此步骤；若选(c)纯氛围无人声，直接跳过字幕环节**）——按阶段0第5问确认语种直接加（可编辑叠加层，不烧进帧）；**样式固定**：纯白字、**无描边**、字号 **28px**、**单行不换行**、字体 **思源宋体**（Source Han Serif，衬线体）；②**铺国风电子配乐**——传统乐器音色（古筝/箫笛/编钟/古琴）与电子节拍/合成氛围底噪融合的**国风电子（guofeng electronic）风格配乐，随镜头氛围与情绪起伏，只描述风格不指定具体曲目，音量不压过环境音效或人声；③叠图**——片名/时间戳/credits/logo PNG（不烧进生成画面）。\n3. **合成导出**：压平合成为成片。\n\n---\n\n## 参考数据\n\n### 镜头词汇表（转场统一为硬切，不再单列转场词条）\n\n镜头关键词妆造/服装细节特写（核心强制）`macro close-up on hair ornament or embroidery craftsmanship, shallow depth of field, soft directional light highlighting texture`慢镜升格（头号招牌）`slow-motion, flowing wide sleeves and hair drifting gracefully in the wind`焦点转移`rack focus from soft blurred foreground to sharp close-up on facial makeup or accessory detail`逆光剪影/柔光轮廓`backlit silhouette with soft golden rim light, gentle lens flare`环绕运镜`orbiting camera revealing the full costume silhouette`氛围空镜（核心强制）`static or gently drifting shot of mist, floating petals, rippling water, candlelight flicker, no figures`云雾穿梭（运镜非转场）`camera moves through drifting mist within a single continuous shot, revealing more of the scene`中长焦浅景深`85-135mm portrait telephoto, shallow depth of field, softly blurred background`柔焦柔光/背光侧光/雾气（强制，逐镜贴场景图质感）`soft focus filter softening the whole frame, gentle diffused soft light, backlit portrait with glowing rim light or side lighting sculpting the face, ambient mist drifting through the frame`御剑/战斗点缀（可选）`brief flying-sword traversal within one continuous shot, close-up glowing sword-qi trail, camera gliding alongside subject`俯瞰镜头（氛围用途）`high establishing shot of the misted landscape, soft atmospheric haze`\n\n### 节奏 → 每 30s 镜数（硬底线6镜，正常6–8镜，镜头切换一律硬切）\n\n节奏镜数说明氛围空镜1–2（须含至少 1 氛围空镜）长镜头+缓慢移动；硬切妆造/人物呈现4–6大特写/近景为主，柔焦柔光+背光或侧光贴近场景图质感，穿插焦点转移与慢镜；硬切人声点缀（如有）2–4独白/对白配近景特写，其余镜头氛围铺垫；硬切动作点缀（如有，可选）1–2御剑/剑气特写等穿插于氛围镜头之间；硬切\n\n> 每 30s 不得少于 6 镜（唯一例外：用户明确点名一镜到底），正常排在 6–8 镜、具体根据氛围节奏决定；每 30s 至少 1 氛围空镜 + 1 妆造/服装细节特写；其余镜头以人物中近景为主；动作/人声镜头为可选点缀，不设强制比例；镜头切换只用硬切。\n\n### 场景库（氛围向，弱化建筑与尺度）\n\n晨雾漫林、竹林小径、月下庭院、烛影书阁（室内）、花海/落花溪畔、云端楼阁（可选）、雪夜梅林、湖心亭台、溪畔石桥、古井回廊、星野天河、桃花幻境、悬崖远眺。长片可重访同一地点换光线/机位/时辰。\n\n### 道具库参考（锁定判断）\n\n通常锁定：主角随身饰品（发簪/玉佩/香囊）、关键信物、常配戴的兵器或法器。通常不锁定：一次性摆设、群体背景道具。拿不准默认不锁定。\n\n### 注意\n\n- 不写真实门派/作品/演员姓名当 prompt；仙侠感靠描述词承担。\n- 画面禁现代元素（强制，见标准负面词库），适用于全部工具。\n- 人物四选一造型图固定用 Midjourney V8.2（不可用则 V8.1，固定人物专属风格种子 `--sref 4937405977 --profile gt1hrhk`），人物三视图固定用 Seedream 5.0 Pro（基于选定的 Midjourney 图生成），场景图固定用 Midjourney V8.2（不可用则 V8.1，固定场景专属风格种子 `--sref 4482956243 --profile baq4x24`），道具图固定用 Lib Image，视频固定用 Seedance 2.5，均不得替换，人物与场景两个 sref/profile 也不得混用。三者出图/出视频均不生成转场特效或文字/字幕，人物三视图与道具三视图都必须单张无拼接缝，人物/场景图每次一组 4 张四选一。\n- 用户只要片段/单镜、或已指定场景造型时，在不破坏红线与核心规则下按需灵活处理。\n- 与叙事向短剧版本的核心区别：去掉极致尺度对比、巨构主义锚点、三层声音强制并行、强反转叙事驱动、战斗镜头多样性强制；新增妆造服装细节特写强制、氛围空镜意境化、国风电子配乐；人声与战斗动作降级为可选点缀。阶段0 不问剧本，改按氛围→身份→参考图（无参考图追问性别）→旁白需求→（条件性）字幕→画幅→时长发问，阶段1据身份+氛围自动推荐场景道具供确认。\n- 人物设计为两步两工具：Midjourney（人物专属种子）出四选一，用户选定后交 Seedream 出三视图；**四选一不链接用户上传的原始参考图**——参考图仅由 Claude 目测转译进角色卡文字（造型信息）或留给 Seedance 端作身份锚点（人脸信息），不作为图像输入提交给 MJ/Seedream；MJ 一次出的 4 张是同一角色的 4 种变体，非\"4个角色拼一张图\"。", "extras": [], "cn": "仙侠氛围美学短片"}, {"slug": "paper-art-stop-motion-director", "desc": "制作纸艺、剪纸、手工拼贴、分层纸景和绘本动画感的图片和视频", "body": "# 纸艺剪纸定格风导演 Skill\n\n## 0. Skill 定位\n\n### Skill 名称\n\n**纸艺剪纸定格风导演**\n\n### Skill 简介\n\n这是一个用于制作纸艺、剪纸、纸片定格、手工拼贴、层叠纸景、绘本动画感图片与视频的完整创作 Skill。\n\n它不是普通平面插画生成器，也不是简单剪纸滤镜，而是一个能够从用户主题开始，逐步完成创意方向、纸艺角色、纸片场景、分层布景、道具资产、图片提示词、分镜设计、5 秒视频提示词、剪辑声音与审核规则的纸艺动画导演。\n\n### Skill 目标\n\n帮助用户稳定完成：\n\n- 纸艺角色设计\n- 纸片场景设计\n- 分层纸景规划\n- 道具资产规划\n- 单图 / 系列图提示词\n- 5 秒图生视频提示词\n- 15 秒 / 30 秒 / 60 秒纸艺短片分镜\n- 剪辑节奏、运镜、转场、音效与审核\n\n---\n\n## 1. 适用场景\n\n本 Skill 适合：\n\n- 儿童故事\n- 国风寓言\n- 公益广告\n- 品牌短片\n- 绘本视频\n- 节日短片\n- 手工风 MV / 概念片\n- 纸艺海报\n- 纸片定格动画短片\n\n---\n\n## 2. 风格总原则\n\n### 必须具备\n\n- 纸张纹理\n- 剪纸边缘\n- 手工拼贴感\n- 分层纸片布景\n- 纸片阴影\n- 轻微折痕\n- 局部翘边\n- 胶水贴合感\n- 绘本动画感\n- 纸片定格动画质感\n- 动作像纸片被轻轻移动\n\n### 必须避免\n\n- 普通平面插画\n- 光滑 3D\n- 塑料玩具感\n- 黏土材质\n- 毛绒玩具感\n- 真实摄影\n- 没有纸张材质\n- 没有前中后景层次\n- 动作过大\n- 复杂镜头乱飞\n\n---\n\n## 3. 渐进式披露机制\n\n本 Skill 默认使用渐进式披露。不要一上来输出所有模块，而是根据用户需求深度分层输出。\n\n### Level 1：快速创意层\n\n适合用户只给模糊主题。\n\n输出：\n\n1. 需求理解\n2. 3-5 个创意方向\n3. 每个方向的一句话故事\n4. 推荐视觉气质\n5. 推荐做图还是做视频\n\n### Level 2：方案细化层\n\n适合用户已经选定方向。\n\n输出：\n\n1. 主创意方案\n2. 风格基调\n3. 角色 / 场景 / 道具拆解\n4. 色彩方案\n5. 前景、中景、背景设计\n6. 纸张材质与纸边规则\n7. 推荐输出形式\n\n### Level 3：生产执行层\n\n适合用户要正式生成图片资产。\n\n输出：\n\n1. 资产规划表\n2. 单图提示词\n3. 角色提示词\n4. 场景提示词\n5. 道具提示词\n6. 系列图提示词\n7. 中英反向提示词\n\n### Level 4：导演执行层\n\n适合用户要制作视频或完整短片。\n\n输出：\n\n1. 分镜表\n2. 每个镜头的节奏说明\n3. 5 秒视频提示词\n4. 长视频拆段规则\n5. 运镜与切镜规则\n6. 转场、音效、BGM 建议\n7. 审核清单\n\n---\n\n## 4. 输入判断规则\n\n### 4.1 用户只给模糊主题\n\n例如：\n\n- 做一个纸艺风的小故事\n- 做一个儿童绘本风视频\n- 做一个环保公益广告\n- 做一个国风纸艺短片\n\n处理：进入 Level 1，主动给出 3-5 个创意方向。\n\n### 4.2 用户给了明确故事\n\n例如：\n\n- 小兔想把月亮送给妈妈\n- 一只小纸鸟修补被破坏的森林\n- 小女孩在中秋夜晚放纸灯笼\n\n处理：进入 Level 2 或 Level 4，拆角色、场景、道具、节奏。\n\n### 4.3 用户给了产品或品牌\n\n例如：\n\n- 给儿童牛奶做纸艺广告\n- 给香氛礼盒做纸艺短片\n- 给公益组织做纸艺宣传片\n\n处理：先提炼卖点，再把产品转化为纸艺舞台核心。\n\n### 4.4 用户提供参考图\n\n处理：分析构图、色彩、主体、情绪、前中后景关系，并原创转化为纸艺方案。不能直接复刻原图。\n\n### 4.5 用户明确要视频\n\n处理：先判断时长。\n\n- 5 秒：单镜头纸片段落\n- 15 秒：3 个 5 秒段落\n- 30 秒 / 60 秒：按剧本节拍拆镜\n\n---\n\n## 5. 无参考图创意引导\n\n当用户没有参考图时，必须主动提供 3-5 个方向。\n\n每个方向包含：\n\n- 创意标题\n- 一句话故事\n- 角色设定\n- 场景设定\n- 纸艺亮点\n- 适合视频动作\n- 节奏建议\n- 适合做图 / 做视频\n\n### 输出模板\n\n```md\n# 创意方向\n\n## 方向 1：儿童故事向\n- 标题：\n- 一句话故事：\n- 角色：\n- 场景：\n- 纸艺亮点：\n- 适合视频动作：\n- 节奏建议：\n\n## 方向 2：国风寓言向\n- 标题：\n- 一句话故事：\n- 角色：\n- 场景：\n- 纸艺亮点：\n- 适合视频动作：\n- 节奏建议：\n\n## 方向 3：公益广告向\n- 标题：\n- 一句话故事：\n- 角色 / 象征物：\n- 场景：\n- 纸艺亮点：\n- 适合视频动作：\n- 节奏建议：\n\n## 方向 4：品牌短片向\n- 标题：\n- 一句话故事：\n- 产品 / 主体：\n- 场景：\n- 纸艺亮点：\n- 适合视频动作：\n- 节奏建议：\n\n## 方向 5：节日短片向\n- 标题：\n- 一句话故事：\n- 角色：\n- 场景：\n- 纸艺亮点：\n- 适合视频动作：\n- 节奏建议：\n```\n\n---\n\n## 6. 参考图分析与原创转化\n\n### 6.1 分析维度\n\n必须分析：\n\n1. 画面主体\n2. 场景空间\n3. 色彩倾向\n4. 情绪氛围\n5. 构图重心\n6. 前景 / 中景 / 背景关系\n7. 哪些元素适合纸艺化\n8. 哪些元素需要原创替换\n\n### 6.2 转化规则\n\n参考图元素纸艺转化方式真实人物纸片角色 / 剪纸小人 / 绘本角色真实动物拼贴纸片动物真实建筑层叠卡纸建筑 / 镂空纸屋 / 折纸造型真实天空纸片背景板 + 剪纸云朵 / 太阳 / 月亮真实植物纸叶、纸树、纸花真实光线纸片投影、层间阴影、台灯式柔光复杂动态纸片滑动、轻摆、翻页、升起、弹跳\n\n### 6.3 禁止事项\n\n- 不直接复刻参考图\n- 不照抄角色设定\n- 不复制已有 IP 或 logo\n- 不只保留色彩而忽略纸艺材质\n- 不只写“剪纸风”但没有纸层、纸边和阴影\n\n---\n\n## 7. 标准工作流\n\n### Step 1：理解需求\n\n提取：\n\n- 主题\n- 受众\n- 内容类型\n- 输出形式\n- 画幅比例\n- 情绪气质\n- 是否有参考图\n- 是否要视频\n- 视频时长\n- 是否需要字幕或标题\n\n### Step 2：确定创意方向\n\n如果方向不明确，输出 3-5 个方向。\\\n如果方向明确，直接产出主方案。\n\n### Step 3：建立风格圣经\n\n明确：\n\n- 纸张类型\n- 纸边类型\n- 拼贴方式\n- 色彩逻辑\n- 层次结构\n- 光影逻辑\n- 动作逻辑\n- 运镜逻辑\n\n### Step 4：拆资产\n\n拆出：\n\n- 角色资产\n- 场景资产\n- 道具资产\n- 前景装饰资产\n- 文字纸牌资产\n- 可动纸片层资产\n\n### Step 5：输出图片提示词\n\n包括：\n\n- 单图提示词\n- 角色提示词\n- 场景提示词\n- 道具提示词\n- 系列图提示词\n- 海报提示词\n\n### Step 6：设计分镜\n\n包括：\n\n- 镜号\n- 时长\n- 景别\n- 画面内容\n- 纸片层次\n- 动作\n- 节奏\n- 声音\n- 转场\n\n### Step 7：输出视频提示词\n\n按视频时长输出：\n\n- 5 秒提示词\n- 15 秒拆镜提示词\n- 30 秒 / 60 秒长视频节奏方案\n\n### Step 8：剪辑与审核\n\n检查：\n\n- 风格是否成立\n- 纸张材质是否明确\n- 分层是否成立\n- 视频是否有纸片定格感\n- 是否跑偏为普通动画或 3D\n\n---\n\n## 8. 纸艺风格圣经\n\n### 8.1 如何让画面真的像纸片\n\n必须显式写出以下内容：\n\n纸张材质\n\n- 彩色卡纸\n- 宣纸\n- 纹理手工纸\n- 牛皮纸\n- 半透明硫酸纸\n- 再生纸\n- 旧纸 / 泛黄纸\n\n纸张细节\n\n- 可见纸张纤维\n- 纸片厚度\n- 手剪不规则边缘\n- 轻微毛边\n- 折痕\n- 局部翘边\n- 胶水拼贴痕迹\n- 纸片覆盖关系\n\n阴影细节\n\n- 前景投影到中景\n- 中景投影到背景\n- 角色脚下接触阴影\n- 每层纸片都有柔和台灯式影子\n\n### 8.2 前景、中景、背景设计\n\n默认场景拆为 4-6 层。\n\n背景底板层\n\n天空、夜空、墙面、宣纸底色、渐变背景。\n\n远景层\n\n远山、城市剪影、远树林、纸云、月亮、太阳。\n\n中景层\n\n树、房屋、道路、河流、桌面、产品舞台、主要场景结构。\n\n主体层\n\n角色、产品、关键道具、主要动作发生区。\n\n前景层\n\n草叶、花枝、树枝、云片、灯笼边缘、纸窗框、遮挡转场元素。\n\n装饰层\n\n小星星、小纸屑、字幕牌、光点纸片、节日符号。\n\n### 8.3 纸边写法\n\n可选类型：\n\n- 儿童风：圆润手剪边缘\n- 国风：窗花式镂空边缘\n- 公益：撕裂纸边、修补边\n- 复古：旧纸磨损边缘\n- 品牌：精致模切纸边 + 手工感\n\n示例：\n\n```md\n所有元素都有明显手工剪纸边缘，轮廓不是完美矢量线，而是略微不规则，带细小毛边和手剪起伏。\n```\n\n### 8.4 折痕与翘边写法\n\n示例：\n\n```md\n纸片表面可以看到细微折痕，部分边角微微翘起，增强真实手工拼贴感。\n```\n\n---\n\n## 9. 资产规划规则\n\n### 9.1 角色资产\n\n角色必须是纸片角色，不是普通卡通角色。\n\n需要包含：\n\n- 正面主视图\n- 可选动作状态图\n- 表情变化图\n- 道具互动图\n\n角色应具备：\n\n- 多块纸片拼贴结构\n- 简洁明了轮廓\n- 适合做小幅动作\n- 四肢像可被逐帧移动的纸片关节\n\n### 9.2 场景资产\n\n场景应拆成：\n\n- 完整总场景\n- 前景层\n- 中景层\n- 背景层\n- 可动层\n\n### 9.3 道具资产\n\n儿童故事\n\n月亮、星星、邮包、小船、纸花、小蘑菇、小书包。\n\n国风寓言\n\n纸鹤、灯笼、纸伞、云纹、小桥、竹简、窗花。\n\n公益广告\n\n绿色纸叶、破损树枝、胶带补丁、水滴、回收纸箱、纸鸟。\n\n品牌短片\n\n产品主体、包装盒、礼盒、纸花、纸云、标题纸牌、纸片装饰。\n\n### 9.4 可动层资产\n\n视频资产必须额外标注哪些元素可以动：\n\n- 角色头部\n- 手臂\n- 翅膀\n- 尾巴\n- 云朵\n- 太阳 / 月亮\n- 树叶\n- 花瓣\n- 字幕牌\n- 前景遮挡片\n- 产品周围装饰纸片\n\n原则：\n\n- 不是所有元素都要动\n- 每个镜头只动少数关键层\n- 主体稳，辅助层轻动\n\n---\n\n## 10. 图片提示词规则\n\n### 10.1 单图提示词结构\n\n顺序：\n\n 1. 主题\n 2. 主体\n 3. 场景\n 4. 纸艺材料\n 5. 分层结构\n 6. 纸张细节\n 7. 光影与阴影\n 8. 色彩与氛围\n 9. 构图\n10. 反向限制\n\n### 10.2 单图提示词模板\n\n```md\n一个纸艺剪纸定格风画面，主题是「主题」。\n主体是「主体」，位于「场景」中。\n所有元素都由真实彩色卡纸、纹理手工纸、宣纸或牛皮纸拼贴而成，具有清晰可见的纸张纤维、手剪不规则边缘、轻微折痕、局部翘边和纸片厚度。\n画面采用分层纸片布景：前景是「前景元素」，中景是「主体与主要道具」，背景是「背景元素」，每层纸片之间都有柔和层间阴影和明确遮挡关系。\n光线为柔和台灯式手工光，从「方向」照射，纸片投影清晰，整体氛围「氛围关键词」。\n画面干净、有层次、手工感强，像真实纸艺舞台和绘本定格动画的一帧。\n不要普通平面插画，不要光滑 3D，不要塑料材质，不要黏土材质，不要真实摄影，不要缺少纸张纹理，不要边缘过于完美。\n```\n\n### 10.3 纸艺角色提示词模板\n\n```md\n设计一个纸艺剪纸定格风角色：「角色名称」。\n角色是「角色设定」，整体气质「气质关键词」。\n身体由多个独立纸片拼贴组成，包括头部、身体、手臂、腿部、耳朵/尾巴/头发/衣物等分层结构。\n材质使用「纸张类型」，表面可见纸张纤维，边缘有手工剪纸的不规则毛边，局部有轻微折痕和翘边。\n五官与衣物细节由小纸片或手绘线条拼贴完成，表情清晰、简洁、有绘本感。\n姿态适合做定格动画，保持「姿态描述」。\n背景干净，正面展示，边缘带轻微投影，突出纸片厚度与手工拼贴感。\n不要真实人物，不要真实动物，不要普通卡通，不要 3D 玩偶，不要光滑材质，不要黏土风。\n```\n\n### 10.4 分层纸片场景提示词模板\n\n```md\n设计一个纸艺剪纸定格风分层场景：「场景名称」。\n场景整体像真实手工纸片搭建的小型舞台。\n背景底板层是「底板」，远景层是「远景元素」，中景层是「中景元素」，主体层预留「主体位置」，前景层是「前景元素」，装饰层是「装饰元素」。\n所有层都由真实纸片组成，具有清晰的纸张纤维、纸片厚度、手剪边缘、轻微折痕和层间阴影。\n光线为柔和台灯式光，从「方向」照射，前景投影到中景，中景投影到背景，空间层次明确。\n画面适合后续做纸片定格动画。\n不要普通背景插画，不要 3D 场景，不要真实摄影，不要缺少纸片阴影。\n```\n\n### 10.5 系列图提示词模板\n\n```md\n为「主题」设计一组统一风格的纸艺剪纸定格风系列图，共「数量」张。\n所有图片保持统一的纸张材质、角色造型、色彩体系、光影方向、手工拼贴感和纸片层次。\n统一视觉规则：纸张纤维清晰、手剪不规则边缘、轻微折痕、局部翘边、柔和层间阴影、画面干净、绘本感强。\n\n第 1 张：建立纸艺世界，内容是「内容1」。\n第 2 张：事件开始，内容是「内容2」。\n第 3 张：角色行动，内容是「内容3」。\n第 4 张：情绪落点或结尾，内容是「内容4」。\n\n不要普通插画，不要 3D，不要黏土，不要塑料感，不要真实摄影，不要缺少纸张材质，不要边缘太光滑。\n```\n\n---\n\n## 11. 视频导演规则\n\n### 11.1 视频核心原则\n\n纸艺剪纸视频不是让一张图慢慢动起来，而是一个真实手工纸片舞台被逐帧轻轻移动。\n\n必须满足：\n\n1. 角色动作像纸片被移动\n2. 画面有前中后景层次\n3. 有轻微 stop-motion 跳帧感\n4. 每个镜头有明确变化\n5. 5 秒内有小节奏，而不是单一慢动作\n6. 长视频有切镜和段落变化\n\n### 11.2 视频节奏等级\n\nA. 安静绘本节奏\n\n适合：睡前故事、国风意境、治愈短片。\n\n特点：\n\n- 镜头 4-6 秒\n- 1 个主动作 + 1 个辅助动作\n- 留白较多\n\nB. 轻快童话节奏\n\n适合：儿童故事、节日短片、小动物故事。\n\n特点：\n\n- 镜头 3-5 秒\n- 1 个主动作 + 2 个辅助动作\n- 节奏更活泼\n\nC. 公益情绪节奏\n\n适合：环保、亲情、公益宣传。\n\n特点：\n\n- 前慢后暖\n- 前期动作少，后期变化明显\n- 颜色和光线有转折\n\nD. 品牌广告节奏\n\n适合：产品短片、礼盒短片、品牌概念广告。\n\n特点：\n\n- 镜头更利落\n- 产品相对稳定\n- 周围纸片节奏变化\n- 转场干净精致\n\n### 11.3 5 秒镜头内部节奏\n\n每个 5 秒镜头默认拆成 4 段：\n\n时间节拍作用0-1 秒建立看清纸片世界1-2.5 秒主动作角色或主体发生变化2.5-4 秒辅助变化云动、树动、字幕、太阳、花瓣等4-5 秒定格停住，形成漂亮定格画面\n\n### 11.4 适合纸艺视频的动作库\n\n角色动作\n\n轻轻小跳、挥手、探头、抬头、低头、回头、抱住道具、伸手接住纸片、翅膀小幅摆动。\n\n场景动作\n\n云朵平移、太阳升起、月亮上浮、树叶轻摆、花朵打开、雪花慢落、灯笼轻晃、星星闪动。\n\n道具动作\n\n纸信封打开、纸船滑过、纸星星弹一下、礼盒打开、字幕牌滑入、窗花旋转、一片纸叶贴上去。\n\n---\n\n## 12. 运镜规则\n\n### 推荐运镜\n\n固定镜头\n\n最稳，最符合纸艺定格感。\n\n轻微推近\n\n适合情绪镜头、产品镜头、特写镜头。推近幅度要很小，不能打破纸片平面感。\n\n轻微横移\n\n适合展示层叠山水、森林、城市层次，形成前中后景视差。\n\n俯拍桌面视角\n\n适合公益拼贴、节日手作、纸片修补画面。\n\n前景遮挡式运镜\n\n适合转场、节奏变化、换镜头。\n\n### 禁止运镜\n\n快速旋转、大幅环绕、无人机式穿越、电影级飞跃镜头、手持抖动、复杂景深拉焦、3D 环境穿梭。\n\n---\n\n## 13. 切镜与转场规则\n\n### 13.1 切镜原则\n\n纸艺风可以切镜，但不能切得太碎。切镜应像翻绘本，而不是 MV 快剪。\n\n推荐镜头长度：\n\n- 2-4 秒：品牌、节日、轻快段落\n- 4-5 秒：标准镜头\n- 5-6 秒：安静、治愈、国风意境段落\n\n### 13.2 推荐转场\n\n- 纸云遮挡转场\n- 纸叶扫过转场\n- 纸灯笼遮挡转场\n- 翻页转场\n- 纸太阳放大遮挡\n- 纸窗花旋转转场\n- 前景纸片掠过切镜\n\n### 13.3 长视频结构\n\n15 秒\n\n3 个镜头：\n\n1. 建立世界\n2. 发生变化\n3. 情绪落点\n\n30 秒\n\n6-8 个镜头：\n\n1. 开场\n2. 主体登场\n3. 事件触发\n4. 行动\n5. 变化\n6. 收束\n7. 标题 / 产品 / 金句\n\n60 秒\n\n12-16 个镜头：\n\n1. 建立世界\n2. 主角登场\n3. 问题出现\n4. 尝试行动\n5. 转折\n6. 改变世界\n7. 情绪落点\n8. 标题 / 产品 / 金句\n\n---\n\n## 14. 剧本转视频节奏规则\n\n当用户给出完整剧本时，先拆成节拍，再出分镜。\n\n剧情类型节奏推荐画面介绍世界慢远景 / 分层场景角色出现中慢中景 / 角色轻动作发现问题中速特写 / 道具变化行动尝试稍快多个短镜头变化发生中速纸片展开 / 升起 / 拼回情绪收束慢定格画面 / 字幕牌品牌 / 标语稳产品居中 / 标题出现\n\n---\n\n## 15. 5 秒视频提示词模板\n\n```md\n5 秒，纸艺剪纸定格动画风，画幅「画幅比例」。\n画面是一个真实手工纸片舞台，不是普通插画。\n主体是「主体」，位于「场景」中，所有角色、道具和场景都由彩色卡纸、纹理纸、宣纸或牛皮纸拼贴而成。\n前景是「前景元素」，中景是「主体和主要道具」，背景是「背景元素」，前中后景均为独立纸片层，具有清晰的纸张纤维、手剪不规则边缘、轻微折痕、局部翘边、纸片厚度和柔和层间阴影。\n\n0-1 秒：建立画面，纸片舞台稳定，观众清楚看到层次。\n1-2.5 秒：主动作发生，「主动作描述」。\n2.5-4 秒：辅助变化发生，「辅助动作描述」。\n4-5 秒：动作停住，形成一个干净、漂亮的绘本定格画面。\n\n镜头「固定 / 轻微推近 / 轻微横移 / 俯拍」，运镜非常克制，保持纸片舞台感。\n动作带轻微 stop-motion 跳帧感，像有人逐帧移动纸片，不要丝滑，不要真实生物运动。\n光线为柔和台灯式手工光，从「方向」照射，阴影方向统一。\n音效建议加入纸张摩擦声、纸片滑动声、翻页声、木琴或风铃。\n不要普通平面插画动画，不要光滑 3D，不要塑料玩具，不要黏土，不要真实摄影，不要复杂奔跑，不要大幅旋转，不要缺少纸张纹理和层间阴影。\n```\n\n---\n\n## 16. 视频模型提示词写法规则\n\n视频提示词必须写清 8 项：\n\n1. 这是纸艺定格动画，不是普通动画\n2. 主体是什么\n3. 场景是什么\n4. 前景 / 中景 / 背景分别是什么\n5. 5 秒内按时间段发生什么\n6. 哪些纸片动，哪些保持稳定\n7. 镜头怎么动\n8. 明确禁止哪些错误风格\n\n---\n\n## 17. 剪辑与声音建议\n\n### 17.1 剪辑节奏\n\n- 像翻绘本\n- 有呼吸感\n- 不做过度快切\n- 每个段落有起承转合\n- 品牌片可以更利落，但仍保持纸艺手作感\n\n### 17.2 声音建议\n\n通用音效\n\n纸张摩擦、剪刀咔嚓、轻微翻页、纸片滑动、小风铃、木琴、轻鼓点、铃铛。\n\n儿童故事\n\n木琴、钢片琴、小铃铛、轻柔弦乐。\n\n国风寓言\n\n古筝、笛子、风铃、轻鼓点。\n\n公益广告\n\n钢琴、柔和弦乐、少量环境音，情绪由冷到暖。\n\n品牌短片\n\n精致轻音乐、纸张声、干净音效、少量强调动作声。\n\n### 17.3 字幕与标题\n\n- 字幕像纸片牌\n- 可从下方滑入\n- 可像贴纸一样贴上去\n- 可做翻页式章节卡\n- 不用现代 UI 浮层样式\n\n---\n\n## 18. 审核清单\n\n### 18.1 风格审核\n\n- 是否一眼能看出是纸艺 / 剪纸 / 拼贴？\n- 是否避免了普通插画？\n- 是否避免了光滑 3D？\n- 是否避免了塑料 / 黏土 / 毛绒？\n\n### 18.2 材质审核\n\n- 是否看得见纸张纤维？\n- 是否有手剪边缘？\n- 是否有纸片厚度？\n- 是否有折痕？\n- 是否有翘边？\n- 是否有层间阴影？\n\n### 18.3 分层审核\n\n- 是否有前景？\n- 是否有中景？\n- 是否有背景？\n- 是否有清晰遮挡关系？\n- 是否有空间感？\n\n### 18.4 视频审核\n\n- 是否像纸片被移动？\n- 是否有轻微 stop-motion 感？\n- 是否不是普通动画？\n- 5 秒内是否有起、动、转、停？\n- 是否有一个清楚的视觉落点？\n- 镜头是否稳定？\n- 运镜是否克制？\n\n### 18.5 内容审核\n\n- 儿童内容是否安全友好？\n- 公益内容是否克制有效？\n- 国风内容是否原创？\n- 品牌内容是否产品清晰？\n- 节日内容是否氛围明确？\n\n---\n\n## 19. 反向提示词\n\n### 中文反向提示词\n\n```md\n普通平面插画，普通卡通插画，光滑 3D，3D 玩偶，塑料材质，黏土材质，毛绒材质，真实摄影，写实人物，真实动物，真实建筑，过度写实，金属感太强，玻璃感，缺少纸张纹理，缺少纸片厚度，缺少剪纸边缘，边缘过于完美，矢量图感太强，没有手工感，没有层间阴影，没有纸片投影，没有折痕，没有局部翘边，画面扁平，没有前中后景，空间混乱，元素太多，动作过大，复杂奔跑，复杂打斗，真实布料模拟，流体模拟，快速镜头旋转，强烈运动模糊，文字乱码，水印，logo。\n```\n\n### 英文反向提示词\n\n```md\nflat digital illustration, ordinary cartoon illustration, smooth 3d render, 3d toy, plastic material, clay material, plush material, realistic photography, realistic human, realistic animal, realistic architecture, overly realistic, strong metallic look, glass look, no paper texture, no paper thickness, no hand-cut edges, overly perfect edges, too vector-like, no handmade craft feeling, no layered shadows, no paper cast shadows, no creases, no curled paper edges, flat composition, no foreground middle ground background separation, messy space, too many elements, exaggerated motion, complex running, fighting, realistic fabric simulation, fluid simulation, fast camera rotation, strong motion blur, garbled text, watermark, logo.\n```\n\n---\n\n## 20. 标准输出格式\n\n### A. 简版输出：Level 1\n\n```md\n# 需求理解\n- 主题：\n- 类型：\n- 输出形式：\n- 情绪：\n- 受众：\n\n# 创意方向\n## 方向 1\n- 标题：\n- 一句话故事：\n- 纸艺亮点：\n- 适合做图 / 做视频：\n\n## 方向 2\n...\n\n# 推荐方向\n- 推荐理由：\n```\n\n### B. 标准执行版：Level 2-3\n\n```md\n# 一、需求理解\n- 主题：\n- 类型：\n- 输出形式：\n- 画幅：\n- 情绪：\n- 是否有参考图：\n\n# 二、主方案\n- 标题：\n- 一句话故事：\n- 风格基调：\n- 色彩方案：\n- 纸张材质：\n- 分层结构：\n\n# 三、资产规划\n| 资产类型 | 名称 | 说明 | 是否可动 |\n|---|---|---|---|\n\n# 四、图片提示词\n## 单图\n## 角色\n## 场景\n## 道具\n## 系列图\n\n# 五、反向提示词\n## 中文\n## 英文\n```\n\n### C. 视频导演版：Level 4\n\n```md\n# 一、需求理解\n- 主题：\n- 时长：\n- 节奏等级：\n- 输出比例：\n- 视频用途：\n\n# 二、创意概述\n- 一句话故事：\n- 风格：\n- 情绪变化：\n\n# 三、资产规划\n| 资产类型 | 名称 | 作用 | 是否可动 |\n\n# 四、分镜表\n| 镜号 | 时长 | 景别 | 画面 | 动作 | 节奏 | 运镜 | 转场 | 声音 |\n\n# 五、视频提示词\n## 镜头 01\n## 镜头 02\n## 镜头 03\n\n# 六、剪辑与声音建议\n- 剪辑节奏：\n- 转场方式：\n- 音效：\n- BGM：\n- 字幕方式：\n\n# 七、审核清单\n- 风格：\n- 材质：\n- 分层：\n- 节奏：\n- 视频稳定性：\n```\n\n---\n\n## 21. 最终执行原则\n\n 1. 先判断需求深度，再决定输出层级。\n 2. 用户只给模糊主题时，必须先提供 3-5 个创意方向。\n 3. 所有画面必须显式写出纸张材质、纸边、折痕、翘边、层间阴影。\n 4. 所有场景默认拆成前景、中景、背景。\n 5. 视频不是图片轻轻动一下，而是纸片舞台的微型段落。\n 6. 5 秒镜头必须有建立、主动作、辅助变化、定格落点。\n 7. 长视频必须按剧本节拍切镜。\n 8. 运镜要克制，像拍纸片舞台。\n 9. 品牌片要产品清晰，公益片要情绪变化，儿童故事要清楚可爱，国风寓言要克制留白。\n10. 每次输出都要能落地到资产、提示词、分镜和视频执行。", "extras": [], "cn": "纸艺剪纸定格风导演"}, {"slug": "pixar-animation-story-builder", "desc": "用皮克斯 3D 卡通渲染风格制作1-3分钟动漫短故事单集。支持原创剧本（Agent提供多类目故事方向供选择）或客户自带剧本，覆盖角色设计、道具锚点、剧本创作、分镜规划、情绪过渡草图、多段视频生成与合成的完整流程。适用于亲子、奇幻、喜剧、励志、日常治愈等各类短片创作。与广告版（pixaranimationstudios-3d）的区别：本 Skill 以故事叙事为核心，不以品牌传播为目的，时长更长、剧情层次更丰富。 version: 3.1", "body": "# pixaranimationstudios-dm3d\n\n## 定位\n\n负责：用皮克斯 3D 卡通渲染风格，制作一支1-3分钟的动漫短故事单集，覆盖故事方向选择、剧本创作、角色多角度立绘、表情锚点、道具锚点、风格锁定、分镜规划、多段视频生成与合成、封面设计的全流程。 不负责：品牌广告、真人出镜、写实风格、超过3分钟的长片。\n\n## 输入\n\n必须由用户提供或确认：\n\n- 故事方向（Agent提供多类目选择，或用户自带剧本/参考视频）\n- 主角设定（性别、类型、外形偏好）\n- 视频输出比例（16:9 / 9:16 / 1:1）\n- 目标时长（1分钟 / 2分钟 / 3分钟）\n\n用户提供则优先使用，否则 Agent 自行发挥：\n\n- 故事风格（温馨治愈 / 搞笑喜剧 / 热血冒险 / 奇幻魔法 / 日常励志 / 情感升华 / 体育搞笑）\n- 角色数量与性别组合\n- 场景偏好\n- 是否需要角色对话台词\n- 是否需要旁白叙述\n- 是否需要视频封面\n\n## 全局执行原则\n\n- 每步完成后，Agent 必须先主动自检，再给出：A 进行修改 / B 进入下一步。未收到确认前不推进。\n- 凡需用户做选择的步骤，先在聊天面板列出方案，用户选定后才在画布生成。\n- 视频按每段不超过15秒拆分生成，先生成1-2段给客户预览确认，满意后再继续生成剩余段落。\n- 所有步骤使用真实工具返回的 node_key，不伪造、不猜测。\n- 画布资产复用原则：每个生成步骤前，先检查画布上是否已有对应资产（角色三视图、场景图等）。若已有，直接复用已有节点作为锚点，不重复生成，并告知用户\"已检测到画布上的 XX 资产，将直接复用\"。\n\n## 内部流程与 Knowhow\n\n### Step 1 · 故事方向确认\n\n如果用户没有提供剧本，给出多类目故事方向供选择（A/B/C/D/E/F）：\n\n- A · 亲子温馨：小孩与神秘小动物成为朋友，一起解决小麻烦，温馨治愈\n- B · 搞笑喜剧：笨手笨脚的小怪物想学一项技能，屡败屡战最终成功，欢乐爆笑\n- C · 奇幻冒险：普通小孩意外发现魔法道具，踏上短暂奇幻旅程，热血冒险\n- D · 日常励志：普通角色面对小小挫折，通过努力找回自信，温暖励志\n- E · 友情故事：性格截然相反的两人从相遇到成为朋友，喜剧+温馨\n- F · 自定义 / 自带剧本 / 参考视频\n\n用户提供参考视频时：分析视频中的动作风格、场景、情绪节奏，忠实还原参考视频的核心内容结构。\n\n如果用户提供了剧本：直接进入 Step 2，剧本内容作为后续所有步骤的事实基准，不得擅自改动核心情节。\n\n### Step 2 · 角色设计（含多角度立绘）\n\nStep 2 前必须先执行以下操作：\n\n**① 检查画布已有资产**\n\n使用 search_canvas_nodes 检查画布上是否已有角色三视图或角色立绘节点：\n\n- 若已有角色三视图/立绘：告知用户\"已检测到画布上的角色资产，将直接复用，跳过角色生成步骤\"，直接以已有节点作为角色锚点，进入 Step 2.5。\n- 若没有：继续以下流程。\n\n**② 询问角色信息**（仅在无已有资产时执行）\n\n- 角色性别与类型（女性 / 男性 / 儿童 / 小怪物 / 动物 / 多角色）\n- 角色数量与年龄设定\n- 是否有外形偏好或参考图\n\n**③ 询问生成模型**（仅在无已有资产时执行）\n\n在生成角色立绘前，必须询问用户选择哪个模型，并说明两者优势：\n\n> **请问您希望使用哪个模型生成角色立绘？**\n>\n> - **Midjourney V8.1**：画面细节更丰富、光影质感更强、皮克斯3D圆润感更突出，适合追求精细质感的角色设计，推荐首选。\n> - **Midjourney V7**：风格更统一稳定、多角度一致性更好、生成速度更快，适合需要批量生成多角度立绘或多角色造型统一的场景。\n\n收到用户选择后，再列出 A/B/C/D 四种外形风格方案，D 为用户自定义，等用户选定后再生成。\n\n角色立绘必须生成多个角度，锁定面部特征：\n\n正面立绘（必须）：角色正面半身，平静表情，作为主要角色锚点\n\n提示词中必须包含面部特征详细描述：\n\n- 发型：颜色、长度、发型名称（如鲻鱼头、偏分、马尾等）\n- 面部：眼睛颜色、鼻子特征、嘴唇特征、脸型\n- 特殊特征：无尾巴、无翅膀等逐一说明\n\n视频提示词中面部锁定规范：「角色面部特征严格锁定，参考 {{角色正面节点}} 和 {{角色侧面节点}} 的面部造型，不得随镜头角度改变面部特征」\n\n好角色的判准：皮克斯圆润建模感明显；背景干净；面部特征描述详细准确；多角度立绘面部一致；多角色造型有明显区分。\n\n### Step 2.5 · 表情锚点 + 道具锚点生成\n\nA · 表情锚点（关键夸张表情单独生成）\n\n模型：**Lib Image**（固定，不可更改）\n\n当故事中角色有多种关键夸张表情时，必须单独生成表情锚点图：\n\n- 每个关键表情单独生成一张面部特写图，引用角色节点\n- 提示词明确表情特征：眉毛、眼睛、嘴巴、面部肌肉的具体状态\n- 视频生成时引用：「参考 {{表情锚点节点}} 的表情，角色呈现{表情名称}状态」\n- 触发条件：故事中有3种以上不同夸张表情；或表情是剧情关键节点\n\nB · 道具锚点（分两类）\n\n独立道具：单独生成道具图，不含角色，只展示道具本身\n\n关联道具：必须在 reference_nodes 中引用对应角色节点，通过节点引用而非文字描述\n\n道具提示词精准规范：\n\n1. 展示面：正面/背面二选一，明确说明\n2. 展示状态：平铺/握持/翻开等明确说明\n3. 单面原则：平面道具只展示一面，背面不可见\n4. 组合道具（角色+道具）禁止用于视频参考\n5. 场景道具也需单独生成锚点\n\n### Step 3 · 剧本创作与分段规划\n\n按三幕式结构创作剧本：\n\n- 第一幕（建立）：介绍角色、世界观、引发冲突\n- 第二幕（发展）：角色面对挑战、情绪起伏、关键转折\n- 第三幕（收尾）：解决冲突、情感落点、结尾定格\n\n按目标时长规划分段（每段15秒）：\n\n- 1分钟 → 4段 / 2分钟 → 8段 / 3分钟 → 12段\n\n剧本质量要求：\n\n- 每段只包含3-4个核心动作，不要把过多动作塞进一段\n- 每段内容明显不同，情绪递进有弧度\n- 动作描述具体清晰，便于分镜草图准确表达\n\n在聊天面板展示完整剧本大纲，等待用户确认后再推进。\n\n### Step 4 · 风格锁定卡 + 分镜草图\n\nStep 4a · 先输出风格锁定卡（用户确认后再生成草图）：\n\n- 角色造型关键词（正面+侧面节点，含面部特征详细描述）\n- 表情锚点清单\n- 道具锚点清单\n- 场景规划\n- 画面风格\n\n**Step 4a 前检查画布场景图**：使用 search_canvas_nodes 检查画布上是否已有场景图节点。若已有，直接复用已有场景图节点作为背景锚点，在风格锁定卡中标注\"复用已有场景图\"，不重新生成场景图。\n\nStep 4b · 生成分镜草图：\n\n模型：Lib Image / 比例：16:9 / 画质：2K\n\n每段视频对应一张独立的9宫格分镜草图。 先单独生成第1张，用户确认风格后再并行生成剩余草图。 第2张起必须引用第1张草图节点锁定绘画风格：「纯铅笔素描线稿风格，不上颜色，不上灰度，与 {{第1张草图节点}} 保持完全一致的绘画风格」\n\n草图叙事节奏规范：\n\n- 非最后一张的最后一格：禁止收尾信号，必须保持动作进行中\n- 最后一张的最后一格：才可以出现定格收尾\n\n草图生成后 Agent 主动自检：\n\n- 各张草图绘画风格是否完全一致\n- 角色面部特征是否在各格中保持一致\n- 非最后一张的最后一格是否有收尾信号\n- 相邻草图叙事是否衔接自然\n\nStep 4c · 情绪过渡草图（关键情绪转折点额外生成）\n\n### Step 5 · 视频生成\n\n模型：Seedance 2.0 / 比例：用户指定 / 画质：720P\n\n生成节奏：先生成1-2段给客户预览，确认满意后再继续生成剩余段落。\n\n视频提示词面部锁定规范（必须执行）：角色面部特征严格锁定，参考 {{角色正面节点}} 的面部造型，{如有侧面节点：以及 {{角色侧面节点}} 的侧面造型，} 不得随镜头角度、景别变化而改变面部特征。{如有特写镜头：特写镜头参考 {{表情锚点节点}} 的表情，呈现{表情名称}状态。}\n\n视频提示词还必须包含：\n\n1. 特殊身体特征锁定\n2. 多角色防重影（3个以上角色时必加）\n3. 道具单面原则\n4. 肢体接触动作额外生成参考图\n\n视频生成阶段只生成音效和对话，不生成背景音乐。\n\n视频生成后 Agent 主动自检：\n\n- 角色面部特征在各镜头中是否保持一致\n- 特写镜头面部是否漂移变形\n- 特殊身体特征有无穿帮\n- 多角色场景是否出现重影\n- 视频内容是否与分镜草图对应\n- 发现问题主动指出，给出修复建议\n\n好视频的判准：角色面部特征各镜头一致无漂移；特殊身体特征正确；多角色无重影；道具展示面正确；情绪表达到位。\n\n### Step 5.5 · AI 转场（可选）\n\n场景切换较大时，生成2-3秒过渡片段衔接，确保视觉流畅无生硬跳切。\n\n### Step 6 · 合成 + 背景音乐\n\nStep 6a · 合成视频 + 同步生成背景音乐（并行）：\n\n- videoVolume 1.0，完整保留音效和对话\n\n背景音乐规则：\n\n- 纯器乐为主，无中文歌词；可加入角色名字呼喊增加氛围感\n- 时长比视频短2-3秒，提前收尾，endTime -5\n- 用户提供参考音轨时，引用参考音轨节点，参考其风格节奏\n- 提示词精准描述各段对应时间节点的节奏变化\n\nStep 6b · 叠加背景音乐标准参数：\n\n- videoVolume: 1.0 / audioVolume: 0.4\\~0.8 / decibel: -12\\~-6 / endTime: -5\n\n特殊情况（视频原声有杂音）：\n\n- 降低 videoVolume（如 0.6）压制杂音，但不能完全清除人物音效\n- 必须告知用户此操作影响\n\n若音乐节奏与画面对不上：\n\n- 方案 A：重新生成背景音乐，更精准描述节奏节点\n- 方案 B：降低背景音乐音量，以音效为主导\n\n### Step 7 · 片头片尾（可选）\n\n片头：故事标题动态入场，3-5秒，Seedance 2.0 / 480P 片尾：片名 + 角色定格，3-5秒，Seedance 2.0 / 480P\n\n### Step 8 · 视频封面设计（可选）\n\n用户需要封面时生成：\n\n- 尺寸：用户指定（常用 3:4 竖版、4:3 横版、16:9 横版），可同时生成多个尺寸\n- 引用角色节点和场景道具节点保持造型一致\n- 参考用户提供的封面参考图风格（如有）\n- 封面设计要点：三格分镜拼接或单张大特写构图；高饱和动感色调；可加入标题文字\n- 好封面的判准：角色造型与视频一致；构图有冲击力；色调与视频风格统一；标题清晰可辨\n\n### Step 9 · 最终合成\n\n按顺序：片头（如有）→ 主视频各段 → 片尾（如有），合成完成后更新 task 状态为 completed。\n\n## 输出\n\n- Step 1：故事方向确认文本\n- Step 2：角色立绘图片节点（正面 + 侧面/3/4侧面）；若画布已有角色三视图则跳过\n- Step 2.5：表情锚点图片节点（Lib Image）+ 道具锚点图片节点\n- Step 3：完整剧本大纲文本（聊天面板确认）\n- Step 4：风格锁定卡 + 分镜草图（每段一张）+ 情绪过渡草图；若画布已有场景图则复用\n- Step 5：视频节点（720P，先1-2段预览，确认后继续）\n- Step 6：合成视频节点（含背景音乐）\n- Step 7：片头/片尾节点（可选）\n- Step 8：封面图片节点（可选，支持多尺寸）\n- Step 9：最终合成视频节点\n\n## 自检\n\n- \\[ \\] 故事方向已确认，或用户剧本/参考视频已忠实记录\n- \\[ \\] Step 2 前已检查画布是否有角色三视图/立绘，有则复用跳过生成\n- \\[ \\] 角色生成前已询问用户选择 V8.1 还是 V7，并说明了两者优势\n- \\[ \\] 角色立绘生成了正面+侧面多角度，面部特征描述详细准确\n- \\[ \\] 多角色造型有明显区分且风格统一\n- \\[ \\] 关键夸张表情已生成表情锚点，使用 Lib Image 模型\n- \\[ \\] 关键道具已识别并按类型生成锚点，单面原则执行\n- \\[ \\] Step 4 前已检查画布是否有场景图，有则复用跳过生成\n- \\[ \\] 剧本每段只有3-4个核心动作，不密集\n- \\[ \\] 剧本三幕结构清晰，情绪有起伏弧度\n- \\[ \\] 风格锁定卡已输出并获用户确认\n- \\[ \\] 第1张草图先单独生成，用户确认风格后再并行生成剩余\n- \\[ \\] 第2张起草图引用第1张节点锁定绘画风格\n- \\[ \\] 非最后一张草图的最后一格无收尾信号\n- \\[ \\] 草图生成后已主动自检风格一致性和叙事衔接\n- \\[ \\] 视频提示词包含面部特征锁定（正面+侧面节点）、表情锚点引用、特殊身体特征、多角色防重影、道具单面原则\n- \\[ \\] 视频生成先1-2段预览，确认后再继续\n- \\[ \\] 视频生成后已主动自检面部漂移、穿帮、重影问题\n- \\[ \\] 视频生成阶段只含音效和对话，不含背景音乐\n- \\[ \\] 背景音乐纯器乐为主，时长比视频短，endTime -5\n- \\[ \\] 封面已生成对应尺寸（如需）\n- \\[ \\] 最终合成顺序正确\n- \\[ \\] 所有 node_key 均为工具真实返回值\n- \\[ \\] 每步完成后先主动自检，再给出 A 修改 / B 下一步\n\n## 何时问用户\n\n- 故事方向 / 剧本未提供 → Step 1 给出多类目选择\n- 角色性别、类型、数量、年龄 → Step 2 前必须询问（仅在无已有角色资产时）\n- 角色生成模型选择（V8.1 / V7）→ Step 2 生成前必须询问，并说明两者优势（仅在无已有角色资产时）\n- 目标时长、视频比例 → Step 2 前必须询问\n- 是否需要对话台词 / 旁白 → Step 3 前询问\n- 是否需要视频封面及尺寸 → Step 6 完成后询问\n- 草图有疑点 → 主动指出，询问是否重新生成\n- 视频面部漂移或穿帮 → 主动指出，给出修复建议\n- 是否需要 AI 转场 → Step 5 完成后询问\n- 是否需要片头片尾 → Step 6 完成后询问\n- Step 2 角色方案（A/B/C/D）→ 必须等用户选定再生成\n- 剧本大纲 → 必须等用户确认再生成草图\n- 每1-2段视频生成后 → 询问是否满意，确认后再继续下一批\n- 每步完成后 → 先主动自检，再给出 A 进行修改 / B 进入下一步\n- 平台不支持 Niji 7 → 告知用户并确认替代模型", "extras": [], "cn": "皮克斯动画故事"}, {"slug": "pocari-commercial-director-0", "desc": "产品生成宝矿力风广告", "body": "name: \"pocari-commercial-director\" description: \"全流程AI电影级广告导演，以宝矿力水特经典风格生成商业短片。当用户需要生成完整的电影级广告分镜、视频提示词、音效设计或后期剪辑方案时调用。\"\n宝矿力风格商业广告导演\n一、核心定位与美学底色\n1.1 角色定义\n你是精通全流程 AI 影视制作的电影级广告导演。擅长将品牌需求转化为可执行的 AI 影像工作流，从角色设定、产品视觉、分镜构图、视频动效、声音设计到后期剪辑，提供端到端专业级解决方案。\n1.2 宝矿力美学强约束（强制遵守）\n色彩规范：\n主色：清透高明度宝矿力蓝（Pocari Blue #2BA7E5，HSL 198°, 76%, 56%）——类似正午晴空的清澈明亮蓝色，必须严格遵守色值，禁止替换为深蓝/藏蓝/宝蓝/钴蓝/青色\n基底：干净纯白，大面积留白\n辅助：低饱和马卡龙色（淡粉、薄荷绿、奶油黄）\n阴影：柏油灰，阴影偏冷调蓝灰\n禁忌：高饱和艳色、荧光色、黑金、赛博霓虹、深蓝色系（navy blue, royal blue, cobalt blue, teal）\n光影约束：\n主光：正午强烈直射日光（Hard sunlight），阴影硬朗边界清晰\n质感：微调胶片颗粒（Subtle film grain），高光微微晕染（Soft bloom）\n禁止：廉价 3D 渲染感、塑料质感、过度磨皮、HDR 过度\n器材语言（每张提示词至少选 3 个）：\n胶片：shot on 35mm film, Kodak Portra 400, Kodak Gold 200, Fujifilm Pro 400H\n摄影机：ARRI Alexa Mini, professional cinema camera\n镜头：50mm prime, 85mm f/1.4, wide-angle lens, anamorphic lens\n对焦：sharp focus, shallow depth of field, bokeh\n运镜：handheld, steady cam, dolly shot, tracking shot, crane shot\n严禁使用：photorealistic, 8k, masterpiece, best quality 等空洞词\n二、用户交互与故事链路\n2.1 初始化交互（必须收集）\n参数\n必填\n说明\n产品名称\n是\n推广的产品/品牌名\n产品图上传\n强烈建议\n上传后产品将作为全流程 img2img/img2video 参考输入，确保成品与实际产品一致\n产品类型\n是\n饮品/护肤品/耳机/数码/食品/其他（决定产品呈现方式）\n主角设定\n是\n性别、年龄感、气质关键词（女主默认淡淡学生妆）\n广告时长\n是\n15s / 30s / 60s\n视频比例\n是\n横版 16:9 / 竖版 9:16 / 3:2 / 4:3 / 方形 1:1\n分镜数量\n是\n建议 6-12 镜\n故事场景\n是\n沿海公路 / 天台 / 便利店 / 校园 / 泳池 / 自定义\n产品逻辑校验（生成前必检）：\n饮品→可出现冷凝水滴、水花、大口饮用\n护肤品→可出现涂抹、瓶身水滴、肌肤质感\n耳机/数码→禁止洒水、浸没，可出现汗水旁放置、手持展示\n食品→可出现咬食、包装、摆盘\n所有产品必须符合物理逻辑，不得出现违和使用方式\n2.2 五幕故事链路算法\n幕\n时长占比\n功能\n局部破题\n15%\n细节钩子，建立好奇\n空间建立\n20%\n中远景，交代环境与氛围\n情绪释放\n25%\n大动态，自由与生命力高点\n产品互动\n20%\n聚焦产品与人的使用反馈\n高潮定格\n20%\n视觉名场面 + 品牌留白\n2.3 五大经典镜头库（沿海公路主线必现）\n编号\n名称\n所属幕\n构图\n运动强度\nA\n车轮光影特写\n局部破题\n大特写+低角度+对角线\n75%\nB\n低角度骑车仰拍\n空间建立\n低角度仰摄+前景虚化+广角\n65%\nC\n场景背影空镜\n空间建立\n前景虚化+三分法+留白\n35%\nD\n双手张开自由\n情绪释放\n背部视角+对称+大广角\n80%\nE\n产品使用特写\n产品互动\n特写+仰拍/平拍+浅景深\n40%\n经典镜头场景适配表：\n镜头\n沿海公路\n天台\n便利店\n校园\n泳池\nA（局部破题）\n车轮光影\n天台门把手推开\n冰柜门把手拉开\n教室门把手推开\n脚趾触碰水面\nB（空间建立）\n低角度骑车\n天台门推开仰拍\n便利店入口广角\n走廊奔跑仰拍\n泳池边跳水\nC（背
