，有舞台感和时尚感。\n3. 场景要美、有视觉冲击、有艺术设定，不只是普通背景。\n4. 视频要像 MV 视觉片，有镜头冲击、表演、空镜、特写、舞台调度和剪辑节奏。\n5. 流程要可扩展，用户换歌曲、换人物、换风格、换画幅依然能用。\n\n## 模型优先级\n\n按以下模型优先级执行；如果用户或环境无法使用优先模型，不要静默失败。先按“错误处理与模型切换策略”处理，再通过 `ask_human` 引导用户确认是否切换到下一个模型重新生成。\n\n```json\n{\n  \"portrait_and_styling_image_models\": [\"Lib image\", \"Lib nano2\"],\n  \"scene_art_models\": [\"Lib image\", \"Lib nano2\", \"悠船 v7 / Midjourney v7\"],\n  \"video_models\": [\"seedance 2.0\", \"seedance 2.0 fast\", \"kling O3\"],\n  \"music_models\": [\"any available music model\"],\n  \"text_models\": [\"any available text model\"]\n}\n```\n\n模型使用规则：\n\n- 人物候选、人物定稿、妆造穿搭图：优先 `Lib image`，其次 `Lib nano2`。\n- 纯场景艺术图：可使用 `Lib image`、`Lib nano2`、`悠船 v7 / Midjourney v7`。\n- 视频生成：优先 `seedance 2.0`，其次 `seedance 2.0 fast`，最后 `kling O3`。\n- 音乐生成：使用当前可用音乐模型，重点贴合用户的音乐类型和 MV 氛围。\n- 默认画幅为 `16:9 横屏`；用户指定时可改为 `9:16`、`1:1`、`4:5`、`21:9` 等。\n\n## 错误处理与模型切换策略\n\n当生成过程遇到报错、素材缺失、质量不足或安审限制时，不要直接终止整个 MV 工作流。先判断问题类型，再选择修复、重试或询问用户。\n\n### 1. 安审失败优先改 prompt 重试\n\n如果图片或视频生成触发审核失败，优先修改 prompt 并在同一模型上重试。修改方向：\n\n- 去掉血腥、伤口、受伤、疼痛、死亡、暴力等表达。\n- 去掉性感、挑逗、裸露、低俗、未成年感等表达。\n- 把“性感舞蹈”改成“自信舞台表演、强节奏编舞、时尚舞台动作”。\n- 把“受伤、虚弱、血迹”改成“疲惫、失落、戏剧化情绪、倒地造型”，明确“无伤口、无血迹”。\n- 把“宗教仪式、咒语、修女”等高风险词改成“神秘仪式感、黑纱群像、烛光舞台、低声吟唱氛围”。\n- 保留视觉目标，但降低敏感词强度。\n\n如果第一次重试仍失败，再进一步弱化敏感元素并重试一次。连续失败后，通过 `ask_human` 询问用户是否切换模型、换视觉方向或放弃该镜头。\n\n### 2. 缺关键素材时先 ask_human\n\n若缺少会影响最终成片质量、交付结果或素材使用方式的素材，不要强行进入视频生成。通过 `ask_human` 引导用户选择下一步。\n\n关键素材包括：\n\n- 没有选定主角人物，导致人物身份无法稳定。\n- 没有选定妆造图，导致服装、发型、配饰不稳定。\n- 没有纯场景图，导致人物无法融合到明确空间。\n- 场景图混入人物，不能作为纯场景锚点。\n- 人物图或造型图安审失败、质量过低、脸部模糊、风格漂移。\n- 用户要求的镜头依赖翅膀、伴舞、群像、道具、舞台装置，但对应素材不存在。\n\n`ask_human` 选项建议：\n\n```text\n当前缺少会影响成片质量的关键素材。你希望怎么处理？\n1. 先补生成缺失素材\n2. 使用现有素材继续，但降低一致性要求\n3. 切换模型重新生成素材\n```\n\n### 3. 模型报错时询问是否切换\n\n如果当前模型报错、超时、不可用或多次生成失败，使用 `ask_human` 让用户确认是否切换到下一个模型。\n\n图片模型切换顺序：\n\n```text\nLib Image -> Lib Nano2 -> 悠船 V7 / Midjourney v7\n```\n\n视频模型切换顺序：\n\n```text\nSeedance 2.0 -> Seedance 2.0 fast -> kling O3\n```\n\n`ask_human` 选项建议：\n\n```text\n当前模型生成失败。你希望怎么处理？\n1. 修改 prompt 后继续用当前模型重试\n2. 切换到下一个模型重新生成\n3. 跳过这个素材/镜头，继续后续流程\n```\n\n### 4. 重试记录\n\n每次重试或切换模型后，在最终输出里记录：\n\n- 失败环节。\n- 失败原因：模型报错、审核失败、素材不足、质量不足等。\n- 修改后的 prompt 策略。\n- 是否调用 `ask_human`。\n- 用户选择。\n- 最终使用模型。\n\n## 输入\n\n用户可以提供以下任意信息：\n\n- 音乐风格：K-pop、J-pop、电子、暗黑流行、R&B、摇滚、说唱、实验音乐、女团舞曲等。\n- MV 风格：未来主义、怪诞美学、巨物美学、宗教感、赛博、梦幻、暗黑、奢华、复古、异世界等。\n- 人物方向：韩系女团感、时尚模特感、冷感偶像、暗黑圣女、未来战士、异星歌姬等。\n- 参考图：人物图、造型图、场景图、风格图。\n- 歌词、歌名、主题、品牌或视觉关键词。\n- 目标比例和时长。\n\n如果用户只说“做一个好看的 MV”，默认：\n\n```json\n{\n  \"aspect_ratio\": \"16:9\",\n  \"duration\": \"30-60s visual MV\",\n  \"character_count\": 1,\n  \"portrait_options\": 9,\n  \"styling_options\": 6,\n  \"scene_options\": 6,\n  \"visual_direction\": \"韩系女团感 + 未来主义时尚 + 怪诞美学 + 巨物美学\",\n  \"music_direction\": \"K-pop / electronic pop / cinematic fashion MV\"\n}\n```\n\n## 输入使用\n\n严格遵守：\n\n- 用户上传的选定人物图，用作人物身份、五官、发型气质的一致性锚点。\n- 用户选定的造型图，用作服装、妆容、配饰、头饰和整体轮廓锚点。\n- 用户选定的场景图，用作空间、材质、色彩、光线和美术方向锚点。\n- 用户指定的音乐风格、歌词主题和 MV 情绪。\n\n允许扩展：\n\n- 多套妆造和穿搭。\n- 多个纯场景艺术图。\n- 舞台、空镜、特写、舞蹈、仪式感、巨物装置、抽象视觉等镜头类型。\n- 不同语言的歌曲和字幕版本。\n\n禁止：\n\n- 生成未成年人性感化形象。涉及性感、舞台魅力、贴身造型时，必须明确为成年表演者。\n- 使用真实明星、特定艺人、在世公众人物或受版权保护角色作为直接复刻对象。\n- 过度暴露、色情、低俗或伤害性画面。\n- 把场景艺术图阶段直接混入人物；场景图必须先保持“纯场景”。\n\n## 内部流程和 Knowhow\n\n### 1. mv_concept_planner\n\n先把用户需求整理成 MV 视觉总设定。\n\n输出：\n\n```json\n{\n  \"music_style\": \"\",\n  \"visual_world\": \"\",\n  \"main_character\": \"\",\n  \"fashion_direction\": \"\",\n  \"scene_direction\": \"\",\n  \"mood_keywords\": [],\n  \"aspect_ratio\": \"16:9\",\n  \"duration\": \"\",\n  \"safety_notes\": []\n}\n```\n\n如果用户给的信息很少，自动生成 3 个视觉方向让用户选择：\n\n- 韩系女团舞台大片：漂亮、时尚、强表演、强妆造、强镜头。\n- 未来主义异世界：金属、晶体、装置、巨物、冷光、异星场景。\n- 怪诞奢华仪式感：暗黑、华丽头饰、宗教式构图、群像、烛光、强反差。\n\n### 2. character_brainstorm\n\n先生成多版人物候选，一般为 9 版，供用户选择一个最有潜力的 MV 主角 IP。\n\n人物候选原则：\n\n- 好看，但不要标准模板脸。\n- 有特点：眼型、脸型、气质、冷感、钝感、清冷、锋利、松弛、厌世、灵气等至少有一个记忆点。\n- 更偏时尚偶像、韩系女团、亚裔模特、视觉系歌手，而不是普通写真。\n- 默认成年女性表演者；如果用户指定其他性别或群像，则按用户需求调整。\n- 白底或极简背景，方便后续选人和再设计。\n\n参考提示词结构：\n\n```text\n生成 9 版年轻成年时尚女性 MV 主角候选，亚裔女团气质，漂亮但不标准化，每个人都有独特五官记忆点和个人气质。半身像特写，面对镜头，证件照式构图，黑长直或可变化发型，穿着极简黑色吊带或极简黑色上衣，纯白背景，高级时尚感，随性但有明星潜力，真实摄影质感。\n```\n\n可替换变量：\n\n- `{gender}`：女性、男性、中性、组合成员。\n- `{ethnicity_or_market}`：亚裔、日韩感、欧美感、拉美感、多元族群等。\n- `{idol_type}`：清冷、暗黑、甜酷、未来感、怪诞、摇滚、精灵感、机械感等。\n- `{background}`：纯白背景、浅灰背景、证件照背景、棚拍背景。\n\n输出时给每个候选标注：\n\n- 颜值潜力。\n- 记忆点。\n- 适合的 MV 风格。\n- 后续妆造方向。\n\n### 3. character_selection\n\n用户选择其中一个人物后，将其作为 `Portrait 1` 或 `Mixed 1` 角色锚点。\n\n如果用户没有明确选择，先推荐 1-2 个最适合做 MV 主角的人物，并说明原因。\n\n选择标准：\n\n- 五官辨识度高。\n- 气质有延展空间。\n- 能承载夸张妆造。\n- 适合多场景、多套造型反复出现。\n- 不是过度普通的商业模特脸。\n\n### 4. styling_and_makeup_design\n\n围绕选定人物生成多套妆造、发型、穿搭、配饰和舞台造型。默认生成 6 套，用户可选择 1-3 套作为 MV 主要造型。\n\n造型方向库：\n\n- 韩系女团舞台：金属感、亮片、珠链、长靴、露肩但不低俗、强舞台轮廓。\n- 未来主义装置：银色、铬金属、可穿戴艺术装置、透明材质、激光元素。\n- 怪诞美学：异形头饰、夸张肩线、面部装饰、非对称轮廓。\n- 巨物美学：巨大翅膀、巨型裙摆、夸张披风、巨型头饰。\n- 暗黑仪式感：黑纱、金属冠冕、链条、烛光、修女式构图但不直接复刻宗教服饰。\n- 晶体幻境：碎钻、细闪、水晶、半透明装置、冷色光。\n- 音乐节现场：高能舞台、亮色灯光、闪耀材质、动感穿搭。\n\n参考提示词结构：\n\n```text\n高级肖像定制，全身像，保持 Portrait 1 的人物五官和气质一致，为她设计一套全新的 MV 舞台造型。时尚前卫，韩国女团感，时尚属性拉满，金属元素，激光元素，碎钻细闪元素，先锋面部装饰，华丽头饰，大量首饰，可穿戴艺术装置，宽松堆叠感靴筒，银色尖头高跟长靴，未来主义裙装，夸张但高级，纯白背景，真实时尚大片摄影。\n```\n\n多角度定稿图要求：\n\n```text\n使用选定人物和选定造型，生成一张 16:9 人物设定图，纯白背景，同一张图从左到右依次展示：人物面部特写、全身正面、全身侧面、全身背面。保持同一人物五官、发型、妆容、服装、配饰完全一致。画面清晰，高级时尚设定稿，偶像特征明显。\n```\n\n造型阶段必须输出：\n\n- 造型名称。\n- 妆容关键词。\n- 发型关键词。\n- 服装轮廓。\n- 材质。\n- 配饰。\n- 适合的 MV 场景。\n- 适合的镜头动作。\n\n### 5. scene_art_generation\n\n生成纯场景艺术图，不要把人物放进场景里。这一步只做 MV 世界观和空间美术。\n\n默认生成 6 个场景方向：\n\n- 主舞台：用于唱跳、正面表演、强灯光。\n- 英雄场景：用于人物站立、慢推、巨物装置、封面镜头。\n- 空镜场景：用于剪辑呼吸、音乐过门、氛围转场。\n- 特写材质场景：金属、晶体、水面、屏幕、红光、黑纱等细节。\n- 仪式/群像空间：用于伴舞、群演、围绕、注视、展开等戏剧调度。\n- 超现实场景：异星、镜面空间、巨大结构、梦境地貌、反重力空间。\n\n场景图要求：\n\n- 纯场景，不要人物。\n- 16:9 横屏默认。\n- 美、有冲击力、有艺术概念。\n- 可以夸张，但要适合后续把人物融合进去。\n- 要有明确空间层次：前景、中景、背景。\n- 要有明确光线方向和主色调。\n\n参考提示词结构：\n\n```text\n一个真实的未来主义 MV 场景，纯场景，无人物。异世界星球，地表布满交错复杂的淡紫色水晶，巨大的晶体结构从地面生长出来，远处有超现实舞台轮廓，梦幻、时尚、高级摄影、电影级光影、强空间纵深、视觉冲击、16:9 横屏。\n```\n\n可扩展场景关键词：\n\n- 金属骨骼大厅、黑色镜面舞台、淡紫水晶星球、巨大羽翼装置、电视墙空间、红色激光房间、雨夜玻璃盒、废墟音乐节、银色液态隧道、白色无菌实验舞台、黑纱教堂式空间、荒漠巨型雕塑、海底发光剧场。\n\n### 6. music_direction\n\n生成音乐或音乐提示词。使用当前可用音乐模型。\n\n音乐必须服务 MV 视觉：\n\n- 韩系女团：强鼓点、电子贝斯、hook 明确、适合唱跳。\n- 暗黑流行：低频、耳语感、合成器、神秘氛围。\n- 未来主义：金属打击、电子噪声、冷感合成器。\n- 怪诞奢华：弦乐、管风琴感、低频鼓、戏剧化停顿。\n- 梦幻异世界：空灵人声、合成器 pad、宽阔混响。\n\n输出：\n\n- 音乐风格。\n- BPM 范围。\n- 情绪关键词。\n- 歌曲结构：intro / verse / pre-chorus / chorus / bridge / outro。\n- 视频节奏建议：快切点、慢镜头点、定帧点。\n\n### 7. video_prompt_builder\n\n在所有人物图、妆造图、场景图通过自检后，再写视频生成 prompt。\n\n如果视频生成前发现人物、造型、场景任一锚点缺失或质量不足，先按“错误处理与模型切换策略”调用 `ask_human`，不要直接生成。\n\n视频模型优先级：\n\n1. `seedance 2.0`\n2. `seedance 2.0 fast`\n3. `kling O3`\n\n视频生成原则：\n\n- 使用参考生视频功能，把人物锚点、造型锚点、场景锚点融合。\n- 人物身份由人物图控制。\n- 服装妆造由造型图控制。\n- 场景由纯场景图控制。\n- 不要让模型重新设计人物脸、服装和场景。\n- 一个视频片段只表达一个核心镜头事件。\n- 优先生成多个 3-6 秒片段，再剪辑成完整 MV。\n\n常见镜头类型：\n\n- 视觉开场：人物站在巨大场景中，慢慢抬眼，灯光闪烁。\n- 唱跳镜头：正面近景，中景舞蹈，镜头推进，口型精准。\n- 造型展示：面部特写、眼妆、嘴唇、首饰、手部、鞋靴、裙摆、金属装置。\n- 场景空镜：晶体、金属、屏幕墙、舞台灯、雨地、巨物装置。\n- 仪式镜头：伴舞围绕、群像注视、手势、光线熄灭、翅膀展开。\n- 冲击镜头：快速推近、旋转、闪光、低角度仰拍、极近特写。\n\n通用视频 prompt 模板：\n\n```text\n史诗级时尚 MV 电影质感，参考 {{Portrait 1}} 的人物身份，参考 {{Styling 1}} 的妆造穿搭，参考 {{Scene 1}} 的场景美术。\n\n{人物} 站在 {场景} 中，进行 {表演/舞蹈/仪式/情绪动作}。保持人物五官、发型、妆容、服装、配饰一致，保持场景的材质、光线、色彩和空间结构一致。\n\n镜头语言：{近景/中景/全景/特写/低角度/环绕/快速推近/慢速推进/旋转/闪切}\n画面气质：高颜值、强妆造、强视觉冲击、时尚前卫、电影级光影、音乐 MV 质感。\n动作要求：动作自然流畅，表演有节奏，口型和音乐情绪匹配，镜头切换有冲击力，全程无字幕。\n```\n\n舞蹈 MV 模板：\n\n```text\n史诗级电影质感，音乐节现场或未来主义舞台风格。{{Portrait 1}} 穿着 {{Styling 1}} 的造型站在 {{Scene 1}} 风格的场景里，身后有 4-6 个伴舞，唱跳演绎音乐高潮段落。精准口型演绎，强节奏舞蹈动作，近景拍摄，镜头快速推进、旋转、低角度仰拍和特写切换。画面时尚、有活力、有冲击力，舞台光线闪烁，电影级质感，全程无字幕。\n```\n\n仪式感 MV 模板：\n\n```text\n史诗级时尚影片，{{Portrait 1}} 穿着 {{Styling 1}} 站在 {{Scene 1}} 中，周围有群像或伴舞形成仪式感构图。人物缓慢抬头，灯光忽明忽暗，镜头在眼睛、嘴唇、手部、头饰、服装细节、巨大装置之间快速切换。随后人物做出强烈表演动作，空间光线发生变化，极具冲击力的镜头表现，夸张但高级，电影级运镜，全程无字幕。\n```\n\n空镜模板：\n\n```text\n纯场景 MV 空镜，参考 {{Scene 1}} 的场景美术。镜头缓慢推进，展示巨大装置、材质纹理、光线变化、舞台空间和超现实结构。无人物，无字幕，电影级光影，音乐过门氛围，适合作为 MV 转场或开场。\n```\n\n负面提示：\n\n```text\ndeformed face, changed identity, inconsistent makeup, inconsistent outfit, extra limbs, broken hands, distorted body, bad anatomy, flickering, low quality, blurry face, wrong jewelry, changed hairstyle, changed scene, messy background, unreadable text, subtitles, watermark, childlike face, underage appearance, explicit nudity, pornographic, injury, blood\n```\n\n### 8. mv_editing_plan\n\n把多个视频片段剪辑成 MV 视觉片。\n\n默认结构：\n\n```text\n0-5s：强视觉开场，空镜或人物抬眼。\n5-15s：人物主造型登场，近景和全身交替。\n15-30s：唱跳/表演段落，快切，配合音乐鼓点。\n30-45s：场景切换和造型变化，加入空镜和特写。\n45-60s：高潮视觉，巨物、群像、灯光、强运镜，最后定格或慢推收尾。\n```\n\n剪辑规则：\n\n- MV 视觉片不需要解释剧情，重点是视觉冲击和音乐节奏。\n- 每 2-4 秒切换一次视觉重点。\n- 人物脸部特写、全身造型、场景空镜、舞蹈动作、材质细节要交替出现。\n- 音乐高潮使用快切、闪光、旋转、低角度和群像。\n- 音乐过门使用空镜、慢推、材质特写和背影。\n- 全程默认无字幕，除非用户明确要求歌词字幕。\n\n## 输出\n\n每次执行后输出：\n\n```markdown\n## MV 总设定\n- 音乐方向：\n- 视觉风格：\n- 主角设定：\n- 妆造方向：\n- 场景方向：\n- 画幅/时长：\n\n## 人物候选方案\n输出 9 版人物候选 prompt，并标注每版记忆点和适合风格。\n\n## 造型妆造方案\n输出 6 套造型方向，每套包含妆容、发型、服装、配饰、材质、适合镜头。\n\n## 人物设定图 Prompt\n输出选定人物的多角度设定图 prompt：面部特写、全身正面、全身侧面、全身背面，纯白背景。\n\n## 纯场景艺术图 Prompt\n输出 6 个纯场景 prompt，注明建议模型和画幅。\n\n## 音乐 Prompt\n输出音乐风格、BPM、情绪、结构。\n\n## 视频片段 Prompt\n输出 6-10 个视频片段 prompt，注明人物引用、造型引用、场景引用、镜头类型和建议视频模型。\n\n## 剪辑方案\n输出片段顺序、节奏、转场、空镜位置、高潮段落和收尾方式。\n\n## 自检结果\n输出是否通过人物一致性、造型一致性、场景纯净度、安全合规和模型选择检查。\n\n## 错误处理记录\n输出本次是否出现模型报错、审核失败、素材缺失、prompt 重写、模型切换或 ask_human 选择。\n```\n\n## 自检\n\n生成视频前必须检查：\n\n- 人物是否看起来为成年人，且没有未成年人性感化问题。\n- 人物是否好看、有辨识度，不是普通模板脸。\n- 妆造是否有明确风格、轮廓、材质和配饰。\n- 人物设定图是否保持同一人物一致性。\n- 场景图是否为纯场景，没有人物混入。\n- 场景是否足够美、有视觉冲击、有空间层次。\n- 视频 prompt 是否清楚引用人物、造型、场景。\n- 是否避免字幕、水印、错误文字。\n- 是否没有使用真实明星或受版权保护角色。\n- 是否按模型优先级选择。\n- 如果触发安审失败，是否先去掉血腥、性感、伤害、未成年感等敏感表达并重试。\n- 如果缺少关键素材或模型连续失败，是否通过 `ask_human` 引导用户选择是否补素材、换模型或跳过。\n\n## Ask User\n\n不要因为信息不完整就停下。用户只给一个方向时，先生成默认方案。\n\n只有以下情况需要追问：\n\n- 用户没有给任何音乐或视觉方向，同时也没有说“自由发挥”。\n- 用户要求复刻真实明星、特定女团成员、影视角色或版权 IP。\n- 用户要求明显未成年形象、低俗性感化或不安全内容。\n- 用户需要商业品牌植入，但没有给品牌限制。\n- 缺少会影响最终成片质量、交付结果或素材使用方式的关键素材。\n- 图片或视频模型报错、超时、不可用，或同一安审问题连续重试失败。\n\n优先追问：\n\n1. MV 想偏哪种方向：韩系女团、未来主义、怪诞美学、巨物美学、暗黑仪式感，还是自由发挥？\n2. 主角是单人、双人，还是组合？\n3. 默认做 16:9 横屏可以吗，还是要 9:16 竖屏？", "extras": [], "cn": "高颜值时尚 MV 生成"}, {"slug": "feature-film-writer", "desc": "90分钟院线级长片剧本方法论", "body": "# feature-film-writer\n\n90分钟长片电影的完整写作方法论。短片是冲刺，**长片是马拉松**——需要节奏的起伏，需要安静的场景让观众消化情绪，持续90分钟的高信息密度会让观众疲劳。本 skill 自包含，不依赖本库其他任何文件；如果要指定\"这个长片该讲男频/悬疑/复仇哪个题材的具体内容判断标准\"，可以在写完后额外参考对应题材壳，但题材壳不是必需前提。\n\n## 边界：不做什么\n\n不产出分镜表、镜号、景别/运镜/构图、转场方式、AI生图/生视频提示词、任何特定生成引擎的格式约束。产出到完整的、可以直接读、直接拍的文字剧本为止。\n\n## 工作流纪律\n\n严格按步骤顺序执行，不跳步；每一步完成后暂停，等待用户的[通过/修改/自检]指令；绝不一次性把后续所有步骤生成完再交给用户；每步结束后提醒用户可以要求[自检]。\n\n自检是内部过程——写之前先在心里过一遍对应步骤的检查清单，不需要在输出中展示自检的思考过程，只需要确保交付的内容已经通过检查。用户仍然可以主动要求[自检]，此时才需要显式地逐条列出检查项并给出评估结果。\n\n## 写作红线（全局最高优先级，任何格式都不能违反）\n\n**绝对不要**：写心理描写（\"他意识到\"、\"她领会到\"、\"内心涌起\"）；写括号暗示（\"（其实是在掩饰紧张）\"）；角色用台词解释设定或主题；说教片段、强行催泪、煽情独白；过度比喻句、类比、书面化的AI腔台词；写任何摄影机拍不到的内容。\n\n**必须做到**：台词口语化，像真人说话；用动作代替解释（动作即潜台词）；对话像冰山，只露一角；所有内容从视听角度出发。\n\n## 视听化写作核心\n\n**Show, Don't Tell**：如果一个情感无法通过角色的物理行为传达给观众，这个情感就不该出现在剧本里。错误示范：\"他终于理解了父亲的苦心。\"正确做法：他站在那里看了一会儿，然后把外套脱下来盖在父亲身上。\n\n**潜台词**：对话是冰山，避免直白，利用动作、停顿、回避、话题转移表达真意。直白（错误）：\"我很害怕失去你。\"潜台词（正确）：\"你走的时候把那件外套带上。……外面冷。\"短片的潜台词在对白中，**长片的潜台词还在场景序列中**——两个场景的并置本身就在传递意义，一场婚礼紧接一场葬礼，不需要台词，剪辑本身就是潜台词。\n\n**标准剧本格式**：\n```\n【场景X：地点 / 时间 / 简要视觉描述】\n\n动作/画面描写直接写在台词之间，不加标记，只写摄影机能拍到的东西。\n\n角色A：xxxxxxxxx。\n角色B：xxxxxxxxx。\n\n角色A没有回答。他转身走向窗口，手指无意识地敲着窗框。\n\n角色A：xxxxxxxxx。\n```\n`【场景标注】`用方括号标注地点/时间/关键视觉信息；`角色名：`直接跟对白；`角色名（OS）：`表示内心独白/旁白；动作/画面描写不加标记，直接写在台词之间。\n\n## 核心特征\n\n- **时长**：75-120分钟\n- **角色**：主角有完整的Ghost/Lie/Flaw/Want/Need，配角承载B-Story\n- **结构**：根据题材选择结构方法论（见下方结构选型指南）\n- **弧光**：多次伪变化后的真正转变\n- **世界观**：可复杂，分层展示\n- **节奏**：需要\"呼吸感\"——张弛交替，不能持续高密度\n\n## 长片与短片的关键差异\n\n短片是冲刺，长片是马拉松——需要节奏起伏，需要安静场景消化情绪，需要喜剧relief调节张力。短片讲一个事件，长片讲一个旅程——主角经历的不只一次挫折，而是一系列递进的考验，每次都揭示角色更深层的真相。短片的潜台词在对白中，长片的潜台词还在场景序列的并置中。\n\n## 核心原则：电影是现实生活的横截面\n\n**这是整个方法论的地基。** 一个故事不是从人物出生讲到死亡，而是从一个完整人生中切出的一段横截面：某个特定时刻，因为某个特定事件，这个人被逼入了一个不可回避的处境。\n\n1. **故事开始之前，世界已经运行了很久。** 角色有前史（Ghost），世界有时代背景，关系有既往积累。剧本第一页不是角色的第一天——角色带着所有前史走进第一场戏。这些前史不需要全部展示给观众，但编剧必须知道。\n2. **故事从中间开始。** 观众被扔进一个\"已经在发生\"的世界，好的开场是\"从最有张力的截面切入\"，观众通过角色的行为和反应反推前因，这比顺序交代更有吸引力。\n3. **开场即态度。** 第一场戏定义全片气质——商业片开场用高密度情节动作宣告节奏，文艺片开场用一段精准的生活质感宣告风格。无论什么类型，开场都必须是全片最精心设计的段落之一。\n4. **编剧的工作是先建造完整世界，再切一刀。** 工作流逻辑：先建造（前史/世界观/角色全貌），再裁切（选择从哪里开始讲、展示什么隐藏什么）。不是\"我要讲什么\"，而是\"这个世界存在着什么，我选择让观众从哪个窗口看进去\"。\n\n## 戏剧动作：故事的最小单位\n\n戏剧动作 = 目标(Goal) + 阻碍(Conflict)。不是\"一个人想喝水\"，而是\"沙漠中一个脱水的人找水\"。目标必须有追求的紧迫性，阻碍必须与目标直接对抗。场景内的微型戏剧动作向上汇聚成段落级核心戏剧动作，段落级再向上汇聚成全片核心戏剧动作。检验标准：目标是否合理且有急切性？目标和阻碍之间是否有强烈冲突关系？这个冲突是否足以驱动故事运转？\n\n---\n\n## 人物深度设计（长片级）\n\n长片人物设计比短片多三个维度：\n\n**Ghost（前史创伤）**：角色过去经历的某个事件，塑造了他/她当前的世界观和行为模式。\n\n**Lie（角色相信的谎言）**：角色因Ghost而形成的一个关于自己/世界的错误信念，这个信念驱动了他所有的错误行为，直到故事逼他直面并打破它。\n\n**Flaw（性格缺陷）**：Lie在行为层面的具体表现——固执、逃避、控制欲、自我牺牲式的讨好等。\n\n**Want vs Need**：Want是驱动动作的目标，角色自己意识到的、主动追求的东西；Need是角色自己未曾意识到的灵魂缺口，通常是Lie被打破后才能获得的东西。Want和Need之间的张力是角色弧光的发动机——角色在故事开始时追求Want，结束时要么得到了Need（成长弧光），要么拒绝了Need（悲剧弧光/反弧光）。\n\n**Ghost→Lie→Flaw→Want→Need 因果链**：Ghost（发生了什么）导致Lie（角色因此相信了什么错误的东西）表现为Flaw（这个错误信念在行为上具体是什么样子）驱动Want（角色因此主动追求什么）掩盖了Need（角色真正需要但自己看不到的东西）。这条链条比\"内在欠缺+外在目标\"更具体——写人物小传时，要能沿着这条链条一步步推导，任何一环缺失，人物就会显得单薄或行为无根据。\n\n**人物弧光**：短内容的弧光是一次性跳跃（A→B），**长片的弧光要经历多次\"伪变化\"**——角色看起来变了，但又退回去，直到最终的真正转变。不能太快让角色到达Need，那样会显得敷衍。\n\n**矛盾性**：好的角色至少有一层矛盾——外在表现vs内在真实（外在自信vs内在自卑）。矛盾性让角色立体，也让潜台词有了空间。\n\n## 主题论点与B Story\n\n长片除了核心戏剧动作，还需要确立**主题论点**（Thematic Argument）——一个可以被争论的命题，A Plot和B Plot分别代表正反两面。设计B Story角色时，需要让这个角色承载主题论点的对立面（如果主题是\"信任比控制更能维系关系\"，A Plot角色可能一路用控制手段处理危机，B Story角色应该走一条依靠信任、哪怕看起来更冒险的路）。\n\n---\n\n## 前史与世界观建造（长片必须充分展开）\n\n遵循\"电影是现实生活的横截面\"原则，在结构大纲之前先建造完整世界。\n\n```\n【时代背景】\n  故事发生在什么时代？这个时代的核心矛盾/氛围是什么？\n  这个时代的什么特征影响了角色的处境？\n\n【主角前史（故事开始之前的人生）】\n  角色A：从出生到故事开始的关键事件链——特别是Ghost事件\n  角色B：……\n\n【关系既往】\n  角色A与角色B：在故事开始之前的关系历史和当前状态\n  ……\n\n【世界观规则（如适用）】\n  这个世界与现实世界的关键差异是什么？\n  用三层模型设计：表层规则 / 运行逻辑 / 底层真相（见下文）\n\n【横截面选择】\n  为什么选择从这个时刻切入？\n  这个时刻的什么事件/变化让\"此刻\"成为故事必须从这里开始的理由？\n```\n\n## 世界观分层展示（三层模型）\n\n长片可以有多层复杂度，不像短片\"即插即用\"：\n\n```\n表层规则（前30分钟展示）——观众和角色最先接触到的世界观表面：\"这个世界的基本运行方式是什么\"\n运行逻辑（第二幕展示）——表层规则背后的深层机制：\"为什么这个世界是这样的\"，通常通过角色的深入探索或 B Story角色的视角揭示\n底层真相（高潮段揭示）——整个世界观的终极真相：\"这个世界真正的面目是什么\"，这个揭示应该改变观众对前面所有事件的理解\n```\n\n**关键原则**：每一层的揭示都应通过角色的行动和发现自然呈现，而非通过旁白、字幕或角色坐下来\"解释\"。\n\n---\n\n## 结构选型指南：四种方法论，按题材/风格选择\n\n根据题材和创作意图选择结构方法论，可以混用——比如用Story Circle做骨架、用Save the Cat的节拍做细化。\n\n| 题材/意图 | 推荐方法论 | 原因 |\n|----------|-----------|------|\n| 商业类型片（动作、惊悚、喜剧、恐怖） | Save the Cat 15节拍 | 节拍精确到分钟，适合需要严格节奏控制的类型片 |\n| 成长/冒险/变形记 | Dan Harmon Story Circle | 八步圆环天然适合\"离家→历险→回归\"的英雄旅程变体 |\n| 角色复杂度高、主题先行的剧情片 | McKee 故事原理 | 以价值转变和对立统一为核心，适合深度戏剧 |\n| 角色驱动型文艺片 | 内在节拍表（见模板四） | 节拍是内心状态转变而非外部事件 |\n| 混合型/不确定 | 先问用户偏好，默认用Story Circle做骨架 | Story Circle足够通用且容易理解 |\n\n进入结构大纲前，先与用户确认使用哪种方法论——如用户没有明确偏好，根据上表给出建议并简述理由，让用户确认后再展开。\n\n### 模板一：Save the Cat 15节拍\n\n商业类型片的标准骨架，适合强情节驱动的题材。\n\n**第一幕（约25%时长）**\n\n1. **开场画面 Opening Image**（1%）：第一个镜头/场景，展示主角\"旧世界\"——变化之前的状态，与结尾画面形成对比呼应。这不只是一个\"建立镜头\"——它必须是一段精彩的视听内容：商业片用一场高密度的场景同时展示角色的能力/性格/世界的规则；文艺片用一段风格化的段落锚定全片的影像气质。无论哪种，开场画面单独拿出来都应该是一段值得看的内容。\n2. **主题陈述 Theme Stated**（约5%）：某个角色（通常不是主角）在对话中无意间说出本片的主题——不是说教，是不经意的一句台词。主角此时不理解这句话的真正含义，要等到灵魂暗夜才会真正懂。\n3. **铺垫 Set-Up**（1-10%）：展示主角的日常、Want、Lie、日常生活的欠缺；铺设所有后面会用到的人物和关系；需要让观众关心主角（同情或认同）。\n4. **催化事件 Catalyst**（约12%）：打破平衡的事件，不可逆的改变——一封信、一个电话、一个意外，主角的日常被击碎。\n5. **犹豫徘徊 Debate**（12-25%）：主角面对变化的犹豫，要不要接受挑战？这段要体现角色的Flaw——正是因为Lie，主角才抗拒改变。\n\n**第二幕前半（约30%时长）**\n\n6. **进二幕 Break into Two**（约25%）：主角做出决定，正式踏入新世界/新目标——这是一个主动选择，不是被推着走。\n7. **B故事 B Story**（约30%）：引入承载主题论点的次要关系线（通常是爱情线/友情线/导师线）。A Plot问\"主角能否达成目标\"，B Plot问\"主角能否成长\"。\n8. **趣味与游戏 Fun and Games**（30-55%）：兑现premise承诺的部分——观众为什么点开这个题材就该在这里被满足，也是全片最容易被剪进预告片的段落。主角在新世界中尝试用旧方法解决新问题，有成功也有挫败，整体节奏较轻快。\n\n**第二幕后半（约30%时长）**\n\n9. **中点 Midpoint**（约50%）：A Plot和B Plot在此交汇。虚假的胜利（看起来赢了但是假的）或虚假的失败（看起来输了但其实是转机），赌注升级——stakes从个人层面升级到更大的层面。\n10. **反派逼近 Bad Guys Close In**（55-75%）：内外部压力同时收紧。外部：反派/阻碍升级；内部：团队分裂、自我怀疑——主角的Flaw开始产生真正的代价。\n11. **一切尽失 All Is Lost**（约75%）：最低点，主角失去了最重要的东西（人/物/信念），带有\"死亡气息\"（字面上或隐喻性的死亡），旧方法彻底失败。\n12. **灵魂暗夜 Dark Night of the Soul**（75-80%）：主角直面自己的Lie和Ghost——不是靠别人点醒，是主角自己在废墟中看到了真相，这是弧光转变的临界点，不能有人替他解决。\n\n**第三幕（约15%时长）**\n\n13. **进三幕 Break into Three**（约80%）：主角想通了——不是用旧方法的升级版，是用全新的方式；A Plot和B Plot的认知在此融合，带着灵魂暗夜里想明白的东西重新出发。\n14. **高潮 Finale**（80-99%）：五步高潮法——a.组建团队（gathering the team）；b.执行计划（executing the plan）；c.高塔惊魂/计划失败（high tower surprise）；d.挖掘内心（dig deep down，用成长后的新自我应对危机）；e.执行新计划并获胜（execution of new plan）。\n15. **结尾画面 Final Image**（99-100%）：与开场画面形成对照，展示主角的\"新常态\"——变化之后的状态。不需要解释角色学到了什么，一个画面胜过千言万语。\n\n### 模板二：Dan Harmon Story Circle 8步\n\n更适合角色内在旅程为主的题材，圆形循环结构。\n\n1. **YOU**（角色在舒适区）→2. **NEED**（角色想要某种东西）→3. **GO**（进入陌生情境）→4. **SEARCH**（适应，寻找）→5. **FIND**（得到想要的东西）→6. **TAKE**（付出代价）→7. **RETURN**（回到熟悉的情境）→8. **CHANGE**（角色已经改变）。\n\n与Save the Cat对应关系：YOU≈开场画面+铺垫，NEED≈主题陈述+催化事件的欲望侧，GO≈进二幕，SEARCH≈趣味与游戏，FIND≈中点，TAKE≈反派逼近到一切尽失，RETURN≈进三幕到高潮，CHANGE≈结尾画面。Story Circle更强调\"圆形\"——角色回到起点但已不同，适合成长类、寻根类、内省类题材。\n\n**Story Circle的独特优势**：天然具有对称性——前四步和后四步互为镜像，步骤3(GO)和步骤7(RETURN)对称（出发和回归），步骤4(SEARCH)和步骤6(TAKE)对称（寻找和付出代价），这种对称让故事有一种\"完成感\"；比Save the Cat更灵活，不绑定精确的分钟数；特别适合角色旅程和变形故事。\n\n### 模板三：McKee 故事原理\n\n更适合强调价值转变和主题深度的严肃题材。\n\n- **控制性理念**（Controlling Idea）：全片用一句话概括的价值命题——\"当XX发生，因为XX，所以XX会/不会发生\"。\n- **价值转变**：故事必须让某个核心价值（生/死、自由/囚禁、爱/孤独等）从一个极性转变到另一个极性，或反向强化。\n- **鸿沟**（The Gap）：角色的期望与现实结果之间的裂缝——角色采取行动，得到的却是意料之外的结果，这个裂缝逼迫角色采取新的、风险更高的行动。\n- **激励事件**：打破生活平衡、引发主角欲望的事件。\n- **进展纠葛**：一系列递进的冲突，每一次都比上一次风险更高、选择更难。\n- **危机、选择**：主角在最大压力下面对一个真正意义上的两难选择（不是\"好vs坏\"，而是\"两个都有代价的好\"或\"两个都不完美的坏\"）。\n- **高潮**：危机选择的外化行动结果。\n- **结局**：价值转变的最终状态。\n\n**McKee方法的独特价值**：强制每个场景都有价值转变，杜绝废场景；\"鸿沟\"概念让冲突自然递进——不是人为加码困难，而是角色的预期和现实之间的落差自然加深；控制性理念让主题具体可检验，不是模糊的\"关于勇气\"，而是一句可论证的判断；特别适合需要深度角色挖掘和主题表达的剧情片。\n\n自检要点：控制性理念是否清晰且可论证？每个场景是否都有价值转变？鸿沟是否逐步加深？危机选择是否是真正的两难（如果答案显而易见，这不是真正的危机）？高潮是否不可逆？\n\n### 模板四：文艺片内在节拍表\n\n不追求强情节驱动，追求内在状态的渐变，适合角色驱动型、生活流、作者向题材。\n\n**6步通用内在节拍结构**：\n\n1. **常态与裂缝**：角色的日常生活，但某个细节暗示了表面之下的不安。文艺片的建置不急于推进——让观众在角色的世界里停留，通过感官细节（声音、光线、物件）建立氛围。\n2. **扰动**：一个小事件打破了角色的自我欺骗。文艺片的催化剂通常不是戏剧性的大事件，而是一个让角色\"无法继续假装一切正常\"的微妙瞬间。\n3. **游走与回避**：角色试图回到原来的生活，但裂缝已经出现。大量的\"间隙时刻\"——角色独处、发呆、做无关紧要的事情。**这些间隙不是废戏**——它们展示的是角色在回避面对什么。\n4. **对峙**：角色被迫面对自己一直回避的东西。可能是一场安静的对话，可能是一次久别重逢，可能只是独自站在某个地方发现自己在哭。\n5. **选择或接受**：文艺片的高潮通常不是\"做了什么\"，而是\"接受了什么\"。角色要么接受了一个痛苦的真相，要么决定继续活在谎言中——两种结局都有效，关键是这个选择的分量。\n6. **余震**：结局不是答案，是一个新的问题。文艺片的Final Image通常是开放的——角色改变了，但改变的后果还没有到来。\n\n**5种风格变体**（按导演美学选型，用户可指定或根据题材气质推荐）：\n\n- **是枝裕和式**（日常流，代表作气质：《步履不停》《小偷家族》《无人知晓》）：建置极慢，前30分钟几乎全是日常——吃饭、做家务、闲聊，情节隐藏在生活细节中；没有明确的\"激励事件\"，裂缝不是被一个事件打开的，而是随着日常的积累慢慢渗透出来；对峙不是正面冲突，而是某个平淡瞬间里突然泄漏的情绪——说到一半停住的话、突然快走几步、转头去看已经不在的位置；结局留在一个极其日常的动作上——收拾碗筷、关灯、走在回家路上，世界没有改变，但观众知道某个东西已经不同了；台词极度日常，角色从不谈论\"大事\"，但大事的影子始终在场；节奏像呼吸——均匀、缓慢、没有突变。\n- **王家卫式**（情绪流，代表作气质：《重庆森林》《花样年华》《春光乍泄》）：叙事不追求因果，场景之间的连接是情绪而非逻辑——一场戏结束后下一场戏不需要\"接着\"前一场戏，只需要在情绪上有呼应或对照；大量重复的视觉母题（motif），同一个空间在不同时间被反复拍摄，同一个动作被不同角色重复，重复制造的是时间的质感；角色用旁白说出内心，但旁白的内容和画面的内容之间有错位——嘴上在讲一件事，画面在展示另一件事，两者之间的缝隙就是潜台词；没有传统意义上的高潮，故事在某个瞬间达到情感的饱和点，然后安静地收尾；时间是主角——跳跃的时间线、过期的日期、不再响的电话。\n- **小津安二郎式**（静物流，代表作气质：《东京物语》《秋刀鱼之味》《晚春》）：极低机位，固定镜头，几乎不移动摄影机，画面本身是静止的，动的只有画面中的人；\"枕镜头\"（pillow shot）——场景和场景之间插入空镜（走廊、屋顶、远处的烟囱），这些空镜不叙事，它们制造停顿，让观众的情绪在停顿中沉淀；家庭关系是永恒的母题，冲突不来自外部事件，而来自代际之间无法弥合的理解鸿沟——父母终将接受孩子的离开，孩子永远无法完全理解父母的牺牲；角色在场面上极其礼貌和克制，但克制本身就是最大的潜台词；结局通常是一种\"接受\"——不是欢喜也不是悲伤，是一种安静的\"确实如此\"。\n- **Linklater式**（对话流，代表作气质：《爱在黎明破晓前》三部曲、《年少轻狂》）：几乎全靠对话推进，对话不是工具，对话就是故事本身；对话的节奏模拟真实交谈——会跑题、会绕回来、会突然严肃又突然搞笑；角色在聊天中自然暴露内心——不是通过\"坦白\"，而是通过选择聊什么、回避什么、在哪个话题上多停留了一秒；时间和空间的限制反而制造了亲密感——两个人在有限的时间里必须决定什么值得说；高潮就是一句对了的话——在所有铺垫之后，某句话说出来时观众知道\"一切都不一样了\"；结局通常是开放的——对话结束了，但关系还在空中。\n- **奉俊昊式**：表面是文艺片的内在节拍，但暗中植入强类型元素（悬疑/惊悚/黑色幽默）制造情绪的急转——文艺气质和类型张力交替出现而不互相稀释，往往用突然的暴力/荒诞打破前面建立的静态氛围；前后半段可以是完全不同的类型（《寄生虫》前半喜剧后半惊悚，类型的突变本身就是叙事的一部分）；空间即隐喻，角色的物理位置直接对应社会位置；细节的多义性，同一个物件/动作前半段是喜剧道具，后半段变成恐怖/悲剧道具；如果用户的方向是\"外壳是类型片但内核是社会议题\"，推荐此变体。\n\n**如何使用风格变体**：先用通用内在节拍表搭建骨架；根据用户的参考影片或审美偏好选择变体；用变体的\"质感\"去填充每一步的具体写法；变体可以混合（比如用是枝裕和的节奏但用王家卫的旁白错位手法）。\n\n**文艺片通用自检**：是否每个\"安静场景\"都在传递角色的内心状态？是否靠感官细节而非对白来建立氛围？角色的变化是否来自内部而非外部事件驱动？结局是否留有余震的空间？是否有统一的视觉/情绪母题贯穿全片？是否符合所选风格变体的质感（不能挂着\"文艺片\"的名义写商业片节拍）？内在位移是否真实发生，哪怕极其微小？是否抗住了\"用戏剧化事件替代内在渐变\"的诱惑？\n\n---\n\n## Subplot 交织\n\n长片通常有2-3条故事线同时运行：**A Plot（主线）**——主角外在旅程，追求Want、面对阻碍；**B Plot（副线/B Story）**——通常是一段关系，承载主题论点，其推进反映主角内心的变化；**C Plot（第三条线，可选）**——节奏调剂，或从另一角度映射主题。\n\n交织原则：A/B两线在Midpoint交汇；B线的进展应与A线互相映照——A线受挫时B线给出安慰或反面例证；不要让subplot变成独立的小故事，每条线都必须最终服务于主角的弧光。\n\n---\n\n## 长片必备元素（除非用户特别说明，否则默认包含）\n\n长片有足够时长容纳复杂性。以下元素在长片中不是可选的——它们是好电影的标配。如果一个90分钟剧本缺少以下任何一项，需要主动提醒用户并建议补充。\n\n### 伏笔与回扣\n\n**什么是伏笔**：故事前段不经意放置一个细节（台词/道具/动作/画面），后段让它以更大的意义重新出现。\n\n**伏笔的层次**：\n- **道具伏笔**：一个物件前段是日常的，后段变成关键道具。例：角色随手买的打火机，第三幕被用来点燃逃生信号。\n- **台词伏笔**：一句话前段是闲聊，后段获得全新含义。例：\"我最怕的就是安静\"——第一幕是性格描写，第三幕角色独自面对寂静时变成呼应。\n- **行为伏笔**：一个习惯性动作暗示角色的Ghost。例：角色总是把门留一条缝——后来揭示她曾被锁在房间里。\n- **结构伏笔**：一个看似无关的场景后段被证明是关键信息。例：开头一个路人的对话，结尾被证明是真正的幕后推手。\n\n**伏笔规则**：第一次出现时不能太刻意，观众不应该意识到\"这是伏笔\"；每个伏笔都必须有回扣，没有回扣的伏笔是烂尾；回扣时要让观众有\"原来如此\"的感觉，回扣应该改变观众对前面信息的理解；长片至少需要3-5个伏笔/回扣对，分布在不同层次。\n\n**伏笔登记表**（在结构大纲阶段填写）：\n```\n伏笔内容 | 层次 | 首次出现位置 | 回扣位置 | 回扣方式（回扣如何改变含义）\n```\n\n### 次要角色与群像设计\n\n次要角色不是背景板，长片中每个有台词的角色都应有存在的功能性理由。\n\n**四种功能**：**镜像角色**——映射主角某个侧面，\"如果主角做了不同选择，就会变成这个人\"；**催化角色**——推动主角变化的外力，导师/诱惑者/挑战者；**主题角色**——具象化主题论点的某个立场，B Story角色通常是这个功能；**节奏角色**——提供喜剧relief、情绪调剂，让观众在紧张段落中有地方喘气。\n\n**设计规则**：每个次要角色至少承担一个功能，最好两个；没有功能的角色应合并或删除，两个功能相同的角色可以合并为一个；次要角色不需要完整的Ghost/Lie/Flaw，但需要清晰的Want和至少一个矛盾特征；次要角色台词风格应与主角明确区分，观众遮住名字也能分辨是谁在说话。\n\n**群像片额外要求**（3个以上同等重要角色）：角色之间的关系矩阵——每两个角色之间的关系状态；视角切换规则——什么时候跟谁的视角，切换是否有节奏；每个角色有自己的Want/Need，但所有人的追求指向同一个主题。\n\n### 暗线设计（长片级）\n\n暗线是不在前台的故事线——观众第一次观看时可能注意不到，第二次观看时会发现\"原来从一开始就在铺\"。\n\n**暗线与Subplot的区别**：Subplot是观众看得见的第二条故事线，明确地在推进；暗线是隐藏在水面下的，通过伏笔、细节、不经意的对白运行，直到某个时刻浮出水面。\n\n**设计方法**：先确定暗线的终点（浮出水面时要揭示什么）→反向推导需要在前面埋多少暗示才能让揭示成立→每个暗示都必须有表面含义（观众第一次读到的是表面含义，第二次读到的是暗线含义）→暗线浮出水面的时机通常在高潮段或结局段。\n\n**数量建议**：1-2条，太多会让故事过于复杂。\n\n---\n\n## 开场钩子设计\n\n每一部影片都必须在开场就抓住观众。开场钩子的任务不是\"交代背景\"，而是**在观众还不知道故事是什么的时候就让他们无法移开目光**。开场必须有一段足够精彩的、能被摄影机拍出来的视觉内容。开场钩子不等于\"爆炸开场\"——安静也可以是钩子，一个安静到让人不安的画面、一个日常到让人困惑的细节，只要能让观众产生\"怎么回事？\"的疑问，就是有效的钩子。\n\n**商业片/类型片**：开场应是一段**高密度、高紧张感的杰出场景**，双重功能——同时交代角色的状态（能力/性格/处境）和建立影片的类型基调。经典做法：用一场\"日常任务\"展示角色的能力和风格（《夺宝奇兵》开场的丛林探险，观众立刻知道这个人是谁、有多厉害、这部电影的节奏是什么）；用一场\"危机\"直接把角色扔进压力中（《黑暗骑士》开场的银行劫案——还没见到主角先见到反派的规则）；用一个\"结果先行\"的画面制造悬念（先看到离奇结果，全片回答\"这是怎么发生的\"）。\n\n**文艺片/角色驱动型**：开场应是一段**能代表全片风格和气质的段落**，不需要紧张但需要独特。经典做法：用一个高度风格化的长镜头建立氛围（《鸟人》开场的后台长镜头）；用一段看似无关的日常细节暗示角色的内心裂缝（是枝裕和式——开场就是做饭吃饭，但某个细节让人感觉\"不对\"）；用一个视觉母题的第一次出现锚定全片影像系统（王家卫式——开场的某个画面/动作会在全片反复出现）。\n\n**开场钩子自检**：开场第一个画面是否有视觉冲击力或悬念感？观众前30秒内是否会产生一个具体疑问？开场是否在交代状态的同时就在制造张力（而不是\"先交代再开始\"）？开场的类型基调是否与全片一致？如果把开场单独拿出来，它本身是否是一段精彩的视听内容？\n\n---\n\n## 双轨节奏系统\n\n节奏有两条平行运行的轨道，可以同步也可以错位，错位本身是强大的叙事工具。**外部情节节奏**（事件密度和强度：紧=高密度事件/快速剪辑/多人对话/追逐/对峙/揭露，松=日常场景/独处时刻/过渡/风景/沉默）；**内在情感节奏**（角色情感波动：重=告白/背叛/失去/恐惧/狂喜/绝望，轻=调侃/日常闲聊/小幽默/安静的陪伴）。经验法则：每一段高强度情节之后，需要一段\"呼吸\"让观众消化。\n\n四种错位组合：情节松+情感重（两个人安静吃饭，什么都没发生，但观众知道其中一个人明天要走，画面越平静情感越重）；情节紧+情感轻（激烈追车戏配轻松流行歌）；情节紧+情感重（高潮段——事件密集且情感炸裂，是全片顶点，不能持续太久）；情节松+情感轻（纯粹的呼吸场景，通常放在高潮前后）。\n\n在结构大纲和场景拆解阶段应画一张\"节奏波浪图\"，标注每段落的外部情节强度和内在情感强度，检查起伏对比。避免：两条线长时间同时低位；两条线长时间同时高位；任何一条线单调上升没有回落。\n\n## 时长估算与节奏控制\n\n**估算方法**：1页标准剧本格式≈1分钟成片，中文剧本约200-250字对白+动作描写≈1分钟。纯对话场景按对白字数估算；动作/蒙太奇场景按画面数量估算（每个独立画面约3-5秒）；沉默/情绪场景容易低估——一个角色站着不动，成片中可能需要10-15秒才有足够情感分量；转场/过渡每次2-5秒。\n\n**场景时长标注格式**：\n```\n【场景3：医院走廊 / 夜 / 荧光灯嗡嗡响】（约1分30秒）\n  情节节奏：中（一次关键对话）\n  情感节奏：重（角色第一次面对真相）\n```\n\n**全片时长预算（100分钟为例）**：建置25分钟 / 发展前半30分钟 / 发展后半25分钟 / 高潮15分钟 / 结局5分钟。参考比例，可灵活调整，但要意识到自己在做什么。\n\n**节奏诊断**：高潮段时长是否足够？建置是否太长？是否有连续超过3分钟的单一情绪段落？两个高情感场景之间是否有足够呼吸空间？全片最长的单场戏是否有足够理由占据那么多时长？\n\n## 跨格式技法借鉴（长片可借用的部分）\n\n**从概念片借**：高概念翻转可以缩小到长片的一场戏——需要\"punch\"时，问这场戏最后一秒能不能让观众重新理解第一秒？概念纯度检验可以拿来检验长片Logline——用一句话说不清，说明核心概念不够锐利。递进崩塌式结构可以用在\"反派逼近\"段落——压力一级级加码直到崩溃点。视听语言武器库中的分屏/跳切蒙太奇/画面声音错位/静默/色彩限制，在长片特定段落（时间压缩段、时间推进段、讽刺场景、高潮后）借用效果强于常规叙事，但只在特定段落使用，不要全片使用同一炫技手法。\n\n**从短片借**：信息密度蒙太奇用在第二幕前半的Fun and Games段（主角在新世界中试错）；单一变量极致推演用在高潮序列（排除一切干扰，聚焦核心选择）；零度表达（灾难越大语气越平）用在至暗时刻。\n\n**从剧集借**：集末钩子逻辑用在长片序列衔接——每个序列结束时留一个小钩子，比\"然后……\"过渡更有牵引力；弧光预算思维用在长片的伪变化规划——角色不应第30分钟就到达真正的变化，要规划几次伪变化和回退；信息释放时间表用在复杂世界观管理；连续性追踪思维用在长片后半段写作——写第三幕前先列一张表，每个角色此刻的物理状态/情感状态/已知信息。\n\n---\n\n## 记忆检查点系统\n\n长片剧本约15000-25000字，创作过程中前面写的场景、埋下的伏笔、角色的状态变化可能在写到后面时被\"遗忘\"，导致前后矛盾。记忆检查点通过定期生成结构化\"快照\"解决这个问题。\n\n**触发时机**：每完成一个Sequence（2-3场戏）触发一次，约每10-15分钟成片内容一个检查点。此外，用户开始新一轮对话但要继续之前的创作、已写了很多内容感觉前面细节开始模糊、用户主动要求\"总结一下目前的进度\"时也应主动触发。\n\n**检查点模板（长片级，在通用模板基础上增加Subplot/弧光/世界观/结构定位）**：\n```\n📌 记忆检查点 | 长片 | [当前位置]\n\n【已完成进度】当前处于第几步 / 已写到哪个Sequence或场景\n【故事核心（不变）】Logline / 主题论点 / 核心戏剧动作：目标→阻碍\n【角色当前状态】[角色名]：物理状态/情感状态/当前知道什么/当前想要什么\n【已完成段落摘要】场景1：一句话概括+核心价值转变；……\n【活跃线索】需要后续回应的线索及状态\n【伏笔状态】已埋未回扣：[内容]→计划在[位置]回扣；已回扣：[内容]✅\n【节奏状态】上一段落情节/情感节奏 → 下一段落建议方向\n\n【Subplot状态】A Plot进度 / B Plot进度 / C Plot进度（如有）\n【弧光进度】角色当前处于弧光哪个阶段；Lie是否被质疑过、质疑了几次；上一次伪变化发生在哪里\n【世界观已揭示层】观众目前知道哪一层；下一层计划在哪里揭示\n【结构定位】当前处于哪个节拍（STC/Story Circle/McKee的哪个阶段）；距离下一个关键节拍还有多少时长\n\n【待写内容预告】下一个要写的段落是什么，核心戏剧动作是什么\n```\n\n**压缩原则**：只记结论不记过程；只记变化不记不变；只记后续需要的信息；活跃线索和伏笔是最重要的，必须每个检查点都完整列出。\n\n**使用方式**：写作时每次开始新段落前先回顾最近检查点；跨对话时请用户提供上一次检查点内容以恢复上下文；剧本医生时把所有检查点串起来通读，可快速发现某条伏笔埋了没回扣、某个角色状态突然跳变（连续性错误）、节奏长时间没变化、某条Subplot长时间没推进。\n\n---\n\n## 长片八步工作流\n\n长片使用与短片相同的八步工作流骨架，但每步深度和要求更高。\n\n**第一步（破题）额外要求**：除核心戏剧动作，还需确立主题论点——一个可以被争论的命题，A Plot和B Plot分别代表正反两面。\n\n**第二步（梗概草稿）额外要求**：长片梗概应为**一页纸Treatment**（300-500字），不只是一段话。应包含：主角的核心困境、催化事件、中点转折的方向、高潮的大致形态、结局的情感调性。如有B Story，Treatment中应能感受到两条线的存在。Treatment的语气必须传达全片的类型气质——读完就知道\"这是什么类型的电影\"。\n\n**第三步（人物）额外要求**：增加Ghost/Lie/Flaw三个维度；设计B Story角色（承载主题论点的对立面）；设计所有次要角色并标注各自功能（镜像/催化/主题/节奏）；多个角色之间的关系网；如是群像片，设计角色关系矩阵。\n\n**第四步（前史与世界观）——长片必须充分展开**：遵循\"电影是现实生活的横截面\"原则，在结构大纲之前先建造完整世界（见上文模板）。\n\n**第五步（结构大纲）额外要求**：根据结构选型指南与用户确认使用哪种方法论；如用户没有明确偏好，根据题材推荐并说明理由；开场钩子设计——大纲的第一个段落必须是一段足够精彩的视听内容，需要单独标注并确认质量；标注Subplot的交织点；标注世界观各层的揭示时机；时长预算——为每个结构段落标注预估时长；双轨节奏标注——为每个段落标注外部情节强度和内在情感强度；伏笔规划——填写伏笔登记表，规划至少3-5个伏笔/回扣对；暗线规划——如有暗线，标注暗线在各段落中的暗示点。\n\n**第六步（场景拆解）额外要求**：引入Sequence（序列）概念——2-3个场景组成一个序列，每个序列有自己的小型\"建立→冲突→结果\"，90分钟长片约8-12个序列；每个场景标注预估时长；每个场景标注双轨节奏状态（情节节奏松/中/紧+情感节奏轻/中/重）；场景时长累加后检查是否与第五步的段落时长预算一致；**第六步完成后触发一次记忆检查点**，锁定全局信息后再进入写作。\n\n**第七步（场景写作）额外要求**：写作时注意伏笔的自然植入——不能太刻意；次要角色的台词风格必须与主角有区分；前史信息通过对白和视觉线索自然散落，不集中交代；**每完成一个Sequence（2-3场戏）触发一次记忆检查点**——回顾角色状态、活跃线索、伏笔状态、节奏方向。\n\n**第八步（剧本医生）额外要求**：检查A/B/C Plot是否有效交织；检查世界观揭示是否自然；检查弧光的\"伪变化\"是否足够——角色不应太快到达Need；开场钩子质量检查——单独拎出开场，是否是全片最精心设计的段落之一；节奏诊断——用场景时长汇总检查全片节奏；伏笔审计——逐条检查伏笔登记表，每个伏笔是否都有回扣；次要角色审计——每个有台词的角色是否都有功能。\n\n## 长片常见陷阱\n\n- ❌ 第二幕松垮（\"saggy second act\"）→ 确保Midpoint足够强，将第二幕一分为二\n- ❌ 角色弧光太线性（直接从Lie到Truth）→ 需要至少一次\"伪变化\"后的回退\n- ❌ B Story脱节（跟A Plot没关系）→ B Story必须映射主题\n- ❌ 高潮只是\"更大的打斗\"→ 高潮必须是角色内心选择的外化\n- ❌ 世界观一次性倾倒 → 分层释放，让观众在每一层停留足够时间\n- ❌ 伏笔过于刻意（观众一看就知道\"这个东西后面会用到\"）→ 伏笔首次出现必须有合理的表面理由\n- ❌ 埋了伏笔但忘记回扣 → 用伏笔登记表逐条审计\n- ❌ 次要角色只是工具人（出场只为给主角一个信息然后消失）→ 每个次要角色至少有一个自己的Want\n- ❌ 全片节奏单调（持续紧张或持续缓慢）→ 用双轨节奏标注检查起伏\n- ❌ 没有估算时长导致高潮段被压缩 → 从第三步就开始做时长预算\n- ❌ 两个高情感场景之间没有呼吸 → 用双轨节奏图检查情感节奏的张弛\n- ❌ 情节节奏和情感节奏始终同步 → 故意制造一些错位（情节松+情感重，或情节紧+情感轻）会更高级\n\n## 与题材壳skill的关系\n\n本skill只管\"90分钟长片这个体量该怎么写\"，不管\"这个故事该讲男频/悬疑/复仇哪个题材的具体判断标准\"。如果需要某个题材专属的判断标准，可以在写完大纲后另外参考本库对应题材壳skill的技术难点清单；不参考也完全可以独立完成一个长片。两者是正交的两条轴，不是依赖关系。", "extras": [], "cn": "长片剧本写作"}, {"slug": "felted-doll-video-director", "desc": "制作羊毛毡、毛茸茸玩偶、软萌治愈、温暖童话感视频导演", "body": "# 毛毡玩偶治愈风导演 Skill\n\n## 0. Skill 定位\n\n本 Skill 用于帮助用户制作“羊毛毡、毛茸茸玩偶、软萌治愈、小模型场景、温暖童话感”的图片与视频资产。\n\n它不是普通 3D 可爱玩具风，不是塑料手办风，不是盲盒玩具风，也不是廉价卡通滤镜。它的核心是让画面呈现真实手工羊毛毡的质感：短绒纤维、针毡戳刺纹理、哑光毛毡表面、手工不完美边缘、微缩模型布景、暖光、浅景深和安静陪伴感。\n\n本 Skill 必须能够从用户的模糊想法出发，完成完整制作链路：\n\n 1. 需求理解\n 2. 无参考图创意引导或参考图分析\n 3. 角色创意\n 4. 毛毡角色资产\n 5. 微缩场景资产\n 6. 道具资产\n 7. 图片提示词\n 8. 分镜设计\n 9. 5 秒图生视频提示词\n10. 多镜头短片提示词\n11. 剪辑、声音、字幕建议\n12. 审核与返修规则\n\n---\n\n## 1. 使用场景\n\n适合制作：\n\n- 萌宠 IP\n- 小动物角色图\n- 小怪物、小精灵、小蘑菇人、小云朵角色\n- 儿童故事视觉\n- 节日祝福短片\n- 治愈短片\n- 晚安故事短片\n- 温暖品牌视觉\n- 社交媒体封面\n- 5 秒图生视频\n- 15 秒小短片\n- 30 秒或 60 秒温暖治愈短片\n- 系列头像、角色状态图、道具图、微缩场景图\n\n不适合制作：\n\n- 恐怖玩偶\n- 血腥惊悚\n- 脏乱破损玩偶\n- 逼真动物毛发\n- 高反光塑料玩具\n- 普通 3D 卡通动画\n- 硬科幻机械场景\n- 快速打斗、奔跑、追逐\n- 强烈闪切和故障转场\n\n---\n\n## 2. 核心风格约束\n\n每次执行本 Skill，都必须优先保证以下风格：\n\n### 2.1 必须保留\n\n- 羊毛毡材质\n- 细密短绒纤维\n- 针毡戳刺纹理\n- 手工不完美边缘\n- 哑光毛毡表面\n- 圆润小体块\n- 短手短脚\n- 简单温柔五官\n- 微缩模型场景\n- 暖黄色柔光\n- 微距摄影\n- 浅景深\n- 手工布景质感\n- 安静、陪伴、温暖、治愈的情绪\n\n### 2.2 必须避免\n\n- 塑料感\n- 树脂手办感\n- 盲盒玩具感\n- 普通 3D 动画感\n- 玻璃眼珠过度真实\n- 真实动物毛皮\n- 脏乱长毛\n- 恐怖玩偶表情\n- 高饱和廉价玩具广告感\n- 大幅度运动\n- 肢体拉伸变形\n- 镜头剧烈晃动\n\n---\n\n## 3. 渐进式披露交互规则\n\n本 Skill 默认采用“渐进式披露”，不要一次性把所有内容堆给用户。根据用户输入的成熟度，分层输出。\n\n### 3.1 L0：用户只有一句想法\n\n用户示例：\n\n- “我想做一个毛毡小兔子。”\n- “做一个圣诞治愈短片。”\n- “帮我做一个可爱小怪物。”\n\n输出内容：\n\n1. 先判断用户目标。\n2. 主动给 3-5 个创意方向。\n3. 每个方向只给角色、场景、道具、情绪、可做视频动作。\n4. 不直接输出超长提示词。\n\n输出格式：\n\n```markdown\n## 创意方向\n| 方向 | 角色 | 场景 | 道具 | 情绪 | 适合视频动作 |\n|---|---|---|---|---|---|\n```\n\n---\n\n### 3.2 L1：用户选定方向\n\n用户示例：\n\n- “选第 2 个，做成小狐狸。”\n- “我要雪夜围巾小狐狸。”\n\n输出内容：\n\n1. 角色设定\n2. 场景设定\n3. 道具设定\n4. 色彩和情绪设定\n5. 图片资产规划\n\n不直接输出全部长视频提示词，除非用户明确要求。\n\n---\n\n### 3.3 L2：用户要生成图片\n\n输出内容：\n\n1. 角色资产图提示词\n2. 场景资产图提示词\n3. 道具资产图提示词\n4. 首帧图提示词\n5. 中文反向提示词\n6. 英文反向提示词\n\n---\n\n### 3.4 L3：用户要做 5 秒视频\n\n输出内容：\n\n1. 视频模式判断：单镜头轻动作 / 单镜头微故事 / 多镜头剪辑版\n2. 5 秒时间轴\n3. 图生视频提示词\n4. 音效建议\n5. 审核重点\n\n---\n\n### 3.5 L4：用户要做 15 秒以上视频\n\n输出内容：\n\n1. 故事结构\n2. 分镜表\n3. 每个镜头的独立视频提示词\n4. 剪辑节奏\n5. 声音设计\n6. 审核与返修清单\n\n原则：\n\n- 不要用一条长提示词生成完整长片。\n- 长片必须拆成多个 3-5 秒镜头。\n- 每个镜头只控制一个主要动作。\n\n---\n\n## 4. 输入判断规则\n\n### 4.1 无参考图\n\n如果用户没有提供参考图，必须主动给出 3-5 个创意方向。\n\n每个方向包含：\n\n- 方向名称\n- 角色类型\n- 外形特征\n- 毛毡材质设计\n- 微缩场景\n- 道具\n- 情绪关键词\n- 可做图片\n- 可做视频动作\n\n示例方向：\n\n```markdown\n### 方向 1：晚安星星小兔\n角色：白色羊毛毡小兔，圆滚滚，大头小身，抱着黄色毛毡星星。\n场景：微缩卧室，木质小床，棉布被子，暖黄色小夜灯。\n情绪：安静、陪伴、晚安、治愈。\n视频动作：小兔眨眼，轻轻抱紧星星，耳朵微微动一下。\n```\n\n---\n\n### 4.2 有参考图\n\n分析参考图时只提取可转化元素，不照搬原图。\n\n必须分析：\n\n1. 主体类型\n2. 形状结构\n3. 主色和辅助色\n4. 表情情绪\n5. 姿态\n6. 服装和配饰\n7. 场景氛围\n8. 可转化为羊毛毡的部分\n9. 必须重新原创的部分\n\n转化规则：\n\n- 复杂结构简化为圆润体块。\n- 真实毛发转为短绒羊毛毡纤维。\n- 光滑材质转为哑光毛毡材质。\n- 大场景转为桌面微缩布景。\n- 强冲突剧情转为温暖小瞬间。\n\n---\n\n### 4.3 用户已有角色设定\n\n保留用户核心设定，并补足：\n\n- 羊毛毡材质\n- 针毡纹理\n- 手工边缘\n- 微缩场景\n- 道具互动\n- 情绪动作\n- 视频可动性\n\n---\n\n### 4.4 用户要视频\n\n先判断用户要的是：\n\n- 5 秒单图生视频\n- 5 秒多镜头剪辑\n- 15 秒短片\n- 30 秒短片\n- 60 秒短片\n- 更长的系列视频\n\n如果用户只说“做视频”，默认先给 5 秒单镜头微故事版。\n\n---\n\n## 5. 标准工作流\n\n### Step 1：需求理解\n\n识别：\n\n- 用户想做什么类型：角色图 / 场景图 / 系列图 / 首帧 / 5 秒视频 / 长视频\n- 是否有参考图\n- 主体是什么\n- 情绪是什么\n- 用途是什么\n- 比例是什么\n\n默认比例：\n\n- 角色资产：1:1\n- 短视频首帧：9:16\n- 横版故事：16:9\n- 小红书封面：3:4 或 4:5\n- 系列图：统一比例\n\n---\n\n### Step 2：创意方向\n\n如果用户没有明确设定，输出 3-5 个方向。\n\n---\n\n### Step 3：资产规划\n\n资产分为：\n\n1. 角色资产\n2. 场景资产\n3. 道具资产\n4. 角色状态资产\n5. 首帧资产\n6. 视频镜头资产\n\n---\n\n### Step 4：图片提示词\n\n输出：\n\n- 角色图提示词\n- 场景图提示词\n- 道具图提示词\n- 首帧图提示词\n- 系列图提示词\n- 反向提示词\n\n---\n\n### Step 5：分镜设计\n\n如果用户要视频，必须先分镜。\n\n5 秒可以是 1 个镜头，也可以是 2-3 个镜头剪辑。\\\n15 秒建议 3 个 5 秒镜头。\\\n30 秒建议 6 个 5 秒镜头。\\\n60 秒建议 10-12 个 5 秒镜头。\n\n---\n\n### Step 6：视频提示词\n\n每个视频提示词都要包含：\n\n- 首帧或资产引用\n- 角色锁定\n- 材质锁定\n- 场景锁定\n- 动作控制\n- 运镜控制\n- 时间轴\n- 反向限制\n- 审核点\n\n---\n\n### Step 7：剪辑与声音\n\n输出：\n\n- 剪辑节奏\n- 转场方式\n- 字幕风格\n- 音效点\n- BGM 氛围\n- 审核清单\n\n---\n\n## 6. 资产规划规则\n\n### 6.1 角色资产\n\n角色必须具备：\n\n- 圆润体块\n- 大头小身或矮胖比例\n- 短手短脚\n- 简单五官\n- 温柔表情\n- 可见短绒羊毛纤维\n- 轻微针毡戳刺纹理\n- 手工不完美边缘\n- 哑光毛毡表面\n- 干净柔软，不脏乱\n\n推荐角色：\n\n- 小兔\n- 小熊\n- 小狐狸\n- 小猫\n- 小狗\n- 小鹿\n- 小企鹅\n- 小羊\n- 小鸟\n- 小蘑菇人\n- 小云朵\n- 小星星精灵\n- 小怪物\n- 节日玩偶\n- 食物拟人角色\n\n---\n\n### 6.2 场景资产\n\n场景必须是“小小世界”，不是大场景。\n\n推荐场景：\n\n- 微缩森林\n- 小木屋\n- 暖光卧室\n- 桌面厨房\n- 雪夜窗边\n- 花园角落\n- 小蘑菇屋\n- 节日礼物堆\n- 床头小夜灯\n- 茶杯旁边的小世界\n- 棉花云朵天空\n- 纸板背景小剧场\n- 木质桌面模型场景\n\n场景关键词：\n\n- 微缩模型场景\n- 小小世界\n- 桌面布景\n- 手工布景\n- 暖黄色灯光\n- 浅景深\n- 微距摄影\n- 柔和背景虚化\n- 温暖童话感\n- 干净、柔软、安静\n\n---\n\n### 6.3 道具资产\n\n道具要小、软、温暖、可互动。\n\n推荐道具：\n\n- 小星星\n- 小月亮\n- 小围巾\n- 小帽子\n- 小铃铛\n- 小礼物盒\n- 小蘑菇\n- 小花\n- 小杯子\n- 小饼干\n- 小信封\n- 小蜡烛\n- 小灯串\n- 小毛毯\n- 小雪人\n- 小纸船\n\n---\n\n## 7. 图片提示词规则\n\n### 7.1 必须包含\n\n一条完整图片提示词必须包含：\n\n 1. 主体\n 2. 羊毛毡材质\n 3. 毛茸茸纤维\n 4. 针毡纹理\n 5. 手工不完美边缘\n 6. 哑光表面\n 7. 圆润比例\n 8. 表情情绪\n 9. 微缩场景\n10. 暖光\n11. 浅景深\n12. 构图和比例\n13. 反向提示词\n\n---\n\n### 7.2 材质强化写法\n\n中文强化词：\n\n- 真实羊毛毡手工玩偶\n- 细密短绒纤维\n- 针毡戳刺纹理\n- 手工针毡痕迹\n- 哑光毛毡表面\n- 柔软微粗糙质感\n- 边缘轻微不规则\n- 不完全对称的手工感\n- 温暖手作质感\n- 干净柔软的毛茸茸表面\n\n英文强化词：\n\n- handmade wool felt doll\n- needle felted texture\n- visible tiny wool fibers\n- soft fuzzy felt surface\n- matte wool material\n- subtle needle-punched marks\n- slightly uneven handmade edges\n- clean fluffy fibers\n- handcrafted miniature doll\n- cozy handmade texture\n\n---\n\n### 7.3 避免塑料感写法\n\n必须加入：\n\n- 非塑料玩具\n- 无光滑反光表面\n- 无树脂手办质感\n- 无盲盒质感\n- 无普通 3D 卡通质感\n- 材质为哑光羊毛毡\n- 表面有纤维，不是光滑皮肤\n\n---\n\n## 8. 视频节奏规则\n\n### 8.1 核心节奏\n\n毛毡玩偶视频不是完全静止，也不是快速动画，而是：\n\n**温柔慢节奏 + 微动作 + 小节奏点 + 稳定镜头 + 软剪辑。**\n\n画面要像一个手工羊毛毡小世界被轻轻唤醒。角色动作必须轻，镜头运动必须稳，但每个镜头里仍然需要明确节奏变化，避免变成静态展示。\n\n---\n\n### 8.2 5 秒视频节奏\n\n5 秒视频必须拆成 3-5 个小节奏点。\n\n时间内容目的0-1 秒稳定展示角色和场景建立画面1-2 秒第一个轻动作：眨眼、耳朵动、低头让角色活起来2-3.5 秒第二个轻动作：抱道具、挥手、点头形成情绪3.5-4.5 秒环境反应：灯光亮、雪花落、星星闪增加画面变化4.5-5 秒停在可爱表情或温暖姿态方便循环和剪辑\n\n---\n\n### 8.3 5 秒三种模式\n\n模式 A：单镜头轻动作\n\n适合角色展示、头像动图、首帧动效。\n\n特点：\n\n- 一个镜头到底\n- 固定机位或极慢推进\n- 角色只做 1-2 个轻动作\n- 画面稳定，适合循环\n\n---\n\n模式 B：单镜头微故事\n\n适合儿童故事、治愈短片开头。\n\n特点：\n\n- 不切镜\n- 但画面内部有小事件\n- 道具或环境参与剧情\n\n示例：\n\n- 小兔看见星星\n- 小兔轻轻抱住星星\n- 星星发出暖光\n- 小兔开心地眨眼\n\n---\n\n模式 C：多镜头剪辑版 5 秒\n\n适合更有节奏的短视频封面、节日祝福、广告开头。\n\n建议拆成 2-3 个独立镜头生成，再后期剪辑。\n\n镜头时长画面11 秒道具特写：毛毡星星发光22.5 秒角色中景：小狐狸抱住星星31.5 秒角色近景：抬头微笑，暖光亮起\n\n注意：图生视频模型不稳定时，不要在同一条提示词里强行要求多次切镜。更稳定的方式是每个镜头单独生成，再剪辑。\n\n---\n\n## 9. 长视频分镜规则\n\n### 9.1 15 秒结构\n\n15 秒建议拆成 3 个 5 秒镜头。\n\n镜头时长内容15 秒建立场景：角色出现在微缩小世界里25 秒角色与道具互动：发现、靠近、抱住、递出35 秒情绪完成：灯光亮起、角色微笑、字幕出现\n\n---\n\n### 9.2 30 秒结构\n\n段落时长内容开场0-5 秒展示微缩场景和角色发现5-10 秒角色看见一个小道具或小问题尝试10-15 秒角色轻轻靠近、触碰或抱住反应15-20 秒道具发光、环境变化情绪20-25 秒角色露出开心、安心或被陪伴的状态收尾25-30 秒定格在温暖画面，可加字幕\n\n---\n\n### 9.3 60 秒结构\n\n段落时长内容10-10 秒角色和世界建立210-20 秒出现一个小小愿望或小小问题320-30 秒角色尝试解决430-40 秒道具或伙伴带来帮助540-50 秒场景变得温暖，情绪释放650-60 秒角色看向镜头，完成祝福或治愈表达\n\n长视频不需要强冲突，重点是“小问题被温柔解决”。\n\n---\n\n## 10. 运镜与切镜规则\n\n### 10.1 推荐运镜\n\n- 固定机位\n- 极慢推进\n- 极慢横移\n- 轻微俯拍\n- 微距特写\n- 从道具轻轻移到角色\n- 从背景暖光慢慢推进到角色脸部\n\n### 10.2 禁止运镜\n\n- 快速环绕\n- 大幅摇镜\n- 手持抖动\n- 快速变焦\n- 跟拍奔跑\n- 高速穿越场景\n\n### 10.3 推荐切镜\n\n- 角色全景 → 道具特写\n- 道具特写 → 角色近景\n- 角色侧脸 → 角色正面\n- 场景空镜 → 角色出现\n- 手部抱道具特写 → 角色表情近景\n- 灯光亮起 → 角色微笑\n- 雪花 / 星光 / 花瓣特写 → 角色反应\n\n### 10.4 禁止切镜\n\n- 快速闪切\n- 抖动转场\n- 故障转场\n- 大幅旋转镜头\n- 快速推拉镜头\n- 动作片式剪辑\n- 复杂连续运动\n\n---\n\n## 11. 视频动作库\n\n### 11.1 角色轻动作\n\n- 眨眼\n- 点头\n- 耳朵轻轻动\n- 尾巴轻轻摆\n- 小手挥一下\n- 身体轻轻晃\n- 低头看道具\n- 抬头看镜头\n- 抱紧小星星\n- 摸摸围巾\n- 轻轻靠近礼物盒\n\n### 11.2 环境动作\n\n- 暖光轻轻亮起\n- 小灯串微微闪烁\n- 雪花缓慢落下\n- 星星发出柔光\n- 花瓣轻轻飘过\n- 小纸船轻轻晃动\n- 窗外月光变柔和\n- 背景光点慢慢漂浮\n\n### 11.3 禁止动作\n\n- 奔跑\n- 跳跃\n- 大幅转身\n- 快速挥手\n- 夸张表情\n- 打斗\n- 摔倒\n- 张大嘴说话\n- 真实动物式运动\n- 肢体拉伸变形\n\n---\n\n## 12. 剪辑与声音建议\n\n### 12.1 剪辑节奏\n\n- 5 秒单镜头可以直接使用。\n- 15 秒建议 3 镜头，镜头之间用柔和淡入淡出。\n- 30 秒建议 6 镜头，每个镜头承担一个情绪动作。\n- 60 秒建议 10-12 镜头，保留 2-3 个环境空镜。\n- 不要快切，不要强刺激转场。\n\n### 12.2 字幕风格\n\n字幕要短、温柔、像绘本旁白。\n\n示例：\n\n- 今天也辛苦啦。\n- 小小的温暖，也会发光。\n- 晚安，记得抱抱自己。\n- 冬天很冷，但你不是一个人。\n- 它把星星留给了你。\n\n### 12.3 音效\n\n推荐：\n\n- 轻轻的布料摩擦声\n- 柔软小脚步声\n- 小铃铛声\n- 远处风铃声\n- 小木屋环境声\n- 雪花落下的细微声音\n- 小灯串轻响\n- 翻动小纸片的声音\n\n避免：\n\n- 尖叫\n- 惊吓音效\n- 机械噪音\n- 强烈鼓点\n- 高频刺耳声\n- 夸张卡通音效\n\n### 12.4 BGM\n\n推荐：\n\n- 木琴\n- 八音盒\n- 轻柔钢琴\n- 原声吉他\n- 温暖弦乐铺底\n- 儿童绘本感轻音乐\n- 节日铃铛轻音乐\n- 睡前故事氛围音乐\n\nBGM 提示词：\n\n```text\n温暖治愈的八音盒旋律，轻柔钢琴和木琴点缀，节奏缓慢，像睡前故事一样安静，带有童话感和陪伴感，不要强鼓点，不要悲伤，不要紧张。\n```\n\n---\n\n## 13. 标准输出格式\n\n每次执行本 Skill 时，按用户需求层级输出。\n\n### 13.1 创意阶段输出\n\n```markdown\n# 毛毡玩偶治愈风创意方向\n\n## 需求理解\n- 用户目标：\n- 画面类型：\n- 情绪方向：\n- 是否有参考图：\n\n## 创意方向\n| 方向 | 角色 | 场景 | 道具 | 情绪 | 适合视频动作 |\n|---|---|---|---|---|---|\n```\n\n### 13.2 资产阶段输出\n\n```markdown\n# 资产规划\n\n## 角色资产\n| 资产名 | 外形 | 材质 | 表情 | 姿态 | 用途 |\n|---|---|---|---|---|---|\n\n## 场景资产\n| 资产名 | 场景 | 光线 | 道具 | 氛围 | 用途 |\n|---|---|---|---|---|---|\n\n## 道具资产\n| 资产名 | 材质 | 颜色 | 功能 | 是否可互动 |\n|---|---|---|---|---|\n```\n\n### 13.3 视频阶段输出\n\n```markdown\n# 视频制作方案\n\n## 故事节奏\n\n## 分镜表\n| 镜头 | 时长 | 画面 | 动作 | 运镜 | 光影 | 音效 | 情绪 |\n|---|---|---|---|---|---|---|---|\n\n## 每镜头视频提示词\n\n## 剪辑建议\n\n## 审核清单\n```\n\n---\n\n## 14. 审核清单\n\n### 14.1 材质审核\n\n- 是否像羊毛毡？\n- 是否有细密纤维？\n- 是否有针毡纹理？\n- 是否哑光？\n- 边缘是否有轻微手工不完美？\n- 是否避免塑料反光？\n- 是否避免树脂手办质感？\n- 是否避免普通 3D 动画感？\n\n### 14.2 角色审核\n\n- 是否圆润可爱？\n- 五官是否简单干净？\n- 表情是否温暖治愈？\n- 有没有恐怖玩偶感？\n- 有没有过度真实的玻璃眼珠？\n- 有没有脏乱毛发？\n- 有没有变成真实动物？\n- 有没有比例崩坏？\n\n### 14.3 场景审核\n\n- 是否是微缩小模型？\n- 是否有温暖灯光？\n- 是否有浅景深？\n- 是否干净柔和？\n- 是否有小小世界感？\n- 道具是否与角色比例协调？\n- 场景是否过于空？\n- 场景是否过于杂乱？\n\n### 14.4 视频审核\n\n- 角色是否保持首帧一致？\n- 动作是否足够轻？\n- 是否没有大幅运动？\n- 镜头是否稳定？\n- 是否没有变材质？\n- 是否没有新增奇怪物体？\n- 是否没有角色变形？\n- 是否适合循环播放？\n- 情绪是否温暖安静？", "extras": [], "cn": "毛毡玩偶治愈风导演"}, {"slug": "female-drama-short-0", "desc": "甜宠钩子生成分镜成片", "body": "# 女性向甜宠短剧 · 单集\n\n## 定位（只负责一件可复用的事 / 不负责什么）\n- 只负责：「女性向甜宠短剧·单集」这一形态——把一个甜宠钩子，拍成一条有完整情感弧线的 16:9 横屏短剧片段（分镜 + 成片）。核心是让观众把自己放进女主位置，体验「不讲道理、为她一人破例」的炽热偏爱。\n- 只负责节奏：**分步产出、逐步确认**——脚本 → 人物 / 角色板 → 场景色板 → 故事板 → 按分镜出成片，每一步先给用户确认、可编辑可回改，绝不一路自动跑到底。\n- 只负责成片底盘：一条片内部的**连贯主线、镜头缝合、多机位、画风与色调统一**——这些是\"像同一条真剧\"的基本盘，由本 skill 锁死。\n- 不负责：多集连续剧与整剧四幕铺陈（平台暂不支持多集拆分）；通用拆镜与锚点一致性机制、模型规格（底座已兜，走默认或听用户）；**选哪一种画风品类**（自由，听用户 / 风格层，本 skill 只保证选定后全片一致）；非女性向、非甜宠的题材。\n\n## 它怎么被用\n用户给一个甜宠设定或只给一句「想要的那种上头感」，本 skill 分步产出一条单集甜宠短剧：脚本 → 人物 / 角色板 → 场景色板 → 故事板 → 按分镜出成片，每一步先确认再往下。\n\n## 输入（开工前用 `ask_human` 问清，一次一个、用大白话）\n- **故事场景 / 背景**：这个故事发生在什么场景下？时代、地点、行业环境。\n- **男女主名字**：男主、女主分别叫什么？\n- **一个开头**：用一句话说清\"开场是个什么局\"就行（如\"婚礼上被悔婚\"、\"入职第一天认错了大老板\"）。留空则由 Agent 提 1-2 个开头供用户选。\n- **整体画风 / 色调基调**：想要什么调性的画面（暖金奢华 / 冷调都市 / 柔光胶片…）。这会定成全片统一的视觉基准。说不清就让 Agent 提一版供选。\n- **绑定装置**：两人为什么被迫朝夕相处（先婚后爱、合作契约、权力从属、破镜重逢、身份错位…）。说不清就让 Agent 按设定定。\n- **男女主参考脸**：给 1 张以上真人参考脸（用来混出不存在的虚拟人，全片锁脸）。\n- **人物设定 / 核心钩子**（可选）：性格外貌、最想要的那个心动瞬间（公开护短 / 醋意质问 / 深夜告白 / 强势男主破功…）。说不清就让 Agent 按 knowhow 补一版，补完先确认。\n- 不问：用什么模型、文件怎么存—这些底座默认管。**全片画幅统一 16:9**，**时长不预设**、跟着内容走（见下）。\n\n## 三套图像提示词框架（全部内联在本文件文末，按阶段套用）\n- 本 skill **自包含在这一个 SKILL.md 里**（平台外部子文件加载暂不稳定，不拆外部文件）。\n- 文末有三套图像提示词框架，按阶段套用：**角色板阶段**用《角色识别板框架》、**场景阶段**用《场景色板框架》、**故事板阶段**用《故事板框架》。\n\n## 内部流程与 Knowhow（正文主体）\n\n### 分阶段推进（锁死：每一步先出东西、交用户确认，确认后才进入下一步；用户没点头，禁止启动下一阶段的任何生成）\n\n**阶段一 · 立意**\n- 用 `ask_human` 把上面「输入」问齐，一次一个：故事场景、男女主名字、一个开头、整体画风 / 色调基调，以及绑定装置 / 参考脸。缺一项会显著改变成片的，先问，不猜着往下做。\n\n**阶段二 · 出文字脚本 → 确认**\n- 基于用户给的开头，用 AI 发散生成短剧脚本。**时长不框死**——跟着内容走（60、90 秒或更长都行），以把主线讲顺、情绪做透为准，别为凑进一分钟砍掉过渡。\n- 脚本一次给齐**四件套**，让用户在文字阶段就把内容、人、景、调都对齐：\n  1. **剧情分镜**：按下方「单集五步弧线」推进、且是一条「因为→所以」的因果主线（见「连贯性」），含场景标注、人物动作、镜头建议，且**每个镜头都写 1-2 句台词**（见「台词」），靠台词把剧情串起来。\n  2. **人物形象提示词表**：每个角色一段可直接喂 `generate_image` 的提示词（长相、气质、造型）。\n  3. **场景提示词表**：每个场景一段提示词，写清空间 look + **这场戏需要的戏剧地形**（可退的角落 / 能望向的窗 / 第三方出现的门口…，由五步弧线的动作倒推），并标出需要哪几个机位 / 景别。\n  4. **统一视觉基准**：一段全片共用的画风 / 色调前缀（色温、明度、饱和、光质、影调、镜头质感、画幅），后面每张图、每个镜头都套它。\n- 🔒 交用户确认，给**可操作选项**（如「这版可以，继续 / 换个更狠的开头 / 第 X 场改一下 / 台词太文绉绉 / 色调换冷一点」），不是开放式甩一句\"OK 吗\"。\n- 用户没确认前，**绝不调用任何 `generate_*` 工具**。\n\n**阶段三 · 生成人物形象 → 确认 → 出角色识别板**\n- 脚本确认后，用 `generate_image` 按人物提示词表 + **统一视觉基准前缀**，把参考脸混成男女主的虚拟人形象供确认。**不要出白底证件照式的图**——要能看清脸型、气质、色调的正经人像（皮肤纹理、自然光、真实质感，不要塑料假人感；男女主放同一光线、同一视觉基准下生成，后图参考前图，避免\"一深一浅、不像同一条片\"）。\n- 🔒 交用户确认角色：脸对不对 + 气质对不对 + 色调是否统一（「就用这版 / 换一版 / 男主再清冷点 / 女主更邻家 / 两人色调不一致，统一一下」）。**没确认前不生成角色板、不进下一步。**\n- **确认之后**，为每个主要角色出一张 **《角色识别板》**（CHARACTER IDENTITY BOARD，16:9）——这是全片角色一致性的**锚点资产**，后续所有场景图和视频都以它为身份参考来锁人锁造型。**进入角色板生成时，按文末《角色识别板框架》**填入该角色信息生成。\n\n**阶段四 · 生成场景色板（建立并锁定空间，每场 4 张） → 确认**\n- 角色确认后，先把**故事发生的空间钉死**（它是后面排故事板和成片的空间真相源）。按脚本的场景提示词表，用 `generate_image` + 统一视觉基准，为每个场景**针对不同位置、不同机位、不同角度各生成 4 张实景色板**（广角建立 / 中景 / 特写 / 过肩反打），锁定这场的空间 look 与戏剧地形（可退的角落 / 能望向的窗 / 第三方出现的门口…），保持同一空间、同一色调一致。\n- **进入场景生成时，每个场景按文末《场景色板框架》**填本场信息生成。\n- 🔒 交用户确认场景与色调。空间定了，故事板才有据可排。\n\n**阶段五 · 生成故事板（在确定的空间里排镜） → 确认**\n- 场景确认后，把两位角色的**《角色识别板》**作为唯一固定主角、把**已确认的场景色板**作为空间参考，用 `generate_image` 生成一张 **16:9 黑白电影感故事板（12 格导演分镜）**，在这个确定的空间里把镜头调度、双角色走位\"预演\"出来——人和景都是现成锚点，故事板只定\"怎么拍、怎么走\"。\n- **进入故事板阶段后，按文末《故事板框架》**填本片信息生成。故事板与成片画幅一致（全片统一 16:9），成片按其镜头调度直接生成，不用再换画幅。\n- 🔒 交用户确认故事板：分镜顺序、镜头语言、走位对不对（「这版分镜可以 / 第 X 格改机位 / 高潮往后挪」）。**没确认前不进下一步。**\n\n**阶段六 · 按故事板分镜出成片**\n- **严格按故事板每一格分镜逐镜生成**：以《角色识别板》锁人锁造型、以场景色板锁景锁色、全程套统一视觉基准。每次 `generate_video` 单镜 ≤15s，整片由多镜 `composite_video` 合成（总时长按内容，不受 15s 限制）；`generate_audio` 按脚本**逐镜台词**配音 + BGM（别只有配乐没有台词）。按「连贯性」做镜头缝合，心动名场面用特写、慢镜、浅景深表达五感细节。\n- **这条链（故事板 → 分镜 → 逐镜生成）是把控成片率的核心**：先在便宜的静态分镜上把镜头和走位定死，再去生成视频，避免直接生成时的失控。\n\n### 连贯性：一条因果主线 + 镜头缝合（顺滑不割裂）\n- **剧情因果**：五步不是五个并列的名场面，是一条「因为→所以」的链子——每一步都是上一步的直接结果。宁可少一个转折，也要主线顺；**连贯优先于名场面数量**。\n- **给过渡留时间**：时长弹性就是为这个——别为塞进一分钟砍掉铺垫和缓冲，情绪要有呼吸。\n- **镜头缝合**：相邻镜头用「动作接」（上镜动作没做完、下镜接着做）、「视线接」（看向画外 → 下镜给到所看之物 / 人）、「声音先入」（下镜的声音提前半秒进）、「同场景多机位顺剪」（正反打、景别由远及近递进）来衔接，不是硬拼贴。\n- **判准**：把相邻两镜连着看，第二镜的出现是不是\"顺理成章\"？如果像换了个片子，就是没缝好。\n\n### 台词：靠台词串剧情，别只放画面\n- **密度**：原则上**每个镜头配 1-2 句台词**（对白 / 独白 / 画外音），让剧情靠台词往前推，而不是让观众盯着画面猜发生了什么。片子不能一直是\"配乐 + 画面\"。\n- **台词干三件事**：交代信息（谁、要干嘛、冲突在哪）、推进因果（这句让下一步发生）、缝合上下镜（上镜尾句抛个钩，下镜台词接住）——台词是继画面之后的**第二条缝合线**，和「连贯性」咬合。\n- **质量不降**：台词短、口语、单句能出圈；是\"人会那么说的话\"，不是旁白解说腔、不是为凑数的废话。\n- **留白是例外不是常态**：个别纯情绪镜头（一个对视特写、一次怔忪）可以无台词，但那是刻意的呼吸点，不是通篇没词。\n- **配音落原文**：`generate_audio` 按脚本台词逐句配，口语感，避开 AI 电台腔。\n\n### 全片画风与色调统一（像同一条片子）\n- **定一个视觉基准**（look）：色温（暖 / 冷）、明度、饱和、光质（自然光 / 黄昏金光 / 影棚硬光）、影调、镜头质感、画幅——在阶段二写成一段所有图和视频**共用的风格前缀**。\n- **选择自由、一致锁死**：选哪种画风品类听用户 / 风格层；一旦选定，**全片每一张人物图、每一组场景图、每一个镜头都套这同一套基准**，这条锁死、不放开。\n- **互为参考**：生成多个人物 / 多个场景时，后图参考前图的色调与光线，别各调各的。\n\n### 单集五步弧线（脚本阶段照这个写，串成一条因果主线）\n1. **困境开场**：女主开场即陷入具体、可感的困境（被胁迫 / 被羞辱 / 被刁难，三选一或组合）。开场前几秒就要让目标观众「代入」——这是她的处境，不是背景介绍。\n2. **高能解围**：男主以出人意料的方式登场，用碾压级方式摆平麻烦。他是女主的退路，不是代理人——所以女主在他出手前，自己已经先开口 / 先还击了一下，男主是「锦上添花的最后一击」。\n3. **名场面级心动**：全片心动浓度最高的一场戏，混用下面三种弹药中的至少两种，做足特写和留白，让它「可截图、可传播」。\n4. **小高潮反转**：安排一次强势男主「破功」的人设反转，或一次醋意升级——制造记忆锚点，也让甜度有起伏、不发腻。\n5. **钩子结尾**：以一句分量十足的宣示 / 一个暧昧留白 / 一个反转预告收尾，替代整剧的「加冕礼」，把观众的意犹未尽留在最后一秒。\n\n### 心动三弹药（每片混用，别只靠一种）\n- **接触型**：失衡时的搀扶、狭小空间的对视、替她拨头发 / 擦嘴角 / 系围巾、告别时的额头吻。要点：男方动作自然主动，女方反应是怔住或脸红，不是夸张推拒。\n- **台词型**：护短发言、脱口而出的醋意反问、只属于两人的专属称呼、当众毫不掩饰的袒护。台词要短、要狠、要能单句出圈。\n- **行为型**：默默记下她随口提过的喜好、为她破例下厨、暗中扫清她的职场障碍、吃醋后做出与身份反差极大的幼稚举动。\n\n### 用五感写心动（拍出来，不是写形容词）\n判准：不要生成「他很有魅力」这种画面，要把魅力拆成镜头能拍、观众身体能共鸣的细节——\n- 视觉：喉结的滚动、似笑非笑的唇角弧度、解袖扣时垂下的眼睫。\n- 听觉：贴近耳廓的低音、一声短促的轻笑。\n- 触觉：偏凉的指尖划过皮肤的战栗、外套残留的体温与重量。\n- 嗅觉（转成可见的反应）：他闻到她发间气息时的一瞬失神、她被他身上冷香笼罩时的怔忪。\n\n### 男主的落差（每片至少闪现一次，这是最强兴奋点）\n男主对外界是一套规则（疏离、强势、滴水不漏），对女主是另一套（耐心、纵容、笨拙、孩子气）。「全世界只有她能让他破功」的瞬间——不可一世的人第一次做饭手忙脚乱、能镇全场的人被她一句话治得服服帖帖、病弱时缠着她像只大型犬——每一个都是记忆锚点，用镜头单独给到。\n\n### 醋意三段式（按片内阶段升级，展现独占欲）\n- 入门：目睹女主与异性交谈，眼神骤然降温，无言离场。\n- 进阶：直接带走女主，逼近质问「刚才那位是谁」，距离压迫感拉满。\n- 大师：表面云淡风轻，暗地让情敌寸步难行；或故意制造场面试探她的反应。\n\n### 矛盾怎么用（判准，不是禁令堆砌）\n- 冲突制造者是外部第三方（觊觎男主的对家、捧高踩低的亲戚、使绊子的同僚），男女主之间不写深层价值观对立。\n- 即便有误会，当面说开，不靠「我不解释你别问」硬撑——当代观众对拉扯零容忍。\n- 每一次冲突的落点，都是给男主一个「表演偏爱」的舞台：有人刁难她 → 男主碾压级反击 → 转化成一次大型心动投放。\n\n## 输出\n一条 16:9 横屏单集甜宠短剧，时长按内容走：五步弧线串成因果主线、心动高频、矛盾外置、钩子结尾，全片画风色调统一、镜头缝合顺滑。过程中逐步交付：脚本四件套 → 人物形象 + 角色识别板 → 场景色板（每场 4 张，钉死空间）→ 故事板（12 格黑白分镜）→ 按分镜出成片；每步附对应确认。\n\n## 自检（这一类片的专属质量项）\n- 开工前是不是先问了**故事场景**和**男女主名字**、拿到开头和**画风 / 色调基调**，才动手？\n- 是不是**先出文字脚本（含人物提示词、场景提示词、视觉基准四件套）、拿到用户确认，才开始生成任何画面**？\n- 人物、场景、镜头之间**色温 / 明度 / 影调是否一致**，看起来像不像同一条片、同一场里的人？（别再出现一深一浅）\n- 有没有一个全片共用的**视觉基准**，并套到了每一张图和每个镜头上？\n- 人物确认图是不是**正经人像**（不是白底证件照）？确认角色后是不是出了**《角色识别板》**，后续场景图和视频有没有以它为身份参考锁人？\n- 是不是**先把场景空间钉死**（每场 4 张不同机位色板、同一空间同一色调、含这场需要的戏剧地形），再去排故事板？\n- 故事板是不是用**两张角色板 + 已确认的场景色板**排的 **12 格黑白分镜**、锁了空间连续性和双角色身份？成片是不是**严格按故事板每一格分镜**生成？\n- 相邻镜头之间有没有**缝合**（动作 / 视线 / 声音 / 多机位顺剪），还是硬拼？连着看顺不顺？\n- 是不是**基本每个镜头都有 1-2 句台词**、靠台词把剧情串起来了？有没有大段只有画面 / 配乐、没有台词？\n- 五步是不是一条**因果主线**（因为→所以），而不是五个并列的名场面？时长有没有给过渡留呼吸，而不是硬塞进一分钟？\n- 开场前几秒是不是先让观众代入女主的**具体困境**，而不是先做背景交代？\n- 女主遇误会 / 被欺负，是不是**自己先开口澄清、先还击**了？男主的出手是「最后一击」还是替她把事全办了（后者要改）？\n- 男主的落差瞬间有没有至少闪现一次，并用镜头单独给到？心动是不是落在**可见可听的五感细节**上，而不是形容词？\n- 冲突是不是来自外部第三方、且当面说开了？男主的强势是不是建立在**尊重**上——任何轻浮 / 控制 / 越界的画面一律不出（这条锁死，不放开）。\n- 换一个不同题材的甜宠设定（先婚后爱换成破镜重逢），这套还成立吗—还是只会跑举例那个？\n\n## 何时问用户\n- **每一阶段都必须停下来确认，这不是可选项**：脚本、人物形象、场景、故事板，各是一道硬门，确认了才进下一步。\n- 立意阶段：故事场景 / 男女主名字 / 开头 / 画风色调 / 绑定装置 / 参考脸缺失——会显著改变成片，先问。\n- 核心钩子方向有多个合理选择且影响开局——给推荐再确认。\n- 给选项用 A/B/C/D、标签用业务动作（如「按这个开头 / 换个更狠的 / 第 3 场改一下 / 换张脸 / 色调换冷一点」），不暴露内部机制。\n- 时长、格式、文件名、工具字段—Agent 按内容自己定，别问。\n\n---\n\n## 三套图像提示词框架（按阶段套用；`{ }` 占位符按本片填，画风 / 色调延用统一视觉基准）\n\n### 角色识别板框架（阶段三用）\n> 确认角色后，为每个主要角色各生成一张 16:9 角色识别板（全片角色一致性的锚点资产）。生成完角色板，进阶段四场景。\n\n```\n角色识别板（CHARACTER IDENTITY BOARD）— 艺术化电影感排版（16:9）\n【主体】：基于参考图。名字：{角色名}。身份：{角色身份}。进行细微的色彩校正，营造干净、高级的画册质感——{色调关键词}、富有电影感。\n视觉媒介：{画风}。纯白 / 柔和米白背景。无环境、无 logo、无水印。\n设计方向：不要做成标准的角色参考设定图。要创作一张电影感的识别板，感觉像高端动画工作室的角色研究，融合艺术画册的排版。不对称、优雅、令人印象深刻。运用大面积留白、不同的图像尺度变化与有意为之的失衡感。避免网格、蓝图式设计、目录式排版与重复的转面呈现。\n【重要布局规则】：不要让任何角色图像相互重叠。每个视角都必须有清晰分隔与呼吸空间。让所有身体、肖像、剪影与细节研究在视觉上彼此分明。不要有裁切的脸、隐藏的四肢、堆叠的人物或融合的姿势。\n【主构图】：将一个大尺寸的英雄全身视图略微偏离中心放置，作为视觉锚点——{标志性姿势 + 标志性服装/道具描述}。在其周围以干净的间距排布较小的辅助研究：中性站立全身视图、背面视图、侧面视图、{2–4 个符合角色个性的姿势}、俯视身体角度、仰视的英雄式身体角度，以及若干富有表现力的肖像研究。每个视角都应像一个独立、干净的角色研究，而非同一场景里的某一帧。\n【身份锁定】：在所有视角中严格保持身份一致性：\n— 相同的脸：{肤色、眼睛颜色、面部特征、标志性表情}。\n— 相同的发型：{发色 + 发型结构 + 细节}。\n— 相同的服装：{从上到下逐件描述服装、配件、鞋履，含颜色和材质}。\n— 相同的身体比例：{体型关键词}。\n— 相同的姿态语言与视觉个性：{3 个性格关键词}。\n【实用参考细节】：让角色便于未来的图像与视频生成使用：清晰的脸型、清晰的头发轮廓（{发型简称}）、清晰的服装轮廓、清晰的{体型}身形、清晰的{标志性道具/手部状态}、清晰的姿态、清晰的表情范围。\n【艺术分区】：\n— 剪影研究区：2–3 个简化的黑色角色剪影（{3 个代表性姿势}）。\n— 表情研究区：微妙的情绪变化（{4 种符合角色的情绪}）。\n— 细节研究区：{3–4 个标志性物件特写}。\n【文字设计】：一个时尚极简的角色 ID 信息块，醒目且有艺术指导感：\n— NAME（名字）：{角色名}\n— ROLE（身份）：{英文身份（中文）}\n— CORE MOOD（核心气质）：{英文气质短语（中文）}\n— VISUAL SIGNATURE（视觉标志）：{3–4 个标志元素，英中对照，用 · 分隔}\n仅在有帮助的地方使用小号手写体标签。允许使用微妙的编辑性箭头与标注符号，但要保持极简优雅。\n【风格】：极简、电影感、高级、画册感、干净、富有表现力、便于实际生产使用。最终成图应当像一张艺术化的角色识别板，旨在帮助 AI 模型理解角色的脸部、剪影、服装、姿态与情绪范围。\n```\n\n### 场景色板框架（阶段四用）\n> 角色确认后（故事板之前），为每个场景生成一组 16:9 实景色板（同一空间 · 4 个机位），**先把空间钉死**——它是后面故事板排镜和成片的空间真相源。空间要素与脚本场景表一致、并覆盖这场需要的戏剧地形；出镜人物用《角色识别板》锁形象。**一场跑一次，产出 4 张。**\n\n```\n为{场景名}生成一组电影感实景场景色板（16:9 横向，同一空间的 4 个机位视角），用于钉死这场戏的空间 look，并作为后续故事板排镜与所有镜头的背景与空间锚点。画风 / 色调严格延用全片统一视觉基准：{视觉基准前缀：色温、明度、饱和、光质、影调、镜头质感}。写实电影质感，像正片截帧，不是概念图、不是插画。\n【空间锁定 · 全场固定不变】故事发生在{场景总述：如 顶层公寓落地窗前的深夜客厅}。以下要素在 4 张里位置、形态、材质完全一致：\n— 核心舞台 / 地面：{如 灰岩地板 + 低矮真皮沙发组}。\n— 空间边界：{如 整面落地窗 / 长廊 / 吧台}。\n— 方位锚点 ×2：{如 左侧壁炉、右侧旋转楼梯}（用来在不同机位间保持空间可读）。\n— 大型视觉锚点：{如 落地窗外的城市夜景 / 巨幅挂画 / 霓虹招牌}。\n— 环境道具：{如 茶几上的红酒杯、地毯、绿植}。\n— 整体氛围一句话：{如 疏离克制又暗涌的高级感}。\n— 戏剧地形（这场戏动作需要的空间要素）：{如 可退到的墙角、能转身望向的落地窗、第三方出现的门口、可倚靠的吧台…}——由本场剧情动作倒推，必须在空间里真实存在。\n【光线锁定】主光源：{如 窗外冷蓝城市光}；辅助 / 氛围光：{如 室内暖黄落地灯}。4 张的光位、色温、明暗关系一致，只随机位改变入射角，不改变光的性质。\n【4 个机位配方】按顺序各出 1 张，覆盖该场叙事所需景别：\n— 图1｜Establishing 广角建立：交代整个空间与人物位置关系，人物小、环境大，看清方位锚点与边界。\n— 图2｜双人中景：{该场两人关系状态：对坐 / 并肩 / 一进一退}，中景带环境，确立关系与距离。\n— 图3｜浅景深特写：{该场关键细节：交扣的手 / 桌上的信物 / 一个眼神}，背景虚化但仍可辨认是同一空间。\n— 图4｜过肩反打：借一方肩头看向另一方（或看向窗外 / 门口），用于对话正反打，强化视角与临场感。\n【人物处理】此阶段故事板尚未生成。若放入人物，严格用《角色识别板》里的形象锁人锁造型（脸 / 发型 / 服装 / 比例一致），走位按本场剧情动作大致安排（精确分镜留到故事板阶段）；也可出纯环境空镜，但必须是同一空间同一光线。\n【一致性铁律】这 4 张是**同一个真实空间在同一时刻的 4 个机位**，不是 4 个不同房间：相同陈设、相同光线、相同色调、相同材质、相同天气 / 时段。禁止每张换空间、换配色、换季节、凭空增删大型陈设。\n【构图要求】4 张景别、机位、纵深各不相同，避免平均构图与正面呆板；利用{方位锚点}与{光源}制造空间层次与戏剧光影。\n【禁项】不要文字 / logo / 水印、不要时间戳、不要漫画感或卡通感、不要 UI 元素、不要拼图 / 分屏（每张是独立完整的一帧）。\n【风格】写实、电影感、高级、质感真实、光影考究、便于作为视频生成的背景锚点使用。最终 4 张应当像同一部剧同一场戏里，摄影师换了 4 个机位拍下的定帧。\n```\n\n### 故事板框架（阶段五用）\n> 场景色板确认之后，用两张《角色识别板》当唯一固定主角、把已确认的《场景色板》当空间参考，在这个确定的空间里生成一张 16:9 / 12 格黑白导演分镜。两位主角严格用角色板形象、空间严格用场景色板。故事板确认后进成片。\n\n```\n为故事板创建一个{情绪基调：甜宠/暧昧/高燃/催泪}的{场景类型：雨夜告白/办公室壁咚/机场送别}场景，专注于\"{核心叙事弧线：从 A 状态到 B 事件的张力与节奏}\"。使用参考图像中的两位角色作为唯一固定主角：\n角色 A（{辨识简称}）：{发型发色、标志性配饰、肤色、服装细节、体型、神情气质}。\n角色 B（{辨识简称}）：{同上结构}。\n两位角色在所有面板中必须完全一致：相同脸型/发型/发色/瞳色/服装/身体比例/视觉气质。不要变脸、不要互换发型、不要重新设计人物。两人身份严格区分锁定。\n16:9 横向故事板表格，12 个电影风格分镜面板。\n实际绘图必须仅为黑白：粗糙铅笔线条、快速手势草图、极简阴影、动态线稿、强轮廓可读性、未完成 转场卡等资产规划；\n面向 LibTV / Agent / Codex 工作流的可执行提示词和生产清单。\n它不负责：\n写成长篇连续剧或复杂对白剧；\n做真实航天科普、NASA 纪录片或现代硬科幻写实宣传；\n做赛博朋克、霓虹城市、黑客都市、机甲堆料风；\n保证模型直接生成完全准确的文字 Logo；\n假设平台一定能自动完成配音、精准字幕排版、自动发布或复杂后期合成。\n核心原则：每个关键镜头都要像一张强海报，但整条片必须有清楚的起承转合、镜头连续性和剪辑节奏。\n输入\n用户可以只给一句话，也可以给完整资料。优先提取：\n主题：失落星球、银河女王、远古遗迹、最后一艘飞船、太空骑士、星际逃亡等。\n视频目标：完整视频、概念片、图生视频、MV 混剪、比赛 Demo、平台作业、封面宣传片。\n时长和比例：5 秒、15 秒、30 秒、60 秒、75 秒、90 秒；9:16、16:9、3:4、4:5、1:1。\n风格参考：复古科幻海报、太空歌剧、手绘电影海报、旧纸印刷、胶片颗粒。\n参考图或已有资产：角色图、飞船图、场景图、首帧、海报参考、已生成视频截图。\n已确定元素：主角、星球、飞船、遗迹、文明线索、道具、片名、旁白、字幕、音乐方向。\n输出深度：只要脚本、只要资产提示词、只要分镜、只要视频提示词、完整生产包、返修诊断。\n必须严守\n用户指定的比例、时长、用途、角色身份、已有资产、片名和文字要求。\n已有资产的核心外观和编号。后续视频提示词要通过 @资产名 或用户资产编号承接，不重新发明外貌。\n参考图只借鉴构图、色彩、质感、镜头层次，不复刻具体角色、具体飞船、具体排版和具体画面。\n用户要求无文字时，不让画面出现随机字母；用户要求准确文字时，优先建议后期加字或设计干净标题区。\n视频必须能执行：镜头时长、画面动作、资产引用、运镜、光影、音效、转场、审核点都要能落地。\n可以发挥\n用户没说清时，主动补齐：\n主角身份、飞船类型、星球环境、外星遗迹、核心悬念；\n视频结构、节拍、镜头数量、资产拆分、标题卡和转场方式；\n首帧、尾帧、关键帧、封面海报和剪辑节奏；\n适合复古太空歌剧的色彩、质感、音乐和音效方向。\n输入不足时不要连续追问。能合理补齐就直接补齐，并在输出里标注： 「未指定部分已按复古太空歌剧全流程视频方向自动补齐。」\n输入使用\n有参考图时\n先分析参考图提供的「方法」，不要照抄参考图的「答案」。分析重点：\n构图：中心构图、三角构图、前中远景、主角剪影、星球压迫、飞船动势、标题留白。\n色彩：橙红、深蓝、紫金、青绿、旧纸黄、冷暖对比、复古褪色。\n质感：手绘海报、胶片颗粒、印刷网点、套印偏移、旧纸纹理。\n主次：谁是视觉焦点，谁只是动势或尺度参照。\n视频潜力：哪些部分适合轻微动，哪些部分必须保持海报定格感，哪些元素适合做转场。\n输出时说明： 「参考图只作为构图、色彩和质感方向，最终会转化为原创复古太空歌剧视频视觉。」\n无参考图时\n如果用户说「帮我想」「给我几个方向」，先给 3 个差异明显的视频创意方向。每个方向包含：创意名、一句话剧情、主角、星球/场景、飞船/遗迹、核心转折、色彩、适合时长和比例。\n如果用户说「直接做」，不要停在选题阶段，直接选择最稳的方向继续完整输出。默认方向：孤独宇航员 + 巨型异星 + 远古遗迹 + 复古飞船 + 橙红/深蓝冷暖对比 + 遗迹被唤醒的悬念。\n有已有资产时\n已有资产是锚点，不是装饰。后续提示词重点写镜头关系、动作幅度、光影、质感、运镜、情绪和防漂移点。\n资产使用规则：\n人物外观、服装、飞船造型、场景结构由资产承担；\n视频提示词必须写 使用 @资产，并说明位置关系；\n不在视频提示词里反复堆角色外貌，避免和资产冲突；\n如果资产与目标风格冲突，先指出冲突，再给「保留身份但统一复古海报质感」的改法。\n关于时长\n用户没有指定视频时长时：\n只说「海报」：默认输出单图/首帧，不强行扩展成视频。\n只说「图生视频」：默认 5 秒或 10 秒单镜头。\n只说「概念片」：默认 30 秒。\n明确说「完整视频」「全流程视频」「作业」「比赛」「成片」：默认 60 秒。\n用户要 75 秒或 90 秒时，按完整视频结构扩展，不把 15 秒模板硬拉长。\n关于文字\n复古海报可以有标题，但模型直接生成准确文字不稳定。默认做法：\n首帧和尾帧预留顶部或底部标题区；\n标题、Logo、副标题、上映日期式装饰建议后期添加；\n只有用户明确要求「直接出带字图」时，才把短标题写进提示词，并提醒文字可能需要后期修。\n内部流程和 Knowhow\n1. 先判断这次要解决什么\n不要一上来套完整模板。先判断用户真正要的是：\n创意方向：需要从主题出发想概念；\n脚本节拍：需要把故事变成 30-90 秒可视化结构；\n资产生产：需要角色、飞船、星球、遗迹、道具、场景、首尾帧图片提示词；\n视频生产：需要分镜、图生视频提示词、运镜、转场和剪辑；\n返修诊断：已有图/视频不对，需要找问题和改提示词；\n完整生产包：需要从创意到成片交付全链路。\n用户要完整视频时，必须输出视频全流程，不得只输出海报提示词。\n2. 先做视频概念，不要先堆设定\n复古太空歌剧视频不是靠复杂科幻名词成立，而是靠一个观众能看懂的视觉旅程成立。\n先压缩成一句视频主线： 「【主角】在【异星世界】发现【文明线索】，引发【飞船/遗迹/星球异动】，最后定格成【复古太空歌剧海报式结尾】。」\n判断主线是否成立：\n开头 3 秒能抓住人；\n中段有探索、发现、启动、逼近、坠落、召唤等可视化动作；\n结尾能回到一个封面级画面；\n不依赖大量对白解释；\n每个情节点都能转化成镜头。\n3. 设计视频节拍\n完整视频要先有节拍，再写分镜。不同长度用不同结构。\n15 秒概念片\n适合一个主视觉概念：\n0-3s：建立巨型星球和主角剪影。\n3-7s：飞船或光束进入画面。\n7-11s：外星遗迹 / 文明线索被唤醒。\n11-15s：定格成复古海报式结尾。\n30 秒短片\n适合短促预告：\n0-4s：强钩子，异星天空或失落信号。\n4-8s：主角登场，建立孤独、使命或危险。\n8-14s：飞船/遗迹/星球异动。\n14-20s：主角接近核心线索。\n20-26s：视觉高潮，光束、星门、飞船掠过。\n26-30s：尾帧海报定格。\n60 秒完整视频\n适合 LibTV 作业和比赛 Demo：\n0-5s：开场钩子。巨型星球、信号闪烁、遗迹阴影或飞船残骸先抓眼。\n5-12s：世界建立。展示异星地貌、星云、双日、远景飞船。\n12-20s：主角登场。英雄剪影、头盔反光、慢慢抬头或走入画面。\n20-28s：任务启动。手中装置亮起、信号回应、远处遗迹开始发光。\n28-36s：飞船动势。复古飞船从星球边缘掠过或降临遗迹上方。\n36-44s：进入遗迹。石门、符号、光束、尘埃和巨大尺度。\n44-52s：视觉高潮。遗迹唤醒、星门展开、星球云层旋转、主角被金色光包围。\n52-60s：海报结尾。主角、飞船、星球、遗迹重新组成完整主视觉，标题区出现或预留。\n75 秒完整视频\n适合节奏更完整的概念预告：\n0-6s：异星异常钩子。\n6-14s：外太空远景与飞船靠近。\n14-22s：星球地表和遗迹尺度。\n22-30s：主角登场与使命物件。\n30-39s：第一次发现，信号/符号回应。\n39-48s：飞船与遗迹形成对角线动势。\n48-58s：进入遗迹，空间压迫加强。\n58-68s：核心光束/星门启动，视觉高潮。\n68-75s：标题卡和海报式尾帧。\n90 秒完整视频\n适合更长的氛围短片。要增加「悬念递进」而不是增加杂乱动作：\n前 20 秒建立世界和主角；\n中间 45 秒完成探索、接近、发现、启动；\n最后 25 秒完成视觉高潮、回落、标题定格。\n4. 用「海报级镜头」组织视频\n每个镜头都要像可以截成海报，但镜头之间必须有连续关系。\n单镜头判断：\n画面里是否只有一个核心动作；\n主体是否清楚；\n前景、中景、远景是否成立；\n是否符合复古手绘海报感；\n动作是否克制，不会打散构图。\n镜头连续判断：\n光源方向连续；\n星球位置和飞船运动方向不要乱跳；\n主角从远景到近景要有空间关系；\n每段结尾要能接下一段；\n不能每个镜头都像独立海报拼贴，必须有视觉推进。\n5. 世界观只写能被看见的部分\n世界观压缩成 6 项：\n世界名称：一句有海报味的名字；\n主角身份：宇航员、星际旅人、银河女王、外星考古者、飞船船长等；\n星球/空间：沙漠星、冰晶星、紫色气态巨星、双日地平线、环带世界等；\n飞船/遗迹：提供动势或文明线索；\n核心悬念：信号被唤醒、遗迹启动、远航归来、星球即将坠落等；\n视觉关键词：统领后续资产与提示词。\n好世界观的标准：删掉故事文字后，仍能从画面看出冒险、尺度和神秘感。\n6. 全流程资产锚点规划\n完整视频不能只做一张海报。要按成片需要拆资产。\n必备资产\nRSO-CHAR-01 主角基础资产：身份、轮廓、服装、头盔/披风/姿态。\nRSO-CHAR-02 主角状态资产：远景剪影、近景头盔反光、手持装置、被光照亮等。\nRSO-SHIP-01 飞船外观资产：复古长翼巡航舰、圆盘飞船、火箭飞船等。\nRSO-PLANET-01 星球/天空资产：巨型星球、环带、双日、气态云层。\nRSO-RUIN-01 遗迹外观资产：环形石门、尖塔、星门、外星文字石碑。\nRSO-PROP-01 关键道具资产：信号器、星图、能量核心、旧式控制器。\nRSO-BG-01 背景空间资产：星云、星尘、深空、远景星系。\nRSO-KF-01 首帧资产：开场或关键镜头首帧，构图稳定。\nRSO-END-01 尾帧资产：可定格成封面海报。\nRSO-TITLE-01 标题卡/文字留白资产：后期加标题用。\n可选资产\nRSO-SCENE-01 飞船内部驾驶舱；\nRSO-SCENE-02 遗迹内部走廊；\nRSO-FX-01 光束/星门/能量波纹；\nRSO-TRANS-01 遮挡转场卡，如飞船掠镜、沙尘扫屏、光束过曝。\n资产表字段： 资产编号｜名称｜用途｜出现镜头｜视觉锚点｜图片提示词要点｜视频使用注意\n资产判断：\n每个资产只解决一个视觉任务；\n能被视频提示词稳定 @引用；\n主角、飞船、星球、遗迹属于同一个美术世界；\n首帧和尾帧优先稳定，不能只追求复杂；\n关键状态要提前做图，不能全靠视频模型临场变形。\n7. 图片提示词写法\n图片提示词服务资产和视频，不只是单张好看。\n每条图片提示词包含：\n画面类型：角色资产、飞船资产、场景资产、首帧、尾帧、标题卡等；\n主体和关系：谁在哪里，面对什么，谁是视觉焦点；\n构图：前景/中景/远景、剪影、巨型星球、对角线飞船、标题留白；\n风格质感：手绘海报、胶片颗粒、印刷纹理、旧纸、网点、轻微褪色；\n色彩：2-4 个明确色彩建立基调，如橙红 + 深蓝 + 金色；\n可控项：主体清晰、层次干净、不要随机文字、不要现代赛博方向；\n视频适配：说明这个资产后续适合哪个镜头、是否需要留运动空间。\n中文优先。英文风格词可作为补强： retro sci-fi poster, vintage space opera, hand-painted poster look, film grain, print texture, dramatic composition, giant planet, spaceship, heroic silhouette, bold color contrast\n8. 视频提示词写法\n视频提示词必须按镜头写，不要只给总提示词。\n每条视频提示词结构：\n使用资产：使用 @RSO-CHAR-01 @RSO-PLANET-01 @RSO-RUIN-01。\n镜头目的：建立世界、主角登场、发现线索、飞船掠过、遗迹启动、高潮、定格。\n首帧构图：主体、星球、飞船、遗迹的位置关系。\n主体动作：一个镜头只做一个核心动作。\n环境动态：星云、星尘、光束、云层、披风、尾焰可以轻微动。\n运镜：固定机位、极慢推进、轻微上摇、缓慢横移、遮挡转场。\n光影：复古暖色高光、深蓝阴影、金色光束脉冲、头盔反光变化。\n质感：胶片颗粒、印刷纹理、旧海报质感保持稳定。\n音效：深空低频、飞船低鸣、能量脉冲、沙尘、胶片机噪声等。\n禁止漂移：列 3-5 个会毁掉该镜头的问题。\n视频提示词要像导演给镜头说明，而不是像图片提示词换个说法。\n9. 生成单元与分镜拆分\n完整视频不要一次性塞给模型。要拆成可生成的单元。\n推荐规则：\n5 秒单元：适合首帧轻动、标题卡、海报定格、单一动作。\n8-10 秒单元：适合一个完整小动作，如飞船掠过、主角走近遗迹。\n15 秒单元：适合一个节拍，但最多 2-3 个镜头感，不要塞复杂剧情。\n60 秒视频通常拆 6-10 个生成单元。\n75 秒视频通常拆 8-12 个生成单元。\n每个生成单元都要有首帧、尾帧目标和可剪辑接点。\n分镜字段： 段落编号｜镜头编号｜时间码｜时长｜视频目的｜画面｜用到资产｜主体动作｜环境动态｜运镜｜光影｜音效｜转场｜首帧要求｜尾帧要求｜视频提示词｜审核点\n命名建议：\n项目代号用 2-4 个英文缩写，如 RSO。\n段落用 bt01 / bt02 / bt03 表示视频段落。\n镜头用两位数表示，如 RSO-bt03-02。\n资产用 RSO-CHAR-01 / RSO-SHIP-01。\n导出文件保持同名，方便剪辑和返修。\n10. 剪辑、声音和标题\n完整视频必须给剪辑方案。\n画面后期：\n轻中度胶片颗粒；\n印刷网点和纸张纹理；\n轻微套印偏移；\n复古褪色；\n暖色高光、深蓝阴影、紫金星云；\n尾帧可冻结 1 秒做海报定格。\n剪辑节奏：\n开头 3-5 秒必须有强视觉钩子；\n中段用慢推进和少量遮挡转场串联；\n高潮不要靠爆炸堆砌，靠光束、星门、尺度和音乐增强；\n结尾回到完整主视觉，方便加标题和封面。\n音效方向：\n深空低频环境；\n复古模拟合成器；\n飞船低鸣；\n远处引擎声；\n能量光束启动；\n古老机械震动；\n星尘、沙尘、风声；\n胶片放映机噪声；\n标题出现的低频冲击。\nBGM 方向：\n复古模拟合成器 + 太空歌剧氛围；\n慢速铺底，逐
