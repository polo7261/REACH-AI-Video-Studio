mm镜头质感`rendered with a virtual 3D camera, cinematic CG framing`\n\n### 11.3 脸型（3D模式）\n\n**防崩底线**（替代真人准则F强规则）：\n\n```\nFACE (minimal integrity floor only): both eyes present and roughly level, features not melted or fused, face not grossly distorted. NOT an overly long lower face, NOT an excessively elongated chin pulling the lower third too deep. Do NOT impose any preferred face shape or proportion. Let face shape vary freely per character.\n```\n\n**高审美导向**（必写，与防崩底线并列）：\n\n```\nAESTHETIC (high-end, striking, memorable): a strikingly beautiful high-fashion-caliber CG face with a distinctive memorable look and strong screen presence, refined elevated features, editorial model-tier attractiveness — not a plain safe generic pretty face, each character visually distinct and unforgettable.\n```\n\n**差异化引导**（柔性，同真人准则G逻辑，分寸铁律相同）：多角色拉开/单角色防模板/素人放开非标准五官。\n\n### 11.4 3D模式调用示例（定脸）\n\n```\n图像生成能力(\n  prompt=\"<CHARACTER:年龄+Chinese+气质+五官+专属记忆点，中文> <FACE防崩底线> <AESTHETIC高审美导向> <按性别取11.1皮肤词> <3D头发词> <3D眼睛词> <OUTFIT中文> high-end 3D CG character render, cinematic quality, clearly CG not a photograph, not flat 2D anime. <COMPOSITION锁定块原文> <RENDERING锁定块：photorealistic词换3D定性句> <SHARPNESS锁定块：realistic skin句换3D皮肤句> plain seamless pure white #ffffff background.\",\n  title=\"<角色名>定脸（3D漫剧）\", tag=\"character\"\n)\n```\n\n全身/三视图/九宫格3D版：在各自节基础上按覆盖表替换质感段，脸型换用11.3两块，其余照旧。\n\n---\n\n## 十二、执行流程\n\n1. **对齐方向**：读取剧本基准文件 `cast-style-{剧本名}.json`（存在则加载质感参数，不重新推理质感层；不存在则此为第一个角色）→ 定质感模式（真人or3D，见漫剧触发规则）→ 判差异化（多角色拉开/单角色防模板）→ 字段缺失用 向用户提问确认 对齐，否则说明补全内容直接执行。\n\n2. **拼prompt生成定脸**：按第三节拼接，三个锁定块逐字写入，tag `\"character\"`，记录资产归档标记。\n\n3. **【确认门·硬性卡点】**：向用户提问确认面部是否满意，未明确通过前绝不生成后续资产。不满意则改prompt重出再回确认门。多角色时全部面部确认后才统一往下。\n\n4. **【4.5 剧本质感存档】**（首个角色且基准文件不存在时）：确认通过后立即用写入文件存档 `cast-style-{剧本名}.json`，内容：质感模式/皮肤基准词/渲染定性词/3D档位。剧本名取不到时向用户提问确认。\n\n5. **多选资产**：向用户提问确认（multi_select）询问要生成哪些：全身立绘/表情九宫格/人物三视图。三视图依赖全身，勾了三视图未勾全身则先补全身。\n\n6. **按选生成**：全身→第七节（3:4，垫定脸）；九宫格→第九节（3:4，垫定脸）；三视图→第八节（16:9，垫定脸+全身）。\n\n7. **收尾**：简述每个产出（角色名+资产类型+资产归档标记），提示OUTFIT块可替换造型重生成。\n\n---\n\n## 十三、边界与硬规则汇总\n\n- **纯白#ffffff**：最高硬规则，所有资产所有步骤。\n- **脸型骨相**：清晰利落下颌、上下脸协调，全角色（含反派）不降。服装风格绝不污染脸，只由五官+气质字段驱动。\n- **头身比**：女性统一7头身（禁超8）；男主8/霸总8.5-9/素人男8/反派最低7/儿童3-4。必写双向否定式。\n- **男裤**：默认直筒/微阔垂坠盖脚面，禁束脚（角色卡明确要求可破例）。上衣绝不塞进下装。\n- **时装大片拉长比例**：仅限男主/霸总，绝不套女性。\n- **反派护栏**：NOT idealised只管身材量感/气场，绝不波及脸型骨相。\n- **确认门**：硬性卡点，未通过绝不生成后续资产。\n- **锁定块**：写入prompt时原封不动，不改不精简。\n- **剧本质感锁定**：同一剧本所有角色质感统一，靠 `cast-style-{剧本名}.json` 文件跨对话锁定；后续角色读取文件复用质感层，不重新推理。\n\n**脸型崩坏排查**：下半脸宽/方/松垮→①检查准则F脸型词是否写入；②检查反派NOT idealised是否误外溢到脸；③加重否定式 `NOT a wide square heavy jaw, NOT a bottom-heavy sagging lower face`。\n\n**虚焦/构图排查**：头发耳朵虚焦→查SHARPNESS块是否完整写入；构图漂移→查COMPOSITION块+资产参考引用是否正确。prompt禁用 `narrow aperture / large depth of field`。", "extras": [], "cn": "选角Casting"}, {"slug": "celebrity-award-moment", "desc": "15 秒电影级颁奖名场面,聚光灯锁定人群里的TA", "body": "---\n\n## name: award-ceremony-video\\\\\n\nnamespace: industry\\\ntitle: \"颁奖典礼视频\"\\\ndescription: \"生成 15 秒电影感颁奖典礼视频——主持人上台宣布获奖者、聚光灯在人群中找到 TA、走向领奖台、领奖、LED 屏揭示名字与奖项。获奖者/主持人双人身份锁定、多机位广播质感。用于 generate_image_v3 + generate_video_v3。\"\\\nversion: 1\n\n# award-ceremony-video\n\n做\"颁奖典礼\"这类个性化荣誉/趣味视频时用本 skill。一条 15 秒电影感一镜：主持人在台上宣布 → 聚光灯扫到人群中的获奖者 → 起身走向领奖台 → 领奖 → LED 屏亮出名字与奖项。**图序 = 身份序：第一张 = 获奖者 =** `@image_1`**，第二张 = 主持人 =** `@image_2`**；调换会把\"宣布者\"与\"上台者\"对调。**\n\n> 本环境适配：源为 MUAPI/Seedance 2.0 图生视频 recipe，表达已按 MIT 重写。Seedance → `generate_image_v3`（角色锚点）+ `generate_video_v3`（图生视频，一次调用 ≤15 秒）；`@image_1/@image_2` → `reference_nodes` + prompt 里 `{{NodeKey}}`；技术规格（`aspect_ratio`/`resolution`/`duration_sec`/生成音频）走字段，不写进 prompt 正文。\n\n## 输入\n\n名称必需默认说明获奖者照是—清晰正脸照。作 `@image_1`（第一张），全片身份严格锁定。主持人照是—清晰正脸照。作 `@image_2`（第二张），台上唯一主持人。获奖者名字否Olivia主持人念出，并渲染在 LED 屏 \"THE BEST ACTOR\" 之上。生成前先跟用户确认拼写（音频与 LED 屏两处都出现）。奖项名否THE BEST ACTORLED 屏显示的奖项标题。\n\n## 流程\n\n### 一、确认输入\n\n两张照片任一缺失 → 请用户先上传。生成前确认获奖者名字与奖项名——两者都会在成片里出现（音频 + LED 屏文字），拼写错了要重烧。\n\n### 二、注册双人锚点\n\n用 `generate_image_v3` 为获奖者、主持人各出一张稳定角色设定图，作持久身份锚点（获奖者 `{{Winner}}`、主持人 `{{Host}}`）。**顺序即身份**：获奖者锚点先入 `reference_nodes`（映射 `@image_1`），主持人次之（映射 `@image_2`）。若两人此前已有可复用锚点，直接复用 node_key、跳过重建。\n\n### 三、生成成片\n\n用 `generate_video_v3` 图生视频，一步出片：`reference_nodes` 按 \\[获奖者, 主持人\\] 顺序传入；`aspect_ratio=16:9`、`resolution=720p`、`duration_sec=15`、开启生成音频。prompt 覆盖下述五轴 + 15 秒时间线：\n\n**风格与基调**：极写实真人颁奖典礼现场，多机位广播质感——在精修的电视转播机位与贴身手持纪录片镜头之间切换；奥斯卡/格莱美级制作水准；真实人类反应，不过度表演。\n\n**布光**：宏大室内颁奖场馆。戏剧性舞台光——舞台暖金聚光、观众席偏冷环境光、广播摄像机灯、LED 屏投出彩色光。宣布获奖者瞬间——一束暖光扫过并锁定人群中的获奖者。\n\n**场景**：格莱美/奥斯卡规模的顶级颁奖场馆。高耸 LED 屏的大舞台、优雅讲台、现场乐池、成千正装观众成排就座、过道两侧的媒体摄像机、头顶大屏播直播画面——整个场馆散发气派与规模感。\n\n**身份严格锁定**：\n\n- `@image_1` 获奖者「{名字}」——以 @image_1 为严格身份，正装出席、无墨镜、不改脸不改身形，初始坐在观众席正装人群中。\n- `@image_2` 主持人——以 @image_2 为严格身份，讲台唯一主持人，保持精确面部/身形/特征，正装、不改脸不改身形。\n\n**音频**：优雅管弦背景乐、主持人话筒声经场馆扬声器投射、人群低语后转为爆发的掌声欢呼、椅动声、上台脚步声、奖杯/奖牌递接声、观众情绪反应。\n\n**15 秒时间线（跨镜每处重标身份锚点，防漂移）**：\n\n- **0–3s 宣布**：@image_2 面部广播特写（紧、电影感），立于讲台话筒前暖金聚光下，神情从容有魅力、刻意积蓄悬念；手持信封/卡片，最后瞥一眼，直视镜头，一拍静默，凑近话筒缓缓说\"And the winner is...\"；镜头锁在 @image_2 脸上——唇、表情、张力；背景人群低语。\n- **3–6s 获奖者**：硬切到观众席——低角度电视机位穿过成排座位推进，找到坐在宾客中、放松未预期的 @image_1；@image_2 声音继续经扬声器轰响出名字；聚光从上方骤然锁定 @image_1，其表情由真实错愕（睁大眼、微张口）转为忘我笑容，左右看向身旁难以置信；全场掌声欢呼爆发，周围人起立鼓掌拍肩。\n- **6–9s 起身与行进**：@image_1 挺身、平复、起立；手持纪录片镜头立刻从过道跟上——随人前行朝舞台移动，微晃、贴身、真实；掌声持续轰鸣；头顶广播大屏切到其面部直播；@image_1 从容前行——正装整洁、身姿挺直、神情温暖略动情。\n- **9–12s 抵台**：手持镜头随 @image_1 登台阶，明亮舞台聚光在其登台时完全打上；@image_2 从讲台前迎、暖笑、双手捧奖牌；@image_1 抵讲台、双手接过、低头看一眼真实一刻；两人自然一笑与短握手；身后巨型 LED 屏：@image_1 面部大幅肖像、其名字以粗体优雅字体呈现「{名字}」、下方「{奖项名}」，屏面辉光并跳动庆祝图形。\n- **12–15s 定格**：镜头落到全舞台广播全景——@image_1 立于讲台手持奖牌、@image_2 立其旁、身后 LED 墙以其名字与面部灼亮；聚光锁 @image_1；掌声充满全场、起立鼓掌层层扩散；@image_1 略举奖牌望向人群、笑容从容真诚；@image_2 在旁领掌；末帧定格——全舞台、灼亮 LED、轰鸣人群、@image_1 立于中心；不淡出黑场。\n\n出片后把这条 15 秒成片交付用户。\n\n## 触发词\n\n颁奖典礼、颁奖视频、奥斯卡视频、格莱美典礼、最佳演员奖、获奖公布视频、红毯颁奖；award ceremony、awards show video、oscars video、grammy ceremony、best actor award、winner announcement video、red carpet award。\n\n## 相关（边界，非依赖）\n\n边界（勿用本 skill，改道）：把自己插进名场面/体育高光 → sports-self-insert；与名人合影静图 → celebrity-selfie。\\\n跨镜身份锁定方法本 skill 已内联自足；若同一人设还要在别处复用，可与 `character-consistency` 同载沿用同一锚点（可选，非必需）。", "extras": [], "cn": "名流获奖短片"}, {"slug": "character-worldview-locking", "desc": "【核心痛点】角色关系、人物设定、世界观在剧本迭代中容易前后不", "body": "### 1. 用途\n\n针对漫剧、短剧开发，深度解析剧本与参考图，生成结构化的人物圣经、复杂关系网、世界观设定表及“禁改红线”，确保从剧本到后期资产的创作一致性，防止人设崩塌。\n\n### 2. 适用输入\n\n- **剧本内容**：完整剧本、分集梗概或剧本片段。\n- **设定资料**：已有的人设稿、演员资料、性格关键词文本。\n- **视觉参考**：角色概念图、场景氛围图、服装参考图（jpg/png）。\n\n### 3. 操作步骤\n\n- **视觉特征解析**：从参考图中提取外观标签（发型、体型）、气质描述（如冷峻、甜美）及场景世界观视觉基调。\n- **构建人物圣经**：整合视觉与文本信息，生成包含核心欲望、性格弧光、秘密及“不可变设定”的详细小传。\n- **关系网建模**：输出角色间的多维关系图谱（含表面与真实关系），并提供 Mermaid 渲染代码。\n- **设定红线锁定**：列举生理特征、技能上限、台词风格指纹（语速、句式、口癖）等必须锁死的设定项。\n- **世界观结构化**：整合时代、地点、社会法则及核心冲突，输出视觉自检清单及一致性校对报告。\n\n### 4. 输出要求\n\n- **多板块输出**：包含人物小传、身份三层标签、关系强度表、禁改规则及世界观表格。\n- **台词指纹**：为每个角色提供 3-5 句符合性格的示例金句。\n- **矛盾标注**：若剧本细节与设定冲突，需在校对报告中明确标注并提供修改建议。\n\n### 5. 注意事项\n\n- 关系网中需包含情感浓度评分（1-10）及关键转折集数。\n- 生成的 Mermaid 代码可直接用于可视化工具渲染。\n- 若用户输入中存在逻辑模糊点，输出将自动标注【需导演确认】。", "extras": [], "cn": "人物关系与世界观锁定漫剧"}, {"slug": "cinematic-image-transformer", "desc": "一句大白话就能生成超质感电影级多风格图片", "body": "# Cinematic Visual Storytelling\n\n## Core Methodology\n\n### Framework 1: Layered Element Isolation\n\nTreat every visual output as independently controllable layers:\n\n- **Layer 1 (Character Identity)**: face, body proportions, skin tone — generated once as reference image, locked across all subsequent scene outputs\n- **Layer 2 (Costume/Equipment)**: clothing, accessories, gear — can vary per scenario while maintaining identity consistency\n- **Layer 3 (Environment)**: scene setting, architecture, landscape — varies based on narrative context\n- **Layer 4 (Atmosphere)**: lighting, color palette, weather — driven by style routing logic\n- **Layer 5 (Composition)**: camera angle, shot size, focal length simulation — varies to create visual rhythm\n\n**Why this matters**: Locking character identity in a separate reference image prevents model drift across scene variations. Environment and atmosphere can be freely manipulated without corrupting character consistency. This is the foundational structure for serialized visual storytelling.\n\n### Framework 2: Style-Driven Prompt Architecture\n\nStyle routing is a pre-generation decision tree that maps user intent to visual parameters:\n\n**Input signals**: user's descriptive keywords (e.g., \"冷寂\" cold desolation, \"压迫感\" overwhelming scale, \"废土\" wasteland, \"科技\" high-tech)\n\n**Routing logic**:\n\n- Apocalyptic loneliness → low saturation cool gray-green, widescreen 2.39:1, destroyed urban environments, solitary figure at small scale\n- Overwhelming creature scale → extreme low-angle perspective, subject occupies &gt;60% vertical frame, deep shadows, atmospheric haze for depth perception\n- High-tech futurism → clean geometric forms, cyan/blue bioluminescent accents, wide-angle lens distortion, reflective metallic surfaces\n- Cold noir atmosphere → high-contrast chiaroscuro, rain/wet reflections, desaturated palette with single accent color\n\n**Parameter mapping**: Each style route translates to concrete technical specifications:\n\n- Color: specific HSV ranges (e.g., H: 180-200° cyan, S: 40-60%, V: 30-50%)\n- Composition: named shot types (\"extreme low-angle hero shot\", \"wide environmental establishing\", \"tight medium close-up\")\n- Lighting: directional logic (\"single high-key backlight\", \"diffused overcast ambient\", \"hard rim light with fill bounce\")\n\n### Framework 3: Model-Specific Constraint Adaptation\n\nDifferent AI models have fundamentally different prompt processing capabilities. This framework ensures prompt structure matches model architecture:\n\n**Midjourney (MJ)**:\n\n- Character limit: hard cap 1024 characters, target &lt;800 to leave buffer\n- Structure: comma-separated keyword phrases only, no subordinate clauses\n- Order: \\[subject + action\\], \\[shot size + angle\\], \\[environment\\], \\[camera + lens\\], \\[lighting\\], \\[color palette\\], \\[mood\\], \\[style anchors\\]\n- Forbidden: long descriptive sentences, stacked realism paragraphs, Chinese characters\n- Realism condensing: replace full technical paragraphs with 5-6 tokens (\"photorealistic, cinematic film still, clean deep shadows, dense midtones, filmic tonal range, optical sharpness\")\n\n**Seedream 5.0 Pro / Lib Image (image2)**:\n\n- Supports longer natural language prompts with hierarchical structure\n- Can handle technical photography terminology (\"shallow depth of field\", \"bokeh\", \"chromatic aberration control\")\n- Mandatory quality suffix for image2: \"Low ISO, no visible grain noise, no heavy film grain, no dirt, no mud spots, no mold marks, no dust spots, clean optical clarity\"\n- Supports resolution specifications and aspect ratio control\n\n### Framework 4: Reference Image Propagation Logic\n\nWhen a character/object reference image exists, all subsequent prompts must maintain visual DNA:\n\n**Hard constraints**:\n\n- Face structure: bone structure, eye shape, nose bridge, lip contour — zero tolerance for deviation\n- Body proportions: height-to-head ratio, shoulder width, limb length — must match reference silhouette\n- Signature details: scars, tattoos, facial hair, unique costume elements — must appear in all outputs\n\n**Flexible dimensions**:\n\n- Pose and gesture: can vary freely as long as body proportions remain consistent\n- Lighting and color grading: can shift to match scene atmosphere without changing identity\n- Camera angle: different perspectives are allowed but facial features must remain recognizable\n\n**Technical implementation**: Use reference image placeholder `{{node_key}}` early in prompt structure. Follow with minimal identity reinforcement text (3-5 keywords max) rather than re-describing the entire character.\n\n## Workflow\n\n### 1. Preparation Stage\n\n**Mandatory Two-Phase Confirmation** (cannot be skipped or merged):\n\n**Phase 1 — Character Appearance Lock**\n\nPresent user with choice:\n\n- Option A: Generate reference image first to lock character appearance (face, hair, costume), then proceed to full scene\n- Option B: Direct text-to-image generation without reference locking\n\nIf Option A chosen, follow with sub-questions:\n\n- Character archetype (e.g., Asian features / Western features / non-human)\n- Costume style (e.g., black trench coat / nano-tech suit / fantasy armor)\n- Any signature visual elements (e.g., cybernetic implants / glowing tattoos / specific accessories)\n\n**Phase 2 — Scene Foundation**\n\nPresent user with choice:\n\n- Option A: User provides reference image for scene/environment style\n- Option B: AI autonomously generates scene based on keywords\n\nIf Option B chosen, extract atmosphere keywords from user's description and perform style routing.\n\n**Asset Inventory Checklist**:\n\n- \\[ \\] Character reference image (if Phase 1 = Option A)\n- \\[ \\] Scene reference image (if Phase 2 = Option A)\n- \\[ \\] Style routing completed (if no references provided)\n- \\[ \\] Target model identified (MJ / Seedream / image2)\n- \\[ \\] Batch size confirmed (see Batch Generation Control below)\n\n### 2. Initial Design Stage\n\n**Step 1: Generate Character Reference (if required)**\n\nPrompt structure for character reference:\n\n```\n[Character archetype] + [Costume description] + [Pose: neutral standing or sitting] + [Background: solid black or simple gradient] + [Lighting: even front light for clear feature visibility] + \"character design sheet, full body visible, clear facial features, high detail\"\n```\n\nGenerate 4 variations, present to user for selection. Locked reference becomes `{{node_key}}` for all subsequent scenes.\n\n**Step 2: Build Scene Prompt**\n\nFor MJ:\n\n```\n{{node_key}}, [subject action/pose], [shot size + angle], [environment keywords], [lighting type], [color palette], [mood], photorealistic, cinematic, [aspect ratio]\n```\n\nFor Seedream/image2:\n\n```\n{{node_key}}, [detailed scene description with hierarchical structure: foreground → midground → background], [camera specifications: lens type, depth of field, angle], [lighting setup: direction, quality, color temperature], [atmospheric effects: fog, rain, dust], [color grading: specific tonal range], [technical quality markers: sharpness, clarity, texture detail]\n```\n\nFor image2 specifically, append mandatory suffix:\n\n```\nLow ISO, no visible grain noise, no heavy film grain, no dirt, no mud spots, no mold marks, no dust spots, clean optical clarity\n```\n\n**Step 3: Batch Generation Control (Critical Rule)**\n\nNEVER generate multiple variations without explicit user permission.\n\n**Default behavior**: Generate 1 output only\n\n**When multiple outputs are allowed**:\n\n- User explicitly requests \"多生几组\" (multiple sets) or \"给我几个版本\" (give me several versions)\n- Agent asks \"是否需要多生几组图片作对比?\" (Do you need multiple sets for comparison?) and user confirms\n\nIf user does NOT confirm multi-generation request, produce exactly 1 output.\n\n### 3. Iteration Stage\n\n**Optimization Dimension 1: Composition Adjustment**\n\nIf user feedback indicates compositional issues:\n\n- \"太近了\" (too close) → reduce subject scale, pull camera back, wider shot\n- \"看不清细节\" (can't see details) → tighter framing, closer shot, increase subject scale\n- \"角度不对\" (wrong angle) → adjust camera height (low-angle for power, high-angle for vulnerability, eye-level for neutrality)\n- \"不够震撼\" (not impactful enough) → extreme perspective (fisheye distortion, dramatic low-angle, overhead god's-eye view)\n\n**Optimization Dimension 2: Atmosphere Refinement**\n\nIf user feedback targets mood:\n\n- \"不够冷\" (not cold enough) → reduce color temperature (shift blue), increase desaturation, add fog/mist\n- \"太暗了\" (too dark) → lift shadows while maintaining contrast, add rim lighting or practical light sources\n- \"颜色太饱和\" (colors too saturated) → reduce saturation by 20-30%, shift toward muted/dusty palette\n- \"氛围不够压抑\" (atmosphere not oppressive enough) → lower horizon line, increase shadow mass, add claustrophobic framing (tight crop, blocked exits)\n\n**Optimization Dimension 3: Scale and Detail Balance**\n\nFor scenes involving massive creatures or structures:\n\n- Include scale reference objects (human figures, vehicles, buildings at 1:50+ scale ratio)\n- Use atmospheric perspective (haze, fog layers increasing with distance)\n- Employ extreme depth of field (keep foreground and distant subject both in focus for size comprehension)\n- Add foreground framing elements (archway, tree branches) to create layered depth\n\n**Cross-Output Consistency Audit**\n\nWhen producing series with same character:\n\n- \\[ \\] Face structure identical across all outputs (check: eye spacing, nose shape, jawline)\n- \\[ \\] Body proportions maintained (check: height ratios, limb length)\n- \\[ \\] Signature costume elements present (check: specific accessories, color blocking)\n- \\[ \\] Lighting can vary but should not alter core facial features\n- \\[ \\] If inconsistency detected, regenerate using original reference `{{node_key}}` with stronger identity reinforcement\n\n**When to Accept vs. Regenerate**\n\nAccept output when:\n\n- Core identity features match reference (if reference exists)\n- Composition serves narrative intent\n- Atmosphere matches style routing target\n- Technical quality meets standard (sharp focus, clean rendering, no artifacts)\n\nRegenerate when:\n\n- Character face does not match reference (facial structure drift)\n- Composition obscures critical narrative elements\n- Atmosphere contradicts style routing (e.g., warm tones in cold noir scene)\n- Technical defects present (blurry, distorted, nonsensical anatomy)\n\n## Key Constraints & Standards\n\n### Immutable Rules (Never Violate)\n\n1. **Two-Phase Confirmation Mandatory**: Every new project must execute character confirmation → scene confirmation sequence. Cannot skip, cannot merge into one question.\n\n2. **Batch Generation Consent Required**: Default = 1 output. Multiple outputs only if user explicitly requests or confirms when asked. Agent cannot autonomously decide to generate 4 variations.\n\n3. **Reference Image Lock**: Once character reference is generated and user selects one, that `{{node_key}}` must appear in ALL subsequent scene prompts for that character. No exceptions.\n\n4. **Model-Specific Prompt Limits**:\n\n   - MJ: ≤800 characters (hard cap 1024), keyword phrases only\n   - Seedream/image2: no hard limit but maintain structured hierarchy\n\n5. **image2 Quality Suffix**: When using Lib Image (image2) model, mandatory append: \"Low ISO, no visible grain noise, no heavy film grain, no dirt, no mud spots, no mold marks, no dust spots, clean optical clarity\"\n\n### Fidelity Rules (Quality Standards)\n\n**Character Consistency**:\n\n- Face structure deviation tolerance: 0% (regenerate if facial features differ)\n- Body proportion deviation tolerance: ±5% (minor pose-induced perspective shifts allowed)\n- Costume signature elements: 100% retention required\n\n**Atmospheric Coherence**:\n\n- Color palette deviation from style routing: ±10° hue shift, ±15% saturation shift allowed\n- Lighting direction can vary but quality (hard/soft) must match scene context\n- Weather/atmospheric effects (fog, rain, dust) must be consistent within a scene series\n\n**Technical Quality**:\n\n- Focus: primary subject must be sharp unless intentional blur for motion/depth effect\n- Rendering: no visible AI artifacts (malformed hands, nonsensical architecture, text gibberish)\n- Composition: rule of thirds adherence for balanced shots, intentional breaking allowed for tension/unease\n\n### Scene-Specific Constraints\n\n**Apocalyptic/Wasteland Scenes**:\n\n- Color palette: desaturated earth tones (browns, grays, muted greens), avoid vibrant colors\n- Architecture: must show decay (crumbling concrete, rusted metal, overgrown vegetation)\n- Scale: include distance markers (mountains, ruined skyscrapers) to establish environment scope\n- Human presence: isolated figures, avoid crowds (contradicts desolation theme)\n\n**High-Tech/Futuristic Scenes**:\n\n- Geometry: clean lines, no organic irregularity unless intentional bio-tech fusion\n- Lighting: must include artificial light sources (neon, holograms, bioluminescent panels)\n- Materials: reflective metals, transparent polymers, glowing energy conduits\n- Scale: massive structures (space stations, megacity towers) to convey technological advancement\n\n**Creature/Monster Scale Scenes**:\n\n- Size ratio: creature must be ≥10x human scale for \"overwhelming\" effect, ≥50x for \"cosmic horror\" effect\n- Perspective: extreme low-angle mandatory, camera positioned at human eye level looking up\n- Atmospheric depth: use haze/fog to prevent creature from looking like foreground cutout\n- Reaction elements: include human figures showing fear/awe to anchor emotional context\n\n**Noir/Cold Atmosphere Scenes**:\n\n- Contrast ratio: deep blacks (shadow mass ≥40% of frame), controlled highlights\n- Wet surfaces: rain-slicked streets, window condensation, reflective puddles mandatory for noir feel\n- Color temperature: cool (blue-shifted) or monochromatic with single warm accent\n- Isolation: solitary figure composition, avoid groups or busy backgrounds\n\n## Recommended Tools & Models\n\n**Midjourney (MJ)**: Best for stylized, artistic interpretations with strong aesthetic coherence. Use when user requests \"极具特色\" (highly distinctive style) or specifies \"用MJ模型\". Requires strict prompt compression (≤800 chars, keyword phrases only).\n\n**Seedream 5.0 Pro**: Optimal for high-resolution photorealistic outputs with complex scene details. Supports natural language prompts with technical photography terminology. Use for \"高清\" (high resolution) or \"写实\" (photorealistic) requests.\n\n**Lib Image (image2)**: Specialized for image-to-image refinement and upscaling. Mandatory for \"放大4K\" (upscale 4K) or \"重塑细节\" (detail enhancement) requests. Always append quality suffix: \"Low ISO, no visible grain noise, no heavy film grain, no dirt, no mud spots, no mold marks, no dust spots, clean optical clarity\".\n\n## Advanced Techniques\n\n### Multi-Scene Narrative Sequencing\n\nFor serialized visual storytelling (e.g., character journey across multiple environments):\n\n1. Lock character reference in Scene 1\n2. Generate 3-5 key narrative beats as separate scenes, each with:\n   - Same character reference `{{node_key}}`\n   - Progressive environmental shift (e.g., wasteland → abandoned city → underground bunker)\n   - Compositional variety (wide establishing → medium action → close-up emotion)\n3. Maintain consistent lighting quality (hard/soft) across sequence even as direction/color shifts\n4. Use recurring visual motifs (e.g., same red scarf, same weapon) as continuity anchors\n\n### Hybrid Style Synthesis\n\nCombine elements from multiple style routes for unique aesthetics:\n\n- **Apocalyptic + High-Tech**: Decayed megastructures with flickering holograms, rust + neon\n- **Noir + Creature Horror**: Urban rain scene with cosmic monster emerging from fog, chiaroscuro + Lovecraftian scale\n- **Wasteland + Bioluminescent**: Desert ruins with glowing alien flora, muted earth tones + cyan/magenta accents\n\nWhen synthesizing, maintain dominant style (70% composition) and subordinate style (30% accent). Do not 50/50 split — results in visual confusion.", "extras": [], "cn": "电影质感画面专业生成"}, {"slug": "cinematic-motion-realism", "desc": "告别塑料感演技，注入真实电影质感", "body": "# cinematic-motion-realism\n\n要写实电影级运动（不是动画/动效/UGC）时，用本 skill 给视频 prompt 注入真实感。工艺全量内联、自足，无需外挂别的 skill。\n\n> 本环境适配：Seedance 2.0 / MultiModalToVideo → `generate_video_v3`；材质物理/环境力/克制表演等真实感指令直接嵌入 prompt 文本，无独立工具调用。音频内嵌格式按 SP（音效 `<>`、台词 `{}`、字幕 `【】`、音乐 `()`）。源为 Seedance 电影级 prompt 工艺，本环境同引擎适用。\n\n## 何时用\n\n真实身体动作、自然人类行为、情绪特写（克制表演）、驾驶/亲密/打斗/动作场面、环境互动（风雨水阻尘重力）、写实运动生成。风格化 CGI/动画/动效不走本 skill。\n\n## 核心原则：真实感来自克制，不是奇观\n\n五根接地支柱：① **身体重量与物理**（演员有质量，动作有摩擦/动量/接触力）② **环境力**（风/水/重力/织物对演员反推）③ **情绪克制**（微表情/憋住的节拍/呼吸，不夸张预告）④ **相机作为观察者**（镜头有自己的物理存在）⑤ **连续性锚点**（光向/服装/时段跨镜延续）。\n\n## 接地 prompt 六块结构\n\n`[风格与情绪] [镜头方向] [演员行为] [环境力] [相机行为] [音频]`\n1. **风格与情绪**（1 句）：摄影师词汇「35mm 变形镜、自然主义色彩、柔对比」，不堆形容词。**禁关键词汤**（\"8k / masterpiece / trending\"），用技术描述替代。\n2. **镜头方向**（1 句）：主谓宾 + 地点，不要不做结构功的形容词。\n3. **演员行为**（2–3 句）：**必含**重量线索 + 一个微动作 + 一个憋住的节拍。用流畅的过渡语言，不要\"他跑然后停下\"这类断裂动作。**禁**：「泪流满面」「他狂奔」「咧嘴大笑」。\n4. **环境力**（1–2 句）：什么在反推演员——空气/水/重力/表面/光源。用物理关系触发模型推理（如\"霓虹在雨湿沥青上的反光\"），别写\"好光线\"。\n5. **相机行为**（1 句）：默认词汇「锁定静帧」「缓慢手持呼吸」「步速推入」。别在同段里下矛盾指令（\"静止相机\"+\"环绕\"）。\n6. **音频**（1 句）：先环境后人声，如「环境：仅室内声。无对白，无音乐」。**音频始终写一句**——引擎原生生成音频，不写则随机音不匹配画面。\n\n## 场景模式\n\n- **驾驶（车内）**：锁定或极轻手持；手在方向盘 9 点 3 点。\n- **情绪特写（克制）**：无泪、无预告悲伤；表演在憋住的节拍与微动作里。\n- **动作（脚步追逐）**：步幅紧凑、肩先行；用流畅衔接，别多动作塞进 4–5s。\n- **打斗（肢体明确性）**：动作 = 意图 + 具名技法 + **明确肢体** + 接触点；绝不用含糊的\"旋踢/spinning kick\"（会让引擎混淆左右肢），写\"右腿前踢\"\"左臂格挡\"。将受击的角色必须在**主动反应**（格挡/闪避/反制），不被动僵立。张力来自**剪切密度**而非单镜奇观——一镜内多 beat 打斗按秒分区、每秒一动作、镜别激进变化（勿连续两个 WIDE，每次 IMPACT 落在 CU/ECU）。\n- **亲密（克制贴近）**：由\"不动作\"构建，克制加吻/泪/耳语。\n- **环境互动（天气即角色）**：风要塑造多个元素（头发/外套/草/海鸥）。\n\n## 连续性锚点（多镜序列，每镜逐字复制）\n\n① 光照锚（同光源同方向）② 服装锚（完整描述、同措辞）③ 时段锚（显式）④ 地理锚（上镜结束时演员在哪）⑤ 音床锚（同环境签名）。避免在单镜里做复杂主体变形（\"人变成鸟\"），破真实感与时序一致性。\n\n## 提交默认与失败模式\n\n默认：`aspect_ratio` 21:9 或 16:9；单镜 `duration` 6–10s（一动作一 beat，10–15s 至多 3–4 beat）；音频始终开。\n| 症状 | 病因 | 修 |\n|---|---|---|\n| 漂浮运动 | 无身体重量线索 | 加重量/质量线索 |\n| 静止环境 | 无环境力 | 加风/重力/表面 |\n| 过度表演的脸 | 用了\"哭/暴怒\"动词 | 换成微动作 |\n| 飞天相机 | \"横扫/史诗\" | 换成具体镜头词汇 |\n| 摄影棚感 | 无环境力+无音频 | 补第 4、6 块 |\n| 连续性漂移 | 未复制锚点 | 五锚点逐镜复制 |\n| 打斗动作糊/左右错 | 含糊技法词、单镜过载 | 具名肢体+接触点，一段一动作 |\n| 音频不匹配 | 漏写音频指令 | 补音频块（引擎原生出音） |\n\n## 用法\n\n把上述写进 `generate_video_v3` 的 prompt；写实题材优先于风格化描述。多镜序列逐镜复制连续性锚点。\n\n## 相关（边界，非依赖）\n\nSeedance 综合 prompt 架构（操作律/预设库/原型）→ seedance-director；模型无关运镜语汇 → cinematic-motion-language。二者为姊妹工艺 ref，本 skill 自足不依赖它们；如需组合，由用户 query 一并加载。", "extras": [], "cn": "写实表演真实感"}, {"slug": "cinematic-shot-designer", "desc": "Design, rewrite, diagnose, and quality-check camera-language prompts for AI films and videos. Use when a user needs shot angles, camera height, lens and perspective, framing, camera movement, blocking-to-camera timing, shot transitions, or a coherent shot list; do not activate for general image styling with no camera-design need.", "body": "# AI Cinematic Shot Designer\n\nTurn story intent into camera instructions an AI video or image model can execute. Treat cinematic language as spatial and temporal design, not as a pile of style words.\n\n## First decide the deliverable\n\n- **Single still / keyframe:** design a static viewpoint. Read references/camera-language.md, then use the static format in references/output-formats.md.\n- **Single moving shot:** define a continuous camera path and bind each camera change to character or story beats. Read both references.\n- **Multi-shot scene:** give every shot one dramatic job, preserve screen direction and spatial continuity, and use the sequence format in references/output-formats.md.\n- **Prompt diagnosis or rewrite:** preserve the user's story, characters, reference bindings, dialogue, duration, aspect ratio, and chosen model. Identify camera conflicts before rewriting.\n\n## Design in this order\n\n1. Extract the story beat, emotional shift, subject, action, environment, duration, and requested output language or platform.\n2. State the shot's dramatic job in plain language: reveal, isolate, intimidate, align, disorient, pursue, withhold, or release.\n3. Place the camera relative to the subject: side, front, rear, over-shoulder, POV; height; angle; distance; and whether an obstruction motivates the viewpoint.\n4. Choose focal length and framing for the intended spatial effect. Do not choose a lens as decoration.\n5. Arrange foreground, subject plane, background, eye-line, screen direction, and negative space.\n6. For motion, specify start frame, trigger, path, direction, speed curve, framing behavior, end frame, and cut or hold. Pair camera beats with performance beats.\n7. Add only relevant focus, shutter/motion feel, stabilization, lighting, color, atmosphere, and sound constraints.\n8. Run the conflict and feasibility check before delivering.\n\nLead with intent when explaining choices. In the final generation prompt, place concrete observable instructions before broad aesthetic labels.\n\n## Working rules\n\n- Angle and lens work as a pair: an angle establishes viewer–subject power; the lens controls spatial expansion, compression, proximity, and distortion.\n- Prefer physical descriptions such as “camera 20 cm above the floor, 3 m in front of the actor, tilted upward” over an unsupported “epic low angle.”\n- A moving shot needs one readable dominant move. Add secondary motion only when it follows naturally from the operator, vehicle, crane, or character.\n- Describe what stays invariant during movement: face size, lead room, horizon, eye-line, subject placement, or distance.\n- Separate simultaneous actions from sequential actions. Use numbered beats for dense timing.\n- Keep reference-image facts distinct from camera instructions. Never invent reference labels, character traits, or continuity facts.\n- Do not force every technical field into every answer. Include a value only when it changes the shot or prevents ambiguity.\n- Do not silently overwrite explicit user choices. If they conflict, retain the dramatic goal and explain the smallest necessary correction.\n\n## Handling missing information\n\nMake conservative assumptions when they do not change the story: standard cinematic motion, plausible camera placement, one clear subject, and continuity-safe screen direction. Label important assumptions briefly.\n\nAsk a question only when one missing choice would materially change the result, such as still versus video, one take versus montage, unknown scene action, or a platform with strict syntax. Otherwise produce a usable first pass and expose 1–2 optional variants.\n\n## Quality gate\n\nReject or repair instructions that require the camera to be locked and moving at once, use incompatible angles or positions in the same instant, lack a start/end state, cross the axis without motivation, exceed the available duration, hide essential action, or demand physically impossible acceleration. Confirm that the shot's emotional effect follows from the actual camera geometry rather than from adjectives alone.", "extras": [{"name": "camera-language.md", "text": "# Camera-language decision guide\n\nUse this guide to choose camera geometry and movement from narrative intent. These are tendencies, not automatic formulas; performance, blocking, production design, and context can reverse an effect.\n\n## Viewpoint and power\n\n| Choice | Typical viewer relationship | Strong uses | Watch for |\n|---|---|---|---|\n| Eye level | Equality, presence, observation without overt judgment | dialogue, intimacy, restrained emotion, realism | Flatness if depth, blocking, or focal length is unspecified |\n| High angle | Subject placed inside a larger order | vulnerability, surveillance, isolation, spatial explanation | “High angle” alone does not state height or purpose |\n| Vertical overhead | Diagrammatic space, enclosure, ritual, loss of agency | choreography, bodies/objects in a pattern, entrapment | Faces and eye-lines may become unreadable |\n| Low angle | Increased visual weight and dominance | entrance, threat, awe, monumentality | Wide lenses near faces can distort anatomy |\n| Dutch angle | Destabilized horizon | rupture, intoxication, panic, moral imbalance | Becomes decorative if nothing motivates the tilt |\n| OTS / dirty frame | Relational tension and subjective proximity | dialogue, confrontation, conceal/reveal | Keep eye-lines and shoulder ownership consistent |\n| POV | Viewer inherits a character's information limits | discovery, danger, embodiment | Do not show information the character cannot see |\n| Obstructed / voyeur view | Distance, secrecy, surveillance | suspense, social separation | Obstruction must not cover the essential action |\n\nAlways make geometry concrete: camera height, subject-relative direction, approximate distance, tilt, and intended subject scale.\n\n## Lens and space\n\n- **14–24 mm ultra-wide / wide:** expands depth, strengthens converging lines, increases presence and speed near camera. Useful for spatial immersion, pursuit, low-angle entrances, and confined environments. Keep faces away from edges unless distortion is intentional.\n- **28–40 mm moderate wide:** keeps environment active while preserving a natural human presence. Useful for walk-and-talks, handheld following, and full-body staging.\n- **45–58 mm normal:** neutral perspective at ordinary working distances. Useful for restrained observation and dialogue.\n- **65–100 mm short telephoto:** isolates faces, narrows the field, and calms background movement. Useful for pressure, withheld observation, and performance detail.\n- **135–200 mm telephoto:** compresses layers and produces remote surveillance or dense urban depth. Requires real camera distance and careful tracking.\n- **Macro / extreme close focus:** turns material detail into story information; specify focus target and scale.\n\nPerspective comes from camera distance; focal length controls framing from that distance. When precision matters, describe both rather than claiming the lens alone creates perspective.\n\n## Framing and depth\n\nSpecify the subject scale only as tightly as needed: extreme wide, wide/full body, medium, medium close-up, close-up, extreme close-up. Add composition when it carries meaning:\n\n- Foreground occlusion can create depth, surveillance, or discovery.\n- Negative space can anticipate an entrance, imply absence, or place pressure on a subject.\n- Centered symmetry can imply order, ritual, control, or entrapment.\n- Converging architecture can direct attention and amplify approach.\n- Telephoto layer compression can connect a subject emotionally to distant traffic, crowds, or lights.\n- Wide-angle separation can make distances and movement legible.\n\nState eye-line, lead room, headroom, screen direction, and important background reveal when continuity depends on them.\n\n## Camera movement by dramatic function\n\n| Movement | Observable instruction | Typical function |\n|---|---|---|\n| Pan / tilt | Rotate from a fixed camera position | reveal, follow, redirect attention |\n| Dolly in / push in | Translate toward subject | growing realization, pressure, commitment |\n| Dolly out / pull back | Translate away | isolation, context reveal, emotional withdrawal |\n| Truck / lateral track | Move sideways | compare layers, follow travel, reveal obstacles |\n| Follow / lead | Maintain relationship in front of or behind subject | momentum, companionship, pursuit |\n| Arc / orbit | Move around subject on a defined arc | changing allegiance, revelation, power shift |\n| Crane / jib | Change height and often distance | scale reveal, transition between human and environment |\n| Handheld | Operator-borne micro-movement with stated intensity | immediacy, instability, embodied observation |\n| Locked-off | No pan, tilt, translation, zoom, shake, or drift | tension, scrutiny, aftermath, contrast |\n| Zoom | Change focal length without camera translation | perceptual emphasis or stylized distance change |\n| Dolly zoom | Dolly and counter-zoom while holding subject size | spatial disorientation; use sparingly and specify direction |\n| Rack focus | Shift focus between named planes | transfer attention or reveal information; not camera movement |\n\nAvoid vague “dynamic camera.” Name the rig or physical behavior only when it affects motion: tripod, shoulder, gimbal, dolly, crane, vehicle mount, drone, or body-mounted.\n\n## Beat-bound motion grammar\n\nFor a continuous shot, define:\n\n1. **Start state:** exact position, angle, lens, framing, subject pose/action, and spatial anchor.\n2. **Trigger:** the action, line, glance, impact, or reveal that initiates camera motion.\n3. **Move:** path, direction, height change, speed and easing, stabilization character, and whether lens/focus changes.\n4. **Framing rule:** what the operator preserves or deliberately changes during the move.\n5. **End state:** exact final position, framing, new information, and hold duration or transition.\n\nWrite simultaneous relationships explicitly: “As the actor turns 180°, the camera rises from knee height to shoulder height, ending behind the actor.” Write later actions as separate beats.\n\n## Sequence continuity\n\n- Establish geography before rapid coverage unless disorientation is intentional.\n- Preserve the 180-degree axis, eye-lines, travel direction, prop hand, actor position, and light direction across cuts.\n- Cross the axis through visible camera movement, a neutral-on-axis shot, or an intentional rupture.\n- Vary shot size or angle enough to justify a cut; avoid near-identical jump cuts unless desired.\n- Give each cut a motivation: action, look, sound, information reveal, emotional reversal, or rhythmic punctuation.\n- Use contrast deliberately: moving to locked, wide to close, objective to subjective, stable to unstable.\n"}, {"name": "output-formats.md", "text": "# Output formats and checks\n\nChoose the smallest format that satisfies the request. Do not force headings or fields the user did not ask for.\n\n## Static shot / keyframe\n\nRecommended order inside the generation prompt:\n\n```text\n[Dramatic purpose]. [Camera side/height/angle/distance], [focal length and optical behavior], [shot size and composition]. [Subject action, pose, gaze, emotion]. [Foreground–subject–background relationship and spatial lines]. [Lighting/color/atmosphere only as relevant]. [Continuity and model-specific constraints].\n```\n\nBefore the prompt, optionally give one sentence explaining why the camera choice serves the beat.\n\n## Single moving shot\n\nUse compact technical metadata followed by chronological beats:\n\n```text\nSHOT INTENT: [one dramatic job]\nDURATION / FORMAT: [seconds, aspect ratio, frame rate if supplied]\nCAMERA BASELINE: [rig, lens, stabilization/motion character]\n\nSTART FRAME: [position, angle, distance, framing, subject and geography]\nBEAT 1 — [trigger]: [character action] ↔ [camera response], [speed/path], maintaining/changing [framing invariant].\nBEAT 2 — [trigger]: ...\nEND FRAME: [final geometry, framing, revealed information, hold or cut]\n\nCONTINUITY / LIMITS: [only essential identity, axis, physics, or exclusion constraints]\n```\n\nFor simple moves, collapse this into one paragraph. Use beat numbering when there are simultaneous events, direction changes, dialogue cues, transformations, or a precise end frame.\n\n## Multi-shot scene\n\nStart with a short visual strategy, then give a shot table or numbered list:\n\n| Shot | Dramatic job | Camera design | Action and timing | Transition / continuity |\n|---|---|---|---|---|\n| 1 | What changes for the viewer | angle, height, lens, size, move | subject beat + duration | cut motivation, axis, match |\n\nAfter the plan, provide generation-ready prompts per shot only if the user asked for them. Repeat locked character/environment facts only when the target model needs self-contained prompts; otherwise keep a shared continuity block.\n\n## Diagnosis format\n\nWhen reviewing an existing prompt, return:\n\n1. **Camera intent found:** what the shot appears to be trying to do.\n2. **Blocking issues:** only concrete ambiguities or contradictions.\n3. **Revised prompt:** preserve non-camera content and repair camera geometry/timing.\n4. **Optional alternate:** one meaningfully different solution, not cosmetic synonyms.\n\n## Conflict and feasibility check\n\nCheck each prompt for:\n\n- **State conflict:** locked-off plus pan/tilt/track/shake; static frame plus reframing; “camera holds” plus continued travel.\n- **Geometry conflict:** front and rear view at once; low and overhead at once; subject approaches while distance and scale stay fixed without matching camera motion.\n- **Optical conflict:** simultaneous focal lengths without a timed lens change; deep focus and extreme shallow focus on the same planes; telephoto compression claimed from an implausibly close position.\n- **Temporal conflict:** too many beats for duration; sequential events written as simultaneous; no trigger or endpoint; dialogue/action timing cannot fit.\n- **Continuity conflict:** unmotivated axis crossing, reversed travel, broken eye-line, changed prop side, reference identity drift, unexplained lighting direction change.\n- **Physical conflict:** impossible acceleration, collision path, camera passing through solids, floating rig behavior, massless impacts, absent settling/follow-through.\n- **Visibility conflict:** essential gesture outside frame, face required but occluded, reveal visible too early, focus target unavailable.\n- **Instruction priority:** decorative style clauses overwhelm the camera action; repeated negatives bury the positive target.\n\nRepair with the smallest change that preserves the user's dramatic goal.\n\n## Platform adaptation\n\nWhen a platform or model is named, retain the camera logic but adapt syntax, density, duration limits, reference notation, and negative-prompt strategy to that platform. Do not invent unsupported parameters. If platform syntax is unknown and browsing was not requested or available, provide a platform-neutral prompt and label it as such.\n"}], "cn": "AI电影镜头设计师"}, {"slug": "cinematic-shot-scheduler", "desc": "用于影视、短片、广告、MV、剧情片段等场景的 AIGC 分镜视频工作流。用户可上传一张参考图，或先生成一张影视场景图，再使用 Lib image 生成 16:9 十二宫格黑白电影故事板，最后仅使用 seedance 2.0 fast 或 seedance 2.0 根据原图和故事板生成视频。专门解决分镜图耗时、镜头规划不稳定、图生视频缺少电影调度的问题。\\\" version: 1", "body": "# 影视分镜到视频生成公式\n\n## Skill 定位\n\n只负责一件可复用的事：把一张影视参考图或一个影视场景想法，转化为可执行的电影故事板，再用故事板和原图生成视频，自动调度镜头执行。\n\n核心目标：\n\n- 降低用户制作分镜图的时间成本。\n- 自动把一个画面扩展成 12 个电影镜头。\n- 让故事板负责“镜头设计、运动方向、情绪、构图和调度”。\n- 让原图负责“角色、场景、光影、质感和视觉风格”。\n- 用 seedance 2.0 fast 或 seedance 2.0 生成与原图风格一致、镜头调度更清晰的视频。\n\n## 模型限制\n\n本 skill 只允许使用以下模型：\n\n```json\n{\n  \"image_model\": \"Lib image\",\n  \"video_models\": [\"seedance 2.0 fast\", \"seedance 2.0\"]\n}\n```\n\n模型选择规则：\n\n- 生图、故事板、参考图补全：只使用 `Lib image`。\n- 生视频：优先使用 `seedance 2.0 fast`；如果不可用，再使用 `seedance 2.0`。\n- 不使用其他图片模型。\n- 不使用其他视频模型。\n- 如果指定模型不可用，停止并告知用户，不要自动换成其他模型。\n\n## 输入\n\n用户可以提供以下任意一种输入：\n\n- 一张参考图：作为角色、场景、风格和光影锚点。\n- 一段文字场景：例如“雨夜巷子里，侦探追逐一个黑衣人”。\n- 一张参考图 + 一段文字：最佳输入方式。\n- 一个故事片段、广告概念、MV 场景、短剧桥段或影视情绪关键词。\n\n可选补充信息：\n\n- 类型：剧情片、悬疑、动作、爱情、喜剧、恐怖、广告、MV、纪录感等。\n- 情绪：紧张、浪漫、孤独、史诗、荒诞、温暖、压迫、迷幻等。\n- 视频时长：默认 8-12 秒；也可按 5 秒、10 秒、15 秒生成。\n- 画幅：默认 16:9。\n- 镜头强度：写实、电影感、手持感、动作感、梦境感、舞台感等。\n\n## 输入使用\n\n严格遵守：\n\n- 参考图中的主角、主要场景、时代感、服装、光线和视觉风格。\n- 故事板中的镜头顺序、景别变化、角色运动、摄影机运动和构图意图。\n- 用户明确指定的故事事件、动作和情绪。\n\n作为参考：\n\n- 用户没有明确说明的剧情背景。\n- 参考图之外不可见的角色关系。\n- 未提供的对白、音乐、音效和剪辑节奏。\n\n不要编造：\n\n- 用户没有提供的 IP、品牌、真实人物、电影名称或版权角色。\n- 参考图中不存在的关键角色身份。\n- 与原图风格冲突的新世界观。\n\n## 内部流程和 Knowhow\n\n### 1. scene_intake\n\n先判断用户输入属于哪种情况：\n\n```json\n{\n  \"has_reference_image\": true,\n  \"has_text_scene\": true,\n  \"needs_base_image\": false,\n  \"target_video_duration\": \"8-12s\",\n  \"aspect_ratio\": \"16:9\"\n}\n```\n\n如果用户只给文字，没有给图：\n\n1. 先用 `Lib image` 生成一张影视场景原图。\n2. 把这张图作为后续的 `Mixed 1` 原图参考。\n3. 再进入故事板生成。\n\n如果用户已经上传图：\n\n1. 直接把用户上传图作为 `Mixed 1`。\n2. 不重新设计角色和场景。\n3. 只根据用户文字补充镜头事件和情绪。\n\n### 2. base_image_prompt\n\n仅在用户没有上传参考图时使用。用 `Lib image` 生成一张原始影视场景图。\n\n输出一段适合 Lib image 的影视场景生图提示词，必须包含：\n\n- 主体人物或主体事件。\n- 场景空间。\n- 情绪和戏剧冲突。\n- 光线方向。\n- 镜头感。\n- 电影质感。\n- 16:9 画幅。\n\n避免一次生成复杂剧情，只生成一张能作为视觉锚点的关键帧。\n\n### 3. storyboard_prompt_builder\n\n根据 `Mixed 1` 原图和用户场景，重写一段给 `Lib image` 使用的故事板生图提示词。\n\n固定系统提示必须保留：\n\n```text\n为故事板创建一个分镜头，专注于情绪表达和分镜景别策划。使用参考图像作为角色。\n\n16:9 故事板表格，12 个电影风格面板。实际故事板绘图必须仅为黑白：粗糙的铅笔线条、最小细节、快速手势绘图能量、简单的解剖结构构建以及强烈的轮廓可读性。保持艺术作品轻量、动态且未完成，就像早期的编舞预览。\n\n使用电影艺术风格的摄影技巧，带有手持能量、快速平移、环绕运动、头顶镜头、侧面轮廓、侵略性特写、长焦压缩以及极端的负空间。\n\n标注颜色系统：\n红色箭头 = 身体运动\n蓝色箭头 = 摄影机运动\n绿色标记 = 取景 / 构图笔记\n橙色标记 = 灯光方向\n紫色标记 = 声音 / 情感强调\n黑色文本 = 简短镜头笔记和面板标签\n\n无时间戳。\n```\n\n故事板生图提示词模板：\n\n```text\n文本节点中的提示词生成出来的 12 宫格分镜黑白故事板。现在根据文本节点中的提示词结构，重新编写一段生图提示词，主要内容是创建一个影视场景。\n\n使用 @图片1 作为参考图像，保持角色、场景、时代感、服装、光影和视觉风格一致。\n\n故事事件：{用户场景或自动补全的影视事件}\n核心情绪：{情绪}\n镜头调度目标：用 12 个电影风格面板表现角色动作、摄影机运动、情绪推进、构图变化和光线方向。\n\n输出要求：\n16:9 故事板表格，12 个电影风格面板。实际故事板绘图仅为黑白粗糙铅笔线条，最小细节，快速手势绘图能量，简单解剖结构，强轮廓可读性。保留轻量、动态、未完成的早期编舞预览感。\n\n摄影技巧：\n手持能量、快速平移、环绕运动、头顶镜头、侧面轮廓、侵略性特写、长焦压缩、极端负空间。\n\n标注颜色系统：\n红色箭头 = 身体运动\n蓝色箭头 = 摄影机运动\n绿色标记 = 取景 / 构图笔记\n橙色标记 = 灯光方向\n紫色标记 = 声音 / 情感强调\n黑色文本 = 简短镜头笔记和面板标签\n\n无时间戳。\n```\n\n### 4. storyboard_generation\n\n使用 `Lib image` 生成 `Mixed 2` 故事板。\n\n故事板必须符合：\n\n- 16:9。\n- 12 宫格。\n- 黑白铅笔线条为主体。\n- 只允许标注箭头和文字使用指定颜色。\n- 每格都要有明确景别或摄影机意图。\n- 不能生成彩色成片画面。\n- 不能加时间戳。\n- 不能把故事板画成精细漫画、海报或成片截图。\n\n### 5. storyboard_interpreter\n\n读取生成的故事板，把 12 个面板整理成镜头计划。\n\n输出结构：\n\n```json\n{\n  \"panel_id\": 1,\n  \"shot_size\": \"wide / medium / close-up / extreme close-up / overhead\",\n  \"character_action\": \"\",\n  \"camera_motion\": \"\",\n  \"composition_note\": \"\",\n  \"lighting_note\": \"\",\n  \"emotion_or_sound_note\": \"\",\n  \"video_use\": \"primary / optional\"\n}\n```\n\n如果用户只需要一个短视频，不一定逐格生成 12 个片段。应该选择最有连续性的 3-6 个核心面板，用它们指导 seedance 生成一个完整视频。\n\n### 6. seedance_video_prompt_builder\n\n根据 `Mixed 1` 原图和 `Mixed 2` 故事板生成 seedance 视频提示词。\n\n基础提示词必须保留：\n\n```text\n参考 {{Mixed 2}} 的故事板，参考 {{Mixed 1}} 的画面，生成视觉风格一样的视频。\n```\n\n推荐扩展模板：\n\n```text\n参考 {{Mixed 2}} 的故事板，参考 {{Mixed 1}} 的画面，生成视觉风格一样的视频。\n\n保持 {{Mixed 1}} 中的角色、服装、场景、时代感、光线、色彩、镜头质感和整体美术风格。\n使用 {{Mixed 2}} 的 12 宫格故事板作为镜头调度参考：遵守角色运动方向、摄影机运动、景别变化、构图重心、灯光方向和情绪强调。\n\n视频内容：\n{用 1-3 句话概括故事事件}\n\n镜头语言：\n{从故事板提取 3-6 个关键镜头：开场、动作推进、情绪特写、空间关系、高潮动作、收束画面}\n\n运动要求：\n自然电影摄影机运动，避免突然变形，避免角色身份变化，避免场景跳变。动作要连续，光影要稳定，角色要和原图一致。\n\n风格要求：\ncinematic, live action, same visual style as reference image, coherent motion, dramatic composition, emotional performance, natural camera movement.\n```\n\n负面约束：\n\n```text\ndo not change character identity, do not change costume, do not change location, no extra characters unless storyboard shows them, no distorted face, no deformed hands, no broken body, no flicker, no sudden style change, no cartoon style, no storyboard lines in final video, no timestamps, no subtitles, no text overlay\n```\n\n### 7. video_generation\n\n使用视频模型生成视频：\n\n1. 优先使用 `seedance 2.0 fast`。\n2. 如果需要更高质量或 fast 不可用，使用 `seedance 2.0`。\n3. 输入必须包含 `Mixed 1` 原图和 `Mixed 2` 故事板。\n4. 不使用其他视频模型。\n\n如果生成结果不稳定：\n\n- 缩短视频时长。\n- 减少镜头事件。\n- 从故事板中选择 3-4 个关键面板生成单段视频。\n- 或拆成多个 3-5 秒片段后再拼接。\n\n## Prompt Guide\n\n### Lib image 故事板 prompt 判断标准\n\n好 prompt 应该：\n\n- 明确是“故事板”，不是成片图。\n- 明确 12 宫格、16:9、黑白铅笔线条。\n- 明确保留参考图角色和场景。\n- 明确电影镜头技巧。\n- 明确颜色标注系统。\n- 明确无时间戳。\n\n差 prompt 通常会：\n\n- 只说“生成分镜图”，没有镜头调度。\n- 没有要求黑白铅笔故事板。\n- 让画面过度精细或变成漫画。\n- 没有解释箭头和颜色标注。\n- 没有约束角色和场景一致性。\n\n### seedance prompt 判断标准\n\n好 prompt 应该：\n\n- 同时引用原图和故事板。\n- 明确原图负责视觉风格，故事板负责镜头调度。\n- 用 1-3 句话说明视频事件。\n- 提取 3-6 个核心镜头，不强迫模型完整执行 12 个面板。\n- 明确禁止角色、服装、场景和风格漂移。\n\n差 prompt 通常会：\n\n- 只说“参考故事板生成视频”，没有说明参考原图。\n- 要求一次执行太多镜头。\n- 没有约束角色一致性。\n- 把故事板线条、箭头、文字也带进最终视频。\n\n## 输出\n\n每次执行后输出：\n\n```markdown\n## Skill 执行摘要\n- 输入类型：\n- 使用模型：\n- 原图来源：\n- 故事板来源：\n- 视频模型：\n\n## 影视场景分析\n- 主体角色：\n- 场景空间：\n- 核心动作：\n- 核心情绪：\n- 视觉风格：\n\n## Lib image 故事板提示词\n输出完整故事板生图 prompt。\n\n## 12 宫格故事板镜头计划\n用表格输出 panel_id、景别、角色动作、摄影机运动、构图、灯光、情绪/声音强调。\n\n## seedance 2.0 视频提示词\n输出完整视频 prompt。\n\n## 生成建议\n- 建议时长：\n- 建议使用 seedance 2.0 fast 还是 seedance 2.0：\n- 是否建议拆段生成：\n- 需要用户确认的问题：\n```\n\n## 自检\n\n输出前检查：\n\n- 是否只使用 `Lib image`、`seedance 2.0 fast`、`seedance 2.0`。\n- 是否没有推荐或调用其他模型。\n- 故事板是否明确为 16:9、12 宫格、黑白铅笔线条。\n- 故事板是否保留彩色标注系统，但主体绘图仍为黑白。\n- 是否无时间戳。\n- seedance prompt 是否同时参考 `Mixed 1` 原图和 `Mixed 2` 故事板。\n- 是否清楚区分“原图控制风格”和“故事板控制镜头调度”。\n- 是否避免把故事板线条、箭头、文字带入最终视频。\n- 是否避免角色、服装、场景和时代感漂移。\n\n## Ask User\n\n只有以下情况需要追问：\n\n- 用户既没有上传图，也没有提供任何场景文字。\n- 用户要求生成明确 IP、真实影视作品角色、名人或受版权保护角色。\n- 用户想要很长视频，但没有说明剧情结构。\n- 用户要求的视频动作过于复杂，必须确认拆成多段生成。\n\n优先追问 1-3 个问题：\n\n1. 你想用上传图作为原图，还是先生成一张新的影视场景图？\n2. 这个片段的核心情绪是什么：紧张、浪漫、动作、悬疑、温暖、史诗，还是其他？\n3. 最终视频想要几秒，是否接受拆成多个片段再拼接？", "extras": [], "cn": "影视分镜自动调度镜头"}, {"slug": "cinematic-travel-video-producer", "desc": "模糊灵感直出电影级旅拍,海报文案成片一次性配齐", "body": "---\n\n## name: travel-vlog\\\\\n\nnamespace: industry\\\ntitle: \"唯美旅拍视频\"\\\ndescription: \"把模糊的旅拍主题/文案/散文/创意转译为电影级唯美旅拍视频——11 段暂停门管线：参数确认→角色三视图→创意+博主级旁白→纯音乐→写Spec+四段式prompt→动态时间轴分镜→自动切镜生成+QA评级→配音→海报企划→海报矩阵→宣发文案→合成质检。自足：视觉基因解构5条(6:3:1/旁白视觉化/真实场景锚点)、四段式视频prompt全文模板、纯音乐结构公式、三视图锁定词、海报prompt、四条质检红线。真实人物实拍风、竖/横屏、多15秒自动切镜单元。\"\\\nversion: 2\n\n# travel-vlog\n\n把用户任意模糊的旅拍主题/文案/散文/脚本创意，转译为 Flova 可执行的电影级唯美旅拍工作流。**真实人物实拍风（非动漫/CG）**，情绪正能量，多个 15 秒\"自动切镜单元\"拼成成片。作者：黄鑫波 / AIDIR 创作社区（出处披露）。\n\n> 本环境适配：text_to_instrumental(Suno 5/Mureka 8) / ElevenLabs v3 / Doubao 旁白 → `generate_audio`；Seedance 2.0/Fast → `generate_video_v3`；GPT Image 2 三视图/海报 → `generate_image_v3`；video_assembler → `composite_video`；Final_Video_Spec.md/text_editor → `write_file_v2`；multimodal_analyze → agent 自析；视频帧提取（尾帧作参考图）→ `generate_video_v3` 的 `reference_nodes` 引前段视频节点。ElevenLabs/Doubao 具体 Voice ID 列表 = `无该模型` 删，改 `ask_human` 音色卡（截代表句生成 3–5 个音色试听、用户耳选）。\n\n## 11 段管线（严格顺序，含 11 个强制暂停确认点，禁止跨越）\n\n 1. **输入解析 + 参数确认**〔暂停一〕：深度分析用户输入，提取地点/人物/情绪/风格/平台用途/是否有特定文案。`ask_human` 确认短片总时长、画幅比例、是否要旁白。**视频模型选择**：向用户提供两选项要求开始前明确选——Seedance 2.0（最高画质）/ Seedance 2.0 Fast（更快，预览/时间紧）；**所选模型记入 Spec，后续所有视频生成强制使用，不得擅自切换**。**检查上传图片是否为全身照**。咨询是否上传该目的地真实场景参考图。\n 2. **参考素材解构 + 三视图资产**〔暂停二〕：解构角色/场景参考图（如有），**自动补全下半身与鞋子设定**；`generate_image_v3` 出 16:9 角色全身三视图，**必须真实人物实拍风（photorealistic, real person, live-action style），严禁插画/动漫/卡通/任何非写实风格**。发用户确认。\n 3. **创意方向 + 旁白文案**〔暂停三〕：输出 3 个创意方向；按【博主级爆款文案法则】（5 段式、60% 押韵、100–520 字、正能量升华）提前生成独立旁白文案。确认创意方向与旁白具体字句。\n 4. **纯音乐（优先执行）**〔暂停四〕：`generate_audio`（text_to_instrumental，Suno 5，备选 Mureka 8）生成全片纯音乐。试听确认。\n 5. **写 Final_Video_Spec + 中文提示词构建**：`write_file_v2` 锁定片名/视频类型/画幅/总时长/视觉风格/输出语言/所选视频模型作全局锚；撰写极其详尽的所选模型四段式提示词（见下）。**强制红线：画面有台词必在台词后加 (无字幕)。**\n 6. **动态时间轴 + 弹性分镜表**〔暂停五〕：总片长拆成若干 15 秒\"自动切镜单元\"；执行**绝对节奏法则**（开头快切/中间铺垫/高潮密集/结尾舒缓）；标注每单元功能（开篇/铺垫/观察/转场/高潮/余韵）；**连贯性标记**：标明哪些相邻 15 秒素材属「场景延续」、哪些含「人物对白」；每个 15 秒四段式结构注册为所选模型的生成任务；把步骤2 素材绑定到元素中。确认分镜表。\n 7. **视频素材生成 + 工业级自检（核心循环）**〔暂停六〕：**连贯性提取——场景延续时必须从前一段视频截取视频帧（Video Frame）作后一段参考图**；**人声提取——有人声对白时必须从第一段含该人物对白的视频提取声音资产作后续该人物人声参考**；用所选模型输入【总提示词】自动切镜（一单元一次调用，**不拆碎**）；视频素材本身**无背景音乐**。**QA 评级**（后台自检五维度：①是否符合剧情 ②是否美观（构图/光影）③是否穿帮（逻辑/肢体）④是否含字幕 ⑤是否有音频瑕疵（杂音/断层）→综合评级→动作）：\n    - **【错误】**（穿帮/严重瑕疵/不符剧情）→ 系统后台直接废弃并**自动重新生成，严禁给用户看**。\n    - **【可用】**（无硬伤无穿帮，但美观/张力一般或有字幕）→ **必须暂停，发用户并主动咨询是否重新生成**。\n    - **【优秀】**（完美符合剧情、绝美、光影高级、无瑕疵）→ 直接保留发用户。\n    - 只把「可用」或「优秀」发用户最终确认。\n 8. **配音性别确认、试听与生成**〔暂停七〕：① 性别确认——先 `ask_human` 问男/女声，等明确回复才进下一步；② 引擎选择——默认 ElevenLabs v3，用户可切 Doubao（原生中文音色）；③ 试听对比——从旁白截 10–20 字代表句，按所选性别从音色卡挑 3–5 个音色各生成一条试听片段，同时发用户播放对比，**用户用耳朵选，无需查任何 ID**；④ 用户选定后完整生成全篇。**全片所有旁白片段严格锁定同一音色，严禁中途切换。**\n 9. **海报封面企划与信息收集**〔暂停八〕：提供 3–5 个电影感片名备选（应用 18 种爆款标题法则）+ 金句；问是否展示团队信息与 LOGO。确认。\n10. **电影级海报封面矩阵生成**〔暂停九〕：`generate_image_v3` 生成主画幅封面（暂停确认）→ 确认后以主封面为垫图（Image-to-Image）裂变生成 4:3 与 3:4 尺寸。\n11. **全矩阵自媒体宣发文案 + 时间线合成质检**：按【18 种爆款标题法则】+【5 段式】写抖音/视频号/小红书发布文案；`composite_video` 将视频+纯音乐+配音在时间线对齐合成，执行严格音频避让（Ducking），打包交付。\n\n## 绝对禁止（7 条）\n\n① 禁直接用不完整参考图生成视频，必先重绘标准三视图；② 禁把 15 秒内分镜拆开单独生成，必用一段【总提示词】让所选模型自动切镜；③ 禁任何一个 15 秒片段只有 2–3 个分镜；④ 禁输出负面情绪的直接表达；⑤ 禁在有台词的提示词中遗漏 (无字幕) 标记；⑥ 禁把评级【错误】的素材发给用户看，必须后台自行重做；⑦ 禁在场景延续片段中丢失环境一致性，必须提取前一帧作参考。\n\n## 视觉基因解构（multimodal，5 条）\n\n1. **全身人物与服装解构**：提取从头到脚的完整特征，缺失必须脑补。\n2. **光影与色彩解构**：提取主光源、光质、色彩比例（**6:3:1**）。\n3. **动态与声景潜力分析**：提取视觉动态与听觉声景。\n4. **旁白视觉化解构**：将抽象文字转译为时间、空间、感官、动作等可拍摄元素。\n5. **真实场景锚点解构**：若用户上传真实场景参考图，必须精准提取其地标特征、植被类型、建筑风格与气候特征，确保后续生成环境不脱离现实地理（真实场景参考图 = 环境生成的**绝对锚点**）。\n\n## 博主级爆款旁白文案法则\n\n分镜身份：首席 Seedance 自动切镜视效导演 + 千万级生活方式博主。\n\n1. **字数与押韵**：100–520 字，至少 **60% 押韵**。\n2. **人设与情绪**：第一人称，积极向上，正能量。\n3. **5 段式爆款结构**：引言/开场 Hook（悬念/金句）→ 故事 Story（细节+感官语言）→ 情感共鸣 Emotion（表达感受）→ 思考与启发 Reflection（哲理）→ 结尾号召 CTA（鼓励行动）。\n\n## 弹性节奏与绝对镜头数法则\n\n- **绝对镜头数**：开篇 10–15 镜 / 铺垫 5–8 / 高潮 15–25 / 余韵 5–8，**严禁少于 5 镜**。\n- **旅拍镜头类型与招牌高光库（全片级资源库）**：必须镜头（奔跑、空镜、看风景、情绪）+ 招牌镜头（张臂奔跑、转圈飞裙、花海穿梭、逆光回眸、大景小人），按全片统筹使用，不强求每个 15 秒单元填满。\n- **连贯性与对白规划**（分镜脚本必须明确标注）：`[场景延续标记]`（与上一单元同一时空 → 标注\"需提取上一段尾帧作为参考\"）；`[对白标记]`（该单元含人物开口说话 → 标注确切台词）。\n\n## 视频素材生成进阶规则（连贯性与声音资产）\n\n1. **场景延续与参考帧提取**：前后段场景延续时，必须在前段视频截取视频帧作后段生成参考图，保证场景与人物绝对连贯（`generate_video_v3` 用 `reference_nodes` 引前段视频节点）。\n2. **人声对白一致性提取**：整条视频有人声对白时，必须在第一段含该人物对白的视频提取声音资产，作后续该人物所有对白的人声参考，确保音色绝对统一。\n3. 核心逻辑：全程严格沿用用户在阶段一确认的模型，两模型使用方式完全相同，不得擅自切换；视频素材本身无 BGM。\n\n## 三视图生成规则（GPT Image 2）\n\n`generate_image_v3`（ImageToImage，2K），生成 16:9 横版角色全身三视图（正面/侧面/背面并排）。**风格铁律：必须真实人物实拍风（photorealistic, real person, live-action photography style），严禁插画/动漫/CG 渲染/任何非写实风格。** 提示词须明确写入：真实照片质感、真实人物、写实摄影、非动漫、非插画、非 CG；负向约束 `no illustration, no anime, no cartoon, no CGI, no digital art, no painting`。**排版指令**：16:9 横版，角色正面/侧面/背面三图**等宽并排**，纯净中性背景，全身完整可见。参考原图提取人物特征时精准还原肤色、发型、服装材质与细节，自动补全下半身与鞋子。\n\n## 纯音乐生成规则（text_to_instrumental / Suno 5）\n\n`generate_audio`，模型 Suno 5（失败切 Mureka 8）。节奏强制对齐（渐起-高潮-舒缓），**严禁歌词人声**。提示词**严禁出现知名音乐人姓名**（防模型拦截）。\\\n**结构公式**：`[音乐流派] + [主导乐器] + [辅助乐器] + [自然声景融合] + [动态节奏曲线] + [情绪基调] + [负向约束]`。\\\n**负向约束**：`no vocals, no lyrics, no singing, no rap, no narration`。\n\n## 视频提示词生成规则（Seedance 2.0 四段式标准模板）\n\n**语言最高优先级**：用户输入中文 → 所有图片 Prompt 与视频 Prompt 用中文书写；音乐 Prompt 以中文为主，允许保留必要英文模型名/英文乐器名/英文负向标签。\\\n**【最高红线】：画面有台词，必须在每段台词后强制加 (无字幕)！**\n\n```\n## 统一人物设定\n**人物**：[参考图说明]，[发型与妆容]，[情绪状态]；穿搭参考[全身描述]，肩背/手持[道具]，沐浴在[光影状态]中。\n\n## 统一风格设定\n**风格**：唯美旅拍电影感，[光照条件]，[运镜风格]，胶片质感；全段进入[核心光影时刻]，以[主色调]为主调；不要过度磨皮，不要塑料感。\n**场景参考锚点**：[若有真实场景参考图或上一帧提取图，在此声明严格参考该图的环境结构]。\n\n## 单元功能\n本15秒素材单元在全片中的功能是：[开篇代入/环境铺垫/转场连接/高潮强化/结尾余韵]。\n\n## 分镜脚本\n[00:00.0]｜第1镜（[时长]s）：[机位景别] + [运镜]，[画面详细描述]。\n...（根据弹性节奏法则决定镜头数，总时长拼凑在15秒内）...\n\n## 总提示词\n[人物全身外观综合描述]，[气质描述]；[场景核心元素词汇连缀，强调真实感或连贯性]，唯美旅拍电影感，[光照与镜头质感描述]，[核心动作序列浓缩，禁止向左奔跑]。\n**[环境音与对白描述]**：[如果有台词，必须写为 `{台词内容}(无字幕)`，例如：`{你好，大理}(无字幕)`。允许适当的欢笑声]。\n不过度磨皮，不要塑料感，无字幕，无水印，无背景音乐。\n```\n\n## 海报封面提示词规则（GPT Image 2）\n\n明确指出\"留出大面积干净的负空间\"。强制模型印上用户确认的片名、金句与团队信息。海报矩阵：主封面确认后作垫图裂变 4:3 与 3:4。\n\n## 宣发文案规则\n\n标题必须从【18 种爆款标题法则】中选择（如引发好奇/提供实用方案/代入感共鸣/利用数据等）；文案严格 5 段式（引言-故事-共鸣-启发-号召），字数 100–520 字，60% 押韵。\n\n## 时间线合成与质检（video_assembler → `composite_video`）\n\n- **多轨合成**：视频轨 V1（顺序拼接所选模型生成的 15 秒片段）；音乐轨 A1（纯音乐）；配音轨 A2（旁白，音量最高约 **-3dB**）。\n- **音频避让（Ducking）**：旁白发声时音乐轨自动压低约 **6–8dB**，旁白停顿时缓慢恢复。（在 `composite_video` 用 audioList 各轨 `decibel` 表达。）\n- **全局最终质检四红线**：① **画面红线**——绝对禁止手部畸形、半身截断等明显错误；② **连贯性红线**——检查场景延续片段是否成功用前一帧作参考、有无突兀场景跳跃；③ **人声红线**——检查人物对白音色是否与第一段提取的人声参考绝对一致；④ **旁白对齐质检**——检查旁白每一句是否能在画面找到对应视觉意象，且未被音乐遮盖。\n\n## 相关（边界·非依赖，改道劝退）\n\n美食美学短片 → food-cinematic；移轴微缩短片 → miniature-world；萌宠拟人打工 → pet-worker-vlog。", "extras": [], "cn": "电影感唯美旅拍片"}, {"slug": "cinematic-travel-vlog-maker", "desc": "把旅行地点、人物参考、场景参考和文案，做成有真实场景锚点、人物连续性、原生音效、BGM 与旁白节奏的电影感旅拍短片。\\\" version: 2", "body": "# 电影感旅拍大师\n\n## Skill 定位\n\n这是根目录主 Skill，只负责路由、分配、门禁，不承载全部创作细节。\n\n执行时必须按这个顺序工作：\n\n1. 先判断用户当前要解决哪一类问题。\n2. 按“主路由表”读取一个或多个精确的子 Agent 文件；不要自行猜测文件名。\n3. 子 Skill 再按它自己的“必读技能参考”读取精确的规则文件。\n4. 产出后读取或使用 `agents/sub-agent-travel-quality-reviewer.md` 做质检。\n5. 质检不通过时，回到本轮已经读取过的精确子 Agent 文件修订，最多循环 3 次。\n\n不要只停留在主 Skill；凡是进入具体创作、资产、提示词或交付，都必须读取“主路由表”列出的精确子 Agent 文件。`subskills/` 里的文件是规则参考，不是子 Agent 入口；除非子 Agent 点名某个精确文件，不要直接把 guide 文件当入口。\n\n## 输入\n\n用户可能提供：\n\n- 目的地、旅行主题、短片用途、视频比例、视频时长、平台。\n- 人物参考图、角色图、三视图、半身照。\n- 真实场景参考图、场景资产需求、道具资产需求。\n- 故事、散文、旅行笔记、原著片段、旁白文案。\n- 想使用的视频生成模型、BGM 生成模型、配音生成模型、分辨率、视频提示词需求。\n- 封面、标题、金句、平台宣发需求。\n\n硬性规则必须保留并传递给所有子 Skill。\n\n## 主路由\n\n按用户最新消息选择一个或多个子 Skill。每次路由时，只能读取下表中的精确文件名，并把用户需求、已有素材、硬性规则和当前阶段一起传给该文件。\n\n用户意图必须先读取的子 Skill 文件完整旅拍、从主题一路做成片、项目推进`agents/sub-agent-travel-production-controller.md`故事、散文、旅行笔记、原著片段、旁白、剧本改编`agents/sub-agent-story-script-director.md`人物图、角色资产、三视图、半身、人物一致`agents/sub-agent-character-asset-director.md`Seedance、Seedance2.0、fast、mini、15 秒视频提示词`agents/sub-agent-seedance-prompt-engineer.md`检查、自检、是否合格、不满意、重新生成、评估资产或提示词`agents/sub-agent-travel-quality-reviewer.md`封面、标题、宣发、小红书、抖音、视频号、交付`agents/sub-agent-travel-delivery-archivist.md`\n\n### 1. 完整旅拍流程\n\n当用户要“从主题一路做成片 / 完整旅拍 / 旅行大片 / 旅拍流程 / 项目推进”时：\n\n先读取 `agents/sub-agent-travel-production-controller.md`。\n\n这个子 Skill 负责阶段规划、生成门禁、用户确认和省积分顺序。\n\n### 2. 故事和剧本\n\n当用户给出故事、散文、旅行笔记、原著片段、旁白文案，或要求“更有情绪 / 改成视频 / 忠实原文 / 不要魔改 / 转成剧本”时：\n\n先读取 `agents/sub-agent-story-script-director.md`。\n\n这个子 Skill 负责自由改编、忠实剧本化、旁白和情绪曲线。\n\n### 3. 角色资产\n\n当用户上传人物图，或提到“角色资产 / 三视图 / 半身 / 人物一致 / 角色连续性”时：\n\n先读取 `agents/sub-agent-character-asset-director.md`。\n\n这个子 Skill 负责判断用户图是否可直接作为角色资产；如果需要生成角色资产，必须使用固定角色资产提示词；资产生成后必须评估是否合格，不合格或有风险时先问用户是否重新生成。\n\n### 4. Seedance2.0 系列提示词\n\n当用户提到“Seedance / Seedance2.0 / fast / mini / 提示词 / 15秒 / 分镜提示词 / 视频生成提示词”时：\n\n先读取 `agents/sub-agent-seedance-prompt-engineer.md`。\n\n这个子 Skill 负责让用户选择 Seedance2.0 系列具体模型和分辨率，并按固定格式写完整提示词。\n\n### 5. 质检和返工\n\n当用户要求“检查 / 自检 / 是否合格 / 不满意 / 重新生成 / 评估资产 / 评估提示词”，或任一阶段产出完成后：\n\n读取 `agents/sub-agent-travel-quality-reviewer.md`。\n\n这个子 Skill 负责阶段质检、连续性检查、生成门禁和最多 3 次返工循环。\n\n### 6. 封面、宣发和交付\n\n当用户提到“封面 / 标题 / 小红书 / 抖音 / 视频号 / 宣发 / 交付 / 归档”时：\n\n读取 `agents/sub-agent-travel-delivery-archivist.md`。\n\n这个子 Skill 负责整理最终方案、提示词、封面标题、平台文案和交付清单。\n\n## 执行顺序\n\n如果多个阶段同时匹配，除非用户明确要求后置阶段，否则从最早缺失的前置阶段开始：\n\n```text\n需求简报\n→ 故事/旁白/剧本\n→ 角色资产判断或生成\n→ 真实场景参考判断或场景图生成\n→ 时间轴和素材单元规划\n→ Seedance2.0 系列模型与分辨率选择\n→ 视频提示词逐条生成\n→ 质检\n→ 用户确认后再生成图片或视频\n→ 封面宣发\n→ 交付\n```\n\n## 生成门禁\n\n图片和视频会消耗积分。进入图片或视频生成前，必须满足：\n\n- 已询问并确认视频比例；用户未选择时，默认 16:9。可选比例为 16:9、9:16、21:9、3:4、4:3、1:1。\n- 已询问并确认视频时长。\n- 已询问并确认视频生成调用模型。\n- 剧本、旁白或视觉叙事已通过质检。\n- 角色资产已判定可用；如果新生成了角色资产，已完成生成后评估。\n- 涉及真实场景时，已询问用户是否上传场景参考图；如果用户不上传，必须先生成场景图并完成质量评估，不得直接进入视频生成。\n- 场景图必须具备电影级灯光设计、丰富色彩、清楚光影层次、纯净稳定的画面质感；不合格时先返工或询问用户。\n- 时间轴和每个素材单元功能已经清楚。\n- 视频提示词已经按目标模型格式写完并通过自检。\n- 视频素材生成时必须开启视频音频生成，让环境声、脚步、风声、水声、衣料摩擦等音效随画面一起生成；视频素材里仍然禁止生成 BGM。\n- 合成视频之前必须已生成 BGM，并且已让用户手动选择 BGM 生成模型；不得默认模型直接生成。\n- 如需旁白，必须先让用户选择配音生成模型，再完成音色设计提示词；音色提示词必须按“职业 + 人物特征 + 声音特征 + 语速”写得足够详细，让旁白有情绪起伏、停顿和语速变化。\n- 用户已经确认继续生成，或用户当前请求明确就是生成。\n\n角色资产不合格或有风险时，不要继续生成视频；先提醒用户具体问题，并询问是否重新生成或接受当前资产继续。\n\n## 质检循环\n\n每个阶段都执行：\n\n```text\n生产 → 质检 → 修订 → 再质检 → 通过 → 下一阶段\n```\n\n质检失败时返回本轮已读取的精确子 Agent 文件修订，最多循环 3 次。第 3 次仍不通过时，停止推进，向用户说明卡点、风险和需要确认的信息。\n\n## 输出\n\n根据当前阶段输出：\n\n- 项目进度检测。\n- 已读取并执行的子 Skill。\n- 当前阶段产物。\n- 质检结论。\n- 下一步建议。\n- 需要用户确认的问题。\n\n## 自检\n\n输出前检查：\n\n- 是否已经读取主路由表中的精确子 Agent 文件，而不是只根据主 Skill 直接创作？\n- 子 Skill 是否按“必读技能参考”读取了精确的规则文件？\n- 是否先剧本和提示词，后图片和视频生成？\n- 是否已经询问用户视频比例、视频时长、视频生成模型；视频比例未选时是否按 16:9 默认？\n- 是否已经询问 BGM 生成模型，并在合成前生成 BGM？\n- 需要旁白时，是否已经询问配音生成模型，并完成职业、人物特征、声音特征、语速组成的详细音色设计？\n- 涉及真实场景时，是否已询问场景参考图；用户未提供时是否先生成并评估场景图？\n- 视频素材生成时是否明确开启视频音频生成，并禁止在素材里生成 BGM？\n- 是否把用户硬性规则传给后续子 Skill？\n- 是否完成质检；不通过时是否最多循环 3 次？\n- 涉及角色资产时，是否完成“可直接用 / 需生成 / 生成后合格性”的判断？\n- 涉及 Seedance2.0 系列提示词时，是否让用户选择模型和分辨率？\n\n## Ask User\n\n以下情况必须问用户：\n\n- 缺少会改变成片方向的目的地、人物、用途、是否旁白。\n- 视频比例未选择时，询问用户在 16:9、9:16、21:9、3:4、4:3、1:1 中选择；用户不选时默认 16:9。\n- 视频时长未选择时，必须询问。\n- 视频生成模型未选择时，必须询问；如果是 Seedance2.0 系列，再让用户选择 Seedance2.0、Seedance2.0 fast、Seedance2.0 mini 或其他兼容模型。\n- BGM 生成模型未选择时，必须询问；不能默认模型直接生成 BGM。\n- 需要旁白但配音生成模型未选择时，必须询问；不能默认模型直接生成配音。\n- 需要旁白时，必须先给出详细音色设计提示词，等待用户确认或调整后再生成。\n- 涉及真实场景时，必须询问用户是否上传场景参考图；用户不上传时，先生成场景图并评估。\n- 分辨率未选择时，可以说明将按 720p 继续。\n- 角色资产生成后不合格或有风险，需要用户决定是否重新生成。\n- 用户给的故事/原文不清楚是自由改编还是忠实剧本化。", "extras": [], "cn": "旅拍大师"}, {"slug": "cinematic-vfx-creator", "desc": "一句话生成角色人物影视特效支持文字参考图/视频", "body": "# 角色战斗场景特效视频生成\n\n## 核心方法论\n\n### 1. 叙事驱动的分镜架构\n\n分镜是**单个视频内的时间叙事结构**，不是多个独立视频文件的集合。每个分镜是服务于整体故事弧的时间段：\n\n- **SB-01 建立镜头**：0-25% 时长 → 场景/氛围建立\n- **SB-02 冲突蓄力**：25-50% 时长 → 角色亮相，能量积累\n- **SB-03 高潮交锋**：50-75% 时长 → 核心战斗序列，特效密集\n- **SB-04 终结画面**：75-100% 时长 → 终极招式，环境破坏，英雄定格\n\n每个分镜必须：\n\n1. **推进叙事动能**（不得静态重复）\n2. **递进视觉强度**（特效复杂度逐镜提升）\n3. **保持空间/角色连续性**（镜头角度与位置符合电影逻辑）\n\n---\n\n### 2. 元素色彩语义体系\n\n技能特效必须绑定明确的色彩-属性映射，不同元素类型遵循固定的视觉语言：\n\n元素属性核心色彩情绪关键词粒子形态火系烈红/橙金/炽白热烈、爆裂、威猛火焰团、爆炸光晕、热浪扭曲冰系冰蓝/青白/霜白冷冽、凝结、锐利冰晶折射、霜花扩散、寒雾弥漫雷系黑紫/深蓝/白电迅猛、暴烈、撕裂树根状电弧、静电粒子、电光闪链暗影系紫黑/暗红/血色诡异、吞噬、压迫黑雾翻涌、血色烟尘、暗影触须神圣系金白/淡青/圣光耀眼、神圣、净化光羽飘散、圣光柱、体积光扩散自然系翠绿/木棕/金黄生机、蔓延、缠绕藤蔓缠绕、叶片旋舞、花粉光点\n\n**应用规则**：\n\n- 技能色彩必须与角色服装/武器形成**高对比**或**高融合**二选一\n- 同一技能最多使用 2 种主色调，避免色彩混乱\n- 场景环境色调应反衬技能色彩（冰系技能搭配暗调场景，火系技能搭配冷灰场景）\n- 色彩一旦确定全程保持一致，不得中途变更\n\n---\n\n### 3. 角色战斗类型分析\n\n收到角色输入后，执行**战斗角色分类**：\n\n- **敏捷型**：链式武器、杂技动作 → 重点：运动轨迹、残影、速度线\n- **力量型**：重甲、震地打击 → 重点：冲击坑、冲击波涟漪、碎石飞溅\n- **法术型**：能量构造、召唤仪式 → 重点：粒子密度、发光强度、体积光\n\n**跨类型交互规则**：\n\n- 敏捷 vs 力量 → 速度线与冲击波碰撞\n- 法术 vs 敏捷 → 法术弹幕 vs 闪避残影\n- 力量 vs 法术 → 物理打击击碎能量屏障\n\n---\n\n### 4. 四层提示词构建体系\n\n每个战斗视频提示词必须包含四个层级，缺一不可：\n\n**① 风格质量声明层**（10-15% 篇幅）\\\n定义渲染标准、整体风格、色调情绪基调。\\\n3D国漫玄幻风格 + 虚幻引擎5极致画质 + \\[色调:暗黑/明亮/冷峻\\] + 电影级\\[质感词:写实/史诗/梦幻\\] 必含：渲染引擎名、色调定性词、质感定性词、对比度描述 示例：\"次世代国漫3D，虚幻引擎5渲染，暗黑史诗风，冷调高级质感，全局光照+动态模糊+景深，60fps流畅度\"\n\n**② 运镜系统层**（15-20% 篇幅）\\\n定义镜头运动逻辑、切换节奏、视角变化规律。\\\n分镜节奏公式：\\[蓄力段(稳定慢推)\\] → \\[爆发段(快速切换)\\] → \\[余韵段(缓慢拉远)\\] 运镜语法：推(push in)/拉(pull out)/跟(follow)/环绕(orbit)/仰拍(low angle)/俯拍(high angle) 切换强度：缓慢融合(淡入淡出) vs 快速跳切(硬切) vs 爆点闪白切换 示例：\"开场极近特写慢推至全身，蓄力段低角度跟拍，爆发瞬间快速跳切至正面碰撞近景，终结段俯拍缓慢拉远定格\"\n\n**③ 核心画面层**（50-60% 篇幅，最关键）\\\n采用**微进式时序叙事**——将动作拆解为 0.5-1 秒粒度的连续画面描述。\n\n核心原则：\n\n- **动词密度法则**：每个动作必须用强动词（轰然/迸发/炸裂/席卷/冲破），拒绝弱动词（出现/显示/发生）\n- **感官叠加法则**：视觉+听觉+动势同时描述（\"震耳咆哮+冲击波轰然炸裂+地面龟裂扩散\"）\n- **尺度对比法则**：通过大小对比制造压迫感（\"渺小人影 vs 巨型能量球\"）\n- **VFX绑定法则**：特效必须附着于动作（\"獠牙**迸发**紫色火焰\" 而非 \"紫色火焰出现\"）\n\n时序拆解模板：\\\n\\[Initial state\\] → \\[Trigger action\\] → \\[Environmental response\\] → \\[Effect cascade\\] → \\[Climax beat\\] → \\[Resolution pose\\]\n\n示例（0.5秒粒度）： 0.0-0.5s: 角色摆出施法姿势，双手结印 0.5-1.0s: 掌心开始发光，眼瞳迸射元素光芒 1.0-2.0s: 地面符文阵列依次激活（螺旋扩散） 2.0-3.0s: 能量柱从符文中心轰然升起 3.0-4.0s: 技能形态在能量柱内凝聚成形 4.0-5.0s: 技能爆发冲出，能量柱炸裂成粒子\n\n**④ 技术细节强化层**（10-15% 篇幅）\\\n用材质、粒子、物理反馈细节拉满真实感。\\\n粒子细节：冰晶折射光线/火花四溅轨迹/烟尘翻涌体积感/静电游丝缠绕 材质细节：冰面反光镜面质感/金属划痕锈迹/布料褶皱飘动/皮肤毛孔纹理 物理反馈：地面龟裂/碎石飞溅/热浪扭曲空气/冲击波涟漪扩散 氛围压迫感：空气凝结感/尘埃悬浮体积光/低频震动嗡鸣感\n\n---\n\n### 5. 专业动画冲击帧技法（可视化描述体系）\n\n传统数值型指令（如\"亮度246/255\"）AI 模型无法精确执行，必须转换为**画面内发生的可视化动作描述**。\n\n**闪白帧（白屏爆闪）—— 场景爆点转场**用途：能量爆发瞬间 / 冲锋转交锋 / 终极大招释放\\\n基础版：\"画面爆闪至纯白，如雷击般刺目，瞬间切回战斗场景\" 强化版：\"全屏白色强光瞬间吞没画面，冲击波从中心向外高速环状扩散，带起漫天飞尘与碎石，强光消退后场景骤然切入\" 震屏版：\"爆炸瞬间画面爆白，摄像机剧烈震动，震幅先大后小，持续0.3秒后缓慢恢复稳定\"\n\n**黑白帧（去色帧）—— 蓄力与余韵**用途：技能蓄力压迫感 / 斩杀定格余韵 / 暴风雨前的宁静\\\n去色蓄力：\"画面色彩骤然褪尽如墨染，仅剩明暗轮廓，元素电弧在黑白画面中格外锐利\" 斩杀定格：\"斩击瞬间画面凝固为黑白慢镜，碎石与尘埃悬浮空中如时间静止，仅角色眼瞳残留一点幽光\" 蓄力渐变：\"画面色彩如潮水般缓缓退去，世界逐渐褪色为冷灰黑白，暴风雨前的死寂压迫感弥漫\"\n\n**冲击帧（画面剧变帧）—— 撞击与能量爆发**用途：拳拳到肉的碰撞 / 能量球爆炸 / 武器交锋\\\n单次撞击：\"两力相撞瞬间爆出耀眼白光，冲击波环状向外炸裂扩散，地面龟裂，飞尘横飞\" 能量二次爆发：\"能量在碰撞点积压到极限，轰然二次爆发，画面边缘出现强烈镜头畸变，火花如雨四溅\" 高频连打：\"每一击落下画面猛烈一震，闪光与爆裂声此起彼伏，节奏如战鼓密集擂响\"\n\n**震屏效果分级**轻震：摄像机轻微颤抖，如远处爆炸的余震，持续0.2秒后自然恢复 中震：爆炸瞬间摄像机猛烈震动，震幅先大后小，持续0.3秒后缓慢稳定 重震：冲击波正面命中，摄像机剧烈抖动如地震，画面边缘出现运动模糊，0.5秒内逐步恢复 极震：终极大招爆发，摄像机震动到极限，画面短暂失焦+边缘畸变，震动持续0.8秒后如余震般缓缓平息\n\n**完整冲击节奏模板（可直接复用**）蓄力段：画面色彩如潮水缓缓退去，褪为冷灰黑白，世界陷入死寂压迫； 爆发点：全屏白色强光瞬间吞没画面，冲击波从中心向外高速环状扩散，带起漫天飞尘与碎石，摄像机剧烈震动先大后小持续0.3秒； 冲击连打：每一击落下画面猛烈一震，爆出耀眼白光与冲击波涟漪，能量在碰撞点二次爆发，镜头畸变+火花四溅，节奏如战鼓密集； 余韵定格：斩击后画面凝固为黑白慢镜，碎石悬浮如时间静止，色彩如潮水缓缓回涌，残留粒子在体积光中飘散消逝。\n\n---\n\n## 工作流程\n\n### 第一步：准备阶段（全部完成才可进入第二步）\n\n**需求挖掘前置交互机制（强制，准备阶段第一步）：**\n\n用户激活 Skill 后，第一件事不是直接收集参数，而是先通过专业提问\\\n挖掘用户的真实创作意图。用户往往无法准确描述特效风格，需要 Agent\\\n用专业知识引导用户表达。\n\n触发条件：\n\n- 用户描述模糊（如\"两个女的打斗，很华丽\"）\n- 用户只说了角色/场景，没有说特效风格\n- 用户没有明确的技能/招式概念\n- 用户表达中缺少风格、元素、节奏等关键信息\n\n禁止行为：\n\n- 收到模糊需求后直接套用默认模板生成 ❌\n- 不经引导直接进入参数收集清单 ❌\n- 用千篇一律的\"玄幻3D史诗风\"填充所有需求 ❌\n\n正确执行流程：\n\nSTEP 1 — 风格定向提问（单次 ask_human，多个维度）\n\n根据用户需求，从以下维度中选择 3-4 个最相关的提问：\n\n【画风维度】\n\n- 偏写实（真人质感/超写实建模）还是偏二次元（国漫/日漫/3D卡通）？\n- 色调偏暗黑压抑还是明亮华丽？\n\n【特效风格维度】\n\n- 有没有喜欢的游戏/动漫技能参考？\\\n  （如：鬼灭之刃的呼吸技、火影的查克拉术、原神的元素爆发、\\\n  崩坏的终结技、王者荣耀的大招特效等）\n- 偏向哪种元素属性？\\\n  （火/冰/雷/暗影/神圣/自然/阴阳/机械/血系等）\n- 特效风格偏「写意飘逸」（如仙侠飘带剑气）还是「硬核爆炸」\\\n  （如冲击波震地炸裂）？\n\n【动作风格维度】\n\n- 偏向哪种战斗节奏？\\\n  （快速凌厉连击 / 蓄力一击必杀 / 优雅流动舞步式 / 野蛮\\*\\*压制）\n- 角色战斗风格偏哪种？\\\n  （剑客/刺客/法师/武者/召唤师/枪手）\n\n【叙事节奏维度】\n\n- 想要有完整故事感（建立→蓄力→爆发→收束）\\\n  还是直接上高潮特效展示？\n- 有没有想复刻的具体场景或镜头感觉？\\\n  （如某部电影/动漫的某一幕）\n\nSTEP 2 — 整合用户回答，生成个性化创作方案\n\n根据用户的回答，Agent 需要：\n\n1. 用专业语言将用户描述转化为具体的视觉方案\n2. 主动提出 1-2 个创意建议（基于用户偏好延伸）\n3. 向用户说明将要呈现的效果，例如：\n\n示例回复：\\\n\"根据您的偏好，我为您设计了以下方案：\n\n- 风格：国漫3D写实，暗金色调\n- 技能特效：参考原神雷元素爆发风格，紫金雷电+冲击波涟漪\n- 战斗节奏：快速凌厉连击，每击带残影，终结一击蓄力爆发\n- 叙事结构：建立对峙→连击缠斗→终结大招→英雄定格\\\n  您觉得这个方向如何？有需要调整的地方吗？\"\n\nSTEP 3 — 用户确认创作方向后，进入准备阶段参数收集\n\n用户对创作方向满意后，才进入6项参数收集清单。\n\n注意事项：\n\n- 每次提问聚焦 3-4 个维度，不要一次抛出所有问题\n- 用具体的参考案例引导（游戏技能名/动漫招式名），\\\n  而非抽象的\"您想要什么风格\"\n- Agent 要主动给出选项和建议，降低用户的表达门槛\n- 根据用户每一条回答实时调整后续提问方向，\\\n  而非机械走完所有问题\n- 最终生成的脚本必须体现用户的个性化偏好，\\\n  禁止套用通用模板\n\n🔴 阶段推进门控（强制阻塞规则）\n\n以下项目必须**全部经用户明确回答**后，才能进入第二步分镜设计：\n\n#检查项说明1角色资产参考图已上传 OR AI生成三视图已经用户确认2画面比例1:1 / 16:9 / 9:163画面分辨率480p / 720p / 1080p4场景偏好用户指定描述 OR 交由AI设计5视频时长10s / 15s / 20s / 30s / 60s6特效强度轻微 / 中等 / 极致\n\n**禁止行为**：\n\n- 分辨率确认后直接进入生成 ❌\n- 将需求描述中的隐含信息视为已确认 ❌\n- 任何未被用户明确回答的项，禁止推断替代，必须通过 ask_human 补全 ❌\n\n🔴 角色资产处理规则（强制）\n\nIF 用户提供了角色参考图： → 直接使用参考图作为角色锚点，进行角色分析，继续收集其余4项\n\nIF 用户没有参考图（包括\"没有参考图\"/\"由AI自由设计\"等回答）： → 不得跳过角色资产环节 → 必须先通过 generate_image 生成角色三视图（正面/侧面/背面） → 将三视图展示给用户，通过 ask_human 确认外观是否满意 → 用户明确确认后，以确认图作为角色锚点 → 禁止仅凭文字描述直接进入视频生成\n\n角色分析维度（收到/确认角色图后执行）\n\n- 服装配色与材质（布料/金属/皮革）\n- 武器类型与持握方式（剑/枪/链/拳套）\n- 气质定位（冷峻/妖娆/威猛/神秘）\n- 战斗风格归类（敏捷型 / 力量型 / 法术型）\n- 视觉标志性元素（如\"红色铁链\" / \"黄色重甲\"）\n\n场景设计决策树\n\nIF 用户提供场景描述： → 提取：地点类型、时间、天气、环境光 → 识别：可互动元素（可破坏道具、动态环境）\n\nIF 用户委托AI设计： → 根据角色冲突类型选择： 法术决斗 → 古代遗迹、月夜、能量裂缝 武术对战 → 庭院、雨夜、石柱 怪物战斗 → 荒原、暴风雨、崩塌结构 → 设计原则：环境必须参与动作（不只是背景）\n\n技能设计清单\n\n- \\[ \\] 元素属性确定（从色彩语义体系中选择）\n\n- \\[ \\] 技能名称与核心动作（如\"天罡烈虎拳\"=一拳冲击）\n\n- \\[ \\] 特效优先级排序（如火系=冲击波&gt;火焰团&gt;热浪扭曲）\n\n- \\[ \\] 环境反馈设计（地面龟裂/冰封扩散/风刃切痕）\n\n- **角色参考图质量评估规则（强制）：**\n\n  无论用户提供参考图还是 AI 生成三视图，都必须执行以下质量评估：\n\n  评估维度：\n\n  - \\[ \\] 图片清晰度：是否存在模糊、压缩失真、截图噪点\n  - \\[ \\] 细节完整度：服装纹理、武器细节、面部特征是否清晰可辨\n  - \\[ \\] 视角完整度：是否包含正面/侧面/背面三个视角\n  - \\[ \\] 尺寸充足度：人物是否足够大，细节是否可见\n\n  IF 参考图质量不足（模糊/截图/细节缺失/视角不全）：\\\n  → 不得直接使用低质量图作为唯一锚点\\\n  → 必须以用户提供的图为参考，通过 generate_image 重新生成\\\n  一张高质量、多视角、细节完整的角色三视图\\\n  → 将新生成的完善版三视图展示给用户确认\\\n  → 用户确认后，以完善版三视图作为正式角色锚点\\\n  → 后续所有视频生成，必须引用完善版三视图节点作为 reference_nodes\\\n  → 禁止使用原始低质量图直接生成视频\n\n  IF 参考图质量良好（清晰/细节丰富/多视角）：\\\n  → 直接使用作为角色锚点，无需额外生成\\\n  → 后续所有视频生成，引用此图作为 reference_nodes\n\n  **锚点版本管理规则：**\n\n  - 始终以「最完善版本」的多视图作为后续所有视频的参考锚点\n  - 如果中途生成了更完善的版本，所有后续视频节点必须切换引用新版本\n  - 在分镜表和锚点清单中明确标注当前使用的角色锚点 node_key\n\n---\n\n### 第二步：分镜设计阶段\n\n**核心原则**：分镜是同一视频内的时间段划分，不是多个独立视频拼接。一次生成调用产出包含完整分镜序列的单个视频。\n\n**标准分镜结构**：\n\n分镜时长占比镜头类型叙事功能SB-01 建立前20%环境远景→角色特写场景氛围建立+角色亮相SB-02 蓄力20-45%中景推近/环绕技能准备，能量凝聚，紧张感积累SB-03 爆发45-80%快速跳切+特写技能释放，冲击帧密集，高潮段SB-04 终结后20%拉远俯拍→定格余波扩散，英雄背影，收束感\n\n**每个分镜必须定义**：\n\n- 时间范围：\\[start\\]s - \\[end\\]s\n- 镜头运动：static / dolly / crane / orbit / handheld\n- 角色动作：用动词短语描述的具体姿势/攻击\n- 环境反应：什么在破碎/移动/发光？\n- 特效关键词：3-5个具体VFX描述词\n\n**进阶技巧**：\n\n- 多角色对战场景需插入敌人镜头（建立→对峙→交锋→斩杀）\n- 每个分镜必须包含明确的\"动作完成点\"\n\n**多角色镜头视角切换逻辑**：\\\n主角视角段：跟拍主角出招，敌人仅作为攻击目标出现在画面边缘 敌人视角段：切换至敌人正面，展示其防御/反击动作 碰撞视角段：第三视角俯拍，展示双方能量碰撞全景 终结视角段：回归主角背影，敌人倒下或消散\n\n**分镜脚本用户确认机制（强制）：**\n\n分镜规划完成后，必须将完整分镜方案展示给用户，通过 ask_human 进行确认：\n\n展示内容包括：\n\n- 每个分镜的时间范围、镜头类型、动作内容、特效关键词\n- 角色色彩体系与元素属性说明\n- 场景设计方案\n\n确认交互规则：\\\nIF 用户满意：\\\n→ 进入第三步提示词撰写阶段\n\nIF 用户不满意 / 提出修改意见：\\\n→ Agent 根据用户意见修改对应分镜内容\\\n→ 重新展示修改后的分镜方案\\\n→ 再次通过 ask_human 确认\\\n→ 循环执行，直到用户明确表示满意为止\\\n→ 禁止在用户未确认的情况下进入提示词撰写阶段\n\n用户可在此阶段提出的修改方向包括：\n\n- 调整某个分镜的动作设计\n- 增减特效类型或强度\n- 修改场景细节\n- 调整叙事节奏（加快/放慢某段）\n- 替换角色动作风格\n\n---\n\n### 第三步：提示词撰写阶段\n\n按四层体系构建，篇幅分配严格遵守：\n\n1. **风格质量层**（10%）：渲染引擎 + 色调 + 质感\n2. **运镜系统层**（15%）：镜头运动 + 切换节奏 + 视角\n3. **核心画面层**（60%）：0.5-1秒粒度时间轴微进式拆解\n4. **技术细节层**（15%）：粒子 + 材质 + 物理反馈 + 氛围\n\n**冲击帧植入时机（必选项）**：\n\n- 蓄力段必含黑白渐变\n- 技能爆发瞬间必含1次闪白帧\n- 交锋段每次撞击必含冲击帧描述\n- 终结段必含黑白定格+色彩回涌\n\n**提示词长度**：控制在 800-1500 字\n\n---\n\n### 第四步：生成与验收阶段\n\n**生成规则**：\n\n- 使用 **Seedance 2.0** 模型\n- 一次调用产出完整视频，包含所有分镜时序\n- 禁止拆分为多个节点后拼接\n\n**质量验收检查项**：\n\n- \\[ \\] 技能色彩是否符合元素语义体系\n- \\[ \\] 角色服装/武器是否与确认的参考图一致\n- \\[ \\] 是否至少包含1次闪白帧爆点\n- \\[ \\] 是否包含1次黑白帧序列\n- \\[ \\] 镜头运动是否流畅（无突兀跳跃）\n- \\[ \\] 特效密度是否达标（粒子/冲击波/环境破坏）\n\n**不满意时的迭代策略**：\n\n- 技能不够炫 → 增加冲击帧描述密度，强化震屏效果\n- 节奏拖沓 → 压缩蓄力段时长，增加爆发段跳切频率\n- 画面暗淡 → 风格层添加\"高对比度光影\"，技能层强化发光粒子\n- 角色变形 → 核心画面层增加外观锁定描述（\"银发/红衣/铁链武器始终保持\"）\n\n---\n\n## 关键约束与标准（强制规则汇总）\n\n规则类型内容准备阶段门控🔴 强制阻塞5项全部用户明确确认后才可进入分镜设计角色资产规则🔴 强制阻塞无参考图必须先生成三视图并经用户确认分辨率询问🔴 强制阻塞生成任何视频前必须先询问，不可假设分镜理解🔴 强制分镜是视频内时间段，禁止拆分为多个视频节点拼接单次生成🔴 强制一次调用产出完整视频，不拆分色彩-属性绑定🟡 质量标准技能特效色彩严格遵循元素色彩语义体系冲击帧必含性🟡 质量标准至少1次闪白帧+1次黑白帧+2-4次冲击帧动词强度🟡 文学标准禁用弱动词，必须使用强动词VFX附着性🟡 技术标准特效必须附着于动作主体，不得独立存在时序粒度🟡 叙事标准核心画面层必须0.5-1秒粒度微进式拆解\n\n---\n\n## 高级技巧\n\n### 环境互动强化\n\n高质量战斗视频的特效不应「悬浮」于场景之上，而应与环境产生真实物理互动：\n\n- 火焰技能：点燃地面枯草，引燃木质残骸，空气热浪扭曲\n- 冰霜技能：地面结冰扩散，石柱冰封炸裂，空气凝结白雾\n- 雷电技能：击穿地面留下焦黑痕迹，金属武器反向放电\n- 冲击波：掀起地面尘土，吹飞碎石，震碎残破墙体\n\n### 象征性道具设计\n\n每个场景道具应具备**双重功能**：空间元素 + 象征意义：\n\n- 古老石门 → 代表界域屏障（开启=释放力量）\n- 崩塌石柱 → 可视化战斗强度（破坏程度=力量量级）\n- 天气变化 → 反映角\\*\\*绪状态（平静→暴风=怒气积累）\n\n### 慢镜头黄金时机\n\n以下3个时机插入0.5倍速慢镜头可显著提升视觉冲击力：\n\n1. 技能爆发瞬间（能量球离手的0.3秒）\n2. 武器交锋瞬间（刀剑相撞火花迸发的0.2秒）\n3. 斩杀定格瞬间（敌人倒下前的最后一帧，拉长至0.5秒）\n\n慢镜头描述模板：\\\n\"\\[关键动作\\]瞬间时间流速骤降，画面进入0.5倍速慢镜头，\\[细节放大描述\\]，慢镜结束后时间流速恢复正常\"\n\n### 终结定格英雄构图\n\n视频最后1-2秒必须交付**英雄构图**：\n\n- 角色处于主导位置（高处、居中、逆光）\n- 环境破坏作为构图框架（烟雾散开、碎石沉落）\n- 胜利图腾（武器高举、能量消散、余波扩散）\n- 这一帧必须是截图级画面\n\n---\n\n## 完整示例\n\n**用户输入**：\n\n- 角色：红衣女侠，铁链武器（参考图已确认）\n- 对手：黄甲重装战士（参考图已确认）\n- 场景：AI设计\n- 分辨率：16:9\n- 时长：15s\n- 特效强度：极致\n\n**分镜规划**：\\\nSB-01 (0-3s)：古代神庙废墟夜景，蓝色能量裂缝贯穿地面，破损屋顶透入月光 SB-02 (3-7s)：双方对峙，红色vs金色能量光环碰撞，地面裂缝向两侧扩散 SB-03 (7-12s)：铁链挥出缠绕红色闪电，重甲战士轰出金色冲击波，两股能量碰撞爆炸 SB-04 (12-15s)：终极招式碰撞，能量柱冲天，神庙立柱轰然倒塌，双方背对背定格\n\n**生成提示词**：\\\n3D国漫武侠风格，史诗级动作大片质感，虚幻引擎5极致画质，暗黑史诗色调，红金双色能量对比，视觉张力爆表，动态模糊+景深，60fps流畅。\n\n运镜流畅多变，广角建立镜头切换至动态特写，蓄力段低角度环绕跟拍，爆发瞬间快速跳切至正面碰撞近景，终结段俯拍缓慢拉远定格，镜头叙事感极强。\n\n0-3s：古代神庙废墟月夜，地面蓝色能量裂缝向四方蔓延，破损石柱耸立，月光穿透残破屋顶投下冷光；画面色彩如潮水缓缓退去褪为冷灰黑白，死寂压迫感弥漫； 3-7s：红衣女侠与黄甲战士遥遥对峙，两人周身能量光环骤然迸发，红色与金色光环在两人之间剧烈碰撞，地面龟裂从碰撞点向外扩散，碎石飞溅； 7-12s：女侠挥动铁链，链身缠绕红色闪电破空袭出，战士抬臂格挡，重拳轰出金色冲击波；两股能量在空中碰撞，全屏白色强光瞬间吞没画面，冲击波环状炸裂扩散，摄像机剧烈震动先大后小持续0.3秒；能量在碰撞点二次爆发，画面边缘强\n\n继续生成\n\n接上文继续：\n\n烈镜头畸变，每一击落下画面猛烈一震爆出耀眼白光，节奏如战鼓密集；\\\n12-15s：双方同时蓄力施展终极招式，红色能量柱与金色能量柱冲天而起，交汇点爆发毁灭性爆炸，神庙立柱轰然倒塌，烟尘滚滚；斩击后画面凝固为黑白慢镜，碎石悬浮如时间静止，色彩如潮水缓缓回涌，最终定格于双方背对背屹立的史诗级战后画面。\n\n粒子特效密集，闪电冲击波烟尘质感细腻，模型精度拉满，材质写实逼真，动态模糊自然，氛围感与压迫感双重拉满。\\\n执行：一次调用生成包含完整分镜序列的单个视频，使用 Seedance 2.0 模型。\n\n# 动作特效视频生成\n\n## 核心方法论\n\n### 四层提示词架构\n\n从用户实际创作中提炼的结构化提示词体系,每层各司其职:\n\n层级作用关键要素**① 风格质量声明层**定基调、渲染标准、色调情绪虚幻引擎5、暗黑电影级、高对比度光影、3D国漫玄幻**② 运镜系统层**定镜头运动、切换节奏、沉浸感动态跟拍、特写与大场景无缝切换、低角度仰拍**③ 核心画面层**时间微进式叙事,0.5秒粒度拆解动作轰然升起→符文绽放→石门开启→冲出**④ 技术细节强化层**粒子/材质/模糊/氛围压迫感收尾模型精度拉满、动态模糊自然、体积光细腻\n\n**核心原则**: 用「画面里发生了什么」替代「第X帧亮度值是多少」\n\n### 法术系色彩语义体系\n\n根据技能属性锁定主色调,保证视觉统一性:\n\n颜色对应属性情绪关键词粒子特征红/橙火焰/怒气热烈、爆裂烈焰飞溅、气雾翻涌蓝/青冰霜/控制冷冽、凝结冰晶折射、霜花凝结紫/黑雷电/暗影诡异、吞噬电弧跳跃、黑雾弥漫金/白神圣/能量耀眼、神圣光柱冲天、圣光洒落绿/翠自然/生命生机、蔓延藤蔓缠绕、叶片飞散\n\n### 文学表达核心技法\n\n- **动词密度**: 冲破、轰然、磅礴、掀起、咆哮 → 拒绝「出现、显示、发生」\n- **感官叠加**: 视觉+听觉+动势同时描述(「震耳咆哮+磅礴滑落+轰然升起」)\n- **尺度对比**: 角色渺小 vs 巨型生物/建筑 → 压迫感来源\n- **特效绑定**: VFX必须附着于动作(「獠牙**进发**紫色火焰」而非「紫色火焰出现」)\n- **材质细节**: 布满青苔、狰狞鬼首纹路、通体萦绕紫光 → 真实感来源\n\n## 工作流程\n\n### 1. 准备阶段\n\n**必须先完成的6项确认**:\n\n1. 准备阶段完成标准（6项全部确认才可推进）：\n\n   1. ✅ 角色资产已确认（参考图上传 或 三视图经用户确认）\n   2. ✅ 画面比例已确认（1:1 / 16:9 / 9:16）\n   3. ✅ 画面分辨率已确认（480p / 720p / 1080p）\n   4. ✅ 场景偏好已确认（用户指定 或 AI设计）\n   5. ✅ 视频时长已确认（10s / 15s / 20s / 30s / 60s）\n   6. ✅ 特效强度已确认（轻微 / 中等 / 极致）\n\n2. **角色深度分析**:\n\n   - 服装细节: 颜色、材质、装饰、破损程度\n   - 武器特征: 类型、尺寸、特殊纹路\n   - 气质定位: 冷峻/妖媚/霸气/灵动\n   - 体型特征: 肌肉感/敏捷感/力量感\n\n3. **技能类型色彩锁定**:\n\n   - 火系 → 橙金/焦红/炽白\n   - 冰系 → 冰蓝/青白/霜白\n   - 雷系 → 黑紫/紫白/电蓝\n   - 体术 → 橙金冲击波+兽形粒子\n\n**元素清单检查**:\n\n- \\[ \\] 角色立绘/参考图已上传\n- \\[ \\] 技能名称与属性已明确\n- \\[ \\] 核心动作已定义(蓄力/爆发/终结)\n- \\[ \\] 分辨率已确认\n\n### 2. 分镜规划阶段\n\n**分镜=同一条视频内的时间段划分,不是多个独立视频节点**\n\n标准四段式结构 (15秒)\n\n分镜时长镜头类型内容核心节奏关键词SB-01 建立0-3s远景→中景场景建立/角色蓄力平稳蓄势SB-02 蓄力3-7s中景→特写能量凝聚/施法手印黑白渐变压迫SB-03 爆发7-12s特写+快切技能爆发/连击冲击闪白/震屏密集SB-04 终结12-15s拉远俯拍余波扩散/定格收束黑白定格回涌\n\n体术连击扩展结构 (可选)\n\n适用于格斗类技能,强调连招节奏:\n\n```\n【蓄势段 0-3s】低角度仰拍,摆桩步,黑白渐变\n【连拳爆发段 3-8s】残影递增(三重→四重→六重),每拳一震\n【终极一拳段 8-12s】兽形巨影直插天际,极震0.8s\n【余韵定格段 12-15s】黑白慢镜→色彩回涌→俯拍收束\n```\n\n### 3. 提示词构建阶段\n\n按四层架构逐层填充:\n\nLayer 1: 风格质量声明\n\n```\n3D国漫玄幻风格,史诗级奇幻大片质感,\n暗黑电影级色调,超写实3D渲染,虚幻引擎5极致画质,\n高对比度光影,明暗层次强烈,神秘诡谲氛围拉满,\n动态表现力炸裂,整体视觉张力极具冲击感\n```\n\nLayer 2: 运镜系统\n\n```\n运镜流畅且富有张力,特写与大场景无缝切换,\n动态跟拍强化沉浸式临场体验,镜头叙事感极强\n低角度仰拍展现压迫感,侧跟拍强化速度感,\n俯拍缓慢拉远收束英雄背影\n```\n\nLayer 3: 核心画面 (关键)\n\n**使用时间微进式叙事,0.5秒粒度拆解**:\n\n火系技能示例:\n\n```\n战士握拳蓄力,虎形火焰能量在拳面凝聚如橙金熔岩,\n周身肌肉紧绷青筋暴起,战袍在劲风中猎猎作响;\n下一秒天罡烈虎拳轰然出击,\n拳面骤然爆发出巨型虎形粒子能量虚影,\n虎首昂天咆哮獠牙毕露,虎躯由密集橙金粒子与烈焰构成,\n随出拳之势猛然前冲,虎尾拖曳出炽白光柱直插天际冲破云层;\n冲击波从拳面向外环形炸裂扩散,地面瞬间龟裂崩塌,\n漫天碎石与浓烈气雾如海浪翻涌遮天蔽日,烈火柱冲天而起\n```\n\n冰系技能示例:\n\n```\n女侠纤手结施法手印,指尖凝结出晶莹剔透的霜花,\n玄冰能量沿铁链快速蔓延如冰蓝色蛇影游走;\n瞬间风刃横扫而出,冰刃轨迹在空气中撕裂出白色寒霜裂痕,\n所过之处空气骤然凝结成冰晶粒子爆裂飞溅,\n地面石柱被斩断面如镜面光滑,断口处冰霜向四周蔓延如冰花绽放;\n终结瞬间冰封冲击波席卷全场,天地陷入冰蓝色冻结定格,\n碎冰悬浮空中如时间静止\n```\n\nLayer 4: 技术细节强化\n\n```\n粒子特效丰富,雾气、水流、紫光质感细腻,\n模型精度拉满,材质写实逼真,动态模糊自然,\n氛围感与压迫感双重拉满,\n体积光中尘埃浮动清晰可见,\n冰晶折射、动态模糊、粒子爆炸帧、冰面反光\n```\n\n### 4. 冲击帧可视化描述 (核心技法)\n\n**原则**: 用画面动作替代帧数值\n\n闪白帧可视化写法\n\n效果意图可视化描述纯白爆闪画面爆闪至纯白如雷击般刺目,瞬间切回战斗场景强化闪白全屏白色强光瞬间吞没画面,冲击波从中心向外高速环状扩散,带起漫天飞尘与碎石,强光消退后场景骤然切入震屏闪白爆炸瞬间画面爆白,摄像机剧烈震动,震幅先大后小持续0.3秒后缓慢恢复稳定\n\n黑白帧可视化写法\n\n效果意图可视化描述去色蓄力画面色彩骤然褪尽如墨染,仅剩明暗轮廓,雷电白色电弧在黑白画面中格外锐利斩杀定格斩击瞬间画面凝固为黑白慢镜,碎石与尘埃悬浮空中如时间静止,仅角色眼瞳残留一点幽光蓄力渐变画面色彩如潮水般缓缓退去,世界逐渐褪色为冷灰黑白,暴风雨前的死寂压迫感弥漫\n\n冲击帧连打可视化写法\n\n效果意图可视化描述单次撞击两力相撞瞬间爆出耀眼白光,冲击波环状向外炸裂扩散,地面龟裂飞尘横飞二次爆发能量在碰撞点积压到极限轰然二次爆发,画面边缘出现强烈镜头畸变,火花如雨四溅高频连打每一击落下画面猛烈一震,闪光与爆裂声此起彼伏,节奏如战鼓密集擂响拳拳到肉\n\n震屏四级体系\n\n```\n【轻震】摄像机轻微颤抖如远处爆炸的余震,持续0.2秒后自然恢复\n\n【中震】爆炸瞬间摄像机猛烈震动,震幅先大后小,持续0.3秒后缓慢稳定\n\n【重震】冲击波正面命中,摄像机剧烈抖动如地震,\n       画面边缘出现运动模糊,震动幅度从最大值快速衰减,\n       0.5秒内逐步恢复稳定\n\n【极震】终极大招爆发,摄像机震动到极限,\n       画面短暂失焦+边缘畸变,尘土碎石铺天盖地,\n       震动持续0.8秒后如余震般缓缓平息\n```\n\n完整冲击节奏模板\n\n```\n【蓄力段】画面色彩如潮水缓缓退去,褪为冷灰黑白,世界陷入死寂压迫\n\n【爆发点】全屏白色强光瞬间吞没画面,冲击波从中心向外高速环状扩散,\n         带起漫天飞尘与碎石,摄像机剧烈震动先大后小持续0.3秒\n\n【冲击连打】每一击落下画面猛烈一震,爆出耀眼白光与冲击波涟漪,\n           能量在碰撞点二次爆发,镜头畸变+火花四溅,节奏如战鼓密集\n\n【余韵定格】斩击后画面凝固为黑白慢镜,碎石悬浮如时间静止,\n           色彩如潮水缓缓回涌,残留粒子在体积光中飘散消逝\n```\n\n### 5. 体术连击专属技法\n\n残影密度递增体系\n\n```\n第一拳: 三重残影 → 虎爪划过轨迹,速度感初显\n第二拳: 四重残影 → 叠影交错,眼花缭乱感渐强  \n第三拳: 六重残影 → 叠影如虎扑猎物,密集到极限\n\n规则: 残影数量随连击次数递增,每拳比上一拳多1-2重\n```\n\n兽形能量巨影·直插天际技法\n\n触发时机: 终极一拳/大招爆发瞬间\n\n描述模板:\n\n```\n出拳背后骤然显现巨型[虎/龙/熊]形虚拟粒子能量巨影,\n[兽]首昂天咆哮[獠牙/龙角/熊爪]毕露,\n[兽]躯由密集[橙金/紫黑/冰蓝]粒子与[烈焰/雷电/寒霜]构成,\n随出拳之势猛然前冲直插天际,\n[兽]尾拖曳出数十米[炽白/紫白/冰蓝]光柱冲破云层,\n气势磅礴震撼无极\n```\n\n震屏与冲击帧绑定规则\n\n连击轮次震屏强度闪白强度残影重数第1拳轻震0.2s基础闪白三重第2拳中震0.3s强化闪白四重第3拳重震0.5s爆炸闪白六重终极拳极震0.8s+失焦全屏极爆白兽形巨影\n\n### 6. 生成与迭代阶段\n\n1. 将完整提示词传入视频生成工具\n\n2. 一次性生成完整视频(不拆分为多个节点)\n\n3. 检查关键帧是否命中:\n\n   - \\[ \\] 黑白蓄力段是否出现\n   - \\[ \\] 闪白/冲击帧在爆发点是否触发\n   - \\[ \\] 兽形能量巨影是否清晰\n   - \\[ \\] 震屏效果是否明显\n   - \\[ \\] 色彩统一性是否保持\n\n4. 如冲击帧效果不明显,考虑后期处理:\n\n   - 使用`edit_video`在关键帧插入纯白帧\n   - 对指定时间段做去色处理\n\n## 关键约束与标准\n\n### 必须遵守的流程规则\n\n1. **分辨率确认**: 生成前必须询问用户分辨率需求,这是阻塞性要求\n2. **分镜非节点**: 分镜是同一条视频内的时间段划分,不是多个独立视频节点拼接\n3. **一次生成**: 规划好所有分镜后,用一次`generate_video`生成包含完整叙事的视频\n\n### 色彩一致性规则\n\n- 火系全程锁定橙金/焦红/炽白,不出现蓝绿色调\n- 冰系全程锁定冰蓝/青白/霜白,不出现暖色调\n- 雷系全程锁定黑紫/紫白/电蓝,不出现黄色闪电\n- 体术冲击波与角色服装色调协调(橙黄战袍配橙金冲击波)\n\n### 冲击帧精准度规则\n\n**AI视频模型局限**: 目前对精确到0.1秒的帧级特效指令理解能力有限\n\n**弥补方案**:\n\n- 提示词采用可视化动作描述(「全屏白光吞没画面」)而非数值(「亮度246/255」)\n- 关键冲击帧未触发时,通过后期编辑补强\n- 震屏效果用持续时间描述(「0.3秒」)而非帧数(「18帧@60fps」)\n\n### 慢镜头黄金时机\n\n三个必插0.5倍速慢镜头的时机:\n\n1. **能量球离手瞬间** - 强化技能释放的仪式感\n2. **武器交锋瞬间** - 放大冲击碰撞的力量感\n3. **斩杀定格瞬间** - 凸显终结一击的决断感\n\n### 动词质量标准\n\n**禁用动词**: 出现、显示、发生、产生、形成\n\n**必用动词类别**:\n\n- 爆发类: 轰然、迸发、炸裂、喷涌、爆开\n- 运动类: 猛然、骤然、瞬间、暴起、横扫\n- 扩散类: 席卷、蔓延、扩散、涌动、翻涌\n- 声效类: 咆哮、震荡、呼啸、轰鸣、撕裂\n\n## 推荐工具与模型\n\n使用Seedance 2.0进行视频生成,该模型对动作特效和冲击节奏有较好支持。\n\n## 高级技法\n\n### 多属性融合技能\n\n当技能涉及两种属性融合时(如雷火/冰风),采用「主色+点缀色」策略:\n\n```\n雷火融合示例:\n主色调: 黑紫雷电(占70%画面)\n点缀色: 焦红火焰(占30%,集中在碰撞点)\n融合点: 紫红色能量漩涡(两者交汇处)\n```\n\n### 环境反馈强化\n\n技能爆发必须有环境响应,强化真实感:\n\n- 火系: 地面焦黑、空气扭曲、热浪升腾\n- 冰系: 地面结冰、水汽凝结、霜花蔓延\n- 雷系: 地面龟裂、静电粒子、金属共振\n- 体术: 地面塌陷、气浪横飞、碎石飞溅\n\n### 分镜转场技法\n\n**硬切转场**(用于爆发点): 闪白帧→直接切入下一镜头\n\n**软切转场**(用于蓄力段): 镜头推进→焦点转移→自然过渡\n\n**冲击转场**(用于连击): 每一击震屏→画面快速跳切→制造密集节奏感", "extras": [], "cn": "影视打斗特效skill"}, {"slug": "conceptual-character-creator", "desc": "输入一个角色想法，自动生成原创概念角色、角色板和15秒视频", "body": "## 2. Agent自动执行硬规则\n\n### 2.1 默认执行模式\n\n当 Agent 具备可用的图像 / 视频生成工具时，本 Skill 默认进入：\n\n```text\nAgent Auto-Run Mode / Agent自动执行模式\n```\n\n在该模式下，禁止只把提示词交给用户手动复制。\n\nAgent 必须尽可能直接执行：\n\n```text\nMJ角色概念图生成\nImage模型角色板生成\n视频前置检查\nSD2.0最终15秒视频生成\n```\n\n### 2.2 文本回退模式\n\n仅当当前 Agent 没有对应生成工具、工具不可用、用户明确要求只要提示词，才进入：\n\n```text\nPrompt Fallback Mode / 提示词回退模式\n```\n\n回退模式必须明确说明：\n\n```text\n当前无法直接调用对应生成工具，因此输出可复制提示词。\n```\n\n不得伪装成已经生成图像或视频。\n\n### 2.3 不再默认 TEXT ONLY\n\nV0.6 废除旧版“默认只输出文本”的规则。新规则为：\n\n```text\n有工具则执行，无工具才输出提示词。\n```\n\n涉及“角色板”“关键帧”“成功帧”“视频”时，如果工具可用，默认理解为需要生成资产，而不是只写提示词。\n\n---\n\n## 3. 省积分硬规则：No Video Before Validation\n\n虽然 V0.6 支持自动出视频，但最终15秒视频仍然不能作为初次测试工具。\n\n最终视频生成前必须完成以下检查：\n\n```text\n1. 角色锚点确认\n2. MJ概念图质量确认\n3. Image模型角色板质量确认\n4. 技能机制确认\n5. 技能因果链确认\n6. 武器 / 媒介主导性确认\n7. 真实接触与物理反馈确认\n8. 3个成功画面确认\n9. 失败风险预判\n10. 角色性格、当前情绪、表演微指令与情绪弧线确认\n11. 最终提示词强化项确认\n```\n\n如果任一项不清楚，Agent 必须先做低成本修正，不得直接烧最终视频积分。\n\n可执行策略：\n\n```text\n先修MJ概念图\n再修Image角色板\n再修技能机制\n最后才生成15秒SD2.0视频\n```\n\n---\n\n## 4. 标准自动生产流程\n\n### 4.1 无角色输入时\n\n当用户没有提供角色图、角色设定或角色板：\n\n```text\n1. 调用角色库，给出6个角色方向。\n2. 如果用户要求“自动 / 全自动 / 你自己选”，Agent 直接选择最适合做SSS技能展示的角色。\n3. 使用 MJ 8.1 + --preview 自动生成单人角色概念图。\n4. 对MJ概念图做质量检查。\n5. 若出现多角色、半身、武器缺失、海报感、角色不清，自动返修MJ概念图。\n6. MJ概念图合格后，使用 Image 模型生成角色板。\n7. 角色板参数固定为：16:9 / 高画质 / 2K。\n8. 角色板合格后，角色板成为唯一角色锚点。\n9. 自动进行角色理解、技能机制设计和Video Preflight Gate。\n10. Preflight通过后，使用SD2.0视频模型一次性生成一条完整15秒视频。\n```\n\n### 4.2 有MJ角色概念图时\n\n```text\n1. 不直接进入视频。\n2. 先检查MJ概念图是否为单人、全身、武器清楚、服装结构可读。\n3. 合格后，使用 Image 模型自动生成角色板。\n4. 角色板参数固定：16:9 / 高画质 / 2K。\n5. 角色板通过后，再进入技能预演和最终视频。\n```\n\n### 4.3 有角色板时\n\n```text\n1. 把角色板作为唯一角色锚点。\n2. 分析角色身份、武器媒介、视觉母题、技能动力学。\n3. 自动输出技能机制预演。\n4. 自动执行 Video Preflight Gate。\n5. 若通过，使用SD2.0自动生成一条完整15秒视频。\n```\n\n### 4.4 有失败视频时\n\n```text\n1. 分析失败视频。\n2. 判断失败发生在：角色锚点、武器主导、技能因果、镜头、物理反馈、模型误读。\n3. 优先返修前置提示词或角色板，不优先继续烧视频。\n4. 必须输出下一次视频生成前的阻塞点和修正策略。\n```\n\n---\n\n## 5. Midjourney 角色概念生成规则\n\n角色概念图默认使用 Midjourney：\n\n```text\n--v 8.1 --preview\n```\n\n`--preview` 必须放在 MJ 提示词参数末尾，用于调用 8.2 测试版本。\n\n### 5.1 单角色控制规则\n\n当目标是单个角色概念图时，禁止使用容易生成多角色的并列结构：\n\n```text\nA warlord, a gunslinger, a blade-bearer\n```\n\n必须改写为：\n\n- `A single character ...`\n- `A single lead character who combines ...`\n- `A xxx-xxx-xxx hybrid character`\n\n并追加：\n\n```text\nsolo, one person only, single character, full body, centered composition, no group, no lineup, no multiple characters, no extra people\n```\n\n### 5.2 MJ概念图质检硬规则\n\n角色概念图进入角色板之前，必须检查：\n\n- 是否多个角色 / 角色阵列\n- 是否半身 / 裁脚 / 头像\n- 主武器或核心媒介是否缺失\n- 是否过度海报感\n- 服装结构是否可读\n- 身份是否被误解\n- 是否提前生成多视图 / 多面板\n- 是否有文字、logo、UI、乱码干扰\n\n如不合格，先调用 `references/mj-common-error-repair-library.md` 返修，不进入角色板。\n\n---\n\n## 6. Image模型角色板生成硬规则\n\nV0.6 明确修正：\n\n```text\n角色板不是用 MJ 继续生成，而是使用 Image 模型生成。\n```\n\n角色板生成参数固定为：\n\n```text\n模型：Image模型\n比例：16:9\n画质：高画质\n分辨率：2K\n输入参考：最终MJ角色概念图作为 {{Image 1}}\n输出目标：专业角色转视角图表 / 角色参考模型图表\n```\n\n角色板必须包含：\n\n- 面部特写\n- 正视图\n- 背视图\n- 左侧轮廓\n- 右侧轮廓\n- 全身视角旁的垂直高度测量刻度\n- 左下角信息面板\n- 白色摄影棚背景\n- 柔和均匀摄影棚光\n- 全视角一致身份、比例、服装、武器、材质\n\n角色板生成后必须质检：\n\n- 是否同一角色\n- 是否五个视角齐全\n- 是否全身清楚\n- 是否武器 / 媒介出现\n- 是否服装结构可读\n- 是否没有多余角色\n- 是否没有错位 / 畸变 / 多手多脚\n- 是否适合作为唯一视频参考锚点\n\n模板见：\n\n```text\ntemplates/image-model-character-board-template.md\ntemplates/character-board-from-mj-template.md\n```\n\n---\n\n## 7. 角色板唯一锚点规则\n\n角色板生成后，成为后续所有技能与视频的 **唯一角色锚点**。\n\n禁止：\n\n- 回退混用MJ概念图\n- 混用其他无关参考图\n- 重新设计脸、服装、武器、体型\n- 根据技能需要擅自换身份\n\n视频提示词必须保留角色板中的：\n\n- 面部结构\n- 发型与发色\n- 年龄感\n- 肤色\n- 体型与比例\n- 服装轮廓与材质\n- 武器 / 道具 / 配饰\n- 核心气质与身份感\n\n---\n\n## 8. 角色性格与情绪表演硬规则\n\nV0.6.2 新增硬规则：最终视频不能只锁定外形、武器和技能，还必须锁定角色的性格、当前情绪和表演驱动力。\n\n任何角色进入最终 SD2.0 15 秒视频生成前，必须完成：\n\n```text\n【角色性格锚点】\n性格主轴：\n气质关键词：\n行为方式：\n压迫方式：\n情绪表达方式：\n禁用表演：\n\n【当前情绪状态】\n当前情绪：\n情绪强度：/10\n触发原因：\n爆发方式：\n收尾余韵：\n\n【表演微指令】\n眼神：\n嘴部表情：\n呼吸状态：\n头部动作：\n肩颈状态：\n手部状态：\n爆发前停顿：\n爆发后反应：\n收尾状态：\n\n【15秒情绪弧线】\n0-3秒：情绪建立\n3-7秒：压迫上升\n7-11秒：爆发\n11-15秒：余震 / 收束 / 性格态度显现\n```\n\n如果缺少以上任一部分，Agent 不得直接生成最终视频。\n\n### 8.1 角色不能只是“会放技能的壳子”\n\n错误方向：\n\n```text\n角色站着，释放技能，最后摆 pose。\n```\n\n正确方向：\n\n```text\n角色以符合自身性格和当前情绪的方式执行技能，动作节奏、眼神、呼吸、停顿、爆发和收尾都服务于角色性格。\n```\n\n### 8.2 最终视频提示词必须新增字段\n\n最终 SD2.0 视频提示词必须包含：\n\n```text\n【角色性格锚点】\n【当前情绪状态】\n【表演微指令】\n【15秒情绪弧线】\n【收尾情绪余韵】\n```\n\n这些字段不得被压缩成一句话，也不得只写“冷酷”“愤怒”等单词。\n\n详见：\n\n```text\nreferences/character-personality-and-emotion-system.md\ntemplates/personality-emotion-preflight-template.md\n```\n\n---\n\n## 9. Video Preflight Gate 视频前置检查\n\n最终视频生成前，必须自动完成：\n\n```text\n【角色性格与情绪】\n性格主轴：\n当前情绪：\n表演微指令：\n15秒情绪弧线：\n\n【技能因果链】\n角色动作：\n武器 / 媒介动作：\n真实接触：\n第一视觉结果：\n环境反应：\n终局收束：\n\n【武器 / 媒介主导性检查】\n主导动作是否来自武器 / 媒介：\n特效是否由武器 / 媒介触发：\n是否有真实接触与物理反馈：\n观众能否一眼看出结果由该武器造成：\n\n【必须出现的3个成功画面】\n1.\n2.\n3.\n\n【失败风险】\n1.\n2.\n3.\n\n【预演结论】\n通过 / 阻塞\n```\n\n若结论为“阻塞”，Agent 不得生成最终15秒视频，只能自动修正前置资产或提示词。\n\n---\n\n## 10. 技能动力学优先规则\n\n禁止所有角色默认使用“站立蓄力 + 圆形法阵 + 大招爆发”的同质化结构。\n\n必须先判断角色动力学：\n\n- 速度型\n- 重击型\n- 武器轨迹型\n- 枪械触发型\n- 仪式权杖型\n- 召唤型\n- 侵蚀型\n- 环境改写型\n- 幻术错位型\n- 近身压制型\n- 一击终局型\n- 领域展开型\n- 披风载体型\n- 枪声审判型\n- 路径延迟
