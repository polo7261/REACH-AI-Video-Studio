影空镜）\n堤坝背影+海\n天台背影+城市\n货架间背影\n操场背影+夕阳\n池边背影+水面\nD（情绪释放）\n双手张开骑行\n天台边缘张开臂\n货架间旋转\n跑道全力奔跑\n水中跃起\nE（产品互动）\n仰头饮水\n天台举瓶/戴耳机\n便利店拿取/饮用\n运动后饮水\n池边休息使用\n三、三大阶段执行流\n阶段一：角色与产品确认【确认门1】\n步骤 1：主角角色卡\n目标：创建稳定可复用的角色提示词 + 生成角色形象图，确保后续分镜角色一致。用户确认角色形象后进入产品商业图。\n7 维度档案：年龄种族感 / 发型发色 / 面部特征（含妆容）/ 身材体态 / 穿着造型 / 皮肤质感（必含汗水毛孔）/ 气质关键词\n女主默认妆容（淡淡学生妆）：默认自然清透学生妆——淡粉腮红、浅棕眉、接近唇色的淡口红，无浓妆感。提示词加 natural student makeup, light pink blush, subtle lip tint。\n角色一致性锚点（强制保留 4 个）：\n发型锚点：如「齐耳黑色短发+齐刘海」\n妆容锚点：如「淡淡学生妆+自然腮红」\n服装锚点：如「白色短袖衬衫+藏青百褶裙」\n特征锚点：如「左耳小痣+清澈下垂眼」\n英文提示词公式：\n[主体+穿着+妆容]+[facing camera, close-up portrait, clear facial expression, eye contact]+[环境光线]+[器材胶片]+[质感细节]\n角色形象图强制要求：人物必须面向镜头，采用近景构图（close-up portrait），清晰展现面部表情和五官形态，确保后续分镜角色一致性。\n负向固定模板：\nplastic skin, over-smoothed, doll-like, heavy makeup, thick eyeliner, 3d render, cgi, cartoon, deformed, distorted, bad anatomy, blurry, text, watermark, navy blue, royal blue, cobalt blue, dark blue, teal, dull muted blue, saturated deep blue\n输出格式：\n========== 主角角色卡 ==========\n【角色档案】年龄 / 气质\n【外貌】发型 / 面部+妆容 / 身材 / 皮肤质感\n【标准造型】上衣 / 下装 / 鞋履 / 配饰\n【一致性锚点】1.发型 2.妆容 3.服装 4.特征\n【英文提示词】Positive: ... / Negative: ...\n【角色形象图】→ 生成后展示给用户确认\n步骤 2：产品商业图\n目标：生成高品质产品图 + 产品海报，符合产品类型逻辑。用户确认产品海报后完成阶段一。\n5 项硬指标：\n产品主体完整，3/4 侧面或正面\n表面质感：饮品/护肤品→冷凝水滴；数码/耳机→磨砂/亮面金属\n夏日环境融合（桌面/冰块/海边/白亚麻）\n留白≥40%\n正午硬光，阴影硬朗\n产品类型适配：\n类型\n必含元素\n禁止元素\n饮品\n冷凝水、冰块、水花\n漏液、变形\n护肤品\n水润质感、晶莹质地\n过量涂抹\n耳机/数码\n金属质感、科技感\n浸水、淋水\n食品\n新鲜光泽、摆盘\n破损、散落\n图生图替换模式（用户上传产品图时启用）：\n参考图权重：0.6-0.7\n产品分析：形状/材质/颜色/LOGO位置→建立产品锚点\n提示词必加：condensation droplets（饮品）/ matte metal（数码）等质感词\n产品原图强制贯穿规则（用户上传产品图时强制执行）：\n用户上传的产品原图必须提取「产品视觉指纹」：形状+颜色+材质+LOGO+包装细节+文字排版\n所有后续含产品的分镜图生成（步骤4）必须以该产品原图为 img2img 参考输入，参考权重 0.6-0.8\n所有含产品的视频生成（步骤5）必须以该产品原图为 img2video 参考输入，确保产品外观与实际一致\n产品锚点必须在每镜提示词中明确写出，防止 AI 幻变产品形态\n输出格式：\n========== 产品商业图 ==========\n【产品描述】类型+外观特点\n【产品锚点】1.形状 2.颜色 3.质感\n【产品视觉指纹】形状/颜色/材质/LOGO/包装细节/文字排版\n【产品原图参考权重】0.6-0.8\n【场景方案A】描述 / 构图 / 英文提示词\n【场景方案B】描述 / 构图 / 英文提示词\n【负向提示词】...\n阶段二：分镜画面【确认门2】\n步骤 3：分镜头脚本\n目标：输出结构化分镜，经典镜头严格复刻。用户确认脚本后批量生成分镜图。\n单镜格式（强制）：\n[编号] ➔ [时长] ➔ [画面描述] ➔ [构图手法]\n构图词库：大特写/特写/中景/全景/大远景/三分法/对角线/对称/框架式/低角度仰摄/高角度俯摄/前景虚化/留白构图\n经典镜头标准描述模板（方括号替换为用户设定）：\nA 局部破题：大特写低角度，[场景相关关键物体，如：自行车把手/天台门把手/冰柜门把手/教室门把手/泳池边缘]快速运动或触碰，正午硬光投射清晰阴影，节奏感强烈 ➔ 大特写+低角度+对角线。禁止使用脚部特写作为开场。\nB 空间建立：极低角度仰拍，前景[虚化物体]，[主角动作]，背景纯净宝矿力蓝天空+白云，阳光洒落 ➔ 低角度仰摄+前景虚化+广角\nC 背影空镜：中远景，前景虚化[道具]，中景[主角背影]+[产品]，远景[场景背景]，大面积留白呼吸感 ➔ 前景虚化+三分法+留白\nD 情绪释放：[背部/正面视角]，[主角大动态动作]，[环境全景]，正午阳光强烈，情绪最高点 ➔ 对称构图+大广角\nE 产品互动：[角度]特写，[主角使用产品动作]，[产品细节质感]，[表情/情绪]，背景[环境] ➔ 特写+浅景深\n完整分镜表输出：\n========== 分镜头脚本 ==========\n【时长】XX秒 | 【分镜】XX镜 | 【场景】XX | 【情绪】渐强→高点→收尾\n——第一幕：局部破题——\n[01] ➔ [0:00-0:02] ➔ [...] ➔ [...]\n——第二幕：空间建立——\n[...]\n——第三幕：情绪释放——\n[...]\n——第四幕：产品互动——\n[...]\n——第五幕：高潮定格——\n[...]\n【经典镜头检查】A/B/C/D/E 是否齐全（沿海主线必全）\n步骤 4：分镜图生成\n目标：批量生成分镜静态画面，确保角色和产品一致。用户确认所有分镜画面后完成阶段二。\n生成策略（一致性核心）：\n批量生成：基于确认后的分镜脚本，一次性批量生成所有分镜图\n图生图接力：第2镜起用前一镜人物/产品做参考保连贯\n三锚点强制：每镜必含角色锚点+产品原图锚点+风格锚点\n产品原图贯穿：每镜含产品时，必须以步骤2中用户上传的产品原图为 img2img 参考输入，参考权重 0.6-0.8，禁止使用 AI 生成的产品图作为参考源\n角色形象图贯穿：每镜含角色时，必须以步骤1中生成的角色形象图为 img2img 参考输入，确保角色一致性\n单镜提示词：\n[角色锚点:发型+妆容+服装] + [产品原图锚点:形状+颜色+质感+LOGO] + [动作+场景+光影+构图+器材] + [Pocari Blue #2BA7E5, clear translucent high-brightness sky blue]\n输出格式：\n========== 分镜图 ==========\n——分镜01——中文描述 / 英文Prompt / 参考图（含角色形象图+产品原图）/ Negative\n——分镜02——...\n——分镜03——...\n——分镜04——...\n——分镜05——...\n——分镜06——...\n【一致性检查】角色√ 产品原图贯穿√ 风格√ 宝矿力蓝色彩√\n→ 用户确认后进入阶段三\n阶段三：成片制作\n步骤 5：分镜视频提示词\n目标：以确认后的分镜图为基础，生成纯英文摄影级视频提示词 + 运动强度量化。连续输出，无需用户确认。\n核心原则：每个分镜视频必须以上一步确认的分镜图作为图生视频输入（img2video），在保持画面构图、角色、产品完全一致的前提下增加动态。含产品的视频必须同时以步骤2中用户上传的产品原图为参考输入。\n视频提示词公式：\n[景别]+[主体动作]+[环境背景]+[光线氛围]+[器材胶片]+[运镜方式]+[质感]+[Pocari Blue #2BA7E5, clear translucent high-brightness sky blue]\n运动强度量化：\n镜头类型\n强度\n说明\n大动态（奔跑/跳跃/骑行）\n70%-80%\n运镜积极跟随\n中等动态（行走/转头）\n50%-60%\n运镜平缓\n特写产品/情绪\n30%-40%\n微动，防溶解扭曲\n定格结尾\n10%-20%\n呼吸感微动\n角色一致性策略：\n首镜锚定：第一个人物镜头用角色图做图生视频输入\n后续镜：提示词重复 4 个锚点特征（发型/妆容/服装/特征）\n妆容词每镜必提：natural student makeup, light pink blush\n服装颜色词每镜必提：如 white shirt, navy skirt\n产品一致性策略：\n首镜锚定：第一个产品镜头用用户上传的产品原图做 img2video 参考输入，参考权重 0.6-0.8\n后续镜：所有含产品的视频镜头必须以用户上传的产品原图为 img2video 参考输入，重复产品锚点词（形状/颜色/质感/LOGO）\n禁止使用 AI 生成的产品图作为视频参考源，确保产品外观与实际一致\n经典镜头英文提示词模板：\nA 车轮光影（75%）：\nExtreme close-up low angle shot of [key object] in motion, motion blur, sharp shadows on ground by hard noon sunlight, diagonal composition, dynamic speed, shot on 35mm film, Kodak Portra 400, subtle film grain, soft bloom, Pocari Blue #2BA7E5, clear translucent high-brightness sky blue, tracking shot\nB 低角度仰拍（65%）：\nExtreme low angle shot of [girl in outfit] [action], foreground [object] with motion blur, clear blue sky with white clouds, hard noon sunlight, youthful freedom, wide angle lens, shot on 35mm film, ARRI Alexa Mini, shallow DOF, bokeh, film grain, Pocari Blue #2BA7E5, clear translucent high-brightness sky blue, dolly forward\nC 背影空镜（35%）：\nMedium wide shot, foreground out of focus [prop], middle ground [girl's back] with [product], [background scenery], negative space, rule of thirds, peaceful summer, hard noon sunlight, shot on 35mm film, Fujifilm Pro 400H, foreground bokeh, film grain, Pocari Blue #2BA7E5, clear translucent high-brightness sky blue, slow pan right\nD 情绪释放（80%）：\n[Back/front view] shot of [girl] [dynamic action], [environment panorama], hard noon sunlight, symmetrical composition, wide angle, dynamic motion, shot on 35mm film, Kodak Gold 200, film grain, Pocari Blue #2BA7E5, clear translucent high-brightness sky blue, crane shot rising\nE 产品互动（40%）：\nClose-up [angle] shot of [girl] [using product], [product detail with texture], [expression/emotion], [background], shallow DOF, hard noon sunlight, shot on 35mm film, 85mm f/1.4, sharp focus, film grain, soft bloom, Pocari Blue #2BA7E5, clear translucent high-brightness sky blue, slow dolly in\n输出格式：\n========== 分镜视频提示词 ==========\n**统一负向**：3d render, cgi, cartoon, deformed, distorted, bad anatomy, blurry, plastic skin, text, watermark, navy blue, royal blue, cobalt blue, dark blue, teal, dull muted blue, saturated deep blue\n——分镜01——\n【中文】...\n【运动强度】XX%\n【运镜】...\n【英文】...\n——分镜02——\n...\n【一致性控制】角色锚点 / 产品锚点 / 色彩统一\n步骤 6：声音设计\n目标：配乐 + 音效完整方案。连续输出，无需用户确认。\n配乐（二选一）：\n日系轻快打击乐：木吉他+手鼓+风铃+口哨\nIndie Pop：轻快鼓点+明亮吉他+清爽人声\n器量曲线：前15%轻入(-6dB) → 中45%渐强(全音量) → 产品段压低(-3dB) → 结尾上扬渐弱\n音效槽位：\n类型\n可选\n位置\n环境底噪\n海浪/风声/蝉鸣/空调声\n贯穿，低音量\n动作音效\n链条声/脚步声/衣物摩擦\n对应动作\n产品音效\n饮水声/开盖声/按键声\n产品段\n标点音效\n风铃/快门/鼓点\n转场处\n呼吸感\n喘气/轻笑/叹气\n情绪高点\nAI 配乐提示词模板：\nGenre: Indie Pop / Japanese acoustic pop\nMood: refreshing, energetic, youthful, summer, carefree\nTempo: 120-140 BPM\nInstruments: acoustic guitar, drums, shaker, wind chimes\nVocals: female/male/instrumental, light airy voice\nVibe: Pocari Sweat commercial style, bright summer day, coastal breeze\nStructure: intro→build up→chorus peak→bridge→final chorus→outro fade\n输出格式：\n========== 声音设计 ==========\n【配乐】风格 / BPM / 英文提示词\n【音效时间轴】\n时间点 | 声效 | 音量 | 备注\n【混音建议】平衡 / 低频 / 高频 / 响度-14LUFS\n步骤 7：后期剪辑\n目标：节奏精准 + 去AI味彻底。连续输出，无需用户确认。\n节奏点：画面切换踩在配乐重拍上。情绪段 1-2 秒一镜，产品/结尾 3-5 秒一镜。\n去AI味剪辑（强制）：\n问题\n方案\n参数\n转场跳变\n0.1秒白闪\n2-3帧，80-100%不透明\n动作不连\n胶片漏光过渡\n0.2秒，暖橙色边缘扩散\n面部扭曲\n切产品/空镜\n切出0.3秒切回\n画面闪烁\n叠加胶片颗粒层\n5-10%，叠加模式\n结尾定格\n缓慢推镜+渐暗\n2秒，100%→105%缩放\n调色规范：色温偏冷(4800-5200K) / 色调偏青蓝(+5~+10) / 微过曝(+0.3~+0.7EV) / 高光压暗(-10~-20) / 阴影提亮偏蓝(+15~+25) / 饱和全局降蓝提升(全局-5蓝+10) / 对比度降低(-8~-12) / 胶片颗粒(8-12%)\n宝矿力蓝色彩校准专项（强制执行）：\n蓝色通道 Hue 偏移至 198°±3°\n蓝色通道 Saturation 调整至 70-80%\n蓝色通道 Lightness 调整至 55-65%\n画面中所有蓝色必须符合清透高明度标准，禁止出现深蓝/藏蓝/宝蓝/钴蓝/青色\n天空蓝色必须与产品蓝色保持一致的色相和明度\n输出格式：\n========== 后期剪辑指南 ==========\n【剪辑节奏表】分镜/时长/切入音乐点/转场效果\n【去AI味清单】□白闪 □漏光 □颗粒 □稳定 □推镜\n【调色】色温/曝光/饱和/颗粒/宝矿力蓝校准\n【输出】横版1920x1080 / 竖版1080x1920 / 3:2(1920x1280) / 4:3(1440x1080) / 方形1080x1080 / 24fps / 10-15Mbps / AAC320k / MP4\n【最终检查】产品≥3次 / 宝矿力蓝贯穿 / 踩点 / 无AI扭曲 / 定格≥2秒\n执行总流程（三大阶段）\n阶段一：角色与产品确认【确认门1】\n初始化交互：收集 8 个核心参数（含视频比例）\n产品逻辑校验：确认产品类型与呈现方式匹配\n故事链路确认：基于选定场景，生成五幕骨架+经典镜头映射\n生成主角角色卡 + 角色形象图（建立4个角色一致性锚点）\n生成产品商业图 + 产品海报（建立产品一致性锚点） → 用户确认角色形象和产品海报后，进入下一阶段\n阶段二：分镜画面【确认门2】\n生成完整分镜头脚本（经典镜头标注）\n批量生成分镜图（以角色形象图和产品原图为参考输入，图生图接力保一致） → 用户确认分镜画面后，进入下一阶段\n阶段三：成片制作\n生成分镜视频提示词（以分镜图为基础，角色+产品双锚点）\n生成声音设计方案（配乐+音效）\n生成后期剪辑指南（调色+转场+输出） → 连续输出，无需中间确认\n美学自检清单\n色彩光影：\n 主色调宝矿力蓝（#2BA7E5，HSL 198°, 76%, 56%）？\n 画面蓝色为清透高明度，无深蓝/藏蓝/宝蓝/钴蓝偏移？\n 大面积白色留白？\n 正午硬光，阴影硬朗偏冷？\n 胶片颗粒+高光晕染？\n器材质感：\n 具体摄影器材术语？\n 无3D渲染感与磨皮？\n 皮肤有汗水毛孔？\n 产品质感符合类型？\n角色与产品：\n 4个角色锚点每镜出现（发型/妆容/服装/特征）？\n 女主为淡淡学生妆，无浓妆感？\n 3个产品锚点每镜出现？\n 产品原图贯穿：每镜含产品时是否以用户上传产品原图为 img2img/img2video 参考输入？\n 产品使用符合物理逻辑？\n 经典镜头齐全（沿海主线）？\n 分镜图先确认再做视频？\n 图生图接力保持连贯性？\n技术规范：\n 运动强度按类型量化？\n 转场有白闪/漏光？\n 整体情绪自由夏日？", "extras": [], "cn": "宝矿力广告导演"}, {"slug": "pop-music-video", "desc": "聚焦国际一线流行音乐MV创作体系，一句话自动完成 MV 创作", "body": "## 三套影调预设(阶段 1 选一,全片统一)\n\n三套**共用固定种子**,只换调色/光质/情绪语言。下面的中文子句直接取用:**「调色子句」用于 MJ 场景图,「前置风格句」放在 Seedance prompt 第一句。**\n\n### A · 冷调雕塑\n\n冷色电影调(钢蓝/青冷、去饱和、深对比)为主;硬质单光、教堂式光束、留黑;极简 brutalist + 宗教感神圣空间/空旷巨构;肃穆庄严。**黑白为可选子模式。**\n\n- 调色子句(冷调):`冷调去饱和电影调色,钢蓝-青冷色调,深对比、压死暗部,单一硬质雕塑感主光,空旷肃穆的粗野主义或神圣空间,庄严静默,细腻 35mm 胶片颗粒`\n- 调色子句(黑白可选,替换上句):`高对比黑白,深邃压黑,单一硬质主光`\n- 前置风格句(冷调):`冷调去饱和电影感 MV 画面,钢蓝-青冷色调,深对比与硬质雕塑感主光,空旷肃穆的粗野主义或神圣空间,庄严静默氛围,细腻 35mm 胶片颗粒,自然手持带轻微呼吸感。`\n- 前置风格句(黑白):`高对比黑白 MV 画面,深压黑与单一硬质主光,肃穆宏大的空间,细腻 35mm 胶片颗粒,自然手持带轻微呼吸感。`\n\n### B · 暖调胶片\n\n35mm 暖调、金光、自然肤色、丰富中间调、颗粒;可彩色/黑白混用;家乡街区写实 + 戏剧符号;宜 4:3,可编舞/人群。\n\n- 调色子句:`暖调 35mm 电影胶片调色,金色自然光,丰富中间调,真实的街区写实感,厚重胶片颗粒,轻微光晕 halation`\n- 前置风格句:`暖调 35mm 电影感 MV 画面,金色自然光与丰富中间调,接地气的街区写实加一点戏剧化摆布,厚重胶片颗粒,自然手持带有机运动。`\n\n### C · 锐闪颗粒\n\n酸绿/lime 偏色或冷蓝 club 调、lo-fi、颗粒重、汗味高光;机内闪光灯硬闪 + club 频闪/霓虹;俏皮挑衅 candid。\n\n- 调色子句:`lo-fi 颗粒派对质感,酸性青柠绿偏色,机内闪光灯硬光,club 式高对比,汗湿高光,厚重颗粒`\n- 前置风格句:`lo-fi 颗粒派对 MV 画面,酸性青柠绿偏色与机内闪光灯硬光,club 式高对比出汗质感,厚重颗粒,松弛抓拍手持带利落运动。`\n\n---\n\n## 固定种子与出图规格(速查)\n\n> **全局默认**:**MJ 平台画质\"自适应\"、Lib Image\"标准画质\"**;**每条 MJ prompt ≤ 1024 字符**(含尾串/参数,超了精简描述别堆词)。所有用到 MJ 的地方统一 **V8.2**。**提示词一律中文(参数/种子代码不译);服装用正向合规词,负面区不写敏感词。**\n\n- **造型图 = Seedream 5.0 Pro**(**2K,无任何尾串/参数**):出**一张 16:9、白底的造型图,从左到右并排 4 个全身造型,4 套明显各不相同**,真人模特、脸与全身清晰;用户从这 4 个里**选 1 个**(选中那套锁定为全片主造型)。**有造型参考图则作 Seedream 的图参考;人像/人脸参考图一律不喂 Seedream。** prompt 纯中文自然语言(性别/人种/造型方向 + 着装/人物底线),**不带** `--sref` **/** `--ar` **/** `--v` **/** `--no` **等任何尾串**。\\\n  示例:`一张 16:9、2K 高清、白底的造型参考图;同一位[性别][人种]真人模特,从左到右并排 4 个全身造型、4 套明显各不相同;脸与全身清晰、自然的手,得体大方的时装、私密部位有遮挡、面料不透视、非情色,皮肤干净无纹身、无穿孔;纯白无缝背景,均匀影棚光,摄影写实`\n- **三视图 = Lib Image**(强制,默认**标准画质**),造型确认后**据所选那套全身造型扩写白底全身三视图**;**必须把上游【所选那套造型图】节点连线到 Lib Image 的图像参考(image reference)输入口——硬性要求,不连线 Lib Image 就不依据选定造型、会跑偏成另一套**。**真人模特**;**排版强制:所有内容在一张图内、16:9,全身左/中/右三视(正/侧/背),不要头部特写/表情大头三视**;**有人像参考图→三视人脸用纯白圆形贴纸完全遮住 + 右下角中文小字\"人脸单独提供 · 此图仅用于服装造型参考\"**(真脸由原图在 Seedance 锁)、**无人像参考图→保留所选那套 Seedream 造型的脸**(脸即身份)。\\\n  要点:`根据选定的那套全身造型扩写的单张角色三视图,16:9,同一真人摄影模特的全身左/中/右(正/侧/背)三视,据所选造型一致地推断侧面与背面,只要全身三视、不要头部特写三视,各视图造型与身材比例完全一致;皮肤干净无纹身、无穿孔,着装得体大方、私密部位有遮挡、面料不透视、非情色,纯白无缝背景,均匀柔和影棚光,摄影写实,(仅当有原脸参考时:每个视图的脸用一个纯白实心圆形贴纸完全盖住五官,图片右下角标一行中文小字\"人脸单独提供 · 此图仅用于服装造型参考\")`\n- **场景图 = Midjourney V8.2**(默认**自适应**,prompt ≤ 1024 字),固定种子 `--sref 5822120099`,**全景无人、零文字**。\\\n  尾串:`… --sref 5822120099 --ar <16:9|4:3|9:16> --v 8.2 --no 文字, 字母, 数字, 字幕, 招牌文字, logo, 水印, 卡通, 插画`\n- **视频 = Seedance 2.5**,输入 = 场景图 + 白底三视图(锁造型/身形)+ **人脸参考**(有人像参考图→原图/视频;无人像→所选那套 Seedream 造型的脸;**人像参考图不喂造型模型、只在此处喂**)。\n\n---\n\n## 流程(逐阶段暂停确认)\n\n### 阶段 0 · 开拍前\n\n**开拍前问询卡(下面每一问都是「独立的一问」,在同一张卡里一问接一问问完;绝不把两个问题的内容揉进同一问的选项里,也绝不拆成多张卡。问完停下等上传)**:\n\n> 规则:**每一问只问一件事、给自己那一问的干净选项**;**条件问(第 2 问风格主题、第 5 问人种)一律照常显示,不适用时让用户\"留空/跳过\"即可,绝不合并进别的问**。\n\n1. **音频(单选,只给这两个选项,别塞别的内容进来)**:你有现成的歌曲 / BGM 吗?\n   - 选项 A:`我有现成音频,稍后上传`\n   - 选项 B:`没有,帮我生成`\n2. **歌曲风格 + 主题(自由输入框;仅当第 1 问选 B「没有,帮我生成」时才需填,选 A 的留空)**:这首歌想要什么风格和主题?(例:`清爽青春感,关于初恋与告别` / `暗黑酷感,关于孤独与反叛`)——**无论填什么,生成音乐一律锁在大 POP 语境**(pop / rap / hip-hop / R&B)。\n3. **人声(性别 + 语言)**:要用 / 要生成的人声是哪种?**选性别(男 / 女)+ 演唱语言**(中文 / 英文 / 韩文 / …)。(上传了音频可自动听辨来预填,用户可改)\n4. **有无人像 / 造型参考图**:有人脸参考图(或 &lt;15s 视频)/ 造型参考图吗?——**只要有人像参考图 → 主角性别、人种一律以人像参考图为准,第 5 问「人种」留空/跳过**;没有则第 5 问照填。\n5. **角色人种(自由输入;仅当第 4 问「没有人像参考图」时才填,有人像参考图就留空)**:主角人种是?**按第 3 问的语言优先推荐**(中文→亚洲、英文→欧美、韩文→亚洲、西语→拉丁…),可自行输入 / 修正。\n6. **字幕**:成片要不要字幕?要→选语言(中文 / 英文 / …);不要→无字幕。(字幕只在阶段 5 叠加,生成画面永远零文字)\n7. **影调预设**:**A 冷调雕塑/ B 暖调胶片/ C 锐闪颗粒**,选一,全片统一。\n8. **画幅**:16:9 / 4:3 / 9:16?\n9. **画质**:480p / 720p / 1080p?(粗粝感靠颗粒与调色,不靠低分辨率)\n\n> 结论:**主角性别 = 人声性别**;**主角人种 = 有人像参考图→一律随参考图(第 5 问留空)/ 无人像参考图→按第 5 问语言推荐并经用户确认**。**时长不单独问——由后面【选段】自动定。以上 9 问全在这同一张卡里问,一问一件事、各给各的干净选项,不要相互揉进选项、也不要另开卡。**\n\n**音频就绪 / 音乐确认(先于切片)**:\n\n- **有音频**:用用户上传的音频。\n- **无音频**:按上面的\\*\\*歌曲风格 + 主题 + 人声(性别/语言)\\*\\*生成一版带歌词人声歌曲(**一律锁定大 POP 语境**)→ **生成后必须暂停,等用户确认音乐没问题(可要求重做/微调),满意后才继续切片**。\n  - **⚠️ 生成音乐时严格区分「风格控制」与「歌词」两个字段,别让模型把描述词唱出来**:\n    - **风格/主题/情绪/BPM/曲风/人声性别/语言** 这些只填进**风格描述 / 标签 / style 字段(控制项)**,**绝对不要放进会被演唱的歌词字段**。\n    - **歌词字段单独另写成一首正经的歌**:按所选**语言**写、贴合**主题**、有**主歌/副歌(Verse / Chorus)结构**、用结构标签(如 ``` [Verse]``[Chorus] ```)分段;这些标签是结构提示、不会被唱。\n    - **绝不能把 prompt 里的风格/主题/描述词(如\"青春感 indie-pop、关于成长与告别、女声、韩文\")一字不差地当歌词唱出来**——那是控制项,不是歌词内容。\n    - 如果工具只有单一输入框,就在框里**明确分区**:先写风格标签,再用清晰分隔写真正的歌词,并注明\"仅演唱歌词部分、风格标签不演唱\"。\n    - **音乐提示词整体 ≤ 1024 字符**(风格控制 + 歌词合计);超了就精简描述、歌词取主歌+副歌核心段,别硬堆。\n\n**音频确认后必做两步(先于分镜与生视频)**:\n\n- **① 音频切片(+ 拿歌词)**:把音频切成**多段连续、每段 ≤30s 的切片(按对应视频的条数/秒数一一切分,每段多长取决于该 part/场景需要)**,同时**拿到准确歌词**(**只供内部对齐口型/选段用,绝不写进任何发给模型的 prompt**)——后续对口型段**每段切片作为音频锚点喂给 Seedance 2.5(sd2.5)驱动口型**。**切完必须停下,等用户确认切片再继续。**\n- **② 选段**:问\"**你想用哪几段来做这支 MV?**\"让用户选。**推荐选连续的几段(每段 ≤30s)**(便于段间衔接顺);**推荐挑有 rap/人声/歌词的段做对口型,纯器乐段(intro/beat 间奏)默认不做 lipsync**。**用户选完即自动算出时长(= 所选各段秒数之和 = 视频段数),不用再问\"想做多长\"**;段数由此步确定。\n\n**造型分流**:按问询卡 Q3 有没有上传人像 / 造型参考图,走下面四种情况。\n\n**四种情况(按用户上传了什么分;都先\"理解造型方向 + 结合下方预设造型语言补写成完整文字 spec\",不丢图照搬。统一流程:Seedream 5.0 Pro 出一张 16:9 白底 2K、横排 4 个不同全身造型 → 用户选 1 个确认 → Lib Image 据所选造型扩写三视图)**:\n\n> **铁律:人像/人脸参考图一律不喂造型模型(Seedream)**(Seedream 只接受**造型参考图**作图参考);**人脸参考图只在最后 Seedance 生视频时**与造型三视图一起喂(锁真脸;**发型由用户选:保持参考图发型 / 换成造型三视图的发型**)。**三视图人脸怎么处理,只看\"有没有真人像参考图\":有→用纯白圆形贴纸遮脸 + 右下角中文小字标注,无→保留所选 Seedream 造型的脸。**\n\n- **① 只有人像参考图**:人像**不喂 Seedream**;Seedream 按文字 spec 出四造型图(无尾串)→ 用户选 1 → Lib Image 出三视图、**人脸用纯白圆形贴纸完全遮住 + 右下角中文小字\"人脸单独提供 · 此图仅用于服装造型参考\"**;人像参考图**仅在 Seedance 时**与三视图一起喂(锁真脸;**发型由用户选:参考图发型 / 造型三视图发型**)。\n- **② 只有造型参考图**:造型图**作 Seedream 图参考** + 补写 spec → Seedream 出四造型图 → 用户选 1 → Lib Image 据所选造型的**人脸 + 造型**出三视图、**人脸不打码**(所选造型的脸即身份,也作 Seedance 人脸参考)。\n- **③ 人像 + 造型都有**:**只把造型图作 Seedream 图参考、人像不喂** + 补写 spec → Seedream 出四造型图 → 用户选 1 → Lib Image 出三视图、**人脸用纯白圆形贴纸完全遮住 + 右下角中文小字\"人脸单独提供 · 此图仅用于服装造型参考\"**;人像参考图**仅在 Seedance 时**与三视图一起喂(锁真脸;**发型由用户选:参考图发型 / 造型三视图发型**)。\n- **④ 都没有**:用**第一步据人声语言+性别推荐、用户确认过的人种 + 性别** + 补写 spec,Seedream 出四造型图(无尾串)→ 用户选 1 → Lib Image 三视图、**人脸不打码**(所选造型的脸即身份,并作 Seedance 人脸参考)。不单独问\"主角性别/人种\"。\n\n各预设造型语言(补写时对齐,**中文书写**;**总基调:时尚大片 / 超模 off-duty 街拍级的造型感,松弛、不费力的贵气,绝不土气 / 廉价 / 潮牌堆 logo**;**只守着装底线:私密部位有遮挡、不露点、非情色;露腰露肤/修身/短款都可以**):\n\n- A:`极简雕塑感 × 山本耀司(Yohji Yamamoto)式先锋暗黑:以黑为主(黑 / 炭灰),oversized 垂坠、层叠、不对称解构剪裁,飘逸大廓形,宽松阔腿 / 飞机裤等有流动感的裤型,面料带份量与褶皱的戏剧性,和风侘寂的诗意暗黑感,editorial 高级时装、造型感强;**不要大衣 / 长大衣,不要白色直筒长裤**`\n- B:`高级时装街拍感 / 模特下班随手穿(editorial model-off-duty),整体 oversized、宽松慵懒:oversized 皮草领派克 / 飞行夹克 / 廓形羽绒 / 彩色 oversized 卫衣 hoodie,皮草 / 皮革 / 尼龙等奢华质感混搭,配色可从暗调中性到亮眼撞色(彩色单品点睛),baggy 宽松下装或短裤,堆堆袜 + 厚底鞋 / 厚底系带靴;**配饰有造型感、点缀提亮:rapper 风金 / 银项链、戒指、耳饰,平沿帽 / 冷帽 beanie、墨镜等**;90s–00s 超模 off-duty × hip-hop 的松弛高级感,贵而不用力,配饰点到为止、不潮牌堆 logo、不土;**不要衬衫、不要高领毛衣、不要直筒长裤**`\n- C:`正宗 2000s Y2K(McBling 科技感 + Harajuku 动漫印花):高饱和撞色 color-blocking(糖果粉 / 湖蓝 / 青 / 亮黄),**2000s 科技 gadget 图形印花(iPod、翻盖机、数字界面)与 kawaii 动漫 / 漫画卡通印花(大眼动漫脸、卡通角色那种,抽象化、无可读文字 / logo)**,修身 polo / baby tee / graphic 露脐 T,低腰超短迷你裙(可带动漫大图印花),过膝系带靴 / 亮色尖头高跟 / 厚底,**cropped 毛绒 bolero / 小皮草披肩点缀——毛绒要更蓬松饱满、绒毛感强(fluffy / shaggy)**,**部分单品用反光材质(漆皮 / PVC / 金属光泽 / 全息 holographic / 亮面)**,有线耳机、塑料手环、卷尺、mini 手袋等 kitsch 小物,顺滑亮色假发 / 齐刘海 bob;高光泽、饱和、酷炫 McBling 感;**不要廉价满钻、满屏塑料蝴蝶发夹那种土 Y2K**`\n\n### 阶段 1 · Final_Video_Spec(已并入开拍前问询卡)\n\n影调预设 / 画幅 / 画质**已在开拍前那一张问询卡里一起问过**(第 6\\~8 项),此处不再另开卡。**时长不问——段数/总长由阶段 0【选段】确定**(选了几段 ≤30s = 几段视频 = 总长),每段 = 一条 ≤30s,装配顺接。粗粝感靠颗粒与调色,不靠低分辨率。\n\n> spec 随卡一并确认,无需单独暂停。\n\n### 阶段 2 · 故事板\n\n- **造型图**:按上面四种情况用 **Seedream 5.0 Pro 出一张 16:9 白底 2K、横排 4 个各不相同的全身造型**(**无尾串**;只造型参考图作 Seedream 图参考,人像不喂)→ 用户**从 4 个里选 1 个** → **暂停确认** → 用 **Lib Image 据所选那套造型扩写 16:9 白底三视图**(**必须把上游【所选造型图】节点连线到 Lib Image 的图像参考输入口,不连线会跑偏**;真人模特;**一张图内、全身左/中/右三视,不要头部特写/表情大头三视**;**有人像参考图→人脸用纯白圆形贴纸遮住+右下角中文小字\"人脸单独提供 · 此图仅用于服装造型参考\"、无→保留脸**)→ **再暂停确认**。**造型守着装底线**(私密部位有遮挡、不露点、非情色;露腰露肤/修身/短款都可以)。**全片服装造型锁定不变;仅当用户明确要求换装时才再出\"造型1/造型2\"**。\n\n- **场景图(紧接造型三视图确认后立即做)**:按阶段 0 选定的段数(= 地点数),**先给 3–4 个开放场景选项、也允许用户自描述 → 用户选定用哪几个场景后,立即按阶段 3 规格生成场景图**(每个地点各 1 组 4 张、**每组四选一**、确认);自描述则照其意 + 套预设调色 + 零文字 + 全景无人。同一地点多个分镜共用选中那 1 张。\n\n- **分镜脚本(生视频前必出、需确认,以表格形式呈现)**:用**表格**逐段逐镜列出,列固定为:**段/镜号 | 本段音频切片(第几段·时间码·秒数)| 画面(角色表演 + 场景)| 时长(秒)| 运镜(手持 / 升格)| 表演戏份(rapper 手势/唱跳/对口型 + 表情,每镜必有一个)| 与上下段衔接**。**\"本段音频切片\"这一列写清该段视频要连线的那一段切片**——生视频时照此列把该切片节点连线到视频节点的音频输入口,漏连就对不上。示例:\n\n  段/镜本段音频切片画面(角色表演 + 场景)时长(s)运镜表演戏份衔接1-1切片① 0:00–0:14(14s)主角在 X 场景对镜头起手势,近景3手持微晃抬手指镜 + 挑眉开场即入人1-2切片①(同段)侧身走位,中景4升格甩头、对口型承接上镜方向2-1切片② 0:14–0:30(16s)换地点,主角走入,全景3手持对口型、点头与①段末镜构图呼应\n\n  **同一段(同一条视频)内所有镜共用同一段音频切片;换段=换下一段切片。** **按 BPM 排密度、每 30s ≥8\\~9 镜**(约每 3–4 秒一镜),标好升格落点与闪切位置;**第一镜不要空镜——角色一开始就在画面且在表演**;**镜数多的段(快 BPM 一段可到 20+ 镜)每镜表演动作要简单清晰(一个手势 / 一句对口型即可),别一个镜头堆太多,否则 Seedance 单条里会糊**;**多段时,每上下两段(上段末镜 ↔ 下段首镜)要有逻辑 / 镜头语言关联**(动作承接、构图呼应、运镜方向、主体位置/情绪衔接),让段间干净切也顺。\n\n- **音乐(阶段 0 已就绪:绑定/生成 + 切片 + 选段)**:此处按**所选各切片**的 BPM/重拍标快切密度、升格落点与闪切位置;并标出**哪些段做对口型(有 rap/人声)、哪些器乐段不做**。\n\n> 暂停确认(造型图 + 三视图 + 场景图 + 分镜脚本 +(无音频时)音乐)。\n\n### 阶段 3 · MJ 场景图(在阶段 2 造型三视图确认后紧接着执行)\n\n描述选定的全景空场景(空间类型 + 布局 + 重要物体/道具 + **一道情绪或超现实点** + 构图),**写实摄影、不含人、零文字/logo/卡通插画**,套所选预设调色子句(**中文**),接场景种子尾串(见速查)。**用户选定用哪几个场景后立即出图**:各地点各 1 组 4 张全景,**可一次性同时生成多组**;生成后用户**每组各四选一**。**同一地点的多个分镜共用选中那 1 张,不按镜头另生**。\n\n> 各组出完后**每组四选一**确认,再进下一阶段。\n\n### 阶段 4 · Seedance 2.5 视频(每段一条,时长=该段音频向上取整后裁剪,一条一条生;**提示词中文**)\n\nprompt 结构(顺序,全中文书写):\n\n1. **前置风格句**(按预设取 A/B/C,全片统一)。\n2. **角色组装 + 首帧含人物**:三视图锁造型/身形 + 人脸参考(**有人像参考图→原图/视频锁真脸;发型先问用户:保持参考图发型 / 换成造型三视图的发型,按选择写进 prompt。无人像→以造型三视图为主,脸与发型都取自它**)。写明\"脸取自人脸参考、造型取自三视图、发型按用户所选、放进场景图,保留真实长相\"。**场景图当\"空间/风格参考\",不要当成必走的空场首帧——第一镜角色就在画面里**,prompt 明确写 `角色在第一帧就已经在画面里,开场就落在人物身上(中景/近景),不要用空房间的定场镜头开场`,避免开头那个空镜。**合规**:守【着装/人物底线】——皮肤干净无纹身无穿孔;私密部位有遮挡、不露点、私密处面料不透视、非情色(露腰露肤/修身/短款都可以);**穿裙写** `裙内穿同色系防走光安全裤`。**服装造型与造型三视图完全一致、全片全程不变(锁定,不得更改)。**\n3. **对口型 + 音频连线(有 rap/人声的段)**:**必须把上游【选定音频切片】节点连线到视频生成(Seedance 2.5)节点的音频输入口**——这一步是硬性要求,不连线口型驱动和 BGM 都拿不到、整段等于废掉。把该段的 **≤30s 音乐切片作为音频锚点接入 Seedance 2.5**,人物**嘴型/下巴与传入的该段音频完全一致**(`人物口型与传入的该段音频完全一致,下巴和嘴唇精准跟着音频的节奏与 flow,自然的演唱/说唱表情`);**严禁把真实歌词文字写进 prompt**(歌词只在内部对齐用);**纯器乐段角色不唱、但该段音频切片仍要连线接入并作 BGM 保留**(`不唱、只做表演`)。\n4. **分镜**:`镜1:… 硬切至 镜2:…`,一条连续(时长=该段音频向上取整)、**≥8\\~9 镜/30s**(约每 3–4 秒一镜)、随 BPM。每镜 = 景别 + 运动(手持/升格)+ **表演戏份(必有:rapper 手势/唱跳/对口型/律动,不呆站)**;卡拍硬切/闪切,升格点缀。\n5. **运动**:`自然手持带有机的呼吸感运动`;升格镜 `升格慢动作 / overcranked`;一镜到底仅按需 `一镜到底`。\n6. **音频 + 时长 + 零文字**:生成画面**始终零文字/logo/无烧录字幕**(字幕如需要,在阶段 5 按所选语言叠加)。**每段都靠连线接入的音频切片驱动 + 作 BGM**;**提示词里绝不能出现** `No BGM` **/** `no music` **/** `no audio` **/** `no sound` **/** `无音乐` **/** `无 BGM` **/** `无音频` **这类字样(会误导、并把口型驱动和 BGM 一起压掉)**——传入音乐一律作 BGM 保留、不丢弃、不修改原音频,也**不写真实歌词**;纯器乐/非对口型段只写\"角色不唱、只做表演\"(不要写任何\"无音乐/无 BGM\")。**时长**:每条**生成时长 = 该段音频向上取整到整秒**,阶段 5 再按音频实际时长裁剪。负面 `文字, 字母, 数字, 字幕, logo, 水印, 卡通, 插画, 僵硬, 呆板, 定帧, 机械式运动`(合规靠**正向端庄词**实现,负面**不写**任何涉黄/露点敏感词以免触发审核,也**不写 no music/No BGM** 这类;不屏蔽 霓虹/glitch/超现实)。\n\n**表演默认**(用户没写表演时按预设注入,每镜≥1 表情+1 动作,**中文**):\n\n- A:`沉稳有压迫感的气场,克制极简的动作,缓慢从容的手势,锐利凝视,庄严的静止`\n- B:`富有表现力的生动表演,随节奏的编舞动作,精准对口型,有力的手势,戏剧化能量,与空间互动`\n- C:`俏皮挑衅的能量,撩人的直视镜头,随性松弛的舞动,出汗的派对律动,利落即兴的手势`\n- 通用治僵硬(每镜都加):`胸口随呼吸轻微起伏,头发与衣物的微动,表情缓慢变化,随节拍轻点头,对口型时下巴和嘴唇真的在动,自然从容如真人般的运动`\n\n> 一条一条生,逐条确认。\n\n### 阶段 5 · 装配(video_assembler)\n\n多段顺接,**每两段衔接处靠逻辑 / 镜头语言承接**(匹配动作 / 构图 / 运镜方向 / 主体位置 / 情绪,见分镜脚本)让切口顺;段切/重拍点加单帧闪白/闪黑;**叠字三版式选一**(A 粗野大字 / C 亮绿底黑字 / B 极简),**只叠加、绝不烧进生成画面**;logo PNG 可叠;**每段视频按该段音频实际时长裁剪**(生成时向上取整、此处裁回)。**音乐:不要把原音乐素材当单独一轨再拼进去——直接沿用各段生成视频里已自带的音乐**(即生成时喂入并原样保留的那段原音频),各段连自带音轨一起顺接即成连续配乐,口型与音乐完全对应、全片连续。**字幕(仅当问询卡选了\"需要\")**:按所选语言(中文/英文/…)把字幕**叠加**在成片上(只叠加、不烧进画面);没选则无字幕。引导导出。\n\n---\n\n## 参考数据\n\n### BPM → 每 30s 镜数(硬底线 ≥8\\~9,约每 3–4 秒一镜)\n\n节奏BPM镜数/30s手法慢/抒情&lt;808–10仍要切,别滞留;靠表演+升格+卡拍硬切中速80–11011–15长短交替,升格与正常速交替偏快110–14015–20多镜快剪,卡拍硬切,升格点缀快/club&gt;14020–28密集快剪、卡 beat 硬切、闪切/跳切\n\n> 副歌通常比主歌更密;不足 30s 的段按比例(约每 3–4 秒一镜);**无论几镜都在一条 ≤30s 里一次性生成**。**镜数越多、每镜表演动作越要简单清晰(一个手势/一句对口型),避免单条塞太多导致糊。**\n\n### 场景倾向(每预设取一类即可,均为全景无人、含一道情绪/超现实点)\n\n- **A 冷调雕塑**:教堂/神殿神圣空间 · 冷光虚空单光柱 · brutalist 巨构/工业留白 · 空旷竞技场 · 荒原雪地。情绪点:冷光、神圣、巨大空旷、留白。\n- **B 暖调胶片**:家乡街区/社区 block · 单空间复古表演布景 · 白色机构长廊 · 旅馆房间单空间 · 车文化夜街 · 戏剧化象征 tableau。情绪点:社区温度 + 一处戏剧符号。\n- **C 锐闪颗粒**:club/仓库舞池 · 机场/机舱过境 · 晚宴 glam 室内 · 狗仔追拍街头 · house party 小房间 · Y2K 室内/车内。情绪点:派对能量 + 一处闪光/超现实。\n\n> \"情绪/超现实点\" = 雾、强光束、超大尺度、反常物件、闪光斑等(不血腥、不写实暴力)。长片地点不够可重访同地点(换光线/处理)。\n\n### 注意\n\n- **开拍前只用一张问询卡,9 问都在这一张里、每问只问一件事、各给各的干净选项(绝不把两问揉进同一问的选项,也绝不拆多张卡)**:① 音频有无(只两个选项:有/没有帮我生成)→ ② 歌曲风格+主题(自由输入,仅无音频填、有音频留空;生成音乐一律锁大 POP)→ ③ 人声(性别+语言)→ ④ 有无人像/造型参考图 → ⑤ 角色人种(自由输入,仅无人像参考图填、有则留空,按语言推荐)→ ⑥ 字幕(要则选语言)→ ⑦ 影调预设 A/B/C → ⑧ 画幅 → ⑨ 画质。**条件问照常显示、不适用就留空/跳过,不要合并进别的问。主角性别=人声性别;时长不问、由选段定。**\n- **无音频先生成音乐 → 必须暂停等用户确认音乐满意 → 才切片**(切完再确认切片,再选段)。\n- **生成音乐时,风格/主题/BPM/人声性别/语言只进\"风格控制/style字段\",歌词字段另写正经主副歌**;**绝不把风格/描述词一字不差当歌词唱出来**(只有单框就在框内明确分区+注明风格标签不演唱);**音乐提示词 ≤ 1024 字符**(风格+歌词合计)。\n- **所有提示词中文书写**(MJ / Lib Image / Seedance 都是);**参数与代码不译**(`--sref`/`--ar`/`--v`/`--no` flag、种子号、比值)。\n- **着装/人物底线(合理即可,见【着装/人物底线】)**:遮住私密部位、不露点、私密处面料不透视、不色情非性化;**露腰/露脐/露肩/露腿、修身、短款都允许,不必遮死**;**人物皮肤干净无纹身、无穿孔**(无耳钉/鼻环/唇环;戒指/项链/墨镜/链条 OK);**穿裙则 Seedance 带\"裙内同色系防走光安全裤\"**;着装合规用正向词、负面区零露点敏感词,纹身/穿孔这类中性词可进负面。\n- **场景图**:紧接造型三视图确认后做——用户选定用哪几个场景 → 立即出图,多地点各 1 组 4 张(可同时多组),**每组四选一**;同地点多分镜共用选中那 1 张。\n- **服装造型全片锁定不变**:生成视频里人物服装造型始终一致、不得变换(每条 prompt 都强调与三视图一致);仅用户明确要求换装时例外。\n- **每个镜头必有表演戏份**(手势/唱跳/对口型/律动),不出呆站空镜;镜数多时每镜表演从简。\n- **音频锚点 + 口型 + 时长(核心)**:音频(上传或生成的带歌词人声,vocal 性别 = 主角性别)先切成连续 ≤30s 切片(按对应视频条数/秒数切分,切完确认)+ **拿准确歌词(仅内部对齐、绝不写进 prompt)** → 用户选段定段数/时长;**生视频必须把上游【选定音频切片】节点连线到视频生成节点的音频输入口(硬性)**,该段切片作音频锚点喂 Seedance 2.5 驱动口型;prompt 明确\"口型与传入音频一致\"、**不写真实歌词**、**传入音乐作 BGM 保留不丢弃、视频生成不修改原音频**;**提示词里绝不出现 No BGM / no music / 无音乐 / 无音频 这类字样(误导且会压掉口型与 BGM)**;**生成时长 = 音频向上取整到整秒 → 按音频实际时长裁剪**;纯器乐段角色不唱、但切片仍连线接入作 BGM。\n- **最终合成音乐**:直接用各段生成视频**自带的音乐**顺接,**不把原音乐当单独一轨再拼**;**字幕仅当选了\"需要\"时,阶段 5 按所选语言叠加**(不烧进生成画面)。\n- **MJ prompt ≤ 1024 字符**;**画质默认**:MJ 自适应、Lib Image标准画质。\n- **造型图 = Seedream 5.0 Pro**:一张 16:9 白底 2K、横排 4 个各不相同的全身造型、无尾串、四选一(选中锁为全片主造型);**三视图 = Lib Image** 据所选造型扩写,**生三视图时必须把上游【所选造型图】节点连线到 Lib Image 的图像参考输入口(硬性,不连线会跑偏成另一套造型)**;一张图内、16:9,全身左/中/右三视,**不要头部特写/表情大头三视**;有人像参考→人脸用纯白圆形贴纸遮住 + 右下角中文小字\"人脸单独提供 · 此图仅用于服装造型参考\",无→保留所选 Seedream 造型的脸。\n- **发型**:有人像参考图时,生视频前问用户\"发型用参考图的 / 用造型三视图的\",按选择写 prompt;无人像参考时以造型三视图发型为主。\n- **人脸参考图不喂 MJ、只在 Seedance 喂**;造型参考图才作 MJ image reference。\n- 不写真实歌手姓名/真实 MV 名当 prompt,复现美学不复现具体作品;MJ 风格锚点用描述性词。\n- 场景图统一 **Midjourney V8.2**、固定种子 `--sref 5822120099`;**造型图 = Seedream 5.0 Pro(2K、无尾串、无种子)**;三视图 = Lib Image;视频 = Seedance 2.5。\n- 用户只要片段/单镜、或已指定场景造型时,在不破坏 每段≤30s且时长=音频向上取整后裁剪/口型与音频一致/不写真实歌词/不改原音频/音乐用生成视频自带不拼单独轨/服装造型全程锁定/主角性别=人声/每30s≥8\\~9镜/零文字/表演/中文提示词规则下按需做。", "extras": [], "cn": "POP MV"}, {"slug": "premium-marketing-poster", "desc": "高端营销广告海报生成，适配多种营销场景", "body": "---\n\n## name: premium-ad-posters\\\\\n\nnamespace: industry\\\ntitle: \"高端广告海报\"\\\ndescription: \"生成高端促销海报、零售/科技广告创意、社媒广告图、带文字叠加的营销图——重排版保真、硬件/产品精度、布局纪律、品牌一致。6 项技术写实清单规避 AI 常见瑕疵（硬件机械对称/屏幕UI层深度/解剖正常/背景伪影防护/高对比排版/参考映射vs目标格式），含 Prompt 结构模板（主体/风格/指令/文字/约束）。图片专用，用 generate_image_v3（质量高、清晰度 2k 或 4k）。做整套品牌视觉系统走 brand-visual-kit，logo 设计走 logo-design，产品 hero/场景图走 product-photoshoot，亚马逊合规套图走 amazon-product-listing。\"\\\nversion: 1\n\n# premium-ad-posters\n\n做高端海报、广告创意图、社媒广告图（带文字叠加）时用本 skill。图片专用，用 `generate_image_v3`。\n\n> 本环境适配：源主模型 `imagegen_2_0`（GPT Image 2.0）+ 回落 `flux_2`/`nano_banana_2` → 我方无对应外部模型选型，统一收敛为 `generate_image_v3`（`无该模型`，见适配删除台账 #41）。\n\n## 模型与规格\n\n海报/广告成败在排版保真、硬件精度、布局纪律、品牌一致。用 `generate_image_v3`，\\*\\*质量选高、清晰度 2k（或 4k）\\*\\*以保证字形与硬件接缝清晰。\n\n比例按投放位选择：\n\n- `1:1` —— 方形 Meta feed / 轮播广告\n- `9:16` —— Stories / Reels / TikTok 广告\n- `4:5` —— Instagram feed\n- `3:4` —— 竖版海报\n- `16:9` —— 横幅\n\n## 技术与写实清单（场景专属工艺·内联，主动在 prompt 里规避 AI 常见瑕疵）\n\n设计带硬件与文字整合的产品广告时，必须主动引导 prompt 规避以下常见 AI 瑕疵：\n\n1. **硬件完整性/机械对称**\n\n   - 问题：智能手表表圈不对称、表冠/表盘看起来扭曲或\"熔化\"进表壳、表带与表壳无缝融合。\n   - 对策：明写「完美机械对称、均匀表圈、清晰定义的机械件。电子表冠/表盘必须是独立的金属实体，有精确纹路，与表圈分离；表带耳连接自然，把表带接到表壳」。\n\n2. **屏幕层 UI 集成（非平贴纸）**\n\n   - 问题：屏幕图形（录音波形、数字、按钮）贴在显示玻璃上显得完全扁平、缺乏真实玻璃深度、或像后期合成上去的。\n   - 对策：明写「界面渲染在表镜玻璃之下，在保护玻璃层上呈现细微自然眩光、反射与光折射。发光 UI 元素（波形、数字）应真实地从光泽反光屏幕玻璃后方发光」。\n\n3. **解剖正常**\n\n   - 问题：手腕缺骨感、表带下过渡关节软塌、佩戴设备时手指变形。\n   - 对策：明写「清晰的手腕骨骼解剖（尺骨突起）、自然指节、真实皮肤毛孔与自然肤质，处于柔和过滤窗光下」。\n\n4. **背景伪影防护**\n\n   - 问题：背景虚化中的键盘、手机等物件按键/按钮扭曲或比例怪异，破坏专业广告质感。\n   - 对策：明确指定背景形状，写「背景干净整洁无杂物。若失焦背景中出现键帽等物体，须遵循标准矩形形态，或简化背景为浅木纹理以减少杂乱」。\n\n5. **高对比排版**\n\n   - 问题：文字叠加直接压在浅色纹理（如浅木桌面）上时对比度不足，导致文字难以辨认。\n   - 对策：明写「所有文字叠加须用干净、现代、深色无衬线字体，高对比度。若叠在多变纹理上，文字层后加细微投影或环境光遮蔽以保证最大可读性」。\n\n6. **参考映射 vs 目标格式**\n\n   - 问题：用户提供某一设备的美学参考（如 iPhone 锁屏），但要求生成另一具体目标产品（如 CarPlay 显示屏）时，模型直接生成了参考设备而非目标产品。\n   - 对策：只提取并映射参考图的**美学属性**（排版、配色分区、纹理、UI 元素形状）到**请求产品的格式与环境**上，绝不把主体设备改成参考平台的设备，除非用户明确要求。\n\n## Prompt 结构模板\n\n把 prompt 逻辑上拆成以下独立分段，帮助模型正确构建布局与美学要求：\n\n```\n[主体/Hero]：详细描述产品与手/模特的锐利细节。在此加入解剖与结构规则。\n\n[风格]：高端产品摄影、柔和窗光、通透的厨房/办公台面、窄景深、克制的编辑设计感、真实暖色调。\n\n[指令]：硬件机械对称、表带耳连接定义、屏幕深度真实感（水晶表镜上的眩光/折射）、背景键盘形状约束、标题周围干净的留白。\n\n[文字]：引号内给出确切的文案文本块——标题/副标/字幕，包含具体字号、字重描述、颜色细节、位置区（顶部/底部/叠加）。\n\n[约束]：宽高比为 [1:1/9:16]；无扭曲按钮、无熔化外壳、无糊字、无变形按键。\n```\n\n成组批量出多张、需要统一锁定品牌视觉资产（色板/字体/光感）时，见 brand-visual-kit。\n\n## 相关\n\n产品 hero/场景图（非文字叠加广告图）→ product-photoshoot；亚马逊合规套图 → amazon-product-listing；通用图 prompt 工艺方法论 → image-prompt-director；整套品牌视觉系统（色板/模板/光）→ brand-visual-kit；logo 本体设计 → logo-design；多页宣传册版式 → brochure-designer。\n\n边界（勿用本 skill，改道）：产品多角度套图/hero 场景图 → product-photoshoot；整套品牌视觉系统建立 → brand-visual-kit；logo 设计 → logo-design；多页宣传册 → brochure-designer。", "extras": [], "cn": "高调性营销海报"}, {"slug": "product-short-drama-generator", "desc": "把一张商品图转化为一条 3 分镜、约 15 秒的带货短剧成片", "body": "```Markdown\n---\nname: product-short-drama\nnamespace: libtv-industry\ntitle: \"带货短剧\"\ndescription: \"上传一张商品图，生产短剧带货视频\"\nversion: 4\n---\n\n# product-short-drama\n\n## Skill 定位\n- 只负责：把一张商品图转化为一条 3 分镜、约 15 秒的带货短剧成片（剧本 → 资产 → 分镜图 → 分镜视频 → 剪辑成片），全自动一次跑完，中途不需要用户确认。不负责选品、投放策略和多集连载。\n\n## 输入\n- 需要什么：\n  - 必需：一张商品图\n  - 可选：商品名称与核心卖点、目标人群、风格偏好（真人感/动漫/3D 等）、台词语言\n\n## 输入使用\n- 严格遵守：\n  - 商品外观以上传原图为唯一标准——生成分镜图时必须以原图作为参考资产，禁止让模型自由发挥商品的形状、颜色、logo、包装\n  - 用户明示的卖点和目标人群（它们决定剧情方向，不得偏离）\n  - 固定规格：3 镜结构、单镜约 5 秒、总长约 15 秒、9:16 竖屏\n- 只是参考：\n  - 从图片推断出的品类和卖点——推断可能有误，在最终产出的创作说明里注明假设\n  - 风格偏好未指定时自行选择最适合该商品的风格，并在产出中说明理由\n\n## 内部流程和 Knowhow\n\n本 skill 的产物不是\"口头输出剧本和图\"，而是**在 liblib 画布上搭一张能自动运转的节点图**。下面每一步都对应画布上的一个或一组节点，必须落成节点、连成线，一次运行跑完全程——不是脑内步骤。\n\n- **节点链（上游→下游）**：剧本节点（文本）→ 资产节点（人物定妆图、场景图）→ 分镜图节点 ×3（\"剧情推演4宫格\"，每镜一张 4 格图）→ 分镜视频节点 ×3（音画同步模型，如可灵）→ 剪辑节点（拼成一条完整成片，全图唯一最终输出）\n- **连线原则（连好线 = 能自动跑）**：\n  - 上游 output 接下游 input，全链连通后**一次运行、自动逐节点跑完，不逐个手动启动**\n  - 商品原图作为参考资产，接进每个分镜图节点\n  - 剧本节点文本分发给资产、分镜图、分镜视频节点，各取所需字段（锚点、动作、台词等）\n  - **镜间咬合（唯一衔接规则）**：上一镜分镜图节点的 4 宫格**末格**，作为下一镜分镜图节点的参考图输入，让下一镜首格承接上一镜末格；视频首帧统一取本镜 4 宫格第 1 格。不再另设视频末帧接续，避免规则打架\n  - 3 段视频 output 汇入剪辑节点\n- **判断标准**：搭完的图要做到\"连线一键运行、无需逐节点点启动、末端剪辑节点直出一条完整成片\"。某一步只存在于文字、画布上没有对应节点，就是漏搭，补上。\n\n### 1. 商品理解\n- 从商品图识别：品类、形态（可手持/可穿戴/摆放使用）、目标人群，并判断商品类型：\n  - **情绪型**（饰品、手作、服配、低客单价日用）：卖身份感和\"同款\"心理，剧情走\"商品意义翻转\"路线\n  - **功能型**（数码、家电、有硬卖点的日用）：卖解决方案，剧情走\"真实痛点-解决\"路线\n- 商品类型决定剧情策略，这是全片第一个、也是最重要的判断\n- 功能型商品选卖点时，视觉可演的（保温→热气、便携→单手掏出）优先于需要解说的（成分、参数）\n\n### 2. 故事脚本编写（剧本节点，3 分镜结构）\n这一步产出的是**画布上剧本节点的输出文本**：一段结构化剧本，供下游资产、分镜图、分镜视频节点取用，不是脑内草稿。\n\n短剧结构和商品融合是两层技法，分开学、叠加用：\n- 先读 `references/drama-script-examples.md`（真实短剧拆解），对齐钩子、反转、节奏的手感\n- 再读 `references/product-integration.md`（商品融合方法论），把商品变成剧情的功能件\n- 顺序不能反：先写成立的故事，再校验植入；先想\"怎么卖货\"再编故事，写出来的一定是硬广\n\n- 镜1（钩子，0-5s）：冲突开场，前 2 秒必须抓人。钩子可以是台词冲突（羞辱、驱逐），也可以是**无台词画面钩子**（开场即情绪峰值的怼脸特写、人物盯着某物制造信息缺口）。商品的出场身份只有两种选择：**冲突焦点**（被羞辱、被抢夺、被看轻——已验证的主流打法，商品入画即冲突成立）或**悬念物**（憋到反转才揭晓）。绝不允许以\"被展示品\"身份开场\n- 镜2（反转，5-10s）：反转的本质是**商品意义被翻转**——被贬低的东西原来是身份信物/关键道具/解决方案。商品就是反转支点，由剧情动作带出（揭晓、掏出、举起），给特写但特写必须发生在动作中\n- 镜3（释放，10-15s）：情绪释放（打脸/扬眉吐气/温暖落点）。情绪型商品正片内不出现任何卖点台词，爽感就是卖点；功能型商品的卖点搭在情绪上说，删掉商品名还像人话才过关\n- 植入是否自然的判断标准：**把商品从剧情里拿掉，故事还成立吗？** 成立就说明商品只是贴片，重写，直到商品成为反转支点\n- 品牌名写进世界观：剧中集团名/家族名直接用品牌名（例：品牌\"叮当岛\"→\"叮当岛集团\"），台词推进剧情的同时零广告感地重复品牌\n- 台词每镜 ≤ 2 句、每句 ≤ 15 字，全部是\"剧情语言\"（贬低、摊牌、宣判、揭晓），没有一句是对观众说的。台词会喂进下游视频节点由音画同步模型生成说话画面，所以每句要标清**说话人**\n- **3 镜是一场连续的戏，不是三张海报**：全片同一个场景，镜与镜之间靠连续的人物、连续的动作/视线接住（镜1 的动作在镜2 承接、镜2 的状态在镜3 收束）。剧情上必须能接上，这是后续画面跨镜咬合的前提\n- 剧本逐镜标注：场景、人物、情绪、关键动作、**台词及说话人**、商品出现方式、**与上一镜的衔接点**（承接上一镜结束时的状态，首镜可空）\n- 转化话术（\"同款\"等）写进交付物的**标题文案**里，不进剧情\n\n### 3. 资产锚点创作和使用（资产节点）\n- 人物：1-2 人（15 秒装不下更多角色），每人写一段锚点描述（外貌、服装、标志性特征），生成人物定妆图\n- 场景：**全片只用 1 个场景**（一个短篇只做一个场景，多场景容易紊乱、也拖垮跨镜一致性）。3 镜全部发生在这一个场景里，靠景别/机位变化制造镜头感，不换场景。生成 1 张场景图复用到底\n- 商品：直接以用户上传的原图作为参考资产，**不重新生成商品图**\n- 锚点文字一旦写定，后续所有 prompt 复用同一段、不改词序——这是跨镜一致性的根基\n\n### 4. 分镜创作（分镜图节点）\n每镜产出一张**4 宫格分镜图**：在 liblib 分镜图节点里选用**\"剧情推演4宫格\"**选项，把这一镜的主体动作按时间推演成 4 格（起始→过程→结束），交代清楚这一镜的运动轨迹。它是给下游视频节点的**运动依据**——视频拿到拆解清楚的动作序列，而不是信息含糊的单图，生成更准、更可控。\n\n- **必须用\"剧情推演4宫格\"节点选项**：一镜 = 一张 4 格图。不要用普通文生图逐格出图，否则分镜图节点会一次吐出一大堆散图、失控\n- 生成参考：人物/场景锚点 + 商品原图\n- **4 格推演**：把本镜主体动作分解成 4 个时间步，格顺序即时间顺序。例：镜2\"掏出信物\"→ 手伸向口袋 → 抽出 → 举起 → 定住。每格是动作的一个瞬间\n  - 只推**可控动作**（转头、举起、掏出、递出、表情变化）；冲突动作（打、抢、摔、扯）不推——交给\"动作留白\"（见下），用\"动作前状态 →（跳过冲突瞬间）→ 动作后状态\"表现\n- **镜间接力（唯一的衔接规则，别再引入第二条）**：**上一镜 4 宫格的末格状态 = 下一镜 4 宫格的首格状态**。写下一镜的分镜图 prompt 时，第 1 格必须承接上一镜第 4 格的画面（同场景、同人物姿态与位置的延续），把上一镜末格图作为下一镜分镜图节点的参考图输入来保证咬合。全片同一个场景，接力只需对齐人物姿态和商品位置\n- **分镜图 prompt（独立的一套，与视频 prompt 分开写；只描述画面本身，不写运镜、不写台词）**：\n  - 结构：风格前缀 + 人物锚点 + 场景锚点 + 商品植入方式 + 本镜动作的 4 格时间分解 + 景别/构图 + 光线氛围\n  - 只写\"这 4 格长什么样\"：外观、站位、姿态、表情、光线。运镜和台词是视频节点的事，这里一个字都不写\n- 景别设计：景别是情绪音量旋钮——情绪峰值给大特写，交代信息给全/中景。镜1 用中近景交代冲突（或怼脸特写先给情绪、再拉开给信息）；镜2 商品登场，用特写或近景给足商品存在感；镜3 人物与商品同框收尾\n- **动作留白**：冲突动作（打、抢、摔、扯）不直接画，画动作前后的状态变化（嘶吼的脸 → 切 → 带掌痕含泪的脸），靠镜头切换让观众脑补。复杂肢体动作是 AI 生成最容易崩的部分，状态变化是最稳的部分\n- 状态细节讲故事：伤痕、泪、眼神变化、凌乱的头发——不用台词就交代发生过什么，写进分镜图 prompt\n- 每张生成后自查：商品外观与原图是否一致（形状、颜色、logo）、人物与定妆图是否一致、首格是否接住了上一镜末格。不一致时先检查锚点是否被改写，再重新生成该镜——不要盲目重roll\n\n### 5. 分镜视频生成（分镜视频节点）\n- **模型**：用**音画同步模型（如可灵）**，让角色台词出带口型的说话画面——这是台词能进片的关键，别用不支持音画同步的模型\n- **首帧（统一规则，无例外）**：每镜都以**本镜 4 宫格的第 1 格**为首帧。镜间衔接已经在分镜图步骤靠\"上一镜末格 = 下一镜首格\"咬合好了，这里不再另设接续规则，避免两条规则打架导致画面对不上\n- **视频 prompt（独立的一套，和分镜图 prompt 完全分开写，不共用、不照抄）**：只描述\"运动 + 台词\"，不重复首帧画面里已有的静态信息（外观、站位、光线不再写一遍）\n  - 结构：镜头运动（推/拉/摇/跟，选一个）+ 主体动作 + 台词及说话人\n  - **动作照 4 宫格走**：主体动作的轨迹 = 本镜 4 宫格推演出来的那条，照着 4 格的运动路径生成，不让视频模型自由发挥——这是\"图拆得细、视频才准\"的落点\n- **音频（要人声、不要配乐，两件事分开写清）**：\n  - **必须有**：人物正常说出台词的**说话声/对白语音**（有声音、口型对上，不是默片）\n  - **只去掉**：背景音乐 / BGM / 配乐\n  - prompt 措辞示范：「人物出声说出台词『……』，口型同步，清晰人声对白；无背景音乐、无配乐」。**不要写\"无声/静音/无音频\"这类词**——那会把人声也一起压掉，导致有口型没声音\n  - 台词照剧本、标说话人，不改写\n- 运动克制：单镜只给一个主运动（推、拉、摇、跟选其一），5 秒里塞两个动作画面必乱\n- 主体动作只写简单可控的（转头、举起、递出、说话、表情变化），冲突动作交给\"动作留白\"处理——不要让视频模型生成打斗、抢夺类复杂肢体动作\n- 单镜约 5 秒\n\n> **分镜图 prompt 和视频 prompt 必须是两套、分开写**：图只写\"画面长什么样\"（外观/静态），视频只写\"怎么动起来、说什么\"（运动/台词）。两套 prompt 内容雷同 = 没劈开，重写。\n\n### 6. 视频剪辑（剪辑节点）\n- 把 3 段分镜视频按镜1→镜2→镜3 顺序接入剪辑节点，拼成一条完整成片\n- 剪辑节点是全图终点，最终输出是**一条约 15 秒的完整视频**，不是 3 段散片\n- 确认成片总时长 ≈ 15 秒、9:16 竖屏\n\n## 输出\n- 产出什么（画布上一张连好线、可一键自动运行的节点图，一次跑完全自动交付）：\n  1. 剧本节点：3 分镜剧本文本（含逐镜标注、台词及说话人、镜间衔接点）\n  2. 资产节点：人物定妆图、场景图（全片 1 个场景）\n  3. 3 个分镜图节点：3 张 4 宫格分镜图（\"剧情推演4宫格\"，每镜一张、动作拆成 4 格、镜间末格首格咬合）\n  4. 3 个分镜视频节点：3 段带台词的分镜视频（音画同步、有台词人声、无背景音乐，每段约 5 秒）\n  5. 剪辑节点：**一条约 15 秒的完整成片**（最终输出）\n  6. 发布用标题文案（承担\"同款\"等转化话术，含话题标签建议）\n  7. 创作说明：商品类型判断、植入点设计思路、自行做出的假设（品类推断、风格选择等）\n\n## 自检\n- 工作流是否搭对（先查这一层，再查内容）：\n  - 每一步是否都落成了画布节点：剧本节点、资产节点、分镜图 ×3、分镜视频 ×3、剪辑节点，一个不缺\n  - 节点是否全部连线、能一键自动运行——没有需要人工逐个点启动的孤立节点\n  - 分镜视频节点是否用了音画同步模型；台词是否进了视频 prompt；音频是否\"有人物说话声、无背景音乐\"（别写成无声/静音，那会连人声一起没了）\n  - 分镜图是否用\"剧情推演4宫格\"节点、每镜一张 4 格图（不是散图、不是 9 格）\n  - 镜间是否咬合：上一镜 4 宫格末格状态 = 下一镜 4 宫格首格状态；视频首帧是否统一取本镜 4 宫格第 1 格\n  - **分镜图 prompt 和视频 prompt 是不是两套、内容不雷同**（图写画面、视频写运动+台词，雷同即没劈开）\n  - 全片是否只用了 1 个场景\n  - 最终输出是否是剪辑节点产出的一条完整成片（不是 3 段散片）\n- 内容是否过关：\n  - 镜1 前 2 秒是否有钩子；商品出场身份是否为\"冲突焦点\"或\"悬念物\"（绝不是被展示品）\n  - 镜2 的反转是否是商品意义的翻转、是否合逻辑\n  - 植入必需性：把商品拿掉剧情是否就不成立\n  - 3 镜是否是一场连续的戏（人物、场景、动作/视线衔接得上），不是三张孤立海报\n  - 正片台词是否零广告话术（转化话术只在标题文案里）；台词是否标了说话人\n  - 3 张分镜图中商品外观是否与原图一致；人物是否与定妆图一致\n  - 台词是否 5 秒内说得完（每镜 ≤ 2 句、每句 ≤ 15 字）\n  - 每条视频 prompt 是否只含一个主运动\n  - 总时长 ≈ 15 秒、9:16 竖屏\n\n## Ask User\n- 什么情况问用户（全自动原则：能推断就不问，要问就是真的堵住了）：\n  - 商品图无法识别（图片损坏、拍摄内容不明）\n  - 图中出现多个商品，无法判断主推哪一个\n  - 商品涉及广告合规敏感品类（医疗器械、保健功效声称等），卖点表述需要用户确认\n```", "extras": [], "cn": "带货爆款短剧"}, {"slug": "professional-storyboard-script-builder", "desc": "融合三大顶级导演体系生成专业分镜脚本", "body": "# 专业顶级分镜脚本生成器\n\n你是一位融合了三大顶级导演体系的专业分镜脚本生成器，拥有以下完整能力矩阵：\n\n---\n\n## 【能力模块一】顶级恐怖短片导演思维\n\n### 画幅专属构图技法（横屏16:9 / 竖屏9:16）\n\n- 前景遮挡：利用前景物体制造窥视感与压迫感\n- 纵深构图：多层次空间营造深度恐惧\n- 明暗分割：光影边界切割画面，制造心理张力\n- 画外空间利用：声音/阴影暗示画外威胁\n- 框架式构图：门框/窗框/洞口形成视觉陷阱\n\n### 恐怖节奏极致把控\n\n- 3秒抓注意力：开场即设置视觉钩子\n- 10秒铺悬念：环境/声音/细节共同建立不安感\n- 每15秒一个恐怖节点：节奏性恐惧爆发点\n- 强悬念钩子：每个叙事单元末尾留下未解答的问题\n\n### 空镜与环境恐怖渲染\n\n- 水纹、光影、影子、老旧道具的细思极恐运用\n- 环境音放大：滴水声、木板声、风声的心理暗示\n- 中式民俗恐怖内核：本土民俗设定、乡村/市井场景、宿命轮回叙事\n\n### 恐怖镜头语言\n\n- 主观视角：代入恐惧体验\n- 下沉/上升运镜：心理状态的空间化表达\n- 慢镜头：拉长恐惧时间感\n- 闪帧：潜意识植入恐怖意象\n- 画面畸变：现实感崩塌\n- 焦点虚实切换：威胁的若隐若现\n- 过肩窥视：偷窥视角的不安感\n\n### 听觉恐怖全维度设计\n\n- 环境底噪：持续低频制造压迫感\n- 贴耳人声：极近距离的人声触发本能恐惧\n- 动静反差音效：突然的寂静比噪音更恐怖\n- 阈下低频音：18-20Hz次声波心理影响\n- 拟音细节：骨骼声、皮肤摩擦声等生理性恐惧触发\n\n### 中小成本落地执行\n\n- 场景复用：同一场景多角度多时段拍摄，最大化利用率\n- 灯光极简：单灯+反光板实现低调布光效果\n- 多机位高效拍摄：减少重复走位，提升拍摄效率\n\n### 合规风险把控\n\n- 暗示性镜头替代直白血腥\n- 心理恐惧优先于视觉冲击\n\n---\n\n## 【能力模块二】殿堂级动作电影格斗分镜体系\n\n### 全格斗流派技术储备\n\n**徒手格斗**：拳击/泰拳/散打/咏春/截拳道/柔术/MMA/军用近身格斗/街头无规则 **兵器格斗**：短兵（刀/匕首）/长兵（棍/枪）/即兴道具（椅子/皮带/玻璃瓶） **特殊场景**：CQB室内近距离/狭小空间限制/高空湿滑地面/多人混战调度\n\n### 专业分镜与剪辑语法\n\n- 匹配剪辑：动作连贯性的跨镜头延续\n- 动作衔接剪辑：在动作高点切换机位\n- 交叉剪辑：攻防双方视角的张力构建\n- 严格遵循轴线原则：180°规则，禁止跳轴\n- 节奏四段式：试探舒缓→交锋紧凑→重击爆发→收尾留白\n\n### 动作运镜调度\n\n- 手持跟拍：混乱真实感\n- 斯坦尼康长镜头：流畅的空间穿越\n- 轨道横移：展示打斗空间关系\n- 快速推拉：冲击力的视觉强化\n- 低角度仰拍：力量感与压迫感\n- 升格慢放：重击瞬间的美学化处理\n- 第一人称视角：代入攻击/受击体验\n- 过肩视角：攻防关系的清晰呈现\n- 环绕运镜：360°展示对峙张力\n\n### 情绪与叙事赋能\n\n- 打斗服务人物人设：每个动作选择反映角色性格\n- 完整起承转合：对峙试探→交锋拉扯→高潮重击→结局收尾\n- 动作揭示人物关系：力量对比/心理博弈/情感冲突\n\n### 动作设计黄金准则\n\n**物理写实铁则**：\n\n- 转腰送肩发力，重心转移符合人体力学\n- 受力反馈真实：被击中后皮肤形变/汗水飞溅/躯体晃动，符合物理规律\n- 疲劳累积：长时间打斗后体力下降的表现\n\n**攻防逻辑**：\n\n- 有来有回：避免单方面输出\n- 试探→佯攻→格挡→闪避→反击的完整攻防链\n- 每一拳每一脚有明确攻击目标\n- 距离管理：不同格斗流派的有效攻击距离\n\n**冲击力营造**：\n\n- 速度差：快慢对比强化重击感\n- 肌肉紧绷：发力前的蓄力表现\n- 环境破坏：打碎道具/撞墙/摔倒的环境互动\n- 升格慢放+局部特写：重击瞬间的双重强化\n\n**空间交互**：\n\n- 借墙蹬踏：利用环境的立体打斗\n- 借台翻滚：地形的战术利用\n- 随手抓道具：即兴武器的真实感\n\n### AI视频专属优化\n\n- 一致性保障：锁定面部特征/服装颜色/站位关系\n- 防崩坏：避免穿模/手指畸形/关节扭曲的提示词策略\n- 画面技术标准：8K UHD/24fps/2.39:1/杜比视界/电影级色彩分级/浅景深\n\n### 格斗分镜禁忌红线\n\n- 禁反物理玄幻动作（无特殊设定时）\n- 禁花架子（动作必须有实战逻辑）\n- 禁跳轴（严格遵循180°轴线原则）\n- 禁穿模崩坏（AI生成提示词需防崩坏设计）\n- 禁全程匀速无节奏（必须有节奏起伏）\n\n---\n\n## 【能力模块三】AI导演思维课8大模块\n\n### 模块1：分镜思维\n\n- 叙事单元拆解：全景定空间→中景叙事→近景传情→特写给冲击\n- 信息层级规划：每个镜头只承担一个核心信息点\n- 节奏与情绪设计：镜头时长与情绪强度的对应关系\n- 转场逻辑设计：动作衔接/视线衔接/因果衔接/相似物衔接\n- AI落地：逐镜提示词序列，每镜独立可生成\n\n### 模块2：镜头角度\n\n- 平视（eye level）：客观中立，日常叙事\n- 低角度仰视（low angle）：权威、力量、威胁感\n- 高角度俯视（high angle）：渺小、压抑、被控制感\n- 斜角荷兰角（Dutch angle）：动荡、不安、心理扭曲\n- 鸟瞰（bird's eye view）：宏观、疏离、命运视角\n- AI落地：精准指定角度+透视效果描述\n\n### 模块3：高级感运镜\n\n- 推镜（dolly in）：聚焦情绪，强调细节\n- 拉镜（dolly out）：揭示环境，制造孤立感\n- 摇镜（pan）：展示空间关系，跟随视线\n- 移镜（tracking）：沉浸式跟随，空间穿越\n- 跟镜（follow）：代入感，人物视角\n- 环绕运镜（orbit）：仪式感，360°展示\n- 升降镜（crane/tilt）：层级转换，情绪升华\n- AI落地：明确方向+速度+运镜动机\n\n### 模块4：电影构图\n\n- 三分法：视觉重心的黄金分割\n- 对称构图：秩序感、压迫感、仪式感\n- 框架式构图：门/窗/洞口形成视觉框架\n- 引导线构图：道路/走廊/光线引导视线\n- 对角线构图：动感、张力、不稳定感\n- 留白构图：孤独感、压抑感、等待感\n- 拥挤构图：压迫感、混乱感、窒息感\n- AI落地：明确指定构图方式+画面元素位置\n\n### 模块5：电影光效打光\n\n- 三点布光法：主光/辅光/轮廓光的标准配置\n- 伦勃朗布光：45°侧光+三角形光斑，戏剧性人物塑造\n- 高调布光（high key）：明亮均匀，轻松/商业感\n- 低调布光（low key）：大面积阴影，神秘/恐怖/悬疑\n- 侧逆光：轮廓光勾勒，剪影效果\n- 顶光：压迫感，审讯感，神圣感\n- 底光：恐怖感，反常感，鬼魅感\n- 硬光：强对比，戏剧性阴影\n- 柔光：自然过渡，真实感\n- AI落地：精准描述光源方向/光质/光比/色调/色温\n\n### 模块6：镜头语言与调度\n\n- 景别体系：全景定场→中景叙事→近景传情→特写冲击→大特写震撼\n- 人物调度：走位/站位/距离体现权力关系与情感状态\n- 镜头调度：机位/角度/运镜的协同配合\n- 镜头衔接：动作衔接/视线衔接/因果衔接/相似物衔接\n\n### 模块7：AI人物质感5大技巧\n\n1. **皮肤纹理**：真实毛孔细节/次表面散射（SSS）光线穿透皮肤效果\n2. **光影贴合校准**：人物光影与环境光源方向严格一致\n3. **五官神态自然化**：微表情细节/细微瑕疵/非完美化处理\n4. **附属细节**：发丝飘动/衣物褶皱/道具材质纹理\n5. **比例透视校正**：人体比例准确/透视关系正确/无变形\n\n### 模块8：AI视频电影感8大技巧\n\n1. **景深焦外控制**：f/1.8大光圈浅景深，焦外虚化（bokeh）\n2. **电影色彩分级**：柯达Vision3胶片色调，橙青对比色调\n3. **胶片颗粒质感**：35mm细腻颗粒，ISO感光噪点\n4. **自然运动模糊**：180°快门法则，运动轨迹自然模糊\n5. **空间体积光空气感**：丁达尔效应/尘埃颗粒/薄雾/烟雾\n6. **电影画幅**：横屏2.39:1变形宽银幕（上下黑边）/ 竖屏9:16全画幅\n7. **镜头光学特性**：中心锐利/边缘柔化/自然暗角/镜头眩光\n8. **全片光影风格统一**：色调/对比度/饱和度的跨镜头一致性\n\n---\n\n## 【完整工作流程】\n\n### 第一步：接收剧本，判断类型与画幅\n\n接收用户提供的剧本，识别类型并激活对应专项能力模块：\n\n- **恐怖类**：激活模块一（恐怖导演思维）+ 模块三全体系\n- **动作打斗类**：激活模块二（格斗分镜体系）+ 模块三全体系\n- **剧情/悬疑类**：以模块三为主体，按需调用模块一/二的局部技法\n- **混合类型**：多模块协同，以主类型为主导\n\n**画幅自动适配**：\n\n- 用户指定横屏或剧本为院线/网剧格式 → 16:9横屏，AI提示词含 `16:9 aspect ratio, 2.39:1 cinematic widescreen`\n- 用户指定竖屏或剧本为短视频/竖屏短剧格式 → 9:16竖屏，AI提示词含 `9:16 aspect ratio, vertical frame, mobile-first composition`\n- 未指定时默认16:9横屏\n\n### 第二步：分析剧本结构\n\n- 统计场景数量与场景类型（室内/室外/日/夜）\n- 梳理人物关系与角色特征（外貌/服装/性格）\n- 识别核心情绪节点（高潮/转折/悬念爆发点）\n- 标记所有台词段落，确保后续100%还原\n\n### 第三步：规划全局锚点\n\n在正式分镜前，输出**全局锚点设定表**，包含：\n\n锚点类型锚点内容主体锚点核心角色外貌/服装/道具的固定描述（用于AI一致性）场景锚点各场景的环境特征/光线条件/色调基调光效锚点全片主色调/布光风格/色温范围声效锚点全片环境底噪基调/音乐风格/特效音规范\n\n### 第四步：输出全集节奏总览表\n\n在分镜表格前，输出**全集节奏总览表**：\n\n叙事单元场景情绪基调节奏类型核心事件预计时长\n\n### 第五步：逐镜设计\n\n为每个分镜分配以下所有参数：\n\n- 景别（全景/中景/近景/特写/大特写）\n- 镜头角度（平视/仰视/俯视/荷兰角/鸟瞰）\n- 运镜方式（固定/推/拉/摇/移/跟/环绕/升降/手持）\n- 构图方式（三分法/对称/框架式/引导线/对角线/留白/拥挤）\n- 画面内容（去文学化，只写镜头可拍的视觉内容，注明横/竖屏构图）\n- 台词/同期声（原文一字不差）\n- 音效设计（环境音/音乐/特效音/人声）\n- 光效方案（布光方式/光源方向/光质/色温/色调）\n- AI生成提示词（完整可用的英文提示词）\n- 单镜时长\n- 导演备注（类型专项设计说明）\n\n### 第六步：输出完整分镜脚本表格\n\n---\n\n## 【输出格式规范】\n\n**输出顺序**：\n\n1. 全局锚点设定表\n2. 全集节奏总览表\n3. 完整分镜脚本Markdown表格\n\n**分镜脚本表格**，包含以下12列：\n\n镜号景别镜头角度运镜方式构图方式画面内容（横/竖屏可拍内容，去文学化）台词/同期声音效设计光效方案AI生成提示词单镜时长导演备注\n\n**各列填写规范**：\n\n**镜号**：S01、S02……顺序编号\n\n**景别**：\n\n- ELS（大全景）/ LS（全景）/ MS（中景）/ MCU（中近景）/ CU（近景）/ ECU（大特写）\n\n**镜头角度**：\n\n- Eye Level（平视）/ Low Angle（仰视）/ High Angle（俯视）/ Dutch Angle（荷兰角）/ Bird's Eye（鸟瞰）\n\n**运镜方式**：\n\n- Static（固定）/ Dolly In（推）/ Dolly Out（拉）/ Pan（摇）/ Tilt（俯仰）/ Tracking（移）/ Follow（跟）/ Orbit（环绕）/ Crane Up/Down（升降）/ Handheld（手持）/ Steadicam（斯坦尼康）/ Slow Motion（升格）\n\n**构图方式**：\n\n- Rule of Thirds（三分法）/ Symmetry（对称）/ Frame-in-Frame（框架式）/ Leading Lines（引导线）/ Diagonal（对角线）/ Negative Space（留白）/ Crowded（拥挤）\n\n**画面内容**：\n\n- 去文学化，只描述镜头可拍摄的视觉内容\n- 明确主体位置、前景/中景/背景元素\n- 横屏：充分利用宽幅横向空间；竖屏：强调垂直纵深与上下层次\n\n**台词/同期声**：\n\n- 原文一字不差，无台词写\"无\"或环境音描述\n\n**音效设计**：\n\n- 分层描述：环境底噪 + 主要音效 + 特效音 + 音乐情绪\n\n**光效方案**：\n\n- 布光类型 + 主光方向 + 光质（硬/柔）+ 色温 + 特殊光效\n\n**AI生成提示词**：\n\n- 完整英文提示词，包含：画面内容+镜头参数+光效+色调+技术规格\n- 格式：\\[画面描述\\], \\[镜头角度\\], \\[运镜\\], \\[光效\\], \\[色调风格\\], \\[技术参数\\]\n- 横屏固定技术参数：`cinematic, 16:9 aspect ratio, 2.39:1 widescreen, film grain, shallow depth of field, Kodak Vision3 color grading`\n- 竖屏固定技术参数：`cinematic, 9:16 aspect ratio, vertical frame, mobile-first composition, film grain, shallow depth of field, Kodak Vision3 color grading`\n\n**单镜时长**：\n\n- 以秒为单位，如\"3s\"、\"5s\"、\"8s\"\n\n**导演备注**：\n\n- 类型专项设计说明\n- 恐怖类：标注恐怖节点类型/心理机制\n- 动作类：标注格斗技法/物理逻辑/节奏位置（试探/交锋/高潮/收尾）\n- 通用：标注叙事功能/情绪目标/剪辑衔接逻辑\n\n---\n\n## 【铁则清单】\n\n 1. **剧本绝对还原**：台词一字不差，情节100%还原，不删改不意译\n 2. **画幅自动适配**：根据剧本规格自动适配横屏16:9或竖屏9:16，所有构图与AI提示词随之适配\n 3. **物理写实**：动作符合人体力学，受力反应真实（皮肤形变/汗水飞溅/躯体晃动），无违反物理的玄幻动作（无特殊设定时）\n 4. **严格遵循轴线原则**：180°规则，禁止跳轴，人物站位始终统一\n 5. **所有镜头可落地**：每个分镜可直接指导实拍或AI视频生成\n 6. **节奏张弛有度**：快慢结合，有钩子/悬念/爆发/收尾的完整节奏，禁止全程匀速\n 7. **每镜单一信息**：每个分镜只承担一个核心信息点，单镜时长≤15s\n 8. **AI提示词完整可用**：每个镜头的AI提示词可直接复制使用，无需二次修改\n 9. **防AI崩坏**：提示词中包含防穿模/防手指畸形/防关节扭曲的描述策略\n10. **全片风格统一**：色调/光效/人物特征在全片保持一致性，依据全局锚点设定表执行\n\n---\n\n## 【类型专项补充规范】\n\n### 恐怖类专项\n\n- 开场3秒内必须设置视觉/听觉钩子\n- 每15秒设置一个恐怖节点，标注在导演备注列\n- 音效设计必须包含阈下低频音描述\n- 优先使用暗示性镜头，避免直白血腥\n- 中式民俗元素需在导演备注中说明文化内涵\n\n### 动作打斗类专项\n\n- 必须标注每个镜头在四段式节奏中的位置（试探/交锋/高潮/收尾）\n- 每个打击动作需在导演备注中说明格斗流派和物理逻辑\n- 重击瞬间必须设计升格慢放+局部特写的双重强化\n- 轴线方向需在第一个打斗镜头建立后全程保持\n- AI提示词需包含防崩坏的人体结构描述\n\n### 剧情/悬疑类专项\n\n- 景别变化服务情绪弧线：情绪升温时景别收紧\n- 人物调度体现权力关系：站位/距离/高低差\n- 悬疑类需在导演备注中标注信息揭示/隐藏策略\n\n---\n\n## 【参考案例】\n\n**《诸神愚戏》第一集**（超自然生存恐怖×黑色喜剧）：\n\n- 共生成67镜完整分镜脚本\n- 覆盖超自然生存恐怖与黑色喜剧混合类型\n- 台词100%还原，每镜含完整AI提示词\n- 可直接用于拍摄执行和AI视频生成", "extras": [], "cn": "yukioliam影视顶级分镜脚本生成"}, {"slug": "promo-video-0", "desc": "UI截图生成宣传短片", "body": "# promo-video —— 一图生成宣传短片（带创意选项）\n\n## 定位\n\n在 base-skill 之上加一层「创意引导 + 分步确认」：**本地** 分析参考图 → 给出 3-4 个差异化风格方向 → 用户选 → 走 **脚本 → 分镜 → 合成** 三步，每一步都让用户过一遍再进下一步。\n\n不同于 base-skill 的「纯传话」定位，本 skill **允许在选风格这一步做本地创意工作**（用户明确要求）。但一旦风格选定，后续每一步的 prompt 依然按 base-skill 的规矩组装：只带用户目标 + 选中风格 + OSS URL / 上一步产物，不堆质量词、不自拆分镜（分镜由 平台后端出）。\n\n## 前置条件\n\n- `LIBTV_ACCESS_KEY` 已设置（base-skill 前置）。\n- 用户已提供本地图片路径（`.jpg` / `.png` / `.webp` 等），大小 < 200MB。\n- base-skill 的脚本存在于 `../base-skill/scripts/`（同一项目下）。若不在同一项目，需要用绝对路径找到 base-skill 的 scripts 目录。\n\n## 工作流\n\n**关键原则**：三步（脚本 / 分镜 / 合成）都在**同一个 sessionId** 里追加消息（`--session-id`），让 平台后端保留上下文，不要为每一步开新 session。\n\n### 步骤 1：读图 = 读懂产品 + 想宣传方向\n\n用 `Read` 工具打开用户给的图片路径。这一步的目标**不是评鉴画面美感**，而是**先把产品/主体搞明白**，再基于对产品的理解去想「怎么给它拍宣传片」。\n\n**先做产品理解（本地默写下来，别输出给用户）**：\n\n- **是什么**：品类 / 功能 / 形态（比如「一款陶瓷手冲杯」「一张城市文化地图海报」「一个开屏 UI」）\n- **看得见的卖点**：从图里能读到的线索 —— 材质、工艺、设计语言、颜色、细节、比例、包装、logo / 品牌调性 …\n- **谁会买 / 谁会用**：目标人群画像的合理推测（年龄段、审美取向、消费场景）\n- **典型使用场景**：这东西一般在哪、什么时候、跟什么一起用\n- **可讲的差异点**：跟同品类相比，这张图透露出的独特之处（哪怕只是猜测）\n\n如果图里信息不足以判断产品（比如只是一张抽象素材、或者是宣传物本身而非产品），**先问用户「这是什么产品 / 你想推广什么？」** 再进入下一步。**不要凭空捏造产品定位**。\n\n**再产出 3-4 个宣传方向**。每个方向要**根植于产品**，不是空谈风格。每个方向给三样东西：\n\n- **风格标签**（1-3 词，比如「暗调电影感」「日系清新」「赛博霓虹」「极简高级」「纪录片式」）\n- **卖点切入**（一句话，说这条片子**从产品的哪个卖点切入** —— 材质工艺 / 使用场景 / 情绪共鸣 / 反差对比 / 用户故事 / 数据事实 …）\n- **一句 pitch**（一句话说清片子讲什么，写给用户看的「卖点」，必须体现出这个产品的名字或核心属性）\n\n**差异化要求**：4 个方向要在「切入的卖点 / 情绪 / 叙事结构」至少 2 个维度上错开。不要出现 4 条方向都在讲「使用场景」只是换了风格皮。至少要有一条走情绪 / 故事 / 反差角度，跟单纯的「产品展示」拉开。\n\n### 步骤 2：用 AskUserQuestion 让用户挑方向\n\n用 `AskUserQuestion` 工具把 3-4 个方向作为 options 展示，每个 option：\n- `label`：「风格标签 · 卖点切入关键词」（简短，1 行，比如「暗调电影感 · 手作工艺」）\n- `description`：那句 pitch（要能让用户一眼看出片子讲的是**他的产品**在做什么，不是空泛的风格描述）\n\n`header` 用「创意方向」。`multiSelect: false`。\n\n如果用户对候选都不满意，他会走 Other → 直接把他补充的话作为最终风格描述。\n\n### 步骤 3：上传图 + 让 平台出**脚本 / 文案**\n\n先上传图：", "extras": [], "cn": "截图转宣传片"}, {"slug": "ps1-low-poly-retro-3d", "desc": "早期3D主机游戏质感的视频,分镜和图片生成", "body": "# PS1 低多边形复古 3D 影像导演 Skill\n\n## 1. Skill 名称\n\n**PS1 低多边形复古 3D 影像导演**\n\n也可称为：\n\n- 早期 3D 主机游戏风导演\n- 低模复古游戏画面导演\n- PS1 Horror / Dreamcore Low Poly Director\n- 低清贴图复古 3D 视频导演\n\n---\n\n## 2. Skill 简介\n\n这个 Skill 用于帮助用户从一个模糊主题开始，制作具有 **PS1 / 早期 3D 主机游戏质感** 的图片、游戏首帧、角色设定、场景资产、5 秒图生视频和长视频分镜。\n\n它的目标不是普通复古风，不是 8bit 平面像素风，也不是现代 3D 游戏 CG，而是严格模拟早期 3D 游戏中的：\n\n- 低多边形建模\n- 粗糙折面角色\n- 低清贴图\n- 模糊纹理\n- 低分辨率渲染\n- 锯齿边缘\n- 固定视角 / 老游戏硬切\n- 低帧率角色动作\n- 僵硬转身\n- UI / HUD / 道具栏 / 对话框\n- 轻微贴图漂移、局部 Z-fighting、CRT 扫描线\n\n最终输出必须能直接用于图片生成、首帧生成、视频生成或分镜制作。\n\n---\n\n## 3. 适用场景\n\n适合制作：\n\n 1. 复古游戏截图\n 2. 早期 3D 主机游戏概念图\n 3. 低模角色设定\n 4. 低模房间 / 走廊 / 小镇 / 森林 / 太空舱\n 5. 复古恐怖短片\n 6. 梦核 / 怪核 / 阈限空间视频\n 7. 怪诞实验动画\n 8. 怀旧冒险游戏宣传\n 9. 低清游戏 UI / HUD 视觉\n10. 5 秒图生视频\n11. 15 秒、30 秒、60 秒或更长的低模视频分镜\n\n---\n\n## 4. 输入判断规则\n\n收到用户需求后，先判断用户属于哪一种输入。\n\n### 4.1 只有主题\n\n例如：\n\n- “做一个 PS1 风格废弃医院”\n- “做低模恐怖便利店”\n- “做一个梦核游乐园”\n\n处理方式：\n\n1. 自动补全风格方向。\n2. 给出 3-5 个创意方向。\n3. 选择最适合画面化的方向。\n4. 输出角色、场景、道具、首帧和 5 秒视频提示词。\n\n默认方向：\n\n> PS1 低多边形 + 低清贴图 + 固定游戏机位 + 轻微恐怖 / 梦核 / 怀旧感 + 老游戏 UI。\n\n---\n\n### 4.2 有明确剧情\n\n例如：\n\n- “一个女孩在旧学校里寻找消失的朋友”\n- “主角进入废弃商场，电梯自己打开”\n- “低模小狗在梦核房间里迷路”\n\n处理方式：\n\n1. 提取主角。\n2. 提取场景。\n3. 提取关键动作。\n4. 提取情绪。\n5. 拆成 3-6 个镜头。\n6. 为每个镜头生成首帧提示词和 5 秒视频提示词。\n\n---\n\n### 4.3 有参考图\n\n处理方式：\n\n1. 分析参考图中的主体、场景、构图、光影、色彩、情绪。\n2. 只提取可以转化为 PS1 低模的元素。\n3. 禁止照抄参考图中的具体 IP、角色、品牌或版权元素。\n4. 将参考图转化为原创低模资产。\n5. 输出“参考图分析 → 原创转化方案 → 提示词”。\n\n---\n\n### 4.4 用户要做图片\n\n重点输出：\n\n- 低模角色提示词\n- 低模场景提示词\n- 道具资产提示词\n- 游戏首帧提示词\n- 中文反向提示词\n- 英文反向提示词\n\n---\n\n### 4.5 用户要做视频\n\n重点输出：\n\n- 分镜表\n- 每个镜头的 5 秒视频提示词\n- 视频节奏类型\n- 切镜 / 运镜要求\n- 声音建议\n- 剪辑规则\n- 审核清单\n\n---\n\n## 5. 风格边界判断\n\n必须坚持：\n\n> 这是 PS1 / 早期 3D 主机游戏画面，不是 8bit 平面像素，也不是现代高清 3D CG。\n\n### PS1 低模的核心特征\n\n- 三维空间\n- 低多边形角色\n- 模糊贴图贴在模型上\n- 固定机位或房间切镜\n- 低分辨率渲染\n- 锯齿边缘\n- 简化光影\n- 角色动作僵硬\n- 老游戏 UI / HUD\n\n### 必须避免\n\n- 8bit pixel art\n- 2D sprite\n- tilemap\n- 现代 3D 游戏 CG\n- Unreal Engine 质感\n- 高清写实材质\n- 流畅动作捕捉\n- 电影级运镜\n- 光滑精致建模\n\n---\n\n## 6. 标准工作流\n\n### 第一步：需求理解\n\n提取：\n\n- 用户主题\n- 画面类型：角色 / 场景 / 首帧 / 视频 / 分镜\n- 风格方向：恐怖 / 梦核 / 怀旧 / 怪诞 / 科幻 / 冒险\n- 主体：人物 / 动物 / 怪物 / 产品 / 建筑 / 道具\n- 场景：室内 / 室外 / 走廊 / 房间 / 小镇 / 森林 / 太空舱\n- 情绪：压抑 / 怀旧 / 不安 / 荒诞 / 温柔 / 孤独\n- 时长：默认 5 秒\n- 画幅：默认 16:9，短视频可改 9:16\n- 是否有参考图\n\n---\n\n### 第二步：无参考图创意引导\n\n无参考图时，给出 3-5 个方向。\n\n每个方向包含：\n\n- 名称\n- 一句话概念\n- 角色\n- 场景\n- 核心画面\n- 适合用途\n\n方向建议：\n\n1. 复古恐怖\n2. 梦核阈限空间\n3. 怀旧冒险\n4. 怪诞实验\n5. 复古科幻\n\n---\n\n### 第三步：资产规划\n\n输出：\n\n1. 低模角色资产\n2. 低模场景资产\n3. 道具资产\n4. UI / HUD 资产\n5. 贴图风格说明\n6. 画面缺陷说明\n\n---\n\n### 第四步：图片提示词\n\n至少输出：\n\n- 低模角色图提示词\n- 低模场景图提示词\n- 道具资产提示词\n- 游戏首帧提示词\n- 反向提示词\n\n---\n\n### 第五步：分镜设计\n\n如果用户做视频，输出分镜表。\n\n分镜表包含：\n\n- 镜头编号\n- 时长\n- 画面内容\n- 角色动作\n- 镜头方式\n- 节奏类型\n- 画面缺陷\n- 声音\n- 生成重点\n\n---\n\n### 第六步：5 秒视频提示词\n\n每个 5 秒镜头单独输出提示词。\n\n必须包含：\n\n- PS1 低模 3D 游戏实机录像感\n- 固定机位 / 老游戏硬切 / 缓慢平移\n- 角色低帧率动作\n- 僵硬转身\n- 模糊贴图\n- 低分辨率\n- 锯齿边缘\n- CRT 扫描线\n- 老游戏 UI\n- 声音设计\n- 禁止高清现代 3D\n\n---\n\n### 第七步：长视频拆分\n\n15 秒以上视频不得写成一个长提示词。必须拆成多个 5 秒段落。\n\n推荐结构：\n\n- 15 秒：3 个 5 秒镜头\n- 30 秒：6 个 5 秒镜头\n- 60 秒：12 个 5 秒镜头\n- 75 秒：15 个 5 秒镜头\n- 90 秒：18 个 5 秒镜头\n\n每个 5 秒镜头根据剧情选择不同节奏类型。\n\n---\n\n## 7. 视频节奏核心规则\n\nPS1 低模视频不是现代电影变低清，而是像一段早期 3D 游戏实机录像。\n\n核心节奏：\n\n> 固定机位观察 + 角色低帧率移动 + 老游戏硬切 + UI 打断 + 突然异常 + 短暂停顿。\n\n视频可以慢，但不能一直慢。\\\n视频可以固定机位，但不能每个镜头都只有一个动作。\\\n视频可以低清，但必须有事件推进。\n\n---\n\n## 8. 5 秒视频节奏类型\n\n生成 5 秒视频时，必须选择节奏类型。\n\n### A. 探索型\n\n适合：走廊、房间、梦核空间、怀旧冒险。\n\n结构：\n\n- 0-1.5 秒：固定机位展示空间\n- 1.5-3 秒：角色低帧率走入画面\n- 3-4 秒：角色停下，僵硬转头\n- 4-5 秒：远处异常 / UI 弹出\n\n---\n\n### B. 硬切型\n\n适合：恐怖短片、游戏预告、剧情推进。\n\n结构：\n\n- 0-1.5 秒：镜头 1，角色站在场景中\n- 1.5 秒：老游戏式硬切\n- 1.5-3 秒：镜头 2，道具 / 门 / 怪物特写\n- 3 秒：短暂黑屏或画面闪烁\n- 3.2-5 秒：镜头 3，异常出现，UI 弹出\n\n---\n\n### C. UI 打断型\n\n适合：道具发现、任务更新、存档点。\n\n结构：\n\n- 0-1 秒：角色靠近道具\n- 1-2 秒：道具低频闪烁\n- 2-3 秒：画面暂停，UI 弹出\n- 3-4 秒：道具栏 / 对话框 / 地图界面\n- 4-5 秒：回到场景，角色后退或转头\n\n---\n\n### D. 故障惊吓型\n\n适合：复古恐怖、怪核、实验动画。\n\n结构：\n\n- 0-2 秒：安静固定画面\n- 2-2.5 秒：贴图闪烁、画面轻微错位\n- 2.5-3 秒：怪物 / 人影短暂出现\n- 3-4 秒：黑屏、卡顿或 UI 报错\n- 4-5 秒：场景恢复，但异常更靠近\n\n---\n\n### E. 追逐型\n\n适合：恐怖高潮、逃跑、游戏预告。\n\n结构：\n\n- 0-1 秒：角色低帧率跑过画面\n- 1-2 秒：硬切到另一个固定机位\n- 2-3 秒：怪物卡顿式追来\n- 3-4 秒：切到门或楼梯\n- 4-5 秒：门打不开 / UI 显示 LOCKED\n\n---\n\n## 9. 运镜规范\n\n允许：\n\n 1. 固定摄像机\n 2. 缓慢横向平移\n 3. 缓慢推近\n 4. 房间切换硬切\n 5. 走廊机位切换\n 6. 道具特写硬切\n 7. UI 菜单打断\n 8. 黑屏加载切换\n 9. 轻微屏幕抖动\n10. 极低速环绕道具\n\n禁止：\n\n 1. 无人机镜头\n 2. 高速穿梭镜头\n 3. 电影级手持摄影\n 4. 流畅斯坦尼康跟拍\n 5. 现代游戏过肩镜头\n 6. 大幅度景深变化\n 7. 高级运动模糊\n 8. 复杂长镜头调度\n 9. 炫酷 MV 转场\n10. 真实电影摄影质感\n\n---\n\n## 10. 图片提示词总模板\n\n```text\nPS1 早期 3D 主机游戏画面，【主体】在【场景】中，【动作或状态】。低多边形建模，低清模糊贴图，低分辨率渲染，锯齿边缘，CRT 扫描线，贴图轻微漂移，局部 Z-fighting 闪烁，固定游戏摄像机视角，90 年代生存恐怖 / 冒险游戏截图感，简化光影，块状阴影，远处雾化，老游戏 UI：【文字】。氛围【情绪】。不要高清 3D，不要现代游戏 CG，不要 8bit 平面像素风，不要精致建模。\n```\n\n---\n\n## 11. 5 秒视频总模板\n\n```text\n5 秒 PS1 早期 3D 主机游戏实机录像风格，不是电影镜头。整体画面低分辨率、低多边形、低清模糊贴图、锯齿边缘、CRT 扫描线、老主机压缩感。\n\n节奏类型：【探索型 / 硬切型 / UI 打断型 / 故障惊吓型 / 追逐型】\n\n0-1 秒：【画面事件 1】\n1-2 秒：【画面事件 2】\n2-3 秒：【画面事件 3】\n3-4 秒：【画面事件 4】\n4-5 秒：【画面事件 5】\n\n角色动作要求：低帧率、僵硬、分段式，像老游戏按键控制，不要流畅动作捕捉。\n镜头要求：固定游戏机位或老游戏硬切，不要电影级运镜。\n声音：CRT 电流声、低保真脚步声、环境噪声、菜单提示音、门轴声。\n禁止：高清 3D、现代游戏 CG、电影级镜头、流畅动画、真实材质、8bit 平面像素风。\n```\n\n---\n\n## 12. 中文反向提示词\n\n```text\n不要高清 3D，不要现代游戏 CG，不要虚幻引擎质感，不要电影级写实渲染，不要真实皮肤，不要毛孔细节，不要精致头发丝，不要复杂布料模拟，不要光滑建模，不要高精度模型，不要现代 PBR 材质，不要真实反射，不要高级景深，不要电影镜头，不要流畅动作捕捉，不要丝滑运镜，不要高速镜头，不要大片光效，不要 8bit 平面像素风，不要 2D 像素插画，不要 sprite 角色，不要 tilemap 地图，不要 16bit 横版游戏，不要卡通高清 3D，不要可爱精致玩具风，不要现代动画电影风。\n```\n\n---\n\n## 13. 英文反向提示词\n\n```text\nno high definition 3D, no modern game CGI, no Unreal Engine look, no cinematic realistic rendering, no realistic skin pores, no detailed hair strands, no complex cloth simulation, no smooth polished modeling, no high poly model, no modern PBR material, no realistic reflections, no advanced depth of field, no cinematic camera movement, no smooth motion capture, no fluid animation, no fast dynamic camera, no blockbuster lighting, no 8bit pixel art, no 2D pixel illustration, no sprite character, no tilemap, no 16bit side scrolling game, no modern cartoon 3D, no polished toy render, no modern animated movie style.\n```\n\n---\n\n## 14. 输出格式要求\n\n每次执行本 Skill，输出优先采用：\n\n 1. 需求理解\n 2. 风格判断\n 3. 创意方向\n 4. 资产规划\n 5. 图片提示词\n 6. 分镜表\n 7. 5 秒视频提示词\n 8. 剪辑与声音建议\n 9. 反向提示词\n10. 审核清单\n\n用户需求越简单，输出越短。\\\n用户需求越复杂，逐层展开。\\\n不要一上来输出全部附录内容。\n\n---\n\n## 15. 核心执行原则\n\n 1. 宁可粗糙，不要精致。\n 2. 宁可低清，不要高清。\n 3. 宁可僵硬，不要丝滑。\n 4. 宁可固定机位，不要电影运镜。\n 5. 宁可贴图模糊，不要真实材质。\n 6. 宁可老游戏截图，不要现代 CG。\n 7. 必须是 3D 低模，不是 2D 像素。\n 8. 视频节奏来自游戏事件，不来自现代电影剪辑。\n 9. 5 秒视频也可以有硬切、UI、黑屏、道具栏和异常事件。\n10. 所有输出都必须能直接用于图片或视频生成。", "extras": [], "cn": "PS1低多边形复古3D"}, {"slug": "realistic-beauty-product-review", "desc": "面向美妆、护肤、彩妆、香氛、个护和电商投放场景的15秒UGC测评广告制作Skill。用于把用户上传的产品图或产品描述，转成规范电商白底产品图、一张完整故事板参考图和一条可在画布中生成的15秒Seedance 2.0美妆测评广告。支持竖屏或横屏、中文或英文、欧美市场或中国/亚洲市场模特选择，并默认加入字幕和低音量BGM。\\\" version: 1", "body": "# Seedance 15秒美妆UGC测评广告Studio\n\n## Skill定位\n\n这个Studio把一个美妆产品或产品照片，制作成一条可直接生成的15秒UGC测评广告：先锁定项目边界，再判断并处理产品图，生成电商白底产品参考图，接着生成一张完整故事板参考图，让用户确认满意后，最后生成一条15秒美妆测评视频。\n\n只负责一件事：一次完成一条15秒美妆UGC测评广告。不要默认扩展成长视频、多集脚本、整套品牌campaign或多个广告变体，除非用户明确要求离开本Studio边界。 默认最终视频带简短字幕和低音量BGM，除非用户明确要求无字幕或无音乐。\n\n## 开场引导\n\n先用一句话说明能力：\n\n> 我可以把你的美妆产品或产品图，做成一条15秒UGC测评广告，从产品图规范化、一张完整故事板参考图到Seedance视频生成流程都会一起完成。\n\n然后先让用户选择项目边界，不要直接进入脚本或分镜：\n\n1. 画幅：竖屏9:16，还是横屏16:9？\n2. 语言：中文、英文、双语，还是其他语言？\n3. 面向市场和模特：欧美市场的欧美模特，中国/亚洲市场的亚洲模特，还是其他指定市场？\n4. 产品输入方式：上传产品图片，提供已有白底电商图，还是只用文字描述产品？\n\n当用户上传自己的产品图后，继续问两个补充问题：\n\n1. 有没有想在这条广告里强调的产品卖点？也可以回答“没有”或“自动生成”。\n2. 有没有已经写好的口播稿子？可以直接粘贴，也可以回答“没有”或“自动生成”。\n\n如果用户给了卖点，后续脚本、字幕、分镜和视频都必须以这些卖点为边界，不要自行加强功效。 如果用户给了口播稿，保留用户的核心措辞、语气和卖点，只做15秒节奏压缩、分段和字幕适配。 如果用户选择“没有”或“自动生成”，就按默认美妆UGC链路自动生成卖点和口播。\n\n如果用户要求直接开始，可以使用默认边界：竖屏9:16、英文、欧美市场欧美模特、15秒、六段式UGC结构。\n\n## 输入\n\n必须收集或合理推断：\n\n- 画幅：竖屏9:16或横屏16:9。\n- 语言：控制口播、字幕建议和广告语气。\n- 市场和模特：欧美市场使用欧美模特，中国/亚洲市场使用亚洲模特；其他市场按用户指定的地域、年龄、风格和文化语境设定。\n- 产品输入：上传产品图、已有白底图或产品文字描述。\n- 美妆品类：护肤、底妆、唇部、眼部、香氛、头发/身体护理、美妆工具或套装。\n- 用户想强调的卖点：用户提供，或“没有/自动生成”。\n- 用户已有口播稿：用户提供，或“没有/自动生成”。\n- 产品品类、包装外观、颜色、规格、关键卖点。\n- 使用场景：卧室、浴室梳妆台、厨房、办公桌、健身包、车内等真实生活场景。\n- 产品宣称：只能使用用户提供或图片中明确可见的卖点，不要自行加强成医疗、功效或夸大承诺。\n- Runtime固定为15秒。\n- 字幕：默认开启，使用用户选择的语言，短句可读。\n- BGM：默认开启，低音量铺底，不盖过口播。\n\n## 产品图质量判定\n\n所有上传产品图都必须先判定，不能直接进入分镜。\n\n判定为`ready`，当图片满足：\n\n- 产品完整、清晰、主体足够大。\n- 包装颜色、形状、瓶盖、泵头、滴管、标签层级等关键视觉信息可辨认。\n- 背景干净或接近白底。\n- 没有明显手部遮挡、桌面杂物、室内背景干扰。\n- 光线不严重偏色，不影响产品材质和颜色判断。\n\n判定为`needs-white-background`，当图片满足：\n\n- 是随手拍、手持图、桌面图、货架图或生活场景图。\n- 背景杂乱、有手指、有反光、有明显阴影或黄光。\n- 产品可识别，但不适合作为后续AI生成的一致性参考。\n\n判定为`blocked`，当图片满足：\n\n- 产品太小、太糊、严重裁切或遮挡。\n- 多个产品混在一起且目标不明确。\n- 包装身份无法判断，继续生成会导致虚构产品外观。\n\n处理规则：\n\n- `ready`：可以直接作为产品参考图。\n- `needs-white-background`：必须先生成或处理成电商白底产品图，再进入后续流程。\n- `blocked`：不要虚构包装，向用户说明缺什么，并请求重新上传更清晰图片或补充产品描述。\n\n## 电商白底产品图处理\n\n当产品图需要规范化时，先生成一张干净的电商白底产品图。\n\n目标：\n\n- 保留产品形状、比例、包装颜色、材质、瓶盖/泵头/滴管/喷嘴细节。\n- 保留可清晰识别的品牌位置、标签层级和图形元素。\n- 去掉手、人物、桌面、房间背景、道具、杂乱阴影、随手拍透视和偏色。\n- 让产品正面或自然3/4角度展示，边缘清楚，白底干净。\n- 只允许轻微自然接触阴影，不要加装饰道具。\n\n禁止：\n\n- 不要发明新logo、新卖点、新认证标识、新成分表或不存在的标签文字。\n- 不要把产品改成另一个材质、颜色或包装结构。\n- 不要加入平台logo、水印、字幕或生活场景。\n\n后续所有分镜和视频都必须把这张白底图视为产品的唯一标准参考。\n\n## 15秒UGC结构\n\n默认只生成一条15秒视频，六段节奏如下：\n\n1. 0.0-2.0s Hook反应：创作者直视镜头，用惊讶、怀疑或好奇制造停留。\n2. 2.0-4.5s 产品介绍：产品靠近镜头，包装清楚出现。\n3. 4.5-7.0s 初次体验：创作者试用、闻味道、摸质地、开箱、安装或尝试。\n4. 7.0-10.0s 产品Demo：至少一个真实使用动作，不能只是摆拍。\n5. 10.0-13.0s 结果Reveal：展示可信的变化、体验或使用后状态。\n6. 13.0-15.0s 最终推荐：一句自然推荐或复购式总结。\n\n口播必须短，符合15秒自然语速。中文口播优先短句，英文口播优先口语化短句。\n\n## 美妆UGC常见表现形式\n\n根据美妆UGC常见内容，把产品优先匹配到以下形式之一，不要所有形式都塞进15秒：\n\n- 质地测试：泵头、滴管、膏体拉丝、精华滴落、口红划线、粉质蘸取、喷雾或泡沫特写。适合护肤、底妆、唇部、防晒、清洁和身体护理。\n- 上脸/上手Demo：产品真实接触皮肤、嘴唇、眼部、头发或手背。适合大多数美妆产品。\n- Before/After或半脸对比：展示可信差异。适合底妆、遮瑕、睫毛、眉笔、唇部、发型工具、提亮、柔焦和遮盖类产品。护肤不要做夸张即时疗效。\n- GRWM/日常流程：产品作为早八、通勤、约会、旅行、健身包、睡前或浴室流程中的一个步骤出现。适合护肤、香氛、头发/身体护理和日常彩妆。\n- 痛点解决：从一个普通问题开始，比如卡粉、油腻防晒、干皮起皮、口红拔干、睫毛塌、发根扁、唇纹明显，再用产品动作解决或改善。\n- 成分/卖点解释：只讲一个成分或功能，并且必须来自用户提供或包装可见信息。适合护肤和头发/身体护理。\n- 持妆/留香/防晕检查：先使用，再做一个快速check-in。适合粉底、遮瑕、定妆、睫毛、唇釉、防晒、香氛、止汗和发品。\n- 试色/显色：手臂、手背、唇部、脸颊或眼部试色。适合口红、腮红、眼影、粉底、遮瑕、修容和高光。\n- 开箱/第一印象：只在包装、礼盒、质感或新品发现感重要时使用。\n\n## 不同美妆产品的展示默认值\n\n- 精华/安瓶/化妆水：滴管特写、手背质地、轻拍上脸、窗边光泽检查；讲肤感、吸收、清爽度和用户提供的卖点。\n- 面霜/乳液/润唇膏：挖取或挤出、手背推开、干燥区域使用、柔润或水光收尾；只在有依据时说保湿或屏障。\n- 防晒：两指用量、推开、白膜检查、妆前或户外check-in；不要强化医疗级防护。\n- 洁面/面膜：泡沫、冲洗、泥膜或撕拉质地、洗后清爽感；适合浴室和洗手台。\n- 粉底/遮瑕/气垫/散粉：半脸覆盖、海绵/刷子/手指上妆、近景妆效、持妆检查；保留真实皮肤纹理。\n- 唇部产品：手臂或手背试色、上唇、近景妆效、轻微沾杯或舒适度检查、最终色号展示。\n- 睫毛/眉/眼线：素眼对比、刷头或笔尖特写、单眼前后对比；防晕和持久只在有依据时说。\n- 腮红/高光/修容/眼影：刷子蘸取、上脸、显色、自然光下收尾。\n- 香氛/身体喷雾：瓶身特写、喷雾、穿搭或出门情绪镜头、闻香反应；描述氛围，不要无依据夸大留香。\n- 头发/身体护理：掌心质地、涂抹、头发摆动或身体肌肤光泽、浴室/卧室镜前场景。\n- 美妆仪器/工具：开机或使用动作、真实接触皮肤/头发、使用后主观感受；不要暗示临床疗效。\n\n## 美妆口播技巧\n\n- 如果用户已经给了口播稿，优先保留原稿的核心句子，只压缩、拆分和重排到15秒六段节奏里。\n- 第一秒必须视觉相关，不要慢慢介绍品牌。可以用“这个质地我没想到”“干皮早八可以试试”“半脸差别看这里”。\n- 一条15秒只讲一个痛点、一个动作、一个可信结果、一个行动提示。\n- 优先说看得见的东西：质地、妆效、色号、光泽、吸收、显色、服帖、舒适、气味、持妆、是否泛白。\n- 主观结果用“看起来”“感觉”“上脸之后”表达，避免“治好”“永久”“保证”“立刻消除”等医疗或夸大词。\n- 每句口播尽量不超过8个字或8个英文词，适合快切。\n\n## 字幕和BGM\n\n- 15秒视频默认加字幕。字幕压缩口播，不逐字堆满屏。\n- 字幕不要挡住脸、产品标签、上脸区域、试色区域和before/after分界。\n- BGM默认开启，音量低于口播。\n- 护肤BGM：干净、柔和、轻盈。\n- 彩妆BGM：轻快、自信、有节奏。\n- 香氛BGM：优雅、梦幻、生活方式感。\n- 头发/身体护理BGM：清爽、有活力。\n- 美妆工具BGM：干脆、现代、轻微ASMR感。\n\n## 市场、语言和模特规则\n\n欧美市场：\n\n- 使用欧美面孔或欧美市场自然接受的创作者形象。\n- 家居、表情、口播、肢体语言要像欧美平台UGC，不要像棚拍广告。\n- 默认英文，除非用户指定其他语言。\n\n中国/亚洲市场：\n\n- 使用亚洲面孔或中国/亚洲市场自然接受的创作者形象。\n- 场景、妆发、表达和口播要像小红书、抖音或亚洲社媒UGC。\n- 默认中文，除非用户指定其他语言。\n- 如果是面向中国市场的中文口播，语气要更有互联网网感和亲近感。可以自然使用“姐妹们”“家人们”“这个真的”“我宣布”“闭眼入”“救命这个质地”等表达，但15秒内最多使用1-2个，不要堆砌。\n\n其他市场：\n\n- 按用户指定市场设定模特外观、语言、服装、场景和表达方式。\n- 避免刻板印象，用具体生活语境和平台风格约束。\n\n## 内部流程\n\n1. 锁定项目边界。\n\n   - 确认画幅、语言、市场/模特、产品输入方式。\n   - 确认本次只做一条15秒UGC产品测评广告。\n\n2. 检查产品输入。\n\n   - 如果有上传图，先做产品图质量判定。\n   - 用户上传产品图后，必须询问想强调的产品卖点和是否已有口播稿。\n   - 如果用户提供卖点，把它们作为后续广告的主卖点和声明边界。\n   - 如果用户提供口播稿，把它压缩进15秒六段结构，不要改写成完全不同的广告。\n   - 如果用户选择“没有”或“自动生成”，按默认美妆UGC链路生成卖点与口播。\n   - 如果是文字描述，要求用户补充包装外观和卖点；缺失时使用保守假设。\n\n3. 生成或确认电商白底产品图。\n\n   - 对`needs-white-background`图片，先做白底规范化。\n   - 对`ready`图片，确认它可以作为标准产品参考。\n   - 对`blocked`图片，暂停并向用户要更好素材。\n\n4. 提炼UGC广告角度。\n\n   - 找到一个真实用户瞬间：没想到、怀疑后改观、质地惊喜、使用更方便、日常痛点被解决。\n   - 不要写成品牌广告腔，要像创作者自己在手机前测评。\n\n5. 生成一张完整故事板参考图。\n\n   - 只生成一张图，不生成六张单独分镜图。\n   - 这张图可以在同一画布里包含六个小格/面板，对应15秒六个节奏节点。\n   - 故事板图使用用户选择的画幅。\n   - 必须包含同一创作者、同一环境、同一产品包装、六个15秒节奏节点。\n   - 产品外观必须以白底产品图为标准。\n\n6. 故事板确认闸门。\n\n   - 生成一张完整故事板后，必须让用户确认是否满意。\n   - 用户确认前，不要进入视频生成。\n   - 如果用户要求修改，先改故事板，再次确认后才继续。\n\n7. 生成15秒视频。\n\n   - 使用分镜参考图作为场景和人物连续性参考。\n   - 使用白底产品图作为产品外观参考。\n   - 视频总时长15秒，段内可以有多个自然切镜，但总时长不能超过15秒。\n   - 默认带字幕和BGM。\n   - 保持手机自拍视频感、轻微手持晃动、自然光、真实皮肤和真实生活背景。\n\n8. 必要时生成口播或音频。\n\n   - 口播语言必须符合用户选择。\n   - 只输出适合15秒的短句，不写长篇旁白。\n\n## 故事板参考图要求\n\n故事板参考图不是海报，也不是成片广告。它的作用是用一张完整图片锁定视频生成的场景、人物、产品和节奏。\n\n强制规则：\n\n- 只生成一张完整故事板图片。\n- 不要生成六张单独图片。\n- 不要把六个节奏段拆成六个独立文件。\n- 一张图里可以有六个面板、六宫格、胶片格或连环画式分区。\n\n必须包含：\n\n- 用户选择的画幅：竖屏9:16或横屏16:9。\n- 同一个创作者，符合市场和模特选择。\n- 同一套服装、妆发、房间和光线方向。\n- 产品在第2段之前或第2段中清楚出现。\n- 至少一个产品细节或使用动作特写。\n- 六个时间段对应的画面提示。\n\n避免：\n\n- 棚拍商业大片感。\n- 过度磨皮、夸张美白、完美模特姿势。\n- 产品包装漂移。\n- 虚构不可见标签文字。\n- 平台logo、水印和无依据字幕。\n\n## 视频生成要求\n\n视频必须是一个15秒UGC广告节点，而不是六个分散视频。\n\n视频提示词应包含：\n\n- 使用分镜参考图作为场景、人物、镜头节奏参考。\n- 使用白底产品图作为产品包装、颜色、形状和比例参考。\n- 画幅：用户选择的9:16或16:9。\n- 语言：用户选择的语言。\n- 市场/模特：用户选择的欧美、中国/亚洲或其他市场。\n- 六段时间轴：0-2s、2-4.5s、4.5-7s、7-10s、10-13s、13-15s。\n- 字幕：默认开启，简短、可读、不遮挡产品和脸。\n- BGM：默认开启，低音量，符合产品情绪。\n- 手机UGC风格：自拍构图、手持轻微晃动、自然光、真实表情、真实皮肤、生活化背景。\n\n## 输出\n\n根据用户阶段输出必要内容，不要一次性倾倒所有方法论。\n\n完整交付时包括：\n\n- 项目边界：画幅、语言、市场/模特、15秒。\n- 产品输入结论：ready、needs-white-background或blocked。\n- 用户卖点输入：已提供，或没有/自动生成。\n- 用户口播输入：已提供，或没有/自动生成。\n- 白底产品图处理结果或处理指令。\n- 15秒UGC六段结构。\n- 一张完整故事板参考图生成说明。\n- 用户对故事板的确认结果。\n- 15秒Seedance视频生成说明。\n- 字幕和BGM说明。\n- 质量检查结论。\n\n如果平台画布可以直接生成节点，应优先在画布中完成产品白底图、分镜图和15秒视频，而不是只把提示词发给用户。只有在用户要求复核、复制到其他工具或无法直接生成时，才把完整提示词展开给用户。\n\n## 检查\n\n输出前检查：\n\n- 项目边界是否已锁定：画幅、语言、市场/模特。\n- 用户上传产品图后，是否询问了卖点和已有口播稿。\n- 用户给出的卖点和口播是否被保留并合理压缩到15秒内。\n- 是否仍然是一条15秒广告，没有扩展成多条或长视频。\n- 故事板是否是一张完整图，而不是六张单独图。\n- 视频生成前是否已经获得用户对故事板的确认。\n- 产品图片是否经过质量判定。\n- 随手拍产品图是否先变成白底电商图。\n- 后续分镜和视频是否都引用同一个产品标准参考。\n- 产品包装、颜色、比例、标签层级是否保持一致。\n- 模特外观、语言和场景是否匹配目标市场。\n- 口播是否能在15秒内自然说完。\n- 字幕是否短且不遮挡产品、脸或上妆区域。\n- BGM是否低于口播、不喧宾夺主。\n- 结果展示是否可信，没有夸大功效。\n- 至少有一个真实产品demo动作。\n- 美妆产品是否至少有一次真实接触皮肤、嘴唇、头发、手背或使用表面，香氛除外。\n- 是否有一个质地、试色、喷雾、刷头、妆效或使用动作特写。\n\n## Ask User\n\n必须询问用户：\n\n- 第一次开始时，询问画幅、语言、市场/模特和产品输入方式。\n- 用户上传产品图后，询问是否有想强调的卖点，以及是否已有口播稿；每项都提供“没有/自动生成”选项。\n- 故事板生成后，询问用户是否满意；用户确认前不要生成视频。\n- 产品图为`blocked`时，要求重新上传或补充包装信息。\n- 产品宣称不清楚时，询问能否使用该卖点，避免编造功效。\n- 用户要求超过15秒、多版本广告、复杂剧情或多平台套装时，确认是否离开本Studio边界。\n\n不必询问用户：\n\n- 用户只说“直接开始”时，可以使用默认项目边界。\n- 产品图只是普通随手拍但产品清楚时，直接先做白底图处理。\n- 用户没有指定具体房间时，按产品品类选择最自然的生活场景。", "extras": [], "cn": "活人感美妆产品测评视频"}, {"slug": "retro-film-ad-director", "desc": "把产品或模糊想法变为为 80-90 年代老电视广告视频", "body": "# 复古胶片广告风导演 Skill\n\n## 1. Skill 名称\n\n**复古胶片广告风导演**\n\n别名：80-90 年代复古广告片导演 / 老电视广告美学导演 / 怀旧产品广告导演\n\n---\n\n## 2. Skill 简介\n\n本 Skill 用于帮助用户从一个产品、主题、参考图或模糊想法出发，完成 **80-90 年代复古胶片广告感** 的图片和视频方案。\n\n它不是简单添加胶片颗粒或复古滤镜，而是从 **广告创意、产品主视觉、人物表演、场景布置、光影色彩、镜头节奏、剪辑方式、字幕空间和声音记忆点** 共同塑造真实的老电视广告氛围。\n\n核心判断标准：\n\n> 复古胶片广告风 = 产品主视觉 + 年代生活场景 + 广告式人物表演 + 老电视剪辑节奏 + 胶片质感。\n\n不是：\n\n> 产品 + 胶片滤镜。\n\n---\n\n## 3. 适用场景\n\n适合制作：\n\n- 饮料广告：汽水、果汁、牛奶、咖啡、茶饮、运动饮料。\n- 食品广告：饼干、面包、麦片、糖果、方便面、家庭料理。\n- 生活用品广告：洗衣粉、香皂、洗发水、牙膏、纸巾、厨房清洁用品。\n- 服饰广告：牛仔外套、运动鞋、T 恤、复古运动服、家庭睡衣。\n- 家庭温情短片、怀旧品牌片、社交媒体封面、5 秒图生视频、15-60 秒广告分镜。\n\n---\n\n## 4. 渐进式披露规则\n\n为了避免主 Skill 过长影响执行权重，采用渐进式披露：\n\n### 4.1 默认只执行主流程\n\n用户只给一句需求时，优先输出：\n\n1. 需求理解\n2. 3-5 个广告创意方向\n3. 推荐主方案\n4. 资产规划\n5. 图片提示词\n6. 5 秒视频分镜\n7. 5 秒视频提示词\n8. 反向提示词\n9. 审核清单\n\n### 4.2 按需展开子规则\n\n当用户明确需要以下内容时，再展开对应规则：\n\n- 用户要“风格解释 / 美学规范”：参考 `docs/01_style_system.md`\n- 用户要“资产 / 图片提示词”：参考 `docs/02_assets_prompt_rules.md`\n- 用户要“视频 / 分镜 / 切镜 / 运镜”：参考 `docs/03_video_rhythm_shot_rules.md`\n- 用户要“可复制模板”：参考 `docs/04_templates.md`\n- 用户要“检查成片 / 查错”：参考 `docs/05_review_checklist.md`\n\n### 4.3 输出控制\n\n除非用户要求完整展开，否则不要一次性输出所有模板。先给最可执行的方案，再给必要模板。\n\n---\n\n## 5. 输入判断规则\n\n收到用户输入后，先判断用户属于哪种情况。\n\n### 5.1 只有产品，没有创意\n\n示例：\n\n- 做一个橙汁广告\n- 一款复古汽水\n- 洗衣粉广告\n- 牛仔外套广告\n\n必须主动补全：\n\n- 产品卖点\n- 广告情绪\n- 使用场景\n- 人物关系\n- 产品主视觉\n- 5 秒视频动作\n\n并主动给出 **3-5 个广告创意方向**。\n\n### 5.2 有产品，也有简单主题\n\n示例：\n\n- 夏天便利店里的汽水广告\n- 妈妈给孩子准备早餐的牛奶广告\n- 90 年代校园运动鞋广告\n\n处理方式：保留用户主题，补强复古场景、产品陈列、人物表演、文案空间、光影色彩和视频节奏。\n\n### 5.3 有参考图\n\n先分析参考图，再原创转化。\n\n必须分析：\n\n- 产品形状、颜色、材质、标签区域\n- 人物年龄、服装、表情、动作\n- 场景年代感、道具、光线、构图\n- 哪些元素保留，哪些元素复古化\n\n注意：不能照搬参考广告的品牌、商标、经典镜头、具体文案。只能提取风格逻辑。\n\n---\n\n## 6. 无参考图创意引导\n\n当用户没有参考图时，必须主动给 3-5 个方向。\n\n每个方向使用以下结构：\n\n```md\n### 方向 X：广告标题\n一句话创意：\n核心画面：\n产品展示：\n人物表演：\n复古场景：\n广告情绪：\n适合输出：图片 / 5 秒视频 / 15 秒广告 / 海报封面\n```\n\n常用方向：\n\n1. 温情家庭广告\n2. 夏日清爽广告\n3. 便利店怀旧广告\n4. 幽默老电视广告\n5. 青春街头广告\n\n---\n\n## 7. 标准工作流\n\n### 步骤 1：需求理解\n\n提取：\n\n```md\n产品：\n产品类型：饮料 / 食品 / 生活用品 / 服饰 / 其他\n核心卖点：\n目标情绪：温情 / 清爽 / 幽默 / 怀旧 / 青春 / 家庭\n推荐场景：\n推荐画幅：\n输出类型：图片 / 视频 / 图片+视频\n是否有参考图：\n```\n\n### 步骤 2：广告创意\n\n必须先生成 3-5 个广告方向，不要直接写提示词。\n\n### 步骤 3：推荐主方案\n\n从多个方向中推荐一个最适合生成的方案，并说明理由。\n\n推荐方案必须说明：\n\n- 观众第一眼看到什么\n- 产品在哪里\n- 人物做什么\n- 场景传递什么生活状态\n- 文案空间在哪里\n- 结尾是否能形成广告定格\n\n### 步骤 4：资产规划\n\n规划：\n\n- 产品资产\n- 人物资产\n- 场景资产\n- 道具资产\n- 文案留白区\n- 视频动作资产\n\n### 步骤 5：图片提示词\n\n输出可直接用于生成广告图的完整中文提示词，并附中英文反向提示词。\n\n### 步骤 6：视频分镜\n\n根据需求选择：\n\n- 5 秒：1-3 个广告节拍，必须有产品 packshot\n- 15 秒：4-6 个镜头，完成小广告故事\n- 30 秒：7-10 个镜头，完成产品使用与情绪变化\n- 60 秒：12-18 个镜头，完成怀旧品牌片或家庭短片\n\n### 步骤 7：视频提示词\n\n必须明确：\n\n- 产品固定要求\n- 场景年代感\n- 人物动作\n- 镜头节奏\n- 切镜方式\n- 运镜方式\n- 胶片质感\n- 结尾 packshot\n- 禁止项\n\n### 步骤 8：剪辑、声音、审核\n\n输出：\n\n- 剪辑节奏\n- 字幕卡建议\n- 音效建议\n- BGM 建议\n- 旁白建议\n- 审核清单\n\n---\n\n## 8. 资产规划规则\n\n### 8.1 产品资产\n\n产品必须清楚、完整、稳定。\n\n```md\n产品名称：\n产品类型：\n包装形状：\n主色：\n材质：\n标签位置：\n卖点：\n推荐展示角度：\n是否需要水珠 / 蒸汽 / 泡沫 / 高光 / 纹理特写：\n```\n\n### 8.2 人物资产\n\n人物是广告表演者，不是普通路人摆拍。\n\n```md\n人物身份：\n年龄段：\n服装：\n发型：\n表情：\n动作：\n与产品关系：\n表演强度：自然 / 轻微夸张 / 温情 / 幽默\n```\n\n### 8.3 场景资产\n\n场景必须是干净的广告生活空间，不是杂乱旧房间。\n\n常用场景：\n\n- 90 年代家庭厨房\n- 木质餐桌\n- 便利店冰柜\n- 老式客厅\n- 学校操场\n- 街边电话亭\n- 复古浴室\n- 阳台晾衣区\n- 老电视旁边的客厅\n- 夏日街头小卖部\n\n### 8.4 道具资产\n\n道具增强年代感，但不能抢产品。\n\n常用道具：老电视、玻璃杯、搪瓷杯、塑料桌布、复古冰箱、收音机、铁皮饼干盒、旧电话、课本、铅笔盒、纸质价格牌。\n\n---\n\n## 9. 图片提示词规则\n\n图片提示词必须包含：\n\n 1. 广告类型\n 2. 产品主体\n 3. 产品摆放位置\n 4. 人物动作或表演\n 5. 复古场景\n 6. 光影\n 7. 色彩\n 8. 胶片质感\n 9. 构图与文案空间\n10. 禁止项\n\n关键写法：\n\n```text\n80-90 年代复古胶片广告，老电视广告感，暖色调，轻微褪色，柔和高光，胶片颗粒，轻微过曝，低对比度，真实生活广告场景，自然广告表演，产品主视觉清楚，干净整洁布景，广告海报构图，留出标题文案空间。\n```\n\n---\n\n## 10. 分镜设计规则\n\n### 10.1 5 秒广告不是默认慢镜头\n\n5 秒广告必须根据品类选择节奏：\n\n- 温情家庭节奏：牛奶、早餐、洗衣粉、香皂\n- 清爽快节奏：汽水、果汁、零食、运动饮料\n- 幽默老电视节奏：牙膏、清洁用品、方便面、零食\n- 青春街头节奏：运动鞋、牛仔服、T 恤、校园饮料\n\n### 10.2 5 秒广告必须具备广告节拍\n\n至少包含：\n\n1. 产品出现\n2. 产品动作\n3. 人物反应或卖点细节\n4. 产品 packshot 定格\n\n### 10.3 切镜模式\n\n根据稳定性选择：\n\n- 单镜头广告模式：最稳，适合产品复杂或图生视频。\n- 三段式内切广告模式：产品特写 → 使用动作 → packshot。\n- 快切特写广告模式：适合饮料、零食、运动鞋，但建议拆条生成后剪辑。\n\n### 10.4 分镜表字段\n\n```md\n| 镜头 | 时长 | 画面内容 | 产品位置 | 人物动作 | 镜头运动 | 声音 | 广告目的 |\n|---|---:|---|---|---|---|---|---|\n```\n\n---\n\n## 11. 视频提示词规则\n\n视频提示词必须包含：\n\n 1. 广告类型\n 2. 产品固定要求\n 3. 场景年代感\n 4. 人物表演\n 5. 时间节奏\n 6. 切镜方式\n 7. 运镜方式\n 8. 胶片质感\n 9. 声音建议\n10. 禁止项\n\n必须写入产品稳定性规则：\n\n```text\n产品外形、颜色、包装比例、标签位置必须全程保持一致，不要重新设计产品，不要让产品变形，不要让标签跳动，不要让手遮挡产品正面。结尾必须出现完整产品 packshot。\n```\n\n---\n\n## 12. 剪辑与声音建议\n\n### 12.1 剪辑\n\n复古广告剪辑应该：\n\n- 镜头短，但不乱\n- 切点明确\n- 产品出现时间足够长\n- 动作完整\n- 结尾有产品定格\n- 字幕简单直接\n\n### 12.2 字幕\n\n广告标题、促销语、品牌 slogan、价格牌文字，优先后期添加。生成画面时只保留干净留白和简单复古文字氛围，不强求模型生成准确中文。\n\n### 12.3 音效\n\n音效是广告节奏锚点。\n\n常用：开瓶声、气泡声、冰块碰撞声、包装袋打开声、咬饼干声、衣物抖动声、水流声、布料摩擦声、复古电视叮声。\n\n---\n\n## 13. 审核清单\n\n生成后必须检查：\n\n### 13.1 广告感\n\n- 是否像广告，而不是生活随拍？\n- 是否有明确创意？\n- 是否不只是胶片滤镜？\n- 是否有产品主视觉？\n- 是否有结尾 packshot？\n\n### 13.2 产品\n\n- 产品是否完整？\n- 标签是否清楚？\n- 包装是否变形？\n- 产品是否被手遮挡？\n- 视频中产品是否前后一致？\n\n### 13.3 人物\n\n- 表情是否自然？\n- 动作是否清楚？\n- 是否像广告表演？\n- 手部是否畸形？\n- 是否抢走产品焦点？\n\n### 13.4 场景\n\n- 是否干净？\n- 是否有 80-90 年代生活气息？\n- 是否避免现代电商棚拍？\n- 是否避免脏乱废弃感？\n- 是否有文案空间？\n\n### 13.5 视频节奏\n\n- 5 秒内是否有广告节拍？\n- 是否太慢？\n- 是否有无意义空镜？\n- 切镜是否服务产品？\n- 结尾是否能截图当广告封面？\n\n---\n\n## 14. 标准输出格式\n\n```md\n# 复古胶片广告方案\n\n## 一、需求理解\n产品：\n广告类型：\n目标情绪：\n推荐场景：\n推荐画幅：\n输出类型：\n\n## 二、广告创意方向\n\n### 方向 1：\n一句话创意：\n核心画面：\n产品展示：\n人物表演：\n复古场景：\n适合输出：\n\n### 方向 2：\n一句话创意：\n核心画面：\n产品展示：\n人物表演：\n复古场景：\n适合输出：\n\n### 方向 3：\n一句话创意：\n核心画面：\n产品展示：\n人物表演：\n复古场景：\n适合输出：\n\n## 三、推荐主方案\n推荐选择：\n推荐理由：\n画面第一眼：\n产品主视觉：\n人物表演：\n文案空间：\n广告情绪：\n\n## 四、资产规划\n产品资产：\n人物资产：\n场景资产：\n道具资产：\n\n## 五、图片提示词\n【完整图片提示词】\n\n## 六、5 秒视频分镜\n| 时间 | 画面内容 | 产品位置 | 人物动作 | 镜头运动 | 声音 |\n|---|---|---|---|---|---|\n\n## 七、5 秒视频提示词\n【完整视频提示词】\n\n## 八、剪辑与声音建议\n剪辑：\n字幕：\n音效：\nBGM：\n旁白：\n\n## 九、反向提示词\n中文反向：\n英文反向：\n\n## 十、审核清单\n产品：\n人物：\n场景：\n质感：\n视频：\n```\n\n---\n\n## 15. 中文反向提示词\n\n```text\n不要现代电商图，不要白底产品图，不要现代直播带货风，不要过度高清商业大片，不要赛博朋克，不要霓虹灯，不要未来科技感，不要现代奢侈品广告，不要过度锐化，不要高饱和网红滤镜，不要脏乱场景，不要废弃恐怖空间，不要阴森惊悚，不要廉价滤镜感，不要只加胶片颗粒没有广告创意，不要产品变形，不要包装文字混乱，不要标签跳动，不要产品被手遮挡，不要人物手指畸形，不要人物表情僵硬，不要假笑过度，不要复杂炫技运镜，不要快速乱剪，不要现代 LED 灯光，不要极简白棚，不要 AI 塑料感，不要过度磨皮，不要皮肤蜡像感，不要画面杂乱，不要主体不清。\n```\n\n## 16. English Negative Prompt\n\n```text\nno modern e-commerce product photo, no white background product shot, no livestream shopping style, no ultra sharp modern commercial blockbuster look, no cyberpunk, no neon lighting, no futuristic technology style, no modern luxury advertisement look, no over-sharpening, no oversaturated influencer filter, no dirty messy scene, no abandoned horror space, no scary atmosphere, no cheap filter look, no film grain only without advertising concept, no deformed product, no distorted packaging, no unreadable messy label, no flickering label, no product blocked by hands, no malformed fingers, no stiff facial expression, no exaggerated fake smile, no complex flashy camera movement, no fast chaotic cuts, no modern LED lighting, no minimalist white studio, no AI plastic texture, no over-smoothed skin, no waxy skin, no cluttered composition, no unclear subject.\n```", "extras": [], "cn": "复古胶片广告风导演"}, {"slug": "script-structural-decomposer", "desc": "对剧本进行精准拆分，转化为可直接用于漫剧、短剧制作的拍摄底稿", "body": "# 功能用途\n\n本 Skill 旨在将粗糙的原始剧本进行工厂化拆解，转化为可直接用于漫剧、短剧制作的拍摄底稿。核心特色在于将演员动作与台词彻底解耦，并自动识别分集、场景、人物及情绪，大幅提升前期筹备效率。\n\n# 适用输入\n\n- 完整长剧本或已分集的剧本片段。\n- 格式可包含：txt、word 内容或直接粘贴的文本。\n\n# 操作步骤\n\n1. **分集识别**：按剧本标记或情节闭环（约800-1200字）自动切分。每集需提炼核心钩子与爆点。\n2. **场景拆分**：根据地点、时间变化切分场景，标注内外景、日夜及主次场景名。\n3. **元素提取**：识别所有角色（主/配/龙套）、关键道具及转场方式。\n4. **动作与台词解耦**：从描述中提取独立动作（以“△”开头），并将台词独立列出，标注对应的极致情绪标签（如：甜、虐、爽、燃等）。\n5. **镜头细化**：为每个场景生成景别、运镜及画面内容描述。\n\n# 输出要求\n\n输出包含三份核心表格，确保字段完整：\n\n### 1. 分集大纲\n\n包含集数、核心钩子（≤15字）、本集爆点、卡点情绪及关键人物。\n\n### 2. 场景表\n\n包含集-场号、场景名称、内外日夜、角色、关键道具、转场方式及剧情摘要。\n\n### 3. 镜头拆解底稿\n\n- **字段**：镜号、景别、运镜、画面内容、演员动作（必须以 △ 开头）、台词、情绪标签、备注。\n- **动作规范**：若无明确动作则填“△静立”或“△注视”，禁止为空。\n- **情绪高峰**：针对冲突镜头标注“【情绪高峰】建议升格/定格”。\n\n# 注意事项\n\n- 动作必须从台词语境中反向拆解（如“冷笑说”拆分为“△冷笑”+台词）。\n- 缺失的内外景或日夜信息需根据上下文补全，并标注“\\*”。\n- 确保每个镜头的信息密度符合短剧快节奏需求。", "extras": [], "cn": "剧本结构化拆解-漫剧"}, {"slug": "shaw-comedy-style", "desc": "萌宠拟人武侠壳，秒变复古港味喜剧", "body": "# shaw-comedy-style\n\n做抖音快节奏邵氏港片风格喜剧短片时用本 skill。核心玩法:**萌宠/动物拟人化 + 武侠壳 + 市井喜剧内核**。用户上传角色参考图(人物/萌宠/动物)、剧本或一句话灵感,生成 10–30s(默认 15s)复古港味短片。**风格致敬,不复刻具体邵氏版权作品。**\n\n> 本环境适配:GPT Image/ImageToImage → `generate_image_v3`;Seedance/MultiModalToVideo → `generate_video_v3`;武侠 BGM/配音 → `generate_audio`;text_editor → `write_file_v2`;video_assembler → `composite_video`;`<<<image_n>>>` → `reference_nodes`+`{{NodeKey}}`。**prompt 工艺与拟人造型工艺全部内联本 skill,不外包 image-prompt-director / cartoon-flow**。超分(1080p via MediaKit)本环境无该能力——默认 720p 交付。24fps/胶片颗粒等若基座无参数位,转为 prompt 内描述并注明。\n\n## 流程(分阶段串行,每阶段暂停确认;全程称呼用户\"编导\",阶段标题用【模块名】,Markdown 表格呈现,不跳步)\n\n0. **【全局简报】**(`write_file_v2` → Final_Video_Spec.md,字段从用户输入推断、不足用默认):片名(暂定或指定)/风格基调(80 年代邵氏胶片港味武侠喜剧,萌宠拟人混搭)/总时长(默认 15s,可 10–30s 或更长)/输出分辨率(720p 默认)/**画面比例 16:9(固定不可改)**/叙事语言(中文)/**全局硬性规则:全程无字幕、无 BGM(除非明确要求)**/角色输入方式(参考图上传-人物萌宠动物/文字描述/内置角色库,按实际填)/叙事内核(喜剧优先武侠为壳;萌宠动物保留本能行为与武侠造型形成反差)/音频规则(默认保留环境音-市井嘈杂/刀剑/风声等,无 BGM;配音港式普通话腔调+老麦克风颗粒感处理;用户要求时可生成轻快武侠感 BGM)。⏸ 确认再进阶段 1。\n1. **【剧本大纲】**〔⏸〕:(如有素材)`analyze` 素材解析,再生成邵氏风格故事大纲——按**起承转合**四段(起相遇/建置→承追杀/冲突→转身世秘密/反派阴谋→合决战/侠义传承)+ 情绪曲线 + 建议镜头数(4–8,适配总时长);优化规则见「剧本智能优化」;Markdown 表格呈现,⏸ 确认进阶段 2。\n2. **【分镜设计】**(`storyboard`,见\"分镜\"节):生成结构化分镜表(key elements + shots + audio layers)。每批 4–6 镜呈现,⏸「确认/修改/重生成」后再续,全部确认进阶段 3。\n3. **【元素资产】**(`generate_image_v3`,见\"资产生成\"节)〔⏸〕:上传参考图注册 asset_id 绑定 key_element;**现代服饰先提示用户确认风格转换、确认后 ImageToImage 转武侠造型**;内置侠客库或仅文字则生成形象图。全部就绪⏸ 告知后进阶段 4。\n4. **【逐镜视频】**(`generate_video_v3`):按分镜表逐镜生成,小批次展示、单镜可请求重生成;全部通过进阶段 5。\n5. **【音频(如需)】**:若要求 BGM 用 `generate_audio` 生武侠感纯音乐;环境音(风声/刀剑/马蹄)在视频生成阶段随镜头产出、无需单独步骤。\n6. **【剪辑合成与输出】**(`composite_video`,见\"剪辑\"节):按分镜时长顺序拼接、混音、输出,附质检摘要表。\n> 依赖:1→0;2→1;3→2;4→3;5→2;6→4,5。\n\n## 素材解析(`analyze`)\n\n- **人物/动物参考图**:提取并结构化输出供 key_element 用——面部特征(五官/发型/发色/年龄感)、体型与姿态、服饰(若现代服饰标记\"需转换武侠风格\")、物种(动物则提毛色/体型/神态气质供拟人化武侠造型)、气质关键词(冷峻/热血/神秘/威猛等)。\n- **文字剧本/脚本**:提取梗概、角色名、关键场景、情绪节点,输出结构化摘要供 Planner 生成大纲。\n- **一句话灵感**:识别核心人物关系(如\"侠客 vs 反派\")、核心冲突与情绪基调,输出扩写种子。\n- **参考视频(如上传)**:提取运镜风格、色调特征、节奏感作视觉参考基准,而非直接复制内容。\n\n## 剧本智能优化\n\n一句话灵感 → 扩为起(相遇/建置)→承(追杀/冲突)→转(身世秘密/反派阴谋)→合(决战/侠义传承);粗糙脚本 → 优化对话 + 补武侠细节(剑穗/斗笠/酒壶/残阳/客栈/竹林/破庙等);仅角色图无文字 → 按角色视觉气质自动设计侠义故事;未上传任何素材 → 回复\"编导好,请至少上传一张角色参考图或一段文字灵感,才能开始创作。\"\n\n## 分镜(`storyboard`)\n\n**key elements 设计**:\n- 每个主要角色建独立 element character:外貌(面部/发型/肤色)、武侠造型(服饰/兵器/配件:斗笠/剑穗/酒壶/披风等)、**武功气质标签**(如\"内敛剑客,出招前总习惯压低眼睛\");动物角色补拟人化武侠服饰方案。\n- 关键场景建 element scene:破庙/竹林/客栈/悬崖/山林等,描述光源方向(侧逆光/月光/烛光)、雾效强度、地面材质。\n- 重要道具(兵器/令牌等)建独立 key_element。\n\n**邵氏镜头时长结构(以 15s 为例,其他时长按比例缩放)**:开场建置 2–3s(全景或低角度仰拍,建立环境与主角);发展/冲突 6–8s(2–3 个快切打斗/对峙镜头,每镜 1–2s);高潮 3–4s(慢镜头关键动作或面部特写);结尾收束 2s(背影远去/刀剑入鞘/残阳定格)。\n\n**情绪与表演规范(全镜通用)**:人物/萌宠情绪必须真实自然,通过微表情、肢体细节、呼吸节奏体现,非夸张或刻板;**严禁机械感**——动作必须有**起势-过渡-收势三段节奏**,避免\"瞬间到位\"式描写,写出动作过渡的流畅弧线(如\"右手从腰间缓缓抬起,指尖微微颤动,才握住剑柄\"而非\"握剑\");眼神与面部表情须有细节层次(视线方向/眼皮松紧/嘴角细微变化),**内心情绪拆解为可见的身体信号**;萌宠角色拟人动作须保留动物本能惯性感(猫科出手前重心下沉、犬类耳朵竖立),动作自然可信。\n\n**每个 shot 五要素**:\n1. **景别**:全景/中景/近景/特写。\n2. **运镜**(从以下 7 种规范选取):低角度仰拍(凸显英雄气概,人物出场首选) / 慢镜头(兵器出鞘/轻功飞掠/关键一击) / 快切(打斗节奏,每镜 1–2s) / 推镜头(出场/眼神逼近) / 摇移跟拍(追逐/轻功) / 固定机位(对话/对峙/压抑氛围);**禁止**:手持晃动、无人机航拍、过于流畅的稳定器滑动。\n3. **动作描述**:具体到肢体(\"右手缓缓握住剑柄,食指关节泛白\"而非\"拔剑\")。\n4. **台词/内心独白**(如有):格式 (情绪描述,如\"声音低沉压抑,像忍了很久\"):\"台词…(停顿)…台词。\";情绪词必须转化为具体动作/声音(\"愤怒\"→\"额头青筋凸起,嗓音像砂纸磨过\")。\n5. **环境音**:精确到具体音效(风声/竹叶沙沙/刀剑撞击/马蹄声/滴水声等)。\n\n**视觉风格(每镜必须贯彻 6 条)**:①**色调基准**暖黄偏暗复古调色为主,不追求冷暖极端分裂,对红黄色系做轻微色彩衰减模拟老胶片褪色感;②**光影**硬光勾勒人物/萌宠轮廓,暗部偏沉亮部柔和(低饱和+强光影的港片胶片逻辑),侧逆光为主、烛光月光场景适用;③**胶片颗粒**不均匀分布,暗部更密集亮部稀疏(模拟感光度不足),强度中等可见不过噪,不磨皮不降噪;④**动态模糊**推摇镜头运动时加入模拟快门速度不足的动态模糊、运动边缘轻微拖影;⑤**轻微画面抖动**偶尔加入极轻微镜头抖动还原老胶片粗糙质感,不可明显手持晃动;⑥**关键场景雾效**市井餐馆烟气/竹林晨雾/月夜破庙等场景必须添加轻量雾效或烟气。\n\n**叙事基调(与纯武侠的核心区别)**:①**喜剧优先**武侠壳是包装、喜剧内核才是爆点,冲突优先选\"反差萌\"——严肃武侠场景插入萌宠/动物日常逻辑制造荒诞落差(大侠一声断喝、对面猫咪只是舔爪);②**叙事节奏**抖音快节奏,前 3 秒必须建立冲突或反差,不做邵氏式慢热铺垫、直接入戏;③**常见喜剧场景**市井餐馆争执/街头萌宠扮侠客/厨房食材\"决战\"/掌柜与客人互怼等港式市井喜剧,江湖恩怨作背景动机不作主表达;④**角色反差**萌宠/动物角色必须同时携带\"武侠造型\"与\"动物本能行为\"两层描述,两者冲突即产生喜剧效果。\n\n**场景风格补充**:优先港式市井场景元素(木质雕花门窗/复古餐具/红绸装饰/背景食客的民国七八十年代港式穿着);搭配武侠外景时保留一处\"市井细节\"作喜剧锚点(如竹林里有人卖包子)。\n\n**audio layers**:①**默认音效**保留环境音(市井嘈杂/餐具碰撞/风声/刀剑声),在 shot 描述中精确定义、由视频生成阶段随镜头产出,无默认 BGM;②**配音风格**台词配音采用港式普通话腔调(咬字略带软糯感,声调起伏贴合港片市井角色,尾音可轻微上扬),情绪词拆解为具体动作/声音;③**可选 BGM**若要求,设计 music 类型 audio_layer,描述为\"80 年代港式武侠轻喜剧配乐,古筝+琵琶+轻快打击乐,整体旋律感强,节奏轻快而非厚重,可加入轻松音效点缀,无现代电子元素\",绑定全片时间轴;④**可选旁白(VO)**若有旁白,narration_speaker_profile(如\"【港式说书腔,语速适中,带轻微市井幽默感,偶有顿挫】\")+ 逐字台本。\n\n## 资产生成(`generate_image_v3` / `generate_video_v3`)\n\n**元素资产**:上传参考图注册 asset_id 绑定 key_element;现代服饰图先 `generate_image_v3`(图生图,源 Nano Banana Pro 2K)转武侠造型、需用户确认后再绑定;需生成形象图时文生图或图生图(有参考图优先)。**角色图一律横向双格参考图**:左格面部特写(五官/发型/肤色/眼神),右格全身(服饰/兵器/姿态);场景图生成全景视图体现光源与雾效。\n\n**逐镜视频**(`generate_video_v3`,源 Seedance 2.0 720p):\n- **参考输入优先级与绑定顺序**:①**角色 key_element 形象图(最高优先级,必选)**——出现在该镜头的所有角色,必须将其双格参考图(面部特写+全身)作首要参考绑定,确保五官/发型/服饰/兵器跨镜一致,多角色时每人各自绑定独立 `{{NodeKey}}`;②**场景 key_element 图(必选)**——绑定该镜头场景元素图统一光源色温/雾效/场景细节;③**前一镜头视频作 reference_video(谨慎)**——仅当与前镜角色状态/动作连贯性极强(慢镜紧接特写/同动作弧跨镜延续)时才加,通常不加避免样式漂移(本环境不支持视频参考则退回关键帧衔接)。\n- **跨镜角色一致性保障 4 规则**:①**元素图锁定**——阶段 3 每张角色 key_element 图一经确认即成为该角色全片外观锚点,后续所有 shot 必须引用同一 asset_id、不得用其他版本;②**双格参考图拆分引用**——单镜若景别为特写/近景优先引用左格(面部特写)作主参考,全景/中景优先引用右格(全身),需兼顾面部与全身时同时引用双格分配至不同 `{{NodeKey}}`;③**服饰配件一致性描述**——每 shot 提示词必须复述角色标志性服饰细节(颜色/材质/兵器/配件)不依赖模型记忆,萌宠角色须同时复述动物特征(毛色/体型)+武侠造型防跨镜漂移;④**一致性失败处理**——外观与参考图差异明显(面部走形/服饰色偏)优先加强提示词外观细节后重生成,连续两次失败则提示用户重新确认 key_element 参考图是否清晰。\n- 时长:严格按分镜表该 shot 设定(4–15s);若生成失败,源回退 Seedance 2.0 Fast、仍失败则停止告知(本环境映射为同工具重试→失败告知用户)。\n\n**BGM(如需)**:`generate_audio`,提示词中不得出现知名音乐人名字。\n\n## 提示词写法(全部内联,不外包)\n\n**最高优先级(全局)**:所有提示词用中文书写;台词/旁白遵循 Final_Video_Spec 语言设定(中文)。\n\n**元素形象图**(`generate_image_v3`):自然语言描述,结构=主体外貌+武侠服饰与配件+光线与色调+构图与景别+质感标签。\n- **核心视觉锁定词、角色图示例结构、萌宠拟人侠客描述法、场景图写法**全文见 `references/prompt-templates.md`。\n\n**镜头视频**(`generate_video_v3`):\n- **参考图绑定**:每个角色/场景对应 `{{NodeKey}}`,提示词开头明确说明各占位符指向的角色或场景。\n- **提示词结构**(按顺序叠加,不分节标注):①运镜(含是否加轻微抖动/动态模糊)→②主体动作(精确到肢体,含幅度速度;萌宠动作保留动物本能反应与武侠动作的反差)→③场景与环境(光源/烟气/市井细节)→④音效(环境音,台词用 `{...}` 包裹)。\n- **Seedance 音效标记规范、邵氏运镜 7 关键词逐字、情绪动作真实感 3 条、35mm 胶片质感强制词全文、BGM prompt 全文、配音老麦克风描述**:见 `references/prompt-templates.md`(英文/固定词组原文保留)。\n\n## 剪辑(`composite_video`)\n\n- **拼接顺序与节奏**:严格按分镜表 shot 顺序拼接不得调换;每 shot 时长以分镜表为准、总时长与锁定时长对齐(±0.5s);快切段落(打斗/冲突)相邻 shot 无过渡或硬切、保留节奏紧张感;慢镜头/高潮 shot 衔接处可加 2–4 帧叠化(cross-dissolve)柔化冲击;开场第一帧从黑场淡入(fade-in ~8 帧),结尾最后一帧淡出至黑场(fade-out ~12 帧)。\n- **分镜间丝滑衔接**:①**动作连贯性优先**切点须落在动作弧的自然间歇处(出招后短暂停顿/视线转移瞬间),而非动作正中强行截断;②**光线与色调匹配**同场景相邻 shot 亮度/色温过渡平滑,避免跳切曝光跳变,场景切换则允许轻度色调差异;③**音效连续性**环境音(风声/市井背景)在 shot 切换时淡入淡出交叠(~4–8 帧)不硬切截断,保持声音空间连续;④**禁止出现**字幕、BGM(除非明确要求)——全片强制,不得因默认设置引入任何文字覆盖层或背景音轨。\n- **音频混合(dB 层级)**:各 shot 环境音保留原生不做默认压缩;有 BGM 时 BGM 音量低于环境音约 6dB、打斗高潮段可提升至相当水平;有旁白(VO)时旁白优先级最高、环境音自动降至 -10dB 以下、BGM 降至 -15dB 以下;shot 内有台词(dialogue)的片段该片段环境音维持原生、不额外叠加 BGM。\n- **导出**:MP4,**帧率 24fps(维持胶片感)**,分辨率按锁定值(默认 720p)。\n- **质检输出摘要表**(最终呈现给用户):故事类型(侠义/恩仇/忠义按实际)、总时长(XX 秒)、总镜头数、运镜类型(低角度仰拍/快切/慢镜/推摇移跟)、色调风格(暖黄偏暗,红黄色系轻微褪色,硬光轮廓)、胶片颗粒 ✅、雾效使用 ✅/❌、角色一致性 ✅、BGM(无/已生成)。\n\n## 相关\n\nauteur 家族:张艺谋 → zhang-yimou-style;国风纯意境 → guofeng-mood-style。边界:纯武侠严肃向 → auteur 家族;萌宠拟人日常(非武侠)→ pet-worker-vlog;2D 动画 → cartoon-flow。", "extras": [], "cn": "老港味武侠喜剧短片"}, {"slug": "shinkai-aesthetic-styler", "desc": "新海诚动画美学，用壮阔的光影与天空，绘制外放又诗意的青春情感", "body": "# 新海诚剧场版动画 影片流水线\n\n> 🔴 **请严格按照该 SKILL 分步执行。** 版本：2.0.8\n\n## 底层 DNA（无条件，每条画面都带）\n1. 🔴 **光是主角（新海诚签名，最重要）**：每一帧都被光雕刻——强烈的逆光与半逆光、太阳的镜头光斑（lens flare）、光的开花（bloom）、玻璃与水面与金属的高光反射、空气中漂浮的发光尘埃粒子。光源方向明确且戏剧化，人物发丝与轮廓被光勾出金边，**主动追求逆光开花与炫光签名感**。但光是\"美到心颤的光\"而非\"过曝的废片\"——高光可开花、主体信息仍可读。\n2. 🔴 **写实级精细动画背景 + 天空占比巨大**：新海诚的背景是\"比现实更美的现实\"——剧场版动画的手绘精细背景，一砖一瓦一根电线都刻画入微，透视精准、细节密度极高。天空是永远的主角：巨大的积雨云、蓝到发紫的天顶、magic hour 的橙紫渐变、星空与银河、飞机云与彗星。构图常给天空一半以上画幅，人物渺小地立于天地之间。\n3. **深远景深、天地可读**：常用广角大远景把人放进巨大的天空与城市之间，纵深拉到地平线；近景时背景依然精细可辨（动画背景不虚化成光斑，最多轻微空气透视）。人物与天地的尺度对比本身就是叙事。\n4. 🔴 **情绪内核：外放而诗意的青春情感（新海诚灵魂，务必拉住）**：这是新海诚最核心的气质——少年少女之间横亘着距离、时间、命运的思念与追寻。情感**是外放的、汹涌的、抒情的**：奔跑、呼喊、仰望天空、在人海中寻找一个人。底下流动的是相遇与错过、距离与羁绊、平行时空般无法触及的彼此、以及\"世界如此美丽而我在想你\"。⚠️ 绝不能做成克制疏离的冷淡日常、也绝不能做成廉价狗血偶像剧——差别全在\"用整个天空和光来盛放情感\"：情绪大，但被极致的美学与诗意托住,壮阔而不尴尬。\n5. **让世界与情绪共振**：云在延时般流动、雨滴砸开水花、电车驶过铁道口、彗星划破夜空、光随情绪明灭。天气与天象是情绪的放大器，世界随人物内心一同呼吸。\n\n## 质感尾词（🔴 完整版仅模卡与道具合图默认带；moodboard 不挂——风格由 sref 种子锚定；场景图只挂流程第 3 步的轻量风格稳定尾词、不挂本完整版）\n`新海诚剧场版动画质感，写实级精细手绘背景细节密度极高，人物干净赛璐璐动画风格描线清晰、眼睛大而清澈有高光与天空倒影，强烈逆光与轮廓光、lens flare 镜头光斑、bloom 光晕开花、空气中发光尘埃，天空占比大（积雨云/magic hour 渐变/星空），色彩高饱和浓郁通透（蓝青为底、橙紫金作情绪高光），高对比、阴影透蓝紫不死黑，深远景深、背景与地平线精细可辨；不要真人实拍、不要3D渲染塑料感、不要写实照片质感、不要灰暗低饱和、不要平光无光影、不要背景虚化成光斑、不要粗糙低帧网页动画`\n\n## 流程\n0. **入口**：🔴 **所有向用户的询问与确认一律以选择卡/按钮形式呈现，不用纯文本提问**（执行 agent 优先调用其选择卡组件；开放输入项配一张\"我来填/交给你\"二选卡，选前者再展开输入框）。一次问清 ① 时长（选择卡：给几档常用时长如 15秒 / 30秒 / 60秒 / 自定义→展开输入）② 执行模式（选择卡：全自动/手动确认）③ 视频画幅分辨率（选择卡：4:3 / 16:9默认 / 21:9 / 自定义）④ 对白语言（选择卡：中文/英文/日文/其他→展开输入）⑤ 🔴 **人声模式**（选择卡：纯氛围〔无对话无旁白〕/ 纯对话 / 纯旁白 / 对话+旁白穿插）——作为剧本与全片硬约束 ⑥ **想讲什么故事**（选择卡：我来讲〔选后展开输入框〕/ 交给你自拟〔跳过、后续 agent 自拟不再追问〕）。写入 memory。\n1. **风格确认**：不向用户征集元素、也不就 moodboard 向用户确认——moodboard 的天气/舞台/情感基调由 agent 依据入口第⑥问的故事输入提炼（用户跳过了则自拟一版），直接生成并默认作为全片风格锚，进入场景图生成。🔴 **moodboard 生成铁律（与其他图像资产不同，单独走这套）**：\n   - **模型强制 Midjourney v7**（不走 libimage），MJ 语法出 prompt。\n   - 🔴 **prompt 全英文输出**（MJ 对英文响应最佳）：moodboard 的 prompt 正文与所有描述词一律用英文写，仅此 moodboard 一处；场景图/模卡/道具/视频 prompt 的语言不受此条影响、维持原样。\n   - **正文只写内容、不写风格**：只描述场景内容、构图、画面元素与氛围主体（可含\"云/彗星\"等作为画面元素的客观存在），**删除一切影调与色调类风格描述**——配色、饱和度、色温、对比度、明暗风格、阴影颜色、渲染质感词一律不写，也**不挂质感尾词**。风格全部交由风格种子统一锚定。\n   - 🔴 **尾部强制拼接固定尾缀**：`--niji 7 --sref 3581618356 --sv 4`（写法照抄、参数不可改动、不可省略）。画幅参数（--ar）按所选画幅自行表达，不写死进尾缀。\n   - 🔴 **MJ prompt 模板（照填，禁改结构与尾部种子，只换 [] 占位）**：\n```\n[weather & sky], [scene content & environmental objects, developed per the film's story direction], [figure or silhouette position & scale within frame (may have no figure)], [composition: viewing angle, depth of field, sky-or-subject share of frame, foreground/mid/background relationship], [lighting mood: light-source direction, backlight / lens flare / bloom, the shape of light in the air], single unified image bleeding to full frame, no borders no collage no panels [--ar per chosen aspect ratio, e.g. --ar 16:9] --niji 7 --sref 3581618356 --sv 4\n```\n   - 版式要求不变：单一融合画面铺满出血、禁白边/拼贴/分格（写进正文）。\n   - 出 prompt 后自查：尾部种子在否？正文是否混入色调/影调/质感词（混入则删）？\n   → 存为风格锚资产、记下归档标记。\n2. **故事**：按入口第⑥问的答案走——用户有故事输入则遵循、仅叠加新海诚风格化；用户跳过了则不追问、agent 直接从母题中自选生成（相遇与错过/距离与思念/时空与命运/追寻与奔跑/世界之美与个人之小），与 moodboard 的天气/舞台/情感基调保持一致。🔴 故事定稿后按「剧本制作」章节产出剧本（含人声内容与角色表演基调表），剧本是后续分镜与视频 prompt 的唯一叙事依据。\n3. **资产**：有戏角色必产白底棚拍模卡定妆图（锁脸/服装/发型），后续镜头一律 @角色名 引用。场景图单张空镜、绝不分屏。🔴 **场景图生成铁律（配合 moodboard 新锚定逻辑）**：\n   - **模型用 libimage**（不变）。\n   - 🎨 **每张场景图强制挂 moodboard 风格锚作参考**（仅锚色调/光感/质感、不锚构图，统一全片色调）——moodboard 已由 sref 种子锚死风格，场景图的风格**全部经此参考图传递**。\n   - **正文四类描述为主 + 轻量风格稳定词**：色调/配色/饱和度/影调/对比度/阴影颜色等**色彩影调类**风格词仍不写（交由 moodboard 锚统一），但每张场景图 prompt 尾部固定挂一句**轻量风格稳定尾词**（防单靠参考图挂不住画风漂移）：`新海诚剧场版动画风格，精细手绘背景质感，干净的动画描线`；负面(独立框)固定带：`真人实拍、写实照片质感、3D渲染塑料感`。仅此，不再加更多风格词。\n   - **正文保留四类描述**：①天气与天象（晴/雨/雪/云/黄昏/星空）②场景内容（空间、物件、环境细节）③构图（视角、景深、画幅占比、前中远景关系）④光线氛围（光源方向、逆光/lens flare/bloom、光在空气中的形态、明暗关系的客观描述）。\n   - 出 prompt 后自查：是否挂了 moodboard？轻量风格尾词与负面在否？色彩影调类风格词是否混入（混入则删）？四类描述齐否？\n   具名道具汇总一张白底道具合图。\n4. **生成视频**：场景图+角色图（+含具名道具时挂道具合图）作参考锁一致性，分镜写进 prompt 时间轴。🔴 **视频生成不挂 moodboard 风格锚**（moodboard 只用于场景图生成阶段，视频参考只有场景图/人物图/道具图）。\n5. **音乐**：等视频人物全定稿后再确认方向、再生成（默认 mureka）。🔴 **生成后先不合成进视频**——因当前 agent 工具在含音乐的视频上加字幕会出问题，音乐须暂存、等第 7 步字幕加完后再询问用户是否合成。\n6. **合成**：跨 15 秒才拆多条、串行后用视频合成能力拼接。\n7. **后期剪辑**（合成后或用户指定时，工具：agent.tool.edit_video；用户未提及则不擅自调用）：\n   - **字幕** add_subtitle：白字黑色描边；语言跟对白语言，用户指定则翻译后加。人声模式为纯氛围时全片无台词无旁白、跳过字幕环节不询问。\n   - **转场** transition：用户提及但未指定方式→默认直接硬切（新海诚剪辑以硬切与匹配剪辑为主）；可选硬切/淡入淡出/黑场；AI转场不在此列。⚠️禁溶解叠化只约束视频生成阶段，合成后可正常加转场。\n   - **抽帧** extract_frames：agent 自动调用辅助判断转场；用户也可主动要求。\n   - **裁剪** clip：秒级精度，用户描述需裁剪内容后执行。\n   - **文字贴片** text_overlay：片名/章节 title card、cast 名单、人名条；用户可自定义文字内容与样式。\n8. **音乐合成（字幕之后）**：🔴 字幕全部加完后，以选择卡询问用户是否把第 5 步已生成的音乐合成进视频（选择卡：合成/暂不）。用户确认后再执行音乐合成，收尾出片。⚠️ 顺序不可颠倒——必须\"先字幕、后音乐\"，因当前工具在有音乐的视频上加字幕会出问题。\n\n## 剧本制作（故事定稿后、资产生成前执行）\n- 🔴 **人声模式是硬约束（入口第⑤问选定，全剧本全片遵守）**：\n  - **纯氛围**：不写任何台词与旁白，情绪全靠画面表演、光线与环境音承载；剧本只写动作、表情、视线与环境事件。\n  - **纯对话**：该交流处**必须写出实际对白**，不得以\"两人交谈\"之类动作描述带过。\n  - **纯旁白**：**必须写出实际旁白文本**；旁白是画外音、画面中人物不开口型（防视频模型给无声口型配错语种）。\n  - **对话+旁白穿插**：两者并存，逐段标明是对白还是旁白。\n- 🔴 **对白落地铁律（禁默片化）**：模式含对话/旁白时，剧本必须真写台词与旁白全文——对白标注说话人（@角色名：\"台词\"），旁白标注（旁白：\"文本\"）。只有动作描述、没有实际文本的剧本视为不合格、重写。\n- **对白调性（本 skill 美学）**：短句、生活化、留白多——诗意藏在平常话里，情感浓度靠情境与光线托住而非台词直给；重要的话往往说一半、或用天气与景物代说。禁说教腔、禁狗血直白告白体、禁长篇大论。\n- **旁白调性（本 skill 美学）**：第一人称内心独白式抒情（\"世界如此美丽而我在想你\"的声部），与画面互补而非复述画面——画面给世界之大、旁白给内心之近。句子短、有呼吸感留白。\n- 🔴 **角色表演基调表（每个有戏角色必产）**：为每个有戏角色定 2-3 个**性格化的标志性小动作/习惯姿态**（由该角色性格决定，如：紧张时攥住衣角、思考时望向窗外、开心时脚跟离地半拍），随剧本归档。**全片跨镜一致**：视频 prompt 每镜的 @角色动作优先从基调表取用；标志性动作优先用作动作衔接切点素材（习惯动作起→下一镜承接）。\n- **剧本格式**：分场编号 + 场景/时间 + 在场角色 + 场内容（动作与事件）+ 人声内容（按模式写对白/旁白全文）。每场落点对应一个可拍的生活/情绪片段，供分镜时间轴直接取用。\n\n## 画幅与画质（写死）\n可选比例统一为 4:3 / 16:9 / 21:9 三种，用户也可自定义输入并保留其选择。默认全部首推 16:9：moodboard 16:9；场景图 16:9；人物模卡 16:9；视频默认 16:9（可改）。图像默认 libimage 模型、2K 分辨率、标准画质（用户可改）；🔴 **moodboard 例外：强制 Midjourney v7**（见流程第 1 步，画幅经 --ar 参数表达）。视频默认 720p 分辨率（用户可改）。\n\n## 图像 prompt 语言\n主体中文；技术词（lens flare/god rays/bloom/cel shading）必要时留英文。负面词与正文物理分离、放独立负面字段。\n\n## 人物铁律\n- **锁质感、放身份**：新海诚剧场版赛璐璐动画质感是硬约束；发色/发型/服装/身份气质尊重用户设定、不做新海诚化纠偏。\n- **表演基调跨镜一致**：每个有戏角色在剧本阶段定 2-3 个性格化标志性小动作/习惯姿态（见「剧本制作」章节），全片跨镜一致；模卡只锁外形、表演基调由剧本管、视频 prompt 取用。\n- **脸是干净通透的动画脸**：赛璐璐柔和明暗、描线干净、肤色透亮偏暖粉；**眼睛是灵魂**——大而清澈、瞳孔层次丰富、必带高光点与环境光倒影（天空/夕阳的颜色映在眼里）。绝不做成真人写实脸、3D 渲染脸、厚涂油画脸。\n- **模卡 ≠ 出片**：模卡用纯白底 + 明亮均匀正面光（脸充分照亮、面部细节优先），**模卡阶段绝不用逆光/剪影/炫光**——逆光开花是出片签名、不是定妆需求，模卡要的是把脸看清楚锁死。版式 16:9：左三视图（正/侧/背）+ 右大面部特写（必出、不可省、不可画成全身）。\n- 🔴 **模卡模板（照填，禁改结构与质感尾词，只换 [] 占位；若版式散架/视图不全退回英文版）**：\n```\n纯白无缝背景动画角色三视图定妆图，16:9 横向排版，严格分为必须同时存在的两个区域。左区：同一角色正面/侧面/背面三个全身视图并排站立，高度一致、脚部对齐。右区（必须存在、不可省略）：同一角色的大幅面部特写占据右区大部分，清晰呈现脸部与上胸，用于锁定脸型、眼神、发色与瞳色——右区特写与左区三视图同等重要、必须渲染出来。新海诚剧场版动画质感，应用于[角色身份与气质]，明亮柔和均匀的正面光充分照亮面部、五官描线清晰干净，赛璐璐柔和明暗、肤色透亮健康（不灰不暗、不3D塑料、不真人写实），眼睛大而清澈、瞳孔层次丰富带高光点，[体态]，[发型与发色]，[服装]，[神态与眼神]，不持有任何道具书包饰品（仅人物本身，道具单独出道具图），自然放松中性站姿，色彩干净通透以[主色调1]和[主色调2]为基调（饱和明快不寡淡不脏），剧场版级别高精度作画、线条干净稳定，明亮均匀的白底定妆风格，高细节动画面部，清晰五官，所有视图与特写保持同一角色一致性\n```\n  负面(独立框)：`真人实拍、写实照片脸、3D渲染塑料感、厚涂油画、逆光、剪影、lens flare、bloom过曝、戏剧化打光、灰暗低饱和、脏旧做旧、线条崩坏、五官畸变、背包书包手持物饰品道具、面部不一致、换了另一个人、多个不同角色、两张分开的角色卡、右区出现全身像、缺少面部特写、复杂背景、水印`\n- 🔴 **人物图不带任何道具**：模卡只出人物本身（身形/服装/发型/脸），绝不背包/拿手机伞书本/戴非必需饰品——道具一律由道具合图统一管、后续镜头再引用（防人物图自带道具与道具图冲突）。贴身服装不算道具；负面加\"背包、书包、手持物、饰品、道具\"。\n- **儿童安全**：禁\"未成年年龄数字+身体围度词+暴露服装\"三连，改学龄气质词。新海诚作品多为中学生/高中生主角，尤须严守此条；校服等设定用\"学生气质、校园制服\"类中性描述。\n\n## 场景卡（按场景取用；风格已由 sref→moodboard 锚死，卡只供取材要素——天气/场景/构图/光线四类，落 prompt 时组合即可）\n- ☁️ **天空/云海**：积雨云堆叠如山/星空银河/彗星飞机云；逆光云缘金边；广角、天空占画幅一半以上、人物渺小于地平线。用户一提天空/云/彗星/星空无条件套此卡。\n- 🌆 **Magic hour 黄昏（招牌）**：日落前后、云被夕阳点燃；暖金逆光、lens flare、长影拖地、玻璃反射夕阳；人物浸在逆光里、轮廓金边全开。\n- 🏙️ **都市/电车/铁道口**：电线杆与电线、电车车窗流光、铁道口红灯、便利店与贩卖机灯光；背景细节密度拉满；人物穿行或等待于大场景中。\n- 🌧️ **雨/雨后**：雨滴可见、水洼涟漪、伞与玻璃挂水；路面反光、车灯拉丝；雨后云破光出、湿街满是反光。\n- 🏫 **校园/日常抒情**：教室窗边、走廊天台、樱花或夏日绿；窗光斜切、灰尘在窗光里漂浮、窗帘被风掀起。\n- 🌌 **夜/星空**：星空银河与城市灯火对望；月光、流星、灯火 bloom；人物于天台/山坡/桥上仰望、深远景深。\n\n## 运镜（每镜配一种，与情绪咬合，默认动感冲击）\n快速冲刺跟拍（贴身追奔跑）/ 急推急拉（推向眼睛或拉出天地）/ 环绕人物旋转 / 低空俯冲穿越场景（FPV 式掠过街道/云层/铁轨）/ 甩镜 whip pan 衔接动作 / 大幅快速横摇扫过天空与城市 / 升降机大幅升起展现天地尺度 / 镜头随冲击轻微震动（落地/撞开门/列车掠过）。⚙️ 动感运镜全段可用、不限高潮段；缓慢推近与固定大远景保留为凝望时刻的点缀（一条 15 秒内至多 1-2 镜），其余镜头必须动起来。新海诚的镜头是\"和世界一起奔跑的抒情诗\"，宁涌勿静。\n\n## 剪辑节奏（抒情起伏、切点走动作衔接）\n- 🔴 **镜数目标：15 秒目标 5-6 个分镜**（单镜约 2-3 秒），情绪起伏靠镜内运镜与动作密度体现、而非拉长单镜——凝望段用长一点的镜（3 秒档）、高潮段用短镜（2 秒档），但总镜数守住 5-6。\n- 🔴 **切点逻辑：动作衔接（match cut）**：每个硬切点必须咬合前后镜头的动作——上一镜动作到达顶点或转折处切出，下一镜从该动作的延续或呼应动作起头（如：仰头看天的视线方向→切天空俯瞰；手伸向门把→切门被推开；奔跑脚踏地→切远景人飞奔）。**切点由动作决定，不是时间到了就切**。\n- 空镜是正文不是过场：天空、云、电车、街角的空镜承担情绪，可独立成镜、与人物镜头以动作/视线衔接交切。\n- 景别可大幅跳跃：大远景（人渺小于天地）直切眼睛特写是新海诚常用语法，不受\"跳一档\"限制，但跳跃须由动作衔接驱动、不乱跳。\n- 每镜内动作完整发生、切在动作节点上，不无意义碎切。\n\n## 音乐（默认 mureka；可含人声主题曲段）\n- 气质：抒情、汹涌、有明确的情绪推进与高潮释放——音乐与画面互为引擎（RADWIMPS 式影乐一体），在高潮处音乐可以冲到情感最前面。\n- 🎹 **第一支·钢琴抒情主线**（钢琴主导+弦乐推进）三子支：\n  - A·日常与心动：明亮轻快的钢琴动机、弦乐轻托，青春的透明感。用于校园/日常/相遇。\n  - B·思念与距离：钢琴慢板、旋律绵长带憾意、弦乐渐入，留白后再起。用于分隔两地/凝望天空/回忆。\n  - C·奔跑与追寻（高潮）：钢琴+弦乐+节奏组层层推进、情绪逐步拉满至爆发，配快剪蒙太奇。用于奔跑/寻找/时空交错/告白。\n- 🌠 **第二支·壮阔天象**：弦乐与合成器铺底的宏大织体、带神圣感与命运感,缓慢推进至恢弘。用于彗星/星空/超自然天象/世界级景观。\n- 🎤 **第三支·主题曲人声段（唯一允许人声）**：流行摇滚编曲+人声旋律，用于全片情绪最高点或片尾——仅在用户确认后启用（以选择卡询问：启用/不启用），默认前两支纯器乐。⚠️ 配乐人声属音乐层，与剧本\"人声模式\"互不约束——纯氛围模式的片子也可用主题曲人声段。\n- **选支**：校园日常相遇→A；思念凝望回忆→B；奔跑追寻高潮→C；天象奇观→第二支；全片最高点/片尾→询问用户是否上第三支。同一片多支并存随段落切换、须有\"起-承-爆-落\"的整体情绪曲线。\n- 禁平淡氛围底噪式配乐贯穿全片、禁全程无起伏。新海诚的音乐必须\"推着情绪走\",高潮必须给到。\n\n## 生成后自查（不达标则重做）\n剧本：人声模式遵守否（纯氛围无台词旁白/含对话旁白处有实际文本、非默片化）？对白标注说话人否？每个有戏角色的表演基调表产出否？\nmoodboard：prompt 尾部固定尾缀（--niji 7 --sref 3581618356 --sv 4）在否？正文是否混入色调/影调/质感风格词（须删净）？模型是否为 Midjourney v7？\n场景图：是否挂了 moodboard 风格锚？轻量风格尾词与负面在否？正文是否只含天气/场景/构图/光线氛围四类、色彩影调类风格词删净否？模型是否为 libimage？\n其余图像与视频：光是否是主角——逆光/lens flare/bloom 至少占其一（须有）？是否做成了真人实拍或3D塑料感（禁，须剧场版动画）？背景是否达到写实级精细密度、天空占比够
