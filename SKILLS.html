习(5→3 shot,去脚步特写保镜子全景与表情中景)、再压放学(去书包收拾近景、从推门过曝直接奔跑跟拍)、最后压日常(减至纯空镜建立 2–3 shot);**不压缩**欢笑高潮/青春高潮/黄昏收尾(情绪核心)。shot 总数 30–40。\n- **跨版本通用**:①开场原则——任何版本第一个 shot 必须前 3 秒内建立视觉记忆点(逆光剪影/笑容特写/标志场景空镜),禁用对话或说明性画面开场;②结尾原则——任何版本最后一个 shot 都必须是黄昏收尾类(定格笑容或夕阳剪影)、时长不少于 5s,soft fade to warm white 收尾;③BGM 对位——分镜阶段即标注各段对应 BGM 结构段(intro/verse/chorus/outro),确保欢笑高潮踩 chorus 爆发点、黄昏收尾落 outro 渐弱区间;④**不可拆分 shot 对**——放学后奔跑(段 2)与天台推门过曝(段 2)为强连续对,裁剪时要么都保留要么都删除。\n- **Reels 短时长 BGM 结构标注规范**(15s/30s Reels,分镜阶段须在每 shot 旁注明对应 BGM 时间戳区间与节拍标记):见 `references/short-version-and-vertical-shot.md`。\n\n## 竖版(9:16)专项(在标准分镜规则基础上叠加,不替换)\n\n构图适配 5 原则、字幕安全区 4 区(核心表达区 70%×65%)、运镜适配 4 规则、竖版 shot 时长调整、竖版短时长版本段落裁剪优先级(15s/30s Reels):全文见 `references/short-version-and-vertical-shot.md`。要点:主体居中纵向(上下各留约 15% 安全边距);竖版帧宽仅横版 56%、优先中景近景特写、全景须站立居中;同框建议不超 2 人、3 人及以上须纵向错落或拆多单人近景快切;人物眼睛落画面上方 1/3;空镜优先纵深感强构图(走廊透视/河堤延伸/电车轨道消失点)。**字幕安全区**:上方 8–10%(平台标题栏,禁重要面部/道具特写)、下方 20–25%(平台文字/音乐/互动按钮,禁主要表情/关键动作)、右侧 10–12%(点赞评论分享纵列,主体/关键道具不可贴右缘)、核心表达区中央 70%(水平)×65%(垂直)、所有情绪高点/关键手势/笑容定格帧必须落此区。\n\n## 八段式 MV 标准 Shot 模板(每段:节奏基调/景别搭配/运镜节奏/示例 shot;实际按人数场景调整,不必逐字照搬)\n\n**每个 shot 必须包含**:场景(关联 element scene ID)、故事节拍(角色动作与情绪引用 element character ID、台词/内心旁白如有)、摄影语言(景别全景/中景/近景/特写+机位角度低角/平视/俯拍+运镜手持游移/软变焦/跟拍/固定偷拍)、时长参考(青春蒙太奇节奏单 shot 4–10s,情绪收尾 shot 可延长至 12–15s)。**禁止**:黑暗概念风、强剧情反转、赛博未来感。\n\n八段(1 日常片段 / 2 放学后 / 3 友情时刻 / 4 练习场景 / 5 欢笑高潮 / 6 舞台表演 / 7 青春高潮 / 8 黄昏收尾)每段的节奏基调+景别搭配+运镜节奏+示例 shot 全文:见 `references/eight-part-shot-templates.md`。\n\n## 元素图与 shot 视频生成(`generate_image_v3` / `generate_video_v3`)\n\n**角色/场景形象图**(`generate_image_v3`,`ai_model` 指定 `LibNavo Pro`):源推荐 Nano Banana Pro(2K,跨图面部一致性最强,适合角色参考图双格构图及多角色联合生成);风格探索阶段可额外用探索模型生成气质参考,但**探索图不作一致性锚点、不用于角色主图**(源 Midjourney 禁用于一致性一条的方法保留)。同一角色多造型/多场景版本用图生图以首版参考图为基准保持面容气质连贯。角色参考图默认横向双格构图:左=半身头肩特写(面部识别锚点),右=全身造型(服装/发型/配饰完整呈现)。\n\n**shot 视频生成**(`generate_video_v3`):\n- 默认路径 MultiModalToVideo(源 Seedance 2.0,720p)。每 shot 参考输入:①**element 图像(必须)**——该 shot 出现的所有角色 element 图+场景/道具 element 图;②**前一 shot 视频(可选)**——仅当与前 shot 强连续性(同场景连续动作/情绪直接承接)时才加,通常跳过视频参考保持青春蒙太奇切割感。\n- 需带同步音效/对白的 shot(如舞台表演)切换至 FirstFrameToVideo(源 Veo3.1 Fast,720p),避免与独立 narration VO 轨道叠加冲突(本环境按 `generate_video_v3` 的首帧/音频能力映射)。\n- **竖版专项生成路径**(原生 9:16 优先:Wan2.6 无音效需求 / Kling 3.0 Audio 需同步对白音效;Seedance 横版生成→中心裁切 56% 备用方案含构图预置词/裁切锚点/损失评估重生成表;非会员竖版):全文见 `references/vertical-shot-generation.md`。会员分支/refer_type/超分为本环境无对应的适配点,见对账。\n\n**跨 shot 角色面部一致性保障**:\n- **一致性检查表**(每完成一批 shot 即每 3–5 shot 或每段落结束时,继续前执行,不通过则先重生成):\n\n| 检查项 | 通过标准 | 不通过判定 |\n|---|---|---|\n| 面部识别锚点 | 脸型、眼型、发色与 key_element 参考图对应,肉眼可辨同一人 | 五官结构明显漂移、发型/肤色突变 |\n| 妆容与发型 | 刘海形状、发量感与 element 描述一致 | 刘海类型改变(软刘海变中分)、发色阶跃 |\n| 服装连贯性 | 同段落内同一角色服装与 element 描述一致 | 段落内服装款式或配色无剧情原因变化 |\n| 气质基调 | 面部表情与气质标签(元气/害羞/清冷等)保持对齐 | 角色气质与设定明显偏离(如元气型变冷漠型) |\n\n- **重生成判据**:必须重生成——面部识别锚点不通过(脸型/眼型明显走样)、同段落内服装无剧情原因变更;建议重生成——气质基调偏离超 1 档、发型突变影响辨识度;可接受保留——轻微手持运动瞬间失焦、光线变化引起的自然肤色细微差异、表情在合理情绪范围内的自然波动。重生成优先调 prompt(强化面部特征词/换 seed/减 shot 时长)而非直接换模型;同 prompt 连续两次仍不通过再考虑切 FirstFrameToVideo 以 keyframe 强控首帧外貌。\n- **多成员同框 shot 参考图绑定策略 5 条**:①为每位出现成员各绑定独立参考图(左格半身特写优先作面部锚,用 `{{Node1}}`/`{{Node2}}` 依次绑定,prompt 中明确每占位符对应成员及参照侧重-面部/全身/服装);②成员数量上限——单 shot 建议同框不超 3 人,超 3 人易混淆面部、优先拆多个近景/中景切换,群像全景可放宽至 5 人但降个体面部精度预期;③主角优先——有明确 center girl 或情绪焦点成员时将其参考图放第一个占位符(模型对首图权重更高);④避免参考图冲突——发型/服装色系相近时用方位词区分(「画面左侧成员参照 `{{Node1}}`」),仍混淆可先生成单人 shot 再合成多人;⑤团体群像全景——成员多且面部识别非主要要求(远景奔跑/舞台全景)时用多角色联合参考图(横向多格构图)替代多张独立参考图,仅适用于全景/远景、中景及以内仍须独立绑定。\n\n**BGM 生成**(`generate_audio`):源 Suno 5(备选 Mureka 8)。**不写知名音乐人/乐队名称**(高失败率)——用风格描述替代(如\"upbeat J-Pop idol chorus, bright acoustic guitar, nostalgic synth, cheerful melody\")。BGM prompt 详细写法见\"提示词写法\"节 BGM 专项。\n\n## 提示词写法(全部内联,不外包)\n\n**最高优先级(全局)**:用户中文交互时 prompt 正文以中文撰写;若有日语对白/歌词台词按原语言保留在对应位置。\n\n**图像 prompt 与胶片视觉基准词、角色/场景/光线描述锚点、Nano Banana Pro 双格构图指令+identity anchor block 格式+多角色联合图+场景图写法**:全文见 `references/image-prompt.md`。要点:导演+摄影师联合描述(自然语言主体+动作+环境、短语风格色彩光线构图);胶片参考 Kodak Gold 200 暖调/Fuji Pro 400H 冷柔调、soft grain 轻微过曝高光柔化溢出、允许轻微漏光镜头眩光软焦感、**禁 HDR 锐化感/超清 CG 感/商业级锐化**;角色气质词 youthful awkwardness/idol smile/natural reaction/genuine laughter/amateur charm、**禁性感化/高冷时尚感/欧美超模气质**。\n\n**视频 prompt(运动层叠顺序、青春纪录片运镜词汇、AKB 风格动作词汇、Seedance 2.0 Wrapper 完整语法+两个完整示例-天台奔跑/舞台表演、季节变体 prompt 补充、竖版 prompt 专项+固定负向组)**:全文见 `references/video-prompt.md`。运动层叠顺序:摄影机运动(手持游移/软推进/跟拍)→主体动作(动作幅度+情绪节拍)→空间调度(人物位置/场景变化)→音效提示(如有同步对白/音效用 wrapper)。**固定负向提示(每条视频 prompt 末尾)**:no music(BGM 走独立音轨)、no subtitles(字幕后期)、风格负向 no K-pop precision choreography/no high-fashion styling/no commercial stabilizer movement/no cyberpunk or dark concept/no EDM energy/no luxury architecture。\n\n**BGM 生成 prompt(四段式写法结构、BPM 描述速查、乐器组合推荐表、禁止乐器风格、完整示例 A/B/C、Suno/Mureka 差异表)**:全文见 `references/bgm-prompt.md`。四段式=[情绪定位]+[BPM/节拍感]+[主要乐器层]+[情绪弧线/段落结构];禁止乐器/风格词:EDM drop / trap hi-hat / 808 bass / dubstep wobble / dark orchestral / heavy metal guitar。\n\n## 合成(`composite_video`)\n\n**剪辑气质基准**:\"青春碎片感\"——像平成偶像 MV 的蒙太奇,而非商业广告精剪。\n- **节奏与时长**:日常/友情段落快切蒙太奇单 shot 1.5–3s;情绪/黄昏收尾段落放慢单 shot 4–8s 留白;舞台表演跟随 BGM 节拍剪切、动作高点对应切换点。\n- **转场偏好**:优先 soft dissolve(青春怀旧感)/handheld smash cut(自然切换)/freeze frame on smile(定格笑容);允许胶片时间码闪切/VHS 轻故障转场/DV 录像感叠化;**禁止**精准商业特效转场/K-pop 风格 RGB 描边切换/赛博视觉故障特效。\n- **音频层混合**:BGM 主轨贯穿全片、黄昏收尾段渐弱淡出;环境音(蝉鸣/电车/欢笑)在日常/友情段叠于 BGM 之下、音量约 BGM 的 20–30%;有 narration VO 时 VO 期间 BGM 小幅压低(duck 至约 -6dB)、VO 结束后恢复;带内置音效的视频 shot(FirstFrameToVideo 生成)注意与 VO 轨不重叠。\n- **画面处理**:整体色调统一到\"夏日青春胶片\"色系(pastel 暖调、软对比)避免色调跳变;允许保留轻微手持晃动/偶发失焦(青春纪录片质感、不做稳定处理);片尾建议黄昏定格帧 soft fade to warm white 或 nostalgic film burn out。\n- **Reels 竖版 BGM 截取点与节拍对位规范(15s/30s)+ 竖版快切 BPM 节拍速查表 + 竖版剪辑专项(时间线 1080×1920/720×1280、禁 letterbox、字幕安全带、节奏收紧 20–25%、禁横滑转场)**:全文见 `references/assembler-reels-vertical.md`。竖版音频混合规则与横版相同、无竖版特殊调整。\n\n## 相关\n\n边界:演唱对口型 MV → singing-mv;插画编舞 → dance-mv;史诗电影感 → epic-mv;日漫 OP/ED → anime-op-ed。路由入口:music-video-flow。", "extras": [], "cn": "日系偶像MV导演"}, {"slug": "influencer-fashion-try-on", "desc": "UGC 风格试穿视频——达人试穿某可穿戴产品，展示版型与材质细节，收于造型 pose。\\\"\\\\ version: 3", "body": "# ugc-try-on-flow\n\n做 UGC 试穿视频（达人试穿可穿戴产品、展示版型材质）时用本 skill。人设自拍质感、手数 / POV 规则同 ugc-flow。\n\n## 分镜板结构与叙事弧\n\n每块分镜板 = 一条 **21:9 横条，含 4 个竖 9:16 槽**。Board 1 标准试穿弧 + 逐槽 POV：\n\n槽弧段POV / 景别要点1PRE_WEARSelfie 半身基础中性居家服、无产品；一手持机、另一手拎纸袋一个提手2WEARINGTripod 全身硬切揭晓已穿产品、纸袋消失、面料自然垂坠；一个简短 twirl3TEXTURE_CLOSEUPTripod 微距无手面料细节特写；脸部分可见4STYLE_POSETripod 中宽/全身不同房间、同套衣 + 简单鞋履 + 小配饰、自信造型\n\n## 流程\n\n产品分析 → 人设锚点（或用户照片）→ 独白（默认\"个人想要\"小故事）→ **串行**出板（21:9）→ 逐板写视频 prompt → `generate_video_v3` **并行**逐镜 → `composite_video` 合成 → `generate_audio`。\n\n## 规则\n\n- 角色身份 + **发型**全程锁定（见 character-consistency）；手数 / POV 规则同 ugc-flow（selfie 一手持机、双手动作切 tripod）。\n- **服装连续性**：Board1 槽1 = 未穿 + 牛皮纸袋；槽 2–4 及之后 = 已穿产品、袋消失。无镜头内换装、无镜面 / 反射。\n- **纸袋规则**：恰好一个纯棕色牛皮纸购物袋，无标志 / 品牌 / 快递贴纸，袋闭合不打开展看；只在槽 1 出现，之后消失。\n- **材质特写（Cut 3）不出现手与布料接触**（hand-free macro，手完全在画面外）。\n- **音频分轨**：Cut 1/2/4 = 出镜对白（对口型）；Cut 3 = 叠加旁白。对口型细节：背对镜头时嘴停止发词。\n- **转身节拍**：仅 Board1 Cut2 有一个简短 twirl。\n- 无 CTA 结尾；Seedance 默认 `count: 2`。\n\n## 配合（query 需同时加载 / 也是本 skill 的评估组合）\n\n关系目标用途必需?provenance依赖product-analyzer产品分析有产品时源生依赖image-generation人设 / 分镜板出图必需源生依赖video-generation逐镜生成必需源生依赖montageN≥2 拼接N≥2 必需源生依赖character-consistency达人身份 + 发型全程锁定必需源生\n\n边界：口播评测 → ugc-flow；产品为主角 → ugc-product-flow；教程 → ugc-tutorial-flow；开箱 → ugc-unboxing-flow。", "extras": [], "cn": "达人试穿种草短视频"}, {"slug": "ink-wash-wuxia-animator", "desc": "写意水墨武侠动漫短片(《雾山五行》式,风格致敬非复刻)——五行色彩体系编码(金木水火土使者爆发态色彩明暗配比+运动物理+微观光影三层)、角色三视图+多角度无人物四宫格场景参考、画风与运动张力动态耦合、水墨介质情绪外化、经典中式陈设(松/碑/竹)水墨设定、泼彩比例三档、分镜时长动态规划(4s硬下限)、招式流派8类分镜规则、五行相克对决与5组克制转场、书法大字定格卡、诗意转场、场景强绑定防跳画+防分屏声明句链、剪辑卡点铁律与五行克制BGM频带削峰EQ表。用于 generate_image_v3 + generate_video_v3。\\\" version: 2", "body": "# ink-wuxia-animation\n\n做写意水墨武侠动漫短片时用本 skill。张大千式泼墨写意山水 + 五行武侠 + 焦墨飞白动态。\n\n> **风格致敬,非精确模仿**:借鉴《雾山五行》式写意水墨武侠美学,**不复刻其角色/具体镜头/版权名称**,创作原创角色与故事。以下\"水行使者\"等为示例类型,非特定作品角色。 本环境适配:\\*\\*\\* Image 2 → `generate_image_v3`(2K);Seedance 2.0 → `generate_video_v3`(720p、16:9);MiniMax Speech/ElevenLabs → `generate_audio`(配音/旁白/BGM/SFX);`text_editor` → `write_file_v2`;`video_assembler` → `composite_video`;`resource_prepare_and_analyze` → `analyze`;`<<<image_x>>>` → `reference_nodes`+`{{NodeKey}}`。**容错:全程锁定单一视频生成能力(Seedance 等价),报错不降级换模型,直接暂停反馈用户由其决定。** 双语 prompt 模板(图像/五行特效/视频武招/防分屏)与剪辑卡点+五行 EQ 表见 `references/prompt-library.md` 与 `references/editing-and-audio.md`。\n\n## 语系规范\n\n中文交互/中文 UI 时**提示词本体用中文**,但关键艺术术语/风格标签/五行特效标签用**中英双语对照或括号标注**(如 traditional Chinese ink wash painting (水墨写意));对白/旁白配音文本严格遵循 Final_Video_Spec 输出语言。\n\n## 五行色彩体系编码(element character 设定原则)\n\n角色严格按五行色彩编码;各使者\\*\\*爆发态(Outburst State)\\*\\*有专属 色彩明暗配比 + 运动物理质感 + 微观光影渲染 三层:\n\n- **火**:约 70% 朱砂红/熔金烈焰 + 30% 粗犷焦墨勾线与重阴影。**运动物理**:烈焰自下高频舔舐、熔金高粘稠流体滚动、滚烫热对流引起宣纸热浪扭曲(heat distortion),边缘干裂飞白+炸裂喷溅墨点。**微观光影**:火焰为强自发光核(self-illuminating core),周身/肢体边缘投超高对比赤红/熔金反光(kinetic glow)+强动态背光,把 30% 焦墨骨架边缘勾出金红锋芒,阴影极速闪烁硬边缘跳动。\n- **水(极寒)**:约 60% 深群青/靛蓝泼墨 + 25% 凛冽飞白霜(留白) + 15% 极锋利晶莹散射冷光冰刃。**运动物理**:液固双态转换张力——水流高粘滞重墨泼洒(fluid wash drag)、冰锥瞬间急冻脆断(brittle crystal snapping),水汽在宣纸渐次渗透扩散写意阻尼感。**微观光影**:冰刃半透明(translucent)介质光泽+内部折射(internal refraction),深蓝泼墨背景下外部冷光产锐利镜面折射(specular scatter)+剔透碎光,焦墨轮廓被冰冷侧光(icy rim light)反衬如刀锋晶莹尖锐。\n- **木**:约 65% 高饱和石绿/翠绿能量流 + 20% 狂草焦墨藤蔓骨架 + 15% 激射亮金飞叶/金色木屑。**运动物理**:藤蔓狂鞭挥击(whip-like cursive strike)有机弹韧高频鞭打、植物生长高速摩擦张力与纤维撕裂、飞叶划出利落书法劈叉枯笔飞白。**微观光影**:翠绿能量流强叶绿素次表面散射(subsurface scattering)+微光自发光(ambient moss glow),亮金飞叶在暗焦墨背景反射碎金眩光(golden glints),光穿藤蔓形成斑驳光斑(dappled rim light)投侧面轮廓破开深色。\n- **土**:约 55% 枯笔飞白焦墨巨石 + 35% 赭石/雄黄泼彩漫天沙尘 + 10% 裂隙迸射大地裂纹光。**运动物理**:巨石极重阻尼翻滚崩落动能(colossal tumbling inertia)+地表开裂重力摩擦(ground shear),飞沙走石粗糙硬质枯笔划痕、尘土炭灰摩擦重阻滞质感。**微观光影**:巨石硬朗阳角浮雕阴影(relief shadow/AO),黄沙尘暴物理遮挡与散射衰减(ray attenuation)成昏暗压抑气氛,大地脉动裂纹高能自发光(glowing earth veins)在岩石底部投熔岩般由下至上炽热金色返照光。\n- **金**:约 50% 耀眼亮白锋刃与闪电光轨 + 35% 漫天洒金流金碎屑/金箔 + 15% 泼墨铁骨般深浓焦墨重色压阵。**运动物理**:绝对线性纯几何高速切割动能(linear slicing energy),金属锋刃利落不规则书法枯笔刮擦撕裂痕,洒金碎屑极高频振动摩擦+金属碰撞火花四溅惯性。**微观光影**:亮白锋刃极致刺眼闪电强光+镜面高光(blinding specular glints),漫天激射流金碎屑散射耀眼碎金点光源(glimmering golden sparkles),把 15% 压阵泼墨铁骨边缘照亮产锋利冷光金属边缘反光,冷暖色调极高对比产眩光。\n\n若用户已提供人设或人物三视图,故事板须严格提炼遵循其视觉特征保持高度一致;未提供则系统原创构思(角色五官/发型/代表色彩/中式武侠服饰)。\n\n## 面部微表情与水墨介质情绪外化(微观水墨细节铁律)\n\n- **日常与对峙文戏(情绪微表情)**:眉尖微蹙/眼波流转/下颌线紧绷,匀称精致工笔细线捕捉温润古意。\n- **大招碰撞/爆发/受击瞬态(极端情绪)**:紧咬牙齿、咬肌剧烈收缩、额头太阳穴青筋突起(bulging facial veins)、眼瞳缩至针尖或爆发高自发光五行异彩。\n- **面部水墨介质融合(汗/泪/血严禁写实)**:以写意水墨介质重塑——眼角/嘴角半干宿墨干枯血泪痕(viscous dry ink-wash trails)、顺骨骼炸裂的飞白枯笔抓痕、极高频喷溅墨点(kinetic ink splatters)、重度阴影焦墨斑块,把情绪爆发与肉体痛苦外化为宣纸浓淡笔墨撕裂。\n\n## 画风与运动张力动态耦合(核心铁律,画风不得一成不变)\n\n按镜头运动速度与动力量感做\"笔墨张力\"动态缩放:\n\n- **静态/慢速运镜(文戏/意境空镜/极慢推拉平移)**:精细工笔勾边,线条纤细匀称棱角分明,墨色温润清雅,保留宣纸细腻纹理——东方儒雅空灵。\n- **极速运镜/强力打击(急推 Whip Zoom/急扫 Whip Pan/拳脚命中/招式爆发瞬态)**:画风瞬间蜕变——极粗犷狂乱焦墨枯笔+飞白排线,线条骤粗、边缘干裂笔锋、大量喷溅黑墨点,极强视觉冲击的手绘原画风骨与动态破坏力。\n\n## 场景 element scene:多角度无人物四宫格(核心铁律)\n\n背景为张大千式大气泼墨写意山水;场景参考图必须为**多角度无人物四宫格(Multi-angle Character-free 4-Grid Scene Reference)**,四格固定分配:Grid1 全景定场(宏观轮廓/地貌/天际线比例) / Grid2 陈设特写(古松/石碑/案几微观水墨质感) / Grid3 纵深透视(前中远景层次+透视引导线) / Grid4 气氛光效(主色调晕染范围与光影对比气氛)。已提供场景图则精准提取地貌/各视角空间层次/色彩倾向细化沉淀;不符规范或未提供则原创设计四宫格方案。\n\n**经典中式陈设水墨设定(微观质感与明暗对比铁律)**:\n\n- **万古劲松**:枝干粗砺带顿挫焦墨枯笔(rough dry-brush)横向扫拂显皴裂鳞皮,松针高频极细工笔排线(fine-line gongbi)聚团高对比刺芒;松枝底部宿墨/焦墨深色压阵,受光面留白或敷极淡矿物浅金,浓淡墨激烈冲撞透钢骨傲意。\n- **沧桑孤碑**:碑身不规则碎裂硬角,碑面大面积淡墨湿晕(wet-on-wet)打底再干焦枯笔勾裂隙斑驳刻痕,碑文/青苔用高饱和石青朱砂泼彩点缀成刺眼微观亮点,侧面棱角用强烈写意侧光切出硬朗阳角浮雕阴影。\n- **写意竹林**:远景竹林大片湿墨极淡泼墨渐变虚化,近景竹竿爽利饱满中锋干笔(dry calligraphic stroke)拔地而起、竹节焦墨横点顿挫,竹叶快意\"个/介\"字撇叶法边缘毛锋开裂飞白,微风下半透明水墨透光叠层(translucent layered shadows)缝隙洒驳杂碎光。\n\n## 水墨色彩泼彩比例三档(明暗比例)\n\n- **非战斗/意境空镜(文戏最高美学·三维一体)**:工笔细描 35%–40%(主体/关键道具/近景树石边缘极细工笔勾勒保温润细节)+ 意境留白 35%–40%(大面积纯净宣纸留白,云雾烟雨远水淡墨渐变虚化\"虚实相生\",严禁背景画满)+ 古典写意泼彩 20%–25%(仅远山/竹林边缘/飞瀑两侧点缀极淡矿物色 石青石绿浅赭石矿物淡金,墨分\"焦浓重淡清\"五色,光影柔和拒硬边强光)。\n- **常规对打/文武过渡**:均衡比例 约 50%–60% 黑白灰基底 + 40%–50% 泼彩;背景山水墨色大块面泼墨,视觉焦点/地貌层次叠染孔雀蓝或石绿泼彩;强明暗对比(一束强光穿焦墨阴云投战场中央,黑白重墨破呼吸感)。\n- **高潮决战/五行大冲撞**:色彩主导+重墨压阵 约 30% 焦墨骨架 + 70% 爆裂泼彩叠彩;高饱和朱砂红/亮金/石青大面积泼洒激烈碰撞,但用粗旷力量感焦墨宿墨勾结构线条(**墨骨彩衣**),深墨重色把控重心防色彩过载廉价;明暗极致高反差,光影如闪电撕裂漆黑宣纸。\n\n## 分镜时长动态规划(解决全量 5s 单一时长痛点)\n\n**严禁全量套用 5s 默认时长**;须据动作激烈度/信息量/台词字数动态显式设每 shot duration。**牢记 4s 硬性最低时长限制,单镜严格控制 4s–12s,绝对严禁任何低于 4s 的超短分镜。** 匹配规则:\n\n- **极速打斗/瞬发切招/特写(急推/单发重击/瞬移/闪白瞬间)**:4s–6s(侧重爆发力冲击,短时长保高频紧凑武打力道)。\n- **连击/招式交汇死锁角力/大招大对碰**:6s–9s(为复杂动量变化/多段打击/粒子爆散/镜头推拉留充足画面生长时值)。\n- **台词对白/蓄势文戏/写意空镜/妖兽吐息大爆轰**:9s–12s(台词单句 ≤10 字按每秒 2–3 字算保唇形对齐时长,文戏/意境山水慢速平移/云雾晕开留呼吸舒展)。\n\n## 场景强绑定与一致性(从源头防跳画)\n\n- **显式指向场景 ID**:每 shot 必须显式声明所属 scene_id(如 `[Element_Scene_01]`),严禁无场景归属或模糊泛指的镜头。\n- **连续场景完全复用**:相邻镜头同地点同时值、或属同一打斗/对话回合,则所指 scene ID **必须绝对一致(完全相同 ID)**;下游据该 ID 强制加载复用同一四宫格资产,从源头根除场景跳画/背景前后不一致/突变穿帮。\n\n## 打斗风格分级与五行招式呈现\n\n- **风格分级**:人类角色=武侠写实(刀剑拳脚行云流水、拳拳到肉);妖兽角色=魔幻夸张(肉身突变解构、非线性轨迹、撕裂地貌碎裂破坏力);五行使者=虚实结合(法术与真实武术并重)。\n- **五行招式呈现形式**:金(金属锋刃/漫天洒金碎屑/亮白光轨、大开大合无坚不摧)、木(狂草藤蔓缠绕/飞叶如刀/翠绿生机能量流、灵动闪避体术)、水(流体水流/冰锥凝结/水墨晕染、水势与冰刃交替攻守兼备)、火(熊熊烈焰边缘焦墨顿挫、爆裂极速位移打击)、土(崩裂巨石/飞扬沙尘/拔地岩壁、岩石轮廓厚重枯笔飞白)。\n\n**核心招式流派分镜规则 8 类**、**五行相克对决与 5 组克制转场**、**标志性镜头语言(黑白水墨闪/Whip Zoom·Pull·Pan 三急速运镜/连击动能矢量轴线对齐+墨色残影 0.2–0.5s/写意碎落粒子/焦墨烟尘/低角度仰拍/书法大字定格卡 4s)**、**非战斗诗意转场(空镜/墨滴晕染/飞白拖尾/长卷平移呼吸感/陈设特写)** 见 `references/storyboard-rules.md`。\n\n## 对话与音频轨规划\n\n- **对话**:每镜若有角色发言,台词独立写在 dialogue 属性。台词断句用精简有力契合武侠气息的短句(单句 ≤10 字),避免长难句为生成引擎留足音节吐字时长,显式标停顿呼吸口(……/,);台词强绑定说话角色(element character)并指定特写/中景看清唇部开合。\n- **配音音色设定与声音凭证**:含台词角色须显式规划配音音色描述(如「坚毅果敢中高音青年男声,带一丝沙哑水墨侠客质感」)作声音特征地基,指导下游生成并绑定 key_element_audio;用户提供样例则优先提取其音色。\n- **audio_layer**:BGM(古筝/二胡/笛子古典乐器为主,融电子摇滚+重打击乐,为高潮大冲撞预留节奏重音卡点 downbeats 与听觉留白气口 drop/rests)、环境音效层(风过竹林/细雨拍叶/纸张沙沙/水滴融开,建空灵宣纸空间底噪,文武戏转换动态呼吸强弱)、打击与相克音效层(常规武招:刀剑击鸣/肉体闷击/轻功风掠;五行克制大冲撞:据碰撞类型显式规划双层特征写意打击音效,如 \\[金克木\\]=利刃切碎藤蔓金属割裂+草木断裂复音、\\[水克火\\]=怒涛拍击+烈焰碳化高压蒸汽嘶鸣)。\n\n## 流程与自检铁律\n\n1. **规格**(`write_file_v2`:16:9 / 720p / 水墨武侠风格定位 / 配音字幕语言)。\n2. **故事板**(`storyboard_designer`:五行角色 key_element + 镜头列表含书法大字定格卡 + 独立音频轨)。⏸ **节点 A**:故事板输出后暂停,引导确认情节与分镜后方可后续。\n3. **绑定/分析参考素材**(`analyze`:核对人设图是否标准正/侧/背三视图、场景图是否多角度无人物四宫格、画风是否相符;提取矿物颜料 石青石绿朱砂 配比分布、线条笔触粗细顿挫飞白泼墨比例、动作视频帧级节奏 攻击前摇/出招/碰撞打击点/收招帧级时间跨度;沉淀入 Final_Video_Spec 指导下游)。\n4. **图像元素风格化重塑与系统补全**(`generate_image_v3`):角色图**非标准三视图或画风不符**、场景图**非多角度无人物四宫格(或含人物)**——**严禁直接绑定为最终参考**,须 ImageToImage 以原图作空间布局/色彩参考重构为规范三视图或规范四宫格(Grid1 全景定场/Grid2 陈设特写/Grid3 纵深透视/Grid4 气氛光效,2K 无人物);完全缺失则 TextToImage 补全;三视图统一为终极人设规范,后续多姿态生成必引其作核心 reference_image;四宫格提示词强制 `4-grid layout, no characters` 且固定四格内容。**绑定与闭环自检(严防遗漏)**:所有重塑/补全/原图 asset_id 绑至相应 key_element,进下一步前**必须逐一核对**故事板所有 key_element(角色/场景/关键道具)均已生成并绑定、无一遗漏,发现遗漏立即补全/补绑,**严禁资产未完全对齐就启动逐镜视频生成**。\n5. **逐镜视频生成与连贯性**(`generate_video_v3`,720p):**逐镜前置一致性自检(铁律)** 生成每镜前须将提示词与故事板深度对齐核对:①人物参考(所有角色已用 `<<<image_x>>>` 或特征描述指代绑定,防遗漏/无关人物);②**场景参考强绑定防跳画铁律**(shot 已显式关联特定 scene ID、该场景四宫格已生成绑定并在提示词用占位符绝对绑定;**绝对严禁**场景参考未绑定/ID 缺失/同地点 asset_id 不一致就启动;自检发现漏绑强制回溯先补四宫格资产再生成);③台词对白 100% 完整封装进语法块(`{dialogue}`)且对应 key_element_audio 作 reference_audio;④动作/五行特效/急速运镜/SFX 与分镜吻合;任何漏项立即修正,严禁带错启动。视觉一致性:每镜必输入对应 element character 图+element scene 图作 reference_image;相邻镜头动作/场景极高连贯需求可将前一镜视频作 reference_video。声音口型:含台词镜头绑对应角色 key_element_audio 作 reference_audio 保跨镜口型音色一致。**时值**:严格读取继承 shot duration,严格 4s–12s,严禁低于 4s 或全量套 5s,动作切换明显时主动切镜。\n6. **声音与配乐**(`generate_audio`):角色对白配音(MiniMax Speech 2.8 HD 等,注册/绑定为 key_element_audio 保跨镜音色)+ 说书人宿命感老者旁白 VO;传统中国风 BGM + 高频刀剑打击/招式爆发 SFX。有用户样例则提取音色克隆。\n7. **时间线剪辑合成**(`composite_video`):严格按武打卡点与\"黑白水墨闪\"时值快速剪辑与音画对齐。详见 `references/editing-and-audio.md`。\n\n**执行控制暂停节点**:**资产生成前置确认(核心铁律)**——生成任何新资产(元素图/逐镜视频/音频)前**必须暂停**告知用户生成计划(含提示词或参考关系),获确认许可后方可调工具;**节点 B(资产核对确认)**——每批次/重要资产生成或重塑完成后向用户展示,所有图像元素资产生成完毕后**全局自检核对绑定状态**、向用户展示完整角色与场景绑定关系,获确认满意后方可推进。\n\n## 配合(query 可同时加载)\n\n无源生依赖(源内 planner/storyboard_designer/multimodal_analyze/media_generator/write_the_prompt/video_assembler 均为内部阶段,本 skill 完全自足)。\n\n边界(勿用本 skill,改道):通用 2D 动画 → cartoon-flow;其他动画风格 → ghibli-anime-style / needle-felt-animation / mahou-shoujo-90s;国风纯意境实拍 → guofeng-mood-style;张艺谋式国风武侠实拍 → zhang-yimou-style。", "extras": [], "cn": "泼墨侠客·写意武侠动画"}, {"slug": "james-cameron-cinematic-style-builder", "desc": "致敬詹姆斯卡梅隆经典影视《泰坦尼克号》《阿凡达》等经典", "body": "## Skill 简介\n\n本 Skill 旨在深度复刻导演詹姆斯·卡梅隆（James Cameron）的电影美学与叙事逻辑。通过其标志性的“六维心智模型”与“视觉 DNA”，将普通剧本转化为具备史诗感、科技感与真实物理质感的电影级视觉作品。\n\n## 核心逻辑\n\n1. **叙事引擎**：聚焦跨阶级爱情、灾难倒计时、自我牺牲以及“技术与人”的对抗。\n2. **视觉 DNA**：\n   - **色彩配方**：冷钢蓝（#4A6B8A）与火焰橙（#D4782F）的高对比互补色调。\n   - **镜头语言**：斯坦尼康长镜头、POV 视角、低角度仰拍机械巨物，强调物理逻辑的连续性。\n   - **视听哲学**：液态/流体的视觉母题，以及强调机械质量感的音效逻辑。\n\n## 适用输入\n\n- 电影或短剧剧本片段\n- 故事梗概或世界观构思\n- 具体的视觉创作需求\n\n## 操作步骤\n\n1. **风格转换**：基于卡梅隆的决策启发式（如“英雄必须承受”、“反派技术化”）对输入内容进行重构。\n2. **资产规划**：\n   - **人物立绘**：生成专业级角色三视图、细节拆分与多表情特写。\n   - **场景设计**：采用影视级九宫格布局，涵盖全景、鸟瞰及材质细节。\n   - **道具设定**：输出写实质感的产品三视图。\n3. **视频拆解**：按 2.5 字/秒对剧本进行自动分段，计算各段动作节拍与时长。\n4. **提示词生成**：注入卡梅隆风格前缀（侧视图、浅景深、蓝橙逆光），生成适配 Seedance 2.0 的视频提示词。\n\n## 输出要求\n\n- **拍摄方案**：完整的角色设定集、场景九宫格与道具图。\n- **视频分段表**：包含每段视频的起止时间、对白内容、动作描述及视觉风格参数。\n- **技术参数**：严格控制景深、构图角度与色彩逻辑，确保画面具备“卡梅隆式爆炸”或“卡梅隆式安静”的节奏感。\n\n## 注意事项\n\n- 禁止使用伪纪录片晃动风格，必须保持空间关系绝对清晰。\n- 主角必须在崩溃的物理系统中穿梭并承受代价，拒绝平庸的获胜逻辑。\n- 结局必须具有意义的传承，避免虚无主义倾向。", "extras": [], "cn": "致敬詹姆斯卡梅隆电影短剧"}, {"slug": "japanese-blues-aesthetic-director", "desc": "制作日系写实蓝调小清新实拍风图片与完整视频，覆盖参考图分析、Vibe Creating 创意提纯、人物场景道具资产、逐镜首帧、5 秒与 15/30/60/90 秒分镜、Seedance 2.0 或可灵/Kling 中文提示词、镜头连续性、BGM、剪辑、调色、失败补救和成片审核。用于人物情绪片、校园与城市日常、情侣片段、旅行记录、生活方式短片、社交封面，以及用户要求检查、优化或执行此类视频 Skill 的场景。", "body": "# 日系写实蓝调小清新实拍风导演\n\n## 1. 交付目标\n\n把用户的主题、故事、参考图或已有资产转成真实、轻盈、安静、克制、有呼吸感的图片或视频。让人物属于真实空间，让情绪通过时间、动作、环境和声音发生，而不是靠滤镜、摆拍或夸张表演。\n\n先区分两种交付，不得混称：\n\n- **完整生产方案**：交付创意、资产、逐镜首帧、逐镜提示词、剪辑和审核文件，可直接进入生成。\n- **完整成片执行**：在可用工具允许时继续完成素材生成、逐镜筛选、剪辑、声音、调色和导出；没有实际生成或导出成品时，不得宣称“成片已完成”。\n\n用户要求“完整视频”“做成片”或 30 秒以上内容时，不得只给一个创意、一张首帧或一条长提示词后结束。\n\n## 2. 输入与最小追问\n\n先提取：主题、应用场景、时长、画幅、人物、地点与时间、情绪变化、参考资产、指定模型、台词/旁白、音乐、字幕和交付类型。\n\n仅在下列缺口会实质改变结果时追问，合并成最多 1 轮、1-3 个问题：\n\n- 正式成片缺少时长或画幅。\n- 只有抽象感受，没有可见主体、状态或场景。\n- 参考图之间人物、服装、光线或空间明显冲突。\n- 多人左右站位、首尾帧或关键道具归属不明。\n- 用户要求精确对白同步，却未给台词或说话人。\n\n其余缺口用克制默认值补齐并列出假设。仅做功能测试且用户完全未指定时，可默认 `15 秒、16:9、无字幕、后期统一 BGM`；正式交付不得静默套用测试默认值。\n\n## 3. 风格硬边界\n\n必须做到：\n\n- 低饱和蓝灰、浅青、奶白、自然木色与少量现实淡黄灯光。\n- 蓝调时刻、阴天漫射光、清晨窗光或雨后冷暖混合光。\n- 真实皮肤、织物、玻璃、湿地和生活使用痕迹。\n- 人物与空间关系清楚，背景保留叙事信息。\n- 正常实时速度、自然小动作和有动机的克制运镜。\n- 慢中有细节、静中有变化，情绪至少发生一次可见但轻微的移动。\n\n必须避免：\n\n- 网红写真、糖水片、甜宠偶像剧、MV 式强卡点。\n- 高饱和粉蓝、赛博霓虹、整张画面涂蓝、肤色病态发青。\n- 玻璃肌、过度磨皮、棚拍、夸张逆光、满屏光晕。\n- 无缘由慢动作、漂浮式运镜、环绕镜头、频繁变焦和模板转场。\n- 大哭大笑、舞台式表演、同一动作与景别反复出现。\n\n风格判断、题材变体和评分细则读取 01\\_风格系统与题材边界.md。\n\n## 4. 渐进式披露路由\n\n只读取当前任务需要的文件；完整视频按下列强制项读取。\n\n任务必读文件单图、系列图、参考图转化`01、03`5 秒单镜`01、03、04` + 对应模型 `05` 或 `06`15 秒短片`01、02、03、04、09、10` + 对应模型；需要声音时读 `07`30-90 秒完整生产方案`01-04、08-11` + `05` 或 `06` + `07`实际生成与成片执行完整生产方案全部文件，并循环执行 `10` 的审核与补救测试 Skill`12-16` 中选择与任务最接近的案例，不要全部载入\n\n参考文件：\n\n- 02\\_完整工作流与交付状态.md\n- 03\\_资产与逐镜首帧.md\n- 04\\_节奏运镜切镜.md\n- 05_Seedance2执行规范.md\n- 06\\_可灵Kling执行规范.md\n- 07_BGM声音剪辑调色.md\n- 08_VibeCreating转译.md\n- 09\\_连续性与多人场面.md\n- 10\\_失败补救与最终审核.md\n- 11\\_完整项目输出模板.md\n- 12\\_完整测试提示词.md：测试 60 秒完整生产闭环。\n- 13_15秒测试案例.md：测试三镜高稳定结构。\n- 14_60秒完整测试案例.md：核对动作拆分、时长与连续性。\n- 15\\_可复制提示词案例.md：需要模板或语法示例时读取。\n- 16\\_回归测试矩阵.md：修改 Skill 后选择 3 类回归测试。\n\n## 5. 创意与执行双层\n\n先判断输入是否适合 Vibe Creating。人物情绪、生活切片、记忆和旅行体验可提纯；精确对白、工业执行单、功能演示或用户明确要求保留参数时，保留原结构，不强行散文化。\n\n### 创意层\n\n生成一条创意母句：\n\n```text\n视觉锚点 + 人物状态/主动作 + 2-4 个视觉或声音母题 + 应用场景 + 一次轻微情绪变化\n```\n\n不得凭空新增人物关系、秘密、反转或用户未给出的情节。\n\n### 执行层\n\n把母句拆成风格圣经、段落、资产、镜头、首帧、起止状态、模型提示词、声音和审核项。用户指定的台词、旁白、歌词、音乐、音效、时长、画幅、结构和模型优先保留。\n\n详细路由读取 08_VibeCreating转译.md。\n\n## 6. 完整生产状态机\n\n```text\nBrief 锁定\n→ 创意母句与情绪曲线\n→ 风格圣经\n→ 人物/场景/道具资产锁定\n→ 段落与成片时间线\n→ 逐镜生产表\n→ 全片首帧接触表检查\n→ 逐镜首帧/尾帧\n→ 按镜头路由模型\n→ 分批生成与筛选\n→ 初剪与连续性修复\n→ BGM/环境声/字幕/调色\n→ 技术检查与导出\n```\n\n每一阶段标记 `待处理 / 已完成 / 需返修`。发现问题先回到最接近的上游节点修正，不用不断追加反向词掩盖错误。\n\n## 7. 镜头预算与时长\n\n每个生成镜头最多包含：\n\n```text\n1 个主要人物动作 + 1 个环境事件 + 1 种主运镜\n```\n\n把拿取、换手、打开、行走视为不同主要动作；道具交接必须显式拆镜，不能让上一镜“尚未拿伞”、下一镜直接“已经撑伞”。\n\n同时记录两种时长：\n\n- **生成时长**：选择模型界面当前支持的档位，并预留动作前后余量。\n- **成片取用时长**：写进剪辑时间线，所有镜头之和必须等于目标时长。\n\nSeedance 执行提示词不写绝对秒数；秒数只保留在导演表和剪辑表。动作复杂度、5 秒节拍和长片波形读取 04\\_节奏运镜切镜.md。\n\n## 8. 模型按镜头路由\n\n- **可灵/Kling 优先**：高质量单首帧自然动起来、真实人物微动作、风雨光影、轻跟拍或首尾帧过渡。\n- **Seedance 2.0 优先**：多模态资产绑定、多主体、明确空间关系、镜头顺序、台词/音效符号和工程化交付。\n- **后期完成**：30 秒以上的节奏、转场、BGM、字幕和整体调色，不依赖一次模型生成。\n\n允许同一项目按镜头混用模型，但每个镜头只输出对应模型的可执行版本，并在项目表记录来源；不得把 Seedance 绑定语法写进可灵提示词。任何依赖具体版本的 Multi-Shot、首尾帧或原生音频功能，先核对当前界面；能力不可用时退回逐镜模式。\n\n高稳定默认：5 秒单镜生成；15 秒拆成 3 个独立镜头；30-90 秒全部逐镜生成。整段 Multi-Shot 只作效率测试，不作唯一交付。\n\n## 9. 提示词不变量\n\n- 默认只输出中文提示词；用户明确要求时再附英文版。\n- 每条独立提交的提示词必须自包含，不依赖上一条提示词的主体定义或状态记忆。\n- Seedance 主体采用“直接绑定”或“先定义后复用”之一，不得混写。\n- 所有普通 `@图片N / @视频N / @音频N` 前留空格；`<主体N>@图片N` 内部不拆开。\n- 单镜只写一种运镜，不写互相冲突的机位变化。\n- BGM 默认在后期统一铺设；逐镜视频只请求必要环境声。\n- 无字幕任务挂载无文字、水印和 Logo 约束；字幕只在后期添加。\n- 最终给视频模型的提示词只保留可执行内容，不夹带诊断、模板说明或“优化问题”。\n\n## 10. 分批交付防截断\n\n30-90 秒项目优先生成文件或分批输出：\n\n1. `项目总表 + 风格圣经 + 资产卡`。\n2. `时间线 + 全片连续性总表`。\n3. 每批 4-6 镜的 `首帧 + 视频提示词`。\n4. `声音剪辑 + 失败补救 + 最终审核`。\n\n每批开头重载项目总表，结尾更新已完成镜头和下一批起始状态。不得因为消息长度只交付前几镜后宣称完成。结构读取 11\\_完整项目输出模板.md。\n\n## 11. 完整视频退出条件\n\n完整生产方案只有同时满足以下项目才可结束：\n\n- 目标时长、画幅、交付模式和默认假设已明确。\n- 有创意母句、风格圣经、情绪曲线和唯一视觉母题组。\n- 有人物、场景、道具资产卡和引用映射。\n- 成片取用时长总和准确。\n- 每镜有唯一功能、起止状态、动作、环境事件、运镜和切镜动机。\n- 每镜有可动首帧或首尾帧方案，以及对应模型的自包含提示词。\n- 道具换手、开合、人物方向和光线推进均有显式过渡。\n- 有统一 BGM、环境声、字幕策略、调色和导出规范。\n- 有 A/B/C 版本、补镜头和失败回退路径。\n- 通过 10\\_失败补救与最终审核.md 的硬失败检查与评分门槛。\n\n完整成片执行还必须额外满足：素材已生成并筛选、剪辑时间线已落地、声音和调色已完成、最终文件已导出并实际复核。\n\n最终结果应像一段真实生活被安静观察：观看注意力持续移动，人物发生很小但清楚的变化，结尾留下余味，而不是漂亮照片轮播。", "extras": [], "cn": "日系写实蓝调小清新导演"}, {"slug": "koreeda-film-aesthetic", "desc": "是枝裕和电影美学。生活肌理包裹克制情感。\\\" version: 1.5.2", "body": "# 是枝裕和电影美学\n\n> 🔴 **请严格按照该 SKILL 分步执行。** 版本：1.5.2\n>\n> 底层 DNA（无条件，每条画面都带）\n\n1. 🔴 **自然漫射生活光为主光（是枝签名，最重要）**：光是\"这个空间本来就有的光\"——窗户透进的天光、屋檐下的散射、纸窗/纱帘过滤的柔光、室内一盏灯的暖。光源自然、方向可辨但不戏剧化，**绝不追求逆光开花/过曝签名感**。人脸被均匀柔和地照亮、五官清晰可读，暗部保留细节与空气。**平实而非高调**：既不刻意提亮往亮里推、也不压暗低调，还原眼睛看到日常空间时的真实明度。\n2. 🔴 **平实通透 + 呼吸感空气**：画面整体平实、干净、通透，有生活空间的纵深与空气感，但**没有柔光滤镜、没有 halation 开花、没有光雾朦胧**。清澈但不冷硬，柔和但不糊。杜绝一切数字硬锐高清纪实的塑料感，也杜绝一切梦幻柔化的糖水感——要的是\"清醒的、可信的日常\"。\n3. **65mm 胶片干净质感（务必干净，不脏不旧）**：细腻高解析的胶片密度感 + 极干净通透的层次，色彩自然真实、有胶片的温润与厚度但**绝不粗颗粒、不脏、不做旧、不复古怀旧滤镜**。65mm 的精髓是\"胶片的温度 + 极高的干净度与细节保留\"——颗粒极细几乎不可见、暗部干净、层次丰富。去掉的是数码的火气与廉价感，不是清晰度。\n4. **暖调可用铁律（与岩井相反）**：**不禁暖色**。是枝的日常里本就有大量暖——木质地板与家具、榻榻米的草黄、饭菜的热气与油光、傍晚的暖灯、夏日的皮肤。暖色是生活的体温，自然出现即保留，不做冷调纠偏。但**暖而不腻不夸张**：是\"生活里真实的暖\"而非\"调色调出的橙黄膜\"，整体仍以自然中性为底、暖色作为空间与情感的呼吸点。\n5. **中等对比 + 层次丰富**：对比自然真实，明部暗部都有细节与层次，暗部干净不闷、不死黑也不刻意提亮，还原真实空间的光影分布。\n6. **中等景深、空间可读**：不做极浅焦柔化。背景保留可辨的生活环境（房间、街巷、庭院），景深服务于\"人在空间里\"的关系,而非把背景全糊成光斑。人物与其所处的生活空间同等重要。\n7. 🔴 **情绪内核：日常肌理包裹克制情感（是枝灵魂，务必拉住）**：这是是枝最核心的气质——镜头是一个温柔的旁观者，安静地凝视普通人的吃饭、走路、对话、沉默。情感**藏在日常动作与留白里**，从不外放、从不煽情、从不给特写强调。底下流动的是家庭的羁绊、生与死、缺席与陪伴、时间的流逝与无法言说的遗憾。⚠️ 绝不能做成煽情催泪、也绝不能做成冷漠疏离的纪实——差别全在这层\"克制的温柔凝视\"：镜头爱着这些人，但保持恰当的距离，让观众自己看见、自己感受。\n8. **让日常自然流动**：饭菜的热气、晾晒的衣物在风里、孩子跑过走廊、蝉鸣与远处的声音。时间在以生活本身的节奏流逝，不催促、不停顿。\n9. **范围**：只做日常写实一支，不做类型化戏剧冲突/强情节奇观。\n\n## 质感尾词（每条图像 prompt 默认带）\n\n`65mm 胶片干净质感，色彩自然真实有胶片温润密度（干净通透不脏不做旧不复古滤镜），自然漫射生活光、柔和均匀照亮五官清晰可读，暖调可自然保留（木色/暖灯/肤色不做冷调纠偏），平实通透、有生活空间纵深与空气感（无柔光滤镜无halation无光雾），中等对比层次丰富、暗部干净不死黑不闷，中等景深、背景生活环境可辨，克制平实的日常凝视温度；不要逆光开花过曝、不要柔光滤镜朦胧、不要高调提亮、不要粗颗粒做旧脏旧、不要浅焦全糊成光斑、不要煽情戏剧化打光`\n\n## 流程\n\n> 🔴 **全局询问规范（所有确认环节强制）**：本 SKILL 中每一次需要用户确认或选择的环节，一律以**选项卡**形式跳出（可点击的选项按钮），不要用纯文字提问让用户打字作答。封闭式问题（时长/模式/画幅/语言/字幕/音乐等）给出预设可点选项 + 必要时附\"自定义\"选项；开放式内容（3 核心元素、故事大纲）也用选项卡承载（如\"我来提供\"/\"帮我生成\"等入口选项，用户选\"我来提供\"再补充文字）。⚠️ 曾出现多个确认环节未跳选项卡的问题，此规范用于杜绝，任何确认都不得退化为纯文字问答。\n\n1. **统一入口问询（单一选项卡询问框）**：一次问清 ① 时长（单镜≤15秒 / 单集30-60秒 / 多集数分钟 / 自定义）② 执行模式（全自动/手动确认）③ 视频画幅分辨率（默认 16:9，可选 4:3 / 16:9 / 21:9 / 自定义输入）④ 对白语言 ⑤ 3 个核心元素（生活空间/家庭关系/日常物件锚点）⑥ 是否已有故事大纲（有则请用户提供）。全部以选项卡形式跳出、写入 memory。⚠️ 仅\"信息征集\"合并到此框；moodboard 与故事的**生成动作**须等用户答完后在第 2、3 步执行，不并入询问。\n2. **风格确认（生成动作）**：据入口的 3 核心元素 → 生成 moodboard（图像生成能力，默认 16:9，单一融合画面铺满出血、禁白边/拼贴/分格）→ 存为风格锚资产、记下归档标记。\n3. **故事（生成动作）**：入口已提供大纲则遵循、仅叠加是枝风格化；无大纲则按 3 元素生成（家庭/日常/生死离别/时间流逝/克制的羁绊）。🔴 **必须写足日常对白/旁白，禁止一刀切拍成无台词默片**：是枝的\"克制\"指对白平实生活化、不写戏剧化煽情台词，**不是不说话**——他大量使用饭桌闲聊、家常絮语、答非所问的日常对话，这正是其味道所在。基调按\"该说话则说足、该沉默则留白\"平衡：饭桌/相处/对话等场景必须写出生活化对白，独处/凝视/过渡/时间流逝等场景才保持沉默留白；沉默镜须是有意为之、不得作为省略对白的偷懒。⚠️ 生成故事与分镜时逐场检查：该有对白的场景不许空着。\n4. **资产 + 分镜表（一并产出、统一确认）**：\n   - **先产资产**：有戏角色必产白底棚拍模卡定妆图（锁脸/服装/发型），后续镜头一律 @角色名 引用。🔴 **场景图必须为纯环境空景、绝不出现任何人物**（含背景路人、人影、剪影、模糊人形、镜中人影一律禁止）——人物只在第 5 步视频生成阶段经角色图引入；场景图一旦带人会与角色模卡冲突、导致视频里人物脸/身份漂移、一致性锁不住。场景图单张、绝不分屏。🎨🔴 **场景图生成时必须在 prompt 里显式 @moodboard（第 2 步存下的风格锚资产）作为参考图垫入**——这是硬约束、不是可选项，缺失即重做。moodboard 仅锚色调/光感/质感、不锚构图，用于统一全片色调。⚠️ **务必区分\"哪些阶段挂 moodboard\"**：**只有场景图这一处挂 moodboard**；人物模卡、道具合图、以及第 5 步视频生成阶段**一律不挂 moodboard**（视频参考只有场景图/人物图/道具图，见第 5 步与视频模板）。本 SKILL 中多处\"不挂 moodboard\"的约束仅针对视频/人物/道具，**不得**泛化覆盖到场景图。负面加\"人物、人影、路人、剪影、人形\"。具名道具汇总一张白底道具合图。\n   - **再列分镜表**：基于故事与已产资产，列出完整分镜表（每镜：景别 + @角色动作 + 运镜 + 环境 + 时长），分镜须 @角色名、引用对应场景图。\n   - 🔴 **统一确认（单一选项卡询问框）**：资产图与分镜表一并打包给用户，用选项卡一次性确认（确认无误 / 需要调整）；用户选\"需要调整\"则据反馈修订后再确认。确认通过才进入第 5 步，让视频生成更丝滑。\n5. **生成视频**：按**已确认的分镜表**逐条生成，场景图+角色图（+含具名道具时挂道具合图）作参考锁一致性，分镜写进 prompt 时间轴。🔴 **视频生成不挂 moodboard 风格锚**（moodboard 只用于场景图生成阶段，视频参考只有场景图/人物图/道具图）。\n6. **音乐**：等视频人物全定稿后再确认方向、再生成（默认 mureka）。🔴 **生成后先不合成进视频**——因当前 agent 工具在含音乐的视频上加字幕会出问题，音乐须暂存、等第 8 步成片后统一询问框里再由用户决定是否合成（且执行时必先字幕后音乐）。\n7. **合成**：跨 15 秒才拆多条、串行后用视频合成能力拼接。\n8. **成片后统一处理与询问（单一选项卡询问框）**：🔴 所有视频节点生成完、并按第 7 步合成成完整成片后，用**同一个选项卡询问框**一次性让用户选择（可多选）：① 是否需要加字幕 ② 是否需要合成背景音乐（第 6 步已生成的）③ 是否需要修改背景音乐后再合成。\n   - 🔴🔴 **字幕选项卡文案必须按对白语言正确生成（易错点，重点核对）**：生成\"加字幕\"这个选项时，文案里描述的字幕类型必须与下方 add_subtitle 的语言策略一致——对白**中文**才写\"单语中文字幕\"；对白**非中文（含日语、英语等）必须写\"双语字幕：中文 + X语（如中日双语）\"，严禁写成\"单语X语字幕\"**。⚠️ 曾出现日语对白却把选项写成\"单语日语字幕\"的错误，生成此选项前先回读 add_subtitle 策略再落文案。\n   - 🔴 **执行顺序强制\"先字幕、后音乐\"**：即便用户在同一框里同时勾选了字幕与音乐，实际执行也必须先完成字幕、再合成音乐——因当前 agent 工具在含音乐的视频上加字幕会出问题，顺序不可颠倒。\n   - 🔴 **音频合成默认混音值**：合成背景音乐时，默认将视频原始声音（环境音+对白）音量 **+8dB**、背景音乐音量 **-2dB**，让对白与环境音清晰在前、音乐退在生活后面（契合是枝\"音乐不抢戏\"的原则）。用户另有指定则从其要求。\n   - 若选\"修改背景音乐\"：先按用户意见重新生成/调整音乐，再在字幕完成后合成。\n   - **后期剪辑工具**（工具：agent.tool.edit_video；用户未提及的处理不擅自调用，仅按上方询问结果与用户明确要求执行）：\n     - **字幕** add_subtitle：白字黑色描边。🔴 **字幕语言策略按对白语言分情况（硬约束，选项卡文案与实际生成都须遵守）**：对白为**中文**→默认只生成**中文单语字幕**；对白为**非中文**（日语/英语等）→默认生成**双语字幕，上轨中文、下轨影片使用语言**（例：日语对白→中日双语，上中文下日语；英语对白→中英双语，上中文下英语）。⚠️ 非中文对白**绝不可**只出单语原文字幕。用户另有指定则从其要求（如只要单语、或调整语言）。\n     - **转场** transition：用户提及但未指定方式→默认直接硬切（是枝极少用花哨转场）；可选硬切/淡入淡出/黑场；AI转场不在此列。⚠️禁溶解叠化只约束视频生成阶段，合成后可正常加转场。\n     - **抽帧** extract_frames：agent 自动调用辅助判断转场；用户也可主动要求。\n     - **裁剪** clip：秒级精度，用户描述需裁剪内容后执行。\n     - **文字贴片** text_overlay：片名/章节 title card、cast 名单、人名条；用户可自定义文字内容与样式。\n   - 所选项全部完成后收尾出片。\n\n## 画幅与画质（写死）\n\n可选比例统一为 4:3 / 16:9 / 21:9 三种，用户也可自定义输入并保留其选择。默认全部首推 16:9：moodboard 16:9；场景图 16:9；人物模卡 16:9；视频默认 16:9（可改）。图像默认 libimage 模型、2K 分辨率、标准画质（用户可改）。视频默认 720p 分辨率（用户可改）。\n\n## 图像 prompt 语言\n\n主体中文；技术词（65mm/diffused light）必要时留英文。负面词与正文物理分离、放独立负面字段。\n\n## 人物铁律\n\n- **锁质感、放身份**：65mm 干净胶片质感是硬约束；发色/发型/服装/身份气质尊重用户设定、不做是枝化纠偏。\n- **皮肤是自然真实的血色**：整体自然中性调，肤色真实健康、有血色与生活质感（可微暖），不刻意美白也不青灰暗沉、不磨皮塑料。是枝的脸是\"生活里的真实的脸\"——有细节、有年龄、有呼吸。\n- **模卡 ≠ 出片**：模卡用纯白底 + 明亮均匀棚拍正面光（脸充分提亮、面部细节优先），绝不用逆光/戏剧光。版式 16:9：左三视图（正/侧/背）+ 右大面部特写（必出、不可省、不可画成全身）。\n- 🔴 **模卡模板（照填，禁改结构与质感尾词，只换 \\[\\] 占位；若版式散架/视图不全退回英文版）**：\n\n```\n纯白无缝背景角色三视图定妆图，16:9 横向排版，严格分为必须同时存在的两个区域。左区：同一角色正面/侧面/背面三个全身视图并排站立，高度一致、脚部对齐。右区（必须存在、不可省略）：同一角色的大幅面部特写占据右区大部分，清晰呈现脸部与上胸，用于锁定脸型、眼神、年龄与皮肤——右区特写与左区三视图同等重要、必须渲染出来。是枝裕和电影质感，应用于[角色身份与气质]，明亮柔和均匀的棚拍正面光充分照亮面部、五官细节清晰真实，皮肤自然健康有真实血色与生活质感（不暗沉、不蜡黄、不发灰、不瞨皮塑料、不刻意美白），[体态]，[发型与发色]，[服装]，[神态与眼神]，不持有任何道具书包饰品（仅人物本身，道具单独出道具图），自然放松中性站姿，色彩自然真实有胶片温润密度以[自然色调1]和[自然色调2]为基调（真实鲜活不寡淡不做旧、暖色可自然保留），细腻65mm胶片干净质感（颗粒极细几乎不可见、干净通透不脏不做旧不像老照片），明亮均匀的棚拍干净风格，高细节真实面部，清晰五官，所有视图与特写保持同一角色一致性\n```\n\n负面(独立框)：`磨皮塑料脸、油亮偶像滤镜、锐利数码渲染、逆光、过曝、柔光滤镜、halation、光雾、死黑、高对比、寡淡发灰做旧、粗颗粒脏旧、复古怀旧滤镜、暗沉蜡黄皮肤、刻意美白、背包书包手持物饰品道具、面部不一致、换了另一个人、多个不同角色、两张分开的角色卡、右区出现全身像、缺少面部特写、复杂背景、水印`\n\n- 🔴 **人物图不带任何道具**：模卡只出人物本身（身形/服装/发型/脸），绝不背包/拿手机伞书本/戴非必需饰品——道具一律由道具合图统一管、后续镜头再引用（防人物图自带道具与道具图冲突）。贴身服装不算道具；负面加\"背包、书包、手持物、饰品、道具\"。\n- **儿童安全**：禁\"未成年年龄数字+身体围度词+暴露服装\"三连，改学龄气质词。是枝作品常有儿童主角，尤须严守此条。\n\n## 场景卡（按场景取用，共享底层 DNA）\n\n- **家宅室内（招牌）**：日式或普通民居室内，天光从窗/纸窗漫射进来是主光，木质地板家具与榻榻米的暖、生活物件杂而有序、真实居住痕迹。柔和均匀、层次丰富、暖调自然保留、中等景深保留房间纵深。人物在空间里做日常动作（坐、走、忙碌），非摆拍。\n- **饭桌/厨房（是枝灵魂场景）**：一家人围坐吃饭或厨房备餐，饭菜热气与油光、餐具碗筷、家常的暖。头顶或窗侧自然光，暖调温润、氛围松弛日常，多人同框、关系在空间里展开。⚠️ 是枝最标志性的场景，务必拍出\"生活的温度与松弛\"，不摆拍、不刻意、有声音有动作有热气。\n- **走廊/檐廊/庭院过渡空间**：室内外之间的过渡地带（走廊、缘侧、门口、庭院），光线明暗过渡自然，人物穿行或停留、常有留白与等待的静默。是枝爱用这类\"空间的呼吸口\"。\n- **外景日常**：街巷/坡道/河边/上学放学路。晴天自然软光（非戏剧逆光）/ 阴天柔和漫射 / 傍晚暖光（暖调自然保留、不做冷调纠偏）。人物走在真实生活街景里，环境与人同等重要。\n- 🌊 **海街/夏日日常（招牌，必出高水准）**：夏日的明亮日常——蓝天、绿植、蝉鸣感、晾晒的白衣物在风里、海边或坡道或庭院，自然强日光但**柔和真实不开花不过曝**、暖调自然保留（皮肤的暖、木色的暖）、色彩自然饱满有生活感、中等景深保留环境。人物在日常里走动/停留/相处。负面锁：逆光开花、过曝死白、柔光滤镜朦胧、粗颗粒做旧、冷调纠偏、浅焦全糊。用户一提夏日/海街日常无条件套此卡、出图自查光柔和真实、暖调保留、环境可辨。\n  - 完整 prompt（可直接用）：`是枝裕和式夏日日常场景，明亮温润的自然日光（柔和真实、绝不逆光开花绝不过曝死白、无柔光滤镜无光雾），蓝天与浓郁自然的绿植、晾晒的白色衣物在风中轻摆，日式民居庭院或海边坡道或安静街巷，暖调自然保留（皮肤的暖、木质的暖、阳光的暖，不做冷调纠偏也不夸张成橙黄膜），色彩自然饱满有生活质感与胶片温润密度（干净通透不脏不做旧不复古滤镜），中等景深、背景生活环境清晰可辨（非浅焦全糊成光斑），中等对比、明暗层次丰富、暗部干净不死黑，细腻65mm胶片干净质感、颗粒极细几乎不可见，克制平实的日常凝视，画面有生活的呼吸与温度`\n\n## 运镜（每镜配一种，与情绪咬合，默认静观）\n\n固定长镜凝视 / 缓慢横移跟随 / 缓慢推近（克制、几乎不易察觉）/ 固定中景等待 / 轻微手持生活呼吸感（非冲击式）/ 定点旁观。⚙️ 快速运镜、手持冲击跟拍、急推拉、跳切默认禁用，仅用户点名时启用。是枝的镜头是\"安静的旁观者\"，动得越少越对。\n\n## 剪辑节奏（默认静观长镜一支）\n\n- 默认实时速度、镜头较长、给动作与沉默留出完整时间，禁快剪、禁频繁切换、禁跳切（仅用户点名时启用）。\n- 镜头可以长时间停留在一个日常动作或一段沉默上，让时间自然流逝。\n- 景别变化区间：**硬切时相邻镜头景别至少要有肉眼可辨的落差、避免\"切了等于没切\"**——紧挨的一档（如中景↔中近景、中近景↔近景）差别太小不算有效切换，硬切时景别至少隔一档（如中景→近景、全景→中景）才有落差感。但**上限仍是禁暴跳**（近景↔大全景这类跨度过大禁用）。即：硬切景别变化落在\"隔一档\"到\"跳两档\"之间，既有区分度又不突兀。若剧情就是要同一景别静静停留，则不切、用一个长镜到底，而非切到一个几乎相同的景别。\n- 让一个动作/一段对话/一次沉默完整发生，不打断、不催促。每镜承载一段完整的生活时间，而非一个动作节拍。\n\n## 音乐（纯器乐无歌词，默认 mureka）\n\n- 气质：克制、温润、留白、绝不煽情，靠音色与氛围而非旋律推进，音乐是日常的底色而非情绪的强调。\n- 🎹 **第一支·日常温润**（钢琴/木吉他+弦乐辅底）三子支：\n  - A·家庭日常：钢琴或木吉他简单温暖的动机、弦乐暖底、旋律亲切不复杂。用于饭桌/家宅/日常相处。\n  - B·流动的时间：钢琴单音有空间感、留白多、旋律稀疏、有时间缓缓流逝的呼吸。用于走路/等待/季节转换/独处。\n  - C·离别/思念：弦乐长音克制内敛、旋律隐忍不外放、留白处即情感。用于告别/缺席/怀念/生死。\n- 🌾 **第二支·安静留白**：极简，钢琴单音或环境音或近乎无声的织体，弱旋律强空间，让环境声（蝉鸣/水声/风）成为主角。用于凝视/沉默/空镜/时间流逝。\n- 🌿 **第三支·温暖日常律动**：木吉他或钢琴带轻柔的节奏感（非强节拍）+温暖明亮、有生活的轻盈流动感。唯一允许有轻微律动的支，但仍克制——是\"平常日子里的轻快\"、非欢快煽动。用于孩子玩耍/夏日出行/轻松的家庭时刻。\n- **选支**：家宅饭桌→A；走路等待独处→B；离别思念生死→C；凝视沉默空镜→第二支；孩子玩耍夏日轻松→第三支。同一片多支并存随段落切换。\n- 禁强鼓点/流行编曲/强卡点/管弦爆炸/煽情弦乐洪流/催泪高潮/歌词人声。是枝的音乐永远退在生活后面、绝不冲到情感前面。\n\n## 生成后自查（不达标则重做）\n\n光是否自然漫射生活光而非戏剧逆光开花（须自然）？是否有柔光滤镜/halation/光雾（禁，须平实通透）？五官是否被均匀照亮清晰可读？暖调是否自然保留而非被冷调纠偏（暖可用）？质感是否干净通透而非粗颗粒脏旧做旧（须干净65mm）？暗部是否有层次不死黑不闷？景深是否保留生活环境而非全糊成光斑？情绪是否克制凝视而非煽情戏剧化？镜头是否够静够长、给了时间与留白否？夏日/家宅镜头光够柔和真实、暖调在、环境可辨否？\n\n## 视频铁律\n\n- 🔴 **单条多分镜（默认强制）**：seedance 单次最长 15 秒、原生支持单条内多分镜+镜间硬切，**不走\"一镜一条+后期拼接\"**。总时长按故事节拍自评估、不硬凑 15 秒：是枝节奏偏慢，镜头长、分镜少——先估生活段落数（一段落=一个完整的日常时间片段：一次对话/一段动作/一次沉默）定镜数定时长（1段落→8秒1-2镜/2→10-12秒2镜/3→15秒3镜）。**只有跨 15 秒才拆多条、串行后用视频合成能力拼接**。prompt 按秒推进、每镜=景别+@角色动作+运镜+环境，镜头长、镜间硬切显式断开。\n- **不出 BGM**：视频生成只要环境音+对白，BGM 合成阶段叠加。是枝的环境音（蝉鸣/水声/餐具/脚步）极重要，prompt 常驻声明\"只保留丰富真实的环境音与对白、无背景音乐无配乐\"；负面加\"背景音乐、配乐\"。\n- 🔴 **对白不可省（治\"全默片\"惰性）**：写分镜与 prompt 时，凡有人物互动/相处/饭桌/对话的镜头，默认须写出生活化对白（平实、家常、不煽情），不得因追求\"克制留白\"就把镜头一律拍成无台词默片。仅在独处/凝视/过渡/时间流逝等设计意图明确为沉默的镜头才留白，且沉默是有意为之、非省略对白的偷懒。对白内容直接写进该镜 prompt 时间轴、受下方语言锁约束。\n- 🔴 **旁白统一写入视频 prompt**：旁白不单独走配音/TTS、不后期叠加，一律作为视频 prompt 的一部分交由视频模型随画面一起生成（与角色对白同处理）。需要旁白的镜头，把旁白内容直接写进该镜的 prompt 时间轴里、并注明\"旁白（画外音）：\"；旁白同受下方语言锁约束。⚠️ 是枝式旁白须克制平实、不抒情不煽情，宁少勿多。\n- 🔴 **语言锁**：每条视频 prompt 常驻声明\"人物对白/旁白一律 \\[选定语言\\]，模型自主补话也只用此语言，禁其他语种台词/字幕/口型\"（不管本镜有无对白都写）；负面加\"其他语种台词、混合语言口型\"。防无对白镜头被模型自主加话时蹦错语种。\n- 🔴 **群像/多人场景人人皆动**：一旦画面出现多人或群像（饭桌、街市、教室、家庭聚会等），必须确保画面中**每一个人都在自然地动**——各有各的日常动作（吃、说、转头、走动、忙碌、小动作），杜绝背景人物僵立不动、定格如蜡像/假人。prompt 里逐一或成组交代人物动作、并常驻声明\"画面中所有人物均自然活动、无人僵立定格\"；负面加\"背景人物僵立、定格人像、蜡像、静止假人\"。⚠️ 唯一例外：用户明确要求所有人保持静止或站立不动时才可静止。\n- 🔴 **皮肤去脏（仅视频阶段，防 seedance/视频模型把真实肤质劣化成脏）**：静态图/模卡保持真实肤色不动，但视频 prompt 须做三件事防止皮肤在动态中变脏——① **提亮**：皮肤（尤其暗部）较静态基准轻微提亮约一档、暗部干净通透（这是\"皮肤局部去脏性提亮\"，不等于整体画面往高调推，全片明度仍守底层 DNA 的平实中性）；② **净化肤色**：肤色均匀干净、无杂色斑驳、无灰绿/蜡黄/发脏偏色、血色自然通透；③ **收敛过度质感**：保留自然肤质但适度收敛毛孔油光的过度锐化，不粗糙不油腻——同时**仍禁磨皮塑料假脸**（去脏≠磨皮）。prompt 常驻声明\"人物皮肤干净通透、暗部提亮不脏、肤色均匀无杂色偏色、自然肤质不油腻不磨皮\"；负面加\"皮肤发脏、暗部脏污、肤色斑驳、灰绿蜡黄偏色、油腻油光、过度锐化毛孔\"。\n- **人物实体性与自然性**：人物全程实体清晰、动作自然生活化，不摆拍、不对镜、不表演式。日常动作（吃饭、走路、做家务、对话）要松弛真实。负面常驻：僵硬摆拍、对镜甜笑、表演式夸张动作。\n- **禁溶解叠化**：镜间硬切，负面常驻 no dissolve/cross-fade/fade。\n- **禁戏剧化打光与运镜**：视频里绝不执行逆光开花、戏剧强光、快速运镜、手持冲击。光是自然生活光、镜头是安静旁观。负面常驻：逆光过曝、柔光滤镜、快速运镜、剧烈晃动。\n\n## 视频 prompt 标准模板（强制照此产出，每镜四件套=景别+@角色动作+运镜+环境，缺一不可）\n\n```\n@image1 @scene名（参考图声明，逐张，置最前，附识别要点）\n@image2 @角色名（服装/发型/气质关键词）\n…（≤7，多镜共用同组参考图锁一致性）\n\n[整体场景与氛围] 环境 + 自然生活光源方向 + 大气介质 + 配色（暖调可自然保留、忌冷调纠偏）+ 质感基线 + 视角设定，奠定全片平实日常基调。\n\n[多分镜时间轴] 按秒推进，实时速度，镜头较长、给动作与沉默留时间，镜间硬切，每镜=景别+@角色具体动作+运镜+环境细节：\n分镜1（0-5秒）：[景别，偏中远景] + [@角色自然生活化动作] + [运镜，偏固定或缓慢] + [环境细节：生活物件/自然光/热气/风/远处声响]；\n硬切 分镜2（5-10秒）：[新景别，与上镜至少隔一档、有可辨落差，禁暴跳] + [完整承接的日常动作或对话或沉默] + [运镜] + [环境]；\n硬切 分镜3（10-15秒）：…；\n（镜数与总时长按故事节拍自评估，是枝节奏慢、镜头长、分镜少，不强行凑镜数。）\n\n[画面风格] 严格是枝底层DNA：自然漫射生活光、五官清晰可读不逆光开花 / 平实通透不柔光滤镜不halation / 色彩自然真实暖调可保留（65mm干净胶片密度不脏不做旧） / 中等对比层次丰富暗部干净不死黑 / 中等景深背景生活环境可辨不全糊 / 颗粒极细的65mm干净质感 / 人物皮肤干净通透、暗部提亮不脏、肤色均匀无杂色偏色、自然肤质不油腻不磨皮。\n\n[负面提示词] 逆光开花、过曝死白、柔光滤镜、halation、光雾朦胧、高调提亮、戏剧化打光、粗颗粒脏旧做旧、复古怀旧滤镜、浅焦全糊成光斑、冷调纠偏、快速运镜、手持剧烈晃动、跳切、僵硬摆拍、对镜甜笑、表演式夸张、人物变形、多余人物、皮肤发脏、暗部脏污、肤色斑驳、灰绿蜡黄偏色、油腻油光、过度锐化毛孔、磨皮塑料假脸、文字水印、网格、背景音乐、配乐、其他语种台词、混合语言口型、no dissolve、no cross-fade、no fade transition、no background music、no score、no fast-motion（除非用户要求）。\n[语言锁] 本片人物对白/旁白一律 [选定语言]，即便模型自主补话也只用此语言，禁止任何其他语种的台词、字幕与口型。\n```\n\n- 参考图声明置最前、逐张附识别要点，按出场重要性排序、单镜 ≤7 张。含具名道具的镜头须加挂道具合图并 @道具名。**参考图只挂场景图/人物图/道具图，不挂 moodboard。**\n- 四件套用顿号/加号短句串联、节奏平实；分镜行以\"硬切 分镜N（X-Y秒）：\"起头。用代码块包裹整条 prompt。\n\n## v1.5.2 修复\n\n> 针对\"场景图生成时不垫入 moodboard 作风格锚\"的实测问题。\n\n- **根因**：① 第 2 步优化记录里\"存锚、不单独确认\"的措辞，易被理解成 moodboard 只是归档资产、生成场景图时无需再引用；② 全文多处\"视频/人物/道具不挂 moodboard\"的强约束语气过重、出现频率高，泛化污染到了场景图阶段，把\"场景图须挂 moodboard\"这唯一一条正向指令覆盖掉。\n- **修复**：① 第 4 步\"先产资产\"里把场景图挂 moodboard 从描述性表述改为显式可执行硬约束（\"必须在 prompt 里 @moodboard 垫入、缺失即重做\"），并明确\"只有场景图这一处挂、人物/道具/视频不挂\"的边界，禁止把\"不挂\"泛化到场景图；② 第 4 条优化记录里给\"存锚\"补注，说明其仅指跳过单独确认、不代表不再引用。\n\n## 本轮优化记录（截至 v1.5.0）\n\n> 针对测试中发现的问题的解决清单，记录\"问题 → 如何解决\"，供回溯。\n\n 1. **措辞：影片规模 → 影片时长**：已改，入口①现为\"时长（单镜≤15秒/单集30-60秒/多集数分钟/自定义）\"。（\"故事来源→故事梗概\"本轮暂不处理，当前仍为\"故事大纲\"。）\n 2. **所有确认环节改选项卡**：流程开头新增「全局询问规范」，强制所有需用户确认/选择的环节一律用选项卡跳出、不退化为纯文字问答；封闭问题给预设选项+自定义，开放内容用\"我来提供/帮我生成\"承载。\n 3. **结尾询问（字幕/BGM）改选项卡并优化**：第 8 步改为单一选项卡多选框；针对\"日语对白错跳单语日语字幕\"的实测问题，内联字幕文案硬规则+生成前回读校验做防错加固。\n 4. **合并 moodboard 与分镜的确认步骤**：第 4 步将\"资产产出（角色模卡/场景图/道具图）+ 分镜表列出\"合并为一步、打包统一确认（确认无误/需要调整），确认通过才进入视频生成，减少中途打断。（moodboard 于第 2 步生成后直接存锚、不单独确认；⚠️\"存锚\"仅指跳过单独确认环节，**第 4 步生成每张场景图时仍须显式 @moodboard 垫入作风格锚**，勿因\"存锚\"字样误以为 moodboard 只是归档不再引用。）\n 5. **默认字幕策略**：中文对白→中文单语字幕；非中文对白（日语/英语等）→双语字幕，上轨中文、下轨影片语言（日→中日双语、英→中英双语），非中文绝不只出单语原文。\n 6. **镜间切换避免画面跳跃**：景别落差规则——硬切时相邻镜头景别至少隔一档、有可辨落差、禁暴跳；若需停留则用长镜不切，避免\"切了等于没切\"。（\"人物占位漂移\"本轮暂不处理。）\n 7. **多人场景人物不动**：新增「群像/多人场景人人皆动」铁律，多人同框每人须有自然动作、杜绝背景僵立定格如蜡像，附常驻声明句与负面词；唯一例外为用户明确要求静止。\n 8. **旁白策略**：旁白统一写入视频 prompt、随画面由视频模型生成（不单独配音/后期叠加），需要旁白的镜头写进时间轴并标\"旁白（画外音）\"，受语言锁约束，须克制平实、宁少勿多。\n 9. **混音配比**：音频合成默认混音值——视频原声（环境音+对白）+8dB、背景音乐 -2dB，对白环境音在前、音乐退后。\n10. **肤色表现（去脏）**：针对 seedance/视频模型把真实肤质劣化成脏的问题，仅在视频阶段三管齐下——①暗部轻微提亮约一档（局部去脏性提亮，不推高整体高调）；②净化肤色去杂色偏色；③收敛过度锐化油光但仍禁磨皮。静态图/模卡真实肤色不动。", "extras": [], "cn": "是枝裕和电影美学"}, {"slug": "life-observed-doc", "desc": "先拍人不拍城，克制不煽情", "body": "# documentary-flow\n\n做**人文纪录短片**——全球国际统一审美、聚焦真实人类生活的观察性影像——时用本 skill。核心是**观察生活而非拍故事**：真实感与人文情绪 > 强戏剧冲突。用首帧设定图作视觉锚点，再以微动态图生视频生成克制运镜的纪录片镜头。\n\n> 本环境适配：GPT Image 2（首帧/元素图）→ `generate_image_v3`（2K）；Happy Horse FirstFrameToVideo（首帧图生视频）→ `generate_video_v3`（首帧驱动路径，720p 起）；ElevenLabs 旁白 / Suno·Mureka 器乐 BGM → `generate_audio`；Final_Video_Spec.md 与结构化文本 → `write_file_v2`；故事板设计 → 分镜阶段内做；video_assembler → `composite_video`；`@资产`/asset 绑定 → `reference_nodes`+`{{NodeKey}}`；会员/积分类无。**叙事/运镜/画面质感/写提示词工艺全部内联本 skill，不依赖外部工艺 skill，无源生跨 skill 依赖。**\n\n## 一、流程（分阶段暂停确认，不得一次性跑完）\n\n1. **阶段 0 · Final_Video_Spec**：`write_file_v2` 建 Final_Video_Spec.md，锁：片名、题材地域、画幅比例、目标时长、视觉风格、输出语言（见二）。\n2. **阶段 1 · 参考素材解析**（若用户上传参考图/视频）：提取信号供下游用（见三）。\n3. **阶段 2 · 故事板**〔暂停〕：出关键元素、镜头列表、音频层（见四、五、六）。故事板就绪后**扫描上下文**，查找用户已提供或此前生成、与故事板条目匹配的资产（元素图/BGM 等）；对每个匹配项，在生成前先通过 `reference_nodes` 把资产**绑定到对应故事板槽位**，避免重复生成用户已有内容。呈现确认。\n4. **阶段 3 · 设置元素**〔暂停〕：用户已上传元素资源（角色图/参考角色）→ 直接绑为对应 key_element 的资产；否则为所有元素 `generate_image_v3` 生成图（见七）。\n5. **阶段 4 · 首帧图**〔暂停〕：为每个镜头 `generate_image_v3` 生成 start_frame，须与镜头描述景别/光线/主体姿态一致，作视觉锚点（见七、八）。\n6. **阶段 5 · 镜头视频**〔暂停〕：参考步骤 4 首帧图，以 start_frame 作首帧输入 `generate_video_v3` 生成微动态视频（见八、九）。\n7. **阶段 6 · 音频层**〔暂停〕：`generate_audio` 生成旁白（如有）/ BGM（见六、七）。\n8. **阶段 7 · 组装交付**：`composite_video` 完成全片时间线组装（见十）。\n\n**依赖顺序**：阶段 2→0；3→2；4→2；5→4；6→2；7→5,6。\n**暂停节点**：在故事板完成、元素图/首帧图完成、视频完成、音频生成后各暂停，等用户确认再继续。\n**已有素材优先**（主要影响阶段 3–5）：填充生成内容前，先绑定并分配到合适故事板位置，不重复生成用户已提供的内容。\n\n## 二、Final_Video_Spec 建立指南\n\n1. **片名**：契合\"人文纪录片\"调性，避免过度商业或浮夸的命名。\n2. **题材地域**\n   - **地域限定范围**：引导用户在以下区域中选择——亚洲、非洲、中东、南美、东欧、东南亚、海岛国家、发展中国家。\n   - **题材核心限制**：题材必须聚焦\"**真实的人**\"与\"**普通人的生活**\"，**拒绝\"城市宣传片\"**。\n3. **画幅比例**：推荐 16:9 横屏，或纪录片常见的 2.35:1 宽银幕。\n4. **视觉风格（四参考锁定 + 避雷清单）**：锁定为\"像真实摄影师长期驻扎拍摄\"、\"像奥斯卡/国际电影节纪录片\"、\"Netflix 纪录片风格\"或\"国家地理式观察影像\"。**明确\"不做\"的风格（避雷清单）：严禁 AI 感、商业广告感、强戏剧感、网红风。**\n5. **画面质感要求**\n   - **空气感**：灰尘、水汽、潮湿、热浪、风。\n   - **光线限定**：仅限自然光（晨光、黄昏、阴天、窗边光）。\n   - **保留不完美**：允许并刻意保留轻微失焦、曝光波动、真实混乱感。\n\n## 三、参考素材解析规则\n\n若用户上传参考图片或视频，提取以下信号供下游使用，**输出结构化描述，不做主观评价**：\n- 主体身份与外貌特征；\n- 场景地点与环境氛围；\n- 光线条件（方向 / 色温 / 质感）；\n- 画面色调与饱和度风格。\n\n## 四、叙事规范（storyboard 核心）\n\n### 4.1 核心叙事理念：观察生活，而非\"拍故事\"\n- **去戏剧化**：摒弃强戏剧冲突、商业广告式的剧情设计。重点不在\"讲一个起承转合的故事\"，而是呈现\"真实世界的人类生活\"。\n- **偶发感**：场景和事件不应有\"导演刻意安排\"的痕迹，必须营造\"摄影师长期驻扎时偶然观察到\"的自然状态。\n- **全球纪录片统一审美**：如 Netflix 纪录片或国家地理式观察影像，打造全球观众都能理解共情的人文叙事，避免刻板的单一地域风（纯网红风、纯欧美风）。\n\n### 4.2 叙事主体与切入点：先拍\"人\"，不拍\"城\"\n- **拒绝宣传片逻辑**：永远不要把\"城市面貌\"或\"宏大景观\"作为首要表现对象——这不是城市宣传片。\n- **聚焦真实人类**：剧情永远从\"人\"切入，通过普通人的真实生活状态折射其背后的文化与环境。\n\n### 4.3 剧情细节与动作设计（最易共情的描写点）\n撰写剧本与场景描述时，着重刻画以下细节动作，而非宏大事件：\n- **聚焦手部劳作**：做饭、缝纫、洗衣、写字、手工劳动。\n- **人物背影与状态**：多用\"背影\"作主视觉——比直接展现正脸更具高级感和故事留白感。\n- **日常微小动作**：点烟、喝茶、发呆、看窗外——用这些无特定目的的\"小动作\"构建时间流动的真实感。\n\n## 五、按地域划分的场景/题材规划库\n\n为不同发展中国家或地区规划剧本时，直接选用以下最能体现当地原生人文气息的场景和事件：\n- **亚洲题材**：清晨的早餐摊、老茶馆里的闲谈、熙熙攘攘的传统市场、原生态的渔村、老旧的铁路边。\n- **非洲题材**：黄昏尘土下的归途、热闹的集市、奔跑的孩子、雨季的日常、传统的手工劳动。\n- **南美题材**：随性的街头音乐表演、充满生活气息的老城区、海边日常、街头/土路足球场、夜市的烟火气。\n- **中东题材**：阳光穿透的传统市场、专注的手工艺制作过程、虔诚的祈祷时刻、沙尘环境下的生活常态。\n\n## 六、关键元素与音频层设计\n\n### 6.1 关键元素设计\n- 优先设计**人物元素**（年龄、外貌、着装、正在做的事）和**场景元素**（地理环境、时段、光线条件、空气质感）。\n- 道具元素只在对多个镜头一致性有实质影响时才单独建立。\n- 用户提供参考素材时，元素描述必须与参考内容一致，不得矛盾。\n\n### 6.2 音频层设计\n- **BGM（可选）**：若使用，选择极简器乐或无调性环境音景；**禁止流行音乐节奏**。\n- **不以对白驱动叙事。**\n\n## 七、分镜镜头设计原则（★ 观察式纪实工艺核心）\n\n- **时长**：每个镜头 **6–12 秒**，**不做短于 5 秒**的镜头。\n- **观察性叙事**：镜头不\"设计故事\"，而是\"偶然看见生活\"。优先拍手部劳动、背影、微小日常动作（点烟、喝茶、发呆、看窗外）；避免正面表演式构图。\n- **运镜极简（按优先级排序）**：一个分镜只描述一个镜头。\n  1. 固定镜头（最推荐）\n  2. 微弱手持（仅呼吸感 / 轻微漂移）\n  3. 极慢推进 或 极慢横移\n  - **禁止**：旋转、快速推拉、无人机飞行、炫技运镜、切镜。\n- **每个镜头描述必须包含**：\n  - **Scene**：引用场景元素 ID，说明时段与光线；\n  - **主体动作**：人物正在做的微小动作，以肢体和神态为主，**无需台词**；\n  - **摄影语言**：景别（特写 / 中景 / 远景）+ 运镜类型 + 焦点策略。\n- **画面质感**：\n  - **自然光优先**：晨光、黄昏、阴天散射光、窗边侧光；禁止人工补光感。\n  - **空气感必须体现**：灰尘、水汽、热浪、潮湿、轻雾中选一种写入镜头描述。\n  - **允许不完美**：轻微失焦、曝光轻微波动、人物短暂停顿均为真实感加分项。\n- **色调体系**：\n  - 低饱和、高层次感：高光柔和不过曝，暗部有细节不死黑，肤色真实。\n  - 参考色彩风格：**Kodak Vision3 / Fuji Eterna / ARRI Alexa Natural**。\n- **视频中的声音设计**：市集噪声、风声、雨声、街道声等。\n\n## 八、首帧提示词写作规范（`generate_image_v3`）\n\n**核心逻辑**：聚焦\"决定性瞬间\"的捕捉、胶片色彩质感、真实的光影与空气感。**摒弃任何运镜和节奏词汇。**\n\n**万能公式**：\n> [画面主体与微小动作] + [环境与空气感] + [光线状态] + [摄影机语言与景别] + [色彩体系与胶片质感] + [核心精神关键词与大师参考]\n\n**核心模块与词汇库**：\n- **主体与微动作**：人物背影 / 抽烟的双手 / 凝视窗外 / 停顿的发呆瞬间。\n- **环境与空气感**：弥漫的灰尘 (dusty air)、清晨的水汽 (morning mist)、潮湿感 (dampness)、风吹动衣角 (wind blowing)。\n- **光线状态**：自然光 (natural light)、窗边柔和侧光 (soft window light)、阴天漫反射 (overcast diffused light)。\n- **摄影语言**：Medium shot (中景) / Close-up (特写) / 极简构图 / 留白 (negative space)。\n- **色彩体系（原样直出）**：Kodak Vision3, Fuji Eterna, ARRI Alexa Natural, low saturation, soft highlights, detailed shadows, real skin tone.\n- **风格与大师参考**：Magnum Photos, Leica Documentary, National Geographic, 是枝裕和 (Hirokazu Kore-eda), 贾樟柯 (Jia Zhangke).\n\n**示例（方法级模板，替换主体/地域即可复用）**：\n> (EN) A medium shot of an old man's weathered hands rolling a cigarette, sitting in a dimly lit traditional tea house. Morning mist and dust particles floating in the soft window light. Kodak Vision3 film stock, low saturation, soft highlights, real skin tone. Magnum Photos style, Leica Documentary, observational, honest, real, quiet, timeless. Hirokazu Kore-eda aesthetic.\n> (ZH) 中景，一位老人在昏暗的老茶馆里卷烟的沧桑双手。晨雾和灰尘颗粒在柔和的窗边光线中漂浮。柯达 Vision3 胶片质感，低饱和度，高光柔和，真实的肤色。马格南摄影风格，徕卡纪录片，观察性，诚实，真实，安静，永恒。是枝裕和美学。\n\n**首帧图与视觉锚点**：首帧图须与故事板镜头描述的景别、光线、主体姿态一致，作为视频生成的视觉锚点。若用户已上传参考图（人物/场景），将其注册为锚点（`reference_nodes`）并绑定至对应元素或镜头槽位，优先用于替代生成（ImageToImage 路径）。\n\n## 九、视频提示词写作规范（`generate_video_v3`，首帧驱动）\n\n**核心逻辑**：聚焦\"时间的流动\"、\"极慢的节奏与运镜\"、\"环境的微小变化\"以及\"长镜头观察感\"。以对应镜头的 start_frame 作首帧输入。\n\n**万能公式**：\n> [极其克制的镜头运动] + [主体持续的微小动作] + [环境与光线的微小流逝/变化] + [色彩体系] + [纪录片节奏与电影级参考] + [核心精神关键词]\n\n**核心模块与词汇库**：\n- **镜头运动（必须克制）**：Fixed camera (固定镜头) / Slight handheld breathing (微弱手持呼吸感) / Extremely slow push-in (极慢推进) / Extremely slow pan (极慢横移)。\n- **动作与环境流逝**：持续的微小动作 (continuous subtle movement) / 光影随时间缓缓移动 (light shifting slowly) / 持续的微风 (continuous gentle breeze)。\n- **节奏与剪辑指令**：Long take (长镜头) / Slow pacing (慢节奏) / No fast cuts (禁止快剪) / Breathing space (呼吸感留白)。\n- **色彩体系**：Sony Venice Documentary LUT, ARRI Alexa Natural, cinematic color grading, cinematic shadows.\n- **视频风格与参考**：Netflix Documentary (Chef's Table, Our Planet), Oscar Documentary (Nomadland, Honeyland), 侯孝贤 (Hou Hsiao-hsien) pacing.\n\n**示例（方法级模板）**：\n> (EN) Fixed camera with slight handheld breathing. A slow long take of a South American woman washing clothes by the river. Her back is to the camera. The damp morning air slowly blows her hair. Natural overcast light with subtle environmental shifts. ARRI Alexa Natural, Sony Venice Documentary LUT, low saturation, soft highlights. Cinematic pacing, breathing space, no fast cuts. Nomadland and Honeyland style, Netflix documentary vibe, observational, slow, human, quiet, timeless.\n> (ZH) 固定镜头带有微弱的手持呼吸感。一个缓慢的长镜头：一位南美妇女在河边洗衣服，背对镜头。潮湿的晨风缓缓吹动她的头发。自然的阴天光线，带有微妙的环境变化。ARRI Alexa Natural，索尼威尼斯纪录片 LUT，低饱和度，高光柔和。电影级节奏，呼吸感留白，无快剪。无依之地与蜂蜜之地风格，Netflix 纪录片氛围，观察性，缓慢，人文，安静，永恒。\n\n## 十、素材生成与失败处理\n\n- **元素图/首帧图**：`generate_image_v3`，2K；首帧图作视觉锚点（见八）。用户已上传参考图 → 注册 `reference_nodes` 绑定，优先替代生成。\n- **镜头视频**：`generate_video_v3`，720p 起，以对应镜头的 start_frame 作首帧输入（FirstFrameToVideo 意图）。\n- **音频层**：旁白（如有）`generate_audio`；BGM `generate_audio`，风格描述为极简器乐 / 环境音景，**不生成歌词类音乐**。\n- **失败处理**：若视频生成失败，**优先以同参数在同一路径重试**，不擅自切换到风格差异大的替代路径；重试仍失败则**停止并告知用户**，不静默降级换模型。\n\n## 十一、剪辑与输出（`composite_video`）\n\n**节奏原则**：\n- **长镜头优先**，保留完整的时间流动感；**不为追求\"有趣\"而剪短镜头**。\n- 镜头间可用 **0.5–1s 的黑场或声音延续过渡**，制造呼吸感。\n- **禁止快剪、音乐卡点、特效转场、TikTok 节奏。**\n\n**音画关系**：\n- BGM（如有）音量**低于视频层声音**；淡入淡出，不抢画面。\n- **不做强制音画同步**；画面与声音各自自然流动。\n\n## 相关\n\n- **边界（勿用本 skill，改道）**：强戏剧叙事/起承转合短片 → cinematic-flow；城市记忆/旧街区具体人物空间（80/20 平叙+高动态配比）→ city-memory-film；东亚文艺片（情绪驱动/全片平叙微动态/声画分离）→ east-asian-mood-film；传统工艺纪录（文献解析→六格分镜矩阵图→逐组 15s）→ craft-documentary；名导纪实风格（贾樟柯式）→ auteur-style-director 路由。\n- 本 skill 自足内联，**无源生跨 skill 依赖，不设配合表**。", "extras": [], "cn": "观察式纪录短片"}, {"slug": "lifestyle-travel-vlog", "desc": "把人物、城市和情绪，生成一组像真实手机相册里留下的亚洲旅行生", "body": "## 1. 默认调用原则\n\n### 用户要「出图 / 生成图 / 直接做图」\n\n不要输出提示词，不要解释太多，直接调用图像生成工具。\n\n图像输出顺序：\n\n```text\n单人 vlog：先出单人人物设定图\n情侣 vlog：先出情侣关系板\n朋友/家庭：先出多人关系板\n12宫格：只有用户明确要求先看感觉/12宫格/拼贴时才出12宫格\n抓拍图：用户明确要求封面/抓拍/低质照片时才出单张抓拍\n```\n\n### 用户要「提示词」\n\n输出可复制的最终提示词，不要直接出图。\n\n### 用户要「分析 / 融合 / 修正」\n\n先给结构判断，再给更新规则或修复版本。\n\n---\n\n## 2. 不做什么\n\n默认不做：\n\n- 不直接生成完整视频文件\n- 不剪辑视频\n- 不做电影预告片\n- 不做旅游宣传片\n- 不做过度精修的人像写真\n- 不做商业广告感内容\n- 不做稳定器大片运镜\n- 不默认生成对白、口播、旁白、字幕\n\n---\n\n## 3. 单次工作生命周期\n\n每次调用时，严格按以下顺序：\n\n```text\n1. 判断用户要什么：出人物 / 出情侣 / 出12宫格 / 出vlog提示词 / 直接出图 / 分析样本 / 修复测试结果\n2. 判断人物结构：单人 / 情侣 / 朋友 / 家庭\n3. 生成人物资产：人物母设定、人物设定图或关系板\n4. 生成关系设定：情侣、朋友、家庭需要明确关系状态\n5. 生成人物视频锁定词\n6. 解析地点、主题、影像模式、时长、比例、声音\n7. 生成地点生活细节\n8. 如需要，生成12宫格记忆拼贴，作为审美确认层和镜头池\n9. 从12宫格提取6–7个关键记忆点，转成15秒视频镜头\n10. 选择视频模式：Realcam 粗糙真实 vlog / Music Travel Montage\n11. 生成最终提示词或直接出图\n12. 默认无对白，只用动作、笑声、环境声、镜头中断完成情绪\n13. 执行 QA 检查\n14. 根据测试反馈给出修复\n```\n\n---\n\n## 4. 输入参数\n\n用户可以只提供一部分信息，缺省项自动补足，不要反复追问。\n\n```text\n人物：@image1 / 人物提示词 / 用户上传的人物图 / 需要生成的新人物\n关系：单人 / 情侣 / 闺蜜 / 朋友 / 家庭\n地点：东京 / 冲绳 / 韩国乡村 / 印尼海岛 / 香港夜街 / 云南小镇 / 任意亚洲旅行地\n主题：夏日漫游 / 海岛度假 / 夜市 / 祭典 / 城市旅行 / 乡村避暑 / 情侣回忆 / 一个人旅行\n影像模式：人物设定图 / 关系板 / 12宫格 / 粗糙真实vlog / 音乐混剪vlog / 抓拍图\n时长：默认15秒\n比例：视频默认16:9；人物设定图默认4:5；12宫格默认4:5或3:4\n声音：默认自然环境声，无对白、无字幕、无旁白\n平台：小红书 / 抖音 / B站 / Shorts，可选\n```\n\n默认值：关系=单人；主题=旅行生活片段；视频模式=Realcam 粗糙真实 vlog；时长=15秒；视频比例=16:9；声音=自然环境声，无对白。\n\n---\n\n## 5. 人物结构判断\n\n### 单人模式\n\n适用于单人旅行 vlog、单人城市漫游、单人海岛度假、单人乡村旅行、单人旅行拼贴、单人抓拍。\n\n输出：1个人物母设定、1张人物设定图、1条视频人物锁定词。\n\n### 情侣模式\n\n适用于情侣旅行、男女双人旅行记忆、情侣 12宫格拼贴、情侣 vlog、夏日双人祭典、海边双人回忆。\n\n输出：男性人物母设定、女性人物母设定、情侣关系设定、双人关系板、双人视频锁定词。\n\n### 朋友 / 闺蜜模式\n\n适用于两个女生旅行、两个男生旅行、三人朋友团、小团队旅行记忆。\n\n输出：2–4个人物母设定、群体关系设定、多人关系板、多人视频锁定词。\n\n### 家庭模式\n\n适用于亲子旅行、家庭旅行记忆、长辈与年轻人同框旅行。\n\n输出：家庭成员基础设定、家庭关系设定、家庭关系板、家庭视频锁定词。\n\n---\n\n## 6. 人物生成层\n\n人物必须在一切视频、拼贴、抓拍之前先生成或锁定。\n\n人物母设定应包含：性别、年龄段、地域感/文化感、脸型、五官、发型、肤色、身体比例、气质、穿搭、妆容/素颜状态、旅行中的状态感、避免项。\n\n### 单人人物设定图\n\n用于生成角色参考图，锁定人物。\n\n画面结构：左侧或上方为面部特写；右侧或下方为正面全身、侧面全身、背面全身；背景纯白、米白或极简；重点是脸、发型、肤色、身材比例、服装；不加文字标签。\n\n### 情侣关系板\n\n用于生成情侣旅行的双人参考资产。\n\n画面结构：男生单人视图、女生单人视图、双人站立全身、双人自然互动小画面；身高差、穿搭关系、亲密状态明确；背景简洁，不抢人物；不加文字标签。\n\n### 多人关系板\n\n用于闺蜜、朋友、家庭。每个人清晰可辨；群体关系明确；互动自然；穿搭协调；身高体型层次清楚；背景简洁，不抢人物；不加文字标签。\n\n---\n\n## 7. 人物视频锁定词\n\n### 单人视频锁定词\n\n```text\n@image1 = 主要对象。\n\n全程保留 @image1 中的确切面部、身份、发型、肤色、身体比例、服装和整体气质。整段视频保持同一套服装和配饰。人物是真实生活中的普通旅行者，不摆拍，不精修，不偶像化，不广告化。不要变脸、不要换发型、不要换衣服、不要换肤色、不要改变年龄感和身体比例。\n```\n\n### 情侣视频锁定词\n\n```text\n@image1 = 人物A\n@image2 = 人物B\n\n全程保留 @image1 与 @image2 中两位人物各自确切的面部、身份、发型、肤色、身体比例和整体气质。整段视频中两人始终保持同一对情侣身份关系，保持稳定的身高差、穿搭关系和互动状态。不要换脸，不要改变两人的发型、肤色、年龄感、身体比例和关系感。不要把两人变成陌生人、模特摆拍或广告情侣。\n```\n\n### 多人视频锁定词\n\n```text\n全程保留每位人物各自的面部、身份、发型、肤色、身体比例和整体气质。整段视频保持同一组人物关系、同一套服装逻辑和稳定的互动状态。不要换人、不要乱变脸、不要改变群体关系。\n```\n\n---\n\n## 8. 模式判断规则\n\n- 人物设定图模式：先出人物、生成角色、人物设定图、单人角色、人物母版、锁定角色。\n- 情侣关系板模式：情侣、男女主、一男一女、双人关系、情侣设定、情侣旅行。\n- 12宫格记忆拼贴模式：12宫格、拼贴、先看感觉、先出一组图、旅行照片集合、相册感、记忆板、moodboard。\n- Realcam 粗糙真实 vlog 模式：低质DV、翻盖手机、真实vlog、手持、粗糙、自然环境声、无音乐、家庭录像、旅行生活片段。\n- Music Travel Montage 模式：音乐剪辑、快节奏、东京旅行vlog、travel vlog、15秒混剪、节拍快切、城市旅行、地标打卡。\n- Accidental Snapshot 抓拍模式：抓拍、封面、闪光灯、模糊手机照片、快出画、低质手机照片、意外拍到。\n\n---\n\n## 9. 影像模式\n\n### Realcam 粗糙真实 vlog\n\n适合乡村、海岛、小镇、慢生活、一个人旅行、情侣松弛旅行、夏日疲惫漫游。\n\n摄影词：2000年代末个人数码相机 / 便携摄像机 vlog 美学。手持拍摄，轻微到中度抖动，不完美构图，偶尔裁切人物边缘，自动对焦搜索，镜头呼吸，曝光轻微波动，柔和褪色胶片感，低对比，轻微颗粒，家庭录像瑕疵。\n\n避免项：无摆姿势、无时尚造型、无完美构图、无稳定器、无电影魅力、无现代调色、无广告片感、无精修皮肤、无过度表演、无背景音乐、无字幕、无对白。\n\n### Music Travel Montage\n\n适合东京、首尔、香港、大阪、曼谷、台北、上海、城市地标密集型旅行、平台短视频。\n\n摄影词：26mm手机镜头，深景深，真实皮肤纹理，中性手机色彩科学，未经编辑的抓拍感，轻微HDR，真实夜间曝光，节拍快切，自然动作反应。\n\n避免项：无电影级调色、无摄影棚灯光、无光轨、无夸张运动模糊、无广告片感、无完美走位、无旅游宣传片感、默认无对白。\n\n### 12宫格记忆拼贴\n\n12张随手拍照片拼贴、旅行记忆、褪色胶片感、低对比、轻微颗粒、轻微模糊、手持慢速快门、自然裁切、柔和高光、阴影微微抬起、像远去的夏天、像记忆中的一段旅行。\n\n### Accidental Snapshot 抓拍\n\n低质量智能手机照片、主体快出画、运动模糊、自动闪光灯、过曝高光、深暗阴影、鬼影伪影、松散构图、真实低质手机相机外观。\n\n---\n\n## 10. 地点细节生成规则\n\n不要只写地点名，必须扩写成生活细节。\n\n格式：地区 + 具体空间 + 地面材质 + 建筑细节 + 当地物件 + 植物 + 动物 + 人群 + 天气 + 声音 + 避免项。\n\n示例：\n\n- 日本乡村夏日：老式日式木屋、榻榻米房间、推拉门、旧电风扇、缘侧木走廊、山村远景、浅河、夏日西瓜、汽水瓶、自行车、高草、傍晚天空、远处小型烟花、夏日虫鸣、风吹窗帘。\n- 韩国乡村：泥土/碎石小路，长满苔藓的石墙，韩屋房屋，陈旧黏土瓦屋顶，木栅栏，杂草，扭曲老树，石头水槽，悬挂的干辣椒，裂开的石阶，陶瓷酱缸，自由漫步的公鸡，晨间炊烟，远处村民闲聊。\n- 印尼海岛：木制码头，小型渔船，浅绿色海水，低矮民宿，棕榈树，沙质小路，塑料椅小咖啡馆，瓦隆摊位，流浪狗，海鸟，远处船只引擎声，潮湿海风，晒旧的招牌。\n- 东京城市：东京塔、涩谷人群、便利店冷白荧光、自动贩卖机、地铁窗反光、神社鸟居、灯笼小巷、屋顶夜景、街头招牌、路口人流、手机直出曝光、轻微HDR。\n- 日本夏日祭典：浴衣人群，纸灯笼，烟花，夜市小吃摊，苹果糖，刨冰，捞金鱼，神社参道，柔和橙色灯光，浅海军蓝夜色，低对比，潮湿夏夜空气，远处人群声。\n\n---\n\n## 11. 服装与身体状态规则\n\n服装不能只写好看，要写旅行状态。\n\n可用状态：轻微皱褶、汗渍、风吹乱的头发、几缕发丝粘在脸上和脖子上、凉鞋沾水、肩膀晒红、自然疲惫感、旅行中的松弛感、完全不加修饰。\n\n服装模板：\n\n- 城市旅行版：宽松连帽衫、超大夹克、休闲长裤、运动鞋、斜挎包。\n- 海岛度假版：泳装外搭、亚麻衬衫、宽腿裤、棕色皮凉鞋、小金圈耳环。\n- 乡村漫游版：宽松亚麻衬衫、尘土色长裤、凉鞋、自然汗渍、凌乱头发。\n- 夏日祭典版：浴衣、木屐、手拿小吃、头发简单盘起、略微凌乱。\n- 夜市随拍版：轻便上衣、短裙或宽松裤、随身小包、手拿饮料或小吃。\n\n---\n\n## 12. 12宫格 → 视频转换规则\n\n12宫格不是最终视频，而是审美确认层和镜头素材池。\n\n从12宫格中选择6–7个关键记忆点，转成15秒时间码镜头。\n\n映射规则：\n\n```text\n人物近景 → 开场自拍 / 情绪镜头\n地点空镜 → 环境建立\n食物饮料 → 生活细节\n水、风、阳光 → 触觉互动\n自行车、走路、交通 → 移动镜头\n夕阳、夜景、烟花 → 结尾余韵\n```\n\n不要把12张图全部塞进15秒视频。\n\n---\n\n## 13. 默认无对白规则\n\n本 Skill 默认不生成对白。\n\nRealcam：只保留自然环境声：风声、脚步声、海浪、鸟鸣、虫鸣、狗叫、市场闲聊、物件碰撞声、相机摩擦声、人物自然笑声。无背景音乐、无字幕、无对白、无口播、无旁白。\n\nMusic Montage：可以有音乐节拍，可以保留少量环境声。默认无对白。人物情绪靠动作、表情和剪辑节奏表达。\n\n只有用户明确要求“加一句话 / 加对白 / 加口播 / 加旁白”时，才启用对白模块。否则不要安排人物说完整句子。\n\n---\n\n## 14. 视频结尾动作库\n\n默认不用对白收尾，从以下方式选择：\n\n```text\n人物靠近镜头，自然笑一下，轻轻挥手，录像突然中断。\n人物用手遮住镜头，画面黑掉。\n镜头低头拍到脚步和地面，然后停止。\n风吹乱头发，她笑着拨开，画面切断。\n她回头看镜头笑一下，转身继续走。\n相机突然倾斜到天空、树叶或海面，录制结束。\n夜晚烟花中，她回头笑一下，镜头轻轻下落。\n```\n\n---\n\n## 15. Realcam vlog 母模板\n\n```text\n场景 – Seedance 2.0 | 15秒个人旅行生活片段\n\n@image1 = 主要对象。\n@image2 = 氛围参考，可选。\n\n全程保留 @image1 中人物的确切面部、发型、肤色、身体比例、服装和整体气质。整段视频保持同一套服装和配饰。人物是真实生活中的普通旅行者，不摆拍，不精修，不偶像化，不广告化。不要变脸、不要换发型、不要换衣服、不要换肤色、不要改变年龄感和身体比例。\n\n【人物与服装】\n{人物锁定词}\n{服装状态词}\n服装带有真实旅行痕迹：轻微皱褶、汗渍、风吹乱的头发、凉鞋沾水、自然疲惫感或松弛感。不要时尚大片感。\n\n【地点】\n{地点名称}\n{地点生活细节}\n强调真实地方生活痕迹、旧物、地面材质、当地植物、动物、摊位、建筑细节和自然天气。避免现代商业广告感。\n\n【摄影】\n2000年代末个人数码相机 / 便携摄像机 vlog 美学。手持拍摄，轻微到中度抖动，不完美构图，偶尔裁切人物边缘，自动对焦搜索，曝光轻微波动，柔和褪色胶片感，低对比，轻微颗粒，家庭录像瑕疵。不要电影大片感，不要稳定器，不要广告片质感。\n\n00:00–00:02\n开场自拍镜头，人物正在移动中进入地点，镜头略微倾斜，人物自然看镜头或笑一下。\n\n00:02–00:04\n从身后或侧面 handheld 跟拍，展示当地建筑、道路、摊位或自然环境。\n\n00:04–00:06\n人物与水、食物、花、石墙、栏杆、商品或当地物件互动，动作自然。\n\n00:06–00:08\n人物与动物、店主、儿童、路人或自然细节产生短暂互动。\n\n00:08–00:10\n人物继续穿过地点，擦汗、整理头发、看地图、环顾四周或推车走路。\n\n00:10–00:12\n人物坐下休息，喝水、吃东西、翻看明信片、地图、笔记或观察远方。\n\n00:12–00:15\n凌乱自拍或背后视角收尾。人物自然笑一下，轻轻挥手，或者用手遮一下镜头；也可以让镜头自然倾斜到天空、树叶、海面或夜晚烟花。笑声中录像突然中断。不要说清晰台词，不要口播，不要旁白。\n\n【音频】\n仅使用自然环境音：{地点环境声}、脚步声、风声、远处人声、动物声、物件碰撞声、相机摩擦声、人物自然笑声。无背景音乐，无字幕，无对白，无口播，无旁白。\n\n【避免】\n无摆姿势。无时尚造型。无完美构图。无稳定器。无电影魅力。无现代调色。无广告片感。无精修皮肤。无过度表演。不要突然换脸、换发型、换服装、换肤色或改变身体比例。\n\n【比例】\n{16:9 / 9:16 / 3:4}\n```\n\n---\n\n## 16. Music Travel Montage 母模板\n\n```text\n{城市名} TRAVEL VLOG — 15秒音乐剪辑\n\n@image1 = 主要对象。\n全程保留 @image1 中人物的确切面部、身份、发型、肤色、身体比例和整体气质。整段视频保持同一套旅行服装和配饰。\n\n主体：{人物描述}\n服装：{城市旅行服装}\n摄影：26mm手机镜头，深景深，真实皮肤纹理，中性手机色彩科学，未经编辑的抓拍感，轻微HDR，真实夜间曝光。无电影级调色，无摄影棚灯光，无光轨，无夸张运动模糊效果。\n\n00:00–00:01 地标自拍，低角度，地标在人物身后，天空或城市灯光略微过曝。自然微笑。\n00:01–00:02 城市人群中行走，转头看向镜头。背景招牌、街道、人流清晰可见。节拍快切。\n00:02–00:03 便利店 / 小吃店 / 路边摊，举起食物或饮料对着镜头，表情自然。\n00:03–00:04 公园 / 街角 / 车站短暂停顿，风声或环境声露出一瞬。\n00:04–00:06 食物反应镜头，咬一口或喝一口，眼睛睁大，笑着后退。\n00:06–00:07 自动贩卖机 / 霓虹街灯 / 商店橱窗前，混合LED光照在脸上。\n00:07–00:08 交通工具镜头，火车窗、巴士窗、出租车后座或地铁站台，人物看向窗外。\n00:08–00:09 当地文化地点，神社、老街、桥、寺庙、市场入口或小巷，人物穿过画面。\n00:09–00:11 标志性视觉镜头，灯光展、观景台、夜景、展览或城市高处。速度略慢，人物抬头看。\n00:11–00:12 大型景点出现，镜头从人物脸部上摇或转向完整景点。\n00:12–00:13 夜晚街道或灯笼巷，从身后跟拍，人物回头看一眼。\n00:13–00:14 天台 / 海边 / 桥上 / 路口自拍，手臂伸展，城市或自然景色出现。\n00:14–00:15 意外互动或笑场结尾，动物、朋友、路人、风、食物或小事故制造自然笑点。淡出或硬切结束。\n\n【音频】\n有节奏音乐，可保留少量真实环境声。默认无对白。人物通过动作、表情、反应、笑场、挥手、回头、自拍动作表达情绪。\n\n【避免】\n不要广告片感。不要电影预告片感。不要过度精修。不要强滤镜。不要夸张网红感。不要完美走位。不要景点宣传片感。不要对白、口播、旁白。\n```\n\n---\n\n## 17. 12宫格记忆拼贴母模板\n\n```text\n生成一组由12张随手拍照片组成的旅行记忆拼贴。\n\n人物：{人物/关系}\n地点：{地点}\n主题：{旅行主题}\n\n画面像是在旅行过程中用手机随意拍下的照片集合，不是专业写真，不是旅游宣传片。照片包含人物自拍、背影、街道、食物、海边/山景/城市夜景、路边小店、交通工具、局部手部动作、偶然模糊的瞬间。\n\n整体呈现褪色胶片感、低对比、轻微颗粒、轻微模糊、自然手持构图、偶尔裁切人物边缘。色彩柔和，像记忆中的夏天或一段远去的旅行。画面有真实生活气息，有不完美构图和轻微晃动感。\n\n避免：专业摄影、广告大片、电影海报、过度锐利、过度精修、强烈HDR、摆拍肖像、统一棚拍灯光、完美构图。\n\n比例：{3:4 / 4:5 / 16:9}\n```\n\n---\n\n## 18. Accidental Snapshot 母模板\n\n```text\n一张低质量智能手机随手抓拍照片。\n\n人物：{人物/关系}\n地点：{地点}\n动作：{转头、回望、奔跑、举手挡镜头、笑场、被风吹乱头发、快要走出画面}\n\n画面像意外拍到的一瞬间。构图松散，主体偏离中心，人物可能被裁切，手持抖动明显，运动模糊，自动闪光灯造成过曝高光和深暗阴影。面部细节略微模糊但保留人物整体身份感。色彩低质、颗粒感明显、压缩感明显，像旧手机或早期数码相机拍摄。\n\n避免：专业肖像、电影静帧、棚拍灯光、锐利焦点、精修皮肤、摆拍姿势、时尚大片、广告感。\n\n比例：{3:4 / 4:5 / 16:9}\n```\n\n---\n\n## 19. QA 检查规则\n\n每次输出后，自动检查：\n\n```text\n1. 人物是否保持同一张脸？\n2. 发型是否稳定？\n3. 服装是否稳定？\n4. 身体比例是否稳定？\n5. 情侣/多人关系是否稳定？\n6. 地点是否有真实生活细节？\n7. 是否太电影化？\n8. 是否太广告片？\n9. 是否太稳定、太干净？\n10. 手持瑕疵是否足够？\n11. 是否误生成了对白、口播或旁白？\n12. 结尾是否自然？\n13. 12宫格与视频是否属于同一种氛围？\n```\n\n---\n\n## 20. 常见失败修复规则\n\n- 人物变脸：加强人物锁定，减少大幅度正脸切换，强调同一面部、同一发型、同一服装、同一年龄感、同一身体比例。\n- 情侣不像一对：强化情侣关系：稳定身高差、自然亲密、穿搭协调、互动克制真实，不要模特合照或广告情侣感。\n- 太电影化：移除 cinematic、film still、dramatic lighting、stable tracking shot。改为 handheld vlog、imperfect framing、focus searching、home video flaws。\n- 太广告片：加入汗渍、皱褶、凌乱发丝、生活动作、偶然裁切、自然疲惫感。减少完美光线和精修皮肤。\n- 出现对白：删除所有对白描述。人物只自然笑、挥手、遮镜头、镜头掉转、录制突然中断。保留环境声、脚步声、风声、笑声和相机摩擦声。不要口播，不要旁白，不要字幕。\n- 镜头太糊：把粗糙感从重度降到中度。保留轻微手持、颗粒和曝光波动，减少严重运动模糊。\n- 地点太空：增加当地生活物件、路人、动物、摊位、旧建筑、地面材质、招牌、风声、人声和环境细节。\n- 12宫格信息太杂：视频只选6–7个关键记忆点，不要把12张图全部塞进15秒视频。\n\n---\n\n## 21. 版本说明\n\n当前版本：V1.3：人物优先 + 12宫格预览 + 默认无对白。\n\n成熟方向：V1.4 加入更多亚洲地点库；V1.5 加入测试回收表与自动修复模板；V2 加入12宫格到视频的更强转换器；V3 加入多城市批量生成；V4 加入同一人物账号化连续内容生产。", "extras": [], "cn": "生活感旅行记忆 Vlog"}, {"slug": "luxury-brand-tvc-creator", "desc": "奢牌级视觉表达，电影级视听语言，打造国际化高级感品牌TVC。", "body": "## 一、品类分类（从上传的产品识别品类，拿默认）\n\n每个品类附「节奏基调 / 产品出现时机 / 单镜时长」三个字段（详见下方节奏表），定品类即一并拿到。注意：「单镜时长」指的是**一个 clip 内部**各镜头的建议时长（供模型在这一个 15s clip 内自动切分参考），**不是**让你按这个时长逐镜发起生成。\n\n美妆 / 护肤 — 特点：微距特写、质地流动、肤感光泽、面部情绪、奢华氛围；默认创意手法：演示 + 情感；节奏：中·渐入 / 产品第 3–5s / 单镜 2–3s；品牌：Dior、SK-II、La Mer\n\n奢侈品 / 时尚 — 特点：电影短片式叙事、艺术化构图、极简主义、大量留白；默认创意手法：故事 / 情感（视听奇观风格）；节奏：慢·留白 / 产品第 4–6s / 单镜 3–5s；品牌：Hermès、Chanel、Prada\n\n食品 / 饮料 — 特点：食欲感特写、液体流动、蒸汽/水珠、高饱和、节奏明快；默认创意手法：演示 + 情感；节奏：快·卡点 / 产品第 1–3s / 单镜 1–2s；品牌：Coca-Cola、McDonald's\n\n科技 / 电子 — 特点：产品悬浮、360° 环绕、暗调+霓虹光、未来感、界面动画；默认创意手法：演示 + 动画；节奏：中快·精准 / 产品第 2–4s / 单镜 1.5–2.5s；品牌：Apple、Samsung、Sony\n\n酒类 / 香氛 — 特点：慢动作、光影折射、液体质感、氛围感优先于功能；默认创意手法：情感（视听奇观风格）；节奏：慢·氛围 / 产品第 4–6s / 单镜 3–5s；品牌：茅台、Chivas、Jo Malone\n\n运动 / 户外 — 特点：高速摄影、极限场景、汗水/肌肉特写、励志情绪；默认创意手法：情感 / 故事；节奏：极快·冲击 / 产品第 1–2s / 单镜 0.5–1.5s；品牌：Nike、Adidas、The North Face\n\n汽车 — 特点：大场景、航拍、速度感、极致光影、lifestyle 叙事；默认创意手法：故事（视听奇观风格）+ 演示；节奏：慢起渐快 / 产品第 3–5s / 单镜 2–4s→收快；品牌：BMW、Mercedes、Tesla\n\n金融 / 保险 — 特点：家庭场景、温情叙事、信任感、稳重调性；默认创意手法：故事 + 情感；节奏：中·温情 / 产品视情节 / 单镜 2–4s；品牌：平安、Prudential\n\n地产 / 酒店 — 特点：航拍全景、室内光影、生活方式想象、空间感；默认创意手法：情感 / 故事；节奏：中·舒展 / 空间即产品 / 单镜 2.5–4s；品牌：万科、Four Seasons\n\n定了品类即拿到：默认特点 + 建议创意手法 + 一组旋钮默认档位（见第三节括注）+ 节奏三字段（见第五节节奏表）。客户有特殊要求再覆盖默认。\n\n> 品类名里的真实品牌仅作**抽象风格描述**用（说明这类广告长什么调性），成片不得复现任何特定品牌真实 campaign 的可识别元素（标志性布景、专属视觉符号、真实 slogan/logo），logo 一律换成产品自有 logo。\n\n---\n\n## 二、五个维度（与用户对话逐项确认）\n\nTVC 商业广告片的 5 个维度。定品类后多数已有默认值，对话只需补齐/修正，不重复问已知项。\n\n1. 广告目的：产品 · 品牌 · 形象 · 促销 · 公益 → 决定信息密度与收尾落点：促销=强 CTA；品牌/形象=logo 收尾；产品=卖点+CTA。\n\n2. 创意手法（＝ prompt 生成骨架）：故事 · 情感 · 演示 · 动画\n\n   故事：完整剧情，建立 → 冲突 → 解决，产品融入情节。\n\n   情感：情绪弧打动人，建立人物/处境 → 情绪高点 → 产品作为解法 → 落主张。用 {{Mixed N}} 锁角色。\n\n   演示：卖点直给，痛点/场景 → 产品登场 → 一镜一卖点 → 效果呈现 → logo + CTA。产品每镜清晰。\n\n   动画：二维 / 三维 / 定格，风格锁定句写最前，风格一致 &gt; 角色一致。\n\n   「视听奇观 / 时尚片」不是单独手法，而是高制作美学风格（运镜密集、美学优先、慢动作、大量留白），常叠加在 故事/情感/演示 上（奢侈、美妆、汽车），靠第三节拆解要素堆出来。\n\n3. 视频时长：15s · 30s · 60s → **决定 clip 数（15s=1 clip / 30s=2 clips / 60s=4 clips）**，并触发生成分流（见工作流 Step 3）。每个 clip 内部再由模型按节奏自动切分镜头（15s≈4–5 镜 / 快节奏 6–8 镜），**这是 clip 内部的事，不是拆成独立生成任务**。\n\n4. 制作方式：实拍 · 动画 · CG 合成 · 混剪 → 决定风格锁定句基底：实拍=电影感商业片基底；动画/CG=对应风格锁定句。\n\n5. 投放场景：TV · OTT · 社媒竖屏 · 户外大屏 → 决定画幅与节奏：TV/OTT=16:9；社媒竖屏=9:16 且前 3 秒更狠；户外大屏=强视觉、弱依赖声音。需要时一稿出双版。\n\n---\n\n## 三、拆解要素（7 个旋钮 · 选项菜单）\n\n每个维度选一档；斜体括注是「按品类默认」。\n\n1. 灯光设计\n\n   光源：自然光 / 棚拍人工光 / 混合光\n\n   方向：顺光 / 侧光 / 侧逆光 / 逆光 / 顶光 / 底光\n\n   布光：主光 Key、辅光 Fill、轮廓光 Rim/Edge、背光 Backlight、发丝光、体积光/丁达尔 Volumetric、美妆光 Beauty dish、入画实用光源 Practical\n\n   色温：冷调(蓝白) / 暖调(金橙) / 中性 / 冷暖对撞\n\n   特殊光效：霓虹、RGB 染色、耀斑 lens flare、折射光斑、流动光带、频闪\n\n   默认：妆/食=柔光通透暖调；科/汽=暗调 Rim+霓虹；奢=自然窗光；金/地=暖柔自然光\n\n2. 画面色调\n\n   色温：暖调 / 冷调 / 中性 / 冷暖分离 split-tone\n\n   色调：film-scan 自然胶片色、teal-orange 电影调、复古褪色、日系清新、莫兰迪低饱和、赛博霓虹、黑白\n\n   饱和度：高饱和 / 标准 / 低饱和 / 去色单色\n\n   质感叠加：胶片颗粒、漏光 halation、柔光晕、故障噪点\n\n   默认：食=高饱和暖；奢/时尚=低饱和 film-scan；科=冷蓝暗调；汽=teal-orange\n\n3. 镜头语言\n\n   运镜：固定、推/拉、摇 pan、移 dolly、升降 crane、环绕 orbit、跟拍 tracking、手持、稳定器、FPV 穿越\n\n   景别：微距/大特写、特写、近景、中景、全景、大远景、航拍\n\n   角度：平视、仰拍、俯拍、顶视平铺、荷兰角(倾斜)\n\n   构图：居中对称、三分法、框架式、大量留白、满构图、前景遮挡\n\n   镜头特性：广角畸变、长焦压缩、移轴微缩、鱼眼\n\n   默认：妆/科=微距+orbit；汽/运=航拍+tracking+FPV；奢=留白+缓推；食=顶视+升格微距\n\n   补充运镜（按用途分组 · 视听语言更丰富）\n\n   A. 动感/冲击类（适合 食/运/科/促销）\n\n   - 速度变化 speed ramp：正常速→突然升格→再回速，卡点神器\n   - 甩镜 whip pan：快速横甩转场，两镜之间「唰」一下\n   - 推入接特写 push-in to macro：一镜从中景怼进产品微距\n   - 弹动变焦 snap zoom：焦距猛地一顿，强调瞬间\n   - FPV 穿越：一镜穿过场景/产品内部，沉浸感拉满\n\n   B. 精密/展示类（适合 科技/美妆/产品 hero）\n\n   - 产品环绕拆解：半环绕 + 部件逐个高亮（治「只怼 logo」）\n   - 顶视平铺 flat-lay + 升降：俯拍产品阵列，配升降揭示\n   - 轨道横移 dolly/slider：平滑侧移扫过产品排列\n   - 微距滑轨：贴着产品表面/质地缓移\n   - 对焦转移 rack focus：前景虚→实，把视线引到产品\n\n   C. 情绪/电影感类（适合 奢/酒/汽/金融）\n\n   - 缓慢推近 slow push-in：一点点逼近人物/产品，凝聚情绪\n   - 升降镜 crane up/down：垂直运动带出场面或收束\n   - 手持微晃 subtle handheld：纪实感、贴近真实（金融/生活流）\n   - 反打/过肩：人物互动、对视，建立关系\n   - 航拍环绕 aerial orbit：大场景气势（汽车/地产）\n\n   D. 转场/衔接类（替代叠画）\n\n   - 匹配剪辑 match cut：形状/动作/颜色对齐，两镜无缝\n   - 动作衔接 action match：上镜的动作在下镜接着完成\n   - 遮挡转场 whip/物体擦过：物体扫过镜头切下一场\n\n   以上每种运镜仍要带上运动质量约束（运镜丝滑、不掉帧、环绕/360/旋转类放慢匀速）。\n\n4. 音效音乐\n\n   音乐风格：管弦史诗、电子、流行、嘻哈、lo-fi、爵士、民谣、无音乐留白\n\n   音乐功能：驱动卡点 beat-synced、氛围铺底、情绪烘托\n\n   音效 SFX：产品 ASMR(咬/倒/滋滋/喷雾)、环境音、拟音 foley、机械音、转场 whoosh、UI 提示音\n\n   人声：男/女声旁白 VO、对白、群声、无人声\n\n   混音：空间混响、静音留白、低频氛围 drone\n\n   默认：食=ASMR+明快；科/汽=电子+机械音；奢=稀疏器乐；金=温暖弦乐+旁白\n\n5. 剪辑节奏\n\n   切换速度：快切、中速、慢长镜、一镜到底\n\n   节拍：卡点踩鼓点、自由叙事节奏\n\n   转场：硬切、淡入淡出、匹配剪辑 match cut、遮挡甩切 whip、跳切 jump cut、液体/光效转场（禁止叠画/叠化）\n\n   时间处理：正叙、倒叙、平行剪辑、蒙太奇、定格强调\n\n   特殊手法：定格 freeze frame、变速 speed ramp、故障 datamosh\n\n   默认：食/运/促销=快切卡点；奢/酒=慢长镜；汽=慢起渐快\n\n6. 演员模特\n\n   有无人物：有人 / 无人(纯产品) / 仅手部或局部\n\n   人群定位：年轻、都市白领、家庭多代、儿童、运动人群\n\n   气质风格：高级冷感、亲和温暖、力量运动、潮酷街头、清纯邻家\n\n   多元：本土、国际化混搭、多元族裔\n\n   表演基调：克制写实、生活流、戏剧夸张（表情务必自然可信，禁止夸张怪异表情）\n\n   情绪焦点：面部微表情、眼神、肢体动作、互动关系\n\n   服装（按品类）：贴合品类调性——美妆 = 有一定露肤度但不暴露、时尚大气简约、颜色不跳脱；奢侈/时尚 = 高级极简；运动 = 机能运动装；金融/地产 = 得体生活装\n\n   默认：妆=高级脸+面部微表情+皮肤光泽是重点；运=运动员+肢体；金/地=多代家庭；科/酒=常无人\n\n7. 故事类型\n\n   叙事类型：强叙事(完整剧情) / 弱叙事(氛围奇观串联) / 无叙事(纯展示)\n\n   结构：三段式、线性、非线性蒙太奇、单点演示、问题—解决\n\n   视角：第一人称、旁观者、产品视角、多线并行\n\n   题材原型：生活片段、英雄旅程、before/after 对比、证言代言、演示 demo、品牌宣言 manifesto\n\n   落点收尾：logo 定版、产品 hero、主张字幕、CTA\n\n   默认：金/保险=温情三段式；运=英雄旅程；妆/科/酒=弱叙事；食=生活片段或纯展示\n\n---\n\n## 四、镜头节奏（治「太慢/产品出太晚/切换生硬」）\n\n> 以下节奏规则规范的是**一个 15s clip 内部**的镜头编排（镜头数、单镜时长、产品出现时机），供模型在这一个 clip 内自动切分参考。它**不改变生成粒度**——生成单位永远是整段 15s clip，不是单镜。\n\n通用节奏原则（不分品类）\n\n第一镜禁止纯场景空镜：有模特 → 第一镜必须是模特在场景里（人 + 环境同框，可带动作）；无模特（纯产品）→ 第一镜可用氛围/悬念开场，但第二镜必须出现产品。\n\n前 3 秒必须出钩子，产品最晚在第 5–8 秒露脸（促销/演示型第 3 秒就要见产品）。\n\n一个 15s clip 内控制在 4–6 个镜头，单镜别超 3–4 秒；快节奏品类（食/运/科/促销）一个 clip 内必须 6–8 镜（见下方硬规则）。\n\n景别按「跳三级」切（大远景→中景→大特写），别在相邻两级之间小碎步挪，切换才不肉、不生硬。\n\n硬切为主，禁叠画/叠化；需要顺滑就用匹配剪辑 match cut 或动作衔接 action match，不用溶解。\n\n分品类节奏表（均指单个 15s clip 内部）\n\n品类 ｜ 节奏基调 ｜ 产品出现 ｜ 单镜时长 ｜ 情绪带动手法\n\n食品/饮料 ｜ 快·卡点 ｜ 第 1–3s ｜ 1–2s ｜ 咬/倒/滋滋声卡拍点，升格+骤停制造馋感\n\n美妆/护肤 ｜ 中·渐入 ｜ 第 3–5s ｜ 2–3s ｜ 慢起→质地特写→睁眼对视→收束到光泽落点\n\n科技/电子 ｜ 中快·精准 ｜ 第 2–4s ｜ 1.5–2.5s ｜ 硬切+机械音效同步，功能一镜一卖点\n\n运动/户外 ｜ 极快·冲击 ｜ 第 1–2s ｜ 0.5–1.5s ｜ 高速摄影+速度变化 speed ramp 推肾上腺素\n\n汽车 ｜ 慢起渐快 ｜ 第 3–5s ｜ 2–4s→收快 ｜ 大场景铺气势→细节切近→尾段加速点燃\n\n奢侈/时尚 ｜ 慢·留白 ｜ 第 4–6s ｜ 3–5s ｜ 长镜+缓推，靠氛围和留白养情绪，不追快\n\n酒类/香氛 ｜ 慢·氛围 ｜ 第 4–6s ｜ 3–5s ｜ 慢动作光影折射，液体质感铺沉浸感\n\n金融/保险 ｜ 中·温情 ｜ 视情节 ｜ 2–4s ｜ 生活片段叙事，情绪弧递进，产品作解法\n\n地产/酒店 ｜ 中·舒展 ｜ 空间即产品 ｜ 2.5–4s ｜ 航拍舒展→室内光影→生活方式想象\n\n快节奏品类硬规则（强约束 · 食品/饮料、运动/户外、科技/电子，以及任何品类的促销目的）：\n\n一个 15s clip 内必须 6–8 镜（不是 4–6），单镜一律 ≤ 2s（运动/户外 ≤ 1.5s），不允许出现超过 2.5s 的镜头（收尾产品定版镜除外，且也不超过 3s）。\n\n一个 clip 的分镜里必须用上至少 2 种动感运镜/切换（speed ramp、whip pan、snap zoom、push-in to macro、卡点硬切、action match 任选），不能整条都是缓推/固定镜。\n\n禁止「缓慢推近」「缓缓」「悠然」这类慢词主导快节奏品类的分镜；镜头动词用「猛推」「疾切」「甩至」「瞬间怼近」等快词，让模型生成的画面动势跟上。\n\n每镜必须有明确动作发生（倒、咬、开、跑、亮、弹），不允许静态摆拍镜连排。\n\n写完一个 clip 的分镜自查一遍总镜数 × 单镜时长 ≈ 15s，凑不齐镜数就说明节奏太慢，回去拆镜（**在这一个 clip 的 prompt 内多写几镜，不是拆成多个生成任务**）。\n\n核心：该快的品类（食/运/科/促销）把产品和钩子往前提、单镜压短、卡点切；该慢的品类（奢/酒）保留长镜留白，但也要有情绪落点、不能平。\n\n---\n\n## 工作流\n\n### Step 1 · 生成产品三视图 + 同时弹出合并询问卡\n\n用户上传产品图（或产品描述 / 参考片）。识别品类（第一节）、形态/材质/卖点、是否需要 {{Mixed N}} 角色，拿到品类即带出默认特点 + 建议创意手法 + 旋钮默认档位 + 节奏三字段（第四节）。\n\n① 生成产品参考图（贴合产品，建议 GPT Image 以保真；白底、16:9）作一致性锚点：\n\n产品三视图 {{产品三视图}}：正面 / 侧面 / 背面。生成后固定命名为「产品三视图」，供 Step 3 的 @产品三视图 直接挂用。\n\n产品细节三视图 {{产品细节图}}：按功能性取关键细节（榨汁机 = logo / 刀片 / 按键；护肤品 = 瓶身 / 泵头 / 质地）。生成后固定命名为「产品细节三视图」，供 @产品细节三视图 挂用。\n\n后续分镜产品画面一律以这两张为准。\n\n地产 / 酒店等\"空间即产品\"：无实体产品，改为上传或虚拟生成 5–8 张实景图 {{空间实景}}（虚拟生成按 16:9），替代产品三视图并兼作场景锚点。\n\n反推参考片：先 scripts/extract\\_[frames.sh](http://frames.sh) 抽帧读规格，再产同款；**按 15s 一个 clip 整段生成，30s / 60s 拆成 2 / 4 个 15s clip（每个 clip 的 prompt 一次写全、整段生成），绝不拆成很多单镜逐个生成。**\n\n② 生成三视图的同时，立刻弹出一张 ask_human 合并询问卡（不等图生成完，节省时间），一次问全（品类已给默认的只需确认 / 修改，留\"你帮我定\"；\"全你定\"就按默认走完）：\n\n时长：15s / 30s / 60s（→ 对应 1 / 2 / 4 个 15s clip）\n\n广告目的：产品 / 品牌 / 形象 / 促销 / 公益\n\n制作方式：实拍 / 动画 / CG 合成 / 混剪\n\n创意手法：故事 / 情感 / 演示 / 动画（可叠加视听奇观 / 时尚片风格）\n\n投放场景：TV / OTT / 社媒竖屏 / 户外大屏（据此定画幅 16:9 或 9:16）\n\n品牌 slogan：有则填（结尾落点用）\n\n旁白：要不要 + 人声（男 / 女 / 中性 + 风格）+ 旁白语言二选一（中文 / 英文）；一律后期配音（视频静音生成）\n\n字幕：无 / 单语（哪种语言）/ 双语（主 + 副两种）\n\n选模特形象（若有模特）：给 3 个选项 =「族裔/地域 + 年龄 + 性别 + 发型」（先不含穿着）；纯产品则跳过\n\n选场景氛围：给 3 个文字选项（场景 + 色调 + 灯光 + 质感 综合成一句），挑 1\n\n选风格种子：只显示中文风格名（蓝橙调电影风 / 高级中性色电影风 / 高饱和复古暖蓝调 / 日系电影风），绝不暴露代码\n\n是否上传服装参考图：有则上传（后续角色三视图用 GPT Image 2 还原）\n\n（各维度含义见第二、三节；旁白文案在 Step 3 出片前写出、给用户确认。）\n\n### Step 2 · 出 moodboard（场景氛围图 + 服装图并行生成 · 需用户确认）\n\n询问卡答完后，场景氛围图与服装图同时生成（并行，节省时间）：\n\n场景氛围图（必须用 Midjourney v8.1）：把选定场景氛围扩写成具体描绘（只写场景/环境，画面不出现产品）作 MJ prompt，末尾拼上选中风格种子代码，并加 --v 8.1 版本参数；MJ 默认出 4 张可挑。风格种子映射：\n\n蓝橙调电影风 → --sref 1998077430\n\n高级中性色电影风 → --sref 1804771136\n\n高饱和复古暖蓝调 → --sref 2498372592\n\n日系电影风 → --sref 1998077430\n\n> 风格种子仅用可公开复用的数字 --sref，不绑定任何个人 --profile 账号档案；如需专属风格请换成自己账号的 profile。\n\n服装图（若有模特，必须用 GPT Image 2）：每人一张【白底、全身展示、16:9】、含 4 套全身 look 的图，据角色设定 + 品类要求用 GPT Image 2 生成（与场景氛围图并行出，不互相等待）；若产品是可穿戴（衣/鞋/包/帽/镜/饰品/表），4 套 look 均以该产品为核心搭配（look = 产品 + 配搭单品，产品以 @产品三视图 为准还原）。\n\n用户选定场景氛围图 + 选定第几套 look 后：\n\n角色三视图（每人一张；白底；16:9；必须用 GPT Image 2 生成，以保证形象/服装还原一致）：按选定形象 + 选定 look 生成，参考服装图并讲清第几套 look（如\"采用服装图中第 2 套\"）；从左到右 面容特写 ｜ 全身正面 ｜ 全身背面，锁定形象作 {{Mixed N}} 锚点；若上传了服装参考图，同样用 GPT Image 2 按参考图还原。表情自然不奇怪。\n\n可穿戴产品（衣服 / 鞋 / 包 / 帽 / 眼镜 / 首饰 / 手表等穿戴在身的产品）：角色三视图里模特直接穿上 / 背上 / 戴上该产品（以 @产品三视图 为准还原产品外观），产品上身效果与人物形象一次性锁进同一张锚点图——后续分镜里\"人 + 产品\"的同框状态以这张人物三视图为准；服装图的 4 套 look 也要围绕该产品搭配（look = 产品 + 配搭单品），不与产品调性打架。产品单独特写镜仍以 @产品三视图 / @产品细节三视图 为准。\n\n生成后固定命名为「人物三视图」（多角色为「人物三视图1 / 人物三视图2…」），供 Step 3 的 @人物三视图(N) 直接挂用。\n\n用户确认视觉方向后锁定，再进入下一步——后面分镜严格按选定的模特、场景来写；用户选定的那张场景氛围图固定命名为「场景氛围图」（空间品类实景图命名为「空间实景」），供 @场景氛围图 / @空间实景 挂用。moodboard 是出 prompt 前的把关闸口，也是 @ 锚点的定名闸口。\n\n### Step 3 · 出分镜 prompt → 满意即生成 → 合成成片 → 自动生成字幕\n\n① 时长分流（以 15s 为一个 clip · 生成粒度铁律）\n\n**生成单位 = 一个 15s clip。** 一个 clip = 一条完整连续 prompt（内部含编号分镜，交给模型在这一个 clip 内自动切分）。\n\n- **15s = 1 个 clip**：一条 prompt 整段直出。\n- **30s = 2 个 clip**：写 2 条 prompt（前后内容不同、不重复，logo 只在第 2 个 clip 结尾）。\n- **60s = 4 个 clip**：写 4 条 prompt（内容各不重复，logo 只在第 4 个 clip 结尾）。\n\n**严禁逐镜生成（强规则）**：编号镜头「镜头1 / 镜头2 / 镜头3…」只是**一个 clip 内部**给模型看的分镜脚本，**绝不允许把每个镜头当成一次独立生成任务一个个去生成**；每个 15s clip 只发起**一次**生成、一次产出整段 15s 画面（内部多镜由模型自动切分与衔接）。凡是「一个镜头一个镜头生成」「按镜头逐条调用 Seedance」都是错的。\n\n**多 clip 并行生成（强规则）**：多个 clip 的 prompt 一次性全部写完、一并给用户确认，确认后所有 clip 同时调用 Seedance 2.0 并行生成——不等第 1 个 clip 出片再生成后续。（若用户明确要求逐 clip 确认再续，可改为逐 clip 生成，但**单位始终是整段 15s clip，绝不降到单镜**。）\n\n**并行/多 clip 下的段间一致性**：不依赖末帧续接，改由锚点承载——各 clip 的 prompt 引用同一 {{场景氛围图}} / {{产品三视图}} / 角色三视图，并写明同一 {{Mixed N}}、同一服装（第几套 look）、同一光线时段；clip 间衔接靠写 prompt 时预先设计好首尾镜头的动作/景别呼应，不穿帮。\n\n② 输出格式（中文编号分镜 · 一条 prompt = 一个 15s clip）\n\n开头固定句（每条 prompt 第一句原样写，不得改动措辞）：参考@场景氛围图作为场景、影调参考，参考@人物三视图作为人物主体，参考@产品三视图、@产品细节三视图作为产品参考。 —— 按实际情况裁剪引用对象：无模特则去掉「参考@人物三视图作为人物主体，」；地产/酒店等空间品类把场景引用改为「参考@空间实景作为场景、影调参考」且每镜须在实拍场景内、不得虚构空间；多个角色写 @人物三视图1、@人物三视图2。除此之外句式与用词固定不变。\n\n@ 引用必须实挂锚点（强约束）：每个 @名称 都必须真实绑定到前面步骤已生成、且用户已确认的对应锚点图——@场景氛围图 = Step 2 用户选定的那张场景氛围图；@人物三视图(N) = Step 2 生成的角色三视图（第 N 位角色）；@产品三视图 / @产品细节三视图 = Step 1 生成的两张产品参考图；@空间实景 = Step 1 的实景图。调用 Seedance 2.0 时把这些图作为参考图随 prompt 一并挂上，@名称 与挂图一一对应、名称完全一致。出 prompt 前先核对：句中引用的每个锚点都已生成且已确认——缺哪张就先回对应步骤补生成，绝不允许 @ 一个不存在的图空引用。多 clip 并行生成时，所有 clip 挂同一套锚点图。\n\n场景由图承载，正文不再用文字描述场景氛围 / 环境 / 色调（否则与图引用互斥）；正文只写品质锁定（电影感 / 广告级）+ 主体 / 动作 / 镜头 / 产品。人物与产品同理：形象以 @人物三视图 为准、产品以 @产品三视图 / @产品细节三视图 为准，正文不再重复描述人物长相与产品外观。\n\n**每个 clip 内部**按 镜头1 / 镜头2 / 镜头3… 编号，每镜写明 景别 + 运镜 + 内容（{{Mixed N}} 或产品的动作与画面）。**这些编号只是这一个 clip 交给模型的内部分镜，整段一次生成，不逐镜发起。**\n\n节奏落地：一个 clip 内的镜头数量、单镜时长、产品出现时机按第四节该品类节奏表来；景别跳三级切、硬切为主、禁叠化。快节奏品类（食/运/科 + 促销目的）每个 clip 必须执行第四节「快节奏品类硬规则」：一个 15s clip 出 6–8 镜、单镜 ≤ 2s、至少 2 种动感运镜、镜头动词用快词、每镜有动作。\n\n第一镜规则：每个 clip 的第一镜不得是纯场景空镜——有模特必须是模特在场景里；无模特则第二镜必须出现产品。\n\n人物运动速度：人物动作按正常速度自然运动，禁止无故慢动作、迟缓漂浮感；升格/慢动作只用于明确设计的强调镜头（如质地拉丝、水花定格），并在该镜写明，其余镜头一律正常速度。\n\n运动质量句（每条 clip prompt 末尾固定加）：运镜丝滑流畅、帧率稳定连贯、不掉帧、不卡顿、不抖动、自然动态模糊；人物动作正常速度、自然流畅，不迟缓；环绕 / 旋转放慢匀速。镜与镜不跳帧、不越轴（守 180° 轴线）。\n\n禁止生成背景音效（每条 clip prompt 固定写明）：视频静音生成，不自动生成任何背景音效 / 环境音；音乐、音效、旁白全部留到 ④ 后期。\n\n旁白文案在此写出给用户确认（按选定旁白语言：中文或英文撰写）；旁白一律留到 ④ 后期配音。\n\n③ 满意即生成\n\n中文 prompt 输出、用户确认后直接调用 Seedance 2.0 生成视频，不需手动粘贴；**每次调用生成一个完整 15s clip（不逐镜）**，调用时把开头固定句引用的全部锚点图（场景氛围图 / 人物三视图 / 产品三视图 / 产品细节三视图，或空间实景）作为参考图随 prompt 一并挂上，@名称 与图一一对应；30s / 60s 的多 clip prompt 一次性全部确认、所有 clip 同时并行生成（不逐段等待、更不逐镜，各 clip 挂同一套锚点图），出片后一起给用户过目。\n\n④ 合成成片 → 自动生成字幕\n\n拼接：30s / 60s 的多个 15s clip 按顺序拼接，统一画幅帧率、处理 clip 间衔接；15s 单 clip 直接成片。\n\n配乐（一律后期生成）：视频静音、无背景音效，音乐后期加——拼片后生成一段，时长严格匹配成片、依实际节奏与调性（食 / 运 / 促销卡点 beat-sync，奢 / 酒 / 香氛铺底，金 / 地温暖器乐）。\n\n旁白后期配音：按选定人声 + 选定旁白语言（中文 / 英文二选一）用 TTS / 配音生成，对齐画面混入；旁白文案按选定语言撰写并已在 ② 给用户确认。\n\n合成完成后自动进入下一步生成字幕（无需用户再触发）：按 Step 1 卡的字幕选择叠加字幕（无 / 单语 / 双语），并在结尾叠品牌 slogan / logo 落点，输出最终成片。\n\n---\n\n## 锁定风格块（按制作方式选用 · 原样使用）\n\n电影感商业片基底（实拍）· EN：\n\nA high-end commercial film, cinematic masterpiece, commercial-grade lighting and color grading, crisp clean image, shallow depth of field, premium product-film aesthetic, natural film-scan color fidelity (no over-warm filter).\n\n电影感商业片基底 · ZH：\n\n高端商业广告片，电影级杰作，广告级布光与调色，画面干净锐利，浅景深，高级产品片美学，自然 film-scan 色彩还原（避免过暖滤镜感）。\n\n叠加句：演示 + clean seamless studio backdrop, macro detail, even soft key light, product hero shot, slow-motion reveal｜视听奇观风格 + fashion-film energy, dynamic FPV/slider/crane motion, music-driven rhythm, rich material texture｜科技 + dark moody studio, neon edge light, glowing UI, 360 orbit。\n\n---\n\n## 完整范例（美妆/护肤 · 演示+情感 · 15s = 1 个 clip · 9:16）\n\n旋钮：灯光=柔光通透+逆光发丝光｜色调=暖+低饱和奶油感｜镜头=微距+缓慢 orbit+浅景深｜音乐=氛围电子+涂抹质地微声｜剪辑=中速｜模特=高级脸+面部微表情｜故事=弱叙事·产品 hero 收尾。\n\n（中文、编号分镜；**一个 15s clip 内部含 5 镜，整段一次生成、不逐镜**。）\n\n```\n参考@场景氛围图作为场景、影调参考，参考@人物三视图作为人物主体，参考@产品三视图、@产品细节三视图作为产品参考。高端美妆广告片，电影级杰作，画面干净锐利，浅景深。竖屏 9:16。\n镜头1｜中景／缓慢推近：{{Mixed 1}} 坐在梳妆区，神情恬静、妆容精致，抬手拿起产品，动作自然利落。\n镜头2｜大特写微距／固定：指尖从莹润膏体中挑起一缕，质地在升格慢动作中缓缓拉丝（此镜为设计的质地强调镜头）。\n镜头3｜特写／横移：膏体沿其颧骨滑过，留下水润光泽，涂抹动作正常速度。\n镜头4｜面部特写／缓慢推近：她睁眼望向镜头，露出自信的微笑。\n镜头5｜产品特写／缓慢平稳环绕：环绕产品瓶收尾，品牌 logo 与一句 slogan 淡入。\n禁止生成背景音效（视频静音，配乐后期加入）。运镜丝滑流畅、帧率稳定连贯、不掉帧、不卡顿、不抖动、运动顺滑带自然动态模糊；人物动作正常速度、自然流畅，不迟缓。\n```\n\n> 上面 5 个镜头写在**同一条 prompt** 里、作为**一个 15s clip 一次生成**；30s 就再写第 2 条这样的 clip prompt、60s 再写到第 4 条，绝不把 镜头1\\~镜头5 拆成 5 次生成。\n\n---\n\n## 参考文件\n\n拆解要素菜单、风格种子映射表、输出前自检清单均已内联在本文件内。\n\nreferences/[seedance-output.md](http://seedance-output.md)、scripts/extract\\_[frames.sh](http://frames.sh)（抽帧/合成脚本，待补）。\n\n---\n\n## 通用约束\n\n出 prompt 前请对照文末《输出前自检清单》逐项自检（即下列约束的清单版）。\n\n- 每条 prompt 中文交付；用户确认后直接调用 SD2 生成、不需手动粘贴。\n- **生成粒度铁律**：**一条 prompt = 一个 15s clip = 一次生成**；15s=1 clip、30s=2 clips、60s=4 clips；编号分镜只是单个 clip 内部分镜、交模型自动切分；**绝不逐镜生成 / 绝不单镜头逐个生成**。30s / 60s 多 clip prompt 一次写全、一并确认、所有 clip 并行生成（如用户要逐 clip 确认可逐个生成，但单位仍是整段 clip）。\n- 角色用 {{Mixed N}}，首现写全、后续复用、主宾清晰；演示型确保产品每镜清晰。\n- 各 15s clip 之间（并行生成，不逐段续接），务必靠共同锚点（同一 {{场景氛围图}} / {{产品三视图}} / 角色三视图）保持 {{Mixed N}}、服装、场景、光线一致，clip 间首尾镜头在写 prompt 时预先设计呼应，衔接不穿帮。\n- 开头固定句（强约束）：每条视频 prompt 第一句原样写「参考@场景氛围图作为场景、影调参考，参考@人物三视图作为人物主体，参考@产品三视图、@产品细节三视图作为产品参考。」（无模特去掉人物段；空间品类改 @空间实景；措辞其余固定不变）。每个 @名称 必须实挂前面步骤已生成、用户已确认的对应锚点图，调用 Seedance 时随 prompt 一并挂上、名称一一对应；禁止空引用不存在的图，缺图先回对应步骤补生成。场景/人物/产品全部由引用图承载，prompt 正文不再用文字描述场景氛围 / 环境 / 色调 / 人物长相 / 产品外观（避免与图引用互斥）；对错以选定图为准。\n- 实拍场景（地产 / 酒店等）：用实拍图的品类，开头固定句改引用 @空间实景，最终 prompt 的每个镜头都必须基于 @空间实景 实拍场景，不得另造虚构 / 想象的空间。\n- 人物表情务必自然可信，禁止夸张怪异表情。\n- 第一镜规则：每个 clip 的第一镜禁止纯场景空镜——有模特时第一镜必须是模特在场景里（人 + 环境同框）；无模特（纯产品）时第二镜必须出现产品。\n- 人物运动正常速度：人物动作按现实正常速度自然运动，不能迟缓、漂浮、无故慢动作；升格/慢动作仅限明确设计的强调镜头并写明，其余镜头正常速度。\n- 禁止叠画 / 叠化转场。\n- 禁止粒子特效（太土）；要做奇观或转场，改用干净的光效或材质质感。\n- 可穿戴产品（衣/鞋/包/帽/镜/饰品/表）：模特在角色三视图阶段就直接穿戴该产品（以 @产品三视图 还原），产品上身状态锁进 @人物三视图 锚点；分镜中人物同框镜的产品穿戴状态以 @人物三视图 为准，产品单独特写镜以 @产品三视图 / @产品细节三视图 为准，两者不得冲突（同一件、同一配色）。\n- 无模特（纯产品）时：运镜要丰富（多角度、环绕、推拉、微距），不要不停怼 logo；要展示产品的方方面面（如手机 = 镜头 / 屏幕 / 边缘；墨镜 = 镜腿 / 镜片 / 人物佩戴效果），logo 只在收尾落点出现。\n- 节奏与切换：一个 clip 内的镜头数量、单镜时长、产品出现时机按第四节该品类节奏表控；景别按「跳三级」切（不在相邻两级碎步挪），硬切为主，需要顺滑用 match cut / action match，禁叠画/叠化。快节奏品类（食/运/科 + 促销目的）每个 clip 强制走「快节奏品类硬规则」：6–8 镜、单镜 ≤ 2s、动感运镜 ≥ 2 种、快词动词、每镜有动作，绝不允许写成慢节奏。\n- 运镜要丝滑：每条 clip prompt 末尾固定加运动质量句（不掉帧 / 不卡顿 / 丝滑 + 自然动态模糊）；环绕、旋转类镜头尤其易掉帧，写明\"缓慢匀速环绕、平滑连续旋转\"并放慢速度。\n- 镜头衔接：镜与镜之间不要跳帧、不要越轴（守 180° 轴线规则），机位与运动逻辑连贯。\n- 禁止生成背景音效：视频静音生成，不出任何环境音 / 背景音效；音乐 / 音效 / 旁白全部后期加入。\n- 一条片只承载一个核心信息点；前 3 秒抓人，结尾必有落点（logo/CTA/主张）。\n- 真实品牌名仅作抽象风格参考，不复现特定品牌真实广告的可识别元素、不杜撰真实品牌虚假主张；风格种子只用可公开复用的数字 --sref、不绑定个人 profile；不做涉及真实公众人物的内容；保持适当无害。\n\n---\n\n## 输出前自检清单\n\n出 prompt 前逐项确认，全部打勾才交付；这些规则等同主 [SKILL.md](http://SKILL.md)「通用约束」，此处只汇总以防漏。\n\n生成粒度\n\n- \\[ \\] **一条 prompt = 一个 15s clip = 一次生成？15s=1 / 30s=2 / 60s=4 个 clip？**\n- \\[ \\] **没有把编号镜头当独立任务逐镜生成？（编号分镜只在单个 clip 内部、交模型自动切分）**\n- \\[ \\] 30s/60s 的多 clip prompt 已一次写全、可并行生成（或用户要求逐 clip 确认）？\n\n语言与格式\n\n- \\[ \\] 中文交付？\n- \\[ \\] 每个 clip 内部按 镜头1 / 镜头2 / 镜头3… 编号分镜，每镜写明景别 + 运镜 + 内容？\n\n场景与开头固定句\n\n- \\[ \\] 每条 prompt 第一句是固定句「参考@场景氛围图作为场景、影调参考，参考@人物三视图作为人物主体，参考@产品三视图、@产品细节三视图作为产品参考。」（按有无模特/空间品类正确裁剪，措辞未改）？\n- \\[ \\] 句中每个 @名称 都能对上一张已生成、已确认的锚点图（无空引用）？调用 Seedance 时这些图已随 prompt 挂上、名称一一对应？并行多 clip 挂的是同一套锚点图？\n- \\[ \\] 场景由 @场景氛围图 承载，正文没有再用文字描述场景氛围 / 环境 / 色调？\n- \\[ \\] 地产 / 酒店等实拍品类：开头改引用 @空间实景，每个镜头都基于实拍场景，没另造虚构空间？\n\n一致性锚点\n\n- \\[ \\] 产品每镜清晰、以 {{产品三视图}} 为准？\n- \\[ \\] 人物用 {{Mixed N}}，跨镜/跨 clip 的人物、服装、光线一致，衔接不穿帮？\n- \\[ \\] 可穿戴产品（衣/鞋/包等）：角色三视图里模特已穿戴该产品（与 @产品三视图 同款同色）？服装图 look 围绕产品搭配？人物同框镜与产品特写镜的产品状态不冲突？\n- \\[ \\] 30s/60s：多 clip prompt 已一次写全、可并行生成？各 clip 引用同一锚点图、clip 间首尾镜头已设计呼应？\n\n生成工具\n\n- \\[ \\] 场景氛围图用 Midjourney v8.1（prompt 末尾带风格种子 + --v 8.1）？风格种子只用数字 --sref、无个人 profile？\n- \\[ \\] 服装图、角色三视图用 GPT Image 2？\n\n人物与画面\n\n- \\[ \\] 人物表情自然可信，无夸张怪异表情？\n- \\[ \\] 人物动作正常速度自然运动（无迟缓/漂浮/无故慢动作），升格仅用于写明的强调镜头？\n- \\[ \\] 无模特（纯产品）时运镜丰富、展示产品各面，没有不停怼 logo（logo 只在收尾）？\n\n节奏与切换\n\n- \\[ \\] 每个 clip 第一镜不是纯场景空镜：有模特=模特在场景里；无模特=第二镜已出现产品？\n- \\[ \\] 前 3 秒有钩子、产品在该品类规定时机内露脸（促销/演示第 3s 见产品）？\n- \\[ \\] 一个 clip 内镜头数量与单镜时长符合第四节该品类节奏表（15s clip≈4–6 镜，快节奏可 6–8）？\n- \\[ \\] 快节奏品类（食/运/科/促销）：每个 clip 已按硬规则出 6–8 镜、单镜 ≤ 2s（运动 ≤1.5s）、用了 ≥2 种动感运镜、镜头动词是快词、每镜有明确动作、无慢词主导？单 clip 总镜数 × 单镜时长 ≈ 15s？\n- \\[ \\] 景别按「跳三级」切、硬切为主，无相邻级碎步挪？\n\n运镜与衔接\n\n- \\[ \\] 每条 clip prompt 末尾有运动质量句（不掉帧/不卡顿/丝滑 + 自然动态模糊）？\n- \\[ \\] 环绕/旋转镜头已放慢、写明「缓慢匀速环绕、平滑连续旋转」？\n- \\[ \\] 镜与镜之间不跳帧、不越轴（守 180° 轴线）？\n\n禁用项\n\n- \\[ \\] 无叠画 / 叠化转场（需要顺滑用 match cut / action match）？\n- \\[ \\] 无粒子特效？\n- \\[ \\] prompt 已写明「禁止生成背景音效」、视频静音生成（音频全部后期）？\n\n结构与落点\n\n- \\[ \\] 一条片只承载一个核心信息点、前 3 秒抓人？\n- \\[ \\] 结尾有落点（logo / CTA / 主张）？30s/60s 的 logo 定版只在最后一个 clip 结尾？\n\n安全\n\n- \\[ \\] 不涉及真实公众人物、不复现特定品牌真实广告可识别元素、不杜撰真实品牌虚假主张、内容适当无害？", "extras": [], "cn": "高奢感TVC"}, {"slug": "mahou-shoujo-90s", "desc": "赛璐璐质感变身，重返90年代少女梦", "body": "# mahou-shoujo-90s\n\n做 90 年代手绘赛璐璐风、美少女战士式魔法少女动画时用本 skill。含仪式化变身、星光战斗、情感面部特写与双层梦幻现实世界观。序列编号体系(V/C/E/ET/SF/P/B/DL/F 及变身 A–E)本身是工艺、跨节互引,须整体保留。\n\n> **风格致敬,非精确模仿**:借鉴 90s 魔法少女类型美学,**不复刻美少女战士等版权角色/名称/具体设计/台词**,创作原创角色;英文提示词中的类型锚点词(如 magical girl anime theme)为风格方向,变身宣言等台词为 `[示例]` 占位,不照抄版权台词。\n> 本环境适配:`generate_image_v3`(Nano Banana Pro / GPT Image 2,2K)/ `generate_video_v3`(Seedance 2.0,720p,会员高画质可 1080p);`text_editor` → `write_file_v2`;`video_assembler` → `composite_video`;`resource_prepare_and_analyze` → `analyze`;`lyrics_to_song`/`text_to_instrumental`(Suno/Mureka)→ `generate_audio`(角色音色注册为 key_element_audio 保跨镜一致);`<<<image_x>>>` → `reference_nodes`+`{{NodeKey}}`;\"Seedance 内嵌音频保留\"规则 → 本环境生成视频音轨的等价约束(见装配)。九大序列 + 变身 A–E 的英文提示词模板见 `references/prompt-library.md`;帧级卡点表 4.1–4.8 与装配规范见 `references/editing-and-audio.md`。\n\n## key_elements 元素设计\n\n**角色元素(element character,多角色群像)**:每位魔法少女独立建 key_element,记录:\n- **双形态**:[Identity 1] 日常状态(学生制服/发型/气质关键词);[Identity 2] 变身战士状态(战衣颜色主题/标志配饰 缎带-蝴蝶结-头冠-手套-长靴/专属符文/武器)。用 ImageToImage 保双形态跨镜一致。\n- **角色色彩专属标识(Color Identity)**:每位战士专属主色(如 月之战士=粉+银、火之战士=红+橙、水之战士=蓝+水蓝),用于跨镜构图色彩区分与群像配色平衡。\n- **友情角色定位(Friendship Role)**:群像剧中情感角色(领袖/守护者/智慧担当/力量担当/温柔担当),用于群像镜头情感层次设计。\n- 每位主要角色绑定/生成专属 **key_element_audio** 保台词与合体技呼喊跨镜音色一致。\n\n**场景元素(element scene)**:建\"日常+梦幻\"双层结构——日常(学校天台/夜晚都市天台)、梦幻(星光宇宙/梦境回廊/魔法结界);群像战斗场景额外建专属宽景元素(如 `[Scene_Ensemble_Battle_Arena]`,注明多人同框构图:宽幅星光舞台/环形魔法阵地面/多方向光束来源)。\n\n**反派元素(villain key_element)**:必录字段——**威胁等级(Threat Tier)**「魔王/首领级(Archenemy)」或「本集怪人级(Monster-of-the-Week)」;**黑暗色彩标识(Dark Color Identity)**(暗紫+腐化金 / 深渊蓝+冰霜银 / 血红+乌黑,与粉彩色系强对比用于对峙色彩对抗);服装体型关键词(夸张肩部轮廓/长拖地暗色披风/腐化变形星月符文/遮半脸发型/与魔法少女战衣镜像扭曲结构);气质关键词(「冷冽高傲型」冰冷瞳色/慢动作凝视/低沉台词 或「扭曲癫狂型」裂开式笑容/不对称动态/嘲弄与爆发交替)。反派场景元素:专属黑暗领域(腐化暗宫/裂缝次元空间/黑暗侵蚀城市废墟),注明与日常/梦幻场景色调反差(暖粉渐变 vs 冷黑渐变)。\n\n## multimodal 解析(`analyze`,有上传时)\n\n角色特征(日常校服/便服 vs 魔法变身姿态,标志配饰:缎带/蝴蝶结/头冠/手套/靴子/星月符号);**反派特征**(威胁层次 Archenemy vs MOTW、标志视觉元素 暗色长袍紧身衣/夸张尖锐肩部/阴影遮单眼发型/扭曲星月符文/腐化黑紫暗金、登场压迫感构图信号 俯拍威压/逆光剪影/阴影脚底蔓延/背景色温骤降);变身与战斗机制(旋转动作/定格姿势/魔法符文排布、魔法攻击视觉载体 能量缎带/星光射线/月影流光);**色彩光影**(高明度梦幻粉彩 柔粉/月银/天蓝/薰衣草紫/魔法金、手绘赛璐璐质感/柔焦漫反射/边缘高光分布,输出**色彩与明度矩阵映射**);音色特征(清脆/纯真/情感充沛/坚定温柔,记为 key_element_audio 绑定参数)。\n\n## 色彩与质感\n\n高明度梦幻粉彩:柔粉 / 月银 / 天蓝 / 薰衣草紫 / 魔法金;手绘赛璐璐质感、柔焦漫反射(soft focus glow)、边缘高光(rim light)。\n\n## 九大序列体系(分镜规划规则,编号互引)\n\n以下为各序列的**分镜结构与节拍规则**;对应英文提示词模板见 `references/prompt-library.md`。\n\n### 反派登场 V-1~V-3(2–4 镜标准序列)\n- **V-1 轮廓剪影压迫**:逆光剪影登场,仅露夸张轮廓与发光黑暗瞳色;高角度俯视或极低仰角营造体型压迫;背景色温骤降。\n- **V-2 细节显露**:缓慢推进,从披风底端→腰部→胸口符文→下巴→嘴角→单眼逐段揭示,**禁一次性全脸正面亮相**保悬念。\n- **V-3 台词宣言**:极度特写嘴角/冷冽眼神配第一句台词,语气冷静高傲或嘲弄轻蔑(≤15 字),配低沉音色 key_element_audio。\n- **规则**:V-1/V-2 禁露完整面部(悬念留至 V-3 乃至战斗高潮);反派与少女同框须写冷暖色对立分区;V-3 台词冷静高傲(MOTW 级可写狂妄嚣张短促叫嚣 ≤10 字);登场以低音铜管+不协和弦乐颤音,与变身段星光铃铛+上扬管弦两套音效系统不得同镜混用。\n\n### 双方对峙 C-1~C-6(六节拍完整序列;MOTW 简化为 C-1→C-4→C-5)\n按「压迫建立→情绪酝酿→交锋试探→情感爆发→构图翻转→余韵收束」分配,**禁简化为单一打斗镜头**:\n- **C-1 压迫建立**:反派侧高/少女侧低强对角构图,反派占约 60% 视觉权重、Dark Color Identity 冷暗压制色温;**此节拍不允许少女主动进攻**(静止/后退建压迫基底)。\n- **C-2 情绪酝酿(少女内心特写)**:切入情感特写(优先 E-1 流泪或 E-4 爆发临界),**不出现反派**;镜头静止或缓推,允许内心独白(≤10 字,疑问/动摇);背景虚化散焦暖光预示翻转。\n- **C-3 交锋试探**:同框中景双人构图(two-shot),执行「冷暖色对抗分区」(左半 少女侧粉彩暖光/右半 反派侧冷暗色,中线相互博弈渗透约 10% 画幅);轻推或匀速横移;可写反派第二句台词(嘲弄/宣示 ≤15 字)。\n- **C-4 情感爆发(构图翻转触发)**:插 E-4 觉醒爆发特写(眼神动摇→坚决峰值帧,Color Identity 光从虹膜爆发,管弦乐从静默骤然全奏);**此帧即构图翻转视觉触发点**,镜头从特写骤然拉远至宽景,少女姿态防守转主动。\n- **C-5 构图翻转(力量逆转)**:反派高/少女低比例被**彻底颠覆**——少女跃升至同等或更高位,Color Identity 暖光占比从初始 30% 扩张至 50% 以上;**运镜须为仰角跟拍**(tracking low-angle)强调上升力量感。\n- **C-6 余韵收束**:进战斗前保留至少一个情感特写或静止双人镜头作缓冲(可选 E-2 誓言或 E-3 友情觉醒对视),锁定最终情感状态、预告战斗动机;配乐弦乐长音或钢琴铺底,不提前进战斗节奏。\n- **翻转节点规则**:翻转只发生一次(单向推进不反复切换);必须由情绪驱动(C-5 必在 C-4 之后,不允许无铺垫直接翻转);群像对峙翻转由领袖(Friendship Role:领袖)主导触发,C-4 聚焦领袖、C-5 其余成员跟随形成彩虹阵列。台词分配:反派集中 C-1/C-3、少女集中 C-2/C-6,C-4/C-5 以视觉为主不堆双方台词;C-2/C-6 须预留至少 0.5s 静默或极轻配乐窗口。\n\n### 情感特写 E-1~E-4\n- **E-1 流泪特写**:变身触发前/战斗蓄力内心动摇/守护誓言前;泪水带光学质感(crystalline/prism/星光折射),**禁写实生理性哭泣**、保持\"美丽的泪\"。\n- **E-2 守护誓言独白**:变身完成对镜宣言/战斗前立场宣示/群像领袖独白;台词缓而坚定(≤15 字)。\n- **E-3 友情觉醒对视**:合体技 F-1 情绪共鸣/情感转折/危机无声默契;通常无台词。\n- **E-4 觉悟爆发**:变身镜头 A 情绪触发升级版/突破极限觉悟瞬间/重新点燃关键帧;台词短促有力(≤10 字)。\n- **通用规则**:背景高度虚化(bokeh/散焦)主体脸眼为绝对焦点;配乐钢琴/弦乐为主、禁打击乐或合成器主导动感节奏(区别于战斗/变身)。\n\n### 仪式化变身 A–E(8–10 镜经典结构)\n- A 日常起因(手持变身器/眼神坚定/光芒从胸口溢出);B 旋转升空(rotating camera/身体化半透明光粒子剪影);C 战衣生成(魔法缎带缠绕肢体渐凝手套长靴);D 发型变换(头发随风飞舞/月亮头冠发饰在额头亮起);E 定格 Pose(低角度英雄 pose/旋转定格/对镜单眼眨眼 wink)。每镜核心字段:画面场景(显式引 scene ID)、剧情节拍与动作(角色肢体动态+经典台词/变身誓言 dialogue,引角色 element ID)、镜头语言与构图(强制 90s 术语:极度面部特写/拉近变焦/360 度环绕运镜/柔焦梦幻边缘)。台词集中 A(情绪触发内心独白)与 E(定格宣言),B/C/D 以视觉动态与音效为主不堆台词。镜头长度倾向 8–15s(不超 15s 上限)。\n\n### 多角色群像镜头\n- 集体登场:优先 宽景→逐一特写→回归宽景 三段式(Wide→Individual Close-up Round→Group Wide),每角色至少一个情绪面部特写。\n- 群像站位与色彩:明确各角色站位层次(前/中/后景)、按 Color Identity 安排左右前后排列成彩虹式渐变(rainbow formation)。\n- **友情合体技 F-1~F-4**:F-1 情绪共鸣触发(多角色互视特写眼神交流)、F-2 各角色蓄力(交叉剪辑各召唤专属符文/光束,各占约 1–2s 特写)、F-3 能量汇聚(所有光束/缎带向中心汇聚成旋转光柱或星形爆裂,宽景快推至中心爆发点)、F-4 合体释放与扩散(终极光波四周扩散,切全景,全员定格各自 Hero Pose,彩虹色光环绕);台词短促(≤10 字/人)按镜头顺序分散不堆同镜。\n\n### 多人合体变身 ET-1~ET-6(7–10 镜,两人以上同时变身)\n以「情感共鸣触发→个人蓄力→光芒汇聚→集体定格」为主轴,非单人 A–E 简单叠加。**适用时机区分**:单人变身(A–E)=单一角色/情绪来自个人内心/单件乐器/标准仪式;多人合体(ET)=两人及以上同时/情绪来自群像共鸣/分层独奏汇聚为管弦全奏/集体定格取代单人 Pose。\n- ET-1 情感共鸣触发(群像面部特写交叉剪辑 疲惫/动摇→坚决,末镜多人同框侧颜互视;**不出现变身器**;台词各角色默契短语 ≤8 字/人分散);\n- ET-2 变身器同步召唤(快速交叉剪辑每角色 1–1.5s 特写召唤变身器,各 Color Identity 光同时溢出,剪辑与 ET-3 音乐蓄力节拍对齐,末剪切宽景全员同时伸出;**各角色独立触发变身器音效、密度随人数递增依次叠加非同时爆发**);\n- ET-3 各自变身进程(**闪回蒙太奇式压缩**,每角色取 1–2 最高视觉密度瞬间帧 约 0.5–1s 极快切,按 Color Identity 彩虹序列推进;**不展示完整仪式**、仅提取情绪峰值帧);\n- ET-4 光芒汇聚中心(宽景全员光芒向中心汇聚成旋转彩虹光柱/星形爆裂,宽景快推至汇聚中心,管弦全奏峰值;**ET 序列视觉轴心、全段最高亮度帧**);\n- ET-5 群像集体定格(低角度仰拍宽景全员定格各自 Hero Pose,按 Color Identity 彩虹阵列构图,光芒向外辐射成星座爆裂,领袖位于视觉中心或略前,镜头完全锁定**驻留 3s 以上**);\n- ET-6 台词宣言轮播【可选】(快速切各角色中景特写各说宣言 ≤8 字/人分散,末镜切回宽景领袖说合体宣言 ≤12 字配全员集体眨眼)。\n- **规划约束**:ET-3 压缩原则(禁为每角色各展开完整 A–E 免时长失控/削弱群像感,特别强调某角色可单独插稍长变身特写约 3–4s 但整体以 ET-3 交叉剪辑节奏为主);Color Identity 彩虹序列一致性(ET-2 召唤顺序/ET-3 峰值帧顺序/ET-5 站位排列须同一序列);领袖高光(ET-3 领袖峰值帧略长约多 0.5s、ET-5 领袖光芒可见强于他人);**与 F 系列区分**(ET=变身过程本身、F=变身后合体攻击,不可混用;同场景 ET 后紧接 F 须在故事板明确标 ET 结束衔接 F 的切点)。\n\n### 季终决战 SF-1~SF-5(五节拍,不遵标准流程)\n以「极限崩溃→情感牺牲→奇迹觉醒→终极净化→情感余韵」驱动,五节拍不可省略(时长受限可压缩每节拍内分镜数、不可跳节拍);标\"Season Finale Climax\"区别常规集,media 处理此段优先引\"觉醒形态\"key_element。\n- **SF-1 极限崩溃(4–6 镜)**:SF-1a 宽景崩溃全览(全员 Color Identity 光减弱/熄灭、战场被 Dark Color Identity 主导、高空俯视缓降)、SF-1b 逐一特写群像崩溃巡视(泪/伤痕/震惊/绝望各约 1.5–2s、光仅剩眼底残留)、SF-1c 领袖极限特写(眼中残留 Color Identity 微光是唯一暖色、镜头锁定静止音效静默);约束:配乐\"张力最高但管弦未爆发\"悬置、禁提前高潮铜管,SF-1c 与 SF-2a 间**必须保留至少 0.5s 静默帧**。\n- **SF-2 情感牺牲(5–8 镜,最高情感密度)**:SF-2a 牺牲决意特写(泪已干或强忍、疲惫→平静笃定、\"放下了\"宁静感、E-2 升级版、台词 ≤12 字**温柔而决绝非悲泣**)、SF-2b 牺牲行动身体语言(将最后魔法能量/圣物/Color Identity 光送向同伴或领袖、光从胸口/双手沿画面中线流向对方、温柔 Color Identity 光束相连、**禁爆炸或冲击波特效**)、SF-2c 接受者反应特写(震惊→泪涌→无声\"我会记住你\"、E-3 变体单向告别对视、末帧定格两人眼神最后交汇点)、SF-2d 牺牲消散(身影如 P-4 化温柔中性白光粒子上升消散但**比净化更慢**、每粒是离别重量、配乐最柔弱钢琴单行旋律弦乐完全停止)、SF-2e 战场短暂静止(宽景全员含 Boss 短暂静止白光粒子漂浮、**强制保留至少 1s 静止**不立即切 SF-3);约束:全段**禁战斗动作**(牺牲是主动选择、强调主动性与温柔性);全员共同牺牲版则 SF-2b 替换为多角色依次汇聚光芒向领袖的多镜头交叉序列(各约 2s)。\n- **SF-3 奇迹觉醒(6–10 镜,视觉密度最高)**:SF-3a 力量汇入内在光海(领袖内部视觉化、抽象/半抽象光海、伙伴 Color Identity 光依次汇入成彩虹光柱灌入胸口、场景 `[Scene_Cosmic_Void]` 或专属奇迹空间)、SF-3b 外在觉醒迹象(发丝逆重力上扬、光强度远超平时、原战衣之上出现新发光纹样/升华装饰、**更激烈且无仪式感**——力量溢出非仪式)、SF-3c 觉醒定格全新形态亮相(全片最高光帧、升华 Color Identity 光包裹全身、新武器/新头饰/新光之翼清晰、低角度仰拍、Dark Color Identity 冷色强行过渡至温暖星光)、SF-3d Boss 反应(单人特写第一次\"动摇\"、微皱眉/瞳孔轻震/气场边缘颤动、**极度克制仅微表情**禁明显恐惧慌乱);约束:SF-3b 与 A–E 本质区别在**无前奏仪式感**(禁复用缎带缠绕/头冠点亮句式、用光爆/纹样浮现/战衣自发升华替代),SF-3c 须专门为\"觉醒形态\"建独立 key_element 变体。\n- **SF-4 终极净化**:与标准净化 P-1~P-4 相同但季终强化——P-1 强化(彩虹状多色光浪整体覆盖 Boss 全身轮廓非局部)、**P-3 季终强化(强制执行非可选)**(Boss 本体显现须完整正脸首次亮相、悲剧身世则补 2–3s 记忆回闪蒙太奇)、P-4 强化(白光粒子与所有伙伴 Color Identity 混合扩散填满星空\"全部色彩归还宇宙\"、战场从冷色完全回暖须至少 2 镜完成)。\n- **SF-5 情感余韵(4–6 镜,情感密度第二高,不可省略)**:SF-5a 战场寂静全览(色温回暖/浮尘光粒子飘落/无人欢呼/镜头静止)、SF-5b 悼念凝视(领袖仰望牺牲者消散方向/眼中映飘散白光粒子/泪无声/\"释然与感谢\"非崩溃、E-1 变体背景保留牺牲者 Color Identity 余光)、SF-5c 群像无言对视(幸存成员无言互视\"我们还在\"、E-3 收束变体\"疲惫的感激\")、SF-5d 日常回归镜头【可选】(全剧终则场景从战场溶入日常、用星光粒子溶解效果);约束:配乐最柔和钢琴/弦乐抒情尾声禁战斗节奏音效重现;牺牲者未真正消亡则 SF-5b 泪水调整为\"笑中带泪\"、SF-5d 后追加重逢暗示镜头(牺牲者 Color Identity 光短暂现天空仅 1–2s 不做台词确认留解读空间)。\n\n### 觉醒形态(Awakened Form)key_element 设计规则\n全片视觉最高峰,须为每位经历 SF-3 的角色**单独建 key_element 变体**与日常/变身形态并列:\n- **7.1 三形态并列**:[Identity 1] 日常(沿用原描述无需重复生成)、[Identity 2] 标准变身战士(引原变身 key_element ID)、[Identity 3] 觉醒升华状态(标准战衣为基底自发浮现升华纹样与光之附加层);标注觉醒触发条件(如\"SF-2 牺牲后伙伴 Color Identity 光灌注触发\")用于装配确认首现时间轴节点。\n- **7.2 升华配饰(升华而非替换)**:光之翼/光之披风(从肩胛骨自发展开半透明光之翼或腰间发光长披风、半透明棱镜折射 Color Identity 与所有伙伴颜色交织、与反派暗色长披风镜像对比)、升华头冠/发饰(原头冠新增光之附加层、标志性升华特征 头冠中央新星形/月形主石或发丝细小流星轨迹、与标准形态\"同源但更盛放\")、武器升华状态(自发光效增强或短暂全新形态 如法杖顶端结晶扩展/缎带化光刃、注明使用后收束状态)、光之纹样层(手臂/锁骨/腹部自发浮现与 Color Identity 呼应的星座纹样/魔法符文、标注纹样形状参考 如\"猎户座链状纹\"\"月牙流动线纹\")。\n- **7.3 专属色彩方案**:主色升华(饱和度明度同步提升 如粉→白金玫瑰光、更接近纯白光而非单一色相)、伙伴色彩融合层(所有伙伴 Color Identity 微量混入作光散射棱镜效果、逐一列出混入伙伴色与出现位置 如\"火之战士橙红散射于翼缘\")、发色变化(向近纯白或全员 Color Identity 混合彩虹渐变演变、注明发根→发梢渐变方向与最终色相)、瞳色爆光(Color Identity 主色+纯白光核心双层爆光、禁单一均匀瞳色、注明爆光强度 轻微微光/中等星芒/全帧爆光)。\n- **7.4 跨镜头引用约束**:独立 asset_id 绑定(不复用标准变身形态图);首次亮相帧锁定(标注首次引用镜头 ID 即 SF-3c Hero Pose 宽景定格帧、后续引用须与首现版本视觉一致);季终结束后形态收束(一次性超越则注明回归标准战衣的视觉处理 如\"翼缓慢消散为粒子/头冠回归原形\")。\n\n### 日常生活分镜 DL-1~DL-5(无战斗校园温馨/友情深化/秘密身份暗线集)\n以「情感积累」非「能量爆发」为主轴,节奏舒缓、镜头静止或极缓推进。日常场景须独立建与战斗/梦幻形成温馨对比的 element scene(如 `[Scene_Classroom_Morning]` 晨光斜射课桌、`[Scene_Rooftop_Lunch]` 天台午餐等),色调以暖黄/奶白/淡蓝阳光为主。节拍类型:DL-1 温馨共处(自然日常互动/中景或宽景/镜头静止或极缓横移/优先无台词或短促轻松 ≤8 字/**禁 Color Identity 光效或变身元素**)、DL-2 秘密身份微张力(身份险暴露/宽景骤切面部特写/表情放松转微妙警觉/背景色温维持日常暖色不触发战斗光效/\"正常中的异常\"、悬念不展开仅伏笔)、DL-3 友情深化对话(深度交流/双人中景或交替特写/镜头基本锁定/台词稍长每句 ≤20 字真实非宣言/轻柔钢琴或吉他极低音量陪衬)、DL-4 独处沉思(内心独白时刻/中景或特写/极缓推进或完全锁定/微表情与环境光变化传递/不需台词/\"未解决的疑问\"状态、与 E-2 区别在这是问题不是答案)、DL-5 日常余韵收束(夕阳挥别/互道晚安/宽景或背影镜头/逆光或暖色侧光勾轮廓/镜头缓拉远或静止注视人物走远/配乐可与 ED 前奏衔接)。标准段落结构:开场建立(1–2 镜)→温馨互动(2–4 镜 DL-1)→秘密身份微张力(0–2 镜 DL-2 可选)→友情或内心深化(1–3 镜 DL-3/DL-4)→日常余韵收束(1–2 镜 DL-5)。约束:**禁引入战斗语法**(dramatic zoom-in/仰角英雄构图/Color Identity 光效爆发/变身器召唤);台词密度(DL-1/DL-5 优先无台词肢体/表情叙事);日常→战斗集感官切换(日常集暖黄+静止收尾、战斗集星光蓝紫冷色+推进开启)。\n\n### 音轨规划(cross-shot audio)\n- **BGM**:至少一条横跨变身与战斗的音乐层,90s 经典管弦魔法风或复古电子合成器。\n- **SFX**:跨镜持续魔法铃铛声(magical chime)、星光爆裂声(orchestral sparkle)、变身器启动音、缎带挥动声。\n- **OP 片头曲**:独立 audio_layer(type: music)置故事板最前端,覆盖整个片头镜头序列(约 90s);风格 90s J-Pop/idol-pop,前奏管弦星光铺垫(4–8 小节)、副歌节奏鲜明上扬配变身高潮画面;歌词主题聚焦\"爱与守护的少女誓言\";人声版在 description 写完整歌词(主歌/副歌/桥段结构)+演唱声线(narration_speaker_profile:少女清亮/高音纯净/略带情感颤音),纯器乐版在 layout_instruction 注明\"无人声,保留合成器和弦与弦乐前景\"。\n- **ED 片尾曲**:独立 audio_layer 置末端,覆盖片尾序列(约 60–90s);相较 OP 节奏放缓,温柔抒情 ballad 或 soft city-pop,钢琴与木吉他为主旋律;歌词主题聚焦友情羁绊与日常守护,情绪由战斗后释然过渡至温柔期盼;layout_instruction 注明与片尾静态/半动态画面(角色日常剪影/星空渐隐)对应关系。\n\n## 流程\n\n1. **全局设计与规格**:先问是否有参考原型素材(角色参考图=锁日常形态+变身战衣、道具/武器参考图=跨镜道具一致、场景参考图=场景 key_element 色调基底、音色参考音频=key_element_audio 基底、音乐风格参考=OP/ED 曲风);说明无素材也可纯文字创作、有则还原度更高。`write_file_v2` 建/更新 Final_Video_Spec.md 锁:画面比例(经典 4:3 或现代 16:9)、画风(90s 手绘赛璐璐)、音效音乐调性(管弦星光+复古合成器)、输出语言、已确认参考素材清单(注明各素材对应绑定的 key_element/audio_layer)。\n2. **资源解析**(`analyze`,若有上传):角色/道具(日常 vs 变身+配饰)、场景(色调/光源/氛围)、音色、音乐曲风;补\"参考素材→key_element/audio_layer 映射表\"。无素材则跳过。\n3. **故事板设计与资产锚定**(`storyboard_designer`):key_elements 必明确双形态(日常 Daily Form / 变身 Magical Form)+ 日常/梦幻双层场景 + 镜头含仪式化变身序列(情绪触发→光粒子扩散→旋转镜头→战衣层层生成→华丽定格 Pose)与诗意魔法战斗;已提供关键素材则绑定对应 key_element。
