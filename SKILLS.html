info bar, 9 perspectives (panoramic, left, right, back, bird's eye, close-up, exterior to interior), no frontal view, descriptions below, bottom color palette with labels, right axis diagram, oppressive atmosphere, master-level composition, \\[场景特征描述\\], \\[色调描述\\], \\[压迫氛围描述\\] --\n\n强制后缀：无噪点、模糊感、廉价特效、高频细节、脏乱纹理、过度柔化、斑驳、杂乱细节、生硬阴影、塑料感\n\n6.3 关键道具生图提示词（强制深色背景图） 根据视觉风格选择对应模板，所有模板均包含硬朗质感标准。所有道具生图提示词强制使用深色背景图，背景必须为纯净蓝黑色或深灰色。\n\n通用基础结构（三种风格共用框架）： 【道具名】 推荐比例：16:9 产品四视图，正视图，左侧视图，右侧视图，后视图，深色纯净硬光背景，伦·怀斯曼式电影级质感光效，硬光刀锋切割，高光锐利如冷金属，阴影深邃，低饱和度，高对比度，\\[风格关键词\\]，\\[道具形态描述\\]，\\[材质描述，如：旧化银质、冷钢、裂纹皮革\\]，\\[使用痕迹或细节描述，如：划痕、磨损的边缘\\]，超写实，8K分辨率，锐利焦点，浅景深，大师级构图，强制深色背景图，背景必须为纯净蓝黑色或深灰色，无任何环境元素 --\n\n强制后缀：无噪点、模糊感、廉价特效、高频细节、脏乱纹理、过度柔化、斑驳、杂乱细节、生硬阴影、塑料感\n\n其中 \\[风格关键词\\] 根据视觉风格替换：\n\n- 风格A：专业产品硬光摄影风格，伦·怀斯曼电影质感，纯黑背景，强调材质\n- 风格B：3D产品渲染风格，PBR材质，冷厉金属反光，伦·怀斯曼暗黑美学，纯黑背景\n- 风格C：二次元道具设计，凌厉赛璐璐上色，硬朗线稿，纯黑背景，暗黑风格\n\n【第7步：本集导演阐述】\n\n- 所选视觉风格及本集核心情绪（压抑的窒息感/冰冷爆发的战栗/被角色孤独感击中的酸楚）。\n- 视觉基调（伦·怀斯曼标志性永夜蓝黑基底，硬光刀锋切割，低饱和度，高对比度，暖色作为情感脉冲）。\n- 段落数量及剧情分布：根据对白字数计算出的段落总数，以及每段承载的关键冲突与由人物内心驱动的实力碾压递进。\n- 关键动作设计及段落间的衔接点（如何保证连贯，如雨水、阴影的延续），特别注意轴线统一。\n- 整体节奏：哪个段落埋钩子，哪个段落爆发冲突，哪个段落用角色的孤独背影留下逆袭悬念。\n\n【第8步：Seedance 2.0 视频段落提示词（动态段落数）】 此为输出核心，严格按照以下格式输出若干段15秒视频生成提示词，每段自成一个完整的影像叙事单元。段落总数由对白量决定，计算公式：总段落数 = ceil(总对白字数 / 75)。例如对白350字，需5段。\n\n铁律：所有对白必须保留完整，与剧本逐字一致，不得增删改任何字词。轴线规则必须遵守，摄像机始终在人物同一侧。所有画面需符合伦·怀斯曼暗黑美学。\n\n第X集 Seedance 2.0 视频生成段落（共N段）\n\n段落 #1/N (15秒) — \\[情绪/场景概括\\] Seedance 提示词： 你是一个爆款短剧的导演，采用伦·怀斯曼的黑暗美学风格。禁止使用正视图，采用侧视图35度或者45度侧拍，用硬光刀锋勾勒人物轮廓。每个镜头至多2.5秒，相邻景别之间不允许衔接，避免全景，95%的景别为中景、特写、近景，采用浅景深拍摄。禁止在画面中添加任何字幕、文字或图形符号。拍摄轴线必须保证不越轴，摄像机始终在人物同一侧拍摄，禁止跨越180度轴线。 \\[在此接续具体画面描述，用连贯的语言描绘这15秒内的完整影像内容，包括动作流程、镜头运动、伦·怀斯曼式光线变化、表情中的孤独/决绝、以及完整无缺的逐字对白（仅描述演员说出的内容，不生成字幕，但文字必须与剧本完全一致）。注意所有镜头必须保持摄像机在同一侧，不越轴，硬光刀锋的角度统一。\\] 连贯性上下文：（本段开头如何承接上一段，如果是#1则写“开场建立”） 音效/BGM建议：（如：低沉弦乐起，雨水声，心跳重音渐强，金属碰撞的冰冷回响）\n\n段落 #2/N (15秒) — \\[情绪/场景概括\\] Seedance 提示词： 你是一个爆款短剧的导演，采用伦·怀斯曼的黑暗美学风格。禁止使用正视图，采用侧视图35度或者45度侧拍，用硬光刀锋勾勒人物轮廓。每个镜头至多2.5秒，相邻景别之间不允许衔接，避免全景，95%的景别为中景、特写、近景，采用浅景深拍摄。禁止在画面中添加任何字幕、文字或图形符号。拍摄轴线必须保证不越轴，摄像机始终在人物同一侧拍摄，禁止跨越180度轴线。 \\[在此接续具体画面描述，包含完整逐字对白，保持轴线，保持光影风格\\] 连贯性上下文： 音效/BGM建议：\n\n...（重复至第N段）\n\n段落 #N/N (15秒) — \\[情绪/场景概括\\] Seedance 提示词： 你是一个爆款短剧的导演，采用伦·怀斯曼的黑暗美学风格。禁止使用正视图，采用侧视图35度或者45度侧拍，用硬光刀锋勾勒人物轮廓。每个镜头至多2.5秒，相邻景别之间不允许衔接，避免全景，95%的景别为中景、特写、近景，采用浅景深拍摄。禁止在画面中添加任何字幕、文字或图形符号。拍摄轴线必须保证不越轴，摄像机始终在人物同一侧拍摄，禁止跨越180度轴线。 \\[在此接续具体画面描述，包含完整逐字对白，保持轴线，保持光影风格\\] 连贯性上下文： 音效/BGM建议：（结尾钩子式音乐骤停或延续，留下雨声或心跳声）\n\n【第9步：规范性自检】 输出全部内容后，逐项自检并附结果：\n\n| 检查项 | 标准 | 实际 | 达标 | | 视觉风格已确认 | 是 | — | | | 总对白字数 | 统计自剧本 | **字 | | | 计算段落数 | ceil(总对白字数/75) |** 段 | | | 单集剧情完整度 | 完整叙事弧线，有钩子 | — | | | 光影质感统一 | 所有提示词包含伦·怀斯曼硬光、蓝黑调等关键词 | — | | | 强制导演指令 | 每段提示词开头完整包含（含暗黑美学及轴线规则） | — | | | 字幕禁止令 | 每段提示词包含禁止字幕声明 | — | | | 比例统一 | 全部提示词指定9:16（或选定比例） | — | | | 人物不直视镜头 | 未出现正视图描述 | — | | | 不越轴 | 镜头描述中摄像机始终在同一侧，无越轴 | — | | | 连贯性上下文 | 每段衔接说明清晰 | — | | | 音效/BGM建议 | 每段标注 | — | | | 资产生图提示词 | 人物/场景/道具齐全且规范 | — | | | 人物生图强制深色背景 | 所有人物模板标注深色背景图（蓝黑/深灰） | — | | | 道具生图强制深色背景 | 所有道具模板标注深色背景图（蓝黑/深灰） | — | | | 对白逐字还原 | 提示词中对白与剧本完全一致，无增删改 | — | | | 整体情绪密度 | 每15秒至少一个由角色内心驱动的情绪波动点 | — | |\n\n输出格式：\n\n第0步：视觉风格确认 （风格A/B/C + 确认状态）\n\n一、题材定位 二、爆款元素速查 三、人物小传 四、10集分集大纲 五、第X集完整剧本（标注总对白字数） 六、AI生图资产 比例选择汇总 （列出所有资产及其推荐比例） 人物生图提示词 （每个角色一套完整的角色设定图提示词，使用对应风格模板，强制深色背景图） 场景生图提示词 （每个场景一套完整的场景提示词，使用对应风格模板） 关键道具生图提示词 （每个道具一套产品四视图提示词，使用对应风格模板，强制深色背景图） 七、导演阐述 八、Seedance 2.0 视频段落提示词（N段） （严格按照上述格式输出N段15秒视频生成提示词，每段开头强制包含导演指令、字幕禁令和轴线规则，对白逐字完整） 九、规范性自检\n\n总约束：\n\n- 全程中文，对白口语化。\n- 风格未确认前禁止进行任何创作步骤。\n- 所有画面描述必须融入伦·怀斯曼式力量感与孤独感视觉化，适配9:16竖屏，可直接用于Seedance 2.0生成。\n- 视频段落数量由对白字数动态决定，每15秒对白不超过75字，确保语速自然，对白过长自动增加段落。\n- 每个 Seedance 提示词必须强制包含：“你是一个爆款短剧的导演，采用伦·怀斯曼的黑暗美学风格。禁止使用正视图，采用侧视图35度或者45度侧拍，用硬光刀锋勾勒人物轮廓。每个镜头至多2.5秒，相邻景别之间不允许衔接，避免全景，95%的景别为中景、特写、近景，采用浅景深拍摄。禁止在画面中添加任何字幕、文字或图形符号。拍摄轴线必须保证不越轴，摄像机始终在人物同一侧拍摄，禁止跨越180度轴线。”\n- 严格禁止人物正面直视镜头，保持15-45°侧角描述，并用硬光勾勒轮廓。\n- 严格禁止跨越180度轴线，所有镜头摄像机需保持在人物关系轴线的同一侧，保证空间连贯性及光刀角度统一。\n- 画面中绝对不出现字幕、歌词、说明文字等任何文字信息，所有台词由表演和后期配音完成。\n- 所有对白必须保留完整，与剧本逐字一致，不得增删改任何字词。此为最高铁律，违反即视为不合格。\n- 人物生图提示词和道具生图提示词强制使用深色背景图，背景必须为纯净蓝黑色或深灰色，不得出现任何环境元素。\n- 暴力/亲密戏用黑暗诗意和材质隐喻镜头处理（如见血用墨滴入水，受辱用捏碎酒杯，决绝转身用皮衣在雨中划过）。\n- AI生图提示词严格遵循对应风格模板，必须包含强制后缀和暗黑美学画面关键词。\n- 拒绝平淡情感，冲突密度不足时主动提出“在永夜中身份碾压”“于孤独深处战力反转”“当众打脸后冷酷转身”等强化建议。\n- 始终以“观众会不会为下一集中角色在冷酷世界里的极致碾压与孤独感到战栗/酸楚”为最高检验标准。", "extras": [], "cn": "一键海外狼人吸血鬼短剧"}, {"slug": "wes-anderson-aesthetics", "desc": "深度还原韦氏标志性视听语言，适用15秒-5分钟电影短片或广告", "body": "## 一套韦氏底质 + 一句可选主色(阶段 1 提炼,全片统一)\n\n韦氏只有**一套渲染底质**(对称、平面、正面平打光、35mm 质感、真人写实),由场景种子锁死,保证全片一致。色板**不做固定预设**(种子已嵌入风格),而是**从剧本情绪提炼一句主色倾向**附到 MJ prompt;用户不指定就让种子原生色板说了算。\n\n- **底质子句(用于 MJ 场景图)**:`对称的故事书式电影画面,完美居中的正中单点透视构图,像剧场布景般平面化的舞台调度,真人实拍照片级写实,精细的美术置景,正面均匀柔和的平打光,克制精调的粉彩色板,细腻的 35mm 胶片质感,精准而工整`\n- **前置风格句(放 Seedance prompt 第一句)**:`对称的故事书式电影画面,完美居中的正中单点透视构图,平面化舞台调度,真人实拍照片级写实,正面均匀柔和的平打光,精调粉彩色板,细腻 35mm 胶片质感,精准工整的运镜。`\n\n**可选一句主色倾向(从剧本情绪提炼,接在底质子句后,非强制)**:\n\n- 暖糖喜剧:`色板偏暖——腮红粉、奶油色、黄油黄,点缀一抹正红`\n- 冷调忧郁:`色板偏冷——青绿、褪色藏青、粉蓝,配奶油白`\n- 秋日土系:`色板偏秋——芥末黄、赭石、暖棕、森林绿`\n- 复古褪色:`色板偏复古褪色——灰玫瑰、橄榄、棕褐、暗金`\n- 或按剧本另写一句,最多一个稍亮点缀色,其余压在协调色板里。\n\n---\n\n## 固定种子与出图规格(速查)\n\n- **四选一方位标注(仅限 MJ 出图)**:凡 **MJ 出的一组 4 张场景图(2×2 网格)**,在 agent 选项里必须**标明 1/2/3/4 对应方位**——**1(左上)、2(右上)、3(左下)、4(右下)**,例:`1(左上)`、`2(右上)`、`3(左下)`、`4(右下)`,方便用户准确指认。**Lib Image 出的角色造型图不按 2×2 网格、不标方位。**\n\n- **场景/影调图 = Midjourney V8.1**,固定种子 `--sref 4926062650 --profile rhc51rh`,**全景无人、零文字、对称、真人实拍写实**(人物后续在 Seedance 合成进画面)。\\\n  尾串:`… --sref 4926062650 --profile rhc51rh --ar <4:3|16:9|1:1|9:16> --v 8.1 --no 人物, 文字, 词语, 字母, 数字, 字幕条, 招牌文字, logo, 水印, 多余图案, 卡通, 插画, 微缩模型, 不对称`\n\n- **人物 + 造型三视图 = Lib Image**(强制,替代 MJ 出人):**所有角色一次性一起出**——每个角色一张 **16:9 横构图**(内含 **4 套正面全身造型**),全部角色出齐后一次性各四选一/确认;确认后**把各角色选定的造型图作为图像输入(编辑/图生图),用它直接当三视的正面、只补生侧/背**,全部角色的白底正 / 侧 / 背三视图一起出,**真人模特**;**只含正、侧、背三个全身视图,不出大头照/头部特写**;**绝不凭文字重新描述生三视**——脸与服装细节(发型发色、款式版型、领口袖口、扣子口袋、印花纹样、面料、鞋袜、配饰、每处颜色)逐项照选定图照搬,只换视角。\n\n  - **有原脸素材** → 三视用**白色圆形贴纸遮住脸部**,并在图**右下角加中文小字:「人脸单独提供 · 此图仅用于服装造型参考」**(身份由原脸在 Seedance 锁);**无原脸** → 保留所选造型像的脸(脸即身份,不遮)。\n  - 要点(以选定造型图为图像输入的编辑指令,非从头描述):`以选定的造型图作为图像输入,保持完全相同的人物与服装,原样复用为正面视图不做改动,仅生成同一模特的侧视与背视全身图;整张图只含正、侧、背三个全身视图,不要出现任何大头照/头部特写/脸部近景;每处细节与参考图 1:1 一致——相同的脸、发型与发色、服装剪裁与廓形、领口/袖口/下摆、扣子/拉链/口袋、印花与纹样、面料质感、鞋、袜、每一件配饰、每一处颜色;不得重画脸部,不得重新设计或增删任何服装细节;纯白无缝背景,均匀柔和的影棚光,照片级写实(仅当有原脸时:用一个白色圆形贴纸盖住脸部,并在画面右下角加中文小字「人脸单独提供 · 此图仅用于服装造型参考」)`\n  - 多角色逐个生,维护一份 **cast sheet**(姓名/身份/服装)。注:Lib Image 无 `--sref`,一致性靠详细角色卡 + 参考图 + “跨视图保持同一模特”。\n\n- **视频 = Seedance 2.0**,输入 = 场景图 + 相关角色白底三视图(锁造型/身形)+ **人脸参考**(有原脸→原脸图/视频;无原脸→所选造型像);多角色镜头喂多个角色参考。\n\n---\n\n## 流程(逐阶段暂停确认)\n\n### 阶段 0 · 开拍前三问(分次问,一次一个,答完再问下一个)\n\n1. **剧本 / 文本**(主驱动):\n\n   - **有剧本 / 文本** → 直接进阶段 1 解析成分镜与人物。\n   - **无剧本** → 先问用户「能不能用**一句话**说一个想法/概念?」。拿到这句话后,**据此草拟一版短剧本**(含人物、场景、关键叙事节拍、几句对白与旁白,贴合 15–30s 短片体量),交用户确认/修改 → 确认后再进阶段 1 解析。\n   - 用户连一句话也给不出时,再和其聊出一个小品概念后照上面草拟。\n\n   > 草拟剧本后暂停确认,再继续。\n\n2. **角色 + 造型**:① 有无人脸/角色参考(图或 &lt;15s 视频)?② 有无造型方向/造型参考图?按下面三 Case 分流。\n\n3. **口语语言**:人物/旁白默认说**剧本本身的语言**;如需另指定则记下。\n\n**三 Case(都先“理解造型方向 + 结合韦氏服装语言补写成完整文字 spec”,再生,不丢图照搬;之后统一:Lib Image 出正面全身造型 → 确认 → Lib Image 出白底三视图)**:\n\n- **Case 1 有造型参考图**:造型图作 Image Reference + 补写 spec,Lib Image 出造型/三视;无人脸则三视保留脸(脸=身份)。\n- **Case 2 有人脸、无造型图**:人脸图作 Image Reference + 补写 spec,Lib Image 出造型/三视;**原脸图带进 Seedance 锁脸;三视用白色圆形贴纸遮脸 + 右下角中文小字「人脸单独提供 · 此图仅用于服装造型参考」**。\n- **Case 3 都没有**:追问**性别(男/女)+ 人种(亚洲/欧美/其他)**,补写 spec,Lib Image 直接生造型/三视;**所选造型像的脸即身份(三视保留脸),并作 Seedance 人脸参考**。\n\n**韦氏服装语言(补写 spec 时对齐)**:`韦氏服装语言——复古中世纪/vintage 剪裁合身的服装,制服感的成套搭配,有个性的配饰(贝雷帽、及膝袜、字母花押、剪裁外套、圆框眼镜),年代考究的道具,精准对称的造型,配色统一在全片色板之内`;情绪档不改造型基线,只随剧本微调配色。\n\n### 阶段 1 · 剧本解析 + Final_Video_Spec\n\n**剧本解析(叙事主干,必出、需确认)**:\n\n- 叙事结构:是否章节式 / 是否有**旁白(narrator)** / 叙事节拍(15s 取 1–2 拍,30s 取 2–3 拍)。\n- **人物清单**:列出全部出场人物 + 各自身份/关系。\n- **场景清单**:逐场景空间。\n- **对白逐句**:标明说话人、原文(剧本语言)。**判断对白是否过长/繁琐**——上传剧本若台词冗长,**提炼精简为贴合 15/30s 的短促台词**(保留戏核与人物关系,删枝蔓),精简改动需向用户说明并确认。\n- **情绪基调**:逐场景/逐角色情绪走向(用于阶段 4 表演赋予)。\n- **一句主色倾向**:从基调提炼(见上)。\n\n**Final_Video_Spec(让用户定)**:**画幅**(默认 **4:3 Academy**,开放 16:9 / 1:1 / 9:16)/ **质量**(480p · 720p · 1080p)/ **时长**(**15 或 30s** 二选一)。时长定段数:15→1 段、30→2 段,每段 = 一条 15s。\n\n> 暂停确认(剧本解析结果 + spec)。\n\n### 阶段 2 · 角色设计(Lib Image)\n\n**一次性出齐所有角色**(不要一个角色出完确认再出下一个):对每个角色写角色卡,然后 Lib Image **把全部角色的造型图一起生出来**(每个角色一张 16:9 横构图、内含 4 套正面全身造型)→ **一次性暂停,让用户为每个角色各四选一** → **暂停确认(全部角色一起)** → 把各角色选定的造型图作为图像输入(编辑/图生图):选定正面图直接当三视正面、只补生侧/背,**全部角色的白底三视图一起出**(真人模特,**只含正/侧/背三个全身视图、不出大头照或头部特写**;有原脸→白色圆形贴纸遮脸 + 右下角中文小字「人脸单独提供 · 此图仅用于服装造型参考」、无原脸→保留脸),**脸与服装细节严格照选定图、绝不重画正脸或重设计衣服**;出图后**逐项核对脸与服装细节**(发型、款式版型、领口袖口、扣子口袋、印花、面料、鞋袜、配饰、颜色),任一处歪了就以选定图为输入重补该角色的侧/背,反复漂则该角色直接用「选定正面图 + 侧/背两张」拼三视 → **一次性再暂停确认(全部角色三视一起)**。维护 cast sheet。换装则再出“造型1/造型2”。\n\n### 阶段 3 · MJ 场景影调图(V8.1,种子 `--sref 4926062650 --profile rhc51rh`)\n\n按场景清单**把所有场景一起出**(不要一场出完确认再出下一场):每个场景各出 1 组 4 张对称全景空场景(空间类型 + 对称布局 + 重要物体 + 正中单点透视构图),**全景无人、零文字、真人实拍写实**,接底质子句 + 一句主色 + 场景种子尾串(见速查)。\\\n**全部场景图一次性出齐 → 一次性暂停,让用户为每个场景各四选一(选项须按** `1(左上)/2(右上)/3(左下)/4(右下)` **标注方位)→ 收齐所有场景的选择后才进阶段 4**,**严禁未经四选一就进阶段 4**。\n\n> 🛑 强制门:所有场景图出齐后一次性停下,等用户逐场四选一;没收齐全部场景的选择前不得进下一阶段。\n\n### 阶段 4 · 分镜脚本(生视频前必出、需确认)—— 重头戏\n\n**以表格逐段逐镜输出**,每段一张表、每镜一行,列如下:\n\n镜号画面(角色调度+表演+场景+对称构图)对白/旁白(标说话人·剧本语言)投递语气秒数运镜与上镜转场连戏要点镜1………\\~Xs锁定/横轨/急摇/猛推/俯拍平铺/定格慢走硬切/急摇/match cut站位·轴线·道具·色板·节拍\n\n字段说明:\n\n- **投递语气**按剧本情绪赋予,不默认 deadpan。\n- **秒数**每镜相加 = 15s;每段 **每 15s 镜数见下表**,标好急摇/硬切位置与定格慢走落点;转场基本不溶解。\n- **连戏要点**填:角色身份-服装-手持道具 / 银幕方向-180°轴线-角色 L-R 站位-布景地理 / 同一场景种子-主色-打光方向-时辰 / 当前节拍-情绪延续 /(30s 时)seg1 尾帧→seg2 头帧的动作衔接。\n\n> 暂停确认(造型图 + 三视图 + 场景图 + 分镜脚本表)。\n\n### 阶段 4b · 30s 尾帧续接(逐条生的关键机制)\n\n生完第 1 条 → 用 ffmpeg 抽**尾帧** → **解析尾帧**(角色站位/表情/光线/景别/进行中的动作)→ 按分镜声明的接缝模式生第 2 条:\n\n- **(A) 连续动作**:尾帧作 Seedance **起始帧**,第 2 条续上动作,无缝。\n- **(B) 干净硬切到新机位**:尾帧仅作连戏参考(角色/服装/色板/光线),第 2 条全新对称设置;装配处硬切/急摇/match cut 相接。\n\n> 大的对称硬切尽量放在两条接缝处(单条 15s 内部做差异巨大的对称硬切对模型偏难)。\n\n### 阶段 5 · Seedance 视频(每段一条 15s,一条一条生)\n\nprompt 结构(顺序):\n\n1. **前置风格句**(全片统一,见上)。\n2. **角色组装**:白底三视图锁造型/身形 + 人脸参考锁身份(有原脸→原脸图/视频;Case 3→所选造型像);多角色喂多个参考。写明“每个角色脸取自其人脸参考、造型取自其三视图,放进场景图,保留真实长相”。\n3. **分镜**:`镜1 … 切至/急摇至 镜2 …`,一条连续 15s、镜数达标;**转场以硬切/急摇/match cut 为主,基本不溶解**。每镜 = 景别(对称机位)+ 运动 + 表演(**按剧本情绪赋予**)。\n4. **口语层**:逐句对白(标说话人、**口型同步**、**台词文本用剧本语言,可中可英**)+ 旁白 VO + 投递语气。例(指令用中文,台词填剧本原文):`人物开口说出台词并精准对口型,旁白画外音;台词内容:「<剧本原文台词>」`。\n5. **运动**:`精准工整的运镜——锁定的对称定格、平稳的横向轨道滑轨、急摇转场、猛推猛拉变焦、俯拍平铺插入、偶尔的定格慢走`;一镜到底仅按需。\n6. **音频 + 文字规则**:对白/旁白随视频生,**音乐/SFX 不生(装配铺)**:`对白与旁白在视频内开口说出,无背景音乐,无音效(后期添加)`;**出场人数严格等于剧本人物数(红线 5)**;负面 `字幕, 字幕条, 多余人物, 背景群演, 人群, 额外的人, 画面文字, 招牌文字, logo, 水印, 多余图案, 卡通, 插画, 微缩模型, 不对称, 多余手指, 畸形的手`。\n\n**表演赋予(按剧本,不强制 deadpan)**:逐镜≥1 表情 + 1 动作,情绪强度按场景走(雀跃/焦虑/温柔/失落/克制皆可),只是包进韦氏工整外壳(对称、平稳调度)。\\\n**通用治僵硬(每镜都加)**:`轻微呼吸使胸口自然起伏,细微的头部移动,自然眨眼,表情随该镜情绪缓缓变化,放松自然的姿态,富有生气、有缓入缓出的自然动作`。\n\n> 一条一条生,逐条确认。\n\n### 阶段 5(实现备注) · 旁白兜底\n\n旁白默认随视频生(VO 层);若模型对“无对应嘴部的 VO 旁白”支持不稳,**退回装配 VO**(TTS/录音叠加),其余规则不变。\n\n### 阶段 6 · 装配\n\n1. **顺接**:两段 15s **硬切 / 急摇 / match cut 顺接**(韦氏不溶解);生成片段已含对白/旁白。\n2. **铺音**:统一**铺 BGM / SFX**(生成片段本就无 BGM/SFX)。\n3. **加字幕(**`add_subtitle`**)**:给**角色台词**加字幕——问用户**中文 / 英文 / 双语 / 不要**,按选择把台词原文/译文做成字幕轨叠加到画面(不烧进生成帧,作为可编辑叠加层);台词文案取自阶段 1/4 已记录的对白(旁白是否上字幕随用户)。字幕**只在此步加**,SD2 生视频阶段绝不出现(见红线 3)。\n4. **叠图**:logo / 标题 / credits PNG 可叠(绝不烧进生成画面)。\n5. 引导导出。\n\n---\n\n## 参考数据\n\n### 镜头词汇表(因“镜头关联”加重,单列)\n\n镜头用途Seedance 片段锁定对称肖像面无表情定场 / 对话正反打`锁定的居中肖像,人物正对镜头、绝对居中`横向轨道滑过剖面穿场/介绍空间`平稳的横向轨道滑轨,滑过剖面式布景`急摇 whip pan镜间/段间转场`快速急摇到下一个对称机位`猛推 / 猛拉强调/抽离`猛推变焦 / 猛拉变焦,突然而精准`俯拍平铺插入物件/手部细节`正上方俯拍,桌面物件平铺插入镜`定格慢走角色登场/收束`定格慢走,人物朝镜头 / 横穿镜头大步走来`\n\n### 节奏 → 每 15s 镜数(硬底线,转场以硬切/急摇为主)\n\n节奏镜数转场与手法静场定调(tableau)3–4锁定长镜 + 横轨;硬切;靠表演与精准构图撑住轻快叙事5–7急摇 + 猛推 + 快插交替;硬切/急摇为主混合4–6锁定长镜与快插交替;match cut 串联\n\n> 无论几镜,都在一条 15s 里一次性生成;基本不溶解,大硬切优先放 30s 接缝处。\n\n### 场景库(对称全景、无人、零文字、真人实拍写实)\n\n对称旅馆大堂/前台 · 火车包厢与车厢走廊 · 剖面式公寓/房间 · 修剪对称的庭院花园 · 复古杂货铺/店铺 · 校园长廊与教室 · 营地与帐篷 · 档案室/办公室 · 电梯与楼梯井 · 长桌餐厅与厨房。\n\n> 长片地点不够可重访同一地点(换光线/机位/时辰)。所有场景图均为对称全景空景,人物在 Seedance 合成进画面。\n\n### 注意\n\n- 不写真实导演具体作品名/真实演员姓名当 prompt,**复现美学不复现具体作品/某人**;韦氏感用描述性词(对称、单点透视、平面化、粉彩、故事书、定格慢走)承担,导演名仅作 MJ 轻量风格提示词。\n- 所有用到 MJ 的地方统一 **V8.1**;场景图固定种子 `--sref 4926062650 --profile rhc51rh`;人物/造型统一走 **Lib Image**。\n- 生成画面零文字;一切文字(字幕/标题/章节/credits/logo)只在装配叠,绝不烧进生成画面。\n- 用户只要片段/单镜、或已指定场景造型时,在不破坏 15s/时长档/镜数底线/对称写实/对白旁白随视频生/音乐 SFX 装配铺规则下按需做。", "extras": [], "cn": "韦斯安德森电影美学"}, {"slug": "wong-kar-wai-film-aesthetic", "desc": "深度还原王家卫经典视听语言，适用15秒-3分钟电影短片或广告", "body": "## 一套王氏底质 + 一句可选主色(阶段 1 提炼,全片统一)\n\n王氏只有**一套渲染底质**(框中框失衡、长焦浅景、钨丝霓虹、抽帧拖影、35mm 颗粒、真人写实),由场景种子锁死,保证全片一致。色板**不做固定预设**(种子已嵌入风格),而是**从剧本情绪提炼一句主色倾向**附到 MJ prompt;用户不指定就让种子原生色板说了算。\n\n- **底质子句(用于 MJ 场景图)**:`浓郁饱和的电影感画面,透过前景门框/窗格/帘幕/玻璃拍摄的框中框构图,失衡偏置构图并留出大量负空间,长焦压缩或轻微广角畸变,浅景深,真人实拍照片级写实,暖调钨丝灯与霓虹光,浓郁饱和色调,细腻的 35mm 胶片颗粒,弥漫的雾气与烟,轻微暗角,怀旧惆怅的迷离氛围`\n- **前置风格句(放 Seedance prompt 第一句)**:`浓郁饱和的电影感画面,透过前景元素拍摄的框中框构图,失衡偏置构图,长焦压缩,浅景深,真人实拍照片级写实,暖调钨丝灯与霓虹光,浓郁饱和色调,细腻 35mm 胶片颗粒,弥漫雾气,抽帧拖影慢动作,手持相机自然轻微晃动与呼吸感、镜头细微漂移非绝对锁定,怀旧惆怅的迷离氛围。`\n\n**可选一句主色倾向(从剧本情绪提炼,接在底质子句后,非强制)**:\n\n- 暧昧暖红:`色调偏暖红——深红、琥珀、金,暖调暗部,配一处霓虹点缀`\n- 霓虹冷调:`色调偏霓虹——青、青蓝、品红,雨夜黑底泛霓虹光`\n- 翠绿暖金:`色调偏翠绿——玉绿、祖母绿、暖金灯光、深色木质`\n- 怀旧褪暖:`色调偏怀旧褪色——暖褐、旧赭、灰青、暖颗粒`\n- 或按剧本另写一句,最多一个稍亮霓虹点缀色,其余压在浓饱和暖调里。\n\n---\n\n## 固定种子与出图规格(速查)\n\n- **场景/影调图 = Midjourney V8.1**(**默认画质「自适应」**),固定种子 `--sref 7054326907 --profile raz4xnf`,**全景无人、零文字、框中框失衡、真人实拍写实**(人物后续在 Seedance 合成进画面)。\\\n  尾串:`… --sref 7054326907 --profile raz4xnf --ar <16:9|4:3|1:1|9:16> --v 8.1 --no 人物, 文字, 字词, 字母, 数字, 字幕, 招牌, 标志, 水印, 卡通, 插画, 微缩模型, 平面对称构图, 粉彩, 明亮均匀平光, 香烟, 吸烟, 烟雾缭绕, 打火机`\n\n  > **MJ prompt 长度硬上限:整条 prompt(描述句 + 尾串 + 负面词)总字符数 ≤ 1024**。超了**只精简前面的描述句**(合并近义词、删次要细节),**绝不删改种子 /** `--profile` **/** `--ar` **/** `--v` **/ 关键负面词**。\n\n- **人物 + 造型三视图 = Lib Image**(**强制:人物/造型的一切图像一律用 Lib Image 生成,绝不用 MJ 或任何其他工具出人;MJ 只出无人场景图**;**默认「标准画质」**):**所有角色一次性一起出**——每个角色一张 **16:9 横构图**(内含 **4 套正面全身造型**;**背景必须是干净纯白底、人物必须是全身**;**4 套必须是 4 个明显不同的造型方案——服装(整套款式 / 廓形 / 单品搭配都要换,绝不是同一套只换颜色或花纹)、发型、发色、妆容、配饰细节**都要彼此**拉开明显区别**,让用户在 4 个真正不同的方向里挑;4 套都在 90–00s 港风范围内、都是同一角色的备选造型),全部角色出齐后**一次性各四选一/确认**;确认后**把各角色选定的造型图作为图像输入(编辑/图生图),用它直接当中间(正面)视图、只补生左/右**,全部角色的白底三视图一起出,**真人模特**;**绝不凭文字重新描述生三视**——脸与服装细节(发型发色、款式版型、领口袖口、扣子口袋、印花纹样、面料、鞋袜、配饰、每处颜色)逐项照选定图照搬,只换视角。\n\n  - **四选一造型图渲染档(治油 + 电影感,仅用于四选一 look-dev,必叠)**:出 4 套正面造型时,除服装 spec 外必须叠这三组词——\n\n    - 皮肤(反油):`哑光真实皮肤,可见毛孔与自然纹理,无修图,无塑料光泽,无油亮高光,无美颜滤镜,皮肤上带细微胶片颗粒`\n    - 影调(电影感):`电影剧照质感,35mm 电影胶片拍摄,变形宽银幕镜头特性,高光轻微光晕,胶片式对比,低饱和的年代化调色,柔和的方向性布光`\n    - 选角(反偶像脸):`真实的电影演员脸——有个性、有生活感,不是当代偶像/网红/韩系医美脸,自然眉形,无玻璃肌水光滤镜,无浓重现代妆,无商业假笑,克制惆怅的气质`\n\n    > **背景与景别**:四选一造型图是**干净纯白底、全身**的棚拍造型图(`纯白无缝背景,全身入镜`);上面的\"电影胶片调\"只作用于**皮肤质感 / 镜头特性 / 调色**,**不往画面里加任何环境或场景**——白底不变。\\\n    > 三视图沿用 i2i 从选定图**继承**皮肤与脸,**不另叠电影胶片调**(保持白底 photographic、只锁几何);电影质感一次性在四选一定好,往下自然带到三视与 Seedance。\n\n  - **三视图排版(强约束,必须遵守)**:**所有内容必须在同一张图片里完成**(不得分多图)。**只出全身的左 / 中 / 右三视图**(中 = 正面 = 选定造型图、左 = 左侧全身、右 = 右侧全身),三张全身并排;**不要出现大头 / 头部特写**。布局整齐、人物等高对齐、白底无杂物。\n\n  - **有原脸素材** → 三视**用纯白色圆形贴纸完全遮住脸 + 右下角中文小字「人脸单独提供 · 此图仅用于服装造型参考」**(身份由原脸在 Seedance 锁;三视是幕后工具图、不入片,此标注文字不违反零文字红线);**无原脸** → 三视保留脸(脸即身份)。\n\n  - 要点(以选定造型图为图像输入的编辑指令,非从头描述):`以选定的参考图作为图像输入,保持完全相同的人物与服装,把它原样用作中间(正面)视图,只额外生成同一模特的左侧与右侧全身视图;输出一张图,内含一排三张全身镜头(左/中/右),不要出现头部特写或大头;人物等高对齐;从参考图 1:1 复刻每个细节——相同的脸、发型与发色、服装剪裁与廓形、领口/袖口/下摆、扣子/拉链/口袋、印花与纹样、面料质感、鞋、袜、每个配饰、每一处颜色;不要重画脸,不要重新设计或增删任何服装细节;纯白无缝背景,均匀柔和的棚光,照片级写实(**仅当有原脸时:用一个纯白色不透明圆形贴纸完全盖住每个视图的脸部区域,并在整张图右下角加一行中文小字「人脸单独提供 · 此图仅用于服装造型参考」**;无原脸时正常保留脸)`\n\n  - 多角色一次性一起生,维护一份 **cast sheet**(姓名/身份/服装/在色板中的角色色)。注:Lib Image 无 `--sref`,一致性靠详细角色卡 + 参考图 + “跨视图同一模特”。\n\n- **视频 = Seedance 2.0**,输入 = **该段分镜牵涉到的所有地点的场景图**(一段 15s 若跨多个地点,就喂多张场景图;只发生在一个地点则一张)+ 每个角色的**同一张三视图**(**人像参考 + 服装造型参考都用它**,既锁脸又锁造型/身形;**不再喂四选一造型选择图**)+(有原脸时)原脸图/视频作**身份锚点**;多角色镜头喂多个角色各自的三视图。\n\n---\n\n## 流程(逐阶段暂停确认)\n\n### 阶段 0 · 开拍前问询卡(一张卡连续问完,统一一次性记录,**不要一问一停**)\n\n**把下面 7 个确认维度合并成一张问询卡,连续抛给用户、一次性收齐答案后统一记录**(不逐条停顿等待):\n\n1. **剧本 / 文本**(主驱动):有完整剧本/文本?还是给一句话想法(由我据此草拟)?还是完全没有(一起聊出一个概念)?\n2. **角色 + 造型**:① 有无人脸/角色参考(图或 &lt;15s 视频)?② 有无造型方向/造型参考图?(**造型默认锁 90–00s 港风,不问年代**)\n3. **口语语言**:内心独白/对白说什么语言?(默认剧本本身的语言;粤语见阶段 6 字幕特例)\n4. **字幕**:要不要字幕?要的话**语种选:简体中文 / 繁体中文 / 英文 / 双语**(在此一次性确认,阶段 6 直接按此加,不再问;**粤语口白时字幕按此简/繁出普通话书面版**,见阶段 6)。\n5. **分辨率**:**480p / 720p / 1080p** 三选一。\n6. **画幅**:**16:9(推荐)/ 4:3 / 1:1 / 9:16** 选一(**必须让用户选,不得默默套 16:9**)。\n7. **时长**:**15s / 30s / 45s / 60s** 四选一(定段数:15→1 段、30→2 段、45→3 段、60→4 段,每段 = 一条 15s Seedance)。\n\n> 7 项一次性收齐并记进 Final_Video_Spec + cast 备注。**之后**才按剧本情况走:有剧本→进阶段 1;给了一句话/概念→**据此草拟一版短剧本**(含人物、场景、关键叙事节拍、几句内心独白与稀疏对白,贴合所选时长,情绪走迷离/惆怅;可掺入王家卫经典道具作引子,见下)→交用户确认/修改→确认后进阶段 1。角色按下面三 Case 分流。\\\n****故事点子的道具引子(草拟剧本/给点子时可用)**:掺入王家卫经典电影式的道具作钩子——如**过期凤梨罐头**、**手表 / 时钟 / 倒计时**、**电话亭 / 传呼机**、**便利店 / 快餐店**、**雨与雨衣**、**日期 / 数字(如\"1966\"\"2046\")**、**旗袍**、**墨镜**、**旧船票 / 罐头标签**等;**注意画面禁烟,不用香烟类道具**。\n\n**三 Case(都先“理解造型方向 + 结合王氏港风服装语言补写成完整文字 spec”,再生,不丢图照搬;之后统一:Lib Image 出正面全身造型 → 确认 → Lib Image 出白底三视图)**:\n\n- **Case 1 有造型参考图**:造型图作图像参考 + 补写 spec,Lib Image 出造型/三视;无人脸则三视保留脸(脸=身份)。\n- **Case 2 有人脸、无造型图**:人脸图作图像参考 + 补写 spec,Lib Image 出造型/三视;**原脸图带进 Seedance 锁脸,三视用白色圆贴纸遮脸 + 右下角中文小字「人脸单独提供 · 此图仅用于服装造型参考」**。\n- **Case 3 都没有**:追问**性别(男/女)+ 人种(亚洲/欧美/其他)**(年代已锁 90–00s 港风),补写 spec,Lib Image 直接生造型/三视;**三视保留脸(脸即身份),该三视图即作 Seedance 的人像 + 服装造型参考**。\n\n**王家卫式港风服装语言(补写 spec 时对齐,默认锁定 1990–2000 年代香港都市港风,按性别分,男不复用女款)**:\n\n- **女**:`修身吊带缎面连衣裙/垫肩西装外套/高腰直筒牛仔裤/皮夹克/针织背心/格纹/丝质衬衫;颈带(choker)、小片染色墨镜、金色圈耳环、发夹;蓬松大波浪或中分直发,90 年代细高挑眉形,哑光正红或棕玫瑰唇,极简的现代修容`\n- **男**:`港式男主角气质——超大廓形剪裁西装/皮夹克/敞开衬衫内搭白色罗纹背心/打褶长裤,中分帘幕发或背头,染色墨镜,复古腕表;清瘦从容的廓形`(**画面禁烟,不带香烟**)\n- **共通**:`真丝/皮革/牛仔的真实质感并略带穿着痕迹,版型与比例符合年代;不要当代极简风、不要运动休闲风、不要崭新的戏服店感;色彩在影片色板内保持浓郁饱和`\n\n情绪档不改造型基线,只随剧本微调配色。\n\n### 阶段 1 · 剧本解析 + Final_Video_Spec\n\n**剧本解析(叙事主干,必出、需确认)**:\n\n- 叙事结构:是否章节式 / **内心独白(第一人称 VO)走向** / 叙事节拍(15s 取 1–2 拍,30s 取 2–3 拍,45s 取 3–4 拍,60s 取 4–5 拍)。\n- **人物清单**:列出全部出场人物 + 各自身份/关系。\n- **场景清单**:逐场景空间。\n- **内心独白逐句**:标明独白者、原文(剧本语言)——王氏的灵魂,优先成稿。\n- **对白逐句**:标明说话人、原文。**判断对白是否过长**——王氏对白本就短稀,上传剧本若台词冗长,**提炼精简为短促克制的几句**(保留戏核与人物关系,删枝蔓,余意交给独白),精简改动需向用户说明并确认。\n- **情绪基调**:默认迷离/惆怅基线,逐场景/逐角色情绪走向(用于阶段 4 表演赋予)。\n- **一句主色倾向**:从基调提炼(见上)。\n\n**Final_Video_Spec(让用户定)**:**画幅**(**已在阶段 0 第 6 问向用户确认**,16:9 / 4:3 / 1:1 / 9:16)/ **分辨率**(480p · 720p · 1080p,**已在阶段 0 第 5 问确认**)/ **时长**(**15 / 30 / 45 / 60s**,**已在阶段 0 第 7 问确认**)。时长定段数:**15→1 段、30→2 段、45→3 段、60→4 段**,每段 = 一条 15s。\n\n> 暂停确认(剧本解析结果 + spec)。\n\n### 阶段 2 · 角色设计(Lib Image,默认「标准画质」)\n\n> **工具锁(强制)**:本阶段一切人物图——四选一造型图与白底三视图——**必须用 Lib Image 生成,绝不用 MJ 或其他工具出人**。\n\n**一次性出齐所有角色**(不要一个角色出完确认再出下一个):对每个角色写角色卡,然后 Lib Image **把全部角色的造型图一起生出来**(每个角色一张 16:9 横构图、内含 4 套正面全身造型;**背景必须干净纯白底、人物必须全身**;**4 套必须是 4 个明显不同的造型——整套服装搭配、发型、发色、妆容、配饰细节都要彼此拉开明显区别**,同属 90–00s 港风、同一角色的不同备选造型);**出四选一时必叠「四选一造型图渲染档」三组词(反油皮肤 + 电影胶片调 + 反偶像脸,见速查),否则人物会油、像电视剧、没电影感** → **一次性暂停,让用户为每个角色各四选一** → **暂停确认(全部角色一起)** → 把各角色选定的造型图作为图像输入(编辑/图生图):选定图直接当中间(正面)视图、只补生左/右,**全部角色的白底三视图一起出**(真人模特;有原脸→白色圆贴纸遮脸 + 右下角中文小字「人脸单独提供 · 此图仅用于服装造型参考」、无原脸→保留脸)。**排版强约束:每张全部在同一张图里完成——只出全身的左 / 中 / 右三视并排,不要出现大头 / 头部特写,人物等高对齐、白底无杂物**。**脸与服装细节严格照选定图、绝不重画正脸或重设计衣服**;出图后**逐项核对脸与服装细节**(发型、款式版型、领口袖口、扣子口袋、印花、面料、鞋袜、配饰、颜色),任一处歪了就以选定图为输入重补该角色的左/右,反复漂则该角色直接用「选定正面图 + 左/右两张」拼三视 → **一次性再暂停确认(全部角色三视一起)**。维护 cast sheet。换装则再出“造型1/造型2”。\n\n> **⚠️ 反面示例(禁止)**:四套只有西装颜色/花纹在变、其余(如白背心 + oversize 西装 + 打褶裤 + 乐福鞋 + 墨镜 + 同一发型)完全一样——这是错误的。**必须是四套不同的整体搭配 + 四种不同发型/妆容**,例如:①正装西装 + 背头 ②皮夹克 + 乱发 ③衬衫敞怀 + 中分帘幕发 ④针织/休闲街头 + 另一种发型,四个方向差异一眼可辨。\n\n### 阶段 3 · MJ 场景影调图(V8.1,自适应画质,种子 `--sref 7054326907 --profile raz4xnf`)\n\n按场景清单**把所有场景一起出**(不要一场出完确认再出下一场):每个场景各出 1 组 4 张**框中框失衡全景空场景**(空间类型 + 前景遮挡框架 + 失衡偏置构图 + 重要物体 + 长焦/广角与浅景深氛围),**全景无人、零文字、真人实拍写实**,接底质子句 + 一句主色 + 场景种子尾串(见速查);**每条 prompt ≤ 1024 字符,超了只精简描述句、不动种子/尾串/关键负面词**。\n\n- **场景图 = 按「地点」出大全景,一个地点一张**:每张必须是该地点的**大场景/整体全景**(如\"房间\"就出整间房的全景、\"地铁\"就出地铁车厢内部全景);**绝不为特写 / 局部 / 机位变化单独出场景图**(如窗前特写、桌面局部、某个角落),这些交给 Seedance 在同一张全景基础上取景。\n- **同一地点只出一张场景图,跨镜/跨段复用**:哪怕多段视频、多镜都发生在同一地点(同一个房间 / 同一节地铁),**只需要这一个地点的一张全景图**,不再重复出。\n- **场景图张数 = 剧本里不同「地点」的数量**(去重后),不是镜数、也不是段数。\\\n  **全部场景图一次性出齐 → 一次性暂停,让用户为每个地点各四选一 → 收齐所有地点的选择后才进阶段 4**,**严禁未经四选一就进阶段 4**。\n- **四选一呈现格式(强制)**:MJ 出的 4 张是 2×2 网格,给用户列选项时必须标明**序号 + 对应位置**——**1(左上)、2(右上)、3(左下)、4(右下)**,例如按\"1(左上)/ 2(右上)/ 3(左下)/ 4(右下)\"逐张说明,用户按位置报选择。\n\n> 🛑 强制门:所有场景图出齐后一次性停下,等用户逐地点四选一;没收齐全部地点的选择前不得进下一阶段。\n\n### 阶段 4 · 分镜表格(生视频前必出、需确认)—— 重头戏\n\n**一次性出全部分镜表格**(按段数:15/30/45/60s = 1/2/3/4 张,全部一起出,不要一段一停),每段一张表、一行 = 一个镜头,列如下:\n\n镜号时长画面(调度/表演/构图)内心独白 + 对白(原文 + 语气)运动转场(与上镜)1\\~Xs角色调度 + 表演 + 场景 + 框中框/失衡构图要点 + 前景遮挡元素 + 焦点游移落点独白者/说话人 + 台词原文(剧本语言)+ 投递语气(按剧本情绪,默认迷离/惆怅,不机械朗读)抽帧拖影 / 慢快门拖影 / 手持呼吸 / 长焦压缩 / 焦点游移 / 框中框定镜 / 镜面反射 / 加速光流车流拖影 / 失衡定镜留白抽帧拖影 smear / 跳切 / 硬切(**禁叠化**)2………………\n\n表格下方另附**该段的连戏 bible 字段**(不进表、单列):角色身份-服装-手持道具 / 银幕方向-180°轴线-角色 L-R 站位-布景地理 / 同一场景种子-主色-钨丝霓虹光向-时辰 / 当前节拍-情绪延续 /(多段时)每段尾帧→下一段头帧的动作衔接。\n\n每段 **每 15s 镜数见下表(每 15s ≥ 4 镜,硬底线)**,标好拖影/跳切/硬切位置。\n\n**记录口语原文**:把每镜的内心独白 + 稀疏对白的**原文(剧本语言)逐句记进分镜**,供阶段 6\"合成前一步\"的 `add_subtitle` 做字幕(语种已在阶段 0 确认;生成阶段不出任何字幕,见红线 ③)。**若口语是粤语**:除粤语原文外,**另记一份普通话书面语的中文译文(简/繁按阶段 0 所选)**,字幕用这份译文而非粤语逐字转写。\n\n> **暂停确认(一次性)**:全部分镜表格出齐后停下,连同造型图 + 三视图 + 场景图一起、**一次性**待用户确认。\\\n****⚠️ 分镜表格与视频的节奏不同**:分镜表格**一次性全出、只停一次确认**;而**视频(阶段 5)相反——逐段生成,生一段停一段、确认一段再生下一段**(见阶段 4b / 阶段 5)。\n\n### 阶段 4b · 多段尾帧续接(30/45/60s 的关键机制,逐条生)\n\n**逐条链式续接**:每生完一条(seg_n)→ **先停下等用户确认**;收到确认后 → 用 ffmpeg 抽该条**尾帧** → **解析尾帧**(角色站位/表情/光线/景别/进行中的动作)→ 按分镜声明的接缝模式生下一条(seg_n+1);如此 seg1→seg2→…→segN 逐条推进(30s 到 seg2、45s 到 seg3、60s 到 seg4)。每条的接缝:\n\n- **(A) 连续动作**:上一条尾帧作 Seedance **起始帧**,下一条续上动作,无缝。\n- **(B) 干净换场到新机位**:尾帧仅作连戏参考(角色/服装/色板/光线),下一条全新失衡框中框设置;装配处以抽帧拖影 / 跳切 / 硬切相接。\n\n> 大的换场尽量放在段间接缝处(单条 15s 内部做差异巨大的转场对模型偏难);**接缝也不叠化,一律用硬切 / 跳切 / 抽帧拖影**。\n\n### 阶段 5 · Seedance 视频(每段一条 15s,一条一条生)\n\nprompt 结构(顺序):\n\n1. **前置风格句**(全片统一,见上)。\n2. **场景图 + 角色组装**:先喂**该段分镜牵涉到的所有地点的场景图**(跨多个地点就喂多张、只在一个地点就一张;同一地点的不同镜/机位共用同一张全景);再喂每个角色**其同一张三视图**(**人像 + 服装造型都参考它**,既锁脸又锁造型/身形);**不再引用四选一造型选择图**;有原脸时原脸图/视频**另作身份锚点**(三视脸已用白色圆贴纸遮住),Case 3 用三视本身的脸;多角色喂多个角色各自的三视图。写明“每个角色的脸与造型都取自其三视图,放进对应地点的场景图,保留真实长相”。\n3. **分镜**:`镜1 …(抽帧拖影切至/跳切至/硬切至)… 镜2 …`,一条连续 15s、镜数达标;**转场以抽帧拖影 / 跳切 / 硬切为主,禁用叠化 dissolve**。每镜 = 景别(框中框/失衡机位)+ 运动 + 表演(**按剧本情绪赋予**)。\n4. **口语层**:逐句**内心独白(VO,第一人称,无对应嘴部)为主** + 稀疏对白(标说话人、**口型同步**)+ 投递语气;**指令用中文、独白与对白的台词内容填剧本原文(可中可英),画面不出任何字幕**。例(指令中文、台词填原文):`第一人称内心独白画外音;人物开口说出台词并精准对口型;独白内容:「<剧本原文独白>」;对白内容:「<剧本原文对白>」`。\n5. **运动**:`抽帧拖影慢动作并带残影拖尾,慢快门长曝光运动模糊与光痕拖尾,手持相机自然轻微晃动与呼吸感、镜头细微漂移非绝对锁定,长焦压缩,浅景深焦点游移,透过前景遮挡拍摄,失衡偏置构图,同一主体的镜中倒影,背景有飞速流动的灯光/车流光痕,偶尔近乎定镜的惆怅空镜(仍带手持微晃)`;**尽量避免完全锁死机位的大景别呆板静止镜头**;一镜到底仅按需。\n6. **音频 + 文字规则**:**独白/对白 + 环境音效随视频生,一切音乐禁生(BGM 到合成前那步铺)**:`内心独白与对白在视频内发声,允许贴合画面的环境音效,无背景音乐、无任何音乐、无配乐、无歌曲、无乐器声(BGM 后期加)`;**画面零文字(含字幕),字幕在合成前那步加(红线 3)**;**出场人数严格等于剧本人物数、不加人潮、不分身(红线 5)**;负面 `背景音乐, BGM, 配乐, 音乐, 歌曲, 唱歌, 哼唱, 乐器声, 旋律, 香烟, 吸烟, 抽烟, 烟雾缭绕, 打火机, 字幕, 字幕条, 画面文字, 招牌文字, 标志, 水印, 额外人物, 背景群演, 人群, 多余的人, 分身, 克隆人, 双胞胎, 同一个人重复出现, 卡通, 插画, 微缩模型, 平面对称构图, 粉彩, 明亮均匀平光, 多余手指, 畸形的手`。\n\n**表演赋予(按剧本,迷离/惆怅基线)**:逐镜≥1 表情 + 1 动作,情绪强度按场景走(longing/躁动不安/温柔/失落/克制皆可),包进王氏氛围外壳(框中框、失衡、长焦浅景、拖影)。\\\n**通用治僵硬(每镜都加)**:`手持相机自然轻微晃动与呼吸感、镜头细微漂移非绝对锁定,轻微呼吸使胸口自然起伏,细微的头部移动,自然眨眼,表情随场景情绪缓慢变化,放松自然的体态,动作有自然的起伏缓入缓出,衣料、发丝或环境雾气轻微飘动`。\n\n> **分段生成 + 强制确认门**:一段一段生;**每段视频生完后必须停下、等用户确认,收到确认后才生下一段**(30/45/60s 的后续每段都同理),严禁未经确认就接着生下一段。\n\n### 阶段 5(实现备注) · 内心独白兜底\n\n内心独白默认随视频生(VO 层);王氏 VO 是核心,若模型对“无对应嘴部的 VO 独白”支持不稳,**退回装配 VO**(TTS/录音叠加),其余规则不变——务必保住独白这条命脉。\n\n### 阶段 6 · 装配\n\n1. **顺接**:各段 15s(1/2/3/4 条)**以抽帧拖影 smear / 跳切 / 硬切拼到一条时间线(不叠化)**;生成片段已含独白/对白/环境音效(**无 BGM、无任何音乐**)。\n2. **合成前一步(加字幕 + 王家卫风 BGM,在最终合成之前完成)**:\n   - **加字幕(**`add_subtitle`**)**:**按阶段 0 问询卡已确认的字幕语种(简体/繁体/英文/双语/不要)直接加,不再重复问**;把台词原文/译文做成**可编辑字幕轨叠加**到画面(不烧进生成帧);台词文案取自阶段 1/4 已记录的口语原文。字幕**只在此步加**,Seedance 生视频阶段绝不出现(红线 3)。\n     - **粤语特例**:若口语选的是**粤语**,字幕不做粤语口语逐字转写,而是**翻译成普通话书面语的中文**,按阶段 0 已选的**简体 / 繁体**出对应版本。\n   - **铺王家卫风 BGM**:按剧本情绪选**一段王家卫式氛围配乐**——慵懒、怀旧、缓慢惆怅,弦乐 / 爵士 / 拉丁或华尔兹式的迷离氛围;**只描述风格、不指定具体版权曲目或艺人**;垫在旁白与音效之下,音量让人声清晰。环境音效已随视频生成,如缺可在此补 SFX。\n   - **叠图**:王氏式日期 / 时间戳 / 片名 / chapter / credits / logo PNG 可叠(绝不烧进生成画面)。\n3. **合成 + 导出**:把字幕、BGM、音效、叠图与画面**压平合成**为成片,引导导出。\n\n---\n\n## 参考数据\n\n### 镜头词汇表(因“镜头关联 + 王氏修辞”加重,单列)\n\n镜头用途Seedance 片段抽帧拖影慢动作 step-print头号招牌 / 情绪节拍`抽帧拖影慢动作,残影拖尾,主体在抽帧卡顿中拖影移动`慢快门拖影 slow shutter光痕流动 / 迷离动感(与抽帧叠用)`慢快门长曝光,运动物体与灯光拖出连续模糊光痕,画面带流动拖尾`框中框遮挡穿门窗/隔栅介绍空间`透过门框/窗格/帘幕拍摄,厚重的前景遮挡`手持长焦肖像亲密贴近 / 对话`手持长焦特写,浅焦,轻微呼吸感镜头`焦点游移 rack focus转移注意 / 情绪揭示`焦点在前景物体与主体之间游移拉焦`镜面反射孤独 / 内省(同一主体倒影)`透过镜子构图,同一主体的镜中倒影,绝不出现第二个人`加速光流/车流拖影都市躁动 / 静中之动`主体静止,背景灯光与车流以飞速抽帧拖影掠过(无路人)`近定镜留白(带手持微晃)求而不得 / 收束`近乎定镜但带手持相机自然微晃、镜头细微漂移非死锁,主体推向画面边缘,大面积负空间`\n\n### 节奏 → 每 15s 镜数(硬底线,转场以拖影/跳切/硬切为主,禁叠化)\n\n节奏镜数转场与手法迷离静场(longing tableau)4(下限)拖影长镜 + 近定镜(带手持微晃,非死锁);smear / 硬切;靠氛围与情绪撑住都市躁动(restless urban)5–7手持 + 跳切 + 加速光流车流拖影交替混合4–5拖影长镜与快插交替;焦点游移/硬切串联\n\n> **每 15s 不得少于 4 个镜头(硬底线,再慢的节奏也不例外;唯一例外是用户明确点名某段一镜到底)**;无论几镜,都在一条 15s 里一次性生成;转场以拖影/跳切/硬切为主(**禁叠化**),大换场优先放段间接缝处。\n\n### 场景库(框中框失衡全景、无人、零文字、真人实拍写实)\n\n逼仄旅馆走廊与房间 · 霓虹街巷与雨夜路口 · 通宵面摊/快餐店/茶餐厅 · 旗袍年代逼仄公寓与楼梯间 · 玻璃幕与镜面遍布的酒吧/舞厅 · 火车站台与车厢 · 时钟/挂钟特写空间 · 电话亭与狭长走廊 · 雨中天台 · 老电梯与窄楼道。\n\n> 长片地点不够可重访同一地点(换光线/机位/时辰)。所有场景图均为框中框失衡全景空景(前景遮挡 + 主体偏置 + 浅景深氛围),人物在 Seedance 合成进画面。\n\n### 注意\n\n- 不写真实导演具体作品名/真实演员姓名当 prompt,**复现美学不复现具体作品/某人**;王氏感用描述性词(框中框、失衡偏置、长焦浅景、浓饱和钨丝霓虹、抽帧拖影 step-print、焦点游移、迷离怀旧)承担,导演名仅作 MJ 轻量风格提示词。\n- 所有用到 MJ 的地方统一 **V8.1、画质默认「自适应」**;场景图固定种子 `--sref 7054326907 --profile raz4xnf`;**MJ 整条 prompt ≤ 1024 字符**(超限只精简描述句,种子/`--profile`/`--ar`/`--v`/关键负面词不动)。**工具分工硬锁:MJ 只出无人场景/影调图,绝不出人;人物/造型的一切图像(四选一 + 三视图)一律走 Lib Image、画质默认「标准画质」,绝不用 MJ 出人。**\n- **三视图排版固定**:同一张图内**只出全身左/中/右**三视(中=选定正面图),**不出大头/头部特写**;等高对齐、白底无杂物。\n- **四选一造型图必叠渲染档(治油/电影感)**:反油皮肤(哑光、可见毛孔、无塑料光泽/油亮高光/美颜滤镜)+ 电影胶片调(电影剧照、35mm、变形宽银幕、光晕、年代化低饱和调色)+ 反偶像脸(电影演员脸,非偶像/网红/医美脸,无玻璃肌、无商业假笑);电影质感只在四选一定好,三视与 Seedance 靠 i2i/人脸参考继承,三视本身保持白底照片级写实、不另叠胶片调。\n- **生成画面零文字(含字幕)**:字幕在阶段 6\"合成前一步\"用 `add_subtitle` 叠加(可编辑层);其余文字(日期/时间戳/片名/章节/credits/logo)也只在装配叠,绝不烧进生成帧。\n- **音频政策(强制)**:SD2 生视频**只允许\"人声(内心独白 + 对白)+ 环境音效\",绝不允许任何背景音乐 / BGM / 配乐 / 歌曲 / 乐器声 / 旋律**;负面词须含 `背景音乐, BGM, 配乐, 音乐, 歌曲, 乐器声, 旋律`。**王家卫风 BGM 与字幕都在\"合成前一步\"才加**,再最终合成导出。\n- 人数严格等于剧本人物数:不加人潮(躁动感用光流/车流拖影),不让角色在同一画面分身/克隆;镜面反射只用同一主体的倒影且靠负面词挡分身。\n- **提示词一律中文**:MJ / Lib Image / Seedance 的所有指令/描述/负面词都用中文;只有参数 flag(`--sref`/`--profile`/`--ar`/`--v`/`--no`/`--sw`)、工具名、数值单位保留原样。**例外:真正念出来的独白/对白台词保留剧本原文语言(可中可英),不翻中文。**\n- **画面禁烟(强制)**:任何画面(MJ 场景图、Lib Image 造型/三视、Seedance 视频)都**不得出现香烟、吸烟动作、烟雾缭绕、打火机、烟灰缸**;造型与道具一律不含香烟,负面词须含 `香烟, 吸烟, 打火机`(环境雾气/水汽不受此限)。\n- **画面之间禁用叠化(强制)**:镜与镜、段与段一律用抽帧拖影 / 跳切 / 硬切衔接,**绝不做叠化 / dissolve / 交叉溶解 / fade 溶解过渡**;Seedance 分镜与装配顺接都遵守。\n- **手持晃动、避免呆板定机位**:每 15s ≥ 4 镜;镜头普遍带**手持相机自然轻微晃动 / 呼吸感、镜头细微漂移(非绝对锁定)**,**尽量避免完全锁死机位的大景别静止空镜**(会很呆板),即便留白/空镜也带手持微晃。\n- 用户只要片段/单镜、或已指定场景造型时,在不破坏 15s/时长档/镜数底线/框中框失衡写实/独白对白音效随视频生·SD2 不出 BGM·字幕与 BGM 合成前加/人数锁定规则下按需做。", "extras": [], "cn": "王家卫电影美学"}, {"slug": "xianxia-drama-planner", "desc": "一站式生成东方巨构美学短剧", "body": "## 一套仙侠底质 + 一句可选主色(阶段 1 提炼,全片统一)\n\n全片一套渲染底质(极致宏大尺度、含建筑地点的白玉超巨构、镜面对称、电影级空气透视),**场景图不套用风格种子,靠同一段共享风格描述文本反复套用来保持统一**;**全片影调最终以用户确认的那组场景图调性为准**,人物图/道具图/视频生成时都需向已选场景图的色彩基调看齐。从剧本情绪再提炼一句主色附到场景图 prompt。\n\n- **共享风格描述(场景与 Seedance 通用基底,任何地点都适用,精简版,中文)**:`东方神话巨构主义电影画面。晴朗淡青蓝天空,云层保持中性偏白,右侧可有克制的淡金逆光轮廓,不做整体暖橙滤镜。极致远景或强透视构图,人物或近景元素仅占画面高度0.3%-0.8%。近景、中景、远雾、极远景四层空气透视,体积云,电影级写实质感,HDR,8K细节,结构可信、重量真实,尺度辽阔。`\n- **建筑子句(仅当该地点剧本设定含建筑/宫阙/殿宇时才追加,不含建筑的地点绝不套用)**:`一座汉白玉超巨构建筑或天宫从云海中升起,建筑占画面高度60%以上甚至越出边缘;巨墙、深色木构梁架、层叠斗拱、宽阔飞檐,鎏金克制、不做满金。`\n- **场景图额外追加**:`85-100mm中长焦压缩空间(或50-70mm强烈一点透视,视构图需要二选一)`,接共享描述(+ 建筑子句,如适用)后,再接该地点自身的地貌/环境细节(如冰原、竹林、荒漠等,见场景清单描述)与主色。**室内场景**(宗门大殿内部、洞府内部等属于\"含建筑\"类)沿用同一套光线/色调/电影质感语言,尺度感按该室内空间本身的规模呈现,不强求做到\"超巨构\"。\n- **Seedance 前置风格句额外追加**:`真人实拍电影质感,广袖服装随风飘动,战斗/情绪高潮处慢镜升格,人物在巨构长廊或大殿中行走时保持画面中极小比例的全景构图,镜头运动流畅但镜头切换只用硬切、不出现任何转场特效。`,放在 Seedance prompt 第一句,接共享描述之后。\n- **可选主色倾向(接底质描述后,任选一句或另写)**:仙气冷调「淡玉色、月白、雾青」;天火暖调「熔金、赤色雷光、深紫风暴云」;青绿山水「石绿、石青、暖金夕阳」;魔道幽冥「血色、玄黑、病绿瘴气」。\n\n---\n\n## 固定种子与出图规格(速查)\n\n- **场景/影调图 = Midjourney V8.2**(**必须指定该版本;Midjourney V8.2 无法连接时唯一备用为 V8.1,不用其他版本或其他工具**),**不套用风格种子**(不加 `--sref`/`--profile`),全景无人无道具、零文字。**每地点出 1 组 4 张**,四选一。Prompt = 共享风格描述(通用)+ **该地点含建筑才追加建筑子句,不含建筑绝不追加** + 场景图额外追加 + 该地点自身地貌描述 + 主色 + 画幅要求(用文字描述,如\"16:9横构图\")+ 精简负面词(用文字描述写在正文里,不用 `--no` 前缀;不含建筑的地点不需要\"不要普通小宫殿代替\"这类建筑相关负面词,按场景实际情况取舍;通用负面词如不要大人物、不要浓雾遮挡、不要整体橙色滤镜、不要文字水印logo)+ **尾串仅保留** `--v 8.2`(V8.2 不可用则改 `--v 8.1`,不加其他 flag)。**整条 prompt(描述句+负面词+尾串)≤ 1024 字符**,超了只精简描述句,不动关键负面词与尾串;建筑描述仅在需要时出现;**一致性靠每次完整套用同一段共享风格描述文本 + 向已选场景图调性对齐**。\n- **人物+三视图 = Seedream 5.0 Pro**(人物专用):所有角色一次性出——每角色**一张 16:9、单一纯白底连续画布**,内含 4 套正面全身造型(**必须全身入镜,不得半身或大头**;整套搭配+发型发饰明显不同,禁止只换袍色其余不变),**四套之间不设分隔线/边框,视觉上是一整张连续白底照片而非拼接的四张图**→ 一次性四选一确认 → 选定图作参考图输入只补生侧/背,出**16:9 单张纯白底三视图,排版按有无原脸分两种**:**无原脸(Case1 无脸/Case3)**→ 左侧为正面大头特写(近景头肩)+ 右侧全身三视图(正面/侧面/背面并排),整张连续无拼接缝,脸保留可见(脸即身份);**有原脸参考(Case2)**→ **只出全身三视图(正面/侧面/背面并排),不含左侧大头特写面板**,头部区域用**圆形贴纸完全遮住**,**右下角小字标注**(按用户语种)\"人脸单独提供·仅供服装参考\",身份以原脸图/视频在 Seedance 端锁定。**四选一渲染档(必叠,强调电影级而非短剧感)**:反油皮肤 `matte realistic skin, visible pores, no retouching, subtle film grain`;电影感 `cinematic film still, filmic contrast, luminous colour grade, movie-grade cinematography`;电影级选角与妆造 `a real film-actor face with dignified screen presence, NOT a modern idol/K-beauty/short-drama influencer face, no glass-skin filter, no heavy web-drama makeup, natural film-grade styling`;排版正向词补充 `single seamless white background canvas, no panel dividers, no borders between poses, continuous studio photograph, not a collage`。维护 **cast sheet**。Seedream 无 `--sref`,一致性靠角色卡+参考图。\n- **道具锚点图 = Lib Image**(仅需跨镜锁定的核心道具才出,**独立生成,不引用人物或场景图作参考**,直接依据道具卡文字描述生成):16:9 纯白底单张连续画布,内含道具正面全图+三视图细节(正面/侧/背,法宝可加 1–2 处纹样/机关特写贴角),无分隔线拼接感。排版指令(i2i,英文基底):`pure white seamless background, product-style photography, single continuous canvas with no panel dividers; main panel shows the exact prop large and centred (front view); to the right, smaller side and back views; add close-up insets for intricate details if present; replicate every detail 1:1, do not redesign; no text, no watermark`。维护 **道具单(props sheet)**:道具名/归属角色/【锁定/不锁定】/三视图链接。\n- **视频 = Seedance 2.5(强制,不得替换成其他版本)**,单次最长 **30s**,内部镜头切换只用硬切、不生成任何转场特效或字幕。输入 = 该段涉及地点的场景图(跨地点多张、单地点一张,含室内场景)+ 每角色**同一张三视图**(锁脸+服装)+ 每件锁定道具**同一张三视图**(不锁定道具不出图,靠文字带出)+(有原脸时)原脸图作身份锚点。\n\n---\n\n## 流程(逐阶段暂停确认)\n\n### 阶段 0 · 开拍前问询卡(一次性问完,不逐条停)\n\n一张卡问 4 项(**角色造型、道具、口语语言不在此问,阶段 1 解析剧本自动提炼**):\n\n1. **剧本/文本**:完整剧本?一句话想法(据此草拟)?还是完全没有想法?上传后阶段 1 自动解析人物/道具/场景/语言。**若完全没有剧本/想法,先问用户想要的风格基调**(如仙侠爱情、仙侠打斗/热血、仙侠悬疑/复仇、仙侠成长/顿悟、仙侠家国大义等,可多选或另写),**再据此基调 + 用户补充的只言片语草拟仙侠短剧本**;若已有一句话想法则直接据此草拟,不必再问基调。\n2. **字幕**:要/不要,要则选简体/繁体/英文/双语(阶段 6 直接按此加,不再问)。\n3. **画幅**:16:9/4:3/1:1/9:16 平等列出、不作推荐,必须用户自选。\n4. **时长**:30s/60s/90s/自定义(填空,如 150s→按 30s 向上取整分 5 段)。\n\n> **分辨率不问,默认 720p**。草拟剧本(人物/门派/场景/节拍反转/声音分工,贴合已定风格基调,可掺渡劫飞升、法宝认主、宗门大比、身世之谜、天劫倒计时、魔道入侵、转世前身、灵根觉醒等钩子)→用户确认→进阶段 1。\n\n**角色造型三 Case(阶段 1 出人物清单时才问,不在此问)**:Case1 有造型参考图→参考图+补 spec 生成,无原脸,三视为左大头特写+右全身三视图;Case2 有人脸无造型→人脸参考+补 spec,原脸带入 Seedance 锁脸,**三视只出全身三视图(不含大头特写面板),头部圆形贴纸遮挡+右下角小字标注**;Case3 都没有→按剧本身份/门派/性别补 spec 直接生成,无原脸,三视为左大头特写+右全身三视图,脸即身份。三 Case 均要求电影级选角与妆造,避免短剧网红脸。\n\n**仙侠古风服装语言(补 spec 时用,不锁朝代,按性别)**:女 `flowing wide-sleeve hanfu or Taoist robe, silk ribbon sash drifting, layered cloud-shoulder cape, jade or gold hairpin, flowing high bun`;男 `Taoist/cultivator robe with wide sleeves, waist sash with jade pendant or sword tassel, topknot with jade or wooden hair crown`;共通 `real silk/brocade/gauze textures with natural drape, no contemporary fabric/cut/accessories`。身份门派可微调配色纹样(魔道偏暗、正道偏素雅明亮),不改造型基线。\n\n### 阶段 1 · 剧本解析 + Final_Video_Spec\n\n读取全文解析为叙事结构+人物/道具/场景三表,**输出表格停一次,不生成任何图片**。\n\n- **去重合并**:同一实体反复出场合并成一条,补充描述并入最终描述。\n- **信息不足必须停下问,不能瞎补**:外观描述缺失的条目标记 **⚠️信息不足**,列出需补充的具体问题,等用户补充后才进入该条设计;\"完整\"条目不受影响。\n- **输出格式**:先报\"识别到 X 人物/Y 场景/Z 道具\",附叙事结构一句话(节拍数按时长:30s 取 1–2 拍,60s 取 2–3 拍,以此累加);人物表(编号/姓名/出场场次/身份门派关系外观/状态)、道具表(编号/名称/归属/出场/外观/锁定判断/状态)、场景表(编号/名称/出场/室内或室外/**是否含建筑**/环境描述/是否专用空镜/状态)。**场景表须包含剧本里出现的全部室内场景**,不因为室内不易呈现巨构感而省略。**\"是否含建筑\"按该地点剧本描述判断**:宫阙、殿宇、长廊、洞府等填【含建筑】,荒野、冰原、山川、竹林、海洋等纯自然环境填【不含建筑】——决定阶段 3 出图时是否追加建筑子句。\n- **道具锁定判断**:法宝本命法器、关键信物、反复出现兵器默认【锁定】;一次性摆设、群体背景默认【不锁定】;拿不准默认不锁定。\n- **口语语言**:默认剧本本身写作语言;混用/不明确才追加一句询问。\n- **人脸参考图问题**(此处问,非阶段0):对人物清单问\"有没有想指定的人脸参考图/视频?没有则按剧本+仙侠服装语言原创设计(电影级选角),首版确认后作后续一致性基准\"。\n- **旁白/心声独白/对白逐句提炼**:与三表一并展示——旁白(第三人称说书人,交代背景/因果/时间跳跃)、心声独白(第一人称情绪)、对白(标说话人,冗长台词精简为强节奏短句需说明确认)、每拍声音分工(旁白/独白/对白/叠用)、情绪反转基调、一句主色倾向。\n- **分批处理**:人物/道具/场景任一类超 8 个自动分批,每批≤8,按首次出现顺序,表格下方注明分批计划;**影响阶段 2/2.5/3 节奏**——每批做完停一次问是否继续,除非用户说明不用逐批确认。\n- **Final_Video_Spec**:画幅(阶段0第3问)/分辨率(默认720p)/时长(阶段0第4问,每30s一段)。\n\n> 暂停确认(三张表+状态标注+人脸参考图问询+spec 一次性一起停)。\n\n### 阶段 2 / 2.5 / 3 · 角色·道具·场景资产生成(三线并行发起,确认顺序不变)\n\n> **三条生产线(人物/道具/场景)可以同时发起生成调用以节省时间**,互不依赖、互不参考;但**给用户看结果与逐一确认的顺序仍按 2→2.5→3 进行**,不因为并行生成就打乱确认节奏。各类超 8 个均按阶段 1 分批计划走,每批做完停一次问是否继续。\n\n**阶段 2 · 角色设计(Seedream 5.0 Pro)**:每角色写角色卡 → 一起出全部角色四选一造型图(**16:9、单张纯白底连续画布,4 套均须全身入镜**,差异明显,电影级选角基线,无拼接缝)→ 一次性四选一确认 → 选定图作参考图输入只补生侧/背,一起出全部三视图(16:9 单张纯白底无拼接缝;**无原脸角色**=左大头特写+右全身三视图;**有原脸角色**=只出全身三视图、头部圆形贴纸遮挡+右下角小字标注)→ 逐项核对脸/服装,漂移则以选定图重补,反复漂则拼版 → 一次性确认全部三视。维护 cast sheet;换装再出新一版。\n\n> 四套须整体搭配+发型都拉开区别(如①正式道袍高发髻 ②战甲束发 ③素色襦裙垂发簪花 ④华丽礼服复杂发饰),禁止只换袍色其余不变;人物长相与妆造须走电影质感,避免网红脸/短剧感;**画面必须是单张连续白底,不能出现分栏/边框/拼接的四宫格或三宫格感**。\n\n**阶段 2.5 · 道具设计(Lib Image,仅锁定道具需要,与人物图/场景图完全独立)**:【不锁定】道具跳过,留到分镜/场景阶段文字带出;【锁定】道具逐样出图——写道具卡(材质/纹样/尺寸/关键机关)→ **直接依据道具卡文字描述生成,不引用任何人物三视图或场景图作参考**→ 一次性出全部锁定道具单张纯白底连续画布(正面图+三视图细节,无拼接缝)→ 一次性确认(核对材质纹样比例)→ 偏差则以正面图重生侧/背。维护道具单。中途新增道具随时补出。\n\n**阶段 3 · 场景影调图(Midjourney V8.2,不可用则 V8.1,不套用风格种子)**:按场景清单一起出(不要一场出完再出下一场):每地点(含室内场景)**各出 1 组 4 张**,**按场景表\"是否含建筑\"取用对应模板**——【含建筑】接共享风格描述+建筑子句+该地点自身细节;【不含建筑】只接共享风格描述+该地点自身地貌细节(荒原、冰川、竹林等),**绝不强行套用建筑子句**;接主色+画幅文字描述(如\"16:9横构图\")+仅 `--v 8.2`(不可用则 `--v 8.1`)的尾串,**prompt 保持精简(≤1024 字符)**。**场景图按「地点」出全景,一个地点一组、跨镜跨段复用,一段视频可以涉及多个地点、不限制每 30s 只对应一个场景图**;不为特写/局部单独出图,这些交 Seedance 在同一全景上取景;组数=去重后的地点数(含室内)。专用空镜地点在场景清单特别标注。**全部出齐 → 一次性暂停让用户逐地点四选一**(标明 1 左上/2 右上/3 左下/4 右下)→ 收齐才进阶段 4,严禁未经四选一就往下走。**该场景图确定后的调性即为全片影调基准**,后续人物/道具/视频生成都需向其色彩质感看齐。\\\n**全部出齐 → 一次性暂停让用户逐地点确认**(满意则通过;不满意可指出问题重新生成该地点这一张,不做四选一)→ 收齐确认才进阶段 4。\n\n### 阶段 4 · 分镜表格(生视频前必出、需确认)\n\n**一次性出全部分镜表**(按段数,不要一段一停),每段一表,列:镜号/时长/景别(空镜/巨构人物运镜/近景特写/其他)/画面(调度表演构图)/**道具锚点**(该镜用到的道具单编号,用于绑定道具三视图)/**场景锚点**(该镜所在地点的场景表编号,用于绑定场景图)/声音层(旁白·独白·对白,原文+语气)/运动。**转场统一为硬切,不设转场列**。\"景别\"列填四选一:纯空镜/巨构人物运镜/近景特写/其他——**每段至少各出现 1 次纯空镜与 1 次巨构人物运镜,二者不可互相替代;声音层为\"对白\"的镜头景别默认填近景特写**(展现说话角色的表情口型,不默认用空镜/巨构人物运镜表现对白瞬间),其余镜头按剧情需要在近景特写与大远景间交替,避免整段被大远景堆满。空镜行画面列只写景观调度、声音层可留白仅环境音效、道具锚点留空;巨构人物运镜行需写明人物在长廊/大殿/天桥中的具体调度与占比。\\\n表格下方附**连戏 bible**(不进表):角色身份门派造型手持道具/180°轴线与站位/场景主色光效时辰/当前节拍情绪反转/多段时尾帧→头帧衔接。\\\n每段每 30s ≥3 镜、至少 1 空镜、至少 1 巨构人物运镜;逐句记录口语原文供阶段 6 做字幕。\n\n> **暂停确认(一次性)**:全部分镜表+造型图+三视图+道具图+场景图一起停。**分镜表一次性全出只停一次;视频(阶段5)相反——逐段生成逐段确认**。\n\n### 阶段 4b · 多段尾帧续接(60s+ 关键机制,逐条生)\n\n每生完一条 seg_n → 停下等确认 → 抽尾帧解析(站位/表情/光线/景别/道具状态)→ 按分镜声明的接缝模式生 seg_n+1。接缝模式:**(A)连续动作**——尾帧作起始帧无缝续上;**(B)换场**——尾帧仅作连戏参考(角色/服装/道具/色板/光线一致),新构图,以**硬切**相接(不用任何风格化转场特效)。\n\n### 阶段 5 · Seedance 2.5 视频(强制该版本,每段一条 30s,逐条生)\n\nprompt 结构:①前置风格句;②**组装**——喂该段涉及地点的场景图(按分镜\"场景锚点\"取用,含室内场景)+ 每角色三视图(锁脸锁造型,不再用四选一图)+ 每件锁定道具三视图(按分镜\"道具锚点\"取用,不锁定道具靠文字带出)+ 有原脸时原脸图另作身份锚点,写明\"脸与造型取自三视图、道具形制取自道具三视图\";③**分镜**:`Shot1…hard cut to Shot2…`,一条连续 30s、镜数达标、至少 1 空镜 + 至少 1 巨构人物运镜,**镜头切换只用硬切,绝对不允许出现叠化/交叉溶解/淡入淡出等任何转场动画或特效画面,没有例外**;④**口语层**:按该镜声音层分工填入——旁白/独白(无需对嘴)、对白(标说话人、口型同步),提示词按用户语种、台词填剧本原文;⑤**运动**(含巨构人物运镜、对白近景与战斗专属关键词,按每镜景别对应选用):`sweeping wide-angle and aerial epic vista shots, two tiny figures walking along a vast palace corridor or hall high above the clouds occupying a very small fraction of the frame, medium close-up or close-up on the speaking character with the vast background softly blurred during dialogue, flying-sword or floating traversal within a single continuous shot, camera moving through drifting mist as part of one shot, fast whip-pan between combatants with motion blur, low-angle shot conveying dominance, speed ramping between slow-motion and real-time at the moment of impact, close tracking shot following rapid close-quarters combat, camera pushes back sharply as a shockwave of energy erupts, glowing spirit-qi and sword-qi trails, orbiting camera during power reveal or combat exchange, high bird's-eye shots`;⑥**音频+文字规则**:正面写旁白/独白/对白+场景音效;负面追加标准负面词库(已覆盖 BGM/字幕/转场特效/人潮/现代元素等)。\\\n**表演**:逐镜≥1 表情+1 动作,按剧本情绪反转赋予,电影级表演质感。**通用治僵硬(每镜加)**:`natural subtle atmospheric sway, breathing on wide/close shots, micro head movement, natural blink, expression shifting per scene emotion, robes/sleeves/ribbons/hair/mist drifting subtly`。\n\n> **分段生成+强制确认门**:一段一段生,每段生完必须停下等确认才生下一段,严禁不经确认连续生。\\\n> \\*\\***旁白/独白兜底**:若模型对无对嘴 VO 支持不稳,退回装配阶段做 TTS/录音叠加,其余规则不变。\n\n### 阶段 6 · 装配\n\n1. **顺接**:各段以**硬切**拼接,**绝对不允许出现叠化/交叉溶解/淡入淡出等任何转场特效,没有例外**;片段已含人声+音效、无 BGM、无转场画面。\n2. **合成前一步**:①**加字幕** `add_subtitle`——按阶段0已确认语种直接加(可编辑叠加层,不烧进帧);**样式固定**:纯白字、**无描边(不加黑边/无 outline/stroke)**、字号 **28px**、**单行不换行**(超长台词需精简至单行能容纳的长度,精简方式同阶段1台词精简原则)、字体 **思源宋体**(Source Han Serif,衬线体;服务器无 词强制使用白底图，背景必须为纯净白色，不得出现任何环境元素。\n暴力/亲密戏用柔美暗示性镜头处理（如落红用花瓣飘落，拥抱用纱帘遮掩）。\nAI生图提示词严格遵循对应风格模板，必须包含强制后缀和柔美画面关键词。\n拒绝平淡情感，冲突密度不足时主动提出“虐恋”“追妻”“误会”等强化建议。\n始终以“观众会不会点下一集嗑糖/落泪”为最高检验标准。", "extras": [], "cn": "精品女频短剧一键成片"}, {"slug": "y2k-jelly-aesthetic-director", "desc": "千禧年数码美学、果冻材质、透明塑料、银色金属质感的美学视频", "body": "# Y2K 果冻数码美学导演 Skill\n\n## 1. Skill 名称\n\n**Y2K 果冻数码美学导演**\\\n别名：千禧果冻数码视觉导演 / Jelly Digital Y2K Visual Director / 未来复古潮流影像导演\n\n---\n\n## 2. Skill 简介\n\n这个 Skill 用于帮助用户从一个主题、人物、产品、音乐情绪或参考图开始，完整制作 **Y2K 千禧年数码美学、果冻材质、透明塑料、银色金属、镭射反光、蓝紫粉渐变、复古电脑 UI、潮流海报、虚拟偶像视觉、产品广告、音乐 MV 和 5 秒图生视频**。\n\n它不是关键词堆叠工具，而是一套视觉导演工作流：\n\n1. 判断用户需求与使用场景\n2. 给出 3-5 个原创创意方向\n3. 规划人物 / 产品 / 道具 / 场景资产\n4. 输出图片生成提示词\n5. 设计分镜与镜头节奏\n6. 输出 5 秒或更长视频的分镜提示词\n7. 给出剪辑、声音、字体、UI 与审核规则\n\n核心目标：做出 **明亮、干净、闪亮、甜酷、透明、镭射、未来复古、年轻潮流** 的 Y2K 数码视觉，避免跑成普通赛博朋克、暗黑霓虹、廉价塑料或杂乱 UI。\n\n---\n\n## 3. 适用场景\n\n适合制作：\n\n- Y2K 潮流海报\n- 虚拟偶像视觉\n- 音乐 MV / 混剪视觉\n- 产品广告：香水、护肤品、美妆、耳机、饮料、数码产品、潮玩\n- 社交媒体封面：小红书、抖音、B站、短视频封面\n- 5 秒图生视频\n- 15 秒 / 30 秒 / 60 秒 / 75 秒潮流广告或 MV 分镜\n- 复古电脑 UI、光盘、MP3、翻盖手机、数码相机主题视觉\n\n不适合：\n\n- 黑暗赛博朋克城市\n- 雨夜霓虹街道\n- 废土工业风\n- 恐怖黑客房\n- 大量机械义体改造\n- 脏乱、压抑、反乌托邦视觉\n\n---\n\n## 4. 输入判断规则\n\n### 4.1 用户只给主题\n\n例如：\\\n“做一个 Y2K 风格女孩海报”\\\n“做一个果冻数码风产品广告”\\\n“做一个千禧年 MV 视觉”\n\n执行规则：\n\n- 不要直接只给一个提示词。\n- 先输出 3-5 个创意方向。\n- 每个方向包含：画面概念、主体、场景、道具、色彩、动效潜力。\n- 如果用户没有选择，默认选择最适合传播和生成稳定的方向继续。\n\n### 4.2 用户给了产品\n\n重点分析：\n\n- 产品类型\n- 产品形状\n- 产品材质\n- 包装色彩\n- 受众气质\n- 卖点是否适合透明、果冻、镭射、UI 化表达\n\n必须输出：\n\n- 产品主视觉方案\n- 产品陈列方式\n- 产品周围道具\n- 产品广告图提示词\n- 产品 5 秒视频提示词\n\n### 4.3 用户给了人物 / 角色\n\n重点分析：\n\n- 角色身份\n- 发型妆容\n- 服装材质\n- 姿势\n- 画面情绪\n- 背景 UI 层次\n\n必须输出：\n\n- 人物资产设定\n- 服装与配饰规则\n- 人物海报提示词\n- 人物 5 秒视频提示词\n\n### 4.4 用户给了参考图\n\n必须先分析，再原创转化。\n\n只提取：\n\n- 色彩关系\n- 材质方向\n- 构图逻辑\n- 光影方式\n- 道具类型\n- UI 层次\n- 情绪气质\n\n不能照搬：\n\n- 具体人物身份\n- 真实 logo\n- 商标\n- 原图文字\n- 原图特殊构图\n- 原图角色或品牌元素\n\n### 4.5 信息不足时\n\n不反复追问，自动补全默认值：\n\n- 默认风格：中度 Y2K 果冻数码风\n- 默认色彩：蓝紫粉渐变 + 银色金属 + 透明冰蓝\n- 默认材质：半透明塑料、透明亚克力、果冻凝胶、镭射膜\n- 默认道具：光盘、翻盖手机、MP3、数码相机、复古电脑 UI\n- 默认视频：镜头推进 + UI 闪动 + 镭射高光 + 主体定格\n- 默认画幅：海报 3:4 / 4:5，MV 16:9，短视频 9:16，产品广告 16:9 或 1:1\n\n---\n\n## 5. 无参考图创意引导\n\n当用户没有参考图时，必须优先给出 3-5 个方向。\n\n默认方向库：\n\n1. **虚拟偶像启动页**\\\n   数码少女 / 透明果冻舞台 / 复古电脑开机界面 / 蓝紫粉屏幕光 / 光盘和弹窗漂浮。\n\n2. **果冻产品陈列广告**\\\n   产品位于透明亚克力台座上 / 果冻泡泡 / 银色金属环 / 光盘反射 / 加载条 UI。\n\n3. **千禧聊天室数码空间**\\\n   透明电脑桌 / 翻盖手机 / 聊天弹窗 / 鼠标指针 / 粉蓝屏幕光 / 2000 年代互联网梦境。\n\n4. **光盘镭射 MV 舞台**\\\n   巨大光盘背景 / 镜面地板 / 虚拟偶像 / 音频波形 UI / 镭射扫光。\n\n5. **翻盖手机恋爱广告**\\\n   巨大翻盖手机 / 短信弹窗 / 像素爱心 / 透明挂饰 / 甜酷青春感。\n\n输出创意方向时，每个方向都要写：\n\n- 名称\n- 画面描述\n- 适合用途\n- 核心道具\n- 色彩\n- 动效潜力\n- 风险提醒\n\n详见：`docs/01_style_system.md`\n\n---\n\n## 6. 参考图分析与原创转化\n\n参考图分析时使用以下结构：\n\n1. 主体类型\n2. 构图方式\n3. 色彩关系\n4. 材质特征\n5. UI / 图形元素\n6. 道具信息\n7. 情绪气质\n8. 可保留与需转化部分\n\n原创转化规则：\n\n- 普通背景转为蓝紫粉数码空间\n- 普通材质转为果冻、透明塑料、银色金属、镭射膜\n- 普通道具替换为 Y2K 数码道具\n- 普通光效转为屏幕光、光盘反射、透明折射、镭射扫光\n- 普通 UI 转为复古电脑弹窗、加载条、鼠标指针、像素图标\n- 保留风格逻辑，不复制具体内容\n\n---\n\n## 7. 标准工作流\n\n每次执行按以下顺序：\n\n1. **需求理解**\\\n   判断用户做图、做海报、做产品广告、做 MV、做视频还是做完整分镜。\n\n2. **风格定位**\\\n   选择轻度 / 中度 / 重度 Y2K。默认中度。\n\n3. **创意方向**\\\n   无参考图给 3-5 个方向；有参考图先分析再转化。\n\n4. **资产规划**\\\n   输出人物、产品、道具、场景资产。\n\n5. **图片提示词**\\\n   输出单图、人物海报、产品广告、场景图等对应提示词。\n\n6. **分镜设计**\\\n   如果用户要视频，先按时长和用途拆镜头。\n\n7. **视频提示词**\\\n   根据镜头节奏输出单镜头提示词。\n\n8. **剪辑与声音**\\\n   给出转场、声音、字体、UI 叠加建议。\n\n9. **审核纠偏**\\\n   检查是否跑成赛博朋克、廉价塑料、UI 混乱、主体不清。\n\n详见：`docs/02_workflow_assets_prompts.md`\n\n---\n\n## 8. 资产规划规则\n\n### 8.1 人物资产\n\n必须包含：\n\n- 身份：虚拟偶像、甜酷少女、Y2K 模特、未来 DJ、数码歌姬等\n- 发型：银发、粉紫挑染、蓝黑发、双马尾、湿亮发丝等\n- 妆容：亮片眼影、银色眼线、果冻唇釉、清透底妆\n- 服装：透明 PVC 外套、银色上衣、镭射夹克、低腰裤、未来感靴子\n- 配饰：银色耳机、透明包、光盘耳环、像素爱心项链、金属腰链\n- 姿态：看向镜头、手拿翻盖手机、戴耳机侧头、轻微转身\n\n避免：\n\n- 暗黑赛博朋克义体\n- 废土脏乱服装\n- 恐怖感皮肤\n- 廉价塑料质感\n- 低俗擦边姿势\n\n### 8.2 产品资产\n\n必须包含：\n\n- 产品类型\n- 产品材质\n- 包装颜色\n- 陈列台座\n- 周围道具\n- 高光重点\n- 产品正面清晰要求\n\n产品广告中，产品永远是主角。UI 和道具只能做辅助，不能遮挡主体。\n\n### 8.3 道具资产\n\n每张图只选 3-5 个核心道具。\n\n推荐道具：\n\n- 光盘 CD\n- MP3\n- 翻盖手机\n- 透明键盘\n- 透明鼠标\n- 数码相机\n- 银色耳机\n- 旧电脑显示器\n- 弹窗 UI\n- 鼠标指针\n- 像素爱心\n- 加载条\n- 聊天窗口\n- 音频波形\n\n### 8.4 场景资产\n\n常用场景：\n\n1. 透明数码摄影棚\n2. 千禧电脑房\n3. 光盘 MV 舞台\n4. 果冻未来商店\n5. 数码梦境空间\n\n详见：`docs/02_workflow_assets_prompts.md`\n\n---\n\n## 9. 图片提示词规则\n\n通用结构：\n\n```text\n主体描述 + Y2K 千禧年数码美学 + 材质描述 + 色彩描述 + 场景描述 + 道具描述 + UI 元素 + 光影描述 + 构图镜头 + 画质要求 + 风格限制\n```\n\n必须强化：\n\n- 主体清晰\n- 材质高级\n- UI 克制\n- 道具有秩序\n- 色彩统一\n- 光影干净\n- 不变成普通赛博朋克\n\n核心关键词：\n\n- Y2K 千禧年数码美学\n- 果冻质感\n- 半透明塑料\n- 透明亚克力\n- 银色金属\n- 镭射反光\n- 光盘彩虹反射\n- 蓝紫粉渐变\n- 复古电脑 UI\n- 弹窗界面\n- 鼠标指针\n- 像素图标\n- 屏幕光\n- 潮流广告感\n\n完整模板见：`docs/04_templates_negative_prompts.md`\n\n---\n\n## 10. 分镜设计规则\n\n如果用户要视频，必须先判断视频类型：\n\n- 动态海报\n- 产品广告\n- MV / 虚拟偶像\n- 潮流短片\n- 社交媒体封面\n\n分镜表必须包含：\n\n镜头时长节奏景别画面内容主体动作镜头运动UI 动效材质动效转场声音生成提示词重点避免问题\n\n节奏可选：\n\n- 慢：动态海报、产品英雄镜头、结尾定格\n- 中：产品展示、人物轻动作、场景建立\n- 快：MV、道具蒙太奇、UI 闪屏、广告开头\n- 很快：高潮卡点、闪白、快切蒙太奇\n\n详见：`docs/03_video_rhythm_storyboard.md`\n\n---\n\n## 11. 5 秒视频提示词规则\n\n5 秒视频不能只有一种“慢推”。必须根据用途选择节奏模式。\n\n### 11.1 慢节奏：动态海报模式\n\n适合：人物海报、社交媒体封面、产品主视觉。\n\n节奏：\n\n- 0-1 秒：首帧建立，屏幕光轻微亮起\n- 1-2 秒：镜头缓慢推进，材质高光流动\n- 2-3 秒：UI 弹窗轻微闪烁\n- 3-4 秒：光盘反射或镭射扫光\n- 4-5 秒：主体定格，形成封面感\n\n### 11.2 中节奏：产品广告模式\n\n适合：香水、护肤、美妆、耳机、饮料、数码产品。\n\n节奏：\n\n- 0-0.5 秒：数码开机闪光\n- 0.5-1.5 秒：产品快速亮相\n- 1.5-2.5 秒：镭射高光扫过产品\n- 2.5-3.8 秒：产品轻微旋转或高光变化\n- 3.8-5 秒：加载条完成，产品英雄定格\n\n### 11.3 快节奏：MV / 潮流短片模式\n\n适合：音乐 MV、虚拟偶像、时尚短片。\n\n节奏：\n\n- 0-0.4 秒：UI 快速闪出\n- 0.4-1.2 秒：snap zoom 推近人物\n- 1.2-2 秒：光盘旋转、音频波形跳动\n- 2-3 秒：人物小幅 pose 变化\n- 3-4.2 秒：UI 遮挡或镭射扫光形成镜头内转场\n- 4.2-5 秒：人物定格，封面感收束\n\n完整模板见：`docs/03_video_rhythm_storyboard.md` 与 `docs/04_templates_negative_prompts.md`\n\n---\n\n## 12. 剪辑与声音建议\n\n### 剪辑节奏\n\n- 海报：慢推、轻闪、定格\n- 产品广告：开头快吸睛，中段稳展示，结尾定格\n- MV：0.5-1.5 秒一次视觉变化，卡点闪白、UI 弹窗、光盘扫光\n- 长视频：按段落拆镜，不要一个长提示词生成到底\n\n### 转场建议\n\n- UI 弹窗遮挡转场\n- 光盘反光扫屏转场\n- 翻盖手机开合转场\n- 数码相机闪光转场\n- 加载条完成转场\n- 鼠标点击窗口转场\n- 像素爱心闪屏转场\n\n### 声音建议\n\n适合：\n\n- 复古电脑开机声\n- 鼠标点击声\n- UI 弹窗提示音\n- 电子 beep\n- 光盘旋转声\n- 数码相机快门声\n- 翻盖手机打开声\n- 镭射扫光 whoosh\n- 果冻轻弹声\n- 甜酷电子鼓点\n\n不适合：\n\n- 黑暗工业噪音\n- 恐怖音效\n- 废土环境声\n- 过强赛博朋克低频\n\n---\n\n## 13. 审核清单\n\n生成后必须检查：\n\n### 风格\n\n- 是否明显是 Y2K 千禧数码美学？\n- 是否有果冻、透明塑料、银色金属、镭射反光？\n- 是否是蓝紫粉、冰蓝、珠光白、银色体系？\n- 是否干净、闪亮、潮流？\n- 是否避免了普通赛博朋克？\n\n### 材质\n\n- 果冻是否有透光感？\n- 透明塑料是否高级干净？\n- 银色金属是否有镜面反光？\n- 镭射是否自然不过曝？\n- 光盘反射是否有彩虹层次？\n\n### UI\n\n- UI 是否过多？\n- 是否遮挡主体？\n- 是否有乱码？\n- 是否服务构图？\n- 是否像复古电脑界面而不是黑客屏幕？\n\n### 视频\n\n- 主体是否稳定？\n- 是否没有换脸、换装、换场景？\n- UI 是否只是节奏性动效？\n- 光效是否自然流动？\n- 产品是否不变形？\n- 结尾是否能定格成封面？\n\n详见：`docs/05_review_troubleshooting.md`\n\n---\n\n## 14. 标准输出格式\n\n每次完整执行时，使用以下格式：\n\n```markdown\n# 《项目名称》Y2K 果冻数码美学方案\n\n## 一、需求理解\n- 用户主题：\n- 目标类型：\n- 使用场景：\n- 推荐画幅：\n- 风格强度：\n- 核心主体：\n- 视觉关键词：\n\n## 二、创意方向\n### 方向 1：\n- 名称：\n- 画面描述：\n- 适合用途：\n- 核心道具：\n- 色彩：\n- 动效潜力：\n- 风险提醒：\n\n### 方向 2：\n同上。\n\n### 方向 3：\n同上。\n\n## 三、最终推荐方向\n说明为什么选择。\n\n## 四、资产规划\n### 人物资产\n| 资产名 | 描述 | 服装 | 材质 | 色彩 | 用途 |\n|---|---|---|---|---|---|\n\n### 产品资产\n| 资产名 | 描述 | 材质 | 陈列方式 | 高光重点 | 用途 |\n|---|---|---|---|---|---|\n\n### 道具资产\n| 道具 | 描述 | 材质 | 位置 | 用途 |\n|---|---|---|---|---|\n\n### 场景资产\n| 场景 | 描述 | 色彩 | 材质 | UI 元素 | 用途 |\n|---|---|---|---|---|---|\n\n## 五、图片提示词\n输出对应类型提示词。\n\n## 六、分镜表\n| 镜头 | 时长 | 节奏 | 景别 | 画面内容 | 主体动作 | 镜头运动 | UI 动效 | 材质动效 | 转场 | 声音 | 生成提示词重点 | 避免问题 |\n|---|---:|---|---|---|---|---|---|---|---|---|---|---|\n\n## 七、视频提示词\n按镜头逐条输出。\n\n## 八、剪辑与声音建议\n- 剪辑节奏：\n- 转场方式：\n- 声音元素：\n- 字体建议：\n- UI 叠加建议：\n- 结尾定格建议：\n\n## 九、审核清单\n- 风格是否准确：\n- 是否避免赛博朋克：\n- 材质是否高级：\n- UI 是否克制：\n- 主体是否清晰：\n- 视频是否稳定：\n```\n\n---\n\n## 15. 渐进式披露规则\n\n为了避免 Skill 主文件过长导致执行重点被稀释，默认只使用本文件核心规则。只有在用户需求触发对应场景时，才调用扩展文档。\n\n- 用户问风格、创意方向、Y2K 和赛博朋克区别：查看 `docs/01_style_system.md`\n- 用户要资产、工作流、图片提示词：查看 `docs/02_workflow_assets_prompts.md`\n- 用户要视频、分镜、长片、节奏、切镜：查看 `docs/03_video_rhythm_storyboard.md`\n- 用户要可复制模板和反向提示词：查看 `docs/04_templates_negative_prompts.md`\n- 用户要审核、纠偏、报错修复：查看 `docs/05_review_troubleshooting.md`\n\n执行时优先保证：\n\n1. 主体清楚\n2. 风格准确\n3. 材质高级\n4. UI 克制\n5. 节奏合适\n6. 视频稳定\n7. 结尾可定格\n\n一句话原则：\n\n**Y2K 果冻数码美学不是黑暗赛博朋克，而是明亮、透明、闪亮、甜酷、复古数码、消费电子幻想感的潮流广告 / MV 视觉。**", "extras": [], "cn": "Y2K 果冻数码美学导演"}, {"slug": "y2k-retro-electronics-tvc", "desc": "制作耳机、随身听、相机、掌机、便携音箱、智能穿戴等随身电子产品的复古 TVC。开场先介绍功能并只要求上传产品图；看图后 Agent 自动判断产品类型、图片质量和白底修复需求，再用一轮项目确认选择人物生活方式广告或纯产品渲染广告、复古风格、画幅和时长。人物出镜路径必须先生成 3x3 故事板控制视听结构；纯产品路径独立成片。默认 720P 单个完整 15 秒视频节点并内置 BGM。\\\" version: 1", "body": "# Wander 随身电子产品复古 TVC\n\n## 功能定位\n\n用于可以被人拿在手里或随身携带的电子产品：耳机、随身听、相机、掌机、便携音箱、智能手表、电子阅读器、小型录音笔、小型拍摄设备。\n\n主路径是人物生活方式广告：人物拿起、佩戴、使用或携带产品，让产品进入真实生活场景。也支持纯产品渲染广告，但必须单独成片，不要和人物剧情镜头混剪。\n\n## 固定用户引导\n\n### 第 0 轮：开场介绍并只要求上传图片\n\n开场必须先说明： “这个 Skill 会把你的随身电子产品图做成一支复古 TVC。我会先分析产品是否清晰、结构和 logo 是否完整、背景是否干净、是否需要先生成白底产品图，再让你用一轮确认选择人物生活方式或纯产品渲染、复古年代风格、画幅和时长。”\n\n随后只要求用户上传最清晰的一张产品图。不要在第一屏询问产品是什么、图片是否清晰、是否白底、卖点、风格、画幅或时长。\n\n### 第 1 轮：看图后只做一次项目确认\n\n看图后先给出简短判断，再让用户一次性确认：\n\n- 识别到的产品品类和核心结构。\n- 图片质量判断：可直接用，或需先生成白底产品图。\n- 广告路径：人物生活方式广告（推荐）、纯产品渲染广告。\n- 风格选择：90s 胶片校园、2000s 数码广告、city pop 夏日街头、滑板街头、复古科技棚拍。\n- 画幅选择：9:16、16:9、1:1。\n- 时长选择：15秒视频（推荐）、30秒视频、45秒视频、60秒视频。\n\n用户不修改时，默认：人物生活方式广告、90s 胶片校园、15 秒、720P、9:16。\n\n## 产品图与资产规则\n\nAgent 自行判断：\n\n- 合格：外观完整、按键接口清楚、主色准确、无严重透视变形。\n- 不合格：随手拍、背景杂乱、手遮挡、反光过曝、logo 糊。先生成干净白底电商图。\n\n人物生活方式广告必须同步生成：产品白底图、使用者形象图、生活方式场景图、3x3 TVC storyboard。纯产品渲染广告只生成产品和棚拍背景 story board，不出现人物。\n\n## 资产闭环硬规则\n\n产品图、人物图、场景图和 3x3 TVC storyboard 必须作为最终视频节点参考输入。故事板是最终视频的视觉蓝图，不是只供文字复述的中间文件。\n\n生成视频前必须建立资产清单：\n\n- 人物生活方式路径：`product_reference`、`user_reference`、`scene_reference`、`storyboard_reference`。\n- 纯产品路径：`product_reference`、`studio_scene_reference`、`storyboard_reference`。\n\n最终视频提示词必须以“参考输入”段落开头：\n\n- 人物生活方式路径必须写明：以 `product_reference` 锁定产品外观、按键、接口和 logo；以 `user_reference` 锁定人物；以 `scene_reference` 锁定生活方式场景；以 `storyboard_reference` 控制 0-15 秒场景建立、产品出现、使用动作、细节和 hero shot。\n- 纯产品路径必须写明：以 `product_reference` 锁定产品；以 `studio_scene_reference` 锁定棚拍背景和复古光线；以 `storyboard_reference` 控制 reveal、结构细节、材质微距和最终 hero shot。\n\n禁止最终视频只读取文字版 storyboard 而不引用故事板图片。若平台视频节点支持多图参考，必须传入所有对应资产；若只支持单图参考，优先使用 `storyboard_reference`，并在提示词中说明产品、人物或场景已由该故事板锁定。\n\n## 故事板硬规则\n\n必须先做 3x3 storyboard，再生成完整视频提示词。每格包含 VISUAL / ACTION / SFX or MUSIC。故事板是整片蓝图，不得拆成 9 个短视频节点。\n\n人物生活方式广告 storyboard 应包含：\n\n- 场景建立：校园、街头、卧室、屋顶、滑板场或复古棚拍。\n- 产品出现：从手中、包里、桌面、耳侧或掌心出现。\n- 使用动作：戴耳机、按播放键、举起相机、握持掌机、调音量。\n- 产品细节：按键、接口、屏幕、金属、塑料、胶片质感。\n- 情绪高点：人物表情、转身、奔跑、听到音乐后的轻微反应。\n- Hero shot：产品清晰、品牌记忆强。\n\n纯产品渲染 storyboard 应包含：产品 reveal、结构细节、材质反光、屏幕/按键/接口微距、复古光线、最终 hero shot。\n\n## 原案例结构沉淀\n\n原 Sony-style 商业片方法是：先做 3x3 storyboard，再让视频模型“根据 storyboard 生成一支完整广告”。可复用结构：\n\n- 3x3 storyboard layout。\n- 每格包含 VISUAL / ACTION / SFX or MUSIC。\n- 片子是一个完整 15 秒视频，内部通过剪辑完成多镜头。\n- 最后必须有清晰 product hero shot。\n\n## 15 秒视频结构\n\n人物生活方式广告：\n\n- 0-2s：场景和人物建立。\n- 2-5s：产品出现和第一次使用。\n- 5-9s：动态使用与产品细节。\n- 9-12s：情绪高点。\n- 12-15s：产品 hero shot。\n\n纯产品渲染广告：\n\n- 0-3s：产品 reveal。\n- 3-6s：结构细节。\n- 6-9s：材质、接口、屏幕微距。\n- 9-12s：低角度或旋转展示。\n- 12-15s：最终 hero shot。\n\n## 视频生成硬规则\n\n- 默认分辨率必须是 720P。\n- 15 秒模式必须只创建一个完整 15 秒视频节点，不要把 storyboard 拆成多个短视频。\n- 15 秒节点内直接生成 BGM。BGM 风格必须写入提示词：90s 胶片校园用 warm indie pop；2000s 数码用 early-2000s electronic pop；city pop 用 bright city pop groove；滑板街头用 alt rock 或 skate punk light groove；屋顶夏日用 breezy pop；纯产品渲染用 minimal retro electronic。\n- 同时保留按键声、快门声、电子提示音、线缆轻碰、空间环境声。\n- 超过 15 秒才拆段：30 秒 = 2 个 15 秒段；45 秒 = 3 个 15 秒段；60 秒 = 4 个 15 秒段。\n- 多段模式每段仍是 15 秒完整段，不得拆成 4-6 秒小段。\n- 多段模式的每个视频段不生成 BGM，只生成环境声；最后统一生成完整 BGM 并合成，保留环境声。\n- 人物生活方式路径禁止插入纯白背景产品旋转；纯产品渲染路径禁止突然出现人物剧情。\n\n## 自检\n\n输出前检查：是否有开场功能介绍；是否只做一轮项目确认；是否默认 720P；人物路径是否先有 3x3 storyboard；纯产品路径是否独立；15 秒是否只有一个视频节点；是否没有混杂人物生活方式和纯产品渲染；最终视频节点是否明确引用产品图、人物/场景图和 3x3 TVC storyboard。", "extras": [], "cn": "日常复古风电子产品TVC"}];

  t=t.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  t=t.replace(/^\s*[-*]\s(.*)$/gm,'• $1');
  t=t.replace(/\n/g,'<br>');
  return t;
}

  document.getElementById('main').scrollTop=0;
  document.querySelectorAll('.it').forEach((e,j)=>e.classList.toggle('on',j===i));
}
function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const list=document.getElementById('list'); list.innerHTML='';
  let n=0;
  DATA.forEach((s,i)=>{
    const hay=(s.cn+' '+s.slug+' '+s.desc+' '+s.body).toLowerCase();
    if(q && !hay.includes(q)) return;
    n++;
    const div=document.createElement('div'); div.className='it'+(i===cur?' on':'');
    div.innerHTML='<b>'+esc(s.cn||s.slug)+'</b><span>'+esc(s.slug)+' — '+esc(s.desc.slice(0,60))+'</span>';
    div.onclick=()=>show(i);
    list.appendChild(div);
  });
  document.getElementById('cnt').textContent=n+' / '+DATA.length+' skills';
}
document.getElementById('q').oninput=render;
render(); show(0);
</script></body></html>
