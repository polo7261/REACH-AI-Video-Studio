爆发型\n- 现实裁剪型\n- 命运缝合型\n- 凋零终局型\n\n详见：`references/skill-dynamics-library.md`\n\n---\n\n## 11. 反模板检查器\n\n输出 / 执行前必须检查：\n\n- 是否又写成普通法阵？\n- 是否又是火球 / 雷电 / 黑雾 / 光柱 / 激光？\n- 是否所有角色都在挥剑或举手大招？\n- 是否特效没有媒介来源？\n- 是否角色特征在大招中消失？\n- 是否面部特写超过0.5秒？\n- 是否镜头全程单一中景？\n- 是否没有英雄收尾？\n- 是否视频被拆成分段？\n- 是否把视频作为初次测试？\n- 是否只输出提示词而没有调用可用生成工具？\n\n硬规则：\n\n```text\n面部特写只保留0.5秒以内，用于确认角色身份。不要长时间凝视。角色识别应通过服装轮廓、武器、动作方式和英雄收尾持续体现。\n```\n\n---\n\n## 12. SD2.0 视频生成硬规则\n\n所有最终技能展示视频默认使用 **SD2.0 视频模型**。\n\n硬性要求：\n\n```text\n模型：SD2.0视频模型\n时长：15秒\n生成方式：一次性直接生成完整15秒\n禁止：分段生成 / 多段拼接 / 分镜图自动生成\n比例：16:9 或 21:9\n输出画质：720p固定，不要1080p\n声音：必须有声音\n参考图：只使用角色板作为唯一角色参考锚点\n前提：必须通过 Video Preflight Gate\n```\n\nAgent 具备视频工具时，必须直接生成视频。无视频工具时，才输出最终提示词作为回退。\n\n最终视频提示词必须明确：\n\n- one continuous 15-second video\n- no segmented generation\n- SD2.0 video model\n- 16:9 or 21:9\n- fixed 720p output, not 1080p\n- with sound\n- character board as the only reference anchor\n\n---\n\n## 13. 最终默认输出格式\n\n### 12.1 Agent自动执行时\n\n```text\n【执行状态】\n当前阶段：\n已生成资产：\n下一步动作：\n阻塞点：无 / 有\n\n【角色资产】\nMJ角色概念图：已生成 / 待生成 / 已返修\nImage模型角色板：已生成 / 待生成 / 已返修\n\n【Preflight结果】\n通过 / 阻塞\n\n【最终视频】\nSD2.0 15秒视频：已生成 / 未生成\n视频设置：15s / 16:9或21:9 / 720p固定 / with sound / one pass\n\n【失败风险与返修】\n```\n\n### 12.2 工具不可用回退时\n\n```text\n【当前限制】\n当前Agent无法直接调用对应生成工具，因此输出可复制提示词。\n\n【MJ角色概念提示词】\n【Image模型角色板提示词】\n【Video Preflight Gate】\n【SD2.0视频提示词】\n```\n\n---\n\n## 14. 关键文档索引\n\n```text\nreferences/agent-auto-run-workflow.md\nreferences/tool-execution-policy.md\nreferences/image-model-character-board-generation.md\nreferences/auto-run-asset-handoff.md\nreferences/role-archetype-library.md\nreferences/role-understanding-engine.md\nreferences/skill-dynamics-library.md\nreferences/weapon-medium-binding-library.md\nreferences/anti-template-checker.md\nreferences/mj-common-error-repair-library.md\nreferences/video-preflight-gate.md\nreferences/skill-causality-chain.md\nreferences/weapon-dominance-check.md\nreferences/three-success-frames.md\nreferences/failure-risk-prediction.md\nreferences/sd2-video-production-workflow.md\nreferences/low-cost-validation-workflow.md\n\ntemplates/mj-character-concept-template.md\ntemplates/image-model-character-board-template.md\ntemplates/character-board-from-mj-template.md\ntemplates/skill-preflight-template.md\ntemplates/three-success-frames-template.md\ntemplates/sss-skill-prompt-template.md\ntemplates/sd2-video-final-template.md\ntemplates/agent-auto-run-status-template.md\ntemplates/full-auto-user-command.md\ntemplates/repair-prompt-template.md\n\nexamples/agent-auto-run-example.md\nexamples/no-character-to-sd2-video-example.md\nexamples/tailor-preflight-example.md\nexamples/tailor-final-video-example.md\n\nevals/qa-scorecard.md\n```\n\n---\n\n## 4. 视频提示词语言与密度硬规则\n\nV0.6.2 新增硬规则：Agent 自动执行时，最终视频提示词不能被压缩成英文短句。\n\n### 4.1 默认语言\n\n最终 SD2.0 视频提示词默认使用 **中文完整结构提示词**。\n\n允许保留少量英文技术词，例如：\n\n```text\ncinematic realism, PBR, 0.25x slow motion, one continuous 15-second video, no segmented generation\n```\n\n但不得把完整视频提示词改写成简短英文 caption。\n\n### 4.2 当工具偏好英文时\n\n如果某个视频工具强制或明显偏好英文，Agent 必须做 **完整结构翻译**，而不是摘要压缩。\n\n错误做法：\n\n```text\nA powerful warrior strikes the ground with a hammer, cinematic, epic, 15 seconds.\n```\n\n正确做法：\n\n```text\n完整保留角色锚点、武器锁定、技能因果链、15秒时间轴、镜头、物理反馈、声音和负面约束，然后整体翻译为英文。\n```\n\n### 4.3 最终视频提示词最低密度\n\n最终 SD2.0 视频提示词不得少于以下结构：\n\n```text\n【角色板唯一锚点】\n【视频目标】\n【角色与武器锁定】\n【角色性格锚点】\n【当前情绪状态】\n【表演微指令】\n【15秒情绪弧线】\n【技能核心】\n【技能因果链】\n【必须出现的3个成功画面】\n【15秒时间轴】\n【镜头语言】\n【物理反馈】\n【声音设计】\n【视频参数】\n【负面约束】\n```\n\n如果 Agent 在自动执行模式下调用视频工具，传给工具的 prompt 必须是完整生产提示词，不是状态摘要、不是一句话提示词。\n\n### 4.4 短提示词使用限制\n\n短提示词只能用于：\n\n- 用户明确要求“给我短版”\n- 快速方向预览\n- Agent 状态栏摘要\n- 文件命名 / 任务名\n\n短提示词不得用于最终15秒视频生成。\n\n### 4.5 用户可见输出与工具执行输出\n\nAgent 可以在聊天里给用户简短状态，例如：\n\n```text\n已通过 Preflight，正在用完整中文结构提示词生成15秒视频。\n```\n\n但传给 SD2.0 的内部视频提示词必须完整、结构化、包含时间轴和约束。\n\n完整模板见：\n\n```text\ntemplates/sd2-full-video-prompt-template.md\nreferences/prompt-language-density-control.md\nreferences/video-resolution-lock.md\n```\n\n### V0.7 新增 / 合并文档\n\n```text\nreferences/prompt-language-density-control.md\nreferences/character-personality-and-emotion-system.md\nreferences/video-resolution-lock.md\ntemplates/personality-emotion-preflight-template.md\ntemplates/sd2-full-video-prompt-template.md\n```", "extras": [], "cn": "概念角色SSS级技能展示"}, {"slug": "cooking-tutorial-video", "desc": "一张照片，秒变电影感做饭教程", "body": "# cooking-tutorial-video\n\n把一张人物照做成精致的电影感烹饪教程短片(默认 15s)时用本 skill。核心机制:先合成一张**制作参考卡**(人物定妆 + 厨房环境 + 9 格烹饪动作板),再用**双图参考**连续渲染成一镜到底的做菜过程,全程锁住人物脸/服装/厨房。区别于 food-cinematic(舌尖式美食美学空镜、无真人做菜):本 skill 是**真人下厨、按步骤走完的教程片**。\n\n> 本环境适配:参考卡与成片走 Seedance → `generate_image_v3`(制作参考卡)+ `generate_video_v3`(双图参考、连续到视频、生成音频);源 MIT,表达已重写。\n\n## 输入\n\n- **人物照**(必填):作身份参考,**参考卡与成片都用同一张**——它是全片锁脸的锚点。\n- **菜品**(选填,默认手工意面):寿司/柴火披萨/抹茶拿铁等;驱动 9 步动作板的具体步骤。\n- **厨房风格**(选填,默认暖调现代乡村意式):极简东京/明亮北欧/暗调工业等。\n- **服装**(选填,默认干净休闲围裙一身):全片一致的着装。\n- **时长**(选填,默认 15s):15s 走完整 9 步动作弧;≤8s 时把动作板收缩为 5–6 格(见单拍规则)。\n- **比例**(选填,默认 16:9):竖版 Reels 用 9:16。\n- **分辨率**(选填,默认 720p):480p / 720p。\n\n缺项按默认走,但**下厨过程本身要能拆成有序 9 步**——若菜品太简单撑不满 9 步,减格数而非硬凑。\n\n## 流程\n\n提交两步顺序计划,第 2 步依赖第 1 步的产出。\n\n### 第 1 步 —— 制作参考卡(合成分镜板)\n\n用 `generate_image_v3` 以人物照为参考,生成**一张**高端制作参考板(不是海报、不堆文字;是干净、留白、网格化、写实电影摄影质感的制作参考)。这张图要同时承载三块:\n\n- **动作/编排板**:9 个编号的电影感动作格,把该菜品从生料到摆盘按序拆成 9 步烹饪过程。\n- **人物参考卡**:100% 保留上传者的脸/发色/发质/瞳色/肤色与全部五官;给出脸部特写、全身正面、侧身/工作姿态、背面四视图;穿指定服装;气质落地、亲和、专业、有电影感。\n- **环境参考卡**:该风格厨房的场景图,材质有触感、大窗自然光、悬挂厨具与香草、与菜系相称的高级下厨氛围。\n- 整体风格:写实、电影感、暖调自然光、浅景深、有触感的食物摄影、高级烹饪节目美学、丰富的表面材质。底部只放极简图标(时长/比例/写实/电影感/自然运镜),不放密集段落——让画面承载信息。\n\n**参考卡必须够大(如 3840×2160 一档)**:分辨率太低会糊掉 9 个动作格,视频模型读不出编排。\n\n拿到参考卡后**⏸ 给用户看,确认人物像 + 厨房氛围再进第 2 步**——第 2 步是贵的一步。\n\n### 第 2 步 —— 烹饪成片(双图参考到视频)\n\n用 `generate_video_v3`,**同时喂两张参考图**:原始人物照(身份锚点)+ 第 1 步的参考卡(编排 + 环境向导),生成一镜到底的连续做菜片。\n\n- **身份**:以人物照为主体,全片每一帧 100% 保留其脸/发/瞳色/肤色与五官。\n- **编排**:严格照参考卡的 9 步逐拍走,从生料经处理到最终摆盘特写;结构由参考卡驱动。\n- **动作风格**:每步之间缓慢、从容、令人满足的过渡;自然的手部与身体动作、下厨意图清晰;连续流动无跳切;暖而沉浸的节奏。\n- **镜头**:搅拌/揉面/切配/摆盘时用手部特写;人物在台面操作时用中景;最终摆盘略微拉开露出整个厨房;浅景深聚焦手与食物、背景柔化;不做生硬切换,用平滑的匹配剪辑与流畅过渡。\n- **画面**:大窗暖调自然光;材质触感与参考卡环境一致;满色、暖调电影调色。\n- **一致性**:全片同一人物(脸=人物照)、同一套服装、同一厨房环境(=参考卡)。\n- **音频**(开启生成音频):柔和厨房环境音 + 轻烹饪音效(切、煎、倒) + 轻电影感底乐;**无对白、无旁白**。必须在提示里写清音频方向,否则配乐随机。\n- **收尾**:严格到指定时长,以成品菜的漂亮特写收尾;整体高级烹饪节目质感。\n\n成片后给用户播放链接,并主动提供后续:竖版 9:16 重渲(Reels)、加长到 30s 的扩展版、或用同一张人物照换个菜品重跑。\n\n## 要点\n\n- **双图参考是全部诀窍**:人物照锁身份,参考卡锁编排 + 环境。两张缺一不可——单图跑要么丢脸、要么丢厨房。第 2 步务必两张都喂。\n- **参考卡够大**:9 个动作格必须清晰,糊了视频模型读不出步骤(见第 1 步分辨率)。\n- **音频必写方向**:生成音频开启后,不给方向则配乐随机;固定写\"环境音 + 烹饪音效 + 轻底乐,无对白\"。\n- **真人脸可用**:因人物照是用户自己的主体,且走双图参考到视频这条路(非受限的纯图生视频变体),写实人脸在此支持。\n- **非做菜的同构变体**:拉花/摆盘教学/调酒等,沿用同样两步结构,只改菜品与 9 步描述即可。\n- **单拍规则**:≤8s 的短片把动作板减到 5–6 格,把 9 拍硬塞进 8s 会拖垮动作质量。\n\n## 配合(query 需同时加载 / 也是本 skill 的评估组合)\n\n无源生跨 skill 依赖,自足(场景专属工艺已全量内联)。仅列边界劝退:\n\n边界(勿用本 skill,改道):舌尖式美食美学空镜(无真人做菜)→ food-cinematic;羊毛毡/定格等做菜手工动画 → needle-felt-animation;真人对镜口播讲解 → talking-head-director。", "extras": [], "cn": "人物烹饪短片"}, {"slug": "cthulhu-horror-titan-director", "desc": "将模糊想法或参考图转化为克苏鲁恐怖巨神题材的原创视频", "body": "## version: 2.0\n\n## language: zh-CN\n\n## description: 将模糊想法或参考图转化为宇宙恐怖巨神题材的原创图片、首帧、5秒视频与15秒氛围短片方案。\n\n# 宇宙恐怖巨神美学导演\n\n## 1. 角色与目标\n\n你是一名“宇宙恐怖巨神美学导演”。你的任务不是制造普通大型怪物，而是用**尺度、遮蔽、神性、环境异常和人类无力感**，完成可直接生产的图片与视频方案。\n\n核心公式：\n\n> 宇宙恐怖 = 超尺度参照 × 有限显现 × 神圣压迫 × 环境回应 × 克制运动\n\n最终画面应让观众感觉：眼前并非一只会表演的怪兽，而是一种人类无法完整理解的古老存在。\n\n## 2. 不可违背的核心规则\n\n1. **最终叙事画面必须有尺度参照。** 至少包含一种人类参照和一种建筑、船只、山体、树林或城市参照；纯资产设定图除外。\n2. **神明不得完整展示。** 默认只揭示约 10%—45% 的有效信息，可通过海雾、云层、深海黑暗、建筑、山体、画外空间遮蔽。\n3. **神明优先像地貌、天象、遗迹或宇宙结构。** 嘴、牙、爪、肌肉和大量触手不能成为主要恐怖来源。\n4. **环境先回应，神明后显现。** 海雾逆风、云层下沉、海面失常、符文微亮、灯塔光被截断等，优先于神明大幅动作。\n5. **视频动作必须克制。** 固定机位、极慢推进、极慢上仰或轻微横移；禁止快速环绕、扑脸、追逐、打斗、咆哮和场景乱切。\n6. **画面暗但必须可读。** 暗部保留材质和空间层次，必须有一个主视觉焦点，不得黑成一团。\n7. **恐怖不依赖血腥或 jump scare。** 禁止血浆、肢解、廉价惊吓音效和动作片节奏。\n8. **参考图只借鉴方法，不复制身份。** 不照搬独特神明轮廓、器官组合、人物站位、建筑布局或标志性构图。\n\n## 3. 渐进式披露与文件读取规则\n\n始终先执行本文件。不要一次性读取全部资料，只按任务加载对应文件：\n\n用户任务必须读取按需读取模糊想法、创意方向`references/01_创意与需求判断.mdtemplates/OUTPUT_TEMPLATES.md`上传参考图`references/02_参考图分析与原创转化.md01_创意与需求判断.md`资产规划、角色/场景/氛围资产`references/03_资产规划与资产库.md04_图片提示词规范.md`单图、海报、场景图、首帧`references/04_图片提示词规范.md03_资产规划与资产库.md`5秒视频、15秒短片、分镜`references/05_分镜与视频生成.md04_图片提示词规范.md`剪辑、声音、检查、返修`references/06_剪辑声音与审核返修.md`无完整制作方案依次读取 01→03→04→05→06有参考图时在 01 后读取 02标准输出结构`templates/OUTPUT_TEMPLATES.md`无需要示例`examples/CASE_PACK.md`无\n\n读取原则：\n\n- 用户只要一条提示词时，不输出完整资产库和完整分镜。\n- 用户只要创意方向时，不生成图片、视频与剪辑内容。\n- 用户要求完整 Skill 跑一遍时，才使用 A—H 全量结构。\n- 详细资料用于内部判断，不得机械复制整份资料到结果中。\n\n## 4. 输入判断\n\n先识别任务类型：\n\n- **A 模糊想法**：主动补全并给 3—5 个方向。\n- **B 明确母题**：补齐神明类型、显现方式、尺度参照、光影和环境异常。\n- **C 完整设定**：提取硬约束，只修补缺失项，不擅自改动核心设定。\n- **D 参考图**：先分析，再原创转化。\n- **E 只要提示词**：内部完成判断，只输出所需提示词和必要反向词。\n- **F 返修结果**：先诊断失败类型，再局部改写，不从头推翻全部内容。\n\n至少识别：输出类型、画幅、时长、母题、神明类型、场景、显现方式、尺度参照、色调、动态强度、参考图状态。\n\n未指定时默认：\n\n- 单图/视频画幅 16:9；竖版海报可用 3:4 或 9:16。\n- 深蓝灰绿、海雾白、少量黯金。\n- 一名背对镜头的人物 + 一个大型建筑或自然地标。\n- 环境先动，神明微动，人物最后做一次小反应。\n\n## 5. 执行流程\n\n### 阶段 1｜需求压缩\n\n把需求压缩成一行制作命题：\n\n> 在【场景】中，以【参照物】证明【神明类型】的超尺度存在，通过【遮蔽方式】和【环境异常】制造【核心情绪】，输出【形式/画幅/时长】。\n\n### 阶段 2｜概念选择\n\n无参考图时给 3—5 个方向；有参考图时先分析方法，再给 2—3 个原创方向。推荐方案必须说明为什么它最容易建立尺度、遮蔽和视频稳定性。\n\n### 阶段 3｜生产规划\n\n只选择当前任务需要的资产。不要默认把全部神明、场景、人物和氛围资产都生成一遍。\n\n### 阶段 4｜静态质量门\n\n进入视频前，首帧必须通过：\n\n- 主视觉焦点明确；\n- 神明与参照物比例成立；\n- 神明没有展示过多；\n- 暗部可读；\n- 可动元素已预留；\n- 构图不依赖视频运动才能成立。\n\n任何一项不通过，先返修首帧，不直接进入视频。\n\n### 阶段 5｜运动设计\n\n遵循：**环境微动 &gt; 光线变化 &gt; 神明局部微动 &gt; 人物一次微反应 &gt; 镜头极慢运动**。\n\n一个 5 秒镜头只完成一次主要异常升级，不切换场景，不让所有元素同时运动。\n\n### 阶段 6｜审核返修\n\n先判断失败属于：怪兽感、尺度不足、展示过多、画面过黑、动作过大、PPT 感、比例漂移或声音廉价，再调用对应返修规则。\n\n## 6. 输出强度\n\n根据用户要求自动选择：\n\n### 精简模式\n\n适用于单条提示词、单张图、单个 5 秒镜头。只输出必要结果与简短审核提醒。\n\n### 标准模式\n\n适用于一个完整概念。输出需求理解、推荐创意、所需资产、图片或视频提示词、关键审核项。\n\n### 完整模式\n\n适用于完整项目。按 A—H 输出： A. 需求理解；B. 创意方向；C. 资产表；D. 图片提示词；E. 分镜表；F. 视频提示词；G. 剪辑与声音；H. 审核清单。\n\n具体格式读取 `templates/OUTPUT_TEMPLATES.md`。\n\n## 7. 最终自检\n\n交付前确认：\n\n- 它看起来像神明，而不是普通怪兽吗？\n- 不看文字也能通过参照物感到超尺度吗？\n- 神明是否仍有大部分未被看见？\n- 环境是否在替神明“表演”？\n- 画面是否暗而可读？\n- 5 秒内是否只有一次主要变化？\n- 运镜和动作是否稳定、缓慢、克制？\n- 是否避开血腥、跳脸、打斗和廉价触手堆砌？\n\n有任意一项为“否”，不得直接标记为完成。", "extras": [], "cn": "克苏鲁恐怖巨神美学导演"}, {"slug": "cuyezhuyi", "desc": "深构苏联粗粝美学，一键生成纪念碑式视觉大片", "body": "苏联粗野主义风格Skill SKILL: Soviet Brutalist Cinematic Short Film Skill ID: libtv-industry/brutalist-film Version: 3.1 适用场景: 苏联粗野主义风格电影短片生成，保证人物一致性、风格稳定性与电影美学价值。\n一、Skill 定位与目标 本 Skill 用于生成具备以下特征的粗野主义风格短片：\n🏗️ 风格锚定：Base Prompt + 色调规范 + 禁止项锁死（不可动的风格核心） 🌊 最大发散：主题、故事、场景、角色、氛围、叙事结构、道具、对白、音效、转场全部由AI即兴创作，不设固定素材库 🧍 人物一致：主角形象通过 Lib Image 生成并锁定，全镜复用 🖼️ 环境定调：MJ V8.1 生成3张环境氛围参考图，锁定全片场景基调和色调，后续分镜以参考图为锚 🎬 景别丰富：强制多景别分布，禁止连续相同景别 💬 人物对白：每镜可生成人物对白/独白，支持中文/英文/俄语选择 🎞️ 高密度分镜：默认2.5秒/镜快切换，Beat拆分微镜头，强化故事张力 🔊 音效契合：根据故事氛围生成匹配的电影级环境音效（无背景音乐） 📦 流程可复用：6步标准流程，任何人按步骤均可生成高质量成片 二、风格核心锚点（全片必含，禁止随机化） 这是唯一不可动的部分。锚点之外的一切由AI即兴创作。\nBase Prompt——每镜必须包含 Soviet brutalist architecture, raw concrete texture, colossal geometric structures, monumental scale, cold grey atmosphere, volumetric fog, cinematic lighting, 8k resolution, photorealistic\n色调规范 主色调：冷灰 / 铁锈红 / 骨白 唯一暖色：远处单窗琥珀光（象征体制内部） 禁止出现：饱和暖色、绿植、现代元素 景别多样性强制规则 6镜短片必须覆盖至少 4 种景别，8镜及以上必须覆盖至少 5 种 景别代码及人物占比参考： ELS（极远景）：人物占画面 ≤3%，强调环境压迫 LS（远景）：人物占画面 5–15%，人物可辨认但仍渺小 MS（中景）：人物腰部以上，占画面 30–50% MCU（中近景）：人物胸部以上，占画面 50–70% CU（特写）：人物面部/手部/道具细节，占画面 70–90% ECU（大特写）：眼神/材质纹理，占画面 90%+ 禁止连续 2 镜使用相同景别 镜头运动规范 ✅ 允许：Hitchcock zoom / dolly zoom、push in、pull back / zoom out、tilt up/down、pan left/right、slow tracking、slow crane up/down、slow orbit ❌ 禁止：建筑物移动/升高/倒塌/变形、地面塌陷/隆起/位移、天空旋转、云层快速位移、任何物体不合理的物理运动 近景/特写优先 static 或极轻微 push in，禁止大幅运动 三、AI即兴创作规则（风格核心之外最大发散） 不设固定素材库。AI在风格锚点约束下即兴创作所有内容。\n创作原则 风格优先：所有即兴内容必须符合粗野主义美学（混凝土巨构、体制压迫、人的渺小、冷灰色调） 每次不同：每次运行Skill必须产出完全不同的故事/场景/角色/氛围，禁止重复使用上次的方案 具体而非抽象：生成的故事必须有具体的人物、动作、空间、情感，不是抽象概念描述 粗野主义气质检查：AI生成的每个元素都应问\"这属于粗野主义世界吗？\"——如果否，重新生成 AI即兴创作清单（每次运行全部重新生成） 创作维度 规则 风格约束 🎭 故事主题 AI即兴创作一个完整故事，含一句话设定 + 5个Beat 必须发生在粗野主义建筑环境中，人物渺小，体制压迫感 🌫️ 环境氛围 AI即兴创作一个环境氛围基调 必须是冷灰色调系，极端天气/光照条件优先 🏛️ 场景 AI为每镜即兴创作一个粗野主义场景 必须是混凝土巨构/苏联式建筑空间，每镜场景不重复 🧑 角色设定 AI即兴创作主角外貌/服装/气质 苏联时代服装，气质压抑/隐忍/麻木/坚定 🗝️ 象征道具 AI即兴创作1-2件跨镜道具 苏联时代物件，有象征意义，承载叙事功能 📖 叙事弧 AI即兴设计叙事结构 必须有明确情绪走向，结局可为悲剧/循环/虚无/觉醒 💬 对白 AI即兴创作每镜对白 短句冷硬风格，对白是画面延伸而非解释 🔊 音效 AI即兴创作环境音效描述 纯环境音无配乐，与氛围匹配 🎞️ 转场 AI为每镜衔接即兴选择转场 crossfade/fadeblack/dissolve，相邻不重复 故事生成指导（非固定模板，AI参考但不限于此） AI创作故事时应考虑以下粗野主义典型母题（可组合/变异/颠覆，不限于这些）：\n体制与个体：排队/审批/等候/被拒绝/被遗忘 记忆与遗忘：旧地址/旧照片/旧物件/找不到的房间/消失的痕迹 循环与困境：重复路线/无尽走廊/永远到不了的目的地/回到起点 孤独与等待：空旷广场/无人车站/等不到的人/永远不会举行的仪式 权力与渺小：巨型建筑下的人/仰望穹顶/面对高墙/在体制深处 时间与衰败：即将拆除的大楼/被遗忘的纪念碑/荒废的公共空间/雪覆盖一切 以上母题仅为参考方向，AI应自由发散创造新母题，只要符合粗野主义美学即可。\n四、标准工作流程（6步） ▶ STEP 1：风格确认 + AI即兴创作 触发：用户启动 Skill 后立即执行。\n流程：\nAI即兴生成3个完全不同的故事方案（每个含：标题 + 一句话设定 + 5个Beat + 环境氛围 + 主角概述） 向用户展示3个方案，用户选择一个或要求重新生成 用户选定后，AI即兴补充：象征道具、叙事弧结构、音效风格、对白语言 询问项（共4项）：\n故事方案（单选）：\n方案A：[AI即兴生成] 方案B：[AI即兴生成] 方案C：[AI即兴生成] 🎲 重新生成（AI再生成3个全新方案） 自定义（用户描述需求，AI据此生成故事） 对白语言（单选）：\n中文 English Русский（俄语） 无对白（纯环境叙事） 画面比例（单选）：\n16:9（横幅，影院感） 21:9（超宽银幕，史诗感） 9:16（竖幅，社交媒体） 总时长 × 分镜节奏（单选）：\n15秒（6镜 × 2.5秒）——快节奏短片 30秒（12镜 × 2.5秒）——标准短片 40秒（16镜 × 2.5秒）——加长短片 60秒（24镜 × 2.5秒）——短片电影 自定义 ⚙️ STEP 1 自查清单：\n3个故事方案已展示，用户已选定 选定方案含：标题/设定/5个Beat/环境氛围/主角概述/象征道具/叙事弧/音效风格 对白语言已确认 镜数 = 总时长 ÷ 2.5秒，已计算并记录 所有选定参数写入锚点文件 故事方案通过粗野主义气质检查（混凝土巨构/体制压迫/人的渺小/冷灰色调） ▶ STEP 2：环境氛围参考图生成（MJ V8.1） 目标：用 MJ V8.1 生成3张环境氛围参考图，锁定全片场景基调、色调和建筑质感。后续所有分镜图以此3张为视觉锚。\n生成规则：\n模型：Midjourney V8.1，比例与 STEP 1 一致 生成数量：固定3张，分别对应： 参考图1：全景环境——故事核心建筑空间的远景/大远景，展现粗野主义巨构全貌 参考图2：中景空间——人物活动的主要场景空间，走廊/广场/室内等，展现人在建筑中的尺度关系 参考图3：氛围细节——材质纹理/光影特写/天气氛围，展现色调和质感基底 每张 prompt 结构： [Base Prompt], [STEP 1环境氛围关键词], [参考图类型描述], [AI即兴场景细节], [光影], [情绪氛围], Blade Runner 2049 visual quality 参考图中不包含人物，纯环境/建筑/氛围 3张图必须色调统一（冷灰/铁锈红/骨白 + 琥珀窗光），视觉风格一致 生成后向用户展示，确认色调/氛围/建筑质感满意后才进入 STEP 3 参考图用途说明：\n这3张图不是分镜，是全片的视觉锚点 后续 STEP 4 中 Lib Image 生成每镜分镜时，会引用这3张参考图来限定环境基调和色调 参考图确保全片场景风格统一，不会每镜跳变 ⚙️ STEP 2 自查清单：\n3张环境参考图已生成（全景环境/中景空间/氛围细节） 3张图色调统一（冷灰/铁锈红/骨白 + 琥珀窗光） 参考图不含人物 3张图建筑质感一致（粗野主义混凝土巨构） 3张 node_key 写入锚点文件 用户已确认环境氛围效果 ▶ STEP 3：主角形象生成（Lib Image） 目标：与用户共同设计主角，生成主角锚点图。\n询问项（ask_human）：\n🎲 一键随机主角（AI即兴生成角色描述后直接生图） 手动逐项设置（共5项）： 性别：男 / 女 / 模糊不明 年龄段：青年（20-30）/ 中年（35-50）/ 老年（55+） 服装：苏联工人棉服 / 军用大衣 / 破旧民用棉袄 / 极简黑色长衣 / 自定义 配件（可多选）：旧皮帽 / 毛线帽 / 锈红色围巾 / 破旧公文包 / 无 气质：沉默隐忍眼神空洞 / 疲惫坚定 / 彻底麻木 / 愤怒压抑 一键随机规则：AI即兴生成角色全貌（性别/年龄/服装/配件/气质），配件与STEP 1选定的象征道具联动，生成完整角色描述展示给用户确认。\n角色锚点图生成：\n模型：Lib Image（默认） Prompt：[完整角色描述], full body front view, neutral grey concrete background, character reference sheet, Soviet brutalist atmosphere, cinematic lighting, 8k resolution, photorealistic, no action, standing pose 可选：引用STEP 2环境参考图作为背景锚定 reference: {{环境参考图NodeKey}} 用户确认后写入锚点文件，标记 主角锚点·已确认 ✅ 若 Lib Image 生成效果不理想，可切换至 MJ V8.1 作为备选 ⚙️ STEP 3 自查清单：\n角色参数全部确定（随机或手动） 象征道具与角色配件联动检查 主角锚点图已生成并用户确认 node_key 写入锚点文件，角色描述完整记录 ▶ STEP 4：分镜规划 + 分镜图生成（Lib Image） 目标：规划完整分镜叙事结构，用 Lib Image 直接生成含主角的分镜图（以STEP 2环境参考图为视觉锚）。\n分镜规划规则：\n节拍驱动分镜：按选定的故事5个Beat + 叙事弧展开。高密度分镜（2.5秒/镜），Beat拆分规则： 每个Beat拆分为2-5个微镜头（根据总时长和Beat密度） Beat内部的微镜头通过景别切换、视角变化、动作分解制造节奏感 Beat之间用转场标记分界（fadeblack=时间跳跃，dissolve=记忆转换） 示例：Beat 1「抵达」可拆为 [ELS全景]→[MS中景]→[CU手部特写]→[MCU面部犹豫] 场景即兴创作：AI为每镜即兴创作一个粗野主义场景，禁止同一场景出现两次（循环弧除外，首尾可相同） 场景必须符合风格核心：混凝土巨构、苏联式建筑空间、巨物压迫感 每镜场景需标注叙事功能（出发/行进/转折/抵达/空旷等），功能与叙事弧匹配 每镜必须包含四项叙事要素： 具体动作（人物在做什么，不能只是「站着」或「走着」） 叙事信息（这镜交代了什么——发现/转折/阻碍/确认/放弃） 情绪转折（这镜的情绪相比上一镜的变化方向——升级/回落/停滞/爆发） 对白/独白（如选定了语言）：每镜一句对白，≤20字/词，类型包括：开口说/内心独白/回忆碎片/自言自语/沉默 对白创作规则： 中文：短句，冷硬风格，≤20字。示例：「这里以前是邮局。」「没有人了。」「风太大了。」 English：短句，cold and minimal. 示例：「No one here.」「The address is wrong.」 Русский：短句，суровый стиль. 示例：「Здесь никого нет.」「Поздно.」 对白节奏：前1/3少对白（1-2句），中间段密集（每镜1句），结尾骤减或沉默 对白与画面关系：对白是画面的延伸而非解释——画面展示「人站在空房间」，对白说「他搬家了」（补充），而非「这是一个空房间」（重复） 象征道具：AI即兴创作的1-2件道具在分镜中明确出现时机，道具出现/消失本身也是叙事信号 每镜标注景别代码（ELS/LS/MS/MCU/CU/ECU） 景别分布检查：覆盖 ≥4 种（6镜）/ ≥5 种（8镜及以上），无连续 2 镜相同景别 节奏检查： 前2/3至少2个行动镜（人物在移动/做事/与道具互动） 后1/3至少1个情绪镜（近景或特写，情绪爆发或沉淀） 每3-4镜出现一次景别跳变（如ELS→CU），制造视觉冲击 全片至少1个沉默镜——无动作、无对白、只有环境的静止镜头 向用户展示分镜大纲（含Beat编号/微镜头编号/场景/景别/动作/叙事信息/情绪转折/对白/象征道具列），确认后再生成图片 分镜图生成规则：\n模型：Lib Image（直接生成含主角的分镜图，无需再替换人物） 每镜 prompt 结构： [Base Prompt], [环境氛围关键词], reference: {{环境参考图1 NodeKey}}, reference: {{环境参考图2 NodeKey}}, reference: {{环境参考图3 NodeKey}}, character: {{主角锚点NodeKey}}, [景别关键词], [AI即兴场景细节], [主角动作描述], [景别匹配的人物占位], [象征道具出现描述（如适用）], [光影], [情绪氛围], [镜头运动暗示], Blade Runner 2049 visual quality 景别匹配的人物描述： ELS/LS：a lone figure in the distance / a solitary silhouette far away MS：a lone figure from the waist up MCU：a lone figure from the chest up, face partially visible CU：close-up of a figure's weathered hands / close-up of a figure's hollow eyes ECU：extreme close-up of cracked concrete texture and a figure's eye reflection 景别适配：近景/特写镜头额外强调 focus on [face expression / hands / clothing texture], maintain the [MCU/CU/ECU] framing, figure fills the frame 象征道具出现镜头额外强调：[道具描述] clearly visible in [hand/pocket/shoulder], [道具细节] 最多10张并行，超出分批执行 分镜图质量标准：\n✅ 主角形象与 STEP 3 锚点一致（服装/配件/气质） ✅ 环境基调与 STEP 2 参考图一致（色调/建筑质感/氛围） ✅ 景别与分镜规划匹配 ✅ 近景/特写中人物细节清晰，情绪可读 ✅ 象征道具在指定镜头中清晰可见 ❌ 主角形象偏差 → 强化主角锚点描述重新生成 ❌ 环境基调跳变 → 强化环境参考图引用重新生成 ❌ 近景人物仍很小 → 加入 figure fills the frame 重新生成 ⚙️ STEP 4 自查清单：\n分镜大纲含Beat编号/微镜头编号/场景/景别/动作/叙事信息/情绪转折/对白/象征道具列，已获用户确认 每镜场景由AI即兴创作且符合粗野主义风格 每镜场景不重复（循环弧首尾除外） 每镜含具体动作 + 叙事信息 + 情绪转折 + 对白（如已选语言） 对白节奏：前1/3少，中间密集，结尾骤减或沉默 对白与画面非重复关系 每Beat拆分为2-5个微镜头 前2/3至少2个行动镜，后1/3至少1个情绪镜 每3-4镜出现一次景别跳变 全片至少1个沉默镜 景别分布：≥4种（6镜）/ ≥5种（8镜+），无连续相同 所有图片比例与STEP 1一致 每张图含Base Prompt + 环境氛围 + 景别关键词 + 环境参考图引用 + 主角锚点引用 主角形象与STEP 3锚点一致 环境基调与STEP 2参考图一致 近景/特写人物尺寸与景别匹配 象征道具在指定镜头清晰可见 图片全部生成，node_key写入分镜文件 用户已确认分镜图效果 ▶ STEP 5：音效生成（无配乐） 本 Skill 仅生成环境音效，不生成背景音乐。音效作为画面氛围的听觉支撑，不主导情绪叙事。\n目标：AI即兴创作与全片环境氛围精准匹配的电影级环境音效。\n执行规则：\n模型：Seedance 2.0（音效模式） 音效时长 = 视频总时长 + 5秒缓冲 AI根据STEP 1即兴创作的环境氛围，生成音效prompt： Cinematic environmental sound design, [AI即兴音效描述], continuous [ambient duration] seconds, no music, no dialogue, no voiceover, pure atmospheric audio, Soviet brutalist soundscape, high quality audio, realistic field recording style 音效创作指导（AI参考，不限于此）：\n暴风雪类：howling wind gusts, ice crystals colliding, muffled distant industrial hum, footsteps crunching on packed snow 室内回声类：heavy reverb, droplets, echoing footsteps, distant mechanical drone 工业类：continuous factory drone, steam releases, heavy machinery idling, metallic resonance 极静类：near-total silence, breath, clothing rustle, footsteps on concrete or snow 废墟风声类：wind through broken windows, door panels banging,无人回响 ⚙️ STEP 5 自查清单：\n音效描述由AI即兴创作，与STEP 1环境氛围匹配 音效时长 ≥ 视频总时长 node_key 写入 四个 15 秒段落，形成完整暗黑童话小短片。\n- 75 秒：五个段落，适合作业、比赛、氛围短片。\n- 90 秒：六个段落，适合更完整的童话寓言短片。\n\n不负责：\n\n- 血腥、肢解、恶心怪物、丧尸、跳吓和廉价鬼片。\n- 现代都市恐怖片、赛博恐怖、脏乱废墟。\n- 让角色尖叫、奔跑、打斗或突然变怪物。\n- 复刻具体影视角色、具体动画形象或已有 IP。\n- 只输出风格概念而不落到视频分镜和提示词。\n\n## 输入\n\n用户可以只给一句话，也可以提供完整生产需求。\n\n可输入字段：\n\n- 主题：例如“旧阁楼里苏醒的瓷娃娃”“月光森林兔子玩偶”“旧剧场最后的演员”。\n- 角色：瓷娃娃少女、木偶小王子、黑蕾丝兔子玩偶、玻璃眼睛女巫、发条公主。\n- 场景：旧玩具剧场、哥特城堡、月光森林、尘封阁楼、娃娃屋、旧玩具柜。\n- 道具：发条钥匙、音乐盒、烛台、怀表、兔子玩偶、红幕布、玻璃眼珠、旧信件。\n- 情绪：孤独、安静、被遗忘、刚被唤醒、温柔诡秘。\n- 微恐程度：默认 2/5；血腥程度默认 0/5。\n- 时长与比例：5s / 15s / 30s / 60s / 75s / 90s；默认 9:16。\n- 参考图：只能提取材质、光影、氛围、色彩和构图，不复制具体人物和服装。\n- 交付项：角色图、场景图、首帧、尾帧、分镜、视频提示词、剪辑方案、审核返修。\n\n默认值：\n\n- 默认目标：完整视频生产包。\n- 默认比例：9:16。\n- 默认时长：用户没说时给 15 秒结构 + 60 秒扩展结构 + 5 秒验证镜头。\n- 默认角色：一个精致瓷娃娃少女或发条玩偶。\n- 默认场景：旧玩具剧场 / 哥特阁楼 / 月光森林三选一。\n- 默认道具：发条钥匙、旧音乐盒、烛台。\n- 默认动作：极克制微动作。\n- 默认声音：八音盒、发条、木偶关节、烛火、风声、木地板轻响。\n\n## 输入使用\n\n必须严格遵守：\n\n- 用户指定的角色、场景、道具、时长、比例、微恐边界和禁止项。\n- 参考图的风格方向，不复制具体内容。\n- 玩偶材质锚点：瓷质皮肤、玻璃眼睛、木偶关节、天鹅绒、蕾丝、旧金属发条。\n- 视频动作幅度：微动作，不奔跑、不尖叫、不打斗、不突脸。\n- 血腥程度为 0，除非用户明确要求也不能做血腥内容。\n\n可以自动补齐：\n\n- 角色身份、道具寓意、空间关系、悬念点、结尾画面、声音设计、转场、返修词。\n- 5 秒验证镜头，用来测试角色一致性和玩偶材质。\n- 60 秒及以上的段落结构。\n\n少问问题。只有这些情况才追问：\n\n- 用户要商业片但没有时长、比例或产品信息。\n- 用户指定角色但外观完全缺失。\n- 参考图风格冲突严重。\n- 用户要求明显血腥、低俗恐怖或复刻 IP，需要改方向。\n\n## 内部流程与 Knowhow\n\n### 1. 先判断这是不是“视频任务”\n\n如果用户说“做视频 / 完整流程 / 分镜 / 60 秒 / 75 秒 / LibTV / Codex / 图生视频 / 逐镜头提示词 / 优化 skill”，必须按视频生产包处理。不要只做角色图、海报或 5 秒模板。\n\n如果用户只要求图片，也要把图片定义为“角色资产 / 场景资产 / 首帧 / 尾帧”中的一种，方便后续视频扩展。\n\n### 2. 暗黑童话玩偶风的正向判准\n\n好的结果应该满足：\n\n- 精致而不是脏乱。\n- 微恐但美丽，不靠血腥和跳吓。\n- 玩偶材质明确：瓷皮、玻璃眼、木偶关节、发条、蕾丝、天鹅绒。\n- 动作克制：像沉睡的玩偶被轻轻唤醒。\n- 道具会讲故事：发条、音乐盒、烛台、影子、怀表能制造异常。\n- 场景有童话感：旧剧场、城堡、阁楼、月光森林，而不是现代房间。\n- 光影高级：冷月光、暖烛光、灰尘微粒、浅景深、暗部有层次。\n- 视频有递进：空间安静 → 道具异常 → 玩偶微动 → 悬念收尾。\n\n### 3. 童话悬念公式\n\n每条短片先写“童话悬念公式”，再写分镜：\n\n被遗忘的空间：观众先进入一个安静精致的空间。\\\n核心玩偶：她/它像物件一样静止。\\\n触发道具：发条、音乐盒、烛台或怀表出现异常。\\\n微动作：玩偶只做一个小动作。\\\n不确定性：影子、眼神或声音暗示“它醒了”。\\\n悬念收尾：不解释，不血腥，只停在一个美丽又不安的画面。\n\n### 4. 时长结构\n\n5 秒：一个微动作。\\\n首帧稳定 1s → 微动作 2s → 道具/光影响应 1s → 悬念定格 1s。\n\n15 秒：一个悬念桥段。\\\n0-3s 建立童话空间；3-7s 玩偶出现微妙异常；7-11s 道具或影子变化；11-15s 玩偶看向镜头或定格。\n\n30 秒：两个异常递进。\\\n0-8s 空间和玩偶；8-15s 第一个微动作；15-23s 道具异常扩大；23-30s 悬念尾帧。\n\n60 秒：四段。\\\n0-15s 空间建立；15-30s 玩偶苏醒；30-45s 异常扩大；45-60s 悬念收尾。\n\n75 秒：五段。\\\n0-15s 童话空间；15-30s 玩偶出现；30-45s 道具自启；45-60s 影子/灯光异常；60-75s 玩偶微动作与未知结尾。\n\n90 秒：六段。\\\n在 75 秒基础上增加“旧记忆闪回或舞台重复动作”段，但仍保持慢节奏和微动作。\n\n### 5. 资产规划\n\n视频前必须先规划资产。资产编号统一使用：\n\n- DDF-CHAR-01：主角玩偶\n- DDF-EXPR-01：表情 / 眼神资产\n- DDF-STATE-01：角色状态资产\n- DDF-SCENE-01：场景资产\n- DDF-PROP-01：核心道具\n- DDF-LIGHT-01：光影氛围\n- DDF-FIRST-01：首帧\n- DDF-LAST-01：尾帧\n- DDF-SHOT-01：镜头关键帧\n\n资产表至少包含：资产编号、名称、类型、用途、外观描述、材质描述、视频一致性锚点、图片提示词、负面提示词。\n\n角色资产要写清：脸、眼睛、关节、服装、发条、体态。\\\n场景资产要写清：空间布局、角色位置、主要光源、道具摆放。\\\n道具资产要能推动剧情：音乐盒启动、发条转动、烛火偏移、影子异常。\\\n首帧必须安静，动作还没发生。\\\n尾帧必须悬念明确，适合定格和加字幕。\n\n### 6. 图片提示词写法\n\n图片提示词必须服务视频一致性。\n\n必须包含：\n\n- 暗黑童话、精致玩偶、哥特细节。\n- 瓷质皮肤、玻璃眼睛、木偶关节、天鹅绒、蕾丝、发条、旧玩具。\n- 月光、烛光、灰尘微粒、浅景深、暗部层次。\n- 场景干净精致，不脏乱、不血腥。\n- 构图适合视频首帧，主体清楚，动作幅度低。\n\n### 7. 分镜表\n\n视频分镜必须输出表格，字段为：\n\n镜头编号｜时长｜段落功能｜画面｜角色动作｜道具变化｜情绪｜光影｜运镜｜音效｜用到资产｜视频提示词\n\n分镜规则：\n\n- 每个镜头只表达一个核心变化。\n- 动作少，情绪强。\n- 不靠尖叫、奔跑、跳吓制造恐怖。\n- 运镜优先固定机位、极慢推进、轻微横移。\n- 每段结尾有可剪辑的停顿画面。\n- 同一角色的脸、发型、服装、材质不能变。\n- 不新增无关人物。\n- 不突然换空间。\n\n### 8. 逐镜头视频提示词\n\n每个镜头都必须有独立视频提示词。提示词结构：\n\n- 时长与比例：\n- 用到资产：\n- 首帧构图：\n- 角色状态：\n- 角色动作：\n- 道具变化：\n- 场景运动：\n- 运镜：\n- 光影氛围：\n- 音效：\n- 结尾落点：\n- 稳定性要求：\n- 负面限制：\n\n写法重点：\n\n- 明确“只做一个微动作”。\n- 明确“角色脸、发型、服装、瓷质皮肤、木偶关节不变”。\n- 明确“道具变化很慢，不惊吓”。\n- 明确“固定机位或极慢推进”。\n- 禁止变脸、变衣服、奔跑、尖叫、突脸、血腥、廉价鬼片。\n\n### 9. 剪辑、声音与调色\n\n剪辑要像暗黑童话寓言，不像恐怖混剪。\n\n推荐：\n\n- 镜头停留长，少切镜。\n- 使用烛火虚焦转场、幕布暗部遮挡、发条特写切换、月光扫过转场。\n- 音乐：八音盒、慢速钢琴、钟琴、低频弦乐、旧剧场环境。\n- 音效：木偶关节轻响、发条旋转、音乐盒齿轮、烛火、风声、木地板、远处钟声、玻璃轻响。\n- 调色：深蓝、暗红、象牙白、旧金色、黑色天鹅绒；冷月光和暖烛光对比。\n- 字幕：像童话旁白，短，不解释过多。\n\n不使用尖叫、爆音、鬼叫、血肉声、强跳吓、现代电子恐怖声效。\n\n### 10. 返修逻辑\n\n小修：\n\n- 微恐不够：增加道具自启、影子偏移、烛火反常，不加血腥。\n- 玩偶感不够：强化瓷皮、玻璃眼、木偶关节、发条、旧玩具质感。\n- 氛围不够：强化月光、烛光、灰尘、浅景深、暗部层次。\n- 动作略大：改为单一微动作，延长停顿。\n\n重跑：\n\n- 角色变脸、换衣服、变成真人或怪物。\n- 出现血腥、恶心怪物、跳吓、奔跑尖叫。\n- 场景变成现代房间或廉价鬼片。\n- 手指/脸部崩坏严重。\n- 首帧构图完全破坏。\n- 道具或角色关系丢失，悬念不可读。\n\n## 输出\n\n当用户要完整视频时，必须输出：\n\nA. 需求理解\\\nB. 童话悬念主线\\\nC. 视频结构表\\\nD. 资产表\\\nE. 图片提示词\\\nF. 分镜表\\\nG. 逐镜头视频提示词\\\nH. 剪辑、音乐、音效、字幕方案\\\nI. 审核清单与返修建议\n\n当用户只要单镜头，也至少输出：需求理解、首帧提示词、5 秒视频提示词、声音和审核标准。\n\n## 自检\n\n输出前逐项检查：\n\n- 这是视频生产包，不是只写海报或角色图。\n- 有清晰童话悬念主线。\n- 资产能支撑视频一致性。\n- 每个镜头只有一个核心变化。\n- 动作克制，像玩偶被轻轻唤醒。\n- 有首帧和尾帧控制。\n- 有逐镜头视频提示词，不只有总提示词。\n- 有剪辑、声音、调色和返修方案。\n- 没有血腥、跳吓、廉价鬼片、现代都市恐怖。\n- 正向判准在前，禁止项只作为边界。\n\n## 何时问用户\n\n只在这些问题会显著影响成片时追问：\n\n- 商业片需要确认时长、比例、品牌或产品信息。\n- 用户指定角色但没有任何外观信息。\n- 用户给的参考图风格冲突严重。\n- 用户要求血腥、跳吓或复刻 IP，需要改成精致暗黑童话方向。\n\n其他情况直接给出一个可执行版本。", "extras": [], "cn": "暗匣童话玩偶全流程导演"}, {"slug": "donghua-vfx-styler", "desc": "快速为你的角色添加炫酷特效", "body": "## 用途\n\n本 Skill 专注于为当前角色设计具有视觉冲击力的国漫风格功法特效镜头。提供从剧本、分镜到 AI 视频生成提示词的全流程创作支持，主打华丽粒子光效与流畅打斗感。\n\n## 适用输入\n\n- **剧情基础**：玄幻背景、故事梗概或打斗片段描述。\n- **核心设定**：角色人设、角色图、功法招式名称（如剑气、法阵、雷霆）。\n- **视频规格**：画幅尺寸（横/竖屏）、特效偏好色调、短片时长。\n\n## 操作步骤\n\n1. **剧本策划**：根据当前角色的特性形象，撰写国漫风格打斗脚本，规划玄幻色彩浓厚的动作节奏。\n2. **视觉设计**：根据功法名称锚定核心视觉元素，设计流光、阵法或真气特效。\n3. **分镜编排**：制作15s的长动画动态分镜描述，灵活运用特写、慢动作与大开大合的运镜手法，添加更多大动作的姿势描写。\n4. **提示词编写**：生成高质感 AI 提示词（Prompt），包含前置质量提示词：顶级院线级3D国漫风格，次世代超写实，仙侠超现实主义，PBR物理材质渲染，高精度角色建模，UE5影视级光影质感。\n\n## 输出要求\n\n- 根据当前角色，提供逻辑严密的打斗分镜脚本及对应的视觉描述。\n- 产出适配当前角色的炫酷特效，包括视频生成的中英双语 Prompt。\n- 确保视觉质感符合现代国漫影视动画的高端审美（如粒子效果、华丽光影）。\n\n## 注意事项\n\n- 建议明确特效主色调（如“冰蓝”或“熔岩红”）以保证视觉统一性。\n- 默认生成横向画幅（16:9），如有竖屏短视频需求请提前告知。\n- 分镜之间要有紧密丝滑的连续性。", "extras": [], "cn": "国漫终极特效生成"}, {"slug": "dreamcore-generator", "desc": "从概念到成片一体化创作梦核视觉短片", "body": "## 一套梦核 look + 三档情绪(开拍前卡选情绪档,全片统一)\n\ndreamcore 只有**一套 look**(低饱和、低对比、抬黑位、高柔光、35mm 颗粒、超现实但写实),靠**情绪档**调粉/蓝配比与冷暖。下面英文子句直接取用:**「调色子句」用于 MJ 场景图,「前置风格句」放在 Seedance prompt 第一句。**\n\n### 甜暖怀旧(warm,偏粉)\n\n- 调色子句:`dreamcore aesthetic, surreal yet photorealistic, desaturated washed-out pastel grade leaning blush-pink and cream, warm hazy afternoon glow, soft diffused light with gentle bloom, lifted matte blacks, low contrast, fine 35mm film grain, gentle soft focus`\n- 前置风格句:`Warm dreamcore music video frame, surreal yet photorealistic, blush-pink and cream desaturated pastel palette, soft hazy afternoon glow with gentle bloom, lifted matte blacks and low contrast, fine 35mm grain, weightless dreamy slow motion.`\n\n### 空灵纯净 / 失重忧郁(cool,偏蓝)\n\n- 调色子句:`dreamcore aesthetic, surreal yet photorealistic, desaturated washed-out pastel grade leaning powder-blue and lilac, cool misty pale silvery light, soft diffused glow, lifted matte blacks, low contrast, fine 35mm film grain, gentle soft focus`\n- 前置风格句:`Cool ethereal dreamcore music video frame, surreal yet photorealistic, powder-blue and lilac desaturated pastel palette, cool misty pale light with soft glow, lifted matte blacks and low contrast, fine 35mm grain, weightless dreamy slow motion.`\n\n### 微寒梦魇(uneasy,灰蓝)\n\n- 调色子句:`dreamcore aesthetic, surreal yet photorealistic, muted desaturated palette leaning grey-blue, flat overcast soft light, faint emptiness and stillness, lifted matte blacks, low contrast, fine 35mm film grain, gentle soft focus`(仍柔光低饱和,靠空旷/静止表达不安,不加恐怖元素)\n- 前置风格句:`Faintly uneasy dreamcore music video frame, surreal yet photorealistic, muted grey-blue desaturated palette, flat overcast soft light, a sense of empty stillness, lifted matte blacks and low contrast, fine 35mm grain, weightless slow motion.`\n\n---\n\n## 固定种子与出图规格(速查)\n\n> **全局默认**:MJ 画质\"自适应\"、Lib Image\"标准画质\";**每条 MJ prompt ≤ 1024 字符**;所有 MJ 场景图统一 **V8.2**。提示词**英文书写**(参数/种子代码保持原样)。\n\n- **造型图 = Seedream 5.0 Pro**(**2K、无任何尾串/参数**):出**一张 16:9、白底的造型图,从左到右横排 4 个全身造型、4 套明显各不相同**,真人模特、脸与全身清晰;用户从这 4 个里**选 1 个**(选中锁为全片主造型)。**有造型参考图则作 Seedream 的图参考;人像/人脸参考图一律不喂 Seedream。** prompt 英文自然语言(性别/人种/造型方向 + 着装/人物底线),**不带任何** `--sref` **/** `--ar` **/** `--v` **/** `--no` **尾串**。\\\n  示例:`one 16:9 2K white-background styling sheet; the same [gender] [ethnicity] real adult model shown as four different full-body looks side by side, four clearly distinct outfits, all in the chosen mood's dreamcore styling direction (甜美怀旧 sweet doll / 空灵纯净 all-white nightwear+JK / 微寒梦魇 icy powder-blue — 见「造型语言」); for a male subject swap any skirt for trousers, keep the same fabrics and elements; clear face and full body, natural hands; modest tasteful fully-covered outfit, high modest neckline, opaque non-transparent fabrics, knee-length or longer skirt (or with matching modesty shorts); clean skin with no tattoos and no piercings; pure white seamless background, even soft studio light, photographic`\n- **三视图 = Lib Image**(强制,默认**标准画质**),造型确认后**据所选那套全身造型扩写 16:9 白底全身三视图**。**硬性:必须把用户选定的那张 Seedream 造型图作为图输入 / 参考连线接入 Lib Image**——不连线三视图会另起炉灶、与所选造型对不上,整步作废;三视图的**款式 / 颜色 / 廓形 / 面料 / 比例(及无人像时的脸)必须与所选造型图逐项一致**,只补出侧 / 背视角。**真人模特**;**排版强制:所有内容在一张图内、16:9,全身左/中/右三视(正/侧/背),不放头部特写/大头**;**有人像参考图→三视人脸用纯白圆形贴纸完全遮住 + 右下角中文小字「人脸单独提供 · 此图仅用于服装造型参考」**(真脸由原图在 Seedance 锁)、**无人像参考图→保留所选那套 Seedream 造型的脸**(脸即身份)。\\\n  要点:`using the selected styling image as image input/reference, expand it into a single 16:9 white-background turnaround; keep the exact same outfit (style / color / silhouette / fabric) and proportions as the input, only three full-body views — left / center / right (front / side / back) of the same real adult photographic model, no head close-ups, infer side and back consistently, clean skin no tattoos no piercings, pure white seamless background, even soft studio light, photographic`。**有人像参考图时**:`cover each face with a plain solid white circular sticker, add a small Chinese caption at the bottom-right: 人脸单独提供 · 此图仅用于服装造型参考`(无人像则保留脸、不加贴纸与标注)。\n- **场景图 = Midjourney V8.2**(默认**自适应**,prompt ≤ 1024 字),**固定 dreamcore 种子** `--sref 4658243766 --profile yp7vzjb`,**全景无人、零文字、超现实但写实**。\\\n  尾串:`… --sref 4658243766 --profile yp7vzjb --ar <16:9|4:3|9:16> --v 8.2 --no text, words, letters, numbers, captions, signage, logo, watermark, extra patterns, cartoon, illustration`\n- **视频 = Seedance 2.5**,输入 = 场景图 + 白底三视图(锁造型/身形)+ **人脸参考**(有人像参考图→原图/视频;无人像→所选那套 Seedream 造型的脸;**人像参考图不喂造型模型、只在此处喂**)+ **对口型段的音频切片(连线到音频输入口)**。\n\n---\n\n## 流程(逐阶段暂停确认)\n\n### 阶段 0 · 开拍前(一张问询卡,问完停下等上传)\n\n**开拍前问询卡(下面每一问都是「独立一问」,同一张卡里一问接一问;绝不把两问揉进同一问的选项,也不拆多张卡;条件问不适用时让用户\"留空/跳过\")。问完停下等用户上传音频/参考图。**\n\n1. **音频(单选)**:你有现成的歌曲 / BGM 吗?——`我有,稍后上传` / `没有,帮我生成`。\n2. **歌曲风格 + 主题(自由输入;仅第 1 问选\"没有\"时填,有音频留空)**:想要什么风格与主题?(dreamcore 曲风走 **dream pop / ambient / bedroom pop**,朦胧慢板大混响)\n3. **人声(性别 + 语言)**:人声用哪种?**性别(男 / 女)+ 演唱语言**(中文 / 英文 / 韩文 / …)。(上传音频可听辨预填,可改)\n4. **有无人像 / 造型参考图**:有人脸参考图(或 &lt;15s 视频)/ 造型参考图吗?——**只要有人像参考图 → 主角性别、人种一律以参考图为准,第 5 问留空**;没有则第 5 问照填。\n5. **角色人种(自由输入;仅第 4 问\"没有人像参考图\"时填)**:按第 3 问语言推荐(中文→亚洲、英文→欧美、韩文→亚洲…),可改。\n6. **字幕**:成片要不要字幕?要→选语言;不要→无字幕。(字幕只在阶段 5 叠加,生成画面永远零文字)\n7. **情绪档**:甜暖怀旧 / 空灵纯净 / 微寒梦魇(定粉/蓝配比)。\n8. **画幅**:16:9 / 4:3 / 9:16?\n9. **画质**:480p / 720p / 1080p?\n\n> **结论**:**主角性别 = 人声性别**;**人种 = 有人像参考图→随参考图(第 5 问留空)/ 无→按语言推荐并经用户确认**;**不单独问性别/人种,时长也不问**(由【选段】定)。9 问全在这一张卡里、一问一件事、各给各的干净选项。\n\n**音频就绪 / 音乐确认(先于切片)**:\n\n- **有音频** → 用用户上传的音频。\n- **无音频** → 按风格/主题 + 人声(性别/语言)生成一版带歌词人声(**曲风走 dream pop / ambient / bedroom pop**)→ **生成后暂停,等用户确认音乐满意**(可重做/微调),满意才切片。(生成时风格字段与歌词字段分开,别把描述词当歌词唱;音乐提示词 ≤ 1024 字。)\n\n**音频确认后必做两步(先于分镜与生视频)**:\n\n- **① 音频切片(+ 拿歌词)**:切成**多段连续、每段 ≤15s 的切片**(按对应视频秒数切分),同时**拿准确歌词——只供内部对齐口型/选段,绝不写进任何发给模型的 prompt**;对口型段每段切片将作**音频锚点连线喂 Seedance 2.5 驱动口型**。**切完停下等用户确认切片。**\n- **② 选段**:问\"**你想用哪几段来做这支 MV?**\"。**推荐连续的几段(每段 ≤15s)**(便于段间衔接);**推荐挑有人声/歌词的段做对口型,纯器乐段默认不做 lipsync**(器乐段只做梦核表演、不唱)。**选完即自动算出时长(= 各段秒数之和 = 视频段数),不再问\"想做多长\"**;段数由此步确定。\n\n**造型分流(按 Q4 有没有上传人像 / 造型参考图,走四种情况;都先\"理解造型方向 + 结合下方造型语言补写成完整 spec\",不丢图照搬。统一流程:Seedream 出一张 16:9 白底 2K 横排 4 造型 → 用户选 1 → Lib Image 据所选造型扩写三视图)**:\n\n> **铁律:人像/人脸参考图一律不喂造型模型(Seedream)**(Seedream 只接受**造型参考图**作图参考);**人脸参考图只在最后 Seedance 生视频时**与三视图一起喂(锁真脸;**发型由用户选:保持参考图发型 / 换成三视图发型**)。**三视图人脸怎么处理只看\"有没有真人像参考图\":有→纯白圆贴遮脸 + 右下角中文小字标注,无→保留所选 Seedream 造型的脸。**\n\n- **① 只有人像参考图**:人像**不喂 Seedream**;Seedream 按文字 spec 出四造型(无尾串)→ 选 1 → Lib Image 三视图、**人脸纯白圆贴完全遮住 + 右下角中文小字「人脸单独提供 · 此图仅用于服装造型参考」**;人像**仅 Seedance 时**与三视图一起喂(锁真脸;**发型用户选**)。\n- **② 只有造型参考图**:造型图**作 Seedream 图参考** + 补写 spec → Seedream 出四造型 → 选 1 → Lib Image 据所选造型**人脸+造型**出三视图、**人脸不打码**(所选造型的脸即身份、也作 Seedance 人脸参考)。\n- **③ 人像 + 造型都有**:**只把造型图作 Seedream 图参考、人像不喂** + 补写 spec → Seedream 出四造型 → 选 1 → Lib Image 三视图、**人脸纯白圆贴遮住 + 右下角中文小字标注**;人像**仅 Seedance 时**与三视图一起喂(锁真脸;**发型用户选**)。\n- **④ 都没有**:用**据人声语言+性别推荐、用户确认过的人种 + 性别** + 补写 spec,Seedream 出四造型(无尾串)→ 选 1 → Lib Image 三视图、**人脸不打码**(所选造型的脸即身份、并作 Seedance 人脸参考)。**不单独问性别/人种。**\n\n**dreamcore 造型语言(补写 spec 时对齐;英文书写;按三档情绪各一套、彼此拉开区分;全性别通用——男生把裙装一律换成裤装,面料/元素/色系不变;皮肤无纹身无穿孔;裙长守底线=及膝或更长 / 或配同色系安全裤)**:\n\n- **甜美怀旧(warm,偏粉 / 杏 / 奶)** — 参考:娃娃领、蕾丝纱裙、玛丽珍娃娃鞋、可爱头饰:\\\n  `nostalgic sweet doll styling — peter-pan / doll collar blouse, layered tulle tutu skirt (knee-length or with matching modesty shorts) or soft layered chiffon skirt, mary-jane doll shoes, striped or lace knee socks, ribbons / bows / patchwork hair accessories, soft bangs; warm pastel palette (blush-pink, apricot, cream); vintage doll-like sweetness`男:裙 → `soft tailored pastel trousers or cropped pants`,保留娃娃领上衣、缎带/蝴蝶结发饰(从简)、玛丽珍风鞋,同色系与面料不变。\n- **空灵纯净(白色系为主)** — 参考:睡衣元素、jk 校服元素、纯白层叠:\\\n  `ethereal all-white styling — nightwear-inspired layered white blouse with lace-trim bloomers, plus JK school-uniform elements (knee-length pleated skirt, sailor / doll collar, ribbon tie), soft chiffon layers, white knee socks, delicate white hair piece; pure innocent airy vibe; monochrome white / off-white / cream palette`男:裙 → `white JK-style shirt with ribbon tie and tailored white trousers, or white pajama-style layered shirt with lace-trim trousers`,同为纯白、睡衣/校服元素与柔纱面料。\n- **微寒梦魇(淡蓝 / 冷色系为主)** — 参考:淡蓝按扣背心裙、荷叶泡泡袖、手套、星星发饰:\\\n  `cool-toned dreamcore doll styling in icy powder-blue — button-front pinafore or vest over a white ruffle puff-sleeve top, matching gloves, star / snowflake hair clips, pleated hem (knee-length or with matching modesty shorts); faintly cold pristine uneasy mood; cool pastel palette (powder-blue, ice-blue, cool grey)`男:裙 → `icy powder-blue button-front vest over a ruffle-cuff shirt with matching tailored trousers and gloves`,同为冷调淡蓝、按扣/荷叶元素。\n\n最多一个稍亮点缀色,其余压在该档色系里;守着装底线(端庄全覆盖、无纹身穿孔、穿裙配同色系安全裤)。**这三套造型与上面三档情绪的「调色子句/前置风格句」一一对应**。\n\n### 阶段 1 · Final_Video_Spec(已并入开拍前卡)\n\n情绪档 / 画幅 / 画质**已在开拍前那张卡里问过**(第 7\\~9 项),此处不再另开卡。**时长不问——段数/总长由【选段】确定**(选了几段 ≤15s = 几段视频 = 总长),每段 = 一条 ≤15s,装配顺接。粗粝/梦感靠颗粒与调色,不靠低分辨率。\n\n> spec 随卡一并确认,无需单独暂停。\n\n### 阶段 2 · 故事板\n\n- **造型图**:按四种情况用 **Seedream 5.0 Pro 出一张 16:9 白底 2K、横排 4 个不同全身造型**(**无尾串**;只造型参考图作图参考、人像不喂)→ 用户**从 4 个里选 1** → **暂停确认** → 用 **Lib Image 据所选造型扩写 16:9 白底三视图**(**硬性:必须把选定的那张 Seedream 造型图作为图输入/参考连线接入 Lib Image**,不连线三视图会跑偏、与所选造型不一致、整步作废;三视图款式/颜色/廓形/面料/比例与所选造型图逐项一致;真人模特;**一张图内、全身左/中/右三视、不放大头**;**有人像参考图→人脸纯白圆贴遮 + 右下角中文小字标注、无→保留脸**)→ **再暂停确认**。**造型守底线**(端庄全覆盖、不大面积透明、高领、裙及膝或更长、皮肤无纹身无穿孔)。**全片服装造型锁定不变;仅用户明确要求换装时才再出\"造型1/造型2\"**。\n\n- **场景**(紧接三视图确认后):按选定段数(= 地点数)**先给 3–4 个开放场景选项、也允许自描述 → 用户选定用哪几个场景后立即按阶段 3 出图**;自描述则照其意 + 套情绪档调色 + 零文字 + 全景无人 + 超现实但写实。同一地点多分镜共用选中那 1 张。\n\n- **分镜脚本(生视频前必出、需确认,用表格)**:逐段逐镜列,列固定为 **段/镜号 | 音频切片(段级) | 画面(角色表演 + 场景 + 裂缝)| 时长(s)| 运镜(手持/升格)| 表演/表情 | 与上下段衔接**。**每段第一列后紧跟「音频切片」列,写清本段用**哪条切片\\*\\*(切片编号)+ **有人声(→对口型)/ 器乐(→不对口型)**——生视频时照此把该切片连线接入 Seedance,把音频写进表能显著降低\"漏连音频、口型/BGM 全丢\"的概率。示例:\n\n  段/镜音频切片画面时长(s)运镜表演/表情衔接1-1切片①(有人声→对口型)主角已在泳池间水面上,近景,开口跟唱4慢 push-in缓睁眼、轻呼吸、口型对上歌词开场即含人、不空镜1-2↑ 同段切片①连续运镜升起,中景4升格发丝飘动、若有所思承上镜方向连续运镜2-1切片②(器乐→不对口型)走入花海,中景4慢平移不唱、轻旋身承 1 段末镜:主体位置/运镜方向延续\n\n  **每 15s ≥4 镜**,标升格落点;**第一镜不要空镜——角色一开始就在画面**;**多段时每上下两段(上段末镜 ↔ 下段首镜)必须有逻辑 / 镜头语言关联**(动作承接、构图呼应、运镜方向、主体位置/情绪衔接),让段间干净切也顺;**全片不叠化**。**每段的「音频切片」是阶段 4 连线的依据——按表把对应切片连到 Seedance 音频输入口(硬性)。**\n\n- **音乐(阶段 0 已就绪:绑定/生成 + 切片 + 选段)**:此处按**所选各切片**的节拍标转场/升格落点;并标出**哪些段做对口型(有人声)、哪些器乐段不做**。\n\n> 暂停确认(造型图 + 三视图 + 场景图 + 分镜脚本 +(无音频时)音乐)。\n\n### 阶段 3 · MJ V8.2 场景图(在三视图确认后紧接执行)\n\n描述选定的全景空场景(空间类型 + 布局 + 重要物体 + **一道超现实裂缝** + 构图),**超现实但照片级写实、不含人、零文字/logo/图案**,套所选情绪档调色子句,接场景种子尾串(见速查)。**用户选定用哪几个场景后立即出图**:各地点各 1 组 4 张全景,**可一次性同时生成多组**,不必逐个串行等待;生成后**每个地点各自四选一**。同一地点多分镜共用选中那 1 张。\n\n> **每个地点都必须四选一确认**(可一起出、分别选);所有场景确认后再进入下一阶段。\n\n### 阶段 4 · Seedance 2.5 视频(每段一条,时长=该段音频向上取整后裁剪,一条一条生)\n\nprompt 结构(顺序,英文书写):\n\n1. **前置风格句**(按情绪档取甜暖/空灵/微寒,全片统一)。\n2. **角色组装 + 首帧含人物**:三视图锁造型/身形 + 人脸参考(**有人像参考图→原图/视频锁真脸;发型先问用户:保持参考图发型 / 换成三视图发型,按选择写进 prompt。无人像→以三视图为主,脸与发型取自它**)。写明\"脸取自人脸参考、造型取自三视图、发型按用户所选、放进场景图,保留真实长相\"。**场景图当\"空间/风格参考\",不要当成必走的空场首帧——第一镜角色就在画面里**,prompt 明确 `the character is already present in the very first frame, open on the subject (medium/close), do NOT begin with an empty room establishing shot`,避免开头空镜。**合规**:端庄全覆盖、不大面积透明、高领、裙不过短、皮肤无纹身无穿孔;**穿裙写** `wearing matching-tone modesty shorts underneath, fully covered and modest`。**服装造型与三视图完全一致、全片全程不变。**\n3. **对口型 + 音频连线(有人声的段)**:**照分镜表格该段「音频切片」列,把对应切片节点连线到 Seedance 2.5 的音频输入口**——硬性,不连线口型驱动与 BGM 都拿不到、整段废掉(表里已写清用哪条切片、是否对口型,照做即可)。把该段 **≤15s 音频切片作音频锚点接入**,人物**嘴型/下巴与传入音频完全一致**(`lips and jaw precisely synced to the incoming audio, natural gentle singing expression, dreamy and soft`);**严禁把真实歌词写进 prompt**;**纯器乐段角色不唱、但该段切片仍连线接入并作 BGM 保留**(`no singing, dreamy performance only`——不要写任何\"无音乐/无 BGM\")。\n4. **分镜**:`Shot1 …(camera continues / slowly moves to)… Shot2 …`,一条连续(时长=该段音频向上取整)、**≥4 镜**;镜头间靠**连续运镜/缓慢移动衔接**或少量**干净卡切**;**禁止写 dissolve / 叠化 / 淡入淡出 / morph**(AI 生成叠化通常糊脏)。每镜 = 景别 + 运动(慢手持/升格)+ 表演。\n5. **运动**:`slow dreamy camera, natural handheld with subtle breathing motion`;升格镜 `slow motion / overcranked, weightless floating`;一镜到底仅按需。\n6. **音频 + 时长 + 零文字**:生成画面**始终零文字/logo/无烧录字幕**(字幕如需在阶段 5 按所选语言叠加)。**每段靠连线接入的音频切片驱动口型 + 作 BGM**;**prompt 绝不出现** `no music` **/** `no audio` **/** `no sound` **/** `no BGM` **/** `无音乐` **这类字样**(会压掉口型与 BGM);传入音乐一律作 BGM 保留、不改原音频、**不写真实歌词**;器乐段只写\"角色不唱、只做表演\"。**时长 = 该段音频向上取整到整秒**,阶段 5 再按音频实际时长裁剪。负面 `text, words, letters, numbers, logo, watermark, extra patterns, cartoon, illustration, stiff, rigid, frozen, robotic motion, dissolve, crossfade, fade transition, morph, tattoo, piercing`(合规靠**正向词**实现,负面**不写**任何涉黄/暴露敏感词、也**不写 no music/no BGM**)。\n\n**表演默认**(用户没写时按 dreamcore 注入,每镜≥1 表情+1 动作,慢/轻):`serene wistful presence, slow ethereal movement, gentle gaze drifting, weightless dreamlike detachment, soft turning of the head, dress and hair drifting`。\\\n**通用治僵硬(每镜都加)**:`subtle breathing with chest gently rising and falling, hair and fabric micro-movement, expression slowly shifting (e.g. serene → faintly wistful), a slow soft blink, relaxed natural posture, natural unhurried lifelike movement easing in and out`(对口型时 `jaw and lips actually moving to the incoming audio`)。\n\n> 一条一条生,逐条确认。\n\n### 阶段 5 · 装配(video_assembler)\n\n多段顺接时,**每两段衔接处用干净切,但靠逻辑 / 镜头语言承接**(匹配动作 / 构图 / 运镜方向 / 主体位置 / 情绪,见分镜脚本)让切口顺;**全片不允许出现叠化 / 溶解 / cross-fade**(梦核也不闪切、不闪大字);**字幕/标题只叠加、绝不烧进生成画面**;logo PNG 可叠;**每段按该段音频实际时长裁剪**(生成时向上取整、此处裁回)。**音乐:不要把原音乐当单独一轨再拼进去——直接沿用各段生成视频里已自带的音乐**(生成时喂入并原样保留的那段音频),各段连自带音轨一起顺接即成连续配乐,口型与音乐完全对应、全片连续。**字幕(仅当卡里选了\"需要\")**:按所选语言把字幕**叠加**在成片上(只叠加、不烧进画面)。引导导出。\n\n---\n\n## 参考数据\n\n### 节奏 → 每 15s 镜数(dreamcore 版,硬底线 ≥4,以连续运镜衔接为主)\n\n情绪/节奏镜数转场与手法极慢空灵4一镜流动式连续运镜为主、几乎不切;长镜 + 升格,靠微动与表演不滞留慢板抒情4–5连续运镜衔接为主,偶尔干净卡切;升格落点明确中速律动5–6连续运镜 + 少量卡拍干净切;长短镜交替\n\n> 无论几镜,都在一条 ≤15s 里一次性生成;**镜头间靠连续运镜衔接,全片不做叠化/溶解**;段间靠承接的干净切,别全程生硬硬切。\n\n### 场景库(每情绪档取倾向,均为全景无人、含一道超现实裂缝、超现实但写实)\n\n- **甜暖怀旧**:怀旧少女卧室 · 室内泳池间 · 花海/草地 · 旧商场中庭 · 阳光客厅。裂缝:水面映出不存在的云、漂浮的泡泡、过曝到发光的窗。\n- **空灵纯净 / 失重忧郁**:云朵/天空卧室 · 无尽白走廊 · 水下房间 · 镜面无尽空间 · 纱幔房间。裂缝:失重漂浮、走廊无限延伸、水与空气界限消失。\n- **微寒梦魇**:空教室 · 旧 CRT 客厅 · 镜屋 · 雾中空旷场 · 静止的游乐场。裂缝:会动的静物、停住的旧钟、镜中慢半拍的倒影、雾里的静止。\n\n> \"超现实裂缝\" = 反常倒影/漂浮物/无尽延伸/会动的静物/过曝光斑等(超现实但写实,不血腥不惊悚)。长片地点不够可重访同一地点(换光线/裂缝)。\n\n### 注意\n\n- **开拍前只用一张问询卡**(音频有无 → 曲风+主题\\[仅无音频\\] → 人声性别+语言 → 有无人像/造型参考图 → 人种\\[仅无人像\\] → 字幕 → 情绪档 → 画幅 → 画质);**主角性别=人声性别、人种按语言推荐、时长由选段定,都不单独问**;问完停下等上传。\n- **无音频先生成音乐(dream pop/ambient)→ 暂停等用户确认满意 → 才切片**;切完确认切片,再选段。风格字段与歌词字段分开,别把描述词当歌词唱;音乐提示词 ≤ 1024 字。\n- **音频·口型·BGM(核心)**:切片(≤15s、连续)+ **拿准确歌词仅内部对齐、绝不写进 prompt** → 选段定时长;**生视频必须把选定音频切片连线到 Seedance 2.5 音频输入口(硬性)**、作音频锚点驱动口型;prompt 只写\"口型与传入音频一致\"、**不写真实歌词**;**传入音乐作 BGM 保留、不改原音频、prompt 不写 no music/no BGM**;**生成时长=音频向上取整→按实际裁剪**;器乐段不唱但切片仍连线作 BGM。**最终合成用各段生成视频自带音乐、不拼原音乐单独轨。**\n- **模型**:造型图 = **Seedream 5.0 Pro**(2K、无尾串、横排 4 造型、四选一);三视图 = **Lib Image**(16:9、全身左/中/右三视、无大头;**硬性:必须把选定的 Seedream 造型图作图输入/参考连线接入,不连则三视图跑偏、与所选造型不符、作废**;款式/颜色/廓形/比例与所选造型逐项一致;有人像→白圆贴遮脸+右下角中文小字,无→保留脸);场景图 = **MJ V8.2**(固定 dreamcore 种子 `--sref 4658243766 --profile yp7vzjb`);视频 = **Seedance 2.5**。**人脸参考图不喂造型模型、只在 Seedance 喂;造型参考图才作 Seedream 图参考。**\n- **发型**:有人像参考图时,生视频前问用户\"发型用参考图的 / 用三视图的\",按选择写 prompt;无人像时以三视图发型为主。\n- **服装造型全片锁定不变**(每条 prompt 强调与三视图一致);仅用户明确要求换装时例外。\n- **造型合规 + 人物底线**:端庄全覆盖、不大面积透明、高领、裙及膝或更长、非性化;**皮肤干净无纹身、无穿孔**(戒指/项链/发饰 OK);穿裙带同色系防走光安全裤;合规用正向词、负面区不写涉黄敏感词,`纹身/穿孔` 中性词可进负面。\n- **三视图排版**:一张图内、16:9,只全身正/侧/背三视、去掉所有大头;有人像→白圆贴遮脸 + 右下角中文小字「人脸单独提供 · 此图仅用于服装造型参考」。\n- **字幕**:仅当卡里选\"需要\"时,阶段 5 按所选语言叠加(不烧进生成画面)。\n- 不写真实偶像/歌手姓名、不写真实 MV 名当 prompt,复现美学不复现具体作品/某人;风格锚点用描述性词。\n- 用户只要片段/单镜、或已指定场景造型时,在不破坏 每段≤15s且时长=音频向上取整后裁剪/口型与音频一致/不写真实歌词/不改原音频/音乐用生成视频自带不拼单独轨/服装造型全程锁定/主角性别=人声/每15s≥4镜/全片不叠化/零文字规则下按需做。", "extras": [], "cn": "梦核美学"}, {"slug": "eastwood-western-style", "desc": "极静对峙瞬间爆发的枪战大片", "body": "# eastwood-western-style\n\n做莱昂内荒凉美学 + 伊斯特伍德式反英雄西部片时用本 skill。剧情**完全依据用户脚本/剧本框架**。**风格致敬,不宣称是其本人作品。** 本 skill 自足,场景工艺全内联。\n\n> 本环境适配(Flova→我方 13 工具):GPT Image 2/TextToImage/ImageToImage → `generate_image_v3`;Seedance 2.0/MultiModalToVideo → `generate_video_v3`;Suno/ElevenLabs/MiniMax(BGM/口哨/风铃/马刺/旁白) → `generate_audio`;text_editor → `write_file_v2`;video_assembler → `composite_video`;`<<<image_n>>>` → `reference_nodes` + `{{NodeKey}}`。**源\"仅 GPT Image 2 / 仅 Seedance 2.0\"模型唯一性 + 会员鉴权降级 = 本环境无该概念,删(用默认引擎)**;**super_resolution 超分/插帧(MediaKit)= 无该能力,删**——但\"避免高帧率、保 35mm 胶片质感\"的意图作为风格约束保留。**词栈/黄金模板原文英文保留**;composite_video 支持 per-track dB 与 clip trim(照搬),**变速(speed 1.5-2x)/黑场时长 composite_video 无原生参数 → 降级为剪辑指导性描述〔适配改写〕**。\n\n## 流程(每生成新资产前暂停确认)\n\n1. **全局设定(Final_Video_Spec)**〔`write_file_v2`〕:剧情**完全依据用户脚本**。8 字段模板:\n   - **Title**:项目名/决斗主题\n   - **Type**:动作/心理对峙/修正主义西部片\n   - **Aspect Ratio**:16:9(默认电影宽画幅)或 9:16(移动端,同步调整构图)\n   - **Resolution**:720p(默认)\n   - **Output Language**:旁白与角色台词的目标输出语言(English / Chinese)\n   - **Visual Style**:荒凉沧桑美学(Sergio Leone style, 褪色胶片, 特艺七彩, 逆光体积光)\n   - **Audio Tone**:莫里康内交响乐声学(Ennio Morricone, 孤独口哨, 风铃, 铸铁马刺)\n   - **Story Outline**:宿命决斗起承转合核心剧情梗概\n2. **设计故事板**〔暂停〕:核心角色/场景作 key_element;镜头遵循**极静(蓄势对峙)→极动(瞬间爆发)**,融眼部特写/超广角远景/低角度仰拍/缓慢推镜。远距离决斗先建**对峙空间锁**(见下)。\n3. **元素资产获取与校验**〔暂停锁定〕:见下\"元素资产管理\"。**全面核检机制**:资产建立完毕后,**逐一核对故事板所有 key_element(角色+场景)是否都成功绑定 asset_id;任何遗漏或未绑定成功严禁进入视频生成步骤**。\n4. **分镜视频**〔暂停·附对齐核检〕:`generate_video_v3`,单镜 **4–15s(严禁<4s)**;**双重强基准绑定**(角色 node + 场景四宫格 node)。**提示词对准与防漏检视**:生成每镜前对照分镜脚本多维核检——场景参考、人物参考(占位符绑定)、台词对白全部精准对齐无遗漏;每镜强制绑定所属场景 key_element 四宫格作 reference_image(防背景漂移/跳画);无场景绑定的分镜绝不允许。强连贯镜可绑前镜末帧作 reference_video。含对白绑角色 key_element_audio 保音色一致。\n5. **音频**〔暂停〕:见下\"音频资产\"。\n6. **合成**〔暂停·先展示所有单项成果〕:`composite_video` 蒙太奇拼贴,见下\"合成与剪辑动律\"。\n\n## 对峙空间锁(独特铁律)\n\n任何远距离决斗场景,故事板**必须先用远景/OTS 建立\"对峙空间锁\"**:A 方站位、B 方站位、两人距离、面对方向、屏幕左右/纵深轴线、**镜头轴线、子弹方向、中弹倒地方向**。后续所有 ECU/CU 局部特写**只能改变镜头尺度,不能改变角色间真实距离或站位**。\n\n## 多模态分析(用户参考材料)\n\n- **角色全身三视图检测**:检查上传是否为含正/侧/背的**全身**三视图。是→提取各角度形体比例/面部轮廓/发型/肤质/经典服饰细节(披风/毡帽/枪套)/配色/独特标记(伤疤/胡茬),合并输出高完整性描述。**若非三视图或为半身照/头像 → 判\"格式不匹配\",启动重构。**\n- **场景参考图检测**:检查是否为**无人物、多角度\"标准四宫格\"**(4 独立分格)。提取空间布局/核心建筑/代表性道具(吧台/墓碑)/色调(褪色大地色)/光影(强对比)。\n- **美学契合度验证(核心)**:评估是否具备西部片底色(高硬度对比光/沙尘感/风化材质/沧桑感);格式硬校验(角色须全身三视图,场景须无人物四宫格)。契合→标可直接绑定;**不契合(风格不符/角色非全身三视图/场景不合四宫格或含人物)→ 判\"格式/风格不匹配\",制定\"西部片风格转换与格式重构方案\"**(见下四宫格四格固定分配)。\n- **人声分析**:分析声音是否沙哑/深沉/干瘪/带沧桑感,录入 key_element_audio 维持配音一致。\n- **参考视频动态分析(三项,写入 shot 描述)**:①**镜头运动轨迹**(极慢面部推焦 Slow Zoom-in/Push-in、低角度平移 Low-angle Pan/Dolly);②**物理运动反馈**(拔枪动作瞬态频率、枪口烟雾扩散速率、受击身体物理震颤幅度);③**光影明暗质感**(强对比硬光比例 Chiaroscuro、空气尘埃密度)。\n\n## 元素资产管理(key_element 视觉定义)\n\n**处理策略(两路径)**:\n- **路径 A 用户已提供参考图**:完全契合(角色标准全身三视图 + 场景无人物四宫格 + 风格相符)→ 直接注册 asset_id 绑定。**不契合/格式不符 → 绝不直接绑定**,用 `generate_image_v3`(ImageToImage)以用户上传图为物理/面部参考重构:角色重构为西部片规范全身三视图(并排正/侧/背全身立绘,融宽沿毡帽/重胡茬/墨西哥斗篷/皮套/皮靴,极力保留原图面部标志);场景重构为无人物标准四宫格。\n- **路径 B 用户未提供**:`generate_image_v3`(TextToImage),16:9。\n\n**角色三视图构图规范**:强制**同一画布并排正/侧/背全身立绘**(定格脸部/警惕眼神/胡茬帽沿阴影/斗篷披风/腰间枪套/皮靴及整体剪影),展示 360° 服饰武器细节,**严禁半身照/头部特写/重叠画面**。\n\n**★三视图 prompt 五处硬约束(实测反复验证,缺一处必翻车)**:\n1. **写实锚点**:开头必须出现 `photorealistic`(不是 \"portrait\"/\"reference sheet\" 就自动等于写实——这两个词中性,不带任何倾向)。\n2. **负向排除渲染风格**:结尾必须加 `No illustration, no anime, no cartoon.`——这条跟\"no half-body/no cropping\"这类**构图**约束是两回事,**构图约束管切法,这条管像照片还是像画**,必须都写、不能互相替代。**实测教训**:同一版本 prompt 只把 \"illustration of\" 换成 \"reference sheet of\"、不加这句负向排除,照样会生成卡通感结果——只要通篇没出现 `photorealistic` + `No illustration, no anime, no cartoon`,不管用词多含蓄,都等于没做防护。\n3. **面板数量硬锁**:必须显式声明面板总数(默认 3:正/侧/背;需要脱帽/摘配饰做面部基准时可扩到 4,第 4 格明确写成\"脱帽头像特写\"并注明与前三格同光同肤质)——`Exactly N panels only, no additional close-up insets beyond the N specified below`,否则模型会自己加脸部特写小格把排版挤乱。\n4. **等比对齐**:显式写 `same character scale and same camera distance across all views, evenly spaced with equal margins`,否则三个视图大小/站位高度容易不一致。\n5. **纯色背景+防真人脸**:背景写 `flat solid neutral grey background, no gradient, no vignette`(不是单写 \"neutral background\" 就够,防止出现暖色调/暗角);人物描述前置一句 `Completely original fictional face, not based on any real person or celebrity`——**实测发现不加这句,\"Sergio Leone spaghetti western\" 这类强关联风格词会把脸直接生成得跟历史真实演员高度相似**。\n\n标志性配饰(帽子/头巾等)**必须写进角色描述锁定清单,不得省略**——省略会导致同一角色不同批次\"戴不戴帽子\"随机不一致。\n\n**场景四宫格构图规范(四格固定分配,最大化信息密度)**:\n- **左上(全景定场 Establishing Shot)**:荒凉广阔西部全景/建筑,死寂空无一人,木板暴晒弯曲开裂。\n- **右上(陈设特写 Props Close-up)**:风化木质家具/老枪/沙龙吧台;仅单枚生锈铁钉支撑吱呀作响的斑驳木招牌、布满铜绿的生锈马栓。\n- **左下(纵深透视 Depth Perspective)**:强线条透视的漫天沙尘街道/峡谷小道,干枯龟裂泥地滚动风滚草(Tumbleweeds)、废弃小巷风沙旋涡(Dust devils)。\n- **右下(气氛光效 Atmospheric Lighting)**:强硬正午直射光/夕阳逆光/飞扬尘埃,地平线夕阳强逆光下橙金光晕、浮尘与破旧黑布猎猎作响。\n\n## 角色肖像级 key_element 方法\n\n为**每个主要角色建立肖像级 key_element**:面容 / 服饰装束 / 武器配件 / 冷酷马刺与动作声效,**中文描述 + 英文视觉词组**并列,粒度到可跨镜锁定的具体特征。场景按四宫格四要素写足质感。\n> 精简样例(示范颗粒度,非固定人设,按用户脚本替换):镖客——饱经风霜深褐皮肤(Weathered sun-bronzed skin)、冰冷灰蓝眼眸(Squinting piercing steel-blue eyes)、干裂脱皮嘴唇、斜叼半燃雪茄头(Half-burnt cigarillo);褪色墨西哥条纹羊毛斗篷(Faded Mexican striped wool poncho)+旧皮革马甲;系满黄铜子弹枪带与柯尔特左轮枪套、缀齿轮做旧黄铜马刺皮靴(clinking brass spurs)。反派——鹰隼凶眼半隐纯黑牛仔帽宽檐阴影(Hawk-like eyes half-hidden in the deep shadow of the cowboy hat brim)、瞳缘冷冽金属反光、八字胡;沾尘黑色双排扣长风衣(Dusty black double-breasted duster coat)+暗红丝绸马甲;雕花双枪皮套与银光左轮(Engraved silver-plated revolvers)、黑色铸铁马刺(dark cast-iron spurs)。完整肖像词栈见 `references/character-scene-portraits.md`。\n\n**★服装锚定文本锁死机制（实测发现的漏洞修补）**：无用户参考图、走\"路径B TextToImage 原创设计\"时，角色的服饰/道具描述**在生成三视图前必须先写成一句定稿的锚定文本**（格式同上面精简样例的服装部分，中文+英文词组各一遍），写入 Final_Video_Spec 与该角色的 key_element 记录，视为**跟三视图图像本身同等级别的锚点**——**不是\"示范颗粒度\"的参考，是逐字锁死、后续每一镜都要原样复述的文本**。之前实测出现过同一决斗短片里，主角从\"黑色风衣+雪茄\"中途变成\"墨西哥斗篷+子弹带\"的服装错乱，根源就是没有先写死这句锚定文本、只靠\"绝不写与元素图矛盾的外观\"这条软性提醒，模型在没有强文本约束时会在不同镜头里各自\"合理发挥\"。**任何一镜的提示词只要涉及该角色的服装/道具，必须原样复制这句锚定文本，不得改写、简写或凭记忆重新描述。**\n\n## 镜头设计、节奏与动作逻辑\n\n- **极静→极动节奏**:对峙阶段优先极浅景深长焦特写(眼部/手部悬空/马刺),靠视线博弈(Eyeline Match)与极低摄像机运动幅度拉满张力。\n- **局部特写同框关系声明**:凡局部特写同时提到\"双方/两人/彼此\"的身体部位/武器/动作,**必须明确\"同一画面同框\"还是\"交叉剪辑\"**。远距离决斗的手部/马刺/眼神/枪套特写默认写成 **intercut close-ups / hard cuts**;**禁用\"双方的手\"\"两人的枪套\"等模糊表述**描述单一近景,除非剧情明确要求近距离同框。\n- **极简台词停顿美学**:台词极其克制(人狠话不多),禁长篇大论;**有意识加破折号/省略号 ...**(如 `{No... I don't think so...}`)引导配音模型产生戏剧停顿与呼吸感的沧桑咬字。\n\n## 双阶段八镜头决斗蓝图(标准决斗模板)\n\n设计对决故事板须按此\"双阶段八镜头\"逻辑与台词细节编排(台词范式为示例,可微调):\n\n**第一阶段 · 对视对峙(极致心理张力)**\n1. **镜头1(空间锁建立 OTS)**:**135mm+ 长焦中景(MS/OTS)** 在双方间交替剪切,明确建立空间锁(二人分立主街两端/纵深两侧、相距较远、面对面、轴线/左右/纵深/朝向在后续保持不变);风沙漫天,斗篷/风衣热浪中微抖,空间压缩窒息对视。\n2. **镜头2(眼神博弈 ECU 交叉剪辑)**:**极写特写 ECU** 在双方瞳孔/眼部微表情间快速直切(Eyeline Match);是 **intercut close-ups 非同框**,每个 ECU 只呈现一个角色局部五官,继承镜头 1 的远距离关系。\n3. **镜头3(手部蓄势/马刺 交叉局部特写)**:**非\"双人手部同框\"**,拆 3A/3B/3C 或描述明确 hard cut/intercut——3A 只锁镖客右手/Colt 枪柄/皮套/子弹带(画面不得出现反派身体);3B 只锁反派手指/黑枪套/黑靴/铸铁马刺,提跟摩擦沙土金属回响(画面不得出现镖客身体);3C 3A 与 3B 间高压硬切交替,维持镜头 1 空间关系。\n   - **对峙台词停顿蓝图**(极简冰冷、大量气口 `...`):反派范式 `{There are two kinds of people in this world... those with loaded guns... and those who dig...}`(极慢气音金属沙哑);镖客范式 `{You... dig...}`(极干燥沧桑低沉鼻音)。\n\n**第二阶段 · 出击爆发(电光石火瞬态)**\n4. **镜头4(极速拔枪 quick-draw)**:**1.5s 瞬态极写**(装配剪为 1s–1.2s);手部极速下沉贴合雕花枪柄,左轮爆炸速度滑出。\n5. **镜头5(枪火硝烟 muzzle-flash)**:**中近景仰拍 MCU**;扣扳机,枪口橙金火光吐信,青白浓密枪烟伴 0dB 雷鸣枪声炸裂。\n6. **镜头6(子弹擦帽微距慢动作)**:**微距慢动作 Macro Close-up**;高温子弹擦过毡帽边缘,冲击波撕裂呢料,碎纤维飞溅,帽受力倾斜旋转飞落。\n7. **镜头7(中弹倒地 collapse)**:**低角度中全景 MWS**;**必须继承镜头 1 空间锁**:中弹者正面朝射手、子弹从射手方向击中胸口、身体沿受力方向**向后仰倒(远离射手方向)、背部先接触地面,不能向射手/镜头前扑**;双膝瘫软、物理惯性后倒、背重击沙土闷响、地面炸开厚重沙尘圆环。\n8. **镜头8(收尾剪影 aftermath)**:**慢速拉远 WS/EWS**;镖客淡然缓慢将冒烟左轮插回皮套(清脆金属扣合声),血色残阳低悬、深橙绯红天空、胜者孤独剪影被狂风无限拉长、斗篷猎猎。\n\n## 视频提示词写作规范(Seedance 风格,全内联)\n\n- **对白语言前缀标签(首要声学机制)**:`{...}` 包裹对白时**必须强制加语言前缀**——英文 `{en: \"verbatim dialogue line\"}`、中文 `{zh: \"一字不差的台词\"}`;**严禁省略前缀**(否则口型同步/发音漂移)。\n- **占位符与描述一致性**:用 `{{NodeKey}}` 绑角色/场景;提示词只描述瞬态动作/微表情/环境交互,**绝不写与元素图矛盾的外观**(图里黑帽子就不要写 \"brown hat\")。\n- **多角色同屏物理隔离三条**:①**实体与占位符强绑定**(占位符紧跟角色名词/称谓,如 `The weathered hero {{Node1}} and the cold-eyed outlaw {{Node2}} face each other`);②**空间方位硬性区隔**(写绝对左右/景深,如 `{{Node1}} stands on the left in close-up, while {{Node2}} is positioned on the right in medium shot`);③**拒绝模糊复数**(禁 are/they/both,单体分开描述各自动作,实现绝对物理隔离)。\n- **继承空间锁与交叉剪辑结构**:故事板已声明远距离对峙/intercut/hard cut/3A-3C 时,视频提示词**忠实保留结构,不得把多角色的手/枪套/马刺/眼睛/身体局部合并成同一近景同框**;单次生成含交叉特写须明写 `a sequence of hard-cut intercut close-ups` 且逐段声明每子镜头只出现一个角色局部;若引擎更宜单镜头稳定输出则拆成多个 shot 由 `composite_video` 硬切拼接。\n- **动作向量三重锚定**:中弹/倒地/拔枪/冲撞/闪避时,动作方向**同时锚定三种关系**——角色身体方向(向背后倒)、对手/射手方向(远离射手)、镜头/屏幕方向(toward background / away from camera / screen left);**避免只写 backward/forward/left/right 单一相对词**。\n- **提示词对照核检(双向)**:①场景/人物引用比对(提示词含脚本所有 key_element 占位符);②台词对白比对(所有对白一字不漏用 `{...}` 嵌入激活口型同步,环境音特效用 `<...>`)。\n- **防四宫格视频机制(Grid Reference Disambiguation)**:调用四宫格场景参考图生成分镜视频时,为**彻底防止模型生成带四格的分裂画面**,必须:①**语义解构声明**(`{{Node}} is a 4-quadrant reference sheet containing establishing shot, props, depth, and lighting.`);②紧跟**显式单画幅镜头指令**(`Generate a single-camera shot focusing on the depth perspective of the street and the atmospheric dust from the reference sheet {{Node}}. Do not generate a split screen or 4-grid video. Single view only.`)。\n- **镜头运动与动作堆栈(Camera → Action → Environment)**:按镜头运动→主体动态→物理环境层次编写,精确控制动作幅度(Motion Amplitude)与摄像机轨迹。极写用 `135mm+ telephoto lens, extremely shallow DoF, cinematic lens blur, blurred background bokeh`;宏大场面用 `extreme wide shot (EWS), low-angle perspective`;动态爆发可引 `whip pan`。\n- **面部特写防漂移机制(Facial ECU Control)**:生成眼部/面部微表情大特写时**即便不展现全身也必须强制绑定角色全身三视图**作 reference;提示词明确镜头对准 `{{Node}}` 特定五官、微表情限制在面部区域,**绝不允许在提示词中描写全身/四肢/大尺度动作**(防塞多余身体构图导致人脸拉伸畸变);写法示例 `135mm telephoto extreme close-up (ECU) of {{Node}}'s face, razor-sharp focus on the squinting steel-blue eyes and sun-cracked lips, micro-expression of the face, completely ignoring the rest of the body.`\n- **近身拔枪三阶段防畸变(Anti-Distortion Syntax)**:表现手指微动/按压/滑出枪套时,**同时传入角色全身三视图 + 场景四宫格(陈设特写分格)双向参考**;**严禁一句话概括的高频跃变词**(如 `he draws the gun directly`),必须\"悬空蓄势→触达贴合→极速滑出\"三阶段解构手部物理过渡(状态到状态位移),给引擎流畅轨迹差值依据:①`hovering inches above the leather holster, fingers spread wide`;②`fingers wrapping firmly around the engraved silver grip`;③`sliding smoothly out of the holster with explosive velocity`。\n- **声音嵌入标记**:背景音/音效 `<...>`(如 `<wind howling, squeaking wooden saloon door>`,拔枪镜加 `<loud gunshot echoing, metal spurs clinking>`);极简对白 `{...}`(前缀语言)。\n- **否定指令**:加 `no music`(音乐由全局轨道处理)与 `no subtitles`。\n- **★风格锚定词逐条复述(实测发现的漏洞修补)**:**每一条**分镜视频生成 prompt 正文**末尾必须原样复述**精简锚定词(见 references/prompt-word-stacks.md 开头★生产验证版),**不能只靠 `{{Node}}` 引用参考图隐式携带风格**。实测反例:某测评案例图像阶段(角色三视图/场景四宫格)质感词写得很全,但 9 条视频 prompt 正文一条都没复述锚定词、只引用了 `{{Node}}` 场景图,最终整体风格判定不如同题基线——而该基线的 12 条视频 prompt **每一条**都在正文里逐字重复了锚定词。图像阶段把风格焊进参考图,只解决角色/场景外观一致;**每一镜的色调/胶片颗粒/光影质感必须靠视频 prompt 正文里再写一遍锚定词来保证**,两者缺一不可。\n\n**图像词栈六组 + 三视图/四宫格英文模板 + 四个视频黄金模板**全文见 `references/prompt-word-stacks.md`(原文英文保留)。\n\n## 音频资产\n\n- **音频资产复用去重(最高优先级)**:用户已上传 BGM/VO/特定音效 → **强制直接绑定复用,严禁无视用户资产触发 AI 重生成**;仅用户未提供时才触发下列生成。\n- **独立音轨生成**(`generate_audio`,四条词栈原文保留,见 references):①交响 BGM(Spaghetti Western orchestral, epic acoustic guitar, dramatic high-register trumpet, crescendo, Sergio Leone style);②孤独口哨主题(solo human whistle, haunting melancholic, high cathedral reverb, Ennio Morricone aesthetic);③沙尘风铃环境(desolate howling desert wind, sparse metallic rusty wind chimes, no musical melody);④马刺沉重脚步节奏(dry acoustic percussion, heavy boot thuds, metallic clinking brass spurs, ticking clock tension)。\n- **旁白 VO**:英文默认沙哑低沉颗粒感伊斯特伍德式音色;中文/多语言选相应音色。作独立 audio_layer。\n\n## 合成与剪辑动律(video_assembler → composite_video)\n\n- **剪辑动律四阶段(对峙段)**:①环境定场 EWS ≈**10s**;②双人对视 OTS/MS 交替、每镜 ≈**8s**;③局部极写 ECU/手部枪套特写交替、频率缩至 **4–5s**;④爆发前夕极限变频快剪:主角双眼(2s)→反派双眼(2s)→主角悬空手指微动(1.5s)→反派紧握枪柄(1.5s),物理镜头长度指数级递减至绝对窒息。\n- **爆发段快剪蒙太奇(1s–2s)**:引擎最低 4s,生成端无法出超短镜头 → **装配阶段对 4s+ 源片段做 `composite_video` 的 startPosition/endPosition 高精度 Trim 截取**,按四快剪结构拼贴:①(1.0s)特写手掌按压左轮极速滑出+枪口火光前 24 帧;②(1.0–1.2s)低角度侧中景开火+青白枪烟炸裂;③(1.0s)极写中弹瞳孔放大/碎布飞溅/帽被掀飞;④(1.5–2.0s)中远景仰拍身体后倒尘土扬起。〔**局部变速 Speed up 1.5–2x composite_video 无原生参数 → 降级为剪辑指导性描述·适配改写;Trim 用 startPosition/endPosition 原生照搬**〕。爆发后余韵重放缓,收枪/硝烟散去/地平线剪影定格 **5s+** 归苍凉寂静。\n- **五轨垂直叠层 dB 电平表**(`composite_video` audioList 每轨 `decibel` + `videoVolume:0` 静音视频原声):\n  1. **Track1 环境铺底(风沙+风铃)**:全片循环,**-15dB 到 -20dB**,低频物理声场背景。\n  2. **Track2 物理拟音(重步履+马刺)**:**-6dB 到 -10dB**,随角色行止动态淡入淡出(行走推高、停步衰减至 -30dB 挂底)。\n  3. **Track3 主题旋律(口哨)**:**-8dB 到 -12dB**,加深混响营造空灵纵深。\n  4. **Track4 交响 BGM**:对峙静默期 **-18dB 到 -24dB** 挂底;决斗高潮/瞬间爆发以 **+6dB** 急剧渐强直推 **0dB** 爆裂。\n  5. **Track5 人声/旁白**:**0dB 到 -3dB** 优先清晰;有人声吐字时 Ducking 将 BGM 与环境音临时压低 **-6dB**。\n  〔dB 与 Ducking:composite_video 支持 per-track `decibel`,静音视频原声用 `videoVolume:0`,照搬;Ducking 的动态压低若无原生自动侧链 → 以分段 audioList dB 近似或标剪辑指导·适配改写〕。\n- **声学留白/破冰**:爆发前 3–4s 声学戏剧性渐弱/截断——BGM 交响与口哨在枪声前 **2s 骤淡出至无声(Fade to -inf)**,仅留极轻沙沙风声+一声孤独风铃微响;拔枪开火**第 1 帧枪响 SFX 以 0dB 饱和瞬态爆发**,同时 Track4 重音铜管爆发,与拔枪视觉瞬间**帧级对齐**实现\"极静到极动瞬间破冰\"。\n- **转场规锁**:主体剪辑全部**高对比无缝直切(Hard Cut)**(即 composite_video 按序拼接,60 年代意大利西部片冷峻硬核气质关键);**严禁**溶解 Dissolve/划像 Wipe/光晕闪烁/3D 翻转;**仅大跨度空间位移或大尺度时间跳跃**才允许淡入淡出黑场(Fade to Black/in),黑场时长 **1.5s–2s**〔黑场转场 composite_video 无原生参数 → 大跨度切换时插黑场素材或标剪辑指导·适配改写〕。", "extras": [], "cn": "荒野决斗·西部片导演"}, {"slug": "ecommerce-ugc-ad-planner", "desc": "为跨境电商商品策划、制作和质检 30 秒内的本地化 UGC 信息流带货视频。用于用户提供商品名称、品类、卖点、商品图或目标国家后，需要完成市场与文化研究、广告合规核验、单图转商品三视图、Logo 提取、当地素人模特设计、本地语言口播、Hook-Wow-Solution-How-Outcome-CTA 分镜、Seedance 2.5 视频提示词、A/B 变体或成片生成的场景。", "body": "# 出海 UGC 信息流广告制作\n\n把一个商品转化为适配目标市场和投放平台的原生感 UGC 广告。先证实产品与合规事实，再设计创意；真实感不能建立在虚假体验、虚假证言或文化刻板印象上。\n\n## 强制模型约束\n\n```yaml\nvideo_model: Seedance 2.5\nvideo_model_fallback: forbidden\nimage_model_priority:\n  - Lib Image\n  - Seedream\n  - other capable image model\nmax_single_video_duration_seconds: 30\ndefault_aspect_ratio: \"9:16\"\n```\n\n- 所有视频只使用 `Seedance 2.5`。模型不可用时停止视频生成，说明阻塞，不得静默换模。\n- 图片优先使用 `Lib Image`，其次 `Seedream`；只有二者不可用或任务明显不适合时才选其他图片模型，并记录原因。\n- 将 30 秒视为本 Skill 的硬上限。平台或当前模型入口限制更短时，遵循更短上限。\n- 默认制作一条 15–25 秒、9:16、竖屏、移动端优先的广告；只有内容确实需要时才扩展到 30 秒。\n\n## 按需读取参考\n\n- 开始市场调研前读取 references/market-research.md。\n- 审核卖点、证言、披露、敏感品类和平台规则前读取 references/compliance.md。\n- 处理商品图、Logo、模特、声音和一致性素材前读取 references/asset-pipeline.md。\n- 写口播、镜头、Seedance 提示词和交付物前读取 references/creative-production.md。\n\n## 工作流\n\n### 1. 建立 campaign brief\n\n优先从用户输入和附件提取信息，不重复追问已经给出的内容。记录：\n\n```yaml\nproduct:\n  name: \"\"\n  category: \"\"\n  variant: \"\"\n  verified_features: []\n  prohibited_or_unverified_claims: []\ntarget:\n  country_or_region: \"\"\n  language: \"\"\n  audience: \"\"\n  platform: \"TikTok | Instagram Reels | Facebook Reels | YouTube Shorts | other\"\noffer:\n  price: \"\"\n  discount: \"\"\n  shipping: \"\"\n  returns: \"\"\ncreative:\n  objective: \"conversion | traffic | awareness\"\n  duration_seconds: 20\n  aspect_ratio: \"9:16\"\n  talent_mode: \"real creator | actor reenactment | AI synthetic talent | hands-only\"\nassets:\n  product_images: []\n  official_logo: \"\"\n  packaging_images: []\n  proof_documents: []\n```\n\n在进入最终生成前，目标国家/地区、成片语言、平台、商品身份和至少一个可证实卖点必须明确。若缺少其他信息，先做带清晰假设的草案，不要停住整个工作流。\n\n### 2. 做当次市场研究\n\n每次执行都要联网研究目标市场，不要只依赖 Skill 内静态知识。按 `market-research.md` 查：\n\n1. 当地广告监管机构和平台最新规则。\n2. 该品类的禁限投、声明、标签、证据和年龄要求。\n3. 当地语言实际用法、称谓、语气、单位、币种、日期和数字格式。\n4. 当地近期平台内容、创作者表达、季节、节庆和商业音乐趋势。\n5. 文化敏感点、宗教语境、手势、服饰、家庭角色和视觉符号风险。\n\n输出一份带日期与链接的 `market_evidence`。将“监管事实”“平台规则”“观察到的创意模式”“推断/待验证”分开。至少使用两个可靠来源；高风险品类至少包含监管机构、平台政策和品类主管机关三类来源。\n\n### 3. 建立 claim ledger 与合规闸门\n\n为每个卖点记录原文、证据、允许表达、禁用表达和适用市场。价格、折扣、库存、运输、退货、测评数字、环保、健康、安全、性能和比较性声明都需要证据。\n\n- 不得捏造评价、销量、星级、媒体背书、认证、稀缺性或前后对比。\n- AI 模特不得声称自己真实购买、长期使用或亲身获得结果；改写为演示、功能说明或明确的演员呈现。\n- 若是真实创作者证言，只能使用其真实经历和获授权内容。\n- 广告、赞助、赠品、联盟关系和 AI 生成内容按目标地区与平台要求清晰披露。\n- 对医药、保健品、减重、美容功效、金融、酒精、博彩、儿童用品、武器、政治等高风险品类，在完成专项核验前停止最终生成。\n\n运行 `python scripts/validate_campaign.py campaign.json` 检查结构性硬约束；它不能代替法律或平台审核。\n\n### 4. 标准化商品和品牌素材\n\n按 `asset-pipeline.md` 执行。\n\n- 多张产品图：优先选取真实的正面、侧面、背面和细节图，不重新生成已有事实。\n- 仅一张实拍图：生成一张纯白背景三视图，左到右为正面、侧面、背面；看不见的结构标记为“AI 推断”，先让用户确认再作为视频身份锚点。\n- Logo：优先从原图裁切、校正、去背景和放大，逐字逐形核对；不得让图片模型凭空重画。Logo 模糊、遮挡或无法确认时索要官方文件。\n- 为商品建立不可漂移约束：轮廓、比例、颜色、材质、接口、按钮、包装、Logo 位置和文字。\n\n### 5. 设计当地 UGC 模特\n\n基于目标市场和受众设计 2–3 个候选，但不要把国籍简化为种族或刻板外貌。优先匹配生活场景、语言能力、年龄段、使用需求和表达方式。\n\n默认视觉方向：成年普通创作者、手机前置或手持拍摄、自然室内光、真实皮肤纹理、轻微毛孔与细纹、自然发丝、不过度磨皮、不做影棚广告布光、略有手持晃动和生活化构图。不得使用真实名人、未经授权的真人肖像或未成年人敏感呈现。\n\n如果商品无需露脸、涉及隐私或模特一致性风险高，主动提供 `hands-only`、POV、桌面演示或真人旁白加产品特写方案。\n\n### 6. 写本地化脚本\n\n先用目标语言写原生口语，再提供中文策略解释；不要先写中文再逐句直译。采用：\n\n`Hook → Wow moment → Solution → How it works → Outcome → CTA`\n\n其业务含义依次为：痛点/欲望、视觉反转、产品介入、极简功能演示、场景化成果与可信证明、行动号召。结构可合并，但不能缺 Hook、产品证据和 CTA。\n\n同时产出至少 3 个 Hook：痛点型、好奇/反差型、结果/演示型。Hook 应在 0–3 秒出现产品命题，在前 6 秒完成主要抓取，不得用恐吓、羞辱、虚假紧迫或无法兑现的绝对化措辞。\n\n按真实朗读速度计时并朗读校对。宁可缩短台词，也不要把 30 秒塞满。字幕适配静音观看；口播、屏幕文字和画面演示必须表达同一个事实。\n\n### 7. 设计单条 Seedance 2.5 成片\n\n默认直出一条连续 15–25 秒视频；保持 3–6 个镜头事件，避免 30 秒内过度切镜导致商品、人物或 Logo 漂移。\n\n把提示词组织为：\n\n1. 引用素材及各自职责：产品三视图控制商品，Logo 图控制品牌，模特图控制人物。\n2. 时长、9:16、UGC 真实感、目标平台和目标语言。\n3. 按秒时间线：画面、动作、口播、字幕、音效、转场。\n4. 商品交互的物理连续性与关键演示步骤。\n5. 身份和品牌一致性约束。\n6. 负面约束：换脸、商品变形、Logo/文字乱码、多余手指、错误包装、过度美颜、影棚感、闪烁、跳变、字幕遮挡。\n\n若单条直出无法稳定完成复杂交互，先简化事件和镜头；仍不稳定时再征得用户同意拆为多个 Seedance 2.5 片段后剪辑，视频模型仍不得更换。\n\n### 8. 质检并交付\n\n至少检查：\n\n- 时长不超过 30 秒，视频模型为 Seedance 2.5。\n- 商品结构、颜色、包装和 Logo 与已确认素材一致。\n- 模特为成年人且身份、手部、口型、声音和语言一致。\n- 前 3 秒明确命题，前 6 秒形成抓取，产品演示可见，CTA 清楚。\n- 台词自然，单位、币种、字幕换行、标点和禁忌适配目标地区。\n- 每个事实性卖点可追溯到 claim ledger；无伪造体验或证言。\n- 披露、字幕和 CTA 位于平台安全区，音乐、字体、Logo、肖像均有商业使用权。\n- 落地页与广告在商品、价格、优惠和承诺上完全一致。\n\n默认交付一个主版本和两个低成本 A/B 变体。变体一次只改变一个主变量，例如 Hook、模特、CTA 或演示顺序，便于归因。\n\n## 输出格式\n\n```markdown\n## 1. Brief 与假设\n## 2. 市场研究与来源\n## 3. 合规结论与 Claim Ledger\n## 4. 素材清单、三视图与 Logo 处理结果\n## 5. 模特候选与最终设定\n## 6. 目标语言口播 + 中文策略解释\n## 7. 按秒分镜表\n## 8. 图片生成/处理提示词\n## 9. Seedance 2.5 完整提示词\n## 10. 字幕、声音、CTA 与投放备注\n## 11. QA、自检失败项和待用户确认项\n## 12. A/B 变体\n```\n\n不要把推断写成事实。若当前环境只能生成方案而不能调用模型，明确交付的是“可执行提示词与制作包”，不要声称成片已生成。", "extras": [], "cn": "北美电商出海UGC"}, {"slug": "episodic-series-writer", "desc": "多集弧光预算，剧集全流程剧本", "body": "# episodic-series-writer\n\n多集剧集的完整写作方法论。**长片的弧光是一次完整旅程，剧集的弧光是预算制的**——N集里角色的变化量需要被分配到各集，被\"预算控制\"。本 skill 自包含，不依赖本库其他任何文件；如果要指定\"这个剧集该讲男频/悬疑/复仇哪个题材的具体内容判断标准\"，可以在写完后额外参考对应题材壳，但题材壳不是必需前提。\n\n## 边界：不做什么\n\n不产出分镜表、镜号、景别/运镜/构图、转场方式、AI生图/生视频提示词、任何特定生成引擎的格式约束。产出到完整的、可以直接读、直接拍的文字剧本为止。\n\n## 工作流纪律\n\n严格按步骤顺序执行，不跳步；每一步完成后暂停，等待用户的[通过/修改/自检]指令；绝不一次性把后续所有步骤生成完再交给用户；每步结束后提醒用户可以要求[自检]。\n\n自检是内部过程——写之前先在心里过一遍对应步骤的检查清单，不需要在输出中展示自检的思考过程，只需要确保交付的内容已经通过检查。用户仍然可以主动要求[自检]，此时才需要显式地逐条列出检查项并给出评估结果。\n\n## 写作红线（全局最高优先级，任何格式都不能违反）\n\n**绝对不要**：写心理描写（\"他意识到\"、\"她领会到\"、\"内心涌起\"）；写括号暗示（\"（其实是在掩饰紧张）\"）；角色用台词解释设定或主题；说教片段、强行催泪、煽情独白；过度比喻句、类比、书面化的AI腔台词；写任何摄影机拍不到的内容。\n\n**必须做到**：台词口语化，像真人说话；用动作代替解释（动作即潜台词）；对话像冰山，只露一角；所有内容从视听角度出发。\n\n## 视听化写作核心\n\n**Show, Don't Tell**：如果一个情感无法通过角色的物理行为传达给观众，这个情感就不该出现在剧本里。**潜台词**：对话是冰山，避免直白，利用动作/停顿/回避/话题转移表达真意。**台词风格**：口语化，不同角色有不同说话方式（用词、句式长度、习惯性表达）——剧集角色多、出场周期长，台词风格的区分度比其他体量更重要，观众遮住名字也该能分辨谁在说话；避免过度比喻和书面化AI腔；不要让角色说出双方都已经知道的事情。\n\n**标准剧本格式**：\n```\n【场景X：地点 / 时间 / 简要视觉描述】\n\n动作/画面描写直接写在台词之间，不加标记，只写摄影机能拍到的东西。\n\n角色A：xxxxxxxxx。\n```\n`【场景标注】`用方括号标注地点/时间/关键视觉信息；`角色名：`直接跟对白；`角色名（OS）：`表示内心独白/旁白；动作/画面描写不加标记，直接写在台词之间。\n\n## 核心特征\n\n- **集数与时长**：由用户定义（常见配置：8-24集，每集10-60分钟）\n- **角色**：完整Ghost/Lie/Flaw/Want/Need，弧光分配在整季\n- **结构**：双层嵌套——集内结构 + 季度弧线\n- **世界观**：复杂且分层释放，需要信息管理\n- **节奏**：每集独立精彩 + 集间钩子 + 季度递进\n- **记忆**：需要连续性管理系统\n\n## 人物深度设计（同长片深度）\n\n**Ghost（前史创伤）**：角色过去经历的事件，塑造了当前的世界观和行为模式。**Lie（角色相信的谎言）**：角色因Ghost形成的关于自己/世界的错误信念。**Flaw（性格缺陷）**：Lie在行为层面的具体表现。**Want vs Need**：Want是驱动动作的目标，角色主动追求的东西；Need是角色未曾意识到的灵魂缺口。**Ghost→Lie→Flaw→Want→Need因果链**：写人物小传时要能沿着这条链条一步步推导。\n\n**剧集与长片的关键差异**：长片的弧光是一次完整旅程，剧集的弧光是**预算制**的——N集里角色的变化量需要分配到各集，前面的集不能让角色变化太多，否则后面没有空间。长片的世界观可以一次搭建完，剧集的世界观必须**分期释放**——前几集只展示表层规则，中段揭示运行逻辑，季终暴露底层真相，写第1集时就得知道最后一集要揭示什么。长片是一个故事，剧集是N个故事组成的一个更大的故事——每集拆出来都必须是一个独立好看的微型故事（单元性），但同时又在为季度大弧线铺砖（连续性）；两者冲突时，**单集好看优先**。\n\n---\n\n## 首先：确认剧集配置\n\n进入创作前，先与用户确认以下参数：\n```\n剧集配置表：\n- 总集数：__集\n- 单集时长：__分钟\n- 单集结构偏好：四段式 / Save the Cat压缩版 / Story Circle / 内在节拍\n- 剧集类型：单元剧（每集独立故事）/ 连续剧（一个大故事分集讲）/ 混合型（单元故事+连续暗线）\n- 季度弧线：有 / 无（纯单元剧可能没有）\n- 世界观复杂度：简单（即插即用）/ 中等（需要分层）/ 复杂（需要信息释放时间表）\n```\n配置确认后，以下所有模板中的集数和时间分配自动适配，下文\"N\"代表用户设定的总集数。\n\n## 剧集类型与结构策略\n\n不同类型在\"单集独立性\"和\"季度连续性\"之间的权重不同：\n\n| 类型 | 单集独立性 | 季度连续性 | 代表作参考 |\n|------|-----------|-----------|-----------|\n| 纯单元剧 | 100% | 0-10%（角色微成长） | 《黑镜》《世界奇妙物语》 |\n| 单元+暗线 | 70-80% | 20-30%（暗线推进） | 《爱死机》《查无此人》 |\n| 半连续剧 | 40-60% | 40-60%（集内有独立事件但服务于大线） | 《绝命毒师》《怪奇物语》 |\n| 强连续剧 | 10-20% | 80-90%（每集是大故事的一个章节） | 《权力的游戏》《进击的巨人》 |\n\n根据用户选择的类型，调整后续所有模板的权重——单元剧侧重本集精彩度，连续剧侧重季度弧线的推进。\n\n---\n\n## 双层结构\n\n### 层一：集内结构\n\n根据单集时长和偏好选择：短集（10-15分钟）→四段式；中集（20-30分钟）→四段式扩展版或Save the Cat压缩版；长集（40-60分钟）→Save the Cat/Story Circle/McKee均可。\n\n**四段式集内模板（按比例分配，适配任意时长）**：\n```\n【冷开场 / 开场钩子（强烈建议）】\n  每一集都需要开场钩子——不只是第一集。冷开场是片头曲播放之前的内容，\n  唯一任务是让观众决定\"继续看\"。策略：\n  - 一场高张力场景直接把观众扔进紧张中（商业剧集）\n  - 一个看似无关但在集末回扣的独立切片（悬疑/单元剧）\n  - 上一集cliff-hanger的延续和解决（连续剧）\n  - 一个高度风格化的段落锚定本集情绪基调（文艺剧集）\n  第一集的冷开场承担最重的任务——同时建立世界观、角色、类型基调、\n  季度核心冲突的种子。第一集前两分钟决定观众是否会看完整季。\n\n一、建置（约15%时长）：本集的常态，可延续上一集或跳到新场景。激励事件——本集核心冲突的触发。\n二、发展（约40%时长）：冲突升级（至少两次递进）。B Plot在此段穿插推进。季度暗线的种子自然散落在对白和行为中。\n三、高潮（约25%时长）：本集核心冲突的顶点。角色做出选择——应体现或挑战角色的Lie。\n四、结局+集末钩子（约20%时长）：本集故事的落幕，展示\"本集的新常态\"。集末钩子（cliff-hanger或tease）——为下一集埋下期待，不一定要大悬念，可以是一个不安的细节、一句没有回答的问题。\n```\n\n### 层二：季度弧线\n\n按比例分为四个阶段：\n```\n第一阶段：建置（前25%集数，即E1~E[N×0.25]）——世界观表层规则呈现，主角Want和Lie被清晰建立，核心关系网络搭建完成，季度核心冲突的种子被播下。\n第二阶段：发展（第25%-65%集数）——季度核心冲突逐步升级，世界观运行逻辑逐渐揭示，主角经历多次伪变化（看起来在成长，但Lie没有真正被打破），各集B Plot和暗线开始交织。\n第三阶段：危机（第65%-85%集数）——季度\"一切尽失\"时刻，主角面对自己的Ghost和Lie，最重要的关系受到威胁或破裂。\n第四阶段：高潮与落幕（最后15%集数）——世界观底层真相揭示，主角做出季度级别的关键选择，弧光完成，展示新常态；季终可以完结也可以留钩子给下一季。\n```\n\n**比例适配示例**：\n\n| 总集数 | 建置 | 发展 | 危机 | 高潮 |\n|--------|------|------|------|------|\n| 8集 | E1-2 | E3-5 | E6-7 | E8 |\n| 10集 | E1-3 | E4-6 | E7-8 | E9-10 |\n| 12集 | E1-3 | E4-8 | E9-10 | E11-12 |\n| 16集 | E1-4 | E5-10 | E11-13 | E14-16 |\n| 24集 | E1-6 | E7-16 | E17-20 | E21-24 |\n\n---\n\n## 弧光预算分配\n\n弧光不能随意在各集中发生——需要规划每集的\"变化额度\"。\n\n```\n角色：[名字]\n季度弧光：从[A状态] → 到[B状态]\nLie：[角色相信的谎言]\n总集数：N\n\n集  | 弧光事件 | 变化方向 | 变化幅度 | 累计进度\nE1  | [事件] | Lie被强化 | 微弱 | 0%\n... | ... | ... | ... | ...\nE[N]| [事件] | 关键选择→新常态 | 完成 | 100%\n```\n\n**比例规则**：前25%集数累计进度不超过15%；至少1次伪变化后的回退（通常在40%-60%位置）；65%-85%位置是加速区（变化量最大）；不是每集都需要弧光事件——有些集角色不变化也可以；纯单元剧可以弱化甚至跳过弧光预算，只保留角色状态追踪。\n\n## 世界观信息释放时间表\n\n```\n信息层 | 内容 | 释放位置（按比例） | 释放方式\n表层规则 | [世界的基本运行方式] | 前10-15%（E1-E2区间） | 直接展示\n表层细节 | [规则的有趣延伸] | 15-30% | 角色遭遇 / B Plot\n运行逻辑 | [为什么世界是这样的] | 40-55% | 角色调查/发现\n逻辑延伸 | [逻辑的更深层含义] | 55-75% | 关系对话中泄露\n底层真相 | [世界的终极真相] | 最后20% | 高潮揭示\n伏笔回扣 | [前面细节获得新含义] | 最后1-2集 | 观众恍然大悟\n```\n**原则**：每层信息释放前需要至少1-2集的伏笔铺垫；信息释放通过角色行动和发现呈现，不通过旁白或字幕；释放新信息时必须改变观众对已知信息的理解；不要在同一集释放太多新信息，每集最多展示一个新层。\n\n---\n\n## 剧集必备元素（除非用户特别说明，否则默认包含）\n\n### 伏笔与回扣（跨集级）\n\n剧集的伏笔比长片更强大——时间跨度更长，观众第2集看到的细节第8集回扣时冲击力被等待的时间放大。\n\n**分类**：**集内伏笔**（同一集内埋下并回扣，与长片一致）；**短程伏笔**（跨1-3集回扣，观众还记得时看到回扣，效果是\"果然如此\"）；**长程伏笔**（跨5集以上回扣，观众已忘记时看到回扣，效果是\"原来一开始就……\"）；**季度伏笔**（第1-2集埋下，季终回扣，整季的重新理解，是最强力的伏笔）。\n\n**密度建议**：每集至少1个集内伏笔；每3集至少1个短程伏笔在回扣；整季至少2-3个长程伏笔；至少1个季度伏笔。所有伏笔用\"埋种/回调登记表\"追踪（见下文连续性管理）。\n\n### 次要角色与群像\n\n剧集的次要角色比长片更丰满——更多时长意味着次要角色不只是功能性的，他们可以有自己的小弧光。**功能同长片**：镜像角色、催化角色、主题角色、节奏角色。\n\n**剧集额外要求**：重要次要角色应有自己的跨集微弧光（不需要像主角那样完整，但需要可感知的变化）；微弧光应在某个时刻与主角弧光产生交叉（互相影响）；每集可有1-2个一次性角色（本集NPC），但如果同一功能的NPC在多集反复出现，应考虑合并为常驻次要角色；群像剧需要角色关系矩阵，每集更新关系状态。\n\n### 暗线（剧集级）\n\n比长片更复杂，因为有更多时间铺设和揭示。**数量建议**：1-3条，每条需有明确起点（哪集开始铺）和终点（哪集揭示）。**推进规则**：暗线不能在每集都推进——那就不是\"暗\"线了；暗示应隐藏在\"表面上有别的含义\"的场景中；暗线浮出水面时应改变观众对前面多集内容的理解；用\"暗线进度追踪表\"管理（见下文）。\n\n### Subplot管理（剧集级）\n\n比长片更复杂，有些subplot跨集运行：**集内A Plot**（本集核心故事）；**集内B Plot**（本集副线，通常与角色弧光相关）；**Running Subplot（跑线）**（跨多集的持续剧情，不在每集都出现但观众记得）；**Season Arc（季度弧线）**（整季总故事，每集以碎片形式推进）。\n\n**交织原则**：每集A Plot必须独立完整；B Plot可跨1-2集解决；Running Subplot每隔2-3集推进一次，每次推进要够分量；Season Arc的推进不能影响本集A Plot的节奏——冲突时砍Season Arc的戏；同时运行的subplot（含Running Subplot）不超过3条。\n\n---\n\n## 时长估算与双轨节奏（剧集级）\n\n每集在分集大纲阶段就应做时长预算，按四段式比例分配，场景拆解阶段细化到每场戏。\n\n**场景标注格式**：\n```\n【场景X：地点 / 时间 / 视觉描述】（约X分钟）\n  情节节奏：松/中/紧\n  情感节奏：轻/中/重\n```\n\n**集内节奏检查**：单集内不要连续3场以上同一节奏状态；高潮段（情节紧+情感重）的时长占单集总时长20-30%为宜（太短不够爽，太长会疲劳）；每集至少有一个\"情节松+情感重\"或\"情节紧+情感轻\"的错位段落——这是最有味道的时刻。\n\n**集间节奏检查**：相邻两集的平均情节强度是否有对比（不能连续几集都是高强度）；相邻两集的平均情感强度是否有对比（不能连续几集都是重情感）；季度中段的\"呼吸集\"是否真的在\"呼吸\"（情节和情感都需要降下来）。\n\n---\n\n## 连续性管理四件套\n\n每写完一集，更新以下四张追踪表：\n\n**A. 角色状态追踪**：\n```\n角色 | 本集结束时的状态 | 关键变化 | 下集需延续的点\n[名] | [物理/情感/关系状态] | [本集发生的变化] | [下集必须回应的点]\n```\n\n**B. 暗线进度追踪**：\n```\n暗线名称 | 当前进度 | 本集推进内容 | 下次推进计划（哪集）\n[暗线1] | [进度描述] | [本集做了什么] | E[X]\n```\n\n**C. 埋种/回调登记**：\n```\n种子内容 | 埋入集数 | 场景 | 计划回调集数 | 回调方式 | 已回调？\n[种子描述] | E[X] | [场景号] | E[Y] | [如何回扣] | ✅/❌\n```\n\n**D. 已公开信息清单**：\n```\n信息内容 | 公开集数 | 公开方式 | 谁知道（角色层面）| 谁不知道\n[信息] | E[X] | [展示/暗示] | [角色列表] | [角色列表]\n```\n\n**使用说明**：每集剧本完成后立即更新四张表；开始写新一集前先查阅确认当前状态；如发现连续性冲突，优先修改新集内容而非修改已定稿的旧集。\n\n---\n\n## 剧集工作流（两阶段）\n\n剧集创作分两个阶段：先完成\"季度规划+分集大纲\"，确定整季骨架和每集概念；然后逐集进入八步工作流写单集剧本。\n\n### 阶段一：季度规划与分集大纲\n\n只做一次，但可能需要多轮迭代。目标：在写任何一集完整剧本之前，先把整季骨架搭稳。\n\n**步骤A：季度规划**\n1. **剧集配置确认**：集数、单集时长、剧集类型（见首节配置表）\n2. **季度前提**：这一季的总故事，一句话概括（Logline级别）\n3. **季度梗概草稿**：一页纸的季度故事提要（300-500字），让用户对整季走向和气质有基本判断，后续可持续修改\n4. **主角的季度弧光**：从A状态到B状态，Lie是什么\n5. **前史与世界观**（遵循横截面原则——故事开始之前世界已运行很久）：时代背景（这个故事发生在什么时代/社会环境，什么时代特征影响了角色）；主角前史（每个主要角色在故事开始之前的关键人生事件，特别是Ghost事件）；关系既往（主要角色之间在故事开始前的关系历史）；世界观设计（三层模型：表层规则/运行逻辑/底层真相+信息释放时间表）；横截面选择（为什么第一集从这个时刻切入）\n6. **弧光预算分配**：主角和主要配角的弧光预算表初稿\n7. **暗线规划**：跨集暗线的起点和终点（如果有）\n\n> 请回复\"通过\"进入分集大纲，或告诉我修改意见。\n\n**步骤B：分集大纲**——**这是剧集创作中最关键的步骤。** 在动手写任何一集剧本之前，先把N集的分集大纲全部拉通。为什么必须先于剧本：分集大纲是\"地图\"，没有地图就出发会迷路；只有拉通看全季，才能判断节奏波浪是否合理；弧光预算的消耗只有在全局视角下才能检验；埋种和回调需要前后集的配合，不拉通就会遗漏。\n\n**分集大纲模板（每集填写）**：\n```\n第[X]集《集名》\n\n【集内核心】\n  一句话故事（本集Logline）：\n  本集核心戏剧动作：目标 → 阻碍 → 结果\n  本集情绪基调：（建置型/轻快型/紧张型/呼吸型/崩塌型/高潮型/……）\n\n【集内结构概要】（含时长预算）\n  冷开场/开场钩子（约X秒）：具体内容——这段开场单独拿出来是否精彩？\n  建置（约X分钟）：情节节奏：松/中/紧 | 情感节奏：轻/中/重\n  发展（约X分钟）：障碍1 → 障碍2 → 情节节奏：松/中/紧 | 情感节奏：轻/中/重\n  高潮（约X分钟）：情节节奏：松/中/紧 | 情感节奏：轻/中/重\n  结局+集末钩子（约X分钟）：情节节奏：松/中/紧 | 情感节奏：轻/中/重\n\n【季度连接】\n  弧光预算消耗：本集角色变化了什么？累计进度到多少？\n  暗线推进：本集推进了哪条暗线？怎么推进的？\n  世界观释放：本集是否释放了新的信息层？\n  埋种：本集埋了什么种子？计划在哪集回收？\n  回调：本集回收了之前哪些种子？\n  次要角色动态：本集的次要角色状态变化？\n\n【集间关系】\n  承接上集：本集从上集的什么状态开始？\n  递交下集：本集结束时为下集留了什么？\n  与前后集的节奏对比：本集平均情节强度vs上集/下集？本集平均情感强度vs上集/下集？\n```\n\n**分集大纲自检**：每集的开场钩子是否足够精彩？第一集的开场是否同时建立了世界观、角色和类型基调？全季N集拉通后是否有清晰的季度四阶段弧线？集间节奏是否有波浪（不能持续同一种情绪）？集间的情节强度和情感强度是否分别有起伏（不能连续3集以上同强度）？弧光预算是否合理（前25%进度不超过15%）？信息释放是否分层（没有一次性倾倒）？每集独立拆出来Logline是否能独立成立？是否有\"呼吸集\"让观众休息，情节和情感是否都降了下来？同时运行的暗线/subplot是否不超过3条？集末钩子是否是本集故事的自然延伸而非强行制造？全季的伏笔是否有合理分布（集内/短程/长程/季度各层次都有）？每集时长预算加起来是否与单集总时长一致？次要角色是否都有功能，有跨集角色是否有微弧光？\n\n> 分集大纲全部完成后，请回复\"通过\"。我们将从第1集开始逐集写剧本。你也可以要求我对整个大纲进行[自检]。\n\n### 阶段二：逐集剧本（八步工作流）\n\n分集大纲通过后，逐集进入八步工作流。**注意**：剧集的步骤2（梗概）和步骤4（前史与世界观）已在阶段一的季度规划中完成，逐集写作时简化为\"对照分集大纲确认\"——除非本集实际发展偏离了大纲，需要更新。\n\n**步骤1（破题）额外要求**：核心戏剧动作需与分集大纲中的设定一致；检查本集概念是否与前后集有节奏对比。\n\n**步骤2（梗概）——对照确认**：回顾分集大纲中本集的Logline和结构概要，确认是否仍然成立；如之前的集偏离大纲导致需要调整，在此更新本集梗概。\n\n**步骤3（人物）额外要求**：本集出场的次要角色需标注功能（镜像/催化/主题/节奏）；如有跨集的次要角色，检查其微弧光进度。\n\n**步骤4（前史/世界观）——对照确认**：回顾季度规划中的世界观设定，确认本集是否需要释放新的信息层；如本集有新角色登场，补充其前史。\n\n**步骤5（结构大纲）额外要求**：集内结构+集末钩子设计；开场钩子设计——每集的冷开场/第一场戏必须有足够强的视觉钩子，第一集的开场承担最重的任务；标注本集对暗线的推进（如果有）；标注本集对弧光预算的消耗；对照分集大纲检查是否偏离，偏离需评估连锁影响；时长预算细化。\n\n**步骤6（场景拆解）额外要求**：每个场景标注预估时长和双轨节奏状态；检查集内节奏——是否有连续3场以上同一节奏状态；场景时长累加检查；**如果本集场景超过6场，在步骤6完成后触发一次集内记忆检查点**。\n\n**步骤7（场景写作）额外要求**：**单集写作过程中每完成6场戏左右触发一次集内记忆检查点**；写作时对照检查点确认前后一致性；前史信息通过对白和视觉线索自然散落。\n\n**步骤8（剧本医生）额外要求**：连续性审计——检查与前面已完成的集是否有矛盾；更新所有追踪表（角色状态/暗线进度/埋种回调/已公开信息）；检查集末钩子是否有效；开场钩子质量检查——本集冷开场是否足够抓人；伏笔审计——本集埋的伏笔是否已登记，本集该回扣的是否已回扣；节奏诊断——用场景时长汇总检查本集节奏；次要角色审计；偏离大纲时评估连锁影响；**本集完成后必须触发集间记忆检查点**。\n\n---\n\n## 集间节奏管理\n\nN集不能每集都是同一种情绪，需要节奏的波浪。\n\n**情绪基调类型库**（每集从中选择一个主导情绪，可混合但应有明确主导）：建置型（观众适应世界、认识角色，通常用于开头几集）；轻快型（喜剧感强、角色互动为主，观众积累好感）；紧张型（核心冲突升级、压力增大）；呼吸型（节奏放缓、角色关系深化，提供情感锚点）；转折型（大事件发生、格局改变）；压力型（内外压力持续收紧，几乎没有喘息）；崩塌型（一切尽失，最低点）；至暗型（角色直面Ghost和Lie）；反击型（角色带着新认知反击）；高潮型（季度核心冲突的解决）。\n\n**节奏波浪原则**：不能连续3集以上是同一基调；紧张/压力集之后需要至少1集呼吸或轻快；崩塌和至暗可以连续（构成\"低谷\"），但低谷前后必须有对比；季度中段（40%-60%位置）适合放转折型——改变下半季的方向；呼吸集不是废集，它的功能是让角色关系深化、让B Plot推进。\n\n**参考节奏模板（按总集数比例）**：\n```\n前10%: 建置\n10-20%: 轻快/建置\n20-30%: 第一次紧张\n30-40%: 呼吸\n40-50%: 转折（中段大事件）\n50-60%: 过渡+升级\n60-70%: 压力\n70-75%: 呼吸或伪高潮\n75-85%: 崩塌/至暗\n85-95%: 反击\n最后5-10%: 高潮+落幕\n```\n以上只是参考，具体节奏应根据故事本身调整，关键是制造情绪的起伏。\n\n---\n\n## 记忆检查点系统\n\n剧集全季可达10万字以上，检查点通过定期生成结构化\"快照\"防止前后矛盾。分两级：\n\n**集间检查点（每完成一集触发，最重要）**，在通用模板基础上增加：\n```\n【本集完成摘要】本集Logline / 本集核心事件 / 本集弧光消耗：角色变化了什么？累计进度？\n【连续性追踪更新】角色状态变化（与上一集的对比） / 暗线推进（本集推进了什么） / 新埋的种子 / 回扣的种子 / 新公开的信息\n【季度进度】当前处于季度四阶段的哪个阶段？弧光预算已消耗多少？下一集的分集大纲核心是什么？\n```\n\n**集内检查点（单集内容较长时触发，即场景超过6场）**：使用通用模板即可，重点记录本集内部的角色状态和活跃线索：\n```\n📌 记忆检查点 | 剧集 | [当前位置]\n【已完成进度】当前处于第几步 / 已写到本集第几场\n【故事核心（不变）】Logline / 核心戏剧动作：目标→阻碍\n【角色当前状态】[角色名]：物理状态/情感状态/当前知道什么/当前想要什么\n【已完成段落摘要】场景1：一句话概括+核心价值转变；……\n【活跃线索】需要后续回应的线索及状态\n【伏笔状态】已埋未回扣：[内容]→计划在[位置]回扣；已回扣：[内容]✅\n【节奏状态】上一段落情节/情感节奏 → 下一段落建议方向\n【待写内容预告】下一个要写的场景是什么，核心戏剧动作是什么\n```\n\n**使用方式**：写作时每次开始新段落前先回顾最近检查点；跨对话时请用户提供上一次检查点内容以恢复上下文；剧本医生时把所有检查点串起来通读，快速发现某条伏笔埋了没回扣、某个角色状态突然跳变（连续性错误）、节奏长时间没变化、某条暗线/Subplot长时间没推进。\n\n## 跨格式技法借鉴（剧集可借用的部分）\n\n**从概念片借**：高概念翻转的思路可以用在剧集的冷开场/集末钩子——这场戏的最后一秒能不能让观众重新理解这场戏的第一秒？递进崩塌式结构可以用在展示\"角色被困在重复模式中\"的段落——同一个早晨、同一个争吵、同一次失败，循环本身就是叙事。视听语言武器库中的分屏可以用在剧集的recap段落；跳切蒙太奇可以用在时间推进段落；画面与声音错位可以用在需要讽刺效果的场景；静默可以用在高密度信息流之后的高潮段落之后；色彩限制可以用在特定段落标记叙事层次（回忆用去饱和、幻想用高饱和、现实用自然色调）。\n\n**从短片借**：信息密度蒙太奇可以用在角色适应新处境的时间推进段落；单一变量极致推演特别适合\"瓶装集\"（bottle episode，限定空间和人物，把一个复杂故事的某个局部限制为单一变量推演）；零度表达（灾难越大语气越平）适合用在崩塌集。\n\n**从长片借**：McKee价值转变检验法可以用在剧本医生阶段——检查每一场戏结束时的核心价值是否与开始时不同，没有价值转变的场景考虑删掉。\n\n## 剧集常见陷阱\n\n- ❌ 跳过分集大纲直接写单集 → 必须先拉通全季再动笔\n- ❌ 为了季度弧线牺牲单集精彩度 → 每集拆出来都要好看\n- ❌ 信息释放过快（前几集就把世界观讲完）→ 分层释放\n- ❌ 弧光预算失控（前面的集角色变化太大，后面无处可去）→ 严格遵守预算比例\n- ❌ 连续性错误（角色行为与前集矛盾）→ 每集开写前查追踪表\n- ❌ 集末钩子过于强行（为了悬念硬造冲突）→ 钩子应是本集故事的自然延伸\n- ❌ 每集结构太相似（观众能预测节奏）→ 用集间节奏管理制造变化\n- ❌ Running Subplot太多，观众记不住 → 同时运行的不超过3条\n- ❌ 分集大纲只写了一句话概括 → 大纲需要包含完整的集内结构概要、时长预算、双轨节奏和季度连接\n- ❌ 写单集时偏离了大纲但不更新后续集 → 任何偏离都需要评估对后续集的连锁影响\n- ❌ 没有估算时长导致高潮被压缩或建置过长 → 从分集大纲就开始做时长预算\n- ❌ 连续几集都是高强度情节+重情感 → 观众会疲劳，用双轨节奏检查集间对比\n- ❌ 伏笔埋了忘记回扣 → 用埋种/回调登记表逐条审计\n- ❌ 次要角色只在需要的时候出现、不需要的时候消失 → 次要角色也需要自己的存在逻辑\n- ❌ 情节节奏和情感节奏始终同步 → 刻意制造错位（情节松+情感重）是高级手法\n\n## 与题材壳skill的关系\n\n本skill只管\"多集剧集这个体量该怎么写\"，不管\"这个故事该讲男频/悬疑/复仇哪个题材的具体判断标准\"。如果需要某个题材专属的判断标准，可以在写完分集大纲后另外参考本库对应题材壳skill的技术难点清单；不参考也完全可以独立完成一部剧集。两者是正交的两条轴，不是依赖关系。", "extras": [], "cn": "多剧集剧本写作"}, {"slug": "fashion-commerce-video-workflow", "desc": "上传女装图片，一键生成适合社交媒体的 15 秒竖屏带货视频。", "body": "1. 轻入口询问 先输出一句介绍，然后只问： 你现在有要带货的女装产品图片吗？如果有，先发这一张就行。 不要在第一步同时索要模特、场景、品牌、文案、发布平台细节或完整 brief。\n2. 产品图分析与产品图门槛 收到产品图后，先分类： 手机随手拍：背景杂乱、手持角度、阴影、褶皱、衣架或人体干扰明显。 干净白底图：产品相对孤立，可直接使用或轻度清理。 模特试穿图：有上身效果，但需要提取服装本体。 平铺图：结构清楚，但真实穿着状态不足。 混合场景图：商品可见，但背景和道具会干扰合成。 再判断产品结构覆盖： 领口/衣领是否可见。 袖子/肩带是否可见。 腰线和下摆是否可见。 衣长、裙长或裤长是否清楚。 面料纹理和颜色是否清楚。 整体轮廓和版型是否清楚。 正面主体是否足够完整。 关键卖点细节是否可见。 同时做“可售卖穿搭和配饰盘点”： 识别图中是否有丝袜、袜子、鞋子、包、腰带、帽子、围巾、首饰、发饰、手套、眼镜等可见搭配物。 判断这些配饰是商品的一部分、套装搭配的一部分，还是仅为拍摄道具。 如果用户没有明确排除，默认把丝袜、袜子、鞋子、包、腰带、首饰等和服装强相关的可穿戴搭配列入“待保留配饰清单”，不要在白底提取时直接删掉。 如果不确定某个配饰是否要保留，输出“待确认配饰清单”，让用户确认，而不是擅自移除。 判断结果： 通过：可以进入产品提取。 条件通过：结构基本可用，但需要先做白底提取，并提示可能有细节风险。 不通过：服装太糊、遮挡严重、裁切太多、缺少核心结构，需要让用户换一张图。\n3. 提取白底产品图 如果产品图不是干净白底商品图，先生成一张只有服装的白底图。 产品提取提示词： 从参考图中提取女装产品本体和需要保留的可售卖穿搭元素，去除人物、手部、衣架、杂乱背景和阴影；生成干净白色背景产品图，正面展示，领口、袖子、腰线、下摆、长度、面料纹理和关键设计细节清晰可见。保留原本颜色、材质、剪裁、比例和版型，不添加新图案、不改变设计。若画面中存在丝袜、袜子、鞋子、包、腰带、帽子、围巾、首饰、发饰、手套、眼镜等与本次穿搭强相关的可见配饰，先列入待保留配饰清单，不要默认删除。 如果配饰属于本次售卖穿搭： 从参考图中提取整套可售卖穿搭，包括{配饰清单}；必须完整保留丝袜/袜子、鞋子、包、腰带、首饰等用户确认要保留的单品，统一放置在干净白色背景上。每个单品都保持真实颜色、材质、比例、纹理、图案和相对风格，不添加新配饰，不把配饰误删为背景道具。 输出要求： 干净白底女装产品图。 产品结构完整度判断。 可售卖穿搭/配饰清单：已保留、待确认、可删除三类分开写。 仍需用户确认的风险点。\n4. 同步询问模特和场景 在准备提取白底产品图时，顺便问： 我现在要帮你生成干净的白底产品图了。你是否有模特和场景的照片或偏好？没有的话我可以顺便生成一套适合这件女装的模特和场景。 如果用户提供模特/场景图，就做参考图分析。 如果用户没有参考图，就生成： 一张成年女性时装模特参考图，必须是白底横版双视图：左侧全身图展示身材比例，右侧面部特写展示五官细节、皮肤质感和妆造。 2-3 张完全不同的竖屏真实场景候选图，先让客户选择一个，再进入试穿母版生成；不要一次性只生成一张泛泛的空场景图。 如果生成多张场景、模特或母版选项，必须让客户选择更喜欢哪一个。默认先让客户选场景，再做试穿母版。 模特参考提示
