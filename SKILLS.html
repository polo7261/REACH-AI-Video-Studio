否？视频 prompt 的音频锁声明与 BGM 负面词两处齐否（缺一即重写）？\n\n## 视频铁律\n- 🔴 **单条多分镜（默认强制）**：seedance 单次最长 15 秒、原生支持单条内多分镜+镜间硬切，**不走\"一镜一条+后期拼接\"**。🔴 **镜数目标：15 秒 5-6 镜、单镜约 2-3 秒**（凝望段可到 3 秒档、高潮段 2 秒档，总镜数守住 5-6）；不足 15 秒的短条按同密度折算（8 秒约 3 镜/10-12 秒约 4-5 镜）。**只有跨 15 秒才拆多条、串行后用视频合成能力拼接**。prompt 按秒推进、每镜=景别+@角色动作+运镜+环境+**与下一镜的动作衔接切点**，镜间硬切显式断开。\n- 🔴 **绝对禁止生成背景音乐（铁律，无例外）**：视频生成阶段音频**只允许环境音+对白**，任何形式的背景音乐、配乐、旋律、哼唱、鼓点节拍一律禁止——即使镜头情绪强烈、即使画面出现乐器或耳机、即使模型倾向自动配乐，也绝不允许。BGM 只在第 8 步合成阶段叠加。新海诚的环境音（雨声/电车驶过/蝉鸣/风/城市底噪/铁道口警示音）极重要，每条视频 prompt **常驻声明（不管本条有无对白都写、一字不省）**：\"音频只保留丰富真实的环境音与对白，绝对无背景音乐、无配乐、无旋律、无哼唱、无节拍鼓点\"；负面**常驻**：\"背景音乐、配乐、BGM、旋律、哼唱、节拍鼓点、music、background music、score、soundtrack、melody、humming\"。出 prompt 后自查：声明与负面两处都在否（缺一即重写）。\n- 🔴 **语言锁+人声模式锁**：每条视频 prompt 常驻声明\"人物对白/旁白一律 [选定语言]，模型自主补话也只用此语言，禁其他语种台词/字幕/口型\"（不管本镜有无对白都写）；负面加\"其他语种台词、混合语言口型\"。防无对白镜头被模型自主加话时蹦错语种。同时按人声模式追加：纯氛围→常驻声明\"全片无对白无旁白、人物不说话不开口型\"、负面加\"对白、旁白、说话口型\"；纯旁白→常驻声明\"人物不开口型\"（旁白为画外音、合成阶段处理）；纯对话/穿插→对白台词按剧本写进对应分镜。\n- **人物一致性靠参考图 + 动作要有爆发力**：人物质感与风格由挂载的角色图/场景图参考传递，prompt 正文不写风格词；正文约束动作与稳定性——**动作幅度拉满**：全速奔跑冲刺、跳跃跨越、急停急转身、攀爬翻越、俯身冲出门框，发丝与衣摆大幅甩动飘扬、脚步带起水花或落叶尘土，静态镜头里人物也要有明确的动作进行时（转头/伸手/起身），面部不崩坏。负面常驻：真人化、3D化、线条崩坏、五官畸变、僵硬摆拍、原地不动呆立。\n- **禁溶解叠化**：镜间硬切，负面常驻 no dissolve/cross-fade/fade。\n- **光影必须在场**：视频里每镜都要有明确光源与光效（逆光/反光/灯火），绝不平光。快速运镜与光影快速变化（光斑扫过脸、明暗穿越、车窗流光拉丝）全段可用、鼓励使用。负面常驻：平光无光影、真人实拍质感。\n\n## 视频 prompt 标准模板（强制照此产出，每镜四件套=景别+@角色动作+运镜+环境，缺一不可；正文只写天气/场景/构图/光线氛围+动作运镜，不写风格词，风格由参考图传递）\n```\n@image1 @scene名（参考图声明，逐张，置最前，附识别要点）\n@image2 @角色名（服装/发型/气质关键词）\n…（≤7，多镜共用同组参考图锁一致性）\n\n[整体场景与氛围] 环境与场景内容 + 天气天象状态 + 光源方向与光效（逆光/lens flare/bloom、光在空气中的形态）+ 视角与构图设定。只写天气/场景/构图/光线氛围四类，不写配色、质感、渲染等风格词——风格由挂载的场景图/人物图参考传递。\n\n[多分镜时间轴] 按秒推进，15 秒目标 5-6 镜（单镜约 2-3 秒），镜间硬切，切点走动作衔接（上一镜动作顶点/转折切出→下一镜承接动作起头），每镜=景别+@角色具体动作（优先取自该角色表演基调表）+运镜+环境细节+切点说明；含对白的镜写明 @角色名：\"台词\"：\n分镜1（0-3秒）：[景别，可大远景显人之渺小] + [@角色动作，幅度拉满、有爆发力] + [运镜：冲刺跟拍/急推急拉/环绕/俯冲穿越/甩镜/快速横摇，固定与缓推仅凝望时刻用] + [环境细节：云的流动/雨滴/电车/灯火] → 切点：[本镜动作顶点/转折，下一镜从何动作承接]；\n硬切 分镜2（3-5秒）：[新景别，可大跳（大远景↔特写）由动作衔接驱动] + [承接上一镜动作的延续或呼应] + [运镜] + [环境] → 切点：…；\n硬切 分镜3（5-8秒）：… → 切点：…；\n硬切 分镜4（8-10秒）：… → 切点：…；\n硬切 分镜5（10-13秒）：… → 切点：…；\n硬切 分镜6（13-15秒）：…（末镜收在动作落点，无需切点）；\n（15 秒守住 5-6 镜；凝望段单镜可到 3 秒档、高潮段 2 秒档，靠单镜长短做起伏、不减总镜数。）\n\n[负面提示词] 真人实拍、写实照片质感、3D渲染塑料感、平光无光影、背景虚化成光斑、线条崩坏、五官畸变、人物变形、真人化、僵硬摆拍、对镜甜笑、多余人物、文字水印、网格、背景音乐、配乐、BGM、旋律、哼唱、节拍鼓点、其他语种台词、混合语言口型、no dissolve、no cross-fade、no fade transition、no background music、no score、no soundtrack、no melody、no humming。\n[音频锁] 音频只保留丰富真实的环境音与对白，绝对无背景音乐、无配乐、无旋律、无哼唱、无节拍鼓点。（每条必写、一字不省）\n[语言锁+人声模式] 本片人物对白/旁白一律 [选定语言]，即便模型自主补话也只用此语言，禁止任何其他语种的台词、字幕与口型。[按人声模式追加：纯氛围→\"全片无对白无旁白、人物不说话不开口型\"；纯旁白→\"人物不开口型\"；纯对话/穿插→无需追加]。\n```\n- 参考图声明置最前、逐张附识别要点，按出场重要性排序、单镜 ≤7 张。含具名道具的镜头须加挂道具合图并 @道具名。**参考图只挂场景图/人物图/道具图，不挂 moodboard。**\n- 四件套用顿号/加号短句串联、节奏随情绪；分镜行以\"硬切 分镜N（X-Y秒）：\"起头。用代码块包裹整条 prompt。", "extras": [], "cn": "新海诚动漫美学"}, {"slug": "short-film-writer", "desc": "单一事件冲刺到底的短片剧本", "body": "# short-film-writer\n\n5-10分钟叙事短片的完整写作方法论。短片是**冲刺**，靠信息密度取胜——每个场景都必须推进情节或揭示性格，没有闲笔的空间。本 skill 自包含，不依赖本库其他任何文件；如果要指定\"这个短片该讲男频/悬疑/复仇哪个题材的具体内容判断标准\"，可以在写完后额外参考对应题材壳，但题材壳不是必需前提。\n\n## 边界：不做什么\n\n不产出分镜表、镜号、景别/运镜/构图、转场方式、AI生图/生视频提示词、任何特定生成引擎的格式约束。产出到完整的、可以直接读、直接拍的文字剧本为止。\n\n## 工作流纪律\n\n严格按步骤顺序执行，不跳步；每一步完成后暂停，等待用户的[通过/修改/自检]指令；绝不一次性把后续所有步骤生成完再交给用户；每步结束后提醒用户可以要求[自检]。\n\n自检是内部过程——写之前先在心里过一遍对应步骤的检查清单，不需要在输出中展示自检的思考过程，只需要确保交付的内容已经通过检查。用户仍然可以主动要求[自检]，此时才需要显式地逐条列出检查项并给出评估结果。\n\n## 写作红线（全局最高优先级，任何格式都不能违反）\n\n**绝对不要**：写心理描写（\"他意识到\"、\"她领会到\"、\"内心涌起\"）；写括号暗示（\"（其实是在掩饰紧张）\"）；角色用台词解释设定或主题；说教片段、强行催泪、煽情独白；过度比喻句、类比、书面化的AI腔台词；写任何摄影机拍不到的内容。\n\n**必须做到**：台词口语化，像真人说话；用动作代替解释（动作即潜台词）；对话像冰山，只露一角；所有内容从视听角度出发。\n\n## 视听化写作核心\n\n**Show, Don't Tell**：严禁心理描写，只写能被看见的动作和能被听见的声音。如果一个情感无法通过角色的物理行为传达给观众，这个情感就不该出现在剧本里。错误示范：\"他终于理解了父亲的苦心。\"正确做法：他站在那里看了一会儿，然后把外套脱下来盖在父亲身上。\n\n**潜台词**：对话是冰山，角色说出来的话只是表面，真正的含义在水面之下。避免直白（on-the-nose）对话，利用动作、停顿、回避、话题转移表达真意。直白（错误）：\"我很害怕失去你。\"潜台词（正确）：\"你走的时候把那件外套带上。……外面冷。\"\n\n**动作即潜台词**：所有情感传递必须能用摄影机拍出来。一个好的短片，把所有台词删掉后，观众仍然能大致理解发生了什么。\n\n**台词风格**：口语化，不同角色有不同说话方式（用词、句式长度、习惯性表达）；避免过度比喻和书面化AI腔；不要让角色说出双方都已经知道的事情。\n\n**标准剧本格式**：\n```\n【场景X：地点 / 时间 / 简要视觉描述】\n\n动作/画面描写直接写在台词之间，不加标记，只写摄影机能拍到的东西。\n\n角色A：xxxxxxxxx。\n角色B：xxxxxxxxx。\n\n角色A没有回答。他转身走向窗口，手指无意识地敲着窗框。\n\n角色A：xxxxxxxxx。\n```\n`【场景标注】`用方括号标注地点/时间/关键视觉信息；`角色名：`直接跟对白；`角色名（OS）：`表示内心独白/旁白；动作/画面描写不加标记，直接写在台词之间。\n\n## 核心特征\n\n- **时长**：5-10分钟\n- **角色**：1-2个主角，有完整的Want/Need/Arc\n- **结构**：四段式（起因→发展→高潮→结局），聚焦单一核心事件\n- **弧光**：一次完整的A→B变化\n- **世界观**：简洁明了，30秒内观众理解规则\n- **节奏**：信息密度高，每个场景都必须推进情节或揭示性格\n\n## 短片的核心约束\n\n短片只允许一个**单一核心事件**，不能有支线、不能分散焦点。所有场景都服务于同一个戏剧动作——主角追求目标、遭遇阻碍、做出选择。除非用户特别要求，所有设定都应发生在现实主义背景之下，禁止过于夸张或过于戏剧性的设计。\n\n## 人物设计：拒绝纸片人\n\n**外在需求(Want) vs 内在欲望(Need)**：Want是驱动动作的目标，角色自己意识到的、主动追求的东西；Need是角色自己未曾意识到的灵魂缺口，通常是Want的深层原因。两者之间的张力是角色弧光的发动机。\n\n**人物弧光**：弧光 = 从A状态到B状态的不可逆变化。短片的弧光是一次性的跳跃（A→B），不需要像长片那样经历多次\"伪变化\"。\n\n**人物小传**：前史不是背景介绍，而是冲突的根源。关键事件应该解释：为什么角色有这个Want？为什么角色看不到自己的Need？角色的矛盾性从何而来？\n\n**矛盾性**：好的角色至少有一层矛盾——外在表现 vs 内在真实（外在自信vs内在自卑，外在冷漠vs内在渴望连接）。矛盾性让角色立体，也让潜台词有了空间。\n\n## 选题工具库（用户没有明确想法时，内部引导用，不直接展示给用户）\n\n当用户还没有明确的故事概念时，不要把下面的方法论摆给用户看，而是通过自然对话判断用户的模糊方向属于哪条路径，用对应方法引导。\n\n**路径1：从主题出发**（用户信号：抽象命题/社会议题/\"我想讲关于XX的故事\"，如\"关于记忆\"\"孤独\"）——引导方法：帮用户把抽象主题转化为具体戏剧动作。\"关于记忆\"不是故事，\"一个即将失去所有记忆的人必须在24小时内选择保留哪一段\"才是故事。问：这个主题下，什么人在什么处境下会被逼到不得不做选择？\n\n**路径2：从人物出发**（用户信号：一种矛盾性格/\"我想写一个XX样的人\"，如\"一个极度害怕水的游泳教练\"）——引导方法：从矛盾性格中提取戏剧动作，矛盾本身就是冲突的种子。问：这个人最害怕面对什么？如果逼他面对最害怕的事，会发生什么？\n\n**路径3：从空间/环境出发**（用户信号：一个具体地点/封闭空间/特殊世界，如\"一座老茶馆\"\"一列永不停站的列车\"）——引导方法：空间即规则，一个特殊空间暗示了自己的运行规则和权力结构。问：这个空间里谁在上面谁在下面？什么资源稀缺？什么行为被禁止？空间越封闭、规则越极端，戏剧张力越强。\n\n**路径4：从关系出发**（用户信号：两个人之间的张力/\"我想写两个XX之间的故事\"，如\"一对即将离婚的夫妻\"）——引导方法：关系中的张力来自两个人想要的东西互相矛盾。明确各自的Want是什么？为什么不可能同时实现？什么处境下这个矛盾会被逼到极致？\n\n**路径5：从标签/概念碰撞出发**（用户信号：几个关键词/一种感觉/\"我想把XX和XX结合\"，如\"外卖骑手+科举\"）——引导方法：用概念嫁接（取A的机制+B的场景）、时空错置（把人/技术/制度放进它不属于的时代地点）、隐喻具象化（把抽象焦虑变成物理规则）、反转并置（两个表面相似实则矛盾的事物放同一场景）、规则反转（取现实规则的反面）五种工具碰撞概念。\n\n**操作流程**：听用户自由表达（哪怕只是一个词）→判断属于哪条路径（用户不需要知道路径存在）→用对应工具提出具体、有启发性的问题深挖（不要问\"你想表达什么\"这种空泛问题）→产出3-5个具体方案供选择→不展示方法论本身，用户看到的是\"帮你想出了几个好点子\"。\n\n当用户完全没有方向时，不要列路径菜单，用自然对话启发：\"最近有没有什么新闻/画面/身边的事让你觉得'这也太荒诞了'？\"\"如果你能把一个现实规则反过来，你最想反转哪个？\"\"有没有一个空间让你觉得'这里本身就像一个故事'？\"\"有没有两个看起来不相关的东西，你觉得放一起会很有意思？\"\n\n---\n\n## 完整八步工作流\n\n### 第一步：破题与核心动作\n\n**目标**：确立短片的\"核\"。如果用户已有构思直接使用；如果没有，用上文选题工具库引导（不展示路径菜单）。\n\n**执行逻辑**：基于用户输入构思3-5个核心戏剧动作——戏剧动作=目标(Goal)+阻碍(Conflict)，必须是\"有目的的追求\"；确保事件聚焦，适合短片体量。\n\n**输出格式**（严格按此输出，不添加场景等未提及内容）：\n* **方案 A/B/C：** 主角 / 目标(Want) / 阻碍(Conflict) / 一句话故事梗概(Logline)\n\n> 请回复\"通过\"进入下一步，或告诉我修改意见。或选择某个方案让我[自检]。\n\n**[自检：核心概念与戏剧动作]** 是否建立了\"目标+冲突\"？目标是否合理且急切？是否和阻碍有强烈关系？是否存在明确的内/外部冲突？阻碍是否在合理尺度内？目标和阻碍的冲突是否是驱动故事的发动机？\n\n### 第二步：梗概草稿\n\n**目标**：让用户对整体故事走向和气质有基本判断，再往下深入。\n\n**执行逻辑**：基于选定方案写一段话（100-200字）的故事提要，应包含主角是谁、处于什么处境、因为什么事件被逼入什么困境、最终走向什么结局（可以模糊）；提要的语气应暗示全片气质——沉重还是轻快、温暖还是冷冽。\n\n> 这个梗概在后续步骤中可以继续调整。请回复\"通过\"进入人物设计，或告诉我修改意见。\n\n**[自检]** 梗概是否传达了故事的核心冲突？读完后对\"这是一个什么样的故事\"有清晰感受吗？语气是否暗示了全片气质？\n\n### 第三步：人物深度与弧光\n\n**目标**：拒绝纸片人，建立人物内在张力。\n\n**执行逻辑**：设计Want vs Need；设计人物小传（挖掘前史作为冲突根源）；设计矛盾性（外在表现vs内在真实）；除非用户特别要求，禁止过于夸张的设计。\n\n**输出格式**：人物[姓名] / 外在需求 / 内在欲望 / 人物弧光(A状态→B状态) / 人物小传关键点 / 矛盾特征(外在vs内在)\n\n> 请回复\"通过\"进入下一步，或告诉我修改意见。你也可以让我[自检]。\n\n**[自检：人物塑造与弧光]** 外在需求和内在欲望是否清晰且对立？是否预设了不可逆的内在变化？结局是否展示了\"新常态\"？是否具备矛盾性？行为是否符合小传逻辑？\n\n### 第四步：前史与世界观（短片精简版）\n\n**目标**：遵循\"电影是现实生活的横截面\"——故事开始之前，世界已经存在了。短片不需要像长片那样完整建造世界观，但需要明确以下信息（编剧自己必须知道，不一定全部展示给观众）：\n\n**输出格式**：时代/环境背景 / 角色前史关键事件（在故事开始之前，主角经历过什么导致了当前的处境和性格）/ 关系既往（如有重要关系，这段关系在故事开始之前是什么状态）/ 故事从哪个横截面切入（为什么选择从这个时刻开始讲）\n\n**注意**：前史信息在剧本中通过对白和视觉线索自然散落，不要集中闪回或旁白交代。如非必要不用闪回。\n\n> 请回复\"通过\"进入结构大纲，或告诉我修改意见。\n\n### 第五步：结构大纲\n\n**目标**：搭建短片骨架，确保节奏递进。\n\n**执行逻辑**：使用四段式结构；只有一个单一核心事件，避免支线；第四步中的重要前史细节需在第一幕和第二幕中自然展示（如非必要不用闪回）；必须包含激励事件和\"一切尽失\"时刻；开场的前15秒必须有视觉钩子——第一个画面就应包含信息或悬念，最有效的是一个\"不太对\"的日常画面（看起来正常，但某个细节让人起疑）。\n\n**输出格式**：\n* **第一幕：起因** — 开场钩子（前15秒的画面/动作） / 建置（故事常态展现） / 激励事件（打破平衡）\n* **第二幕：发展** — 冲突升级（障碍1） / 冲突进一步升级（障碍2，不可省略） / 中点（伪胜利/伪失败）和一切尽失\n* **第三幕：高潮** — 最终对决（动作顶点） / 关键选择和故事反转\n* **第四幕：结局** — 新常态（弧光完成）\n\n> 请回复\"通过\"进入下一步，或告诉我修改意见。你也可以让我[自检]。\n\n**[自检：结构与节奏]** 开场钩子是否在前15秒内就抓住观众？四个部分是否清晰？激励事件、高潮是否明确？每部分是否都在推动情节或揭示性格？是否去除了无效情节？障碍2是否存在且与障碍1不同质（不能是同一种阻力换个说法）？各部分时长预算是否合理（建置约15%，发展约40%，高潮约25%，结局约20%）？\n\n### 第六步：场景列表\n\n**目标**：将大纲转化为具体的视听单元。\n\n**执行逻辑**：将第五步每个情节点拆解为一个或几个核心戏剧动作（目标→障碍→结果）；确保每个大戏剧动作可拆解为几个微型戏剧动作；每场戏标注预估时长和双轨节奏状态。\n\n**输出格式**：第1场戏……（约X秒）情节：松/中/紧｜情感：轻/中/重；第2场戏……；时长累计：X分X秒 / 目标总时长X分钟\n\n> 请回复\"通过\"进入下一步，或告诉我修改意见。你也可以让我[自检]。\n\n**[自检]** 每个情节点是否都有具体拆分？场景连接是否紧凑？相邻场景之间是否有情节过渡？场景时长累加是否与目标总时长吻合？是否有连续3场以上同一节奏状态（如有需调整）？情节节奏和情感节奏是否有至少一处错位（更高级的叙事）？\n\n**如果短片总时长超过8分钟或场景超过8场，第六步完成后建议触发一次记忆检查点**（见下文\"记忆检查点\"节），锁定角色状态和活跃线索后再进入写作。\n\n### 第七步：场景写作\n\n**目标**：填充血肉，执行视觉写作和潜台词。请用户指定要生成的场景编号（或全部）。\n\n**执行要求**：视觉写作——严禁心理描写，只写能被看见的动作和能被听见的声音；潜台词——对话像冰山，避免直白，利用动作/停顿/回避表达真意；标准剧本格式输出。\n\n> 请回复\"通过\"进入下一步，或告诉我修改意见。你也可以让我[自检]。\n\n**[自检：场景写作与视听语言]** 是否有心理描写（如有则Fail）？是否用画面叙事？对话是否过于直白？是否利用了潜台词和肢体语言？台词是否口语化？\n\n### 第八步：剧本医生与抛光\n\n**目标**：诊断与优化。\n\n**执行逻辑**：作为剧本医生通读全片；寻找逻辑漏洞、节奏拖沓、直白对话；提供What-if多版本探索建议；检查各场景时长预算——是否有场景比预计长/短太多？对整体节奏的影响？\n\n**输出格式**：\n* **诊断报告**：节奏问题（含双轨节奏诊断） / 时长问题（哪些场景过长过短，高潮段时长是否足够） / 逻辑漏洞 / 对话问题\n* **优化建议**：（针对某场景的潜台词重写、针对结局的反套路构思）\n\n**[综合自检]** 根据四大板块（核心概念、人物、结构、视听）给出最终评语及修改意见。\n\n> 剧本初稿完成。你想对哪部分精修？\n\n---\n\n## 双轨节奏系统\n\n节奏不是只有一条线——外部情节节奏（事件密度和强度：紧=高密度事件/快速对话/追逐/揭露，松=日常场景/独处时刻/沉默）和内在情感节奏（角色情感波动：重=告白/背叛/失去/恐惧/狂喜，轻=调侃/日常闲聊/安静陪伴），两条轨道可以同步也可以错位，错位本身就是强大的叙事工具：\n\n- **情节松+情感重**：两个人安静地坐着吃饭，什么事都没发生，但观众知道其中一个人明天要走。画面越平静，情感越重。\n- **情节紧+情感轻**：激烈的追车戏，但角色在打趣、配乐轻松。紧张的事件被轻盈的情绪包裹。\n- **情节紧+情感重**：高潮段——事件密集且情感炸裂，是全片顶点，不能持续太久。\n- **情节松+情感轻**：纯粹的呼吸场景，让观众休息。\n\n在结构大纲和场景拆解阶段，应画一张\"节奏波浪图\"标注每段的外部情节强度和内在情感强度，检查起伏对比。应避免：两条线长时间同时低位（观众无事可看也无感可投）；两条线长时间同时高位（观众疲劳，高潮不再特别）；任何一条线单调上升没有回落（没有呼吸感）。\n\n## 时长估算方法\n\n**对白估算**：1页标准剧本格式≈1分钟成片。中文剧本中，大约200-250字的对白+动作描写≈1分钟。\n\n**场景估算规则**：纯对话场景按对白字数估算；动作/蒙太奇场景按画面数量估算（每个独立画面约3-5秒）；沉默/情绪场景容易低估——一个角色站在那里什么都不做，成片中可能需要10-15秒才有足够情感分量；转场/过渡不要忘记计入，通常每次2-5秒。\n\n**场景时长标注格式**：\n```\n【场景3：医院走廊 / 夜 / 荧光灯嗡嗡响】（约1分30秒）\n  情节节奏：中（一次关键对话）\n  情感节奏：重（角色第一次面对真相）\n```\n\n**短片全片时长参考比例（8分钟为例）**：建置1.5分钟 / 发展前半2分钟 / 发展后半2分钟 / 高潮1.5分钟 / 结局1分钟。实际创作可灵活调整，但调整后应意识到自己在做什么（比如\"我故意让建置占40%时长，因为这是一个慢热型故事\"）。\n\n**节奏诊断**（剧本医生阶段）：高潮段时长是否足够（太短会让高潮感觉被压缩）？建置是否太长（观众等太久才进正题）？是否有连续超过3分钟的单一情绪段落（无论紧张还是松弛，持续太久都会失效）？两个高情感场景之间是否有足够的呼吸空间？全片最长的单场戏是否有足够理由占据那么多时长？\n\n## 记忆检查点（超长短片专用，多数短片不需要）\n\n只有在第六步完成后短片总时长超过8分钟或场景超过8场时才需要触发。检查点是一份结构化压缩摘要，不是全文复述：\n\n```\n📌 记忆检查点 | 短片 | [当前位置]\n【已完成进度】当前处于第几步 / 已写到哪个场景或段落\n【故事核心（不变）】Logline / 核心戏剧动作：目标→阻碍\n【角色当前状态】[角色名]：物理状态/情感状态/当前知道什么/当前想要什么\n【已完成段落摘要】场景1：一句话概括发生了什么+核心价值转变；场景2：……\n【活跃线索】需要后续回应的线索及状态\n【节奏状态】上一段落的情节/情感节奏 → 下一段落建议方向\n【待写内容预告】下一个要写的场景是什么，核心戏剧动作是什么\n```\n\n## 短片节奏技法\n\n**前史展示**：前史信息通过对白和视觉线索自然散落，不要集中闪回或旁白交代。\n\n**节奏的拉伸与回弹**：拉伸——用重复动作、平缓语速、静态画面建立预期；回弹——在毫无预警处迅速打破平衡，用极短的视听语言制造节奏断裂。\n\n**结局**：展示弧光完成后的\"新常态\"——角色变化后的世界是什么样的。不需要解释角色学到了什么，用一个画面让观众自己感受。\n\n## 跨格式技法借鉴（短片可借用的部分）\n\n短片体量小，但可以从更大或更小的体量里借几个具体工具，用在自己的局部段落上：\n\n**从长片借**：McKee价值转变检验法可以拿来检查短片的每一场戏——场景结束时的核心价值是否与开始时不同？如果一场戏结束时什么价值都没变，考虑删掉它，这条标准比\"感觉这场戏有点多余\"更可执行。如果短片的人物感觉\"太平了\"，可以借用Ghost/Lie/Flaw的思考方式——不需要完整展开，只需要暗示角色的行为背后有一个不被说出的原因，一个细节就够。伏笔/回扣在短片5-10分钟的尺度里反而冲击力更大——因为观众还记得，第1分钟不经意出现的一个物件，第8分钟突然成为关键，效果是炸裂的，可以在第五步结构大纲阶段主动设计\"有没有一个东西可以在开头种下、结尾翻转\"。如果短片里有一个次要角色，可以借用\"B Story映射主题\"的逻辑——让这个次要角色走主角\"没走的那条路\"，这样次要角色就不只是工具人，而是主题的另一面。\n\n**从概念片借**：高概念翻转的思路（\"这场戏的最后一秒能不能让观众重新理解这场戏的第一秒\"）可以用在短片的结局上，制造一个punch。概念纯度检验（能否一句话说清、5秒内能否用画面呈现）可以拿来检验短片的Logline——如果一句话说不清楚，说明核心概念还不够锐利。\n\n## 常见陷阱\n\n- ❌ 引入支线或多个核心事件 → 短片只能有一个单一核心事件，砍掉一切分散焦点的内容\n- ❌ 障碍2和障碍1是同一种阻力换个说法 → 必须换一种不同类型的阻碍\n- ❌ 前史用闪回或旁白集中交代 → 通过对白和视觉线索自然散落\n- ❌ 结局用台词总结角色学到了什么 → 用一个具体画面让观众自己感受\"新常态\"\n- ❌ 没有做时长预算，导致高潮被压缩或建置过长 → 从第五步就开始标注时长\n- ❌ 连续3场以上同一节奏状态 → 用双轨节奏检查起伏\n- ❌ 开场用于\"慢慢进入状态\" → 短片没有时间铺垫，前15秒必须有视觉钩子\n- ❌ 人物弧光设计成长片式的多次伪变化 → 短片弧光是一次性跳跃，别拖\n\n## 与题材壳skill的关系\n\n本skill只管\"5-10分钟这个体量该怎么写\"，不管\"这个故事该讲男频/悬疑/复仇哪个题材的具体判断标准\"。如果需要某个题材专属的判断标准，可以在写完大纲后另外参考本库对应题材壳skill的\"这一集/这段废了\"检验清单；不参考也完全可以独立完成一个短片。两者是正交的两条轴，不是依赖关系。", "extras": [], "cn": "叙事短片剧本写作"}, {"slug": "shortvideo-diagnostics", "desc": "拆钩子留存，或拆改镜头指令", "body": "# content-analyzer\n\n工具型 skill——一组内容分析模式，逐步生长。每个模式把用户**已有的一件具体内容素材**（视频、片段、URL 指向的成片）解析成**结构化、面向下游用途**的分析。在分析阶段被工作流（或直接）调用，位于任何下游编辑/营销/生成步骤之前：当一件具体内容必须先被拆成结构化、面向用途的分析时用它。\n\n按你的意图选**一个**模式，只跑匹配的那个，不要两个都拉。\n\n## 模式选择\n\n| 意图 | 产出 |\n|---|---|\n| 为营销分析一段视频 | 视频的营销拆解——钩子（视觉/听觉/语义）、留存节拍、CTA、可传播性（STEPPS） |\n| 为编辑分析一段视频 | 针对单个增/删/改/替的改动点分析，落到重生成对应分镜的指令 |\n\n先用 `analyze_video_clip_storyboard` 拿到分镜、节奏、镜头语言，作为两种模式共同的**结构底座**；再在结构之上做对应模式的提炼。\n\n## 模式一 · 营销拆解（marketing-analyze）\n\n在结构底座之上，逐层提炼：\n\n- **钩子（前 1-3 秒抓人）**——分三路各自定位：\n  - 视觉钩子：开场画面的反常/张力/信息缺口（谁/什么/异常状态）。\n  - 听觉钩子：开场音效/口播/音乐的抓耳点。\n  - 语义钩子：文案/口播抛出的悬念、承诺或冲突命题。\n- **留存节拍（retention beats）**——沿时间轴标出维持观看的节点：信息释放的节奏、反转/揭晓点、视觉换挡、\"再等一下就有\"的悬置，指出哪几拍在防跳出。\n- **CTA**——行动号召出现的时机、形式（画面/口播/字幕）、措辞与指向的下一步动作。\n- **可传播性（STEPPS 六要素）**——逐条判定这条内容触发分享的机制：\n  1. **社交货币 Social currency**：分享它能让人显得懂行/前卫/有品位吗？\n  2. **触发物 Triggers**：有没有把内容与日常高频场景/物件绑定，让人反复被提醒？\n  3. **情绪 Emotion**：唤起的是高唤醒情绪（惊叹/愤怒/好笑/焦虑）还是低唤醒（满足）？高唤醒更易被转发。\n  4. **公开性 Public**：内容/产品的使用是否可见、可被模仿、留下公开痕迹？\n  5. **实用价值 Practical value**：是否提供可转告他人的实用信息（省钱/省事/有用技巧）？\n  6. **故事 Stories**：核心信息是否被包进一个会被复述的故事载体里？\n\n输出为结构化要点（分条/表），而非散文式复述。\n\n## 模式二 · 编辑改动分析（edit-video-analyze）\n\n针对用户想对成片做的**单个改动点**（增加 / 删除 / 替换 / 修改某元素）做分析。\n\n- 先在结构底座上**定位改动落在哪一分镜/哪一段时间轴**，说清改动的对象、位置、期望效果。\n- **本环境无 video-to-video 直接编辑能力**：视频靠 `generate_video_v3` 用文本 + 锚点重新生成。因此改动分析的产出不是一条 v2v 编辑指令，而是**把受影响的分镜改写成新的生成指令**——保留不动的分镜锚点不变，只重写被改动分镜的提示词/构图/动作/时长，交给下游重生成该分镜后再拼接。\n- 一次只处理一个改动点；多个改动点逐条拆开、各自落到对应分镜的重生成指令。\n\n## 输出去向\n\n两种模式的结构化分析都写进目标分镜表 / 锚点清单（`write_file_v2`），供 video-generation 或复刻流程直接消费。\n\n## 边界（勿用本 skill，改道）\n\n- 只针对**已有的具体内容**做分析；趋势 / 爆款 / 创作者发现类研究不在此。\n- 产品输入预处理（把产品图/URL 解析成品类/用途/开场机制）→ product-analyzer。\n- 品牌资产提取（从品牌主页拿 logo、配色）→ brand-analyzer。\n- 图像 / 视频生成本身 → 对应生成能力或 workflow 流程。", "extras": [], "cn": "短视频诊断分析师"}, {"slug": "shunji-iwai-cinematic-aesthetic", "desc": "岩井俊二纯爱电影美学，高度呈现其诗意、细腻、青春感的影调与视听语言", "body": "# 岩井俊二电影美学\n\n> 🔴 **请严格按照该 SKILL 分步执行。** 版本：v4.1.6\n\n## 底层 DNA（无条件，每条画面都带）\n\n1. 🔴 **逆光为绝对主光（岩井签名，最重要）**：光从人物背后或侧后、或窗外大量涌入，逆光作为画面主光源而非补光——高光从人物轮廓、发梢、肩线大片柔晕溢出、开花过曝，发丝边缘被打透成半透明的亮金/亮白边缘光，人脸可处于柔和的透光半剪影。**亮而不死白**：高光柔晕但保留一丝层次与色彩、绝不整片冲成纯白丢细节。整体提亮、往亮里推，**绝不压暗、绝不低调**。\n2. 🔴 **高调通透 + halation 光晕**：画面整体高调、明亮、通透、有空气感与光雾，像蒙了一层柔光。高光柔化晕染开花（halation/bloom），光斑、耀斑、空气中的浮尘在光里浮动。柔光滤镜质感，杜绝一切数字硬锐、高清纪实感。\n3. **35mm 颗粒 + 2000s DV 数码胶片质感**：有机胶片颗粒 + 2000 年代初 DV/早期数码的清透，色彩饱满浓郁有胶片密度、画面有当下感。岩井不是\"褪色旧照片\"——是数码清透锐利 + 优质胶片的浓郁色彩与颗粒，颜色活的实的当下的，绝不发旧/掉色/做旧滤镜。去掉的只是\"火气与金黄\"，不是色彩浓度。\n4. **禁金黄铁律**：不出任何整体发黄/金橙/琥珀暖调。逆光夕阳一律冷白/银白/淡青光色，高光柔晕为冷白而非金黄。即便黄昏/室内暖灯也以冷调或中性偏冷处理，暖色仅小面积点缀（红围巾、肤色微暖），绝不铺满。\n5. **低对比 + 暗部不死黑**：整体低对比柔和，暗部为暖褐/柔灰，绝不纯黑死黑。\n6. **浅景深柔焦**：背景化为柔软光斑，浅焦呼吸感。\n7. 🔴 **情绪内核：明亮表皮包裹悲伤（岩井灵魂，务必拉住）**：这是岩井最核心的气质——画面越是明亮、通透、逆光灿烂，底下越藏着淡淡的哀伤、怅惘、求而不得与怀念。不是单纯的\"明媚青春\"，是**明媚的表面下有说不出的疼与温柔**。画面要有体温、有记忆感、像一段\"似曾相识、回不去了\"的旧时光。人物为绝对主角、亲密尺度（近景/中近景，人是画面情感中心），而非大空间里的一个小点。⚠️ 绝不能做成冷漠纪实、也绝不能做成没心事的糖水小清新/网红日系——差别全在这层\"明亮下的悲伤\"。\n8. **风让画面呼吸**：飘发/摇草/飞花/雪光尘，时间在流动、空气在动。\n9. **范围**：只做纯爱清新一支，不做燕尾蝶式暗脏都市。\n\n## 质感尾词（每条图像 prompt 默认带）\n\n`35mm 胶片 + 2000s DV 数码质感，色彩饱满浓郁有胶片密度、冷调中性（不褪色发灰发旧），强逆光、冷白银光中带 halation 光晕开花，高光明亮柔晕但保留层次（不冲纯白），发丝边缘透光，柔光滤镜，高调通透明亮，细腻胶片颗粒，柔焦朦胧，低对比暗部不死黑，浅焦光斑，似曾相识的青春记忆温度；不要发黄/琥珀/暖黄滤镜、不要做旧寡淡、不要高光全过曝死白、不要暗部死黑`\n\n## 流程（8 步标准流程）\n\n> 🔴 **全局询问规范**：所有需要用户确认/选择的环节，一律用**选项卡**跳出，不退化为纯文字问答。封闭问题给预设选项+自定义项；开放内容（如故事梗概）用\"我来提供/帮我生成\"两项承载。\n\n1. **统一入口问询（弹选项卡）**：一个框问清六项：① 时长（单镜≤15秒/单集30-60秒/多集数分钟/自定义）② 执行模式（全自动/手动）③ 画幅（默认 4:3，可选 16:9/21:9/自定义；分辨率默认 720p）④ 对白语言 ⑤ 3 个核心元素（生活空间/家庭关系/日常物件）⑥ 有无故事大纲。答完写入 memory。moodboard 和故事的生成动作留到第 2、3 步。\n2. **风格确认（生成动作）**：据 3 元素生成 moodboard（图像生成能力，4:3，单一融合画面铺满出血、禁白边/拼贴/分格）→ 存为风格锚资产、记下归档标记。⚠️ moodboard 必须呈现真实电影胶片质感，**禁漫画感/插画感/二次元感/CG 渲染感**（禁描边轮廓、禁赛璐璐/厚涂画风、禁过于完美均匀的 CG 光效）。\n3. **故事（生成 + 与 moodboard 打包弹选项卡确认，全自动模式跳过确认）**：有大纲则遵循、仅叠加岩井风格化；无则据 3 元素生成（青春/初恋/记忆/淡淡哀伤）→ **moodboard 与故事打包统一弹选项卡确认**（均确认无误/调整 moodboard/调整故事）→ 通过后进第 4 步。\n4. **资产 + 分镜表（弹选项卡，全自动模式跳过此确认）**：先产资产——有戏角色必产白底棚拍模卡定妆图（锁脸/服装/发型，后续一律 @角色名 引用）、场景图单张空镜绝不分屏且 🎨 **强制挂 moodboard 风格锚作参考**（仅锚色调/光感/质感、不锚构图）、具名道具汇总一张白底道具合图 → 再基于故事和资产列**完整分镜表**（每镜：景别+@角色动作+运镜+环境+时长）→ 资产与分镜表**打包统一确认**（确认无误/需要调整），通过才进第 5 步。\n5. **生成视频**：按已确认分镜表逐条生成，挂场景图/角色图/道具图锁一致性，🔴 **不挂 moodboard**（此禁令仅限视频生成；第 4 步场景图生成时必须挂 moodboard 风格锚，两者勿混淆）。\n6. **音乐（生成动作，暂不合成）**：视频定稿后，agent 按〈音乐〉选支逻辑**根据剧本情绪自动选定风格分支**、直接生成（默认 mureka），不询问用户。**生成后先不合成、暂存**，等第 8 步用户决定。\n7. **合成**：跨 15 秒才拆多条、串行后拼成完整成片（此时不含 BGM）。\n8. **成片后统一处理与询问（弹选项卡）**：一个框多选：① 加字幕 ② 合成背景音乐 ③ 改音乐后再合成。关键约束：\n   - 🔴 **字幕文案硬规则（询问项内联，防错跳单语）**：对白为中文→中文单语字幕；对白为**非中文**（日语/英语等）→**双语字幕：上轨中文、下轨影片语言**（例：日语对白→中日双语【上中文下日文】；英语对白→中英双语【上中文下英文】），**非中文绝不可只出单语原文**。选项卡中字幕选项的文案必须按此规则写明（如\"加中日双语字幕\"而非\"加字幕\"）；执行前回读校验一次字幕语言配置是否与对白语言匹配，不匹配则纠正后再执行。\n   - **执行顺序强制先字幕、后音乐**（当前工具在有音乐时生成字幕会出问题）。\n   - **音频混音默认值：原声 +8dB、BGM -2dB**。\n   - 下挂后期剪辑工具（agent.tool.edit_video）：\n     - **字幕** add_subtitle：白字黑色描边；中文对白单语/非中文双语（上轨中文、下轨影片语言）。\n     - **转场** transition：默认硬切；用户要转场未指定方式→淡入淡出；可选淡入淡出/黑场/白场/噪点溶解；AI 转场不在此列。⚠️ 禁溶解叠化只约束视频生成阶段，合成后可正常加转场。\n     - **抽帧** extract_frames：agent 自动调用辅助判断转场；用户也可主动要求。\n     - **裁剪** clip：秒级精度，用户描述需裁剪内容后执行。\n     - **文字贴片** text_overlay：片名/章节 title card、cast 名单、人名条；用户可自定义文字内容与样式。\n\n## 画幅与画质（写死）\n\nmoodboard/场景图 4:3；人物模卡 16:9；视频默认 4:3、**720p**（可改）。图像默认 libimage 模型、2K 分辨率、标准画质（用户可改）。\n\n## 图像 prompt 语言\n\n主体中文；技术词（halation/35mm/DV）必要时留英文。负面词与正文物理分离、放独立负面字段。\n\n## 人物铁律\n\n- **锁质感、放身份**：35mm+DV 清透冷调质感是硬约束；发色/发型/服装/亚文化造型尊重用户设定、不做岩井化纠偏。\n- **皮肤是冷调中的暖例外**：整体冷调，但肤色保持透亮红润有血色光泽、绝不青灰暗沉。女性皮肤额外提一档（细腻透亮有柔光泽）。\n- **模卡 ≠ 出片**：模卡用纯白底 + 明亮均匀棚拍正面光（脸充分提亮、面部细节优先），绝不用逆光/过曝。版式 16:9：左三视图（正/侧/背）+ 右大面部特写（必出、不可省、不可画成全身）。\n- 🔴 **模卡模板（照填，禁改结构与质感尾词，只换 \\[\\] 占位；若版式散架/视图不全退回英文版）**：\n\n```\n纯白无缝背景角色三视图定妆图，16:9 横向排版，严格分为必须同时存在的两个区域。左区：同一角色正面/侧面/背面三个全身视图并排站立，高度一致、脚部对齐。右区（必须存在、不可省略）：同一角色的大幅面部特写占据右区大部分，清晰呈现脸部与上胸，用于锁定脸型、眼神、年龄与皮肤——右区特写与左区三视图同等重要、必须渲染出来。岩井俊二电影质感，应用于[角色身份与气质]，明亮柔和均匀的棚拍正面光充分照亮面部、颧骨与鼻梁有柔和高光，面部细节清晰锐利，皮肤透亮细腻有健康红润温度与自然光泽（不暗沉、不蜡黄、不发灰、不油腻），[体态]，[发型与发色]，[服装]，[神态与眼神]，不持有任何道具书包饰品（仅人物本身，道具单独出道具图），自然放松中性站姿，饱满有胶片密度的冷调中性配色以[冷色调1]和[冷色调2]为基调（鲜活饱满不寡淡发灰）同时保持皮肤温润透亮红润（皮肤是冷调中的暖例外），细腻35mm胶片颗粒，2000年代初数码清透质感有胶片色彩密度（不褪色不做旧不像老照片），明亮均匀的棚拍干净风格，高细节透亮面部，清晰五官，所有视图与特写保持同一角色一致性\n```\n\n负面(独立框)：`磨皮塑料脸、油亮偶像滤镜、锐利数码渲染、逆光、过曝、金黄暖调、死黑、高对比、寡淡发灰做旧、暗沉蜡黄皮肤、背包书包手持物饰品道具、面部不一致、换了另一个人、多个不同角色、两张分开的角色卡、右区出现全身像、缺少面部特写、复杂背景、水印`\n\n- 🔴 **人物图不带任何道具**：模卡只出人物本身（身形/服装/发型/脸），绝不背包/拿随身听手机伞书本/戴非必需饰品——道具一律由道具合图统一管、后续镜头再引用（防人物图自带道具与道具图冲突）。贴身服装不算道具；负面加\"背包、书包、手持物、饰品、道具\"。\n- **儿童安全**：禁\"未成年年龄数字+身体围度词+暴露服装\"三连，改学龄气质词。\n\n## 场景卡（按场景取用，共享底层 DNA）\n\n- **逆光特写**：太阳从背后直射进镜头、强逆光柔晕开花、发丝透光、柔焦光晕、冷调清透。可半剪影（脸可见、暗部不死黑）或纯剪影。\n- **雪景（情书）**：冷蓝白高调雪世界+一点暖色呼吸（橙毛衣/红邮筒）、柔和漫射光（非逆光开花）、飞雪、极低对比。\n- **教室（莉莉周）**：窗为唯一光源、强逆光涌入形成光感（朦胧漫射、有机不规则，**绝非 CG 渲染级完美锥形体积光柱**）、潮湿朦胧雾化、窗边过曝与室内柔暗共存、人物孤独留白。⚠️ 三条硬限制：① **光柱要有机、不规则、带颗粒感**，禁设计感体积光/粒子特效式均匀光锥；② **浮尘分布随机不均匀**，禁圆形均匀粒子特效；③ **人物逆光轮廓要自然晕染**，禁硬描边式轮廓光（漫画感来源），人物脸侧保留少量柔和填光可辨、不走纯描边剪影。\n- **外景日常**：街道/河堤/上学路。晴天软阳低角度仰拍蓝天樱花（花与爱丽丝）/ 阴天漫射 / 黄昏冷暮逆光（禁金橙）。\n- 🌾 **莉莉周麦田（招牌，必出高水准）**：高饱和浓郁翠绿稻田铺满（自然纯正翠绿，非粉绿/灰绿/暖草绿/偏青蓝）、稻秆稻穗清晰可见非平涂绿块、白日强逆光天空很亮但保留层次（不死白）、白衬衫戴耳机少年低头沉浸、低机位稻浪填满下三分之二、风吹稻浪同向起伏。负面锁：寡淡发白的绿、灰绿、粉薄荷绿、暖黄草绿、平涂糊成一片、看不到稻穗、整体青蓝色膜。用户一提麦田无条件套此卡、出图自查绿够浓且纯正、稻穗在、天空不死白。\n  - 完整 prompt（可直接用）：`莉莉周式标志性绿色稻田，高饱和浓郁的翠绿／祖母绿稻田、有胶片密度、铺满整个画框（自然鲜活的浓翠绿，绝非清新粉绿、绝非寡淡黄绿、绝非偏暖发干的草绿、也不要整体偏青蓝发冷膜），一根根稻秆与饱满下垂的稻穗清晰可见，近景稻叶锐利、带露珠反光，向远处层层叠叠虚化出纵深，白日强逆光、天空很亮但仍保留层次与天色（不全冲成纯白、高光柔晕但保留细节），低机位或齐胸视角、翻涌的稻浪填满画面下三分之二、头顶留一线明亮但有层次的天空，风把整片稻田吹成一道同向起伏翻涌的浪，柔焦与光晕，2000 年代初 DV 质感、色彩有密度（不褪色、不做旧），类 35mm 颗粒，暗部为暖黑不死黑`\n\n## 运镜（每镜配一种，与动作咬合，默认动感）\n\n快速横移跟随 / 手持冲击跟拍 / 逆光摇镜 / 推拉急变 / 仰拍固定 / 跳切机位跳跃。⚙️ 极慢推近、升格慢动作默认禁用，仅用户点名时启用。\n\n## 剪辑节奏（默认动感快剪一支）\n\n- 默认实时速度、镜间硬切，禁抒情长镜头、禁升格慢动作、禁溶解叠化（仅用户点名时启用）。\n- 景别相邻跳一档为限，禁暴跳（近景↔大全景）。\n- 同一动作跨镜须状态离散变化（跑→驻足→回眸→转身），每镜一个新动作节拍。\n\n## 音乐（纯器乐无歌词，默认 mureka）\n\n- 气质：克制、留白、清澈、绝不煽情，靠音色与氛围而非节拍驱动（热血青春支例外）。\n- 🎹 **第一支·纯爱清新**（钢琴主导+弦乐辅底）三子支：\n  - A·怀念/回忆：钢琴单音有空间感、弦乐暖底、旋律清晰。用于回忆/旁白/片尾。\n  - B·初恋/雀跃：钢琴轻快化+拨弦/铃铛点缀，轻盈有弹性带期待感。用于相遇/告白前/轻松日常。\n  - C·释然/分离：弦乐长音呼吸感强、旋律稀疏甚至消失，空旷轻盈。用于告别/转身/走远背影。\n- 🌫️ **第二支·疼痛飘渺**：不限乐器，德彪西式印象派钢琴/环境噪音/合成音垫/空灵无词织体，弱旋律强氛围。用于孤独/疏离/麦田独自/青春疼痛。\n- ⚡ **第三支·热血青春**：弦乐驱动（弓弦节奏推进感）+轻打击点缀（非强鼓点）+明亮有速度感。唯一允许有节奏推进感的支，但仍克制——是\"骑车冲进逆光\"的冲劲、非竞技爆发。用于骑行奔跑/文化祭/运动会/集体冲劲场景。\n- **选支**：回忆/旁白→A；相遇/告白→B；告别/放手→C；孤独/疏离→第二支；奔跑/冲劲→第三支。同一片多支并存随段落切换。\n- 禁强鼓点/流行编曲/强卡点/管弦爆炸/电子舞曲/歌词人声。热血青春支的节奏感=弓弦速度感，非打击乐爆炸。\n\n## 生成后自查（不达标则重做）\n\n暗部是否死黑/压抑（禁）？是否整体发黄金橙（禁，须冷白银调）？逆光与发丝透光在否？够亮够通透否？高光是否柔晕保层次而非过曝死白？色彩是否饱满有当下感而非寡淡发灰做旧？人物是否实体清晰未溶解消失？镜间是否硬切无叠化？麦田镜头绿够浓纯正、稻穗在、天空不死白否？\n\n## 视频铁律\n\n- 🔴 **单条多分镜（默认强制）**：seedance 单次最长 15 秒、原生支持单条内多分镜+镜间硬切，**不走\"一镜一条+后期拼接\"**。总时长按故事节拍自评估、不硬凑 15 秒：先估动作节拍数（一节拍=一个完整可独立成镜的动作状态）定镜数定时长（2节拍→8秒2镜/3→10秒3镜/4→12秒4镜/5→15秒5镜）。**只有跨 15 秒才拆多条、串行后用视频合成能力拼接**。prompt 按秒推进、每镜=景别+@角色动作+运镜+环境、镜间硬切显式断开。\n- **不出 BGM**：视频生成只要环境音+对白，BGM 合成阶段叠加。prompt 常驻声明\"只保留环境音与对白、无背景音乐无配乐\"；负面加\"背景音乐、配乐\"。BGM 按流程第 6 步在视频定稿后生成、暂存，第 8 步用户确认后才合成进成片，且**须在字幕处理完毕后执行**（字幕与音乐合成同时进行会出问题）；混音默认原声 +8dB、BGM -2dB。\n- 🔴 **群像/多人场景所有人都要在动**：画面中出现两人及以上时，**每个人物都必须有可见的动作或状态**（走动、说话、转身、微动等），不允许部分人物静止呆立、只有主角在动——除非用户明确要求某人物保持静止或站立不动。prompt 里每个人物都要写明各自的动作；负面加\"背景人物僵立、定格如蜡像\"。\n- **旁白策略**：旁白统一**写入视频 prompt、随画面由视频模型生成**（不单独配音、不后期叠加）。需要旁白的镜头写进时间轴并标注\"旁白（画外音）：…\"，旁白文本受语言锁约束（用选定对白语言）；旁白措辞克制平实、宁少勿多，符合岩井的留白气质。\n- **视频肤色三管齐下（仅视频 prompt，静态图/模卡不动）**：治视频模型把真实肤质劣化发脏——① 暗部轻微提亮约一档（局部去脏性提亮，不推高整体高调）；② 净化肤色、去杂色偏色；③ 收敛过度锐化与油光，但仍禁磨皮。\n- 🔴 **语言锁**：每条视频 prompt 常驻声明\"人物对白/旁白一律 \\[选定语言\\]，模型自主补话也只用此语言，禁其他语种台词/字幕/口型\"（不管本镜有无对白都写）；负面加\"其他语种台词、混合语言口型\"。防无对白镜头被模型自主加话时蹦错语种。\n- **人物实体性**：人物全程实体清晰、不溶解/半透明/消失/被光或环境吞没。\"逆光透光/被包围/走入景深\"是静态氛围、视频里绝不执行成人物消失。负面常驻：人物溶解、半透明、消失、融进背景。\n- **禁溶解叠化**：镜间硬切，负面常驻 no dissolve/cross-fade/fade。\n\n## 视频 prompt 标准模板（强制照此产出，每镜四件套=景别+@角色动作+运镜+环境，缺一不可）\n\n```\n@image1 @scene名（参考图声明，逐张，置最前，附识别要点）\n@image2 @角色名（服装/发型/气质关键词）\n…（≤7，多镜共用同组参考图锁一致性）\n\n[整体场景与氛围] 环境 + 主光源方向 + 大气介质 + 配色（冷调禁金黄）+ 质感基线 + 视角设定，奠定全片基调。\n\n[多分镜时间轴] 按秒推进，实时速度，镜间硬切，每镜=景别+@角色具体动作+运镜+环境细节：\n分镜1（0-3秒）：[景别] + [@角色具体动作] + [运镜] + [环境细节：尘埃/光柱/反光/飞絮]；\n硬切 分镜2（3-6秒）：[新景别，跳一档为限] + [状态离散变化的承接动作] + [运镜] + [环境]；\n硬切 分镜3（6-9秒）：…；\n（镜数与总时长按故事节拍自评估，不强行 5 镜/15 秒。）\n\n[画面风格] 严格岩井底层DNA：强逆光发丝透光、高光柔晕但保留层次不死白 / 高调通透明亮 / 饱满浓郁冷调（禁发黄、2000s DV清透不褪色不做旧） / 高光halation晕开 / 浅焦光斑 / 35mm颗粒柔焦。\n\n[负面提示词] 人物呆站不动、僵硬摆拍、对镜甜笑、多光源、均匀补光、面部过曝崩坏、人物溶解、人物半透明、人物消失、人物融进背景或光里、廉价CG感、变形、多余人物、文字水印、网格、整体发黄金橙、背景音乐、配乐、其他语种台词、混合语言口型、no dissolve、no cross-fade、no fade transition、no background music、no score、no slow-motion（除非用户要求慢动作）。\n[语言锁] 本片人物对白/旁白一律 [选定语言]，即便模型自主补话也只用此语言，禁止任何其他语种的台词、字幕与口型。\n```\n\n- 参考图声明置最前、逐张附识别要点，按出场重要性排序、单镜 ≤7 张。含具名道具的镜头须加挂道具合图并 @道具名。**视频生成的参考图只挂场景图/人物图/道具图，不挂 moodboard（此禁令仅限视频阶段；场景图生成时仍必须挂 moodboard 风格锚，见流程第 4 步）。**\n- 四件套用顿号/加号短句串联、节奏紧凑；分镜行以\"硬切 分镜N（X-Y秒）：\"起头。用代码块包裹整条 prompt。", "extras": [], "cn": "岩井俊二电影美学"}, {"slug": "silent-comedy-director", "desc": "把一个模糊的喜剧想法、角色/道具/场景参考或旧版默片风方案，改写成可执行的黑白默片喜剧视频生产包。适用于 5 秒图生视频、15 秒桥段、30 秒短广告、60-90 秒复古喜剧短片。重点不是做普通黑白照片，而是用默片时代的画面、肢体表演、字幕卡、节奏剪辑和声音设计，把笑点拆成资产、首帧、分镜、逐镜头视频提示词、剪辑方案和返修标准。\\\" version: 2", "body": "# Silent Gag Video Director｜黑白默片喜剧全流程视频导演\n\n## 定位\n\n这个 Skill 只负责一件事：把用户的黑白默片喜剧想法，整理成一套可以进入 LibTV / Codex / 图生视频工作流的完整视频制作方案。\n\n它不是“黑白风格提示词合集”，也不是只做角色图或海报。图片资产、首帧、字幕卡和道具图都要服务视频，最终目标是生成一条能看懂笑点、能剪辑、能审核、能返修的黑白默片喜剧视频。\n\n可覆盖的交付长度：\n\n- 5 秒：一个单动作图生视频笑点。\n- 15 秒：一个完整小包袱。\n- 30 秒：两个递进动作加一个反转。\n- 60 秒：四个 15 秒段落组成完整短片。\n- 75 秒：五个 15 秒段落，适合比赛或作业成片。\n- 90 秒：六个 15 秒段落，适合更完整的复古喜剧短片。\n\n不负责：\n\n- 复刻具体默片电影、具体演员或受版权保护的角色。\n- 把现代彩色视频简单转成黑白。\n- 写大量对白解释剧情。\n- 做现代广告大片式黑白高级片。\n- 生成血腥、暴力、恐怖惊吓方向的内容。\n\n## 输入\n\n用户可以只给一句话，也可以给完整生产需求。Agent 应先识别本次属于“创意起步 / 旧稿优化 / 参考图改写 / 完整视频生产 / 单镜头返修”中的哪一种。\n\n用户可能提供：\n\n- 主题：例如“绅士追帽子”“厨师大战面团”“小偷被绳子绊倒”。\n- 角色：主角、干扰角色、群演数量、角色性格。\n- 场景：老火车站、复古街角、旧办公室、百货商店、小剧场、老厨房。\n- 核心道具：圆顶礼帽、拐杖、香蕉皮、门、雨伞、手提箱、报纸、滑轮椅、托盘。\n- 喜剧冲突：追逐、误会、失控、反差、重复失败、道具反噬。\n- 时长与比例：5s / 15s / 30s / 60s / 75s / 90s；默认 4:3，也可 9:16 / 16:9。\n- 是否需要字幕卡、图片资产、首帧、尾帧、逐镜头视频提示词、剪辑方案。\n- 参考图：只能提取年代感、黑白灰层次、服装、场景、光影、构图和表演方式，不照抄内容。\n\n默认值：\n\n- 默认目标：输出完整视频生产包。\n- 默认时长：用户没说时给 60 秒结构，同时补一个 5 秒验证镜头。\n- 默认比例：4:3 / 1.33:1；若用户明显做竖屏平台，则用 9:16。\n- 默认风格：早期黑白默片喜剧、复古胶片颗粒、轻微划痕、字幕卡、固定机位。\n- 默认动作：夸张但可读，不失控，不乱跑。\n- 默认声音：老式钢琴、滑音、木鱼式敲击、钹声、门轴声、风声、摔倒声。\n\n## 输入使用\n\n必须严格遵守：\n\n- 用户指定的时长、比例、角色数量、核心道具、商业用途和禁止项。\n- 参考图中的风格方向，而不是具体角色、画面和桥段。\n- 角色外观、服装、道具、场景的资产一致性。\n- 每个镜头的动作边界：一个镜头只做一个核心喜剧动作。\n\n可以自动补齐：\n\n- 主角身份、干扰角色、具体道具组合、字幕卡文案、动作节奏、场景细节、音效和转场。\n- 5 秒验证镜头，用来先测试角色、道具和默片质感是否稳定。\n- 60 秒及以上视频的段落结构和镜头数量。\n\n少问问题。只有这些情况才追问：\n\n- 用户明确要商业交付，但没有说明时长或比例。\n- 用户要求使用指定角色，但角色信息完全缺失。\n- 多张参考图的风格冲突严重，无法判断主方向。\n- 用户要求复刻具体演员、电影角色或影视桥段。\n\n## 内部流程与 Knowhow\n\n### 1. 先判断这是不是“视频任务”\n\n如果用户说“做一个 skill / 优化 skill / 做视频 / 做 60 秒 / 做完整流程 / LibTV / Codex / 分镜 / 视频提示词”，必须按视频生产包处理。不要只输出图片提示词或海报方案。\n\n如果用户只说“做张图”，也要默认提醒：这张图可以作为首帧或角色资产，是否需要视频时再展开。除非用户明确只要图，否则不要把视频能力删掉。\n\n### 2. 黑白默片喜剧的正向判准\n\n好的结果应该满足：\n\n- 5 秒内能看懂：角色想干什么、被什么挡住、为什么好笑。\n- 动作读得清：预备、尝试、失败、反应四个点不能糊在一起。\n- 笑点靠动作，不靠台词解释。\n- 道具参与冲突，不只是摆设。\n- 镜头像早期电影：固定机位、中远景、舞台式调度、轻微胶片抖动。\n- 字幕卡是节奏标点，不是剧情说明书。\n- 黑白灰层次清楚，不是普通黑白写真。\n- 角色和道具在所有镜头中保持一致。\n\n### 3. 喜剧引擎\n\n每条短片先写一个“喜剧公式”，再写分镜：\n\n角色目标：他想做什么？\\\n阻碍：哪个道具、环境或误会挡住他？\\\n第一次尝试：他用很认真但笨拙的方式解决。\\\n升级：解决动作制造更大麻烦。\\\n反应：角色停顿，看向镜头或做夸张表情。\\\n反转：道具赢了、旁人误会了、目标以意外方式完成。\n\n优先选择简单笑点：\n\n- 追逐：帽子、小狗、车票、气球。\n- 误会：认错人、拿错包、看错标牌。\n- 失控：面团膨胀、门反弹、椅子滑走、雨伞反开。\n- 反差：角色很体面，结果很狼狈。\n- 重复：同一个动作失败两次，第三次反转。\n- 道具反噬：拐杖、香蕉皮、绳子、托盘、手提箱、报纸。\n\n### 4. 时长结构\n\n5 秒只做一个动作： 预备 1s，动作 2s，失败 1s，反应 1s。适合图生视频验证。\n\n15 秒做一个小包袱： 0-3s 建立目标；3-7s 第一次尝试；7-11s 失败升级；11-15s 反应、字幕卡或定格。\n\n30 秒做两个递进动作： 0-8s 目标出现；8-15s 第一次失败；15-23s 第二次升级；23-30s 反转和定格。\n\n60 秒做四段： 0-15s 设定人物和目标；15-30s 第一轮误会；30-45s 第二轮升级；45-60s 终极反转与字幕卡。\n\n75 秒做五段： 0-15s 设定；15-30s 第一次失败；30-45s 误会扩大；45-60s 混乱整理；60-75s 反转收束。\n\n90 秒做六段： 比 75 秒多一个“假成功”段，用来让观众以为问题解决，随后再反转。\n\n### 5. 资产规划\n\n视频前必须先规划资产，避免后续视频提示词混乱。资产编号统一使用：\n\n- SG-CHAR-01：主角\n- SG-CHAR-02：干扰角色\n- SG-EXP-01：表情资产\n- SG-SCENE-01：场景\n- SG-PROP-01：核心道具\n- SG-TITLE-01：字幕卡\n- SG-KF-01：首帧\n- SG-END-01：尾帧\n- SG-SHOT-01：镜头关键帧\n\n资产表至少包含：资产编号、名称、用途、视觉描述、视频一致性锚点、图片提示词、负面提示词。\n\n角色资产要写清：体型、服装、帽子、表情气质、动作能力。\\\n场景资产要简单：复古、空旷、可固定机位拍清动作。\\\n道具资产要轮廓清楚：黑白画面里能一眼辨认。\\\n字幕卡资产要短：一句话制造停顿或反转。\\\n首帧要在动作即将发生前一瞬间。\\\n尾帧要在笑点结果最清楚的一瞬间。\n\n### 6. 图片提示词写法\n\n图片提示词服务资产和首帧，不追求单张“好看”而牺牲视频可控性。\n\n必须包含：\n\n- 早期黑白默片喜剧风，1920s vintage silent film comedy。\n- 黑白画面、4:3、复古胶片颗粒、轻微划痕、边缘暗角、老电影闪烁。\n- 舞台式表演、固定机位感、中远景、动作可读。\n- 角色、场景、道具轮廓清楚。\n- 背景干净，不拥挤。\n- 适合图生视频首帧。\n\n### 7. 分镜表\n\n视频分镜必须输出表格，字段为：\n\n镜头编号｜时长｜段落功能｜画面内容｜角色动作｜喜剧点｜场景｜道具｜运镜｜字幕卡｜音效｜用到资产｜视频提示词\n\n分镜规则：\n\n- 5 秒：1 个镜头。\n- 15 秒：3-4 个镜头或 1 个连续镜头。\n- 30 秒：5-6 个镜头。\n- 60 秒：8-12 个镜头。\n- 75 秒：10-15 个镜头。\n- 90 秒：12-18 个镜头。\n- 复杂动作拆镜头，不要塞进一个提示词。\n- 同一场景保持轴线，不要频繁换方向。\n- 字幕卡不超过总时长 20%。\n\n### 8. 逐镜头视频提示词\n\n每个镜头都必须有独立视频提示词。提示词结构：\n\n- 时长与比例：\n- 用到资产：\n- 首帧构图：\n- 角色动作：\n- 动作节奏：\n- 道具运动：\n- 运镜：\n- 默片质感：\n- 音效：\n- 结尾落点：\n- 稳定性要求：\n- 负面限制：\n\n写法重点：\n\n- 明确“只完成一个动作”。\n- 明确“角色外观、服装、道具、场景不变”。\n- 明确“固定机位或轻微推近”。\n- 明确“动作先停顿再发生，最后有反应姿势”。\n- 禁止现代元素、彩色、角色变脸、道具消失、快速切景。\n\n### 9. 剪辑与声音\n\n剪辑要像默片，而不是现代短视频混剪。\n\n推荐：\n\n- 轻微加速：1.05-1.18 倍，视动作清晰度决定。\n- 字幕卡：用在转折、反应和结尾，文案短。\n- 画面效果：胶片颗粒、轻微划痕、边缘暗角、闪烁、轻微抖动、圆形遮罩。\n- 转场：iris in / iris out、硬切、字幕卡切换、轻微跳帧。\n- 音乐：老式钢琴、滑稽小号、木琴、鼓点、钹声。\n- 音效：脚步、风声、门轴、摔倒、弹簧、报纸、帽子飞走。\n\n不使用现代电子音乐、对白、恐怖音效、大片配乐、现代 UI 声。\n\n### 10. 返修逻辑\n\n不要只说“重跑”。要判断小修还是重跑：\n\n小修：黑白灰不够、颗粒不明显、字幕卡太多、动作略快但看得懂。\\\n重跑：变彩色、出现现代元素、角色变脸、道具消失、笑点不可读、动作失控、场景乱切、人物畸形严重。\n\n返修时必须给“可复制的修正提示词”，例如：\n\n- 强化固定机位、中远景、动作预备和反应停顿。\n- 限制角色只做一个动作，帽子始终可见。\n- 减少人群和背景元素，保留空旷舞台式构图。\n- 加入黑白默片、4:3、胶片颗粒、轻微划痕、字幕卡。\n\n## 输出\n\n当用户要完整视频时，必须输出以下模块：\n\nA. 需求理解\\\nB. 喜剧主线与笑点公式\\\nC. 视频结构表\\\nD. 资产表\\\nE. 图片提示词\\\nF. 分镜表\\\nG. 逐镜头视频提示词\\\nH. 剪辑、字幕卡、音乐音效方案\\\nI. 审核清单与返修建议\n\n当用户只要单镜头，也至少输出：需求理解、首帧提示词、5 秒视频提示词、剪辑音效、审核标准。\n\n## 自检\n\n输出前逐项检查：\n\n- 这是视频生产包，不是只写图片提示词。\n- 笑点 5 秒内能看懂。\n- 每个镜头只有一个核心动作。\n- 道具参与喜剧并始终可见。\n- 角色外观、服装、场景、道具资产一致。\n- 有首帧和尾帧控制。\n- 有逐镜头视频提示词，不只有总提示词。\n- 有剪辑、字幕卡、声音和返修方案。\n- 正向判准在前，禁止项只作为边界。\n- 没有复刻具体影视角色或桥段。\n\n## 何时问用户\n\n只在这些问题会显著影响成片时追问：\n\n- 商业片必须确认时长、比例、品牌/产品信息。\n- 用户指定角色但没有任何外观信息。\n- 用户要用参考图，但参考图之间风格冲突。\n- 用户要求“像某个具体演员/具体电影桥段”，需要改成“早期默片喜剧气质”而不是复刻。\n\n其他情况直接给出一个可执行版本。", "extras": [], "cn": "黑白默片喜剧全流程导演"}, {"slug": "sitcom-script-writer", "desc": "打造《老友记》《生活大爆炸》同类型情景类喜剧", "body": "## 一、分析框架（三块底座；细化见三/四/五节）\n\n**1. 风格本质**：笑点靠**台词机锋 + 处境误会 + 现场反应**，不靠视觉变形；话剧 + 现场观众的多机位棚拍传统；表演略外放、说完梗留一拍等笑声、不破第四面墙。\n\n**2. 画面与声音**：明亮偏暖、轻微高饱和的电视质感；**高调平光、几乎无阴影、全场可见**；固定主场景（客厅沙发/吧台/餐桌）+ 正面镜框舞台；制服化造型一眼看性格；多机位中宽景、稳定、靠剪辑在「说话 ↔ 反应」间切；**现场观众/罐头笑声**是身份标识、定节奏。\n\n**3. 剧情（一梗到底，三拍）**：铺垫（正常处境）→ 转（离谱台词/误会/升级）→ 落（punchline，收在**反应 + 笑声**）。一条只一个笑点；引擎挑一个（升级/误会/反高潮/cringe）；压到两人——混乱制造者 + 正常人（捧哏），笑点长在「正常人怎么反应」。\n\n---\n\n## 二、工作流\n\n### Step 1 · 前期确认（先敲定全部配置，再进 Step 2）\n\n所有需要用户选的配置**必须在生成角色/场景之前全部确认**——角色三视图、场景图要花算力生成并绑定，配置一旦回改前面资产就白做；尤其**画幅由投放场景决定，必须先定**，否则三视图/场景图构图要重来。压成 **2 轮** `ask_user_input`（每轮 ≤3 题、都带默认值和\"你帮我定\"逃生口），别连环追问；用户说\"全你定\"就按默认一次跑完。\n\n**先分流入口：**\n\n- **A. 从零开始（最常见）** — 没角色/场景/段子/参考 → 走两轮确认 + 引导定段子。\n- **B. 已有点子** — 给了一句话点子 → 只补缺的配置，已知项不重复问；笑点引擎从点子里推断、不问。\n- **C. 反推参考视频** — 先跑第六节抽帧脚本读三拍/画风/机位，再产出同款；配置里能从视频看出的（画幅/时长/语言）直接沿用、只补没有的。\n\n**第 1 轮 · 定框架（3 题）：**\n\n1. **目的 + 投放场景 → 画幅与调性**：竖屏 9:16（抖音/TikTok/Reels，默认）｜横屏 16:9（YouTube/官网/横板）｜方形 1:1。目的（纯搞笑 / 品牌植入 / 角色 IP / 带货…）只影响调性轻重，不改画风。\n2. **时长**：15s / 30s / 60s / 自填。**生成以 15s 为一段**，超 15s 分多段、每段一条独立连续 prompt（≈3-4 镜），共用同一套角色/场景绑定与风格锁定句，逐段生成后剪辑衔接：15s=1段、30s=2段、60s=4段、自填按 15s 取整。**每 15s 就是一个完整笑点**（自己的三拍 + punchline + 笑声），节奏紧凑；30s/60s＝同一对角色/同一场景下连着抖 2/4 个小段子，每段都落一次，别把一个梗硬拖长（拖长很尴尬）。\n3. **笑点引擎**：升级 / 误会 / 反高潮 / cringe（**仅\"从零开始\"抛**；\"已有点子\"从点子推断）。\n\n**第 2 轮 · 定语言与呈现（2 题）：** 4. **台词语言**：英文（默认，最贴美式情景喜剧口型）/ 中文。写进生成 prompt。 5. **字幕语言**：双语（默认，上中下英）/ 中文 / 英文。**字幕只在成片后剪辑烧录，不进生成 prompt**（见 Step 7）。\n\n**制作方式固定图生视频**（本 skill 已生成三视图+场景图供绑定，不再询问）：生成时带上绑定图，prompt 侧重运镜/走位/动作/台词/切镜，外观布景交给参考图。\n\n**旁白**：默认**关**（情景喜剧少用，单机位才有）；用户主动要才开，开则加画外音，不影响其余流程。\n\n**分段生成节奏**（仅 &gt;15s 时问）：**一次性生成全部段** / **逐段确认**（生成一段、满意了再生下一段，更稳但慢）。默认逐段确认。\n\n两轮确认完 → 从零开始再引导定段子：一轮抛 ① 场景（客厅/吧台/餐桌/办公室）② 二人组性格；据此从第四节点子库挑/改一个**一句话 premise** + 分配 {{Mixed N}}，确认即进 Step 2。\n\n### Step 2 · 定角色与场景（三视图 + 场景图）\n\n**先做选角引导（两问，用** `ask_user_input` **点选，留\"你帮我定\"逃生口）：**\n\n1. **要几个角色**：1 / 2 / 3 / 自填。情景喜剧段子**建议 2 人**（混乱制造者 + 正常人/捧哏），但按用户选的来；人多时仍指定一个\"正常人\"负责反应。\n2. **每个角色要哪种形象（含国籍）**：逐个确认 ① 形象原型（见第三节造型菜单：整洁书呆型/邋遢慵懒型/自信浮夸型/毒舌酷姐…）② **国籍/族裔**（如美国、亚裔/华裔、日裔、韩裔、拉丁裔、非裔、欧洲…，**开放选择，亚裔同样适用**）。可一题一角色或合并成一轮。\n\n**再定角色来源（二选一）：**\n\n- ① 用户**自行上传照片** → 直接绑定到对应 {{Mixed N}}，**跳过三视图生成**、以上传图为准。\n- ② 没有图 → 按下面模板生成三视图设定图再绑定（把上面选的形象+国籍写进外观描述）。\n\n**然后落到 token 与参考图：**\n\n- 每个角色一个 token：`{{Mixed 1}}`（混乱制造者）、`{{Mixed 2}}`（正常人/捧哏）…。首现写全外观（含国籍/族裔特征 + 制服化标志装），之后只用 token、只写动作/表情；互动写清主宾。\n- **（无上传时）给每个角色出一张三视图角色设定图**（版式：**左侧一张大头正脸特写，右侧并排全身正面 + 全身背面**，统一造型、纯净浅色背景），用作 Seedance 的 {{Mixed N}} 绑定参考图——这样多镜头里人物才稳定一致。三视图按**本风格的高调平光、明亮干净电视质感**渲染（不是日剧暖调胶片），模板与范例见第三节「三视图参考图」。原型菜单见第三节。\n- **再出一张固定主场景的场景图**（无人定场全景 establishing shot，正面镜框、高调平光），用作 Seedance 的场景/背景绑定参考，保证多镜头里**同一套布景一致**。场景菜单与模板见第三节「场景图参考」。\n\n### Step 3 · 设计段子\n\n按「剧情内容」框架（第四节）：三拍落到多个编号镜头，从四类引擎选一个，套「混乱制造者 + 正常人」二人组。\n\n### Step 4 · 套画面与声音元素\n\n按框架（第三节）补全：明亮高调平光、几乎无阴影 + 暖调轻微高饱和的电视质感 + 固定主场景正面镜框 + 制服化造型 + 多机位中宽景、在说话/反应间切 + 收尾的罐头笑声拍子。\n\n### Step 5 · 按 Seedance 2.0 格式输出\n\n按第五节格式：中文风格锁定句 + 全局设定 → 「严格按 \\[N\\] 个镜头顺序：」编号分镜（景别，含 {{Mixed N}}，用 `【切】` 切反应）→ 中文收尾句。**prompt 用中文写（你能直接看懂）；台词按所选语言保留原文；明确\"无字幕或屏幕文字\"，字幕绝不进生成**。字幕另列「字幕清单」附后（Step 7 烧录）。prompt 包在代码块里。**时长 &gt;15s 时按 15s 分段，每段各出一条 prompt（段1/段2… 各一个代码块）+ 对应字幕清单**，共用角色/场景绑定与风格锁定句，**每段自成一个笑点、各自落 punchline**。\n\n### Step 6 · 确认后上 平台画布生成\n\nprompt（中文）出来后，**先让用户看懂内容，再问 OK 不 OK**：\n\n- 不 OK → 按反馈改（换台词/引擎/造型/语言等），再给一版。\n- OK → 在 **平台画布**上生成（每段带绑定的角色三视图/上传图 + 场景图），**按 Step 1 所选节奏**：一次性生成全部段 / 逐段确认（每段满意再生下一段）；最后按顺序剪辑衔接。\n\n### Step 7 · 生成后加字幕（成片必备，字幕只在这一步出现）\n\n平台出片（无任何字幕/屏幕文字）后，**成片必须带字幕**——在剪辑里按所选**字幕语言（中/英/双语）烧录，这是唯一**出字幕的环节、不省略：\n\n- 用 Step 5 附的**字幕清单**逐句上字，按每镜台词的时间轴，在**底部居中**打上**白字、细黑描边**的电视字幕。双语＝上中下英，且**英文行明显小于中文行**（中文为主、英文为辅）。\n- 文案按喜剧语感微调，落点那句务必在所选语言里都好笑。\n- 生成阶段已禁字（`No subtitles or on-screen text`），所以画面干净，直接上剪辑版字幕即可。\n- 同时可在这一步叠上标准罐头笑声/起哄声，让节奏更稳（见第三节「声音音效」）。\n\n---\n\n## 三、画面与声音元素细化（含 {{Mixed N}}、三视图、原型菜单）\n\n始终守住：明亮高调平光、几乎无阴影、暖调轻微高饱和的电视质感、多机位中宽景。\n\n### {{Mixed N}} 角色锚点\n\n- 一个角色一个 token（`{{Mixed 1}}`、`{{Mixed 2}}`），绑定参考图保持一致。\n- 首次出现写**全外观**（发型 + 制服化标志装 + 配饰）；之后只用 token、只写动作/表情。\n- 互动写清主宾：`{{Mixed 1}} proudly announces the news to {{Mixed 2}}`。\n\n### 三视图参考图（{{Mixed N}} 绑定用）\n\n定完角色，先给每个 {{Mixed N}} 出一张三视图设定图，作为 Seedance 绑定的参考图，保证多镜头里人物不跑脸。**版式固定**：左侧一张大头正脸特写，右侧并排全身正面 + 全身背面。**按本风格渲染**（高调平光、明亮干净电视质感），不要日剧暖调胶片，否则会把色调带进成片。\n\n模板（EN，单角色单图）：\n\n```\nCharacter reference sheet of one single character on a clean light seamless background, composed\nas three panels: a large close-up head-and-shoulders portrait on the LEFT, then a full-body front\nview and a full-body back view side by side on the RIGHT. Same outfit, same proportions, neutral\nstanding pose, gentle natural expression. [外观：国籍/族裔 + 发型发色 + 制服化标志装 + 配饰]. Bright high-key\neven lighting with minimal shadows, clean glossy television look, consistent character design,\nno props.\n```\n\n模板（ZH）：\n\n```\n单个角色的角色设定图，纯净浅色无缝背景，三栏构图：左侧一张大的头肩特写正脸，右侧并排\n全身正面 + 全身背面。同一套服装、同样身材比例、自然站姿、柔和自然表情。[外观：国籍/族裔 + 发型发色 +\n制服化标志装 + 配饰]。明亮高调均匀布光、阴影极弱，干净有光泽的电视质感，角色设定一致，无道具。\n```\n\n要点：版式＝左大头正脸 + 右全身正背；一张图只放一个角色（二人组分开出、防混脸）；外观描述跟 prompt 里 {{Mixed N}} 首现的写法**逐字保持一致**；出图工具 GPT Image-2 / Midjourney 均可，拿到后绑定到对应 token。\n\n### 场景图参考（固定主场景绑定用）\n\n角色定完，给**固定主场景**出一张场景图作为背景绑定参考，保证多镜头布景不变。默认**无人定场全景**（干净背景板便于复用），需要时也可放 {{Mixed N}} 出带人的定场帧。场景内容从下文「场景布置」菜单取（客厅 / 吧台 / 餐桌 / 办公室），渲染按本风格：正面镜框、高调平光、暖调电视质感。**画幅须与 Step 1 投放场景一致**（竖屏 9:16 / 横屏 16:9 / 方形 1:1），否则绑定后构图会错。\n\n模板（EN，末尾按需加 `vertical 9:16 / 16:9 / 1:1 aspect ratio`）：\n\n```\nEstablishing wide shot of a classic multi-camera American sitcom set: [场景，如 a cozy lived-in\napartment living room with a big couch, warm lamps, a cluttered coffee table and a small kitchenette\nin the back], no people. Frontal proscenium staging, bright high-key three-point lighting, soft even\nillumination with minimal shadows, warm slightly-saturated colors, clean glossy television look,\n[vertical 9:16 / 16:9 / 1:1] aspect ratio.\n```\n\n模板（ZH）：\n\n```\n经典美式多机位情景喜剧布景的全景定场镜头：[场景，如 温馨有生活感的公寓客厅，大沙发、暖色台灯、\n杂物茶几，后景小厨房]，画面无人。正面镜框式舞台调度，明亮高调三点布光、柔和均匀、阴影极弱，\n暖调轻微高饱和，干净有光泽的电视质感，[竖屏 9:16 / 横屏 16:9 / 方形 1:1] 画幅。\n```\n\n要点：默认无人、正面镜框、和成片同一画风（高调平光暖调）**同一画幅**；一个段子一张主场景图；场景描述跟成片 prompt 的全局设定**逐字一致**；拿到后作为场景参考绑定。\n\n### 色彩与质感\n\n- 明亮、偏暖、轻微高饱和；干净有光泽的电视质感，不写实。\n- 生成词：`bright high-key, warm slightly-saturated colors, clean glossy television look`。\n- 避免：电影级低调暗部、纪录片去饱和发青、胶片颗粒（那是别的风格）。\n\n### 光线和氛围（固定原则：高调平光、几乎无阴影）\n\n- 三点均匀布光 `high-key three-point lighting`、低反差 `soft even illumination`。\n- `minimal shadows / everything clearly visible`——为多机位任意角度服务，不藏暗部。\n- 整体明亮、暖、安全轻松，**不**做戏剧性明暗对比。\n\n### 场景布置（固定主场景、正面镜框）\n\n- 客厅：大沙发、暖色台灯、杂物茶几、可见家居细节（lived-in）。\n- 吧台 / 咖啡馆：固定吧台、卡座、霓虹招牌、常客位。\n- 餐桌 / 厨房：餐桌、开放式厨房、端菜动线。\n- 办公室（棚拍版）：会议桌、隔间、休息区——**注意**保持高调平光，别滑进伪纪录片荧光冷光。\n- 一律 `frontal proscenium staging`、`shot on a studio set`，场景反复出现、观众熟悉。\n- **背景群演**（增强美剧现场感）：酒吧客人/办公室同事/餐厅食客等，只做**低调环境活动**（喝酒、打字、走过），**不与主角互动、不看镜头、不抢戏、动作幅度小**，避免干扰\"说话↔反应\"切镜（英文写法见骨架可选项）。\n\n### 人物造型（制服化、一眼看性格）\n\n配「混乱制造者 + 正常人」二人组时，挑两个反差大的：\n\n类型 造型要点（标志装，几乎不换） 整洁书呆型 整齐开衫/格纹衫、眼镜、规矩发型，认真拘谨 邋遢慵懒型 oversized 卫衣、乱发髻、拖鞋，deadpan 自信浮夸型 亮色衬衫、夸张配饰、油头，姿态张扬 朴素老好人 家常 T 恤牛仔裤、亲切日常 职场拘谨型 西装/职业套装、公文包，神情紧绷 戏精时髦型 浮夸时装、墨镜，时刻在演 怪咖宅男 印花卡通 T、运动外套，沉迷自己的世界 毒舌酷姐 利落穿搭、抱臂，随时准备吐槽\n\n- 标志装意义：瞬间可读 + 强化原型，所以同一角色装扮基本不变。\n- **国籍/族裔与形象原型是两回事**：原型（呆子/毒舌…）在这张菜单选，国籍/族裔（美国/亚裔/日裔/拉丁裔…）在 Step 2 单独问，两者组合写进角色外观。\n- 肤质可省略或写 `natural healthy skin under bright studio light`，不追求 porcelain 磨皮。\n\n### 镜头语言\n\n- 机位：**多机位中景与宽景为主** `medium and wide shots`、稳定 `stable framing`、正面观众视角；无炫酷运镜、无手持、无急推。\n- 切镜：靠剪辑在「说话的人 ↔ 反应的人」之间切——`Cut to Medium Shot` / `Cut to Reaction Close-up` / `Static Two-Shot`。\n\n### 声音音效（这类剧的身份标识）\n\n- **现场观众/罐头笑声**：落点处必到，提示何时笑、定节奏。\n- **紧跟不拖**：punchline 一落笑声几乎立刻起（和反应几乎同拍），只留极短一拍，别磨蹭太久才响（拖久冷场）。\n- **停顿写进表演**：说完梗 → 极短一拍 → 笑声立刻 → 收尾。\n- 起哄声：接吻、反转、暧昧时刻。\n- Seedance 声画同出但笑声\"干净度\"不稳；标准罐头笑声/起哄声更稳妥在剪辑时叠加。\n\n---\n\n## 四、剧情内容细化（一梗到底）\n\n笑点在落差与时机，不在堆料、不在故事。**每个 15s 段只承载一个梗**，用不上单集骨架（冷开场/A线B线/片尾 tag 全不需要）。先想清「正常人为什么会做出这个反应」，再写镜头。**每 15s 一个完整笑点**、三拍打完就落 punchline + 笑声，节奏要紧（拖长会尴尬）；30s/60s＝同一对角色同一场景连着抖 2/4 个小段子，每段各自落一次。\n\n### 三拍结构（落到多个编号镜头）\n\n```\n铺垫  约前 1/3：建立一个正常处境，一两句话/一个动作交代清楚（中宽景，正常表演）\n转    中间：一句离谱台词 / 一个误会 / 一下升级（切到说话/出事的人）\n落    最后 1/3：punchline，切回正常人的反应 + 一拍停顿 + 罐头笑声\n```\n\n> 黄金法则：铺垫越正常 + 转得越离谱 + 反应越克制 = 越好笑。落点几乎都在「正常人的脸」上，而不是混乱本身。\n\n### 故事结构\n\n- 极简，一条短片只承载一个笑点。\n- 母版：「正常人和混乱制造者在某个熟悉场景里，发生一次错位。」\n\n### 四类笑点引擎（挑一个）\n\n- **升级 escalation**——小事突然失控。例：「我只是稍微动了一下」→ 镜头摇到一片狼藉。\n- **误会 misunderstanding**——两人信息不对称、各说各的。例：A 宣布好消息，B 完全听成坏事。\n- **反高潮 anticlimax**——铺得很隆重、一下戳破。例：庄严端出\"大餐\" → 是焦黑一坨 → 全桌沉默。\n- **cringe**——说错话后的死亡沉默。例：A 想夸 B → 越夸越错 → 没人接话。\n\n> 收尾手法：切到捧哏（正常人）的反应 + 停顿 + 罐头笑声。**不要**用对镜头一瞥/对镜头 deadpan（那是伪纪录片）；可用反应停顿，少用定格。\n\n### 人物关系\n\n- 压到**两人**：一个**混乱制造者**（说/做离谱事）+ 一个**正常人/捧哏**（负责反应）。\n- 笑点几乎都长在「正常人怎么反应」上。\n- 长期关系底色可借（找到的家人 / 暧昧拉扯 / 上司×下属），但一条短片只演**这一对的一次化学反应**，不铺关系线。\n\n### 段子点子库（引导从零用户时直接抛/改）\n\n按\"场景 × 引擎\"挑一条改成具体 premise（替换角色/台词即可）；没选场景就随机推一条。\n\n**客厅沙发**\n\n- 误会：A 兴奋宣布大好消息 →【切】B 完全误解成天塌了、抱枕痛哭 →【切回】A 笑容凝固成困惑 → 沉默 + 笑声。\n- 升级：A 淡定说\"我只是稍微整理了一下\" →【切】镜头摇过去客厅一片狼藉 → B 表情凝固。\n\n**吧台 / 咖啡馆**\n\n- cringe：A 自信地对吧台另一头搭话 →【切】对方回一句让 A 社死的话 →【切回】A 僵在原地举着杯子 → 笑声。\n- 反高潮：A 神秘兮兮说\"我有个绝妙计划\" →【切】下一拍计划当场翻车 → B 面无表情喝咖啡。\n\n**餐桌 / 厨房**\n\n- 反高潮：A 庄严揭开餐盖宣布\"惊喜大餐\" →【切】是焦黑一坨 →【切回】全桌死寂 → A 强行微笑 + 笑声。\n- 误会：A 说\"我做了你最爱吃的\" →【切】端出 B 最讨厌的东西 → B 礼貌假笑逐渐崩塌。\n\n**办公室（棚拍版，保持高调平光）**\n\n- 升级：老板交代\"就改一个小地方\" →【切】下属理解成把整个项目推翻重做、抱来一摞文件 → 老板凝固。\n- cringe：A 在会议上想拍马屁 →【切】把上司名字叫错 →【切回】满屋沉默 → A 想钻桌底 + 笑声。\n\n变体钮：换场景、换二人组造型、换离谱台词、把单次错位升级成\"误会套误会\"（但仍是一个落点）。\n\n---\n\n## 五、Seedance 2.0 输出格式\n\n最终交付 = **一条中文编号分镜式 prompt**（Seedance 支持中文，方便你看懂；**台词按所选语言保留原文**，说英文就写英文原句），包在可复制代码块。\n\n### 标准骨架\n\n生成 prompt 里**只写台词口型，绝不写任何字幕/屏幕文字**，并明确 `no subtitles or on-screen text`（防模型自己乱出字）。字幕另列清单，成片后在 Step 7 烧录。\n\n```\n[风格锁定句]。[全局设定：固定主场景 + 高调平光几乎无阴影 + 暖调电视质感 + 画幅（竖屏9:16/横屏16:9/方形1:1，按 Step 1）]。台词说[中文/英文]，画面无任何字幕或屏幕文字。角色相对位置固定（谁左谁右、谁坐谁站），切镜绝不互换。[可选：背景几位低调群演各做各的，不与主角互动、不看镜头。]\n严格按 [N] 个镜头顺序：\n1. [景别]：[铺垫——正常处境，{{Mixed N}} 首现写全外观，定好相对位置如\"在左/在右\"]。{{Mixed 1}} 说[所选语言]台词：\"[台词原文]\"。\n2. 【切】[景别]：[转]。{{Mixed 2}} 说[所选语言]台词：\"[台词原文]\"。\n3. 【切】反应特写：[正常人的反应放大]。\n4. 静止双人镜头：[反应定格极短一拍，紧接现场观众笑声立刻涌起（别拖）]。\n[收尾句：表演自然、节奏精准；无字幕或屏幕文字；多机位稳定构图。]\n```\n\n另附**字幕清单（后期烧录用，不进 prompt）**，默认双语上中下英：\n\n```\n字幕清单（双语，上中下英）：\n1. [中文] / [EN line]\n2. [中文] / [EN line]\n...\n```\n\n要点：\n\n- 编号镜头，每镜以景别开头；机位以**中景/宽景**为主，稳定、正面。**每 15s 一段、每段 ≈3-4 镜**；30s=2段、60s=4段，各一条 prompt（见 Step 1）。\n- 用 `【切】` 切镜，核心节奏是**说话的人 ↔ 反应的人**之间切。\n- **位置锁定**：一个段子里角色相对位置（谁左谁右、谁坐谁站）从头固定，切镜绝不互换（多机位来回切最易穿帮）；首镜写死\"{{Mixed 1}} 在左、{{Mixed 2}} 在右，全程不变\"。\n- 角色用 `{{Mixed N}}`，首现写全外观，之后只写动作/表情。\n- **台词写进 prompt 且按所选语言保留原文；字幕不进 prompt**（明确\"无字幕或屏幕文字\"），字幕另列清单、成片后烧录。\n- 全局必带：风格锁定句、高调平光、**画幅**、\"无字幕或屏幕文字\"、收尾句、落点\"轻微现场观众笑声\"带节奏。\n\n### 词汇（中文，括号附英文备用）\n\n- 景别：定场全景 · 双人中景 · 中景 · 反应特写 · 静止大远景。\n- 切镜：`【切】`（切至反应特写 / 静止双人镜头）。\n- 表演：得意宣布 · 会错意 · 表情僵住 · deadpan 呆脸 · 强行假笑 · 停顿一拍。\n- **禁用**（属伪纪录片）：对镜头一瞥、手持、急推 snap zoom、采访镜头。\n\n### {{Mixed N}} 规则\n\n一角色一 token，整条一致；互动写清主宾；二人组用 `{{Mixed 1}}`（混乱制造者）+ `{{Mixed 2}}`（正常人/捧哏）。\n\n### 声音（罐头笑声是这类剧的标志）\n\n- **笑声紧跟 punchline，不拖延**：落点一到、笑声几乎立刻起（和反应几乎同拍），只留极短一拍停顿，别等演员反应磨蹭半天才响——拖久就冷场。prompt 写\"punchline 落下瞬间、现场观众笑声立刻涌起\"。\n- 起哄声（反转/暧昧时刻）；Seedance 笑声\"干净度\"不稳，prompt 带拍子即可，标准笑声/起哄声剪辑时叠加。\n\n### 台词与字幕（语言可选；字幕一律后期）\n\n默认**英文台词 + 双语字幕（上中下英）**。**字幕绝不在生成阶段出现，全部等成片后剪辑烧录（Step 7）。**\n\n- **台词语言（中 / 英）**——决定口型/语音；**即使 prompt 是中文，台词也按所选语言保留原文**（说英文就在引号里写英文原句）。写\"{{Mixed 1}} 说英文台词：…\" 或 \"说中文台词：…\"。\n- **生成 prompt 里明确\"无字幕或屏幕文字\"**——主动禁止模型出任何字（防乱码/缺字/糊字）。\n- **字幕语言（中/英/双语，默认双语上中下英）**——只影响**后期字幕清单**（逐句、附在 prompt 后、供 Step 7 烧录），不进 prompt。\n- 翻译不必逐字直译，按喜剧语感意译，落点那句务必在所选语言里都好笑。\n- 后期字幕样式（Step 7）：底部居中、白字、细黑描边、电视字幕感；双语＝上中下英，**英文比中文小一号**（中文主、英文辅）。\n\n### 绑定与旁白\n\n- **固定图生视频**：带上三视图 + 场景图绑定，**prompt 侧重运镜/走位/动作/台词/切镜**，外观布景交给参考图（全局设定与场景图逐字一致）。\n- **旁白**：默认关。开了才加画外音（也算台词、字幕后期）。\n\n### 锁定风格块（中文，生成时原样用作风格锁定句）\n\n```\n经典美式多机位情景喜剧风格，在现场观众前的摄影棚布景内拍摄。明亮高调三点布光，\n柔和均匀、阴影极弱，暖调、轻微高饱和，干净有光泽的电视质感，全场清晰可见。\n多机位中景与宽景稳定覆盖，正面镜框式舞台调度。落点处带轻微现场观众笑声。\n```\n\n> 范例为默认组合演示（中文 prompt + 英文台词）：**prompt 内无字幕**（只有台词 + \"无字幕或屏幕文字\"），字幕另列清单、成片后烧录。\n\n### 范例 A · 误会（客厅沙发，中文 prompt + 英文台词）\n\n```\n经典美式多机位情景喜剧风格，现场观众前摄影棚拍摄。明亮高调三点布光、柔和均匀、阴影极弱，暖调轻微高饱和，干净有光泽的电视质感。温馨有生活感的公寓客厅，大沙发、暖色台灯、杂物茶几。台词说英文，画面无任何字幕或屏幕文字。角色相对位置固定、切镜不互换。严格按 4 个镜头顺序：\n1. 中景：整洁认真的男人 {{Mixed 1}}（开衫+眼镜，坐在沙发左侧）满脸兴奋，说英文台词：\"Babe, huge news — we're finally getting a puppy!\"\n2. 【切】中景：右侧的 {{Mixed 2}}（乱发髻、oversized 卫衣、deadpan）完全会错意、一脸惊恐，说英文台词：\"A BABY?! We are NOT ready for a baby!\"\n3. 【切】反应特写：{{Mixed 1}} 得意的笑僵成困惑，小声说 \"...a puppy.\"\n4. 静止双人镜头：两人对视、死寂一拍，{{Mixed 2}} 缓缓抱起抱枕，紧接现场观众笑声立刻涌起（别拖）。表演自然、节奏精准；无字幕或屏幕文字；多机位稳定构图。\n```\n\n字幕清单（双语，上中下英，后期烧录）：\n\n```\n1. 宝贝，天大的好消息——咱们终于要养狗狗啦！ / Babe, huge news — we're finally getting a puppy!\n2. 孩子?！咱们根本没准备好要孩子啊！ / A BABY?! We are NOT ready for a baby!\n3. ……是狗狗。 / ...a puppy.\n```\n\n### 范例 B · 反高潮（餐桌，中文 prompt + 英文台词）\n\n```\n经典美式多机位情景喜剧风格，现场观众前摄影棚拍摄，明亮高调平光、暖调电视质感。有生活感的开放式厨房+餐桌、点着蜡烛。台词说英文，画面无字幕或屏幕文字。位置固定、切镜不互换。严格按 4 个镜头顺序：\n1. 中景：系着花围裙的主人 {{Mixed 1}} 隆重掀开银色餐盖，说英文台词：\"Behold — my masterpiece!\"\n2. 【切】特写：餐盖下是一坨焦黑冒烟的东西。\n3. 【切】反应双人镜头：两位客人 {{Mixed 2}} 和 {{Mixed 3}} 死寂盯着，叉子举到一半僵住。\n4. 静止大远景：{{Mixed 1}} 保持得意假笑一拍，低声说 \"...it was supposed to be chicken.\"，缓缓把盖子盖回去，紧接现场观众笑声立刻涌起（别拖）。表演自然；无字幕；多机位稳定构图。\n```\n\n字幕清单（双语，上中下英，后期烧录）：\n\n```\n1. 看好了——我的杰作！ / Behold — my masterpiece!\n2. ……这本来应该是鸡肉的。 / ...it was supposed to be chicken.\n```\n\n### 范例 C · cringe（吧台）\n\n同法：{{Mixed 1}} 吧台自信搭讪一句 → 切 {{Mixed 2}} 头也不抬回一句社死台词 → 切 {{Mixed 1}} 反应特写僵住 + 停顿 + 笑声。全局同样带\"无字幕或屏幕文字\"，字幕清单另附。\n\n### 输出检查清单\n\n- \\[ \\] **前期配置已在 Step 1 全部确认**（目的+投放场景/画幅、时长、笑点引擎、台词语言、字幕语言、旁白、分段节奏）再进 Step 2\n- \\[ \\] 风格锁定句 + 高调平光几乎无阴影 + **画幅（9:16/16:9/1:1）** + 收尾句\n- \\[ \\] 编号镜头，中宽景为主，切「说话 ↔ 反应」\n- \\[ \\] **角色相对位置锁定**（左右/坐站固定），切镜绝不互换\n- \\[ \\] 背景群演（可选）低调、不互动/不看镜头/不抢戏\n- \\[ \\] {{Mixed N}} 首现写全（含国籍/族裔+制服化标志装）、后续复用、互动主宾清晰；已出三视图 + 场景图绑定（同画幅）\n- \\[ \\] 三拍：正常铺垫 → 离谱转折 → 反应 + 笑声收尾\n- \\[ \\] 落点带 `subtle live-audience laughter`\n- \\[ \\] prompt 用中文写、台词按所选语言保留原文；**prompt 里有\"无字幕或屏幕文字\"、生成不出任何字**\n- \\[ \\] 字幕另列「字幕清单」附在 prompt 后，只在 Step 7 成片后烧录（默认双语·上中下英）\n- \\[ \\] 图生视频：带绑定图、prompt 侧重运镜动作；旁白默认关\n- \\[ \\] **没有**对镜头一瞥/手持/急推/采访镜头\n- \\[ \\] prompt 出来先问用户 OK；OK 后再上 平台画布生成\n- \\[ \\] 单语言整条、代码块可复制；时长按 Step 1 所选、一个笑点；二人组「混乱×正常」\n- \\[ \\] &gt;15s 已按 15s 分段，每段自成一个笑点、各落 punchline，共用绑定\n\n---\n\n## 六、反推参考视频（抽帧脚本）\n\n入口 C 用：先抽帧看清三拍与切镜，再写同款 prompt——不要凭空描述没看过的画面。把下面脚本存成 `extract_frames.sh` 运行，用法 `./extract_frames.sh <video> [outdir]`。它会读规格、按节奏抽帧、拼 contact sheet，并提示判断：① 三拍（铺垫/转/反应+笑声）② 切镜在「说话 ↔ 反应」之间怎么切、景别多大 ③ 画风是否高调平光暖调几乎无阴影、固定主场景（确认是棚拍情景喜剧而非伪纪录片）④ 二人组谁是混乱制造者、谁是正常人、造型标志。\n\n```bash\n#!/usr/bin/env bash\n# 反推参考视频用：读规格 + 抽帧 + 拼接成 contact sheet，看清三拍与切镜节奏。\n# 用法: ./extract_frames.sh <video> [outdir]\nset -euo pipefail\n\nVIDEO=\"${1:?用法: extract_frames.sh <video> [outdir]}\"\nOUT=\"${2:-./refframes}\"\nmkdir -p \"$OUT\"\n\necho \"=== 规格 ===\"\nffprobe -v error -show_entries format=duration,size,bit_rate \\\n  -show_entries stream=codec_type,codec_name,width,height,r_frame_rate \\\n  -of default=noprint_wrappers=0 \"$VIDEO\"\n\nDUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 \"$VIDEO\" | cut -d. -f1)\necho \"=== 时长约 ${DUR}s，按节奏抽帧 ===\"\n\n# 短片每 1.5s 一帧；过长则每 2.5s 一帧\nif [ \"${DUR:-0}\" -le 35 ]; then RATE=\"1/1.5\"; else RATE=\"1/2.5\"; fi\nffmpeg -v error -i \"$VIDEO\" -vf \"fps=${RATE}\" \"$OUT/f_%03d.jpg\"\n\n# 拼接 contact sheet 便于一眼看全片节奏与切镜\nif command -v montage >/dev/null 2>&1; then\n  N=$(ls \"$OUT\"/f_*.jpg | wc -l)\n  COLS=5; ROWS=$(( (N + COLS - 1) / COLS ))\n  montage \"$OUT\"/f_*.jpg -tile \"${COLS}x${ROWS}\" -geometry 320x180+2+2 \\\n    -background black \"$OUT/contact.jpg\"\n  echo \"contact sheet: $OUT/contact.jpg\"\nfi\n\necho \"完成，查看 contact.jpg 判断三拍/切镜/画风/二人组（见上文）。\"\necho \"定位精确帧: ffmpeg -ss <start> -i <video> -t <len> -vf fps=4 ...\"\n```\n\n---\n\n## 七、通用约束\n\n- **前期全部配置在 Step 1 敲定**（目的+投放场景/画幅、时长、笑点引擎、台词语言、字幕语言、旁白、分段节奏），再进 Step 2 出角色/场景；压成 2 轮点选、不连环追问。\n- **画幅由投放场景定**（竖屏 9:16 / 横屏 16:9 / 方形 1:1）；三视图（版式固定）、场景图、成片 prompt 统一同一画幅。\n- 一条 prompt 用一种主语言整条交付，需要时附镜像；包在可复制代码块。\n- 角色：**先问数量**（建议 2 人）**再问每个的形象 + 国籍/族裔**（开放，含亚裔）；用 {{Mixed N}}，首现写全（含国籍/族裔 + 制服化标志装）、后续复用、互动主宾清晰；角色图可**用户上传照片**或生成三视图，二选一后绑定；每个段子先出固定主场景的场景图绑定。\n- 多机位中宽景、稳定；切「说话 ↔ 反应」；**角色相对位置锁定不互换**；**不用**对镜头一瞥/手持/急推/采访。\n- **每 15s 一个完整笑点**、三拍、收尾落反应 + 笑声，节奏紧凑；30s/60s＝连着抖 2/4 个小段子，每段各落一次。\n- **prompt 用中文写**（台词按所选语言保留原文）；**字幕绝不在生成阶段出现**——prompt 明确\"无字幕或屏幕文字\"，字幕单列清单、仅成片后剪辑烧录。\n- 确认 OK 后才上 **平台画布**生成（带绑定的角色/场景图）；背景可加低调群演（不互动/不看镜头/不抢戏）。\n- 常配「混乱制造者 + 正常人」二人组。\n- 不做涉及真实公众人物的内容；保持适当无害。", "extras": [], "cn": "情景喜剧"}, {"slug": "skincare-tvc-producer", "desc": "制作护肤品、精华液、面霜、香氛和美妆瓶身类商业短片。开场先介绍功能并只要求上传产品图；看图后 Agent 自动判断产品类型、图片质量、白底修复需求，再用一轮项目确认选择模特使用广告或纯产品渲染广告、风格、画幅和时长。人物出镜路径必须先生成 3x3 故事板控制整片视听结构；纯产品路径独立成片，禁止混剪。默认 720P 单个完整 15 秒视频节点并内置 BGM。\\\" version: 1", "body": "# Wander 护肤品 3x3 商业片\n\n## 功能定位\n\n用于把护肤或美妆瓶身产品做成高级商业短片。主路径是“模特使用广告”，展示产品、质地、上脸或上手动作、肌肤光泽和最终 hero shot；也支持“纯产品渲染广告”，只展示瓶身、成分意象、材质和光线。\n\n人物使用路径和纯产品渲染路径必须分开。不要在人物使用广告里突然插入纯白背景旋转产品渲染，也不要在纯产品广告里突然出现剧情人物。\n\n## 固定用户引导\n\n### 第 0 轮：开场介绍并只要求上传图片\n\n开场必须先说明： “这个 Skill 会把你的护肤/美妆产品图做成一支 15 秒高级商业片。我会先分析图片是否清晰、瓶身是否完整、背景是否干净、是否需要先生成白底产品图，再让你用一轮确认选择人物使用或纯产品渲染、视觉风格、画幅和时长。”\n\n随后只要求用户上传最清晰的一张产品图。不要在第一屏询问产品是什么、图片是否清晰、是否白底、卖点、风格、画幅或时长。\n\n### 第 1 轮：看图后只做一次项目确认\n\n看图后先给出简短判断，再让用户一次性确认：\n\n- 识别到的产品类型和瓶身特征。\n- 图片质量判断：可直接用，或需先生成白底产品图。\n- 广告路径：模特使用广告（推荐）、纯产品渲染广告。\n- 风格选择：清透水感、奢华修护、临床科技、自然有机、香氛高端。\n- 画幅选择：9:16、16:9、1:1。\n- 时长选择：15秒视频（推荐）、30秒视频、45秒视频、60秒视频。\n\n用户不修改时，默认：模特使用广告、清透水感、15 秒、720P、9:16。\n\n## 产品图与资产规则\n\nAgent 自行判断：\n\n- 合格：瓶身完整、包装结构清楚、主色准确、无手部遮挡。\n- 不合格：手机随手拍、背景杂乱、反光过曝、瓶身倾斜变形、文字严重糊。先生成白底电商图。\n\n模特使用广告必须同步生成：产品白底图、模特图、洁净浴室/梳妆台/自然光场景图、3x3 商业故事板。纯产品渲染广告只生成产品、材质、成分意象和 hero 场景故事板。\n\n## 资产闭环硬规则\n\n产品图、模特图、场景图和 3x3 故事板必须作为最终视频节点参考输入。故事板不是文字提纲，而是控制最终画面结构的图片蓝图。\n\n生成视频前必须建立资产清单：\n\n- 模特使用路径：`product_reference`、`model_reference`、`scene_reference`、`storyboard_reference`。\n- 纯产品路径：`product_reference`、`texture_reference`、`ingredient_scene_reference`、`storyboard_reference`。\n\n最终视频提示词必须以“参考输入”段落开头：\n\n- 模特使用路径必须写明：以 `product_reference` 锁定瓶身；以 `model_reference` 锁定人物；以 `scene_reference` 锁定浴室/梳妆台/自然光环境；以 `storyboard_reference` 控制 0-15 秒镜头顺序、产品出现、质地特写、模特涂抹和 hero shot。\n- 纯产品路径必须写明：以 `product_reference` 锁定瓶身；以 `texture_reference` 锁定精华/乳霜/水滴质地；以 `ingredient_scene_reference` 锁定成分意象；以 `storyboard_reference` 控制 reveal、微距、材质反光和最终 hero shot。\n\n禁止最终视频只使用文字分镜而不引用故事板图片。若平台视频节点支持多图参考，必须传入所有对应资产；若只支持单图参考，优先使用 `storyboard_reference`，并在提示词里说明产品、模特、场景或质地已由故事板锁定。\n\n## 故事板硬规则\n\n必须先用 3x3 storyboard 控制片子，再写完整视频提示词。\n\n模特使用广告 storyboard 应包含：\n\n- Product macro：瓶身或泵头微距。\n- Texture close-up：精华、乳霜、水滴、膏体质感。\n- Model application：取用、点涂、推开、轻按。\n- Skin / mood shot：皮肤光泽、自然表情、柔和光线。\n- Ingredient story：植物、水感、科技成分或香氛意象。\n- Luxury hero shot：产品和模特关系明确的收尾。\n\n纯产品渲染 storyboard 应包含：产品 reveal、瓶身结构、质地、成分意象、材质反光、低角度 hero shot，不出现模特。\n\n## 15 秒视频结构\n\n模特使用广告：\n\n- 0-2s：产品和场景建立。\n- 2-5s：质地特写。\n- 5-8s：模特取用和涂抹。\n- 8-12s：皮肤光泽、情绪和光线。\n- 12-15s：产品 hero shot。\n\n纯产品渲染广告：\n\n- 0-3s：产品 hero reveal。\n- 3-6s：质地和成分意象。\n- 6-9s：材质、瓶盖、泵头、玻璃微距。\n- 9-12s：光线扫过和轻旋转。\n- 12-15s：最终 hero shot。\n\n## 视频生成硬规则\n\n- 默认分辨率必须是 720P。\n- 15 秒模式必须只创建一个完整 15 秒视频节点，不要把 storyboard 的每格拆成短视频。\n- 15 秒节点内直接生成 BGM。BGM 风格必须写入提示词：清透水感用 soft ambient piano；奢华修护用 slow luxury cinematic ambient；临床科技用 minimal clean electronic；自然有机用 gentle acoustic ambient；香氛高端用 elegant downtempo。\n- 同时保留水滴、瓶盖轻响、乳霜涂抹、玻璃轻触等环境声。\n- 超过 15 秒才拆段：30 秒 = 2 个 15 秒段；45 秒 = 3 个 15 秒段；60 秒 = 4 个 15 秒段。\n- 多段模式每段仍是 15 秒完整段，不得拆成 4-6 秒小段。\n- 多段模式的每个视频段不生成 BGM，只生成环境声；最后统一生成完整 BGM 并合成，保留环境声。\n\n## 合规表达\n\n避免治愈、永久改变、医疗功效、绝对前后对比。使用清透视觉、柔和光泽感、水润质感、舒缓氛围、成分灵感等表达。\n\n## 自检\n\n输出前检查：是否有开场功能介绍；是否只做一轮项目确认；是否默认 720P；人物使用路径是否先有 3x3 storyboard；纯产品路径是否独立；15 秒是否只有一个视频节点；是否没有混杂人物使用和纯产品渲染；最终视频节点是否明确引用产品图、模特/质地图、场景图和 3x3 故事板。", "extras": [], "cn": "高端护肤品商业广告TVC"}, {"slug": "soccer-action-cinematic", "desc": "Use when 用户想上传自己的角色图，或先创建角色，再生成实拍、3D 或 2D 画风的酷炫单人足球运动短片。\\\" version: 1", "body": "# Wander 角色足球动作短片\n\n## Skill 定位\n\n将用户的角色图变成一条单人酷炫足球运动短片。默认是 15 秒、9:16、720P 的街头足球连续主镜头：角色从脚下控球开始，花式突破逐步加压，最后一脚把足球踢向镜头并撞镜收尾。\n\n它只做单人角色驱动的足球动作片段，不做真实比赛复盘、球队战术分析、未授权真实球星复刻或多人长剧情。酷炫感来自可读的足球动作、动机明确的镜头运动和连续升级，不用无关爆炸掩盖动作。\n\n## 多层级 Reference 调用策略\n\n本 Skill 使用多层级 reference。执行时按阶段加载：\n\n- 判断角色图、生成白底角色图、选择和锁定画风时，必须使用 `references/character-and-style-policy.md`。\n- 设计足球动作、场地、节奏、音效和撞镜收尾时，必须使用 `references/football-action-engine.md`。\n- 生成最终视频提示词、列出引用资产、检查角色一致性时，必须使用 `references/video-reference-policy.md`。\n- 生成 `character_reference`、`football_scene_reference` 或 `football_action_composite_reference` 时遇到图片安全审核失败，必须使用 `references/image-generation-fallback-policy.md`。\n\n主文件只定义总流程。不要跳过 reference，也不要把某一种画风的词直接复制到另外两种画风。\n\n## 图片安全审核失败回退\n\n只在图片生成因安全审核未通过时执行以下固定回退，不用于网络异常、模型超时、普通画质不满意或其他生成失败：\n\n1. 保持原始提示词完全不变，先切换到 Navo Pro 重试。\n2. Navo Pro 仍因安全审核失败时，保持同一份原始提示词完全不变，切换到 Navo2 重试。\n3. Navo2 仍因安全审核失败时，才加载 `references/image-generation-fallback-policy.md`，审查并最小化调整可能触发审核的表述后再尝试。\n\n这不是绕过安全审核。不得隐瞒、编码、拆分或伪装受限内容；若经过合规措辞调整后仍无法生成，应停止重试并向用户说明受限原因及可行的安全替代方向。\n\n## 输入\n\n### 第 0 轮：先锁定角色与画风\n\n开场先说明：\n\n“这个 Skill 会把你的角色做成一条酷炫足球动作短片。先上传角色图最容易锁住脸、发型和服装；上传后你可以选择保留原图画风，或切换到内置画风。没有角色图也没关系，我可以先按你的描述生成一张白底角色图。角色和画风确认后，才进入横版足球场景预览和视频生成。”\n\n先建议用户上传自己的角色图，优先询问：\n\n1. 是否上传角色图？推荐一张清晰、单人、正面或三分之二身、脸和服装可见的图片。\n2. 若没有角色图，收集：成年角色的性别表达/外貌、发型、肤色、年龄感、体型与运动气质、球衣或日常穿搭、鞋款、禁用元素。不得把未成年或年龄不明角色用于性感化、危险化呈现。\n3. 若用户上传角色图，必须先确认画风模式，不能默认转换：\n   - 保留上传角色图画风（推荐）：视频、场景合成图和角色资产沿用上传图的绘画/渲染/摄影风格，只做必要的白底整理，不把角色强行转换成内置风格。\n   - 使用内置画风：再从“实拍的电影质感、3D 渲染动画片、2D 卡通片”中单选一种。\n4. 若用户没有角色图，选择画风，只能从以下三项中选择：\n   - 实拍的电影质感（推荐）：真实摄影、运动电影、自然环境与真实鞋球接触。\n   - 3D 渲染动画片：高质量风格化 3D、可控光影与动感特效。\n   - 2D 卡通片：二维赛璐璐动画、清晰动作线与夸张透视。\n\n同时收集最少边界：\n\n- 场地偏好：夜晚城市水泥球场（默认）、黄昏街头球场、屋顶球场、室内五人制场、雨后球场。\n- 动作强度：酷炫但易读（默认）、高强度花式、力量射门为主。\n- 时长：默认 15 秒、720P；用户可以改为 30 秒或更长。系统根据时长自动决定音频交付：单段 15 秒视频内生成 BGM；超过 15 秒时拆成多段 15 秒视频，每段不生成 BGM，并额外输出一段独立 BGM 用于后期拼接。\n- 视频比例：在最终视频生成前必须由用户明确选择横版 16:9 或竖版 9:16；没有默认值。横版场景图和横版动作预览不随此选择改变。\n- 字幕：无字幕（默认）、短标题字幕、动作标签字幕。\n\n### 角色输入使用规则\n\n- 用户的角色图是身份锚点，必须先加载 `references/character-and-style-policy.md` 判断清晰度、单人性、脸部和服装可见度。\n- 对用户上传图必须在系统内自动执行 `role_asset_decision`，不询问用户是否需要提取：背景干净、单人、脸/发型/服装/鞋与身体细节清晰、可直接作为角色资产时，直接将上传图锁定为 `character_reference`；任一关键条件不满足时，自动生成白底 `character_reference` 角色资产图。\n- 用户上传角色图时，必须先确认 `style_mode`：`preserve_uploaded_style`（保留上传角色图画风）或 `built_in_style`（使用内置画风）。未确认前，不得把角色自动转换成实拍、3D 或 2D。\n- 图合格时直接锁定上传图为 `character_reference`，不再额外生成白底角色图；不擅自更换脸、发型、主要服装、肤色或性别表达。\n- 图不适合直接锁定时，系统自动生成 `character_reference` 白底角色资产图，并在生成后让用户确认结果；可以简要说明触发原因，但不得问用户是否要做这一步。\n- 上述白底角色图、横版场景图和横版动作预览图遇到安全审核失败时，必须按“原提示词 -&gt; Navo Pro -&gt; Navo2 -&gt; 合规措辞最小调整”的顺序处理。\n- 用户无图时，先输出白底角色图提示词，生成后必须请求确认；没有 `character_reference` 不得进入动作合成或最终视频。\n- 不得照搬受版权保护角色、真人球星或第三方肖像；用户提供自己拥有使用权的角色图时才可直接使用。\n\n## 内部流程和 Knowhow\n\n### 1. 角色资产与画风确认\n\n加载并执行 `references/character-and-style-policy.md`。\n\n先生成或锁定：\n\n- `character_reference`：角色身份资产。若上传图可直接使用，则为用户上传图；若系统判定不适合直接使用，才生成横版 16:9 白底角色设定图。始终锁定脸、发型、服装、鞋子、身体比例和运动气质。\n- `football_scene_reference`：横版 16:9 足球场景图。锁定完整球场的空间、地面、灯光、背景和所选画风；不放角色。\n- `football_action_composite_reference`：横版 16:9 角色进入选定球场的动作预览图，仅用于让用户确认角色与场景的整体光线、氛围、构图和感觉；不是最终视频的引用资产。\n\n资产生成顺序必须固定为：\n\n1. 先锁定 `character_reference`。\n2. 生成并保存 `football_scene_reference`。\n3. 只有 `football_scene_reference` 生成成功后，才生成 `football_action_composite_reference`；生成时必须实际引用 `@[character_reference]` 与 `@[football_scene_reference]` 两个已生成资产，不得只根据文字重新生成一张相似场景。该合成预览只用于用户确认整体感觉，完成确认后不传入最终视频节点。\n\n`football_scene_reference` 缺失、生成失败或被替换后，禁止沿用旧预览或直接生成预览。必须先取得当前有效的场景资产，再基于它重新生成 `football_action_composite_reference`。用户修改场地、光线或画风时，同样先更新场景资产，再更新合成预览。\n\n角色图存在时，先自动完成 `role_asset_decision`，再确认用户选的是保留原图画风还是内置画风；只有选择内置画风时才转换。直接可用的上传图不生成额外白底资产；系统提取出的白底角色图与无角色图生成的白底角色图都必须在进入场景前确认。\n\n在生成 `football_action_composite_reference` 前，必须确认：\n\n“这位角色的脸、发型、服装和画风是否通过？通过后我会生成足球动作场景预览。”\n\n在输出视频前，必须确认：\n\n“这张角色足球动作预览是否通过？确认后才生成最终短片，避免把不满意的角色或画风直接用于视频。”\n\n### 1.5 视频比例强制闸门\n\n用户通过动作预览后、生成任何最终视频提示词前，必须单独确认 `video_aspect_ratio`：\n\n“预览已通过。最终视频请选择：横版 16:9，还是竖版 9:16？”\n\n只有用户明确回复横版 16:9 / 16:9 / 横版，或竖版 9:16 / 9:16 / 竖版后，才能把对应值写入 `video_aspect_ratio`。如果用户尚未明确选择，或只说“都行”“默认”“你看着办”，必须停在这里再次询问；不得输出最终视频提示词、分段视频提示词或 BGM 提示词。\n\n即使用户在对话较早阶段提过画幅，也要在动作预览通过后核对一次；只有已记录且用户未要求变更的明确值可以直接沿用。\n\n### 2. 足球动作编排\n\n加载并执行 `references/football-action-engine.md`。\n\n默认使用八段连续主镜头动作，但根据时长压缩或扩展；动作必须可读、连续、符合大致身体发力逻辑：\n\n1. 近地逼近与压迫停顿。\n2. 鞋底滚动、拖回、脚尖点拨、变向假动作。\n3. 挑球与脚绕球控制。\n4. 膝盖、大腿、脚后跟的连续控球。\n5. 低机位后跟挑球与交叉触球。\n6. 鞋底停球、向前滚动、蓄力正对镜头。\n7. 直线爆发射门。\n8. 足球撞镜，干净地收为黑场、球印或画面闪白。\n\n默认不要可见剪辑；镜头变化用连续的贴地滑行、绕脚跟拍、随球抬升、环绕、俯冲和锁定实现。用户明确需要分镜蒙太奇时才改为多镜头。\n\n### 3. 最终视频提示词与引用\n\n仅当用户确认角色资产和动作预览后，加载并执行 `references/video-reference-policy.md`。\n\n最终视频必须引用：\n\n- `character_reference`：锁定角色身份、发型、服装、鞋和体态。\n- `football_scene_reference`：空的横版足球场景资产，锁定球场空间、地面、光线、背景与整体画风。\n\n最终视频不得引用 `football_action_composite_reference`。该图只用于让用户确认角色植入场景后的光线、氛围和整体感觉；视频节点必须根据单独的角色资产与空场景资产重新完成角色进入场景、控球动作和镜头运动。\n\n用户明确需要字幕时，可额外引用 `subtitle_style_reference` 或字幕版脚本图。最终视频不得只依赖白底角色图，也不得混用与选定画风冲突的材质、镜头或音效词。\n\n音频交付由时长自动决定，不需要用户额外选择：\n\n- 单段 15 秒：最终视频提示词必须要求同步生成 BGM，并描述与所选画风、场地和动作节奏相配的 BGM 风格。\n- 超过 15 秒：必须拆为多个 15 秒视频提示词；每段都明确“不要生成 BGM，只生成环境音与足球动作音”，再额外输出一条覆盖完整成片时长的独立 BGM 生成提示词，供后期拼接和合成。\n\n## 输出\n\n### 第 0 轮输出\n\n只输出：\n\n1. 上传角色图的建议。\n2. 没有角色图时的角色描述问题。\n3. 三种画风选择及一句差异说明。\n4. 场地、动作强度、时长、字幕的最少确认项；视频横版 16:9 或竖版 9:16 的选择在最终视频前确认。\n\n### 角色阶段输出\n\n必须输出：\n\n1. 角色图自动判定结果，或用户角色描述的简短复述。\n2. 图可直接使用时：说明已直接锁定上传图为 `character_reference`，不生成白底资产；图不适合时：输出 `character_reference` 的完整白底资产生成提示词并自动进入生成。\n3. 角色与画风确认问题。\n\n### 动作预览阶段输出\n\n必须输出：\n\n1. 已选风格和动作方向的一句话确认。\n2. 先生成 `football_scene_reference` 的完整横版提示词；场景资产成功后，再输出引用 `@[character_reference]` 与 `@[football_scene_reference]` 的 `football_action_composite_reference` 提示词。\n3. 动作预览确认问题。\n\n### 用户确认动作预览后的输出\n\n必须输出：\n\n1. 先输出并确认 `video_aspect_ratio`：横版 16:9 或竖版 9:16；没有确认值时停止，不输出后续项目。\n2. 一条带有已确认 `video_aspect_ratio` 的完整视频提示词，或按时长拆分的连续视频提示词。\n3. 最终视频引用清单。\n4. 声音与字幕策略。\n5. 单段 15 秒时的内嵌 BGM 风格，或多段视频时的独立 BGM 后期生成提示词。\n6. 角色、足球、场地、画风、动作、结尾的资产闭环检查。\n\n## 自检\n\n输出前检查：\n\n- 是否一开始就建议用户上传自己的角色图。\n- 用户上传角色图时，是否由系统自动判断其能否直接用作 `character_reference`，而没有询问用户是否要提取角色资产。\n- 图直接可用时，是否跳过白底角色图生成；图不适合时，是否自动生成白底角色资产图并保留确认闸门。\n- 用户上传角色图时，是否明确确认保留上传角色图画风，或改用内置画风，而不是自动转换。\n- 没有角色图时，是否先收集描述并生成白底 `character_reference`。\n- 无角色图时，是否只让用户在实拍电影质感、3D 渲染动画片、2D 卡通片中选一种画风。\n- 场景图与角色动作预览图是否均为横版 16:9。\n- 是否先生成并保存 `football_scene_reference`，再实际引用该资产与 `character_reference` 生成合成预览，而没有用文字重建场景。\n- 场景资产缺失、失败或变更后，是否阻断了预览生成并要求先更新场景资产。\n- 动作预览通过后，是否单独询问并记录 `video_aspect_ratio` 为横版 16:9 或竖版 9:16。\n- 未得到用户明确的横版 16:9 或竖版 9:16 选择时，是否没有输出最终视频提示词、分段视频提示词或 BGM 提示词。\n- 单段 15 秒时，是否在视频提示词中明确同步生成 BGM 并描述 BGM 风格。\n- 超过 15 秒时，是否拆成多个 15 秒视频、每段明确不要生成 BGM只保留环境音，并额外输出独立 BGM 后期提示词。\n- 是否在角色确认前没有进入动作场景与最终视频。\n- 是否在动作预览确认前没有输出最终视频提示词。\n- 是否执行了角色与画风、足球动作、视频引用三份 reference。\n- 最终视频是否只引用 `character_reference` 与空的 `football_scene_reference`，而没有引用仅用于确认的 `football_action_composite_reference`。\n- 是否让动作从控球、连招、挑球、蓄力到射门与撞镜逐步升级。\n- 是否避免不可读的多余杂技、无关爆炸、足球数量变化、角色变脸或可见剪辑。\n- 是否让 2D 保持二维动画语言、3D 保持三维渲染语言、实拍保持真实摄影语言。\n- 是否明确足球只能由脚、腿、躯干或头部控制，手、手臂、手肘和手腕全程禁止接触足球。\n- 用户需要字幕时，是否才加入字幕样式参考；用户不需要时不强塞字幕。\n- 图片安全审核失败时，是否先保持同一提示词依次尝试 Navo Pro 和 Navo2，只有两者仍失败才考虑合规措辞调整。\n\n## Ask User\n\n必须问：\n\n- “请上传你的角色图。没有角色图的话，告诉我角色的外貌、发型、服装和运动气质，我先帮你生成白底角色图。”\n- “你希望整体视频保留上传角色图的原画风，还是使用内置画风？选择内置画风时，请再选：实拍的电影质感、3D 渲染动画片、2D 卡通片。”\n- “角色和画风是否通过？通过后生成足球动作预览。”\n- “动作预览是否通过？是否要调整场地、动作强度、球衣、镜头或结尾？确认后才生成视频。”\n- “预览已通过。最终视频请选择：横版 16:9，还是竖版 9:16？场景图和动作预览会保持横版，方便完整查看球场。”", "extras": [], "cn": "花式足球动作短片"}, {"slug": "step-by-step-tutorial-video", "desc": "博主分步演示产品用法,适用自媒体种草短视频", "body": "---\n\n## name: ugc-tutorial-flow\\\\\n\nnamespace: industry\\\ntitle: \"UGC 教程视频\"\\\ndescription: \"UGC 风格教程视频——达人分步演示某产品的用法，画面带『Step N — Heading』步骤字幕。分镜板为 21:9 横条含 4 个竖 9:16 槽、每槽一个使用步骤、步骤全局连续编号，CTA 只在末板末格。覆盖用法分析→人设锚点→独白→串行出板→逐镜生成→合成。\"\\\nversion: 3\n\n# ugc-tutorial-flow\n\n做 UGC 风格教程视频（达人**分步演示某产品用法**、画面带「Step N」步骤字幕）时用本 skill。创作（人设 / 独白 / 分镜 prompt）由你自己做——源里委托给后端 enhancer，本环境没有。你管控制流、门控、时序、拼接。\n\n一条管线覆盖所有 UGC 教程 / 产品用法视频：**每个分镜槽 = 使用产品的一个物理步骤**。\n\n## 分镜结构（教程专属 · 与口播底不同）\n\n- 每块**分镜板 = 一条 21:9 横条，内含 4 个竖排 9:16 槽**（口播底是 16:9 含 3 槽；教程覆盖为 21:9 含 4 槽）。\n- 每槽显示一个「Step N — Heading」字幕。\n- **总步数 = 4 × 板数**；**步骤编号全局连续**（跨板不重置）。\n- **CTA 尾**只出现在**最后一板的最后一格**。\n\n## 流程\n\n1. **解析需求 + 产品用法分析**（product-analyzer）：从真实使用流程导出步骤，产出 `step_captions` 数组。**必做**。\n2. **人设生成**：`generate_image_v3` 出达人角色锚点（或用户给照片）。身份锁定为**单一 character 锚点节点**（`character_media_id` 概念），全程复用同一 `{{NodeKey}}`，见 character-consistency。\n3. **上传 / 登记产品**为锚点。\n4. **独白脚本**：写完整口播词，逐步对应各使用步骤。\n5. **分镜板生成**：按时长定板数（见下），`generate_image_v3` **串行**出板（后板参考前板保持连贯）——**21:9 横条，内含 4 个竖 9:16 槽**，每槽带「Step N — Heading」字幕。\n6. **逐镜写 prompt + 生成**：并行写各板 Seedance 风格 prompt（一批），`generate_video_v3` **一批并行提交**，`reference_nodes` 引人设 / 产品 / 分镜板锚点。\n7. **拼接**：N≥2 段 `composite_video`（见 montage）；配音用 `generate_audio`。\n8. **报告**。\n\n## 时长 → 板数\n\n总时长板数 N4–15s116–30s231–45s346–60s4\n\n（步数 = 4 × N；步骤编号跨板全局连续。）\n\n## 人设生成规则（Step 2 深度 · UGC 家族通用）\n\n达人锚点要做成**真实手机自拍**质感，不是杂志肖像：\n\n- **构图**：手臂伸直的前置自拍，头肩填满画面，略微偏心 / 不完美构图（非摆拍、非影棚居中），持手机的手 / 腕可在画面边缘隐约出现。\n- **真实感**：保留手机传感器颗粒与皮肤毛孔纹理，不修图、不磨皮滤镜、无影棚光 / 专业光泽；主体清晰、背景自然虚化。\n- **服装**：全覆盖胸前 / 躯干，无 logo、无可见文字。\n- **打光 / 环境**：柔和冷中性日光（侧窗），干净、无暖调、无修饰光晕。\n\n## 手数 / POV 规则（UGC 家族通用 · 关键）\n\n- 角色**恰好两只手**。\n- **Selfie POV**：一只手拿手机（画外或边缘隐约可见），另一只手做动作——**绝不在 selfie POV 里同时拿两个物体**。\n- 需要**双手**的动作（如实际操作 / 使用产品的步骤）→ 切 **Tripod POV**（手机不在画面）。\n- POV 可在镜 / 槽间切换，切换**对齐硬切**。\n\n## 镜头 / 渲染规则\n\n- 每槽 = 演示的一个使用步骤；真实摄影风格 UGC、自然光、随意真实感。\n- 演示步骤按实际使用顺序推进，槽内动作贴合该 Step 的 Heading。\n- **握持物理**：产品的重 / 轻按实物表现，抓握、承重要真实。\n- 产品呈现时 **label 朝前、不旋转**，画面恰好一个产品。\n- **能量基调**：默认高能达人，**可按品牌调性调整**（不强制夸张尖叫）。\n- 无镜子 / 反射镜头；无变形手 / 第三只手臂；画面上**无任何多余文字 / 品牌 / 标志**（「Step N」步骤字幕除外）。\n\n## 关键规则\n\n- **English-only**：字幕、独白、CTA 均英文；步骤字幕用「**Step N — Heading**」格式、**en-dash（—）分隔**。\n- **产品用法分析必做**：步骤从真实使用流程导出，不臆造。\n- **CTA 尾**（末板末格最后约 0.5–1s）：达人出镜 + 手势 + \"Link in bio\" / \"Subscribe!\"。\n- **人设身份锁定**：单一 character 锚点节点贯穿全片，不要每镜重生成达人。\n- **板串行、片并行**：分镜板串行生成（保连贯），Seedance 片段一批并行提交。\n- **开场词约束**：口播第一个词**不要**用 OK / Okay / So / Um 等虚词起头，直接进钩子。\n- **音频 / 稳定度**：自拍镜手持微抖、三脚架镜锁定定帧；成片无画面文字、无字幕、无水印（步骤字幕除外）。\n- Seedance 逐镜默认 `count: 2`。\n\n## 配合（query 需同时加载 / 也是本 skill 的评估组合）\n\n关系目标用途必需?provenance依赖product-analyzer产品用法分析、导出 step_captions必需源生依赖image-generation人设 / 产品 / 分镜板出图必需源生依赖video-generation逐镜生成必需源生依赖montageN≥2 拼接（montage 源正文明列 ugc-\\* 当 N≥2 调本 skill）N≥2 必需源生依赖character-consistency达人身份锁定必需源生\n\n边界（改道，非依赖）：产品为主角 → ugc-product-flow；试穿 → ugc-try-on-flow；开箱 → ugc-unboxing-flow；口播评测（无分步演示）→ ugc-flow；换人复刻 → ugc-model-swap。\n\n## 相关\n\n口播评测底 → ugc-flow；产品为主角 → ugc-product-flow；试穿 → ugc-try-on-flow；开箱 → ugc-unboxing-flow。", "extras": [], "cn": "自媒体分步教学短视频"}, {"slug": "storyboard-scene-creator", "desc": "脚本→故事板→视频成片全链路", "body": "# TVC全链路制作器\n\n把用户提供的主题、素材或参考图，从**创意脚本**一路做到**视频成片**。全链路覆盖：创意脚本 → 资产（角色三视图 + 道具设定图）→ 分镜故事板 → 逐镜视频 → 合成成片。默认 **16:9、4K**，故事板支持三格/多格版式并保留底部六色箭头图例。\n\n## 何时使用 / 何时不用\n\n- **用**：用户要做一条 TVC / 广告成片，需要从创意脚本做到视频成片；或只做其中某一段（如只要故事板）。\n- **不用**：纯静态配图（无分镜格、无标注），或无脚本的随手视频。\n- **视频意图**：检测到 TVC、时长（如 30 秒）、视频等信号时，**主动向用户说明本 Skill 可从静态故事板一路做到视频成片**，并确认目标时长、画幅、分辨率。\n\n## 输入\n\n支持三种起点，按用户实际提供的内容选择：\n\n- **有图**：用户给一张故事板/参考图 → 分析其画面内容与版式，按目标比例改造重排。\n- **无图**：用户给主题或文字脚本 → 由 AI 生成创意脚本与分镜。**须先走「阶段1·创意脚本确认门」。**\n- **零散素材**：用户给多张图 + 一段文案 → 整合成连贯的故事板。\n\n## 三个可 DIY 要素（槽位）\n\n以下三项**由使用者决定**，每一项都支持\"用户自己指定 / 用户提供素材 / 让 AI 生成\"三种方式。不要写死成参考图里的具体取值：\n\n要素参考图取值（仅作示例）可替换为场景中式古风宫廷膳房现代餐厅、家常菜厨房、西式、日式等任意风格产品八宝鸭、蟹粉狮子头、翡翠虾仁、桂花糕、蜜饯梅子任意菜品或非菜品产品人物形象古装女子沈扶瑶任意造型 / 性别 / 时代 / 形象风格手绘素描 / 线稿风现代写实摄影风等任意风格\n\n**生成前先确认这三个要素**：如果用户没有明确指定，用 `ask_parent_agent` 询问，或按用户已给的主题合理推断后请其确认，不要默认沿用参考图的古风膳房设定。\n\n---\n\n## ⚠️ 核心原则：分镜数与视频段数必须一一对应\n\n**阶段3确定的分镜数量（如 30 秒拆成 15 镜）= 阶段4必须逐镜生成的视频段数量（15 段）。**\n\n- **不得在视频阶段自行合并回 3 个大镜头**（如把 15 镜并成 3 段各 10 秒）——这会造成分镜与视频生产脱节，是必须避免的错误。\n- **每段视频严格对应一个分镜**：时长、景别、焦段、运镜、光线、情绪、道具、人物表情、动作都按该镜分镜执行。\n- **单段最短时长冲突处理**：视频模型的单段最短时长若大于某镜时长（如部分模型最短 5 秒），**须在分镜确认时就与用户核对**——要么选用支持短时长的模型，要么按模型限制重新归组镜头并明确告知用户，**不能默认丢弃分镜**。\n\n### 15 镜时长分配（本次实测，合计 30 秒）\n\n镜123456789101112131415时长(s)222221.51.51.522222.52.53\n\n---\n\n## 标准执行步骤（全链路）\n\n### 阶段0 · 需求与边界\n\n1. 接收主题 / 素材。\n2. 检测到 TVC、时长（如 30 秒）、视频等信号时，主动说明本 Skill 可从静态故事板一路做到视频成片。\n3. 确认目标**时长、画幅、分辨率**。\n\n### 阶段1 · 创意脚本确认门\n\n1. 无图分支先由 AI 撰写有创意点的剧本，含：**创意核心、分镜、时长分配、台词 / 旁白**。\n2. **必须经用户确认后才生成任何图片，不得直接出图。**\n3. 用户提出修改时，先改剧本再重新确认。\n\n### 阶段2 · 资产先行（锚点）\n\n出故事板前先生成：\n\n1. **角色三视图**：正面 / 侧面 / 背面全身，含完整身材比例与时尚穿搭造型。\n2. **道具设定图**：本片用到的产品与道具，多角度。\n\n两者作为后续故事板与视频的**统一锚点**。\n\n### 阶段3 · 分镜故事板\n\n1. **按时长细分镜头**：30 秒可拆到 **13–15 镜，平均约 2 秒/镜**（本次实测为 15 镜）。\n2. **至少一个全身镜头**。\n3. **每镜标注**：镜头号/时间、景别、镜头焦段、运镜方式、光线、情绪、道具、人物表情。\n4. **排版**：支持单镜独立故事板，或每图 3 个 1:1 镜头格拼成 16:9 总表；底部保留**六色箭头图例**（红=主体动作，蓝=摄影机运动，绿=取景构图，橙=灯光，紫=声音/情感，黑=镜头笔记与标签）。\n5. 故事板**须引用角色三视图与道具图**，保证人物跨镜、产品跨镜一致。\n6. **确认分镜数量与各镜时长**，并核对是否与视频模型最短时长限制兼容（见「核心原则」）。\n\n### 阶段4 · 视频生成（逐镜生产）\n\n1. **按 15 镜逐镜创建并生成 15 段视频**，每段引用对应的角色三视图 `{{i-vmkk42rkfd7d}}` 与道具图 `{{i-hjbz7a7j8g3p}}`，保证人物、产品一致。\n2. 每段 prompt 写入：**该镜的画面 / 动作 / 景别 / 焦段 / 运镜 / 光线 / 情绪** + **真实皮肤质感**（自然毛孔、肤色层次、克制高光，严禁塑料感 / 蜡像感 / 过度磨皮的 AI 假脸）。\n3. **规格**：16:9、4K。\n4. **模型选择**：多参考图（角色 + 道具）时用支持多参考的 **Seedance 2.0**；**Kling 3.0** 仅支持文生视频 / 单图生视频 / 首尾帧，**不支持多图参考**。\n5. **分批创建、分批审批运行。**\n\n### 阶段5 · 合成成片（15 段拼接）\n\n1. **按镜 1 → 镜 15 顺序把 15 段视频拼接成一条 30 秒成片**，而非 3 段。\n2. 合成**不调用生成模型、不扣费**，分辨率 **2160p 即 4K**。\n3. 可选叠加 BGM、音效、旁白、字幕、品牌 logo / slogan 卡片。\n\n---\n\n## 硬规则（锚点，不可变）\n\n1. **分镜数 = 视频段数**：阶段3的分镜数量必须等于阶段4生成的视频段数，不得合并。\n2. **三格/多格版式固定**：故事板保持三格/多格版式，不因输入或比例变化而改变格数结构。\n3. **底部颜色箭头图例固定保留**：红=主体动作，蓝=摄影机运动，绿=取景构图，橙=灯光，紫=声音/情感，黑=镜头笔记与标签。\n4. **人物形象跨镜一致**：同一人物的造型、性别、时代、形象在各镜中必须统一。\n5. **至少一个全身镜头**：故事板必须含至少一个全身镜头，展示完整身材与穿搭。\n6. **资产一致性**：故事板与视频须引用角色三视图与道具图，保证人物跨镜、产品跨镜一致。\n7. **无图分支未确认剧本不得出图**。\n\n## 合规规则\n\n角色涉及性感 / 身材强调时，**须使用合规表达**：以高级时装、时尚穿搭、氛围感等措辞描述，避免触发安全审核。\n\n- 穿搭方向以用户指定的时尚风格为准，而非黑色西装等与创意不符的默认款式。\n- **若生成被安全审核拒绝，换用合规措辞重建**（实测：角色三视图前两版因吊带 + 身材强调被拒，改为时尚穿搭 / 端庄写法后通过），不要放弃或绕过审核。\n\n## 可选参数\n\n- **比例**：默认 1:1（故事板），可选 16:9 / 9:16；视频成片默认 16:9。\n- **分辨率**：视频默认 4K（2160p）。\n- **中文标注**：根据画面提供中文标注——镜头、灯光、动作、情绪、机位运动、取景/构图笔记等。**标注是否保留由使用者选择**。\n\n## 注意\n\n- 三个 DIY 要素是槽位、不是锚点；版式、图例、人物一致性、全身镜头、资产一致性、分镜数=视频段数是锚点、不是槽位，不要混淆。\n- 若用户未指定三要素，先问再生成，不要默默沿用参考图设定。\n- 无图分支**没有用户确认剧本前，不得出图**。\n- 涉及性感 / 身材强调时，一律用高级时装、时尚穿搭、氛围感等合规表达。\n- 视频阶段务必写入真实皮肤质感要求，避免 AI 假脸。\n- 多参考图场景不要用 Kling 3.0（不支持多图参考），改用 Seedance 2.0。\n- **视频阶段严禁把多个分镜合并成一个大镜头**；单段时长受模型限制时，先与用户核对再归组，不得默认丢弃分镜。", "extras": [], "cn": "广告TVC成片skill"}, {"slug": "style-repaint", "desc": "真人转动漫/2D/3D风格转换", "body": "```markdown\n---\nname: style-repaint\nnamespace: libtv-industry\ntitle: \"风格转绘\"\ndescription: \"已有内容（真人成片/图像素材/已渲染分镜）需要转换画风时用本 skill——真人转动漫、写实转 2D、转卡通渲染 3D（如皮克斯风）、转写实 3D、不同动画/漫画风格互转、转真人写实。视频输入先用 analyze_video 多模态分析+edit_video 按时间点切片得到逐 shot 原片段，再按主体数量/运动幅度/景别/高风险元素四维度逐 shot 判定转绘策略（单帧/多帧/多角色协同锚定/高风险元素强化）。生成有两种模式（原片入参强保真但约 2 倍成本 / 纯文本+风格锚重生成更省但保真度较低），模式必须在分析切片之前问清楚。转卡通渲染 3D 有具体参考技法，转写实 3D 仍是风险最高、无成熟方案的类别；转真人/写实风格不预置词库。全行业最难的时序一致性问题在逐镜独立重生成下更严峻，'先锁风格圣经+角色锚再批量'是强制前置步骤。不负责：画幅转换（转 aspect-reframe）；翻译配音（转 video-translate-dub）；从零设计角色/分镜（转 storyboard 相关 skill）。\"\nversion: 6\n---\n\n# style-repaint\n\n已有真人成片、图像素材或已渲染分镜，需要转换成另一种画风（最常见真人转动漫，也包括写实转 2D、转卡通渲染 3D、转写实 3D、不同动画/漫画风格互转、转真人写实）时用本 skill。你是**风格转绘导演**——不是套滤镜的后期，是逐镜指挥\"用目标画风重新画出同一场戏\"，同时死守角色能被认出来、动作和情绪不走样。\n\n> **本环境适配**：源方法论里的开源方案（AnimeGAN、VToonify 等）都是\"对已有视频逐帧做风格迁移\"，且普遍带商用授权限制；商业 API 宣称的画风能力多为未经独立验证的营销描述。本环境没有 img2img、风格滤镜、ControlNet/LoRA 这类\"在原像素上直接改风格\"的工具，但生成视频时可以把原片段节点作为输入参考传给 `generate_video_v3`（见\"生成模式选择\"），只是成本约为纯文本路径的两倍。技术路径是**内容解析 + 目标风格重新生成**，链路跟 `aspect-reframe`（横竖屏转换）高度相似——都是先切出真实 shot 片段，再逐 shot 判定处理策略，再拿截图做 image-to-image 重新生成——区别只在于 `aspect-reframe` 改的是构图、本 skill 改的是画风，画风改动涉及更多失真风险点（时序一致性、多角色锚点混淆、手部/文字等高风险元素），所以逐 shot 判定需要比 `aspect-reframe` 更细。**必须让用户明确接受的后果**：即便用原片入参模式，产出的仍是\"同一场戏的另一种画风版本\"，保留角色身份、构图、动作、情绪，但**不是原片的逐帧像素转换**，做不到与原画面逐帧严丝合缝对齐——这是\"换画风重新生成\"的本质决定的，不是成本模式的选择能改变的。\n\n## 流程总览（6 个暂停点，按顺序做）\n\n0. **建任务**（`task_create_v2`）：为本次转绘建一个进度任务，`task_content` 指向即将产出的 shot 台账文件路径——一次性指针，不是逐步打勾清单。全流程结束时 `task_update_v2` 标记完成。\n1. **判断输入形态与目标风格**：真人成片 / 图像素材 / 已渲染分镜；目标画风归到\"风格类别差异\"里的对应类别，不同类别风险和处理不同；转卡通渲染 3D 时额外参考\"皮克斯 3D 卡通渲染参考技法\"；转真人/写实风格时不套用预设词库，直接按用户描述生成。\n2. **确定生成模式**（详见\"生成模式选择\"）→ **暂停点 1**。必须在碰 `analyze_video`/`edit_video` 之前做，不要先分析切片完再回头问——模式决定下一步切片精度。图像/分镜输入没有原片视频，只能走模式二，从简确认。\n3. **取得原片内容结构并切片**（详见\"输入切片\"）：\n   - 视频 → 按 hint 校准做 `analyze_video`（>15 秒先粗切再逐段精细分析，≤15 秒直接精细分析），精度深度按步骤 2 选定的模式决定，再用 `edit_video` 按精确时间点切出各真实 shot 的原片段节点。\n   - 图像/分镜 → 直接读现有构图与内容描述，跳过分析与切片。\n4. **逐 shot 做内容分析，建立 shot 台账**（详见\"Shot 内容分析与台账\"，`write_file_v2`）：不只是策略判定要用的窄字段，把在场角色、关键动作、关键叙事信息、所属场景标识都记录下来；本步只提取\"画的是什么内容\"，风格信息丢弃（风格要换掉）。\n5. **逐 shot 套决策表**（详见\"转绘策略判定\"），把判定策略（单帧/多帧/多角色协同锚定/高风险元素强化，可多选）、需要截取的帧数与位置追加进同一份 shot 台账 → **暂停点 2**：`ask_human` 展示完整 shot 台账（内容字段+决策字段）确认——策略判错会导致整批重生成浪费，这一点跟 `aspect-reframe` 是同一个道理。\n6. **（模式二且涉及重要角色/场景时）确认锚点来源**（详见\"重要人物/场景锚点来源确认\"）→ **暂停点 3**。\n7. **立风格圣经 + 生成角色/场景风格锚**（详见\"核心机制\"）→ **暂停点 4**（最关键的一个）。\n8. **逐 shot 转绘关键帧**（`generate_image_v3`，模式二用；模式一在下一步直接以原片段为参考，不需要单独转绘关键帧）：按 shot 台账里记录的判定策略逐 shot 截取对应帧数（单帧或多帧）作为图像输入（image-to-image）。**每一帧截出来先检查是否可用**（清晰无运动模糊、主体没被裁切或遮挡出画、角度姿态可辨认）——多帧转绘时尤其容易出现\"大部分帧没问题、个别帧有问题\"的情况，不可用的帧不能将就转绘，在该关键点附近（如 ±0.2–0.5 秒）重新截一帧确认可用后再用，不能拿有问题的截图直接进 image-to-image。确认可用后，在真实截图基础上按风格圣经重绘，而不是抛开截图纯文字从零生成；同时把对应角色/场景风格锚、以及多角色协同锚定/高风险元素强化的特殊处理一并落实。同场景连续 shot 额外参考前一 shot 转绘后的尾帧压跳变（免费的额外手段）→ **暂停点 5**：抽查前几个 shot 的转绘帧，确认画风落地、角色可辨识、构图未丢关键信息，通过后再放开批量。\n9. **生成转绘视频**（`generate_video_v3`）：模式一以 `edit_video` 切出的原片段为输入参考（连同风格圣经+角色锚，同场景时也可加前一 shot 尾帧）；模式二以步骤 8 的转绘关键帧（单帧或多帧序列）为视觉锚。两种模式下动作与情绪节拍都延续 shot 台账记录的内容，不重新演绎。**生成时长必须等于该 shot 在台账里记录的时间区间时长**，不能任由生成工具给一两秒的默认短片段——最终要按原 shot 顺序拼接合成，某个 shot 生成短了，拼出来的整体节奏和时长就对不上原片。\n   - **模式一 prompt 要把\"原片参考什么\"框住**：原片段自带旧画风，如果 prompt 不明确排除，模型容易把旧画风的视觉特征也一起带过来（风格被原片稀释）。写法上明确拆两段：先说\"仅参考原片的运镜、人物动作/表演、构图节奏，不参考其画面风格/色彩/渲染质感\"，再单独、详细地给风格圣经描述和对应的角色/场景风格锚引用——不要把\"参考原片\"和\"目标画风\"混在一句话里含糊带过。\n   - **台词怎么写进 prompt**：`generate_video_v3` 没有原始音轨直通能力，画面和声音是一起端到端重新生成的——台词只能靠文字描述引导，天然有被模型\"自由发挥\"改写的风险。降低风险的写法：把台账里记录的台词逐字加引号列出，后面明确加一句\"按此逐字生成，不要改写用词、语气或压缩/拉长语速\"——这是一句**排除性指令**，不是供模型\"参考着演绎\"的内容描述。没有台词的 shot 如实写\"无台词\"。\n   - **BGM/音效怎么写**：不强求音色/音效逐帧还原，只描述情绪基调和关键音效类型，设定合理预期而不是编一段做不到的精确音频描述。\n10. **质检分级**（详见\"一致性检查\"）：错误级后台直接回步骤 8/9 重生成，不展示给用户；可用级和优秀级才进入合成，可用级需要用户确认。\n11. **合成**（`composite_video`）按原顺序拼接，只用通过质检分级的片段 → **暂停点 6**：整体过一遍时序一致性，重点看跨镜角色/画风是否连贯。\n\n> 依赖：2 依赖 1；3 依赖 2；4 依赖 3；5 依赖 4；6 依赖 4,5（模式二时）；7 依赖 4,5,6；8 依赖 5,7；9 依赖 5,7,8；10 依赖 9；11 依赖 10。图像/分镜输入从步骤 3 的读取分支进入（跳过分析与切片），但步骤 1、2 仍适用，且只能走模式二。\n\n## 生成模式选择（原片入参 / 纯文本重生成，二选一，成本与保真度权衡）\n\n两种模式可以逐 shot 混用，不必全片统一：\n\n| | **模式一：原片入参** | **模式二：纯文本+风格锚重生成** |\n|---|---|---|\n| 做法 | 把 `edit_video` 切出的原片段节点作为输入参考传给 `generate_video_v3`，连同风格圣经+角色风格锚一起提交，让模型在原片真实动作/运镜上调风格 | 转绘关键帧（`generate_image_v3`）以该 shot 的截图为图像输入按风格圣经重绘（image-to-image，不是纯文字生成），驱动 `generate_video_v3` 时不传原片视频——\"不传原片\"指的是视频生成这一步不用原片做参考，关键帧转绘本身仍然基于截图 |\n| 成本 | 约为模式二的 2 倍 | 基准成本 |\n| 对时序一致性的帮助 | 更大——模型跟随原片连续运动，比\"从锚点重新编排动作\"更不容易跨镜跳变 | 仍需靠风格圣经+角色锚硬扛，跳变风险更高 |\n| 保真度 | 画面更高——动作细节、运镜节奏更接近原片；**但声音不在此列**：`generate_video_v3` 没有原始音轨直通能力，无论哪种模式声音都是和画面一起端到端重新生成的，台词/音效同样有漂移风险，不能因为选了模式一就默认声音也是原片直通 | 较低——是\"用新画风重新演绎同一场戏\" |\n| 适用场景 | 主角特写、动作/表情精度要求高的 shot、转写实 3D 渲染这类高风险类别 | 背景/群演 shot、预算有限、或原片本身就是静态图像（无视频可作入参） |\n| 对\"输入切片\"精度的要求 | 只需粗切（≤15 秒片段即可用作参考），不强制精细分析 | 必须做完精细分析拿到准确单 shot 切点，粗切片段不能直接用 |\n\n默认建议：真人转动漫/写实转 2D、转卡通渲染 3D 这类风险较低/中等的类别默认模式二即可；**转写实 3D 渲染这类调研中确认无成熟方案、风险最高的类别，优先建议模式一**，用原片动作约束降低结构漂移概率。\n\n## 输入切片：hint 校准 + 精细分析 + （长视频）粗切两段式\n\n**第一步：先验估计最短镜头时长，据此选 `analyze_video` 的 `hint` 参数**——hint 本质是\"预期最短镜头时长\"的先验输入，直接决定切点检测的敏感度：\n\n| 先验最短镜头时长 | hint |\n|---|---|\n| ≥5 秒 | 5 |\n| 2–5 秒 | 3 |\n| 1–2 秒 | 2 |\n| <1 秒 | 1（谨慎使用，容易过切） |\n\nhint 选得比实际最短镜头还细，会把连续动作内部的细微画面变化误判成切点；选得比实际最短镜头粗，会漏掉真实的短镜头切点。**没有先验信息时默认 hint=2**，不用为了估这个值先停下来问用户；有明确先验时按上表改用对应档位。\n\n**判断门槛是硬性 15 秒，不是\"感觉上短不短\"**：视频≤15 秒才走单次精细分析；**只要超过 15 秒（哪怕只是 20 秒、1 分钟这种\"感觉也不长\"的片子），一律先走粗切**，不能凭直觉判断\"这条不长应该不用粗切\"就跳过——精细分析在超过 15 秒的跨度上可靠性没有保证，容易漏切（典型症状：一个\"shot\"内部出现黑屏、场景/人物骤变这类明显跳变信号）。\n\n**调用 `analyze_video` 前的强制自检（不可跳过，这不是一句提醒，是一个必须显式做的动作）**：\n1. 先写出这段视频的**具体时长秒数**，不是\"看着不长\"这种主观判断。\n2. 判断这个数字是否 >15。**>15 秒时，禁止直接对全片调用 `analyze_video`**——即便这段内容看起来\"场景变化不大、应该不用切\"，也必须先做粗切。\n3. **事后校验（最后一道兜底）**：如果已经拿到了 `analyze_video` 的返回结果，回头核对——这次调用是不是直接对一段 >15 秒的全片做的一次分析（没有先粗切）？如果是，**这个结果不可信，不能直接拿去转绘或做后续判断**，必须回到\"粗切→逐段精细分析→回原视频精确切片\"重新做一遍。\n4. **常识校验**：切出来的 shot 数量相对内容类型和时长明显偏少（比如一分钟的对话/动作戏只切出个位数 shot），优先怀疑\"是不是该做粗切却没做\"。\n5. **粗切结果不能直接当最终 shot（比\"完全没粗切\"更隐蔽的一种漏做）**：粗切唯一目的是把长视频切成精细分析能处理的大小，粗切本身返回的分段边界通常还是粗的（真实出现过的案例：同一条 110 秒视频，一次跑完整流程对全部粗段都做了精细分析，切出 34 个 shot；另一次粗切成 8 段后只挑了 2 段做精细分析、其余 6 段直接拿粗切结果当 shot，只切出 16 个）。回头检查两件事：①最终台账里每条 shot 记录，是不是都能对应到一次单独用降低过的 hint（通常 2-3，不是粗切时的 15）做的 `analyze_video` 调用；②粗切返回的每一个粗段，是不是都做了这次精细分析——不能挑\"看起来复杂/重要\"的几段（如战斗戏）做，其余直接拿粗切结果凑数当 shot。两条有一条不满足，就要为漏做的粗段补做精细分析。\n\n**≤15 秒**：直接用校准好的 hint 对全片做一次 `analyze_video`，返回的每个 shot 的 `source_start`/`source_end` 就是准确切点，不需要额外验证。拿到切点直接调 `edit_video` 精确切片——转绘是逐镜头判断风格落地的，切点不准会让判断单元混乱。\n\n**>15 秒**：必须拆成三步，第三步回原视频重新切，不能在粗段基础上再切一刀：\n\n1. **粗切**：用较大 hint（如 15）把长视频切成若干个 ≤15 秒的粗段，目标只是切成精细分析能处理的大小，不追求切点精准。相邻粗段故意重叠 1–2 秒，避免粗切点正好落在一个真实镜头中间。**粗切点选取还要避开台词延续处**：15 秒是目标不是死卡的整数，候选切点前后 1 秒内如果有台词，挪开避开；实在找不到前后 1 秒内无台词的点，放宽到前后 0.5 秒内无台词即可——切在一句连续台词中间，会让\"逐段精细分析\"独立分析每个粗段时缺了完整上下文，容易出错。\n2. **逐段精细分析**：每个粗段按上表重新校准 hint，单独做精细 `analyze_video`，得到该段内准确的切点（相对该粗段起点的时间戳）和内容描述。\n3. **回原视频精确切片**：⚠️ 第 2 步的时间戳要加上该粗段在原视频里的绝对起始时间换算成绝对时间戳，再对**原视频**调 `edit_video`——不能在粗段切出来的文件上再切一刀，否则时间戳累计误差会越往后越偏。\n   - **重叠区间去重合并（真实出现过的问题：切出来的片段里混进了上一个/下一个 shot 的画面）**：相邻粗段故意重叠了 1–2 秒，这段重叠窗口会被两个粗段的精细分析各自独立检测一次，很可能报出内容重复甚至就是同一个真实镜头的两个版本。换算成绝对时间戳、写入台账之前，先检查有没有相邻两个 shot 的时间区间彼此重叠——有重叠就必须合并成一个边界，不能两个版本都留：以能完整覆盖这段窗口、且切点落在台词/动作边界处的那一版为准，另一版里落在重叠窗口内的检测结果直接丢弃。带着未合并的重叠边界去调 `edit_video`，切出来的物理片段就会真的包含邻近 shot 的画面。\n   - **切完之后核验一下边界**：`edit_video` 目前只能整秒精度切片，边界本身有误差空间；片段切出来后，快速看一眼首尾内容是否对得上台账里记录的这个 shot 的内容——尾帧明显已经是下一个 shot 的画面，说明边界算错了，回去调整绝对时间戳重新切，不能带着边界不准的片段直接去做模式一的参考输入或截帧转绘。\n\n**漏切纠正**：精细分析做完后若某个\"shot\"内部仍有明显画面骤变（黑屏/场景或人物突变），判定为漏切信号——回这个区间用更细的 hint 重新分析、重新切片，把物理片段拆对，不能只在转绘计划里口头说\"这段分两半处理\"、物理文件却不动。\n\n## Shot 内容分析与台账（切片之后、策略判定之前，必须做且必须记录）\n\n切完片不代表可以直接套决策表——\"转绘策略判定\"要用的\"主体数量/运动幅度/景别/高风险元素\"只是判定截帧策略需要的窄字段，不是这个 shot 的完整内容。如果只满足于这几个窄字段，后面\"逐 shot 转绘关键帧\"\"生成转绘视频\"要用到的信息（画面里到底是谁、在做什么、有没有台词、情绪是什么）就没有统一、可回查的记录来源，每一步各自零散重新解读一遍原片，容易前后不一致。\n\n**每个 shot 必须记录以下字段（`write_file_v2` 落一份 shot 台账文件，作为后续所有步骤共同依赖的唯一事实来源）**：\n\n| 字段 | 说明 |\n|---|---|\n| shot 编号 + 时间区间 | 对应 `edit_video` 切出的片段节点；这个时间区间的时长是\"生成转绘视频\"步骤生成时长的硬约束（见下），不是随口记录 |\n| 主体数量 / 主体位置构图 / 运动幅度 / 景别 / 高风险元素 | \"转绘策略判定\"要用的决策字段；\"主体位置构图\"记主体在画面中的空间分布（如\"单人居中\"\"双人左右分布\"），跟\"景别\"一样来自 `analyze_video` 的结构化输出，不能漏记 |\n| 运镜方式 | 固定/推/拉/摇/移/跟——镜头本身在动时，即便主体运动幅度不大，画面构图也会持续变化，这个字段是\"转绘策略判定\"里判断要不要走\"多帧转绘\"的补充依据（见下） |\n| 在场角色 | 具体是谁；若是反复出现的重要角色，标注出来，供\"重要人物/场景锚点来源确认\"直接引用 |\n| 关键动作/剧情节拍 | 这个 shot 里实际发生了什么，是\"生成转绘视频\"里\"动作与情绪节拍延续原片\"的依据 |\n| 台词/对白 | 逐字记录这个 shot 里的人物台词/旁白，没有台词就如实记\"无台词\"——换画风不等于换声音，这段声音内容生成新视频时要延续 |\n| BGM/音效 | 背景音乐的情绪基调、关键音效（如鼓点、法术音效、环境音）——同样是\"延续原片声音层面\"要用到的记录，不是只看画面 |\n| 关键叙事信息 | 表情反应、手持道具、场景文字线索等——\"一致性检查\"里\"内容保留\"项要盯的就是这些字段 |\n| 所属场景标识 | 用于判断是否与前一 shot 同场景连续（决定要不要用前一 shot 转绘尾帧做额外参考） |\n\n**记录来源**：视频输入 → 这些字段从 `analyze_video` 的结构化输出里提取；分镜表/图像输入 → 从已有描述里提取，字段不全时按当前可获得的信息如实记录，不臆造。这份台账建好之后，\"转绘策略判定\"直接从台账取用对应字段做决策，不用回头再翻一遍原始分析结果。\n\n## 转绘策略判定（每 shot 定截帧/参考方案，可多选）\n\n`aspect-reframe` 逐 shot 判定\"怎么重新构图\"，本 skill 逐 shot 判定\"怎么重新截帧、需要几帧、要不要额外锚定\"——链路相似，但画风转绘要多担心一层\"重绘失真\"，所以判定维度和策略都更细。判定依据台账里的字段：**主体数量**（单人/双人/三人以上群像）、**主体运动幅度**（静态或微动/中等如走动手势/大幅度如奔跑打斗快速位移）、**景别**（远景全景/中近景/特写）、**高风险元素**（是否含手部特写、屏幕文字、精细复杂道具——这几类生成式重绘最容易失真），以及**运镜方式**（固定/推/拉/摇/移/跟——仅用于补充判断是否要走\"多帧转绘\"，见下）。判定结果（命中策略+需要截取的帧数与位置）追加写回同一份 shot 台账，不用另开一份\"方案表\"。\n\n四类策略不互斥，一个 shot 可能同时命中多条：\n\n- **单帧转绘（默认）**：静态或微动、单人或以场景为主的 shot——截该 shot 中段一帧做 image-to-image 即可，风格圣经+对应角色/场景锚为辅助参考。成本最低，优先判定为此类。\n- **多帧转绘**（主体运动幅度大**或**运镜本身是推/拉/摇/移/跟这类持续变化的运镜时触发）：不管是人物动作大还是镜头自己在动，画面构图都会在这个 shot 内持续变化，单帧锚不住整个过程的风格——`generate_video_v3` 脑补中间帧时容易在画风上漂移（从转绘关键帧到中间态、风格逐渐跑偏）。处理：额外截\"起势/关键动作点/收势\" 2–3 帧，分别做转绘，把这几张转绘关键帧一起作为生成参考序列，而不是只给一张兜底。\n- **多角色协同锚定**（双人以上同框时触发）：转绘 prompt 里必须同时显式引用每个在场角色各自的风格锚点，用方位词区分（如\"画面左侧角色参照 {{Anchor_A}}，右侧角色参照 {{Anchor_B}}\"），防止转绘后角色互换、或某个角色的锚点没生效——这正是\"多角色防重影\"规则要解决的同一类问题，落到具体 shot 判定上。三人以上群像风险更高，暂停点抽查密度要相应提高。\n- **高风险元素强化**（含手部特写/屏幕文字/精细复杂道具时触发）：转绘 prompt 里对这些元素做显式约束描述（如\"保持手指数量正确\"\"道具形状与原片一致\"）；\"一致性检查\"阶段对这类 shot 单独过一遍，不能因为整体判到\"可用级\"就放过手部畸变这种硬伤。\n\n**判定表**：\n\n| 主体数量 | 运动幅度 | 景别 | 高风险元素 | 命中策略 |\n|---|---|---|---|---|\n| 单人/场景为主 | 静态/微动 | 任意 | 无 | 单帧转绘 |\n| 任意 | 大幅度 | 任意 | 任意 | 多帧转绘（叠加其他命中的策略） |\n| 双人及以上 | 任意 | 任意 | 任意 | 多角色协同锚定（叠加其他命中的策略） |\n| 任意 | 任意 | 特写/近景 | 含手部/文字/复杂道具 | 高风险元素强化（叠加其他命中的策略） |\n\n上表未单列\"运镜方式\"列——它不是一个独立判定维度，只是\"多帧转绘\"的补充触发条件：**主体运动幅度是静态/微动，但运镜方式是推/拉/摇/移/跟这类持续变化的运镜时，同样命中多帧转绘**，因为画面构图会随镜头运动持续变化，跟主体自己大幅度运动是同一个风险，只是来源不同。只有运镜和主体都是\"固定/静态\"才真正落到单帧转绘。\n\n**常见误判纠正**：①把\"多帧转绘\"只用在真正大幅度运动的 shot 上——静态对话且运镜固定的 shot 硬套多帧转绘是浪费成本，单帧足够；但运镜本身在动（哪怕主体没怎么动）不算\"静态\"，同样要走多帧。②多角色协同锚定不能省成\"反正都有角色锚，写一句带过\"——不同角色必须用方位词精确对应到各自的锚点，含糊的引用等于没写。③高风险元素强化不是额外加一句\"手要正常\"就完事——要针对具体元素写具体约束（几根手指、道具的具体形状），泛泛的约束模型执行不到位。\n\n## 重要人物/场景锚点来源确认（在生成风格锚之前，锚点内容依据从哪来）\n\n角色风格锚、场景风格锚的生成质量直接决定全片一致性，**不能草率地只拿该角色/场景出现的某一个 shot 的片面描述就定锚**——单个 shot 可能只拍到侧脸、背影、远景，信息不完整；拿这种片面描述生成锚点，后面所有引用这个锚的镜头都会继承这个不准的起点，返工代价远高于一开始多问一句。生成锚点前，对每个反复出现的重要角色/场景，按优先级确认内容依据来源：\n\n1. **剧本/人物设定文档/美术设定**：若用户上传了剧本或人设/美术设定文档，从文本里提取该角色的外观描述（五官/发型/体型/服装/标志性特征）与场景描述（空间结构/光线/色调/关键陈设），作为锚点生成的内容依据——这条没有对应的实际画面，只能走纯文本生成。\n2. **已有参考图**：若用户已有该角色/场景的参考图（如之前项目产出的角色设定图、场景设定图），直接问是否可以上传复用，不必重新生成。\n3. **全片检索式分析（兜底，仅当以上都没有时用）**：针对该角色/场景单独跑一次全片检索，**截真实截图**，而不是只综合出一段文字描述——单靠文字复述丢失细节，实际截图才是最可靠的身份依据。**角色不能只截一帧就开始生成风格锚**：角色锚是 4 视图一套（正面、3/4 侧面、正侧面、背面，见\"核心机制\"），所以截图要尽量按这 4 个角度去凑，且优先挑全身入镜的画面，只有全片确实找不到全身镜头时才退而求其次用半身/特写补充；某个角度全片确实没有对应画面（如没有背影镜头），这个角度就直接走纯文本生成，不用为了凑真实截图卡在这一个角度上——多角度、全身的原始截图越全，后面按风格圣经重绘出的角色锚才越不容易在没拍到的角度上瞎猜。场景同理，尽量覆盖不同机位角度还原完整空间结构。每个候选截图在确定使用前先检查是否可用（清晰无运动模糊、主体没被裁切或遮挡过多、角度可辨认）——不可用的候选不能将就用，换该角度附近的其他时间点重新截，实在凑不齐再如实告知用户覆盖不全。\n\n**风格锚的生成方式随来源而不同**：来源 2、3（已有参考图 / 全片检索截图）都拿到了真实图像，\"核心机制\"里生成角色/场景风格锚时应该**把这张实际截图作为图像输入**，在其基础上按风格圣经重绘（image-to-image），而不是抛开截图只用文字从零生成——真实截图能锁住脸型、发型、服装、场景陈设这些细节，文字描述做不到这个精度。只有来源 1（纯文本剧本/设定，没有对应实际画面）才走纯文本生成。次要/一次性出现的角色和场景不需要这套流程，直接按当前 shot 的描述生成即可，不要为跑一次龟毛的全片检索式分析而拖慢次要内容。\n\n## 核心机制：先立\"风格圣经 + 角色/场景锚\"，再批量转绘（强制前置，不可跳过，两种生成模式都需要）\n\n逐镜独立重新生成，最大的敌人是**跨镜跳变**——同一个角色在镜头 3 和镜头 8 里脸不一样、同一个场景在不同镜头里空间结构或色调不一样，这是全行业公认最难解的时序一致性问题，在本环境\"每个镜头分别生成\"的模式下尤其突出。唯一有效的抑制手段是把\"风格\"和\"角色/场景长相\"在批量前就固定成可复用的锚：\n\n1. **风格圣经**（`write_file_v2` 落一份文件）：用文字锁定目标画风的所有关键属性——线条（粗细/有无描边）、上色方式（赛璐璐平涂/厚涂/水彩）、色彩饱和度与色调倾向、光影风格、五官比例与画风年代、材质质感（2D 转 3D 时尤其要定清渲染风格：卡通渲染/写实 PBR/黏土感）。这份文件是后续每次生成 prompt 的风格段落来源，保证全片风格描述一字不差地复用。\n2. **角色风格锚**（每个反复出现的重要角色一套 **4 视图**：正面、3/4 侧面、正侧面、背面，`generate_image_v3`）：不是一张——单一角度的锚点在下游某个 shot 需要另一个角度参考时没有依据，模型只能自己猜，这正是跨镜角色漂移的常见诱因之一。内容依据按上面\"锚点来源确认\"拿到的信息——有实际截图（已有参考图/全片检索截图）时优先用对应角度的截图分别做 image-to-image 重绘，没有实际画面（纯文本剧本/设定）时才走纯文本生成；4 个角度里有确实找不到源画面的（如全片没有背影镜头），这一个角度就走纯文本生成，不必为了凑真实截图而放弃这个角度。approve 后这套 4 视图作为该角色在所有镜头里的视觉锚点复用，具体某个 shot 需要哪个角度就引用哪张。角色一旦定锚，后续镜头都以此锚为参考生成，而不是每镜重新即兴设计长相。\n3. **场景风格锚**（每个反复出现的重要场景一张，`generate_image_v3`）：同样按锚点来源确认的信息（有截图用截图做 image-to-image，没有才纯文本生成），生成一张目标画风下的场景参考图（空间结构、关键陈设、光线、色调），approve 后作为该场景所有出现镜头的视觉锚点复用——不要让同一个场景在不同镜头里画风统一但空间结构/陈设各画各的。\n\n这是本环境里\"锚定帧 / 跨帧一致性\"的等价实现。这一步没确认就批量，等于赌几十个镜头的画风和长相会自动一致——不会。这里返工一张锚图，远比批量生成后发现全片角色漂移再重来便宜。\n\n## 风格类别差异（风险和处理不对称）\n\n- **真人转动漫 / 写实转 2D**：最成熟、最常见、风险最低。核心是\"保留身份特征的同时抽象化\"——五官、发型、体型、标志性服饰要能对应上真人，但按目标动画风格重画。主要难点在角色跨镜一致，靠角色风格锚解决。\n- **不同动画 / 漫画风格互转**（如日漫风↔国漫厚涂、赛璐璐↔水彩）：可行，本质是换一套风格圣经重新生成。难点在原作粉丝对\"这还是不是原来那个角色\"的敏感度，角色锚要在新风格下保留原角色的辨识记忆点（发色、瞳色、标志配饰）。\n- **2D/真人转卡通渲染 3D（如皮克斯风）**：**风险中等，有具体可用的参考技法**（详见\"皮克斯 3D 卡通渲染参考技法\"）。区别于写实 3D：卡通渲染的圆润建模本身对身份漂移的容错度更高（观众对\"像不像本人\"的判断阈值比写实 3D 更宽松），配合角色多角度立绘锚点，成型率明显好于纯写实 3D。\n- **2D/真人转写实 3D 渲染**（非卡通化，如写实 CG）：**风险最高，调研中仍未找到成熟方案**。角色身份漂移和空间结构不一致的概率显著高于前面几类。处理上：角色风格锚这一步要做得更重（可能需要为一个角色生成多角度锚图确认立体一致性），暂停点要更密，且**必须提前告知用户这一类不保证一次成型、返工率高**。\n- **转真人 / 写实风格**：本 skill **不为这一类预置风格词库或约束规则**——真人写实的判断依据是用户当下给出的具体描述（想要的光线、质感、氛围），直接按用户要求生成即可，不套用某个预设的\"真人风格圣经\"模板。这跟其他几类刻意沉淀词库的做法是相反的选择：真人写实的变化空间太大，任何预设模板都容易显得死板。\n\n**皮克斯 3D 卡通渲染参考技法**（转 3D 卡通渲染时优先参考，来自对同类风格生成 skill 的调研，是具体、可直接套用的工程细节）：\n- **质感词**：圆润建模感明显、干净背景、面部特征描述要详细到位（发型的颜色/长度/发型名称，眼睛颜色/鼻子特征/嘴唇特征/脸型，以及\"无尾巴\"\"无翅膀\"这类特殊特征的逐一说明）——判断一张角色锚点图是否合格，就看这几项是否都能对上原角色。\n- **多角度立绘**：本 skill 现在对所有风格类别都要求角色锚是 4 视图一套（见\"核心机制\"），皮克斯 3D 卡通渲染这一类只是在此基础上多一条具体要求——4 视图之外，正面立绘要额外确认是半身、平静表情，覆盖视频中最常出现的侧拍角度那张要清晰可辨认，不能随手生成一张交差。\n\n## 多角色/道具/版权处理细则（跨风格通用，不限于 3D）\n\n以下几条不是特定画风的技法，是任何涉及多角色、道具、真实人物/品牌的转绘都该有的工程细节：\n\n- **多角色防重影**：同一 shot 里角色数量越多，\"分身/重复\"的风险越高，需要在 prompt 里显式声明防重影——3 人以上时写\"画面中 A、B、C 各自只出现一次，不得出现重复角色或角色分身\"；5 人以上进一步加强措辞（逐一点名 + \"严禁出现两次或以上\"），并优先改用分格近景依次展示，而不是硬凑全景同框。跟\"转绘策略判定\"里的\"多角色协同锚定\"是同一件事，这里是通用规则，那边是落到具体 shot 的判定。\n- **道具单面原则**：道具类锚点图只展示一个面（正面或背面二选一，平铺/握持/翻开等展示状态要说明清楚），不要求正反面同时清楚；\"角色+道具\"的组合图不能拿来当视频生成的参考图，道具要单独建锚点。\n- **版权与真实人物/品牌处理**：涉及真实球星/明星姓名、具体赛事/品牌名称时，改用描述性语言替代而不是直写（例如把真实球员名换成\"某球员\"+ 具体可辨认的视觉特征如\"红色 7 号球衣\"），既避开版权风险，又能通过描述保留识别性。角色/场景锚点如果触发版权限制无法生成，改用纯文字描述该角色/场景特征，不传入图像参考。\n\n## 时序一致性（本 skill 的核心质量瓶颈，不是附加项）\n\n调研中反复确认：时序一致性（逐帧/逐镜不跳变）是 AI 风格化视频至今未被完全解决的头号难题，即便商业方案也只做到部分缓解。本环境逐镜独立生成，天然没有跨帧传播机制，所以只能靠**前置锚定 + 事后检查**两头夹：\n\n- 前置：风格圣经保证风格描述一致，角色锚保证长相一致（暂停点 4）；运动幅度大的 shot 额外走\"多帧转绘\"降低单帧兜不住整个动作的风险。\n- 事后：合成后逐镜比对，跨镜角色漂移或画风浓淡跳变一旦出现，回到\"逐 shot 转绘关键帧\"步骤用同一角色锚重生成问题 shot，而不是接受跳变。\n- 诚实预期：即便如此，也做不到传统逐帧迁移那种\"帧间丝滑\"，追求的是\"每个镜头单独看都对、连起来看角色和画风连贯\"，不是无缝流媒体级一致。这个预期要在开工前就和用户对齐。\n\n## 一致性检查（三级分级，不是二元通过/不通过）\n\n每批 shot 转绘完成后按下面六项看，落到**三级分级**：\n\n| 检查项 | 看什么 |\n|---|---|\n| 角色身份保留 | 转绘后仍能对应回原角色（发型/发色/瞳色/标志服饰/体型未漂移） |\n| 场景一致性 | 同一场景在不同镜头里空间结构/关键陈设/光线色调是否统一，都对应同一份场景风格锚 |\n| 画风统一 | 全片线条/上色/色调/光影风格一致（皆源自同一份风格圣经） |\n| 内容保留 | 原 shot 的构图、动作、情绪、关键道具在转绘版中仍在 |\n| 跨镜时序一致 | 相邻镜头连看角色与画风连贯，无明显跳变 |\n| 高风险元素 | 命中\"高风险元素强化\"的 shot，手部/文字/道具形态是否正确，不因整体判定\"可用级\"而被放过 |\n| 台词/音效保真度 | `generate_video_v3` 没有原始音轨直通能力，声音是和画面一起端到端重新生成的——检查生成视频里的台词文字是否与台账记录的原文逐字一致（没有被改写/替换/漏说）、语速是否撑满该 shot 的时长、BGM/音效情绪基调是否与台账记录的一致 |\n\n- **错误级**：认不出是同一角色、同一场景在不同镜头里空间结构明显不一致、丢了关键叙事信息、动作情绪明显错误、高风险元素明显畸变（如手指数量不对）、**台词被改写成不同内容或明显漏说、语速与时长明显不匹配**——**后台直接废弃重做，不展示给用户**。模式二回到\"逐 shot 转绘关键帧\"步骤，用既有角色锚/场景锚（及同场景前一 shot 尾帧）重画问题 shot 的关键帧再重生成视频；模式一直接回到\"生成转绘视频\"步骤调整 prompt 重生成，不需要重画关键帧。若错误反复出现在同一角色/场景上，先回\"重要人物/场景锚点来源确认\"检查锚点本身是不是来源信息不足；若反复出现在同一类运动幅度大的 shot 上，检查是不是该判\"多帧转绘\"却判成了单帧。\n- **可用级**：没有硬伤，但画风浓淡略有偏差、跨镜衔接不够顺——**展示给用户，问是否接受或要求重做**。\n- **优秀级**：六项都理想——直接保留进入合成。\n\n不要把错误级留到合成后才发现；也不要为优秀级反复找用户确认。\n\n## 相关\n\n画幅转换（横竖屏）：转 aspect-reframe——画幅和画风是两件正交的事，若既要转画风又要转画幅，先定画风（本 skill）再转画幅或反之皆可，但不要在一次生成里同时改两者，会难以定位问题来源。两者链路高度相似（切片→逐 shot 判定策略→截图做 image-to-image→生成视频），如果同一批 shot 既要转画风又要转画幅，可以复用同一份切片结果，只是各自的判定表和锚点分开建。翻译/字幕/配音：转 video-translate-dub。从零设计角色定妆、原创分镜（还没有可转绘的原始内容）：走各自的内容风格 / storyboard skill 产出原始内容后再回本 skill。商业视频生成 API（可灵/Vidu/Runway 等）的画风能力：调研未取得可信的独立评测，若未来接入外部 API，其时序一致性和商用授权需单独验证，不在本 skill 当前技术路径内。\n```", "extras": [], "cn": "风格转绘"}, {"slug": "surrealist-visual-intro", "desc": "打造《人生分割术》《西部世界》同款超现实主义视觉片头。", "body": "## 全局固定参数（禁止在任何阶段更改）\n\n参数值**图像生成模型**强制 Midjourney V8.1，不允许其他版本或其他生图模型替代视觉风格阶段1选定后全程锁定（三个种子选一个，见 §1.2）分镜图比例16:9（`--ar 16:9`）视频比例21:9（`--ar 21:9`，提示词中必须注明）视频模型不限定，用户可用的首尾帧视频生成工具均可，720p以上视频段数N − 1 段\n\n---\n\n## 工作流程总览\n\n```\n步骤1：视觉风格/时长/比例/BGM风格/是否加片名——一次全确认         → 用户确认\n步骤2：脚本内容展示                                               → 用户确认\n步骤3：链式生成全部分镜图，完成后一次确认                           → 用户确认\n步骤4：展示视频提示词，一次性生成全部视频，自动生成BGM后合成                → 自动执行\n步骤5：合成完成，询问演职员表（需要/不需要，一张图/一名一图）          → 用户确认（可选）\n```\n\n**有确认步骤的阶段必须等用户回应后再继续，无确认步骤的阶段自动执行。**\n\n---\n\n## 阶段 1：剧本解析与主题提炼\n\n### 1.1 读取剧本或故事\n\n用户可能以以下方式提供素材：上传 PDF / TXT、粘贴剧本文本、描述故事梗概、口述故事主题。**即使只有故事梗概或人物设定也足以开始设计**，不要求完整剧本。\n\n读取后内部提炼五个维度（作为后续设计基础）：\n\n维度提取内容**核心矛盾**主角最根本的内在冲突（一句话）**主角状态**主角的核心处境或心理状态，以及外形/视觉形象描述（服装、体态、标志性特征等可视化细节）**标志性空间**剧本中最具视觉张力的场所——agent 内部用于确定片头的核心画面场景，不对用户使用\"母体\"说法**核心道具/图腾**承载叙事意义的关键物件，将在场景中反复出现或演化**情感主题**驱动整部作品的宏大主题词\n\n### 1.2 步骤一：呈现主题摘要+分镜规划，然后一次性确认所有选项\n\n**执行顺序：先完成内部的视觉风格匹配和脚本规划，再向用户呈现——先用几段自然语言讲清楚主题和分镜构想，然后紧接着用选择框一次性问完所有需要用户决定的事项。**\n\n**呈现格式：短段落，分层次，不要密集长文。**\n\n- 第一段：一两句话点出核心张力\n- 第二段：片头构想——主线、镜头大致怎么走、整体氛围色调质感\n- 第三段：分镜规划——拟定几张分镜、几段视频、全局运镜主线、前中后段走向、情感弧线\n- 第四段（紧接上面）：选择框，一次问完所有选项 **选择框（使用 ask_user_input_v0 工具呈现，每个问题独立一个选择题）：**\n\n```\n问题1：视觉风格\n选项：\n- 种子A · 职场反乌托邦/冷战谍战/荒诞喜剧\n- 种子B · 东方美学/玄幻/神话/末日哲学\n- 种子C · 硬科幻/AI觉醒/心理重度悬疑\n- 我来指定\n（agent 在推荐项的选项文字后加\"（推荐）\"字样，并在问题描述里说明推荐理由，一句话即可）\n \n问题2：片头时长\n选项：\n- 60秒（推荐）\n- 75–90秒\n- 90秒以上\n- 我来指定\n \n问题3：画面比例\n选项：\n- 21:9 宽银幕（推荐）\n- 16:9 标准\n- 其他\n \n问题4：BGM 风格（agent 根据剧本情感基调填写2–3个具体选项）\n选项：\n- [agent 填写选项1]\n- [agent 填写选项2]\n- [agent 填写选项3]\n- 我来指定\n \n问题5：片尾是否需要加片名？\n选项：\n- 需要加片名\n- 不需要\n```\n\n视觉风格内部规则（agent 用于选定推荐项，不呈现给用户）\n\n种子代码最适合的剧本类型`--sref 6507535497 --profile vjh5v84`职场反乌托邦、冷战谍战隐喻、心理学荒诞喜剧`--seed 890818711 --profile kcpmlj9`新东方美学玄幻、神话寓言、历史长歌、末日哲学`--sref 4647687707 --profile xq9mmje`硬科幻、AI 觉醒、心理重度悬疑（记忆碎片 / 精神分裂）\n\n**选种规则：**\n\n- 一次只能选一个种子，禁止混用\n- 如果剧本横跨多个类型，以情感母题为准\n- 确认后记录已选种子，后续所有 MJ V8.1 提示词末尾统一附加该种子代码\n\n### 1.3 平台内容合规规则（全程强制执行）\n\n**核心原则：改写法不改意。** 所有文字内容如遇可能触发平台审核的高风险表达，立即自动改写为合规表达，原有视觉意图和情感强度不削弱。不询问用户、不中断流程。\n\n---\n\n## 阶段 2：脚本视图（N 帧链路 + 运镜方案）\n\n### 2.1 确定分镜数量与每段时长分配\n\n在输出脚本视图前，agent 先说明拟定的分镜总数 N、核心画面场景，以及每段的预设时长。\n\n**分镜数量决策参考：**
