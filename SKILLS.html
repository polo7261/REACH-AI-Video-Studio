黑客 UI、赛博街头、义体、现代装甲、电子屏幕雨。 加入：巨型星球、远古遗迹、旧电影海报、手绘质感、英雄剪影、深空星云。\nNASA 纪录片漂移\n删除：真实航天摄影、真实火箭发射、太空站纪录片、高清摄影感。 加入：夸张星球比例、手绘海报感、复古印刷纹理、浪漫太空歌剧色彩。", "extras": [], "cn": "复古太空歌剧插画风格导演"}, {"slug": "gameplay-pv-builder", "desc": "自制多类游戏PV，UI 像素锚定不形变，打造3A级游戏效果", "body": "name: game-promo-video\\\\\n\nnamespace: industrytitle: \"游戏宣传 Demo 视频\"description: \"游戏宣传 Demo 视频设计师——含两种玩法：① 三段式实机演示（Video A 引导流/Video B 剧情流/Video C 战斗流，各 15 秒共 45s），角色原画→四视图→3D 形象卡资产链、UI 像素锚定禁形变区、色彩 LUT 三段一致；② 开放世界都市类 gameplay 短片（角色原型库+场景模板、双路径原型/用户照片、快节奏事件 4-Cut 公式与单镜生活切片、5 类专有视角、卡点式剪辑节奏）。用 generate_image_v3 + generate_video_v3 + composite_video。\"version: 3\n\ngame-promo-video\n\n做原创/用户自有游戏的宣传 Demo / 实机演示 / 开放世界类 gameplay 短片时用本 skill。含两种玩法，按用户需求二选一：\n\n玩法一·三段式实机演示：Video A 引导流 / Video B 剧情流 / Video C 战斗流，各约 15s、总 45s，每段单镜时长 ≤15s。全流程 = 背景风格定调 → 三段式剧本拆解 → 元素设计（角色原画→四视图→3D 形象卡 + UI/场景关键帧）→ 逐段视频生成 → 全段合片。\n\n玩法二·开放世界都市类 gameplay 短片：借鉴开放世界犯罪/都市题材的视觉语法、镜头组织与角色类型（只借鉴视觉语法/城市气质/镜头组织/角色类型，不复刻任何官方镜头、Logo、UI、商标、车牌或具体台词，不指名任何商业游戏 IP），产出 30-60s 的混合体验短片：热带度假广告感 + 犯罪纪录片质感 + 社媒荒诞感 + 开放世界城市展示。全流程 = 全局设定 → 双路径角色资产 → 分镜叙事（快节奏事件 or 单镜生活切片）→ 逐镜视频生成 → 音频层 → 剪辑合成。\n\n本 skill 自带战斗动态/锁 UI/像素锚定/类 gameplay 镜头语言/卡点剪辑节奏等全部工艺，不外包给其它 skill。\n\n本环境适配（源模型名 → 13 工具/SP）：image2 出图（画质参数由 Ask 用户确认） → 全部走 generate_image_v3（同一图像引擎保三段一致）；四视图/3D 形象卡可配 character_turnaround_3view 玩法；Seedance 2.0 → generate_video_v3；三段拼接 → composite_video（video layer + audio layer 均开）；Final_Video\\_[Spec.md](http://Spec.md) / 规范文档 → text_editor（写文件）；storyboard_designer → 内部分镜阶段；multimodal_analyze_tool → 多模态读图（3D 材质分析 / UI 像素锚定 / LUT 提取 / 用户照片特征提取）；Image_A1…A5 节点引用 → reference_nodes + {{NodeKey}} 占位符；暂停/审阅 → reply_to_user 或卡片；用户照片 ImageToImage 变角色 → reference_nodes 图生图路径。源无付费/会员语义需剥离（含\"高级会员 1080p\"）。\n\n生图前，必须 Ask 用户确认本次用 image2 模型的什么画质参数发布，询问 4 个选项：1，2k标准画质（性价比高）；2，2k高画质（性价比适中）；3，4k高画质（土豪请随意）；4，其他。\n\n生视频前，必须 Ask 用户确认本次用什么视频分辨率参数发布，询问 3 个选项：1，720p（性价比高）；2，1080p（性价比始中）；3，其他。\n\n玩法一·三段式实机演示\n\n流程与暂停\n\n不要一次性跑完。 在每一关键阶段后停下、与用户确认再进下一步（可用卡片或 reply_to_user 邀请审阅）：规格定稿后 → 故事板完成后 → 元素（角色卡+关键帧）完成后 → 分段视频生成后 → 音频/合片后。\n\n1. 背景与风格定调\n\n接收用户主题关键词，自动设定故事背景、确立全局游戏风格（如写实 / 奇幻 / 赛博等）。撰写 Final_Video\\_[Spec.md](http://Spec.md)（text_editor），字段：标题、类型、画幅比、时长、视觉风格、语言。\n\n2. 三段式剧本拆解（核心骨架）\n\n将演示内容划分为三段（各 15s）结构化脚本，逐段秒级 timeline：\n\nVideo A（15s）引导流 — 系统交互与觉醒\n\n0–3s：封面图，模拟呼吸灯光效，执行 \\[Start\\] 按钮交互。\n\n3–10s：选人/技能展示，模拟鼠标悬停高亮，展示角色 3D 待机 Pose 或招牌动作。\n\n10–15s：第一人称 POV，场景切入，从特定视点（苏醒/转场）过渡到广阔环境的 HDR 效果。\n\nVideo B（15s）剧情流 — 叙事交互与追踪\n\n15–25s：NPC 交互，呼出对话 UI，文字逐字显示，背景保持环境动画。\n\n25–30s：场景追踪，镜头跟随角色快速移动至特定视觉地标，制造遭遇感。\n\nVideo C（15s）战斗流 — 核心战斗与结算\n\n30–40s：实机战斗，快节奏对抗，UI 血条与技能槽实时动态变化。\n\n40–45s：战斗结算，Boss 击败动作，弹出获胜 UI 及奖励结算特效。\n\n3. 元素设计（资产链：原画 → 四视图 → 3D 形象卡 + 关键帧）\n\n角色设计（核心逻辑）\n\n原画：出角色大师级 2D 设计原画（主角 / Boss）。\n\n角色四视图：基于原画 ImageToImage 生成白底四视图（推荐 2K）。布局规则：左侧为面部特写图（捕捉面部细节、皮肤质感、妆容），右侧依次排列全身正面图、全身背面图、全身侧面图（捕捉形体比例与装备层级）。所有视图须与原画造型、配色、材质严格一致（可配 character_turnaround_3view 玩法）。\n\n3D 形象卡：将四视图转换为 3D 真实感人物形象卡。\n\nUI/场景关键帧：生成全链路一致的游戏 UI 界面与场景关键帧，覆盖：开始界面 / 选人界面 / 加载界面 / 第一人称起手视角 / 第三人称观察场景 / 进入 Boss 战。所有图强制同一图像引擎保一致。\n\nVideo A：出 5 张关联图（封面、选人页、技能页、场景起手点等）。\n\nVideo B/C：出对话 UI 图、行进场景图、带 HUD 的战斗首尾帧、结算图。\n\n4. 分析约束（多模态读图，供视频生成用）\n\n3D 资产分析：深度分析 3D 形象卡的材质（金属反射 / 皮肤质感 / 服饰纹理），产出光影描述参数。\n\nUI 像素锚定（核心）：分析带 HUD 截图，记录血条、技能栏、对话框的精确像素位置，将其设为「视频生成禁止形变区」。\n\n色彩与光影一致（LUT）：提取全局色彩倾向，确保三段视频从头到尾色调、亮度高度一致，防止偏色。\n\n5. 逐段视频生成（generate_video_v3）\n\n详细编写每一场景的呈现内容、模拟鼠标点击后高亮的 UI 反馈、以及高强度 Boss 战斗动作。四条提示词指令：\n\n交互段落指令（Video A）：以 Image_A1…A5（reference_nodes+{{NodeKey}}）为节点，模拟真实键鼠交互反馈（点击、高亮、光效），保持 3D 模型在各界面视觉一致。\n\n叙事对话指令（Video B）：对话 UI 绝对清晰、不颤抖、不模糊，文字显示与角色状态同步。\n\n动作战斗指令（Video C）：以战斗对峙图为首帧、获胜结算图为尾帧。\n\n核心指令（贯穿全段）：强制锁定 UI，禁止血条和技能图标产生任何位移、伪影或形变（对齐第 4 步禁形变区）；动作描述包含高频位移、粒子特效、震屏打击感。\n\n6. 全段合片与音频（composite_video）\n\n将三段 15s 视频按逻辑拼接为完整实机演示 Demo，统一输出高画质（设定分辨率、帧率、动作平滑度渲染标准）。合片时同步匹配对应音效：UI 音、环境音、打击音。video layer 与 audio layer（背景音乐）均开启。\n\n玩法二·开放世界都市类 gameplay 短片\n\n面向\"开放世界都市犯罪/街头题材类 gameplay 实机感短片\"的独立玩法：只借鉴公开题材通用的视觉语法、城市气质、镜头组织和角色类型，不复刻任何官方镜头、Logo、UI、商标、车牌或具体台词，不指名任何商业游戏 IP。\n\n1. 全局设定初始化\n\n创建并锁定 Final_Video\\_[Spec.md](http://Spec.md)（text_editor）：画面比例默认 16:9；主题定位为\"受开放世界犯罪/街头题材启发的主题视频、分镜、提示词和视觉审查\"。视觉风格不是单纯\"霓虹犯罪\"，而是\"热带度假广告 + 真实犯罪纪录片 + 社交媒体荒诞短视频 + 开放世界城市展示\"的混合体：画面表层热闹、性感、阳光、夸张；底层始终有追捕、债务、人情、走私、音乐产业、帮派和情侣逃亡的压力。时长默认 30-60s 的小篇幅游戏实机展示 demo，除非用户明确要求更长故事。\n\n2. 双路径角色资产\n\n设计分镜大纲时，角色创作提供两条路径，由用户选择：\n\n方案一（经典角色原型）：使用内置角色原型库创建人物（见下方原型库），直接生成符合本风格、3D 游戏实机质感的 3D 渲染参考图（generate_image_v3）。\n\n方案二（用户定制角色）：用户上传个人照片（仅作创意参考）。多模态分析只提取性别与大概形象/气质（如：性别、大致年龄范围、面部大致轮廓或核心神态眼神），不描述或提取发型、妆容、服装穿着、配饰等具体细节——生图阶段由 ImageToImage 视觉参考路径（reference_nodes 图生图）自适应提炼这些细节，无需在提示词中生硬规定。输出极简英文特征词，例如：A Hispanic male in his 20s, with sharp facial features and determined eyes。强调将用户现实基础形象抽象为\"该风格 3D 游戏角色、第三人称游戏实机、UE 渲染\"的底色，剔除照片背景与光照干扰。若用户另上传第三方视频/动图作为动作或色调参考，需分析其镜头运动（第三人称跟随、低机位车辆追逐等）和色彩成分，转写供故事板与生成阶段使用。\n\n3. 角色原型库 + 场景模板库\n\n设计故事板 key_elements 时，可预定义以下高频角色、场景原型，支持灵活自定义扩展（原型均为通用化命名，非项目专属）：\n\n角色原型库\n\nMALE_LEAD：典型男主角（如热血驾驶者、街头青年），结实、疲惫警觉，擅长极限临场反应。\n\nFEMALE_LEAD：典型女主角（如冷静决策者、干练女强人），强硬、果断，在困境中寻找出路。\n\nUNDERGROUND_BOSS：地下产业巨头/幕后大佬，常戴墨镜、穿着奢华，眼神深不可测。\n\nINFLUENCER_STREET：社媒网红/街头喧嚣者，追求流量与关注，经常举手机直播或热衷派对。\n\nMASTERMIND_PLANNER：行事缜密的行动策划者，经验丰富，老练且难以捉摸。\n\nREGIONAL_SMUGGLER：老派海岛/边界走私者，粗粝、不羁，代表旧时代的犯罪遗留规则。\n\nPARANOID_MONITOR：偏执监听者，松弛体态，擅长在满是屏幕与电台的暗室中获取线索。\n\nCUSTOM_USER_HERO（方案二专用）：根据用户照片分析转换而来的定制主角，继承用户核心外形与眼神特征，具有极强的身份代入感。\n\n场景模板库\n\nMETROPOLIS_NEON：热带霓虹都市、繁华海滩、高架桥梁、粉紫街道、积水路面。\n\nCOASTAL_ISLANDS：海岛走私带、蓝绿海水、码头、白色游艇、黄昏跨海长桥。\n\nWILD_SWAMP：湿地荒野、沼泽芦苇、直升机探照灯、泥水雾气。\n\nDECAYED_HARBOR：廉价港口城、汽车旅馆、Motel 停车场、旧加油站。\n\nINDUSTRIAL_TOWN：工业外围镇、钢架厂房、烟囱、摩托车队、滚滚尘土。\n\nSTORMY_MOUNTAIN：山地国家公园、森林幽暗山路、暴雨闪电。\n\n4. 叙事结构（二选一）\n\n分镜数量默认控制在 1-3 个 shot，除非用户明确要求更长更复杂剧情，优先精简体量以保证渲染效率和单镜质量。\n\n结构 A：快节奏事件叙事（多切镜组合，适合预告片或动作场面）——与用户确认核心剧情后按三段展开：\n\n开场段落·氛围铺垫：多用广角俯视、天际线慢移，声音融入环境音、远处警笛或电台，展现\"平静外表下的暗流涌动\"。\n\n中段段落·冲突失控：动作局部特写、角色争执、追逐碰撞，穿插社交媒体手持/直播视角。节奏由平缓切到高频，多机位频繁切镜。\n\n收尾段落·悬念悬挂：特写眼神、车门关闭、倒后镜等，音乐突歇，只留引擎、呼吸或单调音效，留下戏剧悬念。\n\n结构 B：单镜头生活/玩法切片（一镜到底，5-12s）：强调高可读性、单一连贯动作（如：给车加油、站在积水路口看棕榈树、在影院门前步行、慢速车辆碰撞金属挤压物理瞬间、手机拍摄游戏屏幕的\"泄露质感\"）。必须严格规范：单镜头内禁止切换时空或拼接蒙太奇，保持极度流畅的类游戏第三人称跟随相机延迟。\n\n5. 五类专有视角\n\n镜头语言分类，按叙事需要选用：\n\n类 gameplay 第三人称视角：机位偏低、偏侧，处于角色身后，保留第三人称空间感，带有轻微延迟，隐去游戏 UI。\n\n车载/车旁混合视角：镜头处于副驾驶肩后、后视镜、或后保险杠极低位置，前景为车体，霓虹灯光在湿车身和玻璃上高速滑过。\n\n社交媒体竖屏视角：模拟手机自拍、手持直播，偶发抖动、短暂失焦与边缘失真，画面长宽比可转为 9:16 插入。\n\n监控/警方 bodycam 视角：CCTV 固定广角、带压缩与噪点；bodycam 强烈晃动、带有近距离鱼眼畸变。\n\n亲密逃亡双人视角：车窗、Motel 门框、百叶窗遮挡构图，营造\"犯罪压力下的温情与防备\"。\n\n音频层：全局配置一条主题音乐音轨（BGM：合成器波、现代说唱、南部电台摇滚）；对话使用 key_element_audio 保持主角嗓音的粗粝/沙哑或拉丁语调。\n\n6. 单镜设计规则 + 多切镜规则（4-Cut 公式）\n\n单镜头一镜到底（生活切片/单一动作）设计规则：\n\n核心设计意图：适合 5-12 秒的稳定短镜头，核心是\"一件事从开始到结束\"，动作绝不复杂，镜头绝不乱切，以此建立开放世界的真实生活与 gameplay 质感。\n\n动作设计限制：只保留 1 个主行为（例如：给车加油、递热狗、拿啤酒、打开车门、扫码付款、擦挡风玻璃、点烟、把现金塞进口袋）。禁止在单镜头内同时设计多项并行或连贯的复合剧烈动作（如不要让角色在加油的同时打电话、掏枪、奔跑）。\n\n镜头运镜限制：只保留 1 种运动方式（如慢速推近、侧向横移跟拍、类 gameplay 固定或浮动视角、车内轻微手持摇晃）。\n\n音频配合设计：音轨需提供极具临场感的环境音锚点，如车流声、远处警笛、夜店低音、便利店门铃、加油枪滴答声。\n\n多切镜事件（追逐/冲突/抢劫/混乱事件）设计规则：\n\n核心设计意图：推荐将每个多切镜事件统一设计为 15s 的单个 shot，最大化发挥视频生成模型在单次 15 秒生成中产出丰富内部切镜、流畅场景过渡和饱满信息密度的最佳性能。\n\n分镜结构公式（4-Cut 经典流）：\n\nShot 1（环境与威胁）：交代所处场景、地点环境以及面临的突发威胁/对手。\n\nShot 2（动作细节特写）：展示高动态动作局部特写（如猛踩油门、换挡、推搡、枪栓拉动）。\n\nShot 3（反应与阻碍）：展现角色的受阻反应、路人荒乱、物理撞击或警灯闪烁等不同机位画面。\n\nShot 4（悬念/终局冲击）：展现逃脱、撞击瞬间或极具张力的定格画面，留下悬念钩子。\n\n空间连续性限制：高动态镜头必须维持空间、时间、光影的一致。角色、车辆须在相同街区或空间，朝一致方向运动，避免画面跳跃穿帮。\n\n切镜与音频配合：每个短镜头只承载 1 个明确的信息点。镜头要全景、车内、低机位、特写、社媒画面交替混剪，并为每次碰撞、轰鸣、破碎声在音轨中预留精准的音效对齐点（如引擎轰鸣、玻璃碎、警用广播、轮胎摩擦）。\n\n7. 逐镜视频生成绑定规则（generate_video_v3）\n\n角色 3D 渲染优先用 generate_image_v3；方案二在图生图路径下输入用户照片，生成定制主角的专属 3D 渲染全身照与面部侧写。\n\nShot 视频统一生成时长 15s（多切镜事件），以发挥最出色的多镜头内部切镜与自然转场渲染效果；分辨率默认 720p（源\"高级会员优先 1080p\"语义剥离，不落地）。\n\n参考绑定规则：\n\n视觉参考：必须绑定镜头内出现的角色 asset_id（自定义主角或经典原型）；必须绑定当前所在的场景 asset_id。\n\n连续性参考：若属高强度多切镜追赶/撞车场景，生成 Shot N 时须绑定 Shot N-1 的视频作为参考，确保车辆颜色、受损程度和光影平滑过渡。\n\n声音绑定：若镜头内包含角色对镜头说话，须在音频信息中绑定该角色专属声线资产，实现音画同步。\n\n8. 提示词构建（write_the_prompt）\n\n通用构建原则：绝对禁止包含具体商业游戏名称、版权标志或品牌 Logo；采用\"导演与调色师\"视角，多用动作描述和具象材质词，不写情绪猜测。\n\n四色调口诀：\n\n都市霓虹夜晚：pink and purple neon, wet black asphalt reflections, cyan highlights, dynamic sodium lights\n\n热带海岸黄昏：golden hour glow, teal sea, distant silhouette of palms, hazy sunset sky\n\n晨雾湿地沼泽：olive green muddy water, dense morning fog, silver gray, intense helicopter searchlight beam cutting through haze\n\n白日光照：harsh tropical sunlight, overexposed edges, deep dark hard shadows, heat shimmer\n\n角色 3D 渲染 prompt 结构：统一采用该风格、3D 游戏、第三人称游戏、UE 渲染的高清写实 3D 游戏质感风格，生成一张全身+侧面特写的\"角色 3D 实机渲染图表\"（horizontal side-by-side layout）：\n\nA 3D game character render of \\[character name\\], a \\[gender\\] with \\[hair/face features\\], wearing \\[outfit\\], open-world game style, 3D game model, third-person game gameplay character, Unreal Engine 5 render, high fidelity, realistic game engine shaders, wet skin texture, high contrast tropical lighting.\n\n视频 prompt 结构：统一格式化为 镜头机位 + 视觉参考占位符 + 动作运动堆栈 + 环境声学标记。\n\n格式范例：\\[Camera: third-person trailing angle with slight delay\\] &lt;&lt;&lt;image_1&gt;&gt;&gt; \\[Character: young male protagonist\\] is fueling his dusty muscle car at a neon-lit gas station, simple action of holding the gas nozzle. \\[Background: wet asphalt, pink and cyan glowing neon signs, swaying palm trees, humid metropolis night atmosphere\\]. \\[Audio: (ambient club bass), &lt;distant police siren&gt;\\]\n\n运动堆栈设计：从相机运动（Camera）开始描述，接着是主体人物/载具动作（Action），再到空间环境变化（Environment），最后用括号包装音效或对白细节。视频内对白用 {dialogue} 包裹（例：{We are in this together, okay?}）；音乐氛围声用 (music) / (ambient club bass)；动作音效用 &lt;tire screech&gt; / &lt;siren&gt;；视频 prompt 尾部默认带 no music, no subtitles, no logo, no branding, photorealistic game trailer concept 负向过滤词，背景音乐交由音频轨道统一合成，防止音频重叠。\n\n9. 配方库（单镜/多切镜模板 + 高频镜头配方）\n\n单镜头一镜到底配方\n\n结构公式：one continuous shot, single simple action, \\[角色\\] 在 \\[地点\\] 做 \\[动作\\], camera \\[单一运镜\\], background shows \\[代表性环境元素\\], humid realistic tropical metropolis atmosphere, no cuts, no montage, no logo\n\nPrompt 模板：One continuous cinematic shot in an open-world inspired metropolis. A \\[character type\\] performs one simple action: \\[action\\]. Location: \\[place\\]. Camera: \\[slow push-in / side tracking / fixed CCTV-like frame / handheld phone follow\\]. Background: palm trees, humid neon, wet asphalt, traffic, random NPCs, distant police siren. Keep the action simple and readable, no cuts, no montage, no official logos, no readable real brands.\n\n应用实例（方法级示例，照搬可直接改词替换）：\n\n加油：One continuous cinematic shot in a neon-lit metropolis gas station at night. A young male protagonist refuels a dusty muscle car, one simple action from grabbing the nozzle to putting it into the tank. Camera slowly tracks sideways from the rear wheel to his face, wet asphalt reflecting pink and cyan lights, palm trees and traffic in the background, distant police siren, humid air, no cuts, no montage, no logos.\n\n卖热狗：One continuous street-life shot in sunlit coastal city. A hot dog vendor hands a wrapped hot dog to a tourist while scooters and beachgoers pass behind them. Camera is fixed at chest height with slight handheld sway, bright tropical sun, palm shadows, ocean breeze, colorful NPC crowd, simple readable action, no cuts, no montage, no official logos.\n\n第三人称湿路步行：One continuous game-inspired third-person gameplay shot. A young man in a sleeveless shirt stands on a wet boulevard after rain, then slowly starts walking forward. Camera follows from behind at shoulder height with slight floating game-camera movement. The road is covered with puddles reflecting high-rise hotels, palm trees, neon signs, traffic lights and passing cars. Keep one simple movement, no cuts, no montage, optional minimal HUD feeling, no official logos.\n\n夜街娱乐区探索：One continuous third-person exploration shot in a humid entertainment district at night. A playable character walks toward a bright movie theater entrance, passing food stalls, NPC crowds, LED billboards and glossy wet pavement. Camera stays behind the character with a slow forward follow, like open-world gameplay with cinematic lighting. No cuts, no combat, no logos, no readable real brands.\n\n多切镜事件配方\n\n结构公式：multi-shot sequence, 4 fast cuts, same event continuity: Shot 1 establish location and threat, Shot 2 close-up action detail, Shot 3 reaction / obstacle, Shot 4 escape / impact / hook. Keep same characters, same location, same time of day, no official logos.\n\nPrompt 模板：Create a crime-action inspired multi-shot sequence with 4 quick cuts, same characters and same location continuity. Shot 1: \\[wide establishing shot, location, threat\\]. Shot 2: \\[close-up action detail\\]. Shot 3: \\[reaction or obstacle, different camera angle\\]. Shot 4: \\[escape / impact / cliffhanger\\]. Style: humid metropolitan realism, handheld urgency, low vehicle angles, wet reflections, social media chaos in background. No official logos, no real brands, no gore.\n\n应用实例（方法级示例）：\n\n追逐：Create a high-speed multi-shot chase sequence with 5 quick cuts, same car and same street continuity. Shot 1: wide night street outside a neon motel, a muscle car suddenly reverses as police lights appear. Shot 2: close-up on tense driver slamming the gear shift, dashboard shaking. Shot 3: low rear bumper camera as the car fishtails across wet asphalt, pink neon reflections stretching behind it. Shot 4: vertical phone video from a bystander as the car blasts past a hot dog stand and people jump back. Shot 5: car interior rear-view mirror showing police headlights closing in. Style: humid metropolitan night, handheld urgency, fast cuts, tire smoke, sirens, no logos, no gore.\n\n打架：Create an action-heavy multi-shot motel fight sequence with 4 quick cuts, same parking lot continuity. Shot 1: wide shot of a cheap neon motel parking lot, two men arguing beside a pickup truck. Shot 2: handheld close-up as a sharp female protagonist grabs one attacker by the shirt. Shot 3: low angle as the attacker hits the car door and beer cans scatter on wet pavement. Shot 4: male partner opens the passenger door and shouts for her to get in as police sirens rise. Style: gritty coastal harbor night, sodium lights, wet asphalt, fast handheld cuts, no gore, no logos.\n\n车辆碰撞物理：Create a high-fidelity vehicle collision sequence with 4 quick cuts, same highway continuity. Shot 1: side-rear camera of a sports car scraping against a police cruiser on a sunlit highway. Shot 2: close-up of crumpling metal, shattered headlight glass and tire smoke as the vehicles grind together. Shot 3: overhead tracking shot as both cars drift across lanes, the police car pushing into the sports car's rear quarter. Shot 4: low bumper camera as the sports car breaks free and accelerates, leaving debris and skid marks behind. Style: realistic in-game vehicle physics, hard sunlight, road vibration, metal deformation, fast but readable cuts, no logos.\n\n8 个高频镜头配方（可直接参考或调用）：\n\n城市开场：Metropolis-inspired coastal city at dusk, palm trees, high-rise hotels, neon signs turning on, wet asphalt, traffic and pedestrians, humid air, distant police siren, slow aerial push-in to street level, saturated but realistic, no logo, no real brands.\n\n双人逃亡：two fugitives in a motel parking lot at night, young tense couple, muscle car idling, pink neon reflected on wet pavement, cash bag and old phone, handheld camera, intimate criminal tension, police lights far away, cinematic game trailer realism.\n\n夜店/社媒奇观：Coastal city nightclub exterior, crowd livestreaming with phones, luxury cars, pink and cyan neon, police cruiser nearby, people laughing and arguing, social media chaos, stabilized tracking shot through the crowd, humid night reflections, no logo.\n\n湿地追捕：Tropical swamp at dawn, fog over muddy water, reeds in foreground, airboat cutting through, helicopter searchlight far away, two fugitives hiding near abandoned boat, handheld low camera, tense quiet, olive green and gold sunrise palette.\n\n港口交易：night port deal between shipping containers, sodium orange lights, wet concrete, trucks and cranes, duffel bag exchange goes wrong, fast lateral tracking shot, sparks and police radio fragments, gritty realistic crime trailer.\n\n类 gameplay 车戏：Open-world inspired third-person gameplay-like driving shot, UI hidden, camera mounted low behind the side of a muscle car, driving through a humid coastal metropolis at night, wet asphalt reflecting pink neon and police lights, camera follows with slight delay and realistic shake, not a clean car commercial, cinematic in-game footage feel, no logos.\n\n手机围观：vertical phone livestream from a random bystander in a neon city, crowd filming a police chase outside a nightclub, shaky imperfect framing, people blocking the lens, pink and cyan neon, wet street reflections, comments implied but no readable UI text, chaotic social media realism, no official logos.\n\n监控荒诞事件：fixed CCTV camera inside a small convenience store, humid night outside, an absurd incident suddenly enters frame, compressed surveillance texture, wide-angle corner view, fluorescent lights, reflections on glass doors, grounded dark comedy, no gore, no logos.\n\n10. 剪辑合成三段节奏（composite_video）\n\n快节奏事件叙事（多切镜组合）：开场阶段单镜头时长 4-5 秒，画面淡入淡出，切镜平缓；中段关系网失控，剪辑点密集（0.8-1.5 秒一剪），采用无过渡硬切与闪白，模拟高速心跳；结尾逃亡悬念，镜头拉长到 6-8 秒，淡出至黑色。\n\n类 gameplay 生活切片：一镜到底，全长 5-12 秒无任何剪辑点。\n\n音视频精确对齐：音轨 1（环境音效/SFX）——枪声、碰撞声、引擎轰鸣与视频画面动作发生帧严格对齐，车辆物理碰撞瞬间音量瞬时调大 6dB 并加低音震动效果；音轨 2（对话语音/Narration）——对话开始前 0.3 秒 BGM 自动衰减 12dB（Ducking），对话结束后 0.5 秒平滑回升；音轨 3（背景音乐/BGM）——视频最后 10 秒（悬念部分）BGM 突然抽空或做低通滤波处理，仅留沉重呼吸声与单调警笛残音，强化末路张力。\n\n输出规格：导出阶段严格遵循 Final_Video\\_[Spec.md](http://Spec.md) 中的参数，不允许包含黑边或拉伸画面。\n\n边界（勿用本 skill，改道）\n\n2D 动画风格宣传 → cartoon-flow。\n\n特定商业游戏 IP 复刻（官方镜头 / Logo / UI / 商标 / 车牌 / 台词）→ 拒绝；本 skill 只做原创或用户自有游戏。", "extras": [], "cn": "游戏玩法实机演示"}, {"slug": "gatsby-artdeco-style", "desc": "复古奢华滤镜，任意题材变身电影感", "body": "# gatsby-artdeco-style\n\n生成旧好莱坞金色调、Art Deco、Americana/Route 66 公路氛围的视频/图，或为历史/美食/运动/爱情/悬疑/MV/梦境/公路等任意题材套用此美学时用本 skill。**风格致敬，不宣称是任何具体版权作品/艺人。**\n\n> 本环境适配：GPT Image/Seedance/MultiModalToVideo → `generate_image_v3`/`generate_video_v3`；text to narration/BGM → `generate_audio`；text_editor → `write_file_v2`；video_assembler → `composite_video`。提示词参数（2K/720p/画幅/胶片语汇）为工艺词面，全部保留。超分辨率后处理（Jimeng SR 4K/MediaKit 1080p）= 本环境无对应能力，删。\n\n## 流程（里程碑暂停，不一次跑完）\n\n1. **参数**：`write_file_v2` 锁 题材类型/时长/语言/画幅(**2.39:1 优先**或 16:9)/视觉风格(\"金色怀旧\")。\n2. **分镜**〔暂停〕：key elements / shot 列表 / audio layers；完成后扫描上下文，把用户已上传或已生成的素材绑定到对应槽位。\n3. **视觉元素**〔暂停〕：为所有 key elements 出图（已有参考图直接绑）；**有台词角色在元素图完成后立即处理 key_element_audio**（用户提供声线参考直接绑，否则按声线风格生成短样本）——须在任何含台词 shot 视频生成前完成。\n4. **逐镜视频**〔暂停〕：以 element 图为主参考；仅当与上一镜视觉连续性极强时才追加上一镜 reference_video。\n5. **音频**（BGM + VO 旁白）〔暂停〕→ 6. `composite_video` 合成导出。\n\n依赖：2→1；3→2；4→3；5→2；6→3,4,5。每个主阶段（Spec 锁定/分镜/元素图/镜头视频/音频）后暂停等确认。**用户上传素材优先绑定到对应槽位，避免重复生成。**\n\n## 参考素材分析（6 项）\n\n有上传素材时逐项分析：① **色彩对齐**：提取主色调，判断是否接近金色怀旧色盘，输出与目标色盘偏差供提示词校正。② **光影风格识别**：Golden Hour 逆光/体积光丁达尔/Anamorphic 水平光斑/浅景深是否具备，缺失则列入补足清单。③ **镜头语言识别**：画幅/景别/运镜类型作分镜基线。④ **人物/场景元素提取**：服装发型妆容、建筑陈设年代感、标志性道具 → 结构化描述直接用于 key_element。⑤ **时代感核查**：排除破坏 1920s–1950s 的现代元素（手机/LED/现代建筑/当代车型），存在则排除或推至虚化背景。⑥ **Americana 公路元素识别**：路面类型/地平线消失点占比/沿途路牌加油站广告牌 Diner/车型铬饰年代/光线入射角 → 用于公路类 element scene。\n\n## 美学基调（全局锁定）\n\n- **融合色盘**：香槟金 + 烟草棕 + 翡翠绿 + 象牙白 + 落日茜红。(Teal&Orange / Arri Alexa 调色非全局默认，仅特定题材按镜选用，不写入全局。)\n- **画幅**：优先 **2.39:1 Anamorphic 宽画幅**，次选 16:9。\n- **光影**：Golden Hour 逆光 / 体积光(可见光尘) / Anamorphic 水平椭圆光斑 / 室内烛光或琥珀钨丝点光。\n- **胶片质感场景分级**：豪宅/宴会/舞台用细腻 **35mm** 颗粒(稳定曝光、黑位深但保服装纹理)；回忆/公路/汽旅/私人影像切 **16mm** 颗粒(轻微曝光漂移、偶发跳帧、竖划痕)。**同一场景类型内不混用两套颗粒。**\n- **核心情绪（须通过可见结果表现，非抽象氛围词）**：宴会后空酒杯+散落亮片；人物独站宽阔房间边缘；恋人同框但视线不相交；隔着车窗/门框/水面/人群望向对方；远处灯光/人物始终无法真正靠近。\n\n## 双重视觉语法（全局锁定）\n\n两套视觉语言须在同一视频内交替，不得始终单一状态：\n- **公开场合**（宴会/豪宅/舞台/上流社会空间）：稳定或缓慢移动镜头；Art Deco 对称构图；黑色与象牙白为底，香槟金仅作局部高光点缀（不铺满）；人物表情克制、动作收敛；35mm 细腻颗粒，不用手持抖动。\n- **私人时刻**（回忆/公路/汽旅/独处）：轻微手持或偏离中心构图；褪色暖白与烟草棕主调；允许自然曝光漂移；16mm 颗粒加重，偶发跳帧与竖划痕保留私人影像感。\n- **强制对照节奏**：每出现宴会/豪宅/珠宝/名车场景后，须紧接一个人物独处/空座位/喝剩酒杯/熄灭的灯/无人公路镜头——以视觉反差承载幻灭主题，不让华丽状态贯穿整段。\n\n## Key Elements 设计规范\n\n- **角色元素**：服化道细节(发型/妆容/服装材质)+ 情绪基调；多造型/年龄段逐一列出(造型 A/造型 B)。\n- **声线绑定（key_element_audio）**：凡 shot 中有台词的角色必须为其定义 key_element_audio，绑一段声线参考音频跨镜保持音色，在描述中注明声线风格（可引用 references/audio-voice-presets.md 预设）。**样本 8–12 秒、须覆盖该角色典型情绪区间**（平静叙述+情绪起伏句+收尾低落），非单一情绪朗读——单一情绪样本会致 TTS 在不同情绪 shot 音色不稳。用户上传参考若情绪单一须注明以便补充多情绪覆盖。\n- **场景元素**：建筑风格（Art Deco 豪宅/旧好莱坞片场/爵士夜总会/长岛海湾码头）或 Americana 公路意象（Route 66 公路尽头/沙漠高速逆光/1950s 加油站/褪色广告牌/路边 Diner/汽旅霓虹夜景）；注明主光源位置色温 + 标志性 Americana 细节（沥青热浪扭曲、路肩野草、地平线消失点、生锈招牌褪色霓虹、旋转吧台点唱机）；公路场景须注明拍摄视角——车内主观（挡风玻璃框架）还是车外低机位追拍（路面+轮胎）。\n- **道具元素**（关键道具单独立项便于特写引用）：室内/派对类——香槟塔/老式留声机/褪色旧相片情书/水晶烛台/年代感白电话；公路 Americana 类——1950s 车头镀铬饰/方向盘手套箱老仪表盘/锈迹 Route 66 路牌/褪色广告牌/Diner 霓虹招牌/公路地图皮革手提箱/加油站风向标。\n- **用户上传素材**：element 描述必须与图中可见内容一致，不矛盾。\n\n## Shot 设计规范\n\n- **时长节奏**：普通叙事镜头 4–8 秒；仅完整舞蹈/连续行走/多回合对话等动作不可打断时才延至 8–15 秒——不得仅因模型支持 15 秒就默认长镜头。**一 shot 只承担一个主要动作或关系变化**；含多景别/多主体/多动作结果须拆分。\n- **每 shot 四要素**：① 场景（引用 element scene ID）；② 故事节拍（人物动作/表演细节/对话台词，台词用 {台词} 标注保留原文并附情绪节拍标注，见下）；③ 镜头语言（景别+机位角度低角度仰拍/平视/荷兰角+运镜锁定/慢推/摇臂上升/Dolly zoom/Rack focus）；④ 光影节拍（光源类型+色调阶段：高饱和金色逆光/烛光暖调/画面逐渐泛黄褪色）。\n\n## 台词情绪节拍标注规范\n\nshot 里凡出现 {台词}，文字之外须紧随情绪标注，否则下游模型平铺朗读失去层次。标注写在台词括号外侧：\n- **情绪状态**：（声音发紧，强撑平静）（低语，气声渐弱）（语气骤然强硬，音量上扬）等。\n- **节奏停顿**：台词内用「——」标中等停顿、「… …」标更长情绪间隙，句间换行代表自然断句。\n- **重音与气声**：（此词咬重音）（整句气声出，几乎耳语）（尾音刻意拖长，带不甘）。\n- **整句情绪弧线**：台词前标走向，如【从漫不经心 → 话到一半骤然哽住】。\n- **与微表情节拍绑定**：台词标注须与同一故事节拍的微表情描述对应（如\"嘴角轻扬但眼神落寞（轻描淡写，尾音下沉）{……}\"）。\n- **与旁白标注的区别**：旁白情绪标注作用于独立 audio_layer 生成提示词；台词情绪标注作用于 shot 内表演节拍，经 key_element_audio 声线参考+情绪指令共同驱动角色表演生成，两套体系并行不替代。\n\n## 慢动作与特效克制\n\n- **慢动作节拍**：仅情感高潮或叙事意义动作（汗水/蒸汽/回眸）标\"120fps 慢动作\"；普通走位/对话/过渡不标。余韵空镜标\"12fps 轻微跳帧感\"，不超过该镜头时长 20%。\n- **特效克制**：所有视效服务叙事、不为装饰。Anamorphic 光斑仅强逆光直接入镜时自然出现，不主动设计为\"横穿画面\"独立事件；体积光须有现实光源依据（窗缝/门隙/舞台灯）；胶片划痕跳帧为点缀，不覆盖主要叙事段落。\n\n## 题材分镜节奏偏好（10 模板）\n\n**候选镜头库，非固定顺序**：从对应题材库选 3–5 种镜头，不得为符合模板而加与剧情无关的道具特写/停格/光斑/回眸；每镜须完成一项明确功能（建立空间/推动动作/改变关系/揭示信息/情绪反应），无功能的漂亮镜头不保留。完整 10 模板（历史/美食/运动/爱情/悬疑/MV/奇幻梦境含声音设计专项/悬疑×公路含色调覆盖+5 段节奏+4 禁止项/公路片）见 **references/genre-templates.md**。\n\n## OP/ED 音频与跨镜音轨\n\n- **BGM**：至少一条全局轨；长视频(3 分钟以上)按段落情绪拆多段，各配 audio_id 与时间区间。\n- **OP 基调**：能量入场、节奏密度高、匹配快速蒙太奇(0.5–1 秒/镜)。**ED 基调**：忧伤余韵、节奏舒缓、配合褪色与颗粒加重。\n- **VO 旁白**：有旁白须在 audio_layer description 写入 narration_speaker_profile 并 layout_instruction 绑定到 shot 区间。**默认音色二选一**：抒情忧郁基调（默认，慵懒柔美女声/气声高/梦呓感）适合 MV 意识流诗意独白；叙事纪录基调（次选，温厚沧桑男声/平稳/淡忧郁电台圆润）适合故事驱动回忆多段旁白。梦境剧专项：优先梦境飘渺女声，男性/引路人用梦境低语男声，梦境段与现实段用不同 profile 在同一 audio_layer 分段绑定。\n- **旁白情绪标注（必填）**：每段旁白须附情绪交付指令（情绪状态/节奏停顿/重音气声/整段弧线），否则 TTS 平铺朗读。梦境段额外标「悬浮感」「消散感」，禁强收尾停顿，声音须在空气中自然蒸发不落地。（声线预设 11 个 + 旁白情绪示例见 references/audio-voice-presets.md。）\n- **OP/ED 分镜结构模板 3 个**（ED 15s / ED 30s / OP 30s 秒级时间轴）见 references/genre-templates.md。\n\n## 媒体生成规格\n\n- **角色参考图**：每角色一张**横向并排图**——左侧头肩近景(锁面部/肤色/发际线)+ 右侧全身(服装/发型/妆容/鞋履剪影)。多造型用 ImageToImage 以第一版为参考保身份。\n- **shot 视频参考输入 3 类**：① Element 图像(必选，画面所有角色 element + 相关场景/道具 element)；② key_element_audio(有台词必选，跨镜引同一角色同一条声线参考)；③ 上一镜 reference_video(可选，仅视觉连续性极强时)。**连续性判断**：同一人物同一地点无时间跳跃+动作直接衔接才算\"连续性极强\"；场景切换/时间跳跃/情绪转折不需要。\n- **写实克制降调**：优先胶片质感自然写实非视觉奇观；Storyboard 若有夸张特效语言（\"光斑充满画面\"\"粒子爆发\"）传入提示词前降调为克制版（保留特效存在但降低强度）。\n- **音频生成**：BGM 提示词避知名艺人真名；**VO 旁白提示词=两部分**：① 完整 narration_speaker_profile 音色描述 + ② 从 audio_layer 情绪标注提取的情绪交付指令，缺一模型退回平铺朗读腔。**key_element_audio 样本规范 4 条**：8–12 秒覆盖典型情绪区间；样本同样写入完整 profile + 情绪标注；同一角色全片引同一条 resource_id(不满意则重生成更新绑定，不混用不同版本)；绑定前建议播放验证音色是否与预设一致，偏差明显须重生成。\n\n## 提示词写作（图像/视频）\n\n- **语言**：中文交互时提示词正文中文书写；台词/旁白按 Spec 输出语言保留原文。\n- **美学关键词核心库 + 单镜选取 5 规则**（本 skill 提示词质量核心闸门）：色彩/光影/光学/胶片分级/风格标签五类候选词库，**每类只选最相关 1 项写入、不叠加堆砌**；无逆光光源不写 Anamorphic 光斑；无烟雾灰尘雾气介质不写 volumetric light shafts / floating dust motes；普通人物近景不默认加光尘光晕金色轮廓光；场景光线平淡则如实描述实际光源、不强套金色逆光。完整词库见 **references/prompt-keyword-library.md**。\n- **调色氛围控制 5 条**（氛围来自阴影密度与色彩分离的精确控制，每条不省略）：crushed blacks + lifted shadow floor（阴影上抬保细节不纯黑截断，阴影向冷绿/深烟棕偏移）；warm highlight roll-off（高光向香槟金/琥珀温和过渡不过曝）；冷暖色彩分离（暖高光+冷阴影互补，中间调饱和度适度压低）；中景大气雾化（非前景烟雾特效，光尘须像实拍尘埃非数字粒子）；参考色感锚点 Kodak Vision3 500T（夜/室内）或 250D（日光/Golden Hour）。\n- **特效克制 6 条 + 禁止词**：Anamorphic 光斑禁写\"爆发/横扫/充满画面\"；慢动作仅高潮；胶片划痕跳帧\"偶发\"、不覆盖 >20% 时长；体积光光尘须有现实光源支撑；避饱和度骤增骤降/瞬间过曝/颜色反转数字感过渡；**禁止词**：neon glow / electric color / oversaturated / HDR tone-mapped / digital color grade / VFX particle burst。\n- **图像提示词结构**：按序写为自然语言段落、不输出分段标题——【主体+动作+场景环境】→【光影色调，从核心库取匹配词组】→【镜头语言：景别+运镜+构图手法】→【画幅与画质：2.39:1，电影感，4K】→【风格标签，从核心库取】。只写可见内容不写心理；人物写实电影感（非二次元）；衣物薄透改用\"轻纱薄雾礼裙\"等非敏感表达；画面内文字引号内写可渲染完整字串。\n- **视频提示词结构**：参考图占位 <<<image_1>>> 等在开头/主体处标角色身份；运动堆栈顺序 镜头运动→主体动作与表演节拍→空间环境变化→音频标注；**Seedance 包装语法**：音乐(...)、音效<...>、台词{台词原文}（非项目语言时括号前注明语言）、片名/字幕【...】，{}内只写台词不加描述；**固定负向词**：有独立 VO 轨则末尾加 no narration voice over，始终加 no music、no subtitles；慢动作写\"慢动作 120fps\"/\"slow motion\"，不用壁钟时间段切割。\n- **角色造型参考图专项**（8 类年代造型词库 Gatsby Girl/Daisy/旧好莱坞女星/爵士歌手/公路浪人男女/财阀男/权贵男 + 通用年代感叠加词，含双视图结构要求）见 **references/prompt-keyword-library.md**。\n- **题材专项关键词补充 10 组**（含悬疑×公路整段英文词库）见 **references/prompt-keyword-library.md**。\n\n## 合成（video_assembler）\n\n- **画幅**：时间线优先 2.39:1；平台限制改 16:9 时上下加黑边（letterbox）保电影感。\n- **节奏曲线**：ED 整体舒缓、空镜占 ED 总时长 60% 以上、亮度饱和度渐降（金色→泛黄→趋近黑白）、末尾黑屏字幕段 ≥5 秒；OP 前 5 秒慢节奏铺垫（黑白/重颗粒）后切快速蒙太奇（0.5–1 秒/镜、节拍对齐 BGM 鼓点）末尾停格+标题卡；正片过渡优先叠化(dissolve)或直切、情感转折可慢推叠化、避免花哨转场。\n- **音频混合**：BGM 在 ED 段持续淡出末 3 秒降至 0、OP 段从无到有渐入；**VO 旁白优先于 BGM，BGM 在旁白说话段自动降至 -12dB**；镜头内生成的音效/台词与 VO 旁白错峰避免重叠。\n- **胶片颗粒层**：720p 资产合成后建议整体提升画质（本环境无 MediaKit 超分，如实告知）；最终时间线叠统一轻胶片颗粒层保全片质感一致。\n\n## 边界\n\n通用多镜叙事 → cinematic-flow；其他导演美学 → auteur-style-director 分流。（auteur 家族：wes-anderson-style / zhang-yimou-style / ang-lee-style / nolan-style 等，为同族路由、非依赖。）\n\n> 本 skill 源自足、零源生跨 skill 依赖，故无「配合」依赖表。以上美学基调/双重视觉语法/声线/题材模板/提示词词库/合成均为**场景专属工艺、全部内联**，不外包给任何工艺 skill。", "extras": [], "cn": "旧好莱坞金色年代·Art"}, {"slug": "ghibli-anime-style", "desc": "把剧情拍成有温度的手绘动画大片", "body": "# ghibli-anime-style\n\n把复杂剧情重构为宫崎骏动画创作体系**启发下**的电影级手绘动画时用本 skill。聚焦：手绘赛璐珞质感、自然生命力、流畅角色表演、飞行与风的运动诗意、宏大奇幻世界观、温暖成长叙事、深层人文关怀。摒弃生硬静态插帧或首尾帧生成，直接通过角色 key_element 与场景 key_element 做多模态参考绑定，实现高流畅度、多视角长视频创作。\n\n> **风格致敬，非精确模仿**：参考宫崎骏体系的公开美学特征与学术分析(手绘质感/自然崇拜/反战/环保/女性独立成长/飞行机械浪漫/幻想建筑/生活细节/无绝对善恶的复杂冲突/久石让式交响情绪配乐)。**严禁直接复刻已有动画角色、已有影片具体镜头、受版权保护的名称/标志性角色外观/具体场景；应创作全新原创故事、原创角色、原创世界观。**\n> 本环境适配：Seedance / MultiModalToVideo → `generate_video_v3`；TextToImage → `generate_image_v3`；`text_editor` → `write_file_v2`；`video_assembler` → `composite_video`；`text_to_instrumental`/音频 → `generate_audio`；`@资产`/占位符 → `reference_nodes`+`{{NodeKey}}`；源\"会员/1080p 分辨率档/模型点名\"收敛(默认 720p，如需更高如实告知)；**音色提取绑定链**(源从生成视频拆音频作后续音色参考)本环境无此能力，改为\"角色配音用 `generate_audio` 同参数保持一致\"，见下文标注。**写提示词/解构/分镜工艺全部内联本 skill，不依赖外部工艺 skill。**\n\n## 一、7 条最高执行原则\n\n1. **拒绝静态 PPT 感与廉价动画感**：严禁无动作/无表情/慢动作拖时长或纯 PPT 过渡的静态分镜；人物、动物、自然元素、机械都必须有真实运动逻辑；角色必须有自然生动细腻的情绪表情，尤其儿童角色的重心不稳、惊讶眨眼、犹豫停顿、奔跑喘息、衣角与发丝随风摆动等生命感。\n2. **坚持手绘动画质感**：默认高质量二维手绘动画风格，强调柔和轮廓线、水彩背景、分层赛璐珞质感、自然笔触、手绘光影、轻微纸张纹理、逐帧动画感；严禁廉价三维塑料质感、过度光滑电脑动画质感、僵硬卡通贴图感。\n3. **充分释放模型切镜潜力**：长剧本拆多段 15 秒视频(每个 shot)，每段 15 秒内规划 **3–5 个高频镜头切片**，形成清晰剧情推进和空间变化。\n4. **自然、风、水、光与机械必须可动**：关键不只是人物动，而是整个世界都在呼吸——风吹草叶、云缓移、溪水反光、树影斑驳、锅炉蒸汽、齿轮转动、螺旋桨、衣物褶皱、动物耳朵尾巴，都必须有符合物理规律的细微运动。\n5. **空间三维深度与分层动画感**：拒绝扁平贴片感。画面必须有清晰的【前景-主体-背景】三层结构并体现赛璐珞分层逻辑：前景移动更快、中景角色自然运动、远景山脉云层缓慢移动、背景水彩质感稳定。\n6. **双模态多角色参考流**：不生成多宫格故事板参考，直接用角色 key_element 设定图+场景 key_element 设定图做多模态参考绑定，最大化保持角色与世界观一致性。\n7. **Prompt 规范**：所有提示词完全且固定用中文书写，禁止任何英文单词/字标/字符(工具名/模型名/技术资产名可保留必要英文，但画面/风格/动作/对白/旁白/负面词等一律中文)。\n\n## 二、前置选择与规格确认（第一阶段）\n\n解析任何具体剧本前，必须先向用户提出以下选择，确认后写入规格书顶部：\n1. **视频生成模型/分辨率**：本环境默认 720p；如需更高分辨率如实告知(源\"Seedance 2.0 需会员/1080p 需会员\"档收敛)。\n2. **单段视频时长**：默认锁定 15 秒(以最大化释放自动切镜和多镜头连载能力)。\n3. **画面比例**：16:9(默认)、9:16、1:1。\n4. **输出语言与方言口音**：普通话(默认)／日语感中文配音风格(温柔克制清澈，仍用中文生成)／儿童自然口语／少女成长叙事口吻／乡村生活化口音／其他用户指定语言方言。\n\n确认后按下节标准模板初始化并锁死规格文件，作为后续各步骤对齐执行的单一事实来源，不得私自更改。\n\n### Final_Video_Spec 标准规格模板（`write_file_v2` 初始化）\n\n```\n# 视频创作全局规格书 (Final Video Spec)\n\n## 1. 核心技术规格\n- 视频生成模型：[默认本环境模型 / 如需更高分辨率如实告知]\n- 输出分辨率：[720p 默认 / 更高需告知]\n- 单段视频时长：[默认锁定 15 秒]\n- 画面比例：[16:9 / 9:16 / 1:1]\n- 输出语言与口音：[普通话 / 儿童自然口语 / 乡村生活化口音 / 自定义]\n\n## 2. 故事剧本与分镜大纲\n- 故事梗概：[简述故事大纲与情绪基调]\n- 原著故事内容(红线锁死)：[完整录入用户提供或已确认的剧本，100% 忠实核心事件，绝不删改]\n- 核心成长命题：[离家 / 寻名 / 理解自然 / 拒战争 / 学独立 / 与恐惧和解]\n- 世界观规则：[自然法则 / 魔法规则 / 机械规则 / 神灵规则，明确且前后一致]\n- 多角色特征控制清单(key_element 规范)：\n  - 角色A(element character)：[名称/年龄/性格/视觉主色/服装材质/标志道具/表演神态倾向/绑定锚点]\n  - 角色B(element character)：[同上]\n  - 动物或精灵角色(element character)：[外形/运动方式/声音/与主角关系/绑定锚点]\n- 视觉状态账本 (Visual State Ledger)：\n  - [实时记录各 15s 段落结尾的物理/道具/光影/天气/角色位置与情绪终态锚点，作下一段落始态继承校验]\n\n## 3. 全局色彩美学与色调设计\n- 主色盘方案：[森林生命色 / 天空飞行色 / 海浪童话色 / 蒸汽机械色 / 神隐夜灯色 / 自定义]\n- 色彩插槽配置 (Color Slot System)：\n  - 灵魂色(全片主调)：[色值及情绪定义]\n  - 身份色(角色服装/道具)：[角色A 色值 / 角色B 色值]\n  - 自然色(森林/天空/海面)：[森林绿 / 天空蓝 / 云白 / 土壤赭石]\n  - 奇幻色(魔法/神灵/飞行石/精灵光)：[暖金 / 青蓝 / 柔白 / 微光绿]\n  - 危险色(战争/污染/失控机械)：[铁锈红 / 烟灰黑 / 暗紫 / 病态绿]\n\n## 4. 角色音色与声音特征\n- 声音语言种类：[跟随第一阶段输出语言与口音选择]\n- 音色描述绑定：各角色音色特征描述(如\"清澈但有点胆怯的少女声\"\"温柔沉稳的少年声\")+ 动物/精灵音效(咕噜声/呼吸声/低鸣声/风铃般轻声)。\n  ※ 本环境无\"从生成视频拆音色作后续参考\"能力：各角色配音用 `generate_audio` 以同一音色描述+同参数生成保持跨镜一致。\n- 专属 BGM 推荐配置(audio_layer 规划)：[钢琴 + 弦乐 + 木管 + 竖琴 + 手风琴 + 轻打击乐]\n\n## 5. 阶段工作任务与具体执行指令\n- [沉淀、追加后续步骤的具体指令和用户微调限制，确保后续步骤严格执行不遗忘]\n```\n\n## 三、执行流程（8 阶段，每阶段暂停，严禁一次跑完）\n\n1. **读取输入与规格确认**〔强制暂停〕：确认前置规格；`write_file_v2` 写入规格书。用户已提供故事剧本或明确指令时，**完整不遗漏录入规格书**，作长线全局背景避免遗忘。\n2. **故事框架与分镜脚本设计**〔强制暂停〕：有故事直接分镜；无故事先沟通确认框架/主角成长命题/奇幻规则/自然机械冲突核心后再写分镜。**宫崎骏式叙事核心**：故事不能只有奇观，须有清晰成长弧光与世界关系——主角从\"害怕、依赖、迷茫或逃避\"出发，经陌生世界考验，逐步学会勇气、劳动、责任、共情或自我认同。**多方立场冲突**：严禁简单善恶二元，人类/自然/机械/神灵/动物/反派势力都应有自身逻辑，即使破坏自然一方也应有生存理由或历史背景。**账本机制**：每段 15s 结尾记录角色位置/姿态/道具/天气/自然运动/光影方向/情绪状态，下段开头继承。每段 15s(每个 shot)拆 3–5 个内部子镜头，含【前景-主体-背景】层次、生动面部动作、自然连贯对白、环境音效、风/水/光/动物/机械运动细节。暂停请求确认。\n3. **多角色与场景设定图生成**〔询问并暂停〕：先问用户是否上传自己的角色/动物精灵/机械/场景参考图。上传则暂停等待，收到后注册为锚点绑定；选择生成则调用 `generate_image_v3` 生成(见五)。生成后展示，暂停确认。\n4. **角色配音**〔强制暂停〕：为各角色用 `generate_audio` 以同一音色描述+同参数生成配音，作后续所有 shot 该角色的统一音色基础，保证跨镜说话声音一致(源\"生成 4–6s 设定视频→拆音频作 key_element_audio 音色参考\"链本环境无此能力，如实降级为同参数配音)。暂停汇报。\n5. **视频素材生成**〔逐步生成并暂停确认〕：`generate_video_v3` 直接用角色/场景/机械 key_element 设定图作多模态输入。每段 15s(每个 shot)生成后暂停沟通确认，确保无瞬移、无表情呆板、无廉价三维质感、无角色漂浮、无机械运动错误。必须严格根据视觉状态账本校验当前段开头与上一段结尾在动作/道具/角色位置/天气/自然运动/光影方向/情绪状态上是否衔接。\n6. **BGM 方向确认与生成**〔强制暂停〕：与用户确认符合全片情感走势的独立 audio_layer 规划，推荐温暖交响乐器库(钢琴、弦乐群、小提琴、大提琴、长笛、双簧管、单簧管、圆号、竖琴、钟琴、手风琴、木琴、轻柔合唱质感、儿童音乐盒音色)。音乐方向按剧情选(见 6.1)。确认后用 `generate_audio` 生成纯乐器 BGM 并注册为锚点。\n7. **时间线合成与剪辑**〔强制暂停〕：素材全部生成并确认后调用 `composite_video`，导入独立音频轨(环境音效/对白/动物精灵音效/BGM/旁白)与视频轨(各 shot)，精确卡点、音量微调、无缝硬切。确认合成质量，确保画面生动、剧情连贯、自然世界有生命感、角色成长弧清晰、无 PPT 呆板感。\n8. **动画电影海报封面设计**〔分步延展并暂停〕：`generate_image_v3` 设计具备手绘动画电影感、自然奇幻世界观、主角与风/云/森林/飞行器/动物精灵共同构成叙事画面的电影海报封面。严禁复刻任何已有动画角色或现有影片海报构图。步骤：①先生成 16:9 封面，暂停展示确认；②确认后延展生成 3:4 和 4:3 两个比例，完成全案输出。\n\n依赖：2→1；3→2；4→3；5→4,3；6→5；7→6,5；8→7。每阶段沟通确认点均为硬性暂停点，用户提出修改须回退至对应步骤重新确立。\n\n## 四、多模态解构规范（四大解构——\"万物可动\"原则的操作层）★\n\n### 一、角色动作与表情性能解构\n在 element character 级别做面部与形体特征解析：\n1. **面部微观动作**：识别剧本情绪转折(害怕/好奇/赌气/委屈/鼓起勇气/惊喜/释怀)。儿童或少女角色表情须细腻自然：眼睛快速眨动、眉毛轻微上扬、嘴角犹豫地抿住、脸颊微鼓、呼吸急促后慢慢平复。成年角色更克制：眼神沉稳、下颌放松或紧绷、短暂沉默后开口。动物或精灵角色通过耳朵、尾巴、触须、身体膨胀收缩、眼睛大小变化表达情绪。**拒绝面无表情、假笑、僵硬木偶感。**\n2. **物理交互反馈**：分析角色与环境道具(element prop)的交互力学——推开木门时身体重心前倾，跑过草地时鞋底压弯草叶，抓住飞行器扶手时手指用力，风吹斗篷时布料滞后摆动。儿童角色重心不稳，跑步时身体微前倾，急停时脚步踉跄。飞行场景必须考虑风阻、重力、升力、惯性、转向时身体倾斜。\n3. **多角色互动与视线**：规划多人物视线交汇与身体朝向。**角色A说话时角色B不能呆站**，必须有细小反应：眨眼、低头、转身、手指抓紧衣角、脚尖轻轻挪动。动物或精灵角色须与人类角色真实互动：靠近、退缩、嗅闻、蹭手、躲藏、跟随、警觉竖耳。\n\n### 二、自然与世界运动解构\n1. **风**：识别所有受风影响元素(草叶/树冠/头发/衣角/窗帘/旗帜/云层/烟雾)，风必须产生可见运动。微风=草叶轻摆、发丝轻动；强风=衣物大幅摆动、身体倾斜、云层快速流动；飞行风=头发和衣物向后拉伸、眼睛微眯。\n2. **水**：河流/海浪/雨滴/水洼/倒影都须有手绘动画感。**水面倒影颜色比实物暗、饱和度略低、随波纹轻微变形**。雨滴落入水面必须有冲击、扩散、消失三个阶段。\n3. **植物与森林生命感**：森林不是静态背景，树叶/草/苔藓/藤蔓/花瓣/孢子微粒都应有细微运动。远山用大气透视(偏蓝、低饱和、低细节)。近景植物用团块法与笔触法，每片叶子和草茎方向不完全一致。\n4. **机械与飞行器**：出现飞行器/蒸汽机械/移动建筑/锅炉装置时，分析齿轮/螺旋桨/连杆/蒸汽阀门/活塞运动。**机械运动必须有重量、节奏和噪声，不能像魔法贴图一样无逻辑滑动。**\n\n### 三、三维空间与赛璐珞分层解构\n1. **前景层**：识别增强景深的前景物(草叶/树枝/窗框/云雾/飞过镜头的小鸟/近处水滴/锅炉管道)，前景元素应有轻微失焦或快速横向运动，体现分层动画空间感。\n2. **主体层焦距**：明确主体位置和运动轨迹，确保角色处于清晰焦平面。手绘动画不追求真人摄影式过度虚化，而通过线条清晰度、色彩饱和度和层次运动体现深度。\n3. **背景层纵深**：提取远山/云层/建筑/森林/海平线的透视关系。背景应有水彩手绘质感，不能像照片贴图。\n\n### 四、声学纯净度解构\n1. **对白声学环境**：按空间判断对白声场——森林中声音柔和扩散、木屋内有轻微反射、飞行中对白受风声影响、海边对白混合浪声。儿童对白要自然，不要成人腔，不要解释过度。\n2. **物理音效定位**：提取细微拟音并映射至对应 audio_layer(草叶摩擦/木门吱呀/锅炉咕噜/蒸汽喷出/衣料抖动/脚踩泥土/雨滴落叶/翅膀拍动/螺旋桨旋转)。**禁止在视频提示词中直接写入背景音乐描述，音乐由后期合成。**\n\n## 五、故事板设计规范（storyboard 工艺）★\n\n### 5.1 核心元素设计\n1. **多角色元素(element character)**：主角优先推荐少年、少女、普通劳动者、学徒、飞行员、森林守护者、面包店帮工、机械师、乡村孩子、旅人等具备成长潜力的普通人。**角色不能一开始就是完美英雄，必须有缺点**(胆小/急躁/依赖/迷路/逃避/固执/过度自信或不懂自然)。角色成长必须通过行动体现(劳动/照顾他人/修理机械/穿越森林/保护动物/承认错误/做出选择)。**女性角色必须独立自主，不依赖男性拯救**(可以害怕，但须通过自己的判断和行动推动故事)。**男性角色不能只承担拯救者功能**，也应有脆弱、困惑、被帮助和成长过程。动物、精灵、神灵角色必须有独立意志，不只是可爱宠物或装饰物。\n2. **场景与道具元素(element scene / element prop)**：每个主要场景须具备完整功能性结构——木屋须有厨房/炉灶/储物架/窗户/生活痕迹；飞行器须有驾驶杆/螺旋桨/翼面/发动机/油管或蒸汽管；城镇须有街道坡度/排水沟/面包店/车站/钟楼/居民阳台；森林须有树种/苔藓/腐木/溪流/昆虫/动物足迹。道具须有叙事作用(名字牌/旧钥匙/飞行护目镜/手绘地图/破损机械零件/种子/风铃/便当盒/药草包/蓝色发带等)。\n3. **世界观元素**：奇幻规则必须清楚(魔法从哪来/精灵为何出现/机械如何运转/自然为何愤怒/主角如何与世界建立关系)，不能无规则堆砌奇观，所有幻想元素须服务主题。世界观须包含自然与人类的关系(共生/误解/破坏/修复/敬畏或和解)。\n\n### 5.2 镜头与分镜设计（宫崎骏动画视觉语法）\n每个 15s 段落(一个 shot)严格拆为 3–5 个高频子镜头：\n1. **构图设计**：\n   - **分层赛璐珞构图**：明确前景/中景/背景三层。前景=草叶/树枝/云雾/窗框/飞过的鸟；中景=角色行动；背景=水彩风景/建筑/远山/天空。\n   - **自然广角感**：户外场景多用开阔构图，表现天空/风/远山/森林/海面，营造自由与冒险感。\n   - **生活细节构图**：室内场景通过桌面/锅炉/窗台/晾衣绳/碗筷/书本/工具箱等细节建立温暖生活感。\n   - **美学配额制**：夸张广角透视**全片最多 1–2 次**(仅飞行俯冲/巨大生物出现/机械失控等关键场景)；过度对称构图**全片最多 1 次**，甚至完全不出现；其余镜头采用自然、朴素、服务叙事的动画电影构图。\n2. **镜头运动**：\n   - **飞行镜头**：飞行是重要诗意元素，若剧情允许全片应至少设计一次飞行或高处风景镜头，但必须服务剧情；须体现风阻、身体倾斜、云层深度、远景移动差异。\n   - **低机位儿童视角**：儿童主角的世界应略显巨大，门把手/桌子/成人身体/森林树干都可显得更高，表现儿童视角陌生感。\n   - **横向跟拍奔跑**：主角奔跑穿过草地/街道/桥梁/森林小径时，前景快速掠过、背景缓慢移动，形成分层动画纵深。\n   - **特写与微动作**：设计手指抓紧衣角、鞋踩泥水、眼睛睁大、发丝被风吹起、锅炉阀门抖动等手绘动画特写。\n   - **静观自然镜头**：每段不宜全是剧情推进，可在关键处加入 1 个短暂自然观察镜头(云影掠过草坡/蜻蜓停在水面/风吹过晾衣绳)，用于建立生命感。\n3. **节奏设计**：宫崎骏式节奏是\"**紧张—舒缓—惊奇—行动—情感回落**\"的波形节奏，不是一直高强度。15s 内部可含一个小动作目标(追上飞走的帽子/打开神秘门/第一次看见巨大神灵/修好一个机械零件/在雨中鼓起勇气说出一句话)。**对白必须自然简洁，不能让角色长篇解释世界观**——世界观应通过动作、环境、道具和视觉细节展示。\n\n### 5.3 独立音频轨道设计（audio_layer 规范）\n1. **BGM**：规划为独立 audio_layer(类型 music/bgm)，推荐温暖明亮带成长感冒险感的纯乐器配乐(钢琴/弦乐群/长笛/双簧管/单簧管/圆号/竖琴/钟琴/手风琴/木琴)。音乐应有旋律性但不过度煽情，体现希望、风、远方、童年、自然与冒险。\n2. **环境音效与对白**：每个子镜头必须含干净精确的自然和生活拟音(audio_layer 类型 sfx)多轨规划。**对白规划为 dialogue 属性嵌入对应 shot**，简洁真诚有儿童或少年口语感，避免说教/成人化哲学台词堆砌。表达主题应通过一句朴素但有力量的话完成，例如：\"它不是怪物，它只是生气了。\"／\"我不想再逃了。\"／\"风在告诉我们，前面还有路。\"／\"如果忘了名字，就会找不到家。\"\n3. **旁白/独白(narration VO)**：规划为独立 audio_layer(类型 narration)，必须显式设置 TTS 描述。\n\n## 六、多段连贯性与叙事逻辑规范（视觉状态账本操作层）★\n\n1. **视觉状态账本机制**：每段 15s(每个 shot)结尾**强制记录当前时间线终态锚点**：\n   - 角色物理状态：站位、姿态、表情、衣物、发丝、是否受伤、是否淋湿。\n   - 道具状态：地图是否打开、飞行器是否冒烟、钥匙在谁手里、动物是否跟随。\n   - 自然状态：风向、雨势、云层、太阳位置、森林光影、水面波纹。\n   - 情绪状态：害怕、鼓起勇气、疑惑、信任、失落、释怀。\n   - **下一段 15s 脚本必须在前 3 秒内继承上一段终态锚点。**\n2. **动作衔接**：前段结尾角色伸手打开门，下段开头必须完成门打开后的动作；前段结尾飞行器开始失速，下段开头必须继承倾斜、风声、角色抓紧扶手；前段结尾雨开始变大，下段开头角色衣物和地面必须已更湿。\n3. **逻辑递进**：每段 15s 必须服务整体成长弧；前段提出的问题后段必须有回应；**严禁每段素材像独立短片一样互不关联**；观众必须能理解角色在哪里、要做什么、为什么害怕、为什么继续前进、世界发生了什么变化。\n4. **主题控制**：反战表达不能变成暴力奇观，应通过普通人的恐惧、废墟、飞行器阴影、孩子的沉默、技术失控体现；环保表达不能变成口号，应通过被污染的河流、愤怒的动物、恢复生机的森林体现；**成长表达不能靠旁白解释，应靠主角行动完成**。\n\n## 七、图像资产生成与绑定（media 适配 13 工具）\n\n> **【红线锁死·最高优先级】** 所有视频/图像/音频生成的提示词内容(画面描述/风格描述/动作指令/对白/旁白/环境音效说明/负面词等)必须完全且固定用中文书写，严禁任何英文单词/字标/字符(工具名/模型名/技术参数名可保留必要英文)。违反视为严重执行错误，须立即中止并重写。\n\n生成视频前须确保相关图像资产已注册为锚点绑定至 key_element：\n1. **多角色参考图(element character)**：默认高质量二维手绘动画风格，为角色A/B 各生成**四图水平排列的多视角角色设定图**——左侧大幅半身特写，往右依次为正面全身、侧面全身、背面全身；纯白背景和柔和环境光，用于精确定位面部/体型/发型/服饰/标志道具。注册为锚点。\n2. **动物/精灵角色参考图**：若含动物/神灵/精灵/巨兽/飞行生物，单独生成多视角设定图；**必须明确其运动方式**(飞行/跳跃/蠕动/爬行/漂浮/奔跑/滚动)与**情绪表达器官**(耳朵/眼睛/尾巴/触须/翅膀/身体发光/毛发膨胀)，绑定锚点。\n3. **场景参考图(element scene)**：生成具备真实空间透视、手绘水彩背景、自然植物层次、生活细节、建筑功能性的场景参考图，须含明确光源方向、天气状态、前景层、中景行动区、远景背景，绑定锚点。\n4. **机械/飞行器参考图(element prop)**：若含机械须生成机械结构参考图，**符合\"可实现性\"原则**——齿轮/连杆/螺旋桨/锅炉/蒸汽管/驾驶杆/翼面位置逻辑自洽；**严禁出现只有外壳、没有运动逻辑的空壳机械**，绑定锚点。\n\n**多镜头切片视频生成**：`generate_video_v3` 生成 15s 主体视频(每个 shot)，同时传入绑定的角色/场景/机械 key_element(通过 `{{NodeKey}}` 占位符注入)，不使用多宫格故事板参考。对白角色的嘴部动作与音色和发音节奏对齐(本环境视频生成如不支持精确口型绑定，如实降级为\"对白节奏与动作匹配\"；对白角色一致性由音色描述+同参数 `generate_audio` 保证)，儿童角色保留自然停顿。**动画质感硬约束**：必须强调二维手绘质感、柔和线条、水彩背景、赛璐珞分层、自然笔触；严禁三维塑料感、廉价贴图、过度真实照片感；角色运动具备逐帧动画感。分辨率降级默认平滑至 720p，单段视频时长物理锁定 15 秒。\n\n**海报封面设计规范**：见流程阶段 8——生成符合手绘动画电影美学的艺术封面，主角处于自然或奇幻世界中与风/云/森林/海浪/飞行器/动物精灵形成叙事关系，严禁复刻现有动画角色/影片海报/已知 IP 场景；先出 16:9 主封面确认，再延展 3:4 和 4:3。\n\n## 八、提示词写作规范（**中文书写**，逆向工程 + 词库 + 光影微调）★\n\n> 优先级最高：所有 prompt 必须用中文书写。prompt 中旁白/对白/字幕/口音内容严格遵循规格书输出语言设定。\n\n### 8.1 参考图逆向工程（编写前隐式读取并复刻视觉线索）\n- 角色设定：脸型/眼睛比例/发型/服装轮廓/布料材质/标志道具/角色剪影。\n- 场景设定：建筑结构/自然层次/光源方向/天气/植物类型/远山/云层/水面/生活细节。\n- 机械设定：齿轮/连杆/螺旋桨/锅炉/蒸汽管/驾驶舱/翼面/金属磨损与运动方式。\n- 动物/精灵参考图：体型/毛发/眼睛/耳朵/尾巴/翅膀/触须/发光部位/运动轨迹。\n\n### 8.2 美学风格自适应词库（6 流派，按剧本题材/参考图自动映射）\n- **手绘二维动画风格**：柔和轮廓线、水彩背景、赛璐珞分层、自然笔触、逐帧动画感、纸张纹理、温暖色彩。\n- **森林治愈风格**：柔和绿色、金色阳光、斑驳树影、湿润苔藓、草叶微动、自然神秘感。\n- **天空飞行风格**：巨大云层、广阔蓝天、飞行器、风吹衣物、远山大气透视、明亮冒险感。\n- **海浪童话风格**：平涂色块、简化线条、圆润海浪、泡沫、童真色彩、柔软运动。\n- **蒸汽机械风格**：黄铜、铁锈、锅炉、齿轮、蒸汽、油污、手工机械结构。\n- **神隐幻想风格**：暖黄灯笼、木造建筑、水面倒影、夜色、精灵、神灵、奇异但有规则的空间。\n- **默认兜底**：若无明确倾向，强制采用高质量手绘二维动画风格。\n\n### 8.3 空间景深与分层动画描述\nprompt 必须显式规定【前景】【主体】【背景】三层结构：前景元素轻微失焦或快速运动、中景角色清晰、背景以水彩方式稳定呈现。必须描述自然微运动(风吹草叶/云影移动/水面反光/树叶摇动/衣角飘动)。**严禁将背景做成静态贴图。**\n\n### 8.4 角色参考图 prompt 规范\n纯白背景，四张子图水平横向排列，从左到右：半身特写(面部占画幅上部三分之二，眼神清澈自然，准确呈现发型/脸型/眼睛/表情)、正面全身(头顶至足部完整入画，还原服装正面剪裁)、侧面全身(保留服装侧面轮廓/背包/帽子/发带/披风等层次)、背面全身(服装背面细节完整便于视频保持一致)。背景必须纯白，无文字、无水印、无额外人物、无复杂场景。\n\n### 8.5 海报封面 prompt 规范\n美学核心：手绘动画电影感、广阔天空、柔和自然光、风吹草地、主角位于画面中央或三分线位置，远处有奇幻建筑/飞行器/森林或海面。画面情绪：温暖、冒险、童年、希望、自然敬畏、轻微忧伤但最终向光。排版：可含原创中文电影标题与简洁片名设计，须避免凌乱文字。禁止项：复刻任何现有动画角色/已有 IP 标志/杂乱排版/低质量/照片感/三维塑料感。\n\n### 8.6 电影级光影与曝光微调（5 条）\n- 自然面部软光：面部光照柔和，避免过硬阴影(室外可采用树叶斑驳光，室内可采用窗边自然光、炉火暖光或油灯光)。\n- 天空与云层：云层应有体积感，远处云层低饱和偏蓝，近处云层边缘柔和。\n- 森林光影：阳光穿过树叶形成变化光斑，**光斑不能固定不动**。\n- 水面反光：倒影随波纹轻微扭曲，颜色比实物更暗更柔和。\n- 机械光影：黄铜/铁皮/油污/蒸汽必须有材质差异，不能统一塑料高光。\n\n## 九、15s 四模块提示词模板（Motion Stack，本源最核心执行资产）★\n\n生成 15s 视频提示词时，**必须且只能严格采用以下四个模块结构**。单次输出纯提示词文本控制在 **1500–3000 字**，以充实空间景深、材质、微观细节、自然运动和前后段落衔接。\n\n```\n# 【全局视觉与美学基调】\n- 美学风格：[明确指出：高质量手绘二维动画风格，柔和轮廓线，水彩背景，赛璐珞分层动画质感，充满自然生命力，避免三维塑料感和照片写实感]\n- 镜头与景深：[如：分层动画式空间，前景草叶快速掠过，中景角色清晰运动，远景山脉与云层缓慢移动，体现纵深]\n- 色彩与光照：[如：森林绿与暖黄色阳光为主，柔和自然光，树叶斑驳光影，水面反光，空气中有微小尘埃和花粉粒子]\n\n# 【人物与场景设定】\n- 人物资产：通过 {{NodeKey}} 占位符引用绑定的 key_element 图像资产(如角色设定图 {{CharA}}、{{CharB}} 等)，指定各角色的年龄、表情、服装、发型、标志道具与动作性格。\n- 动物/精灵资产：引用 {{Spirit}} 等，指定动物或精灵的体型、毛发、眼睛、耳朵、尾巴、翅膀、运动方式和情绪表达。\n- 场景资产：引用场景设定图 {{Scene}}，明确森林/城镇/木屋/飞行器/海面/天空或奇幻建筑的空间结构。\n- 机械资产：如有机械，引用 {{Prop}}，明确齿轮/螺旋桨/锅炉/蒸汽管/驾驶杆的运动逻辑。\n\n# 【剧本与动作时间线 (Motion Stack)】\n每个时间切片严格遵循运动描述栈：Camera(镜头运动) → Subject(主体动作及面部肌肉) → Space(空间/风/水/机械阻力) → Audio(物理拟音/对白)：\n- [00.0秒 - 03.5秒]\n  - Camera：[如：低机位儿童视角，中景，透过前景草叶看向主角。视觉状态账本继承：必须精准继承上一段落结尾的角色位置、姿态、道具状态、天气、风向与光影]\n  - Subject：[如：少女角色A站在森林小径中央，双手紧紧抱着旧帆布包，眼睛睁大，呼吸有些急促，发丝和衣角被微风轻轻吹起，鞋底踩弯湿润草叶]\n  - Space：[如：风从左向右吹过，几片失焦的前景草叶被吹得左右摇摆，远处巨大的樟树与蓝绿色远山，云影缓慢掠过森林，阳光洒 沉铜管+大提琴+稀疏鼓点。\n4. **推荐提示词结构**：`纯乐器，温暖动画电影主题，清澈钢琴，柔和弦乐群，长笛旋律，圆号表现飞行感，竖琴点缀水面微光，明亮但不过度煽情，适合少年少女成长冒险，录音质感温暖自然。`\n\n## 十二、成片质检（`composite_video`，7 条）★\n\n1. **时间轴无缝拼接与剧情连贯性质检**：以各 15s shot 为基本单元时间轴拼合；站在观众视角完整审视，检查剧情通顺/对白自然/成长弧清晰/前后无逻辑断层；**严格核对视觉状态账本**(角色位置/姿态/衣物/道具/动物精灵位置/机械状态/天气/风向/光影方向必须完全契合)；若发现穿帮/道具消失/角色瞬移/天气突变/机械运动逻辑错误，**必须精准定位并打回重制对应段落**。\n2. **多镜头节奏控制**：检查每个 shot 内部自动切镜节点画面切换必须自然；严禁无切镜的、像 PPT 或静态插画一样的生硬长轴视频；对白出现时镜头焦点或景别切换必须与说话者同步；自然观察镜头/动作推进镜头/情绪特写镜头之间应形成呼吸节奏，不全程高强度堆奇观。\n3. **手绘动画质感质检**：逐镜检测是否具备柔和轮廓线/水彩背景/赛璐珞分层/自然笔触/逐帧动画感；凡出现三维塑料质感/真人照片感/廉价贴图感/背景静止贴片感必须打回重制；**角色须保持剪影一致**，不能在不同段落中脸型/发型/衣服结构大幅漂移。\n4. **自然与机械运动质检**：检查风/水/草/树叶/云层/烟雾/蒸汽是否有细微运动；检查飞行器/锅炉/齿轮/螺旋桨/连杆是否符合物理规律；飞行镜头必须体现风阻/惯性/倾斜/远近层次，不能像角色贴图在背景上平移。\n5. **动作与表情质量把关**：角色必须有正常物理质量、惯性运动与连贯生动的肌肉微表情；儿童或少女角色必须体现真实情绪反应(害怕/惊讶/犹豫/鼓起勇气/开心/失落)；动物或精灵必须有非人类身体表达，不能只像玩偶站着；**人物不能总是呆立或始终面对镜头**，要有符合剧本动机的行动。\n6. **多轨声音拼合与拟音渲染**：视频轨自带对白与音效无损提取并单独编入时间线；导入规划好的独立 audio_layer(sfx 轨：风声/树叶/鸟鸣/水声/脚步/机械/动物声音；music/bgm 轨；narration 轨)；精准微调各轨音量、淡入淡出、与 shot 时间线卡点同步性，**禁止音乐遮盖角色对白**。\n7. **转场与出片管理**：多镜头切片内部采用自然硬切，15s 段落之间可采用动作衔接切、风吹遮挡、云层掠过、门开合、飞行穿云、草叶扫过镜头等电影化转场；**严禁使用现代短视频花字、闪白、无物理依据的炫技转场**。最终输出：完整连载视频文件、内部镜头切片清单、视觉状态账本、物理声效对齐节点、音轨层级分配清单。\n\n## 相关\n\n- **边界(勿用本 skill，改道)**：通用 2D 动画流程 → cartoon-flow；其他动画风格 → needle-felt-animation / ink-wuxia-animation / mahou-shoujo-90s；名导实拍风格 → auteur-style-director。\n- 本 skill 自足内联，**无源生跨 skill 依赖，不设配合表**。", "extras": [], "cn": "宫崎骏动画导演"}, {"slug": "glass-crystal-dream-video", "desc": "把香水、护肤、珠宝、梦境人物或透明艺术装置，制作成玻璃水晶梦境风的完整 AI 视频生产方案。适用于用户只给一句主题、给产品图、给参考图、给已有首帧、或要求制作 15s/30s/60s/75s/90s 广告短片时使用。它不只是写图片提示词，也不只做海报，而是负责从创意、视觉记忆点、资产拆分、首帧与尾帧、分镜节拍、逐镜头视频提示词、转场、声音、剪辑、审核返修到交付清单的全流程。与普通产品广告 Skill 的区别是：本 Skill 的核心判准是透明材质真实、折射反射可信、画面干净高级、节奏克制梦幻，并且所有视频镜头都要围绕玻璃、水晶、焦散光、水波、薄雾、浅景深和高级广告摄影来组织。\\\" version: 2", "body": "# Glass Crystal Dreamscape Video Director\n\n## 定位\n\n你是「玻璃水晶梦境风全流程视频导演」。你的任务不是单纯生成一张漂亮海报，也不是只给一段通用提示词，而是把用户的模糊想法、产品需求、参考图或已有资产，整理成一套可以进入 LibTV / Codex / 视频生成工作流执行的完整视频生产方案。\n\n本 Skill 只负责一件可复用的事：制作具有玻璃、水晶、冰感、透明、折射、焦散光、浅景深、高级广告摄影感的 AI 图片与视频方案。默认目标是视频，海报、首帧、产品图只是视频生产中的资产和视觉锚点。\n\n适合内容包括：香水广告、护肤品广告、珠宝广告、透明梦境人物短片、玻璃空间艺术片、产品首帧、5 秒图生视频、15 秒广告片段、30 秒社媒广告、60 秒完整广告片、75-90 秒氛围概念片。\n\n不负责：现代赛博朋克、魔法粒子爆炸、廉价蓝色滤镜、硬科幻实验室、普通电商白底产品图、强剧情短剧、快节奏燃剪、低质 3D 展示片。\n\n## 输入\n\n用户可以只给一句话，也可以给完整需求。你要先提取已知信息，再自动补齐不会影响方向的缺口。\n\n需要识别的信息：\n\n- 主题：香水广告、护肤水晶风、珠宝大片、梦境人物、水晶房间、透明花园等。\n- 产品：品类、瓶身形状、材质、颜色、卖点、是否需要露 logo。\n- 人物：是否出现人物、性别气质、服装、动作、是否露脸、是否只拍手部。\n- 参考图：产品图、人物图、场景图、风格图、材质图。\n- 视频目标：5s 图生视频、15s 广告、30s 短广告、60s 完整广告、75s/90s 概念片。\n- 比例：默认 9:16；可切换 16:9、4:5、3:4、1:1。\n- 交付深度：只要创意、只要资产提示词、只要视频提示词、完整视频生产包、返修诊断。\n- 文字：是否需要标题区、广告语、品牌尾帧；默认建议后期加字，避免模型乱码。\n\n### 默认补齐\n\n当用户没有指定时，按以下默认值执行：\n\n- 默认输出：完整视频生产包。\n- 默认时长：60 秒。\n- 默认比例：9:16。\n- 默认结构：高级产品广告 + 梦境艺术短片混合结构。\n- 默认色彩：冰蓝 + 银白 + 淡紫 + 少量淡粉 + 透明高光。\n- 默认材质：真实玻璃、水晶、冰感湖面、透明气泡、薄雾、焦散光。\n- 默认镜头：固定机位、极慢推进、极慢横移、微距特写、浅景深。\n- 默认动作：产品稳定，人物动作克制，环境只做轻微光影、水波、雾气、气泡运动。\n- 默认文字：尾帧预留文字区，文字后期添加。\n\n## 输入使用\n\n### 有参考图时\n\n参考图只用来提取可迁移的视觉规律，不复刻原图内容。必须分析：\n\n- 材质：是玻璃、水晶、冰块、亚克力、水面，还是普通透明塑料？材质是否有厚度、边缘高光、折射和反射？\n- 光影：光源方向、反光强度、焦散光是否自然、是否过曝。\n- 构图：主体位置、留白、前中后景层次、广告感是否明确。\n- 色彩：冰蓝、银白、淡紫、淡粉之间的比例，是否只是简单蓝滤镜。\n- 视频可动点：哪些元素可以动，哪些必须固定。产品、logo、人物脸、瓶身轮廓必须稳定；雾气、焦散光、水波、气泡、衣料可以轻微动。\n\n输出时必须说明：参考图只作为材质、构图、光影和氛围参考，最终方案会重新设计原创场景、镜头和节奏。\n\n### 没有参考图时\n\n不要直接追问。先给 3 个可执行方向，让用户能选择，也可以直接默认执行最适合的一个。每个方向必须包含：方向名称、适合品类、核心画面、视觉记忆点、材质系统、色彩系统、视频节奏、适合时长。\n\n推荐方向库：\n\n1. 冰蓝水晶湖广告：产品立在玻璃湖面中央，远处水晶柱折射出焦散光，适合香水、护肤、珠宝。\n2. 透明玻璃花园：玻璃花瓣和水晶露珠围绕主体缓慢漂浮，适合香水、护肤、人物梦境。\n3. 水晶房间人物梦境：人物站在透明水晶房间中，墙面折射出多层影像，适合珠宝、服装、艺术片。\n4. 银白透明实验台：产品悬浮或静置在透明玻璃台上，水滴、气泡、冰晶组成清透科技感，适合护肤品。\n5. 气泡水晶梦境空间：透明气泡漂浮，气泡内部有淡紫光斑和折射，适合梦境短片和香氛广告。\n\n## 内部流程与 Knowhow\n\n### 1. 先定视频目标，而不是先写海报\n\n每次执行先判断用户到底要哪一种结果：\n\n- 静态资产：输出产品、人物、场景、材质、首帧、尾帧图片提示词。\n- 5s 图生视频：以稳定首帧为核心，只让光影、水波、雾气、气泡轻微动。\n- 15s 广告片段：建立空间 -&gt; 产品/人物出现 -&gt; 材质特写 -&gt; 高级尾帧。\n- 30s 短广告：空间建立、产品亮相、2-3 个材质卖点、视觉高潮、尾帧。\n- 60s 完整视频：12 个 5 秒镜头，完成空间、主体、材质、情绪、高潮、收束。\n- 75s/90s 概念片：在 60 秒基础上增加人物梦境、产品故事、空间递进或多场景变化，但仍保持慢节奏和材质真实。\n\n判断标准：视频不是把一张图动起来就完事，而是要有清晰的节拍、资产、镜头任务、转场逻辑、音效和尾帧。\n\n### 2. 风格判准\n\n好的玻璃水晶梦境风，应同时满足以下条件：\n\n- 材质可信：玻璃和水晶有厚度、边缘高光、真实反射、真实折射，不像塑料或透明贴图。\n- 光影干净：焦散光细腻，柔和高光从侧后方或顶部进入，画面不脏、不灰、不过曝。\n- 构图高级：主体清晰，有留白，有前景虚化和浅景深，不堆满道具。\n- 色彩统一：冰蓝、银白、淡紫、淡粉服务同一个氛围，不跳色，不变成普通蓝滤镜。\n- 视频克制：动作少，变化细，运镜慢；观众能感到材质和呼吸，而不是被快剪带走。\n- 广告可用：产品必须清晰稳定，尾帧可加品牌或广告语，核心卖点能被看见。\n\n### 3. 资产拆分\n\n必须先拆资产再写分镜。资产不是越多越好，而是要保证视频生成时可以稳定引用。\n\n资产编号使用：`GCD-类别-序号`\n\n- `GCD-P-01`：主体产品 Product。\n- `GCD-C-01`：人物 Character。\n- `GCD-S-01`：主场景 Scene。\n- `GCD-M-01`：材质道具 Material，例如玻璃花瓣、水晶柱、气泡、水滴、冰块。\n- `GCD-L-01`：光影氛围 Lighting，例如焦散光、柔雾、银白边缘光。\n- `GCD-KF-01`：视频首帧 Keyframe。\n- `GCD-END-01`：视频尾帧 End frame。\n- `GCD-TEXT-01`：标题区或尾帧留白 Text area。\n\n资产表字段：资产编号、名称、用途、必须稳定的内容、可动态变化的内容、视觉描述、图片提示词、负面提示词、后续引用方式。\n\n资产原则：\n\n- 产品资产必须单独生成，保证形状、瓶身、包装和 logo 区域稳定。\n- 场景资产要干净，不要让场景抢产品。\n- 材质资产只服务氛围，不要大量堆叠。\n- 首帧必须适合图生视频，构图稳定，主体清楚，光影已经成立。\n- 尾帧必须适合广告收束，留白干净，能加文字。\n\n### 4. 图片提示词写法\n\n图片提示词按资产写，不要一条提示词塞完整视频。每条提示词都要明确：主体、场景、材质、光影、镜头、构图、比例、负面限制。\n\n通用正向组件：\n\n`高级广告摄影，透明玻璃，真实水晶折射，真实反射，焦散光，冰蓝色调，银白高光，淡紫梦境光，浅景深，柔和侧逆光，干净留白，精致材质，通透空间，真实玻璃厚度，边缘高光，超清细节，梦幻而克制。`\n\n通用负面组件：\n\n`廉价塑料感，普通蓝色滤镜，低质 3D，游戏建模感，过度发光，光效脏乱，材质没有厚度，折射错误，反射错误，产品变形，瓶身扭曲，logo 错乱，文字乱码，背景杂乱，主体模糊，过曝，死黑阴影，卡通质感。`\n\n### 5. 视频节拍设计\n\n5 秒图生视频\n\n只做一个镜头。目标是让首帧变得有呼吸感，而不是改成新场景。\n\n允许变化：焦散光缓慢移动、薄雾轻微漂浮、气泡慢慢上升、水波极轻微扩散、玻璃反光轻微变化、衣料或发丝轻微飘动、人物轻轻抬手或眨眼。\n\n禁止变化：产品移动或变形、瓶身旋转、logo 乱变、主体漂移、场景结构改变、新增物体、强烈闪光、快速运镜。\n\n15 秒广告片段\n\n- 0-3s：建立透明梦境空间。\n- 3-7s：主体产品或人物出现。\n- 7-11s：材质、折射、反射、焦散光特写。\n- 11-15s：回到高级广告尾帧，主体稳定，留白可加字。\n\n30 秒短广告\n\n- 0-5s：空间建立，冰蓝玻璃世界出现。\n- 5-10s：产品/人物首次亮相。\n- 10-15s：产品外观或人物气质展示。\n- 15-20s：材质卖点特写，水晶折射、玻璃边缘、焦散光。\n- 20-25s：视觉高潮，光影与主体形成记忆点。\n- 25-30s：尾帧定格，品牌感收束。\n\n60 秒完整视频\n\n默认 12 个镜头，每个约 5 秒。它必须是完整视频，不是 12 张无关美图。\n\n- 0-5s：建立透明梦境空间。玻璃湖面、水晶柱、薄雾、焦散光出现。\n- 5-10s：强化材质氛围。气泡、水波、高光、折射层次建立。\n- 10-15s：主体首次出现。产品或人物进入画面，但保持稳定。\n- 15-20s：主体稳定展示。产品轮廓、人物姿态或珠宝形态被清楚看见。\n- 20-25s：材质特写 1。玻璃边缘、水晶切面、产品高光。\n- 25-30s：材质特写 2。光线穿过水晶形成焦散，展示真实折射。\n- 30-35s：空间轻微变化。水波、雾气、气泡构成梦境呼吸。\n- 35-40s：视觉高潮。主体与水晶光影组合成最强主视觉。\n- 40-45s：细节补充。水滴、花瓣、珠宝、瓶身、肌肤或衣料微距。\n- 45-50s：情绪收束。镜头退回空间，光影更柔和。\n- 50-55s：海报化构图。主体居中或三分之一构图，光影收束。\n- 55-60s：品牌尾帧。画面稳定，留白干净，适合加标题或广告语。\n\n75 秒 / 90 秒完整视频\n\n当用户要更长视频时，不要简单把镜头拉长。应在 60 秒结构基础上增加一个「梦境递进段」或「人物互动段」。\n\n75 秒建议：15 个镜头，每个约 5 秒。增加 15 秒用于：人物进入水晶空间、手触碰玻璃花瓣、产品被光影唤醒、空间从冰蓝转向淡紫。\n\n90 秒建议：18 个镜头，每个约 5 秒。增加 30 秒用于：三段空间层次递进，产品/人物在玻璃湖、水晶房间、透明花园之间转换，但转场必须柔和，不可突然换景。\n\n### 6. 逐镜头视频提示词写法\n\n每个镜头的视频提示词必须包含：\n\n- 时长与比例。\n- 用到资产。\n- 首帧构图或起始画面。\n- 主体动作。\n- 可动态变化的材质和光影。\n- 运镜方式。\n- 稳定性要求。\n- 音效方向。\n- 负面限制。\n\n视频提示词模板：\n\n```\n【视频提示词 GCD-SHOT-XX】\n时长：5 秒\n比例：9:16\n用到资产：@GCD-P-01 @GCD-S-01 @GCD-L-01\n画面：主体产品位于透明玻璃展台中央，背景是冰蓝水晶空间，地面有玻璃湖面反射，周围有轻微薄雾和淡紫光斑。\n动作：产品保持完全稳定，不移动、不旋转、不变形；远处透明气泡极慢上升。\n光影：银白侧逆光缓慢扫过瓶身边缘，焦散光在玻璃地面轻微流动，反射自然变化。\n运镜：固定机位或极慢推进，速度很慢，保持高级广告摄影感。\n声音：轻微水波声、细小玻璃余音、空灵低频氛围。\n稳定性：保持首帧构图、产品轮廓、瓶身比例、材质和背景结构不变。\n负面限制：不要产品变形，不要 logo 错乱，不要新增物体，不要过度发光，不要快速运镜，不要廉价塑料感，不要普通蓝色滤镜。\n```\n\n### 7. 转场与剪辑\n\n转场要像光和材质的自然变化，不像 PPT 切换。\n\n推荐：\n\n- 焦散光扫过转场。\n- 水波轻扫转场。\n- 玻璃反射划过转场。\n- 透明气泡遮挡转场。\n- 柔雾遮挡转场。\n- 水晶高光一闪后虚焦转场。\n- 微距玻璃边缘切到远景空间。\n\n不推荐：强闪白、故障风、爆炸粒子、快速旋转、强烈推拉、突然黑场、硬切过多。\n\n### 8. 声音设计\n\n声音要轻、透明、空灵，不能抢画面。\n\n音效方向：轻微水波声、细小玻璃轻响、清脆水晶余音、柔和空气流动、薄雾流动、水滴轻落、远处空灵回声。\n\nBGM 方向：高级广告 ambient、低频梦幻铺底、极简钢琴、柔和合成器、冰感氛围音乐、轻微人声垫音。不要强鼓点、EDM、热闹商业音乐、夸张魔法音效。\n\n### 9. 返修思路\n\n返修不要只写「重新生成」。必须指出问题属于哪一类：材质、构图、产品稳定、光影、动作、运镜、节奏、尾帧。\n\n常见返修：\n\n- 像普通蓝色滤镜：增加真实玻璃厚度、边缘高光、折射、焦散和自然反射，降低整体蓝色覆盖。\n- 像塑料：强调真实玻璃、水晶切面、厚度、非亚克力、非塑料、真实光学折射。\n- 产品变形：减少产品运动，要求保持首帧轮廓、比例、瓶身、logo 区域不变，只动光影和雾气。\n- 过度发光：改成柔和高光、边缘反射、细腻焦散光，避免魔法光效。\n- 画面脏乱：减少道具，增加留白，背景虚化，主体放大。\n- 人物动作过大：限制为一个优雅小动作，且动作幅度小。\n\n## 输出\n\n根据用户需求选择输出深度。完整视频生产包必须包含以下结构：\n\n### A. 需求理解\n\n- 主题：\n- 产品 / 人物：\n- 参考图：有 / 无；参考维度：材质 / 构图 / 光影 / 氛围。\n- 目标视频：5s / 15s / 30s / 60s / 75s / 90s。\n- 比例：\n- 输出内容：\n- 已明确元素：\n- 自动补齐元素：\n- 核心风格判准：\n\n### B. 创意方案\n\n- 方案名称：\n- 一句话创意：\n- 适合品类：\n- 主视觉记忆点：\n- 场景：\n- 色彩：\n- 材质：\n- 光影：\n- 视频节奏：\n- 尾帧方式：\n\n如果用户没有明确方向，输出 3 个方向；如果用户已经明确方向，输出 1 个主方案和 1-2 个备选。\n\n### C. 资产表\n\n资产编号名称用途必须稳定可动态变化视觉描述图片提示词负面提示词引用方式\n\n### D. 图片提示词\n\n至少输出：\n\n- 主体产品 / 人物提示词。\n- 主场景提示词。\n- 材质道具提示词。\n- 光影氛围提示词。\n- 视频首帧提示词。\n- 视频尾帧提示词。\n\n每条都要有正向提示词、负面提示词、比例建议、用途说明。\n\n### E. 视频节拍\n\n按目标时长输出节拍表。必须说明每个时间段的画面功能，而不是只写画面漂亮。\n\n### F. 分镜表\n\n镜头编号时间画面功能画面内容主体动作光影 / 材质变化运镜转场用到资产音效视频提示词\n\n### G. 逐镜头视频提示词\n\n按每个镜头单独输出，方便直接复制到视频模型。\n\n### H. 剪辑与声音方案\n\n- 剪辑节奏：\n- 转场方式：\n- 音效层次：\n- BGM 提示词：\n- 字幕 / 标题：\n- 尾帧：\n\n### I. 审核与返修\n\n给图片审核、视频审核、剪辑审核、必须重跑、可局部返修四类结论。\n\n## 自检\n\n输出前必须检查：\n\n- 这次是否真的在做视频，而不是只输出海报或首帧。\n- 是否有完整视频节拍、分镜表和逐镜头视频提示词。\n- 产品是否被设为稳定锚点，不会在视频里乱动变形。\n- 玻璃和水晶是否有真实厚度、边缘高光、折射、反射、焦散光。\n- 画面是否干净，有留白，不是普通蓝色滤镜。\n- 运镜是否克制，动作是否少而高级。\n- 60 秒以上视频是否有递进，而不是重复同一镜头。\n- 尾帧是否能作为广告收束画面。\n- 是否给了可复制的提示词，而不是只有抽象概念。\n- 禁止项是否服务质量，没有靠大量禁令替代正向判准。\n\n## 何时问用户\n\n只有以下情况需要先问用户：\n\n- 用户明确说要做产品广告，但没有给产品品类，也不允许自动虚构产品。\n- 用户要求严格还原某个真实品牌、logo、包装文字，但没有给参考图。\n- 用户同时要求「不要人物」和「人物梦境短片」这类关键矛盾。\n- 用户指定视频时长、比例、交付物之间互相冲突，且会影响执行。\n- 用户要用于商业发布并要求准确品牌文字时，需要确认文字是否后期添加。\n\n其他缺口优先自动补齐，并在 A. 需求理解中写明「未指定部分已按玻璃水晶梦境风视频广告默认规则补齐」。", "extras": [], "cn": "玻璃水晶梦境风全流程视频"}, {"slug": "gothic-hollywood-cinema", "desc": "一键创作哥特式好莱坞暗黑题材漫剧，再现经典大片质感，新手友好", "body": "### 1. Skill 用途\n\n本 Skill 专门用于创作具有“伦·怀斯曼”风格的电影级暗黑美学漫剧。它能够将粗糙的灵感或剧本转化为包含视觉风格定义、人物资产、场景设定及适配 Seedance 2.0 的 15 秒短视频导演提示词，确保每一帧都具备好莱坞大片的工业质感与情感压迫力。\n\n### 2. 适用输入\n\n- **题材灵感**：如战神归来、末日生存、玄幻修仙、古装权谋等。\n- **短剧剧本**：已有对白或分集梗概的文字内容。\n- **视觉偏好**：暗黑写实、硬核 CG 或凌厉二次元风格。\n\n### 3. 操作步骤\n\n1. **视觉风格确认**：首先与用户确认三种专属暗黑风格（写实/CG/二次元）及画面比例（推荐 9:16）。\n2. **创意与剧本构建**：提炼爆款元素，撰写 10 集分集大纲及单集详细剧本（含逐字对白）。\n3. **视觉资产提炼**：生成基于“蓝黑基底、硬光刀锋”原则的人物、场景、道具生图提示词（中英双语）。\n4. **视频段落编导**：按每 15 秒一段自动切分剧本，输出符合 Seedance 2.0 规范的导演提示词。每段包含强制导演指令、画面流描述、音效建议及连贯性上下文。\n\n### 4. 输出要求\n\n- **核心美学**：永夜蓝黑调、硬光刀锋切割感、高对比度、低饱和度、高材质质感。\n- **构图规范**：严禁正视图，多用 15-45° 侧拍或仰拍；严格遵守 180 度不越轴规则。\n- **对白铁律**：所有对白必须完整保留，与剧本逐字一致，禁止增删改。\n- **禁令**：画面中严禁出现任何字幕、歌词或图形文字。\n\n### 5. 注意事项\n\n- 视频生成时，每 15 秒承载对白不超过 75 字，超出时需自动增加段落。\n- 所有生图资产必须使用深色（蓝黑/深灰）纯净背景，以突出角色轮廓。\n- 情感表达需追求“压抑后的冰冷爆发”与“角色的极致孤独感”。", "extras": [], "cn": "一键哥特式好莱坞暗黑漫剧"}, {"slug": "grid-cutsheet-film", "desc": "拼版索引控场，长镜头分镜不再乱", "body": "# grid-cutsheet-film\n\n故事驱动型视频工作流:用 GPT Image 2 生成\"多镜头拼版图\"(一张图承载一个镜头内的全部内部剪辑/节拍),再用 Seedance 依据拼版驱动生成该镜头视频。核心机制是**剪辑索引 = 时间顺序的唯一真源**——拼版上磁贴的空间排列可以任意,只有打印在每个单元格固定角落的编号(1…N)才携带故事顺序。基于单次工作流的人机协作,在关键阶段暂停以供用户确认。\n\n> 本环境适配(Flova→我方 13 工具):GPT Image 2 → `generate_image_v3`;Seedance 2.0/MultiModalToVideo → `generate_video_v3`;text_editor(Final_Video_Spec) → `write_file_v2`;video_assembler → `composite_video`;`<<<image_n>>>` 角色参考标记 → `reference_nodes` + `{{NodeKey}}`;reply_to_user 卡片式确认 → 直接向用户汇报并暂停。分辨率 2K(图)/720p(视频)保留为默认建议;\"每镜最多 15 秒\"与本环境引擎单次时长上限天然吻合,保留。\n>\n> **本 skill 自足内联,不依赖任何其他 skill。**\n\n## 7 步管线(依赖关系 + 暂停点)\n\n1. 编写 `Final_Video_Spec.md`(标题、类型、宽高比、时长、视觉风格、语言)→ `write_file_v2`。\n2. 生成故事板(storyboard):关键元素 key_elements、镜头列表 shot_list、音频层 audio_layers。故事板准备好后,先扫描上下文查找用户提供的或先前的资源(元素图像、背景音乐等),在生成前把每个已有资源绑定到匹配的故事板插槽中,避免重复生成用户已提供的内容。\n3. **元素(Elements)**:如果用户已上传元素资源,绑定到 `key_elements`;否则生成元素图像。\n4. **生成所有镜头的多镜头参考合成图(每个镜头调用一次)**:对每个镜头,写一个图像提示词,把该镜头故事板中的每个内部剪辑/节拍放置在**一张画布**上,作为一张**多镜头拼版(multi-cut sheet)**(清晰的单元格边界)。**拼版上的空间平铺顺序不定义剪辑顺序**——**故事顺序仅由打印的剪辑索引携带**(与故事板剪辑列表编号相同)。**每个单元格的宽高比须与该镜头 Seedance 生成锁定的宽高比相匹配**(见 `Final_Video_Spec.md`)。\n5. **生成所有镜头视频**:引用该镜头的多镜头合成图像生成。\n6. 从故事板生成所有 audio_layers。\n7. 资源准备好后进行最终组装,引导导出。\n\n**依赖关系**:2→1;3→2;4→3;5→2,4;6→2;7→2,5,6。\n\n**何时暂停**:不要一次性运行所有步骤。在规格说明之后、故事板之后、元素之后、**每批或每组多镜头合成图之后**(或所有合成图完成后)、镜头视频之后、以及音频之后停止——在阶段之间与用户确认。\n\n**注意**:用户提供的媒体,在重新生成前先绑定;避免重复用户已经提供的内容。\n\n## 故事板设计\n\n**关键元素设计**\n- 按需包含**关键主体**(角色、物体)、**关键地点/场景**、**关键道具**。\n- **角色**:多种外观(服装、年龄)须清晰描述(例如:外观 1:…;外观 2:…)。\n- **色调/色彩参考**:如果项目使用全局调色或参考片段,在生成时注明(参考时长保持实用,建议 ~15 秒以内以便色调提取)。\n- **地点/场景**:重要物体和表演区域的放置与方向。\n- **用户提供的资源**:描述必须与参考资料**匹配**,绝不能与所见或所听内容相矛盾。\n\n**镜头设计(长镜头优先)**\n- 优先使用**包含多个内部剪辑的长镜头**:用足模型**每个镜头的完整预算**(每个镜头**最多 15 秒**),在故事支持时目标每个镜头**至少包含六个内部剪辑**。在长镜头**内部**设计,剪辑节奏遵循叙事;**不要**把可以在一个长镜头讲完的内容拆成第二个镜头。每个镜头最多 15 秒(模型硬限制)。\n- **每个镜头描述必须包括三要素**:\n  - **场景**:通过元素 ID 确定的地点(例如 `[Element_Office_Noir]`,仅为格式示例)。\n  - **故事内容**:动作、动态、对话——适用时须含**准确台词**;通过元素 ID 引用角色。\n  - **摄影**:每个节拍的镜头尺寸、角度、摄影机移动。\n- **内部剪辑清单**:按**时间顺序**列出每个节拍,分配下游各处(拼版标签、提示词)统一使用的**稳定剪辑索引(1…N)**。此列表是该镜头单张 GPT Image 2 图像的**剪辑清单**:**一个网格单元 = 一个内部剪辑**(关键帧/状态)。**合成图上拼版位置可以遵循任何布局**;编辑器和模型依赖的是**每个单元格上书写的索引**,而不是左右位置。\n\n**独立音频设计**\n- **背景音乐**:至少一条全局音轨;较长片段可用带 `audio_id` 和范围的多个段落。\n- **旁白**:类型选 `narration`;须定语音、语调、确切脚本、镜头范围的 `layout_instruction`。\n\n## 元素与拼版图生成\n\n**元素资源生成**\n- 元素图像按需用 TextToImage / ImageToImage,推荐 `generate_image_v3`、2K,便于快速迭代并与其他流水线保持一致。\n- **角色**:每个角色一张横向 16:9 角色图,画面中从左到右包含**半身特写 + 全身三视图(正、侧、背)**,便于 Seedance 读取身份和服装信息。\n\n**每个镜头的多镜头参考合成图**\n- 模型 `generate_image_v3`,分辨率 2K(仅在简报或流水线明确要求时用 1K/4K)。\n- **模态**:存在元素参考图像时优先 ImageToImage——传入角色/场景参考,使网格匹配锁定的外观;否则用带完整视觉细节的 TextToImage。\n- **规则——一个镜头,一张图像,一次调用**:提示词必须在一次生成中描述完整的多镜头拼版和每个剪辑可见的内容。\n- **单元格宽高比(优先级最高)**:每个单元格的构图必须使其宽:高与该镜头规定的输出宽高比相匹配(如 16:9、9:16、1:1——以 `Final_Video_Spec.md` 为准)。**不要**把单元格压缩成与最终视频几何形状不符的极端长条;匹配比例能减少将合成图用作参考时的重构漂移。\n- **布局**:单个画布;N 个单元格(每个内部剪辑一张关键静帧);细的中性分隔线;空间排列灵活(行、列或不规则网格)——**不要**暗示阅读方向等于故事顺序。\n- **剪辑顺序标记(必需)**:在**每个**单元格的**固定角落**打印**故事板剪辑索引(1…N,与剪辑清单编号相同)**。索引是时间顺序的**真理来源**,拼版顺序是可选的。\n- **剪辑数量**:保持 N 可读,通常一张拼版上每个镜头 **2–6** 个内部剪辑。若故事板节拍更多,回故事板阶段**合并**微小节拍或**拆分**镜头——不得超过一个网格能清晰读取的数量。\n- **风格要求**:每个镜头的多镜头合成图须嵌入 `Final_Video_Spec.md` 中定义的视觉风格(类型、外观、调色板、时代、参考资料),一致应用于该拼版上的**所有剪辑**。\n\n**镜头视频**\n- 用 `generate_video_v3`(Seedance 2.0)、720p,使用与合成图单元格和规格说明中相同的宽高比。\n- **参考**:该镜头的多镜头合成图(节拍路线图 + 与输出比例对齐的各剪辑几何形状)。\n- **标记**:视频提示词中按 `<<<image_n>>>`(本环境用 `reference_nodes` + `{{NodeKey}}`)对每个角色标记(对应元素拼版);**合成图是主要的静帧参考**——**通过拼版上可见的编号剪辑索引(1…N)驱动运动**,不要猜测拼版顺序。\n\n## 提示词工艺 A:多镜头参考合成图(GPT Image 2)\n\n**意图**:此镜头 N 张关键静帧的**联系表(contact sheet)**。每张静帧位于一个单元格内,其宽高比与镜头的最终视频宽高比相匹配(例如与 Seedance 将使用的 16:9 或 9:16 相同)。该表是**布局参考**,不声明磁贴按位置即为时间轴顺序。\n\n**单元格几何形状(优先级)**:提示词中明确说明每个单元格都被信箱格式化或裁剪为该镜头的目标输出宽高比(写明比例,例如\"每个子帧均为原生 16:9\")。这比磁贴在画布上的排列方式更重要。\n\n**剪辑顺序标记 / 故事板索引(必需)**:每个单元格须在固定角落(整个拼版采用同一惯例,例如左上角)显示与故事板剪辑清单中相同的剪辑编号(1…N)。**编辑顺序仅遵循这些数字**——磁贴的空间顺序是可选的,为布局整洁可选任意空间排列。标记须**极简、高对比度、小巧可读**;属于制作元数据,除非剧本要求,否则不作画面内标牌。\n\n**开头(必需的标准模板)**:示例格式:\"单张图像,一张 [N] 个分隔电影静帧的拼版。每个静帧的构图均为 [目标宽高比,例如 16:9],以匹配最终视频。单元格之间有细的中性分隔线。每个单元格在 [角落] 显示一个匹配故事板剪辑列表的小索引 [1…N]。写实真人电影风格;角色和服装保持一致。\"(仅为整洁排列调整行列;**不要**要求从左到右作为故事顺序。)\n\n**按剪辑(按清单索引)**:对每个索引 1…N,在一个流畅的英文段落中(或清晰编号为 Cut 1/Cut 2/… 并与图像上的标签匹配),仅描述该静帧中**可见的内容**:主体姿势、环境、镜头尺寸、角度、光线、调色、镜头感——与下方\"6 大核心规则\"对齐(以自然语言编织,不要在输出提示词中作为带标签的要点标题)。\n\n**6 大核心规则(全局 + 每个剪辑)**:\n1. 专业风格锚点(必要时引用作者电影/参考电影)。\n2. 构图与镜头。\n3. 强调负补光/对比度的光线。\n4. 克制的调色(除非用户另有要求,单一主色调约 90%;除非被要求,避免陈词滥调的霓虹洋红/青色冲突)。\n5. 渲染质量(纹理、细节)。\n6. 戏剧性节拍上的情绪与微表情。\n\n**画面内文字**:仅在必要时把确切文案放在引号内。\n\n## 提示词工艺 B:视频提示词(Seedance 2.0)\n\n**以 `live action` 开头**:当**主要**参考是同一多镜头合成图像时,视频提示词以短语 `live action` 开头(小写)。它会微妙地引导 Seedance 走向更真实的光线、皮肤/物体纹理和运动——比插图或过度的\"AI 光泽\"静帧更接近真实影像。它不能替代具体的运动或摄影语言,只是在正确方向上偏向模型解释。\n\n**然后**:针对元素参考(`<<<image_1>>>`,…,本环境为 `{{NodeKey}}`)标记角色。对于合成图,明确说明:**遵循故事板上打印的剪辑编号 1→2→…→N**——**不要**假设拼版位置等于时间顺序。描述这些编号节拍上的时间流,对动态部分使用**摄影机 → 主体 → 空间 → 音频**四层结构:\n\n1. **摄影机**:移动、重构、节拍间剪辑(根据索引对齐到 cut 1, cut 2, …,而不是根据网格位置)。\n2. **主体**:动作、表情、逐拍描述。\n3. **空间**:环境/深度/背景运动。\n4. **音频**:对话 `{...}`,音效 `<...>`,仅在有意图时用音乐 `(...)`;否则执行下方的静音规则。\n\n**多节拍 / 镜头 1,镜头 2**:可标记节拍 Cut 1, Cut 2, … 与合成图上的打印索引匹配。**不要**依赖精确的墙上时钟计时(例如\"3.0–5.0s\"),按**数字**而不是按拼版位置描述有序的节拍。\n\n**Seedance 包装器**:`(...)` 音乐,`<...>` 音效,`{...}` 对话(若非项目语言须标注语言),`【...】` 屏幕标题。\n\n**负面约束(始终适用)**:\n- 故事板中的独立旁白轨道——**不要**将该旁白文本放入视频提示词中。\n- 除非镜头确实需要内置配乐,否则几乎总是 `no music`。\n- 始终 `no subtitles`(字幕后期添加)。\n\n## 相关\n\n边界(勿用本 skill,改道):只需分镜板出图不生视频 → storyboard-generation;单镜头无拼版直接生成 → video-generation。", "extras": [], "cn": "多宫格拼版导演"}, {"slug": "high-impact-car-tvc", "desc": "上传图片或简单文字叙述即可一键打造超爽感轰炸流TVC广告", "body": "# Fast-Cut Sensory TVC Production\n\n## Core Methodology\n\n### Anchor-Driven Consistency Framework\n\nAll visual outputs must reference pre-established anchor images to maintain brand/product identity across fragmented cuts. The anchor system consists of 4 layers:\n\n**Layer 1 (A1 - Subject Identity)**: Three-view reference of the product (front/side/45° angle) encoding core visual DNA (color palette, body proportions, material finish, signature details)\n\n**Layer 2 (A2 - Visual Style)**: Lighting quality and tone reference (natural light, studio lighting, dramatic backlighting, etc.) — defines the cinematic grammar\n\n**Layer 3 (A3 - Scene Context)**: 2-3 environment references matching user-selected locations (racetrack, desert, urban streets, etc.) — ensures spatial coherence\n\n**Layer 4 (A4 - Composition Language)**: Camera angle and framing reference (low-angle heroic, overhead tracking, close-up detail shots) — establishes visual hierarchy\n\nCritical rule: All shot generation prompts MUST reference the corresponding anchor(s) via node_key placeholders (e.g., `{{i-xxxxxx}}`) to trigger visual inheritance.\n\n### Five-Act Sensory Bombardment Structure\n\nThe TVC follows a proprietary five-act narrative arc optimized for information flow engagement:\n\n**Act 1 (Symbol Establishment) — 10-15% duration**: Dark background → scanning light reveals product → brand emblem illumination (single shot, no cuts) Objective: Brand imprinting through mystery-to-revelation\n\n**Act 2 (Personification) — 8-10% duration**: Human element introduction → driver/user approaching product → human-product fusion moment (1-2 shots) Objective: Emotional transfer from product to aspirational identity\n\n**Act 3 (Mechanical Trigger) — 8-10% duration**: Start button → instrument cluster awakening → exhaust flame/mechanical detail (2-3 ultra-fast cuts) Objective: Sensory priming through machine ritual\n\n**Act 4 (Speed Detonation) — 40-50% duration**: 5-7 high-frequency impact shots alternating between scene contexts (racetrack → desert → mountain pass), visual glitches (RGB chromatic aberration, negative film effect, white flash transitions) Objective: Dopamine spike through sensory overload\n\n**Act 5 (Symbol Return) — 15-20% duration**: Hero pose freeze frame in primary scene → brand emblem gradual fade to black (2-3 shots with reverb tail) Objective: Brand closure with lingering impression\n\n### Multi-Stage Confirmation Gate Protocol\n\nIMPERATIVE: The workflow includes MANDATORY user confirmation checkpoints. The agent MUST NOT proceed to the next stage without explicit user approval:\n\n**Gate 1 (Information Collection)**: Present 5 key questions (product subject, visual type, lighting style, scene selection, duration/resolution) via multi-choice interface. Wait for all answers before proceeding.\n\n**Gate 2 (A1 Anchor Approval)**: Generate three-view product reference → display to user → ask \"Does this match your expectation? ✅ Confirm / ❌ Revise\". If ❌, collect revision instructions and regenerate. ONLY proceed after ✅.\n\n**Gate 3 (Global Anchors Approval)**: Generate A2 style + A3 scene(s) + A4 composition anchors → display all images in grid → ask \"Do these 4 anchors match the intended visual language? ✅ Confirm / ❌ Specify which to revise\". ONLY proceed after ✅.\n\n**Gate 4 (Shot Table Approval)**: Present the complete shot breakdown table (shot ID, description, duration, anchor references) → ask \"Approve this shot structure? ✅ Confirm / ❌ Request changes\". ONLY proceed after ✅.\n\n**Gate 5 (First Batch Review)**: After generating shots S01-S05, display all 5 videos → ask \"Do these shots meet quality standards? ✅ Continue to second batch / ❌ Regenerate specific shots\". ONLY proceed after ✅.\n\n**Gate 6 (Second Batch Review)**: After generating shots S06-S10, display all videos → ask \"Approve second batch? ✅ Proceed to BGM / ❌ Regenerate specific shots\". ONLY proceed after ✅.\n\n**Gate 7 (BGM Approval)**: Generate background music → provide audio preview → ask \"Approve BGM? ✅ Proceed to final assembly / ❌ Regenerate with different instructions\". ONLY proceed after ✅.\n\nCritical enforcement: If the agent skips any gate, the user MUST be able to halt the workflow and return to the missed checkpoint for retroactive approval.\n\n## Workflow\n\n### 1. Preparation Stage\n\n**Input Checklist:**\n\n- Product subject (specific model/variant if available, or generic category)\n- Visual type selection: A (product-only), B (product + driver/character), C (pure scene/lifestyle)\n- Lighting style: natural light, studio high-key, dramatic low-key, backlit silhouette\n- Scene context(s): 1-3 environments from \\[racetrack, desert/wilderness, mountain pass, urban street, coastal highway, industrial zone\\]\n- Target duration/resolution: 15s/30s/60s × 720p/1080p\n\n**Pre-Production Decisions:**\n\n- Determine five-act duration allocation based on total length (use percentage ratios above)\n- Calculate shot count: 15s → 6 shots, 30s → 9-10 shots, 60s → 15-18 shots\n- Identify required anchor types: A1 (always), A2 (always), A3 (1-3 variants), A4 (optional for extreme angles)\n\n### 2. Initial Design Stage\n\n**Anchor Generation Sequence:**\n\n1. **A1 Three-View Reference**: Prompt structure = `[product name] + [key visual attributes from user input] + three-view layout (front, side, 45-degree angle) + high-resolution product photography style + [brand-specific details if known]`. Generate single image, present to user, await Gate 2 approval.\n\n2. **Global Anchors (A2/A3/A4)**: Parallel generation of 3-4 images:\n\n   - A2: `[lighting style from user input] + cinematic quality + [color temperature matching product] + no product visible, pure lighting reference`\n   - A3: `[scene context 1] + [weather/time of day] + establishing shot + no product` (repeat for each selected scene)\n   - A4: `[extreme camera angle if needed] + [composition rule] + visual drama + product silhouette`Present all anchors in grid, await Gate 3 approval.\n\n**Shot Table Construction:**\n\n- Map five-act structure percentages to shot durations\n- Assign scene contexts to Act 4 shots (alternate between A3 variants for rhythm)\n- Write detailed shot descriptions encoding: camera movement + product action + visual effect + anchor references\n- Present table to user, await Gate 4 approval\n\n### 3. Iteration Stage\n\n**Batch Video Generation:**\n\n- First batch (S01 - S05): Generate 5 shots in parallel, each prompt MUST include `{{node_key}}` placeholders referencing relevant anchors\n- Display all 5 videos, await Gate 5 approval. If ❌, identify problematic shots, regenerate only those, re-present for approval\n- Second batch (S06 - S10): Repeat parallel generation and Gate 6 approval cycle\n\n**BGM Generation:**\n\n- Prompt structure: `[total duration]s + three-part structure (suspenseful buildup 0-X%, explosive rhythm X-Y%, reverb decay Y-100%) + [genre matching product personality] + no vocals + cinematic trailer music`\n- Generate audio node, provide preview link, await Gate 7 approval\n\n**Pre-Assembly Checklist:**\n\n- ✅ All shot nodes generated and approved\n- ✅ No deprecated nodes in videoList\n- ✅ Shot sequence matches five-act structure\n- ✅ BGM timestamps written for three-part structure\n- ✅ Audio mix ratio: original audio 30% + BGM 85%\n- ✅ Resolution consistency confirmed (all shots match target resolution)\n\n**Final Assembly:**\n\n- Concatenate approved shots in narrative order\n- Apply BGM with timestamp markers\n- Execute final composite, generate master video node\n- Present completion summary with five-act breakdown table\n\n## Key Constraints & Standards\n\n### Immutable Rules\n\n- **Anchor inheritance**: Every shot generation prompt MUST reference at least one anchor via `{{node_key}}` placeholder. Shots without anchor references will have uncontrolled visual drift.\n- **Confirmation gates**: The agent MUST halt at each of the 7 gates and wait for explicit ✅ approval. Skipping gates is a critical workflow violation.\n- **Five-act structure**: The narrative arc is non-negotiable. Duration percentages can flex ±5%, but act sequence and objectives are fixed.\n\n### Fidelity Rules\n\n- **Product identity lock**: A1 anchor defines immutable attributes (brand emblem, signature color, body silhouette). These MUST remain pixel-consistent across all shots showing the product.\n- **Lighting coherence**: All shots within the same scene context must reference the same A2 anchor. Cross-scene lighting shifts are allowed only at act transitions.\n- **Scene spatial logic**: If A3 shows a racetrack with specific track markings, all racetrack shots must maintain that spatial signature (turn radius, barrier type, surface texture).\n\n### Consistency Rules\n\n- **Cut rhythm in Act 4**: Shot duration in the speed detonation phase must follow logarithmic decay pattern (3s → 2.5s → 2s → 2s → 3s for the hero beat). Never use uniform duration.\n- **Visual glitch distribution**: RGB chromatic aberration, negative film, and white flash transitions must appear in Act 4 but NEVER in Acts 1-3 or 5. Maximum 3 glitch effects total.\n- **BGM sync points**: The three-part BGM structure MUST align with act transitions (buildup = Acts 1-3, explosive = Act 4, decay = Act 5).\n\n### Quality Thresholds\n\n- **Anchor approval threshold**: If the user requests &gt;2 rounds of revision on any anchor, escalate to manual prompt refinement rather than continuing automated generation.\n- **Shot regeneration limit**: If a single shot requires &gt;3 regeneration attempts, flag it as a potential prompt engineering issue and request user input on specific quality concerns.\n- **Batch size**: Parallel generation is capped at 5 shots maximum to prevent GPU timeout. Larger projects must use multiple batches with intermediate approval gates.\n\n## Recommended Tools & Models\n\nUse \\[@tool:video_generation_kuaishou_kling_v1_6_standard:Kling 1.6 Standard:\\*\\*\\*\\*s://a.lovart.ai/tool-icons/video_generation/kuaishou_kling_v1_6_standard.png\\] for all video shot generation (anchor-referenced prompts, 5s/10s clip support, 720p/1080p output). Use \\[@tool:generate_music:Music Generation:\\*\\*\\*\\*s://a.lovart.ai/tool-icons/audio/generate_music.png\\] for three-part BGM creation with timestamp control.\n\n## Advanced Techniques\n\n### Anchor Blending for Transition Shots\n\nFor shots bridging two scene contexts (e.g., racetrack → desert transition), reference BOTH A3 anchors in the prompt with weighted notation: `70% {{A3a_racetrack}} + 30% {{A3b_desert}} + motion blur + speed lines`. This creates visual continuity across environmental shifts.\n\n### Dynamic Anchor Override\n\nIf the user requests a specific shot that intentionally breaks anchor consistency (e.g., \"make one shot black-and-white\"), create a temporary one-time anchor (A5) for that shot only, then revert to global anchors for subsequent shots. Document the override in the shot table.\n\n### Emergency Workflow Recovery\n\nIf the agent accidentally skips a confirmation gate, immediately halt all generation tasks, backtrack to the missed gate, present the relevant assets (anchors/shots/BGM) with a clear \"Retroactive Approval Required\" notice, and await user response before resuming. Never attempt to \"fix forward\" by continuing the workflow.", "extras": [], "cn": "一键爽感轰炸流汽车TVC"}, {"slug": "high-md-flow", "desc": "峰值特技运镜，打造炸裂品牌大片", "body": "# high-md-flow\n\n做高能 / 超动态（kinetic / hyperkinetic）品牌 reel 时用本 skill——峰值动作、狂放运镜、smash cut，用于运动 / 时尚上新 / 科技揭幕 / SaaS reveal 一类需要爆发力的品牌片。三段式推进。\n\n**high 档的定位**：高动能混沌（hyperkinetic chaos）。运动主要来自相机与主体的爆发式动作——与 classic-md-flow 的\"稳而克制内部编排\"正相反。下面的分镜板 / 片段规则据此校准；凡是漂移锁定、慢速优雅滑行、不可察觉微推轨这类语言都不属于 high 档（那是 classic / typography / infographic 的语言，混进来会破坏能级）。\n\n## 三段\n\n1. **风格板（Stage A）**：有图作基底则上传（`upload`）、跳过风格板；无图用 `generate_image_v3`（可用 `style_display_board`）出一张 4 格风格板，风格提示带\"高动态 / 高能\"倾向，用户选定一帧（`ask_human`）作视觉世界基底，其余备选帧忽略。\n2. **分镜板（Stage B）**：以选定基底为准，`generate_image_v3`（`storyboard_panel`）出 6 格分镜板，引用基底帧。\n3. **动效片段（Stage C）**：`generate_video_v3` 以分镜板为参考生成连续片段；多段用 `composite_video` 合成。\n\n## 分镜板规则（Stage B 深度）\n\n- **网格与基底**：6 格 3×2 横向（上排 1-2-3、下排 4-5-6），整板 3:2；格间细发丝分隔（1pt / 12-20px 间隙）、格内无边框、画面纯净（去日期 / 伪数据芯片 / 拉丁副标 / 等宽时间码 / 元数据标签）。从风格板选定的那一帧作整板视觉世界基底。\n- **文字下限**：格内任何文字字号不低于格高约 10-12%（cap-height）；小号拉丁副标 / 等宽时间码一律去掉。\n- **峰值动作强制（PEAK-ACTION）**：每格都定格在动作顶点——起跳最高点、飞溅、粉碎、爆发、拉丝的瞬间。不要静置主体、不要休止状态、不要\"空场里的产品\"。\n- **环境密度强制（AMBIENT DENSITY）**：每格主体后至少 2 层氛围填充——① 粒子飘移（火花 / 尘 / 拉丝粒子 / 雾霭）② 背景渐变呼吸（调色饱和度循环）③ 体积光束（边缘光 / 神光 / 聚光）④ 表面质感（混凝土 / 沙 / 液面 / 镜面地）⑤ 前景景深元素（主体前的虚焦道具）。\n- **文字锚点（Pattern A · 奇数格模式）**：第 1 / 3 / 5 格承载 2-4 词大字标（display 字体），第 2 / 4 / 6 格无字、纯峰值氛围。文案由项目主题生成，不用固定样板句。\n- **六格内容弧（每格一峰值 + 一特技运镜，逐格校准）**：\n  - P01 钩子（0-2.5s）· CRASH-OUT REVEAL：极特写细节瞬切到宽景、主体起跳（顶点）；配甩镜拖影 + 顿帧冻结；承载首个大字标。\n  - P02 · SHATTER PUSH-THROUGH（2.5-5s）：相机穿膜推进、主体在碎裂瞬间冲出；折射碎屑 + 色散边缘；无字。\n  - P03 · VERTIGO PULL（5-7.5s）：主体纵跳到顶点、相机同步推拉变焦；速度斜坡 + 镜头拉丝；承载第二个大字标。\n  - P04 · DROP-DIVE PAST（7.5-10s）：相机垂直俯冲掠过下坠 / 旋转的主体；粒子里的漩涡 + 轻微畸变漏斗；无字。\n  - P05 · HYPERKINETIC ORBITAL SWEEP（10-12.5s）：相机绕爆发 / 飞溅中的主体高速环绕；冲击波环 + 折射薄雾；承载第三个大字标。\n  - P06 收束（12.5-15s）：终宽景、主体收成干净英雄剪影、余粒沉降；残雾 + 柔体积光束；无字。\n- **五锁（跨格一致，写进提示词并逐格复述）**：主体锁（基底的英雄主体 / 母题）、材质锁（复刻基底主材质身份）、风格锁（Tier-1 高端动效 3D / 2.5D 打磨的 hyperkinetic chaos 调性）、调色锁（基底取约 3 个主导 hex 色）、氛围锁（复刻基底的光照情绪 + 雾密度 + 景深）。\n- **禁写实真人（HR-3）**：照相写实真人 / ARRI Alexa / 35mm 颗粒 / 真皮质感严禁。用剪影 / 抽象形体 / 风格化 3D / 2D 插画 / 运动拖影形体 / 粒子形体 / 打光体积剪影替代。照相写实质感仅 product-md-flow 例外。\n\n## 动效片段规则（Stage C 深度）\n\n- **形态**：一段连续全帧 16:9，分镜板只作规划参考、不是面板网格；每镜填满全帧。\n- **相机基调（high 档核心 · HYPERKINETIC CHAOS）**：每镜一个峰值动作时刻（跳跃最高点 / 飞溅 / 粉碎 / 爆炸），绝不漂移锁定、慢速优雅滑行或不可察觉微推轨。相机词汇——眩晕拉近 VERTIGO PULL（约 2m 推近同时拉远）、CRASH-OUT REVEAL（极特写 0.4s 内切宽、约 3m 后拉）、穿膜推进 SHATTER PUSH-THROUGH、高速轨道环绕 ORBITAL SWEEP、垂直俯冲 DROP-DIVE PAST（约 6m）、钟摆甩弧 MATCH-FRAME SWING（约 90°）、甩镜拖影 WHIP-PAN。允许速度斜坡（慢动作→极速）+ 撞击时刻约 2 帧顿帧冻结。强视差：前 / 中 / 背景约 100 / 40 / 15 的位移比。\n- **6 镜弧线**：每镜约 2-2.5s，一个峰值动作配一种特技运镜（如 ① 抽象材质英雄 CRASH-OUT + 甩镜 0.2s、② 动能环境 VERTIGO PULL 1.5s + 环绕 180°、③ 硬表面宏观到宽景 MATCH-FRAME SWING 90° + 冻结闪光、④ 建筑 / 抽象深度走廊 DROP-DIVE PAST 6m、⑤ 能量核心 ORBITAL SWEEP 120° + 穿膜、⑥ 最终英雄帧 VERTIGO PULL 0.8s→锁定）。镜间用强冲击转场：穿膜推进 / 热光斑光扫 / 物体形变 / 向内坍塌 / 粒子溶解（禁 cross-fade）。\n- **尾帧冻结**：13.7-15s 强制定格末帧，像素一致，无新动作 / 元素 / 转场 / 淡出。\n- **音频**：仅动能 SFX 混音——重低音撞击 / 玻璃碰撞 / 棱镜闪光；无音乐、无 VO、无对话、无自动字幕。\n\n## 比例默认与通用\n\n| 步 | 默认比例 |\n|---|---|\n| Stage A 风格板 | `3:2` 恒定 |\n| Stage B 分镜板（3×2 六格） | 16:9→`3:2` / 9:16→`9:16` / 1:1→`1:1` |\n| Stage C 片段 | `16:9` 默认，未指定就问 |\n\nStage C 生成默认 `count: 2`（同 prompt 两份变体）。有图作基底则跳过风格板。Stage B/C 的创作（分镜 / 片段 prompt）源里在后端 enhancer，本环境由 agent 自己写——board 网格纪律与 hyperkinetic 相机基调工艺已内联在上两节，不外包。\n\n## 配合（query 需同时加载 / 也是本 skill 的评估组合）\n\n| 关系 | 目标 | 用途 | 必需? | provenance |\n|---|---|---|---|---|\n| 依赖 | image-generation | 风格板 / 分镜板出图 | 必需 | 源生 |\n| 依赖 | video-generation | Stage C 逐镜生成 | 必需 | 源生 |\n| 依赖 | montage | 多段合成 | multi-clip 必需 | 源生 |\n\n边界：经典动效 → classic-md-flow；产品广告 → product-md-flow；排版动效 → typography-md-flow；信息图动效 → infographic-md-flow。\n\n## 相关\n\n经典 → classic-md-flow；产品广告 → product-md-flow；排版 → typography-md-flow；信息图 → infographic-md-flow。（同属动效设计家族，共享 6 格 board + 三段式管线；high 档在其上把运镜能级推到峰值动作 / 高动能混沌。）", "extras": [], "cn": "高能品牌动效"}, {"slug": "hujinquanwuxia", "desc": "一键把武侠灵感转化为胡金铨，邵氏，古典武侠等美学风格视频", "body": "# 古典武侠电影全流程导演\n\n## 核心任务\n\n把用户现有内容推进到恰好够用的生产深度。先判断输入成熟度、已有素材和连续性风险，再选择流程；不要因为用户有剧本就假设没有资产，也不要因为用户没有剧本就自动创建完整资产库。\n\n默认原则：\n\n- 多镜头项目优先“分析 → 九宫格草稿 → Seedance 2.0 直生视频”。\n- 单镜头项目直接写单条提示词，不强制写剧本、九宫格或资产。\n- 场景资产默认关闭；没有用户提供的完整剧本时，除非用户明确要求，禁止生成场景资产。\n- 首帧默认关闭，只把它用于多人站位、精确动作起点、强衔接或多次直生失败的高风险镜头。\n- 新生成的独立人物、服装、道具和武器资产统一使用中性浅灰干净背景；用户已有资产不因背景不同而强制重做。\n- 视频生成目标分辨率默认 720p；生成分辨率与最终导出分辨率分别记录，不把后期超分冒充原生生成。\n- 不在图片或视频尚未获得实际结果时声称“已经生成完毕”。\n\n## 首次使用与帮助触发\n\n用户只说“开始”“第一次用”“怎么用”“帮助”“如何调用”，或只点名本 Skill 而没有项目内容时，读取 `references/quick-start.md`，显示简短快速开始卡并等待输入。不要直接开始编故事或生成资产。\n\n用户已经给出可执行的剧本、想法或单镜要求时，跳过整张说明卡，直接提取已知信息并只询问必要缺口。不要让熟悉流程的用户重复阅读说明，也不要要求用户填写完整表格；自然语言和“其他按默认”都有效。\n\n## 总流程\n\n 1. 确认主风格、画幅、生成目标分辨率、任务类型、总时长策略、输入类型和已有素材。\n 2. 按完整剧本、简单想法、模糊题材或单镜请求分别分析。\n 3. 建立文字风格锁，并准备与生产路线匹配的验证方式。\n 4. 输出分析摘要、连续性风险和推荐路线，暂停等待一次路线确认。\n 5. 多镜头项目按选择生成九宫格草稿并审核；单镜或用户跳过时直接进入下一阶段。\n 6. 只生成缺失且必要的资产；默认不做场景资产和首帧。\n 7. 细化分镜、打斗、智能片段时长与逐镜视频提示词，生成并检查视频。\n 8. 全部视频通过基础检查后，暂停询问是否加字幕。\n 9. 获得回答后完成剪辑、BGM、音效、调色和字幕。\n10. 终审并定向返修。\n\n不得跳过阶段 0、3、6、7。阶段 4、5 是否执行及执行深度由阶段 3 的路线决定。\n\n## 阶段 0：规格确认与输入盘点\n\n从用户消息和附件中先提取已知项，只询问缺失项，不让用户重复回答：\n\n 1. **输入类型**：完整剧本 / 简单想法或故事梗概 / 只有题材、风格或一句话 / 单个独立镜头。\n 2. **已有素材**：完整资产 / 部分资产 / 没有资产；区分角色、服装、道具、武器、场景、分镜和试片。\n 3. **制作目标**：只做分析 / 图片或提示词 / 单镜视频 / 完整短片 / 修改已有结果。\n 4. **主风格**：古典武侠电影风 / 胡金铨意境武侠美学启发风 / 邵氏棚拍武侠美学风。\n 5. **成片画幅**：16:9（默认）/ 9:16 / 2.39:1 / 4:3 / 1:1 / 自定义。\n 6. **视频生成目标分辨率**：720p（默认）/ 1080p / 当前模型最高可用 / 自定义。这里只表示目标，不在未确认模型能力时承诺原生输出。\n 7. **最终导出分辨率**：保持原生生成分辨率（默认）/ 1080p 超分交付 / 平台规格 / 自定义；可在开始时指定，也可在剪辑前补定。\n 8. **总成片时长**：用户指定 / 有完整剧本时授权智能体建议 / 简单想法由用户指定或授权建议。\n 9. **视频模型与时长、分辨率限制**：如用户指定 Seedance 2.0 或其他模型，记录可用档位；未知时先按内容需要规划，再适配模型。\n10. **发布平台/交付用途（可选）**：用户给出时用来调整画幅、安全区和最终导出；未给出不阻塞创作。\n\n画幅、`GEN_TARGET` 和 `DELIVERY_TARGET` 有安全默认值，用户未提及时直接填入状态卡并允许修改，不把它们变成阻塞问题。用户说“按默认”或“其他按默认”时，使用 `16:9＋720p 生成目标＋保持原生分辨率交付＋快速直生＋多镜头先九宫格＋场景资产 0＋首帧 0＋智能片段时长`。主风格仍需从用户内容推断或简短询问；总时长需用户指定或授权建议。用户提供剧本时，单条片段由运行本 Skill 的大模型逐段判断，不逐条追问。开始时只做素材盘点，不要询问“资产是不是都做了”后仍默认重做；能从上传内容判断时直接填写。\n\n分辨率选择、各画幅 720p/1080p 目标映射、模型限制与超分规则读取 `references/resolution-delivery.md`。\n\n### 三种主风格\n\n- 古典武侠电影风：`references/style-classical.md`\n- 胡金铨意境武侠美学启发风：`references/style-king-hu.md`\n- 邵氏棚拍武侠美学风：`references/style-shaw.md`\n\n默认只选择一个主风格。用户明确要求融合时，设置“主风格不少于 80%，辅助风格不超过 20%”，并列出允许借用的具体元素。\n\n### 画幅影响\n\n- 16:9：默认；适合横向空间、双人对峙与山水调度。\n- 9:16：减少横向并排，优先前中后景、上下平台和纵深路线。\n- 2.39:1：强调横向留白、群像和宽银幕动作，单独规划字幕安全区。\n- 4:3：适合建筑框景、复古电影和集中人物关系。\n- 1:1：减少多人复杂调度，优先中心关系和短动作。\n\n角色 1＋3 资产板如需生成，默认仍用横向 16:9；九宫格每格、首帧和视频严格继承成片画幅。画幅描述比例，分辨率描述像素目标，两者不得混用。\n\n## 阶段 1：按输入成熟度分析\n\n必须读取 `references/workflow-routing.md`，并选择一种内容路线：\n\n### A. 完整剧本\n\n- 读取全文，锁定场次、人物关系、台词、动作、结局和不可改事实。\n- 除非用户要求改编，不擅自删改剧情。\n- 读取 `references/script-duration-planning.md`，按场次、语义、台词、表演、动作和反应拆分，由大模型逐单元判断时长。\n\n### B. 简单想法或故事梗概\n\n- 补成最短可执行剧情节拍：触发、判断、动作、结果和余味。\n- 把新增内容明确标为“自动补齐假设”，先让用户确认路线，不直接扩写成长剧本。\n- 根据目标时长判断需要几个段落和镜头，不机械套模板。\n- 智能体补出的节拍或工作草稿不视为“用户提供的完整剧本”，`USER_SCRIPT` 仍为否。\n\n### C. 只有题材、风格或一句模糊需求\n\n- 先给 2–3 个彼此明显不同的一句话短片方向，每个说明人物、冲突、核心视觉和结尾。\n- 暂停等待用户选择；选定后再形成简短剧情节拍并进入路线确认。\n\n### D. 单个独立镜头\n\n- 直接明确镜头目的、画幅、时长、动作起止、风格和声音。\n- 默认跳过资产、场景图、九宫格和首帧；只有身份或动作风险明确时才建议补一个最小参考。\n\n所有路线都先写创作脊柱：\n\n> 谁，在什么空间，因为看见或听见什么，判断发生怎样的变化，于是做出什么动作，最后停在哪个有余味的画面。\n\n## 阶段 2：建立风格锁与验证方案\n\n读取 `references/style-calibration.md`，并根据阶段 0 的选择读取 `references/style-classical.md`、`references/style-king-hu.md` 或 `references/style-shaw.md`。先建立“前置风格身份锚 → 正文可见证据 → 结尾防稀释锁”的完整文字锁，不要只写风格名。此时只准备验证方案；阶段 3 确认生产路线后再实际执行对应验证：\n\n- 快速直生或单镜路线：先建立完整文字风格锁，用一条代表性测试片验证；不强制先做三张定标图。\n- 连续性或严格控制路线：胡金铨与邵氏方向先制作空间远景、中景人物关系、动作关键帧三张定标图，选择 `STYLE-REF-01` 后再批量生产。\n- 只交付提示词时：输出完整定标提示词和验收证据，不声称已有实际参考图。\n\n## 阶段 3：分析后只确认一次生产路线\n\n根据输入成熟度、已有素材、镜头数量、人物复现、关键道具、复杂打斗和空间连续性，给出一条明确推荐及原因，再提供备选。使用 `references/workflow-routing.md` 的判定规则：\n\n1. **快速直生路线（多镜头默认）**：九宫格 → 逐镜提示词 → Seedance 2.0 直生；不生成场景资产，不生成首帧，角色和道具也可全用文字锚点。\n2. **角色连续性路线**：九宫格 → 只补主要角色 1＋3 灰底资产和剧情关键道具 → 直生视频；不生成场景资产，不生成首帧。\n3. **严格控制路线**：九宫格/空间预演 → 只补必要角色/道具；只有满足场景触发条件时才做场景资产；只有高风险镜头才做首帧/尾帧。\n4. **沿用已有资产路线**：审核、编号和绑定已有素材，只补无法替代的缺口；不因背景或格式不同重复生成可用资产。\n\n路线确认卡必须同时写清：风格验证方式、九宫格是否执行、需要新建哪些资产、场景资产是否为零、哪些高风险镜头需要首/尾帧。用户确认后，先完成对应风格验证，再进入九宫格或逐镜生产；不在资产完成时再次询问首帧。若用户只说“直接做”，多镜头项目默认快速直生且保留九宫格；若明确说“直接生成视频/不要分镜”，跳过九宫格。单镜请求直接执行 D 路线。\n\n## 阶段 4：九宫格分镜草稿\n\n多镜头项目默认读取 `references/storyboard-nine-grid.md`，在正式视频前生成一张严格 3×3 的镜头草稿接触表：\n\n- 每格保持成片画幅，按左到右、上到下表达连续九个节拍。\n- 九宫格是计划与审核图，不是角色、场景或正式首帧资产；画格展示实际剧情环境，不使用灰底资产背景。\n- 图内不要生成编号、字幕或对白气泡；在外部表格用 `G01–G09` 对照剧情。\n- 少于九个最终镜头时，九格可以表达建立、触发、反应、动作和结果等节拍，后续允许合并；超过九个镜头时按段落制作多张九宫格。\n- 不把整张九宫格直接作为每条 Seedance 视频参考。需要引用时，只能裁出、修复并审核单格；默认仍使用文字提示词直生。\n\n审核故事是否成立、景别是否重复、轴线是否清楚、动作是否递进。用户只要求提示词时，输出九宫格提示词和格位表；有实际生成能力时先出草稿并等待简短确认，再细化视频。\n\n## 阶段 5：最小必要资产与条件式首帧\n\n读取 `references/asset-system.md`，先审核用户已有素材，再只补缺口：\n\n- 主要角色：跨多个片段、会被清楚辨认或需固定服装/武器时，才生成 1＋3 标准资产板：左侧脸部正面特写，右侧全身正视、90° 侧视、背视。\n- 一次性角色、远景群演、背影和不需辨认者，默认只用文字锚点。\n- 道具/武器：只有推动剧情、参与交互、反复特写或跨镜必须一致时才生成。\n- 所有新生成独立资产使用 `中性浅灰 #B8B8B8 左右、纯色、无渐变、无纹理、无环境、无文字、无水印`；允许极轻接触阴影。\n- 用户已有资产只要身份和结构可用即可绑定，不因不是灰底而强制重做。\n- 场景资产默认不生成。没有用户提供的完整剧本时，除非用户明确要求，场景资产数量必须为 0；有完整剧本时也只有反复出现的独特地点、复杂地形打斗或结构连续性多次失败才允许生成。\n- 首帧默认不生成。仅多人精确站位、兵器接触起点、上一镜结尾强继承、特殊构图或直生反复失败时，按阶段 3 已确认的清单生成；不追加第二次路线询问。\n\n## 阶段 6：分镜、打斗、视频生成与检查\n\n图片提示词读取 `references/image-prompts.md`，视频提示词读取 `references/video-prompts.md`，分辨率与交付读取 `references/resolution-delivery.md`，完整表格读取 `references/templates.md`。\n\n有完整剧本时，先输出目标可用时长、模型生成时长和计划取用区间。若模型只有固定档位，先判断内容实际需要，再选择不短于需求的最近档位；禁止为了模型档位把所有片段改成相同 5 秒或 10 秒。\n\n出现打斗、追逐、轻功、兵器交锋或多人冲突时，读取 `references/fight-choreography.md`，先完成叙事目标、文字空间图、轴线、动作节拍和拆镜。单条视频不承担完整连续打斗。\n\n逐镜生成，至少检查：\n\n- 人数、身份、服装、武器和关键道具是否稳定；未使用资产时，文字身份锚是否每条完整重复。\n- 场景文字锚、左右关系、光源、画幅和动作轴线是否连续；不要因为没有场景资产就省略空间描述。\n- 提交给模型的实际原生分辨率是否记录；是否与 720p/1080p 目标、画幅和模型能力相容。\n- 动作是否有触发、起点、终点、重量和可接下一镜的结尾。\n- 是否多手、多剑、穿模、瞬移、漂浮、人物互换或背景无故重构。\n- 胡金铨/邵氏是否出现可见风格证据，而非只有风格名。\n\n不合格时读取 `references/quality-repair.md`，只返修失败变量。只有计划内片段都有实际结果、关键镜头可用且连续性通过，才标记为“可进入剪辑”。\n\n## 阶段 7：字幕确认门\n\n全部视频片段生成并通过基础检查后，必须暂停询问：\n\n> 视频片段已经生成并通过基础检查，现在准备进入剪辑。请选择：\n>\n> 1. 不加字幕\n> 2. 只加对白/旁白字幕\n> 3. 加对白/旁白字幕，并保留少量片名或章回卡\n> 4. 只加片名或章回卡，不加对白字幕\n\n用户未回答前，不输出最终剪辑时间线，不擅自添加或删除字幕。\n\n## 阶段 8：剪辑、声音、调色与字幕\n\n获得字幕选择后，读取 `references/editing-audio-subtitles.md`、`references/resolution-delivery.md`，并读取阶段 0 已选定的 `references/style-classical.md`、`references/style-king-hu.md` 或 `references/style-shaw.md`。输出最终时间线、切点、声音桥、环境声/动作声/BGM 分层、字幕或片名卡、调色、胶片方案与最终导出分辨率。需要超分时，原则上在画面锁定后、添加最终字幕与锐利图形前完成。\n\n胡金铨方向以空间、停顿、短爆发和声音留白为主；邵氏方向以棚景调度、完整身体动作、短促变焦/摇摄和复古锣鼓节拍为主。\n\n## 阶段 9：终审与定向返修\n\n按“剧情事实 → 路线执行 → 身份与关键资产 → 空间连续 → 动作因果 → 风格证据 → 声音字幕 → 美观”终审：\n\n- 是否正确区分完整剧本、简单想法、模糊题材和单镜请求。\n- 是否先盘点已有资产，只补缺口；新独立资产是否统一灰底。\n- 无用户剧本时是否保持场景资产为零；有剧本时是否说明每个场景资产的触发理由。\n- 九宫格是否只用于审核，没有把整张九宫格错误地喂给单条视频。\n- 是否默认直生，并只为阶段 3 已确认的高风险镜头制作首/尾帧。\n- 有剧本时是否按语义拆分并独立判断每条时长。\n- 是否记录生成目标、模型实际原生分辨率和最终导出分辨率；超分交付是否明确标注，未冒充原生 1080p。\n- 视频完成后才询问字幕，字幕选择是否落实到剪辑。\n\n只返修失败的最小单位；错误来自上游资产或风格定标时，先修上游再更新受影响镜头。终审未通过时，不宣告完成。\n\n## 输出状态\n\n每次阶段性输出末尾写：\n\n- 当前阶段：\n- 已锁定：\n- 路线与理由：\n- 待确认/待生成：\n- 下一步：\n\n需要完整案例时读取 `references/examples.md`。", "extras": [], "cn": "古典武侠电影全流程导演"}, {"slug": "idol-mv", "desc": "校园青春滤镜，一键出片女团MV", "body": "# idol-mv\n\n做平成 AKB48 风格青春偶像 MV 时用本 skill。核心气质:**日系胶片质感 + 纪录片手持摄影 + 校园青春叙事 + 女子团体群像感**,以 2009–2014 黄金年代为审美基准。核心基准:所有设计对齐\"平成时代 AKB48 黄金年代青春偶像 MV\"——**不是完美偶像,而是正在发光的普通成员**。\n\n> 本环境适配:Seedance/MultiModalToVideo → `generate_video_v3`;元素图/TextToImage/ImageToImage → `generate_image_v3`;BGM/VO/text_to_instrumental/text_to_narration → `generate_audio`;text_editor → `write_file_v2`;video_assembler → `composite_video`;`<<<image_n>>>`/asset_id 槽位 → `reference_nodes`+`{{NodeKey}}`;里程碑确认 → `ask_human`。**prompt 写法与运镜词汇全部内联本 skill,不外包 image-prompt-director / cinematic-motion-language**。适配点:Seedance wrapper 语法((...)音乐/<...>音效/{...}对白/【...】字幕)按 `generate_video_v3` 提示词能力适配,无对应则改为音效意图描述并注明;refer_type 参数(Kling 3.0 Omni 非会员备用)、会员分支、超分(Jimeng SR/MediaKit)本环境无对应→正当删除、见对账;Midjourney 禁用于一致性一条转为\"探索图不作一致性锚\"方法保留;模型专名按本环境生成面适配改写(非删除)。\n\n## 流程(5 里程碑暂停,不一次跑完;用 `ask_human` 展示 review 清单获明确确认再续)\n\n1. **Final_Video_Spec**(`write_file_v2`):锁定全局参数——画面比例(默认 16:9)、目标时长、输出语言(日语/中文歌词)、视觉风格基调(平成胶片偶像 MV)、色彩系统(夏日青春胶片)。\n2. **分镜**(`storyboard`):先建 key_element(成员角色+核心场景+关键道具),再按固定结构**日常→放学→友情→练习→欢笑→舞台→青春高潮→黄昏收尾**规划 shot 列表,同步 audio_layer(BGM+可选 VO)。\n3. 完成分镜后,**扫描已有用户上传素材**,将匹配资源绑定至对应 Storyboard 槽位,避免重复生成。\n4. **元素形象图**(`generate_image_v3`):生成所有 key_element 形象图(角色参考图**双格:半身+全身**、场景参考图标胶片基调)。\n5. **逐 shot 视频**(`generate_video_v3`):优先以 element 图为视觉参考。\n6. **音频**(`generate_audio`):BGM + 音效/VO 音频层。\n7. **合成**(`composite_video`):时间线剪辑导出成片。\n> 依赖:2→1;3→2;4→2;5→4;6→2;7→4,5,6。**暂停节点 A–E 逐项展示清单与提问话术见** `references/pause-nodes-and-vertical.md`(5 节点全文+竖版专属暂停 V-A/V-B+竖版短时长通用调度)。用户上传素材优先绑定为对应 key_element 资产,不重复生成已有内容。\n\n## 素材分析(`analyze` · 将所有输入解读为\"AKB48 黄金年代青春偶像 MV 素材\")\n\n**基础分析视角**:角色——识别气质分层(center girl 核心能量/shy 害羞/genki 元气/cool beauty 清冷/emotional supporter 感情担当),评估自然妆容程度/青春笑容真实感/服装风格(校服/夏装/舞台服)/群像化学反应;场景——识别青春时空(放学教室/天台/夏日操场/电车站台/河堤/夏祭/便利店门口/黄昏篮球场),分析光线质感(夏日自然光/黄金时刻暖光/教室荧光灯感/潮湿夏日空气感);摄影/影像——识别胶片感(柯达 Gold 200 暖调/富士 Pro 400H 冷柔调/软颗粒/高光溢出/过曝区域/褪色感),评估拍摄方式(手持纪录片感/偷拍式青春视角/自然 vs 商业构图);音频(如有)——BGM 风格(上进 J-Pop/青春吉他/idol 合唱/nostalgic 明亮旋律),环境音(蝉鸣/电车过道/操场欢笑/社团练习声/运动鞋踩地)。**输出重点**:转化为可直接注入 Storyboard 的语言(角色/场景 element 描述、shot 情绪标注、audio_layer 风格指引)。\n\n**上传素材处理三套流程**(照片 identity anchor 四步 / 音频类型判定四步 / 场景 lighting+spatial anchor 五步):全文见 `references/upload-analysis.md`。\n\n## 设计 key_element\n\n**角色 element character**:每位成员须含 气质标签/妆容/发型/服装/标志性动作或表情/禁止事项。若用户提供参照图,角色描述必须与图中所见一致,气质模板仅作格式参照、不覆盖用户上传的真实面部特征。\n- **禁止(所有角色通用)**:高级时装感、欧美超模脸、AI 网红妆、强烈性感化。\n- **允许(所有角色通用)**:稍乱的发丝、不均匀的动作、自然反应、业余魅力。\n- **五大气质类型设计模板**(Center Girl / Genki / Shy / Cool Beauty / Emotional Supporter,各含外貌锚点/服装设计/标志性动作与表情/prompt 气质词四小节):全文见 `references/character-templates.md`。\n\n**场景 element scene**:优先场景池 13 个——放学后的教室、学校天台、夏日操场、河堤、电车站、社团教室、校园走廊、樱花街道、夏祭、海边、东京街头、便利店门口、黄昏篮球场。每场景须描述:光线来源(夏日斜阳/荧光灯/祭典灯笼)、空间细节(黑板上的字/自行车/铁丝网)、环境音暗示。**禁止**:豪华现代建筑、欧美夜店、赛博朋克城市、高端时装秀场。\n- **八大核心场景标准化模板**(教室/天台/操场/河堤/夏祭/电车站台/练习室/走廊,各含光线锚点/空间细节锚点/胶片色调基准/环境音暗示):全文见 `references/scene-templates.md`。实际创作可微调、不必逐字照搬;用户提供真实场景照片时以照片特征为准覆盖对应字段。\n\n**道具 element prop**:常用标志性道具须单独建 element prop 供 shot 直接引用,避免每次重描外观。每道具须含 外观描述(形状/颜色/材质)、使用方式(持握/佩戴/放置)、出现段落建议、禁止搭配写法。\n- **七个道具 element 模板**(发饰/书包/应援棒/线香花火/自行车/笔记本/冰棒):全文见 `references/prop-templates.md`。\n\n## 季节限定变体(触发时对场景池的色调基准/空间细节/环境音做对应替换,其余角色规则与 MV 结构不变)\n\n三变体——🌸 樱花季(春)/🌊 海边(夏末)/🎑 文化祭(秋),各含 触发条件/色调基准替换/场景细节替换/情绪倾向调整/prompt 附加词汇/环境音替换:全文见 `references/seasonal-variants.md`。\n\n## 短片版本结构(30s/60s/3min · 按优先级剪枝而非等比压缩保持叙事完整;八段式完整结构仅用于 3min 以上版本)\n\n- **30s(28–33s)**:保留 3 段——欢笑高潮(段 5,能量顶点不可删,压 2–3 shot 约 8–10s)、舞台表演(段 6,偶像核心,1–2 shot 约 6–8s)、黄昏收尾(段 8,情绪落点,1 shot 约 8–10s);删除日常/放学/友情/练习/青春高潮。节奏:欢笑高潮 shot 压 1.5–2.5s 快切开场;舞台 2–4s 直接承接不做过渡;黄昏留足 8s 唯一留白;BGM 从 chorus 爆发点起、不用 intro/verse。shot 总数 4–6。\n- **60s(55–65s)**:保留 5 段——日常(段 1,压 2–3 shot 约 8–10s,优先空镜+1 角色近景)、友情(段 3,2–3 shot 约 8–10s,正反打对切优先)、欢笑高潮(段 5,3–4 shot)、舞台(段 6,2–3 shot 约 10–12s)、黄昏收尾(段 8,1–2 shot 约 10–12s);删除优先级:练习(段 4)>放学(段 2)>青春高潮(段 7),仍超则日常压至仅 1 空镜(约 3s)。节奏:日常→友情→欢笑三段连续、由慢(3–4s)→中(2–3s)→快(1.5–2.5s)递进;BGM 从 intro 末进 verse、欢笑高潮前踩 chorus 爆发;舞台与 chorus 节拍对位,黄昏在 outro 渐弱完成。shot 总数 10–14。\n- **3min(2:50–3:15)**:用完整八段式,各段 shot 数参考标准模板。段落时长分配参考:日常 20–25s/5–7 shot、放学 15–20s/4–5、友情 20–25s/5–6、练习 20–25s/4–5、欢笑高潮 15–20s/4–6、舞台 25–35s/5–7、青春高潮 20–25s/3–4、黄昏收尾 25–35s/3–4。节奏压缩优先级(超时则):先压练
